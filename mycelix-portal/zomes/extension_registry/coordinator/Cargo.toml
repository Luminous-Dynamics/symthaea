[package]
name = "extension-registry-coordinator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Coordinator zome for the Mycelix extension registry"

[dependencies]
hdk = "=0.6.0"
serde = { version = "1", features = ["derive"] }
extension-registry-integrity = { path = "../integrity" }

[lib]
crate-type = ["cdylib", "rlib"]
