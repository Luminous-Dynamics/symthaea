name: Nutrition Source Registry

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-nutrition-source-registry/**"
      - ".github/workflows/nutrition-source-registry.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main, "stabilize/*"]
    paths:
      - "crates/domains/symthaea-nutrition-source-registry/**"
      - ".github/workflows/nutrition-source-registry.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutrition-source-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --package symthaea-nutrition-source-registry -- --check
      - name: Test
        run: cargo test --package symthaea-nutrition-source-registry
      - name: Clippy
        run: cargo clippy --package symthaea-nutrition-source-registry --all-targets -- -D warnings
