name: SYM-FV-004A Hamming Semantics

on:
  pull_request:
    paths:
      - "formal/lean/hdc/BinaryHVBind.lean"
      - "formal/lean/hdc/HammingSemantics.lean"
      - "docs/formal/sym-fv-004a-hamming-semantics-v1.json"
      - "scripts/validate_sym_fv_004a.py"
      - "crates/core/symthaea-core/src/hdc/binary_hv.rs"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/sym-fv-004a-hamming-semantics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sym-fv-004a-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  hamming-semantics:
    name: Lean abstract Hamming theorem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact Git subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain=v1 --untracked-files=all

      - name: Static contract and hostile controls
        run: python3 scripts/validate_sym_fv_004a.py

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Prove the wrapper propagates Lean failure
        run: |
          set -euo pipefail
          cat > /tmp/sym-fv-004a-known-bad.lean <<'LEAN'
          example : False := by
            trivial
          LEAN
          if nix develop .#formal --command sh -c 'lean /tmp/sym-fv-004a-known-bad.lean > /tmp/sym-fv-004a-known-bad-output.txt 2>&1'; then
            cat /tmp/sym-fv-004a-known-bad-output.txt
            echo "known-bad Lean subject incorrectly returned success" >&2
            exit 1
          fi
          cat /tmp/sym-fv-004a-known-bad-output.txt
          grep -q 'error:' /tmp/sym-fv-004a-known-bad-output.txt

      - name: Typecheck exact parent plus Hamming subject fail-closed
        run: |
          set -euo pipefail
          cat formal/lean/hdc/BinaryHVBind.lean formal/lean/hdc/HammingSemantics.lean \
            > /tmp/sym-fv-004a-combined.lean
          nix develop .#formal --command sh -c '
            set -eu
            lean --version > /tmp/sym-fv-004a-lean-version.txt
            cat /tmp/sym-fv-004a-lean-version.txt
            if ! lean /tmp/sym-fv-004a-combined.lean > /tmp/sym-fv-004a-lean-output.txt 2>&1; then
              cat /tmp/sym-fv-004a-lean-output.txt
              exit 1
            fi
            cat /tmp/sym-fv-004a-lean-output.txt
            if grep -q "sorryAx" /tmp/sym-fv-004a-lean-output.txt; then
              echo "forbidden sorryAx in Lean axiom census" >&2
              exit 1
            fi
            if grep -q "error:" /tmp/sym-fv-004a-lean-output.txt; then
              echo "Lean output contains an error marker despite zero exit" >&2
              exit 1
            fi
          '

      - name: Postflight immutability and receipt
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          receipt = {
              "schema": "symthaea.formal.sym-fv-004a-qualification-receipt.v1",
              "issue": 5717,
              "evidence_class": "AbstractFormalTheorem",
              "result": "LeanTypecheckedAndAxiomClean",
              "head": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "parent_commit": "a4d4506c57902f96b6c260e7e9c56f9fc2e654c3",
              "parent_theorem_blob": git("rev-parse", "HEAD:formal/lean/hdc/BinaryHVBind.lean"),
              "hamming_theorem_blob": git("rev-parse", "HEAD:formal/lean/hdc/HammingSemantics.lean"),
              "production_scalar_blob": git("rev-parse", "HEAD:crates/core/symthaea-core/src/hdc/binary_hv.rs"),
              "lean_version": Path("/tmp/sym-fv-004a-lean-version.txt").read_text().strip(),
              "combined_subject_sha256": sha256("/tmp/sym-fv-004a-combined.lean"),
              "lean_output_sha256": sha256("/tmp/sym-fv-004a-lean-output.txt"),
              "known_bad_output_sha256": sha256("/tmp/sym-fv-004a-known-bad-output.txt"),
              "manifest_sha256": sha256("docs/formal/sym-fv-004a-hamming-semantics-v1.json"),
              "validator_sha256": sha256("scripts/validate_sym_fv_004a.py"),
              "flake_lock_blob": git("rev-parse", "HEAD:flake.lock"),
              "static_contract": "PASS",
              "negative_controls": "PASS",
              "exact_head_checkout": True,
              "known_bad_lean_subject_rejected": True,
              "lean_exit_zero": True,
              "sorryAx_absent": True,
              "lean_error_markers_absent": True,
              "repository_postflight_clean": True,
              "nonclaims": [
                  "not-production-rust-refinement",
                  "not-f32-similarity-proof",
                  "not-simd-proof",
                  "not-aeneas-extraction",
                  "not-compiler-or-native-binary-proof",
                  "not-runtime-authority"
              ]
          }
          Path("/tmp/sym-fv-004a-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Retain proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sym-fv-004a-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/sym-fv-004a-combined.lean
            /tmp/sym-fv-004a-lean-version.txt
            /tmp/sym-fv-004a-lean-output.txt
            /tmp/sym-fv-004a-known-bad-output.txt
            /tmp/sym-fv-004a-receipt.json
          if-no-files-found: error
          retention-days: 30
