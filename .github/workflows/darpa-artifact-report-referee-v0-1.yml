name: DARPA Artifact Report Referee

on:
  push:
    branches:
      - research/darpa-artifact-report-referee-v0-1
    paths:
      - "crates/domains/symthaea-subterranean/research/darpa-artifact-report-referee/**"
      - ".github/workflows/darpa-artifact-report-referee-v0-1.yml"
  pull_request:
    paths:
      - "crates/domains/symthaea-subterranean/research/darpa-artifact-report-referee/**"
      - ".github/workflows/darpa-artifact-report-referee-v0-1.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Exact-head format, tests and strict Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install pinned Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting without mutating source
        run: cargo fmt --manifest-path crates/domains/symthaea-subterranean/research/darpa-artifact-report-referee/Cargo.toml -- --check

      - name: Run offline tests
        run: cargo test --offline --manifest-path crates/domains/symthaea-subterranean/research/darpa-artifact-report-referee/Cargo.toml --all-targets

      - name: Run strict offline Clippy
        run: cargo clippy --offline --manifest-path crates/domains/symthaea-subterranean/research/darpa-artifact-report-referee/Cargo.toml --all-targets -- -D warnings

      - name: Preserve evidence ceiling
        if: always()
        run: echo "PASS applies only to synthetic evaluator contract tests; it is not perception, SLAM, field or safety qualification."
