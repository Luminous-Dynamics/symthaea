name: AIRROAD IQC Clarabel SDP Smoke

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-airroad-iqc/**"
      - "tools/airroad-iqc-clarabel-smoke/**"
      - ".github/workflows/airroad-iqc-clarabel-smoke.yml"
  push:
    branches:
      - research/airroad-iqc-hermitian-core-v0.1
    paths:
      - "crates/domains/symthaea-airroad-iqc/**"
      - "tools/airroad-iqc-clarabel-smoke/**"
      - ".github/workflows/airroad-iqc-clarabel-smoke.yml"

permissions:
  contents: read

concurrency:
  group: airroad-iqc-clarabel-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clarabel-sdp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Fortran compiler for static OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran
      - name: Install stable Rust with required components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve and record exact dependency graph for this run
        run: |
          cargo generate-lockfile --manifest-path tools/airroad-iqc-clarabel-smoke/Cargo.toml
          cargo tree \
            --manifest-path tools/airroad-iqc-clarabel-smoke/Cargo.toml \
            --locked -e normal > "$RUNNER_TEMP/airroad-cargo-tree.txt"
      - name: Run feasible and infeasible analytic SDP tests
        run: |
          cargo test \
            --manifest-path tools/airroad-iqc-clarabel-smoke/Cargo.toml \
            --locked --all-targets
      - name: Run isolated solver-smoke Clippy
        run: |
          cargo clippy \
            --manifest-path tools/airroad-iqc-clarabel-smoke/Cargo.toml \
            --locked --all-targets -- -D warnings
      - name: Upload solver resolution receipt
        uses: actions/upload-artifact@v4
        with:
          name: airroad-iqc-clarabel-resolution
          path: |
            tools/airroad-iqc-clarabel-smoke/Cargo.lock
            ${{ runner.temp }}/airroad-cargo-tree.txt
          if-no-files-found: error
          retention-days: 30

  scs-cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent SCS reference
        run: |
          python -m pip install \
            --requirement tools/airroad-iqc-clarabel-smoke/requirements-scs.txt
      - name: Compile and execute independent SCS checks
        run: |
          python -m py_compile \
            tools/airroad-iqc-clarabel-smoke/verify_scs_cross_check.py
          python \
            tools/airroad-iqc-clarabel-smoke/verify_scs_cross_check.py
      - name: Record Python cross-check dependency resolution
        run: python -m pip freeze > "$RUNNER_TEMP/airroad-scs-requirements-resolved.txt"
      - name: Upload SCS resolution receipt
        uses: actions/upload-artifact@v4
        with:
          name: airroad-iqc-scs-resolution
          path: ${{ runner.temp }}/airroad-scs-requirements-resolved.txt
          if-no-files-found: error
          retention-days: 30
