name: Self-hosted NixOS Runner Smoke

on:
  workflow_dispatch:

# This job uses public unauthenticated Git and does not need GITHUB_TOKEN access.
permissions: {}

env:
  # Keep flake support local to the trusted job instead of widening host Nix
  # configuration merely for CI compatibility.
  NIX_CONFIG: experimental-features = nix-command flakes
  GIT_TERMINAL_PROMPT: "0"

concurrency:
  # Manual smoke runs are deliberate and should not cancel one another.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Validate trusted NixOS CPU runner
    # workflow_dispatch permits choosing a branch/ref. A self-hosted validation
    # host must never execute an arbitrary branch merely because it lives in the
    # canonical repository.
    if: >-
      github.repository == 'Luminous-Dynamics/symthaea' &&
      github.ref == 'refs/heads/main'
    # noDefaultLabels=true on the runner means this unique capability label is
    # the only scheduling label. Generic self-hosted/GPU workflows cannot land
    # on this machine accidentally.
    runs-on: [symthaea-trusted-cpu-v1]
    timeout-minutes: 30

    steps:
      - name: Checkout exact trusted main commit without an Action
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          git init .
          git remote add origin https://github.com/Luminous-Dynamics/symthaea.git
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Report runner and source provenance
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          nix --version
          git --version
          printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
          printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
          printf 'nixpkgs_rev=%s\n' "$(nix eval --raw --expr 'let l = builtins.fromJSON (builtins.readFile ./flake.lock); n = l.nodes.root.inputs.nixpkgs; in (builtins.getAttr n l.nodes).locked.rev')"
          printf 'rust_channel=%s\n' "$(nix eval --raw --expr '(builtins.fromTOML (builtins.readFile ./rust-toolchain.toml)).toolchain.channel')"
          sha256sum flake.lock rust-toolchain.toml

      - name: Evaluate runner trust and routing policy
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link --no-write-lock-file \
            --impure \
            --expr 'let f = builtins.getFlake (toString ./.); pkgs = import f.inputs.nixpkgs { system = builtins.currentSystem; }; in import ./nix/tests/eval-github-actions-runner.nix { inherit pkgs; }'
          nix build --no-link --no-write-lock-file \
            --impure \
            --expr 'let f = builtins.getFlake (toString ./.); pkgs = import f.inputs.nixpkgs { system = builtins.currentSystem; }; in import ./nix/tests/eval-trusted-runner-routing.nix { inherit pkgs; }'

      - name: Verify pinned toolchain and smoke-check psych-bench
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          nix develop --no-write-lock-file \
            --impure \
            --expr 'let f = builtins.getFlake (toString ./.); in import ./nix/ci-rust-shell.nix { nixpkgs = f.inputs.nixpkgs; rust-overlay = f.inputs.rust-overlay; system = builtins.currentSystem; }' \
            --command bash -c '
              set -euo pipefail
              rustc --version
              cargo --version
              rustfmt --version
              cargo clippy --version
              cargo check --locked -p symthaea-psych-bench --lib
            '

      - name: Verify immutability and emit smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          command -v base64 >/dev/null 2>&1
          command -v wc >/dev/null 2>&1
          command -v tr >/dev/null 2>&1
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

          source_tree="$(git rev-parse HEAD^{tree})"
          smoke_workflow_blob="$(git rev-parse HEAD:.github/workflows/self-hosted-runner-smoke.yml)"
          runner_module_blob="$(git rev-parse HEAD:nix/modules/github-actions-runner.nix)"
          routing_policy_blob="$(git rev-parse HEAD:nix/tests/eval-trusted-runner-routing.nix)"
          nixpkgs_rev="$(nix eval --raw --expr 'let l = builtins.fromJSON (builtins.readFile ./flake.lock); n = l.nodes.root.inputs.nixpkgs; in (builtins.getAttr n l.nodes).locked.rev')"
          rust_channel="$(nix eval --raw --expr '(builtins.fromTOML (builtins.readFile ./rust-toolchain.toml)).toolchain.channel')"
          flake_lock_sha256="$(sha256sum flake.lock | awk '{print $1}')"
          rust_toolchain_sha256="$(sha256sum rust-toolchain.toml | awk '{print $1}')"
          host_nix_system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          host_nix_version="$(nix --version | awk '{print $3}')"

          manifest="$RUNNER_TEMP/symthaea-trusted-runner-smoke-v1.txt"
          cat > "$manifest" <<EOF
          schema=symthaea.trusted-runner.smoke.v1
          result=PASS
          github_run_id=$GITHUB_RUN_ID
          github_run_attempt=$GITHUB_RUN_ATTEMPT
          github_repository=$GITHUB_REPOSITORY
          github_event_name=$GITHUB_EVENT_NAME
          github_ref=$GITHUB_REF
          github_sha=$GITHUB_SHA
          source_tree=$source_tree
          runner_name=${RUNNER_NAME:-unknown}
          runner_os=${RUNNER_OS:-unknown}
          runner_arch=${RUNNER_ARCH:-unknown}
          smoke_workflow_blob=$smoke_workflow_blob
          runner_module_blob=$runner_module_blob
          routing_policy_blob=$routing_policy_blob
          nixpkgs_rev=$nixpkgs_rev
          rust_channel=$rust_channel
          host_nix_system=$host_nix_system
          host_nix_version=$host_nix_version
          flake_lock_sha256=$flake_lock_sha256
          rust_toolchain_sha256=$rust_toolchain_sha256
          runner_policy_eval=PASS
          routing_policy_eval=PASS
          minimal_locked_rust_check=PASS
          source_immutability_checked=PASS
          evidence_scope=trusted-cpu-correctness-smoke-only
          EOF

          smoke_sha256="$(sha256sum "$manifest" | awk '{print $1}')"
          smoke_bytes="$(wc -c < "$manifest" | tr -d '[:space:]')"
          smoke_base64="$(base64 < "$manifest" | tr -d '\n')"

          cat "$manifest"
          printf 'smoke_manifest_sha256=%s\n' "$smoke_sha256"
          printf 'smoke_manifest_bytes=%s\n' "$smoke_bytes"
          printf 'smoke_manifest_base64=%s\n' "$smoke_base64"
          printf 'smoke_manifest_path=%s\n' "$manifest"

          {
            echo '## Trusted NixOS CPU runner smoke: PASS'
            echo
            echo "- GitHub run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Main commit: \`$GITHUB_SHA\`"
            echo "- Main tree: \`$source_tree\`"
            echo "- Runner: \`${RUNNER_NAME:-unknown}\` / \`${RUNNER_OS:-unknown}\` / \`${RUNNER_ARCH:-unknown}\`"
            echo "- Smoke manifest SHA-256: \`$smoke_sha256\`"
            echo "- Smoke manifest bytes: \`$smoke_bytes\`"
            echo
            echo 'Exact smoke manifest bytes are emitted in the job log as smoke_manifest_base64 for post-run reconstruction.'
            echo 'Correctness/reproducibility runner-smoke evidence only; no performance or scientific qualification authority.'
          } >> "$GITHUB_STEP_SUMMARY"