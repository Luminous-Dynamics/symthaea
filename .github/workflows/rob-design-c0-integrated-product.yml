name: ROB-DESIGN C0 Integrated Product Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/rob-design-c0-integrated-product.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rob-design-c0-product-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE: symthaea-robot-design
  C0A_SOURCE: 1c5f146eb5c1f381dfe72993cde2ac04b6cf1562
  C0C_SOURCE: c059e028357c3719689a6ec08144db08cbb6b5e8
  C0E_SOURCE: 668dbc0b5f06dc1e818ad286d98def18ae0eb178
  C0D_SOURCE: b8a1ba3d2e818691fd6e5f67dbf2bfe4bc4bf1ad
  CARGO_INCREMENTAL: "0"

jobs:
  exact-head-c0-integrated-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact qualifier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 8
          persist-credentials: false

      - name: Bind exact source train and qualifier topology
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            source_head="${{ github.event.pull_request.base.sha }}"
          else
            source_head="$(git rev-parse HEAD^)"
          fi
          echo "SOURCE_HEAD=$source_head" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git rev-parse HEAD^)" = "$source_head"
          test "$source_head" = "$C0D_SOURCE"
          test "$(git rev-parse "$C0D_SOURCE^")" = "$C0E_SOURCE"
          test "$(git rev-parse "$C0E_SOURCE^")" = "$C0C_SOURCE"
          test "$(git rev-parse "$C0C_SOURCE^")" = "$C0A_SOURCE"
          test -z "$(git status --porcelain=v1)"

          mapfile -t qualifier_actual < <(git diff --name-only "$source_head" HEAD | LC_ALL=C sort)
          qualifier_expected=(".github/workflows/rob-design-c0-integrated-product.yml")
          mapfile -t qualifier_expected < <(printf '%s\n' "${qualifier_expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${qualifier_expected[@]}") <(printf '%s\n' "${qualifier_actual[@]}")

          mapfile -t stack_actual < <(git diff --name-only "$C0A_SOURCE" "$C0D_SOURCE" | LC_ALL=C sort)
          stack_expected=(
            "crates/domains/symthaea-robot-design/src/c0_applicability.rs"
            "crates/domains/symthaea-robot-design/src/c0_enumeration.rs"
            "crates/domains/symthaea-robot-design/src/c0_normalized.rs"
            "crates/domains/symthaea-robot-design/src/lib.rs"
          )
          mapfile -t stack_expected < <(printf '%s\n' "${stack_expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${stack_expected[@]}") <(printf '%s\n' "${stack_actual[@]}")
          git diff --quiet "$C0A_SOURCE" "$C0D_SOURCE" -- \
            Cargo.toml Cargo.lock crates/domains/symthaea-robot-design/Cargo.toml \
            crates/domains/symthaea-robot-design/src/canonical.rs \
            crates/domains/symthaea-robot-design/src/exact_parameters.rs \
            crates/domains/symthaea-robot-design/src/c0_joint_link_coupon.rs

      - name: Bind frozen source/workspace bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Cargo.toml Cargo.lock crates/domains/symthaea-robot-design/Cargo.toml \
            > "$RUNNER_TEMP/workspace-inputs.sha256"
          find crates/domains/symthaea-robot-design -type f -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/c0-product-source.sha256"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.96.0
          rustc --version | grep -F 'rustc 1.96.0'
          cargo --version | grep -F 'cargo 1.96.0'

      - name: Metadata and lock immutability
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rob-design-c0-product-evidence"
          mkdir -p "$evidence_dir"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo metadata --format-version 1 > "$evidence_dir/cargo-metadata.json" 2> "$evidence_dir/cargo-metadata.stderr"
          cmp -s "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock
          cp "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock
          test -z "$(git status --porcelain=v1)"

      - name: Independent 5x5 objective frontier and selection oracle
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rob-design-c0-product-evidence"
          python3 - <<'PY' | tee "$evidence_dir/independent-c0-oracle.txt"
          from fractions import Fraction

          widths = [16,18,20,22,24]
          heights = [48,54,60,66,72]  # tenths of mm
          b0, h0 = 20, 60
          candidates = []
          for b in widths:
              for h in heights:
                  mass = Fraction(b*h, b0*h0)
                  deff = Fraction(b0*h0**3, b*h**3)
                  stress = Fraction(b0*h0**2, b*h**2)
                  shear = Fraction(18*h*h, 5*3000*3000)  # span=300.0 mm in same tenths unit
                  aspect = Fraction(h, b*10)              # h tenths-mm, b mm
                  candidates.append((b,h,mass,deff,stress,shear,aspect))
          assert len(candidates) == 25

          frontier=[]
          for c in candidates:
              dominated=False
              for o in candidates:
                  if o is c: continue
                  no_worse = o[2] <= c[2] and o[3] <= c[3]
                  better = o[2] < c[2] or o[3] < c[3]
                  if no_worse and better:
                      dominated=True; break
              if not dominated: frontier.append((c[0],c[1]))
          expected={(16,48),(16,54),(16,60),(16,66),(16,72),(18,72),(20,72),(22,72),(24,72)}
          assert set(frontier) == expected

          feasible=[]
          for c in candidates:
              applicable = c[5] <= Fraction(1,100) and c[6] <= Fraction(2,1)
              if c[3] <= Fraction(19,20) and c[4] <= 1 and applicable:
                  feasible.append(c)
          feasible.sort(key=lambda c: (c[2], c[3], c[0], c[1]))
          selected=feasible[0]
          assert selected[0:2] == (16,72)
          assert selected[2] == Fraction(24,25)
          assert selected[3] == Fraction(625,864)
          assert selected[4] == Fraction(125,144)
          assert 1000*1000 > 100_000
          print("candidate_count=25")
          print("pareto_count=9")
          print("selected_width_mm=16")
          print("selected_height_tenths_mm=72")
          print("mass=24/25")
          print("deflection=625/864")
          print("stress=125/144")
          print("resource_guard_hostile_count=1000000")
          print("independent_reference=PASS")
          PY

      - name: Prove production source does not import docs oracle
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'ROB_BOOT_C0_ORACLE|docs/robotics/fixtures' \
            crates/domains/symthaea-robot-design/src

      - name: Rustfmt
        run: cargo fmt --check -p "$PACKAGE"

      - name: Locked compile
        run: cargo check -p "$PACKAGE" --all-targets --locked

      - name: Focused tests
        run: cargo test -p "$PACKAGE" --locked -- --nocapture

      - name: Strict Clippy
        run: cargo clippy -p "$PACKAGE" --all-targets --locked -- -D warnings

      - name: Source postflight immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/Cargo.lock.before" ]; then cp "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock; fi
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          sha256sum -c "$RUNNER_TEMP/workspace-inputs.sha256"
          sha256sum -c "$RUNNER_TEMP/c0-product-source.sha256"

      - name: Write evidence receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rob-design-c0-product-evidence"
          mkdir -p "$evidence_dir"
          {
            echo "program=ROB-DESIGN-C0-INTEGRATED"
            echo "authority=pure-design-source-local-qualification"
            echo "parent_c0a_execution_status=IN_FLIGHT"
            echo "c0a_source=$C0A_SOURCE"
            echo "c0c_source=$C0C_SOURCE"
            echo "c0e_source=$C0E_SOURCE"
            echo "c0d_source=$C0D_SOURCE"
            echo "qualifier_sha=$(git rev-parse HEAD)"
            echo "job_status=${{ job.status }}"
            echo "qualification_claim=SOURCE_LOCAL_ONLY_PARENT_C0A_INFLIGHT"
            echo "optimizer_superiority_claim=NONE"
            echo "physical_claim=NONE"
            echo "fabrication_authority=NONE"
          } > "$evidence_dir/receipt.txt"
          cp "$RUNNER_TEMP/workspace-inputs.sha256" "$evidence_dir/" 2>/dev/null || true
          cp "$RUNNER_TEMP/c0-product-source.sha256" "$evidence_dir/" 2>/dev/null || true
          find "$evidence_dir" -type f ! -name sha256sums.txt -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$evidence_dir/sha256sums.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rob-design-c0-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rob-design-c0-product-evidence/
          if-no-files-found: error
          retention-days: 90
