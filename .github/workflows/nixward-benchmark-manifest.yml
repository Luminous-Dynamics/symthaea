name: NixWard benchmark-manifest conformance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/core/nixward/tests/benchmark_manifest.rs"
      - "research/nixward-benchmark-v0.1/**"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/nixward-benchmark-manifest.yml"
  push:
    branches:
      - "research/nixward-benchmark-v0-1-20261128"
    paths:
      - "crates/core/nixward/tests/benchmark_manifest.rs"
      - "research/nixward-benchmark-v0.1/**"
      - ".github/workflows/nixward-benchmark-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixward-benchmark-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-manifest:
    name: benchmark-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check benchmark test formatting
        run: rustfmt +1.96.0 --check --edition 2024 crates/core/nixward/tests/benchmark_manifest.rs
      - name: Validate benchmark manifest contract
        run: cargo +1.96.0 test --locked -p nixward --test benchmark_manifest
