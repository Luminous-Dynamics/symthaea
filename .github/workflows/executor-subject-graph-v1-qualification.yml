name: Executor Subject Graph V1 Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/executor-subject-graph-v1-qualification.yml'
      - 'crates/core/symthaea-executor-subject-graph/**'
      - 'crates/core/symthaea-executor-identity/**'
      - 'crates/core/symthaea-interaction-core/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executor-subject-graph-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  executor-subject-graph-v1:
    name: Exact-head deterministic same-subject graph v1
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact PR head, parent and tranche scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUIRED_PARENT: 9f6eb633f8b6566c07e1f924f478c898c07084f1
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          fi
          git cat-file -e "${REQUIRED_PARENT}^{commit}"
          test "$(git merge-base HEAD "${REQUIRED_PARENT}")" = "${REQUIRED_PARENT}"
          git merge-base --is-ancestor "${REQUIRED_PARENT}" HEAD
          test "$(git rev-list --count "${REQUIRED_PARENT}"..HEAD)" -eq 1

          mapfile -t changed < <(git diff --name-only "${REQUIRED_PARENT}"...HEAD | sort)
          expected=(
            '.github/workflows/executor-subject-graph-v1-qualification.yml'
            'crates/core/symthaea-executor-subject-graph/Cargo.toml'
            'crates/core/symthaea-executor-subject-graph/scripts/subject_graph_oracle.py'
            'crates/core/symthaea-executor-subject-graph/src/lib.rs'
            'crates/core/symthaea-executor-subject-graph/tests/frozen_vectors.rs'
            'crates/core/symthaea-executor-subject-graph/tests/physical_graph.rs'
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'changed:\n%s\n' "${changed[*]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Record clean source baseline
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

      - name: Enforce deterministic non-verifier boundary
        run: |
          set -euo pipefail
          MANIFEST=crates/core/symthaea-executor-subject-graph/Cargo.toml
          SOURCE=crates/core/symthaea-executor-subject-graph/src/lib.rs
          PHYSICAL=crates/core/symthaea-executor-subject-graph/tests/physical_graph.rs

          grep -Fq 'sha2 = { workspace = true }' "${MANIFEST}"
          grep -Fq 'thiserror = { workspace = true }' "${MANIFEST}"
          grep -Fq 'symthaea-executor-identity = { path = "../symthaea-executor-identity" }' "${MANIFEST}"
          grep -Fq 'symthaea-interaction-core = { path = "../symthaea-interaction-core" }' "${MANIFEST}"
          if grep -Eiq 'serde|reqwest|hyper|tokio|holochain|hdk|hdi|xenia|spiffe|spire|rats|eat|tpm|wasmtime|keyring|secret-service|symthaea-authority|symthaea-action' "${MANIFEST}"; then
            echo 'provider/runtime/authority/serialization dependency leaked into deterministic graph crate' >&2
            exit 1
          fi

          grep -Fq 'pub struct SubjectNodeCandidateV1' "${SOURCE}"
          grep -Fq 'pub struct SubjectRelationCandidateV1' "${SOURCE}"
          grep -Fq 'pub struct SubjectGraphRelationPolicyV1' "${SOURCE}"
          grep -Fq 'pub struct SubjectGraphMatchCandidateV1' "${SOURCE}"
          grep -Fq 'pub fn assess_subject_graph_v1' "${SOURCE}"
          grep -Fq 'matching_subject_ids_do_not_create_an_edge' "${SOURCE}"
          grep -Fq 'weak_relation_cannot_satisfy_stronger_policy' "${SOURCE}"
          grep -Fq 'unrelated_extra_node_is_rejected_not_ignored' "${SOURCE}"
          grep -Fq 'DevelopmentObserved' "${SOURCE}"
          grep -Fq 'HardwareAnchoredProcess' "${SOURCE}"
          grep -Fq 'physical_graph_requires_all_three_same_subject_joins' "${PHYSICAL}"
          grep -Fq 'replacing_device_node_invalidates_old_edges' "${PHYSICAL}"

          if grep -Eq '^use .*VerifiedExecutorBinding|^[[:space:]]*VerifiedExecutorBinding[,;}]|->[[:space:]]*VerifiedExecutorBinding' "${SOURCE}"; then
            echo 'deterministic graph crate must not import, accept, return, or mint VerifiedExecutorBinding' >&2
            exit 1
          fi
          if grep -Eq 'pub[[:space:]]+trait[[:space:]].*(Verifier|Provider|Attestation)|pub[[:space:]]+fn[[:space:]]+(verify|mint|compose)_.*binding' "${SOURCE}"; then
            echo 'public verifier/provider minting surface leaked into deterministic graph crate' >&2
            exit 1
          fi
          if grep -Eq '\bSerialize\b|\bDeserialize\b|serde::|std::net::|std::fs::|std::process::|Command::new|SystemTime|Instant::now' "${SOURCE}"; then
            echo 'serialization/runtime I/O/clock leaked into deterministic graph contract' >&2
            exit 1
          fi

      - name: Independent canonical transcript oracle
        run: |
          set -euo pipefail
          python3 crates/core/symthaea-executor-subject-graph/scripts/subject_graph_oracle.py

      - name: Format
        run: |
          set -euo pipefail
          cargo fmt -p symthaea-executor-subject-graph -- --check

      - name: Resolve candidate and execute focused gates
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check -p symthaea-executor-subject-graph --all-targets
          cargo test -p symthaea-executor-subject-graph
          cargo clippy -p symthaea-executor-subject-graph --all-targets -- -D warnings
          if ! cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock requires committed reconciliation on the accepted stacked lineage:' >&2
            diff -u /tmp/Cargo.lock.before Cargo.lock || true
            exit 1
          fi

      - name: Locked replay
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-executor-subject-graph --all-targets
          cargo test --locked -p symthaea-executor-subject-graph
          cargo clippy --locked -p symthaea-executor-subject-graph --all-targets -- -D warnings

      - name: Prove qualification did not mutate source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
