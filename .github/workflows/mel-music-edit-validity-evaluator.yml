name: Melothaea musical edit validity evidence evaluator

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/music_edit_validity_evaluator.rs"
      - "crates/domains/symthaea-muse/src/music_edit_validity_envelope.rs"
      - "crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "tools/mel-music-edit-adapter-harness/**"
      - "benchmarks/mel/schemas/music-edit-validity-observation-bundle-v1.schema.json"
      - "benchmarks/mel/schemas/music-edit-validity-evaluation-v1.schema.json"
      - "benchmarks/mel/registry/synthetic-music-edit-validity-observation-bundle-v1.json"
      - "benchmarks/mel/registry/synthetic-music-edit-validity-envelope-v1.json"
      - "docs/research/MEL_MR_EVAL_038_EVIDENCE_EVALUATOR_V1_2026-11-14.md"
      - ".github/workflows/mel-music-edit-validity-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validity-evidence-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MEL_VALIDITY_EVALUATOR_REVISION=$actual" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Stage isolated evaluator harness with exact production modules
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-music-edit-validity-evaluator"
          mkdir -p "$staged/src" "$staged/examples" "$staged/fixtures"
          cp tools/mel-music-edit-adapter-harness/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-music-edit-adapter-harness/src/lib.rs "$staged/src/lib.rs"
          cp crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs "$staged/src/music_edit_benchmark_adapter.rs"
          cp crates/domains/symthaea-muse/src/music_edit_validity_envelope.rs "$staged/src/music_edit_validity_envelope.rs"
          cp crates/domains/symthaea-muse/src/music_edit_validity_evaluator.rs "$staged/src/music_edit_validity_evaluator.rs"
          cp tools/mel-music-edit-adapter-harness/examples/validate_validity_evaluation.rs "$staged/examples/validate_validity_evaluation.rs"
          cp benchmarks/mel/registry/synthetic-music-edit-validity-envelope-v1.json "$staged/fixtures/"
          cp benchmarks/mel/registry/synthetic-music-edit-validity-observation-bundle-v1.json "$staged/fixtures/"
          echo "MEL_VALIDITY_EVALUATOR_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format and verify exact staged sources
        run: |
          cargo +1.96.0 fmt --manifest-path "$MEL_VALIDITY_EVALUATOR_MANIFEST"
          cargo +1.96.0 fmt --check --manifest-path "$MEL_VALIDITY_EVALUATOR_MANIFEST"
      - name: Resolve standalone dependencies
        run: cargo +1.96.0 generate-lockfile --manifest-path "$MEL_VALIDITY_EVALUATOR_MANIFEST"
      - name: Run deterministic evidence evaluator tests
        run: cargo +1.96.0 test --locked --manifest-path "$MEL_VALIDITY_EVALUATOR_MANIFEST"
      - name: Execute synthetic observation-bundle evaluation
        run: cargo +1.96.0 run --locked --manifest-path "$MEL_VALIDITY_EVALUATOR_MANIFEST" --example validate_validity_evaluation
      - name: Run evaluator Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path "$MEL_VALIDITY_EVALUATOR_MANIFEST" --all-targets -- -D warnings
      - name: Record exact source and fixture identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mel-validity-evaluator-evidence"
          mkdir -p "$evidence"
          sha256sum crates/domains/symthaea-muse/src/music_edit_validity_evaluator.rs > "$evidence/evaluator-module.sha256"
          sha256sum crates/domains/symthaea-muse/src/music_edit_validity_envelope.rs > "$evidence/envelope-module.sha256"
          sha256sum crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs > "$evidence/adapter-module.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-validity-observation-bundle-v1.schema.json > "$evidence/observation-schema.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-validity-evaluation-v1.schema.json > "$evidence/receipt-schema.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-validity-envelope-v1.json > "$evidence/envelope-fixture.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-validity-observation-bundle-v1.json > "$evidence/observation-fixture.sha256"
          printf 'exact_head=%s\n' "$MEL_VALIDITY_EVALUATOR_REVISION" > "$evidence/source-identities.txt"
          cp "$(dirname "$MEL_VALIDITY_EVALUATOR_MANIFEST")/Cargo.lock" "$evidence/Cargo.lock"
          sha256sum "$evidence/Cargo.lock" > "$evidence/Cargo.lock.sha256"
      - name: Upload evaluator evidence
        uses: actions/upload-artifact@v4
        with:
          name: mel-validity-evaluator-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-validity-evaluator-evidence/
          if-no-files-found: error
          retention-days: 90
