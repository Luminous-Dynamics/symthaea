name: POD-Meta Proof Cost-to-Go Lab Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/pod-meta-cost-to-go-qualification.yml"
      - "research/pod-meta-cost-to-go-lab/**"
  push:
    branches:
      - "research/pod-meta-proof-cost-to-go-2026-11-01"
      - "research/pod-meta-online-selection-fcr-2026-11-01"
      - "research/pod-meta-prefix-replay-benchmark-2026-11-01"
      - "research/pod-meta-intervention-replay-2026-11-01"
    paths:
      - ".github/workflows/pod-meta-cost-to-go-qualification.yml"
      - "research/pod-meta-cost-to-go-lab/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install repository Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.96.0 fmt --manifest-path research/pod-meta-cost-to-go-lab/Cargo.toml -- --check
      - name: Tests
        run: cargo +1.96.0 test --locked --manifest-path research/pod-meta-cost-to-go-lab/Cargo.toml
      - name: Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path research/pod-meta-cost-to-go-lab/Cargo.toml --all-targets -- -D warnings
      - name: Emit and qualify deterministic ledger matrix
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --quiet --manifest-path research/pod-meta-cost-to-go-lab/Cargo.toml --bin pod-meta-cost-to-go > cost-to-go-ledger.tsv
          test "$(grep -c '^CASE' cost-to-go-ledger.tsv)" -eq 8
          test "$(grep -c '^SURVIVAL_ROW' cost-to-go-ledger.tsv)" -eq 2
          test "$(grep -c '^FORECAST_JOURNAL_ROW' cost-to-go-ledger.tsv)" -eq 2
          test "$(grep -c '^VECTOR_CONFORMAL_ROW' cost-to-go-ledger.tsv)" -eq 3
          test "$(grep -c '^LANDMARK_IPCW_ROW' cost-to-go-ledger.tsv)" -eq 3
          test "$(grep -c '^SELECTION_CONFORMAL_ROW' cost-to-go-ledger.tsv)" -eq 3
          test "$(grep -c '^ONLINE_FCR_ROW' cost-to-go-ledger.tsv)" -eq 5
          test "$(grep -c '^CAP_DECISION_ROW' cost-to-go-ledger.tsv)" -eq 3
          test "$(grep -c '^PREFIX_REPLAY_ROW' cost-to-go-ledger.tsv)" -eq 5
          test "$(grep -c '^HISTORICAL_BASELINE_ROW' cost-to-go-ledger.tsv)" -eq 4
          test "$(grep -c '^TRAJECTORY_REPLAY_ROW' cost-to-go-ledger.tsv)" -eq 3
          test "$(grep -c '^INTERVENTION_SET_ROW' cost-to-go-ledger.tsv)" -eq 3
          grep '^PREFIX_REPLAY_ROW' cost-to-go-ledger.tsv | awk -F '\t' '$2 == "budget-feasibility" && $3 == 7 && $4 == 4 && $5 == 2 && $6 == 5 && $7 == 1 && $8 == 1 && $9 == 2 && $10 == 1 { found=1 } END { exit !found }'
          grep '^TRAJECTORY_REPLAY_ROW' cost-to-go-ledger.tsv | awk -F '\t' '$2 == "verified-prefixes" && $3 == 3 && $4 == 35 { verified=1 } $2 == "suffix-leakage-negative-control" && $3 == "true" && $4 == "true" && $5 == "true" { suffix=1 } $2 == "terminal-label-isolation" && $3 == "true" && $4 == "true" { terminal=1 } END { exit !(verified && suffix && terminal) }'
          grep '^HISTORICAL_BASELINE_ROW' cost-to-go-ledger.tsv | awk -F '\t' '$2 == "profile-support" && $3 == 3 && $4 == 2 && $5 == 2 { profiles=1 } $2 == "paired-evaluation" && $3 == 7 && $4 == 3 && $5 == 2 && $6 == 5 && $7 == 5.333 && $8 == 1.000 { metrics=1 } $2 == "censored-exceedance" && $3 == 2 && $4 == 2 { censored=1 } $2 == "fallback-usage" && $3 == 5 && $4 == 2 { fallback=1 } END { exit !(profiles && metrics && censored && fallback) }'
          grep '^INTERVENTION_SET_ROW' cost-to-go-ledger.tsv | awk -F '\t' '$2 == "matched-simulation-contrast" && $3 == 2 && $4 == 3 && $5 == 5 && $6 == 1 && $7 == "true" { contrast=1 } $2 == "pre-state-negative-control" && $3 == "true" { negative=1 } $2 == "pareto-frontier" && $3 == 3 && $4 == 2 && $5 == 2 && $6 == 3 && $7 == "true" { pareto=1 } END { exit !(contrast && negative && pareto) }'
          if grep '^CASE' cost-to-go-ledger.tsv | awk -F '\t' '$7 != 0 { if ($2 == "hard-cap-overrun-visible") { intentional++ } else { bad=1 } } END { if (intentional != 1) bad=1; exit bad }'; then
            echo "Exactly one deliberate hard-cap negative control recorded a cap violation; all other cases remained within limits."
          else
            echo "Unexpected hard-budget violation." >&2
            exit 1
          fi
          sha256sum cost-to-go-ledger.tsv
          wc -l cost-to-go-ledger.tsv
