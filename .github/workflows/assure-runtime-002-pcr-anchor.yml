name: ASSURE-RUNTIME-002 PCR Anchor Qualification V4

on:
  pull_request:
    paths:
      - '.github/workflows/assure-runtime-002-pcr-anchor.yml'
      - '.github/qualification/assure-runtime-002-pcr-anchor-qualify.sh'
      - 'crates/bridges/symthaea-assurance-linux-tpm-ima-pcr-anchor/**'

permissions:
  contents: read

concurrency:
  group: assure-runtime-002-pcr-anchor-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FROZEN_BASE: 29eb017a2e5b3fda7731ec946439c3096b51cceb
  PREREQ_FORMATTER_PRODUCT: 9155351a868a91317ccc528568a4954382ea4511
  PREREQ_PRODUCT_HEAD: 6de8ddb67b491c30e2147728d2db52f39e7bdf9b
  PREREQ_QUALIFICATION_SUBJECT: 3ba451ca6d729b54a57039ae8da9a11be9eb5cc2
  PREREQ_QUALIFICATION_RUN: '35278765953'
  PREREQ_QUALIFICATION_ARTIFACT: '10522817769'
  PREREQ_QUALIFICATION_ARTIFACT_DIGEST: sha256:431d3b72ba0ddd6b1c5077ac23c3387082df3d971b1641456c4a0f910978ceed
  PRODUCT_HEAD: 4213f13aa120963f437d03bebcba13d2fc89485c
  PRODUCT_PARENT: 6de8ddb67b491c30e2147728d2db52f39e7bdf9b
  CONTRACT_BLOB: 080f33b6b6ee9517a49755ba1aa3d6cc88fcb927
  LOCK_AUDIT_BLOB: ba585e3b28bea1dfec3517f5bfafa87329251321
  METADATA_AUDIT_BLOB: de582596b6f1bcc1208268d2a49d6bac6deecb47

jobs:
  qualify:
    name: Exact-head TPM+IMA PCR anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.96.0
          rustc --version --verbose
          cargo --version

      - name: Prove exact qualification subject and ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          expected_base='${{ github.event.pull_request.base.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test "$expected_base" = "$FROZEN_BASE"

          # Exact qualified-prerequisite lineage.
          test "$PRODUCT_PARENT" = "$PREREQ_PRODUCT_HEAD"
          test "$(git rev-parse "$PREREQ_PRODUCT_HEAD^")" = "$PREREQ_FORMATTER_PRODUCT"
          test "$(git rev-parse "$PREREQ_FORMATTER_PRODUCT^")" = "$FROZEN_BASE"
          test "$(git rev-list --count "$FROZEN_BASE".."$PREREQ_PRODUCT_HEAD")" = "2"

          # Product is exactly one ordinary commit above the qualified prerequisite product.
          test "$(git rev-parse "$PRODUCT_HEAD^")" = "$PRODUCT_PARENT"
          test "$(git rev-list --count "$PRODUCT_PARENT".."$PRODUCT_HEAD")" = "1"
          test "$(git rev-list --parents -n 1 "$PRODUCT_HEAD" | awk '{print NF}')" = "2"

          # Qualification is exactly one ordinary plumbing commit above the product.
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          test "$(git rev-list --count "$PRODUCT_HEAD"..HEAD)" = "1"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" = "2"

          # Qualification components are exact content-addressed objects.
          test "$(git rev-parse "HEAD:.github/qualification/assure-runtime-002-pcr-anchor-qualify.sh")" = "$CONTRACT_BLOB"
          test "$(git rev-parse "HEAD:.github/qualification/assure-runtime-002-pcr-anchor-lock-audit.py")" = "$LOCK_AUDIT_BLOB"
          test "$(git rev-parse "HEAD:.github/qualification/assure-runtime-002-pcr-anchor-metadata-audit.py")" = "$METADATA_AUDIT_BLOB"

          {
            echo 'qualification_revision=assure-runtime-002-pcr-anchor-v4'
            echo "repository=$GITHUB_REPOSITORY"
            echo "pull_request=${{ github.event.pull_request.number }}"
            echo "subject_sha=$actual"
            echo "subject_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "pr_base_sha=$expected_base"
            echo "frozen_base=$FROZEN_BASE"
            echo "prereq_formatter_product=$PREREQ_FORMATTER_PRODUCT"
            echo "prereq_product_head=$PREREQ_PRODUCT_HEAD"
            echo "prereq_qualification_subject=$PREREQ_QUALIFICATION_SUBJECT"
            echo "prereq_qualification_run=$PREREQ_QUALIFICATION_RUN"
            echo "prereq_qualification_artifact=$PREREQ_QUALIFICATION_ARTIFACT"
            echo "prereq_qualification_artifact_digest=$PREREQ_QUALIFICATION_ARTIFACT_DIGEST"
            echo "product_head=$PRODUCT_HEAD"
            echo "product_tree=$(git rev-parse "$PRODUCT_HEAD^{tree}")"
            echo "product_parent=$PRODUCT_PARENT"
            echo "product_crate_tree=$(git rev-parse "$PRODUCT_HEAD:crates/bridges/symthaea-assurance-linux-tpm-ima-pcr-anchor")"
            echo "contract_blob=$CONTRACT_BLOB"
            echo "lock_audit_blob=$LOCK_AUDIT_BLOB"
            echo "metadata_audit_blob=$METADATA_AUDIT_BLOB"
            echo "source_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "workflow_sha256=$(sha256sum .github/workflows/assure-runtime-002-pcr-anchor.yml | awk '{print $1}')"
            echo "contract_sha256=$(sha256sum .github/qualification/assure-runtime-002-pcr-anchor-qualify.sh | awk '{print $1}')"
            echo 'checkout_action=11d5960a326750d5838078e36cf38b85af677262'
            echo 'upload_artifact_action=ea165f8d65b6e75b540449e92b4886f43607fa02'
            echo 'runner_image=ubuntu-24.04'
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo 'authority=QualificationPending'
            echo 'qualification_state_before_execution=NOT_ESTABLISHED'
          } > "$RUNNER_TEMP/assure-runtime-002-pcr-anchor-receipt.txt"

          git rev-parse HEAD > "$RUNNER_TEMP/pre-head"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/pre-tree"
          sha256sum Cargo.lock | awk '{print $1}' > "$RUNNER_TEMP/pre-lock"

      - name: Prove exact product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status "$PRODUCT_PARENT" "$PRODUCT_HEAD" \
            > "$RUNNER_TEMP/product-delta.txt"
          cat "$RUNNER_TEMP/product-delta.txt"
          python3 - "$RUNNER_TEMP/product-delta.txt" <<'PY'
          import pathlib
          import sys

          expected = {
              ('A', 'crates/bridges/symthaea-assurance-linux-tpm-ima-pcr-anchor/Cargo.toml'),
              ('A', 'crates/bridges/symthaea-assurance-linux-tpm-ima-pcr-anchor/README.md'),
              ('A', 'crates/bridges/symthaea-assurance-linux-tpm-ima-pcr-anchor/src/lib.rs'),
              ('A', 'crates/bridges/symthaea-assurance-linux-tpm-ima-pcr-anchor/tests/end_to_end.rs'),
          }
          actual = set()
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              fields = line.split('\t')
              if len(fields) != 2:
                  raise SystemExit(f'unexpected product-delta row: {line!r}')
              actual.add((fields[0], fields[1]))
          if actual != expected:
              raise SystemExit(
                  f'product delta mismatch: missing={sorted(expected-actual)!r} '
                  f'extra={sorted(actual-expected)!r}'
              )
          print('product_delta=PASS files=4')
          PY

      - name: Prove qualification commit is plumbing-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status "$PRODUCT_HEAD" HEAD \
            > "$RUNNER_TEMP/qualification-delta.txt"
          cat "$RUNNER_TEMP/qualification-delta.txt"
          python3 - "$RUNNER_TEMP/qualification-delta.txt" <<'PY'
          import pathlib
          import sys

          expected = {
              ('A', '.github/qualification/assure-runtime-002-pcr-anchor-qualify.sh'),
              ('A', '.github/qualification/assure-runtime-002-pcr-anchor-lock-audit.py'),
              ('A', '.github/qualification/assure-runtime-002-pcr-anchor-metadata-audit.py'),
              ('A', '.github/workflows/assure-runtime-002-pcr-anchor.yml'),
          }
          actual = set()
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              fields = line.split('\t')
              if len(fields) != 2:
                  raise SystemExit(f'unexpected qualification-delta row: {line!r}')
              actual.add((fields[0], fields[1]))
          if actual != expected:
              raise SystemExit(
                  f'qualification delta mismatch: missing={sorted(expected-actual)!r} '
                  f'extra={sorted(actual-expected)!r}'
              )
          print('qualification_delta=PASS files=2')
          PY

      - name: Execute pinned qualification contract
        shell: bash
        run: |
          set -euo pipefail
          bash .github/qualification/assure-runtime-002-pcr-anchor-qualify.sh \
            2>&1 | tee "$RUNNER_TEMP/assure-runtime-002-pcr-anchor-contract.log"

      - name: Prove checkout, lock, and contract authority unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/pre-head")"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$RUNNER_TEMP/pre-tree")"
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/pre-lock")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          work="$RUNNER_TEMP/assure-runtime-002-pcr-anchor"
          for file in \
            capsule-closure.tsv \
            capsule-source-census.tsv \
            capsule-manifest-projection.tsv \
            capsule-lock-audit.json \
            capsule-metadata-audit.json \
            cargo-metadata.offline.json \
            Cargo.lock.source \
            Cargo.lock.capsule \
            Cargo.toml.capsule \
            offline-check.log \
            test-list.txt \
            offline-tests.log \
            offline-clippy.log; do
            test -f "$work/$file"
          done

          grep -Fx 'contract_result=PASS' "$RUNNER_TEMP/assure-runtime-002-pcr-anchor-contract.log"
          grep -Fx 'qualification_result=PENDING_POSTFLIGHT' "$RUNNER_TEMP/assure-runtime-002-pcr-anchor-contract.log"
          grep -Fx 'authority=ContractPassedPendingPostflight' "$RUNNER_TEMP/assure-runtime-002-pcr-anchor-contract.log"

          {
            echo "capsule_closure_sha256=$(sha256sum "$work/capsule-closure.tsv" | awk '{print $1}')"
            echo "capsule_source_census_sha256=$(sha256sum "$work/capsule-source-census.tsv" | awk '{print $1}')"
            echo "capsule_manifest_projection_sha256=$(sha256sum "$work/capsule-manifest-projection.tsv" | awk '{print $1}')"
            echo "capsule_lock_sha256=$(sha256sum "$work/Cargo.lock.capsule" | awk '{print $1}')"
            echo "capsule_lock_audit_sha256=$(sha256sum "$work/capsule-lock-audit.json" | awk '{print $1}')"
            echo "capsule_metadata_sha256=$(sha256sum "$work/cargo-metadata.offline.json" | awk '{print $1}')"
            echo "capsule_metadata_audit_sha256=$(sha256sum "$work/capsule-metadata-audit.json" | awk '{print $1}')"
            echo "capsule_manifest_sha256=$(sha256sum "$work/Cargo.toml.capsule" | awk '{print $1}')"
            echo "test_list_sha256=$(sha256sum "$work/test-list.txt" | awk '{print $1}')"
            echo "test_log_sha256=$(sha256sum "$work/offline-tests.log" | awk '{print $1}')"
            echo "clippy_log_sha256=$(sha256sum "$work/offline-clippy.log" | awk '{print $1}')"
            echo 'postflight_immutable=PASS'
            echo 'qualification_result=PASS'
            echo 'authority=QualifiedExactHead'
          } >> "$RUNNER_TEMP/assure-runtime-002-pcr-anchor-receipt.txt"

      - name: Upload exact-head qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assure-runtime-002-pcr-anchor-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor-receipt.txt
            ${{ runner.temp }}/product-delta.txt
            ${{ runner.temp }}/qualification-delta.txt
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor-contract.log
            ${{ runner.temp }}/pre-head
            ${{ runner.temp }}/pre-tree
            ${{ runner.temp }}/pre-lock
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/capsule-closure.tsv
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/capsule-source-census.tsv
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/capsule-manifest-projection.tsv
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/capsule-lock-audit.json
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/capsule-metadata-audit.json
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/cargo-metadata.offline.json
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/Cargo.lock.source
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/Cargo.lock.capsule
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/Cargo.lock.capsule.diff
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/Cargo.toml.capsule
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/offline-check.log
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/test-list.txt
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/offline-tests.log
            ${{ runner.temp }}/assure-runtime-002-pcr-anchor/offline-clippy.log
            .github/workflows/assure-runtime-002-pcr-anchor.yml
            .github/qualification/assure-runtime-002-pcr-anchor-qualify.sh
            .github/qualification/assure-runtime-002-pcr-anchor-lock-audit.py
            .github/qualification/assure-runtime-002-pcr-anchor-metadata-audit.py
          if-no-files-found: ignore
          retention-days: 90
