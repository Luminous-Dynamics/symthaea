  qualification_firewall:
    name: Validate sanitized QualificationOnly boundary
    needs: qualification_assembly
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ env.EXPECTED_HEAD }}", fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: "rel-005a-sanitized-qualification-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/sanitized"}
      - name: Enforce strict QualificationInputFirewallOnly
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rel/rel-005a-qualification-input-firewall.py --contract .github/rel/rel-005a-qualification-input-firewall-contract.json --bundle "${RUNNER_TEMP}/sanitized" > "${RUNNER_TEMP}/qualification-input-firewall-receipt.json"

  qualification:
    name: Qualify from sanitized authority receipts only
    needs: qualification_firewall
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ env.EXPECTED_HEAD }}", fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: "rel-005a-sanitized-qualification-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/sanitized"}
      - name: Revalidate, qualify, and postvalidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rel/rel-005a-qualification-input-firewall.py --contract .github/rel/rel-005a-qualification-input-firewall-contract.json --bundle "${RUNNER_TEMP}/sanitized" >/dev/null
          python3 .github/rel/rel-005a-qualification-only.py --contract .github/rel/rel-005a-qualification-only-contract.json --predicate-receipt "${RUNNER_TEMP}/sanitized/predicate-contract-receipt.json" --execution-receipt "${RUNNER_TEMP}/sanitized/execution-v3-receipt.json" --seal "${RUNNER_TEMP}/sanitized/observation-seal-v3.json" --comparison "${RUNNER_TEMP}/sanitized/comparison-only-qualification-receipt.json" --output "${RUNNER_TEMP}/qualification-only.json"
          python3 .github/rel/rel-005a-qualification-input-firewall.py --contract .github/rel/rel-005a-qualification-input-firewall-contract.json --bundle "${RUNNER_TEMP}/sanitized" --qualification-output "${RUNNER_TEMP}/qualification-only.json" > "${RUNNER_TEMP}/post-qualification-firewall-receipt.json"
      - name: Build outcome-neutral deterministic qualification capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/capsule-input"; cp "${RUNNER_TEMP}/sanitized/"*.json "${RUNNER_TEMP}/capsule-input/"; cp "${RUNNER_TEMP}/qualification-only.json" "${RUNNER_TEMP}/capsule-input/qualification-only.json"; python3 .github/rel/rel-005a-qualification-capsule.py --input-dir "${RUNNER_TEMP}/capsule-input" --output "${RUNNER_TEMP}/${CAPSULE_NAME}" > "${RUNNER_TEMP}/attestation-input-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "rel-005a-qualification-evidence-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/capsule-input/*", retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "rel-005a-qualification-capsule-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/rel-005a-qualification-capsule.tar", retention-days: 90, if-no-files-found: error}

  attestation:
    name: Attest qualification capsule provenance only
    needs: qualification
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: "rel-005a-qualification-capsule-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/capsule"}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: {subject-path: "${{ runner.temp }}/capsule/rel-005a-qualification-capsule.tar"}
