name: REL-005A Qualification Pipeline V2

on:
  pull_request:
    paths:
      - ".github/rel/rel-005a-qualification-pipeline-source.json"
      - ".github/rel/rel-005a-authority-receipt-extract.py"
      - ".github/rel/rel-005a-qualification-assemble.py"
      - ".github/workflows/rel-005a-qualification-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rel-005a-qualification-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 2c81facb5b5ffb4e66428871b806f68622c9c188
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPARISON_HEAD: a47efccf80fa66bacbdfa9930f59c8439be7ee38
  COMPARISON_RUN_ID: "35349750595"
  COMPARISON_WORKFLOW: REL-005A ComparisonOnly V3 R2
  COMPARISON_JOB: Adjudicate content-addressed sealed REL-005A v3 observation
  COMPARISON_ARTIFACT_NAME: rel-005a-comparison-v3-a47efccf80fa66bacbdfa9930f59c8439be7ee38
  PROJECTION_HEAD: 07af7c4bdfdda377aa8175efe7a3233ce90e889e
  PROJECTION_RUN_ID: "35324485955"
  PROJECTION_WORKFLOW: REL-005A Qualification Projection Contract
  PROJECTION_JOB: Verify EvidenceProjectionOnly contract
  PROJECTION_ARTIFACT_NAME: rel-005a-qualification-projection-contract-07af7c4bdfdda377aa8175efe7a3233ce90e889e
  PREDICATE_HEAD: 43bf1d588447f602ce0f1549986bb558a839762c
  PREDICATE_RUN_ID: "35278498517"
  PREDICATE_ARTIFACT_NAME: rel-005a-full-predicate-contract-43bf1d588447f602ce0f1549986bb558a839762c
  SEAL_HEAD: 0a94ed976926fbdcd6b752f94e174df21f915fc8
  SEAL_RUN_ID: "35284772522"
  SEAL_JOB_ID: "105414583527"
  SEAL_ARTIFACT_NAME: rel-005a-observation-seal-v3-6931639e53060809f9d459196a329c4fe983be7b
  SEAL_CHAIN_SHA256: a3a288caa9221ec5859b5ac81fcc55f61b4ff43d5e52ad096021c99ea6bf31ab
  ASSEMBLY_HEAD: 3dc01663ff8b2f9f6eb0568f8649ccdd999ddf29
  PROJECTION_EVALUATOR_BLOB: 7dfbd35ab39dd8355aa417b2b3269fa388f3fb6f
  FIREWALL_EVALUATOR_BLOB: 14c8473d1744f77acca19cff14d643ef6f3e7b67
  QUALIFICATION_EVALUATOR_BLOB: 60663a6e797008669d75712e67acba9e3151a825
  CAPSULE_BUILDER_BLOB: 6a4bfbc29926be0a2efa0b7443cbdd476dbb4c2e
  EXTRACTOR_BLOB: 70b94a183b79764ee8a83320776588773e2a4bab
  ASSEMBLER_BLOB: 34406caf7c98bc9de28953f7727b3c059c5af473
  PIPELINE_SOURCE_BLOB: 4d1e339378b607b6a2cf5093d761db17d00a5b1f
  CAPSULE_NAME: rel-005a-qualification-capsule.tar

jobs:
  authority_receipt_extraction:
    name: Extract authority receipts from sealed source bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      predicate_artifact_id: ${{ steps.source_meta.outputs.predicate_artifact_id }}
      predicate_artifact_digest: ${{ steps.source_meta.outputs.predicate_artifact_digest }}
      seal_artifact_id: ${{ steps.source_meta.outputs.seal_artifact_id }}
      seal_artifact_digest: ${{ steps.source_meta.outputs.seal_artifact_digest }}
      predicate_receipt_sha256: ${{ steps.extract.outputs.predicate_receipt_sha256 }}
      execution_receipt_sha256: ${{ steps.extract.outputs.execution_receipt_sha256 }}
      seal_receipt_sha256: ${{ steps.extract.outputs.seal_receipt_sha256 }}
      extraction_receipt_sha256: ${{ steps.extract.outputs.extraction_receipt_sha256 }}
    steps:
      - name: Checkout exact pipeline subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ env.EXPECTED_HEAD }}", fetch-depth: 0}
      - name: Bind exact parent, code blobs, and four-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-pipeline-source.json)" = "${PIPELINE_SOURCE_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-authority-receipt-extract.py)" = "${EXTRACTOR_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-assemble.py)" = "${ASSEMBLER_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-projection.py)" = "${PROJECTION_EVALUATOR_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-input-firewall.py)" = "${FIREWALL_EVALUATOR_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-only.py)" = "${QUALIFICATION_EVALUATOR_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-capsule.py)" = "${CAPSULE_BUILDER_BLOB}"
          mapfile -t changed < <(git diff --name-only "${EXPECTED_PARENT}" HEAD | sort)
          expected=(".github/rel/rel-005a-authority-receipt-extract.py" ".github/rel/rel-005a-qualification-assemble.py" ".github/rel/rel-005a-qualification-pipeline-source.json" ".github/workflows/rel-005a-qualification-pipeline.yml")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort); test "${changed[*]}" = "${expected_sorted[*]}"
      - name: Resolve predicate and seal transport identities
        id: source_meta
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"; auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${auth[@]}" "${api}/actions/runs/${PREDICATE_RUN_ID}" > "${RUNNER_TEMP}/predicate-run.json"; curl -fsSL "${auth[@]}" "${api}/actions/runs/${PREDICATE_RUN_ID}/artifacts?per_page=100" > "${RUNNER_TEMP}/predicate-artifacts.json"; curl -fsSL "${auth[@]}" "${api}/actions/runs/${SEAL_RUN_ID}" > "${RUNNER_TEMP}/seal-run.json"; curl -fsSL "${auth[@]}" "${api}/actions/runs/${SEAL_RUN_ID}/jobs?per_page=100" > "${RUNNER_TEMP}/seal-jobs.json"; curl -fsSL "${auth[@]}" "${api}/actions/runs/${SEAL_RUN_ID}/artifacts?per_page=100" > "${RUNNER_TEMP}/seal-artifacts.json"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); pr=json.loads((root/'predicate-run.json').read_text()); sr=json.loads((root/'seal-run.json').read_text()); assert pr['id']==int(os.environ['PREDICATE_RUN_ID']) and pr['head_sha']==os.environ['PREDICATE_HEAD'] and pr['status']=='completed' and pr['conclusion']=='success'; assert sr['id']==int(os.environ['SEAL_RUN_ID']) and sr['head_sha']==os.environ['SEAL_HEAD'] and sr['status']=='completed' and sr['conclusion']=='success'; jobs=json.loads((root/'seal-jobs.json').read_text())['jobs']; selected=[j for j in jobs if j['id']==int(os.environ['SEAL_JOB_ID'])]; assert len(selected)==1 and selected[0]['conclusion']=='success'
          def resolve(path,name,run_id,head):
              x=json.loads(path.read_text()); assert x['total_count']<=100; found=[a for a in x['artifacts'] if a['name']==name and a['expired'] is False]; assert len(found)==1; a=found[0]; assert a['workflow_run']['id']==run_id and a['workflow_run']['head_sha']==head and a['digest'].startswith('sha256:'); return a
          pa=resolve(root/'predicate-artifacts.json',os.environ['PREDICATE_ARTIFACT_NAME'],int(os.environ['PREDICATE_RUN_ID']),os.environ['PREDICATE_HEAD']); sa=resolve(root/'seal-artifacts.json',os.environ['SEAL_ARTIFACT_NAME'],int(os.environ['SEAL_RUN_ID']),os.environ['SEAL_HEAD'])
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"predicate_artifact_id={pa['id']}\npredicate_artifact_digest={pa['digest']}\nseal_artifact_id={sa['id']}\nseal_artifact_digest={sa['digest']}\n")
          PY
      - name: Download and verify source transport ZIPs
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}", PREDICATE_ARTIFACT_ID: "${{ steps.source_meta.outputs.predicate_artifact_id }}", PREDICATE_ARTIFACT_DIGEST: "${{ steps.source_meta.outputs.predicate_artifact_digest }}", SEAL_ARTIFACT_ID: "${{ steps.source_meta.outputs.seal_artifact_id }}", SEAL_ARTIFACT_DIGEST: "${{ steps.source_meta.outputs.seal_artifact_digest }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"; auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28"); mkdir -p "${RUNNER_TEMP}/predicate-source" "${RUNNER_TEMP}/seal-source"; curl -fsSL -L "${auth[@]}" "${api}/actions/artifacts/${PREDICATE_ARTIFACT_ID}/zip" -o "${RUNNER_TEMP}/predicate.zip"; curl -fsSL -L "${auth[@]}" "${api}/actions/artifacts/${SEAL_ARTIFACT_ID}/zip" -o "${RUNNER_TEMP}/seal.zip"; test "$(sha256sum "${RUNNER_TEMP}/predicate.zip"|cut -d' ' -f1)" = "${PREDICATE_ARTIFACT_DIGEST#sha256:}"; test "$(sha256sum "${RUNNER_TEMP}/seal.zip"|cut -d' ' -f1)" = "${SEAL_ARTIFACT_DIGEST#sha256:}"; unzip -q "${RUNNER_TEMP}/predicate.zip" -d "${RUNNER_TEMP}/predicate-source"; unzip -q "${RUNNER_TEMP}/seal.zip" -d "${RUNNER_TEMP}/seal-source"
      - name: Verify commitments and extract only authority receipts
        id: extract
        shell: bash
        env: {EXTRACTION_RECEIPT: "${{ runner.temp }}/authority-receipt-extraction.json"}
        run: |
          set -euo pipefail
          python3 .github/rel/rel-005a-authority-receipt-extract.py --source .github/rel/rel-005a-qualification-pipeline-source.json --predicate-root "${RUNNER_TEMP}/predicate-source" --seal-root "${RUNNER_TEMP}/seal-source" --output-dir "${RUNNER_TEMP}/authority-receipts" | tee "${EXTRACTION_RECEIPT}"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          path=pathlib.Path(os.environ['EXTRACTION_RECEIPT']); r=json.loads(path.read_text()); assert r['authority']=='AuthorityReceiptExtractionOnly' and r['raw_observation_output'] is False and r['execution_logs_output'] is False and r['scientific_observation_fields_parsed'] is False
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"predicate_receipt_sha256={r['predicate_receipt_sha256']}\nexecution_receipt_sha256={r['execution_receipt_sha256']}\nseal_receipt_sha256={r['seal_receipt_sha256']}\nextraction_receipt_sha256={hashlib.sha256(path.read_bytes()).hexdigest()}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "rel-005a-authority-receipts-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/authority-receipts/*", retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "rel-005a-authority-extraction-audit-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/authority-receipt-extraction.json", retention-days: 90, if-no-files-found: error}

  evidence_projection:
    name: Project detailed comparison into metric-free evidence
    needs: authority_receipt_extraction
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      comparison_source_job_id: ${{ steps.upstream_meta.outputs.comparison_source_job_id }}
      comparison_artifact_id: ${{ steps.upstream_meta.outputs.comparison_artifact_id }}
      comparison_artifact_digest: ${{ steps.upstream_meta.outputs.comparison_artifact_digest }}
      projection_contract_source_job_id: ${{ steps.upstream_meta.outputs.projection_contract_source_job_id }}
      projection_contract_artifact_id: ${{ steps.upstream_meta.outputs.projection_contract_artifact_id }}
      projection_contract_artifact_digest: ${{ steps.upstream_meta.outputs.projection_contract_artifact_digest }}
      projection_contract_receipt_sha256: ${{ steps.project.outputs.projection_contract_receipt_sha256 }}
      full_comparison_sha256: ${{ steps.project.outputs.full_comparison_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ env.EXPECTED_HEAD }}", fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: "rel-005a-authority-receipts-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/authority-receipts"}
      - name: Resolve formal comparison and projection-contract evidence
        id: upstream_meta
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"; auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for label in comparison projection; do if [ "$label" = comparison ]; then run="${COMPARISON_RUN_ID}"; else run="${PROJECTION_RUN_ID}"; fi; curl -fsSL "${auth[@]}" "${api}/actions/runs/${run}" > "${RUNNER_TEMP}/${label}-run.json"; curl -fsSL "${auth[@]}" "${api}/actions/runs/${run}/jobs?per_page=100" > "${RUNNER_TEMP}/${label}-jobs.json"; curl -fsSL "${auth[@]}" "${api}/actions/runs/${run}/artifacts?per_page=100" > "${RUNNER_TEMP}/${label}-artifacts.json"; done
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          def resolve(label,run_id,head,workflow,job,artifact):
              r=json.loads((root/f'{label}-run.json').read_text()); assert r['id']==run_id and r['head_sha']==head and r['name']==workflow and r['status']=='completed' and r['conclusion']=='success'; js=json.loads((root/f'{label}-jobs.json').read_text())['jobs']; jj=[x for x in js if x['name']==job]; assert len(jj)==1 and jj[0]['conclusion']=='success'; x=json.loads((root/f'{label}-artifacts.json').read_text()); assert x['total_count']<=100; aa=[a for a in x['artifacts'] if a['name']==artifact and a['expired'] is False]; assert len(aa)==1; a=aa[0]; assert a['workflow_run']['id']==run_id and a['workflow_run']['head_sha']==head and a['digest'].startswith('sha256:'); return jj[0]['id'],a
          cj,ca=resolve('comparison',int(os.environ['COMPARISON_RUN_ID']),os.environ['COMPARISON_HEAD'],os.environ['COMPARISON_WORKFLOW'],os.environ['COMPARISON_JOB'],os.environ['COMPARISON_ARTIFACT_NAME']); pj,pa=resolve('projection',int(os.environ['PROJECTION_RUN_ID']),os.environ['PROJECTION_HEAD'],os.environ['PROJECTION_WORKFLOW'],os.environ['PROJECTION_JOB'],os.environ['PROJECTION_ARTIFACT_NAME'])
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"comparison_source_job_id={cj}\ncomparison_artifact_id={ca['id']}\ncomparison_artifact_digest={ca['digest']}\nprojection_contract_source_job_id={pj}\nprojection_contract_artifact_id={pa['id']}\nprojection_contract_artifact_digest={pa['digest']}\n")
          PY
      - name: Download and verify upstream ZIPs
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}", COMPARISON_ARTIFACT_ID: "${{ steps.upstream_meta.outputs.comparison_artifact_id }}", COMPARISON_ARTIFACT_DIGEST: "${{ steps.upstream_meta.outputs.comparison_artifact_digest }}", PROJECTION_ARTIFACT_ID: "${{ steps.upstream_meta.outputs.projection_contract_artifact_id }}", PROJECTION_ARTIFACT_DIGEST: "${{ steps.upstream_meta.outputs.projection_contract_artifact_digest }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"; auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28"); mkdir -p "${RUNNER_TEMP}/comparison-source" "${RUNNER_TEMP}/projection-source"; curl -fsSL -L "${auth[@]}" "${api}/actions/artifacts/${COMPARISON_ARTIFACT_ID}/zip" -o "${RUNNER_TEMP}/comparison.zip"; curl -fsSL -L "${auth[@]}" "${api}/actions/artifacts/${PROJECTION_ARTIFACT_ID}/zip" -o "${RUNNER_TEMP}/projection.zip"; test "$(sha256sum "${RUNNER_TEMP}/comparison.zip"|cut -d' ' -f1)" = "${COMPARISON_ARTIFACT_DIGEST#sha256:}"; test "$(sha256sum "${RUNNER_TEMP}/projection.zip"|cut -d' ' -f1)" = "${PROJECTION_ARTIFACT_DIGEST#sha256:}"; unzip -q "${RUNNER_TEMP}/comparison.zip" -d "${RUNNER_TEMP}/comparison-source"; unzip -q "${RUNNER_TEMP}/projection.zip" -d "${RUNNER_TEMP}/projection-source"
      - name: Validate upstream receipts and run frozen projection
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          def unique(b,n):
              x=[p for p in b.rglob(n) if p.is_file()]; assert len(x)==1,(n,len(x)); return x[0]
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest(); comp=unique(root/'comparison-source','comparison-only-v1.json'); orch=unique(root/'comparison-source','comparison-v3-orchestration-receipt.json'); proj=unique(root/'projection-source','qualification-projection-contract-receipt.json'); c=json.loads(comp.read_text()); o=json.loads(orch.read_text()); p=json.loads(proj.read_text())
          assert c['schema']=='symthaea.rel.comparison-only.v1' and c['authority']=='ComparisonOnly' and c['comparison_result'] in {'ALL_PREDICATES_PASS','PREDICATE_FAILURES'} and c['predicate_count']==41 and c['passed_count']+c['failed_count']==41; assert c['claims']=={'comparison_only_adjudicated':True,'rel_005a_qualified':False,'scientific_pass':False,'scientific_fail':False}; assert o['schema']=='symthaea.rel.comparison-orchestration-receipt.v2' and o['authority']=='ComparisonInfrastructureOnly' and o['subject_head']==os.environ['COMPARISON_HEAD'] and o['comparison_output_sha256']==sha(comp) and o['comparison_result']==c['comparison_result'] and o['transport_identity_is_scientific_authority'] is False and o['seal_chain_commitment_sha256']==os.environ['SEAL_CHAIN_SHA256']; assert p['schema']=='symthaea.rel.qualification-projection-contract-static-receipt.v1' and p['authority']=='EvidenceProjectionContractOnly' and p['subject_head']==os.environ['PROJECTION_HEAD'] and p['self_tests_passed'] is True and p['raw_observation_output'] is False and p['raw_execution_logs_output'] is False and p['detailed_predicate_values_output'] is False and p['failed_predicate_identity_preserved'] is True and p['comparison_result_preserved'] is True and not any(p['claims'].values())
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"full_comparison_sha256={sha(comp)}\nprojection_contract_receipt_sha256={sha(proj)}\n"); (root/'comparison-path.txt').write_text(str(comp))
          PY
          python3 .github/rel/rel-005a-qualification-projection.py --contract .github/rel/rel-005a-qualification-projection-contract.json --predicate-receipt "${RUNNER_TEMP}/authority-receipts/predicate-contract-receipt.json" --execution-receipt "${RUNNER_TEMP}/authority-receipts/execution-v3-receipt.json" --seal "${RUNNER_TEMP}/authority-receipts/observation-seal-v3.json" --comparison "$(cat "${RUNNER_TEMP}/comparison-path.txt")" --output-dir "${RUNNER_TEMP}/projected"; test "$(find "${RUNNER_TEMP}/projected" -maxdepth 1 -type f | wc -l)" -eq 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "rel-005a-projected-qualification-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/projected/*", retention-days: 90, if-no-files-found: error}

  qualification_assembly:
    name: Assemble six-file sanitized QualificationOnly input
    needs: [authority_receipt_extraction, evidence_projection]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ env.EXPECTED_HEAD }}", fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: "rel-005a-projected-qualification-${{ env.EXPECTED_HEAD }}", path: "${{ runner.temp }}/projected"}
      - name: Build provenance and sanitized assembly
        shell: bash
        env:
          PREDICATE_ARTIFACT_ID: ${{ needs.authority_receipt_extraction.outputs.predicate_artifact_id }}
          PREDICATE_ARTIFACT_DIGEST: ${{ needs.authority_receipt_extraction.outputs.predicate_artifact_digest }}
          SEAL_ARTIFACT_ID: ${{ needs.authority_receipt_extraction.outputs.seal_artifact_id }}
          SEAL_ARTIFACT_DIGEST: ${{ needs.authority_receipt_extraction.outputs.seal_artifact_digest }}
          PREDICATE_RECEIPT_SHA256: ${{ needs.authority_receipt_extraction.outputs.predicate_receipt_sha256 }}
          EXECUTION_RECEIPT_SHA256: ${{ needs.authority_receipt_extraction.outputs.execution_receipt_sha256 }}
          SEAL_RECEIPT_SHA256: ${{ needs.authority_receipt_extraction.outputs.seal_receipt_sha256 }}
          EXTRACTION_RECEIPT_SHA256: ${{ needs.authority_receipt_extraction.outputs.extraction_receipt_sha256 }}
          COMPARISON_SOURCE_JOB_ID: ${{ needs.evidence_projection.outputs.comparison_source_job_id }}
          COMPARISON_ARTIFACT_ID: ${{ needs.evidence_projection.outputs.comparison_artifact_id }}
          COMPARISON_ARTIFACT_DIGEST: ${{ needs.evidence_projection.outputs.comparison_artifact_digest }}
          PROJECTION_SOURCE_JOB_ID: ${{ needs.evidence_projection.outputs.projection_contract_source_job_id }}
          PROJECTION_ARTIFACT_ID: ${{ needs.evidence_projection.outputs.projection_contract_artifact_id }}
          PROJECTION_ARTIFACT_DIGEST: ${{ needs.evidence_projection.outputs.projection_contract_artifact_digest }}
          PROJECTION_RECEIPT_SHA256: ${{ needs.evidence_projection.outputs.projection_contract_receipt_sha256 }}
          FULL_COMPARISON_SHA256: ${{ needs.evidence_projection.outputs.full_comparison_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
