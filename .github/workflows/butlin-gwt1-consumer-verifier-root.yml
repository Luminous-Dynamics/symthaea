name: Butlin GWT-1 Consumer Verifier Root

on:
  pull_request:
    paths:
      - ".github/workflows/butlin-gwt1-consumer-verifier-root.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify frozen GitHub CLI verifier identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Re-derive and require frozen verifier identity
        shell: bash
        env:
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_BINARY_SHA256: "553949e2efa12842771efe6012aa4de21f1d591530ec17fc435f610f10e017ee"
          TRUSTED_GH_VERSION_OUTPUT_SHA256: "2ec8b2f6e0e8e915f7e0c8d7b14b77fe93e33225872ea1d98041228950c620a9"
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          root="$RUNNER_TEMP/gwt1-consumer-gh-root"
          rm -rf "$root"
          mkdir -p "$root"
          archive="$root/gh_${TRUSTED_GH_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$TRUSTED_GH_ARCHIVE_URL"
          printf '%s  %s\n' "$TRUSTED_GH_ARCHIVE_SHA256" "$archive" | /usr/bin/sha256sum -c -
          /usr/bin/tar --no-same-owner -xzf "$archive" -C "$root"
          gh="$root/gh_${TRUSTED_GH_VERSION}_linux_amd64/bin/gh"
          test -f "$gh"
          test ! -L "$gh"
          test -x "$gh"
          version_output="$($gh --version)"
          test "$(printf '%s\n' "$version_output" | /usr/bin/awk 'NR==1{print $3}')" = "$TRUSTED_GH_VERSION"
          binary_sha256="$(/usr/bin/sha256sum "$gh" | /usr/bin/awk '{print $1}')"
          version_output_sha256="$(printf '%s' "$version_output" | /usr/bin/sha256sum | /usr/bin/awk '{print $1}')"
          test "$binary_sha256" = "$TRUSTED_GH_BINARY_SHA256"
          test "$version_output_sha256" = "$TRUSTED_GH_VERSION_OUTPUT_SHA256"
          echo "GWT1_CONSUMER_GH_BINARY_SHA256=$binary_sha256"
          echo "GWT1_CONSUMER_GH_VERSION_OUTPUT_SHA256=$version_output_sha256"
