name: Symthaea Nightly (Ignored Tests)

on:
  schedule:
    # Run at 06:00 UTC daily (midnight Central)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  slow-tests:
    name: Slow Tests (LTC training, Phi validation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-
      - name: Run ignored lib tests (release mode)
        run: cargo test --workspace --lib --release -- --ignored
        env:
          RUST_BACKTRACE: 1
      - name: Sleep sentinel EEG tests (LTC training)
        run: cargo test --lib --release -- sleep_sentinel --ignored --nocapture
        env:
          RUST_BACKTRACE: 1

  doc-tests:
    name: Doc Tests (all crates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-nightly-doc-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-doc-
      - name: Run doc tests (symthaea-core)
        run: cargo test --doc -p symthaea-core
      - name: Run doc tests (symthaea)
        run: cargo test --doc -p symthaea

  integration-tests:
    name: Integration Tests (ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-nightly-integ-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-integ-
      - name: Run ignored integration tests (release mode)
        run: cargo test --workspace --tests --release -- --ignored
        env:
          RUST_BACKTRACE: 1

  perf-tests:
    name: Performance & Throughput Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-nightly-perf-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-perf-
      - name: BPTT throughput
        run: cargo test --release --test bptt_throughput -- --ignored --nocapture
        env:
          RUST_BACKTRACE: 1
      - name: Performance comparison
        run: cargo test --release --test performance_comparison -- --ignored --nocapture
        env:
          RUST_BACKTRACE: 1
      - name: Scaling tests
        run: cargo test --release --test scaling -- --ignored --nocapture
        env:
          RUST_BACKTRACE: 1

  llm-integration:
    name: LLM Backend Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run if API keys are configured as secrets
    # Secrets are injected via env below; tests skip gracefully if missing
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-nightly-llm-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-llm-
      - name: LLM backend integration tests
        run: cargo test --release --test llm_backend_integration -- --ignored --nocapture
        env:
          RUST_BACKTRACE: 1
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  benchmarks:
    name: Criterion Benchmarks (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-nightly-bench-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-bench-
      - name: Core HDC benchmarks
        run: cargo bench --bench hdc_benchmarks -- --quick --output-format=bencher 2>&1 | tee /tmp/bench-hdc.txt
      - name: Quick benchmarks
        run: cargo bench --bench quick -- --quick --output-format=bencher 2>&1 | tee /tmp/bench-quick.txt
      - name: Memory benchmarks
        run: cargo bench --bench memory_benchmark -- --quick --output-format=bencher 2>&1 | tee /tmp/bench-memory.txt
      - name: Consciousness benchmarks
        run: cargo bench --bench consciousness -- --quick --output-format=bencher 2>&1 | tee /tmp/bench-consciousness.txt
      - name: Cognitive cycle benchmark (regression check)
        run: |
          # Save baseline on first run, compare on subsequent
          if [ -d "target/criterion/cognitive_cycle_single" ]; then
            cargo bench --bench cognitive_cycle -- --quick --output-format=bencher 2>&1 | tee /tmp/bench-cognitive.txt
            # Check for regressions >15% in output
            if grep -q "regressed" /tmp/bench-cognitive.txt; then
              echo "::warning::Benchmark regression detected in cognitive_cycle"
            fi
          else
            cargo bench --bench cognitive_cycle -- --quick --save-baseline nightly --output-format=bencher 2>&1 | tee /tmp/bench-cognitive.txt
          fi
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/bench-*.txt
          retention-days: 30

  test-health:
    name: Test Health Report
    runs-on: ubuntu-latest
    if: always()
    needs: [slow-tests, doc-tests, integration-tests, perf-tests, benchmarks]
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - name: Count ignored doc tests
        run: |
          echo "## Symthaea Test Health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          IGNORED_DOC=$(grep -r '```ignore' symthaea-core/src/ src/ --include="*.rs" | wc -l)
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ignored doc tests (\`\`\`ignore) | $IGNORED_DOC |" >> $GITHUB_STEP_SUMMARY

          IGNORED_ATTR=$(grep -rn '#\[ignore' symthaea-core/src/ src/ tests/ --include="*.rs" | wc -l)
          echo "| Ignored unit/integration tests (#[ignore]) | $IGNORED_ATTR |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Slow Tests | ${{ needs.slow-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Doc Tests | ${{ needs.doc-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Perf Tests | ${{ needs.perf-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmarks | ${{ needs.benchmarks.result }} |" >> $GITHUB_STEP_SUMMARY
