name: Muse Barline Evaluation

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/barline_eval.rs"
      - "crates/domains/symthaea-muse/src/musicxml_barline_adapter.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - ".github/workflows/muse-barline-evaluation.yml"
  push:
    branches:
      - "research/melothaea-barline-evaluator-v1"
      - "research/melothaea-musicxml-barline-map-v1"
      - "research/melothaea-polymetric-measure-maps-v1"
      - "research/melothaea-internal-barline-graph-v1"
    paths:
      - "crates/domains/symthaea-muse/src/barline_eval.rs"
      - "crates/domains/symthaea-muse/src/musicxml_barline_adapter.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - ".github/workflows/muse-barline-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-barline-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  barline-evaluator:
    name: Format and exact-head evaluator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Record checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"

      - name: Check Muse formatting
        run: cargo fmt --check -p symthaea-muse

      - name: Run focused exact barline evaluator tests
        run: cargo test --locked -p symthaea-muse --features theory barline_eval::tests::

  musicxml-measure-adapter:
    name: Focused MusicXML measure-map tests
    if: >-
      startsWith(github.head_ref, 'research/melothaea-musicxml-') ||
      startsWith(github.head_ref, 'research/melothaea-polymetric-') ||
      startsWith(github.head_ref, 'research/melothaea-internal-') ||
      startsWith(github.ref_name, 'research/melothaea-musicxml-') ||
      startsWith(github.ref_name, 'research/melothaea-polymetric-') ||
      startsWith(github.ref_name, 'research/melothaea-internal-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Record checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "checked_out_sha=$(git rev-parse HEAD)"

      - name: Check Muse formatting
        run: cargo fmt --check -p symthaea-muse

      - name: Run focused MusicXML measure-map tests
        run: cargo test --locked -p symthaea-muse --features theory musicxml_barline_adapter::tests::
