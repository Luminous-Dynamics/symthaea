# One-shot, exact-parent-gated repair for qualification receipt identity.
# Delete this workflow immediately after it commits the bounded script change.
name: One-shot Continuity Receipt Integrity Repair

on:
  push:
    branches:
      - ci/continuity-verifier-grant-exact-head-v1
    paths:
      - '.github/workflows/continuity-receipt-integrity-repair-once.yml'

permissions:
  contents: write

env:
  EXPECTED_PARENT_SHA: f40b4c1bee0ee54fed08aa5dab9be9fda38a12d1
  TARGET_BRANCH: ci/continuity-verifier-grant-exact-head-v1
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262

jobs:
  repair:
    name: Bind committed and derived lock identities separately
    if: github.actor == 'Tristan-Stoltz-ERC'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-shot boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = 'HEAD'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/continuity-receipt-integrity-repair-once.yml'
          test "$(grep -Fc "uses: actions/checkout@$CHECKOUT_ACTION_SHA" .github/workflows/continuity-receipt-integrity-repair-once.yml)" -eq 1

      - name: Apply exact receipt-integrity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/qualify-continuity-contract.sh')
          text = path.read_text()

          replacements = [
              (
                  'lock_probe_source_state="not-run"\n\nsha256_file() {',
                  'lock_probe_source_state="not-run"\n'
                  'committed_cargo_lock_sha256="unavailable"\n'
                  'lock_repair_snapshot_sha256="unavailable"\n\n'
                  'sha256_file() {',
              ),
              (
                  "        printf 'cargo_lock_sha256\\t%s\\n' \"$(sha256_file Cargo.lock)\"\n",
                  "        printf 'cargo_lock_sha256\\t%s\\n' \"$committed_cargo_lock_sha256\"\n"
                  "        printf 'committed_cargo_lock_sha256\\t%s\\n' \"$committed_cargo_lock_sha256\"\n"
                  "        printf 'lock_repair_snapshot_sha256\\t%s\\n' \"$lock_repair_snapshot_sha256\"\n",
              ),
              (
                  'source_state="clean-exact-checkout"\n\nrm -f "$format_patch_path" "$lock_patch_path"',
                  'source_state="clean-exact-checkout"\n'
                  'committed_cargo_lock_sha256="$(sha256_file Cargo.lock)"\n\n'
                  'rm -f "$format_patch_path" "$lock_patch_path"',
              ),
              (
                  '    cargo generate-lockfile --offline\n    probe_rc=$?\n    if ! git diff --quiet -- Cargo.lock; then',
                  '    cargo generate-lockfile --offline\n'
                  '    probe_rc=$?\n'
                  '    if [[ -f Cargo.lock ]]; then\n'
                  '        lock_repair_snapshot_sha256="$(sha256_file Cargo.lock)"\n'
                  '    fi\n'
                  '    if ! git diff --quiet -- Cargo.lock; then',
              ),
              (
                  "            echo \"- offline lock-repair diagnostic probe: `\$lock_probe_status` at `\$lock_probe_stage`\"\n"
                  "            echo '- repair probes are diagnostic only and cannot change exact-head FAIL/PASS status'",
                  "            echo \"- offline lock-repair diagnostic probe: `\$lock_probe_status` at `\$lock_probe_stage`\"\n"
                  "            echo \"- committed Cargo.lock SHA-256: `\$committed_cargo_lock_sha256`\"\n"
                  "            echo \"- derived lock snapshot SHA-256: `\$lock_repair_snapshot_sha256`\"\n"
                  "            echo '- repair probes are diagnostic only and cannot change exact-head FAIL/PASS status'",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          bash -n scripts/qualify-continuity-contract.sh
          git diff --check
          test "$(git diff --name-only)" = 'scripts/qualify-continuity-contract.sh'
          grep -Fq $'committed_cargo_lock_sha256\\t%s' scripts/qualify-continuity-contract.sh
          grep -Fq $'lock_repair_snapshot_sha256\\t%s' scripts/qualify-continuity-contract.sh

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Luminous Continuity Receipt Repair'
          git config user.email 'continuity-receipt-repair@users.noreply.github.com'
          git add scripts/qualify-continuity-contract.sh
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'scripts/qualify-continuity-contract.sh'
          git commit -m 'ci(continuity): preserve committed lock identity in receipts'
          git push origin "HEAD:$TARGET_BRANCH"
