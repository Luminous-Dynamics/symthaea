name: Resource Stack Qualification

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/domains/symthaea-resource-*/**'
      - '.github/workflows/resource-stack-qualification.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  qualify:
    name: Compile, lint, and test all resource crates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/resource-stack-qualification
          key: ${{ runner.os }}-resource-stack-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-resource-stack-

      - name: Diagnose committed Cargo.lock freshness
        id: lock_freshness
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.committed

          # Intentionally omit --locked once: this asks the pinned Cargo resolver
          # what metadata/lock state the exact checkout requires. A committed lock
          # is fresh only when this operation leaves Cargo.lock byte-identical.
          cargo metadata --no-deps --format-version 1 > /tmp/resource-metadata.json
          cp Cargo.lock /tmp/Cargo.lock.generated

          if ! cmp -s /tmp/Cargo.lock.committed /tmp/Cargo.lock.generated; then
            echo '::error::Committed Cargo.lock is stale for the exact workspace head.'
            echo 'The diff below is diagnostic output generated by the pinned toolchain; it is not qualification.'
            echo '::group::Generated Cargo.lock diff'
            git --no-pager diff -- Cargo.lock || true
            echo '::endgroup::'
            exit 1
          fi

          # Re-run under the theorem the remaining lane depends on: Cargo must be
          # able to resolve this exact checkout without changing the committed lock.
          cargo metadata --locked --no-deps --format-version 1 > /tmp/resource-metadata.json

      - name: Retain generated lock diagnostic on freshness failure
        if: failure() && steps.lock_freshness.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-resource-stack-Cargo.lock
          path: /tmp/Cargo.lock.generated
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify resource namespace bijection and discover packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/resource-packages.txt
          import json
          from pathlib import Path

          root = Path.cwd().resolve()
          metadata = json.loads(Path('/tmp/resource-metadata.json').read_text())

          expected_manifests = sorted(
              path.resolve()
              for path in (root / 'crates' / 'domains').glob('symthaea-resource-*/Cargo.toml')
          )
          if not expected_manifests:
              raise SystemExit('no crates/domains/symthaea-resource-*/Cargo.toml manifests found')

          resource_packages = sorted(
              (
                  package['name'],
                  Path(package['manifest_path']).resolve(),
              )
              for package in metadata['packages']
              if package['name'].startswith('symthaea-resource-')
          )
          if not resource_packages:
              raise SystemExit('no symthaea-resource-* workspace packages discovered')

          package_names = [name for name, _ in resource_packages]
          if len(package_names) != len(set(package_names)):
              raise SystemExit('duplicate symthaea-resource-* package identity')

          actual_manifests = sorted(manifest for _, manifest in resource_packages)
          expected_set = set(expected_manifests)
          actual_set = set(actual_manifests)

          missing_from_workspace = sorted(expected_set - actual_set)
          unexpected_in_namespace = sorted(actual_set - expected_set)
          if missing_from_workspace or unexpected_in_namespace:
              if missing_from_workspace:
                  print('resource manifests missing from workspace metadata:', file=__import__('sys').stderr)
                  for path in missing_from_workspace:
                      print(f'  {path.relative_to(root)}', file=__import__('sys').stderr)
              if unexpected_in_namespace:
                  print('symthaea-resource-* packages outside the resource path namespace:', file=__import__('sys').stderr)
                  for path in unexpected_in_namespace:
                      try:
                          display = path.relative_to(root)
                      except ValueError:
                          display = path
                      print(f'  {display}', file=__import__('sys').stderr)
              raise SystemExit('resource path/package namespace is not bijective')

          for name, manifest in resource_packages:
              directory_name = manifest.parent.name
              if directory_name != name:
                  raise SystemExit(
                      f'resource package/path identity mismatch: package={name!r} directory={directory_name!r}'
                  )

          print('\n'.join(package_names))
          PY
          echo 'Exact resource package set:'
          cat /tmp/resource-packages.txt

      - name: Rustfmt every resource package
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            echo "== cargo fmt: ${package} =="
            cargo fmt --package "${package}" -- --check
          done < /tmp/resource-packages.txt

      - name: Cargo check every resource package
        shell: bash
        env:
          CARGO_TARGET_DIR: target/resource-stack-qualification
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            echo "== cargo check: ${package} =="
            cargo check --locked -p "${package}" --all-targets
          done < /tmp/resource-packages.txt

      - name: Clippy every resource package
        shell: bash
        env:
          CARGO_TARGET_DIR: target/resource-stack-qualification
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            echo "== cargo clippy: ${package} =="
            cargo clippy --locked -p "${package}" --all-targets -- -D warnings
          done < /tmp/resource-packages.txt

      - name: Test every resource package
        shell: bash
        env:
          CARGO_TARGET_DIR: target/resource-stack-qualification
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            echo "== cargo test: ${package} =="
            cargo test --locked -p "${package}" --all-targets
          done < /tmp/resource-packages.txt

      - name: Doc-test every resource package
        shell: bash
        env:
          CARGO_TARGET_DIR: target/resource-stack-qualification
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            echo "== cargo test --doc: ${package} =="
            cargo test --locked -p "${package}" --doc
          done < /tmp/resource-packages.txt
