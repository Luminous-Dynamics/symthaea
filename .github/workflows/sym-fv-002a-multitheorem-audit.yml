name: SYM-FV-002A Multi-Theorem Audit

on:
  pull_request:
    paths:
      - "crates/bridges/symthaea-lean-bridge/src/theorem_set_audit.rs"
      - "crates/bridges/symthaea-lean-bridge/src/lib.rs"
      - "crates/bridges/symthaea-lean-bridge/tests/binaryhv_bind_formal_audit.rs"
      - "formal/lean/hdc/BinaryHVBind.lean"
      - "crates/bridges/symthaea-proof-audit/**"
      - "crates/bridges/symthaea-lean-bridge/src/axiom_gate.rs"
      - "crates/bridges/symthaea-lean-bridge/src/subprocess.rs"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/sym-fv-002a-multitheorem-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sym-fv-002a-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: End-to-end BinaryHV theorem-set audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact parent theorem subject and child scope
        shell: bash
        run: |
          set -euo pipefail
          parent=2199cf04634e81d85592ed0479a5c3d2d0fb6ac8
          proof=formal/lean/hdc/BinaryHVBind.lean
          expected_proof_blob=f724618781b2660d1e76e45a69dcf796a792d76d
          test "$(git rev-parse "$parent:$proof")" = "$expected_proof_blob"
          test "$(git rev-parse "HEAD:$proof")" = "$expected_proof_blob"
          git diff --name-only "$parent"..HEAD | sort | tee /tmp/sym-fv-002a-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              '.github/workflows/sym-fv-002a-multitheorem-audit.yml',
              'crates/bridges/symthaea-lean-bridge/src/lib.rs',
              'crates/bridges/symthaea-lean-bridge/src/theorem_set_audit.rs',
              'crates/bridges/symthaea-lean-bridge/tests/binaryhv_bind_formal_audit.rs',
          }
          observed = set(Path('/tmp/sym-fv-002a-paths.txt').read_text().splitlines())
          if observed != expected:
              raise SystemExit(f'unexpected child scope: {sorted(observed ^ expected)}')
          PY

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Unit-qualify audit adapter
        shell: bash
        run: |
          set -euo pipefail
          nix develop .#formal --command sh -c '
            set -eu
            cargo fmt --check -p symthaea-lean-bridge
            cargo test -p symthaea-lean-bridge --lib theorem_set_audit -- --nocapture
          '

      - name: Audit all BinaryHV bind theorems through real Lean
        shell: bash
        run: |
          set -euo pipefail
          nix develop .#formal --command sh -c '
            set -eu
            rustc --version | tee /tmp/sym-fv-002a-rust-version.txt
            lean --version | tee /tmp/sym-fv-002a-lean-version.txt
            SYMTHAEA_LEAN_FORMAL_AUDIT=1 \
              cargo test -p symthaea-lean-bridge --test binaryhv_bind_formal_audit -- --nocapture \
              | tee /tmp/sym-fv-002a-audit-output.txt
          '

      - name: Postflight immutability and receipt
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          parent = '2199cf04634e81d85592ed0479a5c3d2d0fb6ac8'
          proof = Path('formal/lean/hdc/BinaryHVBind.lean')
          touched = [
              Path('crates/bridges/symthaea-lean-bridge/src/theorem_set_audit.rs'),
              Path('crates/bridges/symthaea-lean-bridge/src/lib.rs'),
              Path('crates/bridges/symthaea-lean-bridge/tests/binaryhv_bind_formal_audit.rs'),
              Path('.github/workflows/sym-fv-002a-multitheorem-audit.yml'),
          ]
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {
              'schema': 'symthaea.formal.sym-fv-002a-multitheorem-audit.v1',
              'tracking_issue': 5881,
              'evidence_class': 'AbstractFormalTheorem',
              'head': git('rev-parse', 'HEAD'),
              'tree': git('rev-parse', 'HEAD^{tree}'),
              'parent_head': parent,
              'proof_blob': git('rev-parse', 'HEAD:formal/lean/hdc/BinaryHVBind.lean'),
              'proof_sha256': sha256(proof),
              'rust_version': Path('/tmp/sym-fv-002a-rust-version.txt').read_text().strip(),
              'lean_version': Path('/tmp/sym-fv-002a-lean-version.txt').read_text().strip(),
              'theorem_count': 8,
              'policy': 'constitutional',
              'real_lean_subprocess_required': True,
              'audit_test_exit_zero': True,
              'repository_postflight_clean': True,
              'child_artifacts': {str(path): sha256(path) for path in touched},
              'nonclaims': [
                  'not-rust-refinement',
                  'not-simd-proof',
                  'not-rustc-or-llvm-proof',
                  'not-native-binary-verification',
                  'not-runtime-authority',
              ],
          }
          out = Path('/tmp/sym-fv-002a-receipt.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text())
          PY

      - name: Retain audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sym-fv-002a-${{ github.sha }}
          path: |
            /tmp/sym-fv-002a-rust-version.txt
            /tmp/sym-fv-002a-lean-version.txt
            /tmp/sym-fv-002a-audit-output.txt
            /tmp/sym-fv-002a-receipt.json
          if-no-files-found: error
          retention-days: 30
