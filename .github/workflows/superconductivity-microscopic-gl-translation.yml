name: Superconductivity Microscopic-to-GL Evidence Contract

on:
  pull_request:
    paths:
      - "tools/superconductivity-microscopic-gl-translation-harness/**"
      - "data/schemas/superconductivity_microscopic_gl_translation_v0_1.schema.json"
      - "data/research/superconductivity_microscopic_gl_translation_fixture_v0_1.json"
      - "research/superconductivity/microscopic_gl_translation/**"
      - ".github/workflows/superconductivity-microscopic-gl-translation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superconductivity-microscopic-gl-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  microscopic-gl-contract:
    name: Coefficient identifiability and material-state provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/superconductivity-microscopic-gl-translation-harness/Cargo.toml --all -- --check

      - name: Generate isolated dependency lockfile
        run: cargo generate-lockfile --manifest-path tools/superconductivity-microscopic-gl-translation-harness/Cargo.toml

      - name: Run state-linkage and coefficient-promotion negative controls
        run: cargo test --locked --manifest-path tools/superconductivity-microscopic-gl-translation-harness/Cargo.toml --bin sc_microscopic_gl_audit

      - name: Audit paper-method source record without promoting missing values
        run: |
          cargo run --locked --manifest-path tools/superconductivity-microscopic-gl-translation-harness/Cargo.toml --bin sc_microscopic_gl_audit -- \
            --schema data/schemas/superconductivity_microscopic_gl_translation_v0_1.schema.json \
            --fixture data/research/superconductivity_microscopic_gl_translation_fixture_v0_1.json \
            --out "$RUNNER_TEMP/sc-microscopic-gl-receipt.json"
          cat "$RUNNER_TEMP/sc-microscopic-gl-receipt.json"

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/superconductivity-microscopic-gl-translation-harness/Cargo.toml --bin sc_microscopic_gl_audit -- -D warnings

      - name: Record exact-run identity
        if: always()
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            sha256sum data/schemas/superconductivity_microscopic_gl_translation_v0_1.schema.json
            sha256sum data/research/superconductivity_microscopic_gl_translation_fixture_v0_1.json
            sha256sum tools/superconductivity-microscopic-gl-translation-harness/Cargo.toml
            sha256sum tools/superconductivity-microscopic-gl-translation-harness/src/main.rs
            if [ -f tools/superconductivity-microscopic-gl-translation-harness/Cargo.lock ]; then
              sha256sum tools/superconductivity-microscopic-gl-translation-harness/Cargo.lock
            else
              echo "cargo_lock=not-generated"
            fi
          } > "$RUNNER_TEMP/sc-microscopic-gl-environment.txt"

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-microscopic-gl-exact-run-evidence
          if-no-files-found: warn
          path: |
            tools/superconductivity-microscopic-gl-translation-harness/Cargo.lock
            ${{ runner.temp }}/sc-microscopic-gl-environment.txt
            ${{ runner.temp }}/sc-microscopic-gl-receipt.json
