name: PITB SorryDB Benchmark Integrity

on:
  pull_request:
    paths:
      - "tools/pitb-sorrydb-integrity/**"
      - ".github/workflows/pitb-typed-graph-evidence.yml"
      - ".github/workflows/pitb-sorrydb-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sorrydb-integrity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/pitb-sorrydb-venv"
          "$RUNNER_TEMP/pitb-sorrydb-venv/bin/pip" install "jsonschema==4.25.1"

      - name: Stage isolated SorryDB validator
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/pitb-sorrydb-integrity"
          mkdir -p "$staged/src"
          cp tools/pitb-sorrydb-integrity/Cargo.toml "$staged/Cargo.toml"
          cp tools/pitb-sorrydb-integrity/Cargo.lock "$staged/Cargo.lock"
          cp tools/pitb-sorrydb-integrity/src/main.rs "$staged/src/main.rs"
          echo "PITB_SORRYDB_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
          echo "PITB_SORRYDB_DIR=$staged" >> "$GITHUB_ENV"

      - name: Format and test Rust validator
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 "$PITB_SORRYDB_DIR/src/main.rs"
          cargo fmt --check --manifest-path "$PITB_SORRYDB_MANIFEST"
          cargo test --locked --manifest-path "$PITB_SORRYDB_MANIFEST"

      - name: Generate synthetic report through Git blob verifier
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$PITB_SORRYDB_MANIFEST" -- \
            --self-test-report "$RUNNER_TEMP/sorrydb-integrity-report.synthetic.json" "$RUNNER_TEMP/sorrydb-task-receipt.synthetic.jsonl"

      - name: Validate provenance, receipt and report schemas
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-sorrydb-venv/bin/python" - "$RUNNER_TEMP/sorrydb-integrity-report.synthetic.json" "$RUNNER_TEMP/sorrydb-task-receipt.synthetic.jsonl" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("tools/pitb-sorrydb-integrity")
          names = (
              "sorrydb-snapshot-provenance-v0.schema.json",
              "sorrydb-task-reproduction-v0.schema.json",
              "sorrydb-integrity-report-v0.schema.json",
              "sorrydb-snapshot-integrity-report-v0.schema.json",
          )
          schemas = {}
          for name in names:
              schema = json.loads((root / "schema" / name).read_text())
              Draft202012Validator.check_schema(schema)
              schemas[name] = schema

          provenance = json.loads((root / "fixtures" / "sorrydb-2601-provenance.json").read_text())
          errors = list(Draft202012Validator(schemas[names[0]]).iter_errors(provenance))
          if errors:
              raise SystemExit("pinned SorryDB provenance schema errors: " + "; ".join(e.message for e in errors))

          receipt_lines = [line for line in Path(sys.argv[2]).read_text().splitlines() if line.strip()]
          if len(receipt_lines) != 1:
              raise SystemExit("synthetic task receipt denominator changed")
          receipt = json.loads(receipt_lines[0])
          errors = list(Draft202012Validator(schemas[names[1]]).iter_errors(receipt))
          if errors:
              raise SystemExit("synthetic SorryDB task receipt schema errors: " + "; ".join(e.message for e in errors))

          report = json.loads(Path(sys.argv[1]).read_text())
          errors = list(Draft202012Validator(schemas[names[2]]).iter_errors(report))
          if errors:
              raise SystemExit("synthetic SorryDB report schema errors: " + "; ".join(e.message for e in errors))
          if report["database_task_count"] != 2 or report["evaluation_task_count"] != 1:
              raise SystemExit("synthetic SorryDB denominators changed")
          if report["reproducible_task_count"] != 1 or report["scheduler_admission"] is not False:
              raise SystemExit("SorryDB reproduction/trust boundary changed")
          if report["assurance_qualified_task_count"] != 0:
              raise SystemExit("synthetic task without completed audits was assurance-qualified")
          if report["assurance_disqualified_task_ids"] or len(report["assurance_unreviewed_task_ids"]) != 1:
              raise SystemExit("synthetic semantic audit coverage accounting changed")
          if report["full_count_documentation_drift"] is not False:
              raise SystemExit("synthetic no-drift control changed")
          print("PITB_SORRYDB_PROVENANCE_AND_REPORT_SCHEMA_PASS")
          PY

 
      - name: Download exact pinned SorryDB source snapshots
        shell: bash
        run: |
          set -euo pipefail
          source_commit="74b3b63f8ba890d675f362924b21ac55db410383"
          base="https://raw.githubusercontent.com/SorryDB/SorryDB/$source_commit"
          full="$RUNNER_TEMP/SorryDB_2601.json"
          split="$RUNNER_TEMP/SorryDB_2601_1000_evaluation_split.json"
          curl --fail --silent --show-error --location "$base/data/SorryDB_2601/SorryDB_2601.json" -o "$full"
          curl --fail --silent --show-error --location "$base/data/SorryDB_2601/SorryDB_2601_1000_evaluation_split.json" -o "$split"

          full_blob="$(git hash-object --stdin < "$full")"
          split_blob="$(git hash-object --stdin < "$split")"
          test "$full_blob" = "5fafddac467af6d30d8f5c8731d6edec9c273a47"
          test "$split_blob" = "af3b663429dc4689ee728d2fb5c7d8d5034476f7"
          echo "SORRYDB_FULL_SOURCE_BLOB_PASS $full_blob"
          echo "SORRYDB_EVALUATION_SOURCE_BLOB_PASS $split_blob"
          echo "PITB_SORRYDB_FULL=$full" >> "$GITHUB_ENV"
          echo "PITB_SORRYDB_SPLIT=$split" >> "$GITHUB_ENV"

      - name: Audit pinned SorryDB snapshot without fabricating task receipts
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$PITB_SORRYDB_MANIFEST" -- \
            --audit-snapshot \
            "$PITB_SORRYDB_FULL" \
            "$PITB_SORRYDB_SPLIT" \
            tools/pitb-sorrydb-integrity/fixtures/sorrydb-2601-provenance.json \
            "$RUNNER_TEMP/sorrydb-snapshot-integrity-report.json"

      - name: Validate real SorryDB snapshot integrity report
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-sorrydb-venv/bin/python" - "$RUNNER_TEMP/sorrydb-snapshot-integrity-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("tools/pitb-sorrydb-integrity/schema/sorrydb-snapshot-integrity-report-v0.schema.json")
          schema = json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          report = json.loads(Path(sys.argv[1]).read_text())
          errors = list(Draft202012Validator(schema).iter_errors(report))
          if errors:
              raise SystemExit("real SorryDB snapshot report schema errors: " + "; ".join(e.message for e in errors))

          expected = {
              "database_task_count": 5663,
              "documented_database_task_count": 2601,
              "evaluation_task_count": 1000,
              "full_unique_task_ids": 5663,
              "full_unique_goal_strings": 5663,
              "full_unique_repositories": 78,
              "full_unique_repository_commit_pairs": 140,
              "evaluation_unique_repositories": 78,
              "evaluation_unique_repository_commit_pairs": 107,
              "evaluation_repository_file_clusters": 339,
              "evaluation_repository_overlap_count": 78,
              "max_tasks_per_evaluation_repository": 21,
              "max_tasks_per_evaluation_repository_file": 20,
              "evaluation_unique_lean_versions": 14,
              "full_zero_based_start_column_count": 19,
              "evaluation_zero_based_start_column_count": 2,
              "full_task_ids_recomputed": 5663,
              "evaluation_task_ids_recomputed": 1000,
          }
          for field, value in expected.items():
              if report[field] != value:
                  raise SystemExit(f"{field}: expected {value}, observed {report[field]}")
          if report["project_disjoint_evaluation_split"] is not False:
              raise SystemExit("the task-level evaluation slice must not be called project-disjoint")
          if report["evaluation_ids_subset_of_full"] is not True or report["evaluation_records_identical_to_full"] is not True:
              raise SystemExit("evaluation split is not exactly grounded in full snapshot")
          if report["scheduler_admission"] is not False:
              raise SystemExit("snapshot integrity alone cannot admit tasks to proof scheduling")
          print("PITB_SORRYDB_REAL_SNAPSHOT_INTEGRITY_PASS")
          print(json.dumps({k: report[k] for k in expected}, sort_keys=True))
          PY

      - name: Retain synthetic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitb-sorrydb-integrity-report
          path: |
            ${{ runner.temp }}/sorrydb-integrity-report.synthetic.json
            ${{ runner.temp }}/sorrydb-task-receipt.synthetic.jsonl
            ${{ runner.temp }}/sorrydb-snapshot-integrity-report.json
            ${{ runner.temp }}/pitb-sorrydb-integrity/src/main.rs
            ${{ runner.temp }}/pitb-sorrydb-integrity/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
