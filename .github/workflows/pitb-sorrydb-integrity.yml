name: PITB SorryDB Integrity (Rust)

on:
  pull_request:
    paths:
      - "tools/pitb-sorrydb-integrity/**"
      - ".github/workflows/pitb-typed-graph-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sorrydb-integrity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/pitb-sorrydb-venv"
          "$RUNNER_TEMP/pitb-sorrydb-venv/bin/pip" install "jsonschema==4.25.1"

      - name: Stage isolated SorryDB auditor
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/pitb-sorrydb-integrity"
          mkdir -p "$staged/src" "$staged/schema" "$staged/fixtures"
          cp tools/pitb-sorrydb-integrity/Cargo.toml "$staged/Cargo.toml"
          cp tools/pitb-sorrydb-integrity/Cargo.lock "$staged/Cargo.lock"
          cp tools/pitb-sorrydb-integrity/src/main.rs "$staged/src/main.rs"
          cp tools/pitb-sorrydb-integrity/schema/*.json "$staged/schema/"
          cp tools/pitb-sorrydb-integrity/fixtures/*.json "$staged/fixtures/"
          echo "PITB_SORRYDB_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
          echo "PITB_SORRYDB_DIR=$staged" >> "$GITHUB_ENV"

      - name: Format and test isolated SorryDB auditor
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 "$PITB_SORRYDB_DIR/src/main.rs"
          cargo fmt --check --manifest-path "$PITB_SORRYDB_MANIFEST"
          cargo test --locked --manifest-path "$PITB_SORRYDB_MANIFEST"

      - name: Generate schema-checkable synthetic report
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$PITB_SORRYDB_MANIFEST" --             --self-test-report "$RUNNER_TEMP/sorrydb-integrity-report.json"

      - name: Validate source manifest and report schema
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-sorrydb-venv/bin/python" -             "$RUNNER_TEMP/sorrydb-integrity-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("tools/pitb-sorrydb-integrity")
          source = json.loads((root / "fixtures/sorrydb-2601-source-manifest.json").read_text())
          if source["source_repository_commit"] != "74b3b63f8ba890d675f362924b21ac55db410383":
              raise SystemExit("SorryDB source commit pin changed")
          if source["evaluation_split_git_blob_sha1"] != "af3b663429dc4689ee728d2fb5c7d8d5034476f7":
              raise SystemExit("SorryDB evaluation split blob pin changed")
          for name in (
              "sorrydb-task-snapshot-v0.schema.json",
              "sorrydb-proof-run-v0.schema.json",
              "sorrydb-integrity-report-v0.schema.json",
          ):
              schema = json.loads((root / "schema" / name).read_text())
              Draft202012Validator.check_schema(schema)
          schema = json.loads((root / "schema/sorrydb-integrity-report-v0.schema.json").read_text())
          report = json.loads(Path(sys.argv[1]).read_text())
          errors = list(Draft202012Validator(schema).iter_errors(report))
          if errors:
              raise SystemExit("SorryDB report schema errors: " + "; ".join(e.message for e in errors))
          if report["task_count"] != 1 or report["run_count"] != 2 or report["verified_success_count"] != 1:
              raise SystemExit("synthetic SorryDB task/run denominators changed")
          if report["source_file_digest_coverage"] != 1.0:
              raise SystemExit("synthetic source binding coverage changed")
          print("PITB_SORRYDB_INTEGRITY_SCHEMA_AND_REPORT_PASS")
          PY

      - name: Retain synthetic integrity report and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitb-sorrydb-integrity-report
          path: |
            ${{ runner.temp }}/sorrydb-integrity-report.json
            ${{ runner.temp }}/pitb-sorrydb-integrity/src/main.rs
            ${{ runner.temp }}/pitb-sorrydb-integrity/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
