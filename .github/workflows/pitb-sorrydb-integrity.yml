name: PITB SorryDB Benchmark Integrity

on:
  pull_request:
    paths:
      - "tools/pitb-sorrydb-integrity/**"
      - ".github/workflows/pitb-typed-graph-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sorrydb-integrity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/pitb-sorrydb-venv"
          "$RUNNER_TEMP/pitb-sorrydb-venv/bin/pip" install "jsonschema==4.25.1"

      - name: Stage isolated SorryDB validator
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/pitb-sorrydb-integrity"
          mkdir -p "$staged/src"
          cp tools/pitb-sorrydb-integrity/Cargo.toml "$staged/Cargo.toml"
          cp tools/pitb-sorrydb-integrity/Cargo.lock "$staged/Cargo.lock"
          cp tools/pitb-sorrydb-integrity/src/main.rs "$staged/src/main.rs"
          echo "PITB_SORRYDB_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
          echo "PITB_SORRYDB_DIR=$staged" >> "$GITHUB_ENV"

      - name: Format and test Rust validator
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 "$PITB_SORRYDB_DIR/src/main.rs"
          cargo fmt --check --manifest-path "$PITB_SORRYDB_MANIFEST"
          cargo test --locked --manifest-path "$PITB_SORRYDB_MANIFEST"

      - name: Generate synthetic report through Git blob verifier
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$PITB_SORRYDB_MANIFEST" -- \
            --self-test-report "$RUNNER_TEMP/sorrydb-integrity-report.synthetic.json" "$RUNNER_TEMP/sorrydb-task-receipt.synthetic.jsonl"

      - name: Validate provenance, receipt and report schemas
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-sorrydb-venv/bin/python" - "$RUNNER_TEMP/sorrydb-integrity-report.synthetic.json" "$RUNNER_TEMP/sorrydb-task-receipt.synthetic.jsonl" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("tools/pitb-sorrydb-integrity")
          names = (
              "sorrydb-snapshot-provenance-v0.schema.json",
              "sorrydb-task-reproduction-v0.schema.json",
              "sorrydb-integrity-report-v0.schema.json",
          )
          schemas = {}
          for name in names:
              schema = json.loads((root / "schema" / name).read_text())
              Draft202012Validator.check_schema(schema)
              schemas[name] = schema

          provenance = json.loads((root / "fixtures" / "sorrydb-2601-provenance.json").read_text())
          errors = list(Draft202012Validator(schemas[names[0]]).iter_errors(provenance))
          if errors:
              raise SystemExit("pinned SorryDB provenance schema errors: " + "; ".join(e.message for e in errors))

          receipt_lines = [line for line in Path(sys.argv[2]).read_text().splitlines() if line.strip()]
          if len(receipt_lines) != 1:
              raise SystemExit("synthetic task receipt denominator changed")
          receipt = json.loads(receipt_lines[0])
          errors = list(Draft202012Validator(schemas[names[1]]).iter_errors(receipt))
          if errors:
              raise SystemExit("synthetic SorryDB task receipt schema errors: " + "; ".join(e.message for e in errors))

          report = json.loads(Path(sys.argv[1]).read_text())
          errors = list(Draft202012Validator(schemas[names[2]]).iter_errors(report))
          if errors:
              raise SystemExit("synthetic SorryDB report schema errors: " + "; ".join(e.message for e in errors))
          if report["database_task_count"] != 2 or report["evaluation_task_count"] != 1:
              raise SystemExit("synthetic SorryDB denominators changed")
          if report["reproducible_task_count"] != 1 or report["scheduler_admission"] is not False:
              raise SystemExit("SorryDB reproduction/trust boundary changed")
          print("PITB_SORRYDB_PROVENANCE_AND_REPORT_SCHEMA_PASS")
          PY

      - name: Retain synthetic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitb-sorrydb-integrity-report
          path: |
            ${{ runner.temp }}/sorrydb-integrity-report.synthetic.json
            ${{ runner.temp }}/sorrydb-task-receipt.synthetic.jsonl
            ${{ runner.temp }}/pitb-sorrydb-integrity/src/main.rs
            ${{ runner.temp }}/pitb-sorrydb-integrity/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
