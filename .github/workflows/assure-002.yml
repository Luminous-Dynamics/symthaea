name: ASSURE-002 Qualification

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-assurance-campaign/**'
      - 'crates/core/symthaea-assurance-subject/**'
      - 'crates/core/symthaea-assurance-core/**'
      - 'Cargo.lock'
      - '.github/workflows/assure-002.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assure-002-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.96.0
          rustc --version --verbose
          cargo --version
      - name: Prove exact candidate subject
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$EXPECTED_HEAD" "$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          git diff --exit-code
      - name: Format
        run: cargo fmt --manifest-path crates/core/symthaea-assurance-campaign/Cargo.toml -- --check
      - name: Check and expose lock reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/core/symthaea-assurance-campaign/Cargo.toml
          git diff -- Cargo.lock || true
      - name: Capture reconciled lock evidence
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/assure-002-lock
          cp Cargo.lock target/assure-002-lock/Cargo.lock
          LOCK_SHA256="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          {
            printf 'candidate_head=%s\n' "$EXPECTED_HEAD"
            printf 'lock_sha256=%s\n' "$LOCK_SHA256"
            rustc --version
            cargo --version
          } > target/assure-002-lock/MANIFEST.txt
          cat target/assure-002-lock/MANIFEST.txt
      - name: Upload reconciled lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assure-002-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/assure-002-lock/
          if-no-files-found: error
          retention-days: 7
      - name: Test
        run: cargo test --manifest-path crates/core/symthaea-assurance-campaign/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path crates/core/symthaea-assurance-campaign/Cargo.toml --all-targets -- -D warnings
      - name: Require committed lock parity
        shell: bash
        run: |
          set -euo pipefail
          git diff -- Cargo.lock
          git diff --exit-code -- Cargo.lock
      - name: Prove tracked checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  capture-rustfmt:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install exact formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update
          rustup override set 1.96.0
          rustfmt --version
      - name: Produce deterministic formatter output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/core/symthaea-assurance-campaign/Cargo.toml
          git diff --check
          git diff --name-only
          mkdir -p target/assure-002-rustfmt/crates/core/symthaea-assurance-campaign/src
          mkdir -p target/assure-002-rustfmt/crates/core/symthaea-assurance-campaign/tests
          cp crates/core/symthaea-assurance-campaign/src/lib.rs target/assure-002-rustfmt/crates/core/symthaea-assurance-campaign/src/lib.rs
          cp crates/core/symthaea-assurance-campaign/tests/assure002.rs target/assure-002-rustfmt/crates/core/symthaea-assurance-campaign/tests/assure002.rs
          git diff > target/assure-002-rustfmt/rustfmt.diff
      - name: Upload formatter repair artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assure-002-rustfmt-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/assure-002-rustfmt/
          if-no-files-found: error
          retention-days: 1

  apply-rustfmt-parent:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/assure-002-preregistration
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact unformatted source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/core/symthaea-assurance-campaign/src/lib.rs)" = "a47191a2d627da34743eaf595daad467a98fb27c"
          test "$(git hash-object crates/core/symthaea-assurance-campaign/tests/assure002.rs)" = "9823e28bf8f4525d7cebec4defaa4e71744156ac"
          test -z "$(git status --porcelain)"
      - name: Install exact formatter only
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update
          rustup override set 1.96.0
          rustfmt --version
      - name: Reproduce reviewed formatter outputs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/core/symthaea-assurance-campaign/Cargo.toml
          test "$(sha256sum crates/core/symthaea-assurance-campaign/src/lib.rs | cut -d' ' -f1)" = "997f0c3974fe309b98acde96bdc97c6dab9b48ff4c27f5d87f5308ed20ced0c9"
          test "$(sha256sum crates/core/symthaea-assurance-campaign/tests/assure002.rs | cut -d' ' -f1)" = "92880d555e1520aa4873fc5d0d1bda0b795f5a846d66c6fa0ba0e4c06b43af55"
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' 'crates/core/symthaea-assurance-campaign/src/lib.rs' 'crates/core/symthaea-assurance-campaign/tests/assure002.rs' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --check
      - name: Commit exact formatter repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/symthaea-assurance-campaign/src/lib.rs crates/core/symthaea-assurance-campaign/tests/assure002.rs
          git commit -m "style(assurance): apply Rust 1.96 formatting"
          git push origin HEAD:feat/assure-002-preregistration
