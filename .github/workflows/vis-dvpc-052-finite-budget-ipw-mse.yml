name: VIS-DVPC-052 finite-budget IPW MSE under support truncation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/vision-dvpc-052-finite-budget-ipw-mse.rs"
      - "docs/research/VIS_DVPC_052_FINITE_BUDGET_IPW_MSE_V0.md"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-052-finite-budget-ipw-mse.rs"
      - "docs/research/VIS_DVPC_052_FINITE_BUDGET_IPW_MSE_V0.md"
      - ".github/workflows/vis-dvpc-052-finite-budget-ipw-mse.yml"

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact VIS-DVPC-052 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Compile and run finite-N known-answer tests
        run: |
          rustc --edition=2024 -O --test tools/vision-dvpc-052-finite-budget-ipw-mse.rs -o /tmp/vis-dvpc-052-tests
          /tmp/vis-dvpc-052-tests
      - name: Verify deterministic smoke and row schema
        run: |
          rustc --edition=2024 -O tools/vision-dvpc-052-finite-budget-ipw-mse.rs -o /tmp/vis-dvpc-052
          /tmp/vis-dvpc-052 --smoke > /tmp/vis-dvpc-052-smoke-a.tsv
          /tmp/vis-dvpc-052 --smoke > /tmp/vis-dvpc-052-smoke-b.tsv
          cmp /tmp/vis-dvpc-052-smoke-a.tsv /tmp/vis-dvpc-052-smoke-b.tsv
          awk -F '\t' '$1 == "RESULT" { if (NF != 17 || $6 < 0 || $6 > 1 || $7 < 0 || $7 > 1 || $8 < 0 || $8 > 1 || $10 < 0 || $11 < 0 || $12 < 0 || $13 < 0 || $13 > 1 || $14 < 0 || $14 > $3 || $16 != "true" || $17 < 1) bad=1; if ($5 == "full_support" && ($15 != "true" || $11 > 0.0000000001 || $13 > 0.0000000001)) bad=1; n++ } END { if (n != 108 || bad) exit 1 }' /tmp/vis-dvpc-052-smoke-a.tsv
          test "$(grep -c '^BENCHMARK_CONFIG' /tmp/vis-dvpc-052-smoke-a.tsv)" = "6"
      - name: Run full finite-budget MSE frontier
        run: |
          /tmp/vis-dvpc-052 > /tmp/vis-dvpc-052-full.tsv
          awk -F '\t' '$1 == "RESULT" { if (NF != 17 || $6 < 0 || $6 > 1 || $7 < 0 || $7 > 1 || $8 < 0 || $8 > 1 || $10 < 0 || $11 < 0 || $12 < 0 || $13 < 0 || $13 > 1 || $14 < 0 || $14 > $3 || $16 != "true" || $17 < 1) bad=1; if ($5 == "full_support" && ($15 != "true" || $11 > 0.0000000001 || $13 > 0.0000000001)) bad=1; n++ } END { if (n != 108 || bad) exit 1 }' /tmp/vis-dvpc-052-full.tsv
          awk -F '\t' '$1 == "RESULT" && $2 == "balanced" && $3 == 4 && $4 == 1 && $5 == "support_truncating_oracle" { if ($15 != "false" || $11 <= 0 || $13 <= 0) bad=1; n++ } END { if (n != 1 || bad) exit 1 }' /tmp/vis-dvpc-052-full.tsv
          awk -F '\t' '$1 == "RESULT" && $2 == "balanced" && $3 == 4 && $4 == 1024 && $5 == "support_truncating_oracle" { if ($15 != "true" || $11 > 0.0000000001 || $13 > 0.0000000001) bad=1; n++ } END { if (n != 1 || bad) exit 1 }' /tmp/vis-dvpc-052-full.tsv
          grep -F $'BENCHMARK_CONFIG\tid\tVIS-DVPC-052' /tmp/vis-dvpc-052-full.tsv
      - name: Create exact-source and output SHA-256 receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          {
            printf 'VIS_DVPC_052_RECEIPT\tformat\tv1\n'
            printf 'commit_sha\t%s\n' "$EXPECTED_HEAD"
            printf 'rustc\t%s\n' "$(rustc --version)"
            sha256sum tools/vision-dvpc-052-finite-budget-ipw-mse.rs docs/research/VIS_DVPC_052_FINITE_BUDGET_IPW_MSE_V0.md /tmp/vis-dvpc-052-smoke-a.tsv /tmp/vis-dvpc-052-full.tsv
          } > /tmp/vis-dvpc-052-receipt.tsv
          cat /tmp/vis-dvpc-052-receipt.tsv
      - name: Publish results and receipt
        uses: actions/upload-artifact@v4
        with:
          name: vis-dvpc-052-finite-budget-ipw-mse
          path: |
            /tmp/vis-dvpc-052-smoke-a.tsv
            /tmp/vis-dvpc-052-full.tsv
            /tmp/vis-dvpc-052-receipt.tsv
          retention-days: 90
