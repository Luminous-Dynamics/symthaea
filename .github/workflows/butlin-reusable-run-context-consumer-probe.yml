name: Butlin Reusable Run Context Consumer Probe

on:
  workflow_call:
    inputs:
      expected_run_id:
        required: true
        type: string
      expected_run_attempt:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
    outputs:
      observed_run_id:
        value: ${{ jobs.consume.outputs.observed_run_id }}
      observed_run_attempt:
        value: ${{ jobs.consume.outputs.observed_run_attempt }}
      observed_workflow_sha:
        value: ${{ jobs.consume.outputs.observed_workflow_sha }}
      producer_workflow_sha:
        value: ${{ jobs.consume.outputs.producer_workflow_sha }}
      attestation_verified:
        value: ${{ jobs.consume.outputs.attestation_verified }}

permissions: {}

jobs:
  consume:
    name: Consume and verify exact-run attested probe artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      observed_run_id: ${{ steps.verify.outputs.observed_run_id }}
      observed_run_attempt: ${{ steps.verify.outputs.observed_run_attempt }}
      observed_workflow_sha: ${{ steps.verify.outputs.observed_workflow_sha }}
      producer_workflow_sha: ${{ steps.verify.outputs.producer_workflow_sha }}
      attestation_verified: ${{ steps.verify.outputs.attestation_verified }}
    steps:
      - name: Validate reusable consumer identity
        id: observe
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.expected_run_attempt }}
          OBSERVED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          OBSERVED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          OBSERVED_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$OBSERVED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$GITHUB_RUN_ATTEMPT" = "$EXPECTED_RUN_ATTEMPT"
          test "$OBSERVED_WORKFLOW_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$OBSERVED_WORKFLOW_PATH" = ".github/workflows/butlin-reusable-run-context-consumer-probe.yml"

      - name: Install frozen GitHub CLI attestation verifier
        id: trusted_gh
        shell: bash
        env:
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_BINARY_SHA256: "553949e2efa12842771efe6012aa4de21f1d591530ec17fc435f610f10e017ee"
          TRUSTED_GH_VERSION_OUTPUT_SHA256: "2ec8b2f6e0e8e915f7e0c8d7b14b77fe93e33225872ea1d98041228950c620a9"
          TRUSTED_GH_ROOT: ${{ runner.temp }}/butlin-probe-trusted-gh
          TRUSTED_GH_CONFIG_DIR: ${{ runner.temp }}/butlin-probe-trusted-gh-config
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          rm -rf "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          mkdir -p "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          chmod 0700 "$TRUSTED_GH_CONFIG_DIR"
          archive="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$TRUSTED_GH_ARCHIVE_URL"
          printf '%s  %s\n' "$TRUSTED_GH_ARCHIVE_SHA256" "$archive" | /usr/bin/sha256sum -c -
          /usr/bin/tar --no-same-owner -xzf "$archive" -C "$TRUSTED_GH_ROOT"
          gh_path="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64/bin/gh"
          test -f "$gh_path"
          test ! -L "$gh_path"
          test -x "$gh_path"
          version_output="$($gh_path --version)"
          test "$(printf '%s\n' "$version_output" | /usr/bin/awk 'NR==1{print $3}')" = "$TRUSTED_GH_VERSION"
          test "$(/usr/bin/sha256sum "$gh_path" | /usr/bin/awk '{print $1}')" = "$TRUSTED_GH_BINARY_SHA256"
          test "$(printf '%s' "$version_output" | /usr/bin/sha256sum | /usr/bin/awk '{print $1}')" = "$TRUSTED_GH_VERSION_OUTPUT_SHA256"
          echo "gh_path=$gh_path" >> "$GITHUB_OUTPUT"
          echo "config_dir=$TRUSTED_GH_CONFIG_DIR" >> "$GITHUB_OUTPUT"

      - name: Download producer artifact from exact caller run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.expected_run_id }}
          path: ${{ runner.temp }}/butlin-reusable-run-context-consumer

      - name: Verify shared run context, producer identity, and attestation signer
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ steps.trusted_gh.outputs.config_dir }}
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.expected_run_attempt }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXPECTED_SIGNER_SHA: ${{ job.workflow_sha }}
          OBSERVED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          unset GH_HOST GH_ENTERPRISE_TOKEN
          root="$RUNNER_TEMP/butlin-reusable-run-context-consumer"
          payload="$root/payload.json"
          bundle="$root/attestation.json"
          verification="$root/verification.json"
          test -s "$payload"
          test -s "$bundle"
          [[ "$EXPECTED_SIGNER_SHA" =~ ^[0-9a-f]{40}$ ]]
          expected_name="butlin-reusable-run-context-${EXPECTED_RUN_ID}-${EXPECTED_RUN_ATTEMPT}"
          test "$EXPECTED_ARTIFACT_NAME" = "$expected_name"
          /usr/bin/jq -e \
            --arg run_id "$EXPECTED_RUN_ID" \
            --arg run_attempt "$EXPECTED_RUN_ATTEMPT" \
            --arg workflow_sha "$EXPECTED_SIGNER_SHA" \
            '.schema=="butlin-reusable-run-context-producer-v2" and .run_id==$run_id and .run_attempt==$run_attempt and .workflow_sha==$workflow_sha and .workflow_repository=="Luminous-Dynamics/symthaea" and .workflow_path==".github/workflows/butlin-reusable-run-context-producer-probe.yml" and .payload=="fixed-attested-platform-probe-v2"' \
            "$payload" >/dev/null

          "$TRUSTED_GH_PATH" attestation verify "$payload" --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-reusable-run-context-producer-probe.yml" \
            --signer-digest "$EXPECTED_SIGNER_SHA" \
            --deny-self-hosted-runners --format json > "$verification"
          test -s "$verification"

          producer_sha="$(/usr/bin/jq -r '.workflow_sha' "$payload")"
          test "$producer_sha" = "$EXPECTED_SIGNER_SHA"
          echo "observed_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "observed_run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "observed_workflow_sha=$OBSERVED_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "producer_workflow_sha=$producer_sha" >> "$GITHUB_OUTPUT"
          echo "attestation_verified=true" >> "$GITHUB_OUTPUT"
