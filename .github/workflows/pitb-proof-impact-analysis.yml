name: PITB Proof Impact Analysis

on:
  pull_request:
    paths:
      - "tools/pitb-proof-impact/**"
      - "docs/research/pitb-change-impact-proof-maintenance-v0.1.md"
      - ".github/workflows/pitb-proof-impact-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-impact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/pitb-impact-venv"
          "$RUNNER_TEMP/pitb-impact-venv/bin/pip" install "jsonschema==4.25.1"

      - name: Stage isolated analyzer outside production workspace
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/pitb-proof-impact"
          mkdir -p "$staged/src"
          cp tools/pitb-proof-impact/Cargo.toml "$staged/Cargo.toml"
          cp tools/pitb-proof-impact/Cargo.lock "$staged/Cargo.lock"
          cp tools/pitb-proof-impact/src/main.rs "$staged/src/main.rs"
          echo "PITB_PROOF_IMPACT_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
          echo "PITB_PROOF_IMPACT_DIR=$staged" >> "$GITHUB_ENV"

      - name: Format and verify the isolated Rust analyzer
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 "$PITB_PROOF_IMPACT_DIR/src/main.rs"
          cargo fmt --check --manifest-path "$PITB_PROOF_IMPACT_MANIFEST"
          cargo test --locked --manifest-path "$PITB_PROOF_IMPACT_MANIFEST"

      - name: Run analyzer self-tests
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$PITB_PROOF_IMPACT_MANIFEST" -- --self-test

      - name: Validate snapshot and report JSON Schemas
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-impact-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("tools/pitb-proof-impact")
          old = json.loads((root / "fixtures/old-snapshot.synthetic.json").read_text())
          new = json.loads((root / "fixtures/new-snapshot.synthetic.json").read_text())
          snap_schema = json.loads((root / "schema/proof-impact-snapshot-v0.schema.json").read_text())
          report_schema = json.loads((root / "schema/proof-impact-report-v0.schema.json").read_text())
          Draft202012Validator.check_schema(snap_schema)
          Draft202012Validator.check_schema(report_schema)
          for label, value in (("old", old), ("new", new)):
              errors = list(Draft202012Validator(snap_schema).iter_errors(value))
              if errors:
                  raise SystemExit(f"{label} snapshot schema errors: " + "; ".join(e.message for e in errors))
          print("PITB_PROOF_IMPACT_SNAPSHOT_SCHEMA_PASS")
          PY

      - name: Analyze the registered before/after fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$PITB_PROOF_IMPACT_MANIFEST" -- \
            tools/pitb-proof-impact/fixtures/old-snapshot.synthetic.json \
            tools/pitb-proof-impact/fixtures/new-snapshot.synthetic.json \
            "$RUNNER_TEMP/pitb-proof-impact-report.json"

          "$RUNNER_TEMP/pitb-impact-venv/bin/python" - "$RUNNER_TEMP/pitb-proof-impact-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("tools/pitb-proof-impact/schema")
          schema = json.loads((root / "proof-impact-report-v0.schema.json").read_text())
          report = json.loads(Path(sys.argv[1]).read_text())
          errors = list(Draft202012Validator(schema).iter_errors(report))
          if errors:
              raise SystemExit("impact report schema errors: " + "; ".join(e.message for e in errors))
          actions = {row["node_id"]: row["action"] for row in report["impacts"]}
          expected = {
              "helper": "reprove",
              "root": "reprove",
              "consumer": "revalidate",
              "transparent": "reprove",
              "doc": "retrieval_refresh",
          }
          for node, action in expected.items():
              if actions.get(node) != action:
                  raise SystemExit(f"{node}: expected {action}, got {actions.get(node)}")
          if report["conservative_mode"] or not report["dependency_inventory_complete"]:
              raise SystemExit("complete synthetic fixture unexpectedly entered conservative mode")
          if any(action == "unknown_conservative" for action in actions.values()):
              raise SystemExit("synthetic fixture unexpectedly contains unknown impact")
          print("PITB_PROOF_IMPACT_FIXTURE_PASS")
          print(json.dumps(report["action_counts"], sort_keys=True))
          PY

      - name: Retain synthetic impact report and formatted source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitb-proof-impact-report
          path: |
            ${{ runner.temp }}/pitb-proof-impact-report.json
            ${{ runner.temp }}/pitb-proof-impact/src/main.rs
            ${{ runner.temp }}/pitb-proof-impact/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
