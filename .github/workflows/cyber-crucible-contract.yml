name: Cyber Crucible Public Contract

on:
  pull_request:
    paths:
      - "validation/cyber_crucible_public_v1.json"
      - "validation/cyber_crucible_public_v1.schema.json"
      - "validation/CYBER_CRUCIBLE_PUBLIC_CALIBRATION.md"
      - "scripts/validate_cyber_crucible_public.py"
      - "tests/test_cyber_crucible_public.py"
      - ".github/workflows/cyber-crucible-contract.yml"
  push:
    branches: [main]
    paths:
      - "validation/cyber_crucible_public_v1.json"
      - "validation/cyber_crucible_public_v1.schema.json"
      - "validation/CYBER_CRUCIBLE_PUBLIC_CALIBRATION.md"
      - "scripts/validate_cyber_crucible_public.py"
      - "tests/test_cyber_crucible_public.py"
      - ".github/workflows/cyber-crucible-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-contract:
    name: Manifest contract and fail-closed regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Check JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("validation/cyber_crucible_public_v1.json"),
              Path("validation/cyber_crucible_public_v1.schema.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY

      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate corpus against its JSON Schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("validation/cyber_crucible_public_v1.schema.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("validation/cyber_crucible_public_v1.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema).iter_errors(manifest), key=lambda error: list(error.absolute_path))
          if errors:
              for error in errors:
                  print(f"{'/'.join(map(str, error.absolute_path))}: {error.message}")
              raise SystemExit(f"JSON Schema validation failed with {len(errors)} error(s)")
          print(f"JSON Schema PASS: {manifest['corpus_id']} revision {manifest['revision']}")
          PY

      - name: Validate scenario identities, evidence, and scoring policy
        run: python3 scripts/validate_cyber_crucible_public.py

      - name: Exercise fail-closed contract regressions
        run: python3 -m unittest discover -s tests -p "test_cyber_crucible_public.py" -v
