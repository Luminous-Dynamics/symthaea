name: VIS-DVPC-040 MOPE sufficient-statistic identity audit

on:
  pull_request:
    paths:
      - "tools/vision-dvpc-040-mope-sufficient-stats.rs"
      - "docs/research/VIS_DVPC_040_MOPE_SUFFICIENT_STATS_V1.md"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-040-mope-sufficient-stats.rs"
      - "docs/research/VIS_DVPC_040_MOPE_SUFFICIENT_STATS_V1.md"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact stream and parent optimizer kernel
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Compile and run all Rust tests
        run: |
          rustc --edition=2024 -O --test tools/vision-dvpc-040-mope-sufficient-stats.rs -o /tmp/vis-dvpc-040-tests
          /tmp/vis-dvpc-040-tests
      - name: Run exact coefficient-identity sweep
        run: |
          rustc --edition=2024 -O tools/vision-dvpc-040-mope-sufficient-stats.rs -o /tmp/vis-dvpc-040
          /tmp/vis-dvpc-040 --sweep > /tmp/vis-dvpc-040-results.tsv
          test "$(grep -c '^IDENTITY' /tmp/vis-dvpc-040-results.tsv)" = "378"
          test "$(grep -c '^POLYNOMIAL' /tmp/vis-dvpc-040-results.tsv)" = "90"
          if grep -q '^ROOT_DIAGNOSTIC' /tmp/vis-dvpc-040-results.tsv; then grep -Fq 'ROOT_DIAGNOSTIC' /tmp/vis-dvpc-040-results.tsv; fi
          test "$(grep -c '^BET' /tmp/vis-dvpc-040-results.tsv)" = "36"
          test "$(grep -c '^SEQUENCE' /tmp/vis-dvpc-040-results.tsv)" = "8"
          grep -Fq $'SEQUENCE\tunit_weights\t4\t-\tprobability_or_coverage_claim\tNOT_EVALUATED' /tmp/vis-dvpc-040-results.tsv
          grep -Fq $'SEQUENCE\thigh_weight\t5\t-\tstate_count' /tmp/vis-dvpc-040-results.tsv
          grep -Fq 'O(1)' /tmp/vis-dvpc-040-results.tsv
          awk -F '\t' '$1=="BET" && $5=="lambda2" { if ($6 < -0.000000001 || $6 > 0.500000001) exit 1; n++ } END { if (n != 18) exit 1 }' /tmp/vis-dvpc-040-results.tsv
          grep '^SEQUENCE' /tmp/vis-dvpc-040-results.tsv > /tmp/vis-dvpc-040-summaries.tsv
      - name: Emit exact source and result receipt
        run: |
          {
            printf 'VIS_DVPC_040_RECEIPT\tformat\tv1\n'
            printf 'commit_sha\t%s\n' "$GITHUB_SHA"
            printf 'rustc\t%s\n' "$(rustc --version)"
            sha256sum tools/vision-dvpc-040-mope-sufficient-stats.rs tools/vision-dvpc-039-mope-bet-optimizer.rs /tmp/vis-dvpc-040-results.tsv /tmp/vis-dvpc-040-summaries.tsv
          } > /tmp/vis-dvpc-040-receipt.tsv
          cat /tmp/vis-dvpc-040-receipt.tsv
      - name: Publish identity report and receipt
        uses: actions/upload-artifact@v4
        with:
          name: vis-dvpc-040-mope-sufficient-stats
          path: |
            /tmp/vis-dvpc-040-results.tsv
            /tmp/vis-dvpc-040-summaries.tsv
            /tmp/vis-dvpc-040-receipt.tsv
          retention-days: 90
