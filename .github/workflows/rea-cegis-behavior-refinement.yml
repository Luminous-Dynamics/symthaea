name: REA CEGIS Behavioral Refinement

on:
  push:
    branches:
      - "research/rea-cegis-behavior-refinement-v0.1"
    paths:
      - ".github/workflows/rea-cegis-behavior-refinement.yml"
      - "tools/rea-cegis-behavior-refinement/**"
  pull_request:
    paths:
      - ".github/workflows/rea-cegis-behavior-refinement.yml"
      - "tools/rea-cegis-behavior-refinement/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-cegis-behavior-refinement-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  finite-kernel:
    name: Qualify finite-domain behavioral refinement kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Verify exact revision and lockfile
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          rustc --version --verbose
          cargo --version
          sha256sum tools/rea-cegis-behavior-refinement/Cargo.lock

      - name: Check formatting
        run: cargo fmt --manifest-path tools/rea-cegis-behavior-refinement/Cargo.toml -- --check

      - name: Assert unit-test discovery
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/rea-cegis-behavior-refinement/Cargo.toml --locked --lib -- --list > /tmp/rea-cegis-tests.txt
          discovered_count="$(awk '/: test$/ { count++ } END { print count + 0 }' /tmp/rea-cegis-tests.txt)"
          echo "Discovered ${discovered_count} REA CEGIS tests"
          test "${discovered_count}" -ge 11 || {
            echo "ERROR: expected at least 11 finite-kernel tests"
            exit 1
          }

      - name: Execute finite-kernel tests
        run: cargo test --manifest-path tools/rea-cegis-behavior-refinement/Cargo.toml --locked --lib -- --nocapture

      - name: Warnings-denied Clippy
        run: cargo clippy --manifest-path tools/rea-cegis-behavior-refinement/Cargo.toml --locked --all-targets -- -D warnings
