name: FEP Agent Live Snapshot

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/core/symthaea-fep/Cargo.toml"
      - "crates/core/symthaea-fep/src/agent.rs"
      - "crates/core/symthaea-fep/src/agent/live_snapshot.rs"
      - "crates/core/symthaea-fep/src/agent_snapshot.rs"
      - "crates/core/symthaea-fep/src/free_energy.rs"
      - "crates/core/symthaea-fep/src/generative_model.rs"
      - "crates/core/symthaea-fep/src/td_learning.rs"
      - "crates/core/symthaea-fep/src/types.rs"
      - ".github/workflows/fep-agent-live-snapshot.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  qualify:
    name: ActiveInferenceAgent exact-resume theorem
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Record source identities
        run: |
          echo "git_sha=$(git rev-parse HEAD)"
          sha256sum Cargo.lock
          sha256sum crates/core/symthaea-fep/src/agent.rs
          sha256sum crates/core/symthaea-fep/src/agent/live_snapshot.rs
          sha256sum crates/core/symthaea-fep/src/agent_snapshot.rs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: fep-agent-live-snapshot

      - name: Check FEP formatting
        run: cargo fmt -p symthaea-fep -- --check

      - name: Check FEP targets
        run: cargo check --locked -p symthaea-fep --all-targets

      - name: Test serialized split-run exact continuation
        run: cargo test --locked -p symthaea-fep serialized_validated_restore_preserves_exact_future_agent_state

      - name: Test stochastic action-stream continuation
        run: cargo test --locked -p symthaea-fep stochastic_action_stream_is_preserved_by_restore

      - name: Test snapshot validator
        run: 'cargo test --locked -p symthaea-fep agent_snapshot::'

      - name: Test complete FEP package
        run: cargo test --locked -p symthaea-fep

      - name: Strict package-local Clippy
        run: cargo clippy --locked -p symthaea-fep --all-targets --no-deps -- -D warnings

      - name: Freeze live-agent restore theorem
        shell: bash
        run: |
          set -euo pipefail
          bridge="crates/core/symthaea-fep/src/agent/live_snapshot.rs"
          agent="crates/core/symthaea-fep/src/agent.rs"
          contract="crates/core/symthaea-fep/src/agent_snapshot.rs"

          grep -q 'mod live_snapshot;' "$agent"
          grep -q 'pub fn snapshot_v1(&self) -> ActiveInferenceAgentSnapshotV1' "$bridge"
          grep -q 'pub fn from_validated_snapshot_v1(snapshot: &ValidatedActiveInferenceAgentSnapshotV1)' "$bridge"
          grep -q 'timestamp: self.timestamp' "$bridge"
          grep -q 'rng_state: self.rng_state' "$bridge"
          grep -q 'timestamp: snapshot.timestamp' "$bridge"
          grep -q 'rng_state: snapshot.rng_state' "$bridge"
          grep -q 'serialized_validated_restore_preserves_exact_future_agent_state' "$bridge"
          grep -q 'stochastic_action_stream_is_preserved_by_restore' "$bridge"
          grep -q 'ZeroRngState' "$contract"
          grep -q 'TimestampPerceptionMismatch' "$contract"

          python3 - <<'PY'
          from pathlib import Path

          agent = Path('crates/core/symthaea-fep/src/agent.rs').read_text()
          if agent.count('mod live_snapshot;') != 1:
              raise SystemExit('agent live snapshot child module seam drifted')

          bridge = Path('crates/core/symthaea-fep/src/agent/live_snapshot.rs').read_text()
          snapshot = bridge.split('pub fn snapshot_v1', 1)[1].split('pub fn from_validated_snapshot_v1', 1)[0]
          restore = bridge.split('pub fn from_validated_snapshot_v1', 1)[1].split('#[cfg(test)]', 1)[0]

          required = [
              'config', 'belief', 'previous_state', 'last_action', 'model',
              'free_energy_calc', 'precision', 'efe_computer', 'td_learner',
              'last_fe_components', 'stats', 'timestamp', 'rng_state'
          ]
          for field in required:
              if f'{field}:' not in snapshot:
                  raise SystemExit(f'snapshot omits causal field {field}')
              if f'{field}:' not in restore:
                  raise SystemExit(f'restore omits causal field {field}')

          if 'ActiveInferenceAgentSnapshotV1' in restore.split('snapshot:', 1)[0]:
              raise SystemExit('raw snapshot type became accepted restore authority')
          PY

      - name: Freeze claim boundary
        shell: bash
        run: |
          set -euo pipefail
          bridge="crates/core/symthaea-fep/src/agent/live_snapshot.rs"
          ! grep -q 'OrganismSnapshotV1' "$bridge"
          ! grep -q 'PopulationSnapshotV1' "$bridge"
          ! grep -q 'PopulationExecutionCapsuleV1' "$bridge"

      - name: Write qualification metadata
        run: |
          mkdir -p target/fep-agent-live-snapshot-evidence
          {
            echo "authority=active_inference_agent_live_snapshot_v1"
            echo "git_sha=$(git rev-parse HEAD)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "bridge_source_sha256=$(sha256sum crates/core/symthaea-fep/src/agent/live_snapshot.rs | cut -d' ' -f1)"
            echo "snapshot_source_sha256=$(sha256sum crates/core/symthaea-fep/src/agent_snapshot.rs | cut -d' ' -f1)"
            echo "serialized_validated_restore=true"
            echo "stochastic_rng_continuation_tested=true"
            echo "full_fep_agent_future_equivalence_candidate=true"
            echo "markov_boundary_live_restore=false"
            echo "organism_live_restore=false"
            echo "population_execution_resume_established=false"
          } > target/fep-agent-live-snapshot-evidence/qualification.txt

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: fep-agent-live-snapshot-evidence
          path: target/fep-agent-live-snapshot-evidence/qualification.txt
          if-no-files-found: error
