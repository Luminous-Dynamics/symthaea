name: Melothaea action-effect receipt ledger

on:
  pull_request:
    paths:
      - "tools/mel-action-effect-ledger/**"
      - ".github/workflows/mel-action-effect-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-action-effect-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Stage isolated crate outside repository workspace
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-action-effect-ledger"
          mkdir -p "$staged/src"
          cp tools/mel-action-effect-ledger/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-action-effect-ledger/Cargo.lock "$staged/Cargo.lock"
          cp tools/mel-action-effect-ledger/src/lib.rs "$staged/src/lib.rs"
          echo "MEL_ACTION_EFFECT_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format isolated crate
        run: cargo fmt --check --manifest-path "$MEL_ACTION_EFFECT_MANIFEST"
      - name: Test action-effect receipt state machine
        run: cargo test --locked --manifest-path "$MEL_ACTION_EFFECT_MANIFEST"
