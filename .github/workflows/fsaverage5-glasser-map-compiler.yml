name: Fsaverage5 Glasser Map Compiler

on:
  pull_request:
    paths:
      - 'scripts/compile_fsaverage5_glasser_map.py'
      - 'scripts/test_compile_fsaverage5_glasser_map.py'
      - 'data/neuroscience/hcp_mmp1_area_order_v1.json'
      - 'docs/neuroscience/FSAVERAGE5_GLASSER_TRANSFORM_QUALIFICATION_V1.md'
      - '.github/workflows/fsaverage5-glasser-map-compiler.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify deterministic map compiler boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax contract
        run: |
          python -m py_compile \
            scripts/compile_fsaverage5_glasser_map.py \
            scripts/test_compile_fsaverage5_glasser_map.py

      - name: Mapping compiler contracts
        run: python -m unittest scripts/test_compile_fsaverage5_glasser_map.py

      - name: Canonical area namespace contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util

          script = Path('scripts/compile_fsaverage5_glasser_map.py')
          spec = importlib.util.spec_from_file_location('compiler', script)
          assert spec and spec.loader
          compiler = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(compiler)

          path = Path('data/neuroscience/hcp_mmp1_area_order_v1.json')
          areas, doc = compiler.load_area_order(path)
          assert len(areas) == 180
          assert len(set(areas)) == 180
          assert areas[:6] == ['V1', 'MST', 'V6', 'V2', 'V3', 'V4']
          assert areas[-2:] == ['a32pr', 'p24']
          assert doc['source']['commit'] == 'e3a33a5a50d4ca86ab8fbaa0407d6c3296fcab12'
          print(compiler.sha256_file(path))
          PY

      - name: CLI contract
        run: |
          python scripts/compile_fsaverage5_glasser_map.py --help
          python scripts/compile_fsaverage5_glasser_map.py compile --help
          python scripts/compile_fsaverage5_glasser_map.py validate --help
