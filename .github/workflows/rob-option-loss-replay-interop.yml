name: ROB Option-Loss Replay Interop Reference

on:
  push:
    branches:
      - research/rob-option-loss-replay-interop-stack-001
    paths:
      - "research/rob-causal-mission-replay-001/**"
      - ".github/workflows/rob-option-loss-replay-interop.yml"
  pull_request:
    branches:
      - research/rob-causal-mission-replay-001
    paths:
      - "research/rob-causal-mission-replay-001/**"
      - ".github/workflows/rob-option-loss-replay-interop.yml"

permissions:
  contents: read

jobs:
  option-loss-replay:
    name: Rust 1.96 format, tests and strict Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/rob-causal-mission-replay-001/Cargo.toml -- --check
      - name: Run deterministic tests
        run: cargo test --locked --manifest-path research/rob-causal-mission-replay-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/rob-causal-mission-replay-001/Cargo.toml --all-targets -- -D warnings
