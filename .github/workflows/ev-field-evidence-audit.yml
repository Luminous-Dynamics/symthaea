name: EV field evidence registry v0.1 audit

on:
  pull_request:
    paths:
      - "docs/transport/EV_FIELD_EVIDENCE_REGISTRY_V0_1.md"
      - "schemas/transport/ev_field_evidence_registry_entry_v0_1.schema.json"
      - "fixtures/ev_battery/field_evidence_registry_scenarios_v0_1.json"
      - "tools/ev-field-evidence-audit/**"
      - ".github/workflows/ev-field-evidence-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Check formatting
        run: cargo fmt --manifest-path tools/ev-field-evidence-audit/Cargo.toml -- --check
      - name: Run rights and task eligibility tests
        run: cargo test --manifest-path tools/ev-field-evidence-audit/Cargo.toml
      - name: Audit frozen field registry fixtures
        run: |
          cargo run --manifest-path tools/ev-field-evidence-audit/Cargo.toml -- --schema schemas/transport/ev_field_evidence_registry_entry_v0_1.schema.json --corpus fixtures/ev_battery/field_evidence_registry_scenarios_v0_1.json > "$RUNNER_TEMP/ev-field-evidence-report.json"
          jq -e '
            .case_count == 13 and
            .accepted_count == 5 and
            .rejected_count == 8 and
            (.report_sha256 | test("^[a-f0-9]{64}$"))
          ' "$RUNNER_TEMP/ev-field-evidence-report.json"
