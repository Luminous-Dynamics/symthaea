name: Symmetry discovery benchmark fixture validation

on:
  push:
    branches: [research/symm-qualification-benchmark-v0-1]
    paths:
      - "research/symmetry-discovery-benchmark-001/**"
      - ".github/workflows/symmetry-discovery-benchmark-fixtures.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "research/symmetry-discovery-benchmark-001/**"
      - ".github/workflows/symmetry-discovery-benchmark-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symmetry-discovery-benchmark-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fixtures:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate Draft 2020-12 schema and manifest
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/symmetry-discovery-benchmark-001")
          schema = json.loads((root / "schemas/case_manifest.schema.json").read_text())
          scorecard_schema = json.loads((root / "schemas/run_scorecard.schema.json").read_text())
          manifest = json.loads((root / "fixtures/v0.1/cases.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(manifest)
          Draft202012Validator.check_schema(scorecard_schema)
          PY
      - name: Validate exact group axioms, point stabilizers and polynomial invariance
        run: python3 -I research/symmetry-discovery-benchmark-001/tools/validate_fixtures.py
      - name: Self-test auditable benchmark scorecard validator
        run: python3 -I research/symmetry-discovery-benchmark-001/tools/validate_scorecard.py --self-test
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format independent Rust ground-truth oracle
        run: cargo fmt --manifest-path research/symmetry-discovery-benchmark-001/oracle/Cargo.toml --all -- --check
      - name: Run independent Rust exact oracle
        run: cargo test --locked --manifest-path research/symmetry-discovery-benchmark-001/oracle/Cargo.toml
      - name: Execute structural proposal audit smoke
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path research/symmetry-discovery-benchmark-001/oracle/Cargo.toml --bin audit_proposals -- research/symmetry-discovery-benchmark-001/fixtures/v0.1/proposal_smoke_input.json > "$RUNNER_TEMP/structural-proposal-audit.json"
          python3 - "$RUNNER_TEMP/structural-proposal-audit.json" <<'PY'
          import json
          import sys

          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          assert receipt["execution_status"] == "completed"
          rows = receipt["case_results"]
          assert len(rows) == 3
          assert sum(row["proposal_exact_match"] for row in rows) == 2
          chiral = next(row for row in rows if row["case_id"] == "C4-CHIRAL-ORBIT-001")
          assert chiral["false_exact_promotion"] is True
          assert chiral["false_promotion_elements"] == ["fanti", "fdiag", "fx", "fy"]
          assert chiral["group_axioms_satisfied"] is True
          assert all(row["audit_replayed"] for row in rows)
          print("STRUCTURAL_PROPOSAL_ORACLE_SMOKE_PASS: D4/C4/C1, four exact false promotions witnessed")
          PY
      - name: Execute regression proposal audit smoke
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path research/symmetry-discovery-benchmark-001/oracle/Cargo.toml --bin audit_proposals -- research/symmetry-discovery-benchmark-001/fixtures/v0.1/regression_proposal_smoke_input.json > "$RUNNER_TEMP/regression-proposal-audit.json"
          python3 - "$RUNNER_TEMP/regression-proposal-audit.json" <<'PY'
          import json
          import sys

          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          assert receipt["execution_status"] == "completed"
          rows = receipt["case_results"]
          assert len(rows) == 2
          assert all(row["proposal_exact_match"] for row in rows)
          assert all(not row["false_exact_promotion"] for row in rows)
          assert all(not row["false_elimination"] for row in rows)
          assert all(row["audit_replayed"] for row in rows)
          print("REGRESSION_PROPOSAL_ORACLE_SMOKE_PASS: D4 and C4 exact subgroup proposals")
          PY
      - name: Record oracle proposal smoke identities
        run: |
          set -euo pipefail
          sha256sum "$RUNNER_TEMP/structural-proposal-audit.json" "$RUNNER_TEMP/regression-proposal-audit.json" | tee "$RUNNER_TEMP/proposal-audit-receipts.sha256"
      - name: Record exact proposal audit evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/symmetry-proposal-audit-evidence"
          mkdir -p "$evidence"
          cp research/symmetry-discovery-benchmark-001/fixtures/v0.1/cases.json "$evidence/cases.json"
          cp research/symmetry-discovery-benchmark-001/fixtures/v0.1/proposal_smoke_input.json "$evidence/structural-proposal-input.json"
          cp research/symmetry-discovery-benchmark-001/fixtures/v0.1/regression_proposal_smoke_input.json "$evidence/regression-proposal-input.json"
          cp "$RUNNER_TEMP/structural-proposal-audit.json" "$evidence/structural-proposal-audit.json"
          cp "$RUNNER_TEMP/regression-proposal-audit.json" "$evidence/regression-proposal-audit.json"
          printf 'oracle_revision=%s\n' "$GITHUB_SHA" > "$evidence/identity.txt"
          printf 'rust_toolchain=1.96.0\n' >> "$evidence/identity.txt"
          sha256sum "$evidence"/*.json "$evidence/identity.txt" > "$evidence/SHA256SUMS"
      - name: Upload exact proposal audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: symmetry-proposal-audit-${{ github.sha }}
          path: ${{ runner.temp }}/symmetry-proposal-audit-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Strict Clippy for exact oracle
        run: cargo clippy --locked --manifest-path research/symmetry-discovery-benchmark-001/oracle/Cargo.toml --all-targets -- -D warnings
