name: Superconductivity Risk-Aware Multi-Resource Planner

on:
  pull_request:
    paths:
      - "tools/superconductivity-capability-plan-harness/**"
      - "data/schemas/superconductivity_risk_multiresource_v0_1.schema.json"
      - "data/research/superconductivity_risk_multiresource_fixture_v0_1.json"
      - "research/superconductivity/capability_experiment_planning/risk_multiresource/**"
      - ".github/workflows/superconductivity-risk-multiresource.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superconductivity-risk-multiresource-\${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  exact-risk-resource-audit:
    name: Exact CVaR-EVSI, resource feasibility and Rust qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Apply pinned Rust formatting
        run: cargo fmt --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --all

      - name: Verify canonical Rust formatting
        run: cargo fmt --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --all -- --check

      - name: Capture rustfmt-only patch
        if: always()
        run: |
          git diff --binary -- tools/superconductivity-capability-plan-harness > "$RUNNER_TEMP/sc-risk-rustfmt.patch"
          sha256sum "$RUNNER_TEMP/sc-risk-rustfmt.patch"
          git diff --stat -- tools/superconductivity-capability-plan-harness

      - name: Generate isolated lockfile
        run: cargo generate-lockfile --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml

      - name: Test all planner binaries
        run: cargo test --locked --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --bins

      - name: Run risk-aware multi-resource fixture audit
        run: |
          cargo run --locked --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --bin sc_risk_multiresource_audit -- \
            --schema data/schemas/superconductivity_risk_multiresource_v0_1.schema.json \
            --fixture data/research/superconductivity_risk_multiresource_fixture_v0_1.json \
            --out "$RUNNER_TEMP/sc-risk-multiresource-receipt.json"
          cat "$RUNNER_TEMP/sc-risk-multiresource-receipt.json"

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --bins -- -D warnings

      - name: Record exact-head identity and input digests
        if: always()
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "worktree_status=$(git status --short)"
            sha256sum data/schemas/superconductivity_risk_multiresource_v0_1.schema.json
            sha256sum data/research/superconductivity_risk_multiresource_fixture_v0_1.json
            sha256sum tools/superconductivity-capability-plan-harness/Cargo.toml
            sha256sum tools/superconductivity-capability-plan-harness/src/bin/sc_risk_multiresource_audit.rs
            sha256sum "$RUNNER_TEMP/sc-risk-multiresource-receipt.json"
            if [ -f tools/superconductivity-capability-plan-harness/Cargo.lock ]; then
              sha256sum tools/superconductivity-capability-plan-harness/Cargo.lock
            else
              echo "cargo_lock=not-generated"
            fi
          } > "$RUNNER_TEMP/sc-risk-multiresource-environment.txt"

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-risk-multiresource-exact-run-evidence
          if-no-files-found: warn
          path: |
            tools/superconductivity-capability-plan-harness/Cargo.lock
            \${{ runner.temp }}/sc-risk-multiresource-environment.txt
            \${{ runner.temp }}/sc-risk-multiresource-receipt.json
            \${{ runner.temp }}/sc-risk-rustfmt.patch
