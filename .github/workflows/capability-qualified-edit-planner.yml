name: Capability-qualified edit planner

on:
  pull_request:
    paths:
      - "tools/capability-qualified-edit-planner/**"
      - "docs/research/CAPABILITY_QUALIFIED_EDIT_PLANNER_V1.md"
      - ".github/workflows/capability-qualified-edit-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-qualified-edit-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "CQEP_REVISION=$actual" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format-check plan compiler
        run: cargo +1.96.0 fmt --check --manifest-path tools/capability-qualified-edit-planner/Cargo.toml

      - name: Generate isolated lockfile
        run: cargo +1.96.0 generate-lockfile --manifest-path tools/capability-qualified-edit-planner/Cargo.toml

      - name: Run graph, capability, observer and budget controls
        run: cargo +1.96.0 test --locked --manifest-path tools/capability-qualified-edit-planner/Cargo.toml
