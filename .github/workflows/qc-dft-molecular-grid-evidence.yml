name: QC DFT Molecular Grid Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-quantum-chemistry/src/dft/**"
      - "crates/domains/symthaea-quantum-chemistry/src/scf/generalized_eigen.rs"
      - "crates/domains/symthaea-quantum-chemistry/examples/qc_dft_molecular_grid_evidence.rs"
      - "scripts/qc/compare_dft_molecular_grid_pyscf.py"
      - "scripts/qc/test_compare_dft_molecular_grid_pyscf.py"
      - "crates/core/symthaea-observation-attestation/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/qc-dft-molecular-grid-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qc-dft-molecular-grid-evidence-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  molecular-grid-evidence:
    name: Checked DFT grid sweep and electron-count diagnostics
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head or dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source checkout and record identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            printf 'source HEAD mismatch: expected=%s actual=%s\n' "$EXPECTED_SOURCE_SHA" "$actual" >&2
            exit 1
          fi
          manifest="crates/core/symthaea-observation-attestation/Cargo.toml"
          test -f "$manifest"
          {
            echo "## QC DFT molecular grid evidence"
            echo
            printf -- '- Source commit: `%s`\n' "$actual"
            printf -- '- Source tree: `%s`\n' "$(git rev-parse --verify 'HEAD^{tree}')"
            printf -- '- Cargo.lock blob: `%s`\n' "$(git rev-parse HEAD:Cargo.lock)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # pinned upstream revision
        with:
          toolchain: 1.96.0

      - name: Install pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check Python reference harness syntax
        run: |
          python -m py_compile \
            scripts/qc/check_vwn5_pyscf_reference.py \
            scripts/qc/compare_dft_molecular_grid_pyscf.py \
            scripts/qc/test_compare_dft_molecular_grid_pyscf.py

      - name: Check formatting of DFT and benchmark sources
        run: |
          set -euo pipefail
          rustfmt --check --edition 2024 --config skip_children=true \
            crates/domains/symthaea-quantum-chemistry/src/dft/xc.rs \
            crates/domains/symthaea-quantum-chemistry/src/dft/lda.rs \
            crates/domains/symthaea-quantum-chemistry/src/dft/grid.rs \
            crates/domains/symthaea-quantum-chemistry/examples/qc_dft_molecular_grid_evidence.rs

      - name: Preflight the exact workspace manifest
        run: test -f crates/core/symthaea-observation-attestation/Cargo.toml

      - name: Run checked DFT and quadrature regressions
        run: cargo test --locked -p symthaea-quantum-chemistry --lib 'dft::'

      - name: Run closed-shell molecular grid sweep
        id: native_sweep
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export SYMTHAEA_SOURCE_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          export SYMTHAEA_SOURCE_TREE="$(git rev-parse --verify 'HEAD^{tree}')"
          cargo run --locked -p symthaea-quantum-chemistry \
            --example qc_dft_molecular_grid_evidence \
            > /tmp/symthaea-qc-dft-grid-evidence.json

      - name: Install pinned PySCF reference dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" \
            "scipy==1.15.3" \
            "h5py==3.14.0" \
            "pyscf==2.14.0"

      - name: Test the PySCF radial rule against analytic Gaussian integrals
        run: python -m unittest discover -s scripts/qc -p test_compare_dft_molecular_grid_pyscf.py

      - name: Compare the native sweep against matched-grid PySCF references
        id: pyscf_comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          native_report="/tmp/symthaea-qc-dft-grid-evidence.json"
          if [[ ! -s "$native_report" ]]; then
            echo "Native JSON is missing; no molecular comparison can be made." >&2
            exit 1
          fi
          python scripts/qc/compare_dft_molecular_grid_pyscf.py \
            --native-report "$native_report" \
            --output /tmp/symthaea-qc-dft-pyscf-comparison.json

      - name: Summarize native and independent molecular evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["", "### Native molecular grid evidence", ""]
          native_path = Path("/tmp/symthaea-qc-dft-grid-evidence.json")
          comparison_path = Path("/tmp/symthaea-qc-dft-pyscf-comparison.json")

          if not native_path.is_file():
              lines.append("No native JSON report was emitted; the Rust example did not complete.")
          else:
              report = json.loads(native_path.read_text(encoding="utf-8"))
              counts = report.get("summary", {})
              lines += [
                  f"- Source commit: `{report.get('source_commit')}`",
                  f"- Source tree: `{report.get('source_tree')}`",
                  f"- Cases: {counts.get('cases')}",
                  f"- Solver receipts present for all cases: {counts.get('solver_receipts_present_all_cases')}",
                  f"- SCF converged for all cases: {counts.get('scf_converged_all_cases')}",
                  f"- Electron-count integrals finite for all cases: {counts.get('electron_count_integrals_finite_all_cases')}",
                  f"- Native execution gate: **{'PASS' if counts.get('all_cases_passed_execution_gate') else 'FAIL'}**",
                  "",
                  "| Molecule | Grid | SCF | Energy (Ha) | Grid electrons | Absolute count error | Points |",
                  "|---|---|---|---:|---:|---:|---:|",
              ]
              for item in report.get("records", []):
                  energy = item.get("total_energy_hartree")
                  count = item.get("integrated_electron_count")
                  count_error = item.get("integrated_electron_count_abs_error")
                  energy_s = "—" if energy is None else f"{energy:.12f}"
                  count_s = "—" if count is None else f"{count:.10f}"
                  error_s = "—" if count_error is None else f"{count_error:.3e}"
                  lines.append(
                      f"| {item.get('molecule')} | {item.get('grid_quality')} | "
                      f"{item.get('status')} | {energy_s} | {count_s} | "
                      f"{error_s} | {item.get('n_grid_points', '—')} |"
                  )

          lines += ["", "### Matched-grid PySCF energy comparison", ""]
          if not comparison_path.is_file():
              lines.append("No comparison JSON was emitted; the independent PySCF comparison did not complete.")
          else:
              comparison = json.loads(comparison_path.read_text(encoding="utf-8"))
              counts = comparison.get("summary", {})
              lines += [
                  f"- PySCF / NumPy / SciPy: `{comparison.get('pyscf_version')}` / `{comparison.get('numpy_version')}` / `{comparison.get('scipy_version')}`",
                  f"- Matched-grid cases: {counts.get('cases')}; passed: {counts.get('passed')}; failed: {counts.get('failed')}",
                  f"- Energy agreement tolerance: {comparison.get('energy_tolerance_hartree')} Ha",
                  f"- Molecular comparison gate: **{'PASS' if counts.get('pass') else 'FAIL'}**",
                  "",
                  "| Molecule | Grid | Energy error (Ha) | Energy error (kcal/mol) | Electron-count error (Symthaea / PySCF) |",
                  "|---|---|---:|---:|---:|",
              ]
              for item in comparison.get("comparisons", []):
                  error = item.get("energy_abs_error_hartree")
                  kcal = item.get("energy_abs_error_kcal_mol")
                  native_count = item.get("native_electron_count_abs_error")
                  pyscf_count = item.get("pyscf_electron_count_abs_error")
                  error_s = "—" if error is None else f"{error:.3e}"
                  kcal_s = "—" if kcal is None else f"{kcal:.4f}"
                  native_count_s = "—" if native_count is None else f"{native_count:.3e}"
                  pyscf_count_s = "—" if pyscf_count is None else f"{pyscf_count:.3e}"
                  lines.append(
                      f"| {item.get('molecule')} | {item.get('grid_quality')} | {error_s} | "
                      f"{kcal_s} | {native_count_s} / {pyscf_count_s} |"
                  )
              for reason in counts.get("failure_reasons", []):
                  lines.append(f"- Failure detail: {reason}")

              lines += [
                  "",
                  "#### Within-engine grid convergence (independent of cross-engine error)",
                  "",
                  "| Molecule | Engine | Coarse→Medium ΔE (Ha) | Medium→Fine ΔE (Ha) | Fine→High ΔE (Ha) | Coarse electron-count error | High electron-count error |",
                  "|---|---|---:|---:|---:|---:|---:|",
              ]
              for curve in comparison.get("grid_convergence", []):
                  for engine, prefix, count_field in [
                      ("Symthaea", "native", "native_integrated_electron_count_abs_error_by_grid"),
                      ("PySCF", "pyscf", "pyscf_integrated_electron_count_abs_error_by_grid"),
                  ]:
                      deltas = curve.get(f"{prefix}_delta_to_previous_grid_hartree", {})
                      errors = curve.get(count_field, {})
                      def fmt(value):
                          return "—" if value is None else f"{value:.3e}"
                      lines.append(
                          f"| {curve.get('molecule')} | {engine} | "
                          f"{fmt(deltas.get('medium'))} | {fmt(deltas.get('fine'))} | "
                          f"{fmt(deltas.get('high_accuracy'))} | "
                          f"{fmt(errors.get('coarse'))} | {fmt(errors.get('high_accuracy'))} |"
                      )

          lines += [
              "",
              "A grid-electron count is a quadrature diagnostic; it is not silently forced to the exact integer.",
              "Matched-grid energy agreement is an implementation test, not proof of chemical accuracy.",
          ]
          with summary_path.open("a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY

      - name: Enforce native and matched-grid comparison gates
        if: always()
        shell: bash
        env:
          NATIVE_OUTCOME: ${{ steps.native_sweep.outcome }}
          PYSCF_COMPARISON_OUTCOME: ${{ steps.pyscf_comparison.outcome }}
        run: |
          set -euo pipefail
          if [[ "$NATIVE_OUTCOME" != "success" ]]; then
            printf 'Native DFT grid sweep outcome was %s\n' "$NATIVE_OUTCOME" >&2
            exit 1
          fi
          if [[ "$PYSCF_COMPARISON_OUTCOME" != "success" ]]; then
            printf 'Matched-grid PySCF comparison outcome was %s\n' "$PYSCF_COMPARISON_OUTCOME" >&2
            exit 1
          fi

      - name: Upload native and independent numerical evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qc-dft-molecular-grid-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/symthaea-qc-dft-grid-evidence.json
            /tmp/symthaea-qc-dft-pyscf-comparison.json
          if-no-files-found: warn
          retention-days: 30
