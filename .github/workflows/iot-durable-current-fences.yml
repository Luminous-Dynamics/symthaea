name: IoT Durable Current Fences

on:
  pull_request:
    paths:
      - 'crates/bridges/symthaea-iot-actuation-guard-admission-reservation/**'
      - 'crates/bridges/symthaea-iot-actuation-guard-semantic-persistence/**'
      - '.github/workflows/iot-durable-current-fences.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iot-durable-current-fences-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Held durable-current source contract
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          admission_root = Path('crates/bridges/symthaea-iot-actuation-guard-admission-reservation')
          semantic_root = Path('crates/bridges/symthaea-iot-actuation-guard-semantic-persistence')

          admission_current = (admission_root / 'src/current.rs').read_text()
          semantic_current = (semantic_root / 'src/current.rs').read_text()
          admission_lib = (admission_root / 'src/lib.rs').read_text()
          semantic_lib = (semantic_root / 'src/lib.rs').read_text()

          def compact(source):
              code = '\n'.join(
                  line for line in source.splitlines()
                  if not line.lstrip().startswith('//')
              )
              return ''.join(code.split()), code

          admission, admission_code = compact(admission_current)
          semantic, semantic_code = compact(semantic_current)

          admission_required = [
              'pubfnfence_current',
              'expected_head:AdmissionReservationHead',
              'self.local_lock.lock()',
              'letkernel=self.open_lock_file()?',
              'kernel.lock().map_err(AdmissionReservationError::Io)?',
              'letcheckpoint=self.read_state_locked()?',
              'self.validate_checkpoint_for_store(&checkpoint)?',
              'letcurrent_head=checkpoint.head()?',
              'current_head!=expected_head',
              "pubstructCurrentAdmissionReservationFence<'a>",
              "_local:MutexGuard<'a,()>",
              '_kernel:File',
              'checkpoint:AdmissionReservationCheckpointV1',
              'head:AdmissionReservationHead',
          ]
          missing = [n for n in admission_required if n not in admission]
          if missing:
              raise SystemExit(f'missing admission held-fence invariant: {missing}')

          semantic_required = [
              'pubfnfence_current',
              'expected_head:DeviceSemanticHead',
              'self.local_lock.lock()',
              'letkernel=self.open_lock_file()?',
              'kernel.lock().map_err(SemanticPersistenceError::Io)?',
              'letcheckpoint=self.read_state_locked()?',
              'self.verify_loaded_checkpoint(&checkpoint)?',
              'letcurrent_head=checkpoint.head()?',
              'current_head!=expected_head',
              "pubstructCurrentSemanticHeadFence<'a>",
              "_local:MutexGuard<'a,()>",
              '_kernel:File',
              'checkpoint:DeviceSemanticCheckpointV1',
              'head:DeviceSemanticHead',
          ]
          missing = [n for n in semantic_required if n not in semantic]
          if missing:
              raise SystemExit(f'missing semantic held-fence invariant: {missing}')

          # The held fences must reuse the exact owner-local lock primitive used by mutation.
          admission_mutation = admission_lib.split('fn reserve_verified_transport_at', 1)[1].split(
              'fn validate_checkpoint_for_store', 1
          )[0]
          for needle in ['self.open_lock_file()?', 'kernel.lock().map_err(AdmissionReservationError::Io)?']:
              if needle not in admission_mutation:
                  raise SystemExit(f'admission mutation no longer shares fence kernel lock: {needle}')

          semantic_mutation = semantic_lib.split('pub fn persist_semantic_acceptance', 1)[1].split(
              'fn verify_loaded_checkpoint', 1
          )[0]
          for needle in ['self.open_lock_file()?', 'kernel.lock().map_err(SemanticPersistenceError::Io)?']:
              if needle not in semantic_mutation:
                  raise SystemExit(f'semantic mutation no longer shares fence kernel lock: {needle}')

          forbidden = [
              'SystemTime', 'Instant', 'OpenOptions', 'PathBuf', 'verify_strict(', 'VerifyingKey',
              'HybridReceiptSignatureVerifier', 'verify_xenia_transport_receipt(',
              'verify_interlock_key_binding(', 'FinalActuatorPermit', 'TrustBoundFinalActuatorPermit',
              'CompleteJitHalLease', 'JustInTimeHalLease', 'TcpListener', 'TcpStream',
              'tokio::spawn', 'std::process::Command', 'Command::new', 'unsafe {',
          ]
          for name, code in [('admission', admission_code), ('semantic', semantic_code)]:
              found = [needle for needle in forbidden if needle in code]
              if found:
                  raise SystemExit(f'{name} held fence acquired authority/provider/path surface: {found}')

          admission_manifest = tomllib.loads((admission_root / 'Cargo.toml').read_text())
          expected_admission = {
              'bincode', 'blake3', 'libc', 'serde', 'symthaea-authority',
              'symthaea-iot-device-protocol', 'symthaea-iot-transport-receipt', 'thiserror',
          }
          if set(admission_manifest.get('dependencies', {})) != expected_admission:
              raise SystemExit('admission production dependency drift')

          semantic_manifest = tomllib.loads((semantic_root / 'Cargo.toml').read_text())
          expected_semantic = {
              'bincode', 'libc', 'symthaea-authority',
              'symthaea-iot-actuation-guard-admission-reservation',
              'symthaea-iot-actuation-guard-device-reality',
              'symthaea-iot-device-protocol', 'thiserror',
          }
          if set(semantic_manifest.get('dependencies', {})) != expected_semantic:
              raise SystemExit('semantic production dependency drift')

      - name: Install Rust 1.96 formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Format only the held-fence tranche
        run: |
          rustfmt +1.96.0 --edition 2024 --check \
            crates/bridges/symthaea-iot-actuation-guard-admission-reservation/src/current.rs \
            crates/bridges/symthaea-iot-actuation-guard-admission-reservation/tests/current.rs \
            crates/bridges/symthaea-iot-actuation-guard-semantic-persistence/src/current.rs \
            crates/bridges/symthaea-iot-actuation-guard-semantic-persistence/tests/current.rs

      - name: Install Rust 1.94 qualification toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Verify exact qualification toolchain
        run: |
          rustc +1.94.0 --version | grep -F 'rustc 1.94.0'
          cargo +1.94.0 --version | grep -F 'cargo 1.94.0'

      - name: Preserve checked-in lock
        run: cp Cargo.lock /tmp/Cargo.lock.before

      - name: Check both owner packages
        run: |
          cargo +1.94.0 check -p symthaea-iot-actuation-guard-admission-reservation --all-targets
          cargo +1.94.0 check -p symthaea-iot-actuation-guard-semantic-persistence --all-targets

      - name: Reject unreviewed external dependency drift
        shell: python
        run: |
          import tomllib
          def sourced(path):
              with open(path, 'rb') as f:
                  doc = tomllib.load(f)
              return {
                  (p['name'], p['version'], p.get('source')): p
                  for p in doc.get('package', [])
                  if p.get('source') is not None
              }
          before = sourced('/tmp/Cargo.lock.before')
          after = sourced('Cargo.lock')
          b = set(before)
          a = set(after)
          added = a - b
          removed = b - a
          changed = sorted(k for k in a & b if after[k] != before[k])
          allowed = {
              ('fips204', '0.4.6', 'registry+https://github.com/rust-lang/crates.io-index')
          }
          if not added.issubset(allowed) or removed or changed:
              raise SystemExit(
                  f'external dependency drift: added={sorted(added)}, '
                  f'removed={sorted(removed)}, changed={changed}'
              )

      - name: Admission held-fence regressions first
        run: cargo +1.94.0 test -p symthaea-iot-actuation-guard-admission-reservation --test current

      - name: Semantic held-fence regressions first
        run: cargo +1.94.0 test -p symthaea-iot-actuation-guard-semantic-persistence --test current

      - name: Full owner package tests
        run: |
          cargo +1.94.0 test -p symthaea-iot-actuation-guard-admission-reservation --all-targets
          cargo +1.94.0 test -p symthaea-iot-actuation-guard-semantic-persistence --all-targets

      - name: Strict package-local Clippy
        run: |
          cargo +1.94.0 clippy -p symthaea-iot-actuation-guard-admission-reservation --all-targets --no-deps -- -D warnings
          cargo +1.94.0 clippy -p symthaea-iot-actuation-guard-semantic-persistence --all-targets --no-deps -- -D warnings

      - name: Show local-only Cargo.lock bookkeeping
        if: always()
        run: git diff -- Cargo.lock || true
