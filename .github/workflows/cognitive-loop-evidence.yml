name: Cognitive Loop Evidence Contract

on:
  pull_request:
    paths:
      - "benchmarks/cognitive-loop-evidence/**"
      - "Cargo.toml"
      - "scripts/check-workspace-targets.sh"
      - "xtask/src/cognitive_loop_evidence.rs"
      - "xtask/src/cognitive_drift_score.rs"
      - "xtask/src/cognitive_drift_compare.rs"
      - "xtask/src/main.rs"
      - "docs/research/COGNITIVE_LOOP_EVIDENCE_BENCHMARK.md"
      - ".github/workflows/cognitive-loop-evidence.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/cognitive-loop-evidence/**"
      - "Cargo.toml"
      - "scripts/check-workspace-targets.sh"
      - "xtask/src/cognitive_loop_evidence.rs"
      - "xtask/src/cognitive_drift_score.rs"
      - "xtask/src/cognitive_drift_compare.rs"
      - "xtask/src/main.rs"
      - "docs/research/COGNITIVE_LOOP_EVIDENCE_BENCHMARK.md"
      - ".github/workflows/cognitive-loop-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-loop-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manifest-contract:
    name: Validate manifest contract (not model performance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Verify workspace targets are tracked
        run: bash scripts/check-workspace-targets.sh
      - name: Validate manifest and hard-gate invariants
        run: cargo run --locked -p xtask -- validate-cognitive-loop-evidence
      - name: Test validator failure modes
        run: cargo test --locked -p xtask cognitive_loop_evidence
      - name: Test drift trace scoring failure modes
        run: cargo test --locked -p xtask cognitive_drift_score
      - name: Test paired comparison and bootstrap failure modes
        run: cargo test --locked -p xtask cognitive_drift_compare

      - name: Run the drift scorer CLI against the synthetic fixture
        run: |
          cargo run --locked -p xtask -- score-cognitive-loop-drift --input benchmarks/cognitive-loop-evidence/synthetic-smoke-trace.json --out "$RUNNER_TEMP/drift-score.json"
          jq -e '
            .stream_id == "synthetic-smoke-fixture-not-measured" and
            .ground_truth_events == 2 and
            .true_positive_events == 2 and
            .false_positive_alarms == 1 and
            .missed_events == 0 and
            .hard_gate_pass == true and
            (.canonical_trace_sha256 | length) == 64 and
            (.result_sha256 | length) == 64
          ' "$RUNNER_TEMP/drift-score.json"

      - name: Run the paired comparison CLI against the synthetic fixture
        run: |
          cargo run --locked -p xtask -- compare-cognitive-loop-drift --input benchmarks/cognitive-loop-evidence/synthetic-paired-comparison.json --out "$RUNNER_TEMP/paired-comparison.json"
          jq -e '
            .metric_id == "event-f1" and
            .dataset_count == 3 and
            .minimum_seeds_per_dataset == 2 and
            .sota_coverage_gate_pass == false and
            (.sota_coverage_gate_reason | contains("seven datasets and 50 seeds")) and
            .paired_record_count == 12 and
            .interval_supports_positive_effect == true and
            (.percentile_95_ci_oriented_effect[0] > 0) and
            (.canonical_input_sha256 | length) == 64 and
            (.result_sha256 | length) == 64
          ' "$RUNNER_TEMP/paired-comparison.json"
