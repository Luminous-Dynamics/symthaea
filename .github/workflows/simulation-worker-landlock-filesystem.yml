name: Simulation Worker Landlock Filesystem

on:
  pull_request:
    paths:
      - "crates/bridges/symthaea-sim-worker-filesystem/**"
      - "crates/bridges/symthaea-sim-worker-containment/**"
      - "crates/bridges/symthaea-sim-worker-image/**"
      - "crates/bridges/symthaea-sim-worker/**"
      - "examples/extensions/hello-simulation/**"
      - ".github/workflows/simulation-worker-landlock-filesystem.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  worker-landlock-filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Cargo and Component builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            examples/extensions/hello-simulation/target
          key: ${{ runner.os }}-simulation-landlock-${{ hashFiles('Cargo.lock', 'crates/bridges/symthaea-sim-worker-filesystem/**', 'crates/bridges/symthaea-sim-worker-containment/**', 'examples/extensions/hello-simulation/**') }}
          restore-keys: |
            ${{ runner.os }}-simulation-landlock-

      - name: Require Linux x86_64 qualification subject
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          uname -a

      - name: Reconcile candidate root lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          git diff -- Cargo.lock > simulation-worker-landlock-cargo-lock.patch
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the Landlock graph."
          else
            echo "Cargo.lock requires the following generated update:"
            cat simulation-worker-landlock-cargo-lock.patch
          fi

      - name: Upload candidate Cargo.lock patch
        uses: actions/upload-artifact@v4
        with:
          name: simulation-worker-landlock-cargo-lock-patch
          path: simulation-worker-landlock-cargo-lock.patch
          if-no-files-found: error

      - name: Require standalone guest WIT parity
        run: |
          cmp crates/core/symthaea-extension-core/wit/extension-control.wit \
              examples/extensions/hello-simulation/wit/extension-control.wit
          cmp crates/core/symthaea-extension-core/wit/simulation-provider.wit \
              examples/extensions/hello-simulation/wit/simulation-provider.wit

      - name: Build exact standalone simulation Component
        run: |
          cargo build \
            --manifest-path examples/extensions/hello-simulation/Cargo.toml \
            --target wasm32-wasip2 \
            --release
          component="examples/extensions/hello-simulation/target/wasm32-wasip2/release/symthaea_hello_simulation_extension.wasm"
          test -s "$component"
          sha256sum "$component" examples/extensions/hello-simulation/manifest.json

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build exact filesystem worker and probe
        run: |
          cargo build --locked \
            -p symthaea-sim-worker-filesystem \
            --bin symthaea-sim-filesystem-worker \
            --bin symthaea-sim-filesystem-probe
          test -x target/debug/symthaea-sim-filesystem-worker
          test -x target/debug/symthaea-sim-filesystem-probe
          sha256sum \
            target/debug/symthaea-sim-filesystem-worker \
            target/debug/symthaea-sim-filesystem-probe

      - name: Execute Landlock negative filesystem probe
        run: target/debug/symthaea-sim-filesystem-probe | tee simulation-worker-landlock-probe.txt

      - name: Check filesystem containment crate
        run: cargo check --locked -p symthaea-sim-worker-filesystem --all-targets

      - name: Test filesystem containment crate
        run: cargo test --locked -p symthaea-sim-worker-filesystem

      - name: Strict Clippy filesystem containment crate
        run: cargo clippy --locked -p symthaea-sim-worker-filesystem --all-targets -- -D warnings

      - name: Execute real Component through exact filesystem-contained sealed worker
        env:
          SYMTHAEA_FILESYSTEM_WORKER_BIN: ${{ github.workspace }}/target/debug/symthaea-sim-filesystem-worker
        run: |
          cargo test --locked \
            -p symthaea-sim-worker-filesystem \
            --test hello_filesystem_worker \
            -- --ignored --test-threads=1

      - name: Record exact filesystem qualification subject
        run: |
          component="examples/extensions/hello-simulation/target/wasm32-wasip2/release/symthaea_hello_simulation_extension.wasm"
          landlock_abi="$(sed -n 's/^landlock_abi=//p' simulation-worker-landlock-probe.txt)"
          handled_fs="$(sed -n 's/^handled_access_fs=//p' simulation-worker-landlock-probe.txt)"
          test -n "$landlock_abi"
          test -n "$handled_fs"
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "manifest_sha256=$(sha256sum examples/extensions/hello-simulation/manifest.json | cut -d' ' -f1)"
            echo "component_sha256=$(sha256sum "$component" | cut -d' ' -f1)"
            echo "filesystem_worker_sha256=$(sha256sum target/debug/symthaea-sim-filesystem-worker | cut -d' ' -f1)"
            echo "filesystem_probe_sha256=$(sha256sum target/debug/symthaea-sim-filesystem-probe | cut -d' ' -f1)"
            echo "filesystem_profile=symthaea.simulation.worker-filesystem.landlock-deny-content-v1"
            echo "landlock_abi=${landlock_abi}"
            echo "handled_access_fs=${handled_fs}"
            echo "allow_rules=none"
            echo "file_content_read=denied"
            echo "directory_read=denied"
            echo "file_content_write_create_remove_truncate=denied_when_supported_by_abi"
            echo "metadata_visibility=not_restricted"
            echo "seccomp_parent_profile=symthaea.simulation.worker-containment.seccomp-x86_64-v1"
            echo "cgroup=not_established"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } | tee simulation-worker-landlock-receipt.txt

      - name: Upload filesystem qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-worker-landlock-evidence
          path: |
            simulation-worker-landlock-probe.txt
            simulation-worker-landlock-receipt.txt
          if-no-files-found: error

      - name: Require committed root lockfile
        run: git diff --exit-code -- Cargo.lock
