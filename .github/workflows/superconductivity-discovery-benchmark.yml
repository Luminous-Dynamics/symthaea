name: Superconductivity Discovery Benchmark Contract

on:
  pull_request:
    paths:
      - "tools/superconductivity-discovery-benchmark-auditor/**"
      - "data/schemas/superconductivity_discovery_benchmark_v0_1.schema.json"
      - "data/research/superconductivity_discovery_benchmark_fixture_v0_1.json"
      - "research/superconductivity/discovery_benchmark/**"
      - ".github/workflows/superconductivity-discovery-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc-discovery-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  benchmark-contract:
    name: Split leakage, evidence authority and benchmark contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Apply pinned Rust formatting
        run: cargo fmt --manifest-path tools/superconductivity-discovery-benchmark-auditor/Cargo.toml --all

      - name: Verify canonical Rust formatting
        run: cargo fmt --manifest-path tools/superconductivity-discovery-benchmark-auditor/Cargo.toml --all -- --check

      - name: Capture rustfmt-only patch
        if: always()
        run: |
          git diff -- tools/superconductivity-discovery-benchmark-auditor/src > "$RUNNER_TEMP/sc-rustfmt.patch"
          if [ -s "$RUNNER_TEMP/sc-rustfmt.patch" ]; then
            cat "$RUNNER_TEMP/sc-rustfmt.patch"
          else
            echo "rustfmt_patch=empty"
          fi

      - name: Generate isolated dependency lockfile
        run: cargo generate-lockfile --manifest-path tools/superconductivity-discovery-benchmark-auditor/Cargo.toml

      - name: Run split, provenance and negative-control tests
        run: cargo test --locked --manifest-path tools/superconductivity-discovery-benchmark-auditor/Cargo.toml --bin sc_discovery_benchmark_audit

      - name: Audit synthetic contract fixture
        run: |
          cargo run --locked --manifest-path tools/superconductivity-discovery-benchmark-auditor/Cargo.toml --bin sc_discovery_benchmark_audit -- \
            --schema data/schemas/superconductivity_discovery_benchmark_v0_1.schema.json \
            --fixture data/research/superconductivity_discovery_benchmark_fixture_v0_1.json \
            > "$RUNNER_TEMP/sc-discovery-benchmark-receipt.json"
          cat "$RUNNER_TEMP/sc-discovery-benchmark-receipt.json"

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/superconductivity-discovery-benchmark-auditor/Cargo.toml --bin sc_discovery_benchmark_audit -- -D warnings

      - name: Record exact-run identity
        if: always()
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            sha256sum data/schemas/superconductivity_discovery_benchmark_v0_1.schema.json
            sha256sum data/research/superconductivity_discovery_benchmark_fixture_v0_1.json
            sha256sum tools/superconductivity-discovery-benchmark-auditor/Cargo.toml
            sha256sum tools/superconductivity-discovery-benchmark-auditor/src/main.rs
            sha256sum "$RUNNER_TEMP/sc-rustfmt.patch"
            if [ -f tools/superconductivity-discovery-benchmark-auditor/Cargo.lock ]; then
              sha256sum tools/superconductivity-discovery-benchmark-auditor/Cargo.lock
            else
              echo "cargo_lock=not-generated"
            fi
          } > "$RUNNER_TEMP/sc-discovery-benchmark-environment.txt"

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-discovery-benchmark-exact-run-evidence
          if-no-files-found: warn
          path: |
            tools/superconductivity-discovery-benchmark-auditor/Cargo.lock
            ${{ runner.temp }}/sc-discovery-benchmark-environment.txt
            ${{ runner.temp }}/sc-discovery-benchmark-receipt.json
            ${{ runner.temp }}/sc-rustfmt.patch
