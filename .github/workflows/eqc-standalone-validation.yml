name: EQC Standalone Reference Validation

on:
  push:
    branches: [feat/eqc-standalone-harness-v0-1]
    paths:
      - "tools/eqc-reference/**"
      - "docs/research/eqc-*.json"
      - "docs/research/eqc-fixtures/**"
      - ".github/workflows/eqc-standalone-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eqc-standalone-v0-1
  cancel-in-progress: false

jobs:
  reference-seed:
    name: Draft 2020-12 schemas and reference controls
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/eqc-standalone-harness-v0-1
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Generate isolated lockfile when absent
        run: |
          set -euo pipefail
          manifest=tools/eqc-reference/Cargo.toml
          lock=tools/eqc-reference/Cargo.lock
          if [[ ! -s "$lock" ]]; then
            cargo generate-lockfile --manifest-path "$manifest"
          fi
          test -s "$lock"

      - name: Commit generated isolated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/eqc-reference/Cargo.lock
          if git diff --cached --quiet; then
            echo "Standalone EQC lockfile is already committed."
          else
            git commit -m "chore(eqc): lock standalone Rust reference validator"
            git push origin HEAD:feat/eqc-standalone-harness-v0-1
          fi

      - name: Check standalone formatting
        run: cargo fmt --manifest-path tools/eqc-reference/Cargo.toml -- --check

      - name: Run standalone Rust unit and negative-control tests
        run: cargo test --locked --manifest-path tools/eqc-reference/Cargo.toml

      - name: Run schema and reference evaluator
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path tools/eqc-reference/Cargo.toml -- \
            --corpus docs/research/eqc-seed-corpus-v0.1.json \
            --out "$RUNNER_TEMP/eqc-reference-report.json"

          jq -e '
            .evaluation_mode == "reference_contract_only_not_system_under_test" and
            .task_count == 4 and
            .reference_pass_count == 4 and
            .no_op_fails_positive_controls == true and
            .allow_all_fails_negative_controls == true
          ' "$RUNNER_TEMP/eqc-reference-report.json" >/dev/null
          cat "$RUNNER_TEMP/eqc-reference-report.json"

      - name: Record immutable run metadata
        run: |
          {
            echo "source_head=$(git rev-parse HEAD)"
            echo "workflow_trigger_sha=$GITHUB_SHA"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "toolchain=1.96.0"
            echo "target=$(rustc -vV | sed -n 's/^host: //p')"
            echo "cargo_lock_sha256=$(sha256sum tools/eqc-reference/Cargo.lock | cut -d' ' -f1)"
            echo "seed_sha256=$(sha256sum docs/research/eqc-seed-corpus-v0.1.json | cut -d' ' -f1)"
          } > "$RUNNER_TEMP/eqc-run-metadata.txt"

      - name: Preserve standalone qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: eqc-standalone-${{ github.sha }}
          path: |
            ${{ runner.temp }}/eqc-reference-report.json
            ${{ runner.temp }}/eqc-run-metadata.txt
          if-no-files-found: error
          retention-days: 90
