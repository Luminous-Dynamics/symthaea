name: Sym-RSI Scientific Decision Replay

on:
  push:
    branches:
      - research/scientific-decision-replay-contract-2026-11-27
    paths:
      - "crates/domains/symthaea-futures-ensemble/Cargo.toml"
      - "crates/domains/symthaea-futures-ensemble/examples/scientific_decision_replay_contract.rs"
      - "crates/domains/symthaea-futures-ensemble/examples/evolutionary_rescue_split_capsules.rs"
      - "crates/domains/symthaea-futures-ensemble/examples/support/scientific_decision_replay.rs"
      - "crates/domains/symthaea-futures-ensemble/examples/support/evolutionary_rescue_custody.rs"
      - ".github/workflows/sym-rsi-scientific-decision-replay.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-futures-ensemble/Cargo.toml"
      - "crates/domains/symthaea-futures-ensemble/examples/scientific_decision_replay_contract.rs"
      - "crates/domains/symthaea-futures-ensemble/examples/evolutionary_rescue_split_capsules.rs"
      - "crates/domains/symthaea-futures-ensemble/examples/support/scientific_decision_replay.rs"
      - "crates/domains/symthaea-futures-ensemble/examples/support/evolutionary_rescue_custody.rs"
      - ".github/workflows/sym-rsi-scientific-decision-replay.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Rust 1.96 decision and custody contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - name: Generate rustfmt preview
        run: |
          rustfmt --edition 2024 --config skip_children=true \
            crates/domains/symthaea-futures-ensemble/examples/scientific_decision_replay_contract.rs \
            crates/domains/symthaea-futures-ensemble/examples/evolutionary_rescue_split_capsules.rs \
            crates/domains/symthaea-futures-ensemble/examples/support/scientific_decision_replay.rs \
            crates/domains/symthaea-futures-ensemble/examples/support/evolutionary_rescue_custody.rs
      - name: Upload rustfmt preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-decision-replay-rustfmt-preview
          path: |
            crates/domains/symthaea-futures-ensemble/examples/scientific_decision_replay_contract.rs
            crates/domains/symthaea-futures-ensemble/examples/evolutionary_rescue_split_capsules.rs
            crates/domains/symthaea-futures-ensemble/examples/support/scientific_decision_replay.rs
            crates/domains/symthaea-futures-ensemble/examples/support/evolutionary_rescue_custody.rs
      - name: Restore the exact committed sources
        run: |
          git checkout -- \
            crates/domains/symthaea-futures-ensemble/examples/scientific_decision_replay_contract.rs \
            crates/domains/symthaea-futures-ensemble/examples/evolutionary_rescue_split_capsules.rs \
            crates/domains/symthaea-futures-ensemble/examples/support/scientific_decision_replay.rs \
            crates/domains/symthaea-futures-ensemble/examples/support/evolutionary_rescue_custody.rs
      - name: Check formatting on committed sources
        run: |
          rustfmt --edition 2024 --check --config skip_children=true \
            crates/domains/symthaea-futures-ensemble/examples/scientific_decision_replay_contract.rs \
            crates/domains/symthaea-futures-ensemble/examples/evolutionary_rescue_split_capsules.rs \
            crates/domains/symthaea-futures-ensemble/examples/support/scientific_decision_replay.rs \
            crates/domains/symthaea-futures-ensemble/examples/support/evolutionary_rescue_custody.rs
      - name: Run decision contract tests
        run: cargo test --locked -p symthaea-futures-ensemble --example scientific_decision_replay_contract
      - name: Run replay custody and materializer tests
        run: cargo test --locked -p symthaea-futures-ensemble --example evolutionary_rescue_split_capsules
      - name: Strict Clippy for changed targets
        run: |
          cargo clippy --locked -p symthaea-futures-ensemble \
            --example scientific_decision_replay_contract \
            --example evolutionary_rescue_split_capsules \
            -- -D warnings
