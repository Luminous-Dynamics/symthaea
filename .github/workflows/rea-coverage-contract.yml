name: REA Coverage Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "benchmarks/rea-coverage/v1/**"
      - ".github/workflows/rea-coverage-contract.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/rea-coverage/v1/**"
      - ".github/workflows/rea-coverage-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-coverage-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Coverage contract, property sweeps and mutation controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check required tools
        shell: bash
        run: |
          set -euo pipefail
          command -v jq
          jq --version
          command -v sha256sum
          sha256sum --version | head -n 1
          git --version

      - name: Verify fixed known-answer corpus
        shell: bash
        run: sh benchmarks/rea-coverage/v1/verify.sh

      - name: Exhaustively check byte coverage masks
        shell: bash
        run: sh benchmarks/rea-coverage/v1/property-sweep.sh

      - name: Exhaustively check interval representation invariance
        shell: bash
        run: sh benchmarks/rea-coverage/v1/representation-sweep.sh

      - name: Verify receipt matches tracked corpus bytes
        shell: bash
        run: sh benchmarks/rea-coverage/v1/verify-receipt.sh

      - name: Verify deliberate contract regressions fail
        shell: bash
        run: sh benchmarks/rea-coverage/v1/mutation-controls.sh
