name: REL-005A Graft Frame Qualification

on:
  pull_request:
    paths:
      - "docs/research/REL_005A_GRAFT_FRAME_QUALIFICATION_2026-09-14.md"
      - "crates/core/symthaea-fep/tests/rel_graft_frame.rs"
      - ".github/rel/rel-005a-graft-frame-qualification.sh"
      - ".github/workflows/rel-005a-graft-frame-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rel-005a-graft-frame-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_BASE: ${{ github.event.pull_request.base.sha || '' }}
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  exact-subject:
    name: Exact-subject REL-005A
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Bind subject and stacked scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          if [ -n "${EXPECTED_BASE}" ]; then
            git cat-file -e "${EXPECTED_BASE}^{commit}"
            mapfile -t changed < <(git diff --name-only "${EXPECTED_BASE}" HEAD | sort)
            expected=(
              ".github/rel/rel-005a-graft-frame-qualification.sh"
              ".github/workflows/rel-005a-graft-frame-qualification.yml"
              "crates/core/symthaea-fep/tests/rel_graft_frame.rs"
              "docs/research/REL_005A_GRAFT_FRAME_QUALIFICATION_2026-09-14.md"
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            test "${changed[*]}" = "${expected_sorted[*]}"
          fi
          printf 'head=%s\nbase=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" "${EXPECTED_BASE}" "$(git rev-parse HEAD^{tree})"

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.96.0
          rustc -Vv
          cargo -V
          rustfmt -V
          cargo clippy -V

      - name: Bind source identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            docs/research/REL_005A_GRAFT_FRAME_QUALIFICATION_2026-09-14.md \
            crates/core/symthaea-fep/tests/rel_graft_frame.rs \
            .github/rel/rel-005a-graft-frame-qualification.sh \
            .github/workflows/rel-005a-graft-frame-qualification.yml
          git rev-parse \
            HEAD:docs/research/REL_005A_GRAFT_FRAME_QUALIFICATION_2026-09-14.md \
            HEAD:crates/core/symthaea-fep/tests/rel_graft_frame.rs \
            HEAD:.github/rel/rel-005a-graft-frame-qualification.sh \
            HEAD:.github/workflows/rel-005a-graft-frame-qualification.yml

      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          test_file="crates/core/symthaea-fep/tests/rel_graft_frame.rs"
          if ! bash .github/rel/rel-005a-graft-frame-qualification.sh fmt; then
            cp "${test_file}" "${RUNNER_TEMP}/rel_graft_frame.before-rustfmt.rs"
            rustfmt --edition 2024 "${test_file}"
            git diff -- "${test_file}" > "${RUNNER_TEMP}/rel_graft_frame.rustfmt.diff"
            cp "${test_file}" "${RUNNER_TEMP}/rel_graft_frame.after-rustfmt.rs"
            git checkout -- "${test_file}"
            exit 1
          fi

      - name: Upload rustfmt failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-rustfmt-${{ env.EXPECTED_HEAD }}
          path: |
            ${{ runner.temp }}/rel_graft_frame.before-rustfmt.rs
            ${{ runner.temp }}/rel_graft_frame.after-rustfmt.rs
            ${{ runner.temp }}/rel_graft_frame.rustfmt.diff
          retention-days: 30
          if-no-files-found: ignore

      - name: Execute graft-frame measurement contract
        shell: bash
        env:
          REL005A_METRICS_PATH: ${{ runner.temp }}/rel-005a-metrics.json
        run: |
          set -euo pipefail
          bash .github/rel/rel-005a-graft-frame-qualification.sh test
          test -s "${REL005A_METRICS_PATH}"
          python3 -m json.tool "${REL005A_METRICS_PATH}" >/dev/null
          cat "${REL005A_METRICS_PATH}"

      - name: Warnings-denied Clippy
        shell: bash
        run: bash .github/rel/rel-005a-graft-frame-qualification.sh clippy

      - name: Postflight subject and checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Build machine-readable qualification receipt
        shell: bash
        env:
          METRICS_PATH: ${{ runner.temp }}/rel-005a-metrics.json
          RECEIPT_PATH: ${{ runner.temp }}/rel-005a-receipt.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          paths = [
              "docs/research/REL_005A_GRAFT_FRAME_QUALIFICATION_2026-09-14.md",
              "crates/core/symthaea-fep/tests/rel_graft_frame.rs",
              ".github/rel/rel-005a-graft-frame-qualification.sh",
              ".github/workflows/rel-005a-graft-frame-qualification.yml",
          ]

          def sha256(path: str) -> str:
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          def cmd(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          metrics = json.loads(pathlib.Path(os.environ["METRICS_PATH"]).read_text())
          receipt = {
              "schema": "symthaea.rel.graft-frame-qualification.v1",
              "contract_revision": "REL.005A.v1",
              "authority": "MeasurementOnly",
              "subject_head": cmd("git", "rev-parse", "HEAD"),
              "subject_tree": cmd("git", "rev-parse", "HEAD^{tree}"),
              "expected_head": os.environ["EXPECTED_HEAD"],
              "expected_base": os.environ.get("EXPECTED_BASE", ""),
              "rustc": cmd("rustc", "--version"),
              "cargo": cmd("cargo", "--version"),
              "files_sha256": {path: sha256(path) for path in paths},
              "files_git_blob": {
                  path: cmd("git", "rev-parse", f"HEAD:{path}") for path in paths
              },
              "metrics_sha256": sha256(os.environ["METRICS_PATH"]),
              "measurement": metrics,
              "phases": {
                  "rustfmt_check": "passed",
                  "graft_frame_measurement": "passed",
                  "warnings_denied_clippy": "passed",
                  "checkout_immutable_before_receipt": True,
              },
              "scope": {
                  "existing_production_api_executed": True,
                  "shared_mask_recovery": True,
                  "held_out_transport": True,
                  "three_frame_composition": True,
                  "loop_closure": True,
                  "fixed_vs_dressed_hadamard": True,
                  "raw_vs_pulled_back_cosine": True,
                  "inverse_floor_stress": True,
                  "negative_controls": True,
              },
              "claims": {
                  "production_behavior_changed": False,
                  "general_coordinate_group_established": False,
                  "fixed_hadamard_invariance_established": False,
                  "fixed_cosine_invariance_established": False,
                  "physical_gauge_symmetry_established": False,
                  "intelligence_improvement_established": False,
                  "consciousness_claim_established": False,
              },
          }
          pathlib.Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload measurement and qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-graft-frame-${{ env.EXPECTED_HEAD }}
          path: |
            ${{ runner.temp }}/rel-005a-metrics.json
            ${{ runner.temp }}/rel-005a-receipt.json
          retention-days: 30
          if-no-files-found: error
