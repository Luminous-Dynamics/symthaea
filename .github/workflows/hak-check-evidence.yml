name: HAK Check Evidence

on:
  pull_request:
    branches:
      - architecture/hak-plan-conformance-interpretation-v1
    paths:
      - 'scripts/hak_check_evidence_lint.py'
      - 'tests/python/test_hak_check_evidence_lint.py'
      - 'tests/python/test_hak_check_evidence_schema.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_PROVIDER_BOUND_CHECK_EVIDENCE_V1.md'
      - 'docs/architecture/hak/provider-bound-check-evidence-v1.schema.json'
      - 'docs/architecture/hak/plans/hak009-provider-check-evidence-e5-v1.plan.json'
      - '.github/workflows/hak-check-evidence.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-evidence-linter:
    name: HAK Provider-Bound Check Evidence
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          echo "HAK check-evidence exact subject: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile HAK evidence stack
        run: |
          python -m py_compile scripts/hak_evidence_lint.py
          python -m py_compile scripts/hak_interpretation_lint.py
          python -m py_compile scripts/hak_check_evidence_lint.py

      - name: Validate HAK-009 schema syntax
        run: python -m json.tool docs/architecture/hak/provider-bound-check-evidence-v1.schema.json >/dev/null

      - name: Lint HAK-009 qualification plan
        run: |
          python scripts/hak_evidence_lint.py \
            docs/architecture/hak/plans/hak009-provider-check-evidence-e5-v1.plan.json

      - name: Run HAK-009 regressions
        run: |
          python -m pytest -q \
            tests/python/test_hak_check_evidence_lint.py \
            tests/python/test_hak_check_evidence_schema.py
