name: ROB Benchmark Validity Reference

on:
  push:
    branches:
      - research/rob-benchmark-validity-001
    paths:
      - "research/rob-benchmark-validity-001/**"
      - ".github/workflows/rob-benchmark-validity.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/rob-benchmark-validity-001/**"
      - ".github/workflows/rob-benchmark-validity.yml"

permissions:
  contents: read

jobs:
  rust-reference:
    name: Rust 1.96 format, tests and strict Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/rob-benchmark-validity-001/reference/Cargo.toml -- --check
      - name: Run deterministic tests
        run: cargo test --locked --manifest-path research/rob-benchmark-validity-001/reference/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/rob-benchmark-validity-001/reference/Cargo.toml --all-targets -- -D warnings
