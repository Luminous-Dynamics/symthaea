name: GPU Fabric Vulkan Barrier Qualification

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-gpu-fabric/**'
      - '.github/workflows/gpu-fabric-vulkan-barriers.yml'
  workflow_dispatch:

jobs:
  vulkan-barriers:
    name: Vulkan resource barrier workload qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan runtime and validation
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers

      - name: Verify validation layer
        run: |
          vulkaninfo --summary
          vulkaninfo --summary | grep -q 'VK_LAYER_KHRONOS_validation'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Prepare isolated GPU Fabric workspace
        run: |
          rm -rf .ci/gpu-fabric-workspace
          mkdir -p .ci/gpu-fabric-workspace/src
          cp -R crates/core/symthaea-gpu-fabric/src/. .ci/gpu-fabric-workspace/src/
          cp Cargo.lock .ci/gpu-fabric-workspace/Cargo.lock
          cp crates/core/symthaea-gpu-fabric/Cargo.toml .ci/gpu-fabric-workspace/Cargo.toml
          sed -i -e 's/edition.workspace = true/edition = "2024"/' -e 's/license.workspace = true/license = "AGPL-3.0-or-later"/' -e 's/blake3 = { workspace = true }/blake3 = "1.5"/' -e 's/serde = { workspace = true }/serde = { version = "1.0", features = ["derive"] }/' -e 's/thiserror = { workspace = true }/thiserror = "=1.0.69"/' .ci/gpu-fabric-workspace/Cargo.toml
          printf '\n[workspace]\nresolver = "2"\n' >> .ci/gpu-fabric-workspace/Cargo.toml

      - name: Compile barrier workload harness
        working-directory: .ci/gpu-fabric-workspace
        run: cargo test --locked --features vulkan --lib

      - name: Execute real workload barrier qualification
        working-directory: .ci/gpu-fabric-workspace
        run: cargo test --locked --features vulkan --lib -- --ignored --nocapture