name: GPU Fabric Vulkan Barrier Qualification

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/core/symthaea-gpu-fabric/**'
      - '.github/workflows/gpu-fabric-vulkan-barriers.yml'
  workflow_dispatch:

jobs:
  vulkan-barriers:
    name: Vulkan resource barrier workload qualification
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact qualification checkout
        env:
          EXPECTED_QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_QUALIFICATION_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_QUALIFICATION_SHA" = "$EXPECTED_QUALIFICATION_SHA"
          echo "qualification_head=$ACTUAL_QUALIFICATION_SHA"

      - name: Install Vulkan runtime and validation
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers gdb

      - name: Verify validation layer
        run: |
          vulkaninfo --summary
          vulkaninfo --summary | grep -q 'VK_LAYER_KHRONOS_validation'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58 # 1.96.0

      - name: Prepare isolated GPU Fabric workspace
        run: |
          rm -rf .ci/gpu-fabric-workspace
          mkdir -p .ci/gpu-fabric-workspace/src
          cp -R crates/core/symthaea-gpu-fabric/src/. .ci/gpu-fabric-workspace/src/
          cp crates/core/symthaea-gpu-fabric/Cargo.toml .ci/gpu-fabric-workspace/Cargo.toml
          sed -i -e 's/edition.workspace = true/edition = "2024"/' -e 's/license.workspace = true/license = "AGPL-3.0-or-later"/' -e 's/blake3 = { workspace = true }/blake3 = "=1.8.5"/' -e 's/serde = { workspace = true }/serde = { version = "=1.0.228", features = ["derive"] }/' -e 's/thiserror = { workspace = true }/thiserror = "=1.0.69"/' .ci/gpu-fabric-workspace/Cargo.toml
          printf '\n[workspace]\nresolver = "2"\n' >> .ci/gpu-fabric-workspace/Cargo.toml

      - name: Resolve isolated dependency lock
        working-directory: .ci/gpu-fabric-workspace
        run: |
          cargo generate-lockfile
          test -s Cargo.lock
          sha256sum Cargo.lock | tee dependency-lock.sha256

      - name: Verify isolated workspace boundary
        working-directory: .ci/gpu-fabric-workspace
        run: |
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          grep -q '"name":"symthaea-gpu-fabric"' metadata.json
          if grep -q 'symthaea-observation-attestation' metadata.json; then
            echo 'isolated workspace unexpectedly resolved root workspace member' >&2
            exit 1
          fi

      - name: Record qualification environment
        working-directory: .ci/gpu-fabric-workspace
        run: |
          {
            echo "workflow_sha=$GITHUB_SHA"
            echo "qualification_commit=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_name=$RUNNER_NAME"
            rustc -Vv
            cargo -V
            echo "--- vulkaninfo --summary ---"
            vulkaninfo --summary
          } > qualification-environment.txt
          dpkg-query -W -f='${Package}\t${Version}\n' \
            libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers \
            > vulkan-package-versions.txt
          find src -type f -print0 | sort -z | xargs -0 sha256sum > source-sha256.txt
          sha256sum Cargo.toml Cargo.lock metadata.json vulkan-package-versions.txt > qualification-input-sha256.txt
          sha256sum ${GITHUB_WORKSPACE}/.github/workflows/gpu-fabric-vulkan-barriers.yml ${GITHUB_WORKSPACE}/.github/scripts/check-workflow-draft-safety.py >> qualification-input-sha256.txt

      - name: Compile barrier workload harness
        working-directory: .ci/gpu-fabric-workspace
        run: cargo test --locked --features vulkan --lib

      - name: Execute real workload barrier qualification
        working-directory: .ci/gpu-fabric-workspace
        run: |
          set -o pipefail
          cargo test --locked --features vulkan --lib -- --ignored --nocapture 2>&1 | tee qualification-runtime.txt

      - name: Capture native crash backtrace
        if: failure()
        working-directory: .ci/gpu-fabric-workspace
        continue-on-error: true
        run: |
          set +e
          TEST_BINARY="$(find target/debug/deps -maxdepth 1 -type f -name 'symthaea_gpu_fabric-*' -executable | sort | head -n 1)"
          test -n "$TEST_BINARY"
          {
            echo "test_binary=$TEST_BINARY"
            gdb -q -batch \
              -ex 'set pagination off' \
              -ex 'set confirm off' \
              -ex run \
              -ex 'thread apply all bt full' \
              --args "$TEST_BINARY" --ignored --nocapture
          } > qualification-gdb.txt 2>&1
          GDB_STATUS=$?
          echo "gdb_exit=$GDB_STATUS" >> qualification-gdb.txt
          exit 0

      - name: Seal runtime evidence digest
        if: always()
        working-directory: .ci/gpu-fabric-workspace
        run: |
          if test -f qualification-runtime.txt; then
            sha256sum qualification-runtime.txt | tee qualification-runtime.sha256
          else
            printf 'qualification_execution=not_reached\n' > qualification-runtime.txt
            sha256sum qualification-runtime.txt | tee qualification-runtime.sha256
          fi

      - name: Upload immutable qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-fabric-vulkan-barrier-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            .ci/gpu-fabric-workspace/Cargo.lock
            .ci/gpu-fabric-workspace/dependency-lock.sha256
            .ci/gpu-fabric-workspace/metadata.json
            .ci/gpu-fabric-workspace/Cargo.toml
            .ci/gpu-fabric-workspace/source-sha256.txt
            .ci/gpu-fabric-workspace/qualification-input-sha256.txt
            .ci/gpu-fabric-workspace/qualification-environment.txt
            .ci/gpu-fabric-workspace/vulkan-package-versions.txt
            .ci/gpu-fabric-workspace/qualification-runtime.txt
            .ci/gpu-fabric-workspace/qualification-runtime.sha256
            .ci/gpu-fabric-workspace/qualification-gdb.txt
