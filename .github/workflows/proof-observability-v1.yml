name: Proof Observability v1

on:
  pull_request:
    paths:
      - "docs/formal/PROOF_OBSERVABILITY_V1.md"
      - "docs/formal/proof_observability_v1.json"
      - "docs/formal/PROOF_REVIEW_CAPSULE_V1.md"
      - "docs/formal/proof_review_capsule_schema_v1.json"
      - "scripts/validate_proof_observability_v1.py"
      - "scripts/validate_proof_review_capsule_v1.py"
      - ".github/workflows/proof-observability-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-observability-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact subject
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          test -z "$(git status --porcelain)"

      - name: Revalidate parent proof capsule contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_proof_review_capsule_v1.py | tee /tmp/proof-review-capsule-v1.txt
          grep -Fx 'PROOF_REVIEW_CAPSULE_V1_PASS' /tmp/proof-review-capsule-v1.txt

      - name: Validate proof observability contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_proof_observability_v1.py | tee /tmp/proof-observability-v1.txt
          grep -Fx 'PROOF_OBSERVABILITY_V1_PASS' /tmp/proof-observability-v1.txt

      - name: Static claim-ceiling audit
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/formal/PROOF_OBSERVABILITY_V1.md
          grep -F 'proof observability != theorem truth' "$doc"
          grep -F 'no detected vacuity != complete specification' "$doc"
          grep -F 'coverage report != source refinement' "$doc"
          grep -F 'Unknown observability != evidence of defect' "$doc"

      - name: Digest review contracts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            docs/formal/PROOF_OBSERVABILITY_V1.md \
            docs/formal/proof_observability_v1.json \
            scripts/validate_proof_observability_v1.py

      - name: Prove checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
