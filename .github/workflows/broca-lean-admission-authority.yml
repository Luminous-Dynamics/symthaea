name: Broca Lean Admission Authority

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/broca-lean-admission-authority.yml'
      - 'patches/science/broca-lean-admission-authority-v1.patch'
      - 'crates/domains/symthaea-broca/src/formal_logic_scorer.rs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PATCH: patches/science/broca-lean-admission-authority-v1.patch

jobs:
  qualify:
    name: Prove admitted Lean scripts mint credit and qualify fail-closed gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze qualification-only scope
        run: |
          test -f "$PATCH"
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD^"; fi
          git diff --exit-code "$BASE" -- Cargo.toml Cargo.lock crates src || {
            echo 'qualification branch must not materialize product source'
            exit 1
          }

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Freeze Lean bridge admission contract
        run: |
          TACTIC=crates/bridges/symthaea-lean-bridge/src/tactic.rs
          SCORER=crates/domains/symthaea-broca/src/formal_logic_scorer.rs
          grep -F 'These count as failures, not' "$TACTIC"
          grep -F 'pub fn contains_sorry(&self) -> bool' "$TACTIC"
          grep -F 'CheckOutcome::Accepted => (1.0, true)' "$SCORER"
          ! grep -F 'contains_sorry()' "$SCORER"

      - name: Prove current scorer grants credit to admitted scripts
        run: |
          mkdir -p .qualification crates/domains/symthaea-broca/tests
          cat > .qualification/fake-lean <<'SH'
          #!/bin/sh
          exit 0
          SH
          chmod +x .qualification/fake-lean
          cat > crates/domains/symthaea-broca/tests/lean_admission_authority_negative_control.rs <<'RS'
          use symthaea_broca::FormalLogicScorer;
          use symthaea_core::hdc::fol_formula_ext::FolFormulaExt;
          use symthaea_core::hdc::logic_engine::Proposition;

          fn contains_admission(source: &str) -> bool {
              source.lines().any(|line| line.trim() == "sorry")
          }

          #[test]
          fn admitted_fol_and_nra_scripts_currently_receive_full_credit() {
              let scorer = FormalLogicScorer::new();

              let unproved_atom = FolFormulaExt::from_prop(Proposition::Atom("P".into()));
              let fol = scorer.score_algorithm("unproved_atom", &unproved_atom, "irrelevant");
              assert!(contains_admission(&fol.proof_script));
              assert_eq!(fol.score, 1.0);
              assert!(fol.verified);

              let nra = scorer.score_from_z3(
                  "nra_admission",
                  "x * x ≥ 0",
                  "(set-logic QF_NRA)\n",
              );
              assert!(contains_admission(&nra.proof_script));
              assert_eq!(nra.score, 1.0);
              assert!(nra.verified);
          }
          RS
          LEAN_PATH_BIN="$PWD/.qualification/fake-lean" \
            cargo test --locked -p symthaea-broca \
            --test lean_admission_authority_negative_control
          rm crates/domains/symthaea-broca/tests/lean_admission_authority_negative_control.rs

      - name: Validate and apply exact candidate patch
        run: |
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check

      - name: Ratchet admission-aware scoring
        run: |
          SCORER=crates/domains/symthaea-broca/src/formal_logic_scorer.rs
          grep -F 'fn lean_source_contains_admission' "$SCORER"
          grep -F 'let contains_admission = lean_source_contains_admission(&lean_source);' "$SCORER"
          grep -F 'let contains_admission = script.contains_sorry();' "$SCORER"
          grep -F 'CheckOutcome::Accepted if !contains_admission => (1.0, true)' "$SCORER"

      - name: Prove admissions receive zero credit while closed proof survives
        run: |
          cat > crates/domains/symthaea-broca/tests/lean_admission_authority_repaired.rs <<'RS'
          use symthaea_broca::FormalLogicScorer;
          use symthaea_core::hdc::fol_formula_ext::FolFormulaExt;
          use symthaea_core::hdc::logic_engine::Proposition;

          fn contains_admission(source: &str) -> bool {
              source.lines().any(|line| line.trim() == "sorry")
          }

          #[test]
          fn accepted_admissions_are_not_verified() {
              let scorer = FormalLogicScorer::new();

              let unproved_atom = FolFormulaExt::from_prop(Proposition::Atom("P".into()));
              let fol = scorer.score_algorithm("unproved_atom", &unproved_atom, "irrelevant");
              assert!(contains_admission(&fol.proof_script));
              assert_eq!(fol.score, 0.0);
              assert!(!fol.verified);

              let nra = scorer.score_from_z3(
                  "nra_admission",
                  "x * x ≥ 0",
                  "(set-logic QF_NRA)\n",
              );
              assert!(contains_admission(&nra.proof_script));
              assert_eq!(nra.score, 0.0);
              assert!(!nra.verified);

              let closed = FolFormulaExt::from_prop(Proposition::True);
              let theorem = scorer.verify_formula(&closed);
              assert!(!contains_admission(&theorem.proof_script));
              assert_eq!(theorem.score, 1.0);
              assert!(theorem.verified);
          }
          RS
          LEAN_PATH_BIN="$PWD/.qualification/fake-lean" \
            cargo test --locked -p symthaea-broca \
            --test lean_admission_authority_repaired
          rm crates/domains/symthaea-broca/tests/lean_admission_authority_repaired.rs

      - name: Format, check, and lint
        run: |
          cargo fmt --check -p symthaea-broca
          cargo check --locked -p symthaea-broca
          cargo clippy --locked -p symthaea-broca --lib -- -D warnings

      - name: Evidence boundary
        run: |
          echo 'PASS establishes that Lean process success cannot mint Broca formal-verification credit when the emitted proof contains the bridge-defined sorry admission; both FolFormulaExt and Z3-to-Lean admission paths are covered, while a closed True proof remains eligible.'
          echo 'It does not establish implementation conformance, completeness of the Lean translator, theorem-to-natural-language equivalence, SMT-body-to-Lean-statement identity, experimental validity, independent replication, scientific consensus, or action authority.'
