name: Cyber Crucible Trusted Verifier Build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact approved verifier-release tag ref.
        required: true
        type: string
      source_commit:
        description: Exact commit checked out from source_ref.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.repository == 'Luminous-Dynamics/symthaea'
    name: Build and test from exact caller source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source ref without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require semantic-version release tag and exact source commit
        env:
          EXPECTED_SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          source_ref = os.environ["EXPECTED_SOURCE_REF"]
          source_commit = os.environ["EXPECTED_SOURCE_COMMIT"]
          if re.fullmatch(r"refs/tags/cyber-crucible-verifier-v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", source_ref) is None:
              print("REJECTED: source_ref must be a semantic-version verifier release tag", file=sys.stderr)
              raise SystemExit(2)
          if re.fullmatch(r"[0-9a-f]{40}", source_commit) is None:
              print("REJECTED: source_commit must be a 40-character lowercase Git SHA", file=sys.stderr)
              raise SystemExit(2)
          actual = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if actual != source_commit:
              print("REJECTED: checked-out commit differs from expected source commit", file=sys.stderr)
              raise SystemExit(2)
          print(f"source_ref={source_ref}\nsource_commit={actual}")
          PY

      - name: Set up pinned Python security release
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"

      - name: Install only pinned contract dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r validation/cyber_crucible_verifier_requirements_v1.txt
          python -m pip check

      - name: Meta-validate all verifier JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          paths = sorted(Path("validation").glob("cyber_crucible_*schema.json"))
          for path in sorted(set(paths)):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"Draft 2020-12 schema meta-validation PASS: {path}")
          PY

      - name: Run signed receipt and diagnostic-loop regressions
        run: |
          python -m unittest discover -s tests -p "test_cyber_crucible_signed_receipt.py" -v
          python -m unittest discover -s tests -p "test_cyber_crucible_diagnostic_loop.py" -v

      - name: Run decision, report, provenance, and bundle regressions
        run: |
          python -m unittest discover -s tests -p "test_cyber_crucible_decision_receipt.py" -v
          python -m unittest discover -s tests -p "test_cyber_crucible_report_decision.py" -v
          python -m unittest discover -s tests -p "test_cyber_crucible_verifier_provenance.py" -v
          python -m unittest discover -s tests -p "test_cyber_crucible_verifier_bundle.py" -v

      - name: Reject test-induced source tree mutation
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "REJECTED: tests or tooling changed the release source checkout" >&2
            git status --short
            exit 2
          fi

      - name: Install SHA-pinned actionlint for release workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          expected="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSLo "/tmp/$archive" "https://github.com/rhysd/actionlint/releases/download/v$version/$archive"
          echo "$expected  /tmp/$archive" | sha256sum -c -
          mkdir -p /tmp/actionlint
          tar -xzf "/tmp/$archive" -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint -version

      - name: Lint trusted release workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          /tmp/actionlint/actionlint -color -shellcheck "" -pyflakes "" \
            .github/workflows/cyber-crucible-decision-receipt.yml \
            .github/workflows/cyber-crucible-trusted-build.yml \
            .github/workflows/cyber-crucible-verifier-release.yml

      - name: Parse-check verifier and regression Python sources
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(Path("scripts").glob("*cyber_crucible*.py"))
          paths += sorted(Path("tests").glob("test_cyber_crucible_*.py"))
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Python syntax PASS: {path}")
          PY

      - name: Build reproducible verifier archive twice
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python scripts/package_cyber_crucible_verifier.py build \
            --root . \
            --output "$RUNNER_TEMP/cyber-crucible-verifier-v1-a.tar.gz" \
            --source-commit "$EXPECTED_SOURCE_COMMIT"
          python scripts/package_cyber_crucible_verifier.py build \
            --root . \
            --output "$RUNNER_TEMP/cyber-crucible-verifier-v1-b.tar.gz" \
            --source-commit "$EXPECTED_SOURCE_COMMIT"
          cmp --silent "$RUNNER_TEMP/cyber-crucible-verifier-v1-a.tar.gz" "$RUNNER_TEMP/cyber-crucible-verifier-v1-b.tar.gz"
          python scripts/package_cyber_crucible_verifier.py verify \
            --bundle "$RUNNER_TEMP/cyber-crucible-verifier-v1-a.tar.gz" \
            --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
          sha256sum "$RUNNER_TEMP/cyber-crucible-verifier-v1-a.tar.gz"
          mv "$RUNNER_TEMP/cyber-crucible-verifier-v1-a.tar.gz" "$RUNNER_TEMP/cyber-crucible-verifier-v1.tar.gz"

      - name: Upload the exact tested verifier bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyber-crucible-verifier-v1
          path: ${{ runner.temp }}/cyber-crucible-verifier-v1.tar.gz
          if-no-files-found: error
          retention-days: 7

  release-approval:
    if: github.repository == 'Luminous-Dynamics/symthaea'
    name: Wait for protected release approval
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment:
      name: cyber-crucible-verifier-release
    permissions:
      contents: read
    steps:
      - name: Record the approved release identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'approved_ref=%s\napproved_commit=%s\n' "$GITHUB_REF" "$GITHUB_SHA"

  attest-exact-tested-bundle:
    if: github.repository == 'Luminous-Dynamics/symthaea'
    name: Attest exact archive in an isolated, non-executing job
    needs: [build-and-test, release-approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download only the tested verifier archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyber-crucible-verifier-v1
          path: ${{ runner.temp }}/downloaded

      - name: Check single expected artifact and copy to fixed subject path
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/downloaded/cyber-crucible-verifier-v1.tar.gz"
          test ! -L "$RUNNER_TEMP/downloaded/cyber-crucible-verifier-v1.tar.gz"
          test "$(find "$RUNNER_TEMP/downloaded" -type f | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/downloaded" -type l | wc -l)" -eq 0
          mkdir -p dist
          install -m 0644 "$RUNNER_TEMP/downloaded/cyber-crucible-verifier-v1.tar.gz" dist/cyber-crucible-verifier-v1.tar.gz
          sha256sum dist/cyber-crucible-verifier-v1.tar.gz

      - name: Generate GitHub artifact attestation for the exact tested bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/cyber-crucible-verifier-v1.tar.gz
