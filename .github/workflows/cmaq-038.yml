name: CMAQ-038 and conditional rank dependence qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/cmaq-037/**"
      - "research/cmaq-031/**"
      - "research/cmaq-038/**"
      - "research/cmaq-045/**"
      - ".github/workflows/cmaq-038.yml"
  push:
    branches:
      - "research/cmaq-037-*"
      - "research/cmaq-038-*"
    paths:
      - "research/cmaq-037/**"
      - "research/cmaq-031/**"
      - "research/cmaq-038/**"
      - ".github/workflows/cmaq-038.yml"

permissions:
  contents: read

concurrency:
  group: cmaq-038-base-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  rank-spectrum:
    name: CMAQ-038 multi-resolution rank spectrum
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.ref == 'research/cmaq-038-rank-spectrum-monitor-v0-1-20261127'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --manifest-path research/cmaq-038/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo +1.100.0 test --manifest-path research/cmaq-038/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo +1.100.0 clippy --manifest-path research/cmaq-038/Cargo.toml --locked --all-targets -- -D warnings
      - name: Paired rank-spectrum smoke probe
        run: cargo +1.100.0 run --release --manifest-path research/cmaq-038/Cargo.toml --locked --bin paired_probe -- 64 200 20261127 > cmaq-038-rank-spectrum-smoke.csv
      - name: Preserve smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmaq-038-rank-spectrum-smoke
          path: cmaq-038-rank-spectrum-smoke.csv
          if-no-files-found: error

  conditional-rank-dependence:
    name: CMAQ-045 conditional rank dependence
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.ref == 'research/cmaq-045-conditional-rank-contexts-v0-1-20261127'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --manifest-path research/cmaq-045/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo +1.100.0 test --manifest-path research/cmaq-045/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo +1.100.0 clippy --manifest-path research/cmaq-045/Cargo.toml --locked --all-targets -- -D warnings
      - name: Paired temporal-dependence smoke probe
        run: cargo +1.100.0 run --release --manifest-path research/cmaq-045/Cargo.toml --locked --bin dependence_probe -- 32 500 20261127 250 > cmaq-045-dependence-smoke.csv
      - name: Preserve paired probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmaq-045-dependence-smoke
          path: cmaq-045-dependence-smoke.csv
          if-no-files-found: error
