name: RES-EPI-001R2 Confidence Separation

on:
  pull_request:
    branches: [main]
    paths:
      - 'patches/science/res-epi-001r2-confidence-separation-v2.patch'
      - '.github/workflows/res-epi-001r2-confidence-separation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Freeze exact current-main parent and qualification-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=adb69f11fa8068b019cc5bb598d0c7726a197fc9
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.sha }}" = "$expected_parent"
          fi
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          changed="$(git diff --name-only "$expected_parent"...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(patches/science/res-epi-001r2-confidence-separation-v2\.patch|\.github/workflows/res-epi-001r2-confidence-separation\.yml)$' || true)"
          test -z "$unexpected" || {
            echo 'unexpected RES-EPI-001R2 scope:'
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Freeze current destructive scalar fusion
        shell: bash
        run: |
          set -euo pipefail
          file=src/web_research/conjecture_feed.rs
          grep -F 'conjecture.confidence = conjecture.confidence.min(prov.confidence as f64);' "$file"
          grep -F '`confidence` is capped by the source' "$file"
          grep -F 'pc.conjecture.confidence <= pc.provenance.confidence as f64' "$file"
          echo 'negative control: current main destructively fuses model and provenance confidence'

      - name: Apply exact candidate
        shell: bash
        run: |
          set -euo pipefail
          patch=patches/science/res-epi-001r2-confidence-separation-v2.patch
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

      - name: Ratchet separate confidence coordinates
        shell: bash
        run: |
          set -euo pipefail
          file=src/web_research/conjecture_feed.rs
          grep -F 'pub struct ProvenancedConfidenceCoordinates' "$file"
          grep -F 'pub conjecture_score: f64' "$file"
          grep -F 'pub data_provenance_confidence: f32' "$file"
          grep -F 'pub fn confidence_coordinates(&self)' "$file"
          grep -F 'Source provenance may constrain *admissibility* without rewriting' "$file"
          ! grep -Fq 'conjecture.confidence = conjecture.confidence.min(prov.confidence as f64);' "$file"
          ! grep -Fq '`confidence` is capped by the source' "$file"

      - name: Formatting
        run: cargo +1.96.0 fmt --all -- --check

      - name: Focused confidence-coordinate regressions
        run: |
          cargo +1.96.0 test --locked -p symthaea --lib --features web_research_module \
            test_research_dataset_flows_into_conjecture_engine -- --nocapture
          cargo +1.96.0 test --locked -p symthaea --lib --features web_research_module \
            test_unverified_provenance_forces_quarantine -- --nocapture

      - name: Compile web-research feature
        run: cargo +1.96.0 check --locked -p symthaea --lib --features web_research_module

      - name: Strict Clippy
        run: cargo +1.96.0 clippy --locked -p symthaea --lib --features web_research_module -- -D warnings

      - name: Restore product tree and prove qualification-only subject
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/web_research/conjecture_feed.rs
          test -z "$(git status --porcelain=v1)"

      - name: Qualification statement
        run: |
          echo 'PASS establishes only that this exact candidate preserves model and research-provenance confidence as separate coordinates while retaining the existing low-trust macro quarantine behavior.'
          echo 'PASS does not establish calibration, probability semantics, scientific verification, grammar admission safety, source independence, or action authority.'
