name: MEL-013A exact artifact byte verification

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/genealogy.rs"
      - "crates/domains/symthaea-muse/src/bin/muse_studio.rs"
      - ".github/workflows/mel-013a-artifact-bytes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genealogy-byte-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format Muse package
        run: cargo fmt --check --package symthaea-muse --manifest-path crates/domains/symthaea-muse/Cargo.toml
      - name: Test genealogy and exact-byte hashing
        run: cargo test --locked --package symthaea-muse --lib genealogy::tests --manifest-path crates/domains/symthaea-muse/Cargo.toml
      - name: Check Studio keep-path integration
        run: cargo check --locked --package symthaea-muse --features studio --bin muse_studio --manifest-path crates/domains/symthaea-muse/Cargo.toml
