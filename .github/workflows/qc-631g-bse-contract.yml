name: QC 6-31G BSE Conformance Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-quantum-chemistry/src/basis/basis_631g.rs"
      - ".github/workflows/qc-631g-bse-contract.yml"
  push:
    branches: [main]
    paths:
      - "crates/domains/symthaea-quantum-chemistry/src/basis/basis_631g.rs"
      - ".github/workflows/qc-631g-bse-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qc-631g-bse-contract-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  bse-conformance:
    name: Verify pinned 6-31G shell data
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head or event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checkout matches the requested source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            printf 'source HEAD mismatch: expected=%s actual=%s\n' "$EXPECTED_SOURCE_SHA" "$actual" >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # upstream action commit at 2026-10-09
        with:
          toolchain: 1.96.0

      - name: Verify every supported shell against pinned BSE v1 data
        run: cargo test --locked -p symthaea-quantum-chemistry --lib basis::basis_631g::tests
