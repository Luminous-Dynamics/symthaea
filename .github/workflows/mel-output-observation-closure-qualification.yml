name: MEL output observation closure qualification

on:
  pull_request:
    branches:
      - research/mel-predictive-transparency-audit-v1-20261123
    paths:
      - "tools/mel-judge-grounding-audit/**"
      - "docs/research/MEL_OUTPUT_OBSERVATION_CLOSURE_V1_2026-11-23.md"
      - ".github/workflows/mel-output-observation-closure-qualification.yml"
  push:
    branches:
      - research/mel-output-observation-closure-v1-20261123
    paths:
      - "tools/mel-judge-grounding-audit/**"
      - "docs/research/MEL_OUTPUT_OBSERVATION_CLOSURE_V1_2026-11-23.md"
      - ".github/workflows/mel-output-observation-closure-qualification.yml"

permissions:
  contents: read

jobs:
  observation-closure:
    name: Observation coverage and negative-evidence eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.96.0 fmt --check --manifest-path tools/mel-judge-grounding-audit/Cargo.toml
      - name: Verify committed dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch tools/mel-judge-grounding-audit/Cargo.lock > /dev/null
          test -f tools/mel-judge-grounding-audit/Cargo.lock
      - name: Run deterministic Rust tests
        run: cargo +1.96.0 test --locked --manifest-path tools/mel-judge-grounding-audit/Cargo.toml
      - name: Warnings-denied Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path tools/mel-judge-grounding-audit/Cargo.toml --all-targets -- -D warnings
      - name: Parse v2 schema JSON and replay the synthetic closure panel
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool tools/mel-judge-grounding-audit/schema/mel-musical-forecast-panel-v2.schema.json > /dev/null
          cargo +1.96.0 run --locked --quiet --manifest-path tools/mel-judge-grounding-audit/Cargo.toml \
            --bin mel-musical-forecast-audit -- audit \
            tools/mel-judge-grounding-audit/fixtures/valid-musical-forecast-v2.json \
            "$RUNNER_TEMP/mel-musical-forecast-report-v2.json"
          jq -e '.schema_version == "mel-musical-forecast-report-v2" and .observation_closure_count == 1 and .complete_observation_closure_count == 1 and .incomplete_observation_closure_count == 0 and .forecasts_without_observation_closure == 0 and .output_observation_structurally_eligible == true and .presence_brier_sample_count == 1 and .unobserved_forecast_event_count == 0 and .event_findings[0].presence_observed == true and .event_findings[0].presence_brier_score <= 0.003 and .structurally_valid_anticipatory_trace == true' \
            "$RUNNER_TEMP/mel-musical-forecast-report-v2.json" > /dev/null
      - name: Assemble exact-head reproducibility evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/mel-observation-closure-evidence"
          mkdir -p "$evidence"
          printf 'tested_head=%s\n' "$(git rev-parse HEAD)" > "$evidence/source-revision.txt"
          git rev-parse HEAD:tools/mel-judge-grounding-audit/src/predictive_transparency.rs > "$evidence/forecast-lib-blob.txt"
          rustc +1.96.0 --version > "$evidence/rustc-version.txt" 2>&1 || true
          cargo +1.96.0 --version > "$evidence/cargo-version.txt" 2>&1 || true
          cp tools/mel-judge-grounding-audit/Cargo.toml "$evidence/"
          cp tools/mel-judge-grounding-audit/Cargo.lock "$evidence/"
          cp tools/mel-judge-grounding-audit/src/predictive_transparency.rs "$evidence/"
          cp tools/mel-judge-grounding-audit/src/bin/mel-musical-forecast-audit.rs "$evidence/"
          cp tools/mel-judge-grounding-audit/schema/mel-musical-forecast-panel-v2.schema.json "$evidence/"
          cp tools/mel-judge-grounding-audit/fixtures/valid-musical-forecast-v2.json "$evidence/"
          cp docs/research/MEL_OUTPUT_OBSERVATION_CLOSURE_V1_2026-11-23.md "$evidence/"
          if [[ -f "$RUNNER_TEMP/mel-musical-forecast-report-v2.json" ]]; then
            cp "$RUNNER_TEMP/mel-musical-forecast-report-v2.json" "$evidence/"
          fi
          (cd "$evidence" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mel-observation-closure-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-observation-closure-evidence/
          if-no-files-found: error
          retention-days: 90
