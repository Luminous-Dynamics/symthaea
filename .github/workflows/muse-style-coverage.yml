name: Muse Style Coverage

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse-protocol/src/catalog.rs"
      - "crates/domains/symthaea-music-theory/src/style.rs"
      - "crates/domains/symthaea-music-theory/src/grammar.rs"
      - "crates/domains/symthaea-music-theory/examples/diversity_census.rs"
      - "crates/domains/symthaea-music-theory/examples/style_control_response_curves.rs"
      - "crates/domains/symthaea-muse/src/theory_realize.rs"
      - "scripts/muse_style_capability_inventory.py"
      - "tests/python/test_muse_style_capability_inventory.py"
      - "scripts/muse_genre_completion_roadmap.py"
      - "tests/python/test_muse_genre_completion_roadmap.py"
      - "crates/domains/symthaea-muse/genre-completion-roadmap-v1.json"
      - "crates/domains/symthaea-muse/SOUTHERN_AFRICAN_GENRE_RESEARCH_BRIEF_V1.md"
      - "crates/domains/symthaea-muse/MUSE_GLOBAL_GENRE_COVERAGE_RESEARCH_V1.md"
      - "crates/domains/symthaea-muse/style-genre-coverage-baseline-v1.json"
      - "scripts/muse_style_coverage.py"
      - "tests/python/test_muse_style_coverage.py"
      - ".github/workflows/muse-style-coverage.yml"
      - ".github/workflows/muse-style-response-curves.yml"
  push:
    branches: [main]
    paths:
      - "crates/domains/symthaea-muse-protocol/src/catalog.rs"
      - "crates/domains/symthaea-music-theory/src/style.rs"
      - "crates/domains/symthaea-music-theory/src/grammar.rs"
      - "crates/domains/symthaea-music-theory/examples/diversity_census.rs"
      - "crates/domains/symthaea-music-theory/examples/style_control_response_curves.rs"
      - "crates/domains/symthaea-muse/src/theory_realize.rs"
      - "scripts/muse_style_capability_inventory.py"
      - "tests/python/test_muse_style_capability_inventory.py"
      - "scripts/muse_genre_completion_roadmap.py"
      - "tests/python/test_muse_genre_completion_roadmap.py"
      - "crates/domains/symthaea-muse/genre-completion-roadmap-v1.json"
      - "crates/domains/symthaea-muse/SOUTHERN_AFRICAN_GENRE_RESEARCH_BRIEF_V1.md"
      - "crates/domains/symthaea-muse/MUSE_GLOBAL_GENRE_COVERAGE_RESEARCH_V1.md"
      - "crates/domains/symthaea-muse/style-genre-coverage-baseline-v1.json"
      - "scripts/muse_style_coverage.py"
      - "tests/python/test_muse_style_coverage.py"
      - ".github/workflows/muse-style-coverage.yml"
      - ".github/workflows/muse-style-response-curves.yml"

permissions:
  contents: read

concurrency:
  group: muse-style-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style-coverage:
    name: Catalog and runtime style capability checks
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check source-derived coverage against the frozen baseline
        run: python3 scripts/muse_style_coverage.py --check

      - name: Test parsing, integrity guards, and drift detection
        run: python3 tests/python/test_muse_style_coverage.py -v

      - name: Audit source-declared executable style controls
        run: python3 scripts/muse_style_capability_inventory.py > /tmp/muse-style-capability-inventory.json

      - name: Publish style capability source map to the job summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/muse-style-capability-inventory.json").read_text())
          summary = report["summary"]
          source = report["source"]
          print("## Muse runtime capability source map")
          print()
          print(
              f"Catalog rows: {summary['catalog_entries']}; "
              f"rows with runtime profiles: {summary['catalog_entries_with_runtime_profile']}; "
              f"catalog-only rows: {summary['catalog_entries_without_runtime_profile']}."
          )
          print()
          print(
              "Grammar dispatch modes: "
              + ", ".join(
                  f"{name} = {count}"
                  for name, count in summary["grammar_dispatch_modes"].items()
              )
          )
          print()
          print(
              "Intent-axis declaration counts: "
              + ", ".join(
                  f"{count} axes = {styles} styles"
                  for count, styles in summary["intent_axis_count_distribution"].items()
              )
          )
          print(
              "Styles declaring no intent axes: "
              + (", ".join(summary["styles_with_zero_intent_axes"]) or "none")
          )
          print()
          print("| Source | Path | Git blob SHA |")
          print("|---|---|---|")
          for label, path_key, hash_key in [
              ("Catalog", "catalog_path", "catalog_blob_sha"),
              ("Style declarations", "style_path", "style_blob_sha"),
              ("Grammar dispatch", "grammar_dispatch_path", "grammar_dispatch_blob_sha"),
              ("Instrument realization", "realization_path", "realization_blob_sha"),
              ("Intent-axis census source", "intent_axis_evidence_path", "intent_axis_evidence_blob_sha"),
          ]:
              print(f"| {label} | {source[path_key]} | {source[hash_key]} |")
          print()
          print("| Style | Grammar family | Dispatch mode | Intent axes | Instrument pool choices |")
          print("|---|---|---|---:|---:|")
          for item in report["profiles"]:
              print(
                  f"| {item['style']} | {item['grammar_family']} | "
                  f"{item['grammar_dispatch']['mode']} | "
                  f"{item['intent_axis_count']} | "
                  f"{item['instrument_pool']['ensemble_choices']} |"
              )
          print()
          print(
              "Note: this inventories source-declared capability only. It does not run "
              "the causal census or validate audio rendering, perceptual distinctness, "
              "or cultural authenticity."
          )
          PY

      - name: Test runtime capability inventory parser and fail-closed guards
        run: python3 tests/python/test_muse_style_capability_inventory.py -v

      - name: Verify all-genre completion roadmap against source
        run: python3 scripts/muse_genre_completion_roadmap.py --check

      - name: Test completion coverage, workstream routing, and expansion intake
        run: python3 tests/python/test_muse_genre_completion_roadmap.py -v
