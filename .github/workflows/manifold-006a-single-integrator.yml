name: MANIFOLD-006A Single Integrator Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/manifold-006a-single-integrator.yml'
      - 'crates/core/symthaea-core/src/kinodynamic_reachability.rs'
      - 'crates/core/symthaea-core/src/lib.rs'
      - 'crates/core/symthaea-core/tests/manifold_006a_single_integrator.rs'
      - 'crates/core/symthaea-core/Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: 17d8ef199a9daa10dc0d6cea3c20756184f678f3
  SUPERSEDED_FAILED_SUBJECT: aa9616c6e8b1d180501c34a8bf5b1e21197689b9
  SUPERSEDED_FAILED_RUN: '34765482658'

jobs:
  qualify:
    name: Analytic dynamics and replay theorem
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          ref: ${{ env.SUBJECT_SHA }}

      - name: Bind exact subject and MANIFOLD-005 parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/manifold-006a
          {
            echo "schema=symthaea.manifold-006a.environment.v2"
            echo "subject_sha=$SUBJECT_SHA"
            echo "parent_sha=$(git rev-parse HEAD^)"
            echo "tree_sha=$(git rev-parse HEAD^{tree})"
            echo "superseded_failed_subject=$SUPERSEDED_FAILED_SUBJECT"
            echo "superseded_failed_run=$SUPERSEDED_FAILED_RUN"
            echo "superseded_failure_class=unrelated-lib-test-harness-compile"
            echo "runner_label=ubuntu-24.04"
            echo "checkout_action_sha=11d5960a326750d5838078e36cf38b85af677262"
            echo "upload_artifact_action_sha=ea165f8d65b6e75b540449e92b4886f43607fa02"
          } > artifacts/manifold-006a/environment.txt

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"

      - name: Extend environment capsule
        run: |
          set -euo pipefail
          {
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "rustc_host=$(rustc -vV | sed -n 's/^host: //p')"
            echo "rustc_commit=$(rustc -vV | sed -n 's/^commit-hash: //p')"
            echo "llvm_version=$(rustc -vV | sed -n 's/^LLVM version: //p')"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
          } >> artifacts/manifold-006a/environment.txt

      - name: Check exact core crate
        run: |
          cargo check --locked -p symthaea-core --no-default-features

      - name: Run self-contained MANIFOLD-006A qualification corpus
        run: |
          cargo test --locked -p symthaea-core --no-default-features \
            --test manifold_006a_single_integrator

      - name: Emit qualification receipt
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'schema': 'symthaea.manifold-006a.qualification.v2',
              'source_subject': os.environ['SUBJECT_SHA'].lower(),
              'exact_parent': os.environ['BASE_SHA'],
              'rust': '1.96.0',
              'core_check': 'PASS',
              'self_contained_qualification_corpus': 'PASS',
              'superseded_failed_subject': os.environ['SUPERSEDED_FAILED_SUBJECT'],
              'superseded_failed_run': int(os.environ['SUPERSEDED_FAILED_RUN']),
              'superseded_failure_class': 'unrelated-lib-test-harness-compile',
              'claim_scope': 'synthetic analytic bounded 1-D single-integrator reachability and independent replay only',
              'verdict': 'PASS',
          }
          Path('artifacts/manifold-006a/report.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Hash qualification capsule
        if: always()
        run: |
          set -euo pipefail
          cd artifacts/manifold-006a
          : > SHA256SUMS
          for file in environment.txt report.json; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS
            fi
          done

      - name: Upload qualification capsule
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manifold-006a-single-integrator-${{ env.SUBJECT_SHA }}
          path: artifacts/manifold-006a/
          if-no-files-found: error
          retention-days: 90
