name: STT acoustic encoder qualification

on:
  push:
    branches:
      - fix/voice-hdc-001-live-offline-encoder-parity
    paths:
      - "crates/core/symthaea-stt/**"
      - "src/perception/audio.rs"
      - "src/perception/audio_stream.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/stt-acoustic-qualification.yml"
  pull_request:
    branches:
      - main
      - fix/voice-stt-loss-001-absolute-frame-continuity
    paths:
      - "crates/core/symthaea-stt/**"
      - "src/perception/audio.rs"
      - "src/perception/audio_stream.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/stt-acoustic-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stt-acoustic-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head-acoustic:
    name: Exact-head encoder parity, compatibility and app tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${QUALIFIED_SHA}"

      - name: Install repository-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Assert pinned toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          cargo --version
          rustfmt --version

      - name: Check formatting
        run: cargo fmt --manifest-path Cargo.toml -p symthaea-stt -p symthaea -- --check

      - name: Reconcile tracked Cargo.lock without weakening qualification
        id: lockfile
        shell: bash
        run: |
          set +e
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.tracked"
          cargo metadata --manifest-path Cargo.toml --format-version 1 \
            > "$RUNNER_TEMP/cargo-metadata.json" \
            2> "$RUNNER_TEMP/cargo-metadata.stderr"
          metadata_status=$?
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.resolved"
          diff -u "$RUNNER_TEMP/Cargo.lock.tracked" "$RUNNER_TEMP/Cargo.lock.resolved" \
            > "$RUNNER_TEMP/Cargo.lock.diff"
          diff_status=$?
          echo "metadata_status=$metadata_status"
          echo "lockfile_diff_status=$diff_status"
          if [ "$metadata_status" -ne 0 ]; then
            cat "$RUNNER_TEMP/cargo-metadata.stderr"
            echo "::error::Cargo metadata could not resolve the workspace"
            exit 1
          fi
          if [ "$diff_status" -ne 0 ]; then
            cat "$RUNNER_TEMP/Cargo.lock.diff"
            echo "::error::Tracked Cargo.lock is stale; commit the reviewed resolver output before qualification"
            exit 1
          fi

      - name: Upload Cargo.lock reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stt-cargo-lockfile-reconciliation
          path: |
            ${{ runner.temp }}/Cargo.lock.tracked
            ${{ runner.temp }}/Cargo.lock.resolved
            ${{ runner.temp }}/Cargo.lock.diff
            ${{ runner.temp }}/cargo-metadata.stderr
          if-no-files-found: warn
          retention-days: 7

      - name: Run STT unit tests, including live/offline parity and metadata negatives
        run: cargo test --manifest-path Cargo.toml -p symthaea-stt --lib --locked

      - name: Run application audio-perception tests with voice-stt
        run: cargo test --manifest-path Cargo.toml -p symthaea --lib --features voice-stt --locked

      - name: Run strict STT Clippy
        run: cargo clippy --manifest-path Cargo.toml -p symthaea-stt --lib --locked -- -D warnings

      - name: Run strict application Clippy with voice-stt
        run: cargo clippy --manifest-path Cargo.toml -p symthaea --lib --features voice-stt --locked -- -D warnings
