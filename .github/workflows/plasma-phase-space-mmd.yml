name: Plasma phase-space characteristic MMD oracle

on:
  push:
    paths:
      - "crates/tools/plasma-phase-space-mmd/**"
      - "benchmarks/plasma/phase-space-mmd-oracle-v0.1.json"
      - "docs/research/PLASMA_PHASE_SPACE_MMD_ORACLE_2026-11-21.md"
      - ".github/workflows/plasma-phase-space-mmd.yml"
  pull_request:
    paths:
      - "crates/tools/plasma-phase-space-mmd/**"
      - "benchmarks/plasma/phase-space-mmd-oracle-v0.1.json"
      - "docs/research/PLASMA_PHASE_SPACE_MMD_ORACLE_2026-11-21.md"
      - ".github/workflows/plasma-phase-space-mmd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-space-mmd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Strict format check
        run: cargo fmt --manifest-path crates/tools/plasma-phase-space-mmd/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/plasma-phase-space-mmd/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/plasma-phase-space-mmd/Cargo.toml --all-targets -- -D warnings
