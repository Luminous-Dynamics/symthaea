name: PA15 Prequalification

on:
  push:
    branches:
      - physical-agency/pa-15-rustfmt-repair-work

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  qualify:
    name: Prequalify Physical Agency with Rust 1.96
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install exact toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --check -p symthaea-physical-effects -p symthaea-physical-agency

      - name: Check Physical Agency packages
        run: cargo check -p symthaea-physical-effects -p symthaea-physical-agency --all-targets

      - name: Test Physical Agency packages
        run: cargo test -p symthaea-physical-effects -p symthaea-physical-agency --all-targets

      - name: Clippy Physical Agency packages
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p symthaea-physical-effects -p symthaea-physical-agency --all-targets -- -D warnings 2>&1 | tee pa15-clippy.txt

      - name: Upload clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa15-clippy-diagnostics
          path: pa15-clippy.txt
          if-no-files-found: error
          retention-days: 7
