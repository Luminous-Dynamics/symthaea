name: ES256 COSE Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-swarm/src/semantic_evidence_vds.rs"
      - "crates/domains/symthaea-swarm/src/semantic_evidence_anchor.rs"
      - "crates/domains/symthaea-swarm/tests/rfc9942_cose_key_corpus.rs"
      - "crates/domains/symthaea-swarm/tests/rfc9942_es256_interop.rs"
      - "crates/domains/symthaea-swarm/tests/rfc9942_semantic_qualification.rs"
      - "crates/domains/symthaea-swarm/fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/es256-cose-qualification.yml"
  push:
    branches:
      - "hardening/**"
    paths:
      - "crates/domains/symthaea-swarm/src/semantic_evidence_vds.rs"
      - "crates/domains/symthaea-swarm/src/semantic_evidence_anchor.rs"
      - "crates/domains/symthaea-swarm/tests/rfc9942_cose_key_corpus.rs"
      - "crates/domains/symthaea-swarm/tests/rfc9942_es256_interop.rs"
      - "crates/domains/symthaea-swarm/fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/es256-cose-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: es256-cose-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: ES256 COSE corpus
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58 # 1.96.0
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-es256-cose-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-es256-cose-
      - name: Run COSE_Key interoperability corpus
        run: cargo test -p symthaea-swarm --features semantic-receipts --test rfc9942_cose_key_corpus
      - name: Run focused RFC 9942 semantic qualification
        run: cargo test -p symthaea-swarm --features semantic-receipts --test rfc9942_semantic_qualification
      - name: Run RFC 8392 ES256 known-answer vector
        run: cargo test -p symthaea-swarm --features semantic-receipts --test rfc9942_es256_interop

  fuzz-build:
    name: ES256 COSE fuzz target build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58 # 1.96.0
      - name: Cache fuzz Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/domains/symthaea-swarm/fuzz/target
          key: ${{ runner.os }}-es256-cose-fuzz-${{ hashFiles('crates/domains/symthaea-swarm/fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-es256-cose-fuzz-
      - name: Assert expected fuzz target inventory
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --manifest-path crates/domains/symthaea-swarm/fuzz/Cargo.toml --no-deps --format-version 1)"
          for target in \
            fuzz_cose_key_es256 \
            fuzz_rfc9942_receipt \
            fuzz_rfc9942_signature_with_receipts \
            fuzz_rfc9942_proofs
          do
            grep -F '"name":"'"$target"'"' <<<"$metadata" >/dev/null
          done
      - name: Check fuzz manifest
        run: cargo check --manifest-path crates/domains/symthaea-swarm/fuzz/Cargo.toml --bins
