name: Finite symmetry quotient reference

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "research/symmetry-quotient-001/**"
      - ".github/workflows/symmetry-quotient-reference.yml"
  push:
    branches: [main]
    paths:
      - "research/symmetry-quotient-001/**"
      - ".github/workflows/symmetry-quotient-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symmetry-quotient-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      # Generate the exact pinned dependency lock, retain it for review, then
      # use --locked on all qualification commands below.
      - name: Resolve and snapshot canonical commitment dependencies
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path research/symmetry-quotient-001/Cargo.toml
          cp research/symmetry-quotient-001/Cargo.lock "$RUNNER_TEMP/symmetry-quotient-Cargo.lock"
          sha256sum "$RUNNER_TEMP/symmetry-quotient-Cargo.lock" > "$RUNNER_TEMP/symmetry-quotient-Cargo.lock.sha256"
      - name: Upload resolved lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: symmetry-quotient-lockfile-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/symmetry-quotient-Cargo.lock
            ${{ runner.temp }}/symmetry-quotient-Cargo.lock.sha256
          if-no-files-found: error
      - name: Format
        run: cargo fmt --manifest-path research/symmetry-quotient-001/Cargo.toml --all -- --check
      - name: Test
        run: cargo test --locked --manifest-path research/symmetry-quotient-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/symmetry-quotient-001/Cargo.toml --all-targets -- -D warnings
