name: RSK Safety Kernel

on:
  pull_request:
    paths:
      - 'crates/domains/symthaea-replicator-safety/**'
      - 'crates/domains/symthaea-replicator-semantics/**'
      - 'crates/domains/symthaea-replicator-ledger/**'
      - 'docs/architecture/replicator-safety/**'
      - '.github/workflows/rsk-safety.yml'
      - 'scripts/rsk_qualification.py'
      - 'scripts/test_rsk_qualification.py'
      - 'scripts/verify_rsk_qualification.py'
      - 'scripts/test_verify_rsk_qualification.py'
      - 'scripts/rsk_semantic_schema.py'
      - 'scripts/test_rsk_semantic_schema.py'
      - 'scripts/rsk_schema_adapter.py'
      - 'scripts/test_rsk_schema_adapter.py'
      - 'scripts/rsk_schema_registry.py'
      - 'scripts/test_rsk_schema_registry.py'
      - 'scripts/rsk_monotonic_anchor.py'
      - 'scripts/test_rsk_monotonic_anchor.py'
      - 'scripts/check-class-a-changes.sh'
      - 'docs/compliance/GOVERNANCE_CHARTER.md'
  push:
    branches: [main]
    paths:
      - 'crates/domains/symthaea-replicator-safety/**'
      - 'crates/domains/symthaea-replicator-semantics/**'
      - 'crates/domains/symthaea-replicator-ledger/**'
      - 'docs/architecture/replicator-safety/**'
      - '.github/workflows/rsk-safety.yml'
      - 'scripts/rsk_qualification.py'
      - 'scripts/test_rsk_qualification.py'
      - 'scripts/verify_rsk_qualification.py'
      - 'scripts/test_verify_rsk_qualification.py'
      - 'scripts/rsk_semantic_schema.py'
      - 'scripts/test_rsk_semantic_schema.py'
      - 'scripts/rsk_schema_adapter.py'
      - 'scripts/test_rsk_schema_adapter.py'
      - 'scripts/rsk_schema_registry.py'
      - 'scripts/test_rsk_schema_registry.py'
      - 'scripts/rsk_monotonic_anchor.py'
      - 'scripts/test_rsk_monotonic_anchor.py'
      - 'scripts/check-class-a-changes.sh'
      - 'docs/compliance/GOVERNANCE_CHARTER.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsk-safety-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rsk-governance:
    name: RSK Class A ADR gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require an RSK Class A ADR for safety-boundary changes
        shell: bash
        run: |
          set -euo pipefail
          base_sha='${{ github.event.pull_request.base.sha }}'
          changed_files="$(git diff --name-only "${base_sha}"...HEAD)"

          class_a_pattern='^(crates/domains/symthaea-replicator-safety/|crates/domains/symthaea-replicator-semantics/|crates/domains/symthaea-replicator-ledger/|docs/architecture/replicator-safety/|\.github/workflows/rsk-safety\.yml$|scripts/rsk_qualification\.py$|scripts/test_rsk_qualification\.py$|scripts/verify_rsk_qualification\.py$|scripts/test_verify_rsk_qualification\.py$|scripts/rsk_semantic_schema\.py$|scripts/test_rsk_semantic_schema\.py$|scripts/rsk_schema_adapter\.py$|scripts/test_rsk_schema_adapter\.py$|scripts/rsk_schema_registry\.py$|scripts/test_rsk_schema_registry\.py$|scripts/rsk_monotonic_anchor\.py$|scripts/test_rsk_monotonic_anchor\.py$|scripts/check-class-a-changes\.sh$|docs/compliance/GOVERNANCE_CHARTER\.md$)'

          if ! printf '%s\n' "${changed_files}" | grep -Eq "${class_a_pattern}"; then
            echo "No RSK Class A implementation/governance surface changed."
            exit 0
          fi

          echo "RSK Class A surface changed; verifying ADR evidence."
          adr_files="$(printf '%s\n' "${changed_files}" | grep -E '^docs/compliance/adr/ADR-[0-9]+.*\.md$' || true)"
          if [ -z "${adr_files}" ]; then
            echo "ERROR: RSK Class A changes require a changed ADR under docs/compliance/adr/."
            exit 1
          fi

          valid_adr=false
          while IFS= read -r adr; do
            [ -n "${adr}" ] || continue
            if grep -Eq '(Replicator Safety Kernel|RSK)' "${adr}" \
              && grep -Eq '^\*\*Change Class\*\*: A([[:space:]]|$)' "${adr}"; then
              echo "RSK Class A ADR found: ${adr}"
              valid_adr=true
              break
            fi
          done <<< "${adr_files}"

          if ! ${valid_adr}; then
            echo "ERROR: changed ADRs do not identify RSK and declare Change Class A."
            exit 1
          fi

      - name: Verify generic Class A detector retains RSK coverage
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            'crates/domains/symthaea-replicator-safety/'
            'crates/domains/symthaea-replicator-semantics/'
            'crates/domains/symthaea-replicator-ledger/'
            'docs/architecture/replicator-safety/'
            '.github/workflows/rsk-safety.yml'
            'scripts/rsk_qualification.py'
            'scripts/test_rsk_qualification.py'
            'scripts/verify_rsk_qualification.py'
            'scripts/test_verify_rsk_qualification.py'
            'scripts/rsk_semantic_schema.py'
            'scripts/test_rsk_semantic_schema.py'
            'scripts/rsk_schema_adapter.py'
            'scripts/test_rsk_schema_adapter.py'
            'scripts/rsk_schema_registry.py'
            'scripts/test_rsk_schema_registry.py'
            'scripts/rsk_monotonic_anchor.py'
            'scripts/test_rsk_monotonic_anchor.py'
            'scripts/check-class-a-changes.sh'
            'docs/compliance/GOVERNANCE_CHARTER.md'
          )

          for path in "${required_paths[@]}"; do
            if ! grep -Fq "\"${path}\"" scripts/check-class-a-changes.sh; then
              echo "ERROR: generic Class A detector lost required RSK/governance path: ${path}"
              exit 1
            fi
          done

          echo "Generic Class A detector retains all required RSK/governance paths."

      - name: Self-test the RSK qualification generator
        run: python3 scripts/test_rsk_qualification.py -v

      - name: Self-test the independent receipt verifier
        run: python3 scripts/test_verify_rsk_qualification.py -v

      - name: Self-test semantic schema canonicalization
        run: python3 scripts/test_rsk_semantic_schema.py -v

      - name: Self-test deterministic schema adapter
        run: python3 scripts/test_rsk_schema_adapter.py -v

      - name: Self-test schema registry state verifier
        run: python3 scripts/test_rsk_schema_registry.py -v

      - name: Self-test monotonic anchor composition
        run: python3 scripts/test_rsk_monotonic_anchor.py -v

      - name: Keep RSK reference crates non-publishable until admission
        shell: bash
        run: |
          set -euo pipefail
          manifests=(
            crates/domains/symthaea-replicator-safety/Cargo.toml
            crates/domains/symthaea-replicator-semantics/Cargo.toml
            crates/domains/symthaea-replicator-ledger/Cargo.toml
          )

          for manifest in "${manifests[@]}"; do
            if ! grep -Eq '^publish[[:space:]]*=[[:space:]]*false[[:space:]]*$' "${manifest}"; then
              echo "ERROR: ${manifest} is publishable while RSK production admission remains denied."
              exit 1
            fi
          done

          if ! grep -Fq 'Production admission status: DENIED / NOT YET ELIGIBLE.' \
            docs/architecture/replicator-safety/RSK_PRODUCTION_ADMISSION_GATES_V0_1.md; then
            echo "ERROR: production-admission status marker is missing or changed."
            exit 1
          fi

          echo "RSK reference crates remain non-publishable and admission remains explicitly denied."

      - name: Require RSK workspace packages in committed Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          missing=false
          for package in \
            symthaea-replicator-safety \
            symthaea-replicator-semantics \
            symthaea-replicator-ledger; do
            if ! grep -Fq "name = \"${package}\"" Cargo.lock; then
              echo "ERROR: Cargo.lock is missing RSK workspace package: ${package}"
              missing=true
            fi
          done
          if ${missing}; then
            echo "ERROR: regenerate and review Cargo.lock per RSK Class A blocker #1926."
            exit 1
          fi

  rsk-format:
    name: RSK format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Run format qualification capsule
        run: >-
          python3 scripts/rsk_qualification.py
          --phase format
          --output-dir "${RUNNER_TEMP}/rsk-qualification-format"

      - name: Independently verify format receipt
        if: always()
        run: >-
          python3 scripts/verify_rsk_qualification.py
          "${RUNNER_TEMP}/rsk-qualification-format/receipt.json"
          --repo .
          --require-current-subject

      - name: Upload format qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsk-format-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rsk-qualification-format/**
          if-no-files-found: error
          retention-days: 30

  rsk-semantic-types-diagnostic:
    name: RSK semantic types diagnostic (non-admissible until #1926)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: State diagnostic evidence boundary
        run: |
          echo 'This job intentionally permits ephemeral Cargo.lock refresh to expose compiler/test findings.'
          echo 'It is NOT admissible RSK qualification evidence while #1926 remains unresolved.'

      - name: Format semantic identity crate
        run: cargo fmt --check -p symthaea-replicator-semantics

      - name: Check semantic identity crate with ephemeral lock refresh allowed
        run: cargo check -p symthaea-replicator-semantics --all-targets

      - name: Test semantic identity crate and authority golden vectors
        run: |
          cargo test -p symthaea-replicator-semantics --all-targets
          cargo test -p symthaea-replicator-safety --test semantic_schema

      - name: Clippy semantic identity crate
        run: cargo clippy -p symthaea-replicator-semantics --all-targets -- -D warnings

      - name: Capture diagnostic Cargo.lock drift
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rsk-lock-diagnostic"
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock did not change in the diagnostic job.' \
              > "${RUNNER_TEMP}/rsk-lock-diagnostic/README.txt"
          else
            git diff -- Cargo.lock > "${RUNNER_TEMP}/rsk-lock-diagnostic/Cargo.lock.patch"
            printf '%s\n' \
              'NON-ADMISSIBLE DIAGNOSTIC ONLY.' \
              'Generate and commit the lockfile under controlled Class A review; do not apply this artifact blindly.' \
              > "${RUNNER_TEMP}/rsk-lock-diagnostic/README.txt"
          fi

      - name: Upload diagnostic lock drift
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsk-lock-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rsk-lock-diagnostic/**
          if-no-files-found: error
          retention-days: 14

  rsk-core:
    name: RSK compile + test + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rsk-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rsk-

      - name: Run semantic qualification capsule
        run: >-
          python3 scripts/rsk_qualification.py
          --phase core
          --output-dir "${RUNNER_TEMP}/rsk-qualification-core"

      - name: Independently verify semantic receipt
        if: always()
        run: >-
          python3 scripts/verify_rsk_qualification.py
          "${RUNNER_TEMP}/rsk-qualification-core/receipt.json"
          --repo .
          --require-current-subject

      - name: Upload semantic qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsk-core-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rsk-qualification-core/**
          if-no-files-found: error
          retention-days: 30
