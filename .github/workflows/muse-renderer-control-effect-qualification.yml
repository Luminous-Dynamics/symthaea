name: MUSE renderer control-effect qualification

on:
  push:
    branches:
      - research/mel-renderer-control-effect-v1-20261123
    paths:
      - "crates/domains/symthaea-muse/src/renderer_effect.rs"
      - "crates/domains/symthaea-muse/src/evidence_digest.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "docs/research/MEL_RENDERER_CONTROL_EFFECT_QUALIFICATION_V1_2026-11-23.md"
      - ".github/workflows/muse-renderer-control-effect-qualification.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/mel-renderer-effect-check/Cargo.toml"
      - "tools/mel-renderer-effect-check/src/lib.rs"
  pull_request:
    branches:
      - fix/workspace-stale-member-exclusion-20261121
    paths:
      - "crates/domains/symthaea-muse/src/renderer_effect.rs"
      - "crates/domains/symthaea-muse/src/evidence_digest.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "docs/research/MEL_RENDERER_CONTROL_EFFECT_QUALIFICATION_V1_2026-11-23.md"
      - ".github/workflows/muse-renderer-control-effect-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: Exact-head renderer control-effect qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'tested_head=%s\n' "$actual"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Package formatting
        run: cargo +1.96.0 fmt --manifest-path crates/domains/symthaea-muse/Cargo.toml --check

      - name: Committed lock and workspace metadata
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch Cargo.lock >/dev/null
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/muse-metadata.json"

      - name: Renderer control-effect positive and negative controls
        run: cargo +1.96.0 test --locked -p symthaea-muse --lib renderer_effect::tests

      - name: Re-run focused module tests in isolated source-linked harness
        run: cargo +1.96.0 test --locked -p mel-renderer-effect-check

      - name: Warnings-denied Clippy on isolated changed modules
        run: cargo +1.96.0 clippy --locked -p mel-renderer-effect-check --all-targets -- -D warnings

      - name: Assemble exact-head evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/muse-renderer-control-effect-evidence"
          mkdir -p "$evidence"
          printf 'tested_head=%s\n' "$(git rev-parse HEAD)" > "$evidence/source-identity.txt"
          rustc +1.96.0 --version > "$evidence/rustc-version.txt" 2>&1 || true
          cargo +1.96.0 --version > "$evidence/cargo-version.txt" 2>&1 || true
          sha256sum Cargo.lock > "$evidence/cargo-lock.sha256" 2>&1 || true
          cp crates/domains/symthaea-muse/src/renderer_effect.rs "$evidence/"
          cp crates/domains/symthaea-muse/src/evidence_digest.rs "$evidence/"
          cp docs/research/MEL_RENDERER_CONTROL_EFFECT_QUALIFICATION_V1_2026-11-23.md "$evidence/"
          cp tools/mel-renderer-effect-check/Cargo.toml "$evidence/"
          cp tools/mel-renderer-effect-check/src/lib.rs "$evidence/"
          (cd "$evidence" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-renderer-control-effect-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/muse-renderer-control-effect-evidence/
          if-no-files-found: error
          retention-days: 90
