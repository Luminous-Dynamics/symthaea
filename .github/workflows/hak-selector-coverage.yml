name: HAK Selector Coverage

on:
  pull_request:
    branches:
      - architecture/hak-canonical-json-v1
    paths:
      - 'scripts/hak_selector_coverage.py'
      - 'scripts/hak_selector_coverage_profile_binding.py'
      - 'tests/python/test_hak_selector_coverage.py'
      - 'tests/python/test_hak_selector_coverage_adversarial.py'
      - 'tests/python/test_hak_selector_coverage_schema.py'
      - 'tests/python/test_hak_selector_coverage_profile_binding.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_SELECTOR_COVERAGE_V1.md'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_SELECTOR_COVERAGE_PROFILE_BINDING_V1.md'
      - 'docs/architecture/hak/selector-coverage-v1.schema.json'
      - 'docs/architecture/hak/selector-coverage-profile-binding-v1.schema.json'
      - 'docs/architecture/hak/plans/hak016-selector-coverage-e5-v1.plan.json'
      - 'docs/architecture/hak/policies/hak016-selector-coverage-binding-policy-v1.json'
      - '.github/workflows/hak-selector-coverage.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selector-coverage:
    name: HAK Selector Coverage
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          echo "HAK-016 exact subject: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HAK-016 test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile HAK-016 tooling
        run: |
          python -m py_compile scripts/hak_selector_coverage.py
          python -m py_compile scripts/hak_selector_coverage_profile_binding.py

      - name: Validate HAK-016 schema syntax
        run: |
          python -m json.tool docs/architecture/hak/selector-coverage-v1.schema.json >/dev/null
          python -m json.tool docs/architecture/hak/selector-coverage-profile-binding-v1.schema.json >/dev/null

      - name: Lint HAK-016 qualification plan
        run: python scripts/hak_evidence_lint.py docs/architecture/hak/plans/hak016-selector-coverage-e5-v1.plan.json

      - name: Lint HAK-016 check-binding policy
        run: |
          python scripts/hak_check_binding_lint.py \
            --plan docs/architecture/hak/plans/hak016-selector-coverage-e5-v1.plan.json \
            --policy docs/architecture/hak/policies/hak016-selector-coverage-binding-policy-v1.json

      - name: Run HAK-016 regressions
        run: |
          python -m pytest -q \
            tests/python/test_hak_selector_coverage.py \
            tests/python/test_hak_selector_coverage_adversarial.py \
            tests/python/test_hak_selector_coverage_schema.py \
            tests/python/test_hak_selector_coverage_profile_binding.py
