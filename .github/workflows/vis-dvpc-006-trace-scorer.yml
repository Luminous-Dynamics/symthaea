name: VIS-DVPC-006 paired trace scorer

on:
  pull_request:
    paths:
      - "tools/vision-dvpc-trace-scorer.rs"
      - "docs/research/VIS_DVPC_006_POST_COMMIT_SCORER_V1.md"
      - "fixtures/vision-dvpc-scoring-*.tsv"
      - ".github/workflows/vis-dvpc-006-trace-scorer.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-trace-scorer.rs"
      - "docs/research/VIS_DVPC_006_POST_COMMIT_SCORER_V1.md"
      - "fixtures/vision-dvpc-scoring-*.tsv"
      - ".github/workflows/vis-dvpc-006-trace-scorer.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: rustfmt --edition 2024 --check tools/vision-dvpc-trace-scorer.rs

      - name: Compile and run focused tests
        run: |
          rustc --edition=2024 --test tools/vision-dvpc-trace-scorer.rs -o /tmp/vis-dvpc-006-tests
          /tmp/vis-dvpc-006-tests

      - name: Build post-commit scorer
        run: rustc --edition=2024 -O tools/vision-dvpc-trace-scorer.rs -o /tmp/vis-dvpc-006

      - name: Score frozen synthetic test fixture and replay
        run: |
          /tmp/vis-dvpc-006 test fixtures/vision-dvpc-scoring-observations.tsv fixtures/vision-dvpc-scoring-evaluations.tsv fixtures/vision-dvpc-scoring-actions.tsv > /tmp/vis-dvpc-006-a.tsv
          /tmp/vis-dvpc-006 test fixtures/vision-dvpc-scoring-observations.tsv fixtures/vision-dvpc-scoring-evaluations.tsv fixtures/vision-dvpc-scoring-actions.tsv > /tmp/vis-dvpc-006-b.tsv
          cmp /tmp/vis-dvpc-006-a.tsv /tmp/vis-dvpc-006-b.tsv
          sha256sum tools/vision-dvpc-trace-scorer.rs fixtures/vision-dvpc-scoring-observations.tsv fixtures/vision-dvpc-scoring-evaluations.tsv fixtures/vision-dvpc-scoring-actions.tsv /tmp/vis-dvpc-006-a.tsv

      - name: Validate score schema and paired results
        run: |
          awk -F '\t' '
            $1 == "RESULT_HEADER" { if (NF != 28) exit 2; header = 1 }
            $1 == "RESULT" { if (NF != 28) exit 3; rows += 1 }
            $1 == "ORACLE_HEADER" { if (NF != 9) exit 5; oracle_header = 1 }
            $1 == "ORACLE" { if (NF != 9) exit 6; oracle_rows += 1 }
            END {
              if (!header || rows != 3 || !oracle_header || oracle_rows != 1) exit 7
              printf "validated result_rows=%d oracle_rows=%d\n", rows, oracle_rows
            }
          ' /tmp/vis-dvpc-006-a.tsv
          grep -F $'RESULT\tmatched\tall_cheap\t3\t2\t0.333333\t0.375000' /tmp/vis-dvpc-006-a.tsv
          grep -F $'RESULT\tmatched\tvalue_router\t3\t2\t0.383333\t0.412500' /tmp/vis-dvpc-006-a.tsv
          awk -F '\\t' '$1 == "ORACLE" && $2 == "matched" && $3 == "EXACT_TWO_RESOURCE" && $4 == "0.437500" && $5 == "2" && $6 == "20000" && $7 == "800" && $8 == "25000" && $9 == "2500" { found = 1 } END { exit !found }' /tmp/vis-dvpc-006-a.tsv
          grep -F 'oracle_allocator_overhead' /tmp/vis-dvpc-006-a.tsv
          grep -F 
ORACLE\tmatched\tEXACT_TWO_RESOURCE\t0.437500\t2\t20000\t800\t25000\t2500' /tmp/vis-dvpc-006-a.tsv
          grep -F 
META\toracle_allocator_overhead\tzero; perfect-foresight upper bound; not deployable' /tmp/vis-dvpc-006-a.tsv
