name: MUSE MusicXML Notation Events

on:
  pull_request:
    paths:
      - ".github/workflows/muse-musicxml-notation-events.yml"
      - "crates/domains/symthaea-muse/src/musicxml_notation_events.rs"
      - "crates/domains/symthaea-muse/src/musicxml_barline_adapter.rs"
      - "crates/domains/symthaea-muse/src/barline_eval.rs"
      - "crates/domains/symthaea-muse/src/evidence_digest.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - "research/melothaea-musicxml-notation-events-v1"
    paths:
      - ".github/workflows/muse-musicxml-notation-events.yml"
      - "crates/domains/symthaea-muse/src/musicxml_notation_events.rs"
      - "crates/domains/symthaea-muse/src/musicxml_barline_adapter.rs"
      - "crates/domains/symthaea-muse/src/barline_eval.rs"
      - "crates/domains/symthaea-muse/src/evidence_digest.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-musicxml-notation-events-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notation-events:
    name: Exact MusicXML notation-event fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check formatting of changed Rust modules
        run: |
          rustfmt --edition 2021 --check crates/domains/symthaea-muse/src/musicxml_notation_events.rs
          rustfmt --edition 2021 --check crates/domains/symthaea-muse/src/musicxml_barline_adapter.rs
          rustfmt --edition 2021 --check crates/domains/symthaea-muse/src/lib.rs
      - name: Run notation-event parser fixtures
        run: cargo test --locked -p symthaea-muse --features theory --lib musicxml_notation_events::tests::
      - name: Run integrated measure-graph and notation-event fixtures
        run: cargo test --locked -p symthaea-muse --features theory --lib musicxml_barline_adapter::tests::
