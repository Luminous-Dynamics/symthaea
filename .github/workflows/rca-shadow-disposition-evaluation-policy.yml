name: RCA Shadow Disposition Evaluation Policy

on:
  pull_request:
    paths:
      - 'crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/**'
      - '.github/workflows/rca-shadow-disposition-evaluation-policy.yml'
  workflow_dispatch:

# Automatic qualification runs supersede stale copies for the same PR/ref. Manual
# historical evidence requests are unique and must never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Freeze exact evaluation-surface and engine-contract binding
        shell: bash
        run: |
          set -euo pipefail
          src=crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/src/lib.rs
          engine=crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/src/engine_contract.rs
          production=$(mktemp)
          sed '/^#\[cfg(test)\]/,$d' "$src" > "$production"

          grep -q 'pub mod engine_contract;' "$src"
          grep -q 'SHADOW_DISPOSITION_EVALUATION_POLICY_CONTRACT_V1' "$production"
          grep -q 'raw_preflight_profile_is_preregistration_bearing' "$production"
          grep -q 'lineage_bound_preflight_profile_is_preregistration_bearing' "$production"
          grep -q 'engine_decision_contract_is_preregistration_bearing' "$production"
          grep -q 'profile_or_decision_semantic_drift_requires_new_evaluation_policy_identity' "$production"
          grep -q 'register_shadow_disposition_evaluation_policy_v1' "$production"
          grep -q 'shadow_disposition_preflight_profile_digest_v1' "$production"
          grep -q 'lineage_bound_preflight_profile_digest_v1' "$production"
          grep -q 'shadow_disposition_engine_contract_profile_digest_v1' "$production"

          grep -q 'b"effective_policy_id"' "$production"
          grep -q 'b"effective_policy_profile_contract_digest"' "$production"
          grep -q 'b"raw_preflight_profile_digest"' "$production"
          grep -q 'b"lineage_bound_preflight_profile_digest"' "$production"
          grep -q 'b"engine_contract_profile_digest"' "$production"
          grep -q 'POLICY_ID_DOMAIN' "$production"

          grep -q 'SHADOW_DISPOSITION_ENGINE_CONTRACT_V1' "$engine"
          grep -q 'SHADOW_DISPOSITION_CLASS_TAGS_V1' "$engine"
          grep -q 'SHADOW_DISPOSITION_RULE_PRECEDENCE_V1' "$engine"
          grep -q 'SHADOW_DISPOSITION_PREDICATE_TAGS_V1' "$engine"
          grep -q 'shadow_disposition_engine_contract_profile_digest_v1' "$engine"

      - name: Freeze exact decision taxonomy and precedence
        shell: bash
        run: |
          set -euo pipefail
          engine=crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/src/engine_contract.rs
          python - <<'PY'
          import re
          from pathlib import Path

          src = Path('crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/src/engine_contract.rs').read_text()

          def tags(name):
              m = re.search(rf'pub const {name}: &\[&str\] = &\[(.*?)\];', src, re.S)
              if not m:
                  raise SystemExit(f'missing tag table {name}')
              return re.findall(r'"([^"]+)"', m.group(1))

          expected_classes = [
              'blocked_by_qualified_defeater',
              'contested',
              'supported',
              'tentatively_supported',
              'opposed',
              'tentatively_opposed',
              'underdetermined',
          ]
          expected_rules = [
              'qualified_defeater_blocker',
              'qualified_contestation',
              'bilateral_qualified_disagreement_below_contestation',
              'full_support',
              'full_opposition',
              'tentative_support',
              'tentative_opposition',
              'insufficient_topology',
          ]
          expected_predicates = [
              'defeater_qualified',
              'support_contested_side_qualified',
              'opposition_contested_side_qualified',
              'support_full_qualified',
              'support_tentative_qualified',
              'opposition_full_qualified',
              'opposition_tentative_qualified',
          ]
          if tags('SHADOW_DISPOSITION_CLASS_TAGS_V1') != expected_classes:
              raise SystemExit('primary disposition taxonomy drifted')
          if tags('SHADOW_DISPOSITION_RULE_PRECEDENCE_V1') != expected_rules:
              raise SystemExit('decision-rule precedence drifted')
          if tags('SHADOW_DISPOSITION_PREDICATE_TAGS_V1') != expected_predicates:
              raise SystemExit('predicate taxonomy drifted')
          PY

          grep -q 'qualified_defeater_primary=blocked_by_qualified_defeater_not_false_or_refuted' "$engine"
          grep -q 'bilateral_tentative_or_stronger_disagreement_below_contestation=underdetermined' "$engine"
          grep -q 'count_margin_vote_strength_posterior_and_winner_take_all_tiebreakers_forbidden' "$engine"
          grep -q 'unknown_interpretation_independence_is_scoped_to_witness_that_requires_it_not_global_case_poison' "$engine"
          grep -q 'reason_trace_preserves_all_simultaneously_true_predicates_under_higher_precedence_rule' "$engine"

      - name: Freeze non-result-bearing engine contract
        shell: bash
        run: |
          set -euo pipefail
          engine=crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/src/engine_contract.rs
          production=$(mktemp)
          code=$(mktemp)
          sed '/^#\[cfg(test)\]/,$d' "$engine" > "$production"
          grep -vE '^[[:space:]]*//|^[[:space:]]*//!|^[[:space:]]*/\*|^[[:space:]]*\*' "$production" > "$code"

          if grep -Eq 'use .*BoundShadowEvidenceCaseV1|use .*ShadowDispositionPreflightV1|use .*LineageBoundShadowDispositionPreflightV1|use .*IndependentEvidenceSetWitnessV1|use .*IndependentInterpretationRootSetWitnessV1|use .*InterpretationLineageV1' "$code"; then
            echo 'Engine contract acquired concrete result-bearing artifact inputs.' >&2
            exit 1
          fi
          if grep -Eq 'pub fn (evaluate|decide|dispose|compute_disposition|issue_disposition|classify)' "$code"; then
            echo 'Result-bearing classifier API appeared in engine-contract tranche.' >&2
            exit 1
          fi
          if grep -Eq 'pub (struct|enum) ShadowDispositionV1' "$code"; then
            echo 'Result-bearing disposition type appeared in engine-contract tranche.' >&2
            exit 1
          fi
          if grep -Eq 'serde_json::|DefaultHasher|std::hash|format!\("\{:\?\}"' "$production"; then
            echo 'Engine-contract identity acquired incidental serializer/debug/Rust Hash semantics.' >&2
            exit 1
          fi
          if grep -Eqi 'CanonicalBelief|CanonicalEpistemicClaim|global.?workspace|action_author|external_effect|self.?improvement.*promotion' "$code"; then
            echo 'Engine contract crossed a downstream authority boundary.' >&2
            exit 1
          fi

      - name: Freeze pre-result registration boundary
        shell: bash
        run: |
          set -euo pipefail
          src=crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/src/lib.rs
          production=$(mktemp)
          code=$(mktemp)
          sed '/^#\[cfg(test)\]/,$d' "$src" > "$production"
          grep -vE '^[[:space:]]*//|^[[:space:]]*//!|^[[:space:]]*/\*|^[[:space:]]*\*' "$production" > "$code"

          grep -q 'input=registered_effective_shadow_disposition_policy_v1_only' "$production"
          grep -q 'evaluation_policy_accepts_no_case_preflight_witness_or_lineage_instance' "$production"

          if grep -Eq 'BoundShadowEvidenceCaseV1|IndependentEvidenceSetWitnessV1|InterpretationLineageV1|IndependentInterpretationRootSetWitnessV1' "$code"; then
            echo 'Evaluation policy acquired a result-bearing case/witness/lineage instance input.' >&2
            exit 1
          fi
          if grep -Eq 'use .*ShadowDispositionPreflightV1|use .*LineageBoundShadowDispositionPreflightV1|:[[:space:]]*&?ShadowDispositionPreflightV1|:[[:space:]]*&?LineageBoundShadowDispositionPreflightV1' "$code"; then
            echo 'Evaluation policy acquired a concrete preflight instance input.' >&2
            exit 1
          fi
          if grep -Eq 'pub enum ShadowDisposition|pub struct ShadowDisposition|pub fn (evaluate|decide|dispose|compute_disposition|issue_disposition)' "$code"; then
            echo 'Disposition engine API appeared in evaluation-policy tranche.' >&2
            exit 1
          fi
          if grep -Eq 'min_pairwise_independent_(evidence_items|interpretation_roots)' "$code"; then
            echo 'Evaluation policy started comparing disposition thresholds.' >&2
            exit 1
          fi
          if grep -Eqi 'majority.?vote|sum.*strength|mean.*strength|average.*strength|bayes|posterior|normalize.*strength|multiply.*strength' "$code"; then
            echo 'Evaluation policy acquired interpretation arithmetic.' >&2
            exit 1
          fi
          if grep -Eqi 'CanonicalBelief|CanonicalEpistemicClaim|global.?workspace|action_author|external_effect|self.?improvement.*promotion' "$code"; then
            echo 'Evaluation policy crossed a downstream authority boundary.' >&2
            exit 1
          fi

      - name: Freeze persistence revalidation and canonical identity
        shell: bash
        run: |
          set -euo pipefail
          src=crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/src/lib.rs
          production=$(mktemp)
          sed '/^#\[cfg(test)\]/,$d' "$src" > "$production"

          grep -q 'impl.*Deserialize' "$src"
          grep -q 'register_shadow_disposition_evaluation_policy_v1(wire.effective_policy.clone())' "$src"
          grep -q 'wire.engine_contract_profile_digest' "$src"
          grep -q 'expected.engine_contract_profile_digest' "$src"
          grep -q 'EvaluationPolicyIdentityMismatch' "$src"

          if grep -Eq 'serde_json::|DefaultHasher|std::hash|format!\("\{:\?\}"' "$production"; then
            echo 'Evaluation-policy identity acquired incidental serializer/debug/Rust Hash semantics.' >&2
            exit 1
          fi

      - name: Freeze adversarial policy tests
        shell: bash
        run: |
          set -euo pipefail
          src=crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/src/lib.rs
          engine=crates/bridges/symthaea-rca-shadow-disposition-evaluation-policy/src/engine_contract.rs
          grep -q 'evaluation_policy_binds_preflight_and_engine_contract_profiles' "$src"
          grep -q 'effective_policy_identity_is_evaluation_policy_bearing' "$src"
          grep -q 'evaluation_policy_revalidates_after_persistence' "$src"
          grep -q 'tampered_raw_preflight_profile_fails_closed' "$src"
          grep -q 'tampered_lineage_bound_preflight_profile_fails_closed' "$src"
          grep -q 'tampered_engine_contract_profile_fails_closed' "$src"
          grep -q 'rule_precedence_preserves_bilateral_disagreement_before_unilateral_outcomes' "$engine"
          grep -q 'defeater_is_primary_rule' "$engine"
          grep -q 'contract_profile_is_content_addressed' "$engine"

      - name: Verify dependency direction
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree -p symthaea-rca-shadow-disposition-evaluation-policy -e normal)"
          if printf '%s\n' "$tree" | grep -Eq '(^| )symthaea v|symthaea-core'; then
            echo 'Evaluation policy acquired live root cognition dependency.' >&2
            exit 1
          fi

      - name: Format evaluation policy crate
        run: cargo fmt -p symthaea-rca-shadow-disposition-evaluation-policy -- --check

      - name: Test evaluation policy crate
        run: cargo test -p symthaea-rca-shadow-disposition-evaluation-policy

      - name: Clippy evaluation policy crate
        run: cargo clippy -p symthaea-rca-shadow-disposition-evaluation-policy --all-targets -- -D warnings
