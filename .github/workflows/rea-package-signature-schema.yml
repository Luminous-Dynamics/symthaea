name: REA Package Signature Schema

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/research/rea-package-signature-evaluation-v0.schema.json"
      - "tools/rea-signature-schema-harness/**"
      - ".github/workflows/rea-package-signature-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-package-signature-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signature-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Resolve isolated schema harness lock
        run: cargo generate-lockfile --manifest-path tools/rea-signature-schema-harness/Cargo.toml
      - name: Validate schema and dependency metadata
        run: |
          cargo tree --manifest-path tools/rea-signature-schema-harness/Cargo.toml --locked -e normal,dev
          cargo metadata --manifest-path tools/rea-signature-schema-harness/Cargo.toml --locked --no-deps --format-version 1 > "$RUNNER_TEMP/rea-signature-metadata.json"
      - name: Format check
        run: cargo fmt --manifest-path tools/rea-signature-schema-harness/Cargo.toml -- --check
      - name: Validate platform signature schema fixtures
        run: cargo test --manifest-path tools/rea-signature-schema-harness/Cargo.toml --locked
      - name: Archive resolved schema harness lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rea-signature-schema-cargo-lock
          path: tools/rea-signature-schema-harness/Cargo.lock
          if-no-files-found: error
          retention-days: 14
      - name: Clippy with warnings denied
        run: cargo clippy --manifest-path tools/rea-signature-schema-harness/Cargo.toml --locked --all-targets -- -D warnings
