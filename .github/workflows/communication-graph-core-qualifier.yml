name: CommunicationGraph Core Qualifier

on:
  pull_request:
    branches: [main]
    paths:
      - "research/communication-graph-core/**"
      - ".github/workflows/communication-graph-core-qualifier.yml"
  push:
    branches: [main]
    paths:
      - "research/communication-graph-core/**"
      - ".github/workflows/communication-graph-core-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: communication-graph-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Format
        run: cargo fmt --manifest-path research/communication-graph-core/Cargo.toml --check
      - name: Unit and negative-control tests
        run: cargo test --manifest-path research/communication-graph-core/Cargo.toml
