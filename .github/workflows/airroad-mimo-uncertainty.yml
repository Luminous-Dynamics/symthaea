name: AIRROAD MIMO Complex Uncertainty Enclosure

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-circuits/src/mimo_impedance_enclosure.rs"
      - "crates/domains/symthaea-circuits/src/mimo_impedance_passport.rs"
      - "crates/domains/symthaea-circuits/src/lib.rs"
      - "docs/research/AIRROAD_MIMO_UQ_001_V0_1.md"
      - "docs/research/fixtures/airroad-mimo-complex-enclosure-v0.1.json"
      - "tools/airroad-mimo-uq-qualifier/verify_complex_impedance_enclosure.py"
      - ".github/workflows/airroad-mimo-uncertainty.yml"
  push:
    branches:
      - research/airroad-mimo-uq-v0.1
    paths:
      - "crates/domains/symthaea-circuits/src/mimo_impedance_enclosure.rs"
      - "crates/domains/symthaea-circuits/src/mimo_impedance_passport.rs"
      - "crates/domains/symthaea-circuits/src/lib.rs"
      - "docs/research/AIRROAD_MIMO_UQ_001_V0_1.md"
      - "docs/research/fixtures/airroad-mimo-complex-enclosure-v0.1.json"
      - "tools/airroad-mimo-uq-qualifier/verify_complex_impedance_enclosure.py"
      - ".github/workflows/airroad-mimo-uncertainty.yml"

permissions:
  contents: read

concurrency:
  group: airroad-mimo-uncertainty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and verify independent Fraction oracle
        run: |
          python3 -m py_compile tools/airroad-mimo-uq-qualifier/verify_complex_impedance_enclosure.py
          python3 tools/airroad-mimo-uq-qualifier/verify_complex_impedance_enclosure.py
      - name: Check circuits formatting without workspace resolution
        run: |
          rustfmt --edition 2024 --check crates/domains/symthaea-circuits/src/lib.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-circuits/src/mimo_impedance_passport.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-circuits/src/mimo_impedance_enclosure.rs
      - name: Compile and run zero-dependency circuits tests
        run: |
          rustc --test --edition=2024 crates/domains/symthaea-circuits/src/lib.rs -o /tmp/symthaea-circuits-tests
          /tmp/symthaea-circuits-tests
      - name: Run Clippy directly without workspace resolution
        run: |
          clippy-driver --edition=2024 --crate-name symthaea_circuits --crate-type lib crates/domains/symthaea-circuits/src/lib.rs -D warnings --emit=metadata -o /tmp/symthaea-circuits.rmeta
          clippy-driver --edition=2024 --crate-name symthaea_circuits --test crates/domains/symthaea-circuits/src/lib.rs -D warnings --emit=metadata -o /tmp/symthaea-circuits-tests.rmeta
