name: Robotics Provenance Holdout

on:
  push:
    branches:
      - research/rob-benchmark-provenance-holdout-001
      - research/rob-compositional-shift-001
    paths:
      - "research/rob-benchmark-provenance-holdout-001/**"
      - "research/rob-compositional-shift-001/**"
      - ".github/workflows/rob-benchmark-provenance-holdout.yml"
  pull_request:
    branches:
      - main
      - research/rob-benchmark-provenance-holdout-001
    paths:
      - "research/rob-benchmark-provenance-holdout-001/**"
      - "research/rob-compositional-shift-001/**"
      - ".github/workflows/rob-benchmark-provenance-holdout.yml"

permissions:
  contents: read

jobs:
  provenance-holdout:
    name: Rust 1.96 format, tests and strict Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/rob-benchmark-provenance-holdout-001/reference/Cargo.toml -- --check
      - name: Run deterministic tests
        run: cargo test --locked --manifest-path research/rob-benchmark-provenance-holdout-001/reference/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/rob-benchmark-provenance-holdout-001/reference/Cargo.toml --all-targets -- -D warnings
      - name: Check compositional-shift formatting
        run: cargo fmt --manifest-path research/rob-compositional-shift-001/reference/Cargo.toml -- --check
      - name: Run compositional-shift reference
        run: cargo test --locked --manifest-path research/rob-compositional-shift-001/reference/Cargo.toml
      - name: Strict Clippy compositional-shift reference
        run: cargo clippy --locked --manifest-path research/rob-compositional-shift-001/reference/Cargo.toml --all-targets -- -D warnings
