name: IND-COMP Reference Qualification

on:
  pull_request:
    paths:
      - 'scripts/validate_ind_comp_001a.py'
      - 'docs/release/evidence/ind-comp-001a-functional-component-reference-v1.json'
      - '.github/workflows/ind-comp-reference.yml'

permissions:
  contents: read

jobs:
  reference-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Execute independent functional-component validator
        run: python3 scripts/validate_ind_comp_001a.py
