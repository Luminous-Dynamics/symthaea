name: Electric Aircraft Coupled Battery Step

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "crates/domains/symthaea-electric-aircraft/**"
      - ".github/workflows/electric-aircraft-coupled-battery-step.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electric-aircraft-coupled-battery-step-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, test and lint coupled battery substep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path crates/domains/symthaea-electric-aircraft/Cargo.toml -- --check

      - name: Run aircraft-kernel tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-electric-aircraft/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-electric-aircraft/Cargo.toml --all-targets -- -D warnings
