name: Active Evidence Exact Tree

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/active-evidence-exact-tree/**"
      - ".github/workflows/active-evidence-exact-tree.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Exact-tree Rust and reference qualification
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --manifest-path tools/active-evidence-exact-tree/Cargo.toml -- --check

      - name: Locked Rust tests
        run: cargo test --locked --manifest-path tools/active-evidence-exact-tree/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/active-evidence-exact-tree/Cargo.toml --all-targets -- -D warnings

      - name: Exact Rust outputs and independent reference checks
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/active-evidence-exact-tree-artifact"
          temp_dir="$(mktemp -d)"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          trap 'rm -rf "$temp_dir"' EXIT

          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin active-evidence-exact-tree > "$artifact_dir/greedy-policy-results.csv"
          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin active-evidence-exact-tree > "$temp_dir/greedy-second.csv"
          cmp "$artifact_dir/greedy-policy-results.csv" "$temp_dir/greedy-second.csv"
          python3 tools/active-evidence-exact-tree/reference_check.py "$artifact_dir/greedy-policy-results.csv"

          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin robust_tree > "$artifact_dir/robust-tree-results.csv"
          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin robust_tree > "$temp_dir/tree-second.csv"
          cmp "$artifact_dir/robust-tree-results.csv" "$temp_dir/tree-second.csv"
          python3 tools/active-evidence-exact-tree/reference_check_robust_tree.py --self-test
          python3 tools/active-evidence-exact-tree/reference_check_robust_tree.py "$artifact_dir/robust-tree-results.csv"
          python3 tools/active-evidence-exact-tree/compare_cost_frontiers.py "$artifact_dir/greedy-policy-results.csv" "$artifact_dir/robust-tree-results.csv" > "$artifact_dir/matched-cost-frontier.csv"
          test "$(wc -l < "$artifact_dir/matched-cost-frontier.csv")" -eq 10

          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin calibrated_box > "$artifact_dir/calibrated-box-results.csv"
          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin calibrated_box > "$temp_dir/calibrated-box-second.csv"
          cmp "$artifact_dir/calibrated-box-results.csv" "$temp_dir/calibrated-box-second.csv"
          python3 tools/active-evidence-exact-tree/reference_check_calibrated_box.py --self-test
          python3 tools/active-evidence-exact-tree/reference_check_calibrated_box.py "$artifact_dir/calibrated-box-results.csv"
          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin calibrated_box -- --coverage-grid > "$artifact_dir/calibrated-box-coverage-grid.csv"
          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin calibrated_box -- --coverage-grid > "$temp_dir/calibrated-box-coverage-second.csv"
          cmp "$artifact_dir/calibrated-box-coverage-grid.csv" "$temp_dir/calibrated-box-coverage-second.csv"
          python3 tools/active-evidence-exact-tree/reference_check_calibrated_box.py --check-coverage-grid "$artifact_dir/calibrated-box-coverage-grid.csv"

          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "rustc_version=$(rustc --version)"
            echo "cargo_version=$(cargo --version)"
            echo "runner_os=$(uname -a)"
            (cd "$artifact_dir" && sha256sum greedy-policy-results.csv robust-tree-results.csv matched-cost-frontier.csv calibrated-box-results.csv calibrated-box-coverage-grid.csv)
          } > "$artifact_dir/provenance-receipt.txt"

      - name: Reject mutated aggregate outputs
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin active-evidence-exact-tree > "$temp_dir/original.csv"
          python3 - "$temp_dir/original.csv" "$temp_dir/mutated.csv" <<'PY'
          import csv
          import sys

          source, target = sys.argv[1:]
          with open(source, newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          rows[0]["expected_decision_regret"] = "999"
          with open(target, "w", newline="", encoding="utf-8") as stream:
              writer = csv.DictWriter(stream, fieldnames=rows[0].keys(), lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY
          if python3 tools/active-evidence-exact-tree/reference_check.py "$temp_dir/mutated.csv"; then
            echo "reference checker accepted a mutated aggregate row" >&2
            exit 1
          fi

          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin robust_tree > "$temp_dir/tree-original.csv"
          python3 - "$temp_dir/tree-original.csv" "$temp_dir/tree-mutated.csv" <<'PY'
          import csv
          import sys

          source, target = sys.argv[1:]
          with open(source, newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          rows[0]["worst_case_ambiguity_regret"] = "999"
          with open(target, "w", newline="", encoding="utf-8") as stream:
              writer = csv.DictWriter(stream, fieldnames=rows[0].keys(), lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY
          if python3 tools/active-evidence-exact-tree/reference_check_robust_tree.py "$temp_dir/tree-mutated.csv"; then
            echo "robust-tree checker accepted a mutated aggregate row" >&2
            exit 1
          fi

          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin calibrated_box > "$temp_dir/calibrated-box-original.csv"
          python3 - "$temp_dir/calibrated-box-original.csv" "$temp_dir/calibrated-box-mutated.csv" <<'PY'
          import csv
          import sys

          source, target = sys.argv[1:]
          with open(source, newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          rows[0]["worst_case_box_regret"] = "999"
          with open(target, "w", newline="", encoding="utf-8") as stream:
              writer = csv.DictWriter(stream, fieldnames=rows[0].keys(), lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY
          if python3 tools/active-evidence-exact-tree/reference_check_calibrated_box.py "$temp_dir/calibrated-box-mutated.csv"; then
            echo "calibrated-box checker accepted a mutated row" >&2
            exit 1
          fi

          cargo run --locked --quiet --manifest-path tools/active-evidence-exact-tree/Cargo.toml --bin calibrated_box -- --coverage-grid > "$temp_dir/coverage-original.csv"
          python3 - "$temp_dir/coverage-original.csv" "$temp_dir/coverage-mutated.csv" <<'PY'
          import csv
          import sys

          source, target = sys.argv[1:]
          with open(source, newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          rows[0]["cell_coverage"] = "0"
          with open(target, "w", newline="", encoding="utf-8") as stream:
              writer = csv.DictWriter(stream, fieldnames=rows[0].keys(), lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY
          if python3 tools/active-evidence-exact-tree/reference_check_calibrated_box.py --check-coverage-grid "$temp_dir/coverage-mutated.csv"; then
            echo "coverage-grid checker accepted a mutated row" >&2
            exit 1
          fi

      - name: Upload exact-source benchmark results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-evidence-exact-tree-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/active-evidence-exact-tree-artifact/
          if-no-files-found: warn
          retention-days: 14
