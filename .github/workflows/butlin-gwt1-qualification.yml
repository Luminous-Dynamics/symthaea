name: Butlin GWT-1 Exact-Head Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/butlin-gwt1-qualification.yml"
      - "src/cognitive_loop/managers/drive_manager.rs"
      - "src/cognitive_loop/managers/memory_manager.rs"
      - "src/cognitive_loop/managers/learning_manager.rs"
      - "src/cognitive_loop/managers/perception_manager.rs"
      - "src/cognitive_loop/subsystem_trait.rs"
      - "src/benchmarks/gwt1_specialist_qualification.rs"
      - "src/benchmarks/mod.rs"
      - "crates/domains/symthaea-psych-bench/Cargo.toml"
      - "crates/domains/symthaea-psych-bench/src/benchmarks/butlin/gwt1_*.rs"
      - "crates/domains/symthaea-psych-bench/src/benchmarks/butlin/mod.rs"
      - "crates/domains/symthaea-psych-bench/src/benchmarks/butlin/resolution_view.rs"
      - "crates/domains/symthaea-psych-bench/src/bin/gwt1_qualification.rs"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: gwt1-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Direct GWT-1 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve exact evidence subject
        id: subject
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact evidence subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          fetch-depth: 0

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          expected="${{ steps.subject.outputs.sha }}"
          test "$observed" = "$expected"
          tracked_changes="$(git status --porcelain=v1 --untracked-files=no)"
          test -z "$tracked_changes"
          echo "Exact subject: $observed"
          echo "Tree: $(git rev-parse HEAD^{tree})"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gwt1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gwt1-

      - name: Execute direct GWT-1 evidence pipeline
        shell: bash
        env:
          SYMTHAEA_GWT1_EVIDENCE_DIR: target/gwt1-evidence
        run: |
          set -euo pipefail
          cargo run -p symthaea-psych-bench \
            --features symthaea-backend \
            --bin gwt1_qualification

      # The scientific process may exit 20/21/22 for NotDemonstrated,
      # Contradicted, or Inconclusive after writing a complete evidence set.
      # Package those negative findings too. A red qualification is evidence,
      # not a reason to discard its observations.
      - name: Build deterministic evidence bundle
        id: bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="target/gwt1-evidence"
          expected=(
            raw_observations.json
            evidence_envelope.json
            resolution.json
            outcome.txt
          )

          for file in "${expected[@]}"; do
            if [[ ! -f "${evidence_dir}/${file}" ]]; then
              echo "Missing evidence file: ${file}"
              echo "has_evidence=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          (
            cd "$evidence_dir"
            sha256sum "${expected[@]}" > SHA256SUMS
          )

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C target \
            -cf - \
            gwt1-evidence \
            | gzip -n > target/gwt1-evidence.tar.gz

          sha256sum target/gwt1-evidence.tar.gz \
            | tee target/gwt1-evidence.tar.gz.sha256
          echo "has_evidence=true" >> "$GITHUB_OUTPUT"

      # Only same-repository PRs receive an attestation. Fork PR code may still
      # execute under the normal restricted pull_request token, but it cannot
      # turn an untrusted branch into a repository-signed evidence artifact.
      - name: Generate GitHub build-provenance attestation
        if: >-
          always() &&
          steps.bundle.outputs.has_evidence == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest@v4
        with:
          subject-path: target/gwt1-evidence.tar.gz

      - name: Verify and preserve evidence attestation
        if: >-
          always() &&
          steps.bundle.outputs.has_evidence == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/gwt1-attestation

          gh attestation verify target/gwt1-evidence.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-qualification.yml" \
            --format json \
            > target/gwt1-attestation/verification.json

          (
            cd target/gwt1-attestation
            gh attestation download ../gwt1-evidence.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1
          )

      - name: Upload raw, bundled, and attested evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwt1-evidence-${{ steps.subject.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/gwt1-evidence/
            target/gwt1-evidence.tar.gz
            target/gwt1-evidence.tar.gz.sha256
            target/gwt1-attestation/
          if-no-files-found: warn
          retention-days: 30
