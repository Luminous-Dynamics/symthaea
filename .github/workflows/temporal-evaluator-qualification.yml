name: Temporal Evaluator Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches:
      - "main"
      - "research/decision-regret-observation-voi-20261122"
      - "research/decision-preserving-state-compression-20261122"
  push:
    branches:
      - "research/decision-regret-observation-voi-20261122"
      - "research/decision-preserving-state-compression-20261122"
      - "research/temporal-representation-preservation-20261122"
    paths:
      - "research/temporal-evaluator/**"
      - ".github/workflows/temporal-evaluator-qualification.yml"

concurrency:
  group: temporal-evaluator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Evaluator reference (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check changed evaluator modules
        run: |
          rustfmt --edition 2024 --check --config skip_children=true research/temporal-evaluator/src/decision_sufficient_representation.rs
          if [ -f research/temporal-evaluator/src/temporal_representation_preservation.rs ]; then
            rustfmt --edition 2024 --check --config skip_children=true research/temporal-evaluator/src/temporal_representation_preservation.rs
          fi
      - name: Test evaluator
        run: cargo test --locked --manifest-path research/temporal-evaluator/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/temporal-evaluator/Cargo.toml --all-targets -- -D warnings
