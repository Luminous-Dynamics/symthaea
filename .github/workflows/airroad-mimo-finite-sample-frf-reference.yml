name: AIRROAD Finite-Sample MIMO FRF Admissibility

on:
  pull_request:
    paths:
      - "docs/research/AIRROAD_MIMO_FINITE_SAMPLE_FRF_001_V0_1.md"
      - "docs/research/fixtures/airroad-mimo-finite-sample-frf-v0.1.json"
      - "tools/airroad-mimo-finite-sample-frf/verify_frf_admissibility.py"
      - ".github/workflows/airroad-mimo-finite-sample-frf-reference.yml"
  push:
    branches:
      - research/airroad-mimo-finite-sample-frf-v0.1
    paths:
      - "docs/research/AIRROAD_MIMO_FINITE_SAMPLE_FRF_001_V0_1.md"
      - "docs/research/fixtures/airroad-mimo-finite-sample-frf-v0.1.json"
      - "tools/airroad-mimo-finite-sample-frf/verify_frf_admissibility.py"
      - ".github/workflows/airroad-mimo-finite-sample-frf-reference.yml"

permissions:
  contents: read

concurrency:
  group: airroad-mimo-finite-sample-frf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-rational-admissibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and execute finite-sample MIMO design oracle
        run: |
          python3 -m py_compile \
            tools/airroad-mimo-finite-sample-frf/verify_frf_admissibility.py
          python3 \
            tools/airroad-mimo-finite-sample-frf/verify_frf_admissibility.py
      - name: Validate exact fixture JSON
        run: |
          python3 -m json.tool \
            docs/research/fixtures/airroad-mimo-finite-sample-frf-v0.1.json \
            > /dev/null
