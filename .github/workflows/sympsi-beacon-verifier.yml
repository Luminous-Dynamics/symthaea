name: SYMPsi Beacon Verifier

on:
  pull_request:
    paths:
      - "tools/sympsi-beacon-verifier/**"
      - ".github/workflows/sympsi-beacon-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sympsi-beacon-verifier-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  quicknet-verifier:
    name: Offline pinned Quicknet verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path tools/sympsi-beacon-verifier/Cargo.toml --all -- --check

      - name: Unit tests
        run: cargo test --manifest-path tools/sympsi-beacon-verifier/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path tools/sympsi-beacon-verifier/Cargo.toml --all-targets -- -D warnings

      - name: Verify published Quicknet round 1000 known answer
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo run --manifest-path tools/sympsi-beacon-verifier/Cargo.toml -- \
            --requested-round 1000 \
            --git-head "$EXACT_HEAD" \
            --input tools/sympsi-beacon-verifier/fixtures/quicknet-round-1000.json \
            --out "$RUNNER_TEMP/sympsi-quicknet-round-1000-receipt.json"
          cat "$RUNNER_TEMP/sympsi-quicknet-round-1000-receipt.json"
