name: Agency Executor Configuration NixOS VM

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agency-executor-config-vm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  nixos-vm:
    name: Hardened unit measurement + adversarial drop-in
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain + musl target
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Reconcile workspace lock with Cargo
        run: cargo metadata --format-version 1 >/dev/null

      - name: Build exact static configuration probe
        run: >-
          cargo build --locked
          --target x86_64-unknown-linux-musl
          -p symthaea-executor-configuration
          --bin config_probe

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Add exact probe binary to Nix store
        run: |
          probe="target/x86_64-unknown-linux-musl/debug/config_probe"
          test -x "$probe"
          store_path="$(nix store add-path "$probe")"
          echo "PROBE_STORE_PATH=$store_path" >> "$GITHUB_ENV"
          sha256sum "$probe" | tee "$RUNNER_TEMP/CONFIG_PROBE_SHA256.txt"
          printf '%s\n' "$store_path" | tee "$RUNNER_TEMP/CONFIG_PROBE_STORE_PATH.txt"

      - name: Run booted NixOS/systemd adversarial qualification
        run: |
          nix build --impure --print-build-logs --expr '
            let
              pkgs = import <nixpkgs> { system = "x86_64-linux"; };
              probe = builtins.storePath (builtins.getEnv "PROBE_STORE_PATH");
            in
              import ./nix/agency-executor-config-vm.nix { inherit pkgs probe; }
          '

      - name: Record exact VM evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/agency-executor-config-vm-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/agency-executor-config-vm-evidence/HEAD"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/agency-executor-config-vm-evidence/TREE"
          rustc -Vv > "$RUNNER_TEMP/agency-executor-config-vm-evidence/RUSTC.txt"
          cargo -V > "$RUNNER_TEMP/agency-executor-config-vm-evidence/CARGO.txt"
          nix --version > "$RUNNER_TEMP/agency-executor-config-vm-evidence/NIX.txt" 2>&1 || true
          cp "$RUNNER_TEMP/CONFIG_PROBE_SHA256.txt" "$RUNNER_TEMP/agency-executor-config-vm-evidence/" 2>/dev/null || true
          cp "$RUNNER_TEMP/CONFIG_PROBE_STORE_PATH.txt" "$RUNNER_TEMP/agency-executor-config-vm-evidence/" 2>/dev/null || true
          sha256sum Cargo.lock > "$RUNNER_TEMP/agency-executor-config-vm-evidence/CARGO_LOCK_SHA256.txt"

      - name: Upload VM qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agency-executor-config-vm-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/agency-executor-config-vm-evidence
          if-no-files-found: error
          retention-days: 14
