name: SCIP Semantic Review

on:
  push:
    branches: [main]
    paths:
      - 'crates/bridges/symthaea-scip-semantic-review/**'
      - 'crates/bridges/symthaea-scip-realization-receipt/**'
      - 'crates/bridges/symthaea-scip-llm-adapter/**'
      - 'crates/bridges/symthaea-interlingua/**'
      - '.github/workflows/scip-semantic-review.yml'
  pull_request:
    paths:
      - 'crates/bridges/symthaea-scip-semantic-review/**'
      - 'crates/bridges/symthaea-scip-realization-receipt/**'
      - 'crates/bridges/symthaea-scip-llm-adapter/**'
      - 'crates/bridges/symthaea-interlingua/**'
      - '.github/workflows/scip-semantic-review.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  semantic-review:
    name: Format, test and lint SCIP semantic review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scip-semantic-review-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-scip-semantic-review-
            ${{ runner.os }}-cargo-scip-realization-receipt-
            ${{ runner.os }}-cargo-scip-llm-
            ${{ runner.os }}-cargo-scip-

      - name: Format changed semantic-review Rust files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_SHA:-HEAD^1}"
          mapfile -t files < <(
            git diff --diff-filter=ACMR --name-only "$base" HEAD -- \
              crates/bridges/symthaea-scip-semantic-review \
              | grep -E '\.rs$' || true
          )
          if ((${#files[@]})); then
            printf 'rustfmt checking %s\n' "${files[@]}"
            rustfmt --edition 2024 --config skip_children=true --check "${files[@]}"
          else
            echo 'No changed semantic-review Rust files to format-check.'
          fi

      - name: Check workspace metadata
        run: cargo metadata --format-version 1 --no-deps >/dev/null

      - name: Test SCIP semantic review
        run: cargo test -p symthaea-scip-semantic-review --all-targets

      - name: Strict Clippy SCIP semantic review
        run: cargo clippy -p symthaea-scip-semantic-review --all-targets --no-deps -- -D warnings
