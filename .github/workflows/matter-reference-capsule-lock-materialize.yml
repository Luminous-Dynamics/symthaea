name: Matter Reference Capsule Lock Materializer

on:
  pull_request:
    paths:
      - '.github/workflows/matter-reference-capsule-lock-materialize.yml'

concurrency:
  group: matter-reference-capsule-lock-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PARENT_SHA: e78974e7d1f77b3059a9da8e578920c875987e9e
      SOURCE_RUN_ID: '34275228052'
      SOURCE_ARTIFACT_ID: '10075431475'
      SOURCE_ARTIFACT_NAME: matter-reference-capsule-orchestration-e78974e7d1f77b3059a9da8e578920c875987e9e
      SOURCE_ARTIFACT_ZIP_SHA256: 9255252d14d0643c0c98ac75f212e4d78371357c05427dca5d827f8d0bacf309
      SOURCE_MANIFEST_SHA256: 6c584bd79636db399ba50df066189010fd29cadea8e944373559a2d9cab4253f
      UV_LOCK_SHA256: 1ecb6c8a0752476c9731d0d44a4113c4ed1fabfee6e339724ee4534926bda646
    steps:
      - name: Checkout exact seed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify fresh seed and current PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "$SOURCE_PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT_SHA"
          test ! -e research/matter-reference-capsule/uv.lock

          mapfile -t files < <(git diff --name-only "$SOURCE_PARENT_SHA"...HEAD | sort)
          expected=(
            '.github/workflows/matter-reference-capsule-lock-materialize.yml'
            '.github/workflows/matter-reference-capsule-lock-qualified.yml'
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${files[$i]}" = "${expected[$i]}"
          done

          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)"
          test "$current" = "$(git rev-parse HEAD)"

      - name: Download and verify exact retained orchestration artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .materialize/artifact
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            > .materialize/artifact.zip

          test "$(sha256sum .materialize/artifact.zip | awk '{print $1}')" = "$SOURCE_ARTIFACT_ZIP_SHA256"
          unzip -q .materialize/artifact.zip -d .materialize/artifact

          mapfile -t members < <(cd .materialize/artifact && find . -type f -printf '%P\n' | sort)
          expected=(
            'orchestration-manifest.json'
            'orchestration-manifest.sha256'
            'uv.lock'
            'uv.lock.sha256'
          )
          test "${#members[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${members[$i]}" = "${expected[$i]}"
          done

          cd .materialize/artifact
          sha256sum -c uv.lock.sha256
          expected_manifest_line="$SOURCE_MANIFEST_SHA256  research/matter-reference-capsule/orchestration-manifest.json"
          test "$(cat orchestration-manifest.sha256)" = "$expected_manifest_line"
          test "$(sha256sum uv.lock | awk '{print $1}')" = "$UV_LOCK_SHA256"
          test "$(sha256sum orchestration-manifest.json | awk '{print $1}')" = "$SOURCE_MANIFEST_SHA256"

      - name: Validate source manifest authority and exact source lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('.materialize/artifact/orchestration-manifest.json').read_text())
          assert manifest['schema_version'] == 'symthaea.matter.reference-capsule-orchestration/v1'
          assert manifest['authority'] == 'CandidateLockOrchestrationOnly'
          assert manifest['head_sha'] == 'e78974e7d1f77b3059a9da8e578920c875987e9e'
          assert manifest['parent_sha'] == '9a92cd234db7b5701e1c60f847a2966c7f071976'
          assert manifest['candidate_uv_lock_sha256'] == os.environ['UV_LOCK_SHA256']
          assert manifest['runner']['requested_image'] == 'ubuntu-24.04'
          assert manifest['runner']['image_os'] == 'ubuntu24'
          assert manifest['tooling']['python'] == '3.13.15'
          assert manifest['tooling']['uv'] == 'uv 0.10.0'
          assert manifest['scientific_execution'] == {
              'environment_qualified': False,
              'pseudopotential_installed': False,
              'qe_executed': False,
              'scientific_result_observed': False,
              'sssp_download_executed': False,
          }
          assert manifest['next_required_transition'] == 'review-and-commit-exact-uv-lock-in-child-pr'
          PY

      - name: Materialize exact lock bytes and deterministic provenance
        shell: bash
        run: |
          set -euo pipefail
          root='research/matter-reference-capsule'
          cp --no-preserve=mode,ownership .materialize/artifact/uv.lock "$root/uv.lock"
          cp --no-preserve=mode,ownership .materialize/artifact/orchestration-manifest.json "$root/uv.lock.source-manifest.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          provenance = {
              'schema_version': 'symthaea.matter.committed-python-lock-provenance/v1',
              'authority': 'CommittedLockProvenanceOnly',
              'source_workflow_run_id': 34275228052,
              'source_artifact_id': 10075431475,
              'source_artifact_name': 'matter-reference-capsule-orchestration-e78974e7d1f77b3059a9da8e578920c875987e9e',
              'source_artifact_zip_sha256': '9255252d14d0643c0c98ac75f212e4d78371357c05427dca5d827f8d0bacf309',
              'source_manifest_sha256': '6c584bd79636db399ba50df066189010fd29cadea8e944373559a2d9cab4253f',
              'source_head_sha': 'e78974e7d1f77b3059a9da8e578920c875987e9e',
              'uv_lock_sha256': '1ecb6c8a0752476c9731d0d44a4113c4ed1fabfee6e339724ee4534926bda646',
          }
          Path('research/matter-reference-capsule/uv.lock.provenance.json').write_text(
              json.dumps(provenance, sort_keys=True, separators=(',', ':'), allow_nan=False) + '\n'
          )
          PY

          test "$(sha256sum "$root/uv.lock" | awk '{print $1}')" = "$UV_LOCK_SHA256"
          test "$(sha256sum "$root/uv.lock.source-manifest.json" | awk '{print $1}')" = "$SOURCE_MANIFEST_SHA256"

      - name: Recheck PR head immediately before persistence
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)"
          test "$current" = "$(git rev-parse HEAD)"

      - name: Commit exact artifact bytes to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/matter-reference-capsule/uv.lock \
            research/matter-reference-capsule/uv.lock.source-manifest.json \
            research/matter-reference-capsule/uv.lock.provenance.json
          git diff --cached --check
          git commit -m 'build(matter): commit exact hosted reference capsule lock'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Preserve materializer authority boundary
        shell: bash
        run: |
          {
            echo '### Lock materialization status'
            echo ''
            echo 'Exact bytes from hosted artifact 10075431475 were verified and committed without re-resolution.'
            echo 'This write-authorized materializer must be removed from the PR before lock qualification can pass.'
            echo ''
            echo '**No environment bootstrap, pseudopotential acquisition, QE execution, or scientific result occurred.**'
          } >> "$GITHUB_STEP_SUMMARY"
