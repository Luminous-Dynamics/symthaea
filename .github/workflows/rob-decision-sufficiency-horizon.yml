name: ROB Decision Sufficiency Horizon

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research/rob-decision-sufficiency-horizon-001/**"
      - ".github/workflows/rob-decision-sufficiency-horizon.yml"
  push:
    branches: ["research/rob-decision-sufficiency-horizon-001"]
    paths:
      - "research/rob-decision-sufficiency-horizon-001/**"
      - ".github/workflows/rob-decision-sufficiency-horizon.yml"

concurrency:
  group: rob-decision-sufficiency-horizon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Deterministic reference (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/rob-decision-sufficiency-horizon-001/Cargo.toml -- --check
      - name: Test reference
        run: cargo test --locked --manifest-path research/rob-decision-sufficiency-horizon-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/rob-decision-sufficiency-horizon-001/Cargo.toml --all-targets -- -D warnings
