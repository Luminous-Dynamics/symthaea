name: REA Behavior Observation Profile Validation

on:
  pull_request:
    paths:
      - "docs/research/REA_BEHAVIOR_OBSERVATION_PROFILE_V0_2026Q4.md"
      - "docs/research/rea-behavior-observation-profile-v0.schema.json"
      - "docs/research/rea-behavior-observation-profile-v0.synthetic.json"
      - "tools/rea-behavior-observation-check/**"
      - ".github/workflows/rea-behavior-observation-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-behavior-observation-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Generate isolated checker lockfile
        run: cargo generate-lockfile --manifest-path tools/rea-behavior-observation-check/Cargo.toml

      - name: Verify exact revision and toolchain
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          rustc --version --verbose
          cargo --version
          sha256sum tools/rea-behavior-observation-check/Cargo.lock

      - name: Rust formatting
        run: cargo fmt --manifest-path tools/rea-behavior-observation-check/Cargo.toml -- --check

      - name: Draft 2020-12 schema and raw capture integrity tests
        run: cargo test --manifest-path tools/rea-behavior-observation-check/Cargo.toml --locked

      - name: Validate synthetic observation profile through CLI
        run: |
          mkdir -p artifacts
          cargo run --manifest-path tools/rea-behavior-observation-check/Cargo.toml --locked --bin rea-behavior-observation-check -- \
            docs/research/rea-behavior-observation-profile-v0.synthetic.json \
            > artifacts/rea-behavior-observation-validation.synthetic.json
          test -s artifacts/rea-behavior-observation-validation.synthetic.json

      - name: Archive synthetic observation validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-behavior-observation-validation-synthetic
          path: artifacts/rea-behavior-observation-validation.synthetic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Warnings-denied Clippy
        run: cargo clippy --manifest-path tools/rea-behavior-observation-check/Cargo.toml --all-targets --locked -- -D warnings

      - name: Archive exact checker lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-behavior-observation-check-lockfile
          path: tools/rea-behavior-observation-check/Cargo.lock
          if-no-files-found: warn
          retention-days: 7
