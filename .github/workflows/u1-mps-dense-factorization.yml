name: U1 MPS dense charge-block factorization audit

on:
  push:
    branches:
      - research/u1-mps-dense-factorization-20261113
    paths:
      - crates/domains/symthaea-frontier-physics/src/u1_mps.rs
      - crates/domains/symthaea-frontier-physics/src/lib.rs
      - crates/domains/symthaea-frontier-physics/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/u1-mps-dense-factorization.yml
  pull_request:
    branches:
      - research/u1-mps-state-20261113
    paths:
      - crates/domains/symthaea-frontier-physics/src/u1_mps.rs
      - crates/domains/symthaea-frontier-physics/src/lib.rs
      - crates/domains/symthaea-frontier-physics/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/u1-mps-dense-factorization.yml

permissions:
  contents: read

concurrency:
  group: u1-mps-dense-factorization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: U1 dense-to-MPS charge-block SVD (Linux, Rust 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml --all-targets -- -D warnings
      - name: Run crate tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml --lib
