# FIELD-001 focused exact-head qualification lane.
#
# The main CI tests/clippy jobs primarily target the root `symthaea` package.
# This contract is intentionally dependency-light and not yet composed into the
# root cognitive loop, so it needs its own executable qualification surface.
#
# The crate depends only on serde (+ serde_json for tests), so this lane uses
# GitHub's single-CPU ubuntu-slim runner. The lane is capped at 15 minutes by
# that runner class and is intentionally kept lightweight.

name: FIELD Observation Contract

on:
  pull_request:
    paths:
      - "crates/core/symthaea-physical-io-types/**"
      - ".github/workflows/field-observation-contract.yml"
  push:
    branches: [main]
    paths:
      - "crates/core/symthaea-physical-io-types/**"
      - ".github/workflows/field-observation-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-observation-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: FIELD-001 Exact-Head Qualification
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate and clean preflight
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Check FIELD contract formatting
        run: cargo fmt --check -p symthaea-physical-io-types

      - name: Check FIELD contract library
        run: cargo check -p symthaea-physical-io-types --lib --locked

      - name: Run FIELD contract tests
        run: cargo test -p symthaea-physical-io-types --all-targets --locked

      - name: Lint FIELD contract
        run: cargo clippy -p symthaea-physical-io-types --all-targets --locked -- -D warnings

      - name: Verify tracked checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
