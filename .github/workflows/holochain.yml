# Mycelix Holochain - Zome Development Pipeline
# Build, test, and package Holochain DNAs and hApps

name: Holochain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mycelix-core/dna/**'
      - 'mycelix-core/zomes/**'
      - 'mycelix-core/libs/**'
      - 'mycelix-governance/zomes/**'
      - 'mycelix-workspace/happs/**'
      - 'mycelix-workspace/sdk/**'
      - 'mycelix-workspace/tests/sweettest/**'
      - 'mycelix-identity/zomes/**'
      - 'mycelix-identity/dna/**'
      - 'mycelix-identity/crates/**'
      - 'mycelix-identity/cli/**'
      - 'mycelix-identity/tests/**'
      - 'mycelix-identity/Cargo.toml'
      - 'mycelix-commons/zomes/**'
      - 'mycelix-commons/dna/**'
      - 'mycelix-commons/Cargo.toml'
      - 'mycelix-civic/zomes/**'
      - 'mycelix-civic/dna/**'
      - 'mycelix-civic/Cargo.toml'
      - 'crates/mycelix-bridge-*/**'
      - '.github/workflows/holochain.yml'
      - '.gitmodules'
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-core/dna/**'
      - 'mycelix-core/zomes/**'
      - 'mycelix-core/libs/**'
      - 'mycelix-governance/zomes/**'
      - 'mycelix-workspace/happs/**'
      - 'mycelix-workspace/sdk/**'
      - 'mycelix-workspace/tests/sweettest/**'
      - 'mycelix-identity/zomes/**'
      - 'mycelix-identity/dna/**'
      - 'mycelix-identity/crates/**'
      - 'mycelix-identity/cli/**'
      - 'mycelix-identity/tests/**'
      - 'mycelix-identity/Cargo.toml'
      - 'mycelix-commons/zomes/**'
      - 'mycelix-commons/dna/**'
      - 'mycelix-commons/Cargo.toml'
      - 'mycelix-civic/zomes/**'
      - 'mycelix-civic/dna/**'
      - 'mycelix-civic/Cargo.toml'
      - 'crates/mycelix-bridge-*/**'
      - '.github/workflows/holochain.yml'

concurrency:
  group: holochain-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info
  # getrandom 0.3 custom backend for WASM builds (HDK provides __getrandom_v03_custom)
  CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="custom"'

jobs:
  # ============================================================================
  # Build Zomes (WASM)
  # ============================================================================
  build-zomes:
    name: Build Zomes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-core/target/
            mycelix-workspace/sdk/target/
            mycelix-commons/target/
            mycelix-civic/target/
          key: ${{ runner.os }}-cargo-holochain-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-holochain-

      - name: Enter Nix shell and build zomes
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Holochain Version ==="
            holochain --version || echo "holochain not found, using cargo"
            hc --version || echo "hc not found"

            echo ""
            echo "=== Building Bridge Zome ==="
            if [ -d "mycelix-core/dna/agents" ]; then
              cd mycelix-core/dna/agents
              cargo build --release --target wasm32-unknown-unknown
              cd -
            fi

            echo ""
            echo "=== Building Byzantine FL Zome ==="
            if [ -d "mycelix-core/dna/byzantine_fl" ]; then
              cd mycelix-core/dna/byzantine_fl
              cargo build --release --target wasm32-unknown-unknown
              cd -
            fi

            echo ""
            echo "=== Building H_FL Zome ==="
            if [ -d "mycelix-core/dna/h_fl" ]; then
              cd mycelix-core/dna/h_fl
              cargo build --release --target wasm32-unknown-unknown
              cd -
            fi

            echo ""
            echo "=== Building Mycelix-Commons Cluster Zomes (28 pairs) ==="
            cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-commons/Cargo.toml

            echo ""
            echo "=== Building Mycelix-Civic Cluster Zomes (16 pairs) ==="
            cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-civic/Cargo.toml

            echo ""
            echo "=== Building Federated Learning Zome ==="
            if [ -d "mycelix-core/zomes/federated_learning" ]; then
              cd mycelix-core/zomes/federated_learning
              cargo build --release --target wasm32-unknown-unknown
              cd -
            fi

            echo ""
            echo "=== Building SDK ==="
            cd mycelix-workspace/sdk
            cargo build --release
          '

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zome-wasm
          path: |
            mycelix-core/dna/*/target/wasm32-unknown-unknown/release/*.wasm
            mycelix-core/zomes/federated_learning/target/wasm32-unknown-unknown/release/*.wasm
            mycelix-core/target/wasm32-unknown-unknown/release/*.wasm
            mycelix-commons/target/wasm32-unknown-unknown/release/*.wasm
            mycelix-civic/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: warn

  # ============================================================================
  # Run Zome Tests
  # ============================================================================
  test-zomes:
    name: Test Zomes
    runs-on: ubuntu-latest
    needs: build-zomes

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-core/target/
            mycelix-commons/target/
            mycelix-civic/target/
          key: ${{ runner.os }}-cargo-holochain-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-holochain-

      - name: Run zome unit tests
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Running Zome Unit Tests ==="

            # Test each zome
            for zome_dir in mycelix-core/dna/*/; do
              if [ -f "${zome_dir}Cargo.toml" ]; then
                echo "Testing $(basename $zome_dir)..."
                cargo test --all-features --manifest-path "${zome_dir}Cargo.toml"
              fi
            done

            # Test bridge-common crate (shared dispatch types + allowlist validation)
            echo ""
            echo "=== Running Bridge-Common Tests ==="
            cargo test --manifest-path crates/mycelix-bridge-common/Cargo.toml

            # Test cluster unit tests (commons + civic)
            echo ""
            echo "=== Running Commons Cluster Unit Tests ==="
            cargo test --workspace --manifest-path mycelix-commons/Cargo.toml

            echo ""
            echo "=== Running Civic Cluster Unit Tests ==="
            cargo test --workspace --manifest-path mycelix-civic/Cargo.toml

            # Test SDK (exclude risc0 feature — requires external risc0-zkvm installation)
            echo ""
            echo "=== Running SDK Tests ==="
            cargo test --features "simulation,parallel,webauthn-full,stub-webauthn" --manifest-path mycelix-workspace/sdk/Cargo.toml
          '

      - name: Run integration tests
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Running Integration Tests ==="

            if [ -d "mycelix-workspace/sdk/tests" ]; then
              cargo test --manifest-path mycelix-workspace/sdk/Cargo.toml --test "*" -- --test-threads=1
            fi
          '

  # ============================================================================
  # Build and Test SDK Documentation
  # ============================================================================
  sdk-docs:
    name: SDK Documentation
    runs-on: ubuntu-latest
    needs: test-zomes

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-workspace/sdk/target/
          key: ${{ runner.os }}-cargo-sdk-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-docs-

      - name: Build SDK documentation
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Building SDK Documentation ==="
            cd mycelix-workspace/sdk
            cargo doc --no-deps --manifest-path Cargo.toml
            echo "✓ Documentation built successfully"
          '

      - name: Test SDK doc examples
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Testing SDK Documentation Examples ==="
            cd mycelix-workspace/sdk
            cargo test --doc --manifest-path Cargo.toml
            echo "✓ All doc tests passed"
          '

  # ============================================================================
  # Check Zome Formatting & Linting
  # ============================================================================
  lint-zomes:
    name: Lint Zomes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Check formatting
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Checking Rust Formatting ==="

            for dir in mycelix-core/dna/*/ mycelix-workspace/sdk/ mycelix-commons/ mycelix-civic/; do
              if [ -f "${dir}Cargo.toml" ]; then
                echo "Checking $(basename $dir)..."
                cargo fmt --all --check --manifest-path "${dir}Cargo.toml"
              fi
            done
          '

      - name: Run Clippy
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Running Clippy ==="

            for dir in mycelix-core/dna/*/ mycelix-commons/ mycelix-civic/; do
              if [ -f "${dir}Cargo.toml" ]; then
                echo "Linting $(basename $dir)..."
                cargo clippy --all-targets --manifest-path "${dir}Cargo.toml" -- -D warnings
              fi
            done

            # SDK clippy is handled by the dedicated SDK CI (sdk-ci.yml)
            echo "SDK clippy: skipped (covered by SDK CI)"
          '

      - name: Cargo doc (cluster zomes)
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Building Cluster Documentation ==="
            RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --manifest-path mycelix-commons/Cargo.toml
            echo "✓ Commons docs built"
            RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --manifest-path mycelix-civic/Cargo.toml
            echo "✓ Civic docs built"
          '

  # ============================================================================
  # Package DNAs
  # ============================================================================
  package-dna:
    name: Package DNAs
    runs-on: ubuntu-latest
    needs: [build-zomes, test-zomes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: zome-wasm
          path: wasm-artifacts

      - name: Package DNAs
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Packaging DNAs ==="

            mkdir -p dist/dna

            # Package each DNA
            for dna_dir in mycelix-core/dna/*/; do
              dna_name=$(basename "$dna_dir")
              if [ -f "${dna_dir}dna.yaml" ]; then
                echo "Packaging $dna_name..."
                hc dna pack "$dna_dir" -o "dist/dna/${dna_name}.dna" || {
                  echo "Failed to package $dna_name (hc not available or dna.yaml invalid)"
                }
              fi
            done

            echo ""
            echo "=== Packaged DNAs ==="
            ls -la dist/dna/ || echo "No DNAs packaged"
          '

      - name: Upload DNA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dna-bundles
          path: dist/dna/
          if-no-files-found: warn

  # ============================================================================
  # Sweettest Integration Tests (all suites)
  # ============================================================================
  # IMPORTANT: --release is required. Debug mode exceeds Holochain's hardcoded
  # 5-minute nonce lifetime (FRESH_NONCE_EXPIRES_AFTER in holochain_nonce-0.6.0).
  sweettest:
    name: Sweettest Integration
    runs-on: ubuntu-latest
    needs: build-zomes
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: zome-wasm
          path: wasm-artifacts

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-identity/target/
            mycelix-governance/target/
            mycelix-finance/target/
            mycelix-edunet/target/
            mycelix-supplychain/target/
            mycelix-health/target/
            mycelix-marketplace/target/
            mycelix-climate/target/
            mycelix-commons/target/
            mycelix-civic/target/
            mycelix-core/target/
            mycelix-workspace/tests/sweettest/target/
          key: ${{ runner.os }}-cargo-sweettest-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sweettest-

      - name: Build and pack DNAs in-place
        run: |
          nix develop ./mycelix-workspace#holochain --command bash -c '
            echo "=== Rebuilding WASM zomes (uses cached artifacts) ==="
            # Identity
            if [ -f "mycelix-identity/Cargo.toml" ]; then
              echo "Building Identity zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-identity/Cargo.toml
              hc dna pack mycelix-identity/dna/ -o mycelix-identity/dna/mycelix_identity_dna.dna
              echo "  Identity DNA packed"
            fi

            # Governance
            if [ -f "mycelix-governance/Cargo.toml" ]; then
              echo "Building Governance zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-governance/Cargo.toml
              hc dna pack mycelix-governance/dna/ -o mycelix-governance/dna/mycelix_governance.dna
              echo "  Governance DNA packed"
            fi

            # Finance
            if [ -f "mycelix-finance/Cargo.toml" ]; then
              echo "Building Finance zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-finance/Cargo.toml
              hc dna pack mycelix-finance/dna/ -o mycelix-finance/dna/mycelix_finance.dna
              echo "  Finance DNA packed"
            fi

            # EduNet
            if [ -f "mycelix-edunet/Cargo.toml" ]; then
              echo "Building EduNet zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-edunet/Cargo.toml
              hc dna pack mycelix-edunet/dna/ -o mycelix-edunet/dna/edunet.dna
              echo "  EduNet DNA packed"
            fi

            # SupplyChain
            if [ -f "mycelix-supplychain/Cargo.toml" ]; then
              echo "Building SupplyChain zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-supplychain/Cargo.toml
              hc dna pack mycelix-supplychain/holochain/dna/ -o mycelix-supplychain/holochain/dna/supplychain.dna
              echo "  SupplyChain DNA packed"
            fi

            # Health
            if [ -f "mycelix-health/Cargo.toml" ]; then
              echo "Building Health zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-health/Cargo.toml
              hc dna pack mycelix-health/dna/ -o mycelix-health/dna/health.dna
              echo "  Health DNA packed"
            fi

            # Marketplace
            if [ -f "mycelix-marketplace/Cargo.toml" ]; then
              echo "Building Marketplace zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-marketplace/Cargo.toml
              hc dna pack mycelix-marketplace/backend/ -o mycelix-marketplace/backend/mycelix_marketplace.dna
              echo "  Marketplace DNA packed"
            fi

            # Climate
            if [ -f "mycelix-climate/Cargo.toml" ]; then
              echo "Building Climate zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-climate/Cargo.toml
              hc dna pack mycelix-climate/dnas/climate/workdir/ -o mycelix-climate/dnas/climate/workdir/climate.dna
              echo "  Climate DNA packed"
            fi

            # Commons cluster (property + housing + care + mutualaid + water)
            if [ -f "mycelix-commons/Cargo.toml" ]; then
              echo "Building Commons cluster zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-commons/Cargo.toml
              hc dna pack mycelix-commons/dna/ -o mycelix-commons/dna/mycelix_commons.dna
              echo "  Commons DNA packed"
            fi

            # Civic cluster (justice + emergency + media)
            if [ -f "mycelix-civic/Cargo.toml" ]; then
              echo "Building Civic cluster zomes..."
              cargo build --release --target wasm32-unknown-unknown --manifest-path mycelix-civic/Cargo.toml
              hc dna pack mycelix-civic/dna/ -o mycelix-civic/dna/mycelix_civic.dna
              echo "  Civic DNA packed"
            fi

            # Federated Learning
            if [ -d "mycelix-core/zomes/federated_learning" ]; then
              echo "Building FL zome..."
              cd mycelix-core/zomes/federated_learning
              cargo build --release --target wasm32-unknown-unknown
              cd ../../..
              hc dna pack mycelix-core/zomes/federated_learning/workdir/dna/ -o mycelix-core/zomes/federated_learning/workdir/dna/federated_learning.dna
              echo "  FL DNA packed"
            fi

            echo ""
            echo "=== Verifying DNA bundles ==="
            for dna in mycelix-identity/dna/mycelix_identity_dna.dna \
                       mycelix-governance/dna/mycelix_governance.dna \
                       mycelix-finance/dna/mycelix_finance.dna \
                       mycelix-edunet/dna/edunet.dna \
                       mycelix-supplychain/holochain/dna/supplychain.dna \
                       mycelix-health/dna/health.dna \
                       mycelix-marketplace/backend/mycelix_marketplace.dna \
                       mycelix-climate/dnas/climate/workdir/climate.dna \
                       mycelix-commons/dna/mycelix_commons.dna \
                       mycelix-civic/dna/mycelix_civic.dna \
                       mycelix-core/zomes/federated_learning/workdir/dna/federated_learning.dna; do
              if [ -f "$dna" ]; then
                echo "  OK: $dna ($(du -h "$dna" | cut -f1))"
              else
                echo "  MISSING: $dna"
              fi
            done
          '

      - name: Clippy lint (identity workspace)
        run: |
          nix develop ./mycelix-identity --command bash -c "cd mycelix-identity && cargo clippy --all-features --lib -- -D warnings"

      - name: Cargo doc (identity public API)
        run: |
          nix develop ./mycelix-identity --command bash -c "cd mycelix-identity && RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features"

      - name: WASM compilation gate (all identity zomes)
        run: |
          nix develop ./mycelix-identity --command bash -c "cd mycelix-identity && cargo build --release --target wasm32-unknown-unknown"

      - name: WASM gate - mycelix-crypto (wasm feature isolation)
        run: |
          nix develop ./mycelix-identity --command bash -c "cd mycelix-identity/crates/mycelix-crypto && cargo check --target wasm32-unknown-unknown --features wasm"

      - name: Identity unit tests (276 tests)
        run: |
          nix develop ./mycelix-identity --command bash -c "cd mycelix-identity && cargo test --lib -- --test-threads=1"

      - name: Run sweettest - Identity (4 tests)
        run: |
          nix develop ./mycelix-workspace --command bash -c "cd mycelix-workspace/tests/sweettest && cargo test --release identity -- --ignored --test-threads=1 --nocapture"

      - name: Run sweettest - MFA Identity (7 tests)
        run: |
          nix develop ./mycelix-identity --command bash -c "cd mycelix-identity/tests && cargo test --release mfa -- --ignored --test-threads=1 --nocapture"

      - name: Run sweettest - Identity Integration (55 tests)
        run: |
          nix develop ./mycelix-identity --command bash -c "cd mycelix-identity/tests && cargo test --release sweettest_integration -- --ignored --test-threads=1 --nocapture"

      - name: Run MFA Unit Tests
        run: |
          nix develop ./mycelix-identity --command bash -c "cd mycelix-identity && cargo test --all-features --lib -- --test-threads=1"

      - name: Test mycelix-crypto (native PQC - 66 tests)
        run: |
          nix develop ./mycelix-identity --command bash -c "cd mycelix-identity/crates/mycelix-crypto && cargo test --features native"

      - name: CLI PQC smoke test (keygen → sign → verify)
        run: |
          nix develop ./mycelix-identity --command bash -c '
            cd mycelix-identity/cli && cargo build --release
            BIN=target/release/mycelix-credential
            echo "{\"test\":\"credential\"}" > /tmp/test-cred.json

            # Generate keys for each algorithm
            $BIN keygen --algorithm ed25519 --output /tmp/pqc-ed.json
            $BIN keygen --algorithm ml-dsa-65 --output /tmp/pqc-mldsa65.json
            $BIN keygen --algorithm hybrid-ed25519-ml-dsa-65 --output /tmp/pqc-hybrid.json

            # Sign with each algorithm
            $BIN sign --key /tmp/pqc-ed.json --credential /tmp/test-cred.json --output /tmp/signed-ed.json
            $BIN sign --key /tmp/pqc-mldsa65.json --credential /tmp/test-cred.json --output /tmp/signed-mldsa.json
            $BIN sign --key /tmp/pqc-hybrid.json --credential /tmp/test-cred.json --output /tmp/signed-hybrid.json

            # Verify with --key (real cryptographic verification)
            $BIN pqc-verify --credential /tmp/signed-ed.json --key /tmp/pqc-ed.json --verbose
            $BIN pqc-verify --credential /tmp/signed-mldsa.json --key /tmp/pqc-mldsa65.json --verbose
            $BIN pqc-verify --credential /tmp/signed-hybrid.json --key /tmp/pqc-hybrid.json --verbose

            # Verify structure-only (no --key) still works
            $BIN pqc-verify --credential /tmp/signed-ed.json --verbose
          '

      - name: Run sweettest - Identity PQC (6 tests)
        run: |
          nix develop ./mycelix-workspace --command bash -c "cd mycelix-workspace/tests/sweettest && cargo test --release identity_pqc -- --ignored --test-threads=1 --nocapture"

