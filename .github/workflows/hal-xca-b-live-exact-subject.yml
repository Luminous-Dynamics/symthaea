# Qualification-plane workflow only; active HAL-XCA-B product bytes remain frozen.
name: HAL-XCA-B Live Exact Subject Qualification

on:
  push:
    branches:
      - 'qual/hal-xca-b-live-exact-subject-v1'
    paths:
      - '.github/workflows/hal-xca-b-live-exact-subject.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      SUBJECT: 24e5d77cff90b790901d15afc6e2fbd4c26c258f
      XCA_A_PARENT: 175c3629613f35f43accb99c4030ec70b50dd003
      EVIDENCE_DIR: /tmp/hal-xca-b-live-qualification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 24e5d77cff90b790901d15afc6e2fbd4c26c258f
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact qualification toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.96.0
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Prove exact subject and finite B surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$XCA_A_PARENT" "$SUBJECT"
          test "$(git rev-list --count "$XCA_A_PARENT".."$SUBJECT")" = 1
          git diff --name-only "$XCA_A_PARENT".."$SUBJECT" | tee /tmp/hal-xca-b-paths.txt
          test "$(wc -l < /tmp/hal-xca-b-paths.txt)" = 2
          grep -Fxq 'crates/domains/symthaea-hal/src/exact_command.rs' /tmp/hal-xca-b-paths.txt
          grep -Fxq 'crates/domains/symthaea-hal/src/lib.rs' /tmp/hal-xca-b-paths.txt
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Rust 1.96 HAL-scoped format
        run: cargo fmt --manifest-path crates/domains/symthaea-hal/Cargo.toml -- --check

      - name: Check HAL all targets
        run: cargo check --locked --manifest-path crates/domains/symthaea-hal/Cargo.toml --all-targets

      - name: Run HAL tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-hal/Cargo.toml

      - name: Strict HAL Clippy
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-hal/Cargo.toml --all-targets -- -D warnings

      - name: Require committed lock parity
        shell: bash
        run: |
          set -euo pipefail
          git diff -- Cargo.lock
          git diff --exit-code -- Cargo.lock

      - name: Capture qualification manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'subject=%s\n' "$SUBJECT"
            printf 'subject_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'xca_a_parent=%s\n' "$XCA_A_PARENT"
            printf 'exact_command_sha256=%s\n' "$(sha256sum crates/domains/symthaea-hal/src/exact_command.rs | cut -d' ' -f1)"
            printf 'lib_sha256=%s\n' "$(sha256sum crates/domains/symthaea-hal/src/lib.rs | cut -d' ' -f1)"
            rustc --version
            cargo --version
            cargo fmt --version
            cargo clippy --version
          } > "$EVIDENCE_DIR/MANIFEST.txt"
          if [ -f /tmp/hal-xca-b-paths.txt ]; then
            cp /tmp/hal-xca-b-paths.txt "$EVIDENCE_DIR/CHANGED_PATHS.txt"
          fi
          (
            cd "$EVIDENCE_DIR"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hal-xca-b-live-${{ env.SUBJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Prove postflight tracked checkout immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
