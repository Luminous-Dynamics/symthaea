name: ALife Repeated-Shock Evidence

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-alife/**"
      - ".github/workflows/alife-repeated-shock-evidence.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  repeated-shock-evidence:
    name: Qualified repeated-shock evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: alife-repeated-shock-evidence

      - name: Qualify ALife package
        run: |
          cargo fmt -p symthaea-alife -- --check
          cargo check --locked -p symthaea-alife --all-targets
          cargo test --locked -p symthaea-alife
          cargo clippy --locked -p symthaea-alife --all-targets --no-deps -- -D warnings

      - name: Execute exact fixed seed sweep
        run: |
          mkdir -p target/alife-repeated-shock-evidence
          cargo run --locked --release -p symthaea-alife \
            --example evolvability_repeated_shock_sweep \
            | tee target/alife-repeated-shock-evidence/sweep.txt

      - name: Extract and independently verify protocol evidence
        run: |
          evidence=target/alife-repeated-shock-evidence
          test "$(grep -c '^protocol_sha256=' "$evidence/sweep.txt")" -eq 1
          test "$(grep -c '^protocol_json=' "$evidence/sweep.txt")" -eq 1

          declared="$(grep '^protocol_sha256=' "$evidence/sweep.txt" | sed 's/^protocol_sha256=//')"
          protocol="$(grep '^protocol_json=' "$evidence/sweep.txt" | sed 's/^protocol_json=//')"
          test -n "$declared"
          test -n "$protocol"

          printf '%s\n' "$declared" > "$evidence/protocol.declared.sha256"
          printf '%s' "$protocol" > "$evidence/protocol.json"
          observed="$(printf '%s' "$protocol" | sha256sum | awk '{print $1}')"
          printf '%s\n' "$observed" > "$evidence/protocol.observed.sha256"
          test "$declared" = "$observed"

      - name: Extract and independently verify result evidence
        run: |
          evidence=target/alife-repeated-shock-evidence
          test "$(grep -c '^results_sha256=' "$evidence/sweep.txt")" -eq 1
          test "$(grep -c '^results_json=' "$evidence/sweep.txt")" -eq 1

          declared="$(grep '^results_sha256=' "$evidence/sweep.txt" | sed 's/^results_sha256=//')"
          results="$(grep '^results_json=' "$evidence/sweep.txt" | sed 's/^results_json=//')"
          test -n "$declared"
          test -n "$results"

          printf '%s\n' "$declared" > "$evidence/results.declared.sha256"
          printf '%s' "$results" > "$evidence/results.json"
          observed="$(printf '%s' "$results" | sha256sum | awk '{print $1}')"
          printf '%s\n' "$observed" > "$evidence/results.observed.sha256"
          test "$declared" = "$observed"

      - name: Verify result capsule binds to qualified protocol
        run: |
          evidence=target/alife-repeated-shock-evidence
          python3 - "$evidence/results.json" "$evidence/protocol.observed.sha256" <<'PY'
          import json
          import pathlib
          import sys

          results_path = pathlib.Path(sys.argv[1])
          protocol_hash_path = pathlib.Path(sys.argv[2])
          results = json.loads(results_path.read_text())
          protocol_sha256 = protocol_hash_path.read_text().strip()

          assert results["schema"] == "symthaea.alife.repeated-shock.results.v1"
          assert results["protocol_sha256"] == protocol_sha256
          assert results["aggregate"]["seed_count"] == 8
          assert len(results["seed_results"]) == 8
          assert [entry["seed"] for entry in results["seed_results"]] == [1, 2, 3, 4, 5, 6, 7, 8]
          assert all("scheduler_seed" in entry for entry in results["seed_results"])
          assert all(
              key in entry
              for entry in results["seed_results"]
              for key in (
                  "frozen_transfer",
                  "selected_transfer",
                  "random_peer_transfer",
                  "selected_vs_frozen_did",
                  "random_peer_vs_frozen_relative",
                  "selected_vs_random_peer_relative",
              )
          )
          PY

      - name: Execute preregistered primary inference
        run: |
          evidence=target/alife-repeated-shock-evidence
          cargo run --locked --release -p symthaea-alife \
            --example evolvability_repeated_shock_inference -- \
            "$evidence/results.json" "$evidence/results.observed.sha256" \
            | tee "$evidence/inference.txt"

      - name: Extract and independently verify inference evidence
        run: |
          evidence=target/alife-repeated-shock-evidence
          test "$(grep -c '^inference_sha256=' "$evidence/inference.txt")" -eq 1
          test "$(grep -c '^inference_json=' "$evidence/inference.txt")" -eq 1

          declared="$(grep '^inference_sha256=' "$evidence/inference.txt" | sed 's/^inference_sha256=//')"
          inference="$(grep '^inference_json=' "$evidence/inference.txt" | sed 's/^inference_json=//')"
          test -n "$declared"
          test -n "$inference"

          printf '%s\n' "$declared" > "$evidence/inference.declared.sha256"
          printf '%s' "$inference" > "$evidence/inference.json"
          observed="$(printf '%s' "$inference" | sha256sum | awk '{print $1}')"
          printf '%s\n' "$observed" > "$evidence/inference.observed.sha256"
          test "$declared" = "$observed"

      - name: Verify preregistration and result binding
        run: |
          evidence=target/alife-repeated-shock-evidence
          python3 - "$evidence/inference.json" "$evidence/results.observed.sha256" <<'PY'
          import json
          import pathlib
          import sys

          inference = json.loads(pathlib.Path(sys.argv[1]).read_text())
          results_sha256 = pathlib.Path(sys.argv[2]).read_text().strip()
          prereg = inference["preregistration"]

          assert inference["schema"] == "symthaea.alife.repeated-shock.inference.v1"
          assert inference["results_sha256"] == results_sha256
          assert prereg["comparison"] == "selected_from_parent_vs_mutation_enabled_random_peer"
          assert prereg["primary_metric"] == "deficit_area_advantage_candidate_minus_reference"
          assert prereg["primary_metric_orientation"] == "positive_favors_selected_from_parent"
          assert prereg["test"] == "exact_one_sided_paired_sign_test"
          assert prereg["alternative"] == "positive_directional_tendency"
          assert prereg["alpha_numerator"] == 1
          assert prereg["alpha_denominator"] == 20
          assert prereg["expected_seed_panel"] == [1, 2, 3, 4, 5, 6, 7, 8]
          assert prereg["missingness_policy"] == "require_all_eight_primary_outcomes"
          assert prereg["tie_policy"] == "exact_zero_excluded_from_binomial_denominator"
          assert prereg["secondary_metric_p_values"] is False
          assert inference["inference"]["status"] in ("available", "unavailable")
          PY

      - name: Execute descriptive baseline diagnostics
        run: |
          evidence=target/alife-repeated-shock-evidence
          cargo run --locked --release -p symthaea-alife \
            --example evolvability_repeated_shock_baseline_diagnostics -- \
            "$evidence/results.json" "$evidence/results.observed.sha256" \
            | tee "$evidence/baseline-diagnostics.txt"

      - name: Extract and independently verify baseline diagnostics
        run: |
          evidence=target/alife-repeated-shock-evidence
          test "$(grep -c '^baseline_diagnostics_sha256=' "$evidence/baseline-diagnostics.txt")" -eq 1
          test "$(grep -c '^baseline_diagnostics_json=' "$evidence/baseline-diagnostics.txt")" -eq 1

          declared="$(grep '^baseline_diagnostics_sha256=' "$evidence/baseline-diagnostics.txt" | sed 's/^baseline_diagnostics_sha256=//')"
          diagnostics="$(grep '^baseline_diagnostics_json=' "$evidence/baseline-diagnostics.txt" | sed 's/^baseline_diagnostics_json=//')"
          test -n "$declared"
          test -n "$diagnostics"

          printf '%s\n' "$declared" > "$evidence/baseline-diagnostics.declared.sha256"
          printf '%s' "$diagnostics" > "$evidence/baseline-diagnostics.json"
          observed="$(printf '%s' "$diagnostics" | sha256sum | awk '{print $1}')"
          printf '%s\n' "$observed" > "$evidence/baseline-diagnostics.observed.sha256"
          test "$declared" = "$observed"

      - name: Verify baseline diagnostics are descriptive and result-bound
        run: |
          evidence=target/alife-repeated-shock-evidence
          python3 - "$evidence/baseline-diagnostics.json" "$evidence/results.observed.sha256" <<'PY'
          import json
          import pathlib
          import sys

          diagnostics = json.loads(pathlib.Path(sys.argv[1]).read_text())
          results_sha256 = pathlib.Path(sys.argv[2]).read_text().strip()
          contract = diagnostics["diagnostic_contract"]

          assert diagnostics["schema"] == "symthaea.alife.repeated-shock.baseline-diagnostics.v1"
          assert diagnostics["results_sha256"] == results_sha256
          assert contract["descriptive_only"] is True
          assert contract["changes_primary_metric"] is False
          assert contract["seed_exclusion_rule"] is False
          assert contract["p_values"] is False
          assert contract["absolute_population_generalization"] is False
          assert len(diagnostics["seed_diagnostics"]) == 8
          assert [entry["seed"] for entry in diagnostics["seed_diagnostics"]] == [1,2,3,4,5,6,7,8]
          assert all(
              key in entry
              for entry in diagnostics["seed_diagnostics"]
              for key in (
                  "frozen",
                  "selected",
                  "random_peer",
                  "selected_vs_frozen",
                  "random_peer_vs_frozen",
                  "selected_vs_random_peer",
              )
          )
          PY

      - name: Record execution capsule metadata
        run: |
          evidence=target/alife-repeated-shock-evidence
          {
            echo "git_sha=$(git rev-parse HEAD)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "sweep_example=evolvability_repeated_shock_sweep"
            echo "inference_example=evolvability_repeated_shock_inference"
            echo "baseline_diagnostics_example=evolvability_repeated_shock_baseline_diagnostics"
            echo "protocol_sha256=$(cat "$evidence/protocol.observed.sha256")"
            echo "results_sha256=$(cat "$evidence/results.observed.sha256")"
            echo "inference_sha256=$(cat "$evidence/inference.observed.sha256")"
            echo "baseline_diagnostics_sha256=$(cat "$evidence/baseline-diagnostics.observed.sha256")"
          } > "$evidence/metadata.txt"

      - name: Upload repeated-shock evidence capsule
        uses: actions/upload-artifact@v4
        with:
          name: alife-repeated-shock-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/alife-repeated-shock-evidence/
          retention-days: 30
