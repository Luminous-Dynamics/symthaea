name: CogSec Qualification

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-cogsec/**'
      - 'crates/bridges/symthaea-cogsec-evidence/**'
      - 'crates/bridges/symthaea-cogsec-qualification/**'
      - 'docs/security/cogsec/**'
      - 'scripts/cogsec-focused-qualification.sh'
      - '.github/workflows/cogsec.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cogsec:
    name: CogSec focused qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cogsec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cogsec-

      - name: Run focused CogSec qualification
        run: bash scripts/cogsec-focused-qualification.sh
