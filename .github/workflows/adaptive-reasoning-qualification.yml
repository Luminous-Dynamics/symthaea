name: Adaptive Reasoning Qualification

on:
  pull_request:
    paths:
      - 'src/consciousness/adaptive_reasoning.rs'
      - 'src/consciousness/adaptive_reasoning/**'
      - 'src/bin/adaptive_qualification_subject.rs'
      - '.github/reasoning/qualify-adaptive-subject.sh'
      - '.github/workflows/adaptive-reasoning-qualification.yml'
  workflow_dispatch:
    inputs:
      subject_revision:
        description: 'Exact full commit SHA to qualify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: adaptive-reasoning-qualification-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  exact-subject:
    name: Exact-subject adaptive control
    runs-on: ubuntu-latest
    env:
      SYMTHAEA_SUBJECT_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.subject_revision }}
      SYMTHAEA_ADAPTIVE_RECEIPT_PATH: target/rq-006z/adaptive-qualification-receipt.json
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SYMTHAEA_SUBJECT_REVISION }}
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Execute exact-subject qualification
        run: bash .github/reasoning/qualify-adaptive-subject.sh

      - name: Upload qualified receipt
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-reasoning-receipt-${{ env.SYMTHAEA_SUBJECT_REVISION }}
          path: target/rq-006z/adaptive-qualification-receipt.json
          if-no-files-found: error
          retention-days: 30
