name: Science Benchmark Refresh Manifest Validator

on:
  pull_request:
    paths:
      - "research/science-bench-refresh/**"
      - "docs/research/SCI-BENCH-REFRESH-001.md"
      - ".github/workflows/science-bench-refresh-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: science-bench-refresh-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator:
    name: Manifest contract and hostile controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Install stable Rust with quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --manifest-path research/science-bench-refresh/Cargo.toml -- --check

      - name: Unit tests
        run: cargo test --locked --manifest-path research/science-bench-refresh/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path research/science-bench-refresh/Cargo.toml --all-targets -- -D warnings

      - name: Fixture is valid but never eligible for scoring
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- research/science-bench-refresh/fixtures/generation-manifest.example.json > /tmp/science-bench-refresh-report.json
          grep -q '"valid": true' /tmp/science-bench-refresh-report.json
          grep -q '"manifest_declares_scoring_eligible": false' /tmp/science-bench-refresh-report.json
          grep -q '"manifest_declares_sealed_generalization_profile": false' /tmp/science-bench-refresh-report.json
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- research/science-bench-refresh/fixtures/generation-manifest.example.json --require-scoring > /tmp/science-bench-refresh-required.json
          scoring_exit=$?
          set -e
          test "$scoring_exit" -eq 3
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- research/science-bench-refresh/fixtures/generation-manifest.example.json --require-sealed > /tmp/science-bench-refresh-sealed.json
          sealed_exit=$?
          set -e
          test "$sealed_exit" -eq 4

      - name: Commit-reveal round trip and mutation controls
        shell: bash
        run: |
          set -euo pipefail
          manifest="research/science-bench-refresh/fixtures/generation-manifest.example.json"
          zero="$(printf '%064d' 0)"
          a="$(printf '%064d' 0 | tr '0' 'a')"
          b="$(printf '%064d' 0 | tr '0' 'b')"
          c_hash="$(printf '%064d' 0 | tr '0' 'c')"
          d="$(printf '%064d' 0 | tr '0' 'd')"
          e="$(printf '%064d' 0 | tr '0' 'e')"
          f="$(printf '%064d' 0 | tr '0' 'f')"
          revision="$(printf '%040d' 0 | tr '0' 'b')"

          jq \
            --arg zero "$zero" --arg a "$a" --arg b "$b" \
            --arg c "$c_hash" --arg d "$d" --arg e "$e" --arg f "$f" \
            --arg revision "$revision" '
              .purpose = "qualified_run" |
              .generator.revision = $revision |
              .generator.configuration_sha256 = $a |
              .evaluator.source_sha256 = $b |
              .evaluator.oracle_separation = "independent_evaluator_boundary_verified" |
              .policy_freeze.source_or_policy_sha256 = $c |
              .policy_freeze.prompt_sha256 = $d |
              .policy_freeze.configuration_sha256 = $e |
              .policy_freeze.tool_manifest_sha256 = $a |
              .analysis_plan_sha256 = $f |
              .protocol_commitment_sha256 = $zero |
              .seed_commitment_sha256 = $zero |
              .task_set_commitment_sha256 = $zero
            ' "$manifest" > /tmp/sbr-draft-manifest.json

          # This known, low-entropy seed is strictly an integration-test vector.
          # Real sealed runs must use >=256 bits from a cryptographically secure source.
          printf 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' > /tmp/sbr-seed.bin
          jq -n '{
            schema: "symthaea.science_bench_refresh_task_set.v1",
            generation_id: "example-only-not-for-scoring-0001",
            tasks: [
              {task_id:"t01",family_id:"semantic_invariance",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t02",family_id:"semantic_invariance",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t03",family_id:"sampling_noise_shift",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t04",family_id:"sampling_noise_shift",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t05",family_id:"confounding_null",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t06",family_id:"confounding_null",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t07",family_id:"identifiability_abstention",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t08",family_id:"identifiability_abstention",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}}
            ]
          }' > /tmp/sbr-task-set.json

          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            protocol-commit /tmp/sbr-draft-manifest.json > /tmp/sbr-protocol.json
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            artifact-commit /tmp/sbr-draft-manifest.json seed /tmp/sbr-seed.bin > /tmp/sbr-seed-commit.json
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            artifact-commit /tmp/sbr-draft-manifest.json task-set /tmp/sbr-task-set.json > /tmp/sbr-task-commit.json

          protocol="$(jq -r '.protocol_commitment_sha256' /tmp/sbr-protocol.json)"
          seed_commit="$(jq -r '.artifact_commitment_sha256' /tmp/sbr-seed-commit.json)"
          task_commit="$(jq -r '.artifact_commitment_sha256' /tmp/sbr-task-commit.json)"
          jq --arg protocol "$protocol" --arg seed "$seed_commit" --arg tasks "$task_commit" '
            .protocol_commitment_sha256 = $protocol |
            .seed_commitment_sha256 = $seed |
            .task_set_commitment_sha256 = $tasks
          ' /tmp/sbr-draft-manifest.json > /tmp/sbr-final-manifest.json

          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            /tmp/sbr-final-manifest.json --require-sealed > /tmp/sbr-validation.json
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-reveal /tmp/sbr-final-manifest.json /tmp/sbr-seed.bin /tmp/sbr-task-set.json > /tmp/sbr-reveal.json
          grep -q '"verified": true' /tmp/sbr-reveal.json
          grep -q '"task_set_contract_valid": true' /tmp/sbr-reveal.json

          cp /tmp/sbr-seed.bin /tmp/sbr-mutated-seed.bin
          printf 'B' | dd of=/tmp/sbr-mutated-seed.bin bs=1 seek=0 conv=notrunc status=none
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-reveal /tmp/sbr-final-manifest.json /tmp/sbr-mutated-seed.bin /tmp/sbr-task-set.json > /tmp/sbr-mutated-seed-report.json
          seed_exit=$?
          set -e
          test "$seed_exit" -eq 5
          grep -q '"seed_commitment_matches": false' /tmp/sbr-mutated-seed-report.json

          jq '.tasks[0].policy_input.observations = [{"x": 1, "y": 999}]' \
            /tmp/sbr-task-set.json > /tmp/sbr-mutated-task-set.json
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-reveal /tmp/sbr-final-manifest.json /tmp/sbr-seed.bin /tmp/sbr-mutated-task-set.json > /tmp/sbr-mutated-task-report.json
          task_exit=$?
          set -e
          test "$task_exit" -eq 5
          grep -q '"task_set_commitment_matches": false' /tmp/sbr-mutated-task-report.json

          jq '.budget.max_total_tokens += 1' /tmp/sbr-final-manifest.json > /tmp/sbr-mutated-manifest.json
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            /tmp/sbr-mutated-manifest.json > /tmp/sbr-mutated-manifest-report.json
          manifest_exit=$?
          set -e
          test "$manifest_exit" -eq 2
          grep -q 'does not match the frozen manifest context' /tmp/sbr-mutated-manifest-report.json
