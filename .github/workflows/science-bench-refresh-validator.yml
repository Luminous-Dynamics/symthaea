name: Science Benchmark Refresh Manifest Validator

on:
  pull_request:
    paths:
      - "research/science-bench-refresh/**"
      - "docs/research/SCI-BENCH-REFRESH-001.md"
      - ".github/workflows/science-bench-refresh-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: science-bench-refresh-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator:
    name: Manifest contract and hostile controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SBR_GENERATOR_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact generator source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust with quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting for changed Rust implementation files
        # Keep the gate strict on this PR's implementation files without
        # reformatting unrelated pre-existing modules from the stacked base.
        run: >-
          rustfmt --check --edition 2024
          research/science-bench-refresh/src/main.rs
          research/science-bench-refresh/src/lib.rs
          research/science-bench-refresh/src/judge_factorial.rs
          research/science-bench-refresh/src/intervention_quality.rs
          research/science-bench-refresh/src/intervention_target_delta.rs
          research/science-bench-refresh/src/evidence_behavior_contracts.rs
          research/science-bench-refresh/src/reference_assurance.rs

      - name: Unit tests
        run: cargo test --locked --manifest-path research/science-bench-refresh/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path research/science-bench-refresh/Cargo.toml --all-targets -- -D warnings

      - name: Independent Python reference unit tests
        run: python3 -m unittest discover -s research/science-bench-refresh/tools -p 'test_*.py' -v

      - name: Fixture is valid but never eligible for scoring
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- research/science-bench-refresh/fixtures/generation-manifest.example.json > /tmp/science-bench-refresh-report.json
          grep -q '"valid": true' /tmp/science-bench-refresh-report.json
          grep -q '"manifest_declares_scoring_eligible": false' /tmp/science-bench-refresh-report.json
          grep -q '"manifest_declares_sealed_generalization_profile": false' /tmp/science-bench-refresh-report.json
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- research/science-bench-refresh/fixtures/generation-manifest.example.json --require-scoring > /tmp/science-bench-refresh-required.json
          scoring_exit=$?
          set -e
          test "$scoring_exit" -eq 3
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- research/science-bench-refresh/fixtures/generation-manifest.example.json --require-sealed > /tmp/science-bench-refresh-sealed.json
          sealed_exit=$?
          set -e
          test "$sealed_exit" -eq 4

      - name: Commit-reveal round trip and mutation controls
        shell: bash
        run: |
          set -euo pipefail
          manifest="research/science-bench-refresh/fixtures/generation-manifest.example.json"
          zero="$(printf '%064d' 0)"
          a="$(printf '%064d' 0 | tr '0' 'a')"
          b="$(printf '%064d' 0 | tr '0' 'b')"
          c_hash="$(printf '%064d' 0 | tr '0' 'c')"
          d="$(printf '%064d' 0 | tr '0' 'd')"
          e="$(printf '%064d' 0 | tr '0' 'e')"
          f="$(printf '%064d' 0 | tr '0' 'f')"
          revision="$(git rev-parse HEAD)"

          jq \
            --arg zero "$zero" --arg a "$a" --arg b "$b" \
            --arg c "$c_hash" --arg d "$d" --arg e "$e" --arg f "$f" \
            --arg revision "$revision" '
              .purpose = "qualified_run" |
              .generator.revision = $revision |
              .generator.configuration_sha256 = $a |
              .evaluator.source_sha256 = $b |
              .evaluator.oracle_separation = "independent_evaluator_boundary_verified" |
              .policy_freeze.source_or_policy_sha256 = $c |
              .policy_freeze.prompt_sha256 = $d |
              .policy_freeze.configuration_sha256 = $e |
              .policy_freeze.tool_manifest_sha256 = $a |
              .analysis_plan_sha256 = $f |
              .protocol_commitment_sha256 = $zero |
              .seed_commitment_sha256 = $zero |
              .task_set_commitment_sha256 = $zero
            ' "$manifest" > /tmp/sbr-draft-manifest.json

          # This known, low-entropy seed is strictly an integration-test vector.
          # Real sealed runs must use >=256 bits from a cryptographically secure source.
          printf 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' > /tmp/sbr-seed.bin
          jq -n '{
            schema: "symthaea.science_bench_refresh_task_set.v1",
            generation_id: "example-only-not-for-scoring-0001",
            tasks: [
              {task_id:"t01",family_id:"semantic_invariance",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t02",family_id:"semantic_invariance",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t03",family_id:"sampling_noise_shift",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t04",family_id:"sampling_noise_shift",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t05",family_id:"confounding_null",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t06",family_id:"confounding_null",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t07",family_id:"identifiability_abstention",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}},
              {task_id:"t08",family_id:"identifiability_abstention",policy_input:{observations:[]},evaluator_only:{expected_law:"fixture"}}
            ]
          }' > /tmp/sbr-task-set.json

          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            protocol-commit /tmp/sbr-draft-manifest.json > /tmp/sbr-protocol.json
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            artifact-commit /tmp/sbr-draft-manifest.json seed /tmp/sbr-seed.bin > /tmp/sbr-seed-commit.json
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            artifact-commit /tmp/sbr-draft-manifest.json task-set /tmp/sbr-task-set.json > /tmp/sbr-task-commit.json

          protocol="$(jq -r '.protocol_commitment_sha256' /tmp/sbr-protocol.json)"
          seed_commit="$(jq -r '.artifact_commitment_sha256' /tmp/sbr-seed-commit.json)"
          task_commit="$(jq -r '.artifact_commitment_sha256' /tmp/sbr-task-commit.json)"
          jq --arg protocol "$protocol" --arg seed "$seed_commit" --arg tasks "$task_commit" '
            .protocol_commitment_sha256 = $protocol |
            .seed_commitment_sha256 = $seed |
            .task_set_commitment_sha256 = $tasks
          ' /tmp/sbr-draft-manifest.json > /tmp/sbr-final-manifest.json

          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            /tmp/sbr-final-manifest.json --require-sealed > /tmp/sbr-validation.json
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-reveal /tmp/sbr-final-manifest.json /tmp/sbr-seed.bin /tmp/sbr-task-set.json > /tmp/sbr-reveal.json
          grep -q '"verified": true' /tmp/sbr-reveal.json
          grep -q '"task_set_contract_valid": true' /tmp/sbr-reveal.json

          cp /tmp/sbr-seed.bin /tmp/sbr-mutated-seed.bin
          printf 'B' | dd of=/tmp/sbr-mutated-seed.bin bs=1 seek=0 conv=notrunc status=none
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-reveal /tmp/sbr-final-manifest.json /tmp/sbr-mutated-seed.bin /tmp/sbr-task-set.json > /tmp/sbr-mutated-seed-report.json
          seed_exit=$?
          set -e
          test "$seed_exit" -eq 5
          grep -q '"seed_commitment_matches": false' /tmp/sbr-mutated-seed-report.json

          jq '.tasks[0].policy_input.observations = [{"x": 1, "y": 999}]' \
            /tmp/sbr-task-set.json > /tmp/sbr-mutated-task-set.json
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-reveal /tmp/sbr-final-manifest.json /tmp/sbr-seed.bin /tmp/sbr-mutated-task-set.json > /tmp/sbr-mutated-task-report.json
          task_exit=$?
          set -e
          test "$task_exit" -eq 5
          grep -q '"task_set_commitment_matches": false' /tmp/sbr-mutated-task-report.json

          jq '.budget.max_total_tokens += 1' /tmp/sbr-final-manifest.json > /tmp/sbr-mutated-manifest.json
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            /tmp/sbr-mutated-manifest.json > /tmp/sbr-mutated-manifest-report.json
          manifest_exit=$?
          set -e
          test "$manifest_exit" -eq 2
          grep -q 'does not match the frozen manifest context' /tmp/sbr-mutated-manifest-report.json

      - name: Regenerate deterministic task set from revealed seed and pinned config
        shell: bash
        run: |
          set -euo pipefail
          manifest="research/science-bench-refresh/fixtures/generation-manifest.example.json"
          config="research/science-bench-refresh/fixtures/generator-config.example.json"
          config_sha="$(sha256sum "$config" | cut -d ' ' -f 1)"
          zero="$(printf '%064d' 0)"
          a="$(printf '%064d' 0 | tr '0' 'a')"
          revision="$(git rev-parse HEAD)"

          jq --arg config_sha "$config_sha" --arg zero "$zero" --arg a "$a" --arg revision "$revision" '
            .purpose = "qualified_run" |
            .generator.revision = $revision |
            .generator.configuration_sha256 = $config_sha |
            .evaluator.source_sha256 = $a |
            .evaluator.oracle_separation = "independent_evaluator_boundary_verified" |
            .policy_freeze.source_or_policy_sha256 = $a |
            .policy_freeze.prompt_sha256 = $a |
            .policy_freeze.configuration_sha256 = $a |
            .policy_freeze.tool_manifest_sha256 = $a |
            .analysis_plan_sha256 = $a |
            .protocol_commitment_sha256 = $zero |
            .seed_commitment_sha256 = $zero |
            .task_set_commitment_sha256 = $zero
          ' "$manifest" > /tmp/sbr-gen-draft.json

          # Fixed seed is a public integration-test vector only, never a real secret.
          printf 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' > /tmp/sbr-gen-seed.bin
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            protocol-commit /tmp/sbr-gen-draft.json > /tmp/sbr-gen-protocol.json
          protocol="$(jq -r '.protocol_commitment_sha256' /tmp/sbr-gen-protocol.json)"
          jq --arg protocol "$protocol" '.protocol_commitment_sha256 = $protocol' \
            /tmp/sbr-gen-draft.json > /tmp/sbr-gen-protocol-bound.json

          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            artifact-commit /tmp/sbr-gen-protocol-bound.json seed /tmp/sbr-gen-seed.bin \
            > /tmp/sbr-gen-seed-commit.json
          seed_commit="$(jq -r '.artifact_commitment_sha256' /tmp/sbr-gen-seed-commit.json)"
          jq --arg seed_commit "$seed_commit" '.seed_commitment_sha256 = $seed_commit' \
            /tmp/sbr-gen-protocol-bound.json > /tmp/sbr-gen-seed-bound.json

          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            generate-task-set /tmp/sbr-gen-seed-bound.json /tmp/sbr-gen-seed.bin "$config" \
            /tmp/sbr-generated-task-set.json > /tmp/sbr-generation-report.json
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            artifact-commit /tmp/sbr-gen-seed-bound.json task-set /tmp/sbr-generated-task-set.json \
            > /tmp/sbr-gen-task-commit.json
          task_commit="$(jq -r '.artifact_commitment_sha256' /tmp/sbr-gen-task-commit.json)"
          jq --arg task_commit "$task_commit" '.task_set_commitment_sha256 = $task_commit' \
            /tmp/sbr-gen-seed-bound.json > /tmp/sbr-gen-final-manifest.json

          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            /tmp/sbr-gen-final-manifest.json --require-sealed > /tmp/sbr-gen-validation.json
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-reveal /tmp/sbr-gen-final-manifest.json /tmp/sbr-gen-seed.bin \
            /tmp/sbr-generated-task-set.json > /tmp/sbr-gen-reveal.json
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-regeneration /tmp/sbr-gen-final-manifest.json /tmp/sbr-gen-seed.bin "$config" \
            /tmp/sbr-generated-task-set.json > /tmp/sbr-regeneration-report.json
          grep -q '"verified": true' /tmp/sbr-regeneration-report.json
          grep -q '"byte_exact_match": true' /tmp/sbr-regeneration-report.json
          grep -q '"task_set_contract_valid": true' /tmp/sbr-regeneration-report.json
          grep -q '"synthetic_semantics_valid": true' /tmp/sbr-regeneration-report.json
          test "$(jq '.tasks | length' /tmp/sbr-generated-task-set.json)" -eq 8

          # Independent stdlib-only reference implementation, not production code.
          python3 research/science-bench-refresh/tools/reference_replay.py \
            /tmp/sbr-gen-final-manifest.json /tmp/sbr-gen-seed.bin "$config" \
            /tmp/sbr-generated-task-set.json > /tmp/sbr-reference-replay.json
          grep -q '"independent_semantic_match": true' /tmp/sbr-reference-replay.json
          grep -q '"task_count": 8' /tmp/sbr-reference-replay.json

          # The independent oracle must reject a valid-JSON but altered task set.
          set +e
          python3 research/science-bench-refresh/tools/reference_replay.py \
            /tmp/sbr-gen-final-manifest.json /tmp/sbr-gen-seed.bin "$config" \
            /tmp/sbr-mutated-generated-task-set.json > /tmp/sbr-reference-mutated-task.json 2> /tmp/sbr-reference-mutated-task.stderr
          python_task_exit=$?
          set -e
          test "$python_task_exit" -eq 2
          grep -q 'independent semantic replay differs' /tmp/sbr-reference-mutated-task.stderr

          # A different revealed seed must not reproduce the same Rust artifact.
          cp /tmp/sbr-gen-seed.bin /tmp/sbr-reference-other-seed.bin
          printf 'C' | dd of=/tmp/sbr-reference-other-seed.bin bs=1 seek=0 conv=notrunc status=none
          set +e
          python3 research/science-bench-refresh/tools/reference_replay.py \
            /tmp/sbr-gen-final-manifest.json /tmp/sbr-reference-other-seed.bin "$config" \
            /tmp/sbr-generated-task-set.json > /tmp/sbr-reference-mutated-seed.json 2> /tmp/sbr-reference-mutated-seed.stderr
          python_seed_exit=$?
          set -e
          test "$python_seed_exit" -eq 2
          grep -q 'independent semantic replay differs' /tmp/sbr-reference-mutated-seed.stderr

          # A changed generator-config file must fail the independent oracle's digest check.
          cp "$config" /tmp/sbr-reference-mutated-config.json
          printf ' ' >> /tmp/sbr-reference-mutated-config.json
          set +e
          python3 research/science-bench-refresh/tools/reference_replay.py \
            /tmp/sbr-gen-final-manifest.json /tmp/sbr-gen-seed.bin \
            /tmp/sbr-reference-mutated-config.json /tmp/sbr-generated-task-set.json \
            > /tmp/sbr-reference-mutated-config.json.out 2> /tmp/sbr-reference-mutated-config.stderr
          python_config_exit=$?
          set -e
          test "$python_config_exit" -eq 2
          grep -q 'generator config bytes do not match manifest digest' /tmp/sbr-reference-mutated-config.stderr

          # Mutation 1: changing the pinned generator config must fail closed.
          cp "$config" /tmp/sbr-mutated-config.json
          printf ' ' >> /tmp/sbr-mutated-config.json
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-regeneration /tmp/sbr-gen-final-manifest.json /tmp/sbr-gen-seed.bin \
            /tmp/sbr-mutated-config.json /tmp/sbr-generated-task-set.json \
            > /tmp/sbr-config-mutation-report.json 2> /tmp/sbr-config-mutation-stderr.txt
          config_exit=$?
          set -e
          test "$config_exit" -eq 2
          grep -q 'generator config bytes do not match' /tmp/sbr-config-mutation-stderr.txt

          # Mutation 2: a different seed cannot reproduce or validate the committed run.
          cp /tmp/sbr-gen-seed.bin /tmp/sbr-gen-mutated-seed.bin
          printf 'B' | dd of=/tmp/sbr-gen-mutated-seed.bin bs=1 seek=0 conv=notrunc status=none
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-regeneration /tmp/sbr-gen-final-manifest.json /tmp/sbr-gen-mutated-seed.bin \
            "$config" /tmp/sbr-generated-task-set.json \
            > /tmp/sbr-seed-regeneration-report.json 2> /tmp/sbr-seed-regeneration-stderr.txt
          regenerated_seed_exit=$?
          set -e
          test "$regenerated_seed_exit" -eq 2
          grep -q 'seed bytes do not match' /tmp/sbr-seed-regeneration-stderr.txt

          # Mutation 3: reordering/altering one task without changing the commitment must fail.
          jq '.tasks[0].policy_input.observations = [{"x":1,"y":999}]' \
            /tmp/sbr-generated-task-set.json > /tmp/sbr-mutated-generated-task-set.json
          set +e
          cargo run --locked --quiet --manifest-path research/science-bench-refresh/Cargo.toml -- \
            verify-regeneration /tmp/sbr-gen-final-manifest.json /tmp/sbr-gen-seed.bin \
            "$config" /tmp/sbr-mutated-generated-task-set.json \
            > /tmp/sbr-task-regeneration-report.json
          task_regen_exit=$?
          set -e
          test "$task_regen_exit" -eq 5
          grep -q '"byte_exact_match": false' /tmp/sbr-task-regeneration-report.json


      - name: Cross-set overlap audit positive and negative controls
        shell: bash
        run: |
          set -euo pipefail
          cargo_manifest="research/science-bench-refresh/Cargo.toml"
          cat > /tmp/sbr-overlap-left.json <<'JSON'
          {
            "schema": "symthaea.science_bench_refresh_task_set.v1",
            "generation_id": "development-fixture",
            "tasks": [{
              "task_id": "dev-1",
              "family_id": "semantic_invariance",
              "policy_input": {
                "instruction": "Recover the relationship.",
                "observations": [{"x": 1.0, "y": 2.0}, {"x": 2.0, "y": 4.0}]
              },
              "evaluator_only": {"expected_law": "secret-fixture-label"}
            }]
          }
          JSON

          # Exact policy inputs block, even when task IDs/targets differ.
          jq '.generation_id = "refresh-exact" |
              .tasks[0].task_id = "refresh-1" |
              .tasks[0].evaluator_only.expected_law = "different-secret"' \
            /tmp/sbr-overlap-left.json > /tmp/sbr-overlap-exact.json
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            audit-overlap development /tmp/sbr-overlap-left.json \
            refresh:exact /tmp/sbr-overlap-exact.json > /tmp/sbr-overlap-exact-report.json
          exact_exit=$?
          set -e
          test "$exact_exit" -eq 6
          grep -q '"exact_overlap_pair_count": 1' /tmp/sbr-overlap-exact-report.json
          ! grep -Eq 'secret-fixture-label|different-secret' /tmp/sbr-overlap-exact-report.json

          # Reusing a task ID across splits blocks even when the policy input differs.
          jq '.generation_id = "refresh-shared-id" |
              .tasks[0].policy_input.observations[0].x = 9.0 |
              .tasks[0].policy_input.observations[0].y = 18.0 |
              .tasks[0].policy_input.observations[1].x = 10.0 |
              .tasks[0].policy_input.observations[1].y = 20.0' \
            /tmp/sbr-overlap-left.json > /tmp/sbr-overlap-shared-id.json
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            audit-overlap development /tmp/sbr-overlap-left.json \
            refresh:shared-id /tmp/sbr-overlap-shared-id.json > /tmp/sbr-overlap-shared-id-report.json
          shared_id_exit=$?
          set -e
          test "$shared_id_exit" -eq 6
          grep -q '"shared_task_id_count": 1' /tmp/sbr-overlap-shared-id-report.json
          grep -q '"exact_overlap_pair_count": 0' /tmp/sbr-overlap-shared-id-report.json

          # A coarse numerical match pauses for review; it is not classified as a leak.
          jq '.generation_id = "refresh-near" |
              .tasks[0].task_id = "near-1" |
              .tasks[0].policy_input.observations[0].x = 1.0001 |
              .tasks[0].policy_input.observations[0].y = 2.0001 |
              .tasks[0].policy_input.observations[1].x = 2.0001 |
              .tasks[0].policy_input.observations[1].y = 4.0001' \
            /tmp/sbr-overlap-left.json > /tmp/sbr-overlap-near.json
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            audit-overlap development /tmp/sbr-overlap-left.json \
            refresh:near /tmp/sbr-overlap-near.json > /tmp/sbr-overlap-near-report.json
          near_exit=$?
          set -e
          test "$near_exit" -eq 7
          grep -q '"near_duplicate_candidate_pair_count": 1' /tmp/sbr-overlap-near-report.json
          grep -q 'manual_review_required_for_numeric_near_duplicates' /tmp/sbr-overlap-near-report.json

          # Same structure but numerically distant observations are a negative control.
          jq '.generation_id = "refresh-distant" |
              .tasks[0].task_id = "distant-1" |
              .tasks[0].policy_input.observations[0].x = 100.0 |
              .tasks[0].policy_input.observations[0].y = 200.0 |
              .tasks[0].policy_input.observations[1].x = 101.0 |
              .tasks[0].policy_input.observations[1].y = 400.0' \
            /tmp/sbr-overlap-left.json > /tmp/sbr-overlap-distant.json
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            audit-overlap development /tmp/sbr-overlap-left.json \
            refresh:distant /tmp/sbr-overlap-distant.json > /tmp/sbr-overlap-distant-report.json
          grep -q '"exact_overlap_pair_count": 0' /tmp/sbr-overlap-distant-report.json
          grep -q '"near_duplicate_candidate_pair_count": 0' /tmp/sbr-overlap-distant-report.json
          grep -q 'no_detected_exact_or_numeric_tolerant_overlap' /tmp/sbr-overlap-distant-report.json


      - name: Cross-split lineage audit positive and negative controls
        shell: bash
        run: |
          set -euo pipefail
          cargo_manifest="research/science-bench-refresh/Cargo.toml"

          # Build evaluator-side ledgers bound to the exact fixture bytes.
          # The ledger uses task ancestry commitments, not family/schema labels.
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def normalize(value):
              if isinstance(value, dict):
                  return {key: normalize(child) for key, child in value.items()}
              if isinstance(value, list):
                  return [normalize(child) for child in value]
              if isinstance(value, float) and value.is_integer() and abs(value) <= 9007199254740991:
                  return int(value)
              return value

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def make_ledger(task_path, ledger_path, split_label, lineage, exposure):
              task_bytes = Path(task_path).read_bytes()
              task_set = json.loads(task_bytes)
              records = []
              for task in task_set["tasks"]:
                  policy = normalize(task["policy_input"])
                  canonical = json.dumps(
                      policy, ensure_ascii=False, sort_keys=True,
                      separators=(",", ":"), allow_nan=False
                  ).encode()
                  records.append({
                      "task_id": task["task_id"],
                      "policy_input_sha256": digest(canonical),
                      "exposure_state": exposure,
                      "lineage_commitments": [{
                          "kind": "parent_world",
                          "commitment_sha256": digest(lineage.encode())
                      }]
                  })
              ledger = {
                  "schema": "symthaea.science_bench_refresh_lineage_ledger.v1",
                  "generation_id": task_set["generation_id"],
                  "split_label": split_label,
                  "task_set_sha256": digest(task_bytes),
                  "records": records
              }
              Path(ledger_path).write_text(
                  json.dumps(ledger, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8"
              )

          make_ledger(
              "/tmp/sbr-overlap-left.json", "/tmp/sbr-lineage-left.json",
              "development:fixture", "parent-world-shared", "public_development"
          )
          make_ledger(
              "/tmp/sbr-overlap-distant.json", "/tmp/sbr-lineage-right-shared.json",
              "refresh:fixture", "parent-world-shared", "never_exposed"
          )
          make_ledger(
              "/tmp/sbr-overlap-distant.json", "/tmp/sbr-lineage-right-disjoint.json",
              "refresh:fixture", "parent-world-distinct", "never_exposed"
          )
          make_ledger(
              "/tmp/sbr-overlap-distant.json", "/tmp/sbr-lineage-right-exposed.json",
              "refresh:fixture", "parent-world-distinct", "public_development"
          )
          PY

          # Same parent world, different policy inputs: block.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            audit-lineage /tmp/sbr-overlap-left.json /tmp/sbr-lineage-left.json \
            /tmp/sbr-overlap-distant.json /tmp/sbr-lineage-right-shared.json \
            > /tmp/sbr-lineage-shared-report.json
          shared_lineage_exit=$?
          set -e
          test "$shared_lineage_exit" -eq 8
          grep -q '"shared_lineage_root_count": 1' /tmp/sbr-lineage-shared-report.json
          grep -q 'blocked_shared_cross_split_lineage' /tmp/sbr-lineage-shared-report.json
          ! grep -q 'secret-fixture-label' /tmp/sbr-lineage-shared-report.json

          # Same schema but a disjoint parent world and never-exposed refresh: pass.
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            audit-lineage /tmp/sbr-overlap-left.json /tmp/sbr-lineage-left.json \
            /tmp/sbr-overlap-distant.json /tmp/sbr-lineage-right-disjoint.json \
            > /tmp/sbr-lineage-disjoint-report.json
          grep -q '"shared_lineage_root_count": 0' /tmp/sbr-lineage-disjoint-report.json
          grep -q 'no_detected_shared_lineage_or_exposed_refresh' /tmp/sbr-lineage-disjoint-report.json

          # A refresh task marked exposed blocks even without shared lineage.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            audit-lineage /tmp/sbr-overlap-left.json /tmp/sbr-lineage-left.json \
            /tmp/sbr-overlap-distant.json /tmp/sbr-lineage-right-exposed.json \
            > /tmp/sbr-lineage-exposed-report.json
          exposed_exit=$?
          set -e
          test "$exposed_exit" -eq 8
          grep -q '"right_exposed_refresh_task_count": 1' /tmp/sbr-lineage-exposed-report.json
          grep -q 'blocked_exposed_refresh_tasks' /tmp/sbr-lineage-exposed-report.json

          # The sidecar cannot be reused after task-set bytes mutate.
          cp /tmp/sbr-overlap-distant.json /tmp/sbr-lineage-mutated-task-set.json
          printf ' ' >> /tmp/sbr-lineage-mutated-task-set.json
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            audit-lineage /tmp/sbr-overlap-left.json /tmp/sbr-lineage-left.json \
            /tmp/sbr-lineage-mutated-task-set.json /tmp/sbr-lineage-right-disjoint.json \
            > /tmp/sbr-lineage-mutated-report.json 2> /tmp/sbr-lineage-mutated.stderr
          mutated_exit=$?
          set -e
          test "$mutated_exit" -eq 2
          grep -q 'does not bind the exact task-set bytes' /tmp/sbr-lineage-mutated.stderr


      - name: Search exposure receipt integrity and policy controls
        shell: bash
        run: |
          set -euo pipefail
          cargo_manifest="research/science-bench-refresh/Cargo.toml"
          python3 research/science-bench-refresh/tools/search_receipt_test_vectors.py /tmp/sbr-search-receipts

          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-search-receipt /tmp/sbr-search-receipts/valid-isolated.json \
            > /tmp/sbr-search-valid-report.json
          grep -q '"integrity_valid": true' /tmp/sbr-search-valid-report.json
          grep -q '"policy_compliant": true' /tmp/sbr-search-valid-report.json
          grep -q 'receipt_integrity_and_declared_policy_pass_external_anchor_required' /tmp/sbr-search-valid-report.json

          # A correctly hashed allowed network action still violates isolation.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-search-receipt /tmp/sbr-search-receipts/isolated-policy-violation.json \
            > /tmp/sbr-search-isolation-report.json
          isolated_exit=$?
          set -e
          test "$isolated_exit" -eq 9
          grep -q '"integrity_valid": true' /tmp/sbr-search-isolation-report.json
          grep -q '"policy_compliant": false' /tmp/sbr-search-isolation-report.json

          # A host outside the declared allowlist is a policy failure.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-search-receipt /tmp/sbr-search-receipts/allowlist-policy-violation.json \
            > /tmp/sbr-search-allowlist-report.json
          allowlist_exit=$?
          set -e
          test "$allowlist_exit" -eq 9
          grep -q '"integrity_valid": true' /tmp/sbr-search-allowlist-report.json
          grep -q '"policy_compliant": false' /tmp/sbr-search-allowlist-report.json

          # Altered, missing, or reordered events invalidate the chain/denominator.
          for case in mutated-event missing-event reordered-events; do
            set +e
            cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
              verify-search-receipt "/tmp/sbr-search-receipts/$case.json" \
              > "/tmp/sbr-search-$case-report.json"
            receipt_exit=$?
            set -e
            test "$receipt_exit" -eq 10
            grep -q '"integrity_valid": false' "/tmp/sbr-search-$case-report.json"
          done

          # Reports contain digest-only traces, not raw query or response content.
          ! grep -Eq 'query: example|observed-response|fetch: example' /tmp/sbr-search-valid-report.json


      - name: Evaluator-side search exposure match report controls
        shell: bash
        run: |
          set -euo pipefail
          cargo_manifest="research/science-bench-refresh/Cargo.toml"
          python3 research/science-bench-refresh/tools/search_match_test_vectors.py /tmp/sbr-search-matches

          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-search-matches /tmp/sbr-search-matches/match-receipt.json \
            /tmp/sbr-search-matches/no-match-report.json > /tmp/sbr-match-clean-report.json
          grep -q '"integrity_valid": true' /tmp/sbr-match-clean-report.json
          grep -q '"event_coverage_valid": true' /tmp/sbr-match-clean-report.json
          grep -q 'no_detected_retrieval_contamination_under_declared_matcher' /tmp/sbr-match-clean-report.json

          # Explicit answer exposure blocks even when the receipt itself is valid.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-search-matches /tmp/sbr-search-matches/match-receipt.json \
            /tmp/sbr-search-matches/explicit-answer-report.json > /tmp/sbr-match-answer-report.json
          answer_exit=$?
          set -e
          test "$answer_exit" -eq 12
          grep -q '"contaminated_event_count": 1' /tmp/sbr-match-answer-report.json
          grep -q 'blocked_explicit_answer_exposure' /tmp/sbr-match-answer-report.json

          # Ambiguous semantic matches are review gates, not forced classifications.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-search-matches /tmp/sbr-search-matches/match-receipt.json \
            /tmp/sbr-search-matches/review-required-report.json > /tmp/sbr-match-review-report.json
          review_exit=$?
          set -e
          test "$review_exit" -eq 13
          grep -q '"review_required_event_count": 1' /tmp/sbr-match-review-report.json
          grep -q 'manual_review_required' /tmp/sbr-match-review-report.json

          # Missing or edited evaluator records must fail closed.
          for case in missing-match-record mutated-match-report; do
            set +e
            cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
              verify-search-matches /tmp/sbr-search-matches/match-receipt.json \
              "/tmp/sbr-search-matches/$case.json" > "/tmp/sbr-match-$case-report.json"
            match_exit=$?
            set -e
            test "$match_exit" -eq 11
            grep -q '"integrity_valid": false' "/tmp/sbr-match-$case-report.json"
          done

          # Evaluator-side protected references and raw response content are not emitted.
          ! grep -Eq 'protected-answer-item|retrieved response body|candidate-evidence-snippet' \
            /tmp/sbr-match-answer-report.json


      - name: Exact protected retrieval matching controls
        shell: bash
        run: |
          set -euo pipefail
          cargo_manifest="research/science-bench-refresh/Cargo.toml"
          python3 research/science-bench-refresh/tools/search_exact_match_test_vectors.py /tmp/sbr-exact-matcher

          # Independently computed Python fixture commitment must match the Rust implementation.
          rust_index_commitment="$(cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            commit-protected-index /tmp/sbr-exact-matcher/answer-index-fields.json | jq -r '.index_commitment_sha256')"
          fixture_index_commitment="$(jq -r '.index_commitment_sha256' /tmp/sbr-exact-matcher/answer-index.json)"
          test "$rust_index_commitment" = "$fixture_index_commitment"

          # Exact answer match wins over lower-severity references for the same bytes.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            match-search-exact /tmp/sbr-exact-matcher/answer-receipt.json \
            /tmp/sbr-exact-matcher/answer-index.json > /tmp/sbr-exact-answer-report.json
          answer_exit=$?
          set -e
          test "$answer_exit" -eq 12
          grep -q '"classification": "explicit_answer"' /tmp/sbr-exact-answer-report.json
          grep -q '"match_method": "exact_digest"' /tmp/sbr-exact-answer-report.json
          ! grep -Eq 'exact protected answer bytes|answer-ref|protected answer text' /tmp/sbr-exact-answer-report.json

          # The emitted report must be reproducible from the exact receipt and protected-index bytes.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-search-exact-matches /tmp/sbr-exact-matcher/answer-receipt.json \
            /tmp/sbr-exact-matcher/answer-index.json \
            /tmp/sbr-exact-answer-report.json > /tmp/sbr-exact-answer-verified.json
          verified_answer_exit=$?
          set -e
          test "$verified_answer_exit" -eq 12
          grep -q 'blocked_explicit_answer_exposure' /tmp/sbr-exact-answer-verified.json

          # Metadata and question-context exposure are kept as separate severities.
          for case in metadata context; do
            set +e
            cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
              match-search-exact "/tmp/sbr-exact-matcher/$case-receipt.json" \
              "/tmp/sbr-exact-matcher/$case-index.json" \
              > "/tmp/sbr-exact-$case-report.json"
            match_exit=$?
            set -e
            test "$match_exit" -eq 12
          done
          grep -q '"classification": "benchmark_metadata"' /tmp/sbr-exact-metadata-report.json
          grep -q '"classification": "question_context"' /tmp/sbr-exact-context-report.json

          # A response with no exact protected digest match remains no_match.
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            match-search-exact /tmp/sbr-exact-matcher/no-match-receipt.json \
            /tmp/sbr-exact-matcher/no-match-index.json > /tmp/sbr-exact-no-match-report.json
          grep -q '"classification": "no_match"' /tmp/sbr-exact-no-match-report.json
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-search-exact-matches /tmp/sbr-exact-matcher/no-match-receipt.json \
            /tmp/sbr-exact-matcher/no-match-index.json \
            /tmp/sbr-exact-no-match-report.json > /tmp/sbr-exact-no-match-verified.json
          grep -q 'no_detected_retrieval_contamination_under_declared_matcher' /tmp/sbr-exact-no-match-verified.json

          # A blocked request is not evaluable for content matching, not a negative answer match.
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            match-search-exact /tmp/sbr-exact-matcher/blocked-receipt.json \
            /tmp/sbr-exact-matcher/blocked-index.json > /tmp/sbr-exact-blocked-report.json
          grep -q '"classification": "not_evaluable"' /tmp/sbr-exact-blocked-report.json

          # Tampered commitments or generation mismatches fail before classifying a response.
          for index in mutated-index wrong-generation-index; do
            set +e
            cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
              match-search-exact /tmp/sbr-exact-matcher/answer-receipt.json \
              "/tmp/sbr-exact-matcher/$index.json" > "/tmp/sbr-exact-$index-report.json" 2> "/tmp/sbr-exact-$index.stderr"
            index_exit=$?
            set -e
            test "$index_exit" -eq 2
          done

          # A report cannot be relabeled clean without being detected by deterministic recomputation.
          jq '.records[0].classification = "no_match"' \
            /tmp/sbr-exact-answer-report.json > /tmp/sbr-exact-answer-mutated-report.json
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-search-exact-matches /tmp/sbr-exact-matcher/answer-receipt.json \
            /tmp/sbr-exact-matcher/answer-index.json \
            /tmp/sbr-exact-answer-mutated-report.json > /tmp/sbr-exact-answer-mutated-verified.json 2> /tmp/sbr-exact-answer-mutated.stderr
          mutated_report_exit=$?
          set -e
          test "$mutated_report_exit" -eq 11

      - name: Counterfactual evidence intervention plan controls
        shell: bash
        run: |
          set -euo pipefail
          cargo_manifest="research/science-bench-refresh/Cargo.toml"
          jq empty research/science-bench-refresh/schema/counterfactual-evidence-intervention-plan.schema.json
          jq empty research/science-bench-refresh/schema/counterfactual-evidence-intervention-plan-fields.schema.json
          cargo test --locked --manifest-path "$cargo_manifest" counterfactual_evidence -- --nocapture
          python3 research/science-bench-refresh/tools/counterfactual_evidence_test_vectors.py /tmp/sbr-counterfactual-evidence

          # Independent Python and Rust typed commitments must agree.
          rust_commitment="$(cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            commit-evidence-intervention-plan /tmp/sbr-counterfactual-evidence/plan-fields.json \
            | jq -r '.plan_commitment_sha256')"
          expected_commitment="$(jq -r '.expected_plan_commitment_sha256' /tmp/sbr-counterfactual-evidence/summary.json)"
          test "$rust_commitment" = "$expected_commitment"

          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-evidence-intervention-plan /tmp/sbr-counterfactual-evidence/valid-plan.json \
            > /tmp/sbr-counterfactual-evidence/valid-report.json
          jq -e '.valid == true and .structural_valid == true and .plan_commitment_matches == true' \
            /tmp/sbr-counterfactual-evidence/valid-report.json >/dev/null
          jq -e '.pair_count == 1 and .planned_trial_count == 6 and .conditions_per_pair == 6' \
            /tmp/sbr-counterfactual-evidence/valid-report.json >/dev/null
          jq -e '.external_anchor_required == true and .runner_execution_proven == false' \
            /tmp/sbr-counterfactual-evidence/valid-report.json >/dev/null

          # A correctly re-committed but incomplete pair must fail structurally.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-evidence-intervention-plan /tmp/sbr-counterfactual-evidence/missing-condition-plan.json \
            > /tmp/sbr-counterfactual-evidence/missing-condition-report.json
          missing_exit=$?
          set -e
          test "$missing_exit" -eq 11
          jq -e '.structural_valid == false and .valid == false' \
            /tmp/sbr-counterfactual-evidence/missing-condition-report.json >/dev/null

          # A complete plan with a mutated commitment must fail independently.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-evidence-intervention-plan /tmp/sbr-counterfactual-evidence/mutated-commitment-plan.json \
            > /tmp/sbr-counterfactual-evidence/mutated-commitment-report.json
          mutation_exit=$?
          set -e
          test "$mutation_exit" -eq 11
          jq -e '.structural_valid == true and .plan_commitment_matches == false and .valid == false' \
            /tmp/sbr-counterfactual-evidence/mutated-commitment-report.json >/dev/null
          ! grep -Eq 'raw target|gold answer text|hidden oracle' /tmp/sbr-counterfactual-evidence/valid-report.json
      - name: Evaluator-side counterfactual outcome receipt controls
        shell: bash
        run: |
          set -euo pipefail
          cargo_manifest="research/science-bench-refresh/Cargo.toml"
          jq empty research/science-bench-refresh/schema/evidence-outcome-report.schema.json
          jq empty research/science-bench-refresh/schema/evidence-outcome-report-fields.schema.json

          cargo test --locked --manifest-path "$cargo_manifest" evidence_outcomes -- --nocapture
          python3 research/science-bench-refresh/tools/counterfactual_evidence_test_vectors.py /tmp/sbr-counterfactual-evidence
          python3 research/science-bench-refresh/tools/evidence_outcome_test_vectors.py \
            /tmp/sbr-counterfactual-evidence/valid-plan.json /tmp/sbr-evidence-outcomes

          # Independently generated Python commitment must match typed Rust serialization.
          rust_commitment="$(cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            commit-evidence-outcomes /tmp/sbr-counterfactual-evidence/valid-plan.json \
            /tmp/sbr-evidence-outcomes/outcome-fields.json | jq -r '.report_commitment_sha256')"
          expected_commitment="$(jq -r '.expected_report_commitment_sha256' /tmp/sbr-evidence-outcomes/summary.json)"
          test "$rust_commitment" = "$expected_commitment"

          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-evidence-outcomes /tmp/sbr-counterfactual-evidence/valid-plan.json \
            /tmp/sbr-evidence-outcomes/valid-outcome-report.json > /tmp/sbr-evidence-outcomes/verified.json
          jq -e '.valid == true and .plan_binding_valid == true and .report_commitment_matches == true' \
            /tmp/sbr-evidence-outcomes/verified.json >/dev/null
          jq -e '.planned_trial_count == 6 and .observed_record_count == 6 and .missing_trial_count == 0' \
            /tmp/sbr-evidence-outcomes/verified.json >/dev/null
          jq -e '.scorecard.runner_execution_proven == false and .scorecard.external_anchor_required == true' \
            /tmp/sbr-evidence-outcomes/verified.json >/dev/null
          jq -e '.scorecard.terminal_status_counts.timeout == 1' \
            /tmp/sbr-evidence-outcomes/verified.json >/dev/null
          jq -e '.scorecard.condition_summaries | length == 6' \
            /tmp/sbr-evidence-outcomes/verified.json >/dev/null

          # A failed, missing or mislabeled trial cannot disappear from the denominator.
          for case in missing-outcome duplicate-outcome wrong-condition changed-evaluator changed-rules contaminated-scored budget-violation-scored; do
            set +e
            cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
              verify-evidence-outcomes /tmp/sbr-counterfactual-evidence/valid-plan.json \
              "/tmp/sbr-evidence-outcomes/${case}-report.json" > "/tmp/sbr-evidence-outcomes/$case-verified.json"
            invalid_exit=$?
            set -e
            test "$invalid_exit" -eq 11
            jq -e '.valid == false and .scorecard == null' \
              "/tmp/sbr-evidence-outcomes/$case-verified.json" >/dev/null
          done
          jq -e '.missing_trial_count == 1 and .observed_record_count == 5' \
            /tmp/sbr-evidence-outcomes/missing-outcome-verified.json >/dev/null

          # Commitment mutation is distinct from plan/coverage failure.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-evidence-outcomes /tmp/sbr-counterfactual-evidence/valid-plan.json \
            /tmp/sbr-evidence-outcomes/mutated-commitment-report.json \
            > /tmp/sbr-evidence-outcomes/mutated-commitment-verified.json
          mutated_exit=$?
          set -e
          test "$mutated_exit" -eq 11
          jq -e '.valid == false and .report_commitment_matches == false' \
            /tmp/sbr-evidence-outcomes/mutated-commitment-verified.json >/dev/null

          # Omitting an explicit nullable field is malformed, not equivalent to null.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            verify-evidence-outcomes /tmp/sbr-counterfactual-evidence/valid-plan.json \
            /tmp/sbr-evidence-outcomes/omitted-null-field-report.json \
            > /tmp/sbr-evidence-outcomes/omitted-field-stdout.json \
            2> /tmp/sbr-evidence-outcomes/omitted-field-stderr.txt
          omitted_field_exit=$?
          set -e
          test "$omitted_field_exit" -eq 2
          grep -q 'missing required field cost_micro_usd' \
            /tmp/sbr-evidence-outcomes/omitted-field-stderr.txt

          # Reports may contain hashes/labels, never evaluator-private source text.
          ! grep -Eiq 'gold answer text|hidden oracle|protected source passage' \
            /tmp/sbr-evidence-outcomes/verified.json
      - name: Preregistered paired outcome analysis controls
        shell: bash
        run: |
          set -euo pipefail
          cargo_manifest="research/science-bench-refresh/Cargo.toml"
          jq empty research/science-bench-refresh/schema/paired-outcome-analysis-plan.schema.json
          jq empty research/science-bench-refresh/schema/paired-outcome-analysis-report.schema.json
          jq empty research/science-bench-refresh/schema/evidence-behavior-contract-plan.schema.json
          jq empty research/science-bench-refresh/schema/evidence-behavior-contract-report.schema.json
          jq empty research/science-bench-refresh/schema/judge-robustness-plan.schema.json
          jq empty research/science-bench-refresh/schema/judge-robustness-report.schema.json
          cargo test --locked --manifest-path "$cargo_manifest" paired_outcome_analysis -- --nocapture

          # The analysis artifact is created first, hashed into a new plan, then
          # the outcome fixture is generated against that exact plan.
          python3 research/science-bench-refresh/tools/paired_outcome_analysis_test_vectors.py \
            /tmp/sbr-counterfactual-evidence/plan-fields.json /tmp/sbr-paired-analysis
          python3 research/science-bench-refresh/tools/evidence_outcome_test_vectors.py \
            /tmp/sbr-paired-analysis/plan.json /tmp/sbr-paired-analysis/outcomes
          python3 research/science-bench-refresh/tools/evidence_outcome_test_vectors.py \
            /tmp/sbr-paired-analysis/unknown-dependence-plan.json \
            /tmp/sbr-paired-analysis/unknown-dependence-outcomes

          plan_commitment="$(cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            commit-evidence-intervention-plan /tmp/sbr-paired-analysis/plan-fields.json \
            | jq -r '.plan_commitment_sha256')"
          expected_plan_commitment="$(jq -r '.expected_plan_commitment_sha256' /tmp/sbr-paired-analysis/summary.json)"
          test "$plan_commitment" = "$expected_plan_commitment"

          unknown_plan_commitment="$(cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            commit-evidence-intervention-plan /tmp/sbr-paired-analysis/unknown-dependence-plan-fields.json \
            | jq -r '.plan_commitment_sha256')"
          expected_unknown_plan_commitment="$(jq -r '.unknown_dependence_plan_commitment_sha256' /tmp/sbr-paired-analysis/summary.json)"
          test "$unknown_plan_commitment" = "$expected_unknown_plan_commitment"

          outcome_commitment="$(cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            commit-evidence-outcomes /tmp/sbr-paired-analysis/plan.json \
            /tmp/sbr-paired-analysis/outcomes/outcome-fields.json \
            | jq -r '.report_commitment_sha256')"
          expected_outcome_commitment="$(jq -r '.expected_report_commitment_sha256' /tmp/sbr-paired-analysis/outcomes/summary.json)"
          test "$outcome_commitment" = "$expected_outcome_commitment"

          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            analyze-paired-evidence-outcomes /tmp/sbr-paired-analysis/plan.json \
            /tmp/sbr-paired-analysis/outcomes/valid-outcome-report.json \
            /tmp/sbr-paired-analysis/analysis-plan.json > /tmp/sbr-paired-analysis/analysis-verification.json
          jq -e '.valid == true and .plan_binding_valid == true and .outcome_report_valid == true' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null
          jq -e '.analysis_plan_hash_matches == true and .analysis_revision_matches == true' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null
          jq -e '.report.body.fixed_benchmark_only == true and .report.body.generalized_accuracy_estimated == false' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null
          jq -e '.report.body.runner_execution_proven == false and .report.body.external_anchor_required == true' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null
          jq -e '.report.body.contrast_results | length == 5' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null
          jq -e '.report.body.contrast_results[] | select(.endpoint == "strict_correctness") | .assigned_pair_count == 1 and .eligible_pair_count == 1 and .ties == 1' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null
          jq -e '.report.body.contrast_results[] | select(.endpoint == "expected_response") | .assigned_pair_count == 1 and .eligible_pair_count == 1 and .ties == 1' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null
          jq -e '.report.body.contrast_results[] | select(.contrast_id == "source-contradiction-strict-correctness-vs-natural") | .eligible_pair_count == 1 and .treatment_losses == 1 and .paired_risk_difference == -1' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null
          jq -e '.report.body.pair_dependence_policy == "exact_conditional_independent_pairs" and .report.body.multiplicity_policy == "holm_across_binary_contrasts"' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null
          jq -e '.report.body.contrast_results[] | select(.endpoint == "cost_micro_usd") | .metric_complete_pair_count == 1 and .mean_resource_delta_treatment_minus_reference != null' \
            /tmp/sbr-paired-analysis/analysis-verification.json >/dev/null

          # Verify the same outcomes under unknown pair dependence: preserve
          # matched effects, but do not emit p-values or confidence intervals.
          unknown_outcome_commitment="$(cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            commit-evidence-outcomes /tmp/sbr-paired-analysis/unknown-dependence-plan.json \
            /tmp/sbr-paired-analysis/unknown-dependence-outcomes/outcome-fields.json \
            | jq -r '.report_commitment_sha256')"
          unknown_expected_outcome_commitment="$(jq -r '.expected_report_commitment_sha256' \
            /tmp/sbr-paired-analysis/unknown-dependence-outcomes/summary.json)"
          test "$unknown_outcome_commitment" = "$unknown_expected_outcome_commitment"
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            analyze-paired-evidence-outcomes /tmp/sbr-paired-analysis/unknown-dependence-plan.json \
            /tmp/sbr-paired-analysis/unknown-dependence-outcomes/valid-outcome-report.json \
            /tmp/sbr-paired-analysis/unknown-dependence-analysis-plan.json \
            > /tmp/sbr-paired-analysis/unknown-dependence-verification.json
          jq -e '.valid == true and .report.body.pair_dependence_policy == "descriptive_only_dependence_unknown"' \
            /tmp/sbr-paired-analysis/unknown-dependence-verification.json >/dev/null
          jq -e '[.report.body.contrast_results[] | select(.exact_mcnemar_two_sided_p != null or .exact_mcnemar_log10_p != null or .mcnemar_p_value_numerically_floored != null or .holm_adjusted_p != null or .discordant_win_rate_wilson_95_low != null or .discordant_win_rate_wilson_95_high != null)] | length == 0' \
            /tmp/sbr-paired-analysis/unknown-dependence-verification.json >/dev/null
          jq -e '.report.body.contrast_results[] | select(.endpoint == "strict_correctness") | .paired_risk_difference == 0 and .eligible_pair_count == 1' \
            /tmp/sbr-paired-analysis/unknown-dependence-verification.json >/dev/null

          # Deterministic: rerunning the same precommitted analysis yields exact bytes.
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            analyze-paired-evidence-outcomes /tmp/sbr-paired-analysis/plan.json \
            /tmp/sbr-paired-analysis/outcomes/valid-outcome-report.json \
            /tmp/sbr-paired-analysis/analysis-plan.json > /tmp/sbr-paired-analysis/analysis-verification-repeat.json
          cmp /tmp/sbr-paired-analysis/analysis-verification.json /tmp/sbr-paired-analysis/analysis-verification-repeat.json

          # The analyzer cannot be retargeted to a post-hoc plan or source revision.
          for case in tampered-analysis-plan wrong-revision-analysis-plan; do
            set +e
            cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
              analyze-paired-evidence-outcomes /tmp/sbr-paired-analysis/plan.json \
              /tmp/sbr-paired-analysis/outcomes/valid-outcome-report.json \
              "/tmp/sbr-paired-analysis/$case.json" > "/tmp/sbr-paired-analysis/$case-verification.json"
            invalid_exit=$?
            set -e
            test "$invalid_exit" -eq 11
            jq -e '.valid == false and .report == null' \
              "/tmp/sbr-paired-analysis/$case-verification.json" >/dev/null
          done

          # An invalid outcome receipt must not produce an analysis report.
          set +e
          cargo run --locked --quiet --manifest-path "$cargo_manifest" -- \
            analyze-paired-evidence-outcomes /tmp/sbr-paired-analysis/plan.json \
            /tmp/sbr-paired-analysis/outcomes/mutated-commitment-report.json \
            /tmp/sbr-paired-analysis/analysis-plan.json > /tmp/sbr-paired-analysis/invalid-outcome-analysis.json
          invalid_outcome_exit=$?
          set -e
          test "$invalid_outcome_exit" -eq 11
          jq -e '.valid == false and .outcome_report_valid == false and .report == null' \
            /tmp/sbr-paired-analysis/invalid-outcome-analysis.json >/dev/null

