name: REA Proof Obligation Acquisition Fixture Validation

on:
  pull_request:
    paths:
      - "docs/research/REA_PROOF_OBLIGATION_ACQUISITION_2026Q4.md"
      - "docs/research/rea-proof-obligation-acquisition-fixtures-v0.schema.json"
      - "docs/research/rea-proof-obligation-acquisition-fixtures-v0.json"
      - "docs/research/rea-proof-obligation-acquisition-agent-view-v0.schema.json"
      - "docs/research/rea-proof-obligation-acquisition-agent-view-v0.json"
      - "docs/research/rea-proof-obligation-acquisition-grader-v0.schema.json"
      - "docs/research/rea-proof-obligation-acquisition-grader-v0.json"
      - "docs/research/rea-proof-obligation-policy-run-v0.schema.json"
      - "examples/rea-proof-obligation-policy-run-v0.cost-only.synthetic.json"
      - "tools/rea-proof-obligation-fixture-check/**"
      - ".github/workflows/rea-proof-obligation-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-proof-obligation-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Generate isolated fixture checker lockfile
        run: cargo generate-lockfile --manifest-path tools/rea-proof-obligation-fixture-check/Cargo.toml

      - name: Verify exact revision and toolchain
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          rustc --version --verbose
          cargo --version
          sha256sum tools/rea-proof-obligation-fixture-check/Cargo.lock

      - name: Apply rustfmt and verify formatting
        run: |
          cargo fmt --manifest-path tools/rea-proof-obligation-fixture-check/Cargo.toml
          cargo fmt --manifest-path tools/rea-proof-obligation-fixture-check/Cargo.toml -- --check

      - name: Archive rustfmt-normalized checker source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-proof-obligation-rustfmt-source
          path: tools/rea-proof-obligation-fixture-check/src/lib.rs
          if-no-files-found: error
          retention-days: 7

      - name: Schema, fixture integrity and mutation controls
        run: cargo test --manifest-path tools/rea-proof-obligation-fixture-check/Cargo.toml --locked

      - name: Score cost-only synthetic policy baseline
        run: |
          mkdir -p artifacts
          cargo run --manifest-path tools/rea-proof-obligation-fixture-check/Cargo.toml --locked --bin rea-proof-obligation-score -- \
            docs/research/rea-proof-obligation-acquisition-agent-view-v0.json \
            docs/research/rea-proof-obligation-acquisition-grader-v0.json \
            examples/rea-proof-obligation-policy-run-v0.cost-only.synthetic.json \
            > artifacts/rea-proof-obligation-policy-score.synthetic.json
          test -s artifacts/rea-proof-obligation-policy-score.synthetic.json

      - name: Archive synthetic policy score report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-proof-obligation-policy-score-synthetic
          path: artifacts/rea-proof-obligation-policy-score.synthetic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Warnings-denied Clippy
        run: cargo clippy --manifest-path tools/rea-proof-obligation-fixture-check/Cargo.toml --all-targets --locked -- -D warnings

      - name: Archive exact fixture checker lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-proof-obligation-fixture-check-lockfile
          path: tools/rea-proof-obligation-fixture-check/Cargo.lock
          if-no-files-found: warn
          retention-days: 7
