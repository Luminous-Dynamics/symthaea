name: Broca Measurements

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-broca/**"
      - "scripts/broca_measurement_artifacts.sh"
      - "scripts/broca_measurement_summary.py"
      - "scripts/broca_capture_baseline.sh"
      - "src/bin/broca_attribution_harness.rs"
      - ".github/workflows/broca-measurements.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"
  BROCA_EVAL_LIMIT: "8"
  BROCA_EXERCISM_ATTEMPTS: "1"
  BROCA_MAMBA_BACKEND: "cpu"
  # Keep PR measurement jobs bounded. Full Exercism runs are intentionally
  # opt-in because CPU Mamba synthesis can take several minutes per fixture.
  BROCA_SKIP_EXERCISM: "1"

jobs:
  broca-measurements:
    name: Broca measurement artifacts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-broca-measurements-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-broca-measurements-
            ${{ runner.os }}-broca-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev cmake

      - name: Verify Cargo.lock is current
        id: cargo-lock-integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/broca-measurements/lock-diagnostic
          cp Cargo.lock target/broca-measurements/lock-diagnostic/Cargo.lock.checked-in

          set +e
          cargo metadata --locked --format-version=1 --no-deps \
            > target/broca-measurements/lock-diagnostic/cargo-metadata-locked.stdout.log \
            2> target/broca-measurements/lock-diagnostic/cargo-metadata-locked.stderr.log
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            printf '%s\n' "locked metadata resolution: PASS" \
              > target/broca-measurements/lock-diagnostic/result.txt
            exit 0
          fi

          printf '%s\n' "locked metadata resolution: FAIL (exit $status)" \
            > target/broca-measurements/lock-diagnostic/result.txt

          set +e
          cargo generate-lockfile \
            > target/broca-measurements/lock-diagnostic/cargo-generate-lockfile.stdout.log \
            2> target/broca-measurements/lock-diagnostic/cargo-generate-lockfile.stderr.log
          regen_status=$?
          set -e

          if [[ -f Cargo.lock ]]; then
            cp Cargo.lock target/broca-measurements/lock-diagnostic/Cargo.lock.generated
            diff -u \
              target/broca-measurements/lock-diagnostic/Cargo.lock.checked-in \
              target/broca-measurements/lock-diagnostic/Cargo.lock.generated \
              > target/broca-measurements/lock-diagnostic/Cargo.lock.diff || true
          else
            : > target/broca-measurements/lock-diagnostic/Cargo.lock.generated-missing
          fi

          cp target/broca-measurements/lock-diagnostic/Cargo.lock.checked-in Cargo.lock

          {
            echo "metadata_status=$status"
            echo "regeneration_status=$regen_status"
            echo "generated_lock_present=$(test -f target/broca-measurements/lock-diagnostic/Cargo.lock.generated && echo yes || echo no)"
          } > target/broca-measurements/lock-diagnostic/status.env

          exit "$status"

      - name: Generate Broca measurement artifacts
        if: steps.cargo-lock-integrity.outcome == 'success'
        run: scripts/broca_measurement_artifacts.sh target/broca-measurements

      - name: Upload Broca measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broca-measurements-${{ github.sha }}
          path: target/broca-measurements/
          retention-days: 30
