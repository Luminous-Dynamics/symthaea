name: Broca Measurements

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-broca/**"
      - "scripts/broca_measurement_artifacts.sh"
      - "scripts/broca_capture_baseline.sh"
      - "scripts/check_cargo_lock_closure.sh"
      - "tests/shell/test-cargo-lock-closure.sh"
      - ".github/workflows/broca-measurements.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"
  BROCA_EVAL_LIMIT: "8"
  BROCA_EXERCISM_ATTEMPTS: "1"
  BROCA_MAMBA_BACKEND: "cpu"
  # Keep PR measurement jobs bounded. Full Exercism runs are intentionally
  # opt-in because CPU Mamba synthesis can take several minutes per fixture.
  BROCA_SKIP_EXERCISM: "1"

jobs:
  broca-measurements:
    name: Broca measurement artifacts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-broca-measurements-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-broca-measurements-
            ${{ runner.os }}-broca-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev cmake

      - name: Self-test Cargo lock closure diagnostics
        run: bash tests/shell/test-cargo-lock-closure.sh

      - name: Verify full workspace Cargo lock closure
        run: bash scripts/check_cargo_lock_closure.sh target/broca-lock-closure

      - name: Generate Broca measurement artifacts
        run: scripts/broca_measurement_artifacts.sh target/broca-measurements

      - name: Upload Cargo lock-closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broca-lock-closure-${{ github.sha }}
          path: target/broca-lock-closure/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Broca measurement artifacts
        uses: actions/upload-artifact@v4
        with:
          name: broca-measurements-${{ github.sha }}
          path: target/broca-measurements/
          retention-days: 30
