name: Cyber Crucible Verifier Release

on:
  push:
    tags:
      - "cyber-crucible-verifier-v*"

# The caller needs these permission ceilings because the pinned reusable workflow
# attests the artifact. Its jobs reduce permissions to the minimum they require.
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: cyber-crucible-verifier-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-and-attest:
    # Grant the reusable workflow only the permissions its isolated jobs need.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    # Security-critical: update this SHA only after review of the trusted reusable workflow.
    uses: Luminous-Dynamics/symthaea/.github/workflows/cyber-crucible-trusted-build.yml@63e41f2ff7f1a58012a1c5fed3b28d9ecaf2f131
    with:
      source_ref: ${{ github.ref }}
      source_commit: ${{ github.sha }}
