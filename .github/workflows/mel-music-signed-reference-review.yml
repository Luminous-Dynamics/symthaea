name: Melothaea signed music reference adjudication

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/music_reference_adjudication.rs"
      - "crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "tools/mel-music-edit-adapter-harness/**"
      - "benchmarks/mel/schemas/music-reference-adjudication-v1.schema.json"
      - "benchmarks/mel/registry/synthetic-music-reference-review-task-v1.json"
      - "benchmarks/mel/registry/synthetic-music-review-panel-policy-v1.json"
      - "docs/research/MEL_MR_EVAL_039_SIGNED_REFERENCE_ADJUDICATION_V1_2026-11-14.md"
      - ".github/workflows/mel-music-signed-reference-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-reference-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MEL_SIGNED_REVIEW_REVISION=$actual" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Stage standalone review harness with exact production modules
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-signed-reference-review"
          mkdir -p "$staged/src" "$staged/examples" "$staged/fixtures"
          cp tools/mel-music-edit-adapter-harness/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-music-edit-adapter-harness/src/lib.rs "$staged/src/lib.rs"
          cp crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs "$staged/src/music_edit_benchmark_adapter.rs"
          cp crates/domains/symthaea-muse/src/music_edit_validity_envelope.rs "$staged/src/music_edit_validity_envelope.rs"
          cp crates/domains/symthaea-muse/src/music_reference_adjudication.rs "$staged/src/music_reference_adjudication.rs"
          cp tools/mel-music-edit-adapter-harness/examples/validate_signed_reference_review.rs "$staged/examples/validate_signed_reference_review.rs"
          cp benchmarks/mel/registry/synthetic-music-reference-review-task-v1.json "$staged/fixtures/"
          cp benchmarks/mel/registry/synthetic-music-review-panel-policy-v1.json "$staged/fixtures/"
          echo "MEL_SIGNED_REVIEW_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format and verify staged sources
        run: |
          cargo +1.96.0 fmt --manifest-path "$MEL_SIGNED_REVIEW_MANIFEST"
          cargo +1.96.0 fmt --check --manifest-path "$MEL_SIGNED_REVIEW_MANIFEST"
      - name: Resolve standalone dependencies
        run: cargo +1.96.0 generate-lockfile --manifest-path "$MEL_SIGNED_REVIEW_MANIFEST"
      - name: Run Ed25519 review contract tests
        run: cargo +1.96.0 test --locked --manifest-path "$MEL_SIGNED_REVIEW_MANIFEST"
      - name: Validate static review task and panel policy
        run: cargo +1.96.0 run --locked --manifest-path "$MEL_SIGNED_REVIEW_MANIFEST" --example validate_signed_reference_review
      - name: Run review-contract Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path "$MEL_SIGNED_REVIEW_MANIFEST" --all-targets -- -D warnings
      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mel-signed-reference-review-evidence"
          mkdir -p "$evidence"
          sha256sum crates/domains/symthaea-muse/src/music_reference_adjudication.rs > "$evidence/production-module.sha256"
          sha256sum crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs > "$evidence/adapter-module.sha256"
          sha256sum benchmarks/mel/schemas/music-reference-adjudication-v1.schema.json > "$evidence/schema.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-reference-review-task-v1.json > "$evidence/task-fixture.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-review-panel-policy-v1.json > "$evidence/policy-fixture.sha256"
          cp "$(dirname "$MEL_SIGNED_REVIEW_MANIFEST")/Cargo.lock" "$evidence/Cargo.lock"
          sha256sum "$evidence/Cargo.lock" > "$evidence/Cargo.lock.sha256"
          printf 'exact_head=%s\n' "$MEL_SIGNED_REVIEW_REVISION" > "$evidence/source-identities.txt"
      - name: Upload exact-head review evidence
        uses: actions/upload-artifact@v4
        with:
          name: mel-signed-reference-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-signed-reference-review-evidence/
          if-no-files-found: error
          retention-days: 90
