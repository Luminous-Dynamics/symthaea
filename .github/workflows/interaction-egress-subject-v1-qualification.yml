name: Interaction Egress Subject V1 Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/interaction-egress-subject-v1-qualification.yml'
      - 'crates/core/symthaea-interaction-egress/**'
      - 'crates/core/symthaea-interaction-lineage/**'
      - 'crates/core/symthaea-interaction-core/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interaction-egress-subject-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  interaction-egress-subject-v1:
    name: Exact-head interaction egress subject v1
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact PR head and required lineage parent
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUIRED_PARENT: 7d949f1385674c252568ce4cea3fce35aac3cf20
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          fi
          git cat-file -e "${REQUIRED_PARENT}^{commit}"
          test "$(git merge-base HEAD "${REQUIRED_PARENT}")" = "${REQUIRED_PARENT}"
          git merge-base --is-ancestor "${REQUIRED_PARENT}" HEAD

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Record clean source baseline
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

      - name: Enforce pure exact-subject boundary
        run: |
          set -euo pipefail
          MANIFEST=crates/core/symthaea-interaction-egress/Cargo.toml
          SOURCE=crates/core/symthaea-interaction-egress/src/lib.rs

          grep -Fq 'symthaea-interaction-core = { path = "../symthaea-interaction-core" }' "${MANIFEST}"
          grep -Fq 'symthaea-interaction-lineage = { path = "../symthaea-interaction-lineage" }' "${MANIFEST}"
          grep -Fq 'sha2 = { workspace = true }' "${MANIFEST}"
          if grep -Eiq 'reqwest|hyper|tokio|holochain|hdk|hdi|web3|ethers|alloy|kube|rmcp|a2a|keyring|secret-service|spiffe|rego|cedar' "${MANIFEST}"; then
            echo 'runtime/protocol/policy-engine dependency leaked into pure egress subject' >&2
            exit 1
          fi

          grep -Fq 'symthaea.interaction.egress.subject.v1\0' "${SOURCE}"
          grep -Fq 'DisclosureBinding' "${SOURCE}"
          grep -Fq 'InteractionIntent' "${SOURCE}"
          grep -Fq 'policy_input_context' "${SOURCE}"
          grep -Fq 'session_context' "${SOURCE}"
          grep -Fq 'declassification_evidence' "${SOURCE}"
          grep -Fq 'subject_vector_is_stable' "${SOURCE}"
          grep -Fq 'connector_or_operation_change_invalidates_subject' "${SOURCE}"
          grep -Fq 'disclosure_destination_or_payload_change_invalidates_subject' "${SOURCE}"

          if grep -Eq 'DispatchPermit|CapabilityGrant|VerifiedAuthority|std::net|std::fs|std::process|Command::new' "${SOURCE}"; then
            echo 'authority/runtime I/O leaked into pure egress subject' >&2
            exit 1
          fi
          if grep -Eq 'pub[[:space:]]+enum[[:space:]]+(PolicyDecision|EgressDecision)|AllowCandidate|NeedsConfirmation|NeedsPreflight' "${SOURCE}"; then
            echo 'policy outcome ownership leaked from INTX-013 into INTX-010A subject crate' >&2
            exit 1
          fi

      - name: Independent egress subject oracle
        run: |
          set -euo pipefail
          python3 crates/core/symthaea-interaction-egress/scripts/egress_subject_oracle.py

      - name: Format
        run: |
          set -euo pipefail
          cargo fmt -p symthaea-interaction-egress -- --check

      - name: Resolve candidate and execute focused gates
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check -p symthaea-interaction-egress --all-targets
          cargo test -p symthaea-interaction-egress
          cargo clippy -p symthaea-interaction-egress --all-targets -- -D warnings
          if ! cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock requires committed reconciliation:' >&2
            diff -u /tmp/Cargo.lock.before Cargo.lock || true
            exit 1
          fi

      - name: Locked replay
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-interaction-egress --all-targets
          cargo test --locked -p symthaea-interaction-egress
          cargo clippy --locked -p symthaea-interaction-egress --all-targets -- -D warnings

      - name: Prove qualification did not mutate source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
