name: Query-conditioned connectome proofreading stopping contract

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "docs/neuroscience/CONNECTOME_QUERY_CONDITIONED_STOPPING_BENCHMARK_V1.md"
      - "docs/neuroscience/CONNECTOME_QUERY_CONDITIONED_STOPPING.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_QUERY_CONDITIONED_STOPPING.example.json"
      - "tools/connectomics-intake-audit/reference/verify_query_conditioned_stopping.py"
      - ".github/workflows/connectome-query-conditioned-stopping.yml"
  push:
    branches: [main, "research/**"]
    paths:
      - "docs/neuroscience/CONNECTOME_QUERY_CONDITIONED_STOPPING_BENCHMARK_V1.md"
      - "docs/neuroscience/CONNECTOME_QUERY_CONDITIONED_STOPPING.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_QUERY_CONDITIONED_STOPPING.example.json"
      - "tools/connectomics-intake-audit/reference/verify_query_conditioned_stopping.py"
      - ".github/workflows/connectome-query-conditioned-stopping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-query-conditioned-stopping:
    name: Validate global-versus-query stopping semantics
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate strict Draft 2020-12 schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("docs/neuroscience/CONNECTOME_QUERY_CONDITIONED_STOPPING.schema.json").read_text())
          fixture = json.loads(Path("docs/neuroscience/examples/CONNECTOME_QUERY_CONDITIONED_STOPPING.example.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(fixture)
          print("query-conditioned stopping schema: PASS")
          PY
      - name: Run independent stopping oracle and negative controls
        run: |
          python3 -m py_compile tools/connectomics-intake-audit/reference/verify_query_conditioned_stopping.py
          python3 tools/connectomics-intake-audit/reference/verify_query_conditioned_stopping.py \
            --manifest docs/neuroscience/examples/CONNECTOME_QUERY_CONDITIONED_STOPPING.example.json \
            --self-test
