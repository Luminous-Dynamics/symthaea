name: Muse EVAL-017 Support Policy

on:
  push:
    branches:
      - "research/muse-eval-017-support-policy-*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "crates/domains/symthaea-muse/src/counterfactual_influence.rs"
      - "crates/domains/symthaea-muse/MEL-MR-EVAL-017_COUNTERFACTUAL_INFLUENCE.md"
      - ".github/workflows/muse-eval-017-support-policy.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "crates/domains/symthaea-muse/src/counterfactual_influence.rs"
      - "crates/domains/symthaea-muse/MEL-MR-EVAL-017_COUNTERFACTUAL_INFLUENCE.md"
      - ".github/workflows/muse-eval-017-support-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-eval-017-support-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: exact-head-eval-017-support-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'exact_head=%s\n' "$actual"

      - name: Verify Cargo workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/muse-workspace-metadata.json

      - name: Check Muse formatting
        run: rustfmt --edition 2024 --check crates/domains/symthaea-muse/src/counterfactual_influence.rs

      - name: Run EVAL-017 influence and support-policy tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib counterfactual_influence::tests

      - name: Run Clippy for EVAL-017 library/test target
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib --tests -- -D warnings
