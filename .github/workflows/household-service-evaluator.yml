name: Household Service Evaluator

on:
  push:
    branches:
      - research/household-service-evaluator-v0.1-stacked-10388
  pull_request:
    paths:
      - "tools/household-service-evaluator/**"
      - "docs/research/household-services/fixtures/**"
      - ".github/workflows/household-service-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: household-service-evaluator-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  evaluator:
    name: Household Service Evaluator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/household-service-evaluator/Cargo.toml -- --check

      - name: Resolve canonical lockfile for receipt dependency (temporary bootstrap)
        run: |
          cargo generate-lockfile --manifest-path tools/household-service-evaluator/Cargo.toml
          mkdir -p target
          cp tools/household-service-evaluator/Cargo.lock target/household-service-evaluator-Cargo.lock

      - name: Upload canonical lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: household-service-evaluator-lock-\${{ github.sha }}
          path: target/household-service-evaluator-Cargo.lock
          if-no-files-found: error

      - name: Run deterministic evaluator tests
        run: cargo test --locked --manifest-path tools/household-service-evaluator/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/household-service-evaluator/Cargo.toml --all-targets -- -D warnings

      - name: Run all 20 synthetic household scenarios
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p target
          cargo run --locked --manifest-path tools/household-service-evaluator/Cargo.toml -- \
            --water docs/research/household-services/fixtures/water-continuity-scenarios-v0.1.json \
            --repair docs/research/household-services/fixtures/repairability-scenarios-v0.1.json \
            --source-commit "${SOURCE_COMMIT}" \
            --output target/household-service-batch-report.json

      - name: Upload synthetic batch report
        uses: actions/upload-artifact@v4
        with:
          name: household-service-batch-report-${{ github.sha }}
          path: target/household-service-batch-report.json
          if-no-files-found: error
