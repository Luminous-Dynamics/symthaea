name: Subterra Robust Survival Referee

on:
  pull_request:
    paths:
      - 'crates/domains/symthaea-subterranean/research/subterra-robust-survival-referee/**'
      - 'crates/domains/symthaea-subterranean/research/subterra-survival-planner/**'
      - '.github/workflows/subterra-robust-survival-referee.yml'
  push:
    branches:
      - 'research/subterra-robust-survival-referee-v0-1'
    paths:
      - 'crates/domains/symthaea-subterranean/research/subterra-robust-survival-referee/**'
      - 'crates/domains/symthaea-subterranean/research/subterra-survival-planner/**'
      - '.github/workflows/subterra-robust-survival-referee.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Format, tests and strict Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      # Temporary normalization: apply rustfmt in the runner and commit the
      # mechanical result back to this first-party research branch. The final
      # workflow returns to a non-mutating format --check gate after this pass.
      - name: Normalize referee source
        run: cargo fmt --manifest-path crates/domains/symthaea-subterranean/research/subterra-robust-survival-referee/Cargo.toml

      - name: Commit formatter output to the research branch
        if: github.event_name != 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- crates/domains/symthaea-subterranean/research/subterra-robust-survival-referee/src/lib.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/domains/symthaea-subterranean/research/subterra-robust-survival-referee/src/lib.rs
            git commit -m 'style(subterra): rustfmt robust survival policy referee'
            git push origin HEAD:refs/heads/research/subterra-robust-survival-referee-v0-1
          fi

      - name: Confirm normalized formatting
        run: cargo fmt --manifest-path crates/domains/symthaea-subterranean/research/subterra-robust-survival-referee/Cargo.toml -- --check

      - name: Run referee tests
        run: cargo test --manifest-path crates/domains/symthaea-subterranean/research/subterra-robust-survival-referee/Cargo.toml --all-targets

      - name: Strict Clippy
        run: cargo clippy --manifest-path crates/domains/symthaea-subterranean/research/subterra-robust-survival-referee/Cargo.toml --all-targets -- -D warnings

      - name: Preserve claim ceiling
        if: always()
        run: echo 'A PASS applies only to the standalone finite-model referee tests; it is not physical, analogue, flight or planetary qualification.'