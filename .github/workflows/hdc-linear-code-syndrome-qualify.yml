          workflow_definition_match=${{ steps.head.outputs.workflow_definition_match }}
          live_run_pr_count=${{ steps.head.outputs.live_run_pr_count }}
          live_run_pr_number=${{ steps.head.outputs.live_run_pr_number }}
          live_run_pr_head_sha=${{ steps.head.outputs.live_run_pr_head_sha }}
          live_run_pr_head_repo_id=${{ steps.head.outputs.live_run_pr_head_repo_id }}
          live_run_pr_base_sha=${{ steps.head.outputs.live_run_pr_base_sha }}
          live_run_pr_base_repo_id=${{ steps.head.outputs.live_run_pr_base_repo_id }}
          event_base_sha=${{ steps.head.outputs.event_base_sha }}
          ancestry_status=${{ steps.head.outputs.ancestry_status }}
          stack_distance=${{ steps.head.outputs.stack_distance }}
          stack_behind=${{ steps.head.outputs.stack_behind }}
          compare_merge_base_sha=${{ steps.head.outputs.compare_merge_base_sha }}
          research_surface_status=${{ steps.scope.outcome }}
          research_surface_paths=${{ steps.scope.outputs.changed_paths }}
          rust_toolchain=1.96.1
          rust_toolchain_installation_status=${{ steps.toolchain_install.outcome }}
          rust_toolchain_verification_status=${{ steps.toolchain.outcome }}
          format_status=${{ steps.format.outcome }}
          harness_status=${{ steps.harness.outcome }}
          unit_tests_status=${{ steps.unit_tests.outcome }}
          inherited_ambiguity_status=${{ steps.inherited_tests.outcome }}
          syndrome_decoder_status=${{ steps.decoder_tests.outcome }}
          strict_clippy_status=${{ steps.clippy.outcome }}
          dependency_lock_sha256=${{ steps.harness.outputs.lock_sha256 }}
          syndrome_oracle_linearity_status=${{ steps.syndrome_oracle.outcome }}
          syndrome_oracle_linearity=${{ steps.syndrome_oracle.outputs.syndrome_oracle_linearity }}
          syndrome_coset_ledger_status=${{ steps.coset_invariants.outcome }}
          brute_force_dual_space_status=${{ steps.brute_force_dual_space.outcome }}
          brute_force_dual_space=${{ steps.brute_force_dual_space.outputs.brute_force_dual_space }}
          fixed_syndrome_spec_status=${{ steps.fixed_syndrome_spec.outcome }}
          quotient_metric_status=${{ steps.quotient_metric.outcome }}
          syndrome_quotient_metric=${{ steps.quotient_metric.outputs.syndrome_quotient_metric }}
          quotient_spectrum_status=${{ steps.quotient_spectrum.outcome }}
          syndrome_quotient_spectrum=${{ steps.quotient_spectrum.outputs.syndrome_quotient_spectrum }}
          syndrome_spectrum_adversary_status=${{ steps.spectrum_adversary.outcome }}
          syndrome_spectrum_adversary=${{ steps.spectrum_adversary.outputs.syndrome_spectrum_adversary }}
          coordinate_permutation_equivariance_status=${{ steps.coordinate_permutation.outcome }}
          coordinate_permutation_equivariance=${{ steps.coordinate_permutation.outputs.coordinate_permutation_equivariance }}
          generator_basis_equivariance_status=${{ steps.generator_basis_equivariance.outcome }}
          generator_basis_equivariance=${{ steps.generator_basis_equivariance.outputs.generator_basis_equivariance }}
          composed_metamorphic_status=${{ steps.composed_metamorphic.outcome }}
          composed_metamorphic_equivariance=${{ steps.composed_metamorphic.outputs.composed_metamorphic_equivariance }}
          syndrome_fiber_difference_status=${{ steps.fiber_difference.outcome }}
          syndrome_fiber_difference=${{ steps.fiber_difference.outputs.syndrome_fiber_difference }}
          walsh_dual_fiber_status=${{ steps.walsh_dual_fiber.outcome }}
          walsh_dual_fiber=${{ steps.walsh_dual_fiber.outputs.walsh_dual_fiber }}
          fixed_syndrome_spec=${{ steps.fixed_syndrome_spec.outputs.fixed_syndrome_spec }}
          syndrome_coset_ledger=${{ steps.coset_invariants.outputs.syndrome_coset_ledger }}
          minimum_syndrome_multiplicity_status=${{ steps.multiplicity_invariant.outcome }}
          minimum_syndrome_multiplicity_ledger=${{ steps.multiplicity_invariant.outputs.minimum_syndrome_multiplicity_ledger }}
          factor_syndrome_separation_status=${{ steps.factor_separation.outcome }}
          factor_syndrome_separation=${{ steps.factor_separation.outputs.factor_syndrome_separation }}
          minimum_syndrome_list_capture_status=${{ steps.minimum_list_capture.outcome }}
          minimum_syndrome_list_capture=${{ steps.minimum_list_capture.outputs.minimum_syndrome_list_capture }}
          random_list_oracle_status=${{ steps.random_list_oracle.outcome }}
          random_list_oracle=${{ steps.random_list_oracle.outputs.random_list_oracle }}
          syndrome_decoder_ledger_status=${{ steps.decoder_ledger.outcome }}
          runner_os=${{ steps.runner.outputs.runner_os }}
          runner_arch=${{ steps.runner.outputs.runner_arch }}
          runner_image=${{ steps.runner.outputs.runner_image }}
          runner_image_version=${{ steps.runner.outputs.runner_image_version }}
          workflow_definition_status=${{ steps.head.outputs.workflow_definition_match == 'true' && 'matched' || 'mismatch' }}
          artifact_refetch_status=${{ steps.artifact_revalidate.outcome }}
          artifact_refetch_match=${{ steps.artifact_revalidate.outputs.artifact_refetch_match }}
          artifact_refetch_digest=${{ steps.artifact_revalidate.outputs.artifact_refetch_digest }}
          artifact_refetch_head_sha=${{ steps.artifact_revalidate.outputs.artifact_refetch_head_sha }}
          artifact_refetch_expected_merge_sha=${{ steps.artifact_revalidate.outputs.artifact_refetch_expected_merge_sha }}
          artifact_refetch_pr_head_sha=${{ steps.artifact_revalidate.outputs.artifact_refetch_pr_head_sha }}
          qualification_status_pre_artifact=${{ steps.head.outcome == 'success' && steps.scope.outcome == 'success' && steps.generator_basis_equivariance.outcome == 'success' && steps.composed_metamorphic.outcome == 'success' && steps.toolchain_install.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.provenance.outcome == 'success' && steps.format.outcome == 'success' && steps.harness.outcome == 'success' && steps.syndrome_oracle.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.inherited_tests.outcome == 'success' && steps.decoder_tests.outcome == 'success' && steps.brute_force_dual_space.outcome == 'success' && steps.fixed_syndrome_spec.outcome == 'success' && steps.quotient_metric.outcome == 'success' && steps.quotient_spectrum.outcome == 'success' && steps.spectrum_adversary.outcome == 'success' && steps.coordinate_permutation.outcome == 'success' && steps.fiber_difference.outcome == 'success' && steps.walsh_dual_fiber.outcome == 'success' && steps.coset_invariants.outcome == 'success' && steps.multiplicity_invariant.outcome == 'success' && steps.factor_separation.outcome == 'success' && steps.minimum_list_capture.outcome == 'success' && steps.random_list_oracle.outcome == 'success' && steps.decoder_ledger.outcome == 'success' && steps.random_sweep.outcome == 'success' && steps.beyond_radius.outcome == 'success' && steps.clippy.outcome == 'success' && 'passed' || 'failed' }}
          syndrome_decoder_ledger=${{ steps.decoder_ledger.outputs.syndrome_decoder_ledger }}
          random_syndrome_sweep_status=${{ steps.random_sweep.outcome }}
          random_syndrome_sweep=${{ steps.random_sweep.outputs.random_syndrome_sweep }}
          beyond_radius_status=${{ steps.beyond_radius.outcome }}
          beyond_radius_ledger=${{ steps.beyond_radius.outputs.beyond_radius_ledger }}
          artifact_revalidation_deferred=true
          EOF

      - name: Upload qualification receipt
        id: upload_receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hdc-linear-code-bounded-decoder-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: hdc-linear-code-evidence
          if-no-files-found: error

      - name: Revalidate uploaded artifact provenance
        id: artifact_revalidate
        if: always() && steps.upload_receipt.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_HEAD: ${{ steps.head.outputs.sha }}
          EXPECTED_MERGE_SHA: ${{ steps.head.outputs.synthetic_merge_sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload_receipt.outputs.artifact-id }}
          EXPECTED_NAME: hdc-linear-code-bounded-decoder-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          EXPECTED_REPO_ID: 1136141775
        run: |
          test -n "$ARTIFACT_ID"
          ARTIFACT_JSON="$(gh api --method GET -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          REFETCH_ID="$(printf "%s" "$ARTIFACT_JSON" | jq -r ".id")"
          REFETCH_NAME="$(printf "%s" "$ARTIFACT_JSON" | jq -r ".name")"
          REFETCH_REPO_ID="$(printf "%s" "$ARTIFACT_JSON" | jq -r ".workflow_run.repository_id")"
          REFETCH_RUN_ID="$(printf "%s" "$ARTIFACT_JSON" | jq -r ".workflow_run.id")"
          REFETCH_HEAD_SHA="$(printf "%s" "$ARTIFACT_JSON" | jq -r ".workflow_run.head_sha")"
          REFETCH_HEAD_REPO_ID="$(printf "%s" "$ARTIFACT_JSON" | jq -r ".workflow_run.head_repository_id")"
          REFETCH_DIGEST="$(printf "%s" "$ARTIFACT_JSON" | jq -r ".digest")"
          test "$REFETCH_ID" = "$ARTIFACT_ID"
          test "$REFETCH_NAME" = "$EXPECTED_NAME"
          test "$REFETCH_REPO_ID" = "$EXPECTED_REPO_ID"
          test "$REFETCH_RUN_ID" = "$RUN_ID"
          test "$REFETCH_HEAD_SHA" = "$EXPECTED_MERGE_SHA"
          test "$REFETCH_HEAD_REPO_ID" = "$EXPECTED_REPO_ID"
          test "$EXACT_HEAD" != "$EXPECTED_MERGE_SHA"
          test -n "$REFETCH_DIGEST"
          echo "artifact_refetch_id=$REFETCH_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_refetch_name=$REFETCH_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_refetch_repo_id=$REFETCH_REPO_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_refetch_run_id=$REFETCH_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_refetch_head_sha=$REFETCH_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_refetch_expected_merge_sha=$EXPECTED_MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_refetch_pr_head_sha=$EXACT_HEAD" >> "$GITHUB_OUTPUT"
          echo "artifact_refetch_head_repo_id=$REFETCH_HEAD_REPO_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_refetch_digest=$REFETCH_DIGEST" >> "$GITHUB_OUTPUT"
          echo "artifact_refetch_match=true" >> "$GITHUB_OUTPUT"
      - name: Publish artifact provenance summary
        if: always() && steps.upload_receipt.outcome == 'success'
        env:
          EXACT_HEAD: ${{ steps.head.outputs.sha }}
          PARENT_HEAD: ${{ steps.head.outputs.parent_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ARTIFACT_ID: ${{ steps.upload_receipt.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_receipt.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_receipt.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_URL"
          test -n "$ARTIFACT_DIGEST"
          {
            echo "## HDC qualification artifact provenance"
            echo "- exact_head: \`$EXACT_HEAD\`"
            echo "- parent_head: \`$PARENT_HEAD\`"
            echo "- github.run_id: \`$RUN_ID\`"
            echo "- github.run_attempt: \`$RUN_ATTEMPT\`"
            echo "- github.workflow_sha: \`$WORKFLOW_SHA\`"
            echo "- github.workflow_ref: \`$WORKFLOW_REF\`"
            echo "- artifact_id: \`$ARTIFACT_ID\`"
            echo "- artifact_digest: \`$ARTIFACT_DIGEST\`"
            echo "- artifact_url: $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
