name: HDC Linear-Code Bounded Decoder Qualification

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - "research/hdc-linear-code-recovery-design-v1"

concurrency:
  group: hdc-linear-code-bounded-decoder-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  qualify:
    name: Exact-head bounded syndrome qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout exact research head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Record exact research head and parent
        id: head
        env:
          EVENT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          EVENT_HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          EVENT_HEAD_REPO_ID: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id || github.repository_id }}
          EVENT_REPO_ID: ${{ github.event.repository.id }}
          CURRENT_REPO_ID: ${{ github.repository_id }}
          EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          SYNTHETIC_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          PARENT_SHA="164d6b94d12bb72a902bdc2164d25cd540d3ba7f"
          gh auth setup-git
          git fetch --no-tags --depth=1 origin "$PARENT_SHA"
          test -n "$EVENT_HEAD_SHA"
          test "$EVENT_HEAD_REF" = "research/hdc-linear-code-bounded-decoder-v2"
          test "$EVENT_HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "Luminous-Dynamics/symthaea"
          test "$CURRENT_REPO_ID" = "1136141775"
          test "$EVENT_REPO_ID" = "$CURRENT_REPO_ID"
          test "$EVENT_HEAD_REPO_ID" = "$CURRENT_REPO_ID"
          LIVE_RUN_JSON="$(gh api --method GET -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          LIVE_RUN_REPO_ID="$(printf '%s' "$LIVE_RUN_JSON" | jq -r '.repository.id')"
          LIVE_RUN_HEAD_SHA="$(printf '%s' "$LIVE_RUN_JSON" | jq -r '.head_sha')"
          LIVE_RUN_HEAD_REF="$(printf '%s' "$LIVE_RUN_JSON" | jq -r '.head_branch')"
          LIVE_RUN_WORKFLOW_ID="$(printf '%s' "$LIVE_RUN_JSON" | jq -r '.workflow_id')"
          LIVE_RUN_WORKFLOW_PATH="$(printf '%s' "$LIVE_RUN_JSON" | jq -r '.path')"
          LIVE_RUN_WORKFLOW_NAME="$(printf '%s' "$LIVE_RUN_JSON" | jq -r '.name')"
          LIVE_RUN_EVENT="$(printf '%s' "$LIVE_RUN_JSON" | jq -r '.event')"
          LIVE_RUN_PR_COUNT="$(printf '%s' "$LIVE_RUN_JSON" | jq -r '.pull_requests | length')"
          LIVE_RUN_PR_NUMBER="$(printf '%s' "$LIVE_RUN_JSON" | jq -r 'if (.pull_requests | length) == 1 then .pull_requests[0].number else 0 end')"
          LIVE_RUN_PR_HEAD_SHA="$(printf '%s' "$LIVE_RUN_JSON" | jq -r 'if (.pull_requests | length) == 1 then .pull_requests[0].head.sha else "" end')"
          LIVE_RUN_PR_HEAD_REPO_ID="$(printf '%s' "$LIVE_RUN_JSON" | jq -r 'if (.pull_requests | length) == 1 then .pull_requests[0].head.repo.id else 0 end')"
          LIVE_RUN_PR_HEAD_REPO_NAME="$(printf '%s' "$LIVE_RUN_JSON" | jq -r 'if (.pull_requests | length) == 1 then .pull_requests[0].head.repo.full_name else "" end')"
          LIVE_RUN_PR_BASE_SHA="$(printf '%s' "$LIVE_RUN_JSON" | jq -r 'if (.pull_requests | length) == 1 then .pull_requests[0].base.sha else "" end')"
          LIVE_RUN_PR_BASE_REPO_ID="$(printf '%s' "$LIVE_RUN_JSON" | jq -r 'if (.pull_requests | length) == 1 then .pull_requests[0].base.repo.id else 0 end')"
          LIVE_RUN_PR_BASE_REPO_NAME="$(printf '%s' "$LIVE_RUN_JSON" | jq -r 'if (.pull_requests | length) == 1 then .pull_requests[0].base.repo.full_name else "" end')"
          test "$LIVE_RUN_REPO_ID" = "$CURRENT_REPO_ID"
          test "$LIVE_RUN_HEAD_REF" = "$EVENT_HEAD_REF"
          test "$LIVE_RUN_WORKFLOW_ID" = "375128913"
          test "$LIVE_RUN_WORKFLOW_PATH" = ".github/workflows/hdc-linear-code-syndrome-qualify.yml"
          test "$LIVE_RUN_WORKFLOW_NAME" = "HDC Linear-Code Bounded Decoder Qualification"
          test "$LIVE_RUN_EVENT" = "$GITHUB_EVENT_NAME"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test -n "$SYNTHETIC_MERGE_SHA"
          test "$LIVE_RUN_HEAD_SHA" = "$SYNTHETIC_MERGE_SHA"
          test -n "$GITHUB_WORKFLOW_SHA"
          WORKFLOW_PATH=".github/workflows/hdc-linear-code-syndrome-qualify.yml"
          CHECKED_OUT_WORKFLOW_SHA256="$(sha256sum "$WORKFLOW_PATH" | cut -d" " -f1)"
          EXECUTED_WORKFLOW_SHA256="$(gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}?ref=${GITHUB_WORKFLOW_SHA}" \
            --jq '.content' | tr -d '\n' | base64 --decode | sha256sum | cut -d" " -f1)"
          test "$EXECUTED_WORKFLOW_SHA256" = "$CHECKED_OUT_WORKFLOW_SHA256"
          if test "$GITHUB_EVENT_NAME" = "pull_request"; then
            test "$LIVE_RUN_PR_COUNT" -eq 1
            test "$LIVE_RUN_PR_NUMBER" = "$GITHUB_EVENT_NUMBER"
            test "$LIVE_RUN_PR_HEAD_SHA" = "$EVENT_HEAD_SHA"
            test "$LIVE_RUN_PR_HEAD_REPO_ID" = "$EVENT_HEAD_REPO_ID"
            test "$LIVE_RUN_PR_HEAD_REPO_NAME" = "$EVENT_HEAD_REPO"
            test "$LIVE_RUN_PR_BASE_SHA" = "$EVENT_BASE_SHA"
            test "$LIVE_RUN_PR_BASE_REPO_ID" = "$CURRENT_REPO_ID"
            test "$LIVE_RUN_PR_BASE_REPO_NAME" = "$GITHUB_REPOSITORY"
          fi
          test "$ACTUAL_SHA" = "$EVENT_HEAD_SHA"
          git cat-file -e "${PARENT_SHA}^{commit}"
          COMPARE_JSON="$(gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/compare/${PARENT_SHA}...${ACTUAL_SHA}")"
          COMPARE_STATUS="$(printf '%s' "$COMPARE_JSON" | jq -r '.status')"
          COMPARE_AHEAD_BY="$(printf '%s' "$COMPARE_JSON" | jq -r '.ahead_by')"
          COMPARE_BEHIND_BY="$(printf '%s' "$COMPARE_JSON" | jq -r '.behind_by')"
          COMPARE_MERGE_BASE_SHA="$(printf '%s' "$COMPARE_JSON" | jq -r '.merge_base_commit.sha')"
          if test -n "$EVENT_BASE_SHA"; then
            test "$EVENT_BASE_SHA" = "$PARENT_SHA"
          fi
          test "$COMPARE_STATUS" = "ahead"
          test "$COMPARE_AHEAD_BY" -gt 0
          test "$COMPARE_BEHIND_BY" -eq 0
          test "$COMPARE_MERGE_BASE_SHA" = "$PARENT_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$PARENT_SHA" >> "$GITHUB_OUTPUT"
          echo "source_ref=$EVENT_HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "source_repo=$EVENT_HEAD_REPO" >> "$GITHUB_OUTPUT"
          echo "event_base_sha=$EVENT_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_repo_id=$EVENT_HEAD_REPO_ID" >> "$GITHUB_OUTPUT"
          echo "event_repo_id=$EVENT_REPO_ID" >> "$GITHUB_OUTPUT"
          echo "current_repo_id=$CURRENT_REPO_ID" >> "$GITHUB_OUTPUT"
          echo "live_run_repo_id=$LIVE_RUN_REPO_ID" >> "$GITHUB_OUTPUT"
          echo "live_run_head_sha=$LIVE_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "live_run_head_ref=$LIVE_RUN_HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "live_run_head_is_synthetic_merge=true" >> "$GITHUB_OUTPUT"
          echo "live_run_workflow_id=$LIVE_RUN_WORKFLOW_ID" >> "$GITHUB_OUTPUT"
          echo "live_run_workflow_path=$LIVE_RUN_WORKFLOW_PATH" >> "$GITHUB_OUTPUT"
          echo "live_run_workflow_name=$LIVE_RUN_WORKFLOW_NAME" >> "$GITHUB_OUTPUT"
          echo "live_run_event=$LIVE_RUN_EVENT" >> "$GITHUB_OUTPUT"
          echo "live_run_pr_head_repo_name=$LIVE_RUN_PR_HEAD_REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "live_run_pr_base_repo_name=$LIVE_RUN_PR_BASE_REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$GITHUB_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "workflow_ref=$GITHUB_WORKFLOW_REF" >> "$GITHUB_OUTPUT"
          echo "workflow_file_sha256=$CHECKED_OUT_WORKFLOW_SHA256" >> "$GITHUB_OUTPUT"
          echo "executed_workflow_file_sha256=$EXECUTED_WORKFLOW_SHA256" >> "$GITHUB_OUTPUT"
          echo "workflow_definition_match=true" >> "$GITHUB_OUTPUT"
          echo "live_run_pr_count=$LIVE_RUN_PR_COUNT" >> "$GITHUB_OUTPUT"
          echo "live_run_pr_number=$LIVE_RUN_PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "live_run_pr_head_sha=$LIVE_RUN_PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "live_run_pr_head_repo_id=$LIVE_RUN_PR_HEAD_REPO_ID" >> "$GITHUB_OUTPUT"
          echo "live_run_pr_base_sha=$LIVE_RUN_PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "live_run_pr_base_repo_id=$LIVE_RUN_PR_BASE_REPO_ID" >> "$GITHUB_OUTPUT"
          echo "ancestry_status=$COMPARE_STATUS" >> "$GITHUB_OUTPUT"
          echo "stack_distance=$COMPARE_AHEAD_BY" >> "$GITHUB_OUTPUT"
          echo "stack_behind=$COMPARE_BEHIND_BY" >> "$GITHUB_OUTPUT"
          echo "compare_merge_base_sha=$COMPARE_MERGE_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "synthetic_merge_sha=$SYNTHETIC_MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Enforce stacked research surface
        id: scope
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          PARENT_SHA: ${{ steps.head.outputs.parent_sha }}
        run: |
          EXPECTED_PATHS="$RUNNER_TEMP/hdc-linear-code-bounded-decoder-expected-paths"
          CHANGED_PATHS="$RUNNER_TEMP/hdc-linear-code-bounded-decoder-changed-paths"
          cat > "$EXPECTED_PATHS" <<'EOF'
          .github/workflows/hdc-linear-code-syndrome-qualify.yml
          crates/core/symthaea-core/src/hdc/mod.rs
          crates/core/symthaea-core/src/hdc/syndrome_decoder.rs
          crates/core/symthaea-core/tests/linear_code_syndrome_decoder.rs
          docs/research/HDC_LINEAR_CODE_BOUNDED_DECODER.md
          EOF
          sort -u "$EXPECTED_PATHS" -o "$EXPECTED_PATHS"
          git diff --name-only "$PARENT_SHA" "$HEAD_SHA" | sort -u > "$CHANGED_PATHS"
          diff -u "$EXPECTED_PATHS" "$CHANGED_PATHS"
          test "$(wc -l < "$CHANGED_PATHS" | tr -d ' ')" -eq 5
          printf "parent_head_sha=%s\n" "$PARENT_SHA" >> "$GITHUB_OUTPUT"
          printf "stacked_head_sha=%s\n" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf "changed_paths=" >> "$GITHUB_OUTPUT"
          paste -sd "|" "$CHANGED_PATHS" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        id: toolchain_install
        run: |
          rustup toolchain install 1.96.1 --component rustfmt --component clippy --profile minimal --no-self-update

      - name: Verify pinned Rust toolchain
        id: toolchain
        run: |
          test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"
          test "$(cargo +1.96.1 --version | awk '{print $2}')" = "1.96.1"

      - name: Capture runner provenance
        id: runner
        run: |
          echo "runner_os=$RUNNER_OS" >> "$GITHUB_OUTPUT"
          echo "runner_arch=$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
          echo "runner_image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "runner_image_version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Capture source provenance
        id: provenance
        run: |
          sha256sum \
            crates/core/symthaea-core/src/hdc/linear_code.rs \
            crates/core/symthaea-core/src/hdc/syndrome_decoder.rs \
            crates/core/symthaea-core/src/hdc/mod.rs \
            crates/core/symthaea-core/tests/linear_code_syndrome_decoder.rs \
            crates/core/symthaea-core/tests/linear_code_ambiguity.rs \
            .github/workflows/hdc-linear-code-syndrome-qualify.yml \
            docs/research/HDC_LINEAR_CODE_BOUNDED_DECODER.md \
            > "$RUNNER_TEMP/source-sha256.txt"
          mkdir -p hdc-linear-code-evidence
          cp "$RUNNER_TEMP/source-sha256.txt" hdc-linear-code-evidence/source-sha256.txt

      - name: Focused formatting
        id: format
        run: |
          rustfmt +1.96.1 --check --edition 2024 \
            crates/core/symthaea-core/src/hdc/syndrome_decoder.rs \
            crates/core/symthaea-core/tests/linear_code_syndrome_decoder.rs
          grep -Eq "^[[:space:]]*pub mod syndrome_decoder;" \
            crates/core/symthaea-core/src/hdc/mod.rs

      - name: Build isolated stacked harness
        id: harness
        run: |
          HARNESS="$RUNNER_TEMP/hdc-linear-code-bounded-decoder"
          rm -rf "$HARNESS"
          mkdir -p "$HARNESS/src" "$HARNESS/tests"

          cat > "$HARNESS/Cargo.toml" <<'EOF'
          [package]
          name = "symthaea-core"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [lib]
          path = "src/lib.rs"

          [dependencies]
          rand = "=0.8.6"
          rand_chacha = "=0.3.1"
          blake3 = "=1.8.2"
          EOF

          cat > "$HARNESS/src/lib.rs" <<EOF
          pub mod hdc {
              #[path = "${GITHUB_WORKSPACE}/crates/core/symthaea-core/src/hdc/linear_code.rs"]
              pub mod linear_code;
              #[path = "${GITHUB_WORKSPACE}/crates/core/symthaea-core/src/hdc/syndrome_decoder.rs"]
              pub mod syndrome_decoder;
          }
          EOF

          cp "$GITHUB_WORKSPACE/crates/core/symthaea-core/tests/linear_code_ambiguity.rs" \
            "$HARNESS/tests/linear_code_ambiguity.rs"
          cp "$GITHUB_WORKSPACE/crates/core/symthaea-core/tests/linear_code_syndrome_decoder.rs" \
            "$HARNESS/tests/linear_code_syndrome_decoder.rs"

          cargo +1.96.1 generate-lockfile --manifest-path "$HARNESS/Cargo.toml"
          LOCK_SHA256="$(sha256sum "$HARNESS/Cargo.lock" | cut -d" " -f1)"
          echo "path=$HARNESS" >> "$GITHUB_OUTPUT"
          echo "lock_sha256=$LOCK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Existing linear-code unit suite
        id: unit_tests
        run: |
          cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --lib linear_code

      - name: Existing ambiguity qualification
        id: inherited_tests
        run: |
          cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_ambiguity

      - name: Independent syndrome decoder qualification
        id: decoder_tests
        run: |
          cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder

      - name: Capture brute-force dual-space oracle
        id: brute_force_dual_space
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            random_code_production_parity_check_rows_match_bruteforce_dual_space -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^BRUTE_FORCE_DUAL_SPACE_ORACLE=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^BRUTE_FORCE_DUAL_SPACE_ORACLE=//p')"
          test -n "$LEDGER"
          printf "brute_force_dual_space=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture fixed syndrome specification oracle
        id: fixed_syndrome_spec
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            small_fixture_fixed_parity_check_spec_agrees_with_all_syndrome_oracles -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^FIXED_SYNDROME_SPEC=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^FIXED_SYNDROME_SPEC=//p')"
          test -n "$LEDGER"
          printf "fixed_syndrome_spec=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"
      - name: Capture syndrome quotient metric ledger
        id: quotient_metric
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            small_fixture_quotient_metric_matches_ambient_coset_geometry -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^SYNDROME_QUOTIENT_METRIC=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SYNDROME_QUOTIENT_METRIC=//p')"
          test -n "$LEDGER"
          printf "syndrome_quotient_metric=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture full syndrome quotient distance spectrum
        id: quotient_spectrum
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            small_fixture_full_coset_distance_spectrum_is_syndrome_difference_invariant -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^SYNDROME_QUOTIENT_SPECTRUM=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SYNDROME_QUOTIENT_SPECTRUM=//p')"
          test -n "$LEDGER"
          printf "syndrome_quotient_spectrum=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture executable spectrum-label blind-spot adversary
        id: spectrum_adversary
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            small_fixture_spectrum_adversary_demonstrates_nonadditive_label_blind_spot -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^SYNDROME_SPECTRUM_ADVERSARY=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SYNDROME_SPECTRUM_ADVERSARY=//p')"
          test -n "$LEDGER"
          printf "syndrome_spectrum_adversary=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture exact syndrome fiber difference closure
        id: fiber_difference
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            small_fixture_exact_fiber_difference_identity_holds_for_every_anchor -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^SYNDROME_FIBER_DIFFERENCE=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SYNDROME_FIBER_DIFFERENCE=//p')"
          test -n "$LEDGER"
          printf "syndrome_fiber_difference=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture Walsh dual-fiber structure
        id: walsh_dual_fiber
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            small_fixture_walsh_fibers_have_exact_dual_support_and_parseval -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^WALSH_DUAL_FIBER=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^WALSH_DUAL_FIBER=//p')"
          test -n "$LEDGER"
          printf "walsh_dual_fiber=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture syndrome/coset invariant ledger
        id: coset_invariants
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            small_fixture_kernel_equals_code_and_syndrome_cosets_are_exact -- --nocapture 2>&1)"
          LEDGER_COUNT="$(printf '%s\\n' "$OUTPUT" | grep -c '^SYNDROME_COSET_LEDGER=')"
          test "$LEDGER_COUNT" -eq 1
          LEDGER="$(printf '%s\\n' "$OUTPUT" | sed -n 's/^SYNDROME_COSET_LEDGER=//p')"
          test -n "$LEDGER"
          printf "syndrome_coset_ledger=%s\\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture exhaustive syndrome oracle and linearity ledger
        id: syndrome_oracle
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            small_fixture_production_syndrome_matches_independent_oracle_and_is_linear -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^SYNDROME_ORACLE_LINEAREXHAUSTIVE=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SYNDROME_ORACLE_LINEAREXHAUSTIVE=//p')"
          test -n "$LEDGER"
          printf "syndrome_oracle_linearity=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"
      - name: Capture exact minimum-syndrome multiplicity ledger
        id: multiplicity_invariant
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            minimum_weight_syndrome_multiplicity_matches_nearest_codeword_multiplicity_exhaustively -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^MIN_SYNDROME_MULTIPLICITY_LEDGER=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^MIN_SYNDROME_MULTIPLICITY_LEDGER=//p')"
          test -n "$LEDGER"
          printf "minimum_syndrome_multiplicity_ledger=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Verify explicit minimum-syndrome list truncation
        id: minimum_list_capture
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            minimum_syndrome_list_truncation_is_explicit_and_fail_closed -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^MIN_SYNDROME_LIST_CAPTURE=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^MIN_SYNDROME_LIST_CAPTURE=//p')"
          test -n "$LEDGER"
          printf "minimum_syndrome_list_capture=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Prove factorization ambiguity is separate
        id: factor_separation
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            factorization_ambiguity_is_distinct_from_syndrome_ambiguity -- --nocapture 2>&1)"
          COUNT="$(printf '%s\\n' "$OUTPUT" | grep -c '^FACTOR_SYNDROME_SEPARATION=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\\n' "$OUTPUT" | sed -n 's/^FACTOR_SYNDROME_SEPARATION=//p')"
          test -n "$LEDGER"
          printf "factor_syndrome_separation=%s\\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture coordinate permutation equivariance
        id: coordinate_permutation
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            coordinate_permutation_equivariance_preserves_bounded_decoder_semantics -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^COORDINATE_PERMUTATION_EQUIVARIANCE=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^COORDINATE_PERMUTATION_EQUIVARIANCE=//p')"
          test -n "$LEDGER"
          printf "coordinate_permutation_equivariance=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture syndrome decoder ledger
        id: decoder_ledger
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            decoder_work_ledger_matches_exact_weight_search_space -- --nocapture 2>&1)"
          LEDGER_COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^SYNDROME_DECODER_LEDGER=')"
          test "$LEDGER_COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SYNDROME_DECODER_LEDGER=//p')"
          test -n "$LEDGER"
          printf "syndrome_decoder_ledger=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture generator-basis equivariance
        id: generator_basis_equivariance
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            generator_basis_change_preserves_parity_check_and_decoder_semantics -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^GENERATOR_BASIS_EQUIVARIANCE=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^GENERATOR_BASIS_EQUIVARIANCE=//p')"
          test -n "$LEDGER"
          printf "generator_basis_equivariance=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"
      - name: Capture composed metamorphic invariance
        id: composed_metamorphic
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            composed_basis_and_coordinate_metamorphisms_preserve_decoder_semantics -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^COMPOSED_METAMORPHIC_EQUIVARIANCE=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^COMPOSED_METAMORPHIC_EQUIVARIANCE=//p')"
          test -n "$LEDGER"
          printf "composed_metamorphic_equivariance=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"
      - name: Capture random-code list and independent-oracle sweep
        id: random_list_oracle
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            random_code_list_surface_matches_independent_oracles_and_is_deterministic -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^RANDOM_LIST_ORACLE=')"
          test "$COUNT" -eq 2
          LEDGER="$(printf '%s\n' "$OUTPUT" | grep '^RANDOM_LIST_ORACLE=' | tr '\n' '|' | sed 's/|$//')"
          test -n "$LEDGER"
          printf "random_list_oracle=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture deterministic random-code sweep
        id: random_sweep
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            random_small_and_low_rate_code_sweep_matches_exhaustive_oracle_within_guaranteed_radius -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^RANDOM_SYNDROME_SWEEP=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^RANDOM_SYNDROME_SWEEP=//p')"
          test -n "$LEDGER"
          printf "random_syndrome_sweep=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"

      - name: Capture beyond-radius semantics
        id: beyond_radius
        run: |
          OUTPUT="$(cargo +1.96.1 test --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --test linear_code_syndrome_decoder \
            beyond_unique_radius_decoder_matches_nearest_or_no_match_without_claiming_target_recovery -- --nocapture 2>&1)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c '^BEYOND_RADIUS_LEDGER=')"
          test "$COUNT" -eq 1
          LEDGER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^BEYOND_RADIUS_LEDGER=//p')"
          test -n "$LEDGER"
          printf "beyond_radius_ledger=%s\n" "$LEDGER" >> "$GITHUB_OUTPUT"
      - name: Strict Clippy
        id: clippy
        run: |
          cargo +1.96.1 clippy --locked \
            --manifest-path "${{ steps.harness.outputs.path }}/Cargo.toml" \
            --all-targets \
            -- -D warnings

      - name: Emit qualification receipt
        if: always()
        run: |
          mkdir -p hdc-linear-code-evidence
          cat > hdc-linear-code-evidence/hdc-linear-code-bounded-decoder-qualification.txt <<EOF
          HDC Linear-Code Bounded Decoder Qualification
          =============================================
          receipt_schema=hdc-linear-code-bounded-decoder-qualification-v22
          github_run_id=${{ github.run_id }}
          github_run_attempt=${{ github.run_attempt }}
