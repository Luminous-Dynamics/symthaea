name: NixWard preview-only execution semantics

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/core/nixward/src/action/executor.rs"
      - "crates/core/nixward/src/action/plan_executor.rs"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/nixward-preview-only.yml"
  push:
    branches:
      - "fix/nixward-preview-only-outcome-20261128"
    paths:
      - "crates/core/nixward/src/action/executor.rs"
      - "crates/core/nixward/src/action/plan_executor.rs"
      - ".github/workflows/nixward-preview-only.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixward-preview-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-only:
    name: preview-only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check executor formatting
        run: rustfmt +1.96.0 --check --edition 2024 crates/core/nixward/src/action/executor.rs crates/core/nixward/src/action/plan_executor.rs
      - name: Test executor preview semantics
        run: cargo +1.96.0 test --locked -p nixward --lib action::executor::tests
      - name: Test plan preview semantics
        run: cargo +1.96.0 test --locked -p nixward --lib action::plan_executor::tests
