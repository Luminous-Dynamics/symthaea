name: FL Feature Matrix

on:
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/crates/mycelix-fl-core/**"
      - "mycelix-workspace/crates/mycelix-fl/**"
      - "mycelix-workspace/crates/mycelix-fl-proofs/**"
  pull_request:
    branches: [main]
    paths:
      - "mycelix-workspace/crates/mycelix-fl-core/**"
      - "mycelix-workspace/crates/mycelix-fl/**"
      - "mycelix-workspace/crates/mycelix-fl-proofs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================================
  # Feature powerset: test all 2-flag combinations compile and pass tests
  # =========================================================================
  fl-core-powerset:
    name: fl-core feature powerset
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-hack
        run: cargo install cargo-hack --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl-core/target
          key: ${{ runner.os }}-fl-core-hack-${{ hashFiles('mycelix-workspace/crates/mycelix-fl-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-core-hack-
      # Features: std, holochain, replay, shapley, ensemble, compression
      # --depth 2: all individual + all 2-flag combos = C(6,0)+C(6,1)+C(6,2) = 22
      - name: Test feature powerset (depth 2)
        run: cargo hack test --feature-powerset --depth 2
        env:
          RUST_BACKTRACE: 1

  fl-powerset:
    name: mycelix-fl feature powerset
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-hack
        run: cargo install cargo-hack --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl/target
          key: ${{ runner.os }}-fl-hack-${{ hashFiles('mycelix-workspace/crates/mycelix-fl/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-hack-
      # Features: attacks, coherence-series, phi-series, pogq, replay, shapley, ensemble, compression
      # --depth 2: all individual + all 2-flag combos = C(8,0)+C(8,1)+C(8,2) = 37
      - name: Test feature powerset (depth 2)
        run: cargo hack test --feature-powerset --depth 2
        env:
          RUST_BACKTRACE: 1

  fl-proofs-check:
    name: mycelix-fl-proofs check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl-proofs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl-proofs/target
          key: ${{ runner.os }}-fl-proofs-${{ hashFiles('mycelix-workspace/crates/mycelix-fl-proofs/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-proofs-
      # fl-proofs has no features but depends on winterfell — verify it builds
      - name: Check compilation
        run: cargo check
      - name: Run tests
        run: cargo test
        env:
          RUST_BACKTRACE: 1

  # =========================================================================
  # All-features integration: test with every feature enabled
  # =========================================================================
  all-features:
    name: All features integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fl-all-features-${{ hashFiles('mycelix-workspace/crates/mycelix-fl*/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-all-features-
      - name: Test fl-core (all features)
        working-directory: mycelix-workspace/crates/mycelix-fl-core
        run: cargo test --all-features
        env:
          RUST_BACKTRACE: 1
      - name: Test mycelix-fl (all features)
        working-directory: mycelix-workspace/crates/mycelix-fl
        run: cargo test --all-features
        env:
          RUST_BACKTRACE: 1
      - name: Clippy fl-core (all features)
        working-directory: mycelix-workspace/crates/mycelix-fl-core
        run: cargo clippy --all-features -- -D warnings
      - name: Clippy mycelix-fl (all features)
        working-directory: mycelix-workspace/crates/mycelix-fl
        run: cargo clippy --all-features -- -D warnings

  # =========================================================================
  # Criterion benchmarks: verify benchmarks compile and run (quick mode)
  # =========================================================================
  benchmarks:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fl-bench-${{ hashFiles('mycelix-workspace/crates/mycelix-fl*/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-bench-
      - name: Run fl-core benchmarks (quick)
        working-directory: mycelix-workspace/crates/mycelix-fl-core
        run: cargo bench --all-features --bench aggregation_bench -- --quick
      - name: Run mycelix-fl benchmarks (quick)
        working-directory: mycelix-workspace/crates/mycelix-fl
        run: cargo bench --all-features --bench fl_bench -- --quick
