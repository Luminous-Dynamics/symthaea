name: Cyber Crucible Authenticated Receipt Contract

on:
  pull_request:
    paths:
      - "scripts/verify_cyber_crucible_signed_receipt.py"
      - "tests/test_cyber_crucible_signed_receipt.py"
      - "validation/cyber_crucible_signed_receipt_v1.schema.json"
      - "validation/CYBER_CRUCIBLE_SIGNED_RECEIPT_V1.md"
      - ".github/workflows/cyber-crucible-authenticated-receipts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify_cyber_crucible_signed_receipt.py"
      - "tests/test_cyber_crucible_signed_receipt.py"
      - "validation/cyber_crucible_signed_receipt_v1.schema.json"
      - "validation/CYBER_CRUCIBLE_SIGNED_RECEIPT_V1.md"
      - ".github/workflows/cyber-crucible-authenticated-receipts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-receipt-contract:
    name: Signature, trust-policy, context, and replay regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned verification dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "cryptography==50.0.2" \
            "rfc8785==0.1.4" \
            "jsonschema==4.26.0"

      - name: Meta-validate receipt schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("validation/cyber_crucible_signed_receipt_v1.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          print("Draft 2020-12 schema meta-validation PASS")
          PY

      - name: Run exact checked-in verifier regressions
        run: python -m unittest discover -s tests -p "test_cyber_crucible_signed_receipt.py" -v
