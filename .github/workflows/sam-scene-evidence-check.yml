name: SAM Scene Evidence Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/autonomy/SAM_SCENE_EVIDENCE_*.json"
      - "docs/autonomy/SAM_SCENE_EVIDENCE_*.md"
      - "docs/autonomy/fixtures/SAM_SCENE_EVIDENCE_*.json"
      - "docs/autonomy/SAM_TRAFFIC_CONVENTION_*.json"
      - "docs/autonomy/SAM_TRAFFIC_CONVENTION_*.md"
      - "docs/autonomy/fixtures/SAM_TRAFFIC_CONVENTION_*.json"
      - "tools/sam-scene-evidence-check/**"
      - ".github/workflows/sam-scene-evidence-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/autonomy/SAM_SCENE_EVIDENCE_*.json"
      - "docs/autonomy/SAM_SCENE_EVIDENCE_*.md"
      - "docs/autonomy/fixtures/SAM_SCENE_EVIDENCE_*.json"
      - "docs/autonomy/SAM_TRAFFIC_CONVENTION_*.json"
      - "docs/autonomy/SAM_TRAFFIC_CONVENTION_*.md"
      - "docs/autonomy/fixtures/SAM_TRAFFIC_CONVENTION_*.json"
      - "tools/sam-scene-evidence-check/**"
      - ".github/workflows/sam-scene-evidence-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Draft 2020-12 + SAM semantic conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path tools/sam-scene-evidence-check/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path tools/sam-scene-evidence-check/Cargo.toml
      - name: Validate canonical scene fixture
        run: >
          cargo run --manifest-path tools/sam-scene-evidence-check/Cargo.toml --
          docs/autonomy/SAM_SCENE_EVIDENCE_SCHEMA_V0_1.json
          docs/autonomy/fixtures/SAM_SCENE_EVIDENCE_CONTRACT_V0_1.json
          docs/autonomy/SAM_TRAFFIC_CONVENTION_PROFILE_SCHEMA_V0_1.json
          docs/autonomy/fixtures/SAM_TRAFFIC_CONVENTION_METAMORPHIC_V0_1.json
      - name: Clippy
        run: cargo clippy --manifest-path tools/sam-scene-evidence-check/Cargo.toml --all-targets -- -D warnings
