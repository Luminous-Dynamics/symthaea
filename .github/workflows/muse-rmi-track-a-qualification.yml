name: MUSE RMI Track A Qualification

on:
  push:
    branches:
      - research/rmi-bench-track-a-runner-20261121
    paths:
      - "crates/domains/symthaea-muse/src/rmi_benchmark.rs"
      - "crates/domains/symthaea-muse/src/bin/rmi_bench_track_a.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/muse-rmi-track-a-qualification.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/domains/symthaea-muse/src/rmi_benchmark.rs"
      - "crates/domains/symthaea-muse/src/bin/rmi_bench_track_a.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/muse-rmi-track-a-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-rmi-track-a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head RMI Track A
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4

      - name: Verify pinned Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version

      - name: Check runner formatting
        run: rustfmt --edition 2024 --check crates/domains/symthaea-muse/src/bin/rmi_bench_track_a.rs

      - name: Run focused runner tests
        run: cargo test --locked -p symthaea-muse --bin rmi_bench_track_a

      - name: Run focused Clippy
        run: cargo clippy --locked -p symthaea-muse --bin rmi_bench_track_a -- -D warnings

      - name: Execute frozen fixture suite and fresh-process replay
        run: |
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked -p symthaea-muse --bin rmi_bench_track_a -- \
            --source-commit "$source_commit" \
            --seed-count 4 \
            --output "$RUNNER_TEMP/melothaea-rmi-track-a.json" \
            --self-check
          sha256sum "$RUNNER_TEMP/melothaea-rmi-track-a.json"

      - name: Upload exact-head report
        uses: actions/upload-artifact@v4
        with:
          name: melothaea-rmi-track-a-${{ github.sha }}
          path: ${{ runner.temp }}/melothaea-rmi-track-a.json
          if-no-files-found: error
          retention-days: 30
