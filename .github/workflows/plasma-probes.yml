      - name: Validate response-balanced K-RESP-1 experiment contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("${{ runner.temp }}/plasma-probe-validation/benchmarks/plasma/response-balanced")
          schema = json.loads((root / "response-balanced-experiment-v0.1.schema.json").read_text())
          fixture = json.loads((root / "fixtures/synthetic-kresp1-experiment-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          validator.validate(fixture)

          cohort = fixture["cohort"]
          checkpoint = fixture["frozen_checkpoint"]
          pulse_family = fixture["pulse_family"]
          split = fixture["split"]
          horizon = fixture["prediction_horizon"]
          assert cohort["spatial_domain"]["maximum"] > cohort["spatial_domain"]["minimum"]
          assert cohort["velocity_domain"]["maximum"] > cohort["velocity_domain"]["minimum"]
          assert cohort["state_metric_id"].strip()
          assert cohort["state_coordinate_id"].strip()
          linearization = fixture["linearization_contract"]
          assert linearization["status"] == "synthetic_derivatives_not_computed"
          assert linearization["derivative_source"] == "not_computed_synthetic"
          assert linearization["future_solver_transition_jacobians_required"] is True
          assert linearization["pulse_map_state_jacobian_required"] is True
          assert linearization["pulse_map_parameter_jacobian_required"] is True
          assert linearization["split_solver_composition_order_required"] is True
          assert linearization["independent_finite_difference_cross_check_required"] is True
          assert linearization["branch_change_disposition"] == "UNKNOWN_OR_HANDOFF"
          assert horizon["start_time"] == checkpoint["time"]
          assert checkpoint["first_pulse_applied"] is True
          assert checkpoint["second_pulse_not_yet_applied"] is True
          assert horizon["end_time"] <= cohort["maximum_time"]
          assert pulse_family["maximum_application_time"] <= cohort["maximum_time"]

          split_groups = {
              "training": split["training"],
              "validation": split["validation"],
              "held_out": split["held_out"],
          }
          all_trial_ids = []
          all_pulse_ids = []
          for group_name, trials in split_groups.items():
              for trial in trials:
                  all_trial_ids.append(trial["trial_id"])
                  assert len(trial["pulses"]) == 2, f"{group_name}/{trial['trial_id']}: K-RESP-1 requires exactly two pulses"
                  times = [pulse["application_time"] for pulse in trial["pulses"]]
                  assert times == sorted(times), f"{group_name}/{trial['trial_id']}: pulses must be time ordered"
                  assert times[0] < checkpoint["time"] < times[1], f"{group_name}/{trial['trial_id']}: checkpoint must lie after pulse one and before pulse two"
                  assert len({pulse["pulse_id"] for pulse in trial["pulses"]}) == len(trial["pulses"])
                  for pulse in trial["pulses"]:
                      all_pulse_ids.append(pulse["pulse_id"])
                      assert pulse_family["allowed_spatial_mode"]["minimum"] <= pulse["spatial_mode"] <= pulse_family["allowed_spatial_mode"]["maximum"]
                      assert pulse_family["allowed_kick_amplitude"]["minimum"] <= pulse["kick_amplitude"] <= pulse_family["allowed_kick_amplitude"]["maximum"]
                      assert pulse_family["allowed_phase_rad"]["minimum"] <= pulse["phase_rad"] <= pulse_family["allowed_phase_rad"]["maximum"]
                      assert pulse["application_time"] <= pulse_family["maximum_application_time"]
                      assert pulse["application_time"] < horizon["end_time"]

          assert len(all_trial_ids) == len(set(all_trial_ids)), "trial ids leak or duplicate across splits"
          assert len(all_pulse_ids) == len(set(all_pulse_ids)), "pulse ids must be globally unique"

          all_trials = [trial for trials in split_groups.values() for trial in trials]
          first_pulse_signatures = {
              (
                  trial["pulses"][0]["spatial_mode"],
                  trial["pulses"][0]["kick_amplitude"],
                  trial["pulses"][0]["phase_rad"],
                  trial["pulses"][0]["application_time"],
              )
              for trial in all_trials
          }
          assert len(first_pulse_signatures) == 1, "all paths must share the same first pulse/checkpoint history"

          training_pulses = [trial["pulses"][1] for trial in split["training"]]
          held_out_pulses = [trial["pulses"][1] for trial in split["held_out"]]
          training_phases = {pulse["phase_rad"] for pulse in training_pulses}
          training_amplitudes = {pulse["kick_amplitude"] for pulse in training_pulses}
          training_modes = {pulse["spatial_mode"] for pulse in training_pulses}
          training_separations = {
              trial["pulses"][1]["application_time"] - trial["pulses"][0]["application_time"]
              for trial in split["training"] if len(trial["pulses"]) == 2
          }
          assert any(pulse["phase_rad"] not in training_phases for pulse in held_out_pulses)
          assert any(pulse["kick_amplitude"] not in training_amplitudes for pulse in held_out_pulses)
          assert any(pulse["spatial_mode"] not in training_modes for pulse in held_out_pulses)
          held_out_separations = {
              trial["pulses"][1]["application_time"] - trial["pulses"][0]["application_time"]
              for trial in split["held_out"] if len(trial["pulses"]) == 2
          }
          assert any(separation not in training_separations for separation in held_out_separations)

          qoi_ids = {item["qoi_id"] for item in fixture["observables"]}
          assert len(qoi_ids) == len(fixture["observables"])
          assert set(fixture["reference_convergence"]["convergence_observables"]).issubset(qoi_ids)
          required_comparators = {
              "snapshot_pod", "padovan_nonintrusive_balancing", "time_windowed_pod",
              "energy_windowed_pod", "conservative_fluid_kinetic_rom", "adaptive_hermite",
              "adaptive_fourier", "tensor_network_vlasov_poisson",
              "non_markovian_fno_closure", "full_order_reference"
          }
          assert required_comparators.issubset(set(fixture["comparators"]))
          required_adjacent_methods = {
              "adaptive_opinf_port", "adaptive_nitrom_port",
              "adaptive_opinf_nitrom_hybrid_port", "symmetry_augmented_kinetic_closure"
          }
          assert required_adjacent_methods.issubset(set(fixture["adjacent_methods"]))
          assert set(fixture["resource_budget"]["comparison_modes"]) == {
              "equal_rank", "equal_stored_bytes", "equal_end_to_end_wall_time"
          }
          assert fixture["success_targets"]["status"] == "prospective_only_not_achieved"
          assert fixture["success_targets"]["all_targets_are_prospective"] is True
          response_qualification = fixture["response_qualification"]
          assert response_qualification["checkpoint_state_residual_required"] is True
          assert response_qualification["future_pulse_injection_residual_required"] is True
          assert response_qualification["nonlinear_full_order_response_required"] is True
          assert set(response_qualification["risk_summary_metrics"]) == {"weighted_mean", "worst_case", "cvar"}
          assert response_qualification["cvar_alpha"] == 0.9
          assert response_qualification["residual_threshold_status"] == "calibrate_on_independently_converged_physical_reference"
          assert fixture["claim_boundary"] == {
              "physical_solver_executed": False,
              "physical_response_measured": False,
              "competitive_ranking_claimed": False,
              "independent_reference_converged": False
          }
          print("response_balanced_kresp1_schema_validation=PASS")
          print("response_balanced_split_and_coverage_validation=PASS")
          print("response_balanced_claim_boundary_validation=PASS")
          PY

      - name: Run Rust K-RESP semantic contract auditor
        run: |
          cargo run --locked --manifest-path "${RUNNER_TEMP}/plasma-probe-validation/crates/domains/symthaea-plasma-probes/Cargo.toml" --bin response_balanced_contract_audit -- \
            "${RUNNER_TEMP}/plasma-probe-validation/benchmarks/plasma/response-balanced/fixtures/synthetic-kresp1-experiment-v0.1.json"

      - name: Challenge Rust K-RESP auditor with negative controls
        run: |
          python3 - <<'PY'
          import copy
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path("${{ runner.temp }}/plasma-probe-validation")
          fixture_path = root / "benchmarks/plasma/response-balanced/fixtures/synthetic-kresp1-experiment-v0.1.json"
          fixture = json.loads(fixture_path.read_text())
          binaries = list(root.glob("**/debug/response_balanced_contract_audit"))
          assert binaries, "compiled Rust semantic auditor binary was not found"
          binary = binaries[0]

          def expect_rejection(name, mutate):
              invalid = copy.deepcopy(fixture)
              mutate(invalid)
              with tempfile.TemporaryDirectory(prefix="kresp1-negative-") as directory:
                  path = Path(directory) / (name + ".json")
                  path.write_text(json.dumps(invalid, sort_keys=True))
                  result = subprocess.run([str(binary), str(path)], capture_output=True, text=True)
              assert result.returncode != 0, f"Rust semantic auditor accepted negative control {name}: {result.stdout} {result.stderr}"
              print(f"response_balanced_negative_control_{name}=PASS")

          expect_rejection(
              "first-pulse-history-leak",
              lambda value: value["split"]["held_out"][0]["pulses"][0].__setitem__("phase_rad", 0.9),
          )
          expect_rejection(
              "checkpoint-crossing",
              lambda value: value["split"]["held_out"][0]["pulses"][1].__setitem__("application_time", 5.5),
          )
          expect_rejection(
              "out-of-family-amplitude",
              lambda value: value["split"]["held_out"][0]["pulses"][1].__setitem__("kick_amplitude", 0.03),
          )
          def remove_heldout_separation_coverage(value):
              for trial in value["split"]["held_out"]:
                  trial["pulses"][1]["application_time"] = 10.0
          expect_rejection("no-unseen-separation", remove_heldout_separation_coverage)
          expect_rejection(
              "physical-claim-laundering",
              lambda value: value["claim_boundary"].__setitem__("physical_response_measured", True),
          )
          expect_rejection(
              "pulse-jacobian-bypass",
              lambda value: value["linearization_contract"].__setitem__("pulse_map_parameter_jacobian_required", False),
          )
          expect_rejection(
              "coordinate-identity-missing",
              lambda value: value["cohort"].__setitem__("state_coordinate_id", ""),
          )
          expect_rejection(
              "future-pulse-response-bypass",
              lambda value: value["response_qualification"].__setitem__("future_pulse_injection_residual_required", False),
          )
          expect_rejection(
              "split-id-duplication",
              lambda value: value["split"]["held_out"][0].__setitem__("trial_id", value["split"]["training"][0]["trial_id"]),
          )
          PY

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path "${RUNNER_TEMP}/plasma-probe-validation/crates/domains/symthaea-plasma-probes/Cargo.toml" --all-targets -- -D warnings
