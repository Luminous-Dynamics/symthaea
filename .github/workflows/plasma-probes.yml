name: Plasma Probe Contract

on:
  push:
    branches:
      - "research/plasma-adversarial-probe-contract-v0-1"
    paths:
      - "Cargo.lock"
      - "crates/domains/symthaea-plasma-probes/**"
      - "benchmarks/plasma/adversarial-probes/**"
      - "benchmarks/plasma/rate-distortion/**"
      - ".github/workflows/plasma-probes.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.lock"
      - "crates/domains/symthaea-plasma-probes/**"
      - "benchmarks/plasma/adversarial-probes/**"
      - "benchmarks/plasma/rate-distortion/**"
      - ".github/workflows/plasma-probes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasma-probes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate pulse contract and response Gramian primitives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting without workspace discovery
        run: |
          rustfmt --edition 2024 --check crates/domains/symthaea-plasma-probes/src/lib.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-plasma-probes/src/bin/kird_point_audit.rs

      - name: Prepare isolated crate validation workspace
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="${RUNNER_TEMP}/plasma-probe-validation"
          crate_dir="${tmp_root}/crates/domains/symthaea-plasma-probes"
          mkdir -p "${crate_dir}/src/bin"
          mkdir -p "${tmp_root}/benchmarks/plasma/adversarial-probes/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/rate-distortion/fixtures"
          cp crates/domains/symthaea-plasma-probes/src/lib.rs "${crate_dir}/src/lib.rs"
          cp crates/domains/symthaea-plasma-probes/src/bin/kird_point_audit.rs "${crate_dir}/src/bin/kird_point_audit.rs"
          cp benchmarks/plasma/adversarial-probes/fixtures/synthetic-pulse-family-v0.1.json \
            "${tmp_root}/benchmarks/plasma/adversarial-probes/fixtures/"
          cp benchmarks/plasma/rate-distortion/kird-point-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/rate-distortion/"
          cp benchmarks/plasma/rate-distortion/fixtures/synthetic-kird-point-v0.1.json \
            "${tmp_root}/benchmarks/plasma/rate-distortion/fixtures/"
          cat > "${crate_dir}/Cargo.toml" <<'EOF'
          [package]
          name = "symthaea-plasma-probes"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.94"
          publish = false

          [workspace]

          [dependencies]
          blake3 = "=1.8.5"
          serde = { version = "=1.0.228", features = ["derive"] }
          serde_json = "=1.0.150"
          thiserror = "=1.0.69"
          EOF
          cargo generate-lockfile --manifest-path "${crate_dir}/Cargo.toml"

      - name: Run isolated unit tests against pinned dependency versions
        run: cargo test --locked --manifest-path "${RUNNER_TEMP}/plasma-probe-validation/crates/domains/symthaea-plasma-probes/Cargo.toml"

      - name: Validate KIRD Draft 2020-12 schema and fixture
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("${{ runner.temp }}/plasma-probe-validation/benchmarks/plasma/rate-distortion")
          schema = json.loads((root / "kird-point-v0.1.schema.json").read_text())
          fixture = json.loads((root / "fixtures/synthetic-kird-point-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          assert fixture["record_status"] == "synthetic_fixture_only"
          assert fixture["provenance"]["physical_execution_authorized"] is False
          print("kird_schema_validation=PASS")
          PY

      - name: Run KIRD semantic audit fixture
        run: cargo run --locked --manifest-path "${RUNNER_TEMP}/plasma-probe-validation/crates/domains/symthaea-plasma-probes/Cargo.toml" --bin kird_point_audit -- "${RUNNER_TEMP}/plasma-probe-validation/benchmarks/plasma/rate-distortion/fixtures/synthetic-kird-point-v0.1.json"

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path "${RUNNER_TEMP}/plasma-probe-validation/crates/domains/symthaea-plasma-probes/Cargo.toml" --all-targets -- -D warnings
