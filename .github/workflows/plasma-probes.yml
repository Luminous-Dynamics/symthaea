name: Plasma Probe Contract

on:
  push:
    branches:
      - "research/plasma-adversarial-probe-contract-v0-1"
    paths:
      - "Cargo.lock"
      - "crates/domains/symthaea-plasma-probes/**"
      - "benchmarks/plasma/adversarial-probes/**"
      - "benchmarks/plasma/rate-distortion/**"
      - "benchmarks/plasma/topology-lifting/**"
      - "benchmarks/plasma/state-equivalence/**"
      - "benchmarks/plasma/kinetic-discrimination/**"
      - "benchmarks/plasma/micro-macro/**"
      - "benchmarks/plasma/control-interface/**"
      - "benchmarks/plasma/adaptive-refinement/**"
      - "benchmarks/plasma/positivity-projection/**"
      - "benchmarks/plasma/measure-stability/**"
      - "benchmarks/plasma/kinetic-information-return/**"
      - ".github/workflows/plasma-probes.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.lock"
      - "crates/domains/symthaea-plasma-probes/**"
      - "benchmarks/plasma/adversarial-probes/**"
      - "benchmarks/plasma/rate-distortion/**"
      - "benchmarks/plasma/topology-lifting/**"
      - "benchmarks/plasma/state-equivalence/**"
      - "benchmarks/plasma/kinetic-discrimination/**"
      - "benchmarks/plasma/micro-macro/**"
      - "benchmarks/plasma/control-interface/**"
      - "benchmarks/plasma/adaptive-refinement/**"
      - "benchmarks/plasma/positivity-projection/**"
      - "benchmarks/plasma/measure-stability/**"
      - "benchmarks/plasma/kinetic-information-return/**"
      - ".github/workflows/plasma-probes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasma-probes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate pulse contract and response Gramian primitives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting without workspace discovery
        run: |
          rustfmt --edition 2024 --check crates/domains/symthaea-plasma-probes/src/lib.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-plasma-probes/src/bin/kird_point_audit.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-plasma-probes/src/bin/response_weighted_refinement_audit.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-plasma-probes/src/bin/sensor_actuator_contract_audit.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-plasma-probes/src/bin/positive_mass_projection_audit.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-plasma-probes/src/bin/small_positive_response_qp_audit.rs

      - name: Prepare isolated crate validation workspace
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="${RUNNER_TEMP}/plasma-probe-validation"
          crate_dir="${tmp_root}/crates/domains/symthaea-plasma-probes"
          mkdir -p "${crate_dir}/src/bin"
          mkdir -p "${tmp_root}/benchmarks/plasma/adversarial-probes/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/rate-distortion/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/topology-lifting/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/state-equivalence/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/kinetic-discrimination/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/micro-macro/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/control-interface/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/adaptive-refinement/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/positivity-projection/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/measure-stability/fixtures"
          mkdir -p "${tmp_root}/benchmarks/plasma/kinetic-information-return/fixtures"
          cp crates/domains/symthaea-plasma-probes/src/lib.rs "${crate_dir}/src/lib.rs"
          cp crates/domains/symthaea-plasma-probes/src/bin/kird_point_audit.rs "${crate_dir}/src/bin/kird_point_audit.rs"
          cp crates/domains/symthaea-plasma-probes/src/bin/response_weighted_refinement_audit.rs "${crate_dir}/src/bin/response_weighted_refinement_audit.rs"
          cp crates/domains/symthaea-plasma-probes/src/bin/sensor_actuator_contract_audit.rs "${crate_dir}/src/bin/sensor_actuator_contract_audit.rs"
          cp crates/domains/symthaea-plasma-probes/src/bin/positive_mass_projection_audit.rs "${crate_dir}/src/bin/positive_mass_projection_audit.rs"
          cp crates/domains/symthaea-plasma-probes/src/bin/small_positive_response_qp_audit.rs "${crate_dir}/src/bin/small_positive_response_qp_audit.rs"
          cp benchmarks/plasma/adversarial-probes/fixtures/synthetic-pulse-family-v0.1.json \
            "${tmp_root}/benchmarks/plasma/adversarial-probes/fixtures/"
          cp benchmarks/plasma/adversarial-probes/response-weighted-refinement-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/adversarial-probes/"
          cp benchmarks/plasma/adversarial-probes/fixtures/response-weighted-refinement-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/adversarial-probes/fixtures/"
          cp benchmarks/plasma/rate-distortion/kird-point-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/rate-distortion/"
          cp benchmarks/plasma/rate-distortion/fixtures/synthetic-kird-point-v0.1.json \
            "${tmp_root}/benchmarks/plasma/rate-distortion/fixtures/"
          cp benchmarks/plasma/rate-distortion/fixtures/synthetic-kird-certified-cover-v0.1.json \
            "${tmp_root}/benchmarks/plasma/rate-distortion/fixtures/"
          cp benchmarks/plasma/topology-lifting/boundary-lift-contract-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/topology-lifting/"
          cp benchmarks/plasma/topology-lifting/fixtures/topology-lift-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/topology-lifting/fixtures/"
          cp benchmarks/plasma/topology-lifting/weighted-fourier-measure-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/topology-lifting/"
          cp benchmarks/plasma/topology-lifting/fixtures/weighted-fourier-measure-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/topology-lifting/fixtures/"
          cp benchmarks/plasma/topology-lifting/weighted-measure-tail-stability-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/topology-lifting/"
          cp benchmarks/plasma/topology-lifting/fixtures/weighted-measure-tail-stability-v0.1.json \
            "${tmp_root}/benchmarks/plasma/topology-lifting/fixtures/"
          cp benchmarks/plasma/state-equivalence/kinetic-response-signature-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/state-equivalence/"
          cp benchmarks/plasma/state-equivalence/fixtures/nontransitive-response-triple-v0.1.json \
            "${tmp_root}/benchmarks/plasma/state-equivalence/fixtures/"
          cp benchmarks/plasma/kinetic-discrimination/complex-response-eig-design-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/kinetic-discrimination/"
          cp benchmarks/plasma/kinetic-discrimination/fixtures/complex-response-eig-known-answers-v0.1.json \
            "${tmp_root}/benchmarks/plasma/kinetic-discrimination/fixtures/"
          cp benchmarks/plasma/micro-macro/micro-macro-scaling-contract-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/micro-macro/"
          cp benchmarks/plasma/micro-macro/fixtures/synthetic-micro-macro-contract-v0.1.json \
            "${tmp_root}/benchmarks/plasma/micro-macro/fixtures/"
          cp benchmarks/plasma/control-interface/sensor-actuator-timing-contract-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/control-interface/"
          cp benchmarks/plasma/control-interface/fixtures/synthetic-multirate-interface-v0.1.json \
            "${tmp_root}/benchmarks/plasma/control-interface/fixtures/"
          cp benchmarks/plasma/control-interface/scalar-unstable-mode-contract-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/control-interface/"
          cp benchmarks/plasma/control-interface/fixtures/scalar-unstable-mode-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/control-interface/fixtures/"
          cp benchmarks/plasma/control-interface/oscillatory-unstable-mode-contract-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/control-interface/"
          cp benchmarks/plasma/control-interface/fixtures/oscillatory-unstable-mode-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/control-interface/fixtures/"
          cp benchmarks/plasma/control-interface/coupled-unstable-mode-authority-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/control-interface/"
          cp benchmarks/plasma/control-interface/fixtures/coupled-unstable-mode-authority-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/control-interface/fixtures/"
          cp benchmarks/plasma/adaptive-refinement/refinement-policy-contract-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/adaptive-refinement/"
          cp benchmarks/plasma/adaptive-refinement/fixtures/synthetic-refinement-cases-v0.1.json \
            "${tmp_root}/benchmarks/plasma/adaptive-refinement/fixtures/"
          cp benchmarks/plasma/positivity-projection/positive-mass-projection-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/positivity-projection/"
          cp benchmarks/plasma/positivity-projection/fixtures/negative-spectral-overshoot-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/positivity-projection/fixtures/"
          cp benchmarks/plasma/positivity-projection/small-positive-response-qp-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/positivity-projection/"
          cp benchmarks/plasma/positivity-projection/fixtures/three-cell-positive-response-qp-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/positivity-projection/fixtures/"
          cp benchmarks/plasma/measure-stability/particle-measure-w1-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/measure-stability/"
          cp benchmarks/plasma/measure-stability/fixtures/particle-measure-w1-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/measure-stability/fixtures/"
          cp benchmarks/plasma/measure-stability/particle-measure-torus-w1-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/measure-stability/"
          cp benchmarks/plasma/measure-stability/fixtures/particle-measure-torus-w1-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/measure-stability/fixtures/"
          cp benchmarks/plasma/kinetic-information-return/kinetic-pulse-graph-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/kinetic-information-return/"
          cp benchmarks/plasma/kinetic-information-return/fixtures/kinetic-pulse-graph-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/kinetic-information-return/fixtures/"
          cp benchmarks/plasma/kinetic-information-return/path-response-signature-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/kinetic-information-return/"
          cp benchmarks/plasma/kinetic-information-return/fixtures/path-response-dispositions-v0.1.json \
            "${tmp_root}/benchmarks/plasma/kinetic-information-return/fixtures/"
          cp benchmarks/plasma/kinetic-information-return/operation-ledger-v0.1.schema.json \
            "${tmp_root}/benchmarks/plasma/kinetic-information-return/"
          cp benchmarks/plasma/kinetic-information-return/fixtures/operation-ledger-known-answer-v0.1.json \
            "${tmp_root}/benchmarks/plasma/kinetic-information-return/fixtures/"
          cat > "${crate_dir}/Cargo.toml" <<'EOF'
          [package]
          name = "symthaea-plasma-probes"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.94"
          publish = false

          [workspace]

          [dependencies]
          blake3 = "=1.8.5"
          serde = { version = "=1.0.228", features = ["derive"] }
          serde_json = "=1.0.150"
          thiserror = "=1.0.69"
          EOF
          cargo generate-lockfile --manifest-path "${crate_dir}/Cargo.toml"

      - name: Run isolated unit tests against pinned dependency versions
        run: cargo test --locked --manifest-path "${RUNNER_TEMP}/plasma-probe-validation/crates/domains/symthaea-plasma-probes/Cargo.toml"

      - name: Validate KIRD Draft 2020-12 schema and fixture
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("${{ runner.temp }}/plasma-probe-validation/benchmarks/plasma/rate-distortion")
          schema = json.loads((root / "kird-point-v0.1.schema.json").read_text())
          fixture = json.loads((root / "fixtures/synthetic-kird-point-v0.1.json").read_text())
          certified = json.loads((root / "fixtures/synthetic-kird-certified-cover-v0.1.json").read_text())
          validator = Draft202012Validator(schema)
          Draft202012Validator.check_schema(schema)
          validator.validate(fixture)
          validator.validate(certified)
          assert fixture["record_status"] == "synthetic_fixture_only"
          assert fixture["provenance"]["physical_execution_authorized"] is False
          assert certified["response_scope"]["coverage_kind"] == "certified_global"
          assert certified["response_scope"]["global_normalized_error_bound"] == 0.75
          invalid_physical = json.loads(json.dumps(fixture))
          invalid_physical["record_status"] = "physical_measurement"
          invalid_physical["provenance"]["physical_execution_authorized"] = True
          assert not validator.is_valid(invalid_physical)
          print("kird_schema_validation=PASS")
          PY

      - name: Validate topology-aware lifting Draft 2020-12 schema and fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("${{ runner.temp }}/plasma-probe-validation/benchmarks/plasma/topology-lifting")
          schema = json.loads((root / "boundary-lift-contract-v0.1.schema.json").read_text())
          fixture = json.loads((root / "fixtures/topology-lift-known-answer-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          periodic, opened = fixture["cases"]
          assert periodic["boundary"]["kind"] == "periodic"
          assert periodic["physical_domain"]["topology"] == "torus"
          assert periodic["physical_domain"]["maximum"] > periodic["physical_domain"]["minimum"]
          assert periodic["coordinate_convention"]["wrap_modulo_one"] is True
          assert periodic["lift"]["family"] == "periodic_fourier_characters"
          assert periodic["lift"]["raw_coordinate_included"] is False
          assert periodic["lift"]["max_harmonic"] <= 4096
          assert opened["boundary"]["kind"] == "open"
          assert opened["physical_domain"]["topology"] == "interval"
          assert opened["physical_domain"]["maximum"] > opened["physical_domain"]["minimum"]
          assert opened["coordinate_convention"]["wrap_modulo_one"] is False
          assert opened["lift"]["family"] == "open_boundary_distances"
          assert opened["lift"]["raw_coordinate_included"] is True
          assert opened["lift"]["boundary_distances_included"] is True
          assert fixture["claim_boundary"]["no_physical_plasma_run"] is True

          measure_schema = json.loads((root / "weighted-fourier-measure-v0.1.schema.json").read_text())
          measure = json.loads((root / "fixtures/weighted-fourier-measure-known-answer-v0.1.json").read_text())
          Draft202012Validator.check_schema(measure_schema)
          Draft202012Validator(measure_schema).validate(measure)
          assert len(measure["positions"]) == len(measure["weights"])
          assert len(measure["positions"]) * measure["max_harmonic"] <= 16_777_216
          assert sum(measure["weights"]) > 0
          assert len(measure["expected_normalized_complex_moments"]) == measure["max_harmonic"]
          assert measure["claim_boundary"]["finite_fourier_band_is_not_injective"] is True

          tail_schema = json.loads((root / "weighted-measure-tail-stability-v0.1.schema.json").read_text())
          tail = json.loads((root / "fixtures/weighted-measure-tail-stability-v0.1.json").read_text())
          Draft202012Validator.check_schema(tail_schema)
          Draft202012Validator(tail_schema).validate(tail)
          assert len(tail["base_positions"]) == len(tail["base_weights"])
          assert len(tail["augmented_positions"]) == len(tail["augmented_weights"])
          assert tail["augmented_positions"][:-1] == tail["base_positions"]
          assert abs(sum(tail["base_weights"]) - 1.0) < 1e-12
          assert abs(tail["augmented_weights"][-1] - tail["outlier_mass"]) < 1e-24
          epsilon = tail["outlier_mass"]
          bound = 2 * epsilon / (1 + epsilon)
          assert abs(bound - tail["mathematical_bound"]["expected_upper_bound"]) < 1e-24
          assert tail["claim_boundary"]["low_mass_does_not_imply_dynamically_irrelevant"] is True
          print("topology_lift_schema_validation=PASS")
          print("weighted_fourier_measure_schema_validation=PASS")
          print("weighted_measure_tail_stability_validation=PASS")
          PY

      - name: Validate KIRR pulse graph schema and sequence constraints
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("${{ runner.temp }}/plasma-probe-validation/benchmarks/plasma/kinetic-information-return")
          schema = json.loads((root / "kinetic-pulse-graph-v0.1.schema.json").read_text())
          fixture = json.loads((root / "fixtures/kinetic-pulse-graph-known-answer-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          assert fixture["cohort"]["collision_model"] == "collisionless"
          assert fixture["cohort"]["boundary_topology"] == "periodic_torus"
          paths = {path["path_id"]: path for path in fixture["paths"]}
          assert len(paths) == 3
          assert len(paths["baseline-no-intervention"]["pulses"]) == 0
          assert len(paths["two-pulse-echo-anchor"]["pulses"]) == 2
          assert len(paths["three-pulse-cascade"]["pulses"]) == 3
          for path in fixture["paths"]:
              times = [pulse["application_time"] for pulse in path["pulses"]]
              assert times == sorted(times)
              assert all(time < path["observation_end_time"] for time in times)
              assert path["observation_end_time"] <= fixture["cohort"]["maximum_time"]
              assert len({pulse["pulse_id"] for pulse in path["pulses"]}) == len(path["pulses"])
          assert fixture["claim_boundary"]["no_vlasov_solver_executed"] is True
          assert fixture["claim_boundary"]["no_echo_response_measured"] is True
          print("kinetic_information_return_pulse_graph_validation=PASS")

          response_schema = json.loads((root / "path-response-signature-v0.1.schema.json").read_text())
          response_fixture = json.loads((root / "fixtures/path-response-dispositions-v0.1.json").read_text())
          Draft202012Validator.check_schema(response_schema)
          Draft202012Validator(response_schema).validate(response_fixture)
          assert len(response_fixture["cases"]) == 5
          expected_dispositions = {case["expected_disposition"] for case in response_fixture["cases"]}
          assert expected_dispositions == {"PASS", "FAIL", "UNKNOWN", "UNSUPPORTED"}
          path_map = {path["path_id"]: path for path in fixture["paths"]}
          for case in response_fixture["cases"]:
              path = path_map[case["sequence_path_id"]]
              final_pulse_time = max(
                  [pulse["application_time"] for pulse in path["pulses"]],
                  default=0.0,
              )
              assert case["observation_end_time"] == path["observation_end_time"]
              for signature_name in ("reference_signature", "candidate_signature"):
                  signature = case[signature_name]
                  assert signature["contract_id"]
                  assert signature["qoi_ids"] and len(signature["qoi_ids"]) == len(signature["qoi_scales"])
                  assert all(scale > 0 for scale in signature["qoi_scales"])
                  assert signature["time_samples"] == sorted(signature["time_samples"])
                  assert all(final_pulse_time <= time <= case["observation_end_time"] for time in signature["time_samples"])
                  expected_entries = len(signature["qoi_ids"]) * len(signature["time_samples"])
                  assert len(signature["responses"]) == expected_entries
                  assert len(signature["branch_ids"]) == expected_entries
          assert response_fixture["claim_boundary"]["no_solver_run"] is True
          assert response_fixture["claim_boundary"]["no_echo_measured"] is True
          print("kinetic_path_response_dispositions_validation=PASS")

          ledger_schema = json.loads((root / "operation-ledger-v0.1.schema.json").read_text())
          ledger_fixture = json.loads((root / "fixtures/operation-ledger-known-answer-v0.1.json").read_text())
          Draft202012Validator.check_schema(ledger_schema)
          ledger_validator = Draft202012Validator(ledger_schema)
          ledger_validator.validate(ledger_fixture)
          assert len(ledger_fixture["ledgers"]) == 2
          for ledger in ledger_fixture["ledgers"]:
              times = [event["application_time"] for event in ledger["events"]]
              assert times == sorted(times)
              assert all(0 <= time <= ledger["maximum_time"] for time in times)
              assert len({event["event_id"] for event in ledger["events"]}) == len(ledger["events"])
              for event in ledger["events"]:
                  if event["operation_class"] == "physical_collision":
                      assert ledger["physical_model"] != "collisionless_vlasov"
                      assert "physical_entropy_production" in event
                      assert "numerical_entropy_delta" not in event
                  else:
                      assert "physical_entropy_production" not in event
                  if event["declared_reversible"]:
                      assert event.get("discarded_effect_measure", 0) == 0
          invalid_collisionless = json.loads(json.dumps(ledger_fixture))
          invalid_collisionless["ledgers"][0]["events"].append(
              json.loads(json.dumps(ledger_fixture["ledgers"][1]["events"][0]))
          )
          assert not ledger_validator.is_valid(invalid_collisionless)
          invalid_numerical = json.loads(json.dumps(ledger_fixture))
          invalid_numerical["ledgers"][0]["events"][0]["physical_entropy_measure_id"] = "physical-entropy"
          invalid_numerical["ledgers"][0]["events"][0]["physical_entropy_production"] = 0.02
          assert not ledger_validator.is_valid(invalid_numerical)
          print("kinetic_operation_ledger_validation=PASS")
          PY

      - name: Validate fixed-domain particle W1 schema and known answers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("${{ runner.temp }}/plasma-probe-validation/benchmarks/plasma/measure-stability")
          schema = json.loads((root / "particle-measure-w1-v0.1.schema.json").read_text())
          fixture = json.loads((root / "fixtures/particle-measure-w1-known-answer-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          assert fixture["domain"]["topology"] == "interval"
          assert fixture["domain"]["maximum"] > fixture["domain"]["minimum"]
          assert fixture["metric"]["id"] == "wasserstein_1_interval_1d"
          cases = {case["case_id"]: case for case in fixture["cases"]}
          assert len(cases) == 4
          assert cases["permutation-is-the-same-measure"]["expected_w1"] == 0.0
          assert cases["co-located-split-merge-is-the-same-measure"]["expected_w1"] == 0.0
          assert cases["particle-count-change-preserves-weighted-measure"]["expected_w1"] == 0.0
          assert abs(cases["move-one-quarter-of-mass-by-one-tenth"]["expected_w1"] - 0.025) < 1e-15
          for case in fixture["cases"]:
              assert len(case["left"]["positions"]) == len(case["left"]["weights"])
              assert len(case["right"]["positions"]) == len(case["right"]["weights"])
              assert all(weight >= 0 for weight in case["left"]["weights"] + case["right"]["weights"])
              assert abs(sum(case["left"]["weights"]) - 1.0) < 1e-12
              assert abs(sum(case["right"]["weights"]) - 1.0) < 1e-12
          assert fixture["claim_boundary"]["not_a_global_stability_certificate"] is True
          print("particle_measure_w1_schema_validation=PASS")

          torus_schema = json.loads((root / "particle-measure-torus-w1-v0.1.schema.json").read_text())
