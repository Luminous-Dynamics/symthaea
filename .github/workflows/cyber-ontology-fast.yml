# Focused raw-head qualification for the versioned cyber ontology bridge.
#
# This workflow is additive. It proves package-focused properties of the exact
# PR head; repository-wide CI remains the integration authority and may evaluate
# a distinct GitHub synthetic merge subject.

name: Cyber Ontology Fast Lane

on:
  pull_request:
    paths:
      - 'crates/domains/symthaea-cyber-ontology/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cyber-ontology-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  QUALIFICATION_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  EVENT_SHA: ${{ github.sha }}

jobs:
  cyber-ontology:
    name: symthaea-cyber-ontology raw-head qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact raw-head subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind qualification subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$QUALIFICATION_HEAD_SHA" ]]; then
            echo "ERROR: checked-out subject $actual_head != declared raw head $QUALIFICATION_HEAD_SHA" >&2
            exit 1
          fi

          lock_digest="$(sha256sum Cargo.lock | awk '{print $1}')"
          manifest_digest="$(sha256sum crates/domains/symthaea-cyber-ontology/Cargo.toml | awk '{print $1}')"
          workflow_digest="$(sha256sum .github/workflows/cyber-ontology-fast.yml | awk '{print $1}')"

          echo "actual_head=$actual_head" >> "$GITHUB_OUTPUT"
          echo "lock_digest=$lock_digest" >> "$GITHUB_OUTPUT"
          echo "manifest_digest=$manifest_digest" >> "$GITHUB_OUTPUT"
          echo "workflow_digest=$workflow_digest" >> "$GITHUB_OUTPUT"

          echo "Qualification subject (raw head): $actual_head"
          echo "PR base subject: ${QUALIFICATION_BASE_SHA:-n/a}"
          echo "GitHub event SHA: $EVENT_SHA"
          echo "Cargo.lock SHA-256: $lock_digest"
          echo "Cyber manifest SHA-256: $manifest_digest"
          echo "Workflow SHA-256: $workflow_digest"

          {
            echo "## Cyber Ontology Fast Lane qualification subject"
            echo
            echo "- Raw head: \`$actual_head\`"
            echo "- PR base: \`${QUALIFICATION_BASE_SHA:-n/a}\`"
            echo "- Event SHA: \`$EVENT_SHA\`"
            echo "- Cargo.lock SHA-256: \`$lock_digest\`"
            echo "- cyber-ontology Cargo.toml SHA-256: \`$manifest_digest\`"
            echo "- Workflow SHA-256: \`$workflow_digest\`"
            echo "- Subject class: **raw PR head / package-focused**"
            echo "- Integration/full-repository qualification: **not implied by this lane**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare PR base for governance comparison
        id: base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          actual_base="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          if [[ "$actual_base" != "$QUALIFICATION_BASE_SHA" ]]; then
            echo "ERROR: fetched base $actual_base != event base $QUALIFICATION_BASE_SHA" >&2
            exit 1
          fi

      - name: Governance check
        id: governance
        if: github.event_name == 'pull_request'
        run: bash scripts/check-class-a-changes.sh --ci

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Record toolchain
        id: toolchain-info
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -V
          echo "rustc_version=$(rustc -V | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "cargo_version=$(cargo -V | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Cache focused Cargo state
        id: cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cyber-ontology-fast
          key: ${{ runner.os }}-cyber-ontology-fast-${{ hashFiles('Cargo.lock', 'crates/domains/symthaea-cyber-ontology/Cargo.toml', 'crates/domains/symthaea-support/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cyber-ontology-fast-

      - name: Format cyber ontology
        id: format
        continue-on-error: true
        run: cargo fmt -p symthaea-cyber-ontology -- --check

      - name: Compile exact support dependency surface
        id: support-check
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: target/cyber-ontology-fast
        run: cargo check --locked -p symthaea-support --all-targets

      - name: Test cyber ontology
        id: tests
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: target/cyber-ontology-fast
        run: cargo test --locked -p symthaea-cyber-ontology --all-targets

      - name: Clippy cyber ontology
        id: clippy
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: target/cyber-ontology-fast
        run: cargo clippy --locked -p symthaea-cyber-ontology --all-targets -- -D warnings

      - name: Verify tracked source immutability and subject binding
        id: immutability
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_HEAD_SHA"
          if ! git diff --quiet -- .; then
            echo "ERROR: qualification steps modified tracked source files" >&2
            git diff -- .
            exit 1
          fi
          echo "Raw-head subject remained bound to $QUALIFICATION_HEAD_SHA"

      - name: Write machine-readable qualification receipt
        id: receipt
        if: always()
        env:
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
          BASE_OUTCOME: ${{ steps.base.outcome }}
          GOVERNANCE_OUTCOME: ${{ steps.governance.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          TOOLCHAIN_INFO_OUTCOME: ${{ steps.toolchain-info.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          SUPPORT_CHECK_OUTCOME: ${{ steps.support-check.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          IMMUTABILITY_OUTCOME: ${{ steps.immutability.outcome }}
          LOCK_DIGEST: ${{ steps.subject.outputs.lock_digest }}
          MANIFEST_DIGEST: ${{ steps.subject.outputs.manifest_digest }}
          WORKFLOW_DIGEST: ${{ steps.subject.outputs.workflow_digest }}
          RUSTC_VERSION: ${{ steps.toolchain-info.outputs.rustc_version }}
          CARGO_VERSION: ${{ steps.toolchain-info.outputs.cargo_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/cyber-ontology-fast/qualification
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required_names = ["format", "support_check", "tests", "clippy", "immutability"]
          outcomes = {
              "subject_binding": os.environ.get("SUBJECT_OUTCOME", "unknown"),
              "base_binding": os.environ.get("BASE_OUTCOME", "unknown"),
              "governance": os.environ.get("GOVERNANCE_OUTCOME", "unknown"),
              "toolchain_install": os.environ.get("TOOLCHAIN_OUTCOME", "unknown"),
              "toolchain_info": os.environ.get("TOOLCHAIN_INFO_OUTCOME", "unknown"),
              "cache": os.environ.get("CACHE_OUTCOME", "unknown"),
              "format": os.environ.get("FORMAT_OUTCOME", "unknown"),
              "support_check": os.environ.get("SUPPORT_CHECK_OUTCOME", "unknown"),
              "tests": os.environ.get("TESTS_OUTCOME", "unknown"),
              "clippy": os.environ.get("CLIPPY_OUTCOME", "unknown"),
              "immutability": os.environ.get("IMMUTABILITY_OUTCOME", "unknown"),
          }
          required = [outcomes[name] for name in required_names]
          qualification = "PASS" if all(v == "success" for v in required) else "NOT_ESTABLISHED"

          receipt = {
              "schema_version": "symthaea-ci-qualification-receipt-v1",
              "qualification_status": qualification,
              "subject": {
                  "class": "raw_pr_head_package_focused",
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "head_sha": os.environ.get("QUALIFICATION_HEAD_SHA"),
                  "base_sha": os.environ.get("QUALIFICATION_BASE_SHA") or None,
                  "event_sha": os.environ.get("EVENT_SHA"),
                  "head_ref": os.environ.get("GITHUB_HEAD_REF") or None,
                  "base_ref": os.environ.get("GITHUB_BASE_REF") or None,
              },
              "run": {
                  "workflow": os.environ.get("GITHUB_WORKFLOW"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              },
              "digests": {
                  "cargo_lock_sha256": os.environ.get("LOCK_DIGEST") or None,
                  "package_manifest_sha256": os.environ.get("MANIFEST_DIGEST") or None,
                  "workflow_sha256": os.environ.get("WORKFLOW_DIGEST") or None,
              },
              "toolchain": {
                  "policy": "Rust 1.96.0",
                  "rustc": os.environ.get("RUSTC_VERSION") or None,
                  "cargo": os.environ.get("CARGO_VERSION") or None,
              },
              "gates": outcomes,
              "scope": {
                  "package": "symthaea-cyber-ontology",
                  "support_dependency_compiled": True,
                  "full_repository_integration_implied": False,
              },
          }

          path = Path("target/cyber-ontology-fast/qualification/receipt.json")
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(path.read_text())
          PY

          qualification="$(python3 -c 'import json; print(json.load(open("target/cyber-ontology-fast/qualification/receipt.json"))["qualification_status"])')"
          {
            echo
            echo "## Structured qualification result"
            echo
            echo "- Qualification status: **$qualification**"
            echo "- Receipt schema: \`symthaea-ci-qualification-receipt-v1\`"
            echo "- Individual gate outcomes are retained in the receipt; this status is not a universal security verdict."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload qualification receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cyber-ontology-qualification-${{ env.QUALIFICATION_HEAD_SHA }}
          path: target/cyber-ontology-fast/qualification/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce required qualification gates
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          SUPPORT_CHECK_OUTCOME: ${{ steps.support-check.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          IMMUTABILITY_OUTCOME: ${{ steps.immutability.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for outcome in \
            "$FORMAT_OUTCOME" \
            "$SUPPORT_CHECK_OUTCOME" \
            "$TESTS_OUTCOME" \
            "$CLIPPY_OUTCOME" \
            "$IMMUTABILITY_OUTCOME" \
            "$RECEIPT_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Required raw-head qualification gates are not all successful." >&2
            exit 1
          fi
