name: CMAQ-002 closed-loop evaluator

on:
  pull_request:
    paths:
      - 'research/cmaq-002/**'
      - '.github/workflows/cmaq-002-closed-loop.yml'
  push:
    paths:
      - 'research/cmaq-002/**'
      - '.github/workflows/cmaq-002-closed-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-loop-evaluator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/cmaq-002
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Unit tests
        run: cargo test --locked
      - name: Known-answer smoke fixture
        run: |
          cargo run --locked -- --environment fixtures/environment.tsv --model fixtures/model-exact.tsv --support fixtures/support.tsv --starts fixtures/starts.tsv > /tmp/cmaq-002-actual.tsv
          diff -u fixtures/expected.tsv /tmp/cmaq-002-actual.tsv
