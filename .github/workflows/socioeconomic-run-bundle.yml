name: Socioeconomic Run Bundle Integrity

on:
  pull_request:
    paths:
      - "scripts/validate_socioeconomic_run_bundle.py"
      - "scripts/test_validate_socioeconomic_run_bundle.py"
      - "scripts/write_socioeconomic_run_bundle_ci_report.py"
      - "scripts/test_write_socioeconomic_run_bundle_ci_report.py"
      - "docs/research/finance/SYM-FIN-SYS-016_run_bundle_manifest_v1.schema.json"
      - "docs/research/finance/SYM-FIN-SYS-016_validator_execution_record_v1.schema.json"
      - "docs/research/finance/SYM-FIN-SYS-016_RUN_BUNDLE_V1.md"
      - ".github/workflows/socioeconomic-run-bundle.yml"
  push:
    branches:
      - "**"
    paths:
      - "scripts/validate_socioeconomic_run_bundle.py"
      - "scripts/test_validate_socioeconomic_run_bundle.py"
      - "docs/research/finance/SYM-FIN-SYS-016_run_bundle_manifest_v1.schema.json"
      - "docs/research/finance/SYM-FIN-SYS-016_RUN_BUNDLE_V1.md"
      - ".github/workflows/socioeconomic-run-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: socioeconomic-run-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-bundle-tests:
    name: Exact-head run-bundle negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 immutable commit
      - name: Record exact revision
        run: |
          printf 'repository=%s\n' "$GITHUB_REPOSITORY"
          printf 'sha=%s\n' "$GITHUB_SHA"
          git status --short
      - name: Run standard-library adversarial tests
        run: |
          set -o pipefail
          mkdir -p evidence
          python3 scripts/test_validate_socioeconomic_run_bundle.py 2>&1 | tee evidence/test-output.txt
          python3 scripts/test_write_socioeconomic_run_bundle_ci_report.py 2>&1 | tee -a evidence/test-output.txt
      - name: Write exact-head execution record
        run: |
          python3 scripts/write_socioeconomic_run_bundle_ci_report.py \
            --root . \
            --test-log evidence/test-output.txt \
            --output evidence/qualification-report.json
      - name: Validate execution record schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("docs/research/finance/SYM-FIN-SYS-016_validator_execution_record_v1.schema.json").read_text())
          report = json.loads(Path("evidence/qualification-report.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema).iter_errors(report), key=lambda error: list(error.absolute_path))
          if errors:
              for error in errors:
                  print(f"FAIL: {list(error.absolute_path)}: {error.message}")
              raise SystemExit(1)
          print("PASS: execution record satisfies the versioned schema")
          PY
      - name: Upload exact-head test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: socioeconomic-run-bundle-qualification
          path: evidence/
          if-no-files-found: error
      - name: Sign qualification report with GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: evidence/qualification-report.json
          predicate-type: https://luminousdynamics.io/attestations/socioeconomic-run-bundle-validation/v1
          predicate-path: evidence/qualification-report.json
