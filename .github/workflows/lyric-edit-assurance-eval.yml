name: Lyric edit assurance evaluator

on:
  pull_request:
    paths:
      - "tools/lyric-edit-assurance-eval/**"
      - "docs/research/LYRIC_EDIT_ASSURANCE_BENCHMARK_V1.md"
      - ".github/workflows/lyric-edit-assurance-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lyric-edit-assurance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "LYRIC_EDIT_ASSURANCE_REVISION=$actual" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format-check the standalone evaluator
        run: cargo +1.96.0 fmt --check --manifest-path tools/lyric-edit-assurance-eval/Cargo.toml

      - name: Generate isolated lockfile
        run: cargo +1.96.0 generate-lockfile --manifest-path tools/lyric-edit-assurance-eval/Cargo.toml

      - name: Run positive, negative and denominator controls
        run: cargo +1.96.0 test --locked --manifest-path tools/lyric-edit-assurance-eval/Cargo.toml
