name: Interaction Core V1 Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/interaction-core-v1-qualification.yml'
      - 'crates/core/symthaea-interaction-core/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interaction-core-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  interaction-core-v1:
    name: Exact-head interaction core v1
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR head identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Record clean source baseline
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

      - name: Enforce pure-core dependency and source ratchets
        run: |
          set -euo pipefail
          MANIFEST=crates/core/symthaea-interaction-core/Cargo.toml
          SOURCE=crates/core/symthaea-interaction-core/src/lib.rs

          grep -Fq 'sha2 = { workspace = true }' "${MANIFEST}"
          if grep -Eiq 'reqwest|hyper|tokio|holochain|hdk|hdi|web3|ethers|alloy|kube|rmcp|a2a|keyring|secret-service' "${MANIFEST}"; then
            echo 'protocol/runtime/secret dependency leaked into pure interaction core' >&2
            exit 1
          fi

          grep -Fq 'symthaea.interaction.resource.v1\0' "${SOURCE}"
          grep -Fq 'symthaea.interaction.intent.v1\0' "${SOURCE}"
          grep -Fq 'OutcomeUnknown' "${SOURCE}"
          if grep -Eq 'serde_json::to_|bincode|postcard|rmp_serde|std::net|std::fs|std::process|Command::new' "${SOURCE}"; then
            echo 'serializer/runtime I/O leaked into semantic identity core' >&2
            exit 1
          fi
          if grep -Eq 'impl[[:space:]]+From<ExternalObservation|impl[[:space:]]+Into<.*Authority' "${SOURCE}"; then
            echo 'observation-to-authority implicit conversion is forbidden' >&2
            exit 1
          fi

      - name: Independent canonical commitment oracle
        run: |
          set -euo pipefail
          python3 crates/core/symthaea-interaction-core/scripts/interaction_oracle.py

      - name: Format
        run: |
          set -euo pipefail
          cargo fmt -p symthaea-interaction-core -- --check

      - name: Resolve candidate and execute focused gates
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check -p symthaea-interaction-core --all-targets
          cargo test -p symthaea-interaction-core
          cargo clippy -p symthaea-interaction-core --all-targets -- -D warnings
          if ! cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock requires committed reconciliation:' >&2
            diff -u /tmp/Cargo.lock.before Cargo.lock || true
            exit 1
          fi

      - name: Locked replay
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-interaction-core --all-targets
          cargo test --locked -p symthaea-interaction-core
          cargo clippy --locked -p symthaea-interaction-core --all-targets -- -D warnings

      - name: Prove qualification did not mutate source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
