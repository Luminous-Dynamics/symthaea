name: NixWard × CMAQ-020 query-sufficient adapter

on:
  pull_request:
    paths:
      - "crates/core/nixward/src/mind/world_model.rs"
      - "crates/core/nixward/src/mind/mod.rs"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.lock"
      - "research/cmaq-020/**"
      - ".github/workflows/nixward-cmaq-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nixward-cmaq-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check changed Rust formatting
        run: rustfmt +1.100.0 --check --edition 2024 crates/core/nixward/src/mind/world_model.rs crates/core/nixward/src/mind/mod.rs
      - name: Run NixWard and CMAQ adapter tests
        run: cargo +1.100.0 test --locked -p nixward --lib "mind::world_model"
      - name: Run standalone CMAQ evaluator tests
        working-directory: research/cmaq-020
        run: cargo +1.100.0 test --locked
      - name: Run strict NixWard library Clippy
        run: cargo +1.100.0 clippy --locked -p nixward --lib -- -D warnings
