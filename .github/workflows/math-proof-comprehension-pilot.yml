  mathlib-source-snapshot-differential:
    name: Mathlib v4.29 versus v4.37 direct dependency differential
    needs: [mathlib-elaborated-extraction, mathlib-v429-direct-edge-cohort]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download v4.29.0 extraction artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mathlib-v429-lean-graph-compatible-direct-dependencies
          path: artifacts/mathlib-v429

      - name: Download v4.37.0 extraction artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mathlib-elaborated-dependency-graphs
          path: artifacts/mathlib-v437

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      - name: Run source-snapshot differential
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path scripts/research/proof-plan-contract/Cargo.toml --bin source-snapshot-diff -- \
            artifacts/mathlib-v429 artifacts/mathlib-v437 > "$RUNNER_TEMP/mathlib-source-snapshot-diff.json"
          jq -e '.schema_version == "1.0.0"
            and .comparison_kind == "mathlib_source_snapshot_direct_dependency_differential"
            and .source_revisions_differ == true
            and .lean_toolchains_differ == true
            and (.declarations | length) == 4
            and all(.declarations[]; .baseline_value_kind == "theorem_proof" and .candidate_value_kind == "theorem_proof")
            and ([.declarations[] | select(.classification == "identical_type_value_and_closure_sets")] | length) == 2
            and ([.declarations[] | select(.declaration == "Nat.choose_pos" and .classification == "stable_type_interface_value_drift" and .type_dependencies.jaccard == 1)] | length) == 1
            and ([.declarations[] | select(.declaration == "Nat.choose_pos" and .helper_expansion_explains_direct_drift == true and .helper_expanded_value_dependencies.jaccard >= 0.9 and .value_dependencies.jaccard < 0.5 and .proof_value_dependencies.jaccard < 0.5)] | length) == 1
            and ([.declarations[] | select(.declaration == "Set.countable_union" and .classification == "type_and_or_closure_dependency_drift")] | length) == 1
            and ([.declarations[] | select(.baseline_closure_reconciles == false or .candidate_closure_reconciles == false or .baseline_unresolved_count != 0 or .candidate_unresolved_count != 0)] | length) == 0
            and ([.declarations[] | select(.declaration == "Nat.choose_pos" and (.helper_nodes_baseline | length) > 0 and (.helper_nodes_candidate | length) > 0)] | length) == 1' \
            "$RUNNER_TEMP/mathlib-source-snapshot-diff.json" >/dev/null
          cat "$RUNNER_TEMP/mathlib-source-snapshot-diff.json" >> "$GITHUB_STEP_SUMMARY"
          echo "MATHLIB_SOURCE_SNAPSHOT_DIFFERENTIAL_PASS"

      - name: Preserve source-snapshot differential
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mathlib-source-snapshot-differential
          path: ${{ runner.temp }}/mathlib-source-snapshot-diff.json
          if-no-files-found: error

      - name: Export generated Cargo.lock for dependency pinning
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-plan-contract-cargo-lock-bootstrap
          path: scripts/research/proof-plan-contract/Cargo.lock
          if-no-files-found: error
