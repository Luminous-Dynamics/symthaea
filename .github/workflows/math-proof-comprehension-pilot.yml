name: Math Proof Comprehension Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research/proof_comprehension_oracle.rs"
      - "scripts/research/proof-plan-contract/**"
      - "scripts/research/lean-proof-extractor/**"
      - "docs/research/MATHLIB_ELABORATED_DEPENDENCY_GRAPH_V1.schema.json"
      - "docs/research/MATHLIB_ELABORATED_DEPENDENCY_GRAPH_V429_V1.schema.json"
      - "docs/research/PROOF_PLAN_*.json"
      - "docs/research/LOCAL_GLOBAL_PAIR_*"
      - "docs/research/MATH_METAMORPHIC_*"
      - "docs/research/MATH_SCOPE_EQUIVALENCE_TIER1_V1.*"
      - "docs/research/MATH_SCOPE_EQUIVALENCE_TIER2_AND_COMM_V1.*"
      - "docs/research/MATH_HARDMODE_*"
      - "docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.*"
      - "docs/research/PROOF_PLAN_*.md"
      - "docs/research/MATH_PROOF_COMPREHENSION_*.json"
      - "docs/research/MATHLIB_PROOF_COMPREHENSION_PILOT_V1.*"
      - "docs/research/ETH_REDUCTION_COMPREHENSION_TOY_V1.*"
      - "docs/research/RH_PROOF_GRAPH_BASELINE_V1.*"
      - "docs/research/RH_MAIN_INEQUALITY_M_MAP_V1.*"
      - "docs/research/MATH_PROOF_COMPREHENSION_COMPETITIVE_LEDGER_V1.md"
      - "docs/research/MATH_PROOF_COMPREHENSION_HUMAN_STUDY_PREREG_V1.md"
      - "docs/research/README.md"
      - ".github/workflows/math-proof-comprehension-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          components: rustfmt

      - name: Record exact execution identity
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          rustc --version
          rustfmt --version

      - name: Check Rust formatting
        run: rustfmt --edition 2021 --check scripts/research/proof_comprehension_oracle.rs

      - name: Compile and run dependency-free finite oracle
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/proof-comprehension-oracle"
          rustc --edition=2021 --test -D warnings scripts/research/proof_comprehension_oracle.rs -o "$bin"
          "$bin"

      - name: Parse and assert frozen pilot fixtures
        shell: bash
        run: |
          set -euo pipefail
          set -x
          files=(
            docs/research/MATH_PROOF_COMPREHENSION_PILOT_V1.json
            docs/research/MATH_PROOF_COMPREHENSION_PILOT_V1.schema.json
            docs/research/PROOF_PLAN_V1.schema.json
            docs/research/PROOF_PLAN_AND_COMM_V1.json
            docs/research/PROOF_PLAN_MUTATION_FIXTURES_V1.schema.json
            docs/research/PROOF_PLAN_MUTATION_FIXTURES_V1.json
            docs/research/LOCAL_GLOBAL_PAIR_V1.schema.json
            docs/research/LOCAL_GLOBAL_PAIR_SYNTHETIC_V1.json
            docs/research/MATH_METAMORPHIC_PAIR_V1.schema.json
            docs/research/MATH_METAMORPHIC_PAIR_V1.json
            docs/research/MATH_SCOPE_EQUIVALENCE_TIER1_V1.schema.json
            docs/research/MATH_SCOPE_EQUIVALENCE_TIER1_V1.json
            docs/research/MATH_SCOPE_EQUIVALENCE_TIER2_AND_COMM_V1.schema.json
            docs/research/MATH_SCOPE_EQUIVALENCE_TIER2_AND_COMM_V1.json
            docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.schema.json
            docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.json
            docs/research/MATH_PROOF_COMPREHENSION_THEOREM_SANDWICH_V1.schema.json
            docs/research/MATH_PROOF_COMPREHENSION_THEOREM_SANDWICH_V1.json
            docs/research/MATH_PROOF_COMPREHENSION_RECEIPT_V1.schema.json
            docs/research/MATHLIB_PROOF_COMPREHENSION_PILOT_V1.json
            docs/research/MATHLIB_PROOF_COMPREHENSION_PILOT_V1.schema.json
            docs/research/MATHLIB_ELABORATED_DEPENDENCY_GRAPH_V1.schema.json
            docs/research/MATHLIB_ELABORATED_DEPENDENCY_GRAPH_V429_V1.schema.json
            docs/research/ETH_REDUCTION_COMPREHENSION_TOY_V1.json
            docs/research/RH_PROOF_GRAPH_BASELINE_V1.json
            docs/research/RH_MAIN_INEQUALITY_M_MAP_V1.json
            docs/research/RH_MAIN_INEQUALITY_M_MAP_V1.schema.json
          )
          for file in "${files[@]}"; do
            jq -e . "$file" >/dev/null
          done

          jq -e '.candidate.statement_context == []
            and .evaluator_only.target_statement_context == []
            and (.evaluator_only.translation_reviews | length) == 2
            and ([.evaluator_only.translation_reviews[].reviewer_id] | unique | length) == 2
            and all(.evaluator_only.translation_reviews[]; .disposition == "aligned" and (.evidence_refs | length) > 0)
            and ([.evaluator_only.translation_reviews[].evidence_refs[]] | unique | length) == 2
            and (.evaluator_only | has("translation_assessment") | not)
            and (.evaluator_only | has("translation_assessor") | not)
            and (.evaluator_only | has("translation_review_refs") | not)' \
            docs/research/MATH_PROOF_COMPREHENSION_THEOREM_SANDWICH_V1.json >/dev/null
          jq -e '.schema_version == "1.0.0" and .candidate.task.task_id == "HARDMODE-IMPLICATION-REVERSAL-001" and .candidate.task.task_variant == "no_answer" and .candidate.task.visible_answer == null and .evaluator_only.proof_status == "not_run"' docs/research/MATH_HARDMODE_SYNTHETIC_V1.json >/dev/null
          echo "HARD_MODE_FIXTURE_PASS"
          echo "THEOREM_SANDWICH_FIXTURE_PASS"

          jq -e '.task_count == (.tasks | length) and .task_count == 6 and .status == "source_pinned_seed_not_gold"' \
            docs/research/MATH_PROOF_COMPREHENSION_PILOT_V1.json >/dev/null

          jq -e '.task_count == (.tasks | length) and .task_count == 4 and .status == "source_pinned_seed_not_gold"' \
            docs/research/MATHLIB_PROOF_COMPREHENSION_PILOT_V1.json >/dev/null
          jq -e '.source_snapshot.lean_toolchain == "leanprover/lean4:v4.37.0-rc1"
            and .source_snapshot.lean_core_revision == "0b77e12952ad39077d80d8bd6b66d601f225c321"
            and .source_snapshot.lean_core_commit_url == "https://github.com/leanprover/lean4/commit/0b77e12952ad39077d80d8bd6b66d601f225c321"' \
            docs/research/MATHLIB_PROOF_COMPREHENSION_PILOT_V1.json >/dev/null

          jq -e '.finite_oracle.source_satisfying_assignments == 5
            and .finite_oracle.correct_encoded_satisfying_assignments == 5
            and .finite_oracle.mutated_encoded_satisfying_assignments == 6
            and .finite_oracle.decision_equivalence_correct == true
            and .finite_oracle.decision_equivalence_mutated == true
            and .finite_oracle.unique_extension_correct == true
            and .finite_oracle.unique_extension_mutated == false' \
            docs/research/ETH_REDUCTION_COMPREHENSION_TOY_V1.json >/dev/null

          jq -e '.upstream.revision == "70fbb2fc21fed8de3c02d9f6df0b6067bf22e879"
            and .upstream.dataset_version == "0.2.1"
            and .upstream.license == "CC0-1.0"' \
            docs/research/RH_PROOF_GRAPH_BASELINE_V1.json >/dev/null

          jq -e '.source_identity.revision == "40e56bab026552e089d7afcfeff08d2defb9c005"
            and (.proof_bridge | any(.declarations | index("each_unit_bound_statement")))
            and (.proof_bridge | any(.declarations | index("Deduction.ch_top")))
            and (.explicit_non_used_or_ambiguous | any(.declaration == "MeanBoundSecondForm"))' \
            docs/research/RH_MAIN_INEQUALITY_M_MAP_V1.json >/dev/null

          jq -e '.finite_translation_oracle.group_sizes == [2,3,4,5,6]
            and .finite_translation_oracle.group_target_cases == 620
            and .finite_translation_oracle.row_indicator_cases == 1240
            and .finite_translation_oracle.product_group_target_cases == 66447
            and .finite_translation_oracle.product_group_row_indicator_cases == 132894
            and .finite_translation_oracle.total_group_target_cases == 67067
            and .finite_translation_oracle.total_row_indicator_cases == 134134
            and .finite_translation_oracle.status == "passed_exact_head_ci"
            and .finite_translation_oracle.ci_receipt.tested_pr_head == "861db995fc80aa52c3339233fd6ce0cec0168458"
            and .finite_translation_oracle.ci_receipt.workflow_run_id == 45075362857
            and .finite_translation_oracle.ci_receipt.rust_tests_passed == 11
            and .finite_translation_oracle.ci_receipt.rust_tests_failed == 0
            and .finite_translation_oracle.ci_receipt.conclusion == "success"' \
            docs/research/RH_MAIN_INEQUALITY_M_MAP_V1.json >/dev/null

          echo "RH_PROOF_GRAPH_AND_M_MAP_FIXTURES_PASS"
          test -s docs/research/MATH_PROOF_COMPREHENSION_COMPETITIVE_LEDGER_V1.md
          test -s docs/research/MATH_PROOF_COMPREHENSION_HUMAN_STUDY_PREREG_V1.md
          grep -F "No human study has been run" docs/research/MATH_PROOF_COMPREHENSION_HUMAN_STUDY_PREREG_V1.md >/dev/null
          echo "HUMAN_STUDY_STATUS_FIXTURE_PASS"
          grep -F "Scores and budgets are not directly comparable" docs/research/MATH_PROOF_COMPREHENSION_COMPETITIVE_LEDGER_V1.md >/dev/null
          echo "COMPETITIVE_LEDGER_STATUS_FIXTURE_PASS"
          jq -e '.schema_version == "1.0.0"
            and .status == "source_pinned_provisional"
            and .theorem.elaborated_type_sha256 == null
            and .environment.status == "source_only"
            and .validation.lean_kernel_status == "not_run"
            and (.nodes | length) == 8
            and (.edges | length) == 8' \
            docs/research/PROOF_PLAN_AND_COMM_V1.json >/dev/null
          echo "PROOF_PLAN_FIXTURE_PASS"

          jq -e '.schema_version == "1.0.0"
            and (.cases | length) == 6
            and ([.cases[] | select(.id == "MUT-ROUTE-ONLY" and .mathematical_disposition == "not_refuted")] | length) == 1
            and ([.cases[] | select(.id == "MUT-LOCAL-GLOBAL-CONTEXT" and .mathematical_disposition == "unknown" and .oracle_status == "not_run")] | length) == 1' \
            docs/research/PROOF_PLAN_MUTATION_FIXTURES_V1.json >/dev/null
          echo "PROOF_PLAN_MUTATION_FIXTURE_PASS"

          jq -e '.schema_version == "1.1.0"
            and .candidate.task_class == "synthetic_control_not_model_evaluation"
            and .candidate.local_stage.verdict == "reject"
            and .candidate.global_stage.scope_binding == .candidate.local_stage.scope_binding
            and .evaluator_only.eligibility == "eligible"
            and .evaluator_only.independently_assessed_warrant == "invalid"
            and .evaluator_only.global_disposition == "used_directly"
            and .evaluator_only.global_use_adjudication.disposition == .evaluator_only.global_disposition
            and .evaluator_only.global_use_adjudication.reviewed_plan_sha256 == .candidate.global_stage.proof_plan_sha256
            and .evaluator_only.global_use_adjudication.target_warrant_id == .candidate.global_stage.scope_binding.warrant_id
            and .evaluator_only.global_use_adjudication.reviewed_entire_plan == true
            and (.evaluator_only.global_use_adjudication.node_evidence | length) == 1
            and .evaluator_only.global_use_adjudication.node_evidence[0].mention_id == "MENTION-W-P-TO-Q-001"
            and .evaluator_only.global_use_adjudication.node_evidence[0].relation == "uses_as_rule"
            and .evaluator_only.global_use_adjudication.node_evidence[0].material_use == true
            and (.evaluator_only.global_use_adjudication as $g | ($g.evidence_refs | index($g.node_evidence[0].rationale_ref)) != null)
            and .candidate.local_stage.scope_binding.premises == ["(p → q)"]
            and .candidate.local_stage.scope_binding.conclusion_text == "(q → p)"
            and .candidate.local_stage.scope_binding.root_goal_text == "(q → p)"
            and .candidate.local_stage.scope_binding.warrant_text == "From (p → q) infer (q → p)."
            and .candidate.local_stage.scope_binding.finite_boolean_sequent.hypotheses == []
            and .candidate.local_stage.scope_binding.finite_boolean_sequent.premises[0].op == "implies"
            and .candidate.local_stage.scope_binding.finite_boolean_sequent.conclusion.op == "implies"
            and .candidate.local_stage.scope_binding.finite_boolean_sequent_sha256 == "13399db2f18fdaff704b4e7adda4e7e4b4be0aedfd241a409b4799c3d31dcef1"
            and .evaluator_only.finite_boolean_countermodel.valuation == [{ "atom": "p", "value": false }, { "atom": "q", "value": true }]
            and (.evaluator_only.finite_boolean_countermodel | has("premises") | not)
            and (.evaluator_only.finite_boolean_countermodel | has("conclusion") | not)' \
            docs/research/LOCAL_GLOBAL_PAIR_SYNTHETIC_V1.json >/dev/null
          echo "LOCAL_GLOBAL_PAIR_FIXTURE_PASS"

          jq -e '.schema_version == "1.0.0"
            and (.pairs | length) == 5
            and ([.pairs[].candidate.pair_id] | unique | length) == 5
            and ([.pairs[] | select(.evaluator_only.transformation_class == "semantics_preserving" and .evaluator_only.oracle_relation == "equivalent")] | length) == 2
            and ([.pairs[] | select(.evaluator_only.transformation_class == "semantics_changing" and .evaluator_only.oracle_relation == "variant_entails_base")] | length) == 1
            and ([.pairs[] | select(.evaluator_only.transformation_class == "semantics_changing" and .evaluator_only.oracle_relation == "incomparable")] | length) == 1
            and ([.pairs[] | select(.evaluator_only.transformation_class == "proof_route_only" and .evaluator_only.oracle_relation == "equivalent" and .candidate.base.sequent_sha256 == .candidate.variant.sequent_sha256)] | length) == 1' \
            docs/research/MATH_METAMORPHIC_PAIR_V1.json >/dev/null
          echo "MATH_METAMORPHIC_FIXTURE_ASSERTIONS_PASS"

          jq -e '.schema_version == "1.0.0"
            and .artifact_id == "PROOFACTION-AND-COMM-001"
            and .status == "kernel_replay_pending"
            and .plan_id == "PROOFPLAN-AND-COMM-001"
            and .environment.lean_toolchain == "leanprover/lean4:v4.37.0-rc1"
            and .environment.mathlib_revision == "6ebcce37335bcb6bca64596e5d57bb3035648030"
            and .proof_source.sha256 == "1e9eae95fbe85d3b32793c22313f8e1b67608b19fc266fb047e278663cd1ac73"
            and ([.actions[].plan_node_id] == ["A_SPLIT_IFF", "A_FORWARD", "A_REVERSE"])
            and .root_declaration.certificate_declaration == "ProofPlanActionCertificatePilot.and_comm_plan_replay"
            and (.claim_ceiling | length) >= 5
            and .negative_control.expected_result == "lean_type_error"
            and .negative_control.sha256 == "87f2c53a03395b5a614883e111a4ab8c7f734eb8d6823638ce832b3eb75d269e"' \
            docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.json >/dev/null
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"
            and .properties.status.const == "kernel_replay_pending"
            and .properties.proof_source.properties.sha256.pattern == "^[a-f0-9]{64}$"
            and .properties.actions.minItems == 3
            and .properties.actions.maxItems == 3' \
            docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.schema.json >/dev/null
          echo "PROOF_ACTION_CERTIFICATE_MANIFEST_PASS"

          jq -e '.schema_version == "1.0.0"
            and (.pairs | length) == 5
            and ([.pairs[].candidate.pair_id] | unique | length) == 5
            and .pairs[0].evaluator_only.expected_relation == "exact_identity"
            and .pairs[1].evaluator_only.expected_relation == "tier1_hypothesis_permutation_equivalent"
            and all(.pairs[2:][]; .evaluator_only.expected_relation == "not_tier1_equivalent")' \
            docs/research/MATH_SCOPE_EQUIVALENCE_TIER1_V1.json >/dev/null
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"
            and .properties.schema_version.const == "1.0.0"
            and .properties.pairs.minItems == 1
            and (."$defs".formula.oneOf | length == 6)' \
            docs/research/MATH_SCOPE_EQUIVALENCE_TIER1_V1.schema.json >/dev/null
          echo "SCOPE_EQUIVALENCE_TIER1_FIXTURES_PASS"

          jq -e '.schema_version == "1.0.0"
            and .status == "kernel_replay_pending"
            and .comparison_tier == "tier2_kernel_certified_transport"
            and .environment.mathlib_revision == "6ebcce37335bcb6bca64596e5d57bb3035648030"
            and .proof_source.sha256 == "720875c1096f615d966bb45f194a4e99ec910f1bfe1423fae4cc9390b3b19d79"
            and (.certificates | length) == 6
            and ([.certificates[].role] == ["local_context_entails_global", "global_context_entails_local", "context_equivalence", "warrant_local_to_global", "warrant_global_to_local", "warrant_transport_equivalence"])' \
            docs/research/MATH_SCOPE_EQUIVALENCE_TIER2_AND_COMM_V1.json >/dev/null
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"
            and .properties.status.const == "kernel_replay_pending"
            and .properties.certificates.minItems == 6
            and .properties.certificates.maxItems == 6' \
            docs/research/MATH_SCOPE_EQUIVALENCE_TIER2_AND_COMM_V1.schema.json >/dev/null
          echo "SCOPE_EQUIVALENCE_TIER2_MANIFEST_PASS"

      - name: Bind local action certificates to ProofPlanV1 nodes
        shell: bash
        run: |
          set -euo pipefail
          validate_mapping() {
            jq -e --slurpfile plan docs/research/PROOF_PLAN_AND_COMM_V1.json '
              . as $certificate |
              $plan[0] as $plan |
              ($certificate.plan_id == $plan.plan_id)
              and all($certificate.actions[];
                . as $action |
                any($plan.nodes[];
                  .id == $action.plan_node_id
                  and .kind == "plan_action"
                  and .action_spec.operation == $action.operation
                  and .action_spec.input_goal_ids == $action.input_goal_ids
                  and .action_spec.output_subgoal_ids == $action.output_goal_ids
                )
              )
              and ([$certificate.actions[] | .output_goal_ids[]] | sort)
                  == ([$certificate.actions[] | select(.plan_node_id != "A_SPLIT_IFF") | .input_goal_ids[]] | sort)
              and ([$certificate.actions[] | .output_goal_ids[]] | length) == 2
              and ([$certificate.actions[] | .output_goal_ids[]] | unique | length) == 2
              and (($certificate.actions[] | select(.plan_node_id == "A_FORWARD").expected_statement)
                   == ($plan.nodes[] | select(.id == "G_FORWARD").statement))
              and (($certificate.actions[] | select(.plan_node_id == "A_REVERSE").expected_statement)
                   == ($plan.nodes[] | select(.id == "G_REVERSE").statement))
            ' "$1" >/dev/null
          }

          validate_mapping docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.json
          jq '.actions |= map(if .plan_node_id == "A_FORWARD"
            then .expected_statement = "a ∧ b → a ∧ b" else . end)' \
            docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.json \
            > "$RUNNER_TEMP/proof-action-certificate-mutated.json"
          if validate_mapping "$RUNNER_TEMP/proof-action-certificate-mutated.json"; then
            echo "ERROR: validator accepted a plan/action proposition mismatch"
            exit 1
          fi
          echo "PROOF_ACTION_PLAN_BINDING_PASS"
          echo "PROOF_ACTION_PLAN_BINDING_MUTATION_REJECTED"

          jq '.actions |= map(if .plan_node_id == "A_SPLIT_IFF"
            then .output_goal_ids = ["G_FORWARD"] else . end)' \
            docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.json \
            > "$RUNNER_TEMP/proof-action-certificate-omitted-subgoal.json"
          if validate_mapping "$RUNNER_TEMP/proof-action-certificate-omitted-subgoal.json"; then
            echo "ERROR: validator accepted an omitted action subgoal"
            exit 1
          fi
          echo "PROOF_ACTION_SUBGOAL_ACCOUNTING_PASS"
          echo "PROOF_ACTION_OMITTED_SUBGOAL_MUTATION_REJECTED"

          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"
            and (getpath(["$defs","evaluator","required"]) | index("global_use_adjudication") != null)
            and (getpath(["$defs","globalUseNodeEvidence","required"]) | index("mention_id") != null)' \
            docs/research/LOCAL_GLOBAL_PAIR_V1.schema.json >/dev/null
          echo "LOCAL_GLOBAL_USE_SCHEMA_PASS"

          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema" and getpath(["$defs","evaluator","properties","oracle_relation","enum"]) == ["equivalent","base_entails_variant","variant_entails_base","incomparable","unknown"]' \
            docs/research/MATH_METAMORPHIC_PAIR_V1.schema.json >/dev/null
          echo "THEOREM_SANDWICH_FIXTURE_PASS"
          echo "PROOF_PLAN_FIXTURES_PASS"
          echo "MATH_PROOF_COMPREHENSION_PILOT_FIXTURES_PASS"
          echo "FINITE_TRANSLATION_CASES=67067; ROW_CHECKS=134134"

      - name: Check ProofPlanV1 Rust formatting
        run: cargo fmt --manifest-path scripts/research/proof-plan-contract/Cargo.toml -- --check

      - name: Test standalone ProofPlanV1 contract validator
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/proof-plan-target"
          cargo test --locked --manifest-path scripts/research/proof-plan-contract/Cargo.toml
          cargo run --locked --manifest-path scripts/research/proof-plan-contract/Cargo.toml --bin proof-plan-contract -- \
            docs/research/PROOF_PLAN_AND_COMM_V1.json
          cargo run --locked --manifest-path scripts/research/proof-plan-contract/Cargo.toml --bin local-global -- \
            docs/research/LOCAL_GLOBAL_PAIR_SYNTHETIC_V1.json | tee local-global-cli.out
          grep -Eq '^candidate_payload_sha256=[a-f0-9]{64}$' local-global-cli.out
          grep -Fq 'finite_truth_table=countermodel' local-global-cli.out
          grep -Fq 'stored_evaluator_witness_matches_minimum=true' local-global-cli.out
          cargo run --locked --manifest-path scripts/research/proof-plan-contract/Cargo.toml --bin theorem-sandwich -- \
            docs/research/MATH_PROOF_COMPREHENSION_THEOREM_SANDWICH_V1.json | tee theorem-sandwich-cli.out
          grep -Fq "THEOREM_SANDWICH_RECEIPT_VALID task_id=SYNTHETIC-SANDWICH-IMPLICATION-001" theorem-sandwich-cli.out
          grep -Fq "classification=consistent_with_selected_controls" theorem-sandwich-cli.out
          grep -Fq "evaluator_controls_passed=3 evaluator_controls_total=3" theorem-sandwich-cli.out
          cargo run --locked --manifest-path scripts/research/proof-plan-contract/Cargo.toml --bin hard-mode -- docs/research/MATH_HARDMODE_SYNTHETIC_V1.json | tee hard-mode-cli.out
          grep -Fq "HARD_MODE_RECEIPT_VALID task_id=HARDMODE-IMPLICATION-REVERSAL-001" hard-mode-cli.out
          grep -Fq "finite_semantics=countermodel" hard-mode-cli.out
          grep -Fq "proof_status=NotRun" hard-mode-cli.out
          cargo run --locked --manifest-path scripts/research/proof-plan-contract/Cargo.toml --bin math-metamorphic -- \
            docs/research/MATH_METAMORPHIC_PAIR_V1.json | tee math-metamorphic-cli.out
          grep -Fq "MATH_METAMORPHIC_PAIR_VALID pair_id=MMP-EQUIVALENT-IMPLICATION-001" math-metamorphic-cli.out
          grep -Fq "MATH_METAMORPHIC_PAIR_VALID pair_id=MMP-REMOVED-HYPOTHESIS-001" math-metamorphic-cli.out
          grep -Fq "MATH_METAMORPHIC_PAIR_VALID pair_id=MMP-PROOF-ROUTE-ONLY-001" math-metamorphic-cli.out
          grep -Fq "MATH_METAMORPHIC_PAIR_VALID pair_id=MMP-HYPOTHESIS-ORDER-PERMUTATION-001" math-metamorphic-cli.out
          grep -Fq "MATH_METAMORPHIC_PAIR_VALID pair_id=MMP-INCOMPARABLE-CONCLUSIONS-001" math-metamorphic-cli.out
          grep -Fq "MATH_METAMORPHIC_DATASET_VALID pairs=5" math-metamorphic-cli.out
          cargo run --locked --manifest-path scripts/research/proof-plan-contract/Cargo.toml --bin scope-equivalence -- \
            docs/research/MATH_SCOPE_EQUIVALENCE_TIER1_V1.json | tee scope-equivalence-cli.out
          grep -Fq "SCOPE_EQUIVALENCE_PAIR_VALID pair_id=SCOPE-T1-EXACT-IDENTITY-001 relation=ExactIdentity" scope-equivalence-cli.out
          grep -Fq "SCOPE_EQUIVALENCE_PAIR_VALID pair_id=SCOPE-T1-HYPOTHESIS-PERMUTATION-001 relation=Tier1HypothesisPermutationEquivalent raw_same=false normalized_same=true" scope-equivalence-cli.out
          grep -Fq "SCOPE_EQUIVALENCE_PAIR_VALID pair_id=SCOPE-T1-PREMISE-ORDER-001 relation=NotTier1Equivalent" scope-equivalence-cli.out
          grep -Fq "SCOPE_EQUIVALENCE_PAIR_VALID pair_id=SCOPE-T1-HYPOTHESIS-MULTIPLICITY-001 relation=NotTier1Equivalent" scope-equivalence-cli.out
          grep -Fq "SCOPE_EQUIVALENCE_PAIR_VALID pair_id=SCOPE-T1-CONCLUSION-CHANGE-001 relation=NotTier1Equivalent" scope-equivalence-cli.out
          grep -Fq "SCOPE_EQUIVALENCE_DATASET_VALID pairs=5" scope-equivalence-cli.out

      - name: Export generated Cargo.lock for dependency pinning
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-plan-contract-cargo-lock-bootstrap
          path: scripts/research/proof-plan-contract/Cargo.lock
          if-no-files-found: error

      - name: Assert focused workflow job uniqueness
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^  finite-reference:$' .github/workflows/math-proof-comprehension-pilot.yml)" -eq 1
          test "$(grep -c '^  mathlib-elaborated-extraction:$' .github/workflows/math-proof-comprehension-pilot.yml)" -eq 1
          test "$(grep -c '^  mathlib-v429-direct-edge-cohort:$' .github/workflows/math-proof-comprehension-pilot.yml)" -eq 1
          test "$(grep -c '^  mathlib-source-snapshot-differential:$' .github/workflows/math-proof-comprehension-pilot.yml)" -eq 1

  mathlib-elaborated-extraction:
    name: Pinned Mathlib elaborated dependency extraction
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned Mathlib snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover-community/mathlib4
          ref: 6ebcce37335bcb6bca64596e5d57bb3035648030
          path: mathlib4
          persist-credentials: false

      - name: Install exact Mathlib Lean toolchain and restore public cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: mathlib4
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: Verify source and toolchain identity
        working-directory: mathlib4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6ebcce37335bcb6bca64596e5d57bb3035648030"
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.37.0-rc1"
          lean --version | grep -F "4.37.0-rc1"
          lake --version

      - name: Run Lean-native elaborated dependency extractor
        working-directory: mathlib4
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/scripts/research/lean-proof-extractor/ProofComprehensionExtract.lean" .
          lake env lean ProofComprehensionExtract.lean
          for declaration in Nat.choose_pos Set.countable_union Multiset.map_id Finset.card_map; do
            file="proof-comprehension-extract-${declaration}.json"
            test -s "$file"
            jq -e --arg declaration "$declaration" '.schema_version == "1.0.0"
              and .source_revision == "6ebcce37335bcb6bca64596e5d57bb3035648030"
              and .lean_revision == "0b77e12952ad39077d80d8bd6b66d601f225c321"
              and .declaration == $declaration
              and (.unresolved_dependencies | length) == 0
              and (.edges | length) > 0
              and .value_kind == "theorem_proof"
              and .value_dependencies == .proof_value_dependencies
              and (.definition_value_dependencies | length) == 0
              and (.opaque_value_dependencies | length) == 0
              and .trust_profile.closure_status == "complete"
              and (.trust_profile.unresolved_declarations | length) == 0
              and (.trust_profile.transitive_declaration_count > 0)
              and (if $declaration == "Nat.choose_pos" then ((.helper_nodes | length) > 0 and all(.helper_nodes[]; .trust_profile.closure_status == "complete" and (.trust_profile.unresolved_declarations | length) == 0 and .value_kind == "definition_body" and (.proof_value_dependencies | length) == 0 and .value_dependencies == .definition_value_dependencies)) else true end)' "$file" >/dev/null
          done
          for declaration in List List.nil List.cons List.rec; do
            file="proof-comprehension-extract-${declaration}.json"
            test -s "$file"
            jq -e --arg declaration "$declaration" '.declaration == $declaration
              and (.unresolved_dependencies | length) == 0
              and .trust_profile.closure_status == "complete"
              and (.trust_profile.unresolved_declarations | length) == 0
              and (if $declaration == "List" then (.declaration_kind == "inductive" and any(.edges[]; .relation == "inductive_constructor" and .target == "List.nil") and any(.edges[]; .relation == "inductive_constructor" and .target == "List.cons")) else true end)
              and (if $declaration == "List.nil" or $declaration == "List.cons" then (.declaration_kind == "constructor" and any(.edges[]; .relation == "constructor_of" and .target == "List")) else true end)
              and (if $declaration == "List.rec" then (.declaration_kind == "recursor" and any(.edges[]; .relation == "recursor_for_inductive" and .target == "List") and any(.edges[]; .relation == "recursor_rule_constructor")) else true end)' "$file" >/dev/null
          done
          echo "MATHLIB_STRUCTURAL_CALIBRATION_PASS"
          echo "MATHLIB_ELABORATED_DEPENDENCY_EXTRACTION_PASS"

      - name: Replay source-pinned And.comm local action certificates
        working-directory: mathlib4
        shell: bash
        run: |
          set -euo pipefail
          proof_source="$GITHUB_WORKSPACE/scripts/research/lean-proof-extractor/ProofActionCertificateAndComm.lean"
          negative_source="$GITHUB_WORKSPACE/scripts/research/lean-proof-extractor/ProofActionCertificateAndCommNegative.lean"
          manifest="$GITHUB_WORKSPACE/docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.json"
          cp "$proof_source" ProofActionCertificateAndComm.lean
          cp "$negative_source" ProofActionCertificateAndCommNegative.lean
          test "$(git rev-parse HEAD)" = "6ebcce37335bcb6bca64596e5d57bb3035648030"
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.37.0-rc1"

          actual_source_sha256="$(sha256sum ProofActionCertificateAndComm.lean | cut -d' ' -f1)"
          expected_source_sha256="$(jq -r '.proof_source.sha256' "$manifest")"
          test "$actual_source_sha256" = "$expected_source_sha256"
          actual_negative_source_sha256="$(sha256sum ProofActionCertificateAndCommNegative.lean | cut -d' ' -f1)"
          expected_negative_source_sha256="$(jq -r '.negative_control.sha256' "$manifest")"
          test "$actual_negative_source_sha256" = "$expected_negative_source_sha256"
          test "$(jq -r '.environment.mathlib_revision' "$manifest")" = "$(git rev-parse HEAD)"

          lake env lean ProofActionCertificateAndComm.lean 2>&1 | tee proof-action-certificate-and-comm.log
          for declaration in \
            "ProofPlanActionCertificatePilot.and_comm_split_iff" \
            "ProofPlanActionCertificatePilot.and_comm_forward" \
            "ProofPlanActionCertificatePilot.and_comm_reverse" \
            "ProofPlanActionCertificatePilot.and_comm_plan_replay"; do
            grep -Fq "$declaration" proof-action-certificate-and-comm.log
          done
          grep -Fq "And.comm" proof-action-certificate-and-comm.log
          grep -Fq "a ∧ b → b ∧ a" proof-action-certificate-and-comm.log
          grep -Fq "b ∧ a → a ∧ b" proof-action-certificate-and-comm.log

          if lake env lean ProofActionCertificateAndCommNegative.lean > proof-action-certificate-negative.log 2>&1; then
            echo "ERROR: Lean accepted a wrong-proposition local certificate negative control"
            exit 1
          fi
          grep -Eiq "type mismatch|application type mismatch" proof-action-certificate-negative.log
          echo "PROOF_ACTION_CERTIFICATE_WRONG_PROPOSITION_REJECTED"

          manifest_sha256="$(sha256sum "$manifest" | cut -d' ' -f1)"
          axiom_log_sha256="$(sha256sum proof-action-certificate-and-comm.log | cut -d' ' -f1)"
          negative_log_sha256="$(sha256sum proof-action-certificate-negative.log | cut -d' ' -f1)"
          lake_manifest_sha256="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          lean_version="$(lean --version)"
          mathlib_revision="$(git rev-parse HEAD)"
          symthaea_revision="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          action_certificates="$(jq -c '[.actions[] | {plan_node_id, certificate_declaration, expected_statement}]' "$manifest")"
          root_declaration="$(jq -r '.root_declaration.certificate_declaration' "$manifest")"
          receipt="proof-action-certificate-replay-receipt.json"
          jq -n \
            --arg symthaea_revision "$symthaea_revision" \
            --arg source_sha256 "$actual_source_sha256" \
            --arg negative_source_sha256 "$actual_negative_source_sha256" \
            --arg negative_log_sha256 "$negative_log_sha256" \
            --arg manifest_sha256 "$manifest_sha256" \
            --arg lean_version "$lean_version" \
            --arg mathlib_revision "$mathlib_revision" \
            --arg lake_manifest_sha256 "$lake_manifest_sha256" \
            --arg axiom_log_sha256 "$axiom_log_sha256" \
            --arg root_declaration "$root_declaration" \
            --argjson action_certificates "$action_certificates" \
            '{
              schema_version: "1.0.0",
              receipt_kind: "lean_kernel_source_replay",
              status: "accepted",
              repository: "Luminous-Dynamics/symthaea",
              symthaea_revision: $symthaea_revision,
              proof_source_path: "scripts/research/lean-proof-extractor/ProofActionCertificateAndComm.lean",
              proof_source_sha256: $source_sha256,
              manifest_path: "docs/research/PROOF_ACTION_CERTIFICATE_AND_COMM_V1.json",
              manifest_sha256: $manifest_sha256,
              lean_version: $lean_version,
              mathlib_revision: $mathlib_revision,
              lake_manifest_sha256: $lake_manifest_sha256,
              action_certificates: $action_certificates,
              root_declaration: $root_declaration,
              axiom_report: {captured: true, parsed: false, log_sha256: $axiom_log_sha256},
              negative_control: {
                expected_result: "lean_type_error",
                rejected_as_expected: true,
                source_sha256: $negative_source_sha256,
                log_sha256: $negative_log_sha256
              },
              claim_ceiling: [
                "Lean accepted the declared action propositions and composed root theorem in this exact run environment.",
                "The raw #print axioms output is retained as a log hash but its dependency closure is not yet parsed into structured evidence.",
                "Pre-goal binder identity, local-instance context digests and emitted post-action goal-state receipts are not yet implemented.",
                "The action-to-plan mapping remains provisional and has not received independent expert review."
              ]
            }' > "$receipt"
          jq -e '.status == "accepted" and (.action_certificates | length) == 3 and .root_declaration == "ProofPlanActionCertificatePilot.and_comm_plan_replay" and .axiom_report.captured == true and .axiom_report.parsed == false and .negative_control.expected_result == "lean_type_error" and .negative_control.rejected_as_expected == true and (.negative_control.source_sha256 | test("^[a-f0-9]{64}$")) and (.negative_control.log_sha256 | test("^[a-f0-9]{64}$"))' "$receipt" >/dev/null
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "PROOF_ACTION_CERTIFICATE_AND_COMM_LEAN_REPLAY_PASS"

      - name: Preserve Lean action-certificate replay receipt
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-action-certificate-and-comm-lean-replay
          path: |
            mathlib4/proof-action-certificate-replay-receipt.json
            mathlib4/proof-action-certificate-and-comm.log
            mathlib4/ProofActionCertificateAndCommNegative.lean
            mathlib4/proof-action-certificate-negative.log
          if-no-files-found: error

      - name: Replay Tier-2 Lean context and warrant transport
        working-directory: mathlib4
        shell: bash
        run: |
          set -euo pipefail
          proof_source="$GITHUB_WORKSPACE/scripts/research/lean-proof-extractor/ScopeEquivalenceTier2AndComm.lean"
          manifest="$GITHUB_WORKSPACE/docs/research/MATH_SCOPE_EQUIVALENCE_TIER2_AND_COMM_V1.json"
          cp "$proof_source" ScopeEquivalenceTier2AndComm.lean
          test "$(git rev-parse HEAD)" = "6ebcce37335bcb6bca64596e5d57bb3035648030"
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.37.0-rc1"
          actual_source_sha256="$(sha256sum ScopeEquivalenceTier2AndComm.lean | cut -d' ' -f1)"
          expected_source_sha256="$(jq -r '.proof_source.sha256' "$manifest")"
          test "$actual_source_sha256" = "$expected_source_sha256"
          test "$(jq -r '.environment.mathlib_revision' "$manifest")" = "$(git rev-parse HEAD)"

          lake env lean ScopeEquivalenceTier2AndComm.lean 2>&1 | tee scope-equivalence-tier2-and-comm.log
          for declaration in \
            "ScopeEquivalenceTier2AndComm.local_context_to_global" \
            "ScopeEquivalenceTier2AndComm.global_context_to_local" \
            "ScopeEquivalenceTier2AndComm.context_equivalence" \
            "ScopeEquivalenceTier2AndComm.warrant_local_to_global" \
            "ScopeEquivalenceTier2AndComm.warrant_global_to_local" \
            "ScopeEquivalenceTier2AndComm.warrant_transport_equivalence"; do
            grep -Fq "$declaration" scope-equivalence-tier2-and-comm.log
          done

          manifest_sha256="$(sha256sum "$manifest" | cut -d' ' -f1)"
          axioms_log_sha256="$(sha256sum scope-equivalence-tier2-and-comm.log | cut -d' ' -f1)"
          lake_manifest_sha256="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          lean_version="$(lean --version)"
          mathlib_revision="$(git rev-parse HEAD)"
          symthaea_revision="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          certificates="$(jq -c '.certificates' "$manifest")"
          receipt="scope-equivalence-tier2-and-comm-replay-receipt.json"
          jq -n \
            --arg symthaea_revision "$symthaea_revision" \
            --arg source_sha256 "$actual_source_sha256" \
            --arg manifest_sha256 "$manifest_sha256" \
            --arg lean_version "$lean_version" \
            --arg mathlib_revision "$mathlib_revision" \
            --arg lake_manifest_sha256 "$lake_manifest_sha256" \
            --arg axioms_log_sha256 "$axioms_log_sha256" \
            --argjson certificates "$certificates" \
            '{
              schema_version: "1.0.0",
              receipt_kind: "lean_kernel_scope_transport_replay",
              status: "accepted",
              pair_id: "SCOPE-TIER2-AND-COMM-001",
              comparison_tier: "tier2_kernel_certified_transport",
              repository: "Luminous-Dynamics/symthaea",
              symthaea_revision: $symthaea_revision,
              proof_source_path: "scripts/research/lean-proof-extractor/ScopeEquivalenceTier2AndComm.lean",
              proof_source_sha256: $source_sha256,
              manifest_path: "docs/research/MATH_SCOPE_EQUIVALENCE_TIER2_AND_COMM_V1.json",
              manifest_sha256: $manifest_sha256,
              lean_version: $lean_version,
              mathlib_revision: $mathlib_revision,
              lake_manifest_sha256: $lake_manifest_sha256,
              certificates: $certificates,
              axiom_report: {captured: true, parsed: false, log_sha256: $axioms_log_sha256},
              claim_ceiling: [
                "Both context-entailment directions and bidirectional warrant transport were accepted by Lean in this exact run environment.",
                "The target proposition is unchanged and the context is non-dependent propositional conjunction only.",
                "Dependent binders, local instances, typeclass parameters, universe changes and arbitrary telescope transport are not covered.",
                "The raw #print axioms output is retained by digest but not yet parsed into structured dependency closure.",
                "This synthetic seed is not an empirical scope-CIRR result or expert-reviewed explanation."
              ]
            }' > "$receipt"
          jq -e '.status == "accepted" and .comparison_tier == "tier2_kernel_certified_transport" and (.certificates | length) == 6 and .axiom_report.captured == true and .axiom_report.parsed == false' "$receipt" >/dev/null
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "SCOPE_EQUIVALENCE_TIER2_LEAN_REPLAY_PASS"

      - name: Preserve Tier-2 scope-transport replay receipt
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scope-equivalence-tier2-and-comm-lean-replay
          path: |
            mathlib4/scope-equivalence-tier2-and-comm-replay-receipt.json
            mathlib4/scope-equivalence-tier2-and-comm.log
          if-no-files-found: error

      - name: Preserve extracted graph artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mathlib-elaborated-dependency-graphs
          path: mathlib4/proof-comprehension-extract-*.json
          if-no-files-found: error
  mathlib-v429-direct-edge-cohort:
