name: NixWard security-advisory conformance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/core/nixward/tests/security_advisory_corpus.rs"
      - "crates/core/nixward/tests/goal_corpus.rs"
      - "research/nixward-capability-advisory-v0.1/**"
      - ".github/workflows/nixward-security-advisory.yml"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "crates/core/nixward/tests/security_advisory_corpus.rs"
      - "crates/core/nixward/tests/goal_corpus.rs"
      - "research/nixward-capability-advisory-v0.1/**"
      - ".github/workflows/nixward-security-advisory.yml"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixward-security-advisory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus-contract:
    name: corpus-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check Rust test formatting
        run: rustfmt +1.96.0 --check --edition 2024 crates/core/nixward/tests/security_advisory_corpus.rs crates/core/nixward/tests/goal_corpus.rs
      - name: Run NixWard corpus semantic guards
        run: cargo +1.96.0 test --locked -p nixward --test security_advisory_corpus --test goal_corpus
