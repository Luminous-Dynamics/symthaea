name: Cyber Crucible Diagnostic Loop Contract

on:
  pull_request:
    paths:
      - "validation/cyber_crucible_diagnostic_loop_v1.schema.json"
      - "validation/cyber_crucible_diagnostic_loop_public_v1.json"
      - "scripts/validate_cyber_crucible_diagnostic_loop.py"
      - "tests/test_cyber_crucible_diagnostic_loop.py"
      - "validation/CYBER_CRUCIBLE_DIAGNOSTIC_LOOP_V1.md"
      - ".github/workflows/cyber-crucible-diagnostic-loop.yml"
      - "scripts/verify_cyber_crucible_signed_receipt.py"
      - "tests/test_cyber_crucible_signed_receipt.py"
      - "validation/cyber_crucible_signed_receipt_v1.schema.json"
      - "validation/CYBER_CRUCIBLE_SIGNED_RECEIPT_V1.md"
      - ".github/workflows/cyber-crucible-authenticated-receipts.yml"
  push:
    branches: [main]
    paths:
      - "validation/cyber_crucible_diagnostic_loop_v1.schema.json"
      - "validation/cyber_crucible_diagnostic_loop_public_v1.json"
      - "scripts/validate_cyber_crucible_diagnostic_loop.py"
      - "tests/test_cyber_crucible_diagnostic_loop.py"
      - "validation/CYBER_CRUCIBLE_DIAGNOSTIC_LOOP_V1.md"
      - ".github/workflows/cyber-crucible-diagnostic-loop.yml"
      - "scripts/verify_cyber_crucible_signed_receipt.py"
      - "tests/test_cyber_crucible_signed_receipt.py"
      - "validation/cyber_crucible_signed_receipt_v1.schema.json"
      - "validation/CYBER_CRUCIBLE_SIGNED_RECEIPT_V1.md"
      - ".github/workflows/cyber-crucible-authenticated-receipts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-loop-contract:
    name: Diagnostic loop, digest binding, and fail-closed regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Python security release
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"

      - name: Install pinned verification dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "jsonschema==4.26.0" \
            "cryptography==50.0.2" \
            "rfc8785==0.1.4"

      - name: Validate schema and public example
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("validation/cyber_crucible_diagnostic_loop_v1.schema.json").read_text(encoding="utf-8"))
          report = json.loads(Path("validation/cyber_crucible_diagnostic_loop_public_v1.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(report))
          if errors:
              for error in errors:
                  print(f"{'/'.join(map(str, error.absolute_path))}: {error.message}")
              raise SystemExit(f"Diagnostic-loop schema validation failed with {len(errors)} error(s)")
          print("JSON Schema PASS: diagnostic-loop public example")
          PY

      - name: Verify canonical evidence and receipt bindings
        run: python scripts/validate_cyber_crucible_diagnostic_loop.py

      - name: Exercise fail-closed regressions
        run: python -m unittest discover -s tests -p "test_cyber_crucible_diagnostic_loop.py" -v

      - name: Meta-validate signed receipt schema when present
        run: |
          if [ -f validation/cyber_crucible_signed_receipt_v1.schema.json ]; then
            python3 -c 'import json; from pathlib import Path; from jsonschema import Draft202012Validator; Draft202012Validator.check_schema(json.loads(Path("validation/cyber_crucible_signed_receipt_v1.schema.json").read_text(encoding="utf-8"))); print("JSON Schema PASS: signed receipt envelope")'
          else
            echo "Signed receipt schema is not in this revision; stacked child PR owns it."
          fi

      - name: Exercise signed-receipt trust-boundary regressions when present
        run: |
          if [ -f tests/test_cyber_crucible_signed_receipt.py ]; then
            python -m unittest discover -s tests -p "test_cyber_crucible_signed_receipt.py" -v
          else
            echo "Signed receipt tests are not in this revision; stacked child PR owns them."
          fi
