name: EV SOH benchmark manifest v0.1 audit

on:
  pull_request:
    paths:
      - "docs/transport/EV_SOH_BENCHMARK_MANIFEST_V0_1.md"
      - "schemas/transport/ev_soh_benchmark_manifest_v0_1.schema.json"
      - "fixtures/ev_battery/soh_benchmark_manifest_scenarios_v0_1.json"
      - "tools/ev-soh-benchmark-audit/**"
      - ".github/workflows/ev-soh-benchmark-manifest-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Check formatting
        run: cargo fmt --manifest-path tools/ev-soh-benchmark-audit/Cargo.toml -- --check
      - name: Run manifest and mutation tests
        run: cargo test --manifest-path tools/ev-soh-benchmark-audit/Cargo.toml
      - name: Audit frozen synthetic cases
        run: |
          cargo run --manifest-path tools/ev-soh-benchmark-audit/Cargo.toml -- --schema schemas/transport/ev_soh_benchmark_manifest_v0_1.schema.json --corpus fixtures/ev_battery/soh_benchmark_manifest_scenarios_v0_1.json > "$RUNNER_TEMP/ev-soh-benchmark-report.json"
          jq -e '
            .case_count == 15 and
            .accepted_count == 4 and
            .rejected_count == 11 and
            (.report_sha256 | test("^[a-f0-9]{64}$"))
          ' "$RUNNER_TEMP/ev-soh-benchmark-report.json"
