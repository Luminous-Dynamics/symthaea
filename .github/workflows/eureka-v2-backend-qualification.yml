name: EUREKA V2 Backend Qualification

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-psych-bench/**"
      - "crates/domains/symthaea-fep/**"
      - "src/cognitive_loop/**"
      - ".github/workflows/eureka-v2-backend-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"
  EUREKA_V2_QUALIFICATION_REVISION: "EUREKA.002.V2.BACKEND_QUALIFICATION.v1"
  EXPECTED_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  qualify-eureka-v2-backend:
    name: Qualify EUREKA V2 backend
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-eureka-v2-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-eureka-v2-backend-

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev cmake libasound2-dev

      - name: Capture exact qualification subject
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            echo "Checkout is dirty before qualification:" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi

          subject_head="$(git rev-parse HEAD)"
          if [[ "$subject_head" != "$EXPECTED_SUBJECT_SHA" ]]; then
            echo "Checked-out HEAD is not the intended qualification subject" >&2
            echo "expected=$EXPECTED_SUBJECT_SHA" >&2
            echo "actual=$subject_head" >&2
            exit 1
          fi

          subject_tree="$(git rev-parse 'HEAD^{tree}')"
          cargo_lock_sha256="$(sha256sum Cargo.lock | awk '{print $1}')"
          receipt="${RUNNER_TEMP}/eureka-v2-backend-qualification.txt"

          echo "EUREKA_SUBJECT_HEAD=$subject_head" >> "$GITHUB_ENV"
          echo "EUREKA_SUBJECT_TREE=$subject_tree" >> "$GITHUB_ENV"
          echo "EUREKA_CARGO_LOCK_SHA256=$cargo_lock_sha256" >> "$GITHUB_ENV"
          echo "EUREKA_QUALIFICATION_RECEIPT=$receipt" >> "$GITHUB_ENV"

          {
            echo "qualification_revision=${EUREKA_V2_QUALIFICATION_REVISION}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "expected_subject_head=${EXPECTED_SUBJECT_SHA}"
            echo "subject_head=$subject_head"
            echo "subject_tree=$subject_tree"
            echo "cargo_lock_sha256=$cargo_lock_sha256"
            echo "checkout_clean_before=true"
            echo "rustc_begin"
            rustc --version --verbose
            echo "rustc_end"
            echo "cargo_begin"
            cargo --version --verbose
            echo "cargo_end"
            echo "commands_begin"
            echo "cargo check -p symthaea-psych-bench --features symthaea-backend --lib --tests"
            echo "cargo test -p symthaea-psych-bench --features symthaea-backend --lib benchmarks::eureka -- --nocapture"
            echo "cargo clippy -p symthaea-psych-bench --features symthaea-backend --lib --tests -- -D warnings"
            echo "commands_end"
          } > "$receipt"

      - name: Check backend-feature compilation
        run: |
          set -euo pipefail
          cargo check -p symthaea-psych-bench --features symthaea-backend --lib --tests

      - name: Run EUREKA backend unit tests
        run: |
          set -euo pipefail
          cargo test -p symthaea-psych-bench --features symthaea-backend --lib benchmarks::eureka -- --nocapture

      - name: Strict Clippy for backend test surface
        run: |
          set -euo pipefail
          cargo clippy -p symthaea-psych-bench --features symthaea-backend --lib --tests -- -D warnings

      - name: Verify exact-subject checkout immutability
        shell: bash
        run: |
          set -euo pipefail

          current_head="$(git rev-parse HEAD)"
          current_tree="$(git rev-parse 'HEAD^{tree}')"
          current_lock="$(sha256sum Cargo.lock | awk '{print $1}')"

          [[ "$current_head" == "$EXPECTED_SUBJECT_SHA" ]] || {
            echo "HEAD no longer equals intended qualification subject" >&2
            exit 1
          }
          [[ "$current_head" == "$EUREKA_SUBJECT_HEAD" ]] || {
            echo "HEAD changed during qualification" >&2
            exit 1
          }
          [[ "$current_tree" == "$EUREKA_SUBJECT_TREE" ]] || {
            echo "Git tree changed during qualification" >&2
            exit 1
          }
          [[ "$current_lock" == "$EUREKA_CARGO_LOCK_SHA256" ]] || {
            echo "Cargo.lock changed during qualification" >&2
            exit 1
          }

          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            echo "Checkout mutated during qualification:" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi

          {
            echo "postflight_head=$current_head"
            echo "postflight_tree=$current_tree"
            echo "postflight_cargo_lock_sha256=$current_lock"
            echo "checkout_clean_after=true"
            echo "qualification_result=PASS"
            echo "claim_scope=backend-build-test-lint-only"
            echo "real_canary_executed=false"
            echo "heldout_executed=false"
          } >> "$EUREKA_QUALIFICATION_RECEIPT"

      - name: Upload exact qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eureka-v2-backend-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/eureka-v2-backend-qualification.txt
          if-no-files-found: error
          retention-days: 90
