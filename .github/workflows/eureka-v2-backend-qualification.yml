name: EUREKA V2 Backend Qualification

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - ".github/eureka/**"
      - ".github/workflows/eureka-v2-backend-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"
  EUREKA_V2_QUALIFICATION_REVISION: "EUREKA.002.V2.BACKEND_QUALIFICATION.v2"
  EUREKA_V2_RECEIPT_SCHEMA_REVISION: "EUREKA.002.V2.BACKEND_QUALIFICATION_RECEIPT.v2"
  EUREKA_V2_COMMAND_CONTRACT_REVISION: "EUREKA.002.V2.BACKEND_QUALIFICATION_COMMANDS.v2"
  EUREKA_STAGE_LOG_LIMIT_BYTES: "8388608"
  EXPECTED_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  EUREKA_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  qualify-eureka-v2-backend:
    name: Qualify EUREKA V2 backend
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned master commit
        with:
          toolchain: 1.96.0
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-eureka-v2-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-eureka-v2-backend-

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev cmake libasound2-dev

      - name: Capture exact qualification subject and contract
        shell: bash
        run: |
          set -euo pipefail

          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            echo "Checkout is dirty before qualification:" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi

          subject_head="$(git rev-parse HEAD)"
          if [[ "$subject_head" != "$EXPECTED_SUBJECT_SHA" ]]; then
            echo "Checked-out HEAD is not the intended qualification subject" >&2
            echo "expected=$EXPECTED_SUBJECT_SHA" >&2
            echo "actual=$subject_head" >&2
            exit 1
          fi

          if [[ ! "$EUREKA_GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "github.workflow_sha is not a canonical commit identity" >&2
            exit 1
          fi
          if ! git cat-file -e "${EUREKA_GITHUB_WORKFLOW_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$EUREKA_GITHUB_WORKFLOW_SHA"
          fi

          subject_tree="$(git rev-parse 'HEAD^{tree}')"
          cargo_lock_sha256="$(sha256sum Cargo.lock | awk '{print $1}')"
          workflow_path=".github/workflows/eureka-v2-backend-qualification.yml"
          contract_path=".github/eureka/eureka-v2-backend-qualification-contract.sh"
          stage_runner_path=".github/eureka/eureka-v2-qualification-stage-runner.py"
          workflow_sha256="$(sha256sum "$workflow_path" | awk '{print $1}')"
          interpreted_workflow_sha256="$(git show "${EUREKA_GITHUB_WORKFLOW_SHA}:${workflow_path}" | sha256sum | awk '{print $1}')"
          command_contract_sha256="$(sha256sum "$contract_path" | awk '{print $1}')"
          stage_runner_sha256="$(sha256sum "$stage_runner_path" | awk '{print $1}')"
          receipt="${RUNNER_TEMP}/eureka-v2-backend-qualification.env"
          stage_evidence_dir="${RUNNER_TEMP}/eureka-v2-stage-evidence"
          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"

          if [[ "$workflow_sha256" != "$interpreted_workflow_sha256" ]]; then
            echo "Checked-out qualifier workflow bytes differ from the workflow GitHub interpreted" >&2
            echo "subject_workflow_sha256=$workflow_sha256" >&2
            echo "interpreted_workflow_sha256=$interpreted_workflow_sha256" >&2
            echo "github_workflow_sha=$EUREKA_GITHUB_WORKFLOW_SHA" >&2
            exit 1
          fi

          echo "EUREKA_SUBJECT_HEAD=$subject_head" >> "$GITHUB_ENV"
          echo "EUREKA_SUBJECT_TREE=$subject_tree" >> "$GITHUB_ENV"
          echo "EUREKA_CARGO_LOCK_SHA256=$cargo_lock_sha256" >> "$GITHUB_ENV"
          echo "EUREKA_WORKFLOW_SHA256=$workflow_sha256" >> "$GITHUB_ENV"
          echo "EUREKA_COMMAND_CONTRACT_SHA256=$command_contract_sha256" >> "$GITHUB_ENV"
          echo "EUREKA_STAGE_RUNNER_SHA256=$stage_runner_sha256" >> "$GITHUB_ENV"
          echo "EUREKA_QUALIFICATION_RECEIPT=$receipt" >> "$GITHUB_ENV"
          echo "EUREKA_QUALIFICATION_CONTRACT=$contract_path" >> "$GITHUB_ENV"
          echo "EUREKA_STAGE_RUNNER=$stage_runner_path" >> "$GITHUB_ENV"
          echo "EUREKA_STAGE_EVIDENCE_DIR=$stage_evidence_dir" >> "$GITHUB_ENV"

          {
            printf 'receipt_schema_revision=%s\n' "$EUREKA_V2_RECEIPT_SCHEMA_REVISION"
            printf 'qualification_revision=%s\n' "$EUREKA_V2_QUALIFICATION_REVISION"
            printf 'command_contract_revision=%s\n' "$EUREKA_V2_COMMAND_CONTRACT_REVISION"
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'github_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'github_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'github_workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'expected_subject_head=%s\n' "$EXPECTED_SUBJECT_SHA"
            printf 'subject_head=%s\n' "$subject_head"
            printf 'subject_tree=%s\n' "$subject_tree"
            printf 'cargo_lock_sha256=%s\n' "$cargo_lock_sha256"
            printf 'workflow_sha256=%s\n' "$workflow_sha256"
            printf 'command_contract_sha256=%s\n' "$command_contract_sha256"
            printf 'rustc_version=%s\n' "$rustc_version"
            printf 'cargo_version=%s\n' "$cargo_version"
            printf 'checkout_clean_before=true\n'
            printf 'claim_scope=backend-build-test-lint-only\n'
            printf 'execution_authority_granted=false\n'
            printf 'real_canary_executed=false\n'
            printf 'heldout_executed=false\n'
            printf 'confirmatory_evidence_minted=false\n'
          } > "$receipt"

      - name: Check backend-feature compilation
        run: |
          set -euo pipefail
          python3 "$EUREKA_STAGE_RUNNER" check "$EUREKA_QUALIFICATION_CONTRACT" "$EUREKA_STAGE_EVIDENCE_DIR"

      - name: Run EUREKA backend unit tests
        run: |
          set -euo pipefail
          python3 "$EUREKA_STAGE_RUNNER" test "$EUREKA_QUALIFICATION_CONTRACT" "$EUREKA_STAGE_EVIDENCE_DIR"

      - name: Strict Clippy for backend test surface
        run: |
          set -euo pipefail
          python3 "$EUREKA_STAGE_RUNNER" clippy "$EUREKA_QUALIFICATION_CONTRACT" "$EUREKA_STAGE_EVIDENCE_DIR"

      - name: Finalize qualification stage evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          stage_dir="${EUREKA_STAGE_EVIDENCE_DIR:-${RUNNER_TEMP}/eureka-v2-stage-evidence}"
          mkdir -p "$stage_dir"
          summary="$stage_dir/stage-evidence-summary.env"
          : > "$summary"

          read_one() {
            local file="$1"
            local key="$2"
            local count
            count="$(grep -c "^${key}=" "$file" || true)"
            if [[ "$count" != "1" ]]; then
              echo "Stage receipt key must occur exactly once: ${key} in ${file} (count=${count})" >&2
              return 1
            fi
            sed -n "s/^${key}=//p" "$file"
          }

          blocker=""
          diagnostic_complete="true"
          stages=(check test clippy)
          for stage in "${stages[@]}"; do
            receipt="$stage_dir/${stage}.stage.env"
            if [[ -f "$receipt" ]]; then
              if [[ -n "$blocker" ]]; then
                echo "Stage ${stage} produced execution evidence after failed predecessor ${blocker}" >&2
                diagnostic_complete="false"
              fi

              recorded_stage="$(read_one "$receipt" stage)"
              recorded_head="$(read_one "$receipt" subject_head)"
              recorded_tree="$(read_one "$receipt" subject_tree)"
              recorded_lock="$(read_one "$receipt" cargo_lock_sha256)"
              recorded_workflow="$(read_one "$receipt" workflow_sha256)"
              recorded_contract="$(read_one "$receipt" command_contract_sha256)"
              recorded_runner="$(read_one "$receipt" stage_runner_sha256)"
              recorded_retained="$(read_one "$receipt" log_retained_bytes)"
              recorded_log_sha="$(read_one "$receipt" log_sha256)"
              completeness="$(read_one "$receipt" log_completeness)"
              disposition="$(read_one "$receipt" stage_disposition)"
              authority="$(read_one "$receipt" execution_authority_granted)"

              [[ "$recorded_stage" == "$stage" ]] || { echo "Stage receipt identity mismatch" >&2; exit 1; }
              [[ "$recorded_head" == "$EUREKA_SUBJECT_HEAD" ]] || { echo "Stage subject HEAD mismatch" >&2; exit 1; }
              [[ "$recorded_tree" == "$EUREKA_SUBJECT_TREE" ]] || { echo "Stage subject tree mismatch" >&2; exit 1; }
              [[ "$recorded_lock" == "$EUREKA_CARGO_LOCK_SHA256" ]] || { echo "Stage Cargo.lock mismatch" >&2; exit 1; }
              [[ "$recorded_workflow" == "$EUREKA_WORKFLOW_SHA256" ]] || { echo "Stage workflow mismatch" >&2; exit 1; }
              [[ "$recorded_contract" == "$EUREKA_COMMAND_CONTRACT_SHA256" ]] || { echo "Stage command-contract mismatch" >&2; exit 1; }
              [[ "$recorded_runner" == "$EUREKA_STAGE_RUNNER_SHA256" ]] || { echo "Stage runner mismatch" >&2; exit 1; }
              [[ "$authority" == "false" ]] || { echo "Stage evidence escalated execution authority" >&2; exit 1; }

              log="$stage_dir/${stage}.combined.log"
              [[ -f "$log" ]] || { echo "Executed stage is missing retained log: ${stage}" >&2; exit 1; }
              actual_retained="$(wc -c < "$log" | tr -d '[:space:]')"
              actual_log_sha="$(sha256sum "$log" | awk '{print $1}')"
              [[ "$actual_retained" == "$recorded_retained" ]] || { echo "Stage log length mismatch: ${stage}" >&2; exit 1; }
              [[ "$actual_log_sha" == "$recorded_log_sha" ]] || { echo "Stage log digest mismatch: ${stage}" >&2; exit 1; }

              case "$disposition" in
                Passed)
                  [[ "$completeness" == "Complete" ]] || diagnostic_complete="false"
                  ;;
                Failed|FailedBySignal)
                  [[ "$completeness" == "Complete" ]] || diagnostic_complete="false"
                  blocker="$stage"
                  ;;
                EvidenceCaptureFailed|EvidenceTruncated)
                  diagnostic_complete="false"
                  blocker="$stage"
                  ;;
                *)
                  echo "Unknown stage disposition: ${disposition}" >&2
                  exit 1
                  ;;
              esac
              printf '%s_disposition=%s\n' "$stage" "$disposition" >> "$summary"
            else
              if [[ -n "$blocker" ]]; then
                disposition="NotRunDueToPredecessorFailure:${blocker}"
              else
                disposition="InfrastructureAborted"
                blocker="$stage"
                diagnostic_complete="false"
              fi
              printf '%s_disposition=%s\n' "$stage" "$disposition" >> "$summary"
            fi
          done

          printf 'diagnostic_evidence_complete=%s\n' "$diagnostic_complete" >> "$summary"
          summary_sha256="$(sha256sum "$summary" | awk '{print $1}')"
          printf 'summary_sha256=%s\n' "$summary_sha256" >> "$GITHUB_ENV"
          echo "EUREKA_STAGE_EVIDENCE_SUMMARY=$summary" >> "$GITHUB_ENV"

          if [[ "$diagnostic_complete" != "true" ]]; then
            echo "Qualification stage evidence is incomplete" >&2
            exit 1
          fi

      - name: Verify exact-subject postflight and seal PASS receipt
        shell: bash
        run: |
          set -euo pipefail

          workflow_path=".github/workflows/eureka-v2-backend-qualification.yml"
          current_head="$(git rev-parse HEAD)"
          current_tree="$(git rev-parse 'HEAD^{tree}')"
          current_lock="$(sha256sum Cargo.lock | awk '{print $1}')"
          current_workflow="$(sha256sum "$workflow_path" | awk '{print $1}')"
          current_interpreted_workflow="$(git show "${EUREKA_GITHUB_WORKFLOW_SHA}:${workflow_path}" | sha256sum | awk '{print $1}')"
          current_contract="$(sha256sum "$EUREKA_QUALIFICATION_CONTRACT" | awk '{print $1}')"
          current_stage_runner="$(sha256sum "$EUREKA_STAGE_RUNNER" | awk '{print $1}')"

          [[ "$current_head" == "$EXPECTED_SUBJECT_SHA" ]] || {
            echo "HEAD no longer equals intended qualification subject" >&2
            exit 1
          }
          [[ "$current_head" == "$EUREKA_SUBJECT_HEAD" ]] || {
            echo "HEAD changed during qualification" >&2
            exit 1
          }
          [[ "$current_tree" == "$EUREKA_SUBJECT_TREE" ]] || {
            echo "Git tree changed during qualification" >&2
            exit 1
          }
          [[ "$current_lock" == "$EUREKA_CARGO_LOCK_SHA256" ]] || {
            echo "Cargo.lock changed during qualification" >&2
            exit 1
          }
          [[ "$current_workflow" == "$EUREKA_WORKFLOW_SHA256" ]] || {
            echo "Qualifier workflow changed during qualification" >&2
            exit 1
          }
          [[ "$current_interpreted_workflow" == "$EUREKA_WORKFLOW_SHA256" ]] || {
            echo "GitHub-interpreted qualifier workflow no longer matches the trusted subject workflow bytes" >&2
            exit 1
          }
          [[ "$current_contract" == "$EUREKA_COMMAND_CONTRACT_SHA256" ]] || {
            echo "Qualification command contract changed during qualification" >&2
            exit 1
          }
          [[ "$current_stage_runner" == "$EUREKA_STAGE_RUNNER_SHA256" ]] || {
            echo "Qualification stage runner changed during qualification" >&2
            exit 1
          }

          [[ -f "$EUREKA_STAGE_EVIDENCE_SUMMARY" ]] || {
            echo "Stage-evidence summary is missing" >&2
            exit 1
          }
          for stage in check test clippy; do
            grep -qx "${stage}_disposition=Passed" "$EUREKA_STAGE_EVIDENCE_SUMMARY" || {
              echo "Stage-evidence summary does not prove PASS for ${stage}" >&2
              exit 1
            }
          done
          grep -qx 'diagnostic_evidence_complete=true' "$EUREKA_STAGE_EVIDENCE_SUMMARY" || {
            echo "Stage forensic evidence is incomplete" >&2
            exit 1
          }

          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            echo "Checkout mutated during qualification:" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi

          {
            printf 'postflight_head=%s\n' "$current_head"
            printf 'postflight_tree=%s\n' "$current_tree"
            printf 'postflight_cargo_lock_sha256=%s\n' "$current_lock"
            printf 'postflight_workflow_sha256=%s\n' "$current_workflow"
            printf 'postflight_command_contract_sha256=%s\n' "$current_contract"
            printf 'checkout_clean_after=true\n'
          } >> "$EUREKA_QUALIFICATION_RECEIPT"

          required_keys=(
            receipt_schema_revision
            qualification_revision
            command_contract_revision
            repository
            event
            github_run_id
            github_run_attempt
            github_workflow_ref
            expected_subject_head
            subject_head
            subject_tree
            cargo_lock_sha256
            workflow_sha256
            command_contract_sha256
            rustc_version
            cargo_version
            checkout_clean_before
            claim_scope
            execution_authority_granted
            real_canary_executed
            heldout_executed
            confirmatory_evidence_minted
            postflight_head
            postflight_tree
            postflight_cargo_lock_sha256
            postflight_workflow_sha256
            postflight_command_contract_sha256
            checkout_clean_after
          )
          for key in "${required_keys[@]}"; do
            count="$(grep -c "^${key}=" "$EUREKA_QUALIFICATION_RECEIPT" || true)"
            if [[ "$count" != "1" ]]; then
              echo "Receipt key must occur exactly once: $key (count=$count)" >&2
              exit 1
            fi
          done

          if grep -q '^qualification_result=' "$EUREKA_QUALIFICATION_RECEIPT"; then
            echo "qualification_result appeared before final receipt sealing" >&2
            exit 1
          fi

          printf 'qualification_result=PASS\n' >> "$EUREKA_QUALIFICATION_RECEIPT"

      - name: Upload exact qualification receipt, contract, and stage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eureka-v2-backend-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/eureka-v2-backend-qualification.env
            ${{ runner.temp }}/eureka-v2-stage-evidence/
            .github/eureka/eureka-v2-backend-qualification-contract.sh
            .github/eureka/eureka-v2-qualification-stage-runner.py
          if-no-files-found: error
          retention-days: 90
