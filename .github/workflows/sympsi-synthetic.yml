name: SYMPsi Synthetic Qualification

on:
  pull_request:
    paths:
      - "tools/sympsi-synthetic-harness/**"
      - ".github/workflows/sympsi-synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sympsi-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  synthetic-qualification:
    name: Synthetic-only four/five-choice qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path tools/sympsi-synthetic-harness/Cargo.toml --all -- --check

      - name: Unit tests
        run: cargo test --manifest-path tools/sympsi-synthetic-harness/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path tools/sympsi-synthetic-harness/Cargo.toml --all-targets -- -D warnings

      - name: Qualify four-choice synthetic profile
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          cargo run --manifest-path tools/sympsi-synthetic-harness/Cargo.toml --
          --profile four-choice
          --git-head "$EXACT_HEAD"
          --manifest tools/sympsi-synthetic-harness/fixtures/manifest-v0.1.json
          --out "$RUNNER_TEMP/sympsi-four-choice-receipt.json"

      - name: Qualify five-choice synthetic profile
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          cargo run --manifest-path tools/sympsi-synthetic-harness/Cargo.toml --
          --profile five-choice
          --git-head "$EXACT_HEAD"
          --manifest tools/sympsi-synthetic-harness/fixtures/manifest-v0.1.json
          --out "$RUNNER_TEMP/sympsi-five-choice-receipt.json"
