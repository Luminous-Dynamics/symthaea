name: HDC-CRYPTO-FV-001 Negative Theorems

on:
  pull_request:
    paths:
      - "formal/lean/hdc/HdcCryptoNegative.lean"
      - "docs/formal/hdc-crypto-fv-001-negative-theorems-v1.json"
      - "scripts/validate_hdc_crypto_fv_001.py"
      - "crates/core/symthaea-hdc-crypto/src/crypto.rs"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/hdc-crypto-fv-001.yml"
  push:
    branches: [main]
    paths:
      - "formal/lean/hdc/HdcCryptoNegative.lean"
      - "docs/formal/hdc-crypto-fv-001-negative-theorems-v1.json"
      - "scripts/validate_hdc_crypto_fv_001.py"
      - "crates/core/symthaea-hdc-crypto/src/crypto.rs"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/hdc-crypto-fv-001.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hdc-crypto-fv-001-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  negative-theorems:
    name: Lean HDC crypto negative theorems
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact Git subject
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain=v1 --untracked-files=all

      - name: Static contract and negative controls
        run: python3 scripts/validate_hdc_crypto_fv_001.py

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Typecheck negative theorems
        run: |
          set -euo pipefail
          nix develop .#formal --command sh -c '
            set -eu
            lean --version | tee /tmp/hdc-crypto-fv-001-lean-version.txt
            lean formal/lean/hdc/HdcCryptoNegative.lean | tee /tmp/hdc-crypto-fv-001-lean-output.txt
          '

      - name: Postflight immutability and receipt
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path.cwd()
          source_commit = "2dfddf6027d8eaf62221f8a71be2bb6d1d7bd9a9"
          source_path = "crates/core/symthaea-hdc-crypto/src/crypto.rs"
          def git(*args): return subprocess.check_output(["git", *args], text=True).strip()
          def sha256(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          receipt = {
              "schema": "symthaea.formal.hdc-crypto-fv-001-receipt.v1",
              "issue": 5864,
              "parent_issue": 5862,
              "evidence_class": "AbstractFormalTheorem",
              "result": "LeanTypecheckedNegativeSecurityTheorems",
              "head": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "source_commit": source_commit,
              "source_blob": git("rev-parse", f"{source_commit}:{source_path}"),
              "head_source_blob": git("rev-parse", f"HEAD:{source_path}"),
              "lean_version": Path("/tmp/hdc-crypto-fv-001-lean-version.txt").read_text().strip(),
              "proof_sha256": sha256("formal/lean/hdc/HdcCryptoNegative.lean"),
              "manifest_sha256": sha256("docs/formal/hdc-crypto-fv-001-negative-theorems-v1.json"),
              "validator_sha256": sha256("scripts/validate_hdc_crypto_fv_001.py"),
              "static_contract": "PASS",
              "negative_controls": "PASS",
              "lean_exit_zero": True,
              "repository_postflight_clean": True,
              "nonclaims": [
                  "not-rust-refinement",
                  "not-positive-mac-security",
                  "not-positive-threshold-security"
              ]
          }
          Path("/tmp/hdc-crypto-fv-001-receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Retain proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hdc-crypto-fv-001-${{ github.sha }}
          path: |
            /tmp/hdc-crypto-fv-001-lean-version.txt
            /tmp/hdc-crypto-fv-001-lean-output.txt
            /tmp/hdc-crypto-fv-001-receipt.json
          if-no-files-found: error
          retention-days: 30
