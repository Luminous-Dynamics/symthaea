name: MEL agency transaction trace qualification

on:
  pull_request:
    paths:
      - "tools/mel-agency-trace/**"
      - "docs/research/MEL_AGENCY_TRANSACTION_TRACE_V1_2026-11-22.md"
      - ".github/workflows/mel-agency-transaction-trace.yml"

permissions:
  contents: read

jobs:
  agency-trace-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Capture committed source identities
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/mel-agency-trace-evidence"
          printf 'triggered_revision=%s\n' "$actual" > "$RUNNER_TEMP/mel-agency-trace-evidence/triggered_revision.txt"
          git rev-parse HEAD:tools/mel-agency-trace/src/lib.rs > "$RUNNER_TEMP/mel-agency-trace-evidence/committed_lib_git_blob.txt"
          git rev-parse HEAD:tools/mel-agency-trace/src/main.rs > "$RUNNER_TEMP/mel-agency-trace-evidence/committed_main_git_blob.txt"
          sha256sum tools/mel-agency-trace/src/lib.rs > "$RUNNER_TEMP/mel-agency-trace-evidence/committed_lib_worktree.sha256"
          sha256sum tools/mel-agency-trace/src/main.rs > "$RUNNER_TEMP/mel-agency-trace-evidence/committed_main_worktree.sha256"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Normalize formatting and record exact diff
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 fmt --manifest-path tools/mel-agency-trace/Cargo.toml
          git diff --check
          git diff -- tools/mel-agency-trace/src/lib.rs tools/mel-agency-trace/src/main.rs > "$RUNNER_TEMP/mel-agency-trace-evidence/rustfmt-normalization.diff"
          sha256sum tools/mel-agency-trace/src/lib.rs > "$RUNNER_TEMP/mel-agency-trace-evidence/normalized_lib_worktree.sha256"
          sha256sum tools/mel-agency-trace/src/main.rs > "$RUNNER_TEMP/mel-agency-trace-evidence/normalized_main_worktree.sha256"
      - name: Verify normalized formatting
        run: cargo +1.96.0 fmt --check --manifest-path tools/mel-agency-trace/Cargo.toml
      - name: Generate isolated dependency lock
        run: cargo +1.96.0 generate-lockfile --manifest-path tools/mel-agency-trace/Cargo.toml
      - name: Run lifecycle and adversarial tests on normalized source
        run: cargo +1.96.0 test --locked --manifest-path tools/mel-agency-trace/Cargo.toml
      - name: Run warnings-denied Clippy on normalized source
        run: cargo +1.96.0 clippy --locked --manifest-path tools/mel-agency-trace/Cargo.toml -- -D warnings
      - name: Parse schema and fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool tools/mel-agency-trace/schema/mel-agency-transaction-trace-v1.schema.json > /dev/null
          python -m json.tool tools/mel-agency-trace/fixtures/apply-approved-undo-v1.json > /dev/null
          python -m json.tool tools/mel-agency-trace/fixtures/suggest-only-v1.json > /dev/null
      - name: Replay known-answer fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --quiet --manifest-path tools/mel-agency-trace/Cargo.toml -- tools/mel-agency-trace/fixtures/apply-approved-undo-v1.json > "$RUNNER_TEMP/apply-undo-report.json"
          cargo +1.96.0 run --locked --quiet --manifest-path tools/mel-agency-trace/Cargo.toml -- tools/mel-agency-trace/fixtures/suggest-only-v1.json > "$RUNNER_TEMP/suggest-only-report.json"
          python -m json.tool "$RUNNER_TEMP/apply-undo-report.json" > /dev/null
          python -m json.tool "$RUNNER_TEMP/suggest-only-report.json" > /dev/null
      - name: Record dependency, reports and revision identities
        shell: bash
        run: |
          set -euo pipefail
          cp tools/mel-agency-trace/Cargo.lock "$RUNNER_TEMP/mel-agency-trace-evidence/Cargo.lock"
          cp "$RUNNER_TEMP/apply-undo-report.json" "$RUNNER_TEMP/mel-agency-trace-evidence/"
          cp "$RUNNER_TEMP/suggest-only-report.json" "$RUNNER_TEMP/mel-agency-trace-evidence/"
          sha256sum tools/mel-agency-trace/Cargo.lock > "$RUNNER_TEMP/mel-agency-trace-evidence/lock.sha256"
          printf 'tested_revision=%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/mel-agency-trace-evidence/tested_revision.txt"
          printf 'source_test_mode=rustfmt-normalized-working-tree; not identical to committed working-tree bytes\n' > "$RUNNER_TEMP/mel-agency-trace-evidence/source_test_mode.txt"
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: mel-agency-trace-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/mel-agency-trace-evidence/
          if-no-files-found: error
          retention-days: 90
