name: Economic Measurement Binding Qualification

on:
  pull_request:
    paths:
      - 'crates/domains/symthaea-economics/tests/measurement_binding_qualification.rs'
      - '.github/workflows/economic-measurement-binding.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy

      - name: Freeze measurement theorem and qualification-only scope
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          test_path = Path('crates/domains/symthaea-economics/tests/measurement_binding_qualification.rs')
          text = test_path.read_text()
          ontology = Path('crates/domains/symthaea-economics/src/ontology.rs').read_text()

          required = [
              'struct MeasurementSpecification',
              'variable_id: VariableId',
              'construct_id: String',
              'source_namespace: String',
              'source_series_id: String',
              'source_unit: UnitId',
              'output_unit: UnitId',
              'population_scope: String',
              'temporal_semantics: TemporalSemantics',
              'enum MeasurementClass',
              'Direct,',
              'Derived,',
              'Proxy,',
              'LatentEstimate,',
              'MeasurementAdmission::DirectObservation',
              'MeasurementAdmission::DerivedObservation',
              'MeasurementAdmission::ProxyObservation',
              'MeasurementAdmission::LatentEstimate',
              'same_unit_does_not_make_a_different_construct_the_target_variable',
              'population_scope_and_temporal_semantics_are_part_of_measurement_identity',
              'direct_measurement_cannot_hide_unit_conversion_or_method_logic',
              'output_unit_must_match_the_etir_variable_unit',
              'proxy_and_latent_estimate_cannot_upgrade_to_direct_observation',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'missing measurement qualification invariant: {needle}')

          # Preserve the foundation theorem: EconomicVariable says what theory
          # talks about, not which external dataset is authoritative for it.
          forbidden_ontology = [
              'source_series_id',
              'measurement_source',
              'observable: bool',
              'proxy_basis',
              'estimator_artifact',
          ]
          for needle in forbidden_ontology:
              if needle in ontology:
                  raise SystemExit(
                      f'EconomicVariable acquired measurement authority; re-audit layering: {needle}'
                  )

          forbidden_test = [
              'reqwest::',
              'ureq::',
              'SystemTime::now',
              'Utc::now',
              'serde_json::',
              'sha2::',
              'blake3::',
              'EvidenceChannel::',
              'NormativeProposition',
          ]
          for needle in forbidden_test:
              if needle in text:
                  raise SystemExit(f'measurement theorem acquired unrelated authority: {needle}')

          base = subprocess.check_output(
              ['git', 'merge-base', 'HEAD', 'origin/' + '${{ github.base_ref }}'],
              text=True,
          ).strip()
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD'],
              text=True,
          ).splitlines())
          allowed = {
              '.github/workflows/economic-measurement-binding.yml',
              'crates/domains/symthaea-economics/tests/measurement_binding_qualification.rs',
          }
          if changed != allowed:
              raise SystemExit(
                  f'measurement qualification must remain exactly two files; got {sorted(changed)}'
              )

          forbidden_product = {
              'crates/domains/symthaea-economics/src/ontology.rs',
              'crates/domains/symthaea-economics/src/etir.rs',
              'crates/domains/symthaea-economics/src/theory.rs',
              'crates/domains/symthaea-economics/src/science.rs',
              'crates/domains/symthaea-economics/src/lib.rs',
              'crates/domains/symthaea-economics/Cargo.toml',
              'Cargo.lock',
          }
          touched = changed & forbidden_product
          if touched:
              raise SystemExit(f'qualification spike modified product/manifest state: {sorted(touched)}')

      - name: Locked workspace metadata
        run: cargo metadata --locked --no-deps > /dev/null

      - name: Rustfmt
        run: cargo fmt -p symthaea-economics -- --check

      - name: Measurement binding qualification test
        run: cargo test --locked -p symthaea-economics --test measurement_binding_qualification

      - name: Strict focused Clippy
        run: cargo clippy --locked -p symthaea-economics --test measurement_binding_qualification -- -D warnings
