name: Psych-Bench Retired Evidence Surface

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/psych-bench-retired-evidence.yml'
      - 'crates/domains/symthaea-psych-bench/tests/consensus_ab_comparison.rs'
      - 'crates/domains/symthaea-psych-bench/Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-consensus-ab:
    name: Exact-subject retired consensus A/B surface
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Bind exact subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          printf 'qualified_subject=%s\n' "$actual"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup default 1.96.0
          rustc --version --verbose
          cargo --version

      - name: Retirement source gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/domains/symthaea-psych-bench/tests/consensus_ab_comparison.rs')
          text = path.read_text()
          required = [
              'RETIRED_EVIDENCE_SURFACE',
              'consensus_ab_comparison_is_retired_until_intervention_reachability_is_requalified',
          ]
          forbidden = [
              'CognitiveLoopBenchmarkRunner',
              'LoopBenchmarkResult',
              'run_benchmark(',
              'accuracy_delta',
              'prediction_error_delta',
              'consensus_vs_sequential_psych_bench',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing retirement marker: {marker}')
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'retired evidence surface still contains execution machinery: {marker}')
          PY

      - name: Retirement format diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            crates/domains/symthaea-psych-bench/tests/consensus_ab_comparison.rs

      - name: Compile retired test target
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symthaea-psych-bench \
            --test consensus_ab_comparison --no-run

      - name: Historical evidence invocation fails closed
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/retired-consensus-ab.log"
          set +e
          cargo test --locked -p symthaea-psych-bench \
            --test consensus_ab_comparison -- --ignored --nocapture \
            >"$output" 2>&1
          status=$?
          set -e
          cat "$output"
          test "$status" -ne 0
          grep -F 'RETIRED_EVIDENCE_SURFACE' "$output"

      - name: Postflight exact-subject immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.subject.outputs.sha }}'
          git diff --exit-code
          test -z "$(git status --porcelain)"
