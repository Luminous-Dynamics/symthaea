# Mycelix Python ML - Python SDK CI/CD
# NOTE: 0TML/kosmic-lab tests have been removed as the kosmic-lab submodule
# was moved to a separate standalone repository.

name: Python ML

on:
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/sdk-python/**'
      - '.github/workflows/python-ml.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-workspace/sdk-python/**'

concurrency:
  group: python-ml-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # Python SDK Tests
  # ============================================================================
  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/sdk-python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sdk-${{ hashFiles('mycelix-workspace/sdk-python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-sdk-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check --diff .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy mycelix --strict

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=mycelix --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: mycelix-workspace/sdk-python/coverage.xml
          flags: python-sdk
          fail_ci_if_error: false

  # ============================================================================
  # Security Audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install pip-audit bandit safety

      - name: Run pip-audit on SDK
        run: |
          if [ -f "mycelix-workspace/sdk-python/pyproject.toml" ]; then
            cd mycelix-workspace/sdk-python
            pip install -e . --dry-run 2>/dev/null || true
            # Fail on vulnerabilities - security must not be bypassed
            pip-audit
          fi

      - name: Run bandit security scan
        run: |
          # Run bandit on SDK only (0TML has been moved to kosmic-lab repo)
          # Bandit exits non-zero when findings exist, so capture exit code
          bandit -r mycelix-workspace/sdk-python/mycelix -f json -o bandit-report.json -ll; BANDIT_EXIT=$?
          # Check for high-severity findings and fail if found
          if grep -q '"severity": "HIGH"' bandit-report.json 2>/dev/null; then
            echo "::error::High severity security issues found by bandit"
            cat bandit-report.json
            exit 1
          fi
          # Report medium/low findings as warnings but don't fail
          if [ $BANDIT_EXIT -ne 0 ]; then
            echo "::warning::Bandit found low/medium severity issues"
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
          if-no-files-found: ignore

  # ============================================================================
  # Documentation Build
  # ============================================================================
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [sdk-python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install documentation tools
        run: |
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints myst-parser

      - name: Install SDK
        run: |
          if [ -f "mycelix-workspace/sdk-python/pyproject.toml" ]; then
            pip install -e mycelix-workspace/sdk-python
          fi

      - name: Build docs
        run: |
          if [ -d "mycelix-workspace/sdk-python/docs" ]; then
            cd mycelix-workspace/sdk-python/docs
            make html
          else
            echo "No docs directory found, skipping"
          fi
        continue-on-error: true

  # ============================================================================
  # Summary
  # ============================================================================
  python-ml-summary:
    name: Python ML Summary
    if: always()
    needs: [sdk-python, security]
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        run: |
          echo "## Python ML Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python SDK | ${{ needs.sdk-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** 0TML/kosmic-lab tests have been moved to a separate repository." >> $GITHUB_STEP_SUMMARY
