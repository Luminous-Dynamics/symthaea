name: First-Aid Contract (Research Only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/first-aid-contract.yml"
      - "docs/research/first-aid/**"
      - "xtask/src/first_aid.rs"
      - "xtask/src/main.rs"
      - "xtask/Cargo.toml"
      - "Cargo.toml"
  push:
    branches:
      - research/first-aid-safety-bench-v0
    paths:
      - ".github/workflows/first-aid-contract.yml"
      - "docs/research/first-aid/**"
      - "xtask/src/first_aid.rs"
      - "xtask/src/main.rs"
      - "xtask/Cargo.toml"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-aid-contract-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  first-aid-contract:
    name: First-aid contract validation (non-clinical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact change head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record and verify tested revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting for changed Rust files
        run: rustfmt --edition 2024 --check xtask/src/main.rs xtask/src/first_aid.rs

      - name: Verify contract validator unit tests
        run: cargo test -p xtask first_aid::tests -- --nocapture

      - name: Run the synthetic contract validator
        run: cargo run -p xtask -- first-aid-validate --out target/first-aid-contract-receipt.json

      - name: Check warnings in xtask
        run: cargo clippy -p xtask --all-targets -- -D warnings

      - name: Confirm receipt exists and has non-clinical claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          test -s target/first-aid-contract-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("target/first-aid-contract-receipt.json").read_text())
          assert receipt["status"] == "contract_validation_passed"
          assert receipt["scenario_count"] == 24
          assert receipt["benchmark_count"] == 15
          assert receipt["claim_ceiling"] == "synthetic contract integrity only; no clinical validation"
          for key in ("corpus_sha256", "benchmark_sha256", "schema_sha256",
                      "validator_source_sha256", "entrypoint_source_sha256",
                      "executable_sha256"):
              value = receipt[key]
              assert len(value) == 64 and all(c in "0123456789abcdef" for c in value), key
          print(json.dumps(receipt, indent=2))
          PY

      - name: Publish non-clinical validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: first-aid-contract-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/first-aid-contract-receipt.json
          if-no-files-found: error
          retention-days: 30
