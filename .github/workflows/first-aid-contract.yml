name: First-Aid Contract (Research Only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/first-aid-contract.yml"
      - "docs/research/first-aid/**"
      - "xtask/src/first_aid.rs"
      - "xtask/src/main.rs"
      - "xtask/Cargo.toml"
      - "Cargo.toml"
  push:
    branches:
      - research/first-aid-safety-bench-v0
    paths:
      - ".github/workflows/first-aid-contract.yml"
      - "docs/research/first-aid/**"
      - "xtask/src/first_aid.rs"
      - "xtask/src/main.rs"
      - "xtask/Cargo.toml"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-aid-contract-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  first-aid-contract:
    name: First-aid contract validation (non-clinical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact change head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record and verify tested revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting for changed Rust files
        run: rustfmt --edition 2024 --check xtask/src/main.rs xtask/src/first_aid.rs xtask/src/guideline_change_impact.rs

      - name: Verify first-aid contract validator unit tests
        run: cargo test -p xtask first_aid::tests -- --nocapture

      - name: Verify guideline change-impact validator unit tests
        run: cargo test -p xtask guideline_change_impact::tests -- --nocapture

      - name: Run the synthetic first-aid contract validator
        env:
          FIRST_AID_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo run -p xtask -- first-aid-validate --out target/first-aid-contract-receipt.json

      - name: Run the synthetic guideline change-impact validator
        env:
          FIRST_AID_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo run -p xtask -- first-aid-change-impact-validate --out target/first-aid-change-impact-receipt.json

      - name: Check warnings in xtask
        run: cargo clippy -p xtask --all-targets -- -D warnings

      - name: Confirm both receipts match the tested head and retain non-clinical claim ceilings
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s target/first-aid-contract-receipt.json
          test -s target/first-aid-change-impact-receipt.json
          jq -e --arg expected "$EXPECTED_HEAD" '
            .status == "contract_validation_passed" and
            .source_revision_sha == $expected and
            .scenario_count == 24 and
            .benchmark_count == 16 and
            .claim_ceiling == "synthetic contract integrity only; no clinical validation" and
            ([.corpus_sha256, .benchmark_sha256, .schema_sha256,
              .validator_source_sha256, .entrypoint_source_sha256,
              .executable_sha256] | all(test("^[0-9a-f]{64}$")))
          ' target/first-aid-contract-receipt.json
          jq -e --arg expected "$EXPECTED_HEAD" '
            .status == "synthetic_change_impact_contract_passed" and
            .source_revision_sha == $expected and
            .source_requirement_count == 5 and
            .mapped_requirement_count == 3 and
            .change_record_count == 2 and
            .claim_ceiling == "synthetic source-change mapping integrity only; no clinical validation" and
            ([.contract_sha256, .validator_source_sha256,
              .entrypoint_source_sha256, .executable_sha256] | all(test("^[0-9a-f]{64}$"))) and
            (.source_artifact_sha256 | length == 2) and
            ([.source_artifact_sha256[]] | all(test("^[0-9a-f]{64}$")))
          ' target/first-aid-change-impact-receipt.json
          jq . target/first-aid-contract-receipt.json
          jq . target/first-aid-change-impact-receipt.json

      - name: Publish non-clinical validation receipts
        uses: actions/upload-artifact@v4
        with:
          name: first-aid-evidence-receipts-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/first-aid-contract-receipt.json
            target/first-aid-change-impact-receipt.json
          if-no-files-found: error
          retention-days: 30
