name: Simulation First Instruction Release

on:
  pull_request:
    paths:
      - "crates/bridges/symthaea-sim-release/**"
      - "crates/bridges/symthaea-sim-first-instruction-routing/**"
      - "crates/bridges/symthaea-sim-first-instruction-deployment/**"
      - "crates/bridges/symthaea-sim-first-instruction-worker/**"
      - "crates/bridges/symthaea-sim-deployment/**"
      - "crates/bridges/symthaea-sim-worker-qualification/**"
      - "crates/bridges/symthaea-sim-worker-cgroup/**"
      - "crates/bridges/symthaea-sim-worker-filesystem/**"
      - "crates/bridges/symthaea-sim-worker-containment/**"
      - "crates/bridges/symthaea-sim-worker-image/**"
      - "examples/extensions/hello-simulation/**"
      - ".github/workflows/simulation-first-instruction-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"
  SYMTHAEA_CGROUP_V2_DELEGATED_ROOT: ${{ vars.SYMTHAEA_CGROUP_V2_DELEGATED_ROOT }}

jobs:
  first-instruction-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - name: Require Linux x86_64 subject
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -r /sys/fs/cgroup/cgroup.controllers
          uname -a
          cat /sys/fs/cgroup/cgroup.controllers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Cargo and Component builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            examples/extensions/hello-simulation/target
          key: ${{ runner.os }}-simulation-first-instruction-release-${{ hashFiles('Cargo.lock', 'crates/bridges/symthaea-sim-release/**', 'crates/bridges/symthaea-sim-first-instruction-routing/**', 'crates/bridges/symthaea-sim-first-instruction-deployment/**', 'crates/bridges/symthaea-sim-first-instruction-worker/**', 'examples/extensions/hello-simulation/**') }}
          restore-keys: |
            ${{ runner.os }}-simulation-first-instruction-release-

      - name: Reconcile candidate root lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          git diff -- Cargo.lock > simulation-first-instruction-release-cargo-lock.patch
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches first-instruction release graph."
          else
            cat simulation-first-instruction-release-cargo-lock.patch
          fi

      - name: Upload candidate Cargo.lock patch
        uses: actions/upload-artifact@v4
        with:
          name: simulation-first-instruction-release-cargo-lock-patch
          path: simulation-first-instruction-release-cargo-lock.patch
          if-no-files-found: error

      - name: Require standalone guest WIT parity
        run: |
          cmp crates/core/symthaea-extension-core/wit/extension-control.wit \
              examples/extensions/hello-simulation/wit/extension-control.wit
          cmp crates/core/symthaea-extension-core/wit/simulation-provider.wit \
              examples/extensions/hello-simulation/wit/simulation-provider.wit

      - name: Build exact release Component
        run: |
          cargo build \
            --manifest-path examples/extensions/hello-simulation/Cargo.toml \
            --target wasm32-wasip2 \
            --release
          component="examples/extensions/hello-simulation/target/wasm32-wasip2/release/symthaea_hello_simulation_extension.wasm"
          test -s "$component"
          sha256sum "$component" examples/extensions/hello-simulation/manifest.json

      - name: Check formatting
        run: |
          cargo fmt \
            -p symthaea-sim-release \
            -p symthaea-sim-first-instruction-routing \
            -p symthaea-sim-first-instruction-deployment \
            -p symthaea-sim-first-instruction-worker \
            -- --check

      - name: Check release authority graph
        run: |
          cargo check --locked -p symthaea-sim-release --all-targets
          cargo check --locked -p symthaea-sim-first-instruction-routing --all-targets
          cargo check --locked -p symthaea-sim-first-instruction-deployment --all-targets
          cargo check --locked -p symthaea-sim-first-instruction-worker --all-targets

      - name: Test source corpus
        run: |
          cargo test --locked -p symthaea-sim-release
          cargo test --locked -p symthaea-sim-first-instruction-routing
          cargo test --locked -p symthaea-sim-first-instruction-deployment

      - name: Strict Clippy
        run: |
          cargo clippy --locked -p symthaea-sim-release --all-targets -- -D warnings
          cargo clippy --locked -p symthaea-sim-first-instruction-routing --all-targets -- -D warnings
          cargo clippy --locked -p symthaea-sim-first-instruction-deployment --all-targets -- -D warnings
          cargo clippy --locked -p symthaea-sim-first-instruction-worker --all-targets -- -D warnings

      - name: Build exact qualified worker and containment probes
        run: |
          cargo build --locked \
            -p symthaea-sim-worker-filesystem \
            --bin symthaea-sim-filesystem-worker \
            --bin symthaea-sim-filesystem-probe
          cargo build --locked \
            -p symthaea-sim-worker-containment \
            --bin symthaea-sim-containment-probe
          sha256sum \
            target/debug/symthaea-sim-filesystem-worker \
            target/debug/symthaea-sim-filesystem-probe \
            target/debug/symthaea-sim-containment-probe

      - name: Execute exact containment probes
        run: |
          target/debug/symthaea-sim-containment-probe \
            | tee first-instruction-release-seccomp-probe.txt
          target/debug/symthaea-sim-filesystem-probe \
            | tee first-instruction-release-landlock-probe.txt
          grep -qx 'containment_probe=pass' first-instruction-release-seccomp-probe.txt
          grep -qx 'filesystem_probe=pass' first-instruction-release-landlock-probe.txt

      - name: Mint qualification evidence root for exact worker lineage
        run: |
          {
            echo "worker_sha256=$(sha256sum target/debug/symthaea-sim-filesystem-worker | cut -d' ' -f1)"
            echo "containment_probe_sha256=$(sha256sum target/debug/symthaea-sim-containment-probe | cut -d' ' -f1)"
            echo "filesystem_probe_sha256=$(sha256sum target/debug/symthaea-sim-filesystem-probe | cut -d' ' -f1)"
            echo "worker_image_profile=symthaea.simulation.worker-image.memfd-sealed-v1"
            echo "worker_protocol=symthaea.simulation.worker.v1"
            echo "process_containment_profile=symthaea.simulation.worker-containment.seccomp-x86_64-v1"
            echo "filesystem_containment_profile=symthaea.simulation.worker-filesystem.landlock-deny-content-v1"
            echo "---seccomp-probe---"
            cat first-instruction-release-seccomp-probe.txt
            echo "---landlock-probe---"
            cat first-instruction-release-landlock-probe.txt
          } > first-instruction-release-worker-qualification-bundle.txt
          qualification_sha="$(sha256sum first-instruction-release-worker-qualification-bundle.txt | cut -d' ' -f1)"
          test "${#qualification_sha}" -eq 64
          echo "qualification_evidence_sha256=${qualification_sha}" \
            | tee first-instruction-release-worker-qualification-root.txt

      - name: Execute canonical first-instruction release corpus when cgroup root is configured
        shell: bash
        env:
          SYMTHAEA_FILESYSTEM_WORKER_BIN: ${{ github.workspace }}/target/debug/symthaea-sim-filesystem-worker
        run: |
          qualification_sha="$(cut -d= -f2 first-instruction-release-worker-qualification-root.txt)"
          if [[ -n "${SYMTHAEA_CGROUP_V2_DELEGATED_ROOT:-}" ]]; then
            SYMTHAEA_WORKER_QUALIFICATION_EVIDENCE_SHA256="$qualification_sha" \
              cargo test --locked \
                -p symthaea-sim-release \
                --test first_instruction_release \
                -- --ignored --test-threads=1
            echo 'kernel_first_instruction_release_probe=pass' \
              | tee first-instruction-release-kernel-status.txt
          else
            echo 'kernel_first_instruction_release_probe=not_established' \
              | tee first-instruction-release-kernel-status.txt
          fi

      - name: Record exact first-instruction release subject
        run: |
          component="examples/extensions/hello-simulation/target/wasm32-wasip2/release/symthaea_hello_simulation_extension.wasm"
          qualification_sha="$(cut -d= -f2 first-instruction-release-worker-qualification-root.txt)"
          kernel_probe="$(cut -d= -f2 first-instruction-release-kernel-status.txt)"
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "manifest_sha256=$(sha256sum examples/extensions/hello-simulation/manifest.json | cut -d' ' -f1)"
            echo "component_sha256=$(sha256sum "$component" | cut -d' ' -f1)"
            echo "worker_sha256=$(sha256sum target/debug/symthaea-sim-filesystem-worker | cut -d' ' -f1)"
            echo "worker_qualification_evidence_sha256=${qualification_sha}"
            echo "release_profile=symthaea.simulation.release.v1"
            echo "new_release_receipt_format=false"
            echo "private_release_finalizer_reused=true"
            echo "package_runtime=wasm_preserved_exactly"
            echo "remote_runtime_rewrite=forbidden"
            echo "first_instruction_deployment_binding_committed_by_simulation_evidence=true"
            echo "first_instruction_execution_sha_committed_by_simulation_evidence=true"
            echo "cgroup_evidence_sha_committed_by_simulation_evidence=true"
            echo "sealed_launch_evidence_sha_committed_by_simulation_evidence=true"
            echo "worker_qualification_evidence_committed_by_simulation_evidence=true"
            echo "provider_warnings_preserved=true"
            echo "extension_component_engineering_evidence=false"
            echo "final_admission_currentness_before_mint=true"
            echo "final_worker_qualification_currentness_before_mint=true"
            echo "legacy_preexec_rlimits_applied=false"
            echo "legacy_rlimit_equivalence_claim=false"
            echo "kernel_first_instruction_release_probe=${kernel_probe}"
            echo "delegation_origin_inferred_from_kernel=false"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } | tee simulation-first-instruction-release-receipt.txt

      - name: Upload first-instruction release evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-first-instruction-release-evidence
          path: |
            first-instruction-release-seccomp-probe.txt
            first-instruction-release-landlock-probe.txt
            first-instruction-release-worker-qualification-bundle.txt
            first-instruction-release-worker-qualification-root.txt
            first-instruction-release-kernel-status.txt
            simulation-first-instruction-release-receipt.txt
          if-no-files-found: error

      - name: Require committed root lockfile
        run: git diff --exit-code -- Cargo.lock
