name: MEL collaborative trace qualification

on:
  pull_request:
    branches:
      - research/mel-audio-metamorph-v1-20261122
    paths:
      - "tools/mel-judge-grounding-audit/**"
      - "docs/research/MEL_COLLAB_TRACE_AUDITOR_V1_2026-11-22.md"
      - ".github/workflows/mel-collab-trace-qualification.yml"
  push:
    branches:
      - research/mel-collab-trace-audit-stack-v1-20261122
    paths:
      - "tools/mel-judge-grounding-audit/**"
      - "docs/research/MEL_COLLAB_TRACE_AUDITOR_V1_2026-11-22.md"
      - ".github/workflows/mel-collab-trace-qualification.yml"

permissions:
  contents: read

jobs:
  trace-qualification:
    name: Causal event trace and rest-respect audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.96.0 fmt --check --manifest-path tools/mel-judge-grounding-audit/Cargo.toml
      - name: Verify committed dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch tools/mel-judge-grounding-audit/Cargo.lock > /dev/null
          test -f tools/mel-judge-grounding-audit/Cargo.lock
      - name: Run deterministic Rust tests
        run: cargo +1.96.0 test --locked --manifest-path tools/mel-judge-grounding-audit/Cargo.toml
      - name: Warnings-denied Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path tools/mel-judge-grounding-audit/Cargo.toml --all-targets -- -D warnings
      - name: Parse schema and replay known-answer interaction trace
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool tools/mel-judge-grounding-audit/schema/mel-collab-interaction-trace-v1.schema.json > /dev/null
          cargo +1.96.0 run --locked --quiet --manifest-path tools/mel-judge-grounding-audit/Cargo.toml \
            --bin mel-collab-trace-audit -- audit \
            tools/mel-judge-grounding-audit/fixtures/valid-collab-trace-v1.json \
            "$RUNNER_TEMP/mel-collab-trace-report.json"
          jq -e '.event_count == 5 and .input_chunk_count == 2 and .output_count == 1 and .emission_latency_from_input_available.p50_ns == 40 and .qualified_for_declared_trace_contract == true and .false_interruption_count == 0' \
            "$RUNNER_TEMP/mel-collab-trace-report.json" > /dev/null
      - name: Assemble exact-head reproducibility evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/mel-collab-trace-evidence"
          mkdir -p "$evidence"
          printf 'tested_head=%s\n' "$(git rev-parse HEAD)" > "$evidence/source-revision.txt"
          git rev-parse HEAD:tools/mel-judge-grounding-audit/src/collab_trace.rs > "$evidence/trace-lib-blob.txt"
          git rev-parse HEAD:tools/mel-judge-grounding-audit/src/bin/mel-collab-trace-audit.rs > "$evidence/trace-cli-blob.txt"
          rustc +1.96.0 --version > "$evidence/rustc-version.txt" 2>&1 || true
          cargo +1.96.0 --version > "$evidence/cargo-version.txt" 2>&1 || true
          cp tools/mel-judge-grounding-audit/Cargo.toml "$evidence/"
          cp tools/mel-judge-grounding-audit/Cargo.lock "$evidence/"
          cp tools/mel-judge-grounding-audit/src/collab_trace.rs "$evidence/"
          cp tools/mel-judge-grounding-audit/src/bin/mel-collab-trace-audit.rs "$evidence/"
          cp tools/mel-judge-grounding-audit/schema/mel-collab-interaction-trace-v1.schema.json "$evidence/"
          cp tools/mel-judge-grounding-audit/fixtures/valid-collab-trace-v1.json "$evidence/"
          cp docs/research/MEL_COLLAB_TRACE_AUDITOR_V1_2026-11-22.md "$evidence/"
          if [[ -f "$RUNNER_TEMP/mel-collab-trace-report.json" ]]; then
            cp "$RUNNER_TEMP/mel-collab-trace-report.json" "$evidence/"
          fi
          (cd "$evidence" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mel-collab-trace-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-collab-trace-evidence/
          if-no-files-found: error
          retention-days: 90
