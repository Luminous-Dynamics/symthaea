name: Matter Reference Si-001 Frozen Recipe

on:
  pull_request:
    paths:
      - 'research/matter-reference-capsule/si-001-protocol.json'
      - 'research/matter-reference-capsule/validate_si_001_protocol.py'
      - '.github/workflows/matter-reference-si-001-recipe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Enforce exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          parent='72a301d6c19b70af46e0831b2905ec981f470810'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          mapfile -t files < <(git diff --name-only "$parent"...HEAD | sort)
          expected=(
            '.github/workflows/matter-reference-si-001-recipe.yml'
            'research/matter-reference-capsule/si-001-protocol.json'
            'research/matter-reference-capsule/validate_si_001_protocol.py'
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${files[$i]}" = "${expected[$i]}"
          done
          git diff --check "$parent"...HEAD

      - name: Validate frozen recipe and mutation regressions
        run: |
          set -euo pipefail
          validator='research/matter-reference-capsule/validate_si_001_protocol.py'
          protocol='research/matter-reference-capsule/si-001-protocol.json'
          python -m py_compile "$validator"
          python "$validator" "$protocol"
          python "$validator" "$protocol" --self-test

      - name: Ratchet solver and structure contract
        shell: bash
        run: |
          set -euo pipefail
          p='research/matter-reference-capsule/si-001-protocol.json'
          grep -Fq '"quantum_espresso_version": "7.5"' "$p"
          grep -Fq '"aiida_core_version": "2.9.2"' "$p"
          grep -Fq '"aiida_quantumespresso_version": "5.0.0"' "$p"
          grep -Fq '"family": "SSSP/1.3/PBE/precision"' "$p"
          grep -Fq '"qe_ibrav": 2' "$p"
          grep -Fq '"conventional_lattice_parameter_angstrom": 5.6' "$p"
          grep -Fq '"cell_dofree": "ibrav"' "$p"
          if grep -Fq '"cell_dofree": "volume"' "$p"; then
            echo "cell_dofree=volume is forbidden for this fcc recipe" >&2
            exit 1
          fi

      - name: Ratchet fixed convergence experiment
        shell: bash
        run: |
          set -euo pipefail
          p='research/matter-reference-capsule/si-001-protocol.json'
          grep -Fq '"ecutwfc_multipliers_of_sssp_recommendation": [0.75, 1.0, 1.25, 1.5]' "$p"
          grep -Fq '"ecutrho_multipliers_of_sssp_recommendation": [0.75, 1.0, 1.25, 1.5]' "$p"
          grep -Fq '"energy_tolerance_ev_per_atom": 0.001' "$p"
          grep -Fq '"required_final_consecutive_deltas_within_tolerance": 2' "$p"
          grep -Fq '"run_all_samples_even_if_early_plateau_is_observed": true' "$p"
          grep -Fq '"no_adaptive_extension_of_convergence_series": true' "$p"
          grep -Fq '"failed_criterion_means_benchmark_failure_not_retuning": true' "$p"

      - name: Ratchet relaxation and phonon physics
        shell: bash
        run: |
          set -euo pipefail
          p='research/matter-reference-capsule/si-001-protocol.json'
          grep -Fq '"max_force_ev_per_angstrom": 0.01' "$p"
          grep -Fq '"max_abs_stress_gpa": 0.1' "$p"
          grep -Fq '"max_relative_cell_change": 0.0001' "$p"
          grep -Fq '"q_grid": [4, 4, 4]' "$p"
          grep -Fq '"lshift_q": false' "$p"
          grep -Fq '"zasr": "crystal"' "$p"
          grep -Fq '"asr": "crystal"' "$p"
          grep -Fq '"stability_sampling_mesh": [16, 16, 16]' "$p"
          grep -Fq '"imaginary_frequency_tolerance_thz": 0.1' "$p"
          grep -Fq '"must_reuse_exact_final_relaxation_structure_node": true' "$p"

      - name: Ratchet authority and blind-result boundary
        shell: bash
        run: |
          set -euo pipefail
          p='research/matter-reference-capsule/si-001-protocol.json'
          grep -Fq '"authority": "PreregisteredExecutionRecipeOnly"' "$p"
          grep -Fq '"thermodynamic_phase_eligibility": "WithheldByProtocol"' "$p"
          grep -Fq '"expected_results": null' "$p"
          grep -Fq '"convex_hull_eligible": false' "$p"
          grep -Fq '"expected_lattice_constant_not_encoded": true' "$p"
          grep -Fq '"expected_total_energy_not_encoded": true' "$p"
          grep -Fq '"expected_phonon_frequencies_not_encoded": true' "$p"
          grep -Fq '"reference_comparison_occurs_only_after_capsule_is_frozen": true' "$p"
