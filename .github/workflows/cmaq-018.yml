name: CMAQ-018 matched-history counterfactual branch fidelity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/cmaq-018/**"
      - ".github/workflows/cmaq-018.yml"
  push:
    branches: [main]
    paths:
      - "research/cmaq-018/**"
      - ".github/workflows/cmaq-018.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        working-directory: research/cmaq-018
        run: cargo fmt --all -- --check
      - name: Unit tests
        working-directory: research/cmaq-018
        run: cargo test --locked
      - name: Clippy
        working-directory: research/cmaq-018
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Generate and validate branch report
        working-directory: research/cmaq-018
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --locked > /tmp/cmaq-018-report.json
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import struct
          from pathlib import Path
          from jsonschema import Draft202012Validator, ValidationError, validate

          report = json.loads(Path("/tmp/cmaq-018-report.json").read_text())
          schema = json.loads(Path("report.schema.json").read_text())
          validate(instance=report, schema=schema)

          uncertainty_schema = json.loads(
              Path("uncertainty-contract.v0.1.schema.json").read_text()
          )
          Draft202012Validator.check_schema(uncertainty_schema)

          joint_bank_schema = json.loads(Path("joint-action-bank.v0.1.schema.json").read_text())
          Draft202012Validator.check_schema(joint_bank_schema)
          joint_bank = json.loads(Path("fixtures/joint-action-bank.example.json").read_text())
          validate(instance=joint_bank, schema=joint_bank_schema)
          assert joint_bank["schema_version"] == "cmaq-018-joint-action-bank-v0.1"
          assert len(joint_bank["action_ids"]) == 3
          assert len(joint_bank["joint_draw_ids"]) == 5
          assert len(joint_bank["outcome_samples"]) == len(joint_bank["action_ids"])
          assert all(len(row) == len(joint_bank["joint_draw_ids"])
                     for row in joint_bank["outcome_samples"])

          def canonical_joint_draw_bank_digest(bank):
              payload = bytearray(b"cmaq-018-joint-action-bank-v0.1\0")

              def append_text(value):
                  encoded = value.encode("utf-8")
                  payload.extend(struct.pack("<Q", len(encoded)))
                  payload.extend(encoded)

              def append_ids(values):
                  payload.extend(struct.pack("<Q", len(values)))
                  for value in values:
                      payload.extend(struct.pack("<Q", value))

              append_text(bank["history_sha256"])
              payload.extend(struct.pack("<Q", bank["horizon_steps"]))
              append_text(bank["action_manifest_sha256"])
              append_text(bank["outcome_channel"])
              append_ids(bank["action_ids"])
              append_ids(bank["joint_draw_ids"])
              payload.append({
                  "shared_posterior_and_world_noise": 0,
                  "paired_exogenous_disturbance": 1,
                  "deterministic_shared_latent": 2,
              }[bank["coupling"]])
              payload.extend(struct.pack("<Q", len(bank["outcome_samples"])))
              for row in bank["outcome_samples"]:
                  payload.extend(struct.pack("<Q", len(row)))
                  for value in row:
                      payload.extend(struct.pack("<d", value))
              return hashlib.sha256(payload).hexdigest()

          assert canonical_joint_draw_bank_digest(joint_bank) == joint_bank["joint_draw_bank_sha256"]
          assert joint_bank["joint_draw_bank_sha256"] == (
              "47a1f2b937faef8235704f6907523967c946cad8184bf7c5f643916bd3441979"
          )

          permuted_bank = json.loads(json.dumps(joint_bank))
          permuted_bank["action_ids"] = [9, 17, 3]
          permuted_bank["outcome_samples"] = [
              joint_bank["outcome_samples"][2],
              joint_bank["outcome_samples"][0],
              joint_bank["outcome_samples"][1],
          ]
          assert canonical_joint_draw_bank_digest(permuted_bank) != joint_bank["joint_draw_bank_sha256"]

          hostile_bank = json.loads(json.dumps(joint_bank))
          hostile_bank["action_ids"][1] = hostile_bank["action_ids"][0]
          try:
              validate(instance=hostile_bank, schema=joint_bank_schema)
          except ValidationError:
              pass
          else:
              raise AssertionError("joint action-bank contract admitted duplicate action IDs")

          hostile_bank = json.loads(json.dumps(joint_bank))
          hostile_bank["joint_draw_ids"][1] = hostile_bank["joint_draw_ids"][0]
          try:
              validate(instance=hostile_bank, schema=joint_bank_schema)
          except ValidationError:
              pass
          else:
              raise AssertionError("joint action-bank contract admitted duplicate draw IDs")

          hostile_bank = json.loads(json.dumps(joint_bank))
          hostile_bank["outcome_samples"][1].pop()
          assert any(len(row) != len(hostile_bank["joint_draw_ids"])
                     for row in hostile_bank["outcome_samples"])

          hostile_bank = json.loads(json.dumps(joint_bank))
          hostile_bank["outcome_samples"][0][0] += 0.25
          assert canonical_joint_draw_bank_digest(hostile_bank) != joint_bank["joint_draw_bank_sha256"]

          structured_schema = json.loads(
              Path("structured-visual-action-bank.v0.1.schema.json").read_text()
          )
          Draft202012Validator.check_schema(structured_schema)
          structured_bank = json.loads(
              Path("fixtures/structured-visual-action-bank.example.json").read_text()
          )
          validate(instance=structured_bank, schema=structured_schema)
          assert len(structured_bank["channels"]) == 2
          assert all(
              len(channel["outcome_samples"]) == len(structured_bank["action_ids"])
              for channel in structured_bank["channels"]
          )
          assert all(
              len(row) == len(structured_bank["joint_draw_ids"])
              for channel in structured_bank["channels"]
              for row in channel["outcome_samples"]
          )

          def canonical_structured_bank_digest(bank):
              payload = bytearray(b"cmaq-018-structured-visual-action-bank-v0.1\0")

              def append_text(value):
                  encoded = value.encode("utf-8")
                  payload.extend(struct.pack("<Q", len(encoded)))
                  payload.extend(encoded)

              def append_ids(values):
                  payload.extend(struct.pack("<Q", len(values)))
                  for value in values:
                      payload.extend(struct.pack("<Q", value))

              append_text(bank["history_sha256"])
              payload.extend(struct.pack("<Q", bank["horizon_steps"]))
              append_text(bank["action_manifest_sha256"])
              append_ids(bank["action_ids"])
              append_ids(bank["joint_draw_ids"])
              payload.append({
                  "shared_posterior_and_world_noise": 0,
                  "paired_exogenous_disturbance": 1,
                  "deterministic_shared_latent": 2,
              }[bank["coupling"]])
              kind_tags = {
                  "geometry": 0,
                  "motion": 1,
                  "contact": 2,
                  "visibility": 3,
                  "task_utility": 4,
                  "terminal_risk": 5,
                  "other": 255,
              }
              payload.extend(struct.pack("<Q", len(bank["channels"])))
              for channel in bank["channels"]:
                  append_text(channel["channel_id"])
                  payload.append(kind_tags[channel["kind"]])
                  append_text(channel["unit"])
                  payload.extend(struct.pack("<Q", len(channel["outcome_samples"])))
                  for row in channel["outcome_samples"]:
                      payload.extend(struct.pack("<Q", len(row)))
                      for value in row:
                          payload.extend(struct.pack("<d", value))
              return hashlib.sha256(payload).hexdigest()

          channel_ids = [channel["channel_id"] for channel in structured_bank["channels"]]
          assert len(set(channel_ids)) == len(channel_ids)
          assert all(
              channel["channel_id"] == channel["channel_id"].strip()
              and channel["unit"] == channel["unit"].strip()
              for channel in structured_bank["channels"]
          )
          assert all(
              math.isfinite(value)
              for channel in structured_bank["channels"]
              for row in channel["outcome_samples"]
              for value in row
          )
          structured_digest = canonical_structured_bank_digest(structured_bank)
          assert structured_digest == structured_bank["joint_draw_bank_sha256"]
          assert structured_digest == (
              "4c8f7c1de1ad1d886d873630a9e43c9f512d0a6665db7e4e610658d4cdd2de2b"
          )
          hostile_structured = json.loads(json.dumps(structured_bank))
          hostile_structured["channels"][0]["outcome_samples"][0][0] += 0.01
          assert (
              canonical_structured_bank_digest(hostile_structured) != structured_digest
          )
          hostile_structured = json.loads(json.dumps(structured_bank))
          hostile_structured["channels"][1]["channel_id"] = hostile_structured["channels"][0]["channel_id"]
          assert len({channel["channel_id"] for channel in hostile_structured["channels"]}) != len(
              hostile_structured["channels"]
          )
          hostile_structured = json.loads(json.dumps(structured_bank))
          hostile_structured["channels"][0]["unit"] = " probability "
          assert any(
              channel["unit"] != channel["unit"].strip()
              for channel in hostile_structured["channels"]
          )
          hostile_structured = json.loads(json.dumps(structured_bank))
          hostile_structured["channels"][0]["outcome_samples"][0].pop()
          assert any(
              len(row) != len(hostile_structured["joint_draw_ids"])
              for channel in hostile_structured["channels"]
              for row in channel["outcome_samples"]
          )

          selected_action_schema = json.loads(
              Path("selected-action-evaluation.v0.1.schema.json").read_text()
          )
          Draft202012Validator.check_schema(selected_action_schema)
          selected_action_fixture = json.loads(
              Path("fixtures/selected-action-evaluation.example.json").read_text()
          )
          validate(instance=selected_action_fixture, schema=selected_action_schema)
          assert selected_action_fixture["episode_count"] == 4
          assert selected_action_fixture["mean_realized_regret"] == 1.25
          assert selected_action_fixture["regret_bound_coverage"] == 0.75
          assert selected_action_fixture["simultaneous_interval_coverage"] == 0.75
          assert selected_action_fixture["false_dominant_certificate_count"] == 1
          assert (
              selected_action_fixture["false_dominant_certificate_count"]
              <= selected_action_fixture["dominant_certificate_count"]
          )
          hostile_selection = json.loads(json.dumps(selected_action_fixture))
          hostile_selection["false_dominant_certificate_count"] = 3
          assert (
              hostile_selection["false_dominant_certificate_count"]
              > hostile_selection["dominant_certificate_count"]
          ), "hostile selected-action receipt must violate the cross-field invariant"

          net_value_schema = json.loads(
              Path("net-decision-value.v0.1.schema.json").read_text()
          )
          Draft202012Validator.check_schema(net_value_schema)
          net_value_fixture = json.loads(
              Path("fixtures/net-decision-value.example.json").read_text()
          )
          validate(instance=net_value_fixture, schema=net_value_schema)
          assert net_value_fixture["episode_count"] == 3
          assert abs(net_value_fixture["mean_gross_advantage_vs_d0"] - 7.0 / 3.0) < 1e-12
          assert abs(net_value_fixture["mean_net_advantage_vs_d0"] - 1.0 / 3.0) < 1e-12
          assert abs(net_value_fixture["mean_net_advantage_vs_d1"] - 0.5 / 3.0) < 1e-12
          assert net_value_fixture["net_win_rate_vs_d0"] == 2.0 / 3.0
          assert net_value_fixture["net_win_rate_vs_d1"] == 1.0 / 3.0
          hostile_net_value = json.loads(json.dumps(net_value_fixture))
          hostile_net_value["net_win_rate_vs_d0"] = 1.1
          try:
              validate(instance=hostile_net_value, schema=net_value_schema)
          except ValidationError:
              pass
          else:
              raise AssertionError("net decision-value schema admitted a win rate above 1")

          uncertainty_sample = {
              "schema_version": "cmaq-018-uncertainty-contract-v0.1",
              "claim_ceiling": "design_contract_only_no_model_calibration_result",
              "forecast_interval": {
                  "lower": 0.1, "upper": 0.4, "nominal_coverage": 0.9,
                  "horizon_steps": 5, "uncertainty_source": "combined",
                  "calibration_stratum": "in_support_h5"
              },
              "paired_effect_interval": {
                  "left_action_id": 0, "right_action_id": 1,
                  "lower": -0.1, "upper": 0.2, "nominal_coverage": 0.9,
                  "horizon_steps": 5, "construction": "paired_joint_samples",
                  "paired_sample_count": 128,
                  "pairing_semantics": "same_history_same_joint_draw_index",
                  "marginal_interval_subtraction": "prohibited"
              },
              "action_set": {
                  "action_ids": [0, 1],
                  "joint_uncertainty_method": "paired_joint_predictive_samples",
                  "familywise_nominal_coverage": 0.9,
                  "selected_action_id": 0,
                  "selected_action_regret_upper_bound": 0.2,
                  "certificate_requires_simultaneous_coverage": True
              },
              "memory_boundary": {
                  "forecast_is_observation": False,
                  "prediction_promoted_to_observation": False
              }
          }
          validate(instance=uncertainty_sample, schema=uncertainty_schema)
          assert uncertainty_sample["action_set"]["selected_action_id"] in (
              uncertainty_sample["action_set"]["action_ids"]
          )
          invalid_uncertainty = json.loads(json.dumps(uncertainty_sample))
          invalid_uncertainty["paired_effect_interval"]["marginal_interval_subtraction"] = "allowed"
          try:
              validate(instance=invalid_uncertainty, schema=uncertainty_schema)
          except ValidationError:
              pass
          else:
              raise AssertionError("uncertainty contract admitted marginal-interval subtraction")
          invalid_uncertainty = json.loads(json.dumps(uncertainty_sample))
          del invalid_uncertainty["paired_effect_interval"]["pairing_semantics"]
          try:
              validate(instance=invalid_uncertainty, schema=uncertainty_schema)
          except ValidationError:
              pass
          else:
              raise AssertionError("uncertainty contract admitted unpaired joint samples")

          assert report["schema_version"] == "cmaq-018-counterfactual-branch-fidelity-v0.1"
          assert report["episode_count"] == 64
          assert report["action_count"] == 7
          assert report["pair_count_per_episode"] == 21
          assert len(report["actions"]) == 7
          assert len(report["summary"]) == 35

          action_ids = [action["id"] for action in report["actions"]]
          assert action_ids == list(range(7))
          assert sum(action["training_supported"] for action in report["actions"]) == 4

          rows = report["summary"]
          keys = [(row["scenario"], row["model"]) for row in rows]
          assert len(keys) == len(set(keys)) == 35
          assert set(row["scenario"] for row in rows) == set(report["scenarios"])
          assert set(row["model"] for row in rows) == set(report["models"])

          def get(scenario, model):
              matches = [row for row in rows
                         if row["scenario"] == scenario and row["model"] == model]
              assert len(matches) == 1
              return matches[0]

          for row in rows:
              assert row["episode_count"] == 64
              assert row["pair_count_per_episode"] == 21
              assert 0.0 <= row["mean_pair_coverage"] <= 1.0
              assert 0.0 <= row["mean_branch_coverage"] <= 1.0
              for key in ("mean_effect_magnitude_mae", "mean_top1_regret",
                          "mean_branch_outcome_mae", "mean_branch_state_mae"):
                  value = row[key]
                  assert value is None or (isinstance(value, (int, float)) and math.isfinite(value) and value >= 0.0)
              for key in ("mean_effect_sign_accuracy", "mean_null_false_effect_rate",
                          "mean_terminal_false_safe_rate"):
                  value = row[key]
                  assert value is None or (isinstance(value, (int, float)) and 0.0 <= value <= 1.0)
              tau = row["mean_rank_tau_b"]
              assert tau is None or -1.0 <= tau <= 1.0

          interval_pairs = [
              ("mean_effect_sign_accuracy", "effect_sign_accuracy_episode_count", "effect_sign_accuracy_ci95_lower", "effect_sign_accuracy_ci95_upper"),
              ("mean_effect_magnitude_mae", "effect_magnitude_mae_episode_count", "effect_magnitude_mae_ci95_lower", "effect_magnitude_mae_ci95_upper"),
              ("mean_null_false_effect_rate", "null_false_effect_episode_count", "null_false_effect_rate_ci95_lower", "null_false_effect_rate_ci95_upper"),
              ("mean_rank_tau_b", "rank_tau_b_episode_count", "rank_tau_b_ci95_lower", "rank_tau_b_ci95_upper"),
              ("mean_top1_regret", "top1_regret_episode_count", "top1_regret_ci95_lower", "top1_regret_ci95_upper"),
              ("mean_terminal_false_safe_rate", "terminal_false_safe_rate_episode_count", "terminal_false_safe_rate_ci95_lower", "terminal_false_safe_rate_ci95_upper"),
          ]
          for row in rows:
              for _, count_key, _, _ in interval_pairs:
                  assert isinstance(row[count_key], int)
                  assert 0 <= row[count_key] <= 64
              for count_key in ("branch_outcome_mae_episode_count", "branch_state_mae_episode_count"):
                  assert isinstance(row[count_key], int)
                  assert 0 <= row[count_key] <= 64
                  mean_key = count_key.removesuffix("_episode_count")
                  mean_key = "mean_" + mean_key
                  if row[mean_key] is None:
                      assert row[count_key] == 0
                  else:
                      assert row[count_key] >= 1
              for mean_key, count_key, lower_key, upper_key in interval_pairs:
                  mean_value = row[mean_key]
                  count = row[count_key]
                  lower = row[lower_key]
                  upper = row[upper_key]
                  assert 0 <= count <= 64
                  if mean_value is None:
                      assert count == 0
                      assert lower is None and upper is None
                  else:
                      assert count >= 1
                      if count < 2:
                          assert lower is None and upper is None
                      else:
                          assert lower is not None and upper is not None
                          assert lower <= upper

          # Null effects must not be mistaken for evidence of a nonzero action effect.
          null_point = get("null_effect", "point_outcome")
          assert null_point["mean_null_false_effect_rate"] == 1.0
          assert null_point["null_false_effect_episode_count"] == 64
          assert null_point["null_false_effect_rate_ci95_lower"] == 1.0
          assert null_point["null_false_effect_rate_ci95_upper"] == 1.0
          assert null_point["mean_effect_sign_accuracy"] is None
          assert null_point["effect_sign_accuracy_episode_count"] == 0
          assert null_point["mean_rank_tau_b"] is None
          assert null_point["rank_tau_b_episode_count"] == 0
          assert null_point["mean_null_false_effect_rate"] is not None
          assert null_point["null_false_effect_episode_count"] == 64
          assert null_point["mean_top1_regret"] is not None
          assert null_point["top1_regret_episode_count"] == 64
          assert null_point["mean_effect_magnitude_mae"] is not None
          assert null_point["effect_magnitude_mae_episode_count"] == 64
          assert null_point["effect_sign_accuracy_ci95_lower"] is None
          assert null_point["rank_tau_b_ci95_upper"] is None

          # Support-aware coverage must explicitly expose the unsupported action branches.
          support = get("monotone", "support_aware_point")
          assert abs(support["mean_branch_coverage"] - 4.0 / 7.0) < 1e-9
          assert abs(support["mean_pair_coverage"] - 6.0 / 21.0) < 1e-9

          # An explicit effect head makes pair calls rather than absolute branch predictions.
          effect = get("monotone", "explicit_effect_head")
          assert effect["mean_branch_prediction_evaluations"] == 0.0
          assert effect["branch_outcome_mae_episode_count"] == 0
          assert effect["branch_state_mae_episode_count"] == 0
          assert effect["mean_branch_outcome_mae"] is None
          assert effect["mean_branch_state_mae"] is None
          assert effect["mean_pair_effect_evaluations"] == 21.0
          assert effect["mean_branch_outcome_mae"] is None
          assert effect["mean_branch_state_mae"] is None

          # The evaluator-only oracle is exact on this deterministic branch generator.
          for scenario in report["scenarios"]:
              oracle = get(scenario, "oracle")
              assert oracle["mean_pair_coverage"] == 1.0
              assert oracle["mean_effect_magnitude_mae"] == 0.0
              assert oracle["effect_magnitude_mae_episode_count"] == 64
              assert oracle["effect_magnitude_mae_ci95_lower"] == 0.0
              assert oracle["effect_magnitude_mae_ci95_upper"] == 0.0
              assert oracle["mean_top1_regret"] == 0.0
              assert oracle["mean_branch_outcome_mae"] == 0.0
              assert oracle["branch_outcome_mae_episode_count"] == 64
              assert oracle["mean_branch_state_mae"] == 0.0
              assert oracle["branch_state_mae_episode_count"] == 64
              assert oracle["mean_terminal_false_safe_rate"] in (0.0, None)
              assert oracle["mean_oracle_branch_evaluations"] == 7.0

          # Point outcome predictions understate the terminal failure in the seam lane.
          seam = get("termination_seam", "point_outcome")
          assert seam["mean_terminal_false_safe_rate"] == 1.0
          assert seam["terminal_false_safe_rate_episode_count"] == 64
          oracle_seam = get("termination_seam", "oracle")
          assert oracle_seam["mean_terminal_false_safe_rate"] == 0.0
          assert oracle_seam["terminal_false_safe_rate_episode_count"] == 64
          PY
      - name: Create run receipt
        working-directory: research/cmaq-018
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          report_path = Path("/tmp/cmaq-018-report.json")
          schema_path = Path("report.schema.json")
          receipt = {
              "schema_version": "cmaq-018-run-receipt-v0.1",
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "report_sha256": hashlib.sha256(report_path.read_bytes()).hexdigest(),
              "schema_sha256": hashlib.sha256(schema_path.read_bytes()).hexdigest(),
              "report_bytes": report_path.stat().st_size,
              "rustc_version": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "cargo_version": subprocess.check_output(["cargo", "--version"], text=True).strip(),
              "runner_platform": platform.platform(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
          }
          Path("/tmp/cmaq-018-run-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n"
          )
          PY
          sha256sum /tmp/cmaq-018-report.json /tmp/cmaq-018-run-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: cmaq-018-report-and-run-receipt
          path: |
            /tmp/cmaq-018-report.json
            /tmp/cmaq-018-run-receipt.json
          retention-days: 30
