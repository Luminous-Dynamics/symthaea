name: Butlin GWT-1 Trusted Evidence Builder

on:
  workflow_call:
    inputs:
      evidence_subject_sha:
        description: Exact repository commit whose four production specialists are under qualification
        required: true
        type: string

permissions: {}

jobs:
  qualify:
    name: Execute candidate without signing authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}

    steps:
      - name: Checkout exact evidence subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.evidence_subject_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove trusted evaluator lineage
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_BUILDER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_BUILDER_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          test "$TRUSTED_BUILDER_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TRUSTED_BUILDER_PATH" = ".github/workflows/butlin-gwt1-trusted-builder.yml"
          [[ "$EVIDENCE_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_BUILDER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SUBJECT_SHA"

          git cat-file -e "${TRUSTED_BUILDER_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$TRUSTED_BUILDER_SHA"
          git merge-base --is-ancestor "$TRUSTED_BUILDER_SHA" "$EVIDENCE_SUBJECT_SHA"

          allowed_subject_paths=(
            "src/cognitive_loop/managers/drive_manager.rs"
            "src/cognitive_loop/managers/memory_manager.rs"
            "src/cognitive_loop/managers/learning_manager.rs"
            "src/cognitive_loop/managers/perception_manager.rs"
          )
          mapfile -t changed_paths < <(
            git diff --name-only --diff-filter=ACDMRTUXB \
              "$TRUSTED_BUILDER_SHA" "$EVIDENCE_SUBJECT_SHA"
          )
          for path in "${changed_paths[@]}"; do
            allowed=false
            for candidate in "${allowed_subject_paths[@]}"; do
              if [[ "$path" == "$candidate" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != true ]]; then
              echo "Evidence lineage drift outside frozen GWT-1 subject: $path" >&2
              exit 1
            fi
          done
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install pinned Rust 1.96.0
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      - name: Execute direct GWT-1 qualification
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/gwt1-direct-qualify-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-direct-qualify-target
          SYMTHAEA_GWT1_EVIDENCE_DIR: ${{ runner.temp }}/gwt1-direct-evidence
        run: |
          set -euo pipefail
          set +e
          cargo run --locked -p symthaea-psych-bench \
            --features symthaea-backend \
            --bin gwt1_qualification
          status=$?
          set -e

          case "$status" in
            0) expected_outcome="Qualified" ;;
            20) expected_outcome="NotDemonstrated" ;;
            21) expected_outcome="Contradicted" ;;
            22) expected_outcome="Inconclusive" ;;
            *)
              echo "Direct qualification infrastructure failure: unexpected exit status $status" >&2
              exit "$status"
              ;;
          esac

          outcome_file="$SYMTHAEA_GWT1_EVIDENCE_DIR/outcome.txt"
          test -f "$outcome_file"
          observed_outcome="$(tr -d '\r\n' < "$outcome_file")"
          if [[ "$observed_outcome" != "$expected_outcome" ]]; then
            echo "Direct qualification exit/outcome mismatch: status=$status expected=$expected_outcome observed=$observed_outcome" >&2
            exit 2
          fi
          echo "Direct scientific outcome: $expected_outcome (exit $status); continuing to independent verification."

      - name: Package isolated candidate evidence
        id: bundle
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_BUILDER_REF: ${{ job.workflow_ref }}
          SOURCE_DIR: ${{ runner.temp }}/gwt1-direct-evidence
          TRANSPORT_DIR: ${{ runner.temp }}/gwt1-direct-transport
        run: |
          set -euo pipefail
          test -x /usr/bin/install
          test -x /usr/bin/jq
          test -x /usr/bin/sha256sum
          test -x /usr/bin/tar
          test -x /usr/bin/gzip
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SUBJECT_SHA"
          if [[ -n "$(git status --porcelain=v1 --untracked-files=no)" ]]; then
            echo "Candidate execution mutated tracked source; evidence void." >&2
            exit 1
          fi

          expected=(raw_observations.json evidence_envelope.json resolution.json outcome.txt)
          for file in "${expected[@]}"; do
            if [[ ! -f "${SOURCE_DIR}/${file}" ]]; then
              echo "Missing evidence file after completed qualification: ${file}" >&2
              exit 1
            fi
          done

          rm -rf "$TRANSPORT_DIR"
          stage_root="$TRANSPORT_DIR/stage"
          stage_dir="$stage_root/gwt1-evidence"
          mkdir -p "$stage_dir"
          for file in "${expected[@]}"; do
            /usr/bin/install -m 0644 "${SOURCE_DIR}/${file}" "${stage_dir}/${file}"
          done

          /usr/bin/jq -n \
            --arg evidence_subject_sha "$EVIDENCE_SUBJECT_SHA" \
            --arg trusted_builder_sha "$TRUSTED_BUILDER_SHA" \
            --arg trusted_builder_ref "$TRUSTED_BUILDER_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema:"butlin-gwt1-trusted-builder-provenance-v1",evidence_subject_sha:$evidence_subject_sha,trusted_builder_sha:$trusted_builder_sha,trusted_builder_ref:$trusted_builder_ref,repository:$repository,run_id:$run_id,run_attempt:$run_attempt,permitted_subject_paths:["src/cognitive_loop/managers/drive_manager.rs","src/cognitive_loop/managers/memory_manager.rs","src/cognitive_loop/managers/learning_manager.rs","src/cognitive_loop/managers/perception_manager.rs"]}' \
            > "$stage_dir/workflow_provenance.json"

          expected+=(workflow_provenance.json)
          (cd "$stage_dir" && /usr/bin/sha256sum "${expected[@]}" > SHA256SUMS)
          /usr/bin/tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$stage_root" -cf - gwt1-evidence \
            | /usr/bin/gzip -n > "$TRANSPORT_DIR/gwt1-evidence.tar.gz"
          (cd "$TRANSPORT_DIR" && /usr/bin/sha256sum gwt1-evidence.tar.gz > gwt1-evidence.tar.gz.sha256)

          artifact_name="gwt1-intermediate-unattested-${EVIDENCE_SUBJECT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Upload unattested intermediate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/gwt1-direct-transport/gwt1-evidence.tar.gz
            ${{ runner.temp }}/gwt1-direct-transport/gwt1-evidence.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Independently verify and attest evidence
    needs: qualify
    if: needs.qualify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Download unattested intermediate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.qualify.outputs.artifact_name }}
          path: ${{ runner.temp }}/gwt1-direct-intermediate

      - name: Checkout trusted evaluator revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted-builder identity
        shell: bash
        env:
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_BUILDER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_BUILDER_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          test "$TRUSTED_BUILDER_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TRUSTED_BUILDER_PATH" = ".github/workflows/butlin-gwt1-trusted-builder.yml"
          [[ "$TRUSTED_BUILDER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TRUSTED_BUILDER_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install exact GitHub CLI attestation verifier
        id: trusted_gh
        shell: bash
        env:
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_ROOT: ${{ runner.temp }}/gwt1-direct-trusted-gh
          TRUSTED_GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-direct-trusted-gh-config
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          rm -rf "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          mkdir -p "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          chmod 0700 "$TRUSTED_GH_CONFIG_DIR"
          archive="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$TRUSTED_GH_ARCHIVE_URL"
          printf '%s  %s\n' "$TRUSTED_GH_ARCHIVE_SHA256" "$archive" | /usr/bin/sha256sum -c -
          /usr/bin/tar --no-same-owner -xzf "$archive" -C "$TRUSTED_GH_ROOT"
          gh_path="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64/bin/gh"
          test -x "$gh_path"
          version_output="$($gh_path --version)"
          test "$(printf '%s\n' "$version_output" | /usr/bin/awk 'NR==1{print $3}')" = "$TRUSTED_GH_VERSION"
          gh_binary_sha256="$(/usr/bin/sha256sum "$gh_path" | /usr/bin/awk '{print $1}')"
          version_output_sha256="$(printf '%s' "$version_output" | /usr/bin/sha256sum | /usr/bin/awk '{print $1}')"
          echo "gh_path=$gh_path" >> "$GITHUB_OUTPUT"
          echo "gh_binary_sha256=$gh_binary_sha256" >> "$GITHUB_OUTPUT"
          echo "version_output_sha256=$version_output_sha256" >> "$GITHUB_OUTPUT"

      - name: Admit exact direct evidence archive through frozen shared policy
        id: archive_admission
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate
          ADMISSION_ENGINE: ${{ github.workspace }}/.github/scripts/evidence_archive_admission.py
          ADMISSION_PROFILE: ${{ github.workspace }}/.github/evidence-profiles/gwt1-direct-evidence-v1.json
        run: |
          set -euo pipefail
          (cd "$PACKAGE_DIR" && /usr/bin/sha256sum -c gwt1-evidence.tar.gz.sha256)
          engine_sha256="$(/usr/bin/sha256sum "$ADMISSION_ENGINE" | /usr/bin/awk '{print $1}')"
          profile_sha256="$(/usr/bin/sha256sum "$ADMISSION_PROFILE" | /usr/bin/awk '{print $1}')"
          rm -rf "$PACKAGE_DIR/extracted"
          mkdir -p "$PACKAGE_DIR/extracted"
          /usr/bin/python3 "$ADMISSION_ENGINE" --profile "$ADMISSION_PROFILE" \
            --archive "$PACKAGE_DIR/gwt1-evidence.tar.gz" --output-dir "$PACKAGE_DIR/extracted" \
            > "$PACKAGE_DIR/archive_admission.json"
          archive_sha256="$(/usr/bin/sha256sum "$PACKAGE_DIR/gwt1-evidence.tar.gz" | /usr/bin/awk '{print $1}')"
          /usr/bin/jq -e --arg archive_sha256 "$archive_sha256" \
            '.schema=="butlin-evidence-archive-admission-result-v1" and .profile_id=="gwt1-direct-evidence-archive-v1" and .archive_sha256==$archive_sha256 and .archive_bytes>0 and .tar_stream_bytes>0 and .member_count==7 and .total_unpacked_bytes>0' \
            "$PACKAGE_DIR/archive_admission.json" >/dev/null
          /usr/bin/install -m 0644 "$ADMISSION_PROFILE" "$PACKAGE_DIR/archive_admission_profile.json"
          /usr/bin/install -m 0644 "$ADMISSION_ENGINE" "$PACKAGE_DIR/archive_admission_engine.py"
          admission_result_sha256="$(/usr/bin/sha256sum "$PACKAGE_DIR/archive_admission.json" | /usr/bin/awk '{print $1}')"
          (cd "$PACKAGE_DIR/extracted/gwt1-evidence" && /usr/bin/sha256sum -c SHA256SUMS)
          echo "engine_sha256=$engine_sha256" >> "$GITHUB_OUTPUT"
          echo "profile_sha256=$profile_sha256" >> "$GITHUB_OUTPUT"
          echo "result_sha256=$admission_result_sha256" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust 1.96.0 for trusted verifier
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      - name: Derive trusted expected source identity
        id: identity
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_BUILDER_REF: ${{ job.workflow_ref }}
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate
        run: |
          set -euo pipefail
          git cat-file -e "${EVIDENCE_SUBJECT_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$EVIDENCE_SUBJECT_SHA"
          source_tree_sha="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}^{tree}")"
          drive_blob="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}:src/cognitive_loop/managers/drive_manager.rs")"
          memory_blob="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}:src/cognitive_loop/managers/memory_manager.rs")"
          learning_blob="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}:src/cognitive_loop/managers/learning_manager.rs")"
          perception_blob="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}:src/cognitive_loop/managers/perception_manager.rs")"
          identity_file="$RUNNER_TEMP/gwt1-direct-expected-source-identity.json"
          /usr/bin/jq -n --arg source_commit_sha "$EVIDENCE_SUBJECT_SHA" --arg source_tree_sha "$source_tree_sha" \
            --arg drive_blob "$drive_blob" --arg memory_blob "$memory_blob" --arg learning_blob "$learning_blob" --arg perception_blob "$perception_blob" \
            '{source_commit_sha:$source_commit_sha,source_tree_sha:$source_tree_sha,specialist_blob_shas:{drive_manager:$drive_blob,memory_manager:$memory_blob,learning_manager:$learning_blob,perception_manager:$perception_blob}}' > "$identity_file"
          rustc --version --verbose > "$RUNNER_TEMP/gwt1-direct-expected-toolchain.txt"
          provenance="${PACKAGE_DIR}/extracted/gwt1-evidence/workflow_provenance.json"
          /usr/bin/jq -e --arg evidence_subject_sha "$EVIDENCE_SUBJECT_SHA" --arg trusted_builder_sha "$TRUSTED_BUILDER_SHA" \
            --arg trusted_builder_ref "$TRUSTED_BUILDER_REF" --arg repository "$GITHUB_REPOSITORY" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '.schema=="butlin-gwt1-trusted-builder-provenance-v1" and .evidence_subject_sha==$evidence_subject_sha and .trusted_builder_sha==$trusted_builder_sha and .trusted_builder_ref==$trusted_builder_ref and .repository==$repository and .run_id==$run_id and .run_attempt==$run_attempt and .permitted_subject_paths==["src/cognitive_loop/managers/drive_manager.rs","src/cognitive_loop/managers/memory_manager.rs","src/cognitive_loop/managers/learning_manager.rs","src/cognitive_loop/managers/perception_manager.rs"]' \
            "$provenance" >/dev/null
          echo "identity_file=$identity_file" >> "$GITHUB_OUTPUT"
          echo "toolchain_file=$RUNNER_TEMP/gwt1-direct-expected-toolchain.txt" >> "$GITHUB_OUTPUT"

      - name: Recompute evidence with trusted verifier
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/gwt1-direct-verify-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-direct-verify-target
          SYMTHAEA_GWT1_EVIDENCE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate/extracted/gwt1-evidence
          EXPECTED_GWT1_SOURCE_IDENTITY: ${{ steps.identity.outputs.identity_file }}
          EXPECTED_GWT1_TOOLCHAIN: ${{ steps.identity.outputs.toolchain_file }}
          EXPECTED_GWT1_EXECUTION_RUN_ID: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cargo run --locked -p symthaea-psych-bench --bin gwt1_verify_evidence
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Record direct attestation verifier profile
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.gh_binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
          ADMISSION_ENGINE_SHA256: ${{ steps.archive_admission.outputs.engine_sha256 }}
          ADMISSION_PROFILE_SHA256: ${{ steps.archive_admission.outputs.profile_sha256 }}
          ADMISSION_RESULT_SHA256: ${{ steps.archive_admission.outputs.result_sha256 }}
          EVIDENCE_ARCHIVE_SHA256: ${{ steps.archive_admission.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          /usr/bin/jq -n --arg schema "butlin-gwt1-direct-attestation-verifier-profile-v2" --arg repository "$GITHUB_REPOSITORY" \
            --arg trusted_builder_sha "$TRUSTED_BUILDER_SHA" --arg verifier github-cli --arg verifier_version "$TRUSTED_GH_VERSION" \
            --arg distribution_url "$TRUSTED_GH_ARCHIVE_URL" --arg distribution_sha256 "$TRUSTED_GH_ARCHIVE_SHA256" \
            --arg executable_sha256 "$TRUSTED_GH_BINARY_SHA256" --arg version_output_sha256 "$TRUSTED_GH_VERSION_OUTPUT_SHA256" \
            --arg archive_admission_profile_id gwt1-direct-evidence-archive-v1 --arg archive_admission_engine_sha256 "$ADMISSION_ENGINE_SHA256" \
            --arg archive_admission_profile_sha256 "$ADMISSION_PROFILE_SHA256" --arg archive_admission_result_sha256 "$ADMISSION_RESULT_SHA256" \
            --arg evidence_archive_sha256 "$EVIDENCE_ARCHIVE_SHA256" \
            '{schema:$schema,repository:$repository,trusted_builder_sha:$trusted_builder_sha,verifier:$verifier,verifier_version:$verifier_version,distribution_url:$distribution_url,distribution_sha256:$distribution_sha256,executable_sha256:$executable_sha256,version_output_sha256:$version_output_sha256,configuration_policy:"isolated-gh-config-v1",archive_admission_profile_id:$archive_admission_profile_id,archive_admission_engine_sha256:$archive_admission_engine_sha256,archive_admission_profile_sha256:$archive_admission_profile_sha256,archive_admission_result_sha256:$archive_admission_result_sha256,deny_self_hosted_runners:true,evidence_archive_sha256:$evidence_archive_sha256}' \
            > "$PACKAGE_DIR/direct_verifier_profile.json"
          (cd "$PACKAGE_DIR" && /usr/bin/sha256sum direct_verifier_profile.json > direct_verifier_profile.json.sha256)

      - name: Generate trusted direct-evidence attestation
        id: evidence_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-direct-intermediate/gwt1-evidence.tar.gz

      - name: Attest exact direct verifier profile
        id: verifier_profile_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-direct-intermediate/direct_verifier_profile.json

      - name: Verify and preserve trusted attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-direct-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate
          EVIDENCE_ATTESTATION_BUNDLE: ${{ steps.evidence_attest.outputs.bundle-path }}
          VERIFIER_PROFILE_ATTESTATION_BUNDLE: ${{ steps.verifier_profile_attest.outputs.bundle-path }}
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -x "$TRUSTED_GH_PATH"
          unset GH_HOST GH_ENTERPRISE_TOKEN
          mkdir -p "$PACKAGE_DIR/attestation"
          cp "$EVIDENCE_ATTESTATION_BUNDLE" "$PACKAGE_DIR/attestation/attestation.json"
          cp "$VERIFIER_PROFILE_ATTESTATION_BUNDLE" "$PACKAGE_DIR/attestation/verifier-profile-attestation.json"
          "$TRUSTED_GH_PATH" attestation verify "$PACKAGE_DIR/gwt1-evidence.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --bundle "$PACKAGE_DIR/attestation/attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-trusted-builder.yml" \
            --signer-digest "$TRUSTED_BUILDER_SHA" --deny-self-hosted-runners --format json > "$PACKAGE_DIR/attestation/verification.json"
          "$TRUSTED_GH_PATH" attestation verify "$PACKAGE_DIR/direct_verifier_profile.json" --repo "$GITHUB_REPOSITORY" \
            --bundle "$PACKAGE_DIR/attestation/verifier-profile-attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-trusted-builder.yml" \
            --signer-digest "$TRUSTED_BUILDER_SHA" --deny-self-hosted-runners --format json > "$PACKAGE_DIR/attestation/verifier-profile-verification.json"
          (
            cd "$PACKAGE_DIR/attestation"
            /usr/bin/sha256sum attestation.json > attestation.json.sha256
            /usr/bin/sha256sum verification.json > verification.json.sha256
            /usr/bin/sha256sum verifier-profile-attestation.json > verifier-profile-attestation.json.sha256
            /usr/bin/sha256sum verifier-profile-verification.json > verifier-profile-verification.json.sha256
          )

      - name: Upload trusted attested direct evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gwt1-trusted-attested-${{ inputs.evidence_subject_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gwt1-direct-intermediate/gwt1-evidence.tar.gz
            ${{ runner.temp }}/gwt1-direct-intermediate/gwt1-evidence.tar.gz.sha256
            ${{ runner.temp }}/gwt1-direct-intermediate/archive_admission.json
            ${{ runner.temp }}/gwt1-direct-intermediate/archive_admission_profile.json
            ${{ runner.temp }}/gwt1-direct-intermediate/archive_admission_engine.py
            ${{ runner.temp }}/gwt1-direct-intermediate/direct_verifier_profile.json
            ${{ runner.temp }}/gwt1-direct-intermediate/direct_verifier_profile.json.sha256
            ${{ runner.temp }}/gwt1-direct-intermediate/attestation/
