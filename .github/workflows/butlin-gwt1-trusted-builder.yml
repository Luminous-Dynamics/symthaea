name: Butlin GWT-1 Trusted Evidence Builder

on:
  workflow_call:
    inputs:
      evidence_subject_sha:
        description: Exact repository commit whose four production specialists are under qualification
        required: true
        type: string

# Reusable workflow permissions are constrained again at each job. Candidate
# code never shares a job with OIDC or attestation authority.
permissions: {}

jobs:
  qualify:
    name: Execute candidate without signing authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      has_evidence: ${{ steps.bundle.outputs.has_evidence }}
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}

    steps:
      - name: Checkout exact evidence subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.evidence_subject_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove trusted evaluator lineage
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_BUILDER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_BUILDER_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail

          test "$TRUSTED_BUILDER_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TRUSTED_BUILDER_PATH" = ".github/workflows/butlin-gwt1-trusted-builder.yml"
          [[ "$EVIDENCE_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_BUILDER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SUBJECT_SHA"

          git cat-file -e "${TRUSTED_BUILDER_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$TRUSTED_BUILDER_SHA"
          git merge-base --is-ancestor "$TRUSTED_BUILDER_SHA" "$EVIDENCE_SUBJECT_SHA"

          allowed_subject_paths=(
            "src/cognitive_loop/managers/drive_manager.rs"
            "src/cognitive_loop/managers/memory_manager.rs"
            "src/cognitive_loop/managers/learning_manager.rs"
            "src/cognitive_loop/managers/perception_manager.rs"
          )

          mapfile -t changed_paths < <(
            git diff --name-only --diff-filter=ACDMRTUXB \
              "$TRUSTED_BUILDER_SHA" "$EVIDENCE_SUBJECT_SHA"
          )

          for path in "${changed_paths[@]}"; do
            allowed=false
            for candidate in "${allowed_subject_paths[@]}"; do
              if [[ "$path" == "$candidate" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != true ]]; then
              echo "Evidence lineage drift outside frozen GWT-1 subject: $path" >&2
              exit 1
            fi
          done

          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install pinned Rust 1.96.0
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      # No shared target or Cargo cache is restored into the evidence-producing
      # job. The scientific subject is rebuilt from the locked dependency graph.
      - name: Execute direct GWT-1 qualification
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/gwt1-direct-qualify-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-direct-qualify-target
          SYMTHAEA_GWT1_EVIDENCE_DIR: ${{ runner.temp }}/gwt1-direct-evidence
        run: |
          set -euo pipefail
          cargo run --locked -p symthaea-psych-bench \
            --features symthaea-backend \
            --bin gwt1_qualification

      - name: Package isolated candidate evidence
        id: bundle
        if: always()
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_BUILDER_REF: ${{ job.workflow_ref }}
          SOURCE_DIR: ${{ runner.temp }}/gwt1-direct-evidence
          TRANSPORT_DIR: ${{ runner.temp }}/gwt1-direct-transport
        run: |
          set -euo pipefail
          test -x /usr/bin/install
          test -x /usr/bin/jq
          test -x /usr/bin/sha256sum
          test -x /usr/bin/tar
          test -x /usr/bin/gzip

          # Candidate execution may not mutate tracked source. Any such mutation
          # voids evidence before transport packaging.
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SUBJECT_SHA"
          if [[ -n "$(git status --porcelain=v1 --untracked-files=no)" ]]; then
            echo "Candidate execution mutated tracked source; evidence void." >&2
            exit 1
          fi

          expected=(
            raw_observations.json
            evidence_envelope.json
            resolution.json
            outcome.txt
          )
          for file in "${expected[@]}"; do
            if [[ ! -f "${SOURCE_DIR}/${file}" ]]; then
              echo "Missing evidence file: ${file}"
              echo "has_evidence=false" >> "$GITHUB_OUTPUT"
              echo "artifact_name=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          rm -rf "$TRANSPORT_DIR"
          stage_root="$TRANSPORT_DIR/stage"
          stage_dir="$stage_root/gwt1-evidence"
          mkdir -p "$stage_dir"
          for file in "${expected[@]}"; do
            /usr/bin/install -m 0644 "${SOURCE_DIR}/${file}" "${stage_dir}/${file}"
          done

          /usr/bin/jq -n \
            --arg evidence_subject_sha "$EVIDENCE_SUBJECT_SHA" \
            --arg trusted_builder_sha "$TRUSTED_BUILDER_SHA" \
            --arg trusted_builder_ref "$TRUSTED_BUILDER_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema: "butlin-gwt1-trusted-builder-provenance-v1",
              evidence_subject_sha: $evidence_subject_sha,
              trusted_builder_sha: $trusted_builder_sha,
              trusted_builder_ref: $trusted_builder_ref,
              repository: $repository,
              run_id: $run_id,
              run_attempt: $run_attempt,
              permitted_subject_paths: [
                "src/cognitive_loop/managers/drive_manager.rs",
                "src/cognitive_loop/managers/memory_manager.rs",
                "src/cognitive_loop/managers/learning_manager.rs",
                "src/cognitive_loop/managers/perception_manager.rs"
              ]
            }' > "$stage_dir/workflow_provenance.json"

          expected+=(workflow_provenance.json)
          (
            cd "$stage_dir"
            /usr/bin/sha256sum "${expected[@]}" > SHA256SUMS
          )

          /usr/bin/tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$stage_root" \
            -cf - \
            gwt1-evidence \
            | /usr/bin/gzip -n > "$TRANSPORT_DIR/gwt1-evidence.tar.gz"

          (
            cd "$TRANSPORT_DIR"
            /usr/bin/sha256sum gwt1-evidence.tar.gz > gwt1-evidence.tar.gz.sha256
          )

          artifact_name="gwt1-intermediate-unattested-${EVIDENCE_SUBJECT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "has_evidence=true" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Upload unattested intermediate bundle
        if: always() && steps.bundle.outputs.has_evidence == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/gwt1-direct-transport/gwt1-evidence.tar.gz
            ${{ runner.temp }}/gwt1-direct-transport/gwt1-evidence.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Independently verify and attest evidence
    needs: qualify
    if: always() && needs.qualify.outputs.has_evidence == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Download unattested intermediate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.qualify.outputs.artifact_name }}
          path: ${{ runner.temp }}/gwt1-direct-intermediate

      # Trusted verifier code comes from the reusable workflow revision, never
      # from the evidence subject being qualified.
      - name: Checkout trusted evaluator revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted-builder identity
        shell: bash
        env:
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_BUILDER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_BUILDER_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          test "$TRUSTED_BUILDER_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TRUSTED_BUILDER_PATH" = ".github/workflows/butlin-gwt1-trusted-builder.yml"
          [[ "$TRUSTED_BUILDER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TRUSTED_BUILDER_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install exact GitHub CLI attestation verifier
        id: trusted_gh
        shell: bash
        env:
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_ROOT: ${{ runner.temp }}/gwt1-direct-trusted-gh
          TRUSTED_GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-direct-trusted-gh-config
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test -x /usr/bin/curl
          test -x /usr/bin/sha256sum
          test -x /usr/bin/tar
          test -x /usr/bin/awk

          rm -rf "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          mkdir -p "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          chmod 0700 "$TRUSTED_GH_CONFIG_DIR"

          archive="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --output "$archive" \
            "$TRUSTED_GH_ARCHIVE_URL"

          printf '%s  %s\n' "$TRUSTED_GH_ARCHIVE_SHA256" "$archive" \
            | /usr/bin/sha256sum -c -

          /usr/bin/tar --no-same-owner -xzf "$archive" -C "$TRUSTED_GH_ROOT"
          gh_path="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64/bin/gh"
          test -x "$gh_path"

          version_output="$($gh_path --version)"
          version_token="$(printf '%s\n' "$version_output" | /usr/bin/awk 'NR == 1 { print $3 }')"
          test "$version_token" = "$TRUSTED_GH_VERSION"

          gh_binary_sha256="$(/usr/bin/sha256sum "$gh_path" | /usr/bin/awk '{ print $1 }')"
          version_output_sha256="$(printf '%s' "$version_output" | /usr/bin/sha256sum | /usr/bin/awk '{ print $1 }')"
          [[ "$gh_binary_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$version_output_sha256" =~ ^[0-9a-f]{64}$ ]]

          {
            echo "gh_path=$gh_path"
            echo "gh_binary_sha256=$gh_binary_sha256"
            echo "version_output_sha256=$version_output_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Verify bounded archive transport, headers, and exact contents
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate
          MAX_ARCHIVE_BYTES: "67108864"
          MAX_MEMBER_BYTES: "67108864"
          MAX_TOTAL_UNPACKED_BYTES: "134217728"
        run: |
          set -euo pipefail
          test -x /usr/bin/python3
          test -x /usr/bin/sha256sum
          test -x /usr/bin/stat

          archive="$PACKAGE_DIR/gwt1-evidence.tar.gz"
          archive_bytes="$(/usr/bin/stat -c '%s' "$archive")"
          [[ "$archive_bytes" =~ ^[0-9]+$ ]]
          (( archive_bytes > 0 && archive_bytes <= MAX_ARCHIVE_BYTES ))

          (
            cd "$PACKAGE_DIR"
            /usr/bin/sha256sum -c gwt1-evidence.tar.gz.sha256
          )

          rm -rf "$PACKAGE_DIR/extracted"
          mkdir -p "$PACKAGE_DIR/extracted"

          /usr/bin/python3 - \
            "$archive" \
            "$PACKAGE_DIR/extracted" \
            "$MAX_MEMBER_BYTES" \
            "$MAX_TOTAL_UNPACKED_BYTES" <<'PY'
          import pathlib
          import shutil
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          output_root = pathlib.Path(sys.argv[2]).resolve()
          max_member_bytes = int(sys.argv[3])
          max_total_unpacked_bytes = int(sys.argv[4])
          expected = {
              "gwt1-evidence",
              "gwt1-evidence/SHA256SUMS",
              "gwt1-evidence/evidence_envelope.json",
              "gwt1-evidence/outcome.txt",
              "gwt1-evidence/raw_observations.json",
              "gwt1-evidence/resolution.json",
              "gwt1-evidence/workflow_provenance.json",
          }

          with tarfile.open(archive, mode="r:gz") as tf:
              members = tf.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate archive member path")
              if set(names) != expected:
                  missing = sorted(expected - set(names))
                  extra = sorted(set(names) - expected)
                  raise SystemExit(f"archive member mismatch: missing={missing} extra={extra}")

              total_unpacked = 0
              for member in members:
                  name = member.name
                  if not name or name.startswith("/") or "\\" in name or "//" in name:
                      raise SystemExit(f"unsafe archive path: {name!r}")
                  parts = name.split("/")
                  if any(part in ("", ".", "..") for part in parts):
                      raise SystemExit(f"unsafe archive path component: {name!r}")
                  if member.uid != 0 or member.gid != 0 or int(member.mtime) != 0:
                      raise SystemExit(f"non-canonical archive metadata: {name!r}")

                  if name == "gwt1-evidence":
                      if not member.isdir() or (member.mode & 0o777) != 0o755:
                          raise SystemExit("archive root metadata is not canonical")
                      continue

                  if not member.isfile():
                      raise SystemExit(f"non-regular evidence member: {name!r}")
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit(f"forbidden evidence member type: {name!r}")
                  if (member.mode & 0o777) != 0o644:
                      raise SystemExit(f"non-canonical evidence mode: {name!r}")
                  if member.size <= 0 or member.size > max_member_bytes:
                      raise SystemExit(f"evidence member outside size bound: {name!r} size={member.size}")

                  total_unpacked += member.size
                  if total_unpacked > max_total_unpacked_bytes:
                      raise SystemExit("archive exceeds total unpacked-size bound")

                  path = pathlib.PurePosixPath(name)
                  destination = output_root.joinpath(*path.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  source = tf.extractfile(member)
                  if source is None:
                      raise SystemExit(f"could not read evidence member: {name!r}")
                  with source, destination.open("wb") as target:
                      shutil.copyfileobj(source, target)
          PY

          (
            cd "$PACKAGE_DIR/extracted/gwt1-evidence"
            /usr/bin/sha256sum -c SHA256SUMS
          )

      - name: Install pinned Rust 1.96.0 for trusted verifier
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      - name: Derive trusted expected source identity
        id: identity
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_BUILDER_REF: ${{ job.workflow_ref }}
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate
        run: |
          set -euo pipefail
          git cat-file -e "${EVIDENCE_SUBJECT_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$EVIDENCE_SUBJECT_SHA"

          source_tree_sha="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}^{tree}")"
          drive_blob="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}:src/cognitive_loop/managers/drive_manager.rs")"
          memory_blob="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}:src/cognitive_loop/managers/memory_manager.rs")"
          learning_blob="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}:src/cognitive_loop/managers/learning_manager.rs")"
          perception_blob="$(git rev-parse "${EVIDENCE_SUBJECT_SHA}:src/cognitive_loop/managers/perception_manager.rs")"

          identity_file="$RUNNER_TEMP/gwt1-direct-expected-source-identity.json"
          /usr/bin/jq -n \
            --arg source_commit_sha "$EVIDENCE_SUBJECT_SHA" \
            --arg source_tree_sha "$source_tree_sha" \
            --arg drive_blob "$drive_blob" \
            --arg memory_blob "$memory_blob" \
            --arg learning_blob "$learning_blob" \
            --arg perception_blob "$perception_blob" \
            '{
              source_commit_sha: $source_commit_sha,
              source_tree_sha: $source_tree_sha,
              specialist_blob_shas: {
                drive_manager: $drive_blob,
                memory_manager: $memory_blob,
                learning_manager: $learning_blob,
                perception_manager: $perception_blob
              }
            }' > "$identity_file"

          rustc --version --verbose > "$RUNNER_TEMP/gwt1-direct-expected-toolchain.txt"

          provenance="${PACKAGE_DIR}/extracted/gwt1-evidence/workflow_provenance.json"
          /usr/bin/jq -e \
            --arg evidence_subject_sha "$EVIDENCE_SUBJECT_SHA" \
            --arg trusted_builder_sha "$TRUSTED_BUILDER_SHA" \
            --arg trusted_builder_ref "$TRUSTED_BUILDER_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '.schema == "butlin-gwt1-trusted-builder-provenance-v1"
              and .evidence_subject_sha == $evidence_subject_sha
              and .trusted_builder_sha == $trusted_builder_sha
              and .trusted_builder_ref == $trusted_builder_ref
              and .repository == $repository
              and .run_id == $run_id
              and .run_attempt == $run_attempt
              and .permitted_subject_paths == [
                "src/cognitive_loop/managers/drive_manager.rs",
                "src/cognitive_loop/managers/memory_manager.rs",
                "src/cognitive_loop/managers/learning_manager.rs",
                "src/cognitive_loop/managers/perception_manager.rs"
              ]' \
            "$provenance" >/dev/null

          echo "identity_file=$identity_file" >> "$GITHUB_OUTPUT"
          echo "toolchain_file=$RUNNER_TEMP/gwt1-direct-expected-toolchain.txt" >> "$GITHUB_OUTPUT"

      # No candidate code executes here. The trusted verifier is rebuilt from
      # job.workflow_sha with a clean locked Cargo state.
      - name: Recompute evidence with trusted verifier
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/gwt1-direct-verify-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-direct-verify-target
          SYMTHAEA_GWT1_EVIDENCE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate/extracted/gwt1-evidence
          EXPECTED_GWT1_SOURCE_IDENTITY: ${{ steps.identity.outputs.identity_file }}
          EXPECTED_GWT1_TOOLCHAIN: ${{ steps.identity.outputs.toolchain_file }}
          EXPECTED_GWT1_EXECUTION_RUN_ID: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cargo run --locked -p symthaea-psych-bench --bin gwt1_verify_evidence
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Record direct attestation verifier profile
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.gh_binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
          MAX_ARCHIVE_BYTES: "67108864"
          MAX_MEMBER_BYTES: "67108864"
          MAX_TOTAL_UNPACKED_BYTES: "134217728"
        run: |
          set -euo pipefail
          archive_sha256="$(/usr/bin/sha256sum "$PACKAGE_DIR/gwt1-evidence.tar.gz" | /usr/bin/awk '{print $1}')"
          /usr/bin/jq -n \
            --arg schema "butlin-gwt1-direct-attestation-verifier-profile-v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg trusted_builder_sha "$TRUSTED_BUILDER_SHA" \
            --arg verifier "github-cli" \
            --arg verifier_version "$TRUSTED_GH_VERSION" \
            --arg distribution_url "$TRUSTED_GH_ARCHIVE_URL" \
            --arg distribution_sha256 "$TRUSTED_GH_ARCHIVE_SHA256" \
            --arg executable_sha256 "$TRUSTED_GH_BINARY_SHA256" \
            --arg version_output_sha256 "$TRUSTED_GH_VERSION_OUTPUT_SHA256" \
            --arg evidence_archive_sha256 "$archive_sha256" \
            --argjson max_archive_bytes "$MAX_ARCHIVE_BYTES" \
            --argjson max_member_bytes "$MAX_MEMBER_BYTES" \
            --argjson max_total_unpacked_bytes "$MAX_TOTAL_UNPACKED_BYTES" \
            '{
              schema: $schema,
              repository: $repository,
              trusted_builder_sha: $trusted_builder_sha,
              verifier: $verifier,
              verifier_version: $verifier_version,
              distribution_url: $distribution_url,
              distribution_sha256: $distribution_sha256,
              executable_sha256: $executable_sha256,
              version_output_sha256: $version_output_sha256,
              configuration_policy: "isolated-gh-config-v1",
              archive_validation_policy: "exact-bounded-regular-members-v1",
              deny_self_hosted_runners: true,
              max_archive_bytes: $max_archive_bytes,
              max_member_bytes: $max_member_bytes,
              max_total_unpacked_bytes: $max_total_unpacked_bytes,
              evidence_archive_sha256: $evidence_archive_sha256
            }' > "$PACKAGE_DIR/direct_verifier_profile.json"
          /usr/bin/sha256sum "$PACKAGE_DIR/direct_verifier_profile.json" \
            > "$PACKAGE_DIR/direct_verifier_profile.json.sha256"

      - name: Generate trusted direct-evidence attestation
        id: evidence_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-direct-intermediate/gwt1-evidence.tar.gz

      - name: Attest exact direct verifier profile
        id: verifier_profile_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-direct-intermediate/direct_verifier_profile.json

      - name: Verify and preserve trusted attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-direct-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-direct-intermediate
          EVIDENCE_ATTESTATION_BUNDLE: ${{ steps.evidence_attest.outputs.bundle-path }}
          VERIFIER_PROFILE_ATTESTATION_BUNDLE: ${{ steps.verifier_profile_attest.outputs.bundle-path }}
          TRUSTED_BUILDER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -x "$TRUSTED_GH_PATH"
          mkdir -p "$PACKAGE_DIR/attestation"
          test -f "$EVIDENCE_ATTESTATION_BUNDLE"
          test -f "$VERIFIER_PROFILE_ATTESTATION_BUNDLE"

          cp "$EVIDENCE_ATTESTATION_BUNDLE" "$PACKAGE_DIR/attestation/attestation.json"
          cp "$VERIFIER_PROFILE_ATTESTATION_BUNDLE" \
            "$PACKAGE_DIR/attestation/verifier-profile-attestation.json"

          "$TRUSTED_GH_PATH" attestation verify "$PACKAGE_DIR/gwt1-evidence.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PACKAGE_DIR/attestation/attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-trusted-builder.yml" \
            --signer-digest "$TRUSTED_BUILDER_SHA" \
            --deny-self-hosted-runners \
            --format json \
            > "$PACKAGE_DIR/attestation/verification.json"

          "$TRUSTED_GH_PATH" attestation verify "$PACKAGE_DIR/direct_verifier_profile.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PACKAGE_DIR/attestation/verifier-profile-attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-trusted-builder.yml" \
            --signer-digest "$TRUSTED_BUILDER_SHA" \
            --deny-self-hosted-runners \
            --format json \
            > "$PACKAGE_DIR/attestation/verifier-profile-verification.json"

          /usr/bin/sha256sum "$PACKAGE_DIR/attestation/attestation.json" \
            > "$PACKAGE_DIR/attestation/attestation.json.sha256"
          /usr/bin/sha256sum "$PACKAGE_DIR/attestation/verification.json" \
            > "$PACKAGE_DIR/attestation/verification.json.sha256"
          /usr/bin/sha256sum "$PACKAGE_DIR/attestation/verifier-profile-attestation.json" \
            > "$PACKAGE_DIR/attestation/verifier-profile-attestation.json.sha256"
          /usr/bin/sha256sum "$PACKAGE_DIR/attestation/verifier-profile-verification.json" \
            > "$PACKAGE_DIR/attestation/verifier-profile-verification.json.sha256"

      - name: Upload trusted attested direct evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gwt1-trusted-attested-${{ inputs.evidence_subject_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gwt1-direct-intermediate/gwt1-evidence.tar.gz
            ${{ runner.temp }}/gwt1-direct-intermediate/gwt1-evidence.tar.gz.sha256
            ${{ runner.temp }}/gwt1-direct-intermediate/direct_verifier_profile.json
            ${{ runner.temp }}/gwt1-direct-intermediate/direct_verifier_profile.json.sha256
            ${{ runner.temp }}/gwt1-direct-intermediate/attestation/
          if-no-files-found: error
          retention-days: 30
