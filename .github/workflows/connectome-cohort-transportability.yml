name: Connectome animal-level transportability contract

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "docs/neuroscience/CONNECTOME_COHORT_TRANSPORTABILITY_BENCHMARK_V1.md"
      - "docs/neuroscience/CONNECTOME_COHORT_TRANSPORT.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_COHORT_TRANSPORT.example.json"
      - "tools/connectomics-intake-audit/reference/verify_connectome_cohort_transport.py"
      - ".github/workflows/connectome-cohort-transportability.yml"
  push:
    branches: [main, "research/**"]
    paths:
      - "docs/neuroscience/CONNECTOME_COHORT_TRANSPORTABILITY_BENCHMARK_V1.md"
      - "docs/neuroscience/CONNECTOME_COHORT_TRANSPORT.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_COHORT_TRANSPORT.example.json"
      - "tools/connectomics-intake-audit/reference/verify_connectome_cohort_transport.py"
      - ".github/workflows/connectome-cohort-transportability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cohort-transport:
    name: Validate animal-level split, calibration and abstention contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate Draft 2020-12 schema and fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/neuroscience/CONNECTOME_COHORT_TRANSPORT.schema.json").read_text())
          fixture = json.loads(Path("docs/neuroscience/examples/CONNECTOME_COHORT_TRANSPORT.example.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          print("Draft 2020-12 cohort-transport schema: PASS")
          PY
      - name: Run independent animal-level transport oracle
        run: |
          python3 -m py_compile tools/connectomics-intake-audit/reference/verify_connectome_cohort_transport.py
          python3 tools/connectomics-intake-audit/reference/verify_connectome_cohort_transport.py \
            --input docs/neuroscience/examples/CONNECTOME_COHORT_TRANSPORT.example.json \
            --self-test
