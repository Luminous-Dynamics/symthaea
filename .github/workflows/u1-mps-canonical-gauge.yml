name: U1 mixed canonical gauge receipt source harness

on:
  push:
    branches:
      - research/u1-mps-canonical-gauge-20261113
    paths:
      - crates/domains/symthaea-frontier-physics/src/u1_mps.rs
      - .github/workflows/u1-mps-canonical-gauge.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - research/u1-mps-truncation-ledger-20261113
    paths:
      - crates/domains/symthaea-frontier-physics/src/u1_mps.rs
      - .github/workflows/u1-mps-canonical-gauge.yml

permissions:
  contents: read

concurrency:
  group: u1-mps-canonical-gauge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-harness:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Rust 1.96 U1 canonical gauge exact-source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: rustfmt --edition 2024 --check crates/domains/symthaea-frontier-physics/src/u1_mps.rs
      - name: Compile, lint and test exact source in an isolated harness
        shell: bash
        run: |
          set -euo pipefail
          harness="$(mktemp -d)"
          trap 'rm -rf "$harness"' EXIT
          mkdir -p "$harness/src"
          cp crates/domains/symthaea-frontier-physics/src/u1_mps.rs "$harness/src/lib.rs"
          cat > "$harness/Cargo.toml" <<'EOF'
          [package]
          name = "u1-mps-canonical-gauge-validation"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          num-complex = "=0.4.6"
          nalgebra = "=0.34.2"
          EOF
          cargo clippy --manifest-path "$harness/Cargo.toml" --all-targets -- -D warnings
          cargo test --manifest-path "$harness/Cargo.toml" --lib
