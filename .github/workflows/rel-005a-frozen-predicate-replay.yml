name: REL-005A Frozen Predicate Replay

on:
  pull_request:
    paths:
      - ".github/rel/rel-005a-serialization-repair.py"
      - ".github/workflows/rel-005a-frozen-predicate-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rel-005a-frozen-predicate-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FROZEN_PARENT: 7f5826675b44dd0d3f702f62bc9818f7990e4a01
  FROZEN_TEST_BLOB: 787ea051ae0bf8e5667b6925481afd46c15d0bc4
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  replay:
    name: Replay frozen REL-005A predicates
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact replay subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Bind lineage and two-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${FROZEN_PARENT}"
          test "$(git rev-parse HEAD:crates/core/symthaea-fep/tests/rel_graft_frame.rs)" = "${FROZEN_TEST_BLOB}"
          mapfile -t changed < <(git diff --name-only "${FROZEN_PARENT}" HEAD | sort)
          expected=(
            ".github/rel/rel-005a-serialization-repair.py"
            ".github/workflows/rel-005a-frozen-predicate-replay.yml"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"
          printf 'head=%s\nparent=%s\ntree=%s\nfrozen_test_blob=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)" "$(git rev-parse HEAD^{tree})" \
            "$(git rev-parse HEAD:crates/core/symthaea-fep/tests/rel_graft_frame.rs)"

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.96.0
          rustc -Vv
          cargo -V
          rustfmt -V
          cargo clippy -V

      - name: Bind committed source identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            crates/core/symthaea-fep/tests/rel_graft_frame.rs \
            .github/rel/rel-005a-serialization-repair.py \
            .github/workflows/rel-005a-frozen-predicate-replay.yml
          git rev-parse \
            HEAD:crates/core/symthaea-fep/tests/rel_graft_frame.rs \
            HEAD:.github/rel/rel-005a-serialization-repair.py \
            HEAD:.github/workflows/rel-005a-frozen-predicate-replay.yml

      - name: Derive serialization-only executable source
        id: derive
        shell: bash
        env:
          REL005A_REPAIR_METADATA_PATH: ${{ runner.temp }}/repair-metadata.json
        run: |
          set -euo pipefail
          cp crates/core/symthaea-fep/tests/rel_graft_frame.rs "${RUNNER_TEMP}/frozen-rel_graft_frame.rs"
          python3 .github/rel/rel-005a-serialization-repair.py
          git diff -- crates/core/symthaea-fep/tests/rel_graft_frame.rs > "${RUNNER_TEMP}/serialization-repair.diff"
          test -s "${RUNNER_TEMP}/serialization-repair.diff"
          mapfile -t dirty < <(git diff --name-only | sort)
          test "${dirty[*]}" = "crates/core/symthaea-fep/tests/rel_graft_frame.rs"
          sha256sum crates/core/symthaea-fep/tests/rel_graft_frame.rs | tee "${RUNNER_TEMP}/derived-source.sha256"
          rustfmt --edition 2024 --check crates/core/symthaea-fep/tests/rel_graft_frame.rs

      - name: Execute frozen predicates and capture all process evidence
        id: measure
        shell: bash
        env:
          REL005A_METRICS_PATH: ${{ runner.temp }}/rel-005a-metrics.json
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          set +e
          cargo test --locked -p symthaea-fep --test rel_graft_frame -- --nocapture \
            >"${RUNNER_TEMP}/measurement.stdout.log" \
            2>"${RUNNER_TEMP}/measurement.stderr.log"
          code=$?
          set -e
          printf '%s\n' "${code}" > "${RUNNER_TEMP}/measurement-exit-code.txt"
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          if [ -s "${REL005A_METRICS_PATH}" ]; then
            python3 -m json.tool "${REL005A_METRICS_PATH}" >/dev/null
            echo "metrics_present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "metrics_present=false" >> "${GITHUB_OUTPUT}"
          fi
          cat "${RUNNER_TEMP}/measurement.stdout.log"
          cat "${RUNNER_TEMP}/measurement.stderr.log" >&2

      - name: Build ReplayOnly receipt
        if: always() && steps.derive.conclusion == 'success'
        shell: bash
        env:
          REPAIR_METADATA_PATH: ${{ runner.temp }}/repair-metadata.json
          METRICS_PATH: ${{ runner.temp }}/rel-005a-metrics.json
          RECEIPT_PATH: ${{ runner.temp }}/replay-receipt.json
          EXIT_CODE: ${{ steps.measure.outputs.exit_code || 'not-run' }}
          METRICS_PRESENT: ${{ steps.measure.outputs.metrics_present || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          def sha(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          repair = json.loads(pathlib.Path(os.environ["REPAIR_METADATA_PATH"]).read_text())
          metrics_path = pathlib.Path(os.environ["METRICS_PATH"])
          metrics_present = os.environ["METRICS_PRESENT"] == "true" and metrics_path.is_file()
          exit_code = os.environ["EXIT_CODE"]
          result = (
              "ALL_FROZEN_PREDICATES_EXECUTED_AND_PASSED"
              if exit_code == "0" and metrics_present
              else "EXECUTION_OR_PREDICATE_RED"
          )
          receipt = {
              "schema": "symthaea.rel.frozen-predicate-replay.v1",
              "authority": "LegacyPredicateReplayOnly",
              "subject_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "frozen_parent": os.environ["FROZEN_PARENT"],
              "frozen_test_blob": os.environ["FROZEN_TEST_BLOB"],
              "repair_metadata_sha256": sha(os.environ["REPAIR_METADATA_PATH"]),
              "derived_test_sha256": repair["derived_test_sha256"],
              "measurement_exit_code": exit_code,
              "metrics_present": metrics_present,
              "metrics_sha256": sha(metrics_path) if metrics_present else None,
              "result": result,
              "claims": {
                  "serialization_repair_only": True,
                  "scientific_fixture_changed": False,
                  "scientific_threshold_changed": False,
                  "scientific_assertion_changed": False,
                  "production_behavior_changed": False,
                  "observation_sealed": False,
                  "comparison_only_adjudicated": False,
                  "rel_005a_qualified": False,
                  "scientific_pass": False,
                  "scientific_fail": False,
              },
          }
          pathlib.Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload replay capsule before enforcement
        if: always() && steps.derive.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-frozen-predicate-replay-${{ env.EXPECTED_HEAD }}
          path: |
            ${{ runner.temp }}/frozen-rel_graft_frame.rs
            ${{ runner.temp }}/repair-metadata.json
            ${{ runner.temp }}/serialization-repair.diff
            ${{ runner.temp }}/derived-source.sha256
            ${{ runner.temp }}/measurement.stdout.log
            ${{ runner.temp }}/measurement.stderr.log
            ${{ runner.temp }}/measurement-exit-code.txt
            ${{ runner.temp }}/rel-005a-metrics.json
            ${{ runner.temp }}/replay-receipt.json
          retention-days: 30
          if-no-files-found: warn

      - name: Warnings-denied Clippy on derived source
        if: steps.measure.outputs.exit_code == '0' && steps.measure.outputs.metrics_present == 'true'
        shell: bash
        run: cargo clippy --locked -p symthaea-fep --test rel_graft_frame -- -D warnings

      - name: Restore frozen source
        if: always() && steps.derive.conclusion == 'success'
        shell: bash
        run: git checkout -- crates/core/symthaea-fep/tests/rel_graft_frame.rs

      - name: Postflight exact subject and checkout immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${FROZEN_PARENT}"
          test "$(git rev-parse HEAD:crates/core/symthaea-fep/tests/rel_graft_frame.rs)" = "${FROZEN_TEST_BLOB}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Enforce replay result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.measure.outputs.exit_code || 'not-run' }}
          METRICS_PRESENT: ${{ steps.measure.outputs.metrics_present || 'false' }}
        run: |
          set -euo pipefail
          test "${EXIT_CODE}" = "0"
          test "${METRICS_PRESENT}" = "true"
