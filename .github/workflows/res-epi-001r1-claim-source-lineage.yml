name: RES-EPI-001R1 Claim-Source Lineage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/res-epi-001r1-claim-source-lineage.yml'
      - 'patches/science/res-epi-001r1-claim-source-lineage-v2.patch'
      - 'src/web_research/researcher.rs'
      - 'src/web_research/verifier.rs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PATCH: patches/science/res-epi-001r1-claim-source-lineage-v2.patch
  EXPECTED_BASE: adb69f11fa8068b019cc5bb598d0c7726a197fc9

jobs:
  qualify:
    name: Prove confidence-as-support defect then qualify lineage repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact current-main base and qualification-only scope
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PATCH"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE"
          fi
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          changed="$(git diff --name-only "$EXPECTED_BASE"...HEAD)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(patches/science/res-epi-001r1-claim-source-lineage-v2\.patch|\.github/workflows/res-epi-001r1-claim-source-lineage\.yml)$' || true)"
          test -z "$unexpected" || {
            echo 'qualification branch materialized unexpected product/source bytes:'
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Execute current-main confidence-as-support negative control
        shell: bash
        run: |
          set -euo pipefail
          cat >> src/web_research/verifier.rs <<'RS'

          #[cfg(test)]
          mod qualification_claim_support_negative_control {
              use super::*;

              #[test]
              fn high_result_confidence_is_currently_converted_into_claim_support() {
                  let verifier = EpistemicVerifier::new();
                  let url = "https://example.org/high-confidence-result".to_string();
                  let result = WebResearchResult {
                      url: url.clone(),
                      relevance: 1.0,
                      confidence: 0.99,
                      ..WebResearchResult::default()
                  };

                  let verified = verifier.verify_from_results("Unrelated claim", &[result]);
                  assert_eq!(verified.supporting_sources, vec![url]);
                  assert_ne!(verified.status, EpistemicStatus::InsufficientEvidence);
              }
          }
          RS

          cargo +1.96.0 test --locked -p symthaea --lib --features web_research_module \
            qualification_claim_support_negative_control -- --nocapture
          git checkout -- src/web_research/verifier.rs

      - name: Freeze current researcher source-fanout defect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/web_research/researcher.rs').read_text()
          assert 'supports: Some(true), // Will be refined by verifier' in text
          assert 'all_claims.extend(extraction.claims)' in text
          print('negative control confirmed')
          PY

      - name: Validate and apply exact current-main repair candidate
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check

      - name: Ratchet claim-source separation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          researcher = Path('src/web_research/researcher.rs').read_text()
          verifier = Path('src/web_research/verifier.rs').read_text()

          assert 'Vec<(String, HashSet<String>)>' in researcher
          assert 'supports: None' in researcher
          assert 'asserting_urls.contains(&source.url).then_some(true)' in researcher
          assert 'all_claims.extend(extraction.claims)' not in researcher

          for forbidden in [
              'supports: Some(r.confidence > 0.5)',
              'credibility: r.confidence',
          ]:
              assert forbidden not in verifier, forbidden

          for required in [
              'verified.supporting_sources',
              'verified.contradicting_sources',
              'supports: Some(true)',
              'supports: Some(false)',
              'credibility: 0.5',
              'result_confidence_is_not_claim_support',
              'explicit_claim_lineage_reconstructs_support',
              'explicit_claim_lineage_reconstructs_contradiction',
          ]:
              assert required in verifier, required
          PY

      - name: Formatting
        run: cargo +1.96.0 fmt --check -p symthaea

      - name: Focused epistemic verifier tests
        run: |
          cargo +1.96.0 test --locked -p symthaea --lib --features web_research_module \
            web_research::verifier::tests -- --nocapture

      - name: Compile web-research feature
        run: cargo +1.96.0 check --locked -p symthaea --lib --features web_research_module

      - name: Strict Clippy
        run: cargo +1.96.0 clippy --locked -p symthaea --lib --features web_research_module -- -D warnings

      - name: Restore product tree and prove branch immutability
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/web_research/researcher.rs src/web_research/verifier.rs
          test -z "$(git status --porcelain=v1)"

      - name: Evidence boundary
        run: |
          echo 'PASS => result confidence is not claim stance in this candidate and exact extracted-claim source lineage limits support assignment.'
          echo 'PASS != semantic entailment != source truthfulness != source independence != scientific verification != action authority.'
