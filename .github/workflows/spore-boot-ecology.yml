name: Spore Boot Ecology

on:
  pull_request:
    paths:
      - "crates/core/symthaea-boot-ecology/**"
      - "crates/core/symthaea-boot-state/**"
      - "crates/domains/symthaea-quicken-fb/**"
      - "nix/packages/spore-boot-tools.nix"
      - "scripts/spore_preview_gallery.py"
      - "scripts/spore_inoculation_gallery.py"
      - "scripts/spore_visual_evidence.py"
      - "docs/design/SPORE_BOOT_ECOLOGY_V03.md"
      - "docs/design/SPORE_VISUAL_LANGUAGE_V031.md"
      - "docs/design/SPORE_VISUAL_FIDELITY_V032.md"
      - ".github/workflows/spore-boot-ecology.yml"
  workflow_dispatch:

concurrency:
  group: spore-boot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boot-ecology:
    name: Rust state + renderer gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PR workflows normally evaluate a synthetic merge commit. Preserve both
      # identities in visual evidence: patch lineage (head) and evaluated tree.
      SPORE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy

      - name: Format boot crates
        run: >-
          cargo fmt --check
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb

      - name: Check boot crates
        run: >-
          cargo check
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb
          --all-targets

      - name: Clippy boot crates
        run: >-
          cargo clippy
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb
          --all-targets
          -- -D warnings

      - name: Test boot crates
        run: >-
          cargo test
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb

      - name: Probe complete renderer CPU cost
        run: >-
          cargo run --release
          -p symthaea-quicken-fb
          --bin spore_render_probe
          --
          --width 640
          --height 360
          --frames 24
          --out spore-render-probe.json

      - name: Verify renderer cost evidence
        run: |
          test -s spore-render-probe.json
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          report = json.loads(Path("spore-render-probe.json").read_text())
          assert report["schema"] == "spore-render-probe-v1"
          assert report["width"] == 640 and report["height"] == 360
          assert report["frames"] == 24
          for key in ("mean_frame_ms", "p50_frame_ms", "p95_frame_ms", "max_frame_ms"):
              value = float(report[key])
              assert math.isfinite(value) and value >= 0.0, (key, value)
          assert len(report["final_frame_blake3"]) == 64
          assert report["policy"] == "evidence-only-no-performance-threshold"
          PY

      - name: Render exact lifecycle preview matrix
        run: >-
          cargo run --release
          -p symthaea-quicken-fb
          --bin spore_boot_preview_matrix
          --
          --out spore-boot-preview-matrix
          --width 320
          --height 180
          --fps 1

      - name: Publish exact boot preview gallery
        run: python3 scripts/spore_preview_gallery.py spore-boot-preview-matrix

      - name: Verify boot preview manifest, gallery, and case count
        run: |
          test -s spore-boot-preview-matrix/matrix-manifest.json
          test -s spore-boot-preview-matrix/gallery-manifest.json
          test -s spore-boot-preview-matrix/index.html
          test "$(find spore-boot-preview-matrix -name preview-manifest.json | wc -l)" -eq 16
          test "$(find spore-boot-preview-matrix -name 'frame-*.ppm' | wc -l)" -ge 16
          test "$(find spore-boot-preview-matrix -name 'frame-*.png' | wc -l)" -ge 16

      - name: Render exact inoculation phase matrix
        run: >-
          cargo run --release
          -p symthaea-quicken-fb
          --bin spore_inoculation_preview
          --
          --out spore-inoculation-preview
          --width 320
          --height 180

      - name: Publish exact inoculation phase gallery
        run: python3 scripts/spore_inoculation_gallery.py spore-inoculation-preview

      - name: Verify inoculation phase preview and count
        run: |
          test -s spore-inoculation-preview/inoculation-manifest.json
          test -s spore-inoculation-preview/gallery-manifest.json
          test -s spore-inoculation-preview/index.html
          test "$(find spore-inoculation-preview -name 'frame-*.ppm' | wc -l)" -eq 32
          test "$(find spore-inoculation-preview -name 'frame-*.png' | wc -l)" -eq 32

      - name: Render exact install-path ceremony matrix
        run: >-
          cargo run --release
          -p symthaea-quicken-fb
          --bin spore_inoculation_paths_preview
          --
          --out spore-inoculation-paths-preview
          --width 320
          --height 180

      - name: Publish exact install-path ceremony gallery
        run: python3 scripts/spore_inoculation_gallery.py spore-inoculation-paths-preview

      - name: Verify six path signatures
        run: |
          test -s spore-inoculation-paths-preview/inoculation-manifest.json
          test -s spore-inoculation-paths-preview/gallery-manifest.json
          test -s spore-inoculation-paths-preview/index.html
          test "$(find spore-inoculation-paths-preview -name 'frame-*.ppm' | wc -l)" -eq 18
          test "$(find spore-inoculation-paths-preview -name 'frame-*.png' | wc -l)" -eq 18

      - name: Seal exact visual evidence
        run: >-
          python3 scripts/spore_visual_evidence.py
          spore-boot-preview-matrix
          spore-inoculation-preview
          spore-inoculation-paths-preview

      - name: Verify exact visual evidence seals
        run: |
          for root in spore-boot-preview-matrix spore-inoculation-preview spore-inoculation-paths-preview; do
            test -s "$root/evidence-manifest.json"
            test -s "$root/EVIDENCE.sha256"
            (cd "$root" && sha256sum -c EVIDENCE.sha256)
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          roots = (
              "spore-boot-preview-matrix",
              "spore-inoculation-preview",
              "spore-inoculation-paths-preview",
          )
          expected_source = os.environ["SPORE_SOURCE_COMMIT"]
          expected_evaluated = os.environ["GITHUB_SHA"]
          for root in roots:
              manifest = json.loads(Path(root, "evidence-manifest.json").read_text())
              assert manifest["schema"] == "spore-visual-evidence-v1"
              assert manifest["source_commit"] == expected_source
              assert manifest["evaluated_commit"] == expected_evaluated
              assert manifest["file_count"] > 0
              assert manifest["total_bytes"] > 0
          PY

      - name: Upload renderer cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spore-render-probe
          path: spore-render-probe.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact boot renderer previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spore-boot-preview-matrix
          path: spore-boot-preview-matrix
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact inoculation phase previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spore-inoculation-preview
          path: spore-inoculation-preview
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact install-path ceremony previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spore-inoculation-paths-preview
          path: spore-inoculation-paths-preview
          if-no-files-found: warn
          retention-days: 14
