name: HARDSEC Activation Campaign Audit

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "examples/hardsec_activation_campaign_audit.rs"
      - "docs/research/HARDSEC_009_ACTIVATION_COVERAGE_CAMPAIGNS.md"
      - "tools/hardsec-activation-audit-harness/Cargo.toml"
      - "tools/hardsec-activation-audit-harness/Cargo.lock"
      - ".github/workflows/hardsec-activation-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardsec-activation-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Empirical activation campaign auditor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Check formatting
        run: rustfmt --edition 2024 --check examples/hardsec_activation_campaign_audit.rs

      - name: Verify isolated harness lockfile
        run: cargo metadata --locked --manifest-path tools/hardsec-activation-audit-harness/Cargo.toml --no-deps

      - name: Test empirical activation campaign auditor
        run: cargo test --locked --manifest-path tools/hardsec-audit-harness/Cargo.toml --features hardsec-activation-audit --example hardsec_activation_campaign_audit
