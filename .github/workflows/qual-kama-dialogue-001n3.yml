name: QUAL KAMA-DIALOGUE-001N3 exact subject

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qual-kama-dialogue-001n3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head candidate-provenance qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate subject
        uses: actions/checkout@v4
        with:
          ref: 49ef6059cd3b8b6cf1c3c8b10f99c165f185c9bb
          fetch-depth: 1
      - name: Verify exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected=49ef6059cd3b8b6cf1c3c8b10f99c165f185c9bb
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "qualified_subject=$actual"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core/symthaea-communication
      - name: Rustfmt exact communication crate
        run: cargo fmt --manifest-path crates/core/symthaea-communication/Cargo.toml -- --check
      - name: Run candidate-provenance integration tests
        run: cargo test -p symthaea-communication --test reflective_memory_candidate_provenance
      - name: Clippy candidate-provenance integration test
        run: cargo clippy -p symthaea-communication --test reflective_memory_candidate_provenance -- -D warnings
