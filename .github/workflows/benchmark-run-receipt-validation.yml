name: Benchmark Run Receipt Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "schemas/benchmark-run-receipt-v1.schema.json"
      - "examples/benchmark-run-receipt-v1.synthetic.json"
      - "tools/benchmark-run-receipt-harness/**"
      - ".github/workflows/benchmark-run-receipt-validation.yml"
  push:
    branches: [main]
    paths:
      - "schemas/benchmark-run-receipt-v1.schema.json"
      - "examples/benchmark-run-receipt-v1.synthetic.json"
      - "tools/benchmark-run-receipt-harness/**"
      - ".github/workflows/benchmark-run-receipt-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-run-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Validate standalone harness metadata
        run: |
          cargo metadata \
            --manifest-path tools/benchmark-run-receipt-harness/Cargo.toml \
            --locked --no-deps --format-version 1 \
            > "$RUNNER_TEMP/benchmark-run-receipt-metadata.json"

      - name: Format check
        run: cargo fmt --manifest-path tools/benchmark-run-receipt-harness/Cargo.toml -- --check

      - name: Semantic validator tests
        run: cargo test --manifest-path tools/benchmark-run-receipt-harness/Cargo.toml --locked

      - name: Validate synthetic receipt with CLI
        run: |
          cargo run --manifest-path tools/benchmark-run-receipt-harness/Cargo.toml --locked -- \
            examples/benchmark-run-receipt-v1.synthetic.json \
            > "$RUNNER_TEMP/benchmark-run-receipt-example-validation.json"
          grep -F '"valid": true' "$RUNNER_TEMP/benchmark-run-receipt-example-validation.json"
