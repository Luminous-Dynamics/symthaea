name: Universal error-set recovery audit

on:
  push:
    branches:
      - research/universal-error-set-recovery-20261113
    paths:
      - crates/domains/symthaea-frontier-physics/src/universal_recovery.rs
      - crates/domains/symthaea-frontier-physics/src/lib.rs
      - crates/domains/symthaea-frontier-physics/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/universal-error-set-recovery.yml
  pull_request:
    branches:
      - research/hp-qsvt-petz-decoder-20261113
    paths:
      - crates/domains/symthaea-frontier-physics/src/universal_recovery.rs
      - crates/domains/symthaea-frontier-physics/src/lib.rs
      - crates/domains/symthaea-frontier-physics/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/universal-error-set-recovery.yml

permissions:
  contents: read

concurrency:
  group: universal-error-set-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Universal error-set recovery (Linux, Rust 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: rustfmt --edition 2024 --check crates/domains/symthaea-frontier-physics/src/universal_recovery.rs
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml --all-targets -- -D warnings
      - name: Run crate tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml --lib
