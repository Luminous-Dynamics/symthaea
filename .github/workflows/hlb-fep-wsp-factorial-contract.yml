      - "crates/core/symthaea-fep/Cargo.toml"
      - "crates/core/symthaea-fep/src/lib.rs"
      - "crates/core/symthaea-core/src/hdc/weight_program_adapter.rs"
      - "crates/core/symthaea-core/src/hdc/mod.rs"
      - "crates/core/symthaea-core/src/hdc/hdc_ltc_unified.rs"
      - "crates/core/symthaea-core/src/weight_space_program.rs"
      - "crates/core/symthaea-core/src/sequential_weight_program.rs"
      - "crates/core/symthaea-core/src/sequential_weight_verification.rs"
      - "crates/core/symthaea-core/src/family_noninferiority.rs"
      - "crates/core/symthaea-fep/src/open_world_weight_program_gate.rs"
      - "src/dynamics/cfc/weight_program_adapter.rs"
