  push:
    branches: [research/hlb-fep-wsp-factorial-v2, research/hlb-family-noninferiority-guardrails-v0]
    paths:
      - ".github/workflows/hlb-fep-wsp-factorial-contract.yml"
      - ".github/scripts/assert-hlb-test-discovery.sh"
      - "crates/core/symthaea-core/examples/hlb_fep_wsp_factorial_contract.rs"
      - "crates/core/symthaea-core/examples/hlb_vsa_bundle_capacity.rs"
