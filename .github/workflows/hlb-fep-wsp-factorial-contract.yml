      - "crates/core/symthaea-fep/src/sequential_diagnostic_benchmark.rs"
      - "crates/core/symthaea-fep/src/static_model_diagnostic.rs"
      - "crates/core/symthaea-fep/examples/hlb_static_model_diagnostic.rs"
      - "crates/core/symthaea-fep/src/decision_diagnostic_benchmark.rs"
      - "crates/core/symthaea-fep/examples/hlb_decision_diagnostic_benchmark.rs"
      - "crates/core/symthaea-fep/examples/hlb_open_world_robustness_benchmark.rs"
      - "crates/core/symthaea-fep/src/gaussian_model_information_gain.rs"
      - "crates/core/symthaea-fep/src/bayesian_model_reduction.rs"
      - "crates/core/symthaea-fep/src/dirichlet_model_reduction.rs"
      - "crates/core/symthaea-fep/src/three_ball_rule_space.rs"
