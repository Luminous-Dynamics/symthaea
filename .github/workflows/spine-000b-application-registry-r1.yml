name: SPINE-000B Phase-C Application Registry v1

on:
  push:
    branches:
      - research/spine-000b-application-registry-r1
  pull_request:
    branches:
      - research/spine-000b-receipt-commitment-v1
    paths:
      - '.github/workflows/spine-000b-application-registry-r1.yml'
      - 'docs/research/SPINE_000B_PHASE_C_APPLICATION_REGISTRY_CONTRACT.md'
      - 'docs/research/SPINE_000B_PHASE_C_APPLICATION_REGISTRY_V1.json'
      - 'scripts/verify_spine_000b_application_registry_v1.py'
      - 'src/cognitive_loop/subsystem_trait.rs'
      - 'src/cognitive_loop/cycle_phase_output/mod.rs'
      - 'src/cognitive_loop/helpers/feedback_helpers.rs'

permissions:
  contents: read

jobs:
  registry:
    name: Source-bound Phase-C application map
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact checkout
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > /tmp/spine_r1_expected_head
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1 > /tmp/spine_r1_pre_status
          test ! -s /tmp/spine_r1_pre_status

      - name: Constrain registry-only subject
        shell: bash
        run: |
          set -euo pipefail
          base=be0ccd5912a05193bbb92914ecb7d85f108b7495
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base"..HEAD | sort > /tmp/spine_r1_changed
          cat > /tmp/spine_r1_allowed <<'EOF'
          .github/workflows/spine-000b-application-registry-r1.yml
          docs/research/SPINE_000B_PHASE_C_APPLICATION_REGISTRY_CONTRACT.md
          docs/research/SPINE_000B_PHASE_C_APPLICATION_REGISTRY_V1.json
          scripts/verify_spine_000b_application_registry_v1.py
          EOF
          sort -o /tmp/spine_r1_allowed /tmp/spine_r1_allowed
          comm -23 /tmp/spine_r1_changed /tmp/spine_r1_allowed > /tmp/spine_r1_unexpected
          if test -s /tmp/spine_r1_unexpected; then
            echo 'Unexpected SPINE-000B-R1 subject files:' >&2
            cat /tmp/spine_r1_unexpected >&2
            exit 1
          fi

      - name: Syntax-check registry instruments
        run: |
          python3 -m py_compile scripts/verify_spine_000b_application_registry_v1.py
          python3 -m json.tool docs/research/SPINE_000B_PHASE_C_APPLICATION_REGISTRY_V1.json > /dev/null

      - name: Verify exact production source consistency
        run: python3 scripts/verify_spine_000b_application_registry_v1.py

      - name: Seal exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/spine-000b-r1
          {
            echo "schema=symthaea.spine.000b.phase-c-application-registry-evidence.v1"
            echo "git_head=$(git rev-parse HEAD)"
            echo "git_index_tree=$(git write-tree)"
            echo "base_commitment_subject=be0ccd5912a05193bbb92914ecb7d85f108b7495"
            echo "authority=measurement-only"
            echo "runtime_evidence_claimed=false"
            echo "causal_load_claimed=false"
          } > artifacts/spine-000b-r1/subject.txt
          cp /tmp/spine_r1_changed artifacts/spine-000b-r1/changed-files.txt
          sha256sum \
            docs/research/SPINE_000B_PHASE_C_APPLICATION_REGISTRY_CONTRACT.md \
            docs/research/SPINE_000B_PHASE_C_APPLICATION_REGISTRY_V1.json \
            scripts/verify_spine_000b_application_registry_v1.py \
            src/cognitive_loop/subsystem_trait.rs \
            src/cognitive_loop/cycle_phase_output/mod.rs \
            src/cognitive_loop/helpers/feedback_helpers.rs \
            docs/research/SPINE_000B_RECEIPT_COMMITMENT_V1.md \
            tests/fixtures/spine_000b_receipt_commitment_v1_vectors.json \
            artifacts/spine-000b-r1/subject.txt \
            > artifacts/spine-000b-r1/SHA256SUMS

      - name: Postflight checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat /tmp/spine_r1_expected_head)"
          git status --porcelain=v1 > /tmp/spine_r1_post_status
          test ! -s /tmp/spine_r1_post_status

      - name: Upload registry evidence
        uses: actions/upload-artifact@v4
        with:
          name: spine-000b-r1-${{ github.sha }}
          path: artifacts/spine-000b-r1/
          retention-days: 90
