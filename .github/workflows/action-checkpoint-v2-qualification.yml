name: Action Checkpoint V2 Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/action-checkpoint-v2-qualification.yml'
      - 'crates/core/symthaea-action-checkpoint/**'
      - 'crates/core/symthaea-action-runtime/**'
      - 'crates/core/symthaea-authority/**'
      - 'docs/architecture/ACTION_FRONTIER_V02_CONVERGENCE.md'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-checkpoint-v2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  action-checkpoint-v2:
    name: Exact-head action checkpoint v2
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR head identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Record clean source baseline
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

      - name: Enforce R2 checkpoint and no-refund ratchets
        run: |
          set -euo pipefail
          IDENTITY=crates/core/symthaea-action-checkpoint/src/lib.rs
          STRICT=crates/core/symthaea-action-checkpoint/src/strict.rs
          HARDENED=crates/core/symthaea-action-checkpoint/src/hardened.rs
          RUNTIME=crates/core/symthaea-action-runtime/src/lib.rs

          grep -Fq 'symthaea.action-checkpoint.v2\0' "${IDENTITY}"
          grep -Fq 'verify_successor_of' "${STRICT}"
          grep -Fq 'NewReservationNotReserved' "${STRICT}"
          grep -Fq 'ReservationRemoved' "${STRICT}"
          grep -Fq 'NonEmptyGenesis' "${STRICT}"
          grep -Fq 'future verifier-owned reconciliation constructor' "${STRICT}"
          grep -Fq 'ordinary_successor_cannot_refund_reserved_authority' "${STRICT}"
          grep -Fq 'ordinary_successor_cannot_refund_unknown_authority' "${STRICT}"
          grep -Fq 'OutcomeUnknownReleaseRequiresProof' "${HARDENED}"
          grep -Fq 'forbid_unproven_uncertain_release' "${HARDENED}"
          grep -Fq 'path = "src/hardened.rs"' crates/core/symthaea-action-checkpoint/Cargo.toml

          python3 - <<'PY'
          from pathlib import Path
          source = Path('crates/core/symthaea-action-checkpoint/src/strict.rs').read_text()
          start = source.index('fn allowed_state_transition')
          end = source.index('\nfn identity_error', start)
          ordinary = source[start:end]
          forbidden = [
              'ReservationState::Reserved | ReservationState::Released',
              'ReservationState::OutcomeUnknown | ReservationState::Released',
              '| ReservationState::Released',
          ]
          if any(item in ordinary for item in forbidden):
              raise SystemExit('ordinary checkpoint successor must not create Released')

          runtime = Path('crates/core/symthaea-action-runtime/src/lib.rs').read_text()
          for needle in ('pub fn cancel_before_dispatch', 'pub fn reconcile_not_applied'):
              if needle in runtime:
                  raise SystemExit(f'ordinary runtime authority-return API restored: {needle}')
          PY

          if grep -Eq 'bincode|serde_json::to_|postcard|rmp_serde' "${IDENTITY}" "${STRICT}" "${HARDENED}"; then
            echo 'serializer-derived checkpoint identity is forbidden' >&2
            exit 1
          fi

      - name: Independent canonical commitment oracle
        run: |
          set -euo pipefail
          python3 crates/core/symthaea-action-checkpoint/scripts/checkpoint_oracle.py

      - name: Format
        run: |
          set -euo pipefail
          cargo fmt -p symthaea-action-runtime -p symthaea-action-checkpoint -- --check

      - name: Resolve candidate and execute focused gates
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check -p symthaea-action-runtime -p symthaea-action-checkpoint --all-targets
          cargo test -p symthaea-action-runtime -p symthaea-action-checkpoint
          cargo clippy -p symthaea-action-runtime -p symthaea-action-checkpoint --all-targets -- -D warnings
          if ! cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock requires committed reconciliation:' >&2
            diff -u /tmp/Cargo.lock.before Cargo.lock || true
            exit 1
          fi

      - name: Locked replay
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-action-runtime -p symthaea-action-checkpoint --all-targets
          cargo test --locked -p symthaea-action-runtime -p symthaea-action-checkpoint
          cargo clippy --locked -p symthaea-action-runtime -p symthaea-action-checkpoint --all-targets -- -D warnings

      - name: Prove qualification did not mutate source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
