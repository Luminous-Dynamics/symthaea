name: HAK Normalization Policy

on:
  pull_request:
    branches:
      - architecture/hak-provider-source-observations-v1
    paths:
      - 'scripts/hak_normalization_policy_lint.py'
      - 'tests/python/test_hak_normalization_policy_lint.py'
      - 'tests/python/test_hak_normalization_policy_schema.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_NORMALIZATION_POLICY_V1.md'
      - 'docs/architecture/hak/normalization-policy-v1.schema.json'
      - 'docs/architecture/hak/normalization-observation-binding-v1.schema.json'
      - 'docs/architecture/hak/policies/normalization/**'
      - 'docs/architecture/hak/evidence/source/*.normalization-binding.json'
      - 'docs/architecture/hak/plans/hak013-normalization-policy-e5-v1.plan.json'
      - 'docs/architecture/hak/policies/hak013-normalization-policy-binding-policy-v1.json'
      - '.github/workflows/hak-normalization-policy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  normalization-policy:
    name: HAK Normalization Policy
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile HAK-013 tooling
        run: |
          python -m py_compile scripts/hak_evidence_lint.py
          python -m py_compile scripts/hak_check_binding_lint.py
          python -m py_compile scripts/hak_normalization_policy_lint.py
      - name: Validate HAK-013 schema syntax
        run: |
          python -m json.tool docs/architecture/hak/normalization-policy-v1.schema.json >/dev/null
          python -m json.tool docs/architecture/hak/normalization-observation-binding-v1.schema.json >/dev/null
      - name: Lint HAK-013 qualification plan
        run: python scripts/hak_evidence_lint.py docs/architecture/hak/plans/hak013-normalization-policy-e5-v1.plan.json
      - name: Lint HAK-013 check-binding policy
        run: |
          python scripts/hak_check_binding_lint.py \
            --plan docs/architecture/hak/plans/hak013-normalization-policy-e5-v1.plan.json \
            --policy docs/architecture/hak/policies/hak013-normalization-policy-binding-policy-v1.json
      - name: Validate content-bound normalization policy
        run: python scripts/hak_normalization_policy_lint.py --policy docs/architecture/hak/policies/normalization/github-actions-source-observation-normalization-v1.json
      - name: Validate historical normalization binding
        run: |
          python scripts/hak_normalization_policy_lint.py \
            --policy docs/architecture/hak/policies/normalization/github-actions-source-observation-normalization-v1.json \
            --observation docs/architecture/hak/evidence/source/hak007-run-34225891059.workflow-run.observation.json \
            --binding docs/architecture/hak/evidence/source/hak007-run-34225891059.workflow-run.normalization-binding.json
      - name: Run HAK-013 regressions
        run: python -m pytest -q tests/python/test_hak_normalization_policy_lint.py tests/python/test_hak_normalization_policy_schema.py
