name: Mycelix-Space CI

on:
  push:
    branches: [main]
    paths:
      - 'mycelix-space/**'
      - '.github/workflows/mycelix-space-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-space/**'
      - '.github/workflows/mycelix-space-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: mycelix-space

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-space/target/
          key: ${{ runner.os }}-space-cargo-${{ hashFiles('mycelix-space/**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-space/target/
          key: ${{ runner.os }}-space-test-${{ hashFiles('mycelix-space/**/Cargo.lock') }}

      - name: Orbital mechanics tests
        run: cargo test -p orbital-mechanics

      - name: Shared types tests
        run: cargo test -p mycelix-space-shared

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: mycelix-space/tests
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-space/tests/target/
          key: ${{ runner.os }}-space-integration-${{ hashFiles('mycelix-space/tests/Cargo.lock') }}

      - name: Orbital mechanics
        run: cargo test --test orbital_mechanics

      - name: Conjunctions
        run: cargo test --test conjunctions

      - name: Propagation
        run: cargo test --test propagation

      - name: Edge cases
        run: cargo test --test edge_cases

      - name: Shared types
        run: cargo test --test shared_types

      - name: Property-based tests
        run: cargo test --test property_tests

      - name: Proptest orbital
        run: cargo test --test proptest_orbital

  build-wasm:
    name: Build WASM Zomes
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-space/target/
          key: ${{ runner.os }}-space-wasm-${{ hashFiles('mycelix-space/**/Cargo.lock') }}

      - name: Build all zomes to WASM
        working-directory: mycelix-space
        run: cargo build --release --target wasm32-unknown-unknown

      - name: List WASM outputs
        working-directory: mycelix-space
        run: ls -lh target/wasm32-unknown-unknown/release/*.wasm 2>/dev/null || echo "WASM files in default-members only"

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mycelix-space/ui
        run: npm install

      - name: Build
        working-directory: mycelix-space/ui
        run: npm run build
