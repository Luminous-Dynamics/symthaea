name: Butlin GWT-1 Trusted Final Consumer

on:
  workflow_call:
    inputs:
      evidence_subject_sha:
        description: Exact specialist evidence-subject commit bound by the final artifact
        required: true
        type: string
      final_resolution_run_id:
        description: Exact workflow run ID that produced the final-resolution artifact
        required: true
        type: string
      final_resolution_run_attempt:
        description: Exact workflow run attempt that produced the final-resolution artifact
        required: true
        type: string

permissions: {}

jobs:
  consume:
    name: Verify final artifact, replay GWT-1, and attest report projection
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout exact consumer authority revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact input and workflow identities
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          FINAL_RUN_ID: ${{ inputs.final_resolution_run_id }}
          FINAL_RUN_ATTEMPT: ${{ inputs.final_resolution_run_attempt }}
          CONSUMER_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CONSUMER_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CONSUMER_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          test "$CONSUMER_WORKFLOW_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$CONSUMER_WORKFLOW_PATH" = ".github/workflows/butlin-gwt1-trusted-final-consumer.yml"
          [[ "$CONSUMER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FINAL_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$FINAL_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$CONSUMER_WORKFLOW_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install and require frozen GitHub CLI verifier root
        id: trusted_gh
        shell: bash
        env:
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_BINARY_SHA256: "553949e2efa12842771efe6012aa4de21f1d591530ec17fc435f610f10e017ee"
          TRUSTED_GH_VERSION_OUTPUT_SHA256: "2ec8b2f6e0e8e915f7e0c8d7b14b77fe93e33225872ea1d98041228950c620a9"
          TRUSTED_GH_ROOT: ${{ runner.temp }}/gwt1-consumer-trusted-gh
          TRUSTED_GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-consumer-trusted-gh-config
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          rm -rf "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          mkdir -p "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          chmod 0700 "$TRUSTED_GH_CONFIG_DIR"
          archive="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$TRUSTED_GH_ARCHIVE_URL"
          printf '%s  %s\n' "$TRUSTED_GH_ARCHIVE_SHA256" "$archive" | /usr/bin/sha256sum -c -
          /usr/bin/tar --no-same-owner -xzf "$archive" -C "$TRUSTED_GH_ROOT"
          gh_path="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64/bin/gh"
          test -f "$gh_path"
          test ! -L "$gh_path"
          test -x "$gh_path"
          version_output="$($gh_path --version)"
          test "$(printf '%s\n' "$version_output" | /usr/bin/awk 'NR==1{print $3}')" = "$TRUSTED_GH_VERSION"
          gh_binary_sha256="$(/usr/bin/sha256sum "$gh_path" | /usr/bin/awk '{print $1}')"
          version_output_sha256="$(printf '%s' "$version_output" | /usr/bin/sha256sum | /usr/bin/awk '{print $1}')"
          test "$gh_binary_sha256" = "$TRUSTED_GH_BINARY_SHA256"
          test "$version_output_sha256" = "$TRUSTED_GH_VERSION_OUTPUT_SHA256"
          echo "gh_path=$gh_path" >> "$GITHUB_OUTPUT"
          echo "gh_binary_sha256=$gh_binary_sha256" >> "$GITHUB_OUTPUT"
          echo "version_output_sha256=$version_output_sha256" >> "$GITHUB_OUTPUT"

      # Bootstrap candidate only. Before authoritative activation this must be
      # replaced by the reviewed/landed immutable final-resolution workflow SHA.
      - name: Download exact final-resolution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gwt1-final-resolved-${{ inputs.evidence_subject_sha }}-${{ inputs.final_resolution_run_id }}-${{ inputs.final_resolution_run_attempt }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.final_resolution_run_id }}
          path: ${{ runner.temp }}/gwt1-consumer-source

      - name: Verify source transport and fresh final-archive attestation
        id: source_verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-consumer-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          SOURCE_DIR: ${{ runner.temp }}/gwt1-consumer-source
          BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA: "198aaf257de0b4f264f69eb64d813d772f0362d6"
        run: |
          set -euo pipefail
          unset GH_HOST GH_ENTERPRISE_TOKEN
          required=(
            gwt1-final-resolution.tar.gz
            gwt1-final-resolution.tar.gz.sha256
            gwt1-final-resolution-admission.json
            gwt1-final-resolution-admission.json.sha256
            gwt1-final-attestation/attestation.json
            gwt1-final-attestation/attestation.json.sha256
            gwt1-final-attestation/verification.json
            gwt1-final-attestation/verification.json.sha256
          )
          for path in "${required[@]}"; do test -f "$SOURCE_DIR/$path"; done
          (cd "$SOURCE_DIR" && /usr/bin/sha256sum -c gwt1-final-resolution.tar.gz.sha256 && /usr/bin/sha256sum -c gwt1-final-resolution-admission.json.sha256)
          (cd "$SOURCE_DIR/gwt1-final-attestation" && /usr/bin/sha256sum -c attestation.json.sha256 && /usr/bin/sha256sum -c verification.json.sha256)
          final_archive_sha256="$(/usr/bin/sha256sum "$SOURCE_DIR/gwt1-final-resolution.tar.gz" | /usr/bin/awk '{print $1}')"
          fresh="$SOURCE_DIR/fresh-final-verification.json"
          "$TRUSTED_GH_PATH" attestation verify "$SOURCE_DIR/gwt1-final-resolution.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --bundle "$SOURCE_DIR/gwt1-final-attestation/attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-trusted-final-resolution.yml" \
            --signer-digest "$BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA" \
            --deny-self-hosted-runners --format json > "$fresh"
          test -s "$fresh"
          echo "archive_sha256=$final_archive_sha256" >> "$GITHUB_OUTPUT"
          echo "verification_sha256=$(/usr/bin/sha256sum "$fresh" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Bounded-admit final archive and validate producer authority bindings
        id: final_admission
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/gwt1-consumer-source
          TRUSTED_ENGINE: ${{ github.workspace }}/.github/scripts/evidence_archive_admission.py
          TRUSTED_PROFILE: ${{ github.workspace }}/.github/evidence-profiles/gwt1-final-resolution-v1.json
          FINAL_ARCHIVE_SHA256: ${{ steps.source_verify.outputs.archive_sha256 }}
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA: "198aaf257de0b4f264f69eb64d813d772f0362d6"
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.gh_binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
        run: |
          set -euo pipefail
          out="$SOURCE_DIR/admitted-final"
          rm -rf "$out"
          mkdir -p "$out"
          /usr/bin/python3 "$TRUSTED_ENGINE" --profile "$TRUSTED_PROFILE" \
            --archive "$SOURCE_DIR/gwt1-final-resolution.tar.gz" --output-dir "$out" \
            > "$SOURCE_DIR/fresh-final-admission.json"
          /usr/bin/jq -e --arg archive_sha "$FINAL_ARCHIVE_SHA256" \
            '.schema=="butlin-evidence-archive-admission-result-v1" and .profile_id=="gwt1-final-resolution-archive-v1" and .archive_sha256==$archive_sha and .member_count==60 and .archive_bytes>0 and .tar_stream_bytes>0 and .total_unpacked_bytes>0' \
            "$SOURCE_DIR/fresh-final-admission.json" >/dev/null
          root="$out/gwt1-final-resolution"
          test -d "$root"
          /usr/bin/cmp -s "$TRUSTED_ENGINE" "$root/archive_admission_engine.py"
          /usr/bin/cmp -s "$TRUSTED_PROFILE" "$root/archive_admission_profile.json"
          (cd "$root" && /usr/bin/sha256sum -c SHA256SUMS)
          /usr/bin/jq -e --arg repository "$GITHUB_REPOSITORY" --arg workflow_sha "$BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA" \
            '.schema=="butlin-gwt1-trusted-final-resolution-provenance-v1" and .repository==$repository and .resolution_workflow_sha==$workflow_sha' \
            "$root/resolution_provenance.json" >/dev/null
          /usr/bin/jq -e --arg repository "$GITHUB_REPOSITORY" --arg workflow_sha "$BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA" \
            --arg executable_sha "$TRUSTED_GH_BINARY_SHA256" --arg version_sha "$TRUSTED_GH_VERSION_OUTPUT_SHA256" \
            '.schema=="butlin-gwt1-final-attestation-verifier-profile-v1" and .repository==$repository and .resolution_workflow_sha==$workflow_sha and .verifier=="github-cli" and .verifier_version=="2.100.0" and .distribution_sha256=="e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be" and .executable_sha256==$executable_sha and .version_output_sha256==$version_sha and .deny_self_hosted_runners==true' \
            "$root/final_verifier_profile.json" >/dev/null
          /usr/bin/jq -e --arg subject "$EVIDENCE_SUBJECT_SHA" '.schema=="butlin-gwt1-final-direct-authority-v1" and .evidence_subject_sha==$subject' "$root/authority/direct/authority.json" >/dev/null
          /usr/bin/jq -e --arg subject "$EVIDENCE_SUBJECT_SHA" '.schema=="butlin-gwt1-final-promotion-authority-v1" and .evidence_subject_sha==$subject' "$root/authority/promotion/authority.json" >/dev/null
          direct_archive_sha="$(/usr/bin/sha256sum "$root/sources/direct/gwt1-evidence.tar.gz" | /usr/bin/awk '{print $1}')"
          expected_direct_archive_sha="$(/usr/bin/jq -r '.evidence_archive_sha256' "$root/authority/direct/authority.json")"
          test "$direct_archive_sha" = "$expected_direct_archive_sha"
          promotion_capsule_sha="$(/usr/bin/sha256sum "$root/sources/promotion/promotion_capsule.json" | /usr/bin/awk '{print $1}')"
          expected_promotion_capsule_sha="$(/usr/bin/jq -r '.promotion_capsule_sha256' "$root/authority/promotion/authority.json")"
          test "$promotion_capsule_sha" = "$expected_promotion_capsule_sha"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "admission_sha256=$(/usr/bin/sha256sum "$SOURCE_DIR/fresh-final-admission.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Re-admit preserved direct evidence from the final archive
        id: direct_admission
        shell: bash
        env:
          FINAL_ROOT: ${{ steps.final_admission.outputs.root }}
          TRUSTED_ENGINE: ${{ github.workspace }}/.github/scripts/evidence_archive_admission.py
          TRUSTED_DIRECT_PROFILE: ${{ github.workspace }}/.github/evidence-profiles/gwt1-direct-evidence-v1.json
        run: |
          set -euo pipefail
          direct_archive="$FINAL_ROOT/sources/direct/gwt1-evidence.tar.gz"
          /usr/bin/cmp -s "$TRUSTED_ENGINE" "$FINAL_ROOT/sources/direct/archive_admission_engine.py"
          /usr/bin/cmp -s "$TRUSTED_DIRECT_PROFILE" "$FINAL_ROOT/sources/direct/archive_admission_profile.json"
          out="$RUNNER_TEMP/gwt1-consumer-direct-admitted"
          rm -rf "$out"
          mkdir -p "$out"
          /usr/bin/python3 "$TRUSTED_ENGINE" --profile "$TRUSTED_DIRECT_PROFILE" \
            --archive "$direct_archive" --output-dir "$out" \
            > "$RUNNER_TEMP/gwt1-consumer-direct-admission.json"
          direct_archive_sha="$(/usr/bin/sha256sum "$direct_archive" | /usr/bin/awk '{print $1}')"
          /usr/bin/jq -e --arg archive_sha "$direct_archive_sha" \
            '.schema=="butlin-evidence-archive-admission-result-v1" and .profile_id=="gwt1-direct-evidence-archive-v1" and .archive_sha256==$archive_sha and .member_count==7 and .archive_bytes>0 and .tar_stream_bytes>0 and .total_unpacked_bytes>0' \
            "$RUNNER_TEMP/gwt1-consumer-direct-admission.json" >/dev/null
          root="$out/gwt1-evidence"
          (cd "$root" && /usr/bin/sha256sum -c SHA256SUMS)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "admission_sha256=$(/usr/bin/sha256sum "$RUNNER_TEMP/gwt1-consumer-direct-admission.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust 1.96.0
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      - name: Reconstruct verified report projection from admitted source bytes
        id: reconstruct
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-consumer-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          CARGO_HOME: ${{ runner.temp }}/gwt1-consumer-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-consumer-target
          GWT1_ADMITTED_FINAL_ROOT: ${{ steps.final_admission.outputs.root }}
          GWT1_ADMITTED_DIRECT_EVIDENCE_DIR: ${{ steps.direct_admission.outputs.root }}
          GWT1_FINAL_ARCHIVE_SHA256: ${{ steps.source_verify.outputs.archive_sha256 }}
          GWT1_TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          GWT1_TRUSTED_SHA256SUM_PATH: /usr/bin/sha256sum
          GWT1_TRUSTED_GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-consumer-trusted-gh-config
          GWT1_VERIFIED_REPORT_OUTPUT: ${{ runner.temp }}/gwt1-consumer-candidate/projection.json
        run: |
          set -euo pipefail
          unset GH_HOST GH_ENTERPRISE_TOKEN
          rm -rf "$RUNNER_TEMP/gwt1-consumer-candidate"
          mkdir -p "$RUNNER_TEMP/gwt1-consumer-candidate"
          cargo run --locked -p symthaea-psych-bench \
            --features trusted-resolution-consumer \
            --bin gwt1_generate_verified_report_candidate
          test -s "$GWT1_VERIFIED_REPORT_OUTPUT"
          /usr/bin/jq -e --arg archive_sha "$GWT1_FINAL_ARCHIVE_SHA256" \
            '.schema=="butlin-gwt1-verified-report-projection-v1" and .indicator_id=="GWT-1" and .final_archive_sha256==$archive_sha and .tier_ceiling=="CausallySupported"' \
            "$GWT1_VERIFIED_REPORT_OUTPUT" >/dev/null
          if /usr/bin/jq -e '.. | strings | select(.=="FunctionallySupported")' "$GWT1_VERIFIED_REPORT_OUTPUT" >/dev/null; then
            echo "FunctionallySupported is forbidden in the GWT-1 V1 report projection" >&2
            exit 1
          fi
          echo "projection_sha256=$(/usr/bin/sha256sum "$GWT1_VERIFIED_REPORT_OUTPUT" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Package deterministic self-contained verified report archive
        id: package
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/gwt1-consumer-source
          FINAL_ROOT: ${{ steps.final_admission.outputs.root }}
          FINAL_ARCHIVE_SHA256: ${{ steps.source_verify.outputs.archive_sha256 }}
          FINAL_VERIFICATION_SHA256: ${{ steps.source_verify.outputs.verification_sha256 }}
          FINAL_ADMISSION_SHA256: ${{ steps.final_admission.outputs.admission_sha256 }}
          DIRECT_ADMISSION_SHA256: ${{ steps.direct_admission.outputs.admission_sha256 }}
          PROJECTION_SHA256: ${{ steps.reconstruct.outputs.projection_sha256 }}
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.gh_binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          FINAL_RUN_ID: ${{ inputs.final_resolution_run_id }}
          FINAL_RUN_ATTEMPT: ${{ inputs.final_resolution_run_attempt }}
          CONSUMER_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CONSUMER_WORKFLOW_REF: ${{ github.workflow_ref }}
          BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA: "198aaf257de0b4f264f69eb64d813d772f0362d6"
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/gwt1-consumer-package"
          stage="$package_root/gwt1-verified-report"
          rm -rf "$package_root"
          mkdir -p "$stage/authority" "$stage/environment" "$stage/source"
          /usr/bin/install -m 0644 "$RUNNER_TEMP/gwt1-consumer-candidate/projection.json" "$stage/projection.json"
          /usr/bin/install -m 0644 "$GITHUB_WORKSPACE/.github/scripts/evidence_archive_admission.py" "$stage/archive_admission_engine.py"
          /usr/bin/install -m 0644 "$GITHUB_WORKSPACE/.github/evidence-profiles/gwt1-verified-report-v1.json" "$stage/archive_admission_profile.json"
          /usr/bin/install -m 0644 "$SOURCE_DIR/gwt1-final-resolution.tar.gz" "$stage/source/gwt1-final-resolution.tar.gz"
          /usr/bin/install -m 0644 "$SOURCE_DIR/gwt1-final-resolution.tar.gz.sha256" "$stage/source/gwt1-final-resolution.tar.gz.sha256"
          /usr/bin/install -m 0644 "$FINAL_ROOT/resolution_provenance.json" "$stage/source/resolution_provenance.json"
          /usr/bin/install -m 0644 "$FINAL_ROOT/final_verifier_profile.json" "$stage/source/final_verifier_profile.json"
          /usr/bin/install -m 0644 "$SOURCE_DIR/gwt1-final-attestation/attestation.json" "$stage/authority/final_archive_attestation.json"
          /usr/bin/install -m 0644 "$SOURCE_DIR/fresh-final-verification.json" "$stage/authority/fresh_final_archive_verification.json"
          /usr/bin/install -m 0644 "$SOURCE_DIR/fresh-final-admission.json" "$stage/authority/fresh_final_archive_admission.json"

          rustc --version --verbose > "$stage/rust-toolchain.txt"
          "$TRUSTED_GH_PATH" --version > "$stage/environment/gh-version.txt"
          /usr/bin/python3 --version > "$stage/environment/python-version.txt" 2>&1
          /usr/bin/tar --version > "$stage/environment/tar-version.txt"
          /usr/bin/gzip --version > "$stage/environment/gzip-version.txt"
          /usr/bin/sha256sum --version > "$stage/environment/sha256sum-version.txt"
          /usr/bin/jq --version > "$stage/environment/jq-version.txt"
          /usr/bin/jq -n \
            --arg schema butlin-gwt1-final-consumer-runner-environment-v1 \
            --arg image_os "${ImageOS:-unknown}" --arg image_version "${ImageVersion:-unknown}" --arg runner_arch "${RUNNER_ARCH:-unknown}" \
            --arg python_sha "$(/usr/bin/sha256sum /usr/bin/python3 | /usr/bin/awk '{print $1}')" \
            --arg tar_sha "$(/usr/bin/sha256sum /usr/bin/tar | /usr/bin/awk '{print $1}')" \
            --arg gzip_sha "$(/usr/bin/sha256sum /usr/bin/gzip | /usr/bin/awk '{print $1}')" \
            --arg sha256sum_sha "$(/usr/bin/sha256sum /usr/bin/sha256sum | /usr/bin/awk '{print $1}')" \
            --arg jq_sha "$(/usr/bin/sha256sum /usr/bin/jq | /usr/bin/awk '{print $1}')" \
            '{schema:$schema,image_os:$image_os,image_version:$image_version,runner_arch:$runner_arch,python3_sha256:$python_sha,tar_sha256:$tar_sha,gzip_sha256:$gzip_sha,sha256sum_sha256:$sha256sum_sha,jq_sha256:$jq_sha}' \
            > "$stage/environment/runner_environment.json"

          runner_environment_sha="$(/usr/bin/sha256sum "$stage/environment/runner_environment.json" | /usr/bin/awk '{print $1}')"
          engine_sha="$(/usr/bin/sha256sum "$stage/archive_admission_engine.py" | /usr/bin/awk '{print $1}')"
          profile_sha="$(/usr/bin/sha256sum "$stage/archive_admission_profile.json" | /usr/bin/awk '{print $1}')"
          base_report_blake3="$(/usr/bin/jq -r '.base_report_blake3' "$stage/projection.json")"

          /usr/bin/jq -n --arg schema butlin-gwt1-trusted-final-consumer-provenance-v1 \
            --arg repository "$GITHUB_REPOSITORY" --arg workflow_sha "$CONSUMER_WORKFLOW_SHA" --arg workflow_ref "$CONSUMER_WORKFLOW_REF" \
            --arg source_workflow_sha "$BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA" --arg evidence_subject_sha "$EVIDENCE_SUBJECT_SHA" \
            --arg source_run_id "$FINAL_RUN_ID" --arg source_run_attempt "$FINAL_RUN_ATTEMPT" --arg source_archive_sha "$FINAL_ARCHIVE_SHA256" \
            --arg projection_sha "$PROJECTION_SHA256" --arg base_report_blake3 "$base_report_blake3" \
            '{schema:$schema,repository:$repository,consumer_workflow_sha:$workflow_sha,consumer_workflow_ref:$workflow_ref,source_final_resolution_workflow_sha:$source_workflow_sha,evidence_subject_sha:$evidence_subject_sha,source_final_resolution_run_id:$source_run_id,source_final_resolution_run_attempt:$source_run_attempt,source_final_archive_sha256:$source_archive_sha,projection_sha256:$projection_sha,base_report_blake3:$base_report_blake3}' \
            > "$stage/consumer_provenance.json"

          /usr/bin/jq -n --arg schema butlin-gwt1-final-consumer-verifier-profile-v1 \
            --arg repository "$GITHUB_REPOSITORY" --arg workflow_sha "$CONSUMER_WORKFLOW_SHA" --arg source_workflow_sha "$BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA" \
            --arg executable_sha "$TRUSTED_GH_BINARY_SHA256" --arg version_sha "$TRUSTED_GH_VERSION_OUTPUT_SHA256" \
            --arg source_archive_sha "$FINAL_ARCHIVE_SHA256" --arg source_verify_sha "$FINAL_VERIFICATION_SHA256" --arg source_admission_sha "$FINAL_ADMISSION_SHA256" \
            --arg direct_admission_sha "$DIRECT_ADMISSION_SHA256" --arg projection_sha "$PROJECTION_SHA256" --arg engine_sha "$engine_sha" --arg profile_sha "$profile_sha" \
            --arg runner_environment_sha "$runner_environment_sha" \
            '{schema:$schema,repository:$repository,consumer_workflow_sha:$workflow_sha,source_final_resolution_workflow_sha:$source_workflow_sha,verifier:"github-cli",verifier_version:"2.100.0",distribution_sha256:"e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be",executable_sha256:$executable_sha,version_output_sha256:$version_sha,configuration_policy:"isolated-gh-config-v1",deny_self_hosted_runners:true,source_final_archive_sha256:$source_archive_sha,fresh_final_archive_verification_sha256:$source_verify_sha,fresh_final_archive_admission_sha256:$source_admission_sha,nested_direct_archive_admission_sha256:$direct_admission_sha,projection_sha256:$projection_sha,archive_admission_engine_sha256:$engine_sha,archive_admission_profile_sha256:$profile_sha,runner_environment_sha256:$runner_environment_sha}' \
            > "$stage/consumer_verifier_profile.json"

          (
            cd "$stage"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 /usr/bin/sha256sum > SHA256SUMS
          )
          /usr/bin/tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$package_root" -cf - gwt1-verified-report | /usr/bin/gzip -n \
            > "$RUNNER_TEMP/gwt1-verified-report.tar.gz"
          (cd "$RUNNER_TEMP" && /usr/bin/sha256sum gwt1-verified-report.tar.gz > gwt1-verified-report.tar.gz.sha256)

          report_archive_sha="$(/usr/bin/sha256sum "$RUNNER_TEMP/gwt1-verified-report.tar.gz" | /usr/bin/awk '{print $1}')"
          report_admission="$RUNNER_TEMP/gwt1-verified-report-admission.json"
          report_extract="$RUNNER_TEMP/gwt1-verified-report-admitted"
          rm -rf "$report_extract"
          mkdir -p "$report_extract"
          /usr/bin/python3 "$GITHUB_WORKSPACE/.github/scripts/evidence_archive_admission.py" \
            --profile "$GITHUB_WORKSPACE/.github/evidence-profiles/gwt1-verified-report-v1.json" \
            --archive "$RUNNER_TEMP/gwt1-verified-report.tar.gz" --output-dir "$report_extract" \
            > "$report_admission"
          /usr/bin/jq -e --arg archive_sha "$report_archive_sha" \
            '.schema=="butlin-evidence-archive-admission-result-v1" and .profile_id=="gwt1-verified-report-archive-v1" and .archive_sha256==$archive_sha and .member_count==25 and .archive_bytes>0 and .tar_stream_bytes>0 and .total_unpacked_bytes>0' \
            "$report_admission" >/dev/null
          (cd "$report_extract/gwt1-verified-report" && /usr/bin/sha256sum -c SHA256SUMS)
          rm -rf "$report_extract"
          (cd "$RUNNER_TEMP" && /usr/bin/sha256sum gwt1-verified-report-admission.json > gwt1-verified-report-admission.json.sha256)
          echo "archive_sha256=$report_archive_sha" >> "$GITHUB_OUTPUT"

      - name: Attest complete deterministic verified-report archive
        id: report_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-verified-report.tar.gz

      - name: Verify and preserve consumer report attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-consumer-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          REPORT_ATTESTATION_BUNDLE: ${{ steps.report_attest.outputs.bundle-path }}
          CONSUMER_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          unset GH_HOST GH_ENTERPRISE_TOKEN
          out="$RUNNER_TEMP/gwt1-verified-report-attestation"
          mkdir -p "$out"
          cp "$REPORT_ATTESTATION_BUNDLE" "$out/attestation.json"
          "$TRUSTED_GH_PATH" attestation verify "$RUNNER_TEMP/gwt1-verified-report.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --bundle "$out/attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-trusted-final-consumer.yml" \
            --signer-digest "$CONSUMER_WORKFLOW_SHA" --deny-self-hosted-runners --format json \
            > "$out/verification.json"
          test -s "$out/verification.json"
          (cd "$out" && /usr/bin/sha256sum attestation.json > attestation.json.sha256 && /usr/bin/sha256sum verification.json > verification.json.sha256)

      - name: Upload trusted GWT-1 verified report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gwt1-verified-report-${{ inputs.evidence_subject_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gwt1-verified-report.tar.gz
            ${{ runner.temp }}/gwt1-verified-report.tar.gz.sha256
            ${{ runner.temp }}/gwt1-verified-report-admission.json
            ${{ runner.temp }}/gwt1-verified-report-admission.json.sha256
            ${{ runner.temp }}/gwt1-verified-report-attestation/
          if-no-files-found: error
          retention-days: 90
