name: HAK Conformance

on:
  pull_request:
    branches:
      - main
      - architecture/hak-proof-obligations-v1
    paths:
      - 'scripts/hak_conformance_lint.py'
      - 'tests/python/test_hak_conformance_lint.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_CONFORMANCE_LINTER_V1.md'
      - 'docs/architecture/hak/**'
      - '.github/workflows/hak-conformance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance-linter:
    name: HAK Conformance Linter
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          echo "HAK exact subject: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile linter
        run: python -m py_compile scripts/hak_conformance_lint.py

      - name: Lint honest-unknown example
        run: |
          python scripts/hak_conformance_lint.py \
            docs/architecture/hak/examples/fabrication-partition-lease.profile.json

      - name: Run HAK conformance regressions
        run: python -m pytest -q tests/python/test_hak_conformance_lint.py
