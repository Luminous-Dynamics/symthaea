name: VIS-DVPC-004 alarm-envelope benchmark

on:
  pull_request:
    paths:
      - "tools/vision-dvpc-alarm-envelope.rs"
      - "docs/research/VIS_DVPC_004_ALARM_ENVELOPE_V1.md"
      - ".github/workflows/vis-dvpc-004-alarm-envelope.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-alarm-envelope.rs"
      - "docs/research/VIS_DVPC_004_ALARM_ENVELOPE_V1.md"
      - ".github/workflows/vis-dvpc-004-alarm-envelope.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: rustfmt --edition 2024 --check tools/vision-dvpc-alarm-envelope.rs

      - name: Compile and run focused tests
        run: |
          rustc --edition=2024 --test tools/vision-dvpc-alarm-envelope.rs -o /tmp/vis-dvpc-004-tests
          /tmp/vis-dvpc-004-tests

      - name: Build optimized report generator
        run: rustc --edition=2024 -O tools/vision-dvpc-alarm-envelope.rs -o /tmp/vis-dvpc-004

      - name: Require byte-identical replay and record digests
        run: |
          /tmp/vis-dvpc-004 > /tmp/vis-dvpc-004-a.tsv
          /tmp/vis-dvpc-004 > /tmp/vis-dvpc-004-b.tsv
          cmp /tmp/vis-dvpc-004-a.tsv /tmp/vis-dvpc-004-b.tsv
          sha256sum tools/vision-dvpc-alarm-envelope.rs /tmp/vis-dvpc-004-a.tsv

      - name: Validate report schema and row counts
        run: |
          awk -F '\t' '
            $1 == "RUN_HEADER" { if (NF != 34) exit 2; run_header = 1 }
            $1 == "RUN" { if (NF != 34) exit 3; runs += 1 }
            $1 == "SUMMARY_HEADER" { if (NF != 24) exit 4; summary_header = 1 }
            $1 == "SUMMARY" { if (NF != 24) exit 5; summaries += 1 }
            END {
              if (!run_header || !summary_header || runs != 5328 || summaries != 666) exit 6
              printf "validated run_rows=%d summary_rows=%d\n", runs, summaries
            }
          ' /tmp/vis-dvpc-004-a.tsv
