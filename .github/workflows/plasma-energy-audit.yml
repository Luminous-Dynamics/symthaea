name: Plasma energy source and thermal accounting audit

on:
  push:
    branches:
      - research/plasma-energy-offline-audit-v0-1
    paths:
      - "xtask/src/plasma_energy_audit.rs"
      - "xtask/src/main.rs"
      - "xtask/Cargo.toml"
      - "data/research/plasma_energy_reference_cases_v0_1.json"
      - "data/research/hts_fusion_magnet_reference_cases_v0_1.json"
      - "data/research/thermal_store_accounting_fixtures_v0_1.json"
      - ".github/workflows/plasma-energy-audit.yml"
  pull_request:
    paths:
      - "xtask/src/plasma_energy_audit.rs"
      - "xtask/src/main.rs"
      - "xtask/Cargo.toml"
      - "data/research/plasma_energy_reference_cases_v0_1.json"
      - "data/research/hts_fusion_magnet_reference_cases_v0_1.json"
      - "data/research/thermal_store_accounting_fixtures_v0_1.json"
      - ".github/workflows/plasma-energy-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install Rust quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path xtask/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --manifest-path xtask/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets --locked -- -D warnings
      - name: Audit frozen plasma and thermal source corpora
        run: cargo run --manifest-path xtask/Cargo.toml --locked -- plasma-energy-audit --json
