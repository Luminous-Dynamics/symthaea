name: Plasma energy source and thermal accounting audit

on:
  push:
    branches:
      - research/plasma-energy-offline-audit-v0-1
      - research/plasma-pathway-decision-v0-2
    paths:
      - "xtask/src/plasma_energy_audit.rs"
      - "xtask/src/plasma_pathway_decision.rs"
      - "xtask/src/plasma_experiment_voi.rs"
      - "xtask/plasma-audit-harness/fixtures/plasma-voi-synthetic-v0.json"
      - "xtask/src/main.rs"
      - "xtask/Cargo.toml"
      - "xtask/plasma-audit-harness/**"
      - "data/research/plasma_energy_reference_cases_v0_1.json"
      - "data/research/hts_fusion_magnet_reference_cases_v0_1.json"
      - "data/research/thermal_store_accounting_fixtures_v0_1.json"
      - ".github/workflows/plasma-energy-audit.yml"
  pull_request:
    paths:
      - "xtask/src/plasma_energy_audit.rs"
      - "xtask/src/plasma_pathway_decision.rs"
      - "xtask/src/main.rs"
      - "xtask/Cargo.toml"
      - "xtask/plasma-audit-harness/**"
      - "data/research/plasma_energy_reference_cases_v0_1.json"
      - "data/research/hts_fusion_magnet_reference_cases_v0_1.json"
      - "data/research/thermal_store_accounting_fixtures_v0_1.json"
      - ".github/workflows/plasma-energy-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 quality tools
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format audit module and export exact Rust 1.96 output
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 xtask/src/plasma_energy_audit.rs
          rustfmt --edition 2024 xtask/src/plasma_pathway_decision.rs
          echo "PLASMA_AUDIT_RUSTFMT_BEGIN"
          base64 -w0 xtask/src/plasma_energy_audit.rs
          echo
          echo "PLASMA_AUDIT_RUSTFMT_END"
      - name: Format check of isolated harness
        run: cargo fmt --manifest-path xtask/plasma-audit-harness/Cargo.toml -- --check
      - name: Unit tests for the exact xtask audit module
        run: cargo test --manifest-path xtask/plasma-audit-harness/Cargo.toml --locked
      - name: Strict Clippy for the exact xtask audit module
        run: cargo clippy --manifest-path xtask/plasma-audit-harness/Cargo.toml --all-targets --locked -- -D warnings
      - name: Audit frozen plasma and thermal source corpora
        run: cargo run --manifest-path xtask/plasma-audit-harness/Cargo.toml --locked
