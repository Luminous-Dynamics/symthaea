name: Adaptive Horizon Reference

on:
  push:
    branches: ["research/rob-fep-thermo-001"]
    paths:
      - "research/rob-fep-thermo-001/adaptive-horizon-reference/**"
      - ".github/workflows/adaptive-horizon-reference.yml"

concurrency:
  group: adaptive-horizon-reference-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Rust 1.96 reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/rob-fep-thermo-001/adaptive-horizon-reference/Cargo.toml -- --check
      - name: Run unit tests
        run: cargo test --locked --manifest-path research/rob-fep-thermo-001/adaptive-horizon-reference/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/rob-fep-thermo-001/adaptive-horizon-reference/Cargo.toml --all-targets -- -D warnings
