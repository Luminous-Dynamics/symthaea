name: Nixward Temporal Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "crates/core/nixward/src/action/temporal.rs"
      - "crates/core/nixward/src/action/mod.rs"
      - "crates/core/symthaea-observation-attestation/Cargo.toml"
      - "scripts/qualify_nixward_temporal.sh"
      - ".github/workflows/nixward-temporal.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  temporal-evidence:
    # Runner admission follows the repository-wide draft-safety contract.
    # The ready_for_review event above ensures the first ready head is checked.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Run checked-in focused qualification
        run: bash scripts/qualify_nixward_temporal.sh
