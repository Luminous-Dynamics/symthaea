name: REA ZIP Fuzz Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1"
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/domains/symthaea-rea-artifact-reader/**"
      - ".github/workflows/rea-zip-fuzz.yml"

permissions:
  contents: read

concurrency:
  group: rea-zip-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zip-fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-11-03
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Validate committed fuzz dependency lock
        run: test -f fuzz/Cargo.lock
      - name: Audit committed fuzz dependency graph
        run: cargo tree --manifest-path fuzz/Cargo.toml --locked -e normal,dev
      - name: Prepare content-addressable seed corpus
        run: |
          mkdir -p fuzz/corpus/zip_inventory_and_content fuzz/artifacts
          base64 --decode fuzz/seeds/minimal-stored-entry.zip.b64 > fuzz/corpus/zip_inventory_and_content/minimal-stored-entry.zip
          sha256sum fuzz/seeds/minimal-stored-entry.zip.b64 fuzz/corpus/zip_inventory_and_content/minimal-stored-entry.zip
          echo "dd8a2bd8c16d808363a1d1e7560a4cc86494393c1a202a478db00f00ae53d099  fuzz/corpus/zip_inventory_and_content/minimal-stored-entry.zip" | sha256sum --check -
      - name: Record exact fuzz run context
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            echo "rust_toolchain=nightly-2026-11-03"
            rustc +nightly-2026-11-03 --version --verbose
            cargo +nightly-2026-11-03 --version
            cargo fuzz --version
            uname -a
            sha256sum fuzz/Cargo.lock
            sha256sum fuzz/seeds/minimal-stored-entry.zip.b64 fuzz/corpus/zip_inventory_and_content/minimal-stored-entry.zip
          } | tee fuzz/artifacts/run-context.txt
      - name: Run bounded coverage-guided fuzz smoke
        run: |
          cargo +nightly-2026-11-03 fuzz run zip_inventory_and_content -- \
            -artifact_prefix=fuzz/artifacts/ \
            -max_total_time=180 \
            -max_len=1048576 \
            -rss_limit_mb=512 \
            -print_final_stats=1
      - name: Upload committed fuzz lock and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rea-zip-fuzz-run
          path: |
            fuzz/Cargo.lock
            fuzz/artifacts/**
            fuzz/corpus/zip_inventory_and_content/**
          if-no-files-found: warn
          retention-days: 14
