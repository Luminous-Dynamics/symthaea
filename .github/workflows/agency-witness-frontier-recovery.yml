name: Agency Witness Frontier Recovery

on:
  pull_request:
    paths:
      - 'crates/bridges/symthaea-qualification-witness-frontier/**'
      - 'crates/bridges/symthaea-qualification-witness-sequence/**'
      - 'crates/core/symthaea-authority/**'
      - 'docs/architecture/AGENCY_WITNESS_FRONTIER_RECOVERY_V01.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/agency-witness-frontier-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agency-witness-frontier-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  source:
    name: Ancestry-aware frontier recovery qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt

      - name: Preserve checked-in Cargo.lock
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"

      - name: Reconcile workspace metadata with Cargo
        run: cargo metadata --format-version 1 >/dev/null

      - name: Require additive local lock reconciliation only
        run: |
          python3 - <<'PY'
          import os, pathlib, sys, tomllib
          before = tomllib.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'Cargo.lock.before').read_text())
          after = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          key = lambda p: (p['name'], p['version'], p.get('source'))
          b = {key(p): p for p in before.get('package', [])}
          a = {key(p): p for p in after.get('package', [])}
          removed = set(b) - set(a)
          changed = {k for k in b.keys() & a if b[k] != a[k]}
          added = set(a) - set(b)
          sourced = {k for k in added if k[2] is not None}
          if removed or changed or sourced:
              print('forbidden Cargo.lock reconciliation')
              print('removed:', sorted(removed, key=repr))
              print('changed:', sorted(changed, key=repr))
              print('new sourced:', sorted(sourced, key=repr))
              sys.exit(1)
          print('additive workspace/path nodes:', len(added))
          for item in sorted(added, key=repr):
              print(' +', item)
          PY

      - name: Record lock freshness
        run: |
          if cmp -s "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock; then
            echo clean > "$RUNNER_TEMP/agency-lock-status"
          else
            echo stale > "$RUNNER_TEMP/agency-lock-status"
            git --no-pager diff -- Cargo.lock
          fi

      - name: Rustfmt diagnostic
        continue-on-error: true
        run: cargo fmt --check --package symthaea-qualification-witness-frontier

      - name: Test frontier recovery semantics
        run: cargo test --locked -p symthaea-qualification-witness-frontier

      - name: Clippy frontier recovery semantics
        run: cargo clippy --locked -p symthaea-qualification-witness-frontier --all-targets -- -D warnings

      - name: Record source evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/agency-witness-frontier-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/agency-witness-frontier-evidence/HEAD"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/agency-witness-frontier-evidence/TREE"
          rustc -Vv > "$RUNNER_TEMP/agency-witness-frontier-evidence/RUSTC.txt"
          cargo -V > "$RUNNER_TEMP/agency-witness-frontier-evidence/CARGO.txt"
          sha256sum Cargo.lock > "$RUNNER_TEMP/agency-witness-frontier-evidence/CARGO_LOCK_CANDIDATE_SHA256.txt"
          sha256sum crates/bridges/symthaea-qualification-witness-frontier/src/lib.rs > "$RUNNER_TEMP/agency-witness-frontier-evidence/RECOVERY_SEMANTICS_SHA256.txt"
          sha256sum crates/bridges/symthaea-qualification-witness-sequence/src/lib.rs > "$RUNNER_TEMP/agency-witness-frontier-evidence/SEQUENCE_STORE_SHA256.txt"
          git --no-pager diff -- Cargo.lock > "$RUNNER_TEMP/agency-witness-frontier-evidence/CARGO_LOCK_DIFF.patch"

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agency-witness-frontier-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/agency-witness-frontier-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Require checked-in Cargo.lock to be fresh
        run: test "$(cat "$RUNNER_TEMP/agency-lock-status")" = clean
