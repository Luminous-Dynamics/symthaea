name: REA Rust MCP Stdio Adapter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "crates/domains/symthaea-rea-mcp/**"
      - "crates/domains/symthaea-rea-compat/**"
      - "tools/rea-mcp-harness/**"
      - "scripts/rea/generate-upstream-evidence.mjs"
      - ".github/workflows/rea-rust-mcp-stdio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-rust-mcp-stdio-${{ github.ref }}
  cancel-in-progress: true

env:
  REA_REFERENCE_SHA: 8250bf2320ea57aab4e664db4b4d44b8abd2004e
  REA_NODE_VERSION: 22.23.4
  REA_NPM_VERSION: 11.16.0

jobs:
  mcp-stdio:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      HUSKY: "0"
    steps:
      - name: Checkout Symthaea revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout pinned upstream REA reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: morluto/rea
          ref: 8250bf2320ea57aab4e664db4b4d44b8abd2004e
          path: rea-upstream
          persist-credentials: false

      - name: Set up upstream-supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: rea-upstream/package-lock.json

      - name: Install pinned upstream npm dependencies
        working-directory: rea-upstream
        run: |
          npm install --global "npm@$REA_NPM_VERSION"
          test "$(node --version)" = "v$REA_NODE_VERSION"
          test "$(npm --version)" = "$REA_NPM_VERSION"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate upstream Evidence and EvidenceBundle corpus
        working-directory: rea-upstream
        run: |
          test "$(git rev-parse HEAD)" = "$REA_REFERENCE_SHA"
          ./node_modules/.bin/tsx "$GITHUB_WORKSPACE/scripts/rea/generate-upstream-evidence.mjs" \
            "$GITHUB_WORKSPACE/rea-upstream" \
            "$RUNNER_TEMP/rea-evidence-upstream-v1"
          echo "REA_UPSTREAM_EVIDENCE_FIXTURE_DIR=$RUNNER_TEMP/rea-evidence-upstream-v1" >> "$GITHUB_ENV"

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Generate isolated MCP harness lockfile
        run: cargo generate-lockfile --manifest-path tools/rea-mcp-harness/Cargo.toml

      - name: Validate isolated harness metadata
        run: |
          cargo metadata \
            --manifest-path tools/rea-mcp-harness/Cargo.toml \
            --locked --no-deps --format-version 1 \
            > "$RUNNER_TEMP/rea-mcp-harness-metadata.json"

      - name: Archive generated MCP harness lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-mcp-harness-lockfile
          path: tools/rea-mcp-harness/Cargo.lock
          if-no-files-found: ignore
          retention-days: 7

      - name: Rust format check
        run: cargo fmt --manifest-path tools/rea-mcp-harness/Cargo.toml -- --check

      - name: Rust MCP unit and protocol tests
        run: cargo test --manifest-path tools/rea-mcp-harness/Cargo.toml --locked --all-targets

      - name: Build standalone stdio MCP server
        run: cargo build --manifest-path tools/rea-mcp-harness/Cargo.toml --locked --bin rea-evidence-mcp --release
