name: SOMA Mycelix Position v2 integration

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-soma/**"
      - "scripts/ci/test-soma-mycelix-position-v2.sh"
      - ".github/workflows/soma-mycelix-position-v2.yml"

permissions:
  contents: read

jobs:
  soma-mycelix-position-v2:
    name: Compile SOMA against real Mycelix Position source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Symthaea
        uses: actions/checkout@v4

      - name: Checkout exact Mycelix Position v2 contract
        uses: actions/checkout@v4
        with:
          repository: Luminous-Dynamics/mycelix
          ref: 9722ecb7350307e4d01337254272d2808e1a7095
          path: mycelix

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile and test SOMA against real Mycelix Position package
        run: bash scripts/ci/test-soma-mycelix-position-v2.sh
