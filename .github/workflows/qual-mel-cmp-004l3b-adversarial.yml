name: QUAL-MEL-CMP-004L3B adversarial browser

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  browser-adversarial:
    name: Qualify frozen IndexedDB adversarial browser cases
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify qualifier wrapper and frozen source
        shell: bash
        env:
          SOURCE_SHA: 89d7d9d5a9635f949b179ec8b05635e62d7f3b4f
          SOURCE_PARENT_SHA: b89fa2f1f660d4fe10212d77a270f8712f5d0c98
        run: |
          set -euo pipefail
          QUALIFIER_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^")" = "$SOURCE_PARENT_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" "$QUALIFIER_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/qual-mel-cmp-004l3b-adversarial.yml"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install pinned Rust and WASM target
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Confirm browser and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          wasm-pack --version
          rustc --version
          cargo --version

      - name: Overlay adversarial browser-only qualification harness
        shell: bash
        run: |
          set -euo pipefail
          crate="crates/domains/symthaea-muse-ui"
          cp "$crate/src/main.rs" "$crate/src/lib.rs"

          cat >> "$crate/Cargo.toml" <<'EOF'

          [target.'cfg(target_arch = "wasm32")'.dev-dependencies]
          wasm-bindgen-test = "0.3"
          EOF

          mkdir -p "$crate/tests"
          cat > "$crate/tests/indexeddb_adversarial_browser.rs" <<'EOF'
          #![cfg(target_arch = "wasm32")]

          use std::cell::RefCell;
          use std::future::Future;
          use std::pin::Pin;
          use std::rc::Rc;
          use std::task::{Context, Poll};

          use futures::channel::oneshot;
          use futures::join;
          use futures::task::noop_waker;
          use gloo_timers::future::TimeoutFuture;
          use js_sys::Reflect;
          use wasm_bindgen::closure::Closure;
          use wasm_bindgen::{JsCast, JsValue};
          use wasm_bindgen_test::*;
          use web_sys::{
              IdbDatabase, IdbOpenDbRequest, IdbRequest, IdbTransaction, IdbTransactionMode,
          };

          use symthaea_muse_protocol::{
              ArtifactIdentity, CompositionArtifactId, RenditionArtifactId,
              ScoreContentArtifactId,
          };
          use symthaea_muse_ui::comparison_evidence_envelope::{
              ARTIFACT_BOUND_COMPARISON_ENVELOPE_SCHEMA_VERSION,
              ArtifactBoundBlindComparisonEnvelopeV1,
          };
          use symthaea_muse_ui::comparison_evidence_indexed_db::{
              COMPARISON_EVIDENCE_DATABASE_NAME, COMPARISON_EVIDENCE_DATABASE_VERSION,
              COMPARISON_EVIDENCE_OBJECT_STORE, IndexedDbComparisonEvidenceCreateOutcome,
              IndexedDbComparisonEvidenceError, IndexedDbComparisonEvidenceStore,
          };
          use symthaea_muse_ui::comparison_evidence_record::{
              ARTIFACT_BOUND_COMPARISON_EVIDENCE_SCHEMA_VERSION,
              ArtifactBoundBlindComparisonEvidenceV1, BlindAssignmentProvenanceV1,
              BlindHumanComparisonChoiceV1, ComparisonEvidenceAuthorityV1,
              ComparisonIdentityRelationV1, DurationEvidenceV1, EvidenceSideV1,
              ExposurePolicyEvidenceV1, HumanComparisonJudgmentV1,
              ListeningExposureEvidenceV1, MusicalAnchorEvidenceV1,
              ResolvedHumanComparisonChoiceV1, RevealedAssignmentEvidenceV1,
          };
          use symthaea_muse_ui::comparison_evidence_store::ComparisonEvidenceStoreContractError;

          wasm_bindgen_test_configure!(run_in_browser);

          const TRIAL_CONFLICT: &str = "20000000000000000000000000000001";
          const TRIAL_WRONG_EMBEDDED: &str = "20000000000000000000000000000002";
          const WRONG_STORAGE_KEY: &str = "20000000000000000000000000000003";
          const TRIAL_MALFORMED: &str = "20000000000000000000000000000004";
          const TRIAL_NON_STRING: &str = "20000000000000000000000000000005";
          const TRIAL_CANCEL: &str = "20000000000000000000000000000006";

          fn identity(score: char, composition: char, rendition: char) -> ArtifactIdentity {
              ArtifactIdentity {
                  score_content: ScoreContentArtifactId(score.to_string().repeat(64)),
                  composition: CompositionArtifactId(composition.to_string().repeat(64)),
                  rendition: RenditionArtifactId(rendition.to_string().repeat(64)),
              }
          }

          fn envelope(id: &str, note: &str) -> ArtifactBoundBlindComparisonEnvelopeV1 {
              ArtifactBoundBlindComparisonEnvelopeV1 {
                  schema_version: ARTIFACT_BOUND_COMPARISON_ENVELOPE_SCHEMA_VERSION,
                  trial_instance_id: id.into(),
                  evidence: ArtifactBoundBlindComparisonEvidenceV1 {
                      schema_version: ARTIFACT_BOUND_COMPARISON_EVIDENCE_SCHEMA_VERSION,
                      trial_id: 303,
                      recorded_at_unix_ms: 1_800_000_000_000,
                      side_a_identity: identity('1', '2', '3'),
                      side_b_identity: identity('4', '5', '6'),
                      revealed_assignment: RevealedAssignmentEvidenceV1 {
                          visible_a_side: EvidenceSideV1::A,
                          visible_b_side: EvidenceSideV1::B,
                      },
                      anchor: MusicalAnchorEvidenceV1 {
                          bar_index: 3,
                          beat_offset: 0.25,
                      },
                      exposure_policy: ExposurePolicyEvidenceV1 {
                          minimum_seconds_per_side: 0.5,
                          max_contiguous_step_seconds: 0.6,
                      },
                      duration_evidence_at_judgment: DurationEvidenceV1 {
                          visible_a_seconds: 0.5,
                          visible_b_seconds: 0.5,
                      },
                      judgment: HumanComparisonJudgmentV1 {
                          blind_choice: BlindHumanComparisonChoiceV1::PreferVisibleA,
                          resolved_choice: ResolvedHumanComparisonChoiceV1::PreferSideA,
                          listening_exposure: ListeningExposureEvidenceV1 {
                              visible_a_auditions: 1,
                              visible_b_auditions: 1,
                          },
                          self_reported_confidence: Some(0.8),
                          note: note.into(),
                      },
                      identity_relation: ComparisonIdentityRelationV1::DifferentComposition,
                      assignment_provenance: BlindAssignmentProvenanceV1::Unspecified,
                      authority: ComparisonEvidenceAuthorityV1::HumanSelfReport,
                  },
              }
          }

          fn idb_factory() -> web_sys::IdbFactory {
              web_sys::window()
                  .expect("browser window")
                  .indexed_db()
                  .expect("IndexedDB binding")
                  .expect("IndexedDB available")
          }

          async fn wait_request(request: IdbRequest) -> Result<JsValue, String> {
              let (sender, receiver) = oneshot::channel();
              let sender = Rc::new(RefCell::new(Some(sender)));

              let ok_sender = sender.clone();
              let ok_request = request.clone();
              let on_success = Closure::wrap(Box::new(move || {
                  let result = ok_request
                      .result()
                      .map_err(|error| format!("request result error: {error:?}"));
                  if let Some(sender) = ok_sender.borrow_mut().take() {
                      let _ = sender.send(result);
                  }
              }) as Box<dyn FnMut()>);

              let err_sender = sender;
              let err_request = request.clone();
              let on_error = Closure::wrap(Box::new(move || {
                  let message = err_request
                      .error()
                      .ok()
                      .flatten()
                      .map(|error| format!("{}: {}", error.name(), error.message()))
                      .unwrap_or_else(|| "IndexedDB request failed".into());
                  if let Some(sender) = err_sender.borrow_mut().take() {
                      let _ = sender.send(Err(message));
                  }
              }) as Box<dyn FnMut()>);

              request.set_onsuccess(Some(on_success.as_ref().unchecked_ref()));
              request.set_onerror(Some(on_error.as_ref().unchecked_ref()));
              let result = receiver
                  .await
                  .map_err(|_| "request waiter channel closed".to_string())?;
              request.set_onsuccess(None);
              request.set_onerror(None);
              drop(on_success);
              drop(on_error);
              result
          }

          async fn wait_transaction(transaction: IdbTransaction) -> Result<(), String> {
              let (sender, receiver) = oneshot::channel();
              let sender = Rc::new(RefCell::new(Some(sender)));

              let complete_sender = sender.clone();
              let on_complete = Closure::wrap(Box::new(move || {
                  if let Some(sender) = complete_sender.borrow_mut().take() {
                      let _ = sender.send(Ok(()));
                  }
              }) as Box<dyn FnMut()>);

              let fail_sender = sender.clone();
              let fail_transaction = transaction.clone();
              let on_abort = Closure::wrap(Box::new(move || {
                  let message = fail_transaction
                      .error()
                      .map(|error| format!("{}: {}", error.name(), error.message()))
                      .unwrap_or_else(|| "IndexedDB transaction aborted".into());
                  if let Some(sender) = fail_sender.borrow_mut().take() {
                      let _ = sender.send(Err(message));
                  }
              }) as Box<dyn FnMut()>);

              let error_sender = sender;
              let error_transaction = transaction.clone();
              let on_error = Closure::wrap(Box::new(move || {
                  let message = error_transaction
                      .error()
                      .map(|error| format!("{}: {}", error.name(), error.message()))
                      .unwrap_or_else(|| "IndexedDB transaction error".into());
                  if let Some(sender) = error_sender.borrow_mut().take() {
                      let _ = sender.send(Err(message));
                  }
              }) as Box<dyn FnMut()>);

              transaction.set_oncomplete(Some(on_complete.as_ref().unchecked_ref()));
              transaction.set_onabort(Some(on_abort.as_ref().unchecked_ref()));
              transaction.set_onerror(Some(on_error.as_ref().unchecked_ref()));
              let result = receiver
                  .await
                  .map_err(|_| "transaction waiter channel closed".to_string())?;
              transaction.set_oncomplete(None);
              transaction.set_onabort(None);
              transaction.set_onerror(None);
              drop(on_complete);
              drop(on_abort);
              drop(on_error);
              result
          }

          async fn raw_open(version: u32) -> Result<IdbDatabase, String> {
              let open: IdbOpenDbRequest = idb_factory()
                  .open_with_u32(COMPARISON_EVIDENCE_DATABASE_NAME, version)
                  .map_err(|error| format!("raw open failed: {error:?}"))?;
              let request: IdbRequest = open.unchecked_into();
              wait_request(request)
                  .await?
                  .dyn_into()
                  .map_err(|value| format!("open result was not IdbDatabase: {value:?}"))
          }

          async fn raw_write(key: &str, value: &JsValue) -> Result<(), String> {
              let database = raw_open(COMPARISON_EVIDENCE_DATABASE_VERSION).await?;
              let transaction = database
                  .transaction_with_str_and_mode(
                      COMPARISON_EVIDENCE_OBJECT_STORE,
                      IdbTransactionMode::Readwrite,
                  )
                  .map_err(|error| format!("raw transaction failed: {error:?}"))?;
              let store = transaction
                  .object_store(COMPARISON_EVIDENCE_OBJECT_STORE)
                  .map_err(|error| format!("raw object store failed: {error:?}"))?;
              let request = store
                  .put_with_key(value, &JsValue::from_str(key))
                  .map_err(|error| format!("raw put failed: {error:?}"))?;
              let transaction_wait = wait_transaction(transaction.clone());
              wait_request(request).await?;
              transaction_wait.await?;
              database.close();
              Ok(())
          }

          async fn raw_delete(key: &str) -> Result<(), String> {
              let database = raw_open(COMPARISON_EVIDENCE_DATABASE_VERSION).await?;
              let transaction = database
                  .transaction_with_str_and_mode(
                      COMPARISON_EVIDENCE_OBJECT_STORE,
                      IdbTransactionMode::Readwrite,
                  )
                  .map_err(|error| format!("raw delete transaction failed: {error:?}"))?;
              let store = transaction
                  .object_store(COMPARISON_EVIDENCE_OBJECT_STORE)
                  .map_err(|error| format!("raw delete store failed: {error:?}"))?;
              let request = store
                  .delete(&JsValue::from_str(key))
                  .map_err(|error| format!("raw delete failed: {error:?}"))?;
              let transaction_wait = wait_transaction(transaction.clone());
              wait_request(request).await?;
              transaction_wait.await?;
              database.close();
              Ok(())
          }

          async fn cleanup_valid(
              store: &IndexedDbComparisonEvidenceStore,
              trial_instance_id: &str,
          ) {
              if let Ok(Some(record)) = store.read(trial_instance_id).await {
                  store.delete(&record).await.unwrap();
              } else {
                  let _ = raw_delete(trial_instance_id).await;
              }
          }

          #[wasm_bindgen_test]
          async fn adversarial_indexeddb_suite() {
              wasm_bindgen_test::console_log!("gate=concurrent_conflicting_writers start");
              let first = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              let second = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              cleanup_valid(&first, TRIAL_CONFLICT).await;

              let (left, right) = join!(
                  first.create_once(envelope(TRIAL_CONFLICT, "left")),
                  second.create_once(envelope(TRIAL_CONFLICT, "right"))
              );
              let created_count = [&left, &right]
                  .into_iter()
                  .filter(|result| {
                      matches!(
                          result,
                          Ok(IndexedDbComparisonEvidenceCreateOutcome::Created)
                      )
                  })
                  .count();
              let conflict_count = [&left, &right]
                  .into_iter()
                  .filter(|result| {
                      matches!(
                          result,
                          Err(IndexedDbComparisonEvidenceError::Contract(
                              ComparisonEvidenceStoreContractError::ConflictingTrialReuse { .. }
                          ))
                      )
                  })
                  .count();
              assert_eq!(created_count, 1, "exactly one conflicting writer must create");
              assert_eq!(conflict_count, 1, "the other writer must conflict");
              let retained = first.read(TRIAL_CONFLICT).await.unwrap().unwrap();
              assert!(
                  matches!(
                      retained.evidence().record().judgment.note.as_str(),
                      "left" | "right"
                  ),
                  "winner must be one complete candidate"
              );
              first.delete(&retained).await.unwrap();
              wasm_bindgen_test::console_log!("gate=concurrent_conflicting_writers pass");

              wasm_bindgen_test::console_log!("gate=key_value_mismatch start");
              let store = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              let wrong_subject = envelope(TRIAL_WRONG_EMBEDDED, "mis-keyed");
              let wrong_json = serde_json::to_string(&wrong_subject).unwrap();
              let _ = raw_delete(WRONG_STORAGE_KEY).await;
              raw_write(WRONG_STORAGE_KEY, &JsValue::from_str(&wrong_json))
                  .await
                  .unwrap();

              let read_error = store
                  .read(WRONG_STORAGE_KEY)
                  .await
                  .expect_err("mis-keyed evidence must fail read");
              assert!(matches!(
                  read_error,
                  IndexedDbComparisonEvidenceError::Contract(
                      ComparisonEvidenceStoreContractError::ExistingKeyMismatch { .. }
                  )
              ));
              let list_error = store
                  .list()
                  .await
                  .expect_err("mis-keyed evidence must fail list");
              assert!(matches!(
                  list_error,
                  IndexedDbComparisonEvidenceError::Contract(
                      ComparisonEvidenceStoreContractError::ExistingKeyMismatch { .. }
                  )
              ));
              raw_delete(WRONG_STORAGE_KEY).await.unwrap();
              wasm_bindgen_test::console_log!("gate=key_value_mismatch pass");

              wasm_bindgen_test::console_log!("gate=malformed_and_non_string start");
              let _ = raw_delete(TRIAL_MALFORMED).await;
              raw_write(TRIAL_MALFORMED, &JsValue::from_str("{not-json"))
                  .await
                  .unwrap();
              assert!(matches!(
                  store.read(TRIAL_MALFORMED).await,
                  Err(IndexedDbComparisonEvidenceError::Contract(
                      ComparisonEvidenceStoreContractError::ExistingMalformedJson(_)
                  ))
              ));
              raw_delete(TRIAL_MALFORMED).await.unwrap();

              let _ = raw_delete(TRIAL_NON_STRING).await;
              raw_write(TRIAL_NON_STRING, &JsValue::from_f64(42.0))
                  .await
                  .unwrap();
              assert!(matches!(
                  store.read(TRIAL_NON_STRING).await,
                  Err(IndexedDbComparisonEvidenceError::UnexpectedStoredValue)
              ));
              raw_delete(TRIAL_NON_STRING).await.unwrap();
              wasm_bindgen_test::console_log!("gate=malformed_and_non_string pass");

              wasm_bindgen_test::console_log!("gate=cancellation_teardown start");
              cleanup_valid(&store, TRIAL_CANCEL).await;
              let cancel_store = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              let mut pending = Box::pin(
                  cancel_store.create_once(envelope(TRIAL_CANCEL, "cancelled future"))
              );
              let waker = noop_waker();
              let mut context = Context::from_waker(&waker);
              assert!(
                  matches!(Pin::as_mut(&mut pending).poll(&mut context), Poll::Pending),
                  "first poll must reach an async IndexedDB wait"
              );
              drop(pending);
              drop(cancel_store);
              TimeoutFuture::new(25).await;

              let after_cancel = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              if let Some(record) = after_cancel.read(TRIAL_CANCEL).await.unwrap() {
                  after_cancel.delete(&record).await.unwrap();
              }
              wasm_bindgen_test::console_log!("gate=cancellation_teardown pass");

              wasm_bindgen_test::console_log!("gate=versionchange_connection_hygiene start");
              drop(after_cancel);
              drop(store);
              drop(first);
              drop(second);

              let product_connection = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              let factory = idb_factory();
              let open = factory
                  .open_with_u32(
                      COMPARISON_EVIDENCE_DATABASE_NAME,
                      COMPARISON_EVIDENCE_DATABASE_VERSION + 1,
                  )
                  .unwrap();

              let blocked = Rc::new(RefCell::new(false));
              let blocked_flag = blocked.clone();
              let on_blocked = Closure::wrap(Box::new(move || {
                  *blocked_flag.borrow_mut() = true;
              }) as Box<dyn FnMut()>);
              open.set_onblocked(Some(on_blocked.as_ref().unchecked_ref()));

              let request: IdbRequest = open.clone().unchecked_into();
              let upgraded: IdbDatabase = wait_request(request)
                  .await
                  .expect("version upgrade should complete after product versionchange closes")
                  .dyn_into()
                  .expect("upgrade result should be database");
              open.set_onblocked(None);
              drop(on_blocked);
              assert!(
                  !*blocked.borrow(),
                  "product versionchange handler should close before upgrade becomes blocked"
              );
              upgraded.close();
              drop(product_connection);

              let delete = factory
                  .delete_database(COMPARISON_EVIDENCE_DATABASE_NAME)
                  .expect("delete database request");
              let delete_request: IdbRequest = delete.unchecked_into();
              wait_request(delete_request)
                  .await
                  .expect("test database cleanup after version upgrade");

              let reopened = IndexedDbComparisonEvidenceStore::open()
                  .await
                  .expect("adapter must reopen after cleanup");
              drop(reopened);
              wasm_bindgen_test::console_log!("gate=versionchange_connection_hygiene pass");

              assert!(
                  Reflect::has(&web_sys::window().unwrap(), &JsValue::from_str("indexedDB"))
                      .unwrap()
              );
          }
          EOF

      - name: Execute adversarial IndexedDB suite in headless Chrome
        id: browser_tests
        shell: bash
        run: |
          set -euo pipefail
          wasm-pack test crates/domains/symthaea-muse-ui \
            --chrome --headless --test indexeddb_adversarial_browser

      - name: Write qualification receipt
        if: always()
        shell: bash
        env:
          SOURCE_SHA: 89d7d9d5a9635f949b179ec8b05635e62d7f3b4f
          QUALIFIER_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_OUTCOME: ${{ steps.browser_tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p qualification
          python3 - <<'PY'
          import json, os, subprocess
          outcome = os.environ.get("TEST_OUTCOME", "skipped")
          receipt = {
              "schema": "mel-cmp-004l3b-browser-qualification-v1",
              "source_sha": os.environ["SOURCE_SHA"],
              "qualifier_sha": os.environ.get("QUALIFIER_SHA", "unknown"),
              "rustc": subprocess.run(["rustc", "--version"], capture_output=True, text=True).stdout.strip(),
              "cargo": subprocess.run(["cargo", "--version"], capture_output=True, text=True).stdout.strip(),
              "wasm_pack": subprocess.run(["wasm-pack", "--version"], capture_output=True, text=True).stdout.strip(),
              "chrome": subprocess.run(["google-chrome", "--version"], capture_output=True, text=True).stdout.strip(),
              "gates": {
                  "concurrent_conflicting_writers": "pass" if outcome == "success" else "not_established",
                  "key_value_mismatch": "pass" if outcome == "success" else "not_established",
                  "malformed_and_non_string": "pass" if outcome == "success" else "not_established",
                  "cancellation_teardown": "pass" if outcome == "success" else "not_established",
                  "versionchange_connection_hygiene": "pass" if outcome == "success" else "not_established",
              },
              "qualification": "pass" if outcome == "success" else "fail",
              "nonclaims": [
                  "blocked-open public-path behavior not established",
                  "quota failure not established",
                  "Firefox/Safari compatibility not established",
                  "producer authentication not established",
                  "export consent not established",
                  "listener attention not established",
                  "randomization proof not established",
                  "causal inference not established",
                  "musical quality not established",
              ],
          }
          with open("qualification/mel-cmp-004l3b.json", "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
          PY
          cat qualification/mel-cmp-004l3b.json

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mel-cmp-004l3b-${{ github.run_id }}
          path: qualification/mel-cmp-004l3b.json
          retention-days: 90

      - name: Restore and verify frozen product source
        if: always()
        shell: bash
        env:
          SOURCE_SHA: 89d7d9d5a9635f949b179ec8b05635e62d7f3b4f
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
