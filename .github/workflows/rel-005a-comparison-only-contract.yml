name: REL-005A ComparisonOnly Contract

on:
  pull_request:
    paths:
      - ".github/rel/rel-005a-comparison-only-contract.json"
      - ".github/rel/rel-005a-comparison-only.py"
      - ".github/workflows/rel-005a-comparison-only-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rel-005a-comparison-only-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: eeaa3f70ecca482de77d0f7f1dd69fa92852af6f
  PREDICATE_CONTRACT_BLOB: 3cef5bb3e4203ec14b7d2cf8c165ce4e6ba7701a
  SEAL_CONTRACT_BLOB: c8bc7de1bda479ff411e09ab5220b7d027865b65
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  comparison-contract:
    name: Verify ComparisonOnly evaluator contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact comparison-contract subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Bind exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-full-predicate-contract.json)" = "${PREDICATE_CONTRACT_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-observation-seal-contract.json)" = "${SEAL_CONTRACT_BLOB}"
          mapfile -t changed < <(git diff --name-only "${EXPECTED_PARENT}" HEAD | sort)
          expected=(
            ".github/rel/rel-005a-comparison-only-contract.json"
            ".github/rel/rel-005a-comparison-only.py"
            ".github/workflows/rel-005a-comparison-only-contract.yml"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"

      - name: Verify evaluator authority isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/rel/rel-005a-comparison-only.py
          python3 - <<'PY'
          import json
          import pathlib

          contract = json.loads(
              pathlib.Path(".github/rel/rel-005a-comparison-only-contract.json").read_text()
          )
          source = pathlib.Path(".github/rel/rel-005a-comparison-only.py").read_text()

          assert contract["schema"] == "symthaea.rel.comparison-only-contract.v1"
          assert contract["authority"] == "ComparisonOnlyContractOnly"
          assert contract["predicate_contract_blob"] == "3cef5bb3e4203ec14b7d2cf8c165ce4e6ba7701a"
          assert contract["observation_seal_contract_head"] == "eeaa3f70ecca482de77d0f7f1dd69fa92852af6f"
          assert contract["execution_subject_head"] == "6931639e53060809f9d459196a329c4fe983be7b"
          assert contract["allowed_operators"] == [
              "eq", "le", "gt", "le_threshold", "gt_threshold"
          ]
          assert contract["result_model"]["valid_all_pass"] == "ALL_PREDICATES_PASS"
          assert contract["result_model"]["valid_one_or_more_fail"] == "PREDICATE_FAILURES"
          assert contract["output_claims"] == {
              "comparison_only_adjudicated": True,
              "rel_005a_qualified": False,
              "scientific_pass": False,
              "scientific_fail": False,
          }

          forbidden = [
              "import subprocess",
              "from subprocess",
              "import socket",
              "from socket",
              "import requests",
              "from requests",
              "import urllib",
              "from urllib",
              "compute_xenobot_graft_transform",
              "translate_foreign_hypervector",
          ]
          for token in forbidden:
              assert token not in source, f"forbidden ComparisonOnly capability: {token}"
          PY

      - name: Run synthetic end-to-end ComparisonOnly self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rel/rel-005a-comparison-only.py             --predicate-contract .github/rel/rel-005a-full-predicate-contract.json             --comparison-contract .github/rel/rel-005a-comparison-only-contract.json             --self-test | tee "${RUNNER_TEMP}/comparison-only-self-test.json"
          python3 -m json.tool "${RUNNER_TEMP}/comparison-only-self-test.json" >/dev/null

      - name: Build ComparisonOnlyContractOnly receipt
        shell: bash
        env:
          RECEIPT_PATH: ${{ runner.temp }}/comparison-only-contract-receipt.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          def sha(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          receipt = {
              "schema": "symthaea.rel.comparison-only-contract-static-receipt.v1",
              "authority": "ComparisonOnlyContractOnly",
              "subject_head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "parent_head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"], text=True
              ).strip(),
              "predicate_contract_blob": os.environ["PREDICATE_CONTRACT_BLOB"],
              "seal_contract_blob": os.environ["SEAL_CONTRACT_BLOB"],
              "comparison_contract_sha256": sha(
                  ".github/rel/rel-005a-comparison-only-contract.json"
              ),
              "evaluator_sha256": sha(".github/rel/rel-005a-comparison-only.py"),
              "operator_count": 5,
              "predicate_count": 41,
              "self_tests_passed": True,
              "scientific_values_observed": False,
              "claims": {
                  "comparison_only_adjudicated": False,
                  "rel_005a_qualified": False,
                  "scientific_pass": False,
                  "scientific_fail": False,
              },
          }
          pathlib.Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload static comparison-contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-comparison-only-contract-${{ env.EXPECTED_HEAD }}
          path: |
            .github/rel/rel-005a-comparison-only-contract.json
            ${{ runner.temp }}/comparison-only-self-test.json
            ${{ runner.temp }}/comparison-only-contract-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Postflight exact subject and checkout immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          rm -rf .github/rel/__pycache__
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
