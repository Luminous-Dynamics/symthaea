name: ROB-DESIGN-001A Canonical Subject Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/rob-design-001a-canonical-subject.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rob-design-001a-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE: symthaea-robot-design
  CARGO_INCREMENTAL: "0"

jobs:
  exact-head-robot-design-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact head, parent, and workflow-only qualifier scope
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_parent="${{ github.event.pull_request.base.sha }}"
          else
            expected_parent="$(git rev-parse HEAD^)"
          fi
          echo "EXPECTED_PARENT=$expected_parent" >> "$GITHUB_ENV"
          test "$actual_head" = "$expected_head"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test -z "$(git status --porcelain=v1)"
          mapfile -t actual < <(git diff --name-only "$expected_parent" HEAD | LC_ALL=C sort)
          expected=(".github/workflows/rob-design-001a-canonical-subject.yml")
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Bind frozen source and workspace bytes
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$EXPECTED_PARENT" HEAD -- crates/domains/symthaea-robot-design
          git diff --quiet "$EXPECTED_PARENT" HEAD -- Cargo.toml Cargo.lock
          sha256sum Cargo.toml Cargo.lock > "$RUNNER_TEMP/workspace-inputs.sha256"
          find crates/domains/symthaea-robot-design -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/robot-design-source.sha256"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.96.0
          rustc --version | grep -F 'rustc 1.96.0'
          cargo --version | grep -F 'cargo 1.96.0'

      - name: Diagnose Cargo.lock reconciliation without accepting mutation
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rob-design-001a-evidence"
          mkdir -p "$evidence_dir"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          before_sha="$(sha256sum "$RUNNER_TEMP/Cargo.lock.before" | awk '{print $1}')"

          set +e
          cargo metadata --format-version 1 \
            > "$evidence_dir/cargo-metadata.json" \
            2> "$evidence_dir/cargo-metadata.stderr"
          metadata_exit=$?
          set -e

          after_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          {
            echo "metadata_exit=$metadata_exit"
            echo "lock_before_sha256=$before_sha"
            echo "lock_after_sha256=$after_sha"
          } > "$evidence_dir/lock-diagnostic.txt"

          if ! cmp -s "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock; then
            cp Cargo.lock "$evidence_dir/Cargo.lock.generated"
            diff -u "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock \
              > "$evidence_dir/Cargo.lock.diff" || true
            echo "LOCK_RECONCILIATION_REQUIRED=true" >> "$GITHUB_ENV"
          else
            echo "LOCK_RECONCILIATION_REQUIRED=false" >> "$GITHUB_ENV"
          fi

          if [ "$metadata_exit" -ne 0 ]; then
            echo "METADATA_DIAGNOSTIC_FAILED=true" >> "$GITHUB_ENV"
          else
            echo "METADATA_DIAGNOSTIC_FAILED=false" >> "$GITHUB_ENV"
          fi

          cp "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock
          test -z "$(git status --porcelain=v1)"

      - name: Rustfmt
        if: env.LOCK_RECONCILIATION_REQUIRED == 'false' && env.METADATA_DIAGNOSTIC_FAILED == 'false'
        run: cargo fmt --check -p "$PACKAGE"

      - name: Locked compile
        if: env.LOCK_RECONCILIATION_REQUIRED == 'false' && env.METADATA_DIAGNOSTIC_FAILED == 'false'
        run: cargo check -p "$PACKAGE" --all-targets --locked

      - name: Focused tests
        if: env.LOCK_RECONCILIATION_REQUIRED == 'false' && env.METADATA_DIAGNOSTIC_FAILED == 'false'
        run: cargo test -p "$PACKAGE" --locked -- --nocapture

      - name: Strict Clippy
        if: env.LOCK_RECONCILIATION_REQUIRED == 'false' && env.METADATA_DIAGNOSTIC_FAILED == 'false'
        run: cargo clippy -p "$PACKAGE" --all-targets --locked -- -D warnings

      - name: Refuse qualification while lock reconciliation is required
        if: env.LOCK_RECONCILIATION_REQUIRED == 'true'
        shell: bash
        run: |
          echo "Cargo produced a Cargo.lock delta for the frozen source subject." >&2
          echo "Preserve the uploaded generated lock/diff and reconcile with Cargo-produced bytes only." >&2
          exit 1

      - name: Refuse qualification on Cargo metadata diagnostic failure
        if: env.METADATA_DIAGNOSTIC_FAILED == 'true'
        shell: bash
        run: |
          echo "Cargo metadata failed before locked source qualification." >&2
          exit 1

      - name: Source postflight immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/Cargo.lock.before" ]; then
            cp "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock
          fi
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --quiet "$EXPECTED_PARENT" HEAD -- crates/domains/symthaea-robot-design
          git diff --quiet "$EXPECTED_PARENT" HEAD -- Cargo.toml Cargo.lock
          sha256sum -c "$RUNNER_TEMP/workspace-inputs.sha256"
          sha256sum -c "$RUNNER_TEMP/robot-design-source.sha256"

      - name: Write evidence receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rob-design-001a-evidence"
          mkdir -p "$evidence_dir"
          {
            echo "program=ROB-DESIGN-001A"
            echo "authority=canonical-robot-design-source-qualification-only"
            echo "source_subject_sha=$EXPECTED_PARENT"
            echo "source_tree_sha=$(git rev-parse "$EXPECTED_PARENT^{tree}")"
            echo "qualifier_sha=$(git rev-parse HEAD)"
            echo "qualifier_tree_sha=$(git rev-parse HEAD^{tree})"
            echo "rustc=$(rustc --version 2>/dev/null || echo unavailable)"
            echo "cargo=$(cargo --version 2>/dev/null || echo unavailable)"
            echo "lock_reconciliation_required=${LOCK_RECONCILIATION_REQUIRED:-UNKNOWN}"
            echo "metadata_diagnostic_failed=${METADATA_DIAGNOSTIC_FAILED:-UNKNOWN}"
            echo "job_status=${{ job.status }}"
            echo "qualification_claim=SOURCE_ONLY"
            echo "fabrication_authority=NONE"
            echo "commissioning_authority=NONE"
            echo "physical_claim=NONE"
            echo "actuation_authority=NONE"
          } > "$evidence_dir/receipt.txt"
          cp "$RUNNER_TEMP/workspace-inputs.sha256" "$evidence_dir/"
          cp "$RUNNER_TEMP/robot-design-source.sha256" "$evidence_dir/"
          find "$evidence_dir" -type f ! -name sha256sums.txt -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "$evidence_dir/sha256sums.txt"

      - name: Upload qualification or lock-diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rob-design-001a-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rob-design-001a-evidence/
          if-no-files-found: error
          retention-days: 90
