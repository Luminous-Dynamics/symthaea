name: Connectome closed anytime-FWER contract

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "tools/connectome-closed-anytime-fwer/**"
      - "docs/neuroscience/CONNECTOME_CLOSED_ANYTIME_FWER_V1.md"
      - "docs/neuroscience/CONNECTOME_CLOSED_ANYTIME_FWER_V1.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_CLOSED_ANYTIME_FWER_V1.example.json"
      - ".github/workflows/connectome-closed-anytime-fwer.yml"
  push:
    branches: [main, "research/**"]
    paths:
      - "tools/connectome-closed-anytime-fwer/**"
      - "docs/neuroscience/CONNECTOME_CLOSED_ANYTIME_FWER_V1.md"
      - "docs/neuroscience/CONNECTOME_CLOSED_ANYTIME_FWER_V1.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_CLOSED_ANYTIME_FWER_V1.example.json"
      - ".github/workflows/connectome-closed-anytime-fwer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-closed-anytime-fwer:
    name: Validate complete intersection closure and elementary decisions
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Validate Draft 2020-12 schema and exact subset mixtures
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 - <<'PY'
          import hashlib
          import json
          from fractions import Fraction
          from itertools import combinations
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/neuroscience/CONNECTOME_CLOSED_ANYTIME_FWER_V1.schema.json").read_text())
          fixture = json.loads(Path("docs/neuroscience/examples/CONNECTOME_CLOSED_ANYTIME_FWER_V1.example.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          claims = fixture["claims"]
          paths = [[Fraction(x) for x in c["e_process_values"]] for c in claims]
          expected = {tuple(row["claim_ids"]): Fraction(row["stage_two_value"]) for row in fixture["oracle_expectations"]["intersections"]}
          actual = {}
          for size in range(1, len(claims) + 1):
              for indices in combinations(range(len(claims)), size):
                  ids = tuple(claims[i]["claim_id"] for i in indices)
                  actual[ids] = sum((paths[i][2] for i in indices), Fraction(0)) / size
          assert actual == expected
          alpha = Fraction(fixture["alpha"])
          threshold = 1 / alpha
          assert fixture["oracle_expectations"]["threshold"] == str(threshold)
          assert fixture["oracle_expectations"]["intersection_count"] == len(actual)
          ledger = fixture["global_ledger"]
          assert ledger["campaign_id"] == fixture["campaign_id"]
          assert ledger["global_filtration_sha256"] == fixture["global_filtration_sha256"]
          event_sequences = {
              entry["payload"]["event_id"]: entry["sequence"]
              for entry in ledger["entries"] if entry["kind"] == "EVIDENCE"
          }
          for claim in claims:
              path_bytes = ("symthaea-eprocess-path-v1\n" + "".join(x + "\n" for x in claim["e_process_values"])).encode()
              path_sha = hashlib.sha256(path_bytes).hexdigest()
              admission = claim["filtration_admission"]
              assert claim["e_process_path_sha256"] == path_sha
              assert admission["output_process_sha256"] == path_sha
              assert admission["campaign_id"] == fixture["campaign_id"]
              assert admission["process_id"] == claim["claim_id"]
              assert admission["null_spec_sha256"] == claim["null_spec_sha256"]
              assert admission["proof_receipt_sha256"] == claim["component_validity_receipt_sha256"]
              assert admission["target_filtration_sha256"] == fixture["global_filtration_sha256"]
              assert admission["mode"] in ("DIRECT_GLOBAL_SUPERMARTINGALE", "ADJUSTER_LIFTED")
              assert all(event_id in event_sequences and event_sequences[event_id] < admission["process_output_sequence"]
                         for event_id in admission["observed_event_ids"])
              if admission["mode"] == "ADJUSTER_LIFTED":
                  adjuster = admission["adjuster"]
                  assert adjuster["source_process_sha256"] == admission["input_process_sha256"]
                  assert adjuster["source_filtration_sha256"] == admission["source_filtration_sha256"]
                  assert adjuster["target_filtration_sha256"] == admission["target_filtration_sha256"]
                  assert adjuster["theorem_assumptions_sha256"] == admission["assumption_sha256"]
                  assert adjuster["lifted_output_sha256"] == path_sha
          print("closed anytime-FWER schema/admission/path oracle: PASS")
          PY
      - name: Format standalone Rust crate
        run: cargo fmt --manifest-path tools/connectome-closed-anytime-fwer/Cargo.toml -- --check
      - name: Run exact closed-testing Rust tests
        run: cargo test --manifest-path tools/connectome-closed-anytime-fwer/Cargo.toml --locked
