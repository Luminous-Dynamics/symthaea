name: CMAQ-043 fleet-wide anytime risk budget

on:
  pull_request:
    paths:
      - "research/cmaq-043/**"
      - ".github/workflows/cmaq-043.yml"
  push:
    branches:
      - "research/cmaq-043-*"
    paths:
      - "research/cmaq-043/**"
      - ".github/workflows/cmaq-043.yml"

permissions:
  contents: read

concurrency:
  group: cmaq-043-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet-alpha-budget:
    name: fleet-alpha-budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --manifest-path research/cmaq-043/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo +1.100.0 test --manifest-path research/cmaq-043/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo +1.100.0 clippy --manifest-path research/cmaq-043/Cargo.toml --locked --all-targets -- -D warnings
