name: NixWard action score support diagnostics

on:
  pull_request:
    paths:
      - "crates/core/nixward/src/mind/active_inference.rs"
      - "crates/core/nixward/src/mind/mod.rs"
      - "crates/core/nixward/ACTIVE_INFERENCE_TRANSITION_SUPPORT_DIAGNOSTICS_V1.md"
      - ".github/workflows/nixward-action-score-support.yml"
  push:
    branches:
      - main
    paths:
      - "crates/core/nixward/src/mind/active_inference.rs"
      - "crates/core/nixward/src/mind/mod.rs"
      - "crates/core/nixward/ACTIVE_INFERENCE_TRANSITION_SUPPORT_DIAGNOSTICS_V1.md"
      - ".github/workflows/nixward-action-score-support.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-score-support:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Format changed Rust modules
        run: rustfmt +1.100.0 --check --edition 2024 crates/core/nixward/src/mind/active_inference.rs crates/core/nixward/src/mind/mod.rs
      - name: Run NixWard active-inference tests
        run: cargo +1.100.0 test --locked -p nixward --lib mind::active_inference::tests
      - name: Strict Clippy for NixWard library
        run: cargo +1.100.0 clippy --locked -p nixward --lib --all-targets -- -D warnings
