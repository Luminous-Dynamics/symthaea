name: QUAL KAMA-DIALOGUE-001N exact subject

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qual-kama-dialogue-001n-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head reflective intimacy memory qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate subject
        uses: actions/checkout@v4
        with:
          ref: 5649117950f02cf1d8e59591158ee06ad4a18302
          fetch-depth: 1
      - name: Verify exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected=5649117950f02cf1d8e59591158ee06ad4a18302
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "qualified_subject=$actual"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core/symthaea-communication
      - name: Rustfmt exact communication crate
        run: cargo fmt --manifest-path crates/core/symthaea-communication/Cargo.toml -- --check
      - name: Run reflective-memory integration target
        run: cargo test -p symthaea-communication --test reflective_intimacy_memory
      - name: Clippy reflective-memory integration target
        run: cargo clippy -p symthaea-communication --test reflective_intimacy_memory -- -D warnings
