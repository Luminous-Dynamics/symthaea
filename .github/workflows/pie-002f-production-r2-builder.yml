name: PIE-002F Production R2 Builder

on:
  push:
    branches:
      - prepare/pie-002f-production-r2-builder-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-r2:
    name: Build hardened one-commit PIE-002F R2 subject
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PARENT_SHA: d6bf30de475ffac2a2720ee71c7faa08f8c0dd52
      FAILED_SUBJECT_SHA: b4f60d20f62d53c4c938fa808901739537ff533a
      TARGET_BRANCH: feat/pie-002f-production-evidence-context-r2
      PACKAGE: symthaea-planetary-industry
      MANIFEST: crates/domains/symthaea-planetary-industry/Cargo.toml
      LIB: crates/domains/symthaea-planetary-industry/src/lib.rs
      SOURCE: crates/domains/symthaea-planetary-industry/src/utility_evidence_context.rs

    steps:
      - name: Checkout exact convergence parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 1

      - name: Verify immutable parent and fetch failed evidence subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=1 origin "$FAILED_SUBJECT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FAILED_SUBJECT_SHA"

      - name: Import exact failed candidate product surface
        shell: bash
        run: |
          set -euo pipefail
          git show "$FAILED_SUBJECT_SHA:$MANIFEST" > "$MANIFEST"
          git show "$FAILED_SUBJECT_SHA:$LIB" > "$LIB"
          git show "$FAILED_SUBJECT_SHA:$SOURCE" > "$SOURCE"

      - name: Apply validation-preserving R2 transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build-pie-002f-production-r2.py

      - name: Install exact Rust qualification toolchain
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Format only PIE-002F product crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p "$PACKAGE"

      - name: Run locked product and opacity gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p "$PACKAGE" -- --check
          cargo check -p "$PACKAGE" --all-targets --locked
          cargo test -p "$PACKAGE" --all-targets --locked
          cargo test -p "$PACKAGE" --doc --locked
          cargo clippy -p "$PACKAGE" --all-targets --locked -- -D warnings

      - name: Enforce exact product scope
        shell: bash
        run: |
          set -euo pipefail
          git add "$MANIFEST" "$LIB" "$SOURCE"
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "$MANIFEST"
          test "${changed[1]}" = "$LIB"
          test "${changed[2]}" = "$SOURCE"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

      - name: Commit immutable R2 candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(pie): harden PIE-002F provenance witness (r2)"
          subject_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          tree_sha="$(git rev-parse HEAD^{tree})"
          test "$parent_sha" = "$PARENT_SHA"
          echo "subject_sha=$subject_sha" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"

      - name: Verify target branch immutability and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$PARENT_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Record candidate-construction receipt
        env:
          SUBJECT_SHA: ${{ steps.candidate.outputs.subject_sha }}
          TREE_SHA: ${{ steps.candidate.outputs.tree_sha }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_sha="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          lib_sha="$(sha256sum "$LIB" | awk '{print $1}')"
          source_sha="$(sha256sum "$SOURCE" | awk '{print $1}')"
          cat > pie-002f-r2-builder-receipt.json <<EOF
          {
            "contract": "PIE-002F-PRODUCTION-R2-BUILDER-v1",
            "parent_sha": "$PARENT_SHA",
            "failed_evidence_subject_sha": "$FAILED_SUBJECT_SHA",
            "subject_sha": "$SUBJECT_SHA",
            "tree_sha": "$TREE_SHA",
            "target_branch": "$TARGET_BRANCH",
            "rust_toolchain": "1.96.0",
            "manifest_sha256": "$manifest_sha",
            "lib_sha256": "$lib_sha",
            "source_sha256": "$source_sha",
            "strong_wrapper_deserialize": false,
            "strong_wrapper_public_state": false,
            "external_opacity_doctests": true,
            "semantic_claim": "candidate construction only; exact-subject qualification still required"
          }
          EOF
          git show --format=fuller --stat HEAD > pie-002f-r2-commit.txt
          git diff "$PARENT_SHA"..HEAD -- "$MANIFEST" "$LIB" "$SOURCE" > pie-002f-r2.patch
          cat pie-002f-r2-builder-receipt.json

      - name: Upload R2 construction evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pie-002f-production-r2-construction-evidence
          path: |
            pie-002f-r2-builder-receipt.json
            pie-002f-r2-commit.txt
            pie-002f-r2.patch
          if-no-files-found: error
