name: Connectome phase-response familywise FWER contract

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "tools/connectome-phase-response-family/**"
      - "docs/neuroscience/CONNECTOME_PHASE_RESPONSE_FAMILYWISE_FWER_V1.md"
      - "docs/neuroscience/CONNECTOME_PHASE_RESPONSE_FAMILYWISE_FWER_V1.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_PHASE_RESPONSE_FAMILYWISE_FWER_V1.example.json"
      - ".github/workflows/connectome-phase-response-familywise-fwer.yml"
  push:
    branches: [main, "research/**"]
    paths:
      - "tools/connectome-phase-response-family/**"
      - "docs/neuroscience/CONNECTOME_PHASE_RESPONSE_FAMILYWISE_FWER_V1.md"
      - "docs/neuroscience/CONNECTOME_PHASE_RESPONSE_FAMILYWISE_FWER_V1.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_PHASE_RESPONSE_FAMILYWISE_FWER_V1.example.json"
      - ".github/workflows/connectome-phase-response-familywise-fwer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phase-response-familywise-fwer:
    name: Validate exact weighted anytime-FWER claim family
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Validate Draft 2020-12 schema and fixture
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 - <<'PY'
          import hashlib
          import json
          from fractions import Fraction
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/neuroscience/CONNECTOME_PHASE_RESPONSE_FAMILYWISE_FWER_V1.schema.json").read_text())
          fixture = json.loads(Path("docs/neuroscience/examples/CONNECTOME_PHASE_RESPONSE_FAMILYWISE_FWER_V1.example.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          assert fixture["requested_guarantee"] == "FWER"
          assert sum((Fraction(claim["weight"]) for claim in fixture["claims"]), Fraction(0)) == 1
          expected = {
              "C1-local-reset": (Fraction(20), 2),
              "C2-off-diagonal-transfer": (Fraction(40), 2),
              "C3-contact-recovery": (Fraction(40), None),
          }
          alpha = Fraction(fixture["alpha"])
          ledger = fixture["global_ledger"]
          assert ledger["campaign_id"] == fixture["campaign_id"]
          assert ledger["global_filtration_sha256"] == fixture["global_filtration_sha256"]
          event_sequences = {
              entry["payload"]["event_id"]: entry["sequence"]
              for entry in ledger["entries"] if entry["kind"] == "EVIDENCE"
          }
          for claim in fixture["claims"]:
              threshold = 1 / (alpha * Fraction(claim["weight"]))
              running_max = Fraction(0)
              first_crossing = None
              for stage, encoded in enumerate(claim["e_process_values"]):
                  running_max = max(running_max, Fraction(encoded))
                  if first_crossing is None and running_max >= threshold and stage > 0:
                      first_crossing = stage
              assert (threshold, first_crossing) == expected[claim["claim_id"]]
              path_bytes = ("symthaea-eprocess-path-v1\n" + "".join(x + "\n" for x in claim["e_process_values"])).encode()
              path_sha = hashlib.sha256(path_bytes).hexdigest()
              admission = claim["filtration_admission"]
              assert claim["e_process_path_sha256"] == path_sha
              assert admission["output_process_sha256"] == path_sha
              assert admission["campaign_id"] == fixture["campaign_id"]
              assert admission["process_id"] == claim["claim_id"]
              assert admission["null_spec_sha256"] == claim["null_envelope_sha256"]
              assert admission["proof_receipt_sha256"] == claim["component_validity_receipt_sha256"]
              assert admission["target_filtration_sha256"] == fixture["global_filtration_sha256"]
              assert admission["mode"] in ("DIRECT_GLOBAL_SUPERMARTINGALE", "ADJUSTER_LIFTED")
              assert admission["observed_event_ids"]
              assert all(event_id in event_sequences and event_sequences[event_id] < admission["process_output_sequence"]
                         for event_id in admission["observed_event_ids"])
              if admission["mode"] == "ADJUSTER_LIFTED":
                  adjuster = admission["adjuster"]
                  assert adjuster["source_process_sha256"] == admission["input_process_sha256"]
                  assert adjuster["source_filtration_sha256"] == admission["source_filtration_sha256"]
                  assert adjuster["target_filtration_sha256"] == admission["target_filtration_sha256"]
                  assert adjuster["theorem_assumptions_sha256"] == admission["assumption_sha256"]
                  assert adjuster["lifted_output_sha256"] == path_sha
          print("phase-response familywise schema/admission/path oracle: PASS")
          PY
      - name: Format standalone crate
        run: cargo fmt --manifest-path tools/connectome-phase-response-family/Cargo.toml -- --check
      - name: Test standalone exact-rational Rust audit
        run: cargo test --manifest-path tools/connectome-phase-response-family/Cargo.toml --locked
