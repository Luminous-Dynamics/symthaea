name: Executor SPIFFE Workload Proof V1 Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/executor-spiffe-workload-proof-v1-qualification.yml'
      - 'crates/core/symthaea-executor-spiffe-proof/**'
      - 'crates/core/symthaea-executor-identity/**'
      - 'crates/core/symthaea-interaction-core/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executor-spiffe-workload-proof-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  executor-spiffe-workload-proof-v1:
    name: Exact-head non-verifying SPIFFE workload proof v1
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact B2B parent and tranche scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUIRED_PARENT: 68ba8f7908c2ff0e64fb202db79c4947c5205ceb
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          fi
          git cat-file -e "${REQUIRED_PARENT}^{commit}"
          test "$(git merge-base HEAD "${REQUIRED_PARENT}")" = "${REQUIRED_PARENT}"
          git merge-base --is-ancestor "${REQUIRED_PARENT}" HEAD
          test "$(git rev-list --count "${REQUIRED_PARENT}"..HEAD)" -eq 1

          mapfile -t changed < <(git diff --name-only "${REQUIRED_PARENT}"...HEAD | sort)
          expected=(
            '.github/workflows/executor-spiffe-workload-proof-v1-qualification.yml'
            'crates/core/symthaea-executor-spiffe-proof/Cargo.toml'
            'crates/core/symthaea-executor-spiffe-proof/scripts/spiffe_workload_proof_oracle.py'
            'crates/core/symthaea-executor-spiffe-proof/src/lib.rs'
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Record clean source baseline
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

      - name: Enforce proof-only trust boundary
        run: |
          set -euo pipefail
          MANIFEST=crates/core/symthaea-executor-spiffe-proof/Cargo.toml
          SOURCE=crates/core/symthaea-executor-spiffe-proof/src/lib.rs

          grep -Fq 'sha2 = { workspace = true }' "${MANIFEST}"
          grep -Fq 'symthaea-executor-identity = { path = "../symthaea-executor-identity" }' "${MANIFEST}"
          grep -Fq 'symthaea-interaction-core = { path = "../symthaea-interaction-core" }' "${MANIFEST}"

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('crates/core/symthaea-executor-spiffe-proof/Cargo.toml').read_text()
          source = Path('crates/core/symthaea-executor-spiffe-proof/src/lib.rs').read_text()

          forbidden_dependencies = (
              'serde =', 'tokio =', 'reqwest =', 'hyper =', 'rustls =', 'webpki =',
              'x509-parser =', 'openssl =', 'spiffe =', 'spire =', 'tonic =',
              'symthaea-authority', 'symthaea-action', 'symthaea-executor-identity-composer',
          )
          leaked = [item for item in forbidden_dependencies if item in manifest]
          if leaked:
              raise SystemExit(f'verifier/runtime/authority dependency leaked into D1A: {leaked}')

          required = (
              'pub struct SpiffeWorkloadProofV1',
              'pub enum SpiffeWorkloadProofProfileV1',
              'X509SvidChallengePop',
              'pub fn signed_statement',
              'leaf_certificate_sha256',
              'symthaea.executor.spiffe.workload-proof.claim.v1\\0',
              'symthaea.executor.spiffe.workload-proof.chain.v1\\0',
              'symthaea.executor.spiffe.workload-proof.envelope.v1\\0',
              'fn frozen_canonical_vectors',
              'fn challenge_substitution_changes_signed_claim',
              'fn spiffe_id_substitution_changes_signed_claim',
              'fn leaf_substitution_changes_signed_claim',
              'fn intermediate_path_is_envelope_evidence_not_signed_claim',
              'fn signature_substitution_changes_only_envelope_identity',
              'fn constructor_computes_leaf_commitment_instead_of_accepting_one',
          )
          for item in required:
              if item not in source:
                  raise SystemExit(f'missing D1A proof-contract ratchet: {item}')

          proof = re.search(
              r'pub struct SpiffeWorkloadProofV1\s*\{(.*?)\n\}', source, re.S
          )
          if not proof:
              raise SystemExit('SpiffeWorkloadProofV1 shape not found')
          fields = proof.group(1).lower()
          forbidden_fields = (
              'private_key', 'x509_svid_key', 'trust_bundle', 'bundle_der',
              'federated_bundle', 'crl', 'signature_algorithm', 'verification_result',
              'currentness_result', 'authority', 'dispatch_permit',
          )
          leaked_fields = [item for item in forbidden_fields if item in fields]
          if leaked_fields:
              raise SystemExit(f'trust/verifier/secret field leaked into proof evidence: {leaked_fields}')

          constructor = re.search(
              r'pub fn new\s*\((.*?)\n    \) -> Result<Self, SpiffeWorkloadProofError>',
              source,
              re.S,
          )
          if not constructor:
              raise SystemExit('proof constructor signature not found')
          params = constructor.group(1).lower()
          for forbidden in ('leaf_certificate_sha256', 'signature_algorithm', 'trust_bundle', 'crl', 'private_key'):
              if forbidden in params:
                  raise SystemExit(f'caller controls derived/trust/secret input: {forbidden}')

          if re.search(r'\bSerialize\b|\bDeserialize\b|serde::', source):
              raise SystemExit('serialization policy leaked into pure D1A proof contract')
          if re.search(r'std::net::|std::fs::|std::process::|Command::new|SystemTime|Instant::now', source):
              raise SystemExit('runtime I/O/clock leaked into pure D1A proof contract')
          if re.search(r'pub\s+struct\s+(?:VerifiedExecutorBinding|VerifiedSubjectNode)\b', source):
              raise SystemExit('public live composer-positive type leaked into D1A')
          if re.search(r'pub\s+(?:const\s+)?fn\s+(?:verify|validate_x509|admit|compose|mint)_', source):
              raise SystemExit('verification/admission/minting surface leaked into D1A')

          # The contract may document SPIFFE syntax/currentness as nonclaims, but
          # it must not pretend to parse or validate them.
          if 'spiffe_id.parse' in source or 'FromStr::from_str' in source:
              raise SystemExit('SPIFFE-ID parser leaked into non-verifying D1A')
          PY

      - name: Independent canonical proof oracle
        run: |
          set -euo pipefail
          python3 crates/core/symthaea-executor-spiffe-proof/scripts/spiffe_workload_proof_oracle.py

      - name: Format
        run: |
          set -euo pipefail
          cargo fmt -p symthaea-executor-spiffe-proof -- --check

      - name: Resolve candidate and execute focused gates
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check -p symthaea-executor-spiffe-proof --all-targets
          cargo test -p symthaea-executor-spiffe-proof
          cargo clippy -p symthaea-executor-spiffe-proof --all-targets -- -D warnings
          if ! cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock requires committed reconciliation on this exact stacked lineage:' >&2
            diff -u /tmp/Cargo.lock.before Cargo.lock || true
            exit 1
          fi

      - name: Locked replay
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-executor-spiffe-proof --all-targets
          cargo test --locked -p symthaea-executor-spiffe-proof
          cargo clippy --locked -p symthaea-executor-spiffe-proof --all-targets -- -D warnings

      - name: Prove qualification did not mutate source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
