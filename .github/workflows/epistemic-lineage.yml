name: Epistemic Lineage

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-epistemic-governance/**'
      - '.github/workflows/epistemic-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Verify explicit qualification toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc +1.94.0 --version | awk '{print $2}')" = '1.94.0'
          cargo +1.94.0 --version
          rustfmt +1.94.0 --version
          cargo +1.94.0 clippy --version
      - name: Freeze anti-self-certification contract
        shell: bash
        run: |
          set -euo pipefail
          src=crates/core/symthaea-epistemic-governance/src/lineage.rs
          grep -q 'pub fn assess_independence' "$src"
          grep -q 'UnknownParent' "$src"
          grep -q 'CycleDetected' "$src"
          if grep -Eq 'independent[[:space:]]*:[[:space:]]*bool' "$src"; then
            echo 'Evidence producers must not self-declare independence.' >&2
            exit 1
          fi
      - name: Freeze canonical digest spelling and anti-alias boundary
        shell: bash
        run: |
          set -euo pipefail
          src=crates/core/symthaea-epistemic-governance/src/lineage.rs
          production=$(mktemp)
          sed '/^#\[cfg(test)\]/,$d' "$src" > "$production"

          grep -q 'digest must be sha256:<64 lowercase hex> or blake3:<64 lowercase hex>' "$production"
          grep -q "(b'a'..=b'f').contains(&byte)" "$production"
          if grep -q 'is_ascii_hexdigit()' "$production"; then
            echo 'Lineage digest validation again admits uppercase hex aliases.' >&2
            exit 1
          fi
          grep -q 'uppercase_digest_spelling_fails_closed' "$src"
          grep -q 'case_aliased_roots_cannot_enter_independence_graph' "$src"
          grep -q 'validated_graph_exposes_read_only_semantic_nodes' "$src"
      - name: Freeze membership before independence classification
        shell: bash
        run: |
          set -euo pipefail
          src=crates/core/symthaea-epistemic-governance/src/lineage.rs
          grep -q 'same_malformed_id_fails_before_same_evidence_classification' "$src"
          grep -q 'same_unknown_id_fails_before_same_evidence_classification' "$src"
          grep -q 'known_same_evidence_is_classified_after_membership_validation' "$src"
          python3 - <<'PY'
          from pathlib import Path
          source = Path('crates/core/symthaea-epistemic-governance/src/lineage.rs').read_text()
          start = source.index('pub fn assess_independence')
          end = source.index('impl TryFrom<EvidenceLineageGraphV1>', start)
          body = source[start:end]
          membership = body.index('let left_roots = self.root_ids(left)?;')
          equality = body.index('if left == right')
          if membership >= equality:
              raise SystemExit('SameEvidence classification bypasses graph membership validation')
          PY
      - name: Format epistemic governance
        run: cargo +1.94.0 fmt --package symthaea-epistemic-governance -- --check
      - name: Test epistemic governance
        run: cargo +1.94.0 test --locked -p symthaea-epistemic-governance
      - name: Clippy epistemic governance
        run: cargo +1.94.0 clippy --locked -p symthaea-epistemic-governance --all-targets -- -D warnings
