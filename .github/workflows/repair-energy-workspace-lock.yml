name: Repair pinned energy workspace lockfile

on:
  push:
    branches:
      - research/energy-system-architect-v0-1
    paths:
      - ".github/workflows/repair-energy-workspace-lock.yml"

permissions:
  contents: write

concurrency:
  group: repair-energy-workspace-lock-{ github.ref }
  cancel-in-progress: false

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed research branch
        uses: actions/checkout@v4
        with:
          ref: research/energy-system-architect-v0-1
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Re-resolve workspace metadata without compiling or changing constraints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/energy-system-architect-v0-1"
          # Cargo retains compatible locked versions and updates Cargo.lock only
          # where the revised workspace/package graph requires it. The main
          # Symtropy end-to-end workflow remains --locked.
          cargo metadata --manifest-path crates/domains/symthaea-engineering/Cargo.toml \
            --format-version 1 > /tmp/symthaea-energy-workspace-metadata.json
          test -s Cargo.lock
          git diff --check -- Cargo.lock
          git status --short Cargo.lock

      - name: Commit the lockfile update only when it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the pinned workspace graph."
            exit 0
          fi
          git diff --stat -- Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(lockfile): sync pinned energy workspace metadata"
          git push origin HEAD:refs/heads/research/energy-system-architect-v0-1
