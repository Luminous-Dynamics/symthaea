name: WebResearch Claim-Source Integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/web_research/researcher.rs"
      - "src/web_research/verifier.rs"
      - ".github/workflows/web-research-claim-source-integrity.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.96 WebResearch verifier regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Check touched Rust files
        run: rustfmt +1.96.0 --edition 2024 --check src/web_research/researcher.rs src/web_research/verifier.rs
      - name: Run focused verifier tests
        run: cargo test --manifest-path Cargo.toml --locked --no-default-features --features web_research_module --lib web_research::verifier::tests
