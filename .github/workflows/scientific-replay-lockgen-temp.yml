name: Scientific Replay Lock Candidate

on:
  push:
    branches:
      - ci/scientific-replay-lockgen-temp
    paths:
      - .github/workflows/scientific-replay-lockgen-temp.yml

permissions:
  contents: write

concurrency:
  group: scientific-replay-lockgen-temp
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout construction subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify construction parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7efb081e68e16320ee30a8f5fbc4550bca337665"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.96.0

      - name: Generate minimal workspace lock delta
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p symthaea-scientific-replay --all-targets
          test "$(git diff --name-only)" = "Cargo.lock"

          python - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          current = tomllib.loads(Path("Cargo.lock").read_text())
          base_text = subprocess.check_output(
              ["git", "show", "HEAD^:Cargo.lock"], text=True
          )
          base = tomllib.loads(base_text)

          matches = [
              package
              for package in current["package"]
              if package.get("name") == "symthaea-scientific-replay"
          ]
          assert len(matches) == 1, matches
          assert matches[0] == {
              "name": "symthaea-scientific-replay",
              "version": "0.1.0",
              "dependencies": ["serde", "serde_json"],
          }, matches[0]

          current_without_candidate = dict(current)
          current_without_candidate["package"] = [
              package
              for package in current["package"]
              if package.get("name") != "symthaea-scientific-replay"
          ]
          assert current_without_candidate == base, (
              "lock generation changed material beyond the one new workspace package"
          )
          PY

          git diff --check -- Cargo.lock
          git diff -- Cargo.lock

      - name: Commit generated lock candidate to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Symthaea CI Lock Candidate"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(science): generate replay lock candidate"
          git push origin HEAD:ci/scientific-replay-lockgen-temp
