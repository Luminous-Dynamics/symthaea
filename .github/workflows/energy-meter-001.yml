name: Energy Meter Verification 001

on:
  pull_request:
    paths:
      - "crates/core/symthaea-core/src/physics/energy_meter.rs"
      - "crates/core/symthaea-core/src/physics/energy_receipt.rs"
      - "crates/core/symthaea-core/src/physics/mod.rs"
      - "research/energy-meter-001/**"
      - ".github/workflows/energy-meter-001.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-meter-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-counter-verification:
    name: Exact-source energy meter tests and strict Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Install stable Rust quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate isolated harness lockfile
        run: cargo generate-lockfile --manifest-path research/energy-meter-001/Cargo.toml

      - name: Format isolated harness and included production module
        run: cargo fmt --manifest-path research/energy-meter-001/Cargo.toml -- --check

      - name: Run energy meter unit tests
        run: cargo test --locked --all-features --manifest-path research/energy-meter-001/Cargo.toml

      - name: Smoke-test runtime sensor probe and validate JSON
        run: |
          cargo run --locked --all-features --manifest-path research/energy-meter-001/Cargo.toml --bin energy-meter-probe -- 1 > energy-meter-probe.json
          python3 -m json.tool energy-meter-probe.json > /dev/null

      - name: Strict Clippy
        run: cargo clippy --locked --all-features --manifest-path research/energy-meter-001/Cargo.toml --all-targets -- -D warnings
