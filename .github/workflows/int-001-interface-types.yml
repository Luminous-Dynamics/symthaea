name: INT-001 Interface Types

on:
  pull_request:
    paths:
      - "crates/core/symthaea-interface-types/**"
      - ".github/workflows/int-001-interface-types.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-001-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_PARENT: a187d1d7dade27fc6854dfa6a840396f4cf2b48c
  CARGO_INCREMENTAL: "0"

jobs:
  exact-head-bootstrap:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Bind exact head, parent, and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual_head" = "$expected_head"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain=v1)"

          mapfile -t actual < <(git diff --name-only "$EXPECTED_PARENT" HEAD | LC_ALL=C sort)
          expected=(
            ".github/workflows/int-001-interface-types.yml"
            "crates/core/symthaea-interface-types/Cargo.toml"
            "crates/core/symthaea-interface-types/src/lib.rs"
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.96.0
          rustc --version --verbose
          cargo --version
          rustfmt --version
          cargo clippy --version
          rustc --version | grep -F 'rustc 1.96.0'
          cargo --version | grep -F 'cargo 1.96.0'

      - name: Materialize minimal Cargo lock delta
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo check -p symthaea-interface-types
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.generated"
          git diff -- Cargo.lock > "$RUNNER_TEMP/Cargo.lock.patch"

          test -s "$RUNNER_TEMP/Cargo.lock.patch"
          grep -F 'name = "symthaea-interface-types"' Cargo.lock

          # Bootstrap is additive only. A removal or replacement in the generated
          # lock is a wider dependency change and must be reviewed separately.
          if grep -E '^-[^-]' "$RUNNER_TEMP/Cargo.lock.patch"; then
            echo "INT-001 lock materialization is not additive-only"
            cat "$RUNNER_TEMP/Cargo.lock.patch"
            exit 1
          fi

      - name: Rustfmt
        run: cargo fmt --check -p symthaea-interface-types

      - name: Unit and wire-contract tests
        run: cargo test -p symthaea-interface-types

      - name: Strict Clippy
        run: cargo clippy -p symthaea-interface-types --all-targets -- -D warnings

      - name: Source postflight immutability
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$({ git status --porcelain=v1 || true; } | grep -v '^ M Cargo.lock$' || true)"
          if test -n "$unexpected"; then
            echo "unexpected tracked/untracked mutation after qualification:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Write bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p int-001-evidence
          cp "$RUNNER_TEMP/Cargo.lock.generated" int-001-evidence/Cargo.lock.generated
          cp "$RUNNER_TEMP/Cargo.lock.patch" int-001-evidence/Cargo.lock.patch
          {
            echo "program=INT-001"
            echo "authority=bootstrap-source-qualification-only"
            echo "scientific_claim=NONE"
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "parent_sha=$EXPECTED_PARENT"
            echo "tree_sha=$(git rev-parse HEAD^{tree})"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "generated_lock_sha256=$(sha256sum int-001-evidence/Cargo.lock.generated | cut -d' ' -f1)"
            echo "lock_patch_sha256=$(sha256sum int-001-evidence/Cargo.lock.patch | cut -d' ' -f1)"
            echo "format=PASS"
            echo "tests=PASS"
            echo "clippy=PASS"
            echo "postflight_source_immutable=PASS"
          } > int-001-evidence/receipt.txt

      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: int-001-bootstrap-${{ github.event.pull_request.head.sha || github.sha }}
          path: int-001-evidence/
          if-no-files-found: error
