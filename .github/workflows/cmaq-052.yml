name: CMAQ-052 reference uncertainty alpha split

on:
  pull_request:
    paths:
      - "research/cmaq-052/**"
      - "research/cmaq-046/**"
      - ".github/workflows/cmaq-052.yml"

permissions:
  contents: read

concurrency:
  group: cmaq-052-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-uncertainty:
    name: reference-uncertainty-alpha-split
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/cmaq-052-reference-uncertainty-alpha-split-v0-1-20261128'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --manifest-path research/cmaq-052/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo +1.100.0 test --manifest-path research/cmaq-052/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo +1.100.0 clippy --manifest-path research/cmaq-052/Cargo.toml --locked --all-targets -- -D warnings
