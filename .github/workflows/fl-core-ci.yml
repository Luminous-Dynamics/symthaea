name: Mycelix FL Core CI

on:
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/crates/mycelix-fl-core/**"
      - "mycelix-workspace/sdk-wasm/**"
  pull_request:
    branches: [main]
    paths:
      - "mycelix-workspace/crates/mycelix-fl-core/**"
      - "mycelix-workspace/sdk-wasm/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl-core/target
          key: ${{ runner.os }}-fl-core-check-${{ hashFiles('mycelix-workspace/crates/mycelix-fl-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-core-check-
      - run: cargo check
        env:
          RUSTFLAGS: "-D warnings"

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl-core/target
          key: ${{ runner.os }}-fl-core-test-${{ hashFiles('mycelix-workspace/crates/mycelix-fl-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-core-test-
      - run: cargo test
        env:
          RUST_BACKTRACE: 1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl-core/target
          key: ${{ runner.os }}-fl-core-clippy-${{ hashFiles('mycelix-workspace/crates/mycelix-fl-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-core-clippy-
      - run: cargo clippy -- -D warnings

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl-core/target
          key: ${{ runner.os }}-fl-core-bench-${{ hashFiles('mycelix-workspace/crates/mycelix-fl-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-core-bench-
      - name: Run unified pipeline benchmark
        run: cargo run --example benchmark_unified_pipeline --release
      - name: Run model training benchmark
        run: cargo run --example benchmark_model_training --release
      - name: Run MNIST federated benchmark
        run: cargo run --example benchmark_mnist_federated --release
      - name: Run meta-learning benchmark
        run: cargo run --example benchmark_meta_learning --release
      - name: Run privacy budget benchmark
        run: cargo run --example benchmark_privacy_budget --release
      - name: Run compression benchmark
        run: cargo run --example benchmark_compression --release
      - name: Run Byzantine sweep benchmark
        run: cargo run --example benchmark_byzantine_sweep --release
      - name: Run FEMNIST benchmark
        run: cargo run --example benchmark_femnist --release

  holochain-bridge:
    name: Holochain Bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl-core/target
          key: ${{ runner.os }}-fl-core-holo-${{ hashFiles('mycelix-workspace/crates/mycelix-fl-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fl-core-holo-
      - run: cargo test --features holochain

  wasm-sdk:
    name: WASM SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/sdk-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/sdk-wasm/target
          key: ${{ runner.os }}-wasm-sdk-${{ hashFiles('mycelix-workspace/sdk-wasm/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-wasm-sdk-
      - name: Run native tests
        run: cargo test
      - name: Verify WASM compilation
        run: cargo build --target wasm32-unknown-unknown --release
