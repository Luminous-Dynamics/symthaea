# Evidence-only experiment: prove rustdoc compile_fail can enforce that bound
# provenance proof tokens do not implement Serde transport traits.
name: Capability Provenance Non-Serde Doctest Census

on:
  push:
    branches:
      - evidence/capability-provenance-nonserde-doctest-v1

permissions:
  contents: read

jobs:
  census:
    name: Prove compiler-enforced non-serializability doctests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout evidence subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: evidence/capability-provenance-nonserde-doctest-v1
          fetch-depth: 1
          persist-credentials: false

      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup override set "$channel"
          test "$(rustc --version | awk '{print $2}')" = "$channel"

      - name: Inject temporary doctests and execute
        shell: bash
        run: |
          set -euo pipefail
          target='crates/core/symthaea-continuity/src/capability_analysis_provenance.rs'
          original_sha="$(sha256sum "$target" | awk '{print $1}')"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/core/symthaea-continuity/src/capability_analysis_provenance.rs')
          text = path.read_text()

          def add(name, prefix):
              global text
              marker = f'pub struct {name}<\'a> {{'
              if text.count(marker) != 1:
                  raise SystemExit(f'expected one {name}, got {text.count(marker)}')
              docs = f'''/// Compiler contract: the borrowed proof token is runtime-only.\n///\n/// The public type and Serde traits must resolve in rustdoc:\n/// ```\n/// use std::fmt::Debug;\n/// use symthaea_continuity::{name};\n/// fn assert_debug<T: Debug>() {{}}\n/// fn serde_trait_resolves<T: serde::Serialize>() {{}}\n/// assert_debug::<{name}<\'static>>();\n/// ```\n///\n/// It must not implement `Serialize`:\n/// ```compile_fail\n/// use symthaea_continuity::{name};\n/// fn assert_serialize<T: serde::Serialize>() {{}}\n/// assert_serialize::<{name}<\'static>>();\n/// ```\n///\n/// It must not implement owned deserialization:\n/// ```compile_fail\n/// use symthaea_continuity::{name};\n/// fn assert_deserialize_owned<T: serde::de::DeserializeOwned>() {{}}\n/// assert_deserialize_owned::<{name}<\'static>>();\n/// ```\n'''
              text = text.replace(marker, docs + marker, 1)

          add('BoundCapabilityActivationProvenanceV1', 'activation')
          add('BoundCapabilityCounterfactualProvenanceV1', 'counterfactual')
          path.write_text(text)
          PY

          output="$(mktemp)"
          cargo test --locked -p symthaea-continuity --doc 2>&1 | tee "$output"
          count="$(sed -nE 's/^test result: ok\. ([0-9]+) passed;.*/\1/p' "$output" | tail -n1)"
          [[ "$count" == '6' ]] || { echo "error: expected six doctests, got $count" >&2; cat "$output" >&2; exit 1; }
          grep -Fq 'BoundCapabilityActivationProvenanceV1' "$output"
          grep -Fq 'BoundCapabilityCounterfactualProvenanceV1' "$output"
          rm -f "$output"

          git checkout -- "$target"
          restored_sha="$(sha256sum "$target" | awk '{print $1}')"
          [[ "$restored_sha" == "$original_sha" ]] || { echo 'error: evidence experiment did not restore source bytes' >&2; exit 1; }
          test -z "$(git status --porcelain)"
