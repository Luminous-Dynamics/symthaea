name: RCAF Research Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/rcaf/**"
      - "research/cetb/theory_design/**"
      - ".github/workflows/rcaf-research-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcaf-research-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-report-and-kernel:
    name: Report contract and standalone Rust kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/rcaf/requirements-validation.txt

      - name: Install schema validator
        run: python -m pip install -r research/rcaf/requirements-validation.txt

      - name: Run report-validator unit tests
        run: python -m unittest discover -s research/rcaf/tools -p 'test_*.py' -v

      - name: Run theory-design EIG reference tests
        run: python -m unittest discover -s research/cetb/theory_design -p 'test_*.py' -v

      - name: Validate theory-design manifest and execute synthetic ranking
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("research/cetb/theory_design/design-run.schema.json").read_text())
          manifest = json.loads(Path("research/cetb/theory_design/fixtures/synthetic-design-run.json").read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.validate(manifest, schema)
          PY
          python research/cetb/theory_design/eig.py \
            research/cetb/theory_design/fixtures/synthetic-design-run.json \
            --output "$RUNNER_TEMP/cetb-eig-result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RUNNER_TEMP"] + "/cetb-eig-result.json").read_text())
          assert result["source_status"] == "synthetic_fixture"
          assert len(result["results"]) == 2
          assert [row["rank"] for row in result["results"]] == [1, 2]
          assert all(row["lower_quantile_eig_bits"] >= 0.0 for row in result["results"])
          print("PASS: synthetic theory-design manifest and EIG ranking")
          PY

      - name: Validate synthetic fixture against schema and semantic invariants
        run: |
          python research/rcaf/tools/validate_report.py \
            research/rcaf/fixtures/synthetic-rcaf-report.json \
            --schema research/rcaf/rcaf-report.schema.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Format standalone kernel
        run: cargo fmt --manifest-path research/rcaf/Cargo.toml -- --check

      - name: Test standalone kernel
        run: cargo test --manifest-path research/rcaf/Cargo.toml

      - name: Lint standalone kernel
        run: cargo clippy --manifest-path research/rcaf/Cargo.toml --all-targets -- -D warnings

      - name: Run RCAF synthetic injection-recovery calibration
        run: |
          cargo run --manifest-path research/rcaf/Cargo.toml --example rcaf_injection_recovery -- "$RUNNER_TEMP/rcaf-injection-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("research/rcaf/injection-recovery.schema.json").read_text())
          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/rcaf-injection-report.json").read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.validate(report, schema)
          assert report["null_false_positive_rate"]["estimate"] <= 0.15
          assert report["injection_detection_power"]["estimate"] >= 0.80
          assert report["median_injected_paired_gap"] > report["median_null_paired_gap"] + 0.035
          print("PASS: RCAF synthetic null calibration and injection recovery")
          PY
