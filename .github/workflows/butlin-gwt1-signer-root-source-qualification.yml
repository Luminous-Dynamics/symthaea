name: Butlin GWT-1 Signer Root Source Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/butlin-gwt1-signer-root-source-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify exact direct, causal, and promotion signer roots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout independent qualification lineage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and require exact candidate objects
        shell: bash
        env:
          DIRECT_SHA: 6eaf73a20047b99120e59eb96f48ae0e194e2c80
          DIRECT_WORKFLOW_BLOB: ddb46fa0fc52318d73a1bd63cc367fe1db2080ef
          CAUSAL_SHA: 21f83eece23c8ee9c2f8fa3c1fc1ab3f555c40e7
          CAUSAL_WORKFLOW_BLOB: b77d3bc869d0b91cb1bb8fc7c8b2f0d4a6d7fced
          PROMOTION_SHA: b5b693f3162ac4c66d00e2391f77a6e86a84a788
          PROMOTION_WORKFLOW_BLOB: bdfa345ddec0da75a62abfb5ef6b29bed233b7f5
          ADMISSION_ENGINE_BLOB: 4a7228ab25fcd512d3b038bab29d5f10e0f22eaa
          DIRECT_PROFILE_BLOB: 24115fe59f40600eb6d2a445994aea80db72af82
          CAUSAL_PROFILE_BLOB: d251f39460d9cb187e98381a9c786f1073e5d8c1
        run: |
          set -euo pipefail
          for sha in "$DIRECT_SHA" "$CAUSAL_SHA" "$PROMOTION_SHA"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
            git cat-file -e "${sha}^{commit}"
          done

          test "$(git rev-parse "$DIRECT_SHA:.github/workflows/butlin-gwt1-trusted-builder.yml")" = "$DIRECT_WORKFLOW_BLOB"
          test "$(git rev-parse "$CAUSAL_SHA:.github/workflows/butlin-gwt1-causal-trusted-builder.yml")" = "$CAUSAL_WORKFLOW_BLOB"
          test "$(git rev-parse "$PROMOTION_SHA:.github/workflows/butlin-gwt1-causal-trusted-promotion.yml")" = "$PROMOTION_WORKFLOW_BLOB"

          test "$(git rev-parse "$DIRECT_SHA:.github/scripts/evidence_archive_admission.py")" = "$ADMISSION_ENGINE_BLOB"
          test "$(git rev-parse "$CAUSAL_SHA:.github/scripts/evidence_archive_admission.py")" = "$ADMISSION_ENGINE_BLOB"
          test "$(git rev-parse "$PROMOTION_SHA:.github/scripts/evidence_archive_admission.py")" = "$ADMISSION_ENGINE_BLOB"
          test "$(git rev-parse "$DIRECT_SHA:.github/evidence-profiles/gwt1-direct-evidence-v1.json")" = "$DIRECT_PROFILE_BLOB"
          test "$(git rev-parse "$CAUSAL_SHA:.github/evidence-profiles/gwt1-causal-evidence-v1.json")" = "$CAUSAL_PROFILE_BLOB"
          test "$(git rev-parse "$PROMOTION_SHA:.github/evidence-profiles/gwt1-causal-evidence-v1.json")" = "$CAUSAL_PROFILE_BLOB"

          root="$RUNNER_TEMP/gwt1-signer-root-source"
          rm -rf "$root"
          mkdir -p "$root"
          git show "$DIRECT_SHA:.github/workflows/butlin-gwt1-trusted-builder.yml" > "$root/direct.yml"
          git show "$CAUSAL_SHA:.github/workflows/butlin-gwt1-causal-trusted-builder.yml" > "$root/causal.yml"
          git show "$PROMOTION_SHA:.github/workflows/butlin-gwt1-causal-trusted-promotion.yml" > "$root/promotion.yml"

      - name: Audit fail-closed signer-root source contracts
        shell: bash
        env:
          SOURCE_ROOT: ${{ runner.temp }}/gwt1-signer-root-source
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["SOURCE_ROOT"])
          direct = (root / "direct.yml").read_text()
          causal = (root / "causal.yml").read_text()
          promotion = (root / "promotion.yml").read_text()

          checkout = "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
          download = "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
          upload = "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
          attest = "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6"
          rust = "dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d"
          gh_dist = "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"

          for name, text in (("direct", direct), ("causal", causal), ("promotion", promotion)):
              assert "runs-on: ubuntu-24.04" in text, name
              assert "ubuntu-latest" not in text, name
              assert "actions/cache" not in text, name
              assert checkout in text, name
              assert download in text, name
              assert upload in text, name
              assert attest in text, name
              assert rust in text, name
              assert gh_dist in text, name
              assert "GH_CONFIG_DIR" in text, name
              assert "GH_NO_UPDATE_NOTIFIER" in text, name
              assert "GH_PROMPT_DISABLED" in text, name
              assert "unset GH_HOST GH_ENTERPRISE_TOKEN" in text, name
              assert "--deny-self-hosted-runners" in text, name
              assert "cargo run --locked" in text, name
              assert ".github/scripts/evidence_archive_admission.py" in text, name
              assert "latest" not in text.lower(), name

          # Direct root: separate archive/profile attestations and portable manifests.
          assert "gwt1-direct-evidence-v1.json" in direct
          assert "butlin-gwt1-direct-attestation-verifier-profile-v2" in direct
          assert "verifier-profile-attestation.json" in direct
          assert "verifier-profile-verification.json" in direct
          assert direct.count("actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6") == 2
          assert direct.count("--deny-self-hosted-runners") >= 2
          assert '(cd "$PACKAGE_DIR" && /usr/bin/sha256sum direct_verifier_profile.json > direct_verifier_profile.json.sha256)' in direct
          assert "tarfile.getmembers" not in direct

          # Causal root mirrors the same trust separation under causal semantics.
          assert "gwt1-causal-evidence-v1.json" in causal
          assert "butlin-gwt1-causal-builder-verifier-profile-v1" in causal
          assert "verifier-profile-attestation.json" in causal
          assert "verifier-profile-verification.json" in causal
          assert causal.count("actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6") == 2
          assert causal.count("--deny-self-hosted-runners") >= 2
          assert '(cd "$PACKAGE_DIR" && /usr/bin/sha256sum causal_builder_verifier_profile.json > causal_builder_verifier_profile.json.sha256)' in causal
          assert "matched_sham_observations.json" in causal
          assert "tarfile.getmembers" not in causal

          # Promotion independently verifies upstream authority, then re-admits.
          assert "APPROVED_CAUSAL_BUILDER_SHA: 21f83eece23c8ee9c2f8fa3c1fc1ab3f555c40e7" in promotion
          assert "Freshly verify causal archive and builder-verifier attestations" in promotion
          assert "Re-admit exact causal archive under promotion authority" in promotion
          assert "butlin-gwt1-attestation-verifier-profile-v2" in promotion
          assert "butlin-gwt1-causal-promotion-provenance-v2" in promotion
          assert "gwt1-causal-evidence-v1.json" in promotion
          assert '--signer-digest "$APPROVED_CAUSAL_BUILDER_SHA"' in promotion
          assert promotion.count("--deny-self-hosted-runners") >= 4
          assert "causal_builder_verifier_profile_verification.json" in promotion
          assert "causal_archive_verification.json" in promotion
          assert "archive_admission.json" in promotion
          assert "find . -type f ! -path './attestation/*' ! -name SHA256SUMS" in promotion

          # Source-level qualification must not reinterpret scientific outcomes.
          forbidden_positive_coercions = (
              "NotDemonstrated => CausallySupported",
              "Contradicted => CausallySupported",
              "Inconclusive => CausallySupported",
              "FunctionallySupported",
          )
          for token in forbidden_positive_coercions:
              assert token not in promotion, token
          PY
