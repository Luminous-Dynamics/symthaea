name: PR Governance Draft Revocation Signal

# Runnerless lifecycle revocation for PR Governance.
#
# PR Governance groups automatic work by pull request number. On a transition
# back to draft, this workflow enters that exact repository-wide concurrency
# group and supersedes any queued/running ready-state Governance run before a
# cancellation job can require hosted-runner capacity.

on:
  pull_request:
    types: [converted_to_draft]

permissions: {}

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runnerless-sentinel:
    name: Runnerless Governance revocation sentinel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: true
