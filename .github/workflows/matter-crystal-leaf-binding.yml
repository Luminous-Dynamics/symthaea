name: Matter Crystal Leaf Binding

on:
  pull_request:
    paths:
      - 'src/knowledge/matter_crystal_leaf_binding.rs'
      - 'src/knowledge/mod.rs'
      - '.github/workflows/matter-crystal-leaf-binding.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact parent and focused scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ad947b3e77797f93bf06be6e88802bd930b1f5a4"
          git diff --name-only HEAD^ HEAD | sort > /tmp/files
          cat >/tmp/expected <<'EOF'
          .github/workflows/matter-crystal-leaf-binding.yml
          src/knowledge/matter_crystal_leaf_binding.rs
          src/knowledge/mod.rs
          EOF
          diff -u /tmp/expected /tmp/files
          test -z "$(git diff HEAD^ HEAD -- Cargo.lock Cargo.toml crates || true)"

      - name: Ratchet canonical leaf theorem
        shell: bash
        run: |
          set -euo pipefail
          f=src/knowledge/matter_crystal_leaf_binding.rs
          grep -q 'pub fn bind_crystal_solver_leaf' "$f"
          grep -q 'receipt.validate()?' "$f"
          grep -q 'EvidenceRole::SolverExecution' "$f"
          grep -q 'EvidenceRole::ArtifactContent' "$f"
          grep -q 'EvidenceRole::ImplementationSnapshot' "$f"
          grep -q 'EvidenceRole::DependencySnapshot' "$f"
          grep -q 'ensure_distinct_content' "$f"
          grep -q 'DependencyPostdatesExecution' "$f"
          grep -q 'OutputPredatesExecution' "$f"
          grep -q 'ExecutionEvidenceMissingFromClaim' "$f"
          grep -q 'PeriodicElectronicStructure' "$f"
          ! grep -Eq 'experimental|replication|verified chronology|trusted timestamp' "$f" || true

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Focused regression tests
        run: cargo test --locked matter_crystal_leaf_binding --lib
