name: MUS-DOE experiment split audit

on:
  pull_request:
    paths:
      - "tools/mus-doe-audit/**"
      - "schemas/instrument-engineering/mus_doe_split_corpus_v0_1.schema.json"
      - "fixtures/instrument-engineering/mus_doe_split_corpus_v0_1.json"
      - ".github/workflows/mus-doe-audit.yml"
  push:
    branches: [main]
    paths:
      - "tools/mus-doe-audit/**"
      - "schemas/instrument-engineering/mus_doe_split_corpus_v0_1.schema.json"
      - "fixtures/instrument-engineering/mus_doe_split_corpus_v0_1.json"
      - ".github/workflows/mus-doe-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: MUS-DOE schema, leakage tests and fixture audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format source and emit exact rustfmt output for review
        run: |
          cargo fmt --manifest-path tools/mus-doe-audit/Cargo.toml
          echo '---BEGIN_MUS_DOE_MAIN---'
          cat tools/mus-doe-audit/src/main.rs
          echo '---END_MUS_DOE_MAIN---'
          echo '---BEGIN_MUS_DOE_TOURNAMENT---'
          cat tools/mus-doe-audit/src/bin/policy_tournament.rs
          echo '---END_MUS_DOE_TOURNAMENT---'
      - name: Run auditor unit tests
        run: cargo test --manifest-path tools/mus-doe-audit/Cargo.toml
      - name: Audit synthetic split corpus
        run: cargo run --manifest-path tools/mus-doe-audit/Cargo.toml --bin mus-doe-audit -- --schema schemas/instrument-engineering/mus_doe_split_corpus_v0_1.schema.json --corpus fixtures/instrument-engineering/mus_doe_split_corpus_v0_1.json
      - name: Compare equal-budget synthetic selection policies
        run: cargo run --manifest-path tools/mus-doe-audit/Cargo.toml --bin policy_tournament -- --seeds 100 --budget 11
