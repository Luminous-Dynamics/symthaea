name: Action Frontier V2 R2 Convergence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/action-frontier-v2-r2-convergence.yml'
      - '.github/workflows/action-frontier-v2-qualification.yml'
      - '.github/workflows/action-runtime-v2-qualification.yml'
      - '.github/workflows/action-checkpoint-v2-qualification.yml'
      - 'crates/bridges/symthaea-action-frontier/**'
      - 'crates/core/symthaea-action-runtime/**'
      - 'crates/core/symthaea-action-checkpoint/**'
      - 'docs/architecture/ACTION_FRONTIER_V02_CONVERGENCE.md'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-frontier-v2-r2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  convergence:
    name: Exact R1 hardening on V2B
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify V2B ancestry and reused R1 blobs
        env:
          REQUIRED_BASE: c26691e1dfb5f57d4c997bc17758f9b93d9b4fb8
        run: |
          set -euo pipefail
          git cat-file -e "${REQUIRED_BASE}^{commit}"
          test "$(git merge-base HEAD "${REQUIRED_BASE}")" = "${REQUIRED_BASE}"
          git merge-base --is-ancestor "${REQUIRED_BASE}" HEAD

          test "$(git hash-object crates/core/symthaea-action-runtime/src/lib.rs)" = '07c53c73874b5ac30f9992133ce00bc13e269034'
          test "$(git hash-object crates/core/symthaea-action-checkpoint/src/strict.rs)" = '270fa8d7c32a23ab8c410abaf1bd3be47422d9d9'
          test "$(git hash-object crates/bridges/symthaea-action-frontier/Cargo.toml)" = 'a1c554c4946b24021c3dd97b093ee6714a305b8c'
          test "$(git hash-object crates/bridges/symthaea-action-frontier/src/lib.rs)" = '601350015ce8e750fe12c77d45362b2edf181a85'
          test "$(git hash-object .github/workflows/action-runtime-v2-qualification.yml)" = '075887423f771e05dbc83ab5c2d47f8a7cad5eb2'
          test "$(git hash-object .github/workflows/action-frontier-v2-qualification.yml)" = '4ab7a8c147bb5d30cf10b4f25740cd831fe2550a'
          test "$(git hash-object docs/architecture/ACTION_FRONTIER_V02_CONVERGENCE.md)" = '09a9eb06d17063e1209cc3c8157575eaa615881d'

      - name: Verify repair remains scoped to the V2C-R2 surface
        env:
          REQUIRED_BASE: c26691e1dfb5f57d4c997bc17758f9b93d9b4fb8
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          base = 'c26691e1dfb5f57d4c997bc17758f9b93d9b4fb8'
          allowed = {
              '.github/workflows/action-runtime-v2-qualification.yml',
              '.github/workflows/action-checkpoint-v2-qualification.yml',
              '.github/workflows/action-frontier-v2-qualification.yml',
              '.github/workflows/action-frontier-v2-r2-convergence.yml',
              'crates/core/symthaea-action-runtime/src/lib.rs',
              'crates/core/symthaea-action-checkpoint/src/strict.rs',
              'crates/core/symthaea-action-checkpoint/src/hardened.rs',
              'crates/bridges/symthaea-action-frontier/Cargo.toml',
              'crates/bridges/symthaea-action-frontier/src/lib.rs',
              'docs/architecture/ACTION_FRONTIER_V02_CONVERGENCE.md',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{base}...HEAD'], text=True
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('unexpected V2C-R2 paths: ' + ', '.join(unexpected))
          PY

      - name: Verify V2B hardened facade remains public
        run: |
          set -euo pipefail
          grep -Fq 'path = "src/hardened.rs"' crates/core/symthaea-action-checkpoint/Cargo.toml
          grep -Fq 'OutcomeUnknownReleaseRequiresProof' crates/core/symthaea-action-checkpoint/src/hardened.rs
          grep -Fq 'strict_predecessor_blocks_reserved_to_released_too' crates/core/symthaea-action-checkpoint/src/hardened.rs

      - name: Verify no regressed authority seams
        run: |
          set -euo pipefail
          RUNTIME=crates/core/symthaea-action-runtime/src/lib.rs
          FRONTIER=crates/bridges/symthaea-action-frontier/src/lib.rs
          grep -Fq 'fn current_head(&mut self)' "${FRONTIER}"
          grep -Fq 'StoreFrontierChanged' "${FRONTIER}"
          grep -Fq 'StoreNotEmpty' "${FRONTIER}"
          if grep -Fq 'pub fn resume_from_expected_current' "${FRONTIER}"; then
            echo 'writable frontier restart regression' >&2
            exit 1
          fi
          if grep -Fq 'pub fn into_inner' "${FRONTIER}"; then
            echo 'containment/store escape regression' >&2
            exit 1
          fi
          if grep -Fq 'pub fn cancel_before_dispatch' "${RUNTIME}"; then
            echo 'ordinary pre-dispatch refund API regression' >&2
            exit 1
          fi
          if grep -Fq 'pub fn reconcile_not_applied' "${RUNTIME}"; then
            echo 'ordinary uncertain refund API regression' >&2
            exit 1
          fi

      - name: Prove clean source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
