name: Spore v0.3.3 guarded integration

on:
  push:
    branches:
      - spore/visual-composition-v0.3.3-design
    paths:
      - .github/workflows/spore-v033-autopatch.yml

permissions:
  contents: write

concurrency:
  group: spore-v033-guarded-integration
  cancel-in-progress: true

jobs:
  integrate:
    name: Apply, format, verify, commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout triggering commit exactly
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify event/source identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install pinned Rust 1.96.0
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Require one-shot patch sources and evidence tool
        run: |
          test -s scripts/spore_v033_apply_v2.py
          test -s scripts/spore_v033_apply_semantics.py
          test -s scripts/spore_visual_contact_sheet.py

      - name: Verify temporal evidence tool syntax
        run: python3 -m py_compile scripts/spore_visual_contact_sheet.py

      - name: Apply guarded composition integration
        run: python3 scripts/spore_v033_apply_v2.py

      - name: Apply guarded semantic choreography integration
        run: python3 scripts/spore_v033_apply_semantics.py

      - name: Format focused Spore crates
        run: >-
          cargo fmt
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb

      - name: Verify formatting is stable
        run: >-
          cargo fmt --check
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb

      - name: Check focused Spore crates
        run: >-
          cargo check
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb
          --all-targets

      - name: Clippy focused Spore crates
        run: >-
          cargo clippy
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb
          --all-targets
          -- -D warnings

      - name: Test focused Spore crates
        run: >-
          cargo test
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb

      - name: Remove one-shot machinery
        run: >-
          rm
          scripts/spore_v033_apply_v2.py
          scripts/spore_v033_apply_semantics.py
          .github/workflows/spore-v033-autopatch.yml

      - name: Verify patch cleanliness and scope
        run: |
          git diff --check
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(crates/core/symthaea-boot-ecology/|crates/core/symthaea-boot-state/|crates/domains/symthaea-quicken-fb/|scripts/spore_v033_apply_v2.py$|scripts/spore_v033_apply_semantics.py$|\.github/workflows/spore-v033-autopatch.yml$)' || true)"
          test -z "$unexpected"

      - name: Commit verified integration only if branch has not moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/symthaea-boot-ecology \
                  crates/core/symthaea-boot-state \
                  crates/domains/symthaea-quicken-fb \
                  scripts/spore_v033_apply_v2.py \
                  scripts/spore_v033_apply_semantics.py \
                  .github/workflows/spore-v033-autopatch.yml
          git diff --cached --check
          git commit -m "feat(spore): integrate v0.3.3 composition and choreography"
          git fetch origin spore/visual-composition-v0.3.3-design
          test "$(git rev-parse origin/spore/visual-composition-v0.3.3-design)" = "$GITHUB_SHA"
          git push origin HEAD:spore/visual-composition-v0.3.3-design
