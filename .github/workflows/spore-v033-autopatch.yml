name: Spore v0.3.3 guarded integration

on:
  push:
    branches:
      - spore/visual-composition-v0.3.3-design
    paths:
      - .github/workflows/spore-v033-autopatch.yml

permissions:
  contents: write

jobs:
  integrate:
    name: Apply, format, verify, commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spore/visual-composition-v0.3.3-design
          fetch-depth: 1

      - name: Install pinned Rust 1.96.0
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Require one-shot patch source
        run: test -s scripts/spore_v033_apply.py

      - name: Apply guarded renderer integration
        run: python3 scripts/spore_v033_apply.py

      - name: Format focused Spore crates
        run: >-
          cargo fmt
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb

      - name: Verify formatting is stable
        run: >-
          cargo fmt --check
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb

      - name: Check focused Spore crates
        run: >-
          cargo check
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb
          --all-targets

      - name: Clippy focused Spore crates
        run: >-
          cargo clippy
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb
          --all-targets
          -- -D warnings

      - name: Test focused Spore crates
        run: >-
          cargo test
          -p symthaea-boot-ecology
          -p symthaea-boot-state
          -p symthaea-quicken-fb

      - name: Remove one-shot patch source
        run: rm scripts/spore_v033_apply.py

      - name: Verify patch cleanliness
        run: |
          git diff --check
          test -z "$(git status --porcelain | grep -E '^\?\?' || true)"

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/symthaea-boot-ecology \
                  crates/core/symthaea-boot-state \
                  crates/domains/symthaea-quicken-fb \
                  scripts/spore_v033_apply.py
          git diff --cached --check
          git commit -m "feat(spore): thread v0.3.3 composition budget through renderer"
          git push origin HEAD:spore/visual-composition-v0.3.3-design
