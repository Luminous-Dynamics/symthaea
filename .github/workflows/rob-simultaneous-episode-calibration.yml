name: ROB Simultaneous Episode Calibration

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research/rob-simultaneous-episode-calibration-001/**"
      - ".github/workflows/rob-simultaneous-episode-calibration.yml"
  push:
    branches: ["research/rob-simultaneous-episode-calibration-001"]
    paths:
      - "research/rob-simultaneous-episode-calibration-001/**"
      - ".github/workflows/rob-simultaneous-episode-calibration.yml"

concurrency:
  group: rob-simultaneous-episode-calibration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Deterministic conformal calibration (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/rob-simultaneous-episode-calibration-001/Cargo.toml -- --check
      - name: Test calibration reference
        run: cargo test --locked --manifest-path research/rob-simultaneous-episode-calibration-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/rob-simultaneous-episode-calibration-001/Cargo.toml --all-targets -- -D warnings
