name: Butlin Reusable Run Context Producer Probe

on:
  workflow_call:
    inputs:
      expected_run_id:
        required: true
        type: string
      expected_run_attempt:
        required: true
        type: string
    outputs:
      observed_run_id:
        value: ${{ jobs.produce.outputs.observed_run_id }}
      observed_run_attempt:
        value: ${{ jobs.produce.outputs.observed_run_attempt }}
      observed_workflow_sha:
        value: ${{ jobs.produce.outputs.observed_workflow_sha }}
      observed_workflow_path:
        value: ${{ jobs.produce.outputs.observed_workflow_path }}
      artifact_name:
        value: ${{ jobs.produce.outputs.artifact_name }}

permissions: {}

jobs:
  produce:
    name: Produce and attest exact-run context probe artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      observed_run_id: ${{ steps.observe.outputs.observed_run_id }}
      observed_run_attempt: ${{ steps.observe.outputs.observed_run_attempt }}
      observed_workflow_sha: ${{ steps.observe.outputs.observed_workflow_sha }}
      observed_workflow_path: ${{ steps.observe.outputs.observed_workflow_path }}
      artifact_name: ${{ steps.observe.outputs.artifact_name }}
    steps:
      - name: Observe caller and reusable-workflow identities
        id: observe
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.expected_run_attempt }}
          OBSERVED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          OBSERVED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          OBSERVED_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$OBSERVED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$GITHUB_RUN_ATTEMPT" = "$EXPECTED_RUN_ATTEMPT"
          test "$OBSERVED_WORKFLOW_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$OBSERVED_WORKFLOW_PATH" = ".github/workflows/butlin-reusable-run-context-producer-probe.yml"

          artifact_name="butlin-reusable-run-context-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          out="$RUNNER_TEMP/butlin-reusable-run-context-producer"
          rm -rf "$out"
          mkdir -p "$out"
          /usr/bin/jq -n \
            --arg schema butlin-reusable-run-context-producer-v2 \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_sha "$OBSERVED_WORKFLOW_SHA" \
            --arg workflow_repository "$OBSERVED_WORKFLOW_REPOSITORY" \
            --arg workflow_path "$OBSERVED_WORKFLOW_PATH" \
            '{schema:$schema,run_id:$run_id,run_attempt:$run_attempt,workflow_sha:$workflow_sha,workflow_repository:$workflow_repository,workflow_path:$workflow_path,payload:"fixed-attested-platform-probe-v2"}' \
            > "$out/payload.json"
          test -s "$out/payload.json"

          echo "observed_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "observed_run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "observed_workflow_sha=$OBSERVED_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "observed_workflow_path=$OBSERVED_WORKFLOW_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Attest exact producer probe payload
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/butlin-reusable-run-context-producer/payload.json

      - name: Preserve exact attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$BUNDLE_PATH"
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/butlin-reusable-run-context-producer/attestation.json"

      - name: Upload exact-run attested probe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.observe.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/butlin-reusable-run-context-producer/payload.json
            ${{ runner.temp }}/butlin-reusable-run-context-producer/attestation.json
          if-no-files-found: error
          retention-days: 1
