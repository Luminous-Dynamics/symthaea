name: HAK Collection Completeness

on:
  pull_request:
    branches:
      - architecture/hak-selector-coverage-v1
    paths:
      - 'scripts/hak_collection_completeness.py'
      - 'tests/python/test_hak_collection_completeness.py'
      - 'tests/python/test_hak_collection_completeness_schema.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_COLLECTION_COMPLETENESS_V1.md'
      - 'docs/architecture/hak/collection-completeness-v1.schema.json'
      - 'docs/architecture/hak/plans/hak017-collection-completeness-e5-v1.plan.json'
      - 'docs/architecture/hak/policies/hak017-collection-completeness-binding-policy-v1.json'
      - '.github/workflows/hak-collection-completeness.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collection-completeness:
    name: HAK Collection Completeness
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          echo "HAK-017 exact subject: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HAK-017 test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile HAK-017 tooling
        run: python -m py_compile scripts/hak_collection_completeness.py

      - name: Validate HAK-017 schema syntax
        run: python -m json.tool docs/architecture/hak/collection-completeness-v1.schema.json >/dev/null

      - name: Lint HAK-017 qualification plan
        run: python scripts/hak_evidence_lint.py docs/architecture/hak/plans/hak017-collection-completeness-e5-v1.plan.json

      - name: Lint HAK-017 check-binding policy
        run: |
          python scripts/hak_check_binding_lint.py \
            --plan docs/architecture/hak/plans/hak017-collection-completeness-e5-v1.plan.json \
            --policy docs/architecture/hak/policies/hak017-collection-completeness-binding-policy-v1.json

      - name: Run HAK-017 regressions
        run: |
          python -m pytest -q \
            tests/python/test_hak_collection_completeness.py \
            tests/python/test_hak_collection_completeness_schema.py
