# One-shot qualification composition for capability algorithm provenance.
# Mirrors the separately isolated #1393 compiler fix and reconciles only the
# missing symthaea-continuity lock package. Deletes itself on success.

name: Capability Provenance Compose Once

on:
  push:
    branches:
      - 'ci/capability-algorithm-provenance-exact-head-v1'

permissions:
  contents: write

jobs:
  compose-once:
    name: Compose compiler fix and lockfile once
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/capability-algorithm-provenance-exact-head-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set "$channel"
          test "$(rustc --version | awk '{print $2}')" = "$channel"

      - name: Compose exact prerequisite and reconcile lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          graph='crates/core/symthaea-continuity/src/capability_graph.rs'
          cp Cargo.lock /tmp/Cargo.lock.before

          # Mirror the exact four-line #1393 source correction. Require the old
          # spellings first so this helper cannot silently patch another shape.
          test "$(grep -Fc 'capability {source:?} references undefined capability {missing:?}' "$graph")" -eq 1
          test "$(grep -Fc 'source: CapabilityId,' "$graph")" -eq 1
          test "$(grep -Fc 'source: definition.id(),' "$graph")" -eq 1
          test "$(grep -Fc 'source: target.id(),' "$graph")" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/core/symthaea-continuity/src/capability_graph.rs')
          text = path.read_text()
          replacements = {
              'capability {source:?} references undefined capability {missing:?}':
                  'capability {referencing:?} references undefined capability {missing:?}',
              'source: CapabilityId,': 'referencing: CapabilityId,',
              'source: definition.id(),': 'referencing: definition.id(),',
              'source: target.id(),': 'referencing: target.id(),',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          cargo generate-lockfile

          # Parsed lock theorem: all old package records are preserved exactly
          # and the only new package record is symthaea-continuity.
          python3 - <<'PY'
          import collections, json, tomllib
          from pathlib import Path

          def load(path):
              return tomllib.loads(Path(path).read_text())

          before = load('/tmp/Cargo.lock.before')
          after = load('Cargo.lock')
          if before.get('version') != after.get('version'):
              raise SystemExit('Cargo.lock version changed')

          def bag(doc):
              return collections.Counter(
                  json.dumps(pkg, sort_keys=True, separators=(',', ':'))
                  for pkg in doc.get('package', [])
              )

          old = bag(before)
          new = bag(after)
          removed = old - new
          added = new - old
          if removed:
              raise SystemExit(f'pre-existing lock package records changed/removed: {list(removed.elements())[:3]}')
          added_records = [json.loads(item) for item in added.elements()]
          if len(added_records) != 1 or added_records[0].get('name') != 'symthaea-continuity':
              raise SystemExit(f'expected exactly one added symthaea-continuity package, got {added_records}')
          print('lock reconciliation: exactly one symthaea-continuity package added')
          PY

          cargo check --locked -p symthaea-continuity --all-targets

          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]}"
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.lock|"$graph") ;;
              *) echo "error: qualification composition changed unexpected path: $path" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -eq 2

          git add Cargo.lock "$graph"
          rm .github/workflows/capability-provenance-compose-once.yml
          git add .github/workflows/capability-provenance-compose-once.yml
          git diff --cached --check
          git commit -m "ci(continuity): compose provenance qualification prerequisites"
          git push origin HEAD:ci/capability-algorithm-provenance-exact-head-v1
