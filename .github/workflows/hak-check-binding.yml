name: HAK Precommitted Check Binding

on:
  pull_request:
    branches:
      - architecture/hak-provider-check-evidence-v1
    paths:
      - 'scripts/hak_check_binding_lint.py'
      - 'tests/python/test_hak_check_binding_lint.py'
      - 'tests/python/test_hak_check_binding_schema.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_PRECOMMITTED_CHECK_BINDING_V1.md'
      - 'docs/architecture/hak/check-evidence-binding-policy-v1.schema.json'
      - 'docs/architecture/hak/plans/hak010-precommitted-check-binding-e5-v1.plan.json'
      - 'docs/architecture/hak/policies/hak010-precommitted-check-binding-policy-v1.json'
      - '.github/workflows/hak-check-binding.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-binding:
    name: HAK Precommitted Check Binding
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          echo "HAK-010 exact subject: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile HAK binding tooling
        run: |
          python -m py_compile scripts/hak_evidence_lint.py
          python -m py_compile scripts/hak_interpretation_lint.py
          python -m py_compile scripts/hak_check_evidence_lint.py
          python -m py_compile scripts/hak_check_binding_lint.py

      - name: Validate HAK-010 schema syntax
        run: python -m json.tool docs/architecture/hak/check-evidence-binding-policy-v1.schema.json >/dev/null

      - name: Lint HAK-010 qualification plan
        run: |
          python scripts/hak_evidence_lint.py \
            docs/architecture/hak/plans/hak010-precommitted-check-binding-e5-v1.plan.json

      - name: Lint HAK-010 check-binding policy
        run: |
          python scripts/hak_check_binding_lint.py \
            --plan docs/architecture/hak/plans/hak010-precommitted-check-binding-e5-v1.plan.json \
            --policy docs/architecture/hak/policies/hak010-precommitted-check-binding-policy-v1.json

      - name: Run HAK-010 regressions
        run: |
          python -m pytest -q \
            tests/python/test_hak_check_binding_lint.py \
            tests/python/test_hak_check_binding_schema.py
