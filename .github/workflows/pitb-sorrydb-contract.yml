name: PITB SorryDB Receipt Contract

on:
  pull_request:
    paths:
      - "crates/bridges/symthaea-proof-insights/src/bin/import_sorrydb_snapshot.rs"
      - "crates/bridges/symthaea-proof-insights/src/bin/analyze_sorrydb_branch_ledger.rs"
      - "data/benchmarks/proof-insight-transfer-v0/sorrydb-track/**"
      - "docs/research/pitb-sorrydb-evaluation-2026-10-31.md"
      - ".github/workflows/pitb-sorrydb-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Draft 2020-12 validator
        run: |
          python -m venv "$RUNNER_TEMP/pitb-jsonschema"
          "$RUNNER_TEMP/pitb-jsonschema/bin/pip" install --disable-pip-version-check --no-input "jsonschema[format]==4.26.0"
      - name: Validate receipt schema and fail-closed controls
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-jsonschema/bin/python" - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          root = Path.cwd()
          schema = json.loads((root / "data/benchmarks/proof-insight-transfer-v0/sorrydb-track/run-receipt.schema.json").read_text())
          fixture = json.loads((root / "data/benchmarks/proof-insight-transfer-v0/sorrydb-track/fixtures/run-receipt.synthetic.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(fixture)

          if fixture["evidence_class"] != "synthetic_contract_fixture":
              raise SystemExit("checked-in receipt must remain explicitly synthetic")
          if fixture["run"]["actual"]["attempts"] != 0 or any(row["status"] != "not_attempted" for row in fixture["attempts"]):
              raise SystemExit("synthetic receipt must not contain model outcomes")
          print("PITB_SORRYDB_FIXTURE_SHAPE_PASS: synthetic contract only; no model or Lean outcome")

          def schema_must_reject(label, value):
              try:
                  validator.validate(value)
              except ValidationError:
                  print(f"PITB_SORRYDB_SCHEMA_NEGATIVE_PASS: {label}")
                  return
              raise SystemExit(f"schema accepted invalid receipt: {label}")

          def semantic_errors(value):
              errors = []
              budget = value["run"]["budget"]
              actual = value["run"]["actual"]
              rows = value["attempts"]
              if len(rows) > budget["attempts"]:
                  errors.append("attempt rows exceed the registered attempt budget")
              for field in ("attempts", "tokens", "tool_calls", "wall_time_ms", "cost_microusd"):
                  if actual[field] > budget[field]:
                      errors.append(f"{field} exceeded budget")
              executed = [row for row in rows if row["status"] != "not_attempted"]
              if actual["attempts"] != len(executed):
                  errors.append("actual attempt count does not match attempt rows")
              for field in ("tokens", "tool_calls", "wall_time_ms", "cost_microusd"):
                  if sum(row[field] for row in rows) != actual[field]:
                      errors.append(f"{field} does not equal the per-attempt sum")
              indices = [row["attempt_index"] for row in rows]
              if indices != list(range(1, len(indices) + 1)):
                  errors.append("attempt indices are not contiguous and ordered")
              seeds = [row["seed_sha256"] for row in rows]
              if len(seeds) != len(set(seeds)):
                  errors.append("attempt seed digests are not unique")
              if value["task"]["repository_commit"] != value["environment"]["repository_commit"]:
                  errors.append("task and checkout commit differ")
              if value["task"]["lean_version"] != value["environment"]["lean_version"]:
                  errors.append("task and checkout Lean versions differ")
              for row in rows:
                  if row["status"] == "not_attempted" and any(
                      row[field] != 0
                      for field in ("tokens", "tool_calls", "wall_time_ms", "cost_microusd")
                  ):
                      errors.append("not-attempted row has nonzero resource use")
                  if row["status"] == "verified_success":
                      if row["target_type_sha256_before"] != row["target_type_sha256_after"]:
                          errors.append("verified success changed target type")
                      if row["patch_scope"] != "sorry-token-replacement-only":
                          errors.append("verified success changed code outside target sorry span")
                      if row["proof_contains_sorry_axiom"] or "sorryAx" in row["axiom_names"]:
                          errors.append("verified success contains sorryAx")
                      if row["new_axiom_names"]:
                          errors.append("verified success introduces an unapproved axiom")
              return errors

          bad = copy.deepcopy(fixture)
          bad["task"]["source_path"] = "../outside.lean"
          schema_must_reject("path traversal", bad)

          bad = copy.deepcopy(fixture)
          bad["attempts"][0]["status"] = "verified_success"
          schema_must_reject("success without proof/checker/type/axiom receipts", bad)

          bad = copy.deepcopy(fixture)
          bad["run"]["actual"]["attempts"] = 2
          if not semantic_errors(bad):
              raise SystemExit("budget overrun control was not rejected by semantic audit")
          print("PITB_SORRYDB_SEMANTIC_NEGATIVE_PASS: over-budget attempt count")

          success = copy.deepcopy(fixture)
          success["run"]["actual"].update({"attempts":1,"tokens":100,"tool_calls":1,"wall_time_ms":1000,"cost_microusd":10})
          attempt = success["attempts"][0]
          attempt.update({
              "status":"verified_success",
              "proof_sha256":"a" * 64,
              "source_patch_sha256":"b" * 64,
              "verifier_id":"synthetic-independent-checker",
              "verifier_receipt_sha256":"c" * 64,
              "target_type_sha256_before":"d" * 64,
              "target_type_sha256_after":"e" * 64,
              "patch_scope":"sorry-token-replacement-only",
              "kernel_check_passed":True,
              "proof_contains_sorry_axiom":False,
              "axiom_names":["propext"],
              "new_axiom_names":[],
              "trust_tier":"kernel_only",
              "tokens":100,
              "tool_calls":1,
              "wall_time_ms":1000,
              "cost_microusd":10
          })
          validator.validate(success)
          if not semantic_errors(success):
              raise SystemExit("target-type mismatch control was not rejected by semantic audit")
          print("PITB_SORRYDB_SEMANTIC_NEGATIVE_PASS: target-type digest mismatch")

          success["attempts"][0]["target_type_sha256_after"] = "d" * 64
          if semantic_errors(success):
              raise SystemExit("matched, integrity-complete synthetic success receipt did not pass the semantic audit")
          validator.validate(success)
          print("PITB_SORRYDB_POSITIVE_PASS: synthetic integrity-complete receipt; not an evaluated proof")
          PY


      - name: Validate speculative branch ledger contract
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-jsonschema/bin/python" - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError
          root = Path.cwd()
          schema = json.loads((root / "data/benchmarks/proof-insight-transfer-v0/sorrydb-track/speculative-branch-ledger.schema.json").read_text())
          fixture = json.loads((root / "data/benchmarks/proof-insight-transfer-v0/sorrydb-track/fixtures/speculative-branch-ledger.synthetic.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(fixture)
          if fixture["evidence_class"] != "synthetic_contract_fixture" or fixture["actual"]["branches_started"] != 0:
              raise SystemExit("branch ledger fixture must remain synthetic and not executed")
          if any(branch["status"] != "planned" for branch in fixture["branches"]) or fixture["promotion"]["status"] != "not_attempted":
              raise SystemExit("synthetic branch ledger cannot claim branch execution or promotion")
          def errors(value):
              result = []
              branches = value["branches"]
              ids = [b["branch_id"] for b in branches]
              workspaces = [b["workspace_id"] for b in branches]
              if len(ids) != len(set(ids)):
                  result.append("duplicate branch IDs")
              if len(workspaces) != len(set(workspaces)):
                  result.append("shared mutable workspace")
              by_id = {b["branch_id"]: b for b in branches}
              roots = [b for b in branches if b["parent_branch_id"] is None]
              if len(roots) != 1 or roots[0]["kind"] != "root":
                  result.append("branch graph must have one root")
              for branch in branches:
                  parent_id = branch["parent_branch_id"]
                  if parent_id is not None and (parent_id not in by_id or parent_id == branch["branch_id"]):
                      result.append("orphan or self parent")
                  if branch["base_commit"] != value["task"]["repository_commit"]:
                      result.append("source commit drift")
                  if branch["proof_state_sha256"] != value["task"]["proof_state_sha256"]:
                      result.append("proof-state drift")
                  candidate_sha = branch["candidate_sha256"]
                  if candidate_sha is not None and (
                      branch["status"] != "candidate_available"
                      or branch["result_type"] != "proof_candidate"
                  ):
                      result.append("candidate digest is not bound to an available proof candidate")
                  if branch["status"] == "candidate_available" and not candidate_sha:
                      result.append("available proof candidate is missing its content digest")
              for branch in branches:
                  seen = set()
                  current = branch["branch_id"]
                  while current is not None and current in by_id:
                      if current in seen:
                          result.append("branch cycle")
                          break
                      seen.add(current)
                      current = by_id[current]["parent_branch_id"]

              budget = value["budget"]
              actual = value["actual"]
              if len(branches) > budget["max_branches"]:
                  result.append("branch-count budget exceeded")
              started = sum(branch["status"] != "planned" for branch in branches)
              if actual["branches_started"] != started:
                  result.append("started branch count mismatch")
              if actual["peak_active_branches"] > budget["max_active_branches"]:
                  result.append("active-branch cap exceeded")
              if actual["peak_active_branches"] > actual["branches_started"]:
                  result.append("active branches exceed branches started")
              if actual["peak_lean_queries"] > budget["max_lean_queries"]:
                  result.append("Lean-query cap exceeded")
              if actual["peak_lean_queries"] > 0 and actual["branches_started"] == 0:
                  result.append("Lean queries recorded without a started branch")
              if actual["wall_ms"] > 0 and actual["branches_started"] == 0:
                  result.append("elapsed execution time recorded without a started branch")
              additive_caps = {
                  "tokens": "max_tokens",
                  "model_calls": "max_model_calls",
                  "lean_cpu_ms": "max_lean_cpu_ms",
                  "cost_microusd": "max_cost_microusd"
              }
              for field, cap in additive_caps.items():
                  if actual[field] > budget[cap]:
                      result.append(field + " budget exceeded")
                  if sum(branch["resources"][field] for branch in branches) != actual[field]:
                      result.append(field + " branch totals mismatch")
              branch_wall_work = sum(branch["resources"]["wall_ms"] for branch in branches)
              if branch_wall_work != actual["branch_wall_work_ms"]:
                  result.append("branch wall-work total mismatch")
              if branch_wall_work > budget["max_branch_wall_work_ms"]:
                  result.append("branch wall-work budget exceeded")
              if actual["wall_ms"] > budget["max_wall_ms"]:
                  result.append("elapsed wall-clock budget exceeded")
              promotion = value["promotion"]
              if promotion["status"] == "not_attempted":
                  null_fields = (
                      "branch_id", "candidate_sha256", "source_patch_sha256",
                      "checker_id", "replay_verifier_id", "checker_candidate_sha256",
                      "replay_candidate_sha256", "target_type_before_sha256",
                      "target_type_after_sha256", "patch_scope", "checker_receipt_sha256",
                      "replay_receipt_sha256"
                  )
                  if any(promotion[field] is not None for field in null_fields):
                      result.append("not-attempted promotion contains promotion evidence")
                  if promotion["kernel_check"] != "not_run" or promotion["contains_sorry_ax"] or promotion["new_axiom_names"]:
                      result.append("not-attempted promotion has execution claims")
              if promotion["status"] == "verified_success":
                  candidate_branch = by_id.get(promotion["branch_id"])
                  if candidate_branch is None:
                      result.append("promoted branch missing")
                  else:
                      if candidate_branch["status"] != "candidate_available" or candidate_branch["result_type"] != "proof_candidate":
                          result.append("promoted branch did not return a proof candidate")
                      if candidate_branch["candidate_sha256"] != promotion["candidate_sha256"]:
                          result.append("promotion candidate digest differs from branch artifact")
                  if promotion["candidate_sha256"] != promotion["checker_candidate_sha256"]:
                      result.append("checker did not attest the promoted candidate bytes")
                  if promotion["candidate_sha256"] != promotion["replay_candidate_sha256"]:
                      result.append("independent replay did not check the promoted candidate bytes")
                  if promotion["target_type_before_sha256"] != value["task"]["target_type_sha256"]:
                      result.append("promotion target type differs from source task")
                  if promotion["target_type_before_sha256"] != promotion["target_type_after_sha256"]:
                      result.append("promoted theorem type changed")
                  if promotion["patch_scope"] != "sorry-span-only":
                      result.append("promotion escaped sorry span")
                  if promotion["kernel_check"] != "passed" or promotion["contains_sorry_ax"]:
                      result.append("promotion kernel/sorryAx gate failed")
                  if promotion["new_axiom_names"]:
                      result.append("promotion introduced unapproved axioms")
                  if not promotion["checker_receipt_sha256"] or not promotion["replay_receipt_sha256"]:
                      result.append("promotion missing independent evidence")
                  if not promotion["checker_id"] or not promotion["replay_verifier_id"] or promotion["checker_id"] == promotion["replay_verifier_id"]:
                      result.append("checker and replay identities are not independent")
              return result
          if errors(fixture): raise SystemExit("synthetic branch fixture semantic failure: "+repr(errors(fixture)))
          print("PITB_SPECULATIVE_BRANCH_FIXTURE_PASS: private planned workspaces; no execution or promotion")
          def must_reject(label, value):
              try: validator.validate(value)
              except ValidationError: print("PITB_SPECULATIVE_BRANCH_SCHEMA_NEGATIVE_PASS: "+label); return
              if errors(value): print("PITB_SPECULATIVE_BRANCH_SEMANTIC_NEGATIVE_PASS: "+label); return
              raise SystemExit("branch ledger accepted invalid case: "+label)
          bad=copy.deepcopy(fixture); bad["branches"][1]["workspace_id"]=bad["branches"][0]["workspace_id"]; must_reject("shared workspace",bad)
          bad=copy.deepcopy(fixture); bad["branches"][1]["parent_branch_id"]="missing"; must_reject("orphan parent",bad)
          bad=copy.deepcopy(fixture); bad["branches"][1]["proof_state_sha256"]="f"*64; must_reject("proof-state drift",bad)
          bad=copy.deepcopy(fixture); bad["branches"][1]["parent_branch_id"]="delegated-1"; must_reject("branch cycle",bad)
          bad=copy.deepcopy(fixture); bad["actual"]["peak_active_branches"]=3
          if not errors(bad): raise SystemExit("active-branch cap negative control did not fail")
          print("PITB_SPECULATIVE_BRANCH_NEGATIVE_CONTROLS_PASS: workspace, DAG, state, and concurrency")

          # A real promotion-shaped synthetic ledger is used only to qualify the
          # identity joins. It is never written as a measured run.
          success = copy.deepcopy(fixture)
          root, child = success["branches"]
          root["status"] = "partial_result"
          root["result_type"] = "retrieval_route"
          root["resources"].update({"tokens":40,"model_calls":1,"lean_cpu_ms":20,"wall_ms":100,"cost_microusd":10})
          child["status"] = "candidate_available"
          child["result_type"] = "proof_candidate"
          child["candidate_sha256"] = "a" * 64
          child["resources"].update({"tokens":60,"model_calls":1,"lean_cpu_ms":30,"wall_ms":80,"cost_microusd":20})
          success["actual"].update({
              "branches_started":2,"peak_active_branches":2,"peak_lean_queries":1,
              "tokens":100,"model_calls":2,"lean_cpu_ms":50,
              "wall_ms":120,"branch_wall_work_ms":180,"cost_microusd":30
          })
          success["promotion"].update({
              "status":"verified_success","branch_id":"delegated-1",
              "candidate_sha256":"a"*64,"source_patch_sha256":"b"*64,
              "checker_id":"lean-kernel-checker","replay_verifier_id":"independent-clean-replay",
              "checker_candidate_sha256":"a"*64,"replay_candidate_sha256":"a"*64,
              "target_type_before_sha256":success["task"]["target_type_sha256"],
              "target_type_after_sha256":success["task"]["target_type_sha256"],
              "patch_scope":"sorry-span-only",
              "checker_receipt_sha256":"c"*64,"replay_receipt_sha256":"d"*64,
              "kernel_check":"passed","contains_sorry_ax":False,"new_axiom_names":[]
          })
          validator.validate(success)
          if errors(success):
              raise SystemExit("candidate-bound synthetic promotion rejected: "+repr(errors(success)))
          print("PITB_SPECULATIVE_BRANCH_PROMOTION_JOIN_PASS: candidate hash, patch, target and independent verifier identities agree")

          bad=copy.deepcopy(success); bad["promotion"]["candidate_sha256"]="e"*64
          must_reject("promoted candidate differs from branch artifact",bad)
          bad=copy.deepcopy(success); bad["promotion"]["replay_candidate_sha256"]="e"*64
          must_reject("replay checked different candidate bytes",bad)
          bad=copy.deepcopy(success); bad["promotion"]["checker_id"]=bad["promotion"]["replay_verifier_id"]
          must_reject("same verifier identity for check and replay",bad)
          bad=copy.deepcopy(success); bad["promotion"]["target_type_after_sha256"]="e"*64
          must_reject("promoted theorem statement changed",bad)
          bad=copy.deepcopy(success); bad["promotion"]["patch_scope"]="outside-target-span"
          must_reject("promotion edited outside sorry span",bad)
          bad=copy.deepcopy(success); bad["promotion"]["new_axiom_names"]=["Unsafe.assumption"]
          must_reject("unapproved axiom in promoted proof",bad)
          bad=copy.deepcopy(success); bad["actual"]["wall_ms"]=240001
          if not errors(bad): raise SystemExit("elapsed wall-time cap negative control did not fail")
          bad=copy.deepcopy(success); bad["actual"]["branch_wall_work_ms"]=179
          if not errors(bad): raise SystemExit("branch wall-work accounting control did not fail")
          print("PITB_SPECULATIVE_BRANCH_PROMOTION_NEGATIVES_PASS: candidate substitution, replay identity, independence, theorem integrity, patch scope, axioms and wall budgets")

          # Parallel workers can accumulate more branch wall-work than elapsed
          # wall time. This is expected, not a resource-accounting mismatch.
          if success["actual"]["branch_wall_work_ms"] <= success["actual"]["wall_ms"]:
              raise SystemExit("parallel wall-work fixture failed to demonstrate overlapping branch execution")
          print("PITB_SPECULATIVE_BRANCH_PARALLEL_WALL_ACCOUNTING_PASS: 180 branch-ms work / 120 elapsed-ms")
          PY

  sorrydb-snapshot-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout exact SorryDB source snapshot
        uses: actions/checkout@v4
        with:
          repository: SorryDB/SorryDB
          ref: 74b3b63f8ba890d675f362924b21ac55db410383
          path: _pitb-sorrydb
          persist-credentials: false
      - name: Checkout LeanCourse25 smoke project
        uses: actions/checkout@v4
        with:
          repository: fpvandoorn/LeanCourse25
          ref: cd0f32f5b07311e08a9e89733a1375f54eb790c0
          path: _pitb-smoke/lean-course25
          persist-credentials: false
      - name: Checkout PrimeNumberTheoremAnd smoke project
        uses: actions/checkout@v4
        with:
          repository: AlexKontorovich/PrimeNumberTheoremAnd
          ref: ddcb6542f2b62883c8642d3db4ecc115afcce33e
          path: _pitb-smoke/prime-number-theorem
          persist-credentials: false
      - name: Checkout clap-lean smoke project
        uses: actions/checkout@v4
        with:
          repository: Clap-lang/clap-lean
          ref: 326f55435f91295d95a6166b060cace7ef92e6e4
          path: _pitb-smoke/clap-lean
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned schema validator for smoke manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pitb-sorrydb-jsonschema"
          "$RUNNER_TEMP/pitb-sorrydb-jsonschema/bin/pip" install --disable-pip-version-check --no-input "jsonschema[format]==4.26.0"
      - name: Stage PITB research crate as an isolated Cargo package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          crate_dir = root / "crates/bridges/symthaea-proof-insights"
          crate_text = (crate_dir / "Cargo.toml").read_text()
          crate = tomllib.loads(crate_text)
          workspace = tomllib.loads((root / "Cargo.toml").read_text())
          workspace_deps = workspace["workspace"]["dependencies"]
          package_text = crate_text.split("[dependencies]", 1)[0].rstrip() + "\n\n[dependencies]\n"

          def toml_value(value):
              if isinstance(value, str):
                  return json.dumps(value)
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, list):
                  return "[" + ", ".join(toml_value(item) for item in value) + "]"
              if isinstance(value, dict):
                  return "{ " + ", ".join(f"{key} = {toml_value(item)}" for key, item in value.items()) + " }"
              raise TypeError(f"unsupported TOML value: {type(value)!r}")

          dependency_lines = []
          for name, spec in crate.get("dependencies", {}).items():
              if isinstance(spec, dict) and spec.get("workspace") is True:
                  spec = workspace_deps[name]
              dependency_lines.append(f"{name} = {toml_value(spec)}")

          staged = Path(os.environ["RUNNER_TEMP"]) / "pitb-sorrydb-isolated"
          if staged.exists():
              shutil.rmtree(staged)
          (staged / "src").mkdir(parents=True)
          (staged / "Cargo.toml").write_text(package_text + "\n".join(dependency_lines) + "\n")
          shutil.copy2(crate_dir / "src/main.rs", staged / "src/main.rs")
          for support_source in (crate_dir / "src").glob("*.rs"):
              if support_source.name != "main.rs":
                  shutil.copy2(support_source, staged / "src" / support_source.name)
          if (crate_dir / "src/bin").is_dir():
              shutil.copytree(crate_dir / "src/bin", staged / "src/bin")
          shutil.copy2(root / "Cargo.lock", staged / "Cargo.lock")
          print(f"Staged PITB package at {staged}")
          PY
          echo "PITB_MANIFEST=$RUNNER_TEMP/pitb-sorrydb-isolated/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format, compile, test and lint isolated PITB package
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cargo fmt -- --check
          cargo test
          cargo clippy --all-targets -- -D warnings
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          staged = tomllib.loads(Path("Cargo.lock").read_text())
          workspace = tomllib.loads((Path(os.environ["GITHUB_WORKSPACE"]) / "Cargo.lock").read_text())
          def registry_packages(lock):
              return {
                  (entry["name"], entry["version"], entry.get("source"))
                  for entry in lock["package"]
                  if entry.get("source", "").startswith("registry+")
              }
          unexpected = sorted(registry_packages(staged) - registry_packages(workspace))
          if unexpected:
              raise SystemExit("isolated PITB package resolved packages absent from reviewed workspace lock: " + repr(unexpected))
          print("PITB_SORRYDB_LOCK_PASS: all isolated registry package versions exist in the reviewed workspace lock")
          PY
      - name: Run importer self-tests and hash the exact snapshot twice
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cargo run --locked --bin import_sorrydb_snapshot -- --self-test
          cargo run --locked --bin analyze_sorrydb_branch_ledger -- --self-test \
