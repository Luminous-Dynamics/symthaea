          assert all(row["source_inspected"] for row in tasks)
          assert all(row["location"]["verified_source_slice"] == "sorry" for row in tasks)
          assert all(row["environment_reconstructed"] is False for row in tasks)
          assert all(row["project_build_status"] == "not_run" for row in tasks)
          assert all(row["lean_evidence_status"] == "not_run" for row in tasks)
          assert all(row["proof_attempt_status"] == "not_run" for row in tasks)
          instance = next(row for row in tasks if row["selection_role"] == "explicit_local_instance_registry_challenge")
          assert instance["repository"]["remote"] == "https://github.com/Clap-lang/clap-lean"
          assert instance["repository"]["lean_version"] == "v4.26.0-rc2"
          assert "Fact (Nat.Prime p)" in instance["debug_context_signal"]
