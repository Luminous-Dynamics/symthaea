      - name: Verify materialized smoke-project source pins and sorry spans
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cargo run --locked --bin verify_sorrydb_smoke_cohort -- --self-test
          cargo run --locked --bin verify_sorrydb_smoke_cohort -- \
            --manifest "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/sorrydb-track/smoke-cohort-candidates.v0.json" \
            --checkouts-root "$GITHUB_WORKSPACE/_pitb-smoke"
      - name: Build LeanCourse25 at pinned Lean 4.24.0
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: _pitb-smoke/lean-course25
          build: "true"
