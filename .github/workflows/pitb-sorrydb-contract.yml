          assert manifest["dataset"]["source_git_blob_sha1"] == "af3b663429dc4689ee728d2fb5c7d8d5034476f7"
          assert manifest["dataset"]["source_sha256"] == "26bfd11099f6b8db7f80d49bdea5d9f8ea0d23ba65d44d93f67ed42ba1530062"
