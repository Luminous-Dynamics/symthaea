name: Source-derived Drift Manifest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/source-derived-drift-manifest/**"
      - ".github/workflows/source-derived-drift-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Source-derived manifest qualification
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --manifest-path tools/source-derived-drift-manifest/Cargo.toml -- --check

      - name: Locked tests
        run: cargo test --locked --manifest-path tools/source-derived-drift-manifest/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/source-derived-drift-manifest/Cargo.toml --all-targets -- -D warnings

      - name: Validate canonical fixture and receipt hashes
        shell: bash
        run: |
          set -euo pipefail
          manifest="tools/source-derived-drift-manifest/fixtures/example.manifest"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          cargo run --locked --quiet --manifest-path tools/source-derived-drift-manifest/Cargo.toml -- validate "$manifest"
          cargo run --locked --quiet --manifest-path tools/source-derived-drift-manifest/Cargo.toml -- canonicalize "$manifest" "$temp_dir/canonical.manifest"
          cmp "$manifest" "$temp_dir/canonical.manifest"

          mkdir -p "$temp_dir/artifacts/example_run"
          output="$temp_dir/artifacts/example_run/results.csv"
          printf 'scenario,value\nzero_shift,0\n' > "$output"
          manifest_sha256="$(sha256sum -- "$manifest" | cut -d' ' -f1)"
          output_sha256="$(sha256sum -- "$output" | cut -d' ' -f1)"
          source_sha256="$(sed -n 's/^source_sha256=//p' "$manifest")"
          run_id="$(sed -n 's/^run_id=//p' "$manifest")"
          receipt="$temp_dir/result.receipt"
          cat > "$receipt" <<EOF
          schema_version=1
          run_id=$run_id
          manifest_sha256=$manifest_sha256
          source_sha256=$source_sha256
          output_sha256=$output_sha256
          artifact_path=artifacts/example_run/results.csv
          EOF
          cargo run --locked --quiet --manifest-path tools/source-derived-drift-manifest/Cargo.toml -- validate-receipt "$manifest" "$receipt" "$output"

          bad_manifest="$temp_dir/leaked.manifest"
          sed 's/^calibration_sources=.*/calibration_sources=dataset_a_v1,example_stream_v1/' "$manifest" > "$bad_manifest"
          if cargo run --locked --quiet --manifest-path tools/source-derived-drift-manifest/Cargo.toml -- validate "$bad_manifest"; then
            echo "validator accepted held-out source leakage" >&2
            exit 1
          fi

          bad_receipt="$temp_dir/bad.receipt"
          sed 's/^output_sha256=.*/output_sha256=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/' "$receipt" > "$bad_receipt"
          if cargo run --locked --quiet --manifest-path tools/source-derived-drift-manifest/Cargo.toml -- validate-receipt "$manifest" "$bad_receipt" "$output"; then
            echo "validator accepted a mismatched output digest" >&2
            exit 1
          fi
