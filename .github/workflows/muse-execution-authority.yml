name: Muse Execution Authority

on:
  push:
    branches:
      - "research/muse-runtime-001-*"
    paths:
      - "tools/muse-execution-authority/**"
      - ".github/workflows/muse-execution-authority.yml"
  pull_request:
    paths:
      - "tools/muse-execution-authority/**"
      - ".github/workflows/muse-execution-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-execution-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: exact-head-transition-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'exact_head=%s\\n' "$actual"

      - name: Format source for bootstrap review
        run: cargo fmt --manifest-path tools/muse-execution-authority/Cargo.toml

      - name: Preserve formatted source for review
        uses: actions/upload-artifact@v4
        with:
          name: muse-runtime-rustfmt-bootstrap
          path: tools/muse-execution-authority/src/lib.rs
          if-no-files-found: error
          retention-days: 7

      - name: Run state-transition tests
        run: cargo test --locked --manifest-path tools/muse-execution-authority/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/muse-execution-authority/Cargo.toml --all-targets -- -D warnings

      - name: Require formatting diff to be committed before qualification
        run: git diff --exit-code -- tools/muse-execution-authority/src/lib.rs
