name: Symmetry benchmark exact oracle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "research/symmetry-discovery-benchmark-001/**"
      - "research/symmetry-benchmark-exact-oracle-001/**"
      - ".github/workflows/symmetry-benchmark-exact-oracle.yml"
  push:
    branches: [main]
    paths:
      - "research/symmetry-discovery-benchmark-001/**"
      - "research/symmetry-benchmark-exact-oracle-001/**"
      - ".github/workflows/symmetry-benchmark-exact-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symmetry-benchmark-exact-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-oracle:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/symmetry-benchmark-exact-oracle-001/Cargo.toml --all -- --check
      - name: Generate deterministic dependency lock
        run: cargo generate-lockfile --manifest-path research/symmetry-benchmark-exact-oracle-001/Cargo.toml
      - name: Run exact fixture oracle tests
        run: cargo test --locked --manifest-path research/symmetry-benchmark-exact-oracle-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/symmetry-benchmark-exact-oracle-001/Cargo.toml --all-targets -- -D warnings
      - name: Emit exact fixture oracle report
        run: cargo run --locked --manifest-path research/symmetry-benchmark-exact-oracle-001/Cargo.toml --example verify_fixtures
