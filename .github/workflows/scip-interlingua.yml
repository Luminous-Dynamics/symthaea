name: SCIP Interlingua

on:
  push:
    branches: [main]
    paths:
      - 'crates/bridges/symthaea-interlingua/**'
      - '.github/workflows/scip-interlingua.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/bridges/symthaea-interlingua/**'
      - '.github/workflows/scip-interlingua.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test and lint SCIP bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scip-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-scip-

      - name: Test SCIP bridge
        run: cargo test -p symthaea-interlingua --all-targets

      - name: Clippy SCIP bridge
        run: cargo clippy -p symthaea-interlingua --all-targets --no-deps -- -D warnings
