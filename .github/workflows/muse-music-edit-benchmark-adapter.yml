name: Muse Music Edit Benchmark Adapter

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "benchmarks/mel/schemas/music-edit-*.schema.json"
      - "benchmarks/mel/registry/synthetic-music-edit-*.json"
      - "tools/mel-music-edit-adapter-harness/**"
      - ".github/workflows/muse-music-edit-benchmark-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-music-edit-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: exact-head-music-edit-adapter-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MUSE_MUSIC_EDIT_ADAPTER_REVISION=$actual" >> "$GITHUB_ENV"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Stage isolated harness with exact production source
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-music-edit-adapter-harness"
          mkdir -p "$staged/src" "$staged/examples" "$staged/fixtures"
          cp tools/mel-music-edit-adapter-harness/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-music-edit-adapter-harness/src/lib.rs "$staged/src/lib.rs"
          cp crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs "$staged/src/music_edit_benchmark_adapter.rs"
          cp tools/mel-music-edit-adapter-harness/examples/validate_fixtures.rs "$staged/examples/validate_fixtures.rs"
          cp benchmarks/mel/registry/synthetic-music-edit-dataset-manifest-v1.json "$staged/fixtures/"
          cp benchmarks/mel/registry/synthetic-music-edit-capability-matrix-v1.json "$staged/fixtures/"
          echo "MUSE_MUSIC_EDIT_ADAPTER_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
          echo "MUSE_MUSIC_EDIT_ADAPTER_DIR=$staged" >> "$GITHUB_ENV"

      - name: Check isolated harness formatting
        run: cargo +1.96.0 fmt --check --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST"

      - name: Resolve standalone dependency lock
        run: cargo +1.96.0 generate-lockfile --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST"

      - name: Run adapter contract tests
        run: cargo +1.96.0 test --locked --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST"

      - name: Validate committed synthetic manifests
        run: cargo +1.96.0 run --locked --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST" --example validate_fixtures

      - name: Run Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST" --all-targets -- -D warnings

      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mel-music-edit-adapter-evidence"
          mkdir -p "$evidence"
          cp "$MUSE_MUSIC_EDIT_ADAPTER_DIR/Cargo.lock" "$evidence/Cargo.lock"
          sha256sum "$evidence/Cargo.lock" > "$evidence/Cargo.lock.sha256"
          sha256sum crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs > "$evidence/adapter-source.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-dataset-manifest-v1.schema.json > "$evidence/dataset-schema.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-capability-matrix-v1.schema.json > "$evidence/capability-schema.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-dataset-manifest-v1.json > "$evidence/dataset-fixture.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-capability-matrix-v1.json > "$evidence/capability-fixture.sha256"

      - name: Upload adapter evidence
        uses: actions/upload-artifact@v4
        with:
          name: muse-music-edit-adapter-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-music-edit-adapter-evidence/
          if-no-files-found: error
          retention-days: 90
