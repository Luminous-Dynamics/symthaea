name: Epidemiology Surveillance Screen

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-epidemiology/**"
      - "crates/domains/symthaea-statistics/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/epidemiology-surveillance.yml"
  push:
    branches: [main]
    paths:
      - "crates/domains/symthaea-epidemiology/**"
      - "crates/domains/symthaea-statistics/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/epidemiology-surveillance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surveillance-screen:
    name: Conservative aggregate surveillance screening
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pin action source revisions so qualification does not depend on moving
      # marketplace tags. This rust-toolchain revision itself selects Rust 1.96.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Record qualification environment
        shell: bash
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          rustc -vV
          cargo -Vv
          sha256sum Cargo.toml Cargo.lock rust-toolchain.toml \
            crates/domains/symthaea-epidemiology/Cargo.toml \
            crates/domains/symthaea-statistics/Cargo.toml

      - name: Verify committed lock graph
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Check formatting
        run: cargo fmt -p symthaea-epidemiology -- --check

      - name: Run epidemiology tests
        run: cargo test --locked -p symthaea-epidemiology

      - name: Run documentation tests
        run: cargo test --locked -p symthaea-epidemiology --doc

      - name: Run Clippy
        run: cargo clippy --locked -p symthaea-epidemiology --all-targets -- -D warnings

      - name: Check pure-domain WASM portability
        run: cargo check --locked -p symthaea-epidemiology --target wasm32-unknown-unknown
