# Mycelix Contracts - Smart Contract CI/CD
# Foundry-based pipeline for Solidity development

name: Contracts

on:
  push:
    branches: [main]
    paths:
      - 'mycelix-core/contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-core/contracts/**'
      - '.github/workflows/contracts.yml'

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ============================================================================
  # Build & Test
  # ============================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-core/contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            mycelix-core/contracts/cache
            mycelix-core/contracts/out
          key: ${{ runner.os }}-foundry-${{ hashFiles('mycelix-core/contracts/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Install dependencies
        run: forge install

      - name: Check formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

      - name: Run tests with coverage
        run: forge coverage --report lcov

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: mycelix-core/contracts/lcov.info
          flags: solidity
          fail_ci_if_error: false

  # ============================================================================
  # Gas Reports
  # ============================================================================
  gas-report:
    name: Gas Report
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: mycelix-core/contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Generate gas report
        run: forge test --gas-report > gas-report.txt

      - name: Upload gas report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: mycelix-core/contracts/gas-report.txt

      - name: Post gas report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const gasReport = fs.readFileSync('mycelix-core/contracts/gas-report.txt', 'utf8');

            // Truncate if too long
            const maxLength = 60000;
            const truncatedReport = gasReport.length > maxLength
              ? gasReport.substring(0, maxLength) + '\n... (truncated)'
              : gasReport;

            const body = `## Gas Report

            <details>
            <summary>Click to expand</summary>

            \`\`\`
            ${truncatedReport}
            \`\`\`

            </details>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Gas Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # ============================================================================
  # Fuzz Testing (Extended)
  # ============================================================================
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mycelix-core/contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Run extended fuzz tests
        run: |
          FOUNDRY_PROFILE=ci forge test --match-test "testFuzz" -vvv
        env:
          FOUNDRY_FUZZ_RUNS: 10000

  # ============================================================================
  # Invariant Testing
  # ============================================================================
  invariant:
    name: Invariant Testing
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mycelix-core/contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Run invariant tests
        run: forge test --match-test "invariant" -vvv
        continue-on-error: true

  # ============================================================================
  # Static Analysis (Slither)
  # ============================================================================
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: mycelix-core/contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Build with standard output
        run: forge build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: |
          # Slither exits non-zero for any findings, including informational
          # Capture results in SARIF for GitHub security tab
          slither . \
            --filter-paths "lib|test|script" \
            --exclude-dependencies \
            --sarif slither-results.sarif; SLITHER_EXIT=$?
          if [ $SLITHER_EXIT -ne 0 ]; then
            echo "::warning::Slither found issues - see Security tab for details"
          fi

      - name: Upload Slither SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: mycelix-core/contracts/slither-results.sarif
        continue-on-error: true

      - name: Run Slither (text report)
        run: |
          # Generate human-readable report regardless of findings
          slither . \
            --filter-paths "lib|test|script" \
            --exclude-dependencies \
            --print human-summary \
            > slither-report.txt 2>&1; true

      - name: Upload Slither report
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: mycelix-core/contracts/slither-report.txt

  # ============================================================================
  # Contract Size Check
  # ============================================================================
  size-check:
    name: Contract Size Check
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: mycelix-core/contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Check contract sizes
        run: |
          echo "## Contract Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          forge build --sizes >> $GITHUB_STEP_SUMMARY 2>&1
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Verify size limits
        run: |
          # Extract sizes and check against 24KB limit
          forge build --sizes 2>&1 | grep -E "^\| .* \|.*\|.*\|" | while read line; do
            size=$(echo "$line" | awk -F'|' '{print $4}' | tr -d ' ' | sed 's/,//g')
            if [[ "$size" =~ ^[0-9]+$ ]] && [ "$size" -gt 24576 ]; then
              contract=$(echo "$line" | awk -F'|' '{print $2}' | tr -d ' ')
              echo "::warning::Contract $contract exceeds 24KB limit: $size bytes"
            fi
          done

  # ============================================================================
  # Snapshot Testing
  # ============================================================================
  snapshot:
    name: Snapshot Tests
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: mycelix-core/contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Run snapshot
        run: forge snapshot

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot
          path: mycelix-core/contracts/.gas-snapshot

      - name: Compare snapshots (on PR)
        if: github.event_name == 'pull_request'
        run: |
          # Gas changes are informational, not blocking
          if ! forge snapshot --diff .gas-snapshot; then
            echo "::warning::Gas costs have changed - review the diff above"
          fi
