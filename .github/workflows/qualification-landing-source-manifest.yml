name: Qualification Landing Source Manifest

on:
  pull_request:
    branches:
      - main
      - qual-001a-convergence-map
    paths:
      - '.github/workflows/qualification-landing-source-manifest.yml'
      - 'docs/operations/qualification-landing-source-manifest-v1.json'
      - 'scripts/qualification_landing_manifest_v1.py'
      - 'tests/python/test_qualification_landing_manifest_v1.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate-conformance:
    name: Exact-subject candidate conformance
    runs-on: ubuntu-slim
    timeout-minutes: 10

    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact subject with full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0

      - name: Verify exact head, parent and owned scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$BASE_SHA"
            test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          git diff --check "$BASE_SHA" HEAD

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD)
          test "${#changed[@]}" -eq 4

          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/qualification-landing-source-manifest.yml|docs/operations/qualification-landing-source-manifest-v1.json|scripts/qualification_landing_manifest_v1.py|tests/python/test_qualification_landing_manifest_v1.py)
                ;;
              *)
                echo "out-of-scope path: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'

      - name: Record Python identity
        run: |
          python --version
          python -VV

      - name: Parse validator and tests without repository writes
        run: |
          python - <<'PY'
          from pathlib import Path

          for raw in (
              "scripts/qualification_landing_manifest_v1.py",
              "tests/python/test_qualification_landing_manifest_v1.py",
          ):
              path = Path(raw)
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
              print(f"parsed: {path}")
          PY

      - name: Validate exact historical source graph
        run: |
          python scripts/qualification_landing_manifest_v1.py \
            docs/operations/qualification-landing-source-manifest-v1.json \
            --repo .

      - name: Run focused regression suite
        run: |
          python tests/python/test_qualification_landing_manifest_v1.py -v

      - name: Postflight exact-subject immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git status --porcelain)"

      - name: Emit candidate conformance receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/qual-001a1-receipt"
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.run(
                  ["git", *args],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              ).stdout.strip()

          subject_sha = os.environ["SUBJECT_SHA"]
          base_sha = os.environ.get("BASE_SHA") or git("rev-parse", "HEAD^")
          paths = {
              "workflow_blob": ".github/workflows/qualification-landing-source-manifest.yml",
              "manifest_blob": "docs/operations/qualification-landing-source-manifest-v1.json",
              "validator_blob": "scripts/qualification_landing_manifest_v1.py",
              "test_blob": "tests/python/test_qualification_landing_manifest_v1.py",
          }

          receipt = {
              "schema": "symthaea.qualification-candidate-conformance-receipt.v1",
              "qualification_era": "QERA-001",
              "candidate_disposition": "CandidateConformancePass",
              "repository": os.environ["REPOSITORY"],
              "repository_id": os.environ["REPOSITORY_ID"],
              "event_name": os.environ["EVENT_NAME"],
              "subject_sha": subject_sha,
              "subject_tree": git("rev-parse", f"{subject_sha}^{{tree}}"),
              "base_sha": base_sha,
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "python_version": platform.python_version(),
              "runner_os": os.environ.get("RUNNER_OS", ""),
              "runner_arch": os.environ.get("RUNNER_ARCH", ""),
              "claim_ceiling": [
                  "candidate self-conformance only",
                  "no independent recipe admission",
                  "no historical PASS transfer",
                  "no provider authenticity",
                  "no scientific claim support",
                  "no merge deployment or execution authority",
              ],
          }
          for key, path in paths.items():
              receipt[key] = git("rev-parse", f"{subject_sha}:{path}")

          manifest = Path(paths["manifest_blob"]).read_bytes()
          receipt["manifest_file_sha256"] = hashlib.sha256(manifest).hexdigest()

          out = Path(os.environ["RUNNER_TEMP"]) / "qual-001a1-receipt" / "receipt.json"
          encoded = json.dumps(
              receipt,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8") + b"\n"
          out.write_bytes(encoded)
          digest = hashlib.sha256(encoded).hexdigest()
          (out.parent / "receipt.sha256").write_text(
              f"{digest}  receipt.json\n",
              encoding="utf-8",
          )
          print(f"candidate_receipt_sha256={digest}")
          PY

      - name: Upload candidate conformance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qual-001a1-candidate-${{ env.SUBJECT_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qual-001a1-receipt/
          if-no-files-found: error
          retention-days: 90

      - name: Record claim boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## QUAL-001A1 candidate conformance'
            echo
            echo "- exact subject: `$SUBJECT_SHA`"
            echo '- this workflow is PR-head/self-conformance evidence only'
            echo '- a successful receipt is a candidate receipt, not an independent witness'
            echo '- it does not independently authorize its own workflow or validator'
            echo '- it does not transfer historical qualification PASS'
            echo '- it establishes no provider authenticity, scientific claim support, merge, deployment, or execution authority'
          } >> "$GITHUB_STEP_SUMMARY"
