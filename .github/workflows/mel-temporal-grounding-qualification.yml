name: MEL temporal-grounding count-gated qualification

on:
  push:
    branches:
      - research/mel-temporal-grounding-count-gated-f1-v1-20261124
      - research/mel-temporal-revision-audit-v1-20261124
      - research/mel-audio-evidence-window-v1-20261126
    paths:
      - "crates/domains/symthaea-muse/src/temporal_grounding.rs"
      - "crates/domains/symthaea-muse/src/evidence_digest.rs"
      - "tools/mel-temporal-grounding-qualifier/**"
      - "docs/research/MEL-GROUND-001-TEMPORAL-GROUNDING-SCORER-V1.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mel-temporal-grounding-qualification.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - research/mel-ground-temporal-evaluator-v1-20261103
      - research/mel-temporal-grounding-count-gated-f1-v1-20261124
    paths:
      - "crates/domains/symthaea-muse/src/temporal_grounding.rs"
      - "crates/domains/symthaea-muse/src/evidence_digest.rs"
      - "tools/mel-temporal-grounding-qualifier/**"
      - "docs/research/MEL-GROUND-001-TEMPORAL-GROUNDING-SCORER-V1.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mel-temporal-grounding-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: Exact-head count-gated temporal grounding
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested source revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'tested_head=%s\n' "$actual"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check committed Rust 1.96 formatting
        run: cargo +1.96.0 fmt --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --check

      - name: Verify committed lock and workspace resolution
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 metadata --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"

      - name: Run locked exact-source temporal-grounding and revision tests
        run: cargo +1.96.0 test --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml

      - name: Warnings-denied Clippy on exact production source
        run: cargo +1.96.0 clippy --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --all-targets -- -D warnings

      - name: Replay synthetic matched evidence-ablation triplet
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-temporal-revision-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-temporal-revision-triplet.synthetic.json > "$RUNNER_TEMP/revision-triplet-report.json"
          jq -e '
            .cases == 6
            and (.matched_evidence_contrasts | length) == 2
            and .matched_evidence_contrasts[0].local_minus_no_evidence_f1 == 0.5
            and .matched_evidence_contrasts[0].local_minus_yoked_f1 == 0.5
            and .matched_evidence_contrasts[0].local_minus_no_evidence_count_gated_f1 == 0.5
            and .matched_evidence_contrasts[0].local_minus_yoked_count_gated_f1 == 0.5
            and .matched_evidence_contrasts[0].local_beats_yoked == true
            and .matched_evidence_contrasts[0].local_output_tokens == 128
            and .source_work_bootstrap.source_work_clusters == 2
            and .source_work_bootstrap.one_to_many_source_work_clusters == 2
            and .source_work_bootstrap.confirmatory_source_cluster_floor_met == false
            and .source_work_bootstrap.local_minus_no_evidence_count_gated_f1.estimate == 0.5
          ' "$RUNNER_TEMP/revision-triplet-report.json" > /dev/null

      - name: Replay exact audio evidence-window verification when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/audio_evidence_window.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-audio-evidence-window-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-window.synthetic.json tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-source.synthetic.bin tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-pcm.synthetic.hex tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-request.synthetic.json > "$RUNNER_TEMP/audio-evidence-window-report.json"
          jq -e '
            .schema == "mel-audio-evidence-verification-report-v1"
            and .verified_window_count == 2
            and .target_source_lineage_id == "synthetic-source-lineage-001"
            and .source_lineage_id == "synthetic-source-lineage-001"
            and .source_audio_bytes_recomputed == true
            and .decoded_pcm_bytes_recomputed == true
            and .window_payloads_recomputed == true
            and .context_manifest_recomputed == true
            and .verified_windows[0].position == 0
            and .verified_windows[0].byte_offset == 4
            and .verified_windows[0].byte_length == 8
            and .verified_windows[1].position == 1
            and .verified_windows[1].byte_offset == 20
            and .verified_windows[1].byte_length == 12
            and (.evidence_context_manifest_sha256 | length) == 64
            and (.full_manifest_sha256 | length) == 64
            and .rights_scope_authenticated == false
            and .decoder_identity_authenticated == false
            and .model_runtime_identity_authenticated == false
            and .runner_receipt_verified == false
            and .request_body_bytes_recomputed == true
            and .request_body_semantics_bound == true
            and .request_body_delivery_attested == false
            and .model_input_attested == false
          ' "$RUNNER_TEMP/audio-evidence-window-report.json" > /dev/null

      - name: Build unsigned in-toto audio evidence Statement when integration module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/audio_evidence_in_toto.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-audio-evidence-in-toto -- tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-bound-revision.synthetic.json tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-window.synthetic.json tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-source.synthetic.bin tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-pcm.synthetic.hex > "$RUNNER_TEMP/audio-evidence-in-toto-payload.json"
          jq -e '
            (.statement_json | fromjson) as $statement
            | (.payload_type == "application/vnd.in-toto+json"
              and (.statement_payload_sha256 | length == 64)
              and .dsse_envelope_created == false
              and .signature_verified == false
              and $statement["_type"] == "https://in-toto.io/Statement/v1"
              and $statement.predicateType == "https://luminousdynamics.io/attestations/mel/audio-evidence-materialization/v1"
              and ($statement.subject | map(.name) | any(.[]; startswith("target-audio-reference/")))
              and ($statement.subject | map(.name) | any(.[]; startswith("source-audio/")))
              and ($statement.subject | map(.name) | any(.[]; startswith("decoded-pcm/")))
              and ($statement.subject | map(.name) | any(.[]; startswith("audio-window/")))
              and ($statement.subject | map(.name) | any(.[]; startswith("audio-context-manifest/")))
              and ($statement.subject | map(.name) | any(.[]; startswith("audio-evidence-manifest/")))
              and ($statement.subject | map(.name) | any(.[]; startswith("temporal-revision-report/")))
              and $statement.predicate.evidence_level == "DigestLinked"
              and $statement.predicate.target_source_lineage_id == "synthetic-source-lineage-001"
              and $statement.predicate.evidence_source_lineage_id == "synthetic-source-lineage-001"
              and $statement.predicate.target_audio_bytes_recomputed == true
              and $statement.predicate.source_audio_bytes_recomputed == true
              and $statement.predicate.sample_rate_hz == 48000
              and $statement.predicate.channels == 2
              and $statement.predicate.total_frames == 8
              and $statement.predicate.sample_format == "S16Le"
              and ($statement.predicate.rights_scope_receipt_sha256 | length == 64)
              and $statement.predicate.max_output_tokens == 512
              and $statement.predicate.actual_output_tokens == 128
              and $statement.predicate.max_wall_time_ms == 30000
              and $statement.predicate.elapsed_wall_time_ms == 4000
              and $statement.predicate.request_body_bytes_recomputed == true
              and $statement.predicate.request_body_semantics_bound == true
              and $statement.predicate.request_body_delivery_attested == false
              and $statement.predicate.runner_receipt_verified == false
              and $statement.predicate.model_input_attested == false)
          ' "$RUNNER_TEMP/audio-evidence-in-toto-payload.json" > /dev/null

      - name: Assemble exact-head evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/mel-temporal-grounding-evidence"
          mkdir -p "$evidence"
          printf 'tested_head=%s\n' "$(git rev-parse HEAD)" > "$evidence/source-identity.txt"
          rustc +1.96.0 --version > "$evidence/rustc-version.txt" 2>&1 || true
          cargo +1.96.0 --version > "$evidence/cargo-version.txt" 2>&1 || true
          cp tools/mel-temporal-grounding-qualifier/Cargo.toml "$evidence/harness-Cargo.toml"
          cp tools/mel-temporal-grounding-qualifier/Cargo.lock "$evidence/harness-Cargo.lock"
          cp tools/mel-temporal-grounding-qualifier/src/lib.rs "$evidence/harness-lib.rs"
          if [[ -f tools/mel-temporal-grounding-qualifier/src/audio_evidence_window.rs ]]; then
            cp tools/mel-temporal-grounding-qualifier/src/audio_evidence_window.rs "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/src/bin/mel-audio-evidence-window-audit.rs "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/schemas/mel-audio-evidence-window-v1.schema.json "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-window.synthetic.json "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-source.synthetic.bin "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-pcm.synthetic.hex "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-evidence-request.synthetic.json "$evidence/"
            if [[ -f "$RUNNER_TEMP/audio-evidence-window-report.json" ]]; then
              cp "$RUNNER_TEMP/audio-evidence-window-report.json" "$evidence/"
            fi
          fi
          if [[ -f tools/mel-temporal-grounding-qualifier/src/audio_revision_binding.rs ]]; then
            cp tools/mel-temporal-grounding-qualifier/src/audio_revision_binding.rs "$evidence/"
          fi
          if [[ -f tools/mel-temporal-grounding-qualifier/src/audio_evidence_in_toto.rs ]]; then
            cp tools/mel-temporal-grounding-qualifier/src/audio_evidence_in_toto.rs "$evidence/"
          fi
          cp tools/mel-temporal-grounding-qualifier/src/bin/mel-audio-evidence-in-toto.rs "$evidence/"
          cp tools/mel-temporal-grounding-qualifier/fixtures/mel-audio-bound-revision.synthetic.json "$evidence/"
          if [[ -f "$RUNNER_TEMP/audio-evidence-in-toto-payload.json" ]]; then
            cp "$RUNNER_TEMP/audio-evidence-in-toto-payload.json" "$evidence/"
          fi
          cp tools/mel-temporal-grounding-qualifier/src/temporal_revision.rs "$evidence/"
          cp tools/mel-temporal-grounding-qualifier/src/bin/mel-temporal-revision-audit.rs "$evidence/"
          cp tools/mel-temporal-grounding-qualifier/fixtures/mel-temporal-revision-triplet.synthetic.json "$evidence/"
          if [[ -f "$RUNNER_TEMP/revision-triplet-report.json" ]]; then
            cp "$RUNNER_TEMP/revision-triplet-report.json" "$evidence/"
          fi
          cp crates/domains/symthaea-muse/src/temporal_grounding.rs "$evidence/"
          cp crates/domains/symthaea-muse/src/evidence_digest.rs "$evidence/"
          cp docs/research/MEL-GROUND-001-TEMPORAL-GROUNDING-SCORER-V1.md "$evidence/"
          (cd "$evidence" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mel-temporal-grounding-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-temporal-grounding-evidence/
          if-no-files-found: error
          retention-days: 90
