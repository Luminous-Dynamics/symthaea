name: MEL temporal-grounding count-gated qualification

on:
  push:
    branches:
      - research/mel-temporal-grounding-count-gated-f1-v1-20261124
      - research/mel-multi-annotator-grounding-v1-20261124
      - research/mel-temporal-revision-audit-v1-20261124
      - research/mel-multi-annotator-grounding-v1-20261124
      - research/mel-annotator-reliability-corpus-v1-20261125
      - research/mel-music-listen-bench-v1-20261126
      - research/mel-music-performance-identity-v1-20261127
      - research/mel-performance-identity-inference-v1-20261127
      - research/mel-temporal-unitizing-alpha-u-v1-20261126
    paths:
      - "crates/domains/symthaea-muse/src/temporal_grounding.rs"
      - "crates/domains/symthaea-muse/src/evidence_digest.rs"
      - "tools/mel-temporal-grounding-qualifier/**"
      - "docs/research/MEL-GROUND-001-TEMPORAL-GROUNDING-SCORER-V1.md"
      - "docs/research/MEL-HEAR-004-PAIRED-SOURCE-WORK-INFERENCE-V1.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mel-temporal-grounding-qualification.yml"
      - ".github/scripts/check-workflow-draft-safety.py"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - research/mel-ground-temporal-evaluator-v1-20261103
      - research/mel-temporal-grounding-count-gated-f1-v1-20261124
      - research/mel-music-listen-bench-v1-20261126
      - research/mel-music-performance-identity-v1-20261127
    paths:
      - "crates/domains/symthaea-muse/src/temporal_grounding.rs"
      - "crates/domains/symthaea-muse/src/evidence_digest.rs"
      - "tools/mel-temporal-grounding-qualifier/**"
      - "docs/research/MEL-GROUND-001-TEMPORAL-GROUNDING-SCORER-V1.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mel-temporal-grounding-qualification.yml"

permissions:
  contents: write

jobs:
  qualify:
    name: Exact-head count-gated temporal grounding
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Verify exact tested source revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'tested_head=%s\n' "$actual"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Bootstrap canonical Rust 1.96 formatting
        run: |
          set -euo pipefail
          cargo +1.96.0 fmt --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml
          cargo +1.96.0 fmt --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --check

      - name: Commit formatter-normalized source on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add tools/mel-temporal-grounding-qualifier/src
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "MEL: apply canonical Rust 1.96 formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify committed lock and workspace resolution
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 metadata --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"

      - name: Run locked exact-source temporal-grounding tests
        run: cargo +1.96.0 test --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml

      - name: Warnings-denied Clippy on exact production source
        run: cargo +1.96.0 clippy --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --all-targets -- -D warnings

      - name: Replay multi-annotator temporal-grounding panel when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/temporal_consensus.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-multi-annotator-grounding-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-multi-annotator-temporal.synthetic.json > "$RUNNER_TEMP/multi-annotator-report.json"
          jq -e '
            .schema == "mel-multi-annotator-grounding-report-v1"
            and .summary.panel_size == 6
            and .summary.scored_annotators == 4
            and .summary.abstained_predictions == 0
            and .summary.parse_failure_predictions == 0
            and .summary.prediction_coverage == 1.0
            and .summary.present_prediction_coverage == 1.0
            and .summary.absent_prediction_coverage == 1.0
            and .summary.present_annotators == 3
            and .summary.absent_annotators == 1
            and .summary.ambiguous_exclusions == 1
            and .summary.not_estimable_exclusions == 1
            and .summary.present_exact_count_accuracy > 0.66
            and .summary.present_exact_count_accuracy < 0.67
            and .summary.annotated_occurrence_count_min == 1
            and .summary.annotated_occurrence_count_max == 2
            and .summary.one_to_many_annotators == 2
            and .summary.one_to_many_mean_count_gated_f1 == 1.0
            and .summary.unanimous_correct_across_scored_annotators == false
            and (.event_reference_boundary_distributions | length) == 2
            and .event_reference_boundary_distributions[0].matching_annotators == 3
            and .event_reference_boundary_distributions[0].start_spread_frames == 5
            and .event_reference_boundary_distributions[1].matching_annotators == 2
            and .event_reference_boundary_distributions[1].present_annotators == 3
            and (.unmatched_prediction_indices | length) == 0
            and (.annotator_results | length) == 6
            and (.pairwise_annotation_concordance | length) == 15
            and .summary.pairwise_annotation_pairs == 15
            and .summary.pairwise_disposition_agreement_rate == 0.2
            and .summary.pairwise_present_present_pairs == 3
            and .summary.pairwise_present_exact_count_agreement > 0.33
            and .summary.pairwise_present_exact_count_agreement < 0.34
            and .summary.pairwise_present_symmetric_event_f1 > 0.77
            and .summary.pairwise_present_symmetric_event_f1 < 0.78
            and .pairwise_inter_annotator_agreement_computed == false
            and .model_confidence_calibration_computed == false
            and .synthetic_consensus_ground_truth_created == false
            and .population_confidence_interval_computed == false
          ' "$RUNNER_TEMP/multi-annotator-report.json" > /dev/null

      - name: Replay corpus-level multi-annotator reliability when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/temporal_reliability.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-temporal-reliability-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-temporal-reliability-corpus.synthetic.json > "$RUNNER_TEMP/temporal-reliability-report.json"
          jq -e '
            .schema == "mel-temporal-annotation-reliability-report-v1"
            and .item_count == 4
            and .source_work_clusters == 3
            and .total_annotation_records == 9
            and .disposition_alpha.ratings == 9
            and .disposition_alpha.observed_disagreement > 0.44
            and .disposition_alpha.observed_disagreement < 0.45
            and .disposition_alpha.expected_disagreement > 0.72
            and .disposition_alpha.expected_disagreement < 0.73
            and .disposition_alpha.alpha > 0.38
            and .disposition_alpha.alpha < 0.39
            and (.pairwise_by_iou_threshold | length) == 4
            and .pairwise_by_iou_threshold[0].symmetric_event_f1_mean == 1.0
            and .pairwise_by_iou_threshold[2].symmetric_event_f1_mean == 1.0
            and .pairwise_by_iou_threshold[3].symmetric_event_f1_mean > 0.33
            and .pairwise_by_iou_threshold[3].symmetric_event_f1_mean < 0.34
            and .consensus_ground_truth_created == false
            and .model_performance_scored == false
            and .population_confidence_interval_computed == false
            and .source_work_bootstrap_computed == false
          ' "$RUNNER_TEMP/temporal-reliability-report.json" > /dev/null

      - name: Replay performance-invariance triads when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/performance_invariance.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-performance-invariance-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-performance-invariance.synthetic.json > "$RUNNER_TEMP/performance-invariance-report.json"
          jq -e '
            .schema == "mel-performance-invariance-report-v1"
            and .benchmark_id == "Melothaea-Performance-Identity"
            and .split == "SyntheticRendered"
            and (.source_permissions_manifest_sha256 | length) == 64
            and .source_permission_receipts_authenticated == false
            and .overall.target_property == null
            and .overall.triads == 6
            and .overall.clean.accuracy == 1.0
            and .overall.performance_stay.accuracy > 0.83
            and .overall.performance_stay.accuracy < 0.84
            and .overall.musical_flip.accuracy > 0.66
            and .overall.musical_flip.accuracy < 0.67
            and .overall.performance_false_difference_rate > 0.16
            and .overall.performance_false_difference_rate < 0.17
            and .overall.musical_flip_miss_rate > 0.33
            and .overall.musical_flip_miss_rate < 0.34
            and .overall.joint_exact_rate == 0.5
            and (.by_target_property | length) == 6
            and (.by_performance_factor | length) == 6
            and (.by_musical_flip_factor | length) == 6
            and .source_lineage_count == 6
            and .confirmatory_lineage_floor_met == false
            and .audio_bytes_recomputed == false
            and .performance_and_annotation_receipts_authenticated == false
            and .model_invoked_by_evaluator == false
          ' "$RUNNER_TEMP/performance-invariance-report.json" > /dev/null

      - name: Replay MusicListenBench CLEAN-FLIP-STAY triads when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/music_listen_bench.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-music-listen-bench-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-music-listen-bench.synthetic.json > "$RUNNER_TEMP/music-listen-bench-report.json"
          jq -e '
            .schema == "mel-music-listen-bench-report-v1"
            and .benchmark_id == "MusicListenBench"
            and .benchmark_version == "1.0"
            and (.dataset_revision_sha256 | length) == 64
            and (.official_scorer_revision_sha256 | length) == 64
            and .overall.triads == 4
            and .overall.clean.accuracy == 0.75
            and .overall.flip.accuracy == 0.75
            and .overall.stay.accuracy == 1.0
            and .overall.clean.incorrect == 1
            and .overall.clean.choice_a == 3
            and .overall.clean.choice_b == 1
            and .overall.clean.choice_a_rate_among_answered == 0.75
            and .overall.flip.choice_a == 1
            and .overall.flip.choice_b == 2
            and .overall.flip.choice_a_rate_among_answered > 0.33
            and .overall.flip.choice_a_rate_among_answered < 0.34
            and .overall.stay.choice_a_rate_among_answered == 1.0
            and .overall.flip.unparseable == 1
            and .overall.flip_miss_rate == 0.25
            and .overall.stay_false_flip_rate == 0.0
            and .overall.clean_correct_triads == 3
            and .overall.conditional_flip_miss_rate > 0.333
            and .overall.conditional_flip_miss_rate < 0.334
            and .overall.conditional_stay_false_flip_rate == 0.0
            and .overall.accuracy_flip_stay == 0.875
            and .overall.joint_clean_flip_stay_exact_rate == 0.5
            and (.by_task | length) == 4
            and (.by_flip_factor | length) == 4
            and (.by_stay_factor | length) == 4
            and .source_lineage_count == 2
            and .confirmatory_lineage_floor_met == false
            and .audio_bytes_recomputed == false
            and .transformations_authenticated == false
            and .model_invoked_by_evaluator == false
          ' "$RUNNER_TEMP/music-listen-bench-report.json" > /dev/null

      - name: Replay property-relative performance identity triads when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/music_performance_identity.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-music-performance-identity-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-music-performance-identity.synthetic.json > "$RUNNER_TEMP/music-performance-identity-report.json"
          jq -e '
            .schema == "mel-music-performance-identity-report-v1"
            and .benchmark_id == "MEL-PERFORMANCE-IDENTITY"
            and .benchmark_version == "1.0"
            and .overall.triads == 8
            and .overall.clean.accuracy == 0.875
            and .overall.performance_stay.accuracy == 0.875
            and .overall.musical_flip.accuracy == 0.875
            and .overall.performance_stay_false_difference_rate == 0.125
            and .overall.musical_flip_miss_rate == 0.125
            and .overall.clean_correct_triads == 7
            and .overall.conditional_performance_stay_false_difference_rate > 0.14
            and .overall.conditional_performance_stay_false_difference_rate < 0.15
            and .overall.conditional_musical_flip_miss_rate > 0.14
            and .overall.conditional_musical_flip_miss_rate < 0.15
            and .overall.joint_clean_performance_stay_musical_flip_exact_rate == 0.625
            and (.by_property | length) == 6
            and (.by_performance_stay_factor | length) == 8
            and (.by_musical_flip_factor | length) == 6
            and (.by_performance_stay_performer | length) == 2
            and (.by_performance_stay_take | length) == 2
            and (.by_performance_stay_renderer | length) == 2
            and .source_work_clusters == 8
            and .performer_clusters == 2
            and .confirmatory_source_work_floor_met == false
            and .target_property_reference_authenticated == false
            and .pairing_manifests_authenticated == false
            and .audio_bytes_recomputed == false
            and .population_confidence_interval_computed == false
          ' "$RUNNER_TEMP/music-performance-identity-report.json" > /dev/null

      - name: Replay paired source-work-clustered performance identity comparison when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/music_performance_identity_inference.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-music-performance-identity-compare -- tools/mel-temporal-grounding-qualifier/fixtures/mel-music-performance-identity-comparison.synthetic.json > "$RUNNER_TEMP/music-performance-identity-comparison-report.json"
          jq -e '
            .schema == "mel-music-performance-identity-comparison-report-v1"
            and .bootstrap_method == "paired-source-work-cluster-percentile-bootstrap-v1"
            and .status == "SourceWorkClusterFloorMet"
            and .item_count == 30
            and .source_work_clusters == 30
            and .minimum_source_work_clusters == 30
            and .bootstrap_replicates == 2000
            and .bootstrap_seed == 20261127
            and .performance_stay_false_difference.estimate.baseline == 0.5
            and .performance_stay_false_difference.estimate.candidate > 0.266
            and .performance_stay_false_difference.estimate.candidate < 0.267
            and .performance_stay_false_difference.estimate.candidate_improvement > 0.233
            and .performance_stay_false_difference.estimate.candidate_improvement < 0.234
            and .performance_stay_false_difference.candidate_improvement_interval != null
            and .musical_flip_miss.estimate.baseline > 0.199
            and .musical_flip_miss.estimate.baseline < 0.201
            and .musical_flip_miss.estimate.candidate > 0.099
            and .musical_flip_miss.estimate.candidate < 0.101
            and .musical_flip_miss.candidate_improvement_interval != null
            and .joint_exact.estimate.baseline == 0.4
            and .joint_exact.estimate.candidate == 0.7
            and .joint_exact.estimate.candidate_improvement > 0.299999
            and .joint_exact.estimate.candidate_improvement < 0.300001
            and .joint_exact.candidate_improvement_interval != null
            and .source_work_lineage_authenticated == false
            and .target_property_annotations_authenticated == false
            and .audio_bytes_recomputed == false
            and .model_invoked_by_evaluator == false
            and .population_generalization_established == false
          ' "$RUNNER_TEMP/music-performance-identity-comparison-report.json" > /dev/null

      - name: Replay corrected multi-rater unitizing alpha-u corpus when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/temporal_unitizing.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-temporal-unitizing-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-temporal-unitizing-alpha-u.synthetic.json > "$RUNNER_TEMP/temporal-unitizing-report.json"
          jq -e '
            .schema == "mel-temporal-unitizing-alpha-u-report-v1"
            and .evaluator_version == "mel-temporal-unitizing-alpha-u-v1"
            and .summary.item_count == 3
            and .summary.scored_item_count == 2
            and .summary.insufficient_eligible_items == 1
            and .summary.total_annotation_records == 11
            and .summary.total_eligible_unitizations == 7
            and .summary.excluded_ambiguous == 2
            and .summary.excluded_not_estimable == 2
            and .summary.source_work_clusters == 2
            and .item_results[0].status == "Scored"
            and .item_results[0].eligible_unitizers == 3
            and .item_results[0].coefficients.u_alpha_nominal != null
            and .item_results[0].coefficients.u_alpha_binary != null
            and .item_results[1].status == "Scored"
            and .item_results[1].coefficients.u_alpha_nominal == 1.0
            and .item_results[1].coefficients.u_alpha_binary == 1.0
            and .item_results[1].coefficients.cu_alpha_nominal == null
            and .item_results[2].status == "InsufficientEligibleUnitizers"
            and .item_results[2].eligible_unitizers == 1
            and .unitizing_alpha_computed == true
            and .consensus_ground_truth_created == false
            and .pooled_continuum_alpha_computed == false
            and .population_confidence_interval_computed == false
            and .source_work_bootstrap_computed == false
            and .model_performance_scored == false
            and .annotation_receipts_authenticated == false
          ' "$RUNNER_TEMP/temporal-unitizing-report.json" > /dev/null

      - name: Replay paired temporal revision when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/temporal_revision.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-temporal-revision-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-temporal-revision-triplet.synthetic.json > "$RUNNER_TEMP/temporal-revision-report.json"
          jq -e '
            .schema == "mel-temporal-revision-batch-report-v1"
            and .cases == 6
            and (.matched_evidence_contrasts | length) == 2
            and .matched_evidence_contrasts[0].local_minus_no_evidence_f1 == 0.5
            and .matched_evidence_contrasts[0].local_minus_yoked_f1 == 0.5
            and .matched_evidence_contrasts[0].local_beats_yoked == true
            and .matched_evidence_contrasts[0].local_output_tokens == 128
            and .reports[0].source_lineage_id == "synthetic-lineage-001"
            and .reports[0].runtime_identity_sha256 != null
            and .reports[0].actual_output_tokens == 128
            and .source_work_bootstrap.source_work_clusters == 2
            and .source_work_bootstrap.one_to_many_source_work_clusters == 2
            and .source_work_bootstrap.recommended_confirmatory_cluster_floor == 30
            and .source_work_bootstrap.confirmatory_source_cluster_floor_met == false
            and .source_work_bootstrap.local_minus_no_evidence_f1.estimate == 0.5
            and .source_work_bootstrap.local_minus_no_evidence_count_gated_f1.estimate == 0.5
          ' "$RUNNER_TEMP/temporal-revision-report.json" > /dev/null

      - name: Replay transformed-view equivariance when module is present
        if: hashFiles('tools/mel-temporal-grounding-qualifier/src/temporal_transform.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked --manifest-path tools/mel-temporal-grounding-qualifier/Cargo.toml --bin mel-temporal-transform-audit -- tools/mel-temporal-grounding-qualifier/fixtures/mel-temporal-equivariance-2x.synthetic.json > "$RUNNER_TEMP/temporal-equivariance-report.json"
          jq -e '
            .schema == "mel-temporal-equivariance-report-v1"
            and .baseline.f1 == 1.0
            and .transformed_mapped_to_canonical.f1 == 1.0
            and .exact_count_preserved == true
            and .f1_delta_after_canonical_mapping == 0.0
            and .count_gated_f1_delta_after_canonical_mapping == 0.0
            and .upstream_qualification_receipt_authenticated == false
            and .qualified_equivariance_claim_permitted == false
            and .transform_bytes_recomputed == false
          ' "$RUNNER_TEMP/temporal-equivariance-report.json" > /dev/null

      - name: Assemble exact-head evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/mel-temporal-grounding-evidence"
          mkdir -p "$evidence"
          printf 'tested_head=%s\n' "$(git rev-parse HEAD)" > "$evidence/source-identity.txt"
          rustc +1.96.0 --version > "$evidence/rustc-version.txt" 2>&1 || true
          cargo +1.96.0 --version > "$evidence/cargo-version.txt" 2>&1 || true
          cp tools/mel-temporal-grounding-qualifier/Cargo.toml "$evidence/harness-Cargo.toml"
          cp tools/mel-temporal-grounding-qualifier/Cargo.lock "$evidence/harness-Cargo.lock"
          cp tools/mel-temporal-grounding-qualifier/src/lib.rs "$evidence/harness-lib.rs"
          cp crates/domains/symthaea-muse/src/temporal_grounding.rs "$evidence/"
          cp crates/domains/symthaea-muse/src/evidence_digest.rs "$evidence/"
          cp docs/research/MEL-GROUND-001-TEMPORAL-GROUNDING-SCORER-V1.md "$evidence/"
          if [[ -f tools/mel-temporal-grounding-qualifier/src/music_listen_bench.rs ]]; then
            cp tools/mel-temporal-grounding-qualifier/src/music_listen_bench.rs "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/src/bin/mel-music-listen-bench-audit.rs "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/fixtures/mel-music-listen-bench.synthetic.json "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/schemas/mel-music-listen-bench-case-v1.schema.json "$evidence/"
            cp docs/research/MEL-HEAR-001-MUSICLISTENBENCH-ADAPTER-V1.md "$evidence/"
            if [[ -f "$RUNNER_TEMP/music-listen-bench-report.json" ]]; then
              cp "$RUNNER_TEMP/music-listen-bench-report.json" "$evidence/"
            fi
          fi
          if [[ -f tools/mel-temporal-grounding-qualifier/src/music_performance_identity.rs ]]; then
            cp tools/mel-temporal-grounding-qualifier/src/music_performance_identity.rs "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/src/bin/mel-music-performance-identity-audit.rs "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/fixtures/mel-music-performance-identity.synthetic.json "$evidence/"
            cp tools/mel-temporal-grounding-qualifier/schemas/mel-music-performance-identity-case-v1.schema.json "$evidence/"
            cp docs/research/MEL-HEAR-002-PROPERTY-RELATIVE-MUSIC-PERFORMANCE-IDENTITY-V1.md "$evidence/"
            if [[ -f "$RUNNER_TEMP/music-performance-identity-report.json" ]]; then
              cp "$RUNNER_TEMP/music-performance-identity-report.json" "$evidence/"
