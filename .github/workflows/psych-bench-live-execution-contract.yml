name: Psych-Bench Live Execution Contract

on:
  pull_request:
    branches:
      - main
      - psych-bench/live-execution-contract
    paths:
      - '.github/workflows/psych-bench-live-execution-contract.yml'
      - 'scripts/ci/strict_clippy_paths.py'
      - 'crates/domains/symthaea-psych-bench/src/harness/live_execution_contract.rs'
      - 'crates/domains/symthaea-psych-bench/src/harness/live_runner_contract.rs'
      - 'crates/domains/symthaea-psych-bench/tests/live_execution_contract_backend.rs'
      - 'crates/domains/symthaea-psych-bench/src/lib.rs'
      - 'crates/domains/symthaea-psych-bench/Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-execution-contract:
    name: Exact-subject live execution contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Bind exact subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          printf 'qualified_subject=%s\n' "$actual"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version --verbose
          cargo --version

      - name: Install backend system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libdbus-1-dev

      - name: Contract format diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            crates/domains/symthaea-psych-bench/src/harness/live_execution_contract.rs \
            crates/domains/symthaea-psych-bench/src/harness/live_runner_contract.rs \
            crates/domains/symthaea-psych-bench/tests/live_execution_contract_backend.rs

      - name: Compile psych-bench library
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-psych-bench --lib

      - name: Execute live execution contract regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symthaea-psych-bench --lib live_execution_contract::tests -- --nocapture

      - name: Execute legacy-runner adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symthaea-psych-bench --lib live_runner_contract::tests -- --nocapture

      - name: Compile backend-gated contract adapter
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-psych-bench --lib --features symthaea-backend
          cargo test --locked -p symthaea-psych-bench --features symthaea-backend \
            --test live_execution_contract_backend -- --nocapture

      - name: Strict focused Clippy
        shell: bash
        run: |
          set -euo pipefail

          default_report="$RUNNER_TEMP/live-contract-default-clippy.jsonl"
          set +e
          cargo clippy --locked -p symthaea-psych-bench --lib --no-deps \
            --message-format=json > "$default_report"
          default_status=$?
          set -e
          python3 scripts/ci/strict_clippy_paths.py \
            "$default_report" \
            crates/domains/symthaea-psych-bench/src/harness/live_execution_contract.rs \
            crates/domains/symthaea-psych-bench/src/harness/live_runner_contract.rs
          test "$default_status" -eq 0

          backend_report="$RUNNER_TEMP/live-contract-backend-clippy.jsonl"
          set +e
          cargo clippy --locked -p symthaea-psych-bench --lib --features symthaea-backend --no-deps \
            --message-format=json > "$backend_report"
          backend_status=$?
          set -e
          python3 scripts/ci/strict_clippy_paths.py \
            "$backend_report" \
            crates/domains/symthaea-psych-bench/src/harness/live_execution_contract.rs \
            crates/domains/symthaea-psych-bench/src/harness/live_runner_contract.rs
          test "$backend_status" -eq 0

          test_report="$RUNNER_TEMP/live-contract-test-clippy.jsonl"
          set +e
          cargo clippy --locked -p symthaea-psych-bench \
            --test live_execution_contract_backend --features symthaea-backend --no-deps \
            --message-format=json > "$test_report"
          test_status=$?
          set -e
          python3 scripts/ci/strict_clippy_paths.py \
            "$test_report" \
            crates/domains/symthaea-psych-bench/tests/live_execution_contract_backend.rs
          test "$test_status" -eq 0

      - name: Postflight exact-subject immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.subject.outputs.sha }}'
          git diff --exit-code
          test -z "$(git status --porcelain)"
