# Focused software-contract qualification for Symthaea evidence surfaces.
#
# This lane exists to answer a narrow question quickly: does the exact PR head
# satisfy the evidence-plane / psych-bench software contracts it changes?
# It does NOT replace repository-wide CI and does NOT establish empirical or
# scientific evidence about Symthaea, Butlin indicators, or consciousness.

name: Evidence Contract Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/evidence-contract.yml'
      - 'crates/core/symthaea-evidence-plane/**'
      - 'crates/domains/symthaea-psych-bench/**'
      - 'crates/core/symthaea-core/**'
      - 'src/cognitive_loop/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'rust-toolchain*'
  workflow_dispatch:

# Automatic runs may supersede older heads for the same PR. Deliberate manual
# runs receive a unique group so a later push cannot cancel a requested exact-
# head qualification attempt.
concurrency:
  group: evidence-contract-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  evidence-contract:
    name: Exact-head evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact qualified head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "qualified head mismatch: expected=$expected actual=$actual" >&2
            exit 1
          }
          {
            echo '## Evidence Contract Qualification'
            echo
            echo "- qualified SHA: \`$actual\`"
            echo '- scope: software-contract qualification only'
            echo '- full repository CI: independent'
            echo '- empirical/scientific claim authority: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse baseline-generation mode
        shell: bash
        run: |
          set -euo pipefail
          if env | grep -q '^UPDATE_SNAPSHOT='; then
            echo 'UPDATE_SNAPSHOT is present; comparison/qualification must remain read-only.' >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install focused system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev

      - name: Record selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -V
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Evidence-plane contracts
        run: cargo test --locked -p symthaea-evidence-plane

      - name: Psych-bench contracts
        run: cargo test --locked -p symthaea-psych-bench

      - name: Backend Butlin conformance
        run: cargo test --locked -p symthaea-psych-bench --features symthaea-backend --lib -- butlin
