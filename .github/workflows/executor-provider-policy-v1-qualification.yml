name: Executor Provider Policy V1 Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/executor-provider-policy-v1-qualification.yml'
      - 'crates/core/symthaea-executor-provider-policy/**'
      - 'crates/core/symthaea-executor-identity/**'
      - 'crates/core/symthaea-executor-subject-graph/**'
      - 'crates/core/symthaea-interaction-core/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executor-provider-policy-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  executor-provider-policy-v1:
    name: Exact-head canonical provider-policy manifest v1
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact D3B parent and tranche scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUIRED_PARENT: 4f5f271f97ab7979c0bc1bc700e3dfa2e44f3931
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          fi
          git cat-file -e "${REQUIRED_PARENT}^{commit}"
          test "$(git merge-base HEAD "${REQUIRED_PARENT}")" = "${REQUIRED_PARENT}"
          git merge-base --is-ancestor "${REQUIRED_PARENT}" HEAD
          test "$(git rev-list --count "${REQUIRED_PARENT}"..HEAD)" -eq 1

          mapfile -t changed < <(git diff --name-only "${REQUIRED_PARENT}"...HEAD | sort)
          expected=(
            '.github/workflows/executor-provider-policy-v1-qualification.yml'
            'crates/core/symthaea-executor-provider-policy/Cargo.toml'
            'crates/core/symthaea-executor-provider-policy/scripts/provider_policy_oracle.py'
            'crates/core/symthaea-executor-provider-policy/src/lib.rs'
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Record clean source baseline
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

      - name: Enforce provider-policy configuration boundary
        run: |
          set -euo pipefail
          MANIFEST=crates/core/symthaea-executor-provider-policy/Cargo.toml
          SOURCE=crates/core/symthaea-executor-provider-policy/src/lib.rs

          grep -Fq 'sha2 = { workspace = true }' "${MANIFEST}"
          grep -Fq 'thiserror = { workspace = true }' "${MANIFEST}"
          grep -Fq 'symthaea-executor-identity = { path = "../symthaea-executor-identity" }' "${MANIFEST}"
          grep -Fq 'symthaea-executor-subject-graph = { path = "../symthaea-executor-subject-graph" }' "${MANIFEST}"
          grep -Fq 'symthaea-interaction-core = { path = "../symthaea-interaction-core" }' "${MANIFEST}"

          if grep -Eiq 'serde|reqwest|hyper|tokio|holochain|hdk|hdi|xenia|spiffe|spire|rats|eat|tpm|wasmtime|keyring|secret-service|symthaea-authority|symthaea-action|symthaea-executor-identity-composer' "${MANIFEST}"; then
            echo 'provider/runtime/authority/composer/serialization dependency leaked into B2A' >&2
            exit 1
          fi

          grep -Fq 'symthaea.executor.provider-policy.entry.v1\0' "${SOURCE}"
          grep -Fq 'symthaea.executor.provider-policy.entry-set.v1\0' "${SOURCE}"
          grep -Fq 'symthaea.executor.provider-policy.manifest.v1\0' "${SOURCE}"
          grep -Fq 'pub enum ProviderPolicyTargetV1' "${SOURCE}"
          grep -Fq 'pub struct ProviderPolicyEntryV1' "${SOURCE}"
          grep -Fq 'pub struct ExecutorProviderPolicyManifestV1' "${SOURCE}"
          grep -Fq 'evidence_schema_version: u16' "${SOURCE}"
          grep -Fq 'AmbiguousVerifierProfile' "${SOURCE}"
          grep -Fq 'MissingIdentityTarget' "${SOURCE}"
          grep -Fq 'MissingRelationTarget' "${SOURCE}"
          grep -Fq 'UnexpectedIdentityTarget' "${SOURCE}"
          grep -Fq 'UnexpectedRelationTarget' "${SOURCE}"
          grep -Fq 'UnsupportedExecutorProfileTarget' "${SOURCE}"
          grep -Fq 'fn frozen_entry_set_and_manifest_vectors' "${SOURCE}"
          grep -Fq 'fn entry_order_is_non_semantic' "${SOURCE}"
          grep -Fq 'fn duplicate_and_ambiguous_entries_fail_closed' "${SOURCE}"
          grep -Fq 'fn missing_identity_and_relation_coverage_fail_closed' "${SOURCE}"
          grep -Fq 'fn embodiment_support_closure_requires_device_policy' "${SOURCE}"

          if grep -Eq '\bVerifiedExecutorBinding\b|\bAdmittedRawSoftwareV1\b|\bVerifiedXeniaHostEndpointV1\b|\bSubjectGraphMatchCandidateV1\b' "${SOURCE}"; then
            echo 'live/provider-positive evidence type leaked into provider-policy manifest' >&2
            exit 1
          fi
          if grep -Eq 'pub[[:space:]]+trait[[:space:]].*(Verifier|Provider|Attestation)|pub[[:space:]]+fn[[:space:]]+(verify|mint|compose|admit)_' "${SOURCE}"; then
            echo 'provider verification/minting surface leaked into configuration-only crate' >&2
            exit 1
          fi
          if grep -Eq '\bSerialize\b|\bDeserialize\b|serde::|std::net::|std::fs::|std::process::|Command::new|SystemTime|Instant::now' "${SOURCE}"; then
            echo 'serialization/runtime I/O/clock leaked into provider-policy manifest' >&2
            exit 1
          fi

      - name: Independent canonical provider-policy oracle
        run: |
          set -euo pipefail
          python3 crates/core/symthaea-executor-provider-policy/scripts/provider_policy_oracle.py

      - name: Format
        run: |
          set -euo pipefail
          cargo fmt -p symthaea-executor-provider-policy -- --check

      - name: Resolve candidate and execute focused gates
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check -p symthaea-executor-provider-policy --all-targets
          cargo test -p symthaea-executor-provider-policy
          cargo clippy -p symthaea-executor-provider-policy --all-targets -- -D warnings
          if ! cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock requires committed reconciliation on the accepted stacked lineage:' >&2
            diff -u /tmp/Cargo.lock.before Cargo.lock || true
            exit 1
          fi

      - name: Locked replay
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-executor-provider-policy --all-targets
          cargo test --locked -p symthaea-executor-provider-policy
          cargo clippy --locked -p symthaea-executor-provider-policy --all-targets -- -D warnings

      - name: Prove qualification did not mutate source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
