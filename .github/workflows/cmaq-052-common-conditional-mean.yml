name: CMAQ-052 common conditional mean martingale contract

on:
  pull_request:
    paths:
      - "research/cmaq-052/**"
      - "research/cmaq-046/**"
      - ".github/workflows/cmaq-052-common-conditional-mean.yml"

permissions:
  contents: read

concurrency:
  group: cmaq-052-common-conditional-mean
  cancel-in-progress: true

jobs:
  common-conditional-mean:
    name: common-conditional-mean
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/cmaq-052-common-conditional-mean-contract-v0-2-20261128'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --manifest-path research/cmaq-052/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo +1.100.0 test --manifest-path research/cmaq-052/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo +1.100.0 clippy --manifest-path research/cmaq-052/Cargo.toml --locked --all-targets -- -D warnings
      - name: Reference envelope smoke probe
        run: cargo +1.100.0 run --release --manifest-path research/cmaq-052/Cargo.toml --locked --bin reference_envelope_probe -- 32 500 20261128 250 > cmaq-052-martingale-contract-smoke.csv
      - name: Preserve reference envelope artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmaq-052-martingale-contract-smoke
          path: cmaq-052-martingale-contract-smoke.csv
          if-no-files-found: error
