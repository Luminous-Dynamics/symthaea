name: _Nixward format fix (temporary)

on:
  push:
    branches:
      - feat/cross-077-manager-bound-service-dispatch-linear

permissions:
  contents: write

concurrency:
  group: nixward-format-fix
  cancel-in-progress: true

jobs:
  format:
    if: github.actor == 'Tristan-Stoltz-ERC'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/cross-077-manager-bound-service-dispatch-linear
          fetch-depth: 0

      - name: Install Rust 1.96.0 + rustfmt
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup component add rustfmt --toolchain 1.96.0

      - name: Format focused Nixward surfaces
        run: |
          rustup run 1.96.0 rustfmt --edition 2024             crates/core/nixward/src/action/authorization.rs             crates/core/nixward/src/action/executor.rs             crates/core/nixward/src/action/config_writer.rs             crates/core/nixward/src/action/post_state.rs             crates/core/nixward/src/action/systemd_observer.rs             crates/core/nixward/src/action/systemd_mutation.rs

      - name: Commit focused formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             crates/core/nixward/src/action/authorization.rs             crates/core/nixward/src/action/executor.rs             crates/core/nixward/src/action/config_writer.rs             crates/core/nixward/src/action/post_state.rs             crates/core/nixward/src/action/systemd_observer.rs             crates/core/nixward/src/action/systemd_mutation.rs
          if git diff --cached --quiet; then
            echo "Nixward focused surfaces already formatted."
            exit 0
          fi
          git commit -m "style(nixward): format authority surfaces"
          git push origin HEAD:feat/cross-077-manager-bound-service-dispatch-linear
