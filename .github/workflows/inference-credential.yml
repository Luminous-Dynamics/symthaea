name: Inference Credential

on:
  pull_request:
    paths:
      - "src/language/inference_credential.rs"
      - "tests/inference_credential.rs"
      - "docs/architecture/INFERENCE_CREDENTIAL_BOUND_EXECUTOR_V1.md"
      - ".github/workflows/inference-credential.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-credential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inference-credential:
    name: Inference Credential
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Check focused formatting
        run: rustfmt --edition 2024 --check src/language/inference_credential.rs tests/inference_credential.rs

      - name: Compile and run IF-9 credential regressions
        run: cargo test --locked --test inference_credential

      - name: Focused credential Clippy
        run: cargo clippy --locked --test inference_credential -- -D warnings -A dead-code

      - name: Ratchet credential binding and secret boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Secret material is deliberately absent from Debug' src/language/inference_credential.rs
          grep -F 'callers cannot supply a different credential binding at execution' src/language/inference_credential.rs
          grep -F 'BindingMismatch' src/language/inference_credential.rs
          grep -F 'do **not** accept a' docs/architecture/INFERENCE_CREDENTIAL_BOUND_EXECUTOR_V1.md
          grep -F 'does not yet make bearer material request-scoped' docs/architecture/INFERENCE_CREDENTIAL_BOUND_EXECUTOR_V1.md
          grep -F 'no current `LLMBackend` factory/routing change' docs/architecture/INFERENCE_CREDENTIAL_BOUND_EXECUTOR_V1.md
