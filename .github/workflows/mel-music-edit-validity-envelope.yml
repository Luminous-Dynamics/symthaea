name: Melothaea musical edit validity envelope

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/music_edit_validity_envelope.rs"
      - "crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "tools/mel-music-edit-adapter-harness/**"
      - "benchmarks/mel/schemas/music-edit-validity-envelope-v1.schema.json"
      - "benchmarks/mel/registry/synthetic-music-edit-validity-envelope-v1.json"
      - "docs/research/MEL_MR_EVAL_037_VALIDITY_ENVELOPE_V1_2026-11-14.md"
      - ".github/workflows/mel-music-edit-validity-envelope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validity-envelope-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MEL_VALIDITY_ENVELOPE_REVISION=$actual" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Stage standalone harness with exact production module
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-music-edit-validity-envelope"
          mkdir -p "$staged/src" "$staged/examples" "$staged/fixtures"
          cp tools/mel-music-edit-adapter-harness/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-music-edit-adapter-harness/src/lib.rs "$staged/src/lib.rs"
          cp crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs "$staged/src/music_edit_benchmark_adapter.rs"
          cp crates/domains/symthaea-muse/src/music_edit_validity_envelope.rs "$staged/src/music_edit_validity_envelope.rs"
          cp tools/mel-music-edit-adapter-harness/examples/validate_validity_envelope.rs "$staged/examples/validate_validity_envelope.rs"
          cp benchmarks/mel/registry/synthetic-music-edit-validity-envelope-v1.json "$staged/fixtures/"
          echo "MEL_VALIDITY_ENVELOPE_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format and verify staged harness
        run: |
          cargo +1.96.0 fmt --manifest-path "$MEL_VALIDITY_ENVELOPE_MANIFEST"
          cargo +1.96.0 fmt --check --manifest-path "$MEL_VALIDITY_ENVELOPE_MANIFEST"
      - name: Resolve standalone dependencies
        run: cargo +1.96.0 generate-lockfile --manifest-path "$MEL_VALIDITY_ENVELOPE_MANIFEST"
      - name: Run validity-envelope contract tests
        run: cargo +1.96.0 test --locked --manifest-path "$MEL_VALIDITY_ENVELOPE_MANIFEST"
      - name: Validate multi-reference synthetic fixture
        run: cargo +1.96.0 run --locked --manifest-path "$MEL_VALIDITY_ENVELOPE_MANIFEST" --example validate_validity_envelope
      - name: Run validity-envelope Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path "$MEL_VALIDITY_ENVELOPE_MANIFEST" --all-targets -- -D warnings
      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mel-validity-envelope-evidence"
          mkdir -p "$evidence"
          sha256sum crates/domains/symthaea-muse/src/music_edit_validity_envelope.rs > "$evidence/production-module.sha256"
          sha256sum crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs > "$evidence/adapter-module.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-validity-envelope-v1.schema.json > "$evidence/envelope-schema.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-validity-envelope-v1.json > "$evidence/envelope-fixture.sha256"
          printf 'exact_head=%s\n' "$MEL_VALIDITY_ENVELOPE_REVISION" > "$evidence/source-identities.txt"
          cp "$(dirname "$MEL_VALIDITY_ENVELOPE_MANIFEST")/Cargo.lock" "$evidence/Cargo.lock"
          sha256sum "$evidence/Cargo.lock" > "$evidence/Cargo.lock.sha256"
      - name: Upload validity-envelope evidence
        uses: actions/upload-artifact@v4
        with:
          name: mel-validity-envelope-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-validity-envelope-evidence/
          if-no-files-found: error
          retention-days: 90
