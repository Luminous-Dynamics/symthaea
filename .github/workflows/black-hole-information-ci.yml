name: Black-hole information focused Rust checks

on:
  push:
    branches:
      - research/bh-info-page-curve-benchmark
    paths:
      - crates/domains/symthaea-frontier-physics/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/black-hole-information-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - crates/domains/symthaea-frontier-physics/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/black-hole-information-ci.yml

permissions:
  contents: read

concurrency:
  group: black-hole-information-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  frontier-physics:
    name: Frontier physics format, clippy and tests (Rust 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml --all-targets -- -D warnings
      - name: Run crate tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml --lib
