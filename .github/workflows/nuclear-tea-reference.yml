name: nuclear-tea-reference

on:
  pull_request:
    paths:
      - "tools/nuclear-tea/**"
      - "research/nuclear/port-reference-evidence-sa-2025.json"
      - ".github/workflows/nuclear-tea-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path tools/nuclear-tea/Cargo.toml --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --manifest-path tools/nuclear-tea/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path tools/nuclear-tea/Cargo.toml

      - name: Verify South African port reference data
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(mktemp)"
          trap 'rm -f "$receipt"' EXIT
          cargo run --release --manifest-path tools/nuclear-tea/Cargo.toml -- \
            research/nuclear/port-reference-evidence-sa-2025.json > "$receipt"
          grep -q '"status": "PASS_SOURCE_DATA_CONTRACT_ONLY"' "$receipt"
          grep -q '"shore_power_row_count": 8' "$receipt"
          grep -q '"spare_capacity_row_count": 8' "$receipt"
          cat "$receipt"
