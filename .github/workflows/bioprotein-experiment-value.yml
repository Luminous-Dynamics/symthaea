name: Bioprotein Experiment Value Contract

on:
  pull_request:
    paths:
      - "tools/bioprotein-experiment-oracle/**"
      - "docs/research/bioprotein-experiments/**"
      - "docs/research/BIOPROTEIN_EXPERIMENT_VALUE_V1.md"
      - ".github/workflows/bioprotein-experiment-value.yml"

permissions:
  contents: read

concurrency:
  group: bioprotein-experiment-value-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Exact-head synthetic EVSI contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Confirm checkout is exact requested head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          printf 'expected_head=%s\nactual_head=%s\n' "$EXPECTED_HEAD" "$actual"

      - name: Format focused crate
        run: cargo fmt --manifest-path tools/bioprotein-experiment-oracle/Cargo.toml -- --check

      - name: Test focused crate
        run: cargo test --manifest-path tools/bioprotein-experiment-oracle/Cargo.toml

      - name: Clippy focused crate
        run: cargo clippy --manifest-path tools/bioprotein-experiment-oracle/Cargo.toml --all-targets -- -D warnings

      - name: Produce exact-head evidence receipt
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path tools/bioprotein-experiment-oracle/Cargo.toml --bin bioprotein-experiment-oracle -- \
            --expected-head "$EXPECTED_HEAD" \
            --corpus docs/research/bioprotein-experiments/experiment-value-corpus-v1.json \
            --receipt target/bioprotein-experiment-value-receipt.json
          test -s target/bioprotein-experiment-value-receipt.json

      - name: Produce exact-head robust EVSI receipt
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path tools/bioprotein-experiment-oracle/Cargo.toml --bin bioprotein-robust-evsi -- \
            --expected-head "$EXPECTED_HEAD" \
            --suite docs/research/bioprotein-experiments/robust-evsi-corpus-v1.json \
            --receipt target/bioprotein-robust-evsi-receipt.json
          test -s target/bioprotein-robust-evsi-receipt.json

      - name: Preserve receipt artifact
        if: ${{ always() && hashFiles('target/bioprotein-experiment-value-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bioprotein-experiment-value-receipt
          path: target/bioprotein-experiment-value-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve robust EVSI receipt artifact
        if: ${{ always() && hashFiles('target/bioprotein-robust-evsi-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bioprotein-robust-evsi-receipt
          path: target/bioprotein-robust-evsi-receipt.json
          if-no-files-found: error
          retention-days: 30
