name: CMAQ-049 contextual paired Fourier kernel

on:
  pull_request:
    paths:
      - "research/cmaq-049/**"
      - "research/cmaq-048/**"
      - "research/cmaq-046/**"
      - ".github/workflows/cmaq-049.yml"
  push:
    branches:
      - "research/cmaq-049-*"
    paths:
      - "research/cmaq-049/**"
      - ".github/workflows/cmaq-049.yml"

permissions:
  contents: read

concurrency:
  group: cmaq-049-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  contextual-paired-kernel:
    name: contextual-paired-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --manifest-path research/cmaq-049/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo +1.100.0 test --manifest-path research/cmaq-049/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo +1.100.0 clippy --manifest-path research/cmaq-049/Cargo.toml --locked --all-targets -- -D warnings
      - name: Paired conditional discrepancy smoke probe
        run: cargo +1.100.0 run --release --manifest-path research/cmaq-049/Cargo.toml --locked --bin conditional_pair_probe -- 32 200 20261128 > cmaq-049-paired-kernel-smoke.csv
      - name: Preserve paired probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmaq-049-paired-kernel-smoke
          path: cmaq-049-paired-kernel-smoke.csv
          if-no-files-found: error
