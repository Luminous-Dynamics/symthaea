name: Butlin GWT-1 Causal Trusted Promotion

on:
  workflow_call:
    inputs:
      evidence_subject_sha:
        description: Exact evidence subject commit carried by the causal archive
        required: true
        type: string
      causal_run_id:
        description: Workflow run ID that uploaded the trusted causal evidence artifact
        required: true
        type: string
      causal_run_attempt:
        description: Workflow run attempt that uploaded the trusted causal evidence artifact
        required: true
        type: string

permissions: {}

jobs:
  promote:
    name: Verify causal archive and attest promotion capsule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout trusted promotion revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate promotion trust-root identity
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          SOURCE_RUN_ID: ${{ inputs.causal_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.causal_run_attempt }}
          PROMOTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PROMOTION_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PROMOTION_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          test "$PROMOTION_WORKFLOW_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$PROMOTION_WORKFLOW_PATH" = ".github/workflows/butlin-gwt1-causal-trusted-promotion.yml"
          [[ "$PROMOTION_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$PROMOTION_WORKFLOW_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install exact GitHub CLI attestation verifier
        id: trusted_gh
        shell: bash
        env:
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_ROOT: ${{ runner.temp }}/gwt1-trusted-gh
          TRUSTED_GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-trusted-gh-config
        run: |
          set -euo pipefail

          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test -x /usr/bin/curl
          test -x /usr/bin/sha256sum
          test -x /usr/bin/tar
          test -x /usr/bin/awk

          rm -rf "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          mkdir -p "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          chmod 0700 "$TRUSTED_GH_CONFIG_DIR"

          archive="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --output "$archive" \
            "$TRUSTED_GH_ARCHIVE_URL"

          printf '%s  %s\n' "$TRUSTED_GH_ARCHIVE_SHA256" "$archive" \
            | /usr/bin/sha256sum -c -

          /usr/bin/tar --no-same-owner -xzf "$archive" -C "$TRUSTED_GH_ROOT"
          gh_path="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64/bin/gh"
          test -x "$gh_path"

          version_output="$($gh_path --version)"
          version_token="$(printf '%s\n' "$version_output" | /usr/bin/awk 'NR == 1 { print $3 }')"
          test "$version_token" = "$TRUSTED_GH_VERSION"

          gh_binary_sha256="$(/usr/bin/sha256sum "$gh_path" | /usr/bin/awk '{ print $1 }')"
          version_output_sha256="$(printf '%s' "$version_output" | /usr/bin/sha256sum | /usr/bin/awk '{ print $1 }')"
          [[ "$gh_binary_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$version_output_sha256" =~ ^[0-9a-f]{64}$ ]]

          {
            echo "gh_path=$gh_path"
            echo "gh_binary_sha256=$gh_binary_sha256"
            echo "version_output_sha256=$version_output_sha256"
          } >> "$GITHUB_OUTPUT"

      # Bootstrap note: this digest must be updated to the approved/landed
      # causal trusted-builder revision before this promotion workflow is
      # activated as an authority. This draft intentionally cannot self-approve.
      - name: Download trusted causal evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gwt1-causal-trusted-attested-${{ inputs.evidence_subject_sha }}-${{ inputs.causal_run_id }}-${{ inputs.causal_run_attempt }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.causal_run_id }}
          path: ${{ runner.temp }}/gwt1-causal-source

      - name: Verify downloaded causal artifact structure
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-causal-source
        run: |
          set -euo pipefail
          test -f "$PACKAGE_DIR/gwt1-causal-evidence.tar.gz"
          test -f "$PACKAGE_DIR/gwt1-causal-evidence.tar.gz.sha256"
          test -f "$PACKAGE_DIR/attestation/attestation.json"
          test -f "$PACKAGE_DIR/attestation/attestation.json.sha256"
          test -f "$PACKAGE_DIR/attestation/verification.json"

          (
            cd "$PACKAGE_DIR"
            /usr/bin/sha256sum -c gwt1-causal-evidence.tar.gz.sha256
          )
          (
            cd "$PACKAGE_DIR/attestation"
            /usr/bin/sha256sum -c attestation.json.sha256
          )

      - name: Freshly verify causal archive attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-causal-source
          APPROVED_CAUSAL_BUILDER_SHA: afabae61fa9b93d033410fb58af56f41ec47f60f
        run: |
          set -euo pipefail
          test -x "$TRUSTED_GH_PATH"
          mkdir -p "$PACKAGE_DIR/promotion-input"
          "$TRUSTED_GH_PATH" attestation verify "$PACKAGE_DIR/gwt1-causal-evidence.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PACKAGE_DIR/attestation/attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-causal-trusted-builder.yml" \
            --signer-digest "$APPROVED_CAUSAL_BUILDER_SHA" \
            --deny-self-hosted-runners \
            --format json \
            > "$PACKAGE_DIR/promotion-input/archive-verification.json"
          test -s "$PACKAGE_DIR/promotion-input/archive-verification.json"

      - name: Extract and verify exact causal evidence archive
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-causal-source
        run: |
          set -euo pipefail
          cat > "$PACKAGE_DIR/expected-archive-files.txt" <<'EOF'
          gwt1-causal-evidence/
          gwt1-causal-evidence/SHA256SUMS
          gwt1-causal-evidence/causal_evidence_envelope.json
          gwt1-causal-evidence/causal_observations.json
          gwt1-causal-evidence/matched_sham_observations.json
          gwt1-causal-evidence/outcome.txt
          gwt1-causal-evidence/resolution.json
          gwt1-causal-evidence/workflow_provenance.json
          EOF

          /usr/bin/tar -tzf "$PACKAGE_DIR/gwt1-causal-evidence.tar.gz" | LC_ALL=C /usr/bin/sort \
            > "$PACKAGE_DIR/observed-archive-files.txt"
          LC_ALL=C /usr/bin/sort -o "$PACKAGE_DIR/expected-archive-files.txt" \
            "$PACKAGE_DIR/expected-archive-files.txt"
          /usr/bin/diff -u "$PACKAGE_DIR/expected-archive-files.txt" \
            "$PACKAGE_DIR/observed-archive-files.txt"

          rm -rf "$PACKAGE_DIR/extracted"
          mkdir -p "$PACKAGE_DIR/extracted"
          /usr/bin/tar --no-same-owner -xzf "$PACKAGE_DIR/gwt1-causal-evidence.tar.gz" \
            -C "$PACKAGE_DIR/extracted"
          (
            cd "$PACKAGE_DIR/extracted/gwt1-causal-evidence"
            /usr/bin/sha256sum -c SHA256SUMS
          )

      - name: Install pinned Rust 1.96.0 for trusted promotion generator
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      - name: Generate non-authoritative promotion capsule from verified evidence
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/gwt1-promotion-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-promotion-target
          SYMTHAEA_GWT1_CAUSAL_EVIDENCE_DIR: ${{ runner.temp }}/gwt1-causal-source/extracted/gwt1-causal-evidence
          GWT1_CAUSAL_ARCHIVE_PATH: ${{ runner.temp }}/gwt1-causal-source/gwt1-causal-evidence.tar.gz
          GWT1_CAUSAL_ARCHIVE_ATTESTATION_BUNDLE: ${{ runner.temp }}/gwt1-causal-source/attestation/attestation.json
          GWT1_CAUSAL_ARCHIVE_ATTESTATION_VERIFICATION: ${{ runner.temp }}/gwt1-causal-source/promotion-input/archive-verification.json
          GWT1_CAUSAL_PROMOTION_OUTPUT: ${{ runner.temp }}/gwt1-causal-promotion/promotion_capsule.json
          TRUSTED_GWT1_CAUSAL_BUILDER_SHA: afabae61fa9b93d033410fb58af56f41ec47f60f
        run: |
          set -euo pipefail
          cargo run --locked -p symthaea-psych-bench \
            --features symthaea-backend \
            --bin gwt1_generate_causal_promotion_capsule
          test -s "$GWT1_CAUSAL_PROMOTION_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Record pinned attestation verifier profile
        shell: bash
        env:
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-causal-promotion
          PROMOTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.gh_binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
        run: |
          set -euo pipefail
          capsule_sha256="$(/usr/bin/sha256sum "$PROMOTION_DIR/promotion_capsule.json" | /usr/bin/awk '{print $1}')"
          /usr/bin/jq -n \
            --arg schema "butlin-gwt1-attestation-verifier-profile-v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg promotion_workflow_sha "$PROMOTION_WORKFLOW_SHA" \
            --arg verifier "github-cli" \
            --arg verifier_version "$TRUSTED_GH_VERSION" \
            --arg distribution_url "$TRUSTED_GH_ARCHIVE_URL" \
            --arg distribution_sha256 "$TRUSTED_GH_ARCHIVE_SHA256" \
            --arg executable_sha256 "$TRUSTED_GH_BINARY_SHA256" \
            --arg version_output_sha256 "$TRUSTED_GH_VERSION_OUTPUT_SHA256" \
            --arg capsule_sha256 "$capsule_sha256" \
            '{
              schema: $schema,
              repository: $repository,
              promotion_workflow_sha: $promotion_workflow_sha,
              verifier: $verifier,
              verifier_version: $verifier_version,
              distribution_url: $distribution_url,
              distribution_sha256: $distribution_sha256,
              executable_sha256: $executable_sha256,
              version_output_sha256: $version_output_sha256,
              configuration_policy: "isolated-gh-config-v1",
              deny_self_hosted_runners: true,
              capsule_sha256: $capsule_sha256
            }' > "$PROMOTION_DIR/promotion_verifier_profile.json"

      - name: Record promotion provenance
        shell: bash
        env:
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-causal-promotion
          PROMOTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PROMOTION_WORKFLOW_REF: ${{ job.workflow_ref }}
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          SOURCE_RUN_ID: ${{ inputs.causal_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.causal_run_attempt }}
          APPROVED_CAUSAL_BUILDER_SHA: afabae61fa9b93d033410fb58af56f41ec47f60f
        run: |
          set -euo pipefail
          capsule_sha256="$(/usr/bin/sha256sum "$PROMOTION_DIR/promotion_capsule.json" | /usr/bin/awk '{print $1}')"
          verifier_profile_sha256="$(/usr/bin/sha256sum "$PROMOTION_DIR/promotion_verifier_profile.json" | /usr/bin/awk '{print $1}')"
          /usr/bin/jq -n \
            --arg schema "butlin-gwt1-causal-promotion-provenance-v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg promotion_workflow_sha "$PROMOTION_WORKFLOW_SHA" \
            --arg promotion_workflow_ref "$PROMOTION_WORKFLOW_REF" \
            --arg approved_causal_builder_sha "$APPROVED_CAUSAL_BUILDER_SHA" \
            --arg evidence_subject_sha "$EVIDENCE_SUBJECT_SHA" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg capsule_sha256 "$capsule_sha256" \
            --arg verifier_profile_sha256 "$verifier_profile_sha256" \
            '{
              schema: $schema,
              repository: $repository,
              promotion_workflow_sha: $promotion_workflow_sha,
              promotion_workflow_ref: $promotion_workflow_ref,
              approved_causal_builder_sha: $approved_causal_builder_sha,
              evidence_subject_sha: $evidence_subject_sha,
              source_run_id: $source_run_id,
              source_run_attempt: $source_run_attempt,
              capsule_sha256: $capsule_sha256,
              verifier_profile_sha256: $verifier_profile_sha256
            }' > "$PROMOTION_DIR/promotion_provenance.json"
          (
            cd "$PROMOTION_DIR"
            /usr/bin/sha256sum \
              promotion_capsule.json \
              promotion_verifier_profile.json \
              promotion_provenance.json \
              > SHA256SUMS
          )

      - name: Attest exact GWT-1 causal promotion capsule
        id: promotion_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-causal-promotion/promotion_capsule.json

      - name: Attest exact promotion verifier profile
        id: verifier_profile_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-causal-promotion/promotion_verifier_profile.json

      - name: Verify and preserve promotion attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-causal-promotion
          PROMOTION_ATTESTATION_BUNDLE: ${{ steps.promotion_attest.outputs.bundle-path }}
          VERIFIER_PROFILE_ATTESTATION_BUNDLE: ${{ steps.verifier_profile_attest.outputs.bundle-path }}
          PROMOTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -x "$TRUSTED_GH_PATH"
          mkdir -p "$PROMOTION_DIR/attestation"
          test -f "$PROMOTION_ATTESTATION_BUNDLE"
          test -f "$VERIFIER_PROFILE_ATTESTATION_BUNDLE"

          cp "$PROMOTION_ATTESTATION_BUNDLE" \
            "$PROMOTION_DIR/attestation/attestation.json"
          cp "$VERIFIER_PROFILE_ATTESTATION_BUNDLE" \
            "$PROMOTION_DIR/attestation/verifier-profile-attestation.json"

          "$TRUSTED_GH_PATH" attestation verify "$PROMOTION_DIR/promotion_capsule.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROMOTION_DIR/attestation/attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-causal-trusted-promotion.yml" \
            --signer-digest "$PROMOTION_WORKFLOW_SHA" \
            --deny-self-hosted-runners \
            --format json \
            > "$PROMOTION_DIR/attestation/verification.json"

          "$TRUSTED_GH_PATH" attestation verify "$PROMOTION_DIR/promotion_verifier_profile.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROMOTION_DIR/attestation/verifier-profile-attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-causal-trusted-promotion.yml" \
            --signer-digest "$PROMOTION_WORKFLOW_SHA" \
            --deny-self-hosted-runners \
            --format json \
            > "$PROMOTION_DIR/attestation/verifier-profile-verification.json"

          /usr/bin/sha256sum "$PROMOTION_DIR/attestation/attestation.json" \
            > "$PROMOTION_DIR/attestation/attestation.json.sha256"
          /usr/bin/sha256sum "$PROMOTION_DIR/attestation/verification.json" \
            > "$PROMOTION_DIR/attestation/verification.json.sha256"
          /usr/bin/sha256sum "$PROMOTION_DIR/attestation/verifier-profile-attestation.json" \
            > "$PROMOTION_DIR/attestation/verifier-profile-attestation.json.sha256"
          /usr/bin/sha256sum "$PROMOTION_DIR/attestation/verifier-profile-verification.json" \
            > "$PROMOTION_DIR/attestation/verifier-profile-verification.json.sha256"

      - name: Upload trusted causal promotion package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gwt1-causal-promotion-attested-${{ inputs.evidence_subject_sha }}-${{ inputs.causal_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gwt1-causal-promotion/promotion_capsule.json
            ${{ runner.temp }}/gwt1-causal-promotion/promotion_verifier_profile.json
            ${{ runner.temp }}/gwt1-causal-promotion/promotion_provenance.json
            ${{ runner.temp }}/gwt1-causal-promotion/SHA256SUMS
            ${{ runner.temp }}/gwt1-causal-promotion/attestation/
          if-no-files-found: error
          retention-days: 30
