name: Butlin GWT-1 Causal Trusted Promotion

on:
  workflow_call:
    inputs:
      evidence_subject_sha:
        description: Exact evidence subject commit carried by the causal archive
        required: true
        type: string
      causal_run_id:
        description: Workflow run ID that uploaded the trusted causal evidence artifact
        required: true
        type: string
      causal_run_attempt:
        description: Workflow run attempt that uploaded the trusted causal evidence artifact
        required: true
        type: string

permissions: {}

jobs:
  promote:
    name: Verify causal archive and attest promotion capsule
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout trusted promotion revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate promotion trust-root identity
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          SOURCE_RUN_ID: ${{ inputs.causal_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.causal_run_attempt }}
          PROMOTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PROMOTION_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PROMOTION_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          test "$PROMOTION_WORKFLOW_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$PROMOTION_WORKFLOW_PATH" = ".github/workflows/butlin-gwt1-causal-trusted-promotion.yml"
          [[ "$PROMOTION_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$PROMOTION_WORKFLOW_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install exact GitHub CLI attestation verifier
        id: trusted_gh
        shell: bash
        env:
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_ROOT: ${{ runner.temp }}/gwt1-trusted-gh
          TRUSTED_GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-trusted-gh-config
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          rm -rf "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          mkdir -p "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          chmod 0700 "$TRUSTED_GH_CONFIG_DIR"
          archive="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$TRUSTED_GH_ARCHIVE_URL"
          printf '%s  %s\n' "$TRUSTED_GH_ARCHIVE_SHA256" "$archive" | /usr/bin/sha256sum -c -
          /usr/bin/tar --no-same-owner -xzf "$archive" -C "$TRUSTED_GH_ROOT"
          gh_path="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64/bin/gh"
          test -x "$gh_path"
          version_output="$($gh_path --version)"
          test "$(printf '%s\n' "$version_output" | /usr/bin/awk 'NR==1{print $3}')" = "$TRUSTED_GH_VERSION"
          gh_binary_sha256="$(/usr/bin/sha256sum "$gh_path" | /usr/bin/awk '{print $1}')"
          version_output_sha256="$(printf '%s' "$version_output" | /usr/bin/sha256sum | /usr/bin/awk '{print $1}')"
          echo "gh_path=$gh_path" >> "$GITHUB_OUTPUT"
          echo "gh_binary_sha256=$gh_binary_sha256" >> "$GITHUB_OUTPUT"
          echo "version_output_sha256=$version_output_sha256" >> "$GITHUB_OUTPUT"

      - name: Download trusted causal evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gwt1-causal-trusted-attested-${{ inputs.evidence_subject_sha }}-${{ inputs.causal_run_id }}-${{ inputs.causal_run_attempt }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.causal_run_id }}
          path: ${{ runner.temp }}/gwt1-causal-source

      - name: Verify downloaded causal package structure and portable checksums
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-causal-source
        run: |
          set -euo pipefail
          required=(
            gwt1-causal-evidence.tar.gz
            gwt1-causal-evidence.tar.gz.sha256
            archive_admission.json
            archive_admission_profile.json
            archive_admission_engine.py
            causal_builder_verifier_profile.json
            causal_builder_verifier_profile.json.sha256
            attestation/attestation.json
            attestation/attestation.json.sha256
            attestation/verification.json
            attestation/verification.json.sha256
            attestation/verifier-profile-attestation.json
            attestation/verifier-profile-attestation.json.sha256
            attestation/verifier-profile-verification.json
            attestation/verifier-profile-verification.json.sha256
          )
          for path in "${required[@]}"; do test -f "$PACKAGE_DIR/$path"; done
          (cd "$PACKAGE_DIR" && /usr/bin/sha256sum -c gwt1-causal-evidence.tar.gz.sha256 && /usr/bin/sha256sum -c causal_builder_verifier_profile.json.sha256)
          (
            cd "$PACKAGE_DIR/attestation"
            /usr/bin/sha256sum -c attestation.json.sha256
            /usr/bin/sha256sum -c verification.json.sha256
            /usr/bin/sha256sum -c verifier-profile-attestation.json.sha256
            /usr/bin/sha256sum -c verifier-profile-verification.json.sha256
          )

      - name: Freshly verify causal archive and builder-verifier attestations
        id: upstream_verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-causal-source
          APPROVED_CAUSAL_BUILDER_SHA: 726d2be515e52eeff6c3f32a137e42a2648e35c7
        run: |
          set -euo pipefail
          test -x "$TRUSTED_GH_PATH"
          unset GH_HOST GH_ENTERPRISE_TOKEN
          mkdir -p "$PACKAGE_DIR/promotion-input"
          "$TRUSTED_GH_PATH" attestation verify "$PACKAGE_DIR/gwt1-causal-evidence.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --bundle "$PACKAGE_DIR/attestation/attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-causal-trusted-builder.yml" \
            --signer-digest "$APPROVED_CAUSAL_BUILDER_SHA" --deny-self-hosted-runners --format json > "$PACKAGE_DIR/promotion-input/archive-verification.json"
          "$TRUSTED_GH_PATH" attestation verify "$PACKAGE_DIR/causal_builder_verifier_profile.json" --repo "$GITHUB_REPOSITORY" \
            --bundle "$PACKAGE_DIR/attestation/verifier-profile-attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-causal-trusted-builder.yml" \
            --signer-digest "$APPROVED_CAUSAL_BUILDER_SHA" --deny-self-hosted-runners --format json > "$PACKAGE_DIR/promotion-input/builder-verifier-profile-verification.json"
          test -s "$PACKAGE_DIR/promotion-input/archive-verification.json"
          test -s "$PACKAGE_DIR/promotion-input/builder-verifier-profile-verification.json"
          echo "archive_verification_sha256=$(/usr/bin/sha256sum "$PACKAGE_DIR/promotion-input/archive-verification.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "builder_profile_verification_sha256=$(/usr/bin/sha256sum "$PACKAGE_DIR/promotion-input/builder-verifier-profile-verification.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Validate causal builder verifier profile and preserved admission evidence
        id: upstream_profile
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-causal-source
          TRUSTED_ENGINE: ${{ github.workspace }}/.github/scripts/evidence_archive_admission.py
          TRUSTED_PROFILE: ${{ github.workspace }}/.github/evidence-profiles/gwt1-causal-evidence-v1.json
          APPROVED_CAUSAL_BUILDER_SHA: 726d2be515e52eeff6c3f32a137e42a2648e35c7
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
        run: |
          set -euo pipefail
          archive_sha256="$(/usr/bin/sha256sum "$PACKAGE_DIR/gwt1-causal-evidence.tar.gz" | /usr/bin/awk '{print $1}')"
          trusted_engine_sha256="$(/usr/bin/sha256sum "$TRUSTED_ENGINE" | /usr/bin/awk '{print $1}')"
          trusted_profile_sha256="$(/usr/bin/sha256sum "$TRUSTED_PROFILE" | /usr/bin/awk '{print $1}')"
          preserved_engine_sha256="$(/usr/bin/sha256sum "$PACKAGE_DIR/archive_admission_engine.py" | /usr/bin/awk '{print $1}')"
          preserved_profile_sha256="$(/usr/bin/sha256sum "$PACKAGE_DIR/archive_admission_profile.json" | /usr/bin/awk '{print $1}')"
          preserved_result_sha256="$(/usr/bin/sha256sum "$PACKAGE_DIR/archive_admission.json" | /usr/bin/awk '{print $1}')"
          test "$trusted_engine_sha256" = "$preserved_engine_sha256"
          test "$trusted_profile_sha256" = "$preserved_profile_sha256"
          /usr/bin/cmp -s "$TRUSTED_ENGINE" "$PACKAGE_DIR/archive_admission_engine.py"
          /usr/bin/cmp -s "$TRUSTED_PROFILE" "$PACKAGE_DIR/archive_admission_profile.json"
          /usr/bin/jq -e --arg repository "$GITHUB_REPOSITORY" --arg builder_sha "$APPROVED_CAUSAL_BUILDER_SHA" \
            --arg distribution_sha256 "$TRUSTED_GH_ARCHIVE_SHA256" --arg archive_sha256 "$archive_sha256" --arg engine_sha256 "$trusted_engine_sha256" \
            --arg profile_sha256 "$trusted_profile_sha256" --arg result_sha256 "$preserved_result_sha256" \
            '.schema=="butlin-gwt1-causal-builder-verifier-profile-v1" and .repository==$repository and .trusted_builder_sha==$builder_sha and .verifier=="github-cli" and .verifier_version=="2.100.0" and .distribution_sha256==$distribution_sha256 and .configuration_policy=="isolated-gh-config-v1" and .archive_admission_profile_id=="gwt1-causal-evidence-archive-v1" and .archive_admission_engine_sha256==$engine_sha256 and .archive_admission_profile_sha256==$profile_sha256 and .archive_admission_result_sha256==$result_sha256 and .deny_self_hosted_runners==true and .evidence_archive_sha256==$archive_sha256' \
            "$PACKAGE_DIR/causal_builder_verifier_profile.json" >/dev/null
          /usr/bin/jq -e --arg archive_sha256 "$archive_sha256" \
            '.schema=="butlin-evidence-archive-admission-result-v1" and .profile_id=="gwt1-causal-evidence-archive-v1" and .archive_sha256==$archive_sha256 and .archive_bytes>0 and .tar_stream_bytes>0 and .member_count==8 and .total_unpacked_bytes>0' \
            "$PACKAGE_DIR/archive_admission.json" >/dev/null
          echo "builder_profile_sha256=$(/usr/bin/sha256sum "$PACKAGE_DIR/causal_builder_verifier_profile.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Re-admit exact causal archive under promotion authority
        id: promotion_admission
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/gwt1-causal-source
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-causal-promotion
          ADMISSION_ENGINE: ${{ github.workspace }}/.github/scripts/evidence_archive_admission.py
          ADMISSION_PROFILE: ${{ github.workspace }}/.github/evidence-profiles/gwt1-causal-evidence-v1.json
        run: |
          set -euo pipefail
          mkdir -p "$PROMOTION_DIR" "$PROMOTION_DIR/upstream"
          rm -rf "$PACKAGE_DIR/promotion-input/extracted"
          mkdir -p "$PACKAGE_DIR/promotion-input/extracted"
          /usr/bin/python3 "$ADMISSION_ENGINE" --profile "$ADMISSION_PROFILE" --archive "$PACKAGE_DIR/gwt1-causal-evidence.tar.gz" \
            --output-dir "$PACKAGE_DIR/promotion-input/extracted" > "$PACKAGE_DIR/promotion-input/archive-admission.json"
          archive_sha256="$(/usr/bin/sha256sum "$PACKAGE_DIR/gwt1-causal-evidence.tar.gz" | /usr/bin/awk '{print $1}')"
          engine_sha256="$(/usr/bin/sha256sum "$ADMISSION_ENGINE" | /usr/bin/awk '{print $1}')"
          profile_sha256="$(/usr/bin/sha256sum "$ADMISSION_PROFILE" | /usr/bin/awk '{print $1}')"
          admission_result_sha256="$(/usr/bin/sha256sum "$PACKAGE_DIR/promotion-input/archive-admission.json" | /usr/bin/awk '{print $1}')"
          /usr/bin/jq -e --arg archive_sha256 "$archive_sha256" \
            '.schema=="butlin-evidence-archive-admission-result-v1" and .profile_id=="gwt1-causal-evidence-archive-v1" and .archive_sha256==$archive_sha256 and .archive_bytes>0 and .tar_stream_bytes>0 and .member_count==8 and .total_unpacked_bytes>0' \
            "$PACKAGE_DIR/promotion-input/archive-admission.json" >/dev/null
          (cd "$PACKAGE_DIR/promotion-input/extracted/gwt1-causal-evidence" && /usr/bin/sha256sum -c SHA256SUMS)
          /usr/bin/install -m 0644 "$ADMISSION_ENGINE" "$PROMOTION_DIR/archive_admission_engine.py"
          /usr/bin/install -m 0644 "$ADMISSION_PROFILE" "$PROMOTION_DIR/archive_admission_profile.json"
          /usr/bin/install -m 0644 "$PACKAGE_DIR/promotion-input/archive-admission.json" "$PROMOTION_DIR/archive_admission.json"
          /usr/bin/install -m 0644 "$PACKAGE_DIR/causal_builder_verifier_profile.json" "$PROMOTION_DIR/upstream/causal_builder_verifier_profile.json"
          /usr/bin/install -m 0644 "$PACKAGE_DIR/promotion-input/builder-verifier-profile-verification.json" "$PROMOTION_DIR/upstream/causal_builder_verifier_profile_verification.json"
          /usr/bin/install -m 0644 "$PACKAGE_DIR/promotion-input/archive-verification.json" "$PROMOTION_DIR/upstream/causal_archive_verification.json"
          /usr/bin/install -m 0644 "$PACKAGE_DIR/archive_admission.json" "$PROMOTION_DIR/upstream/causal_builder_archive_admission.json"
          /usr/bin/install -m 0644 "$PACKAGE_DIR/archive_admission_profile.json" "$PROMOTION_DIR/upstream/causal_builder_archive_admission_profile.json"
          /usr/bin/install -m 0644 "$PACKAGE_DIR/archive_admission_engine.py" "$PROMOTION_DIR/upstream/causal_builder_archive_admission_engine.py"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "engine_sha256=$engine_sha256" >> "$GITHUB_OUTPUT"
          echo "profile_sha256=$profile_sha256" >> "$GITHUB_OUTPUT"
          echo "result_sha256=$admission_result_sha256" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust 1.96.0 for trusted promotion generator
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      - name: Generate non-authoritative promotion capsule from verified evidence
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/gwt1-promotion-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-promotion-target
          SYMTHAEA_GWT1_CAUSAL_EVIDENCE_DIR: ${{ runner.temp }}/gwt1-causal-source/promotion-input/extracted/gwt1-causal-evidence
          GWT1_CAUSAL_ARCHIVE_PATH: ${{ runner.temp }}/gwt1-causal-source/gwt1-causal-evidence.tar.gz
          GWT1_CAUSAL_ARCHIVE_ATTESTATION_BUNDLE: ${{ runner.temp }}/gwt1-causal-source/attestation/attestation.json
          GWT1_CAUSAL_ARCHIVE_ATTESTATION_VERIFICATION: ${{ runner.temp }}/gwt1-causal-source/promotion-input/archive-verification.json
          GWT1_CAUSAL_PROMOTION_OUTPUT: ${{ runner.temp }}/gwt1-causal-promotion/promotion_capsule.json
          TRUSTED_GWT1_CAUSAL_BUILDER_SHA: 726d2be515e52eeff6c3f32a137e42a2648e35c7
        run: |
          set -euo pipefail
          cargo run --locked -p symthaea-psych-bench --features symthaea-backend --bin gwt1_generate_causal_promotion_capsule
          test -s "$GWT1_CAUSAL_PROMOTION_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Record pinned promotion verifier profile
        shell: bash
        env:
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-causal-promotion
          PROMOTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.gh_binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
          CAUSAL_ARCHIVE_SHA256: ${{ steps.promotion_admission.outputs.archive_sha256 }}
          ADMISSION_ENGINE_SHA256: ${{ steps.promotion_admission.outputs.engine_sha256 }}
          ADMISSION_PROFILE_SHA256: ${{ steps.promotion_admission.outputs.profile_sha256 }}
          ADMISSION_RESULT_SHA256: ${{ steps.promotion_admission.outputs.result_sha256 }}
          UPSTREAM_BUILDER_PROFILE_SHA256: ${{ steps.upstream_profile.outputs.builder_profile_sha256 }}
          UPSTREAM_BUILDER_PROFILE_VERIFICATION_SHA256: ${{ steps.upstream_verify.outputs.builder_profile_verification_sha256 }}
          ARCHIVE_VERIFICATION_SHA256: ${{ steps.upstream_verify.outputs.archive_verification_sha256 }}
        run: |
          set -euo pipefail
          capsule_sha256="$(/usr/bin/sha256sum "$PROMOTION_DIR/promotion_capsule.json" | /usr/bin/awk '{print $1}')"
          /usr/bin/jq -n --arg schema "butlin-gwt1-attestation-verifier-profile-v2" --arg repository "$GITHUB_REPOSITORY" --arg promotion_workflow_sha "$PROMOTION_WORKFLOW_SHA" \
            --arg verifier github-cli --arg verifier_version "$TRUSTED_GH_VERSION" --arg distribution_url "$TRUSTED_GH_ARCHIVE_URL" --arg distribution_sha256 "$TRUSTED_GH_ARCHIVE_SHA256" \
            --arg executable_sha256 "$TRUSTED_GH_BINARY_SHA256" --arg version_output_sha256 "$TRUSTED_GH_VERSION_OUTPUT_SHA256" --arg archive_admission_profile_id gwt1-causal-evidence-archive-v1 \
            --arg archive_admission_engine_sha256 "$ADMISSION_ENGINE_SHA256" --arg archive_admission_profile_sha256 "$ADMISSION_PROFILE_SHA256" --arg archive_admission_result_sha256 "$ADMISSION_RESULT_SHA256" \
            --arg causal_archive_sha256 "$CAUSAL_ARCHIVE_SHA256" --arg causal_archive_verification_sha256 "$ARCHIVE_VERIFICATION_SHA256" --arg upstream_builder_profile_sha256 "$UPSTREAM_BUILDER_PROFILE_SHA256" \
            --arg upstream_builder_profile_verification_sha256 "$UPSTREAM_BUILDER_PROFILE_VERIFICATION_SHA256" --arg capsule_sha256 "$capsule_sha256" \
            '{schema:$schema,repository:$repository,promotion_workflow_sha:$promotion_workflow_sha,verifier:$verifier,verifier_version:$verifier_version,distribution_url:$distribution_url,distribution_sha256:$distribution_sha256,executable_sha256:$executable_sha256,version_output_sha256:$version_output_sha256,configuration_policy:"isolated-gh-config-v1",archive_admission_profile_id:$archive_admission_profile_id,archive_admission_engine_sha256:$archive_admission_engine_sha256,archive_admission_profile_sha256:$archive_admission_profile_sha256,archive_admission_result_sha256:$archive_admission_result_sha256,causal_archive_sha256:$causal_archive_sha256,causal_archive_verification_sha256:$causal_archive_verification_sha256,upstream_builder_profile_sha256:$upstream_builder_profile_sha256,upstream_builder_profile_verification_sha256:$upstream_builder_profile_verification_sha256,deny_self_hosted_runners:true,capsule_sha256:$capsule_sha256}' \
            > "$PROMOTION_DIR/promotion_verifier_profile.json"

      - name: Record promotion provenance and deterministic checksums
        shell: bash
        env:
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-causal-promotion
          PROMOTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PROMOTION_WORKFLOW_REF: ${{ job.workflow_ref }}
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          SOURCE_RUN_ID: ${{ inputs.causal_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.causal_run_attempt }}
          APPROVED_CAUSAL_BUILDER_SHA: 726d2be515e52eeff6c3f32a137e42a2648e35c7
        run: |
          set -euo pipefail
          capsule_sha256="$(/usr/bin/sha256sum "$PROMOTION_DIR/promotion_capsule.json" | /usr/bin/awk '{print $1}')"
          verifier_profile_sha256="$(/usr/bin/sha256sum "$PROMOTION_DIR/promotion_verifier_profile.json" | /usr/bin/awk '{print $1}')"
          upstream_builder_profile_sha256="$(/usr/bin/sha256sum "$PROMOTION_DIR/upstream/causal_builder_verifier_profile.json" | /usr/bin/awk '{print $1}')"
          /usr/bin/jq -n --arg schema "butlin-gwt1-causal-promotion-provenance-v2" --arg repository "$GITHUB_REPOSITORY" --arg promotion_workflow_sha "$PROMOTION_WORKFLOW_SHA" \
            --arg promotion_workflow_ref "$PROMOTION_WORKFLOW_REF" --arg approved_causal_builder_sha "$APPROVED_CAUSAL_BUILDER_SHA" --arg evidence_subject_sha "$EVIDENCE_SUBJECT_SHA" \
            --arg source_run_id "$SOURCE_RUN_ID" --arg source_run_attempt "$SOURCE_RUN_ATTEMPT" --arg capsule_sha256 "$capsule_sha256" --arg verifier_profile_sha256 "$verifier_profile_sha256" \
            --arg upstream_builder_profile_sha256 "$upstream_builder_profile_sha256" \
            '{schema:$schema,repository:$repository,promotion_workflow_sha:$promotion_workflow_sha,promotion_workflow_ref:$promotion_workflow_ref,approved_causal_builder_sha:$approved_causal_builder_sha,evidence_subject_sha:$evidence_subject_sha,source_run_id:$source_run_id,source_run_attempt:$source_run_attempt,capsule_sha256:$capsule_sha256,verifier_profile_sha256:$verifier_profile_sha256,upstream_builder_profile_sha256:$upstream_builder_profile_sha256}' \
            > "$PROMOTION_DIR/promotion_provenance.json"
          (
            cd "$PROMOTION_DIR"
            find . -type f ! -path './attestation/*' ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z | xargs -0 /usr/bin/sha256sum > SHA256SUMS
          )

      - name: Attest exact GWT-1 causal promotion capsule
        id: promotion_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-causal-promotion/promotion_capsule.json

      - name: Attest exact promotion verifier profile
        id: verifier_profile_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-causal-promotion/promotion_verifier_profile.json

      - name: Verify and preserve promotion attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-causal-promotion
          PROMOTION_ATTESTATION_BUNDLE: ${{ steps.promotion_attest.outputs.bundle-path }}
          VERIFIER_PROFILE_ATTESTATION_BUNDLE: ${{ steps.verifier_profile_attest.outputs.bundle-path }}
          PROMOTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -x "$TRUSTED_GH_PATH"
          unset GH_HOST GH_ENTERPRISE_TOKEN
          mkdir -p "$PROMOTION_DIR/attestation"
          cp "$PROMOTION_ATTESTATION_BUNDLE" "$PROMOTION_DIR/attestation/attestation.json"
          cp "$VERIFIER_PROFILE_ATTESTATION_BUNDLE" "$PROMOTION_DIR/attestation/verifier-profile-attestation.json"
          "$TRUSTED_GH_PATH" attestation verify "$PROMOTION_DIR/promotion_capsule.json" --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROMOTION_DIR/attestation/attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-causal-trusted-promotion.yml" \
            --signer-digest "$PROMOTION_WORKFLOW_SHA" --deny-self-hosted-runners --format json > "$PROMOTION_DIR/attestation/verification.json"
          "$TRUSTED_GH_PATH" attestation verify "$PROMOTION_DIR/promotion_verifier_profile.json" --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROMOTION_DIR/attestation/verifier-profile-attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-causal-trusted-promotion.yml" \
            --signer-digest "$PROMOTION_WORKFLOW_SHA" --deny-self-hosted-runners --format json > "$PROMOTION_DIR/attestation/verifier-profile-verification.json"
          (
            cd "$PROMOTION_DIR/attestation"
            /usr/bin/sha256sum attestation.json > attestation.json.sha256
            /usr/bin/sha256sum verification.json > verification.json.sha256
            /usr/bin/sha256sum verifier-profile-attestation.json > verifier-profile-attestation.json.sha256
            /usr/bin/sha256sum verifier-profile-verification.json > verifier-profile-verification.json.sha256
          )

      - name: Upload trusted causal promotion package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gwt1-causal-promotion-attested-${{ inputs.evidence_subject_sha }}-${{ inputs.causal_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gwt1-causal-promotion/
          if-no-files-found: error
          retention-days: 30
