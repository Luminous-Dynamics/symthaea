name: DE-001A2R Parameter Role Qualification

on:
  workflow_dispatch:
    inputs:
      environment_run_id:
        description: Exact successful DE-001A environment-v3 qualification run ID
        required: true
        type: string
  workflow_call:
    inputs:
      environment_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: de001a-a2r-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: A2R exact parameter-role qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUBJECT_HEAD: ${{ github.sha }}
      ENVIRONMENT_RUN_ID: ${{ inputs.environment_run_id }}

    steps:
      - name: Check out exact A2R subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SUBJECT_HEAD }}
          fetch-depth: 0

      - name: Bind subject identity and paths
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$head" = "$SUBJECT_HEAD"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

          echo "EVIDENCE_DIR=$RUNNER_TEMP/de001a-a2r-evidence" >> "$GITHUB_ENV"
          echo "UPSTREAM_ENV=$RUNNER_TEMP/de001a-upstream-environment" >> "$GITHUB_ENV"
          echo "A0_LINK=$RUNNER_TEMP/de001a-a0-artifacts" >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/de001a-a2r-evidence" \
            "$RUNNER_TEMP/de001a-upstream-environment"

      - name: Download exact environment-v3 evidence run
        id: download_environment
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: de001a-environment-receipt-*
          path: ${{ runner.temp }}/de001a-upstream-environment
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.environment_run_id }}

      - name: Verify explicit environment run identity
        id: upstream
        if: steps.download_environment.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ENVIRONMENT_RUN_ID" in (*[!0-9]*|'') exit 2;; esac

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ENVIRONMENT_RUN_ID" \
            > "$EVIDENCE_DIR/environment-run.json"

          python3 - \
            "$EVIDENCE_DIR/environment-run.json" \
            "$ENVIRONMENT_RUN_ID" <<'PY'
          import json, sys
          path, expected = sys.argv[1:]
          value = json.load(open(path, encoding="utf-8"))
          assert str(value["id"]) == expected
          assert value["status"] == "completed"
          assert value["conclusion"] == "success"
          PY

          test -f "$UPSTREAM_ENV/de001a-environment-receipt.txt"
          test -f "$UPSTREAM_ENV/de001a-environment-versions.json"
          grep -Fx "workflow_run_id=$ENVIRONMENT_RUN_ID" \
            "$UPSTREAM_ENV/de001a-environment-receipt.txt"
          grep -Fx "verdict=PASS" \
            "$UPSTREAM_ENV/de001a-environment-receipt.txt"

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d
        with:
          components: rustfmt, clippy

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          extra_nix_config: |
            sandbox = true
            experimental-features = nix-command flakes

      - name: Qualify A2R software subject
        id: software
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rustc --version | grep -E '^rustc 1\.96\.0 '
          nix --version | grep -Fx 'nix (Nix) 2.34.7'
          cargo fmt -p symthaea-cosmology-research -- --check
          cargo check -p symthaea-cosmology-research --all-targets --locked
          cargo test -p symthaea-cosmology-research --all-targets --locked
          cargo clippy -p symthaea-cosmology-research --all-targets --locked -- -D warnings
          cargo build -p symthaea-cosmology-research \
            --bin de001a-a0-verify \
            --bin de001a-a1e-environment \
            --release --locked
          test -x target/release/de001a-a0-verify
          test -x target/release/de001a-a1e-environment
          sha256sum target/release/de001a-a0-verify \
            > "$EVIDENCE_DIR/de001a-a0-verify.sha256"
          sha256sum target/release/de001a-a1e-environment \
            > "$EVIDENCE_DIR/de001a-a1e-environment.sha256"
          sha256sum \
            crates/domains/symthaea-cosmology-research/scripts/de001a_a2r_parameter_roles.py \
            > "$EVIDENCE_DIR/de001a_a2r_parameter_roles.py.sha256"
          sha256sum Cargo.lock > "$EVIDENCE_DIR/Cargo.lock.sha256"

      - name: Requalify reusable numerical environment
        id: a1e
        if: steps.upstream.outcome == 'success' && steps.software.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target/release/de001a-a1e-environment \
            "$UPSTREAM_ENV/de001a-environment-receipt.txt" \
            "$UPSTREAM_ENV/de001a-environment-versions.json" \
            > "$EVIDENCE_DIR/a1e.json"
          python3 - "$EVIDENCE_DIR/a1e.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["protocol"] == "DE-001A1E-ENVIRONMENT-EVIDENCE-v1"
          assert value["verdict"] == "PASS"
          assert value["environment_reuse_authorized"] is True
          assert value["a1c_execution_authorized"] is False
          PY

      - name: Realize exact A0 fixed-output artifacts
        id: a0_artifacts
        if: steps.a1e.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          FLAKE=./crates/domains/symthaea-cosmology-research/nix
          nix build "$FLAKE#checks.x86_64-linux.a0-artifacts" \
            --no-update-lock-file --no-link
          nix build "$FLAKE#a0-artifacts" \
            --no-update-lock-file --out-link "$A0_LINK"
          store_path="$(realpath "$A0_LINK")"
          nar_hash="$(nix hash path "$store_path")"
          closure_size="$(nix path-info -S "$store_path" | awk '{print $2}')"
          printf '%s\n' "$store_path" > "$EVIDENCE_DIR/a0-store-path.txt"
          printf '%s\n' "$nar_hash" > "$EVIDENCE_DIR/a0-nar-hash.txt"
          printf '%s\n' "$closure_size" > "$EVIDENCE_DIR/a0-closure-size.txt"

      - name: Produce fresh A0 byte-integrity receipt
        id: a0
        if: steps.a0_artifacts.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=crates/domains/symthaea-cosmology-research/references/de001a_a0_artifacts_v1.json
          target/release/de001a-a0-verify \
            "$MANIFEST" \
            "dataset-mean=$A0_LINK/dataset-mean" \
            "dataset-covariance=$A0_LINK/dataset-covariance" \
            "likelihood-definition=$A0_LINK/likelihood-definition" \
            "reference-input-configuration=$A0_LINK/reference-input-configuration" \
            "reference-expanded-configuration=$A0_LINK/reference-expanded-configuration" \
            "reference-minimizer-configuration=$A0_LINK/reference-minimizer-configuration" \
            "reference-bestfit-text=$A0_LINK/reference-bestfit-text" \
            "reference-bestfit-getdist=$A0_LINK/reference-bestfit-getdist" \
            > "$EVIDENCE_DIR/a0.json"
          python3 - "$EVIDENCE_DIR/a0.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["protocol"] == "DE-001A0-BYTE-INTEGRITY-v1"
          assert value["verdict"] == "PASS"
          assert value["scientific_claim"] == "NONE"
          assert not value["errors"]
          PY

      - name: Bind exact DESI optimizer parameter roles
        id: a2r
        if: steps.a0.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          env_path="$(python3 - "$EVIDENCE_DIR/a1e.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          print(value["realized_environment_store_path"])
          PY
          )"
          test -x "$env_path/bin/python"

          "$env_path/bin/python" \
            crates/domains/symthaea-cosmology-research/scripts/de001a_a2r_parameter_roles.py \
            "$EVIDENCE_DIR/a0.json" \
            "$A0_LINK/reference-input-configuration" \
            "$A0_LINK/reference-expanded-configuration" \
            "$A0_LINK/reference-minimizer-configuration" \
            "$A0_LINK/reference-bestfit-text" \
            > "$EVIDENCE_DIR/a2r.json"

          python3 - "$EVIDENCE_DIR/a2r.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["protocol"] == "DE-001A2R-PARAMETER-ROLE-BINDING-v1"
          assert value["verdict"] == "PASS"
          assert value["scientific_claim"] == "NONE"
          assert value["authority"] == "optimizer-parameter-role-binding-only"
          assert value["a2_execution_authorized"] is False
          sampled = value["sampled_coordinate_order"]
          assert isinstance(sampled, list) and sampled
          assert list(value["sampled_bestfit_target"]) == sampled
          PY

      - name: Postflight immutability
        id: postflight
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.head }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ steps.subject.outputs.tree }}"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Write A2R qualification capsule
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          hash_or_unavailable() {
            if [[ -f "$1" ]]; then
              sha256sum "$1" | awk '{print $1}'
            else
              printf '%s' 'UNAVAILABLE'
            fi
          }
          text_or_unavailable() {
            if [[ -f "$1" ]]; then
              tr -d '\n' < "$1"
            else
              printf '%s' 'UNAVAILABLE'
            fi
          }

          cat > "$EVIDENCE_DIR/qualification-capsule.json" <<EOF
          {
            "protocol": "DE-001A2R-QUALIFICATION-CAPSULE-v1",
            "scientific_claim": "NONE",
            "authority": "optimizer-parameter-role-binding-only",
            "a2_execution_authorized": false,
            "subject_head": "${{ steps.subject.outputs.head }}",
            "subject_tree": "${{ steps.subject.outputs.tree }}",
            "environment_run_id": "$ENVIRONMENT_RUN_ID",
            "workflow": {
              "run_id": "${GITHUB_RUN_ID}",
              "attempt": "${GITHUB_RUN_ATTEMPT}",
              "download_environment_outcome": "${{ steps.download_environment.outcome }}",
              "upstream_outcome": "${{ steps.upstream.outcome }}",
              "software_outcome": "${{ steps.software.outcome }}",
              "a1e_outcome": "${{ steps.a1e.outcome }}",
              "a0_artifacts_outcome": "${{ steps.a0_artifacts.outcome }}",
              "a0_outcome": "${{ steps.a0.outcome }}",
              "a2r_outcome": "${{ steps.a2r.outcome }}",
              "postflight_outcome": "${{ steps.postflight.outcome }}"
            },
            "receipt_sha256": {
              "environment_v3": "$(hash_or_unavailable "$UPSTREAM_ENV/de001a-environment-receipt.txt")",
              "environment_versions": "$(hash_or_unavailable "$UPSTREAM_ENV/de001a-environment-versions.json")",
              "a1e": "$(hash_or_unavailable "$EVIDENCE_DIR/a1e.json")",
              "a0": "$(hash_or_unavailable "$EVIDENCE_DIR/a0.json")",
              "a2r": "$(hash_or_unavailable "$EVIDENCE_DIR/a2r.json")"
            },
            "implementation_sha256": {
              "a2r_script": "$(hash_or_unavailable crates/domains/symthaea-cosmology-research/scripts/de001a_a2r_parameter_roles.py)",
              "a2r_spec": "$(hash_or_unavailable crates/domains/symthaea-cosmology-research/references/de001a_a2r_parameter_roles_v1.json)",
              "cargo_lock": "$(hash_or_unavailable Cargo.lock)"
            },
            "a0_artifact_store": {
              "path": "$(text_or_unavailable "$EVIDENCE_DIR/a0-store-path.txt")",
              "nar_hash": "$(text_or_unavailable "$EVIDENCE_DIR/a0-nar-hash.txt")",
              "closure_size": "$(text_or_unavailable "$EVIDENCE_DIR/a0-closure-size.txt")"
            }
          }
          EOF
          cat "$EVIDENCE_DIR/qualification-capsule.json"

      - name: Upload A2R qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: de001a-a2r-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/de001a-a2r-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Enforce valid A2R qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.download_environment.outcome }}" = "success"
          test "${{ steps.upstream.outcome }}" = "success"
          test "${{ steps.software.outcome }}" = "success"
          test "${{ steps.a1e.outcome }}" = "success"
          test "${{ steps.a0_artifacts.outcome }}" = "success"
          test "${{ steps.a0.outcome }}" = "success"
          test "${{ steps.a2r.outcome }}" = "success"
          test "${{ steps.postflight.outcome }}" = "success"
