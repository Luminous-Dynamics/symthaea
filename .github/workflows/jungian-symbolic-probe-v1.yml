name: JUNG-001C deterministic baseline capture

on:
  pull_request:
    paths:
      - 'docs/research/JUNGIAN_SYMBOLIC_PROBE_V1.md'
      - 'docs/research/data/jungian_symbolic_probe_v1.json'
      - 'scripts/validate_jungian_symbolic_probe.py'
      - 'scripts/run_jungian_symbolic_baselines.py'
      - '.github/workflows/jungian-symbolic-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source lineage and complete diff scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=b9af191f380d635f0459b24284c1d1fd6a5516aa
          git merge-base --is-ancestor "$BASE" HEAD
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/jungian-symbolic-probe-v1.yml' 'docs/research/JUNGIAN_SYMBOLIC_PROBE_V1.md' 'docs/research/data/jungian_symbolic_probe_v1.json' 'scripts/run_jungian_symbolic_baselines.py' 'scripts/validate_jungian_symbolic_probe.py' | sort)"
          test "$actual" = "$expected"

      - name: Capture exact runtime and source identities
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)"
          echo "python_path=$(command -v python3)"
          python3 --version
          python3 - <<'PY'
          import hashlib, pathlib, platform, sys
          p = pathlib.Path("docs/research/data/jungian_symbolic_probe_v1.json")
          r = pathlib.Path("scripts/run_jungian_symbolic_baselines.py")
          print("python_implementation=" + platform.python_implementation())
          print("python_version_full=" + sys.version.replace("\n", " "))
          print("corpus_sha256=" + hashlib.sha256(p.read_bytes()).hexdigest())
          print("runner_sha256=" + hashlib.sha256(r.read_bytes()).hexdigest())
          PY

      - name: Validate the frozen corpus and validator mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_jungian_symbolic_probe.py --self-test

      - name: Run deterministic lexical and context-rule baselines
        id: baselines
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/jungian-baseline-capture"
          mkdir -p "$OUT"
          SOURCE_REVISION="$(git rev-parse HEAD)"
          python3 scripts/run_jungian_symbolic_baselines.py \
            --output-dir "$OUT" \
            --source-revision "$SOURCE_REVISION"
          python3 scripts/validate_jungian_symbolic_probe.py --results "$OUT/keyword_dictionary_foil_v0.normalized.json"
          python3 scripts/validate_jungian_symbolic_probe.py --results "$OUT/context_guardrails_rules_v0.normalized.json"
          sha256sum "$OUT"/*.json
          echo "output_dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Add rubric summary to the workflow run
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/jungian-baseline-capture/baseline_comparison.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          lines = [
              "# JUNG-001C baseline capture",
              "",
              f"- Corpus: `{data['corpus_id']} v{data['corpus_version']}`",
              f"- Split: `{data['corpus_split']}` (exposed development only)",
              f"- Corpus SHA-256: `{data['corpus_sha256']}`",
              f"- Runner SHA-256: `{data['runner_sha256']}`",
              f"- Source revision: `{data['source_revision']}`",
              "",
              "| Baseline | Required-code recall | Required hits | Forbidden flags matching rubric | Cases passing authored rubric | State |",
              "|---|---:|---:|---:|---:|---|",
          ]
          for item in data["methods"]:
              if item["state"] != "executed":
                  lines.append(f"| {item['method_id']} | — | — | — | — | NOT RUN: adapter absent |")
                  continue
              s = item["summary"]
              lines.append(
                  f"| {item['method_id']} | {s['required_code_recall']:.3f} | "
                  f"{s['required_code_hits']}/{s['required_code_total']} | {s['forbidden_code_hits']} | "
                  f"{s['rubric_case_pass_count']}/14 | executed |"
              )
          lines.extend([
              "",
              "> These are hand-authored rubric-agreement diagnostics on exposed synthetic development cases. They are not psychological truth, independent human evaluation, holdout performance, or evidence that the Glyph/HDC model works.",
              "",
          ])
          with open(sys.argv[2], "a", encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY

      - name: Upload reproducibility packet
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jungian-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.baselines.outputs.output_dir }}/*.json
          if-no-files-found: error
          retention-days: 14
