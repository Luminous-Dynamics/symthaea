name: CMAQ-031 anytime-valid calibration monitor

on:
  push:
    branches:
      - research/cmaq-031-anytime-valid-calibration-monitor-v0-1-20261127
    paths:
      - "research/cmaq-031/**"
      - ".github/workflows/cmaq-031.yml"
  pull_request:
    paths:
      - "research/cmaq-031/**"
      - ".github/workflows/cmaq-031.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anytime-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: research/cmaq-031
        run: cargo +1.100.0 fmt --all -- --check
      - name: Run deterministic monitor tests
        working-directory: research/cmaq-031
        run: cargo +1.100.0 test --locked
      - name: Strict Clippy
        working-directory: research/cmaq-031
        run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings
