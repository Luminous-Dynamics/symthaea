name: Simulation Sealed Worker Image

on:
  pull_request:
    paths:
      - "crates/bridges/symthaea-sim-worker-image/**"
      - "crates/bridges/symthaea-sim-worker/**"
      - "crates/bridges/symthaea-extension-host/**"
      - "crates/bridges/symthaea-extension-simulation-host/**"
      - "examples/extensions/hello-simulation/**"
      - ".github/workflows/simulation-sealed-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  simulation-sealed-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Cargo and Component builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            examples/extensions/hello-simulation/target
          key: ${{ runner.os }}-simulation-sealed-worker-${{ hashFiles('Cargo.lock', 'crates/bridges/symthaea-sim-worker-image/**', 'crates/bridges/symthaea-sim-worker/**', 'examples/extensions/hello-simulation/**') }}
          restore-keys: |
            ${{ runner.os }}-simulation-sealed-worker-

      - name: Reconcile candidate root lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          git diff -- Cargo.lock > simulation-sealed-worker-cargo-lock.patch
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the sealed-worker graph."
          else
            echo "Cargo.lock requires the following generated update:"
            cat simulation-sealed-worker-cargo-lock.patch
          fi

      - name: Upload candidate Cargo.lock patch
        uses: actions/upload-artifact@v4
        with:
          name: simulation-sealed-worker-cargo-lock-patch
          path: simulation-sealed-worker-cargo-lock.patch
          if-no-files-found: error

      - name: Record Linux memfd policy
        run: |
          uname -a
          if test -r /proc/sys/vm/memfd_noexec; then
            echo "vm.memfd_noexec=$(cat /proc/sys/vm/memfd_noexec)"
          else
            echo "vm.memfd_noexec=unavailable"
          fi

      - name: Require standalone guest WIT parity
        run: |
          cmp crates/core/symthaea-extension-core/wit/extension-control.wit \
              examples/extensions/hello-simulation/wit/extension-control.wit
          cmp crates/core/symthaea-extension-core/wit/simulation-provider.wit \
              examples/extensions/hello-simulation/wit/simulation-provider.wit

      - name: Build exact standalone simulation Component
        run: |
          cargo build \
            --manifest-path examples/extensions/hello-simulation/Cargo.toml \
            --target wasm32-wasip2 \
            --release
          component="examples/extensions/hello-simulation/target/wasm32-wasip2/release/symthaea_hello_simulation_extension.wasm"
          test -s "$component"
          sha256sum "$component" examples/extensions/hello-simulation/manifest.json

      - name: Build exact worker source image
        run: |
          cargo build --locked -p symthaea-sim-worker --bin symthaea-sim-worker
          test -x target/debug/symthaea-sim-worker
          sha256sum target/debug/symthaea-sim-worker

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check sealed worker image crate
        run: cargo check --locked -p symthaea-sim-worker-image --all-targets

      - name: Test sealed image unit corpus
        run: cargo test --locked -p symthaea-sim-worker-image

      - name: Strict Clippy sealed worker image crate
        run: cargo clippy --locked -p symthaea-sim-worker-image --all-targets -- -D warnings

      - name: Execute unlinked sealed worker with real Component
        env:
          SYMTHAEA_SIM_WORKER_BIN: ${{ github.workspace }}/target/debug/symthaea-sim-worker
        run: |
          cargo test --locked \
            -p symthaea-sim-worker-image \
            --test hello_sealed_worker \
            -- --ignored --test-threads=1

      - name: Record exact sealed-image qualification subject
        run: |
          component="examples/extensions/hello-simulation/target/wasm32-wasip2/release/symthaea_hello_simulation_extension.wasm"
          memfd_noexec="unavailable"
          if test -r /proc/sys/vm/memfd_noexec; then
            memfd_noexec="$(cat /proc/sys/vm/memfd_noexec)"
          fi
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "manifest_sha256=$(sha256sum examples/extensions/hello-simulation/manifest.json | cut -d' ' -f1)"
            echo "component_sha256=$(sha256sum "$component" | cut -d' ' -f1)"
            echo "worker_source_sha256=$(sha256sum target/debug/symthaea-sim-worker | cut -d' ' -f1)"
            echo "worker_image_profile=symthaea.simulation.worker-image.memfd-sealed-v1"
            echo "worker_protocol=symthaea.simulation.worker.v1"
            echo "supervisor_profile=symthaea.simulation.worker-supervisor.linux-rlimit-v1"
            echo "required_seals=write,grow,shrink,seal"
            echo "source_path_unlinked_before_execution=qualified_by_integration_test"
            echo "vm.memfd_noexec=${memfd_noexec}"
            echo "seccomp=not_established"
            echo "network_namespace=not_established"
            echo "cgroup=not_established"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } | tee simulation-sealed-worker-receipt.txt

      - name: Upload sealed-image qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: simulation-sealed-worker-receipt
          path: simulation-sealed-worker-receipt.txt
          if-no-files-found: error

      - name: Require committed root lockfile
        run: git diff --exit-code -- Cargo.lock
