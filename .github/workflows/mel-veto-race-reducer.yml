name: Melothaea veto race reducer

on:
  pull_request:
    paths:
      - "tools/mel-veto-race-reducer/**"
      - ".github/workflows/mel-veto-race-reducer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-race-reducer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Stage the isolated crate outside the repository workspace
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-veto-race-reducer"
          mkdir -p "$staged/src"
          cp tools/mel-veto-race-reducer/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-veto-race-reducer/Cargo.lock "$staged/Cargo.lock"
          cp tools/mel-veto-race-reducer/src/lib.rs "$staged/src/lib.rs"
          echo "MEL_VETO_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format isolated crate
        run: cargo fmt --check --manifest-path "$MEL_VETO_MANIFEST"
      - name: Test deterministic event reducer
        run: cargo test --locked --manifest-path "$MEL_VETO_MANIFEST"
