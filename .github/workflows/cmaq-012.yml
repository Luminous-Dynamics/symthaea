name: CMAQ-012 paired advantage-of-prediction auditor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/cmaq-012/**"
      - ".github/workflows/cmaq-012.yml"
  push:
    branches: [main]
    paths:
      - "research/cmaq-012/**"
      - ".github/workflows/cmaq-012.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-aop:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Unit tests
        working-directory: research/cmaq-012
        run: cargo test --locked
      - name: Generate and validate smoke report
        working-directory: research/cmaq-012
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -- --input fixtures/qualification-smoke.tsv --replicates 500 --bootstrap-seed 42 --artifacts-dir fixtures/artifacts --allow-fixtures > /tmp/cmaq-012-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, validate

          report = json.loads(Path("/tmp/cmaq-012-report.json").read_text())
          schema = json.loads(Path("report.schema.json").read_text())
          profile_schema = json.loads(Path("resource-profile.schema.json").read_text())
          receipt_schema = json.loads(Path("profiling-receipt.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator.check_schema(profile_schema)
          Draft202012Validator.check_schema(receipt_schema)
          profile_example = json.loads(Path("fixtures/resource-profile.example.json").read_text())
          receipt_example = json.loads(Path("fixtures/profiling-receipt.example.json").read_text())
          validate(instance=profile_example, schema=profile_schema)
          validate(instance=receipt_example, schema=receipt_schema)
          assert profile_example["fixture_only"] is True
          assert receipt_example["fixture_only"] is True
          assert profile_example["claim_ceiling"] == (
              "measurement_profile_contract_only_receipt_bytes_must_be_independently_verified"
          )
          assert receipt_example["resource_profile_sha256"] == "387121ab0b8792f166c5acf3efce961f90c9edea48d2c2387cd0ccd0fd318d47"
          assert receipt_example["claim_ceiling"] == (
              "artifact_content_integrity_verified_profiler_and_hardware_origin_unattested"
          )
          validate(instance=report, schema=schema)
          assert report["schema_version"] == "cmaq-012-paired-aop-report-v0.3"
          assert report["auditor_version"] == "0.3.0"
          artifact_verification = report["artifact_verification"]
          assert artifact_verification["status"] == "synthetic_fixture_content_verified_origin_unattested"
          assert artifact_verification["profiles_verified"] == 1
          assert artifact_verification["receipts_verified"] == 20
          assert artifact_verification["fixture_only"] is True
          assert artifact_verification["claim_ceiling"] == (
              "synthetic_fixture_content_integrity_verified_no_hardware_claim"
          )
          assert len(report["input_sha256"]) == 64
          assert report["bootstrap_replicates"] == 500
          assert report["bootstrap_seed"] == 42
          assert report["minimum_qualification_pairs"] == 20
          assert len(report["groups"]) == 1
          group = report["groups"][0]
          assert group["task"] == "halfcheetah"
          assert group["capability"] == "control"
          assert group["episode_count"] == 4
          assert group["eligibility"] == "smoke_only"
          assert set(group["arms"]) == {"D0", "D1", "W1", "W2", "W3"}
          match = group["resource_match"]
          assert match["status"] == "budget_matched"
          assert match["resource_measurement_method"] == "operator_trace"
          assert match["receipt_verification_status"] == "synthetic_fixture_content_verified_origin_unattested"
          assert match["d1_role_valid"] is True
          assert match["learned_model_role_valid"] is True
          assert match["w2_workload_match_valid"] is True
          assert match["energy_status"] == "unmeasured"
          assert match["d1_vs_w1"]["compute_work_p50_relative"] == 0.0
          assert match["w1_vs_w2"]["latency_p95_relative"] == 0.0
          for arm in ("D1", "W1", "W2"):
              resources = group["arms"][arm]["resource_metrics"]
              assert resources["mean_compute_work_units"] == 100000.0
              assert resources["p95_peak_memory_bytes"] == 1048576.0
          assert group["arms"]["D1"]["resource_metrics"]["mean_direct_value_calls"] == 100.0
          assert group["arms"]["D1"]["resource_metrics"]["mean_world_model_transition_calls"] == 0.0
          assert group["arms"]["W1"]["resource_metrics"]["mean_world_model_transition_calls"] == 300.0
          assert group["arms"]["W1"]["timed_out_count"] == 1
          assert group["arms"]["W1"]["success_count"] == 3
          assert len(group["contrasts"]) == 5
          contrasts = {row["estimand"]: row for row in group["contrasts"]}
          assert contrasts["advantage_of_prediction"]["numerator"] == "W1"
          assert contrasts["advantage_of_prediction"]["denominator"] == "D1"
          assert abs(contrasts["advantage_of_prediction"]["return_mean_delta"] - 1.75) < 1e-8
          assert abs(contrasts["prediction_mediation"]["return_mean_delta"] - 1.75) < 1e-8
          assert abs(contrasts["compute_only_gain"]["return_mean_delta"] - 1.0) < 1e-8
          print("CMAQ-012 v0.3 report/resource schemas, exact profile/receipt SHA-256 verification, row-to-receipt binding, D1 role, W1/W2 workload, paired resource tolerances, contrasts and timeout retention validated")
          PY
