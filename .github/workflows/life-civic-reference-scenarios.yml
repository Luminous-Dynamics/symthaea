name: life-civic-reference-scenarios

on:
  pull_request:
    paths:
      - ".github/workflows/life-civic-reference-scenarios.yml"
      - "docs/research/LIFE_CIVIC_DOMAIN_MASTERY_PLAN.md"
      - "docs/research/life-civic/reference-scenarios.json"
      - "docs/research/life-civic/reference-scenarios.manifest.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/life-civic-reference-scenarios.yml"
      - "docs/research/LIFE_CIVIC_DOMAIN_MASTERY_PLAN.md"
      - "docs/research/life-civic/reference-scenarios.json"
      - "docs/research/life-civic/reference-scenarios.manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reference-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scenario JSON
        run: jq empty docs/research/life-civic/reference-scenarios.json
      - name: Verify pinned Git blob identity
        shell: bash
        run: |
          manifest="docs/research/life-civic/reference-scenarios.manifest.json"
          scenario_file="$(jq -r '.scenario_file' "$manifest")"
          jq -e '
            .suite_id == "SYM-LIFE-CIVIC-REFERENCE-001" and
            .version == "0.2.0" and
            .status == "research_fixture" and
            .scenario_file == "docs/research/life-civic/reference-scenarios.json" and
            (.scenario_git_blob_sha1 | test("^[0-9a-f]{40}$"))
          ' "$manifest"
          expected="$(jq -r '.scenario_git_blob_sha1' "$manifest")"
          test "$scenario_file" = "docs/research/life-civic/reference-scenarios.json"
          actual="$(git hash-object "$scenario_file")"
          test "$actual" = "$expected"

      - name: Check suite identity and safety invariants
        run: |
          jq -e '
            .suite_id == "SYM-LIFE-CIVIC-REFERENCE-001" and
            .status == "research_fixture" and
            .version == "0.2.0" and
            ([.required_outputs[]] | index("source_retrieval_state_and_timestamp") != null) and
            all(.cases[]; (.expected.must_distinguish | index("source retrieval time versus publication/event time") != null)) and
            (.cases | length) >= 11 and
            ([.cases[].case_id] | unique | length) == (.cases | length) and
            all(.cases[];
              .expected.effects_requested == false and
              (.expected.prohibited_claims | length) > 0
            ) and
            ([.cases[].case_id] | index("SYM-LC-002") != null) and
            ([.cases[].case_id] | index("SYM-LC-003") != null) and
            ([.cases[].case_id] | index("SYM-LC-006") != null) and
            ([.cases[].case_id] | index("SYM-LC-007") != null) and
            ([.cases[].case_id] | index("SYM-LC-008") != null) and
            ([.cases[].case_id] | index("SYM-LC-009") != null) and
            ([.cases[].case_id] | index("SYM-LC-010") != null) and
            ([.cases[].case_id] | index("SYM-LC-011") != null)
          ' docs/research/life-civic/reference-scenarios.json
