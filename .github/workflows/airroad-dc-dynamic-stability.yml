name: AIRROAD DC Dynamic Stability

on:
  pull_request:
    paths:
      - "tools/airroad-dc-dynamic-stability-v0.1/**"
      - "docs/research/AIRROAD_DC_DYNAMIC_STABILITY_001_V0_1.md"
      - "docs/research/fixtures/airroad-dc-dynamic-stability-v0.1.json"
      - ".github/workflows/airroad-dc-dynamic-stability.yml"
  push:
    branches:
      - main
    paths:
      - "tools/airroad-dc-dynamic-stability-v0.1/**"
      - "docs/research/AIRROAD_DC_DYNAMIC_STABILITY_001_V0_1.md"
      - "docs/research/fixtures/airroad-dc-dynamic-stability-v0.1.json"
      - ".github/workflows/airroad-dc-dynamic-stability.yml"

permissions:
  contents: read

concurrency:
  group: airroad-dc-dynamic-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-rust-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/airroad-dc-dynamic-stability-v0.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --locked
      - name: Independent exact-rational oracle
        run: python3 tests/exact_rational_oracle.py
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
