name: AIRROAD DC Bus Stability

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-circuits/src/dc_bus_stability.rs"
      - "crates/domains/symthaea-circuits/src/lib.rs"
      - "crates/domains/symthaea-circuits/Cargo.toml"
      - "crates/domains/symthaea-circuits/README.md"
      - "docs/research/fixtures/airroad-dc-dynamic-stability-v0.1.json"
      - "docs/research/AIRROAD_DC_DYNAMIC_STABILITY_001_V0_1.md"
      - "tools/airroad-dc-stability-qualifier/verify_fixture.py"
      - ".github/workflows/airroad-dc-bus-stability.yml"
  push:
    branches:
      - research/airroad-dc-dynamic-stability-v0.1
    paths:
      - "crates/domains/symthaea-circuits/src/dc_bus_stability.rs"
      - "crates/domains/symthaea-circuits/src/lib.rs"
      - ".github/workflows/airroad-dc-bus-stability.yml"
      - "docs/research/fixtures/airroad-dc-dynamic-stability-v0.1.json"
      - "tools/airroad-dc-stability-qualifier/verify_fixture.py"

permissions:
  contents: read

concurrency:
  group: airroad-dc-bus-stability-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  qualify:
    name: Focused format, test, and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify exact-rational reference fixture
        run: python3 tools/airroad-dc-stability-qualifier/verify_fixture.py

      - name: Check crate formatting without workspace resolution
        run: rustfmt --edition 2024 --check crates/domains/symthaea-circuits/src/lib.rs

      - name: Compile and run zero-dependency crate tests
        run: |
          rustc --test --edition=2024 crates/domains/symthaea-circuits/src/lib.rs -o /tmp/symthaea-circuits-tests
          /tmp/symthaea-circuits-tests

      - name: Run Clippy directly without workspace resolution
        run: |
          clippy-driver --edition=2024 --crate-name symthaea_circuits --crate-type lib crates/domains/symthaea-circuits/src/lib.rs -D warnings --emit=metadata -o /tmp/symthaea-circuits.rmeta
          clippy-driver --edition=2024 --crate-name symthaea_circuits --test crates/domains/symthaea-circuits/src/lib.rs -D warnings --emit=metadata -o /tmp/symthaea-circuits-tests.rmeta
