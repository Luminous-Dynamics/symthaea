name: Scientific Tool Allocation Auditor

on:
  pull_request:
    paths:
      - "research/scientific-tool-allocation-auditor/**"
      - ".github/workflows/scientific-tool-allocation-auditor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-tool-allocation-auditor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-audit:
    name: Focused Rust audit contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Install stable Rust with quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --manifest-path research/scientific-tool-allocation-auditor/Cargo.toml -- --check

      - name: Unit tests
        run: cargo test --locked --manifest-path research/scientific-tool-allocation-auditor/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path research/scientific-tool-allocation-auditor/Cargo.toml --all-targets -- -D warnings

      - name: Exercise CLI on an empty assigned trial matrix
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path research/scientific-tool-allocation-auditor/Cargo.toml -- research/scientific-tool-allocation-auditor/fixtures/manifest.json research/scientific-tool-allocation-auditor/fixtures/trials.jsonl > /tmp/audit-1.json
          cargo run --locked --quiet --manifest-path research/scientific-tool-allocation-auditor/Cargo.toml -- research/scientific-tool-allocation-auditor/fixtures/manifest.json research/scientific-tool-allocation-auditor/fixtures/trials.jsonl > /tmp/audit-2.json
          cmp /tmp/audit-1.json /tmp/audit-2.json
          grep -q '"missing_cell_count": 2' /tmp/audit-1.json
