name: One-time formatting pass for query-specific stopping audit

on:
  push:
    branches:
      - "research/query-specific-connectome-stopping-v1"
    paths:
      - "tools/connectomics-intake-audit/src/bin/connectome_question_specific_stopping_audit.rs"

permissions:
  contents: write

jobs:
  format-once:
    name: Format exact Rust source and commit normalized result
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Install stable Rust formatter
        uses: dtolnay/rust-toolchain@stable
      - name: Apply rustfmt to the single audit source
        run: rustfmt --edition 2024 tools/connectomics-intake-audit/src/bin/connectome_question_specific_stopping_audit.rs
      - name: Commit formatting-only change if required
        run: |
          if git diff --quiet -- tools/connectomics-intake-audit/src/bin/connectome_question_specific_stopping_audit.rs; then
            echo "Rust source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/connectomics-intake-audit/src/bin/connectome_question_specific_stopping_audit.rs
          git commit -m "style(connectomics): format question-specific stopping auditor"
          git push origin "HEAD:${GITHUB_REF_NAME}"
