name: Proof Insight Transfer Indexer V0

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/bridges/symthaea-proof-insights/**"
      - "data/benchmarks/proof-insight-transfer-v0/**"
      - "docs/research/proof-insight-transfer-2026.md"
      - ".github/workflows/proof-insight-transfer-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-insight-indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Stage indexer as an isolated validation crate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          crate_dir = root / "crates/bridges/symthaea-proof-insights"
          crate_manifest_path = crate_dir / "Cargo.toml"
          crate_text = crate_manifest_path.read_text()
          crate = tomllib.loads(crate_text)
          workspace = tomllib.loads((root / "Cargo.toml").read_text())
          workspace_deps = workspace["workspace"]["dependencies"]
          package_text = crate_text.split("[dependencies]", 1)[0].rstrip() + "\n\n[dependencies]\n"

          def toml_value(value):
              if isinstance(value, str):
                  return json.dumps(value)
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, list):
                  return "[" + ", ".join(toml_value(item) for item in value) + "]"
              if isinstance(value, dict):
                  return "{ " + ", ".join(f"{key} = {toml_value(item)}" for key, item in value.items()) + " }"
              raise TypeError(f"unsupported TOML value: {type(value)!r}")

          dependency_lines = []
          for name, spec in crate.get("dependencies", {}).items():
              if isinstance(spec, dict) and spec.get("workspace") is True:
                  spec = workspace_deps[name]
              dependency_lines.append(f"{name} = {toml_value(spec)}")

          staged = Path(__import__("os").environ["RUNNER_TEMP"]) / "proof-insight-isolated"
          if staged.exists():
              shutil.rmtree(staged)
          (staged / "src").mkdir(parents=True)
          (staged / "Cargo.toml").write_text(package_text + "\n".join(dependency_lines) + "\n")
          shutil.copy2(crate_dir / "src/main.rs", staged / "src/main.rs")
          if (crate_dir / "src/bin").is_dir():
              shutil.copytree(crate_dir / "src/bin", staged / "src/bin")
          shutil.copy2(root / "Cargo.lock", staged / "Cargo.lock")
          print(f"Staged isolated crate {crate['package']['name']} at {staged}")
          PY
          echo "PITB_MANIFEST=$RUNNER_TEMP/proof-insight-isolated/Cargo.toml" >> "$GITHUB_ENV"
      - name: Check exact-package formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cargo fmt -- --check
      - name: Run isolated indexer tests and freeze the derived lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          # The workspace lock contains every member of the large workspace.
          # Staging this single package necessarily prunes unrelated workspace
          # package entries. Let Cargo perform that pruning once in RUNNER_TEMP,
          # then ensure every resolved registry package/version/source already
          # existed in the repository's reviewed Cargo.lock.
          cargo test
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          staged = tomllib.loads(Path("Cargo.lock").read_text())
          workspace_path = Path(os.environ["GITHUB_WORKSPACE"]) / "Cargo.lock"
          workspace = tomllib.loads(workspace_path.read_text())

          def registry_packages(lock):
              return {
                  (entry["name"], entry["version"], entry.get("source"))
                  for entry in lock["package"]
                  if entry.get("source", "").startswith("registry+")
              }

          staged_packages = registry_packages(staged)
          workspace_packages = registry_packages(workspace)
          unexpected = sorted(staged_packages - workspace_packages)
          if unexpected:
              raise SystemExit(
                  "isolated validation resolved registry packages absent from the reviewed workspace lock: "
                  + repr(unexpected)
              )
          if not staged_packages:
              raise SystemExit("isolated validation lock unexpectedly contains no registry packages")
          print(
              "PITB_ISOLATED_LOCK_PASS: "
              f"{len(staged_packages)} registry package versions are present in the reviewed workspace lock"
          )
          PY
          # Later test/lint/index steps use --locked against this exact temp lock.
      - name: Validate checked-in transfer candidates
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cargo run --locked --bin validate_transfer_contract -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/candidates/156-borsuk-nine-finite-obstruction.json"
          cargo run --locked --bin validate_transfer_contract -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/candidates/157-hadwiger-invariant-chain.json"
          cargo run --locked --bin validate_transfer_contract -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/candidates/026-eventual-subset-density-transfer.json"
          cargo run --locked --bin analyze_family_leakage -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/splits.json" "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/fixtures/family-leakage-edges.synthetic.json" "$RUNNER_TEMP/family-leakage-report.synthetic.json"
          cargo run --locked --bin discover_family_leakage_candidates -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/splits.json" "$RUNNER_TEMP/family-leakage-candidates-a.json"
          cargo run --locked --bin discover_family_leakage_candidates -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/splits.json" "$RUNNER_TEMP/family-leakage-candidates-b.json"
          cmp "$RUNNER_TEMP/family-leakage-candidates-a.json" "$RUNNER_TEMP/family-leakage-candidates-b.json"
          cargo run --locked --bin discover_artifact_path_candidates -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/splits.json" "$RUNNER_TEMP/family-artifact-path-candidates-a.json"
          cargo run --locked --bin discover_artifact_path_candidates -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/splits.json" "$RUNNER_TEMP/family-artifact-path-candidates-b.json"
          cmp "$RUNNER_TEMP/family-artifact-path-candidates-a.json" "$RUNNER_TEMP/family-artifact-path-candidates-b.json"
      - name: Run strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cargo clippy --locked --all-targets -- -D warnings
      - name: Install independent Draft 2020-12 validator
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned schema-validation dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/jsonschema-venv"
          "$RUNNER_TEMP/jsonschema-venv/bin/pip" install --disable-pip-version-check --no-input "jsonschema[format]==4.26.0"
      - name: Validate primary analyzer power-report v2 schema contract
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/primary-power-report-v2.schema.json" "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/fixtures/primary-power-report-v2.schema.synthetic.json" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          schema_path, fixture_path = map(Path, sys.argv[1:])
          schema = json.loads(schema_path.read_text())
          fixture = json.loads(fixture_path.read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(fixture)

          if fixture["schema_version"] != "pitb.power-report.v2":
              raise SystemExit("primary power fixture must use schema v2")
          if "012" not in fixture["known_exposed_validation_family_ids"]:
              raise SystemExit("primary power fixture must quarantine exposed validation family 012")
          if "089" not in fixture["known_exposed_test_family_ids"]:
              raise SystemExit("primary power fixture must quarantine exposed test family 089")
          if len(fixture["scenarios"]) != 48 or len(fixture["weak_null_scenarios"]) != 36:
              raise SystemExit("primary power fixture must contain 48 strict/power rows and 36 weak-null rows")
          if sum(row["eligible_target_count"] for row in fixture["family_target_counts"]) != fixture["eligible_validation_target_count"]:
              raise SystemExit("fixture target denominator must equal the sum of its family sizes")

          iccs = {0.0, 0.05, 0.1, 0.2}
          effects = {0.0, 10.0, 15.0, 20.0}
          associations = {0.0, 0.5, 0.9}
          if fixture["pair_association_fraction_grid"] != [0, 0.5, 0.9]:
              raise SystemExit("strict/power association grid differs from the registered values")
          strict_keys = {(row["true_treatment_effect_percentage_points"], row["assumed_family_icc"], row["pair_association_fraction"]) for row in fixture["scenarios"]}
          weak_keys = {(row["requested_family_effect_heterogeneity_sd_percentage_points"], row["assumed_family_icc"], row["pair_association_fraction"]) for row in fixture["weak_null_scenarios"]}
          if strict_keys != {(effect, icc, association) for effect in effects for icc in iccs for association in associations}:
              raise SystemExit("fixture strict grid has missing or duplicate effect/ICC/association cells")
          if weak_keys != {(sd, icc, association) for sd in (5.0, 10.0, 20.0) for icc in iccs for association in associations}:
              raise SystemExit("fixture weak-null grid has missing or duplicate heterogeneity/ICC/association cells")
          for row in fixture["scenarios"]:
              if row["true_treatment_effect_percentage_points"] == 0.0:
                  if row["null_effect_false_claim_probability_upper_simultaneous_95"] < row["estimated_power_upper_95"]:
                      raise SystemExit("strict-null simultaneous upper bound must dominate the per-cell Wilson upper bound")
              elif row["null_effect_false_claim_probability_upper_simultaneous_95"] is not None:
                  raise SystemExit("non-null power scenarios must not publish a null-risk upper bound")
          for row in fixture["weak_null_scenarios"]:
              if row["false_claim_probability_upper_simultaneous_95"] < row["false_claim_probability_upper_95"]:
                  raise SystemExit("weak-null simultaneous upper bound must dominate the per-cell Wilson upper bound")
          if not fixture["power_gate_passed"]:
              raise SystemExit("schema fixture must exercise a pass-shaped contract")
          if fixture["null_effect_false_claim_probability_upper_simultaneous_95_max"] > 0.05 or fixture["weak_null_false_claim_probability_upper_simultaneous_95_max"] > 0.05:
              raise SystemExit("synthetic fixture's registered simultaneous bounds should meet the demonstration threshold")
          strict_null_rows = [row for row in fixture["scenarios"] if row["true_treatment_effect_percentage_points"] == 0.0]
          weak_null_rows = fixture["weak_null_scenarios"]
          expected_strict_rate = max(row["utility_gate_passes"] / fixture["study_simulations"] for row in strict_null_rows)
          expected_strict_upper = max(row["null_effect_false_claim_probability_upper_simultaneous_95"] for row in strict_null_rows)
          expected_weak_rate = max(row["estimated_false_claim_probability"] for row in weak_null_rows)
          expected_weak_upper = max(row["false_claim_probability_upper_simultaneous_95"] for row in weak_null_rows)
          if abs(fixture["null_effect_false_claim_probability_max"] - expected_strict_rate) > 1e-12:
              raise SystemExit("strict-null false-claim summary does not match its grid")
          if abs(fixture["null_effect_false_claim_probability_upper_simultaneous_95_max"] - expected_strict_upper) > 1e-12:
              raise SystemExit("strict-null simultaneous summary does not match its grid")
          if abs(fixture["weak_null_false_claim_probability_max"] - expected_weak_rate) > 1e-12:
              raise SystemExit("weak-null false-claim summary does not match its grid")
          if abs(fixture["weak_null_false_claim_probability_upper_simultaneous_95_max"] - expected_weak_upper) > 1e-12:
              raise SystemExit("weak-null simultaneous summary does not match its grid")
          worst_power_rows = [row for row in fixture["scenarios"] if row["true_treatment_effect_percentage_points"] == 20.0 and row["assumed_family_icc"] == 0.2]
          expected_power = min(row["estimated_utility_gate_power"] for row in worst_power_rows)
          expected_power_lower = min(row["estimated_power_lower_95"] for row in worst_power_rows)

          def wilson_lower(successes, trials, z):
              if trials <= 0:
                  return 0.0
              rate = successes / trials
              z2 = z * z
              denominator = 1.0 + z2 / trials
              center = (rate + z2 / (2.0 * trials)) / denominator
              half = z * ((rate * (1.0 - rate) / trials + z2 / (4.0 * trials * trials)) ** 0.5) / denominator
              return max(0.0, center - half)

          def expected_simultaneous_power_lower(report):
              rows = [row for row in report["scenarios"] if row["true_treatment_effect_percentage_points"] == 20.0 and row["assumed_family_icc"] == 0.2]
              if len(rows) != 3:
                  return None
              # Two-sided 95% Bonferroni-adjusted Wilson lower bound across three
              # registered association settings; z=2.394 is conservative.
              return min(wilson_lower(row["utility_gate_passes"], row["study_simulations"], 2.394) for row in rows)

          if len(worst_power_rows) != 3:
              raise SystemExit("headline power must summarize all three association levels at +20pp/ICC .20")
          if abs(fixture["estimated_power_at_20pp_and_icc_020"] - expected_power) > 1e-12:
              raise SystemExit("headline power estimate must equal the worst association cell at +20pp/ICC .20")
          if abs(fixture["estimated_power_at_20pp_and_icc_020_lower_95"] - expected_power_lower) > 1e-12:
              raise SystemExit("per-cell headline power bound must equal the worst association cell at +20pp/ICC .20")
          simultaneous_power_lower = expected_simultaneous_power_lower(fixture)
          if simultaneous_power_lower is None or abs(fixture["estimated_power_at_20pp_and_icc_020_lower_simultaneous_95"] - simultaneous_power_lower) > 1e-12:
              raise SystemExit("simultaneous headline power bound must equal the adjusted worst-association lower bound")

          malformed_power_bound = copy.deepcopy(fixture)
          malformed_power_bound["estimated_power_at_20pp_and_icc_020_lower_simultaneous_95"] = fixture["estimated_power_at_20pp_and_icc_020_lower_95"]
          if abs(malformed_power_bound["estimated_power_at_20pp_and_icc_020_lower_simultaneous_95"] - expected_simultaneous_power_lower(malformed_power_bound)) <= 1e-12:
              raise SystemExit("power-bound negative control did not distinguish per-cell and simultaneous limits")

          bad = copy.deepcopy(fixture)
          bad["weak_null_scenarios"].pop()
          try:
              validator.validate(bad)
          except ValidationError:
              pass
          else:
              raise SystemExit("schema must reject a missing weak-null scenario")
          bad = copy.deepcopy(fixture)
          bad["scenarios"].pop()
          try:
              validator.validate(bad)
          except ValidationError:
              pass
          else:
              raise SystemExit("schema must reject a missing strict/power scenario")
          bad = copy.deepcopy(fixture)
          bad["schema_version"] = "pitb.power-report.v1"
          try:
              validator.validate(bad)
          except ValidationError:
              pass
          else:
              raise SystemExit("schema must reject the incomplete v1 power report")
          print("PITB_PRIMARY_POWER_REPORT_SCHEMA_PASS: v2 schema, validation/test exposure quarantine, 48-cell effect/ICC/association grid, 36-cell weak-null grid, 48-cell null multiplicity check, simultaneous worst-association power bound, denominator reconciliation and negative controls; fixture is synthetic and not a power result")
          PY
      - name: Validate run-config v1 schema and split-aware exposure quarantine
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/run-config-v1.schema.json" "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/fixtures/run-config-v1.synthetic.json" "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/splits.json" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          schema_path, fixture_path, split_path = map(Path, sys.argv[1:])
          schema = json.loads(schema_path.read_text())
          fixture = json.loads(fixture_path.read_text())
          split_manifest = json.loads(split_path.read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(fixture)

          assignments = {}
          for family in split_manifest["families"]:
              family_id = family["family_id"]
              if family_id in assignments:
                  raise SystemExit(f"duplicate frozen family ID: {family_id}")
              assignments[family_id] = family["split"]

          expected_partition = split_manifest["split_plan"]["partition_digest_sha256"]
          if fixture["partition_digest_sha256"] != expected_partition:
              raise SystemExit("synthetic run-config fixture must bind the checked-in frozen partition digest")
          if assignments.get("012") != "validation" or assignments.get("089") != "test":
              raise SystemExit("required exposed families must remain assigned to validation/test respectively")
          if set(fixture["known_exposed_validation_family_ids"]) & set(fixture["known_exposed_test_family_ids"]):
              raise SystemExit("validation/test exposure lists must be disjoint")

          def check_split_aware_config(config):
              validator.validate(config)
              validation_ids = config["known_exposed_validation_family_ids"]
              test_ids = config["known_exposed_test_family_ids"]
              if set(validation_ids) & set(test_ids):
                  raise ValueError("exposure lists overlap")
              wrong_validation = [x for x in validation_ids if assignments.get(x) != "validation"]
              wrong_test = [x for x in test_ids if assignments.get(x) != "test"]
              if wrong_validation or wrong_test:
                  raise ValueError(f"exposure IDs do not match frozen partition: validation={wrong_validation}, test={wrong_test}")

          bad = copy.deepcopy(fixture)
          del bad["known_exposed_validation_family_ids"]
          try:
              check_split_aware_config(bad)
          except (ValidationError, ValueError):
              pass
          else:
              raise SystemExit("negative control failed: missing validation exposure list was accepted")

          bad = copy.deepcopy(fixture)
          bad["known_exposed_validation_family_ids"].append("089")
          try:
              check_split_aware_config(bad)
          except (ValidationError, ValueError):
              pass
          else:
              raise SystemExit("negative control failed: test family 089 was accepted in validation quarantine")

          bad = copy.deepcopy(fixture)
          bad["known_exposed_test_family_ids"].append("012")
          try:
              check_split_aware_config(bad)
          except (ValidationError, ValueError):
              pass
          else:
              raise SystemExit("negative control failed: validation family 012 was accepted in test quarantine")

          bad = copy.deepcopy(fixture)
          bad["known_exposed_validation_family_ids"] = []
          try:
              check_split_aware_config(bad)
          except (ValidationError, ValueError):
              pass
          else:
              raise SystemExit("negative control failed: empty validation quarantine was accepted")

          print("PITB_RUN_CONFIG_V1_PASS: strict schema, frozen partition digest, split-aware exposure IDs, disjoint quarantines and four malformed-config controls; fixture is synthetic and not a benchmark run")
          PY
      - name: Validate deterministic cluster-power planning report and negative control
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cluster_sizes="2,3,1,4,2,2,3,1,4,2,3,1,2,4,1,3,2,2,4,1"
          cargo run --locked --bin plan_pitb_power -- 0.35 0.15 0.10 0.05 0.05 0.5 "$cluster_sizes" 1000 1000 12345 "$RUNNER_TEMP/pitb-power-a.json"
          cargo run --locked --bin plan_pitb_power -- 0.35 0.15 0.10 0.05 0.05 0.5 "$cluster_sizes" 1000 1000 12345 "$RUNNER_TEMP/pitb-power-b.json"
          cargo run --locked --bin plan_pitb_power -- 0.35 0.15 0.10 0.05 0.20 0.0 "$cluster_sizes" 1000 1000 12346 "$RUNNER_TEMP/pitb-power-heterogeneous.json"
          cmp "$RUNNER_TEMP/pitb-power-a.json" "$RUNNER_TEMP/pitb-power-b.json"
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - "$RUNNER_TEMP/pitb-power-a.json" "$RUNNER_TEMP/pitb-power-heterogeneous.json" "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/power-planning-report.schema.json" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          report_path, heterogeneous_path, schema_path = map(Path, sys.argv[1:])
          report = json.loads(report_path.read_text())
          heterogeneous = json.loads(heterogeneous_path.read_text())
          schema = json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(report)
          validator.validate(heterogeneous)

          config = report["configuration"]
          results = report["results"]
          heterogeneous_config = heterogeneous["configuration"]
          if heterogeneous_config["cluster_effect_sd"] != 0.20 or heterogeneous_config["pair_association"] != 0.0:
              raise SystemExit("second planning scenario must exercise heterogeneous effects with independent paired outcomes")
          if "not a Pearson correlation" not in heterogeneous["generative_model"]["pair_association_semantics"]:
              raise SystemExit("pair-association interpretation is missing from the report")
          if config["cluster_count"] != 20 or len(config["cluster_sizes"]) != 20:
              raise SystemExit("power planning fixture must use 20 independent clusters")
          if config["bootstrap_replicates"] != 1000:
              raise SystemExit("power planning fixture must record the expected bootstrap replicate count")
          if heterogeneous_config["bootstrap_replicates"] < 1000:
              raise SystemExit("heterogeneous scenario does not have enough bootstrap replicates")
          if config["total_targets_per_simulated_study"] != sum(config["cluster_sizes"]):
              raise SystemExit("power report target count does not reconcile with cluster sizes")
          if results["gate_passes"] > results["valid_interval_trials"]:
              raise SystemExit("a gate cannot pass when the interval is degenerate")
          if results["valid_interval_trials"] + results["degenerate_interval_trials"] != config["simulations"]:
              raise SystemExit("power report does not account for every simulated interval")
          if report["report_kind"] != "simulation_based_power_planning_not_model_evaluation":
              raise SystemExit("planner output must never be labeled as model evaluation")

          bad = copy.deepcopy(report)
          bad["results"]["estimated_gate_power"] = 1.01
          try:
              validator.validate(bad)
          except ValidationError:
              pass
          else:
              raise SystemExit("schema accepted a power estimate outside [0, 1]")
          print(
              "PITB_POWER_PLANNING_SCHEMA_PASS: "
              f"clusters={config['cluster_count']} "
              f"targets={config['total_targets_per_simulated_study']} "
              f"simulations={config['simulations']} "
              f"power={results['estimated_gate_power']:.4f}; "
              f"heterogeneous_scenario_power={heterogeneous['results']['estimated_gate_power']:.4f}; "
              "deterministic and explicitly non-empirical"
          )
          PY
      - name: Validate cross-family leakage quarantine audit and negative controls
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          root = Path("data/benchmarks/proof-insight-transfer-v0")
          edge_schema = json.loads((root / "family-leakage-edges.schema.json").read_text())
          report_schema = json.loads((root / "family-leakage-report.schema.json").read_text())
          candidate_schema = json.loads((root / "family-leakage-candidate-discovery.schema.json").read_text())
          path_schema = json.loads((root / "family-artifact-path-candidate-discovery.schema.json").read_text())
          Draft202012Validator.check_schema(edge_schema)
          Draft202012Validator.check_schema(report_schema)
          Draft202012Validator.check_schema(candidate_schema)
          Draft202012Validator.check_schema(path_schema)
          edge_validator = Draft202012Validator(edge_schema, format_checker=FormatChecker())
          report_validator = Draft202012Validator(report_schema, format_checker=FormatChecker())
          candidate_validator = Draft202012Validator(candidate_schema, format_checker=FormatChecker())
