          if audit["repository_commit"] != expected_commit:
              raise SystemExit("Dalek timeline audit references an unexpected repository commit")
          if audit["total_timeline_rows"] != 248 or len(audit["events"]) != 248:
              raise SystemExit("pinned Dalek proof_timeline.csv must contain exactly 248 data rows at this commit")
          if [event["position"] for event in audit["events"]] != list(range(248)):
              raise SystemExit("timeline positions are not contiguous and in source order")
          if len({event["event_key"] for event in audit["events"]}) != 248:
              raise SystemExit("timeline audit event keys are not unique")
          if audit["events"][0]["previous_completion_commit"] is not None or audit["events"][0]["previous_completion_is_ancestor"] is not None:
              raise SystemExit("first source-ordered timeline event must not invent a predecessor")
          for previous, current in zip(audit["events"], audit["events"][1:]):
              if current["previous_completion_commit"] != previous["completion_commit"]:
                  raise SystemExit("timeline predecessor evidence does not preserve exact CSV source order")
              if not isinstance(current["previous_completion_is_ancestor"], bool):
                  raise SystemExit("adjacent Git DAG ancestry must be reported as true/false for every non-first row")
          non_ancestral = sum(event["previous_completion_is_ancestor"] is False for event in audit["events"])
          if audit["non_ancestral_adjacent_transition_count"] != non_ancestral:
              raise SystemExit("non-ancestral adjacent transition count differs from per-row evidence")
          counterexample = next((event for event in audit["events"] if event["event_key"] == "tl_0042_identity"), None)
          if counterexample is None or counterexample["previous_completion_is_ancestor"] is not False:
              raise SystemExit("pinned parallel-branch counterexample was not retained as DAG evidence")
          if counterexample["previous_completion_commit"] != "b17c07a4557591072500914c50a5d100983b49c7":
              raise SystemExit("pinned timeline predecessor for tl_0042_identity unexpectedly changed")
          # The pinned README claims 249 entries, but the actual tracked CSV has
          # 248 data rows (ids through tl_0247). Preserve and report this mismatch;
          # do not silently pretend the README and CSV agree.
          if audit["readme_claimed_timeline_row_count"] != 249:
              raise SystemExit("pinned Dalek README timeline count claim unexpectedly changed")
          if audit["timeline_row_count_matches_readme_claim"] is not False:
              raise SystemExit("expected README/CSV row-count discrepancy was not captured in the audit")
          if not all(event["completion_commit_ancestor_verified"] is True for event in audit["events"]):
              raise SystemExit("one or more timeline completion commits are not ancestry-verified")
          source_counts = (
              audit["source_path_present_at_completion_count"]
              + audit["source_path_missing_at_completion_count"]
              + audit["source_path_not_recorded_count"]
              + audit["source_path_rejected_count"]
          )
          if source_counts != 248:
              raise SystemExit("timeline source-path accounting does not cover all 248 rows")
          if audit["source_path_rejected_count"] != 1:
              raise SystemExit("pinned timeline must account for exactly one rejected machine-local source path")
          unsafe_event = next((event for event in audit["events"] if event["event_key"] == "tl_0056_is_negative"), None)
          if unsafe_event is None:
              raise SystemExit("pinned unsafe-path row tl_0056_is_negative disappeared")
          if unsafe_event["source_file_status"] != "rejected_unsafe_path" or unsafe_event["spec_theorem_path"] is not None:
              raise SystemExit("machine-local source path must be rejected and redacted, not read or echoed")
          if unsafe_event["source_file_sha256"] is not None or unsafe_event["source_file_bytes"] is not None:
              raise SystemExit("rejected source paths must not receive a file digest or size")
          if sum(audit["verification_status_counts"].values()) != 248:
              raise SystemExit("timeline verification-status accounting does not cover all 248 rows")
          timeline_bytes = (dalek / audit["timeline_path"]).read_bytes()
          if hashlib.sha256(timeline_bytes).hexdigest() != audit["timeline_sha256"]:
              raise SystemExit("timeline digest differs from the exact pinned checkout bytes")
          print(
              "PITB_DALEK_TIMELINE_AUDIT_PASS: "
              f"rows={audit['total_timeline_rows']} "
              f"readme_claim={audit['readme_claimed_timeline_row_count']} "
              f"readme_matches={audit['timeline_row_count_matches_readme_claim']} "
              f"completion_commits={audit['unique_completion_commit_count']} "
              f"non_ancestral_adjacent_transitions={audit['non_ancestral_adjacent_transition_count']} "
              f"source_present={audit['source_path_present_at_completion_count']} "
              f"source_missing={audit['source_path_missing_at_completion_count']} "
              f"source_not_recorded={audit['source_path_not_recorded_count']} "
              f"source_path_rejected={audit['source_path_rejected_count']} "
              f"timeline_sha256={audit['timeline_sha256']}"
          )
