                  reviewer_ids = [r["reviewer_id"] for r in reviewers]
                  reject(len(reviewer_ids) != len(set(reviewer_ids)), "duplicate reviewer identity")
                  reject(adjudication["status"] == "adjudicated" and len(reviewers) < 2, "adjudicated state pair requires two reviewers")
                  if adjudication["status"] == "adjudicated":
                      for reviewer in reviewers:
