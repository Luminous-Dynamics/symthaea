          m = copy.deepcopy(fixture); m["cases"][0]["variant_state"]["environment_sha256"] = "f" * 64; mutants.append((m, "environment drift"))
          m = copy.deepcopy(fixture); m["cases"][0]["intervention"]["operation"] = "rename_local_decl"; mutants.append((m, "wrong state operation"))
          m = copy.deepcopy(fixture); m["cases"][0]["contract"]["variant_precondition_status"] = "available"; mutants.append((m, "cleared precondition still available"))
