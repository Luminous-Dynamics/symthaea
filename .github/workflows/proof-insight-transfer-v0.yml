          m = copy.deepcopy(fixture); m["cases"][0]["outcome_links"]["variant_outcome_id"] = m["cases"][0]["outcome_links"]["base_outcome_id"]; mutants.append((m, "duplicate outcome join"))
          m = copy.deepcopy(fixture); m["cases"][3]["adjudication"]["reviewers"][1]["reviewer_id"] = m["cases"][3]["adjudication"]["reviewers"][0]["reviewer_id"]; mutants.append((m, "duplicate reviewer"))
          for mutant, label in mutants:
              expect_reject(mutant, label)
          print(f"PITB_PROOF_STATE_INTERVENTION_SCHEMA_PASS: {len(fixture['cases'])} synthetic pairs; {len(mutants)}/{len(mutants)} negative controls rejected")
