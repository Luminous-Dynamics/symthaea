name: Proof Insight Transfer Indexer V0

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/bridges/symthaea-proof-insights/**"
      - "data/benchmarks/proof-insight-transfer-v0/**"
      - "docs/research/proof-insight-transfer-2026.md"
      - ".github/workflows/proof-insight-transfer-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-insight-indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Stage indexer as an isolated validation crate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          crate_dir = root / "crates/bridges/symthaea-proof-insights"
          crate_manifest_path = crate_dir / "Cargo.toml"
          crate_text = crate_manifest_path.read_text()
          crate = tomllib.loads(crate_text)
          workspace = tomllib.loads((root / "Cargo.toml").read_text())
          workspace_deps = workspace["workspace"]["dependencies"]
          package_text = crate_text.split("[dependencies]", 1)[0].rstrip() + "\n\n[dependencies]\n"

          def toml_value(value):
              if isinstance(value, str):
                  return json.dumps(value)
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, list):
                  return "[" + ", ".join(toml_value(item) for item in value) + "]"
              if isinstance(value, dict):
                  return "{ " + ", ".join(f"{key} = {toml_value(item)}" for key, item in value.items()) + " }"
              raise TypeError(f"unsupported TOML value: {type(value)!r}")

          dependency_lines = []
          for name, spec in crate.get("dependencies", {}).items():
              if isinstance(spec, dict) and spec.get("workspace") is True:
                  spec = workspace_deps[name]
              dependency_lines.append(f"{name} = {toml_value(spec)}")

          staged = Path(__import__("os").environ["RUNNER_TEMP"]) / "proof-insight-isolated"
          if staged.exists():
              shutil.rmtree(staged)
          (staged / "src").mkdir(parents=True)
          (staged / "Cargo.toml").write_text(package_text + "\n".join(dependency_lines) + "\n")
          shutil.copy2(crate_dir / "src/main.rs", staged / "src/main.rs")
          if (crate_dir / "src/bin").is_dir():
              shutil.copytree(crate_dir / "src/bin", staged / "src/bin")
          shutil.copy2(root / "Cargo.lock", staged / "Cargo.lock")
          print(f"Staged isolated crate {crate['package']['name']} at {staged}")
          PY
          echo "PITB_MANIFEST=$RUNNER_TEMP/proof-insight-isolated/Cargo.toml" >> "$GITHUB_ENV"
      - name: Check exact-package formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cargo fmt -- --check
      - name: Run isolated indexer tests and freeze the derived lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          # The workspace lock contains every member of the large workspace.
          # Staging this single package necessarily prunes unrelated workspace
          # package entries. Let Cargo perform that pruning once in RUNNER_TEMP,
          # then ensure every resolved registry package/version/source already
          # existed in the repository's reviewed Cargo.lock.
          cargo test
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          staged = tomllib.loads(Path("Cargo.lock").read_text())
          workspace_path = Path(os.environ["GITHUB_WORKSPACE"]) / "Cargo.lock"
          workspace = tomllib.loads(workspace_path.read_text())

          def registry_packages(lock):
              return {
                  (entry["name"], entry["version"], entry.get("source"))
                  for entry in lock["package"]
                  if entry.get("source", "").startswith("registry+")
              }

          staged_packages = registry_packages(staged)
          workspace_packages = registry_packages(workspace)
          unexpected = sorted(staged_packages - workspace_packages)
          if unexpected:
              raise SystemExit(
                  "isolated validation resolved registry packages absent from the reviewed workspace lock: "
                  + repr(unexpected)
              )
          if not staged_packages:
              raise SystemExit("isolated validation lock unexpectedly contains no registry packages")
          print(
              "PITB_ISOLATED_LOCK_PASS: "
              f"{len(staged_packages)} registry package versions are present in the reviewed workspace lock"
          )
          PY
          # Later test/lint/index steps use --locked against this exact temp lock.
      - name: Validate checked-in transfer candidates
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cargo run --locked --bin validate_transfer_contract -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/candidates/156-borsuk-nine-finite-obstruction.json"
          cargo run --locked --bin validate_transfer_contract -- "$GITHUB_WORKSPACE/data/benchmarks/proof-insight-transfer-v0/candidates/157-hadwiger-invariant-chain.json"
      - name: Run strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$PITB_MANIFEST")"
          cargo clippy --locked --all-targets -- -D warnings
      - name: Install independent Draft 2020-12 validator
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned schema-validation dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/jsonschema-venv"
          "$RUNNER_TEMP/jsonschema-venv/bin/pip" install --disable-pip-version-check --no-input "jsonschema[format]==4.26.0"
      - name: Validate insight schema and synthetic positive/negative controls
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          path = Path("data/benchmarks/proof-insight-transfer-v0/insight-record.schema.json")
          schema = json.loads(path.read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          # Validate every checked-in candidate, not just a synthetic fixture.
          # Candidates must remain unreviewed/unscored unless their evidence gates
          # are actually passed; schema validity is only structural validation.
          candidate_dir = Path("data/benchmarks/proof-insight-transfer-v0/candidates")
          candidate_files = sorted(candidate_dir.glob("*.json"))
          if not candidate_files:
              raise SystemExit("no checked-in candidate records were found")
          for candidate_path in candidate_files:
              candidate = json.loads(candidate_path.read_text())
              try:
                  validator.validate(candidate)
              except ValidationError as error:
                  raise SystemExit(
                      f"candidate schema validation failed for {candidate_path}: {error.message}"
                  ) from error
          print(f"PITB_CANDIDATE_SCHEMA_PASS: {len(candidate_files)} candidate record(s)")

          # Deliberately synthetic schema probe: not a benchmark dataset row and
          # not evidence that any manuscript theorem has been formalized.
          digest = "0" * 64
          record = {
              "schema_version": "pitb.insight-record.v0",
              "record_id": "synthetic-schema-probe-v0",
              "source": {
                  "repository_url": "https://example.invalid/synthetic-source",
                  "commit": "a" * 40,
                  "path": "synthetic/fixture.txt",
                  "sha256": digest,
                  "family_id": "synthetic-family",
                  "license_status": "unknown"
              },
              "theorem": {
                  "theorem_id": "synthetic-claim-not-a-theorem",
                  "statement_digest": digest,
                  "domain": ["synthetic-only"],
                  "claim_status": "unknown"
              },
              "artifact": {
                  "kind": "other",
                  "path": "synthetic/fixture.txt",
                  "sha256": digest
              },
              "insight": {
                  "move_id": "synthetic-move",
                  "obstacle": "Schema exercise only",
                  "strategy": "No mathematical strategy is asserted",
                  "preconditions": [],
                  "transformation": {
                      "before_state": "Unspecified",
                      "after_state": "Unspecified"
                  },
                  "evidence": [{
                      "source_path": "synthetic/fixture.txt",
                      "locator": "synthetic fixture",
                      "evidence_kind": "reviewer_annotation"
                  }],
                  "failure_boundaries": ["Synthetic-only; no transfer claim"],
                  "transfer_candidates": [{
                      "target_family_id": "synthetic-target",
                      "rationale": "Schema fixture only",
                      "status": "candidate",
                      "directional_contract": {
                          "compatibility": "compatible",
                          "mismatch_codes": [],
                          "move_kind": "other",
                          "source_obligation": {
                              "domain": "synthetic-only",
                              "object_type": "synthetic-object",
                              "predicate": "synthetic-source",
                              "relation": "equality",
                              "quantifier_scope": "synthetic fixture",
                              "preconditions": []
                          },
                          "target_obligation": {
                              "domain": "synthetic-only",
                              "object_type": "synthetic-object",
                              "predicate": "synthetic-target",
                              "relation": "equality",
                              "quantifier_scope": "synthetic fixture",
                              "preconditions": []
                          },
                          "source_move_requires": "Synthetic source requirement",
                          "target_goal_requires": "Synthetic target requirement",
                          "notes": ["No mathematical transfer is asserted"]
                      }
                  }]
              },
              "verification": {
                  "status": "not_attempted",
                  "exact_statement_checked": False,
                  "axiom_policy": "unknown"
              },
              "semantic_validation": {
                  "status": "not_attempted",
                  "statement_correspondence": {
                      "status": "not_reviewed",
                      "independent_reviewer_count": 0
                  },
                  "successor_tests": [],
                  "mutation_controls": []
              },
              "constructive_transfer": {
                  "status": "not_attempted",
                  "unknowns": [],
                  "candidate_witness": {
                      "status": "absent",
                      "representation": None
                  },
                  "proof_obligations": [],
                  "answer_equivalence": {
                      "method": "none",
                      "status": "not_attempted"
                  }
              },
              "review": {
                  "status": "unreviewed",
                  "independent_review_count": 0
              }
          }
          validator.validate(record)

          # Synthetic positive transfer fixture: all source/target text and
          # receipts are placeholders used only to exercise schema guards.
          target_verification = {
              "status": "passed",
              "target_source_commit": "a" * 40,
              "target_artifact_path": "lean/Synthetic/Target.lean",
              "target_artifact_sha256": digest,
              "target_statement_digest": digest,
              "checker": "synthetic Lean checker",
              "checker_version": "synthetic-only",
              "exact_statement_checked": True,
              "axiom_policy": "declared_classical",
              "receipt_sha256": digest,
              "target_statement_correspondence": {
                  "status": "matches_intended_claim",
                  "independent_reviewer_count": 1
              },
              "successor_test_status": "passed",
              "successor_tests": [{
                  "test_id": "synthetic-successor",
                  "source_path": "lean/Synthetic/Target.lean",
                  "test_declaration": "Synthetic.successor",
                  "outcome": "passed",
                  "depends_on_candidate": True
              }],
              "mutation_control_status": "passed",
              "mutation_controls": [{
                  "mutation_id": "synthetic-mutated-target",
                  "description": "Synthetic target statement mutation",
                  "expected_detection": True,
                  "observed_detection": True,
                  "status": "detected_as_expected"
              }],
              "notes": ["Synthetic-only schema fixture; no real transfer is asserted"]
          }
          verified_record = copy.deepcopy(record)
          verified_candidate = verified_record["insight"]["transfer_candidates"][0]
          verified_candidate["status"] = "verified_transfer"
          verified_candidate["target_theorem_id"] = "OAI.Synthetic.target"
          verified_candidate["transfer_verification"] = target_verification
          validator.validate(verified_record)

          mutants = []
          extra_property = copy.deepcopy(record)
          extra_property["unspecified_authority"] = True
          mutants.append(extra_property)

          bad_commit = copy.deepcopy(record)
          bad_commit["source"]["commit"] = "main"
          mutants.append(bad_commit)

          bad_uri = copy.deepcopy(record)
          bad_uri["source"]["repository_url"] = "not a URI"
          mutants.append(bad_uri)

          bad_status = copy.deepcopy(record)
          bad_status["verification"]["status"] = "verified-by-assertion"
          mutants.append(bad_status)

          missing_contract = copy.deepcopy(record)
          del missing_contract["insight"]["transfer_candidates"][0]["directional_contract"]
          mutants.append(missing_contract)

          incompatible_verified_transfer = copy.deepcopy(verified_record)
          incompatible_candidate = incompatible_verified_transfer["insight"]["transfer_candidates"][0]
          incompatible_candidate["directional_contract"]["compatibility"] = "incompatible"
          incompatible_candidate["directional_contract"]["mismatch_codes"] = ["inequality_direction"]
          mutants.append(incompatible_verified_transfer)

          verified_without_receipt = copy.deepcopy(record)
          verified_candidate_without_receipt = verified_without_receipt["insight"]["transfer_candidates"][0]
          verified_candidate_without_receipt["status"] = "verified_transfer"
          verified_candidate_without_receipt["target_theorem_id"] = "OAI.Synthetic.target"
          mutants.append(verified_without_receipt)

          missing_target_evidence = copy.deepcopy(verified_record)
          del missing_target_evidence["insight"]["transfer_candidates"][0]["transfer_verification"]
          mutants.append(missing_target_evidence)

          rejected_without_mismatch = copy.deepcopy(record)
          rejected_candidate = rejected_without_mismatch["insight"]["transfer_candidates"][0]
          rejected_candidate["status"] = "rejected"
          rejected_candidate["directional_contract"]["compatibility"] = "unknown"
          rejected_candidate["directional_contract"]["mismatch_codes"] = ["unknown"]
          mutants.append(rejected_without_mismatch)

          for index, mutant in enumerate(mutants, start=1):
              try:
                  validator.validate(mutant)
              except ValidationError:
                  continue
              raise SystemExit(f"schema negative control {index} unexpectedly passed")
          print(f"PITB Draft 2020-12 schema: PASS; synthetic positive control: PASS; {len(mutants)} negative controls rejected, including transfer-contract invariants")
          PY
      - name: Validate temporal replay manifest schema and mutation controls
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          schema_path = Path("data/benchmarks/proof-insight-transfer-v0/temporal-replay-manifest.schema.json")
          schema = json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          def sha(char, length=64):
              return char * length

          def commit(char):
              return char * 40

          manifest = {
              "schema_version": "pitb.temporal-replay-manifest.v0",
              "repository_url": "https://example.invalid/temporal-fixture",
              "repository_commit": commit("5"),
              "timeline_path": "proof_timeline.csv",
              "timeline_sha256": sha("9"),
              "lean_toolchain_path": "lean-toolchain",
              "lean_toolchain": "leanprover/lean4:v4.34.1",
              "mathlib_manifest_path": "lake-manifest.json",
              "mathlib_manifest_sha256": sha("8"),
              "mathlib_revision": commit("6"),
              "events": [
                  {
                      "position": 0,
                      "target_id": "target-000",
                      "theorem_id": "Example.first",
                      "target_state_commit": commit("1"),
                      "proof_completion_commit": commit("2"),
                      "statement_sha256": sha("a"),
                      "statement_artifact_id": "statement-000",
                      "completion_statement_artifact_id": "completion-statement-000",
                      "proof_artifact_id": "proof-000",
                      "visible_artifact_ids": ["statement-000"]
                  },
                  {
                      "position": 1,
                      "target_id": "target-001",
                      "theorem_id": "Example.second",
                      "target_state_commit": commit("2"),
                      "proof_completion_commit": commit("3"),
                      "statement_sha256": sha("c"),
                      "statement_artifact_id": "statement-001",
                      "completion_statement_artifact_id": "completion-statement-001",
                      "proof_artifact_id": "proof-001",
                      "visible_artifact_ids": ["statement-000", "proof-000", "statement-001"]
                  }
              ],
              "artifacts": [
                  {
                      "artifact_id": "statement-000",
                      "path": "lean/Example.lean",
                      "artifact_kind": "theorem_statement",
                      "content_sha256": sha("a"),
                      "content_start_line": 1,
                      "content_end_line": 1,
                      "source_file_sha256": sha("e"),
                      "source_commit": commit("1"),
                      "available_at_position": 0,
                      "target_position": None,
                      "theorem_id": "Example.first"
                  },
                  {
                      "artifact_id": "proof-000",
                      "path": "lean/Example.lean",
                      "artifact_kind": "proof_body",
                      "content_sha256": sha("b"),
                      "content_start_line": 2,
                      "content_end_line": 2,
                      "source_file_sha256": sha("f"),
                      "source_commit": commit("2"),
                      "available_at_position": None,
                      "target_position": 0,
                      "theorem_id": "Example.first"
                  },
                  {
                      "artifact_id": "completion-statement-000",
                      "path": "lean/Example.lean",
                      "artifact_kind": "completion_statement",
                      "content_sha256": sha("a"),
                      "content_start_line": 1,
                      "content_end_line": 1,
                      "source_file_sha256": sha("f"),
                      "source_commit": commit("2"),
                      "available_at_position": None,
                      "target_position": 0,
                      "theorem_id": "Example.first"
                  },
                  {
                      "artifact_id": "statement-001",
                      "path": "lean/Example.lean",
                      "artifact_kind": "theorem_statement",
                      "content_sha256": sha("c"),
                      "content_start_line": 3,
                      "content_end_line": 3,
                      "source_file_sha256": sha("7"),
                      "source_commit": commit("2"),
                      "available_at_position": 1,
                      "target_position": None,
                      "theorem_id": "Example.second"
                  },
                  {
                      "artifact_id": "completion-statement-001",
                      "path": "lean/Example.lean",
                      "artifact_kind": "completion_statement",
                      "content_sha256": sha("c"),
                      "content_start_line": 3,
                      "content_end_line": 3,
                      "source_file_sha256": sha("8"),
                      "source_commit": commit("3"),
                      "available_at_position": None,
                      "target_position": 1,
                      "theorem_id": "Example.second"
                  },
                  {
                      "artifact_id": "proof-001",
                      "path": "lean/Example.lean",
                      "artifact_kind": "proof_body",
                      "content_sha256": sha("d"),
                      "content_start_line": 4,
                      "content_end_line": 4,
                      "source_file_sha256": sha("8"),
                      "source_commit": commit("3"),
                      "available_at_position": None,
                      "target_position": 1,
                      "theorem_id": "Example.second"
                  }
              ]
          }
          validator.validate(manifest)

          mutants = []
          bad_digest = copy.deepcopy(manifest)
          bad_digest["timeline_sha256"] = "not-a-sha256"
          mutants.append(bad_digest)

          traversal_path = copy.deepcopy(manifest)
          traversal_path["artifacts"][0]["path"] = "../outside.lean"
          mutants.append(traversal_path)

          traversal_timeline = copy.deepcopy(manifest)
          traversal_timeline["timeline_path"] = "../outside.csv"
          mutants.append(traversal_timeline)

          proof_marked_solver_visible = copy.deepcopy(manifest)
          proof_marked_solver_visible["artifacts"][1]["available_at_position"] = 0
          mutants.append(proof_marked_solver_visible)

          theorem_marked_evaluator_only = copy.deepcopy(manifest)
          theorem_marked_evaluator_only["artifacts"][0]["available_at_position"] = None
          theorem_marked_evaluator_only["artifacts"][0]["target_position"] = 0
          mutants.append(theorem_marked_evaluator_only)

          unknown_authority_field = copy.deepcopy(manifest)
          unknown_authority_field["trusted"] = True
          mutants.append(unknown_authority_field)

          for number, mutant in enumerate(mutants, start=1):
              try:
                  validator.validate(mutant)
              except ValidationError:
                  continue
              raise SystemExit(f"temporal manifest negative control {number} unexpectedly passed")

          print(
              "PITB_TEMPORAL_SCHEMA_PASS: Draft 2020-12 positive fixture accepted; "
              f"{len(mutants)} malformed-manifest controls rejected"
          )

          bundle_schema_path = Path("data/benchmarks/proof-insight-transfer-v0/temporal-target-bundle.schema.json")
          bundle_schema = json.loads(bundle_schema_path.read_text())
          Draft202012Validator.check_schema(bundle_schema)
          bundle_validator = Draft202012Validator(bundle_schema, format_checker=FormatChecker())
          bundle = {
              "payload_sha256": sha("f"),
              "payload": {
                  "schema_version": "pitb.temporal-target-bundle.v0",
                  "repository_url": "https://example.invalid/temporal-fixture",
                  "repository_commit": commit("5"),
                  "target_id": "target-001",
                  "theorem_id": "Example.second",
                  "position": 1,
                  "target_state_commit": commit("2"),
                  "statement_artifact_id": "statement-001",
                  "statement_sha256": sha("c"),
                  "visible_artifacts": [
                      {
                          "artifact_id": "statement-001",
                          "path": "lean/Example.lean",
                          "artifact_kind": "theorem_statement",
                          "content_sha256": sha("c"),
                          "source_file_sha256": sha("7"),
                          "source_commit": commit("2"),
                          "available_at_position": 1,
                          "target_position": None,
