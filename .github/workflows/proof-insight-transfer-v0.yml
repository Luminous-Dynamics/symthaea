          cargo run --release --locked --bin symthaea-proof-insights -- \
            --audit-temporal-dataset "$dalek" proof_timeline.csv dataset.jsonl "$audit"
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - "$audit" "$dalek" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          audit_path, dalek, workspace = map(Path, sys.argv[1:])
          audit = json.loads(audit_path.read_text())
          schema_path = workspace / "data/benchmarks/proof-insight-transfer-v0/temporal-dataset-join-audit.schema.json"
          schema = json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(audit)

          expected_commit = "9fdbfd066420aebcf61a70b06eba57a108c41340"
          if audit["repository_commit"] != expected_commit:
              raise SystemExit("dataset join audit references an unexpected repository commit")
          if audit["total_timeline_rows"] != 248:
              raise SystemExit("dataset join audit expected exactly 248 timeline rows")
          if audit["invalid_timeline_path_count"] != 1:
              raise SystemExit("pinned timeline must explicitly account for its one rejected machine-local source path")
          if audit["total_dataset_records"] != 146 or len(audit["events"]) != 146:
              raise SystemExit("pinned Dalek dataset.jsonl must contain exactly 146 records")
          if audit["unique_path_join_count"] != 39:
              raise SystemExit("unexpected count of dataset records with exactly one timeline-path match")
          if audit["ambiguous_path_join_count"] != 58:
              raise SystemExit("unexpected count of dataset records with multiple timeline-path matches")
          if audit["unmatched_path_join_count"] != 49:
              raise SystemExit("unexpected count of dataset records with no timeline-path match")
          if audit["invalid_dataset_path_count"] != 0:
              raise SystemExit("pinned dataset contains an unsafe/noncanonical repository path")
          if (
              audit["unique_path_join_count"]
              + audit["ambiguous_path_join_count"]
              + audit["unmatched_path_join_count"]
              + audit["invalid_dataset_path_count"]
          ) != audit["total_dataset_records"]:
              raise SystemExit("dataset join accounting does not cover all records")
          dataset_bytes = (dalek / audit["dataset_path"]).read_bytes()
          if hashlib.sha256(dataset_bytes).hexdigest() != audit["dataset_sha256"]:
              raise SystemExit("dataset JSONL digest differs from the pinned checkout bytes")
          if sum(audit["statement_match_relation_counts"].values()) != audit["total_dataset_records"]:
              raise SystemExit("statement-match relation accounting does not cover all dataset records")
          identity_total = (
              audit["unique_theorem_identity_join_count"]
              + audit["ambiguous_theorem_identity_join_count"]
              + audit["unmatched_theorem_identity_join_count"]
          )
          if identity_total != audit["total_dataset_records"]:
              raise SystemExit("theorem-identity join accounting does not cover all dataset records")
          if sum(audit["theorem_identity_status_counts"].values()) != audit["total_dataset_records"]:
              raise SystemExit("theorem-identity status counts do not cover all dataset records")
          by_status = {event["path_join_status"]: 0 for event in audit["events"]}
          for event in audit["events"]:
              path_positions = set(event["candidate_timeline_positions"])
              if not set(event["identity_candidate_timeline_positions"]).issubset(path_positions):
                  raise SystemExit("theorem identity join refers to a timeline row outside its path candidates")
              ambiguous_declarations = event["ambiguous_declaration_timeline_positions"]
              if not set(ambiguous_declarations).issubset(path_positions):
                  raise SystemExit("ambiguous declarations refer to a timeline row outside its path candidates")
              if event["identity_join_status"] == "ambiguous_declaration_identity" and not ambiguous_declarations:
                  raise SystemExit("ambiguous declaration status lacks explicit ambiguous timeline positions")
              if event["identity_join_status"] == "unique_stable_theorem_proof_transition":
                  if len(event["identity_candidate_timeline_positions"]) != 1:
                      raise SystemExit("stable theorem identity must resolve to exactly one proof transition")
                  if event["identity_statement_match_at_commit_before"] is not True or event["identity_statement_match_at_completion"] is not True:
                      raise SystemExit("stable theorem identity lacks exact statement agreement")
                  if event["identity_proof_matches_completion"] is not True or event["identity_proof_absent_at_commit_before"] is not True:
                      raise SystemExit("stable theorem identity lacks proof provenance/hidden-target evidence")
              by_status[event["path_join_status"]] += 1
              if event["path_join_status"] == "unique_path_match":
                  if len(event["candidate_timeline_positions"]) != 1 or not event["matched_completion_commit"]:
                      raise SystemExit("unique path join does not identify exactly one completion event")
              elif event["path_join_status"] == "ambiguous_path_match":
                  if len(event["candidate_timeline_positions"]) < 2 or event["matched_completion_commit"] is not None:
                      raise SystemExit("ambiguous path join was incorrectly resolved")
              else:
                  if event["candidate_timeline_positions"] or event["matched_completion_commit"] is not None:
                      raise SystemExit("unmatched/invalid path retained a false timeline assignment")
          print(
              "PITB_DALEK_DATASET_JOIN_AUDIT_PASS: "
              f"records={audit['total_dataset_records']} "
              f"invalid_timeline_paths={audit['invalid_timeline_path_count']} "
              f"unique_path={audit['unique_path_join_count']} "
              f"ambiguous_path={audit['ambiguous_path_join_count']} "
              f"unmatched_path={audit['unmatched_path_join_count']} "
              f"unique_identity={audit['unique_theorem_identity_join_count']} "
              f"ambiguous_identity={audit['ambiguous_theorem_identity_join_count']} "
              f"unmatched_identity={audit['unmatched_theorem_identity_join_count']} "
              f"identity_statuses={json.dumps(audit['theorem_identity_status_counts'], sort_keys=True)} "
              f"before_commit_ancestor={audit['commit_before_ancestor_of_head_count']} "
              f"before_commit_nonancestor={audit['commit_before_not_ancestor_of_head_count']} "
              f"before_commit_missing_object={audit['commit_before_missing_commit_object_count']} "
              f"statement_relations={json.dumps(audit['statement_match_relation_counts'], sort_keys=True)} "
              f"dataset_sha256={audit['dataset_sha256']}"
          )
          PY
      - name: Index pinned OpenAI math snapshot twice
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="1581d4cbdd69a0faf34b2089614fe2a814316a6a"
          upstream="$RUNNER_TEMP/openai-math"
          first="$RUNNER_TEMP/proof-insight-source-index-1.json"
          second="$RUNNER_TEMP/proof-insight-source-index-2.json"
          git clone --quiet https://github.com/openai/math.git "$upstream"
          git -C "$upstream" checkout --quiet --detach "$upstream_sha"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$upstream_sha"
          test -z "$(git -C "$upstream" status --porcelain)"
          cd "$(dirname "$PITB_MANIFEST")"
          cargo run --locked --bin symthaea-proof-insights -- "$upstream" "$upstream_sha" "$first"
          cargo run --locked --bin symthaea-proof-insights -- "$upstream" "$upstream_sha" "$second"
          cmp "$first" "$second"
          jq -e --arg sha "$upstream_sha" '
            .upstream_commit == $sha and
            .catalogue_claims.readme_claimed_family_count == 372 and
            .catalogue_claims.parsed_family_header_count == 372 and
            .family_split_plan.train_family_count == 260 and
            .family_split_plan.validation_family_count == 56 and
            .family_split_plan.test_family_count == 56 and
            .summary.formalization_source_count == 173 and
            .summary.main_result_declaration_count == 200 and
            (.source_fingerprints | any(.path == "README.md")) and
            (.source_fingerprints | any(.path == "CONTENTS.md")) and
            (.source_fingerprints | any(.path == "lean/formalization.yaml")) and
            (.source_fingerprints | any(.path == "lean/ComparatorChallenges/README.md"))
          ' "$first" >/dev/null
          test -z "$(git -C "$upstream" status --porcelain)"
          python - "$upstream" "$first" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          upstream, index_path, workspace = map(Path, sys.argv[1:])
          candidate_paths = [
              workspace / "data/benchmarks/proof-insight-transfer-v0/candidates/025-short-egyptian-greedy-residue.json",
              workspace / "data/benchmarks/proof-insight-transfer-v0/candidates/026-eventual-subset-density-transfer.json",
          ]
          split_path = workspace / "data/benchmarks/proof-insight-transfer-v0/splits.json"
          records = [(candidate_path, json.loads(candidate_path.read_text())) for candidate_path in candidate_paths]
          index = json.loads(index_path.read_text())
          split_manifest = json.loads(split_path.read_text())

          # Independently compare the generated family assignments with the
          # frozen manifest, not merely the summary counts or declared digest.
          indexed_families = index["families"]
          frozen_families = split_manifest["families"]
          indexed_assignments = {
              item["family_id"]: item["split"] for item in indexed_families
          }
          frozen_assignments = {
              item["family_id"]: item["split"] for item in frozen_families
          }
          if len(indexed_families) != 372 or len(indexed_assignments) != 372:
              raise SystemExit("generated index must contain 372 unique family assignments")
          if len(frozen_families) != 372 or len(frozen_assignments) != 372:
              raise SystemExit("frozen split must contain 372 unique family assignments")
          if indexed_assignments != frozen_assignments:
              differing = sorted(
                  family_id
                  for family_id in set(indexed_assignments) | set(frozen_assignments)
                  if indexed_assignments.get(family_id) != frozen_assignments.get(family_id)
              )
              raise SystemExit(
                  "generated family assignments differ from frozen splits.json: "
                  + repr(differing[:20])
              )
          material = "".join(
              f"{family_id}\t{indexed_assignments[family_id]}\n"
              for family_id in sorted(indexed_assignments)
          ).encode("utf-8")
          partition_digest = hashlib.sha256(material).hexdigest()
          if partition_digest != split_manifest["split_plan"]["partition_digest_sha256"]:
              raise SystemExit("independently recomputed split digest differs from splits.json")
          if partition_digest != index["family_split_plan"]["partition_digest_sha256"]:
              raise SystemExit("generated index partition digest differs from independently recomputed digest")
          print(f"PITB_FROZEN_SPLIT_REPRODUCTION_PASS: {partition_digest}")

          for record_path, record in records:
              relative = Path(record["source"]["path"])
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit("candidate source path must remain repository-relative")
              source = upstream / relative
              try:
                  source.resolve().relative_to(upstream.resolve())
              except ValueError as error:
                  raise SystemExit("candidate source path escaped the pinned checkout") from error
              source_bytes = source.read_bytes()
              source_sha256 = hashlib.sha256(source_bytes).hexdigest()
              if source_sha256 != record["source"]["sha256"]:
                  raise SystemExit("candidate source SHA-256 differs from the pinned upstream bytes")
              if source_sha256 != record["artifact"]["sha256"]:
                  raise SystemExit("candidate artifact and source digests disagree")
              statement = record["theorem"]["statement_text"]
              statement_digest = hashlib.sha256(statement.encode("utf-8")).hexdigest()
              if statement_digest != record["theorem"]["statement_digest"]:
                  raise SystemExit("candidate statement digest does not match its exact stored UTF-8 text")
              normalized_statement = " ".join(statement.split())
              normalized_source = " ".join(source_bytes.decode("utf-8").split())
              if normalized_statement not in normalized_source:
                  raise SystemExit("candidate theorem signature is not present after whitespace normalization in the pinned source")
              indexed = [
                  item for item in index["source_fingerprints"]
                  if item["path"] == record["source"]["path"]
              ]
              if len(indexed) > 1:
                  raise SystemExit("candidate source path is duplicated in the reproducible source index")
              if indexed and indexed[0]["sha256"] != source_sha256:
                  raise SystemExit("candidate source digest disagrees with the reproducible source index")
              # The upstream index is intentionally scoped to manifest and catalogue-linked
              # artifacts, so a supporting Lean file may be absent. Its pinned-checkout
              # bytes are still verified independently above.
              family = record["source"]["family_id"]
              assignments = [
                  item for item in split_manifest["families"]
                  if item["family_id"] == family
              ]
              if len(assignments) != 1 or assignments[0]["split"] != "train":
                  raise SystemExit("new candidate must remain in exactly one frozen training family")
              print(
                  "PITB_TRAINING_CANDIDATE_PINNED_SOURCE_PASS: "
                  f"family={family} indexed={bool(indexed)} source_sha256={source_sha256} statement_sha256={statement_digest}"
              )
          PY
          echo "PITB_PINNED_SOURCE_INDEX_PASS: $upstream_sha"
      - name: Upload exact-source index and receipts
        uses: actions/upload-artifact@v4
        with:
          name: proof-insight-transfer-v0-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/proof-insight-source-index-*.json
            ${{ runner.temp }}/proof-insight-isolated/Cargo.lock
            ${{ runner.temp }}/dalek-temporal-timeline-audit.json
            ${{ runner.temp }}/dalek-temporal-dataset-audit.json
          if-no-files-found: error
          retention-days: 30
