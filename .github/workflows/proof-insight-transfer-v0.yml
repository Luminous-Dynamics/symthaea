                  links = case["outcome_links"]
                  reject(links["base_outcome_id"] == links["variant_outcome_id"], "base and variant outcome IDs must be unique")
                  if value["dataset_kind"] == "synthetic_fixture":
                      reject(links["status"] != "not_run", "synthetic fixture cannot claim linked executed outcomes")

          validate_suite(fixture)
          if len(fixture["cases"]) < 4:
              raise SystemExit("fixture must cover required-removal, alpha-renaming, irrelevant-removal and reordering")

          def expect_reject(mutant, label):
              try:
