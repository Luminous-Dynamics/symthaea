      - name: Validate paired proof-state outcome contract and joins
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          root = Path("data/benchmarks/proof-insight-transfer-v0")
          outcome_schema = json.loads((root / "proof-state-intervention-outcome.schema.json").read_text())
          suite = json.loads((root / "fixtures/proof-state-intervention-suite.synthetic.json").read_text())
          bundle = json.loads((root / "fixtures/proof-state-intervention-outcomes.synthetic.json").read_text())
          Draft202012Validator.check_schema(outcome_schema)
          validator = Draft202012Validator(outcome_schema, format_checker=FormatChecker())

          def reject(condition, message):
              if condition:
                  raise ValueError(message)

          def validate_bundle(value):
              validator.validate(value)
              reject(value["schema_version"] != "pitb.proof-state-intervention-outcomes.v0", "unsupported outcome schema version")
              reject(value["dataset_kind"] != "synthetic_fixture", "checked-in outcome fixture must stay explicitly synthetic")
              reject(value["suite_id"] != suite["suite_id"], "outcome suite ID does not match its proof-state suite")
              cases = {case["case_id"]: case for case in suite["cases"]}
              by_id = {}
              for row in value["outcomes"]:
                  oid = row["outcome_id"]
                  reject(oid in by_id, f"duplicate outcome ID: {oid}")
                  by_id[oid] = row
                  reject(row["case_id"] not in cases, f"unknown proof-state case ID: {row['case_id']}")
                  case = cases[row["case_id"]]
                  reject(row["pair_id"] != case["pair_id"], f"{oid}: pair ID does not match suite")
                  reject(row["component_id"] != case["component_id"], f"{oid}: component does not match suite")
                  reject(row["split"] != case["split"], f"{oid}: split does not match suite")
                  reject(row["source_insight_record_id"] != case["source_insight"]["record_id"], f"{oid}: insight record does not match suite")
                  reject(row["source_insight_sha256"] != case["source_insight"]["insight_sha256"], f"{oid}: insight digest does not match suite")
                  role = row["state_role"]
                  intervention_kind = case["intervention"]["kind"]
                  expected_applicability = (
                      "not_applicable"
                      if role == "variant" and intervention_kind == "required_hypothesis_cleared"
                      else "eligible"
                  )
                  expected_policy = (
                      "move_forbidden_or_replan"
                      if expected_applicability == "not_applicable"
                      else "preserve_eligibility"
                  )
                  reject(row["expected_applicability"] != expected_applicability, f"{oid}: expected applicability is inconsistent with the paired intervention and state role")
                  reject(row["expected_action_policy"] != expected_policy, f"{oid}: expected action policy is inconsistent with the paired intervention and state role")
