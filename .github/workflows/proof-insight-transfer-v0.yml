                      }
                  ]
              }
          }
          bundle_validator.validate(bundle)
          bundle_mutants = []
          bad_bundle_digest = copy.deepcopy(bundle)
          bad_bundle_digest["payload_sha256"] = "not-a-digest"
          bundle_mutants.append(bad_bundle_digest)
          path_traversal_bundle = copy.deepcopy(bundle)
          path_traversal_bundle["payload"]["visible_artifacts"][0]["path"] = "../outside.lean"
          bundle_mutants.append(path_traversal_bundle)
          evaluator_leak_kind = copy.deepcopy(bundle)
          evaluator_leak_kind["payload"]["visible_artifacts"][0]["artifact_kind"] = "completion_statement"
          bundle_mutants.append(evaluator_leak_kind)
          unknown_bundle_authority = copy.deepcopy(bundle)
          unknown_bundle_authority["payload"]["trusted"] = True
          bundle_mutants.append(unknown_bundle_authority)
          for number, mutant in enumerate(bundle_mutants, start=1):
              try:
                  bundle_validator.validate(mutant)
              except ValidationError:
                  continue
              raise SystemExit(f"temporal target bundle negative control {number} unexpectedly passed")
          print(
              "PITB_TEMPORAL_BUNDLE_SCHEMA_PASS: Draft 2020-12 positive fixture accepted; "
              f"{len(bundle_mutants)} invalid-bundle controls rejected"
          )
          PY
      - name: Validate transfer-selectivity outcome schema and synthetic controls
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - <<'PY'
          import copy
