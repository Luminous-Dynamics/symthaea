name: SEMI-BENCH-001 Reference Oracle

on:
  pull_request:
    paths:
      - "benchmarks/semi-bench-001/**"
      - "crates/domains/symthaea-semiconductor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/semi-bench-reference.yml"
  push:
    paths:
      - "benchmarks/semi-bench-001/**"
      - "crates/domains/symthaea-semiconductor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/semi-bench-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-metrics-reference:
    name: Binary metric known answers and adversarial controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python (test-only reference)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run reference unit tests
        run: |
          python -m unittest discover \
            -s benchmarks/semi-bench-001/reference/python \
            -p 'test_*.py' -v
      - name: Reproduce binary metric report byte-for-byte
        run: |
          python benchmarks/semi-bench-001/reference/python/semi_binary_metrics_reference.py \
            > /tmp/semi-bench-binary-report.json
          diff -u \
            benchmarks/semi-bench-001/reference/fixtures/binary-metrics-known-answer-v1.expected.json \
            /tmp/semi-bench-binary-report.json
      - name: Reproduce inspection decision report byte-for-byte
        run: |
          python benchmarks/semi-bench-001/reference/python/semi_inspection_decision_reference.py \
            > /tmp/semi-bench-inspection-report.json
          diff -u \
            benchmarks/semi-bench-001/reference/fixtures/inspection-decision-known-answer-v1.expected.json \
            /tmp/semi-bench-inspection-report.json

      - name: Reproduce contrastive-pair validation report byte-for-byte
        run: |
          python benchmarks/semi-bench-001/reference/python/semi_pair_manifest_reference.py \
            benchmarks/semi-bench-001/reference/fixtures/contrastive-pair-manifest-known-answer-v1.json \
            > /tmp/semi-bench-pair-report.json
          diff -u \
            benchmarks/semi-bench-001/reference/fixtures/contrastive-pair-manifest-known-answer-v1.expected.json \
            /tmp/semi-bench-pair-report.json

  rust-semiconductor-reference:
    name: Rust semiconductor metric contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Create isolated workspace for semiconductor crate
        run: |
          mkdir -p /tmp/semi-rust-work/crates/domains
          mkdir -p /tmp/semi-rust-work/benchmarks
          mkdir -p /tmp/semi-rust-work/docs/research
          cp -R crates/domains/symthaea-semiconductor /tmp/semi-rust-work/crates/domains/
          cp -R benchmarks/semi-bench-001 /tmp/semi-rust-work/benchmarks/
          cp -R docs/research/semi-bench-001 /tmp/semi-rust-work/docs/research/
          cat > /tmp/semi-rust-work/Cargo.toml <<'EOF'
          [workspace]
          members = ["crates/domains/symthaea-semiconductor"]
          resolver = "2"

          [workspace.package]
          edition = "2024"
          license = "AGPL-3.0-or-later"

          [workspace.dependencies]
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          thiserror = "1.0"
          chrono = { version = "0.4", features = ["serde"] }
          sha2 = "0.10"
          EOF
      - name: Format semiconductor crate
        run: cargo fmt --manifest-path /tmp/semi-rust-work/crates/domains/symthaea-semiconductor/Cargo.toml -- --check
      - name: Clippy semiconductor crate
        run: cargo clippy --manifest-path /tmp/semi-rust-work/crates/domains/symthaea-semiconductor/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust semiconductor scorer
        run: cargo test --manifest-path /tmp/semi-rust-work/crates/domains/symthaea-semiconductor/Cargo.toml
      - name: Reproduce Rust binary metric report byte-for-byte
        run: |
          cargo run --manifest-path /tmp/semi-rust-work/crates/domains/symthaea-semiconductor/Cargo.toml --bin semi-binary-metrics -- \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/binary-metrics-known-answer-v1.json \
            > /tmp/semi-rust-rust-metrics.json
          diff -u \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/binary-metrics-known-answer-v1.expected.json \
            /tmp/semi-rust-rust-metrics.json
      - name: Reproduce Rust SECOM raw audit report byte-for-byte
        run: |
          cargo run --manifest-path /tmp/semi-rust-work/crates/domains/symthaea-semiconductor/Cargo.toml --bin semi-secom-audit -- \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/secom-mini-features-v1.data \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/secom-mini-labels-v1.data \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/secom-mini-expectations-v1.json \
            > /tmp/semi-rust-secom-report.json
          diff -u \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/secom-mini-integrity-report-v1.expected.json \
            /tmp/semi-rust-secom-report.json
      - name: Reproduce Rust DTCO lineage report byte-for-byte
        run: |
          cargo run --manifest-path /tmp/semi-rust-work/crates/domains/symthaea-semiconductor/Cargo.toml --bin semi-dtco-lineage -- \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/dtco-lineage-known-answer-v1.json \
            > /tmp/semi-rust-dtco-lineage.json
          diff -u \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/dtco-lineage-known-answer-v1.expected.json \
            /tmp/semi-rust-dtco-lineage.json
      - name: Reproduce Rust multi-fidelity acquisition report byte-for-byte
        run: |
          cargo run --manifest-path /tmp/semi-rust-work/crates/domains/symthaea-semiconductor/Cargo.toml --bin semi-mf-acquire -- \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/mf-acquisition-known-answer-v1.json \
            > /tmp/semi-rust-mf-acquisition.json
          diff -u \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/mf-acquisition-known-answer-v1.expected.json \
            /tmp/semi-rust-mf-acquisition.json

      - name: Run Rust SECOM missingness-only baseline on synthetic known answer
        run: |
          cargo run --manifest-path /tmp/semi-rust-work/crates/domains/symthaea-semiconductor/Cargo.toml --bin semi-secom-missingness -- \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/secom-missingness-mini-features-v1.data \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/secom-missingness-mini-labels-v1.data \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/secom-missingness-mini-expectations-v1.json \
            /tmp/semi-rust-work/benchmarks/semi-bench-001/reference/fixtures/secom-missingness-mini-split-v1.json \
            > /tmp/semi-rust-secom-missingness.json
          jq -e '
            .schema == "luminous.semi-bench.secom-missingness-report.v1" and
            .training_rows == 4 and
            .training_failures == 2 and
            .training_passes == 2 and
            .held_out.validation.prevalence_only_metrics.ranking_metrics.auroc == 0.5 and
            .held_out.test.prevalence_only_metrics.ranking_metrics.auroc == 0.5 and
            .held_out.validation.missingness_only_metrics.ranking_metrics.auroc == 1.0 and
            .held_out.test.missingness_only_metrics.ranking_metrics.auroc == 1.0
          ' /tmp/semi-rust-secom-missingness.json > /dev/null
