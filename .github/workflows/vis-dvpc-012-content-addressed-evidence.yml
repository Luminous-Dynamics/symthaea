name: VIS-DVPC-012 content-addressed evidence

on:
  pull_request:
    paths:
      - "tools/vision-dvpc-integrity-receipt.rs"
      - "tools/vision-dvpc-trace-validator.rs"
      - "docs/research/VIS_DVPC_012_CONTENT_ADDRESSED_EVIDENCE_V1.md"
      - ".github/workflows/vis-dvpc-012-content-addressed-evidence.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-integrity-receipt.rs"
      - "tools/vision-dvpc-trace-validator.rs"
      - "docs/research/VIS_DVPC_012_CONTENT_ADDRESSED_EVIDENCE_V1.md"
      - ".github/workflows/vis-dvpc-012-content-addressed-evidence.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Install stable Rust and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Compile and run integrity-verifier tests
        run: |
          rustc --edition=2024 --test tools/vision-dvpc-integrity-receipt.rs -o /tmp/vis-dvpc-012-tests
          /tmp/vis-dvpc-012-tests

      - name: Build standalone integrity verifier
        run: rustc --edition=2024 -O tools/vision-dvpc-integrity-receipt.rs -o /tmp/vis-dvpc-012

      - name: Re-run parent admission contract tests
        run: |
          rustc --edition=2024 --test tools/vision-dvpc-trace-validator.rs -o /tmp/vis-dvpc-005-tests
          /tmp/vis-dvpc-005-tests

      - name: Build and admit checked-in synthetic paired-trace fixture
        run: |
          rustc --edition=2024 -O tools/vision-dvpc-trace-validator.rs -o /tmp/vis-dvpc-005
          /tmp/vis-dvpc-005 fixtures/vision-dvpc-observations.tsv fixtures/vision-dvpc-evaluations.tsv > /tmp/vis-dvpc-005-receipt.tsv
          grep -Fx $'ADMISSION\tstatus\tPASS_SCHEMA_ONLY' /tmp/vis-dvpc-005-receipt.tsv
          grep -Fx $'ADMISSION\tperformance_claim\tNONE' /tmp/vis-dvpc-005-receipt.tsv

      - name: Check Rust formatting
        if: always()
        run: |
          rustfmt --edition 2024 --check tools/vision-dvpc-integrity-receipt.rs
          rustfmt --edition 2024 --check tools/vision-dvpc-trace-validator.rs
