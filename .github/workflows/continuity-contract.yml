# Focused exact-head software-contract qualification for symthaea-continuity.
#
# This lane is intentionally narrower than repository-wide CI. It proves the
# exact committed continuity crate head satisfies its local software contracts;
# it does not establish real-world availability, scientific evidence, policy
# approval, or execution authority.

name: Continuity Contract Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/continuity-contract.yml'
      - 'scripts/qualify-continuity-contract.sh'
      - 'crates/core/symthaea-continuity/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'rust-toolchain*'
  workflow_dispatch:

concurrency:
  group: continuity-contract-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02
  CONTINUITY_RUNNER_LABEL: ubuntu-24.04

jobs:
  continuity-contract:
    name: Exact-head continuity contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact qualified head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned workflow actions
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc "uses: actions/checkout@$CHECKOUT_ACTION_SHA" .github/workflows/continuity-contract.yml)" -eq 1
          test "$(grep -Fc "uses: actions/upload-artifact@$UPLOAD_ARTIFACT_ACTION_SHA" .github/workflows/continuity-contract.yml)" -eq 3
          if grep -Eq 'uses: actions/(checkout|upload-artifact)@v[0-9]+' .github/workflows/continuity-contract.yml; then
            echo 'mutable major-version GitHub Action tag found in continuity qualification workflow' >&2
            exit 1
          fi

      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)"
          test -n "$channel"
          rustup toolchain install "$channel" \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustup override set "$channel"
          test "$(rustc --version | awk '{print $2}')" = "$channel"
          rustc --version
          cargo --version

      - name: Qualify continuity contracts
        env:
          QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CONTINUITY_CONTRACT_RECEIPT: ${{ runner.temp }}/continuity-contract-qualification-v1.tsv
          CONTINUITY_FORMAT_PATCH: ${{ runner.temp }}/symthaea-continuity-rustfmt.patch
          CONTINUITY_FORMAT_SOURCE_DIR: ${{ runner.temp }}/symthaea-continuity-rustfmt-source
        run: bash scripts/qualify-continuity-contract.sh

      - name: Publish receipt and repair digests
        if: always()
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/continuity-contract-qualification-v1.tsv
          FORMAT_PATCH: ${{ runner.temp }}/symthaea-continuity-rustfmt.patch
        run: |
          set -euo pipefail
          if [[ -f "$RECEIPT" ]]; then
            receipt_digest="$(sha256sum "$RECEIPT" | awk '{print $1}')"
            echo "continuity-contract receipt_sha256=$receipt_digest"
            {
              echo
              echo "- receipt SHA-256: \`$receipt_digest\`"
              echo '- receipt bytes are not independently signed; this digest is witnessed by the workflow log.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No qualification receipt was produced; execution did not reach the receipt-bearing verifier.'
          fi
          if [[ -f "$FORMAT_PATCH" ]]; then
            patch_digest="$(sha256sum "$FORMAT_PATCH" | awk '{print $1}')"
            echo "continuity-contract rustfmt_patch_sha256=$patch_digest"
            {
              echo "- rustfmt repair patch SHA-256: \`$patch_digest\`"
              echo '- repair patch was produced by the repository-pinned rustfmt from the exact qualified head.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuity-contract-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/continuity-contract-qualification-v1.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Upload rustfmt repair patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuity-contract-rustfmt-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/symthaea-continuity-rustfmt.patch
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload rustfmt source snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuity-contract-rustfmt-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/symthaea-continuity-rustfmt-source
          if-no-files-found: ignore
          retention-days: 14
