name: Rust toolchain compatibility qualification

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/core/symthaea-core/**"
      - "crates/core/symthaea-fep/**"
      - ".github/workflows/rust-toolchain-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-toolchain-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  baseline-1-96:
    name: Existing pinned baseline (Rust 1.96.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact baseline toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Record exact compiler and Cargo identity
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee rustc-version.txt
          cargo -Vv | tee cargo-version.txt
          grep -F 'rustc 1.96.0 ' rustc-version.txt
          grep -F 'cargo 1.96.0 ' cargo-version.txt

      - name: Validate full workspace metadata without resolving new dependencies
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Format selected core packages
        run: cargo fmt --check --package symthaea-core --package symthaea-fep

      - name: Compile selected core library targets
        run: |
          cargo check --locked --package symthaea-core --lib
          cargo check --locked --package symthaea-fep --lib

      - name: Run selected core library tests
        run: |
          cargo test --locked --package symthaea-core --lib
          cargo test --locked --package symthaea-fep --lib

      - name: Run selected Clippy checks
        run: |
          cargo clippy --locked --package symthaea-core --lib
          cargo clippy --locked --package symthaea-fep --lib

      - name: Build selected API documentation
        run: cargo doc --locked --no-deps --package symthaea-core --package symthaea-fep

      - name: Enforce lockfile immutability
        run: git diff --exit-code -- Cargo.lock

  candidate-1-99:
    name: Candidate compatibility (Rust 1.99.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact candidate toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8

      - name: Record exact compiler and Cargo identity
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee rustc-version.txt
          cargo -Vv | tee cargo-version.txt
          grep -F 'rustc 1.99.1 ' rustc-version.txt
          grep -F 'cargo 1.99.1 ' cargo-version.txt

      - name: Validate full workspace metadata without resolving new dependencies
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Format selected core packages
        run: cargo fmt --check --package symthaea-core --package symthaea-fep

      - name: Compile selected core library targets
        run: |
          cargo check --locked --package symthaea-core --lib
          cargo check --locked --package symthaea-fep --lib

      - name: Run selected core library tests
        run: |
          cargo test --locked --package symthaea-core --lib
          cargo test --locked --package symthaea-fep --lib

      - name: Run selected Clippy checks
        run: |
          cargo clippy --locked --package symthaea-core --lib
          cargo clippy --locked --package symthaea-fep --lib

      - name: Build selected API documentation
        run: cargo doc --locked --no-deps --package symthaea-core --package symthaea-fep

      - name: Enforce lockfile immutability
        run: git diff --exit-code -- Cargo.lock
