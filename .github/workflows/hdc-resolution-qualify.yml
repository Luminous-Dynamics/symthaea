name: HDC Resolution Qualification

on:
  pull_request:
    paths:
      - "crates/core/symthaea-core/src/hdc/resolution_space.rs"
      - "crates/core/symthaea-core/src/hdc/resolution_budget.rs"
      - "crates/core/symthaea-core/src/hdc/simd_continuous.rs"
      - "crates/core/symthaea-core/src/hdc/operator_evidence.rs"
      - "crates/core/symthaea-core/src/hdc/operator_evidence_contract.rs"
      - "crates/core/symthaea-core/src/hdc/trajectory_evidence.rs"
      - "crates/core/symthaea-core/src/hdc/resource_evidence.rs"
      - "crates/core/symthaea-core/src/hdc/performance_evidence.rs"
      - "crates/core/symthaea-core/src/hdc/task_quality_evidence.rs"
      - "crates/core/symthaea-core/src/hdc/cost_quality_join.rs"
      - "crates/core/symthaea-core/src/hdc/evidence_identity.rs"
      - "crates/core/symthaea-core/src/hdc/evidence_manifest.rs"
      - "crates/core/symthaea-core/src/hdc/config.rs"
      - "crates/core/symthaea-core/src/hdc/dimension_observatory.rs"
      - "crates/core/symthaea-core/src/hdc/dimension_sweep.rs"
      - "crates/core/symthaea-core/src/hdc/dimension_frontier.rs"
      - "crates/core/symthaea-core/src/hdc/dimension_task_harness.rs"
      - "crates/core/symthaea-core/src/hdc/noise_robustness_harness.rs"
      - "crates/core/symthaea-core/src/hdc/associative_cleanup_harness.rs"
      - "crates/core/symthaea-core/src/hdc/sequence_order_harness.rs"
      - "crates/core/symthaea-core/src/hdc/resonator.rs"
      - "crates/core/symthaea-core/src/hdc/mod.rs"
      - "crates/core/symthaea-core/src/hdc/pareto_frontier.rs"
      - "crates/core/symthaea-core/tests/hdc_ltc_operator_evidence_chain.rs"
      - "crates/core/symthaea-core/examples/hdc_operator_evidence.rs"
      - "crates/core/symthaea-core/examples/hdc_dimension_task.rs"
      - "crates/core/symthaea-core/examples/hdc_noise_robustness.rs"
      - "crates/core/symthaea-core/examples/hdc_associative_cleanup.rs"
      - "crates/core/symthaea-core/examples/hdc_sequence_order.rs"
      - "crates/core/symthaea-core/benches/simd_continuous.rs"
      - "docs/research/HDC_RESOLUTION_EXTENSIBILITY.md"
      - "docs/research/HDC_DIMENSION_SWEEP.md"
      - "docs/research/HDC_DIMENSION_FRONTIER.md"
      - "docs/research/HDC_DIMENSION_TASK_HARNESS.md"
      - "docs/research/HDC_ASSOCIATIVE_CLEANUP_HARNESS.md"
      - "docs/research/HDC_SEQUENCE_ORDER_HARNESS.md"
      - "docs/research/HDC_LTC_RESOLUTION_TRAJECTORY_MATRIX.md"
      - "rust-toolchain.toml"
      - ".github/workflows/hdc-resolution-qualify.yml"
  workflow_dispatch:

concurrency:
  group: hdc-resolution-qualify-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  qualify:
    name: Exact-head HDC resolution qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Record exact head
        id: head
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$ACTUAL_SHA" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy

      - name: Capture toolchain provenance
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            rustc --version --verbose
            cargo --version --verbose
          } | tee toolchain.txt

      - name: Diff hygiene
        run: git diff --check

      - name: Focused formatting
        run: |
          rustfmt --check --edition 2024 \
            crates/core/symthaea-core/src/hdc/resolution_space.rs \
            crates/core/symthaea-core/src/hdc/resolution_budget.rs \
            crates/core/symthaea-core/src/hdc/simd_continuous.rs \
            crates/core/symthaea-core/src/hdc/operator_evidence.rs \
            crates/core/symthaea-core/src/hdc/operator_evidence_contract.rs \
            crates/core/symthaea-core/src/hdc/trajectory_evidence.rs \
            crates/core/symthaea-core/src/hdc/resource_evidence.rs \
            crates/core/symthaea-core/src/hdc/performance_evidence.rs \
            crates/core/symthaea-core/src/hdc/task_quality_evidence.rs \
            crates/core/symthaea-core/src/hdc/cost_quality_join.rs \
            crates/core/symthaea-core/src/hdc/evidence_identity.rs \
            crates/core/symthaea-core/src/hdc/evidence_manifest.rs \
            crates/core/symthaea-core/src/hdc/config.rs \
            crates/core/symthaea-core/src/hdc/dimension_observatory.rs \
            crates/core/symthaea-core/src/hdc/dimension_task_harness.rs \
            crates/core/symthaea-core/src/hdc/noise_robustness_harness.rs \
            crates/core/symthaea-core/src/hdc/associative_cleanup_harness.rs \
            crates/core/symthaea-core/src/hdc/sequence_order_harness.rs \
            crates/core/symthaea-core/src/hdc/mod.rs \
            crates/core/symthaea-core/src/hdc/pareto_frontier.rs \
            crates/core/symthaea-core/examples/hdc_operator_evidence.rs \
            crates/core/symthaea-core/examples/hdc_dimension_task.rs \
            crates/core/symthaea-core/examples/hdc_noise_robustness.rs \
            crates/core/symthaea-core/examples/hdc_associative_cleanup.rs \
            crates/core/symthaea-core/examples/hdc_sequence_order.rs \
            crates/core/symthaea-core/benches/simd_continuous.rs

      - name: Focused HDC resolution tests
        run: |
          cargo test -p symthaea-core --lib resolution_space
          cargo test -p symthaea-core --lib resolution_budget
          cargo test -p symthaea-core --lib simd_continuous --features simd
          cargo test -p symthaea-core --lib operator_evidence --features simd
          cargo test -p symthaea-core --lib operator_evidence_contract
          cargo test -p symthaea-core --lib trajectory_evidence
          cargo test -p symthaea-core --lib resource_evidence
          cargo test -p symthaea-core --lib performance_evidence
          cargo test -p symthaea-core --lib task_quality_evidence
          cargo test -p symthaea-core --lib cost_quality_join
          cargo test -p symthaea-core --lib evidence_identity
          cargo test -p symthaea-core --lib evidence_manifest
          cargo test -p symthaea-core --lib config
          cargo test -p symthaea-core --lib dimension_observatory
          cargo test -p symthaea-core --lib dimension_sweep
          cargo test -p symthaea-core --lib dimension_frontier
          cargo test -p symthaea-core --lib dimension_task_harness
          cargo test -p symthaea-core --lib noise_robustness_harness
          cargo test -p symthaea-core --lib associative_cleanup_harness
          cargo test -p symthaea-core --lib sequence_order_harness
          cargo test -p symthaea-core --lib resonator
          cargo test -p symthaea-core --lib pareto_frontier
          cargo test -p symthaea-core --test hdc_ltc_operator_evidence_chain --features simd

      - name: Focused strict Clippy
        run: |
          cargo clippy -p symthaea-core --lib --features simd -- \
            -D warnings

      - name: Emit machine-readable operator evidence
        run: cargo run -p symthaea-core --example hdc_operator_evidence --features simd > operator-evidence.json

      - name: Validate operator evidence artifact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          records = json.loads(Path("operator-evidence.json").read_text())
          expected_dims = {1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144}
          expected_ops = {"dot", "bind", "bundle", "norm", "similarity"}

          assert len(records) == 45, len(records)
          assert {r["resolution"] for r in records} == expected_dims
          assert {r["operation"] for r in records} == expected_ops
          assert {r["schema_version"] for r in records} == {1}
          assert {r["representation"] for r in records} == {"continuous_f32"}
          keys = [(r["resolution"], r["operation"]) for r in records]
          assert len(set(keys)) == 45
          assert set(keys) == {
              (d, op) for d in expected_dims for op in expected_ops
          }
          assert all(r["qualification_status"] == "qualified" for r in records)
          assert all(r["logical_bytes"] > 0 for r in records)
          assert all(r["seed_a"] == 42 and r["seed_b"] == 43 for r in records)
          PY
          sha256sum operator-evidence.json | tee operator-evidence.sha256

      - name: Write evidence provenance manifest
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          evidence = Path("operator-evidence.json").read_bytes()
          digest = hashlib.sha256(evidence).hexdigest()
          manifest = {
              "schema_version": 1,
              "exact_head": "${{ steps.head.outputs.sha }}",
              "workflow": "${{ github.workflow }}",
              "workflow_run_id": "${{ github.run_id }}",
              "workflow_event": "${{ github.event_name }}",
              "rust_toolchain": "1.96.0",
              "operator_evidence_sha256": digest,
              "operator_evidence_records": 45,
              "operator_evidence_dimensions": [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144],
              "operator_evidence_operations": ["dot", "bind", "bundle", "norm", "similarity"],
              "benchmark_execution": "not-claimed",
              "production_default_changed": False,
          }
          Path("operator-evidence-provenance.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Emit deterministic dimension sweep evidence
        run: cargo run -p symthaea-core --example hdc_dimension_sweep > dimension-sweep-evidence.json

      - name: Validate dimension sweep evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("dimension-sweep-evidence.json").read_text())
          expected = [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144]

          assert evidence["schema_version"] == 1
          assert evidence["sweep_identity"].startswith("sha256:")
          assert len(evidence["sweep_identity"]) == 71
          records = evidence["records"]
          assert [r["dimension"] for r in records] == expected
          assert all(r["samples"] == 32 for r in records)
          assert all(0.0 <= r["mean_abs_cosine"] <= 1.0 for r in records)
          assert all(0.0 <= r["max_abs_cosine"] <= 1.0 for r in records)
          assert all(-1.0 <= r["mean_bundle_member_cosine"] <= 1.0 for r in records)
          PY
          sha256sum dimension-sweep-evidence.json | tee dimension-sweep-evidence.sha256


      - name: Emit deterministic task-quality dimension frontier
        run: cargo run -p symthaea-core --example hdc_dimension_task > dimension-task-evidence.json

      - name: Validate task-quality dimension frontier
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("dimension-task-evidence.json").read_text())
          expected = [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144]
          rows = evidence["rows"]
          assert evidence["schema_version"] == 1
          assert [r["resolution"] for r in rows] == expected
          assert [r["resolution"] for r in evidence["frontier"]["rows"]] == expected
          assert all(r["task_quality"]["execution_status"] == "executed" for r in rows)
          assert all(r["performance"]["execution_status"] == "executed" for r in rows)
          assert all(r["resource"]["qualification_status"] == "qualified" for r in rows)
          assert all(0.0 <= r["accuracy"] <= 1.0 for r in rows)
          assert all(r["total"] == 128 for r in rows)
          assert all(r["logical_bytes"] > 0 for r in rows)
          assert all(ref["artifact_digest"].startswith("sha256:")
                     for fr in evidence["frontier"]["rows"]
                     for ref in (fr["task_quality"], fr["performance"], fr["resource"]))
          PY
          sha256sum dimension-task-evidence.json | tee dimension-task-evidence.sha256

      - name: Emit deterministic noise robustness surface
        run: cargo run -p symthaea-core --example hdc_noise_robustness > hdc-noise-robustness-evidence.json

      - name: Validate noise robustness surface
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("hdc-noise-robustness-evidence.json").read_text())
          expected_dimensions = [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144]
          expected_noise = [0.10, 0.20, 0.35, 0.50, 0.65, 0.80]
          cells = evidence["cells"]
          assert evidence["schema_version"] == 1
          assert evidence["task"] == "hdc_noise_robustness_prototype_retrieval"
          assert len(cells) == len(expected_dimensions) * len(expected_noise)
          assert [c["resolution"] for c in cells[::len(expected_noise)]] == expected_dimensions
          assert [round(c["noise_weight"], 2) for c in cells[:len(expected_noise)]] == expected_noise
          assert all(c["total"] == 128 for c in cells)
          assert all(0.0 <= c["accuracy"] <= 1.0 for c in cells)
          assert all(c["mean_margin"] == c["mean_margin"] for c in cells)
          assert evidence["spec_identity"].startswith("sha256:")
          PY
          sha256sum hdc-noise-robustness-evidence.json | tee hdc-noise-robustness-evidence.sha256


      - name: Emit deterministic associative cleanup surface
        run: cargo run -p symthaea-core --example hdc_associative_cleanup > hdc-associative-cleanup-evidence.json

      - name: Validate associative cleanup surface
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("hdc-associative-cleanup-evidence.json").read_text())
          expected_dimensions = [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144]
          expected_loads = [2, 4, 8, 16]
          expected_noise = [0.0, 0.10, 0.20, 0.35]
          cells = evidence["cells"]
          assert evidence["schema_version"] == 1
          assert evidence["task"] == "hdc_associative_cleanup_key_value"
          assert len(cells) == len(expected_dimensions) * len(expected_loads) * len(expected_noise)
          assert [c["resolution"] for c in cells[::len(expected_loads) * len(expected_noise)]] == expected_dimensions
          assert sorted({c["memory_load"] for c in cells}) == expected_loads
          assert sorted({round(c["query_noise_weight"], 2) for c in cells}) == expected_noise
          assert all(c["total"] == c["memory_load"] * evidence["queries_per_load"] for c in cells)
          assert all(0.0 <= c["accuracy"] <= 1.0 for c in cells)
          assert all(c["mean_margin"] == c["mean_margin"] for c in cells)
          assert evidence["spec_identity"].startswith("sha256:")
          PY
          sha256sum hdc-associative-cleanup-evidence.json | tee hdc-associative-cleanup-evidence.sha256


      - name: Emit deterministic sequence order surface
        run: cargo run -p symthaea-core --example hdc_sequence_order > hdc-sequence-order-evidence.json

      - name: Validate sequence order surface
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("hdc-sequence-order-evidence.json").read_text())
          expected_dimensions = [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144]
          expected_lengths = [2, 4, 8, 16, 32]
          expected_noise = [0.0, 0.10, 0.20, 0.35]
          cells = evidence["cells"]
          assert evidence["schema_version"] == 1
          assert evidence["task"] == "hdc_sequence_order_retrieval"
          assert len(cells) == len(expected_dimensions) * len(expected_lengths) * len(expected_noise)
          assert [c["resolution"] for c in cells[::len(expected_lengths) * len(expected_noise)]] == expected_dimensions
          assert sorted({c["sequence_length"] for c in cells}) == expected_lengths
          assert sorted({round(c["query_noise_weight"], 2) for c in cells}) == expected_noise
          assert all(c["total"] == c["sequence_length"] * evidence["queries_per_position"] for c in cells)
          assert all(0.0 <= c["accuracy"] <= 1.0 for c in cells)
          assert all(c["mean_margin"] == c["mean_margin"] for c in cells)
          assert all(c["order_discrimination"] == c["order_discrimination"] for c in cells)
          assert evidence["spec_identity"].startswith("sha256:")
          PY
          sha256sum hdc-sequence-order-evidence.json | tee hdc-sequence-order-evidence.sha256

      - name: Compile SIMD benchmark matrix
        run: cargo bench -p symthaea-core --bench simd_continuous --no-run --features simd

      - name: Enforce evidence-boundary documentation
        run: |
          test "$(grep -c "Canonical: 1K, 2K, 4K, 8K, 16K, 32K, 64K." docs/research/HDC_RESOLUTION_EXTENSIBILITY.md)" -eq 1
          test "$(grep -c "Exploratory: 128K, 256K." docs/research/HDC_RESOLUTION_EXTENSIBILITY.md)" -eq 1
          ! grep -q "cite" docs/research/HDC_RESOLUTION_EXTENSIBILITY.md

      - name: Write qualification receipt
        if: always()
        run: |
          cat > hdc-resolution-qualification.txt <<EOF
          HDC Resolution Qualification
          =============================
          exact_head=${{ steps.head.outputs.sha }}
          workflow_event=${{ github.event_name }}
          rust_toolchain=1.96.0
          resolution_space=focused-tests
          resolution_budget=focused-tests
          simd_operator_conformance=focused-tests
          operator_evidence_json=generated
          trajectory_operator_gate=focused-tests
          simd_benchmark=compile-only
          benchmark_execution=not-claimed
          production_default_changed=false
          exploratory_tiers=128K,256K
          canonical_tiers=1K,2K,4K,8K,16K,32K,64K
          EOF

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdc-resolution-qualification-${{ steps.head.outputs.sha }}
          path: |
            hdc-resolution-qualification.txt
            toolchain.txt
            operator-evidence.json
            operator-evidence.sha256
            operator-evidence-provenance.json
            dimension-sweep-evidence.json
            dimension-sweep-evidence.sha256
            dimension-task-evidence.json
            dimension-task-evidence.sha256
            hdc-noise-robustness-evidence.json
            hdc-noise-robustness-evidence.sha256
            hdc-associative-cleanup-evidence.json
            hdc-associative-cleanup-evidence.sha256
            hdc-sequence-order-evidence.json
            hdc-sequence-order-evidence.sha256
