name: IG-CONFIDENCE-CALIBRATION-001 Qualifier

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ig-confidence-calibration-001/**"
      - ".github/workflows/ig-confidence-calibration-qualifier.yml"
  push:
    branches: [main]
    paths:
      - "research/ig-confidence-calibration-001/**"
      - ".github/workflows/ig-confidence-calibration-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ig-confidence-calibration-qualifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Format
        run: cargo fmt --manifest-path research/ig-confidence-calibration-001/qualifier/Cargo.toml --check
      - name: Unit and negative-control tests
        run: cargo test --manifest-path research/ig-confidence-calibration-001/qualifier/Cargo.toml
      - name: Qualify synthetic held-out evaluation
        run: |
          cargo run --manifest-path research/ig-confidence-calibration-001/qualifier/Cargo.toml -- \
            research/ig-confidence-calibration-001/CONFIDENCE_EVALUATION_V0_1.json \
            research/ig-confidence-calibration-001/CONFIDENCE_NEGATIVE_CONTROLS_V0_1.json \
            research/ig-confidence-calibration-001/CONFIDENCE_EVALUATION_V0_1.schema.json \
            research/ig-confidence-calibration-001/CONFIDENCE_NEGATIVE_CONTROLS_V0_1.schema.json
