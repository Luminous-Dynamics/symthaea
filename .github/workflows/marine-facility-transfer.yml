name: Marine Facility Transfer Calibration Audit

on:
  pull_request:
    paths:
      - "tools/marine-facility-transfer-audit/**"
      - "docs/research/marine/marine-facility-transfer-v0.1.0.schema.json"
      - "docs/research/marine/fixtures/synthetic-marine-facility-transfer-v0.1.0.json"
      - ".github/workflows/marine-facility-transfer.yml"
  push:
    branches: [main]
    paths:
      - "tools/marine-facility-transfer-audit/**"
      - "docs/research/marine/marine-facility-transfer-v0.1.0.schema.json"
      - "docs/research/marine/fixtures/synthetic-marine-facility-transfer-v0.1.0.json"
      - ".github/workflows/marine-facility-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Format, lint and calibration known-answer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: rustfmt --edition 2024 tools/marine-facility-transfer-audit/src/main.rs
      - name: Preserve formatted source
        uses: actions/upload-artifact@v4
        with:
          name: marine-facility-transfer-rustfmt
          path: tools/marine-facility-transfer-audit/src/main.rs
          if-no-files-found: error
      - name: Verify format
        run: rustfmt --edition 2024 --check tools/marine-facility-transfer-audit/src/main.rs
      - name: Generate isolated lockfile
        run: cargo generate-lockfile --manifest-path tools/marine-facility-transfer-audit/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/marine-facility-transfer-audit/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/marine-facility-transfer-audit/Cargo.toml
      - name: Validate JSON syntax
        run: python3 -c "import json; json.load(open('docs/research/marine/marine-facility-transfer-v0.1.0.schema.json')); json.load(open('docs/research/marine/fixtures/synthetic-marine-facility-transfer-v0.1.0.json'))"
      - name: Assert synthetic fixture remains incomplete
        shell: bash
        run: |
          set +e
          cargo run --quiet --locked --manifest-path tools/marine-facility-transfer-audit/Cargo.toml -- docs/research/marine/fixtures/synthetic-marine-facility-transfer-v0.1.0.json > /tmp/facility-transfer-report.json
          code=$?
          set -e
          test "$code" -eq 3
          python3 -c "import json; r=json.load(open('/tmp/facility-transfer-report.json')); assert r['disposition'] == 'INCOMPLETE'; assert r['position_count'] == 5; assert r['band_summaries'][0]['repeat_count'] == 10"