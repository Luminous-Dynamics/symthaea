name: ENG-DESIGN-004A Poetic Engineering Qualification

on:
  pull_request:
    paths:
      - 'scripts/validate_eng_design_004a_poetic.py'
      - '.github/workflows/eng-design-004a-poetic.yml'
      - 'docs/engineering/ENG_DESIGN_004A_POETIC_ENGINEERING.md'
      - 'docs/release/evidence/eng-design-004a-poetic-engineering-reference-v1.json'

concurrency:
  group: eng-design-004a-poetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
      SOURCE_HEAD: 24076677fbed65536c1abe86ad50b22eee6a1b67
      CONTRACT_BLOB: f496f926af38ef0ec66643f04ab198c64ac7174a
      CORPUS_BLOB: aef8e7637ba958dc6c8c99ca49a58c1b28ddf3aa
    steps:
      - name: Checkout exact qualifier head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0

      - name: Verify exact source subject and qualifier scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CANDIDATE_HEAD}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
          test "$(git rev-parse HEAD^)" = "${SOURCE_HEAD}"
          test "$(git merge-base HEAD "${SOURCE_HEAD}")" = "${SOURCE_HEAD}"
          test "$(git rev-list --count "${SOURCE_HEAD}"..HEAD)" = "1"

          test "$(git rev-parse "${SOURCE_HEAD}:docs/engineering/ENG_DESIGN_004A_POETIC_ENGINEERING.md")" = "${CONTRACT_BLOB}"
          test "$(git rev-parse "${SOURCE_HEAD}:docs/release/evidence/eng-design-004a-poetic-engineering-reference-v1.json")" = "${CORPUS_BLOB}"
          test "$(git rev-parse HEAD:docs/engineering/ENG_DESIGN_004A_POETIC_ENGINEERING.md)" = "${CONTRACT_BLOB}"
          test "$(git rev-parse HEAD:docs/release/evidence/eng-design-004a-poetic-engineering-reference-v1.json)" = "${CORPUS_BLOB}"

          mapfile -t changed < <(git diff --name-only "${SOURCE_HEAD}"..HEAD | sort)
          expected=(
            ".github/workflows/eng-design-004a-poetic.yml"
            "scripts/validate_eng_design_004a_poetic.py"
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Execute independent oracle
        run: python3 scripts/validate_eng_design_004a_poetic.py

      - name: Clean postflight
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
