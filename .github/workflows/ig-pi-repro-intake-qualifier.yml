name: IG Pluralistic Ignorance Intake Qualifier

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ig-pi-repro-001-intake/**"
      - ".github/workflows/ig-pi-repro-intake-qualifier.yml"
  push:
    branches: [main]
    paths:
      - "research/ig-pi-repro-001-intake/**"
      - ".github/workflows/ig-pi-repro-intake-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run metadata intake qualifier tests
        run: cargo test --manifest-path research/ig-pi-repro-001-intake/qualifier/Cargo.toml
      - name: Validate pinned metadata-only intake
        run: |
          cargo run --manifest-path research/ig-pi-repro-001-intake/qualifier/Cargo.toml -- \
            research/ig-pi-repro-001-intake/PI_BASELINE_INTAKE_V0_1.json \
            research/ig-pi-repro-001-intake/PI_BASELINE_INTAKE_V0_1.schema.json
