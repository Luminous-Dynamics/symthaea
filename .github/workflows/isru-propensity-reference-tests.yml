name: ISRU Propensity Receipt Tests

on:
  pull_request:
    paths:
      - 'research/asteroid-optical-isru-v0.2/selection_receipts.rs'
      - '.github/workflows/isru-propensity-reference-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Format, Clippy and standalone Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: rustfmt --edition 2021 --check research/asteroid-optical-isru-v0.2/selection_receipts.rs

      - name: Run standalone Clippy
        run: clippy-driver --edition=2021 --test research/asteroid-optical-isru-v0.2/selection_receipts.rs -o /tmp/isru-propensity-clippy -D warnings

      - name: Compile and run exact standalone tests
        run: |
          rustc --edition=2021 --test research/asteroid-optical-isru-v0.2/selection_receipts.rs -o /tmp/isru-propensity-tests
          /tmp/isru-propensity-tests
    