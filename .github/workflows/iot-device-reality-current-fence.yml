name: IoT Device Reality Current Fence

on:
  pull_request:
    paths:
      - 'crates/bridges/symthaea-iot-actuation-guard-device-reality/**'
      - '.github/workflows/iot-device-reality-current-fence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iot-device-reality-current-fence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Current-fence source contract
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          root = Path('crates/bridges/symthaea-iot-actuation-guard-device-reality')
          src = (root / 'src/current.rs').read_text()
          code = '\n'.join(
              line for line in src.splitlines()
              if not line.lstrip().startswith('//')
          )
          required = [
              'pub struct CurrentAdmissionDeviceRealityGuard',
              'policy: DeviceRealityPolicyV1',
              'trust_registry: DeviceRealityTrustRegistry',
              'anchored_policy_digest: Digest32',
              'anchored_trust_head: DeviceRealityTrustHead',
              'pub fn fence_current',
              'proof: &',
              'SystemTime::now()',
              'proof.policy_digest()',
              'proof.trust_head()',
              'proof.verified_at_unix_ms()',
              'self.trust_registry.exact_active_key(',
              'current_key.digest()? != proof.key_digest()',
              'verify_strict(&message, &signature)',
              'current_key.not_after_unix_ms',
              'self.trust_registry.snapshot().expires_at_unix_ms',
              '.min(verifier_key_not_after_unix_ms)',
              '.min(trust_snapshot_expires_at_unix_ms)',
              'pub struct CurrentAdmissionDeviceRealityFence',
              "_guard: &'a CurrentAdmissionDeviceRealityGuard",
              "proof: &'a VerifiedAdmissionDeviceReality",
          ]
          missing = [needle for needle in required if needle not in code]
          if missing:
              raise SystemExit(f'missing current device-reality invariant: {missing}')

          public_fence = code.split('pub fn fence_current', 1)[1].split('fn fence_current_at', 1)[0]
          forbidden_public = [
              'now_unix_ms', 'verifier:', 'public_key', 'DeviceRealityTrustRegistry',
              'DeviceRealityPolicyV1', 'DeviceRealityTrustHead',
          ]
          found_public = [needle for needle in forbidden_public if needle in public_fence]
          if found_public:
              raise SystemExit(f'caller-controlled current-fence input: {found_public}')

          forbidden = [
              'AttestationResultSignatureVerifier', '&dyn ', 'FinalActuatorPermit',
              'TrustBoundFinalActuatorPermit', 'CompleteJitHalLease', 'JustInTimeHalLease',
              'TcpListener', 'TcpStream', 'tokio::spawn', 'std::process::Command',
              'Command::new', 'unsafe {',
          ]
          found = [needle for needle in forbidden if needle in code]
          if found:
              raise SystemExit(f'forbidden authority/provider surface in current device-reality fence: {found}')

          if 'pub fn fence_current_at' in code:
              raise SystemExit('test-time clock injection must remain private')

          manifest = tomllib.loads((root / 'Cargo.toml').read_text())
          expected = {
              'blake3', 'ed25519-dalek', 'serde', 'symthaea-authority',
              'symthaea-iot-actuation-guard-admission-challenge',
              'symthaea-iot-actuation-guard-admission-reservation',
              'symthaea-iot-actuation-guard-two-phase-protocol',
              'symthaea-iot-authority', 'symthaea-iot-posture',
              'symthaea-iot-transport-receipt', 'thiserror',
          }
          actual = set(manifest.get('dependencies', {}))
          if actual != expected:
              raise SystemExit(f'production dependency drift: {sorted(actual)}')

      - name: Install Rust 1.96 formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Rustfmt
        run: cargo +1.96.0 fmt --check -p symthaea-iot-actuation-guard-device-reality

      - name: Install Rust 1.94 qualification toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Verify exact qualification toolchain
        run: |
          rustc +1.94.0 --version | grep -F 'rustc 1.94.0'
          cargo +1.94.0 --version | grep -F 'cargo 1.94.0'

      - name: Preserve checked-in lock
        run: cp Cargo.lock /tmp/Cargo.lock.before

      - name: Reconcile candidate and check package
        run: cargo +1.94.0 check -p symthaea-iot-actuation-guard-device-reality --all-targets

      - name: Reject sourced dependency drift
        shell: python
        run: |
          import tomllib
          def sourced(path):
              with open(path, 'rb') as f:
                  doc = tomllib.load(f)
              return {
                  (p['name'], p['version'], p.get('source'))
                  for p in doc.get('package', [])
                  if p.get('source') is not None
              }
          before = sourced('/tmp/Cargo.lock.before')
          after = sourced('Cargo.lock')
          extra = after - before
          removed = before - after
          if extra or removed:
              raise SystemExit(
                  f'sourced dependency drift: added={sorted(extra)}, removed={sorted(removed)}'
              )

      - name: Run current real-Ed25519/natural-expiry regression first
        run: >-
          cargo +1.94.0 test --locked -p symthaea-iot-actuation-guard-device-reality
          --test current current_device_reality_fence_reverifies_fixed_ed25519_and_caps_natural_expiry -- --exact

      - name: Package tests
        run: cargo +1.94.0 test --locked -p symthaea-iot-actuation-guard-device-reality --all-targets

      - name: Strict Clippy
        run: cargo +1.94.0 clippy --locked -p symthaea-iot-actuation-guard-device-reality --all-targets -- -D warnings

      - name: Show candidate lock delta
        if: always()
        run: git diff -- Cargo.lock || true

      - name: Checked-in lock must already be fresh
        run: git diff --exit-code -- Cargo.lock
