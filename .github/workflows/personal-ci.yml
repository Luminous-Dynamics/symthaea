# Mycelix Personal Cluster CI
# Zomes: Identity Vault, Health Vault, Credential Wallet, Personal Bridge
# Sovereign personal data with is_finite() hardened integrity validation

name: Personal CI

on:
  push:
    branches: [main]
    paths:
      - 'mycelix-personal/**'
      - '.github/workflows/personal-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-personal/**'
      - '.github/workflows/personal-ci.yml'
  workflow_dispatch:

concurrency:
  group: personal-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 'stable'

jobs:
  # ============================================================================
  # Formatting
  # ============================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-personal

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - run: cargo fmt --all --check

  # ============================================================================
  # Linting
  # ============================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-personal

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-personal

      - run: cargo clippy --all -- -D warnings

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-personal

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-personal

      - run: cargo test --workspace

  # ============================================================================
  # WASM Build
  # ============================================================================
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-personal/target/
          key: ${{ runner.os }}-cargo-personal-wasm-${{ hashFiles('mycelix-personal/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-personal-wasm-

      - name: Build WASM zomes
        run: |
          nix develop ./mycelix-personal --command bash -c '
            cd mycelix-personal
            cargo build --release --workspace --target wasm32-unknown-unknown

            echo "=== WASM Zome Sizes ==="
            for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
              if [ -f "$wasm" ]; then
                name=$(basename "$wasm" .wasm)
                size=$(stat -c %s "$wasm" 2>/dev/null || stat -f %z "$wasm" 2>/dev/null)
                printf "  %-35s %s bytes\n" "$name" "$size"
              fi
            done
          '

  # ============================================================================
  # Package DNA
  # ============================================================================
  package-dna:
    name: Package DNA
    runs-on: ubuntu-latest
    needs: [build-wasm, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Build and package
        run: |
          nix develop ./mycelix-personal --command bash -c '
            cd mycelix-personal
            cargo build --release --workspace --target wasm32-unknown-unknown
            mkdir -p dist
            hc dna pack dna/ -o dist/mycelix_personal.dna
            echo "=== DNA packaged ==="
            ls -lh dist/mycelix_personal.dna
          '

      - name: Upload DNA artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-dna
          path: mycelix-personal/dist/mycelix_personal.dna
          if-no-files-found: error

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: Summary
    if: always()
    needs: [fmt, clippy, test, build-wasm, package-dna]
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        run: |
          echo "## Personal Cluster CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sovereign personal data: identity vault, health vault, credential wallet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          for job in fmt clippy test build-wasm package-dna; do
            case "$job" in
              fmt) result="${{ needs.fmt.result }}" ;;
              clippy) result="${{ needs.clippy.result }}" ;;
              test) result="${{ needs.test.result }}" ;;
              build-wasm) result="${{ needs.build-wasm.result }}" ;;
              package-dna) result="${{ needs.package-dna.result }}" ;;
            esac
            case "$result" in
              success) status="pass" ;;
              failure) status="**FAILED**" ;;
              *) status="$result" ;;
            esac
            echo "| $job | $status |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Zomes (4 pairs)" >> $GITHUB_STEP_SUMMARY
          echo "| Zome | Role |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| identity-vault | Sovereign identity data, selective disclosure |" >> $GITHUB_STEP_SUMMARY
          echo "| health-vault | Private health records, biometrics |" >> $GITHUB_STEP_SUMMARY
          echo "| credential-wallet | Trust credentials, proofs, presentations |" >> $GITHUB_STEP_SUMMARY
          echo "| personal-bridge | Cross-cluster dispatch, health check |" >> $GITHUB_STEP_SUMMARY
