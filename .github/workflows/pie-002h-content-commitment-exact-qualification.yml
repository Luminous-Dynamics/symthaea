name: PIE-002H-A Process Content Commitment Oracle Qualification

on:
  push:
    branches:
      - qualify/pie-002h-content-9160acb2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify PIE-002H-A process content commitment oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUBJECT_SHA: 9160acb2c21bad5ba25b64e0ac6113f9fa3ec0a6
      PARENT_SHA: 89a86bdb3d80cfbc83ce5399317686079484c903
      SUBJECT_TREE: 4b12b395dcea9ad92d32a33ed85c342566c6392d
      ORACLE: scripts/pie-process-content-commitment-oracle.py
      EVIDENCE: docs/release/evidence/PIE_002H_PROCESS_CONTENT_COMMITMENT_ORACLE.md
      GOLDEN: 423cb41801ddfeb75e2c5d4a13d7edb3f108a2825f2965d4e669ee934736440d

    steps:
      - name: Checkout frozen subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 2

      - name: Verify exact subject, lineage, tree, and file scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          mapfile -t files < <(git diff --name-only "$PARENT_SHA" "$SUBJECT_SHA" | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "$EVIDENCE"
          test "${files[1]}" = "$ORACLE"

      - name: Record subject file digests
        run: sha256sum "$ORACLE" "$EVIDENCE" | tee pie-002h-content-files.sha256

      - name: Install Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5

      - name: Record Python identity
        run: python --version

      - name: Syntax compile
        id: syntax
        continue-on-error: true
        run: python -m py_compile "$ORACLE"

      - name: Run commitment self-test and golden vector
        id: selftest
        continue-on-error: true
        run: |
          set -euo pipefail
          output="$(python "$ORACLE" --self-test)"
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | sed -n '1p')" = "$GOLDEN"
          test "$(printf '%s\n' "$output" | sed -n '2p')" = "ok"

      - name: Emit machine-readable qualification receipt
        if: always()
        run: |
          cat > pie-002h-content-qualification.json <<EOF
          {
            "schema": "symthaea.pie.exact-subject-qualification.v1",
            "subject_sha": "$SUBJECT_SHA",
            "parent_sha": "$PARENT_SHA",
            "tree_sha": "$SUBJECT_TREE",
            "python": "3.13.5",
            "profile": "symthaea.pie.process-content.v1",
            "digest": "sha256",
            "golden_sha256": "$GOLDEN",
            "gates": {
              "syntax_compile": "${{ steps.syntax.outcome }}",
              "self_test_and_golden": "${{ steps.selftest.outcome }}"
            },
            "scope": "Canonical full ProcessDefinition content identity only; not currentness, authenticity, truth, applicability, feasibility, dispatch, economics, or execution authority."
          }
          EOF
          cat pie-002h-content-qualification.json

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-002h-process-content-commitment-qualification
          path: |
            pie-002h-content-qualification.json
            pie-002h-content-files.sha256
          if-no-files-found: error

      - name: Enforce all oracle gates
        if: always()
        run: |
          test "${{ steps.syntax.outcome }}" = success
          test "${{ steps.selftest.outcome }}" = success
