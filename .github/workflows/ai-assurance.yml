name: AI Assurance

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-ai-assurance/**'
      - 'docs/architecture/AI_ASSURANCE_*.md'
      - '.github/workflows/ai-assurance.yml'
  push:
    branches: [main]
    paths:
      - 'crates/core/symthaea-ai-assurance/**'
      - 'docs/architecture/AI_ASSURANCE_*.md'
      - '.github/workflows/ai-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-assurance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  normalize-foundation:
    name: Normalize foundation artifacts once
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/ai-assurance-kernel-v0.1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Generate deterministic assurance formatting and lock resolution
        run: |
          cargo fmt --package symthaea-ai-assurance
          cargo metadata --format-version 1 > /dev/null

      - name: Commit only generated assurance artifacts when needed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- Cargo.lock crates/core/symthaea-ai-assurance; then
            echo 'Generated assurance artifacts are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/core/symthaea-ai-assurance
          git commit -m 'chore(ai-assurance): commit generated formatting and lock resolution'
          git push origin "HEAD:${HEAD_REF}"

  qualify:
    name: Qualify authority kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format assurance package in diagnostic checkout
        run: cargo fmt --package symthaea-ai-assurance

      - name: Refresh workspace lockfile in diagnostic checkout
        run: cargo metadata --format-version 1 > /dev/null

      - name: Verify refreshed workspace resolution is locked
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Test assurance kernel, integration attacks, and compile-fail docs
        run: cargo test --locked -p symthaea-ai-assurance

      - name: Clippy assurance kernel
        run: cargo clippy --locked -p symthaea-ai-assurance --all-targets -- -D warnings

      - name: Require committed assurance formatting and lock resolution
        if: always()
        run: git diff --exit-code -- Cargo.lock crates/core/symthaea-ai-assurance
