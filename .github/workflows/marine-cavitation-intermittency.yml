name: Marine Cavitation Intermittency Audit

on:
  pull_request:
    paths:
      - "tools/marine-cavitation-intermittency-audit/**"
      - "docs/research/marine/marine-cavitation-intermittency-v0.1.0.schema.json"
      - "docs/research/marine/fixtures/synthetic-marine-cavitation-intermittency-v0.1.0.json"
      - ".github/workflows/marine-cavitation-intermittency.yml"
  push:
    branches: [main]
    paths:
      - "tools/marine-cavitation-intermittency-audit/**"
      - "docs/research/marine/marine-cavitation-intermittency-v0.1.0.schema.json"
      - "docs/research/marine/fixtures/synthetic-marine-cavitation-intermittency-v0.1.0.json"
      - ".github/workflows/marine-cavitation-intermittency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Format, lint and known-answer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format Rust source
        run: rustfmt --edition 2024 tools/marine-cavitation-intermittency-audit/src/main.rs
      - name: Preserve formatted source
        uses: actions/upload-artifact@v4
        with:
          name: marine-cavitation-intermittency-rustfmt
          path: tools/marine-cavitation-intermittency-audit/src/main.rs
          if-no-files-found: error
      - name: Verify formatting
        run: rustfmt --edition 2024 --check tools/marine-cavitation-intermittency-audit/src/main.rs
      - name: Generate isolated Cargo lockfile
        run: cargo generate-lockfile --manifest-path tools/marine-cavitation-intermittency-audit/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/marine-cavitation-intermittency-audit/Cargo.toml --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --manifest-path tools/marine-cavitation-intermittency-audit/Cargo.toml
      - name: Validate schema and fixture JSON
        run: |
          python3 -c "import json; json.load(open('docs/research/marine/marine-cavitation-intermittency-v0.1.0.schema.json')); json.load(open('docs/research/marine/fixtures/synthetic-marine-cavitation-intermittency-v0.1.0.json'))"
      - name: Assert synthetic fixture disposition
        shell: bash
        run: |
          set +e
          cargo run --quiet --locked --manifest-path tools/marine-cavitation-intermittency-audit/Cargo.toml -- docs/research/marine/fixtures/synthetic-marine-cavitation-intermittency-v0.1.0.json > /tmp/marine-cavitation-intermittency-report.json
          code=$?
          set -e
          test "$code" -eq 3
          python3 -c "import json; r=json.load(open('/tmp/marine-cavitation-intermittency-report.json')); assert r['disposition'] == 'INCOMPLETE'; assert len(r['run_reports']) == 2"
