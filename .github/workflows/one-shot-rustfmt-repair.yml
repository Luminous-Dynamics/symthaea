name: one-shot-rustfmt-repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.96.0 with rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format Nixward qualification surface
        run: |
          rustfmt --edition 2024             crates/core/nixward/src/action/authorization.rs             crates/core/nixward/src/action/executor.rs             crates/core/nixward/src/action/config_writer.rs             crates/core/nixward/src/action/post_state.rs             crates/core/nixward/src/action/systemd_observer.rs             crates/core/nixward/src/action/systemd_mutation.rs

      - name: Commit formatter output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             crates/core/nixward/src/action/authorization.rs             crates/core/nixward/src/action/executor.rs             crates/core/nixward/src/action/config_writer.rs             crates/core/nixward/src/action/post_state.rs             crates/core/nixward/src/action/systemd_observer.rs             crates/core/nixward/src/action/systemd_mutation.rs
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "chore(nixward): apply pinned rustfmt"
          git push origin HEAD:chore/cross-077-rustfmt-repair

      - name: Remove one-shot workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin chore/cross-077-rustfmt-repair
          rm -f .github/workflows/one-shot-rustfmt-repair.yml
          git add .github/workflows/one-shot-rustfmt-repair.yml
          git commit -m "chore(ci): remove one-shot formatter"
          git push origin HEAD:chore/cross-077-rustfmt-repair
