name: FL Cross-Language Consistency

on:
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/crates/mycelix-fl-core/**"
      - "mycelix-workspace/sdk-ts/src/fl/**"
      - "mycelix-workspace/sdk-ts/tests/fl-cross-language.test.ts"
      - "mycelix-workspace/sdk-python/mycelix/fl/**"
      - "mycelix-workspace/sdk-python/tests/test_cross_language.py"
  pull_request:
    branches: [main]
    paths:
      - "mycelix-workspace/crates/mycelix-fl-core/**"
      - "mycelix-workspace/sdk-ts/src/fl/**"
      - "mycelix-workspace/sdk-ts/tests/fl-cross-language.test.ts"
      - "mycelix-workspace/sdk-python/mycelix/fl/**"
      - "mycelix-workspace/sdk-python/tests/test_cross_language.py"

env:
  CARGO_TERM_COLOR: always

jobs:
  generate-fixtures:
    name: Generate Fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl-core/target
          key: ${{ runner.os }}-fl-fixtures-${{ hashFiles('mycelix-workspace/crates/mycelix-fl-core/Cargo.toml') }}
      - name: Generate fixtures
        run: cargo run --example generate_fl_fixtures --release
      - uses: actions/upload-artifact@v4
        with:
          name: fl-fixtures
          path: mycelix-workspace/crates/mycelix-fl-core/fixtures/fl_test_vectors.json

  verify-rust:
    name: Verify Rust
    needs: generate-fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-fl-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycelix-workspace/crates/mycelix-fl-core/target
          key: ${{ runner.os }}-fl-verify-rust-${{ hashFiles('mycelix-workspace/crates/mycelix-fl-core/Cargo.toml') }}
      - name: Run fixture verification tests
        run: cargo test --test cross_language_fixtures
        env:
          RUST_BACKTRACE: 1

  verify-typescript:
    name: Verify TypeScript
    needs: generate-fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Run cross-language tests
        run: npx vitest run tests/fl-cross-language.test.ts

  verify-python:
    name: Verify Python
    needs: generate-fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - name: Run cross-language tests
        run: pytest tests/test_cross_language.py -v
