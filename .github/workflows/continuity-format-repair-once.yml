# One-shot, exact-head rustfmt repair for the continuity qualification branch.
#
# This workflow is intentionally temporary. It may write only the exact
# formatter delta already witnessed by the focused qualification receipt.

name: One-shot Continuity Format Repair

on:
  push:
    branches:
      - ci/continuity-verifier-grant-exact-head-v1
    paths:
      - '.github/workflows/continuity-format-repair-once.yml'

permissions:
  contents: write

env:
  EXPECTED_PARENT_SHA: 95ff88d46f026727e946d77856c941a514b97095
  EXPECTED_PATCH_SHA256: 80077f10227e5e228a7cfa053276ee39b62b729ffb268f545cd010ae920f675a
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262

jobs:
  repair:
    name: Apply witnessed rustfmt delta
    if: github.repository == 'Luminous-Dynamics/symthaea'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-shot trigger boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/continuity-format-repair-once.yml'
          test "$(grep -Fc "uses: actions/checkout@$CHECKOUT_ACTION_SHA" .github/workflows/continuity-format-repair-once.yml)" -eq 1
          if grep -Eq 'uses: actions/checkout@v[0-9]+' .github/workflows/continuity-format-repair-once.yml; then
            echo 'mutable checkout action tag found in one-shot repair workflow' >&2
            exit 1
          fi

      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --no-self-update
          rustup override set "$channel"
          test "$(rustc --version | awk '{print $2}')" = "$channel"

      - name: Reproduce and commit exact formatter repair
        shell: bash
        run: |
          set -euo pipefail

          cargo fmt -p symthaea-continuity

          patch_file="${RUNNER_TEMP}/symthaea-continuity-rustfmt.patch"
          git diff --binary -- crates/core/symthaea-continuity > "$patch_file"
          observed_patch_sha="$(sha256sum "$patch_file" | awk '{print $1}')"
          echo "observed rustfmt patch sha256=$observed_patch_sha"
          test "$observed_patch_sha" = "$EXPECTED_PATCH_SHA256"

          expected_files="${RUNNER_TEMP}/expected-files.txt"
          observed_files="${RUNNER_TEMP}/observed-files.txt"
          cat > "$expected_files" <<'EOF'
          crates/core/symthaea-continuity/src/auth_wire.rs
          crates/core/symthaea-continuity/src/compose.rs
          crates/core/symthaea-continuity/src/contract.rs
          crates/core/symthaea-continuity/src/exact_policy.rs
          crates/core/symthaea-continuity/src/lib.rs
          crates/core/symthaea-continuity/src/observation.rs
          crates/core/symthaea-continuity/src/profile_adoption.rs
          crates/core/symthaea-continuity/src/profile_adoption_admission.rs
          crates/core/symthaea-continuity/src/profile_adoption_commit.rs
          crates/core/symthaea-continuity/src/profile_adoption_grant.rs
          crates/core/symthaea-continuity/src/profile_adoption_grant_commit.rs
          crates/core/symthaea-continuity/src/profile_adoption_root.rs
          crates/core/symthaea-continuity/src/profile_adoption_time.rs
          crates/core/symthaea-continuity/src/verifier.rs
          crates/core/symthaea-continuity/src/witness.rs
          EOF
          sed -i 's/^[[:space:]]*//' "$expected_files"
          git diff --name-only -- crates/core/symthaea-continuity | sort > "$observed_files"
          diff -u "$expected_files" "$observed_files"

          test -z "$(git diff --name-only -- . ':!crates/core/symthaea-continuity')"

          git add -- crates/core/symthaea-continuity/src
          test -z "$(git diff --cached --name-only -- . ':!crates/core/symthaea-continuity/src')"

          git config user.name 'Luminous Continuity Repair'
          git config user.email 'continuity-repair@users.noreply.github.com'
          git commit -m 'style(continuity): apply witnessed rustfmt repair'
          git push origin "HEAD:${GITHUB_REF_NAME}"
