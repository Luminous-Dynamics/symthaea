name: VIS-004F Observation Freshness

on:
  pull_request:
    paths:
      - 'crates/domains/symthaea-vision-manifold/src/observation_freshness.rs'
      - 'crates/domains/symthaea-vision-manifold/src/lib.rs'
      - 'docs/architecture/VISUAL_OBSERVATION_FRESHNESS_V1.md'
      - '.github/workflows/vis-004f-observation-freshness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.96.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check observation freshness
        run: cargo check -p symthaea-vision-manifold --all-targets
      - name: Test observation freshness
        run: cargo test -p symthaea-vision-manifold observation_freshness
      - name: Clippy observation freshness
        run: cargo clippy -p symthaea-vision-manifold --all-targets -- -D warnings
