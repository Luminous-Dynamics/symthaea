name: Sovereign State Compiler Validation
# Boundary contract: validate the neutral core and plan-only target adapters on every relevant branch push/PR.

on:
  push:
    branches:
      - rfc/sovereign-state-compiler
  pull_request:
    paths:
      - "crates/core/sovereign-state-compiler/**"
      - "crates/core/sovereign-state-compiler-nix/**"
      - "crates/core/nixward/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ssc-validate.yml"

permissions:
  contents: read

jobs:
  ssc:
    name: format, check, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add rustfmt --toolchain 1.96.0
          rustup default 1.96.0

      - name: Format check
        run: cargo +1.96.0 fmt --all -- --check

      - name: Core boundary guard
        run: |
          ! rg -n 'nixward|tokio|xenia|mycelix|std::process|Command::new|ssh'             crates/core/sovereign-state-compiler

      - name: Adapter execution guard
        run: |
          ! rg -n 'std::process|Command::new|tokio|ssh|nix-env|nixos-rebuild'             crates/core/sovereign-state-compiler-nix

      - name: Check crate
        run: cargo +1.96.0 check -p sovereign-state-compiler

      - name: Test crate
        run: cargo +1.96.0 test -p sovereign-state-compiler
