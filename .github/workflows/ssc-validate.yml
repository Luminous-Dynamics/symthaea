name: Sovereign State Compiler Validation
# Boundary contract: validate the neutral core and plan-only NixOS adapter without
# inheriting unrelated workspace-member failures.

on:
  pull_request:
    paths:
      - "crates/core/sovereign-state-compiler/**"
      - "crates/core/sovereign-state-compiler-nix/**"
      - "crates/core/nixward/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ssc-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssc:
    name: format, check, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add rustfmt --toolchain 1.96.0
          rustup default 1.96.0

      - name: Format SSC crates
        run: |
          find crates/core/sovereign-state-compiler crates/core/sovereign-state-compiler-nix \
            crates/core/nixward/src/ssc_bridge.rs \
            -type f -name '*.rs' -print0 |
            xargs -0 -r -n1 rustup run 1.96.0 rustfmt --edition 2024 --check

      - name: Core boundary guard
        run: |
          ! rg -n 'nixward|tokio|xenia|mycelix|std::process|Command::new|ssh|(^|[[:space:]])nix([[:space:]]|=)' \
            crates/core/sovereign-state-compiler/Cargo.toml \
            crates/core/sovereign-state-compiler/src

      - name: Adapter execution guard
        run: |
          ! rg -n 'std::process|Command::new|tokio|ssh|nix-env|nixos-rebuild' \
            crates/core/sovereign-state-compiler-nix/Cargo.toml \
            crates/core/sovereign-state-compiler-nix/src

      - name: Nixward SSC bridge execution guard
        run: |
          ! rg -n 'std::process|Command::new|tokio|ssh|nix-env|nixos-rebuild' \
            crates/core/nixward/src/ssc_bridge.rs

      - name: Legacy NixOS executor introduction guard
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          if git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            'src/action/**' \
            'crates/core/nixward/src/action/**' \
            'crates/core/nixward/src/lib.rs' |
            rg -n '^\+[^+].*(NixOSExecutor::(new|default)|NixOSExecutor \{|execute_confirmed\(|NixOSCommand::Custom|use .*NixOSExecutor)'; then
            echo "New legacy NixOS executor authority surface detected; route privileged execution through the governed Nixward/SSC boundary."
            exit 1
          fi
      - name: Build isolated SSC validation workspace
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          mkdir -p "$tmp/sovereign-state-compiler/src"
          mkdir -p "$tmp/sovereign-state-compiler-nix/src"
          mkdir -p "$tmp/nixward-ssc-bridge/src"
          cp crates/core/sovereign-state-compiler/Cargo.toml "$tmp/sovereign-state-compiler/"
          cp crates/core/sovereign-state-compiler/src/lib.rs "$tmp/sovereign-state-compiler/src/"
          cp crates/core/sovereign-state-compiler-nix/Cargo.toml "$tmp/sovereign-state-compiler-nix/"
          cp crates/core/sovereign-state-compiler-nix/src/lib.rs "$tmp/sovereign-state-compiler-nix/src/"
          cp crates/core/nixward/src/ssc_bridge.rs "$tmp/nixward-ssc-bridge/src/lib.rs"
          cp Cargo.lock "$tmp/Cargo.lock"

          cat >> "$tmp/Cargo.lock" <<'EOF'

          [[package]]
          name = "nixward-ssc-bridge"
          version = "0.1.0"
          dependencies = [
              "serde",
              "serde_json",
              "sovereign-state-compiler",
              "sovereign-state-compiler-nix",
              "thiserror 1.0.69",
          ]
          EOF

          cat > "$tmp/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = [
              "sovereign-state-compiler",
              "sovereign-state-compiler-nix",
              "nixward-ssc-bridge",
          ]

          [workspace.dependencies]
          blake3 = "1.5"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          thiserror = "1.0"
          EOF

          cat > "$tmp/nixward-ssc-bridge/Cargo.toml" <<'EOF'
          [package]
          name = "nixward-ssc-bridge"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          thiserror = "1.0"
          sovereign-state-compiler = { path = "../sovereign-state-compiler" }
          sovereign-state-compiler-nix = { path = "../sovereign-state-compiler-nix" }
          EOF

          cargo +1.96.0 metadata --manifest-path "$tmp/Cargo.toml" --no-deps --locked
          cargo +1.96.0 check --manifest-path "$tmp/Cargo.toml" --workspace --locked
          cargo +1.96.0 test --manifest-path "$tmp/Cargo.toml" --workspace --locked

      - name: Verify source boundary remains workspace-portable
        run: |
          test -f crates/core/sovereign-state-compiler/Cargo.toml
          test -f crates/core/sovereign-state-compiler-nix/Cargo.toml
          test -f crates/core/nixward/src/ssc_bridge.rs
