name: Muse Renderer Invocation Evidence

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "crates/domains/symthaea-muse/src/fluid_render.rs"
      - "crates/domains/symthaea-muse/src/renderer_execution_receipt.rs"
      - "crates/domains/symthaea-muse/src/bin/muse_studio.rs"
      - ".github/workflows/muse-renderer-invocation-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-renderer-invocation-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: exact-head-renderer-invocation-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'exact_head=%s\n' "$actual"

      - name: Check Muse formatting
        run: cargo fmt --manifest-path crates/domains/symthaea-muse/Cargo.toml -- --check

      - name: Run renderer invocation, receipt, and temp-path tests
        run: cargo test --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib fluid_render::tests --locked

      - name: Run renderer receipt tests
        run: cargo test --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib renderer_execution_receipt::tests --locked

      - name: Run Clippy for Muse library and tests
        run: cargo clippy --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib --tests --locked -- -D warnings
