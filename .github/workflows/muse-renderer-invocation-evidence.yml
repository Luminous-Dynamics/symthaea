name: Muse Renderer Invocation Evidence

on:
  push:
    branches:
      - "research/mel-mr-eval-016-*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "crates/domains/symthaea-muse/src/fluid_render.rs"
      - "crates/domains/symthaea-muse/src/renderer_execution_receipt.rs"
      - "crates/domains/symthaea-muse/src/bin/muse_studio.rs"
      - "crates/domains/symthaea-music-theory/src/edit_contract_validation.rs"
      - ".github/workflows/muse-renderer-invocation-evidence.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "crates/domains/symthaea-muse/src/fluid_render.rs"
      - "crates/domains/symthaea-muse/src/renderer_execution_receipt.rs"
      - "crates/domains/symthaea-muse/src/bin/muse_studio.rs"
      - ".github/workflows/muse-renderer-invocation-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-renderer-invocation-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: exact-head-renderer-invocation-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'exact_head=%s\n' "$actual"

      - name: Verify Cargo workspace metadata resolves
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/muse-workspace-metadata.json

      # Cargo.lock is known stale in the shared workspace (tracked by #8067).
      # Resolve with Cargo on this exact checkout, retain the generated lock as
      # an artifact, then run all checks with --locked. A final clean-lock gate
      # remains blocking; the artifact is used to review/commit the minimal
      # Cargo-generated delta before claiming reproducibility.
      - name: Resolve diagnostic lockfile with pinned Cargo
        run: cargo metadata --manifest-path crates/domains/symthaea-muse/Cargo.toml --format-version 1 > /tmp/muse-resolved-metadata.json

      - name: Preserve Cargo-generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: muse-cargo-lockfile-bootstrap
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

      # This bootstrap pass formats only the files changed by MEL-MR-EVAL-016.
      # The generated diff is uploaded, reviewed, committed, and then the next
      # exact-head run switches back to rustfmt --check.
      - name: Format changed Muse Rust files for review
        run: rustfmt --edition 2024 crates/domains/symthaea-muse/src/fluid_render.rs crates/domains/symthaea-muse/src/renderer_execution_receipt.rs crates/domains/symthaea-muse/src/bin/muse_studio.rs

      - name: Preserve rustfmt output for review
        uses: actions/upload-artifact@v4
        with:
          name: muse-rustfmt-bootstrap
          path: |
            crates/domains/symthaea-muse/src/fluid_render.rs
            crates/domains/symthaea-muse/src/renderer_execution_receipt.rs
            crates/domains/symthaea-muse/src/bin/muse_studio.rs
          if-no-files-found: error
          retention-days: 7

      - name: Run renderer invocation and temp-path tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib fluid_render::tests

      - name: Run renderer receipt tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib renderer_execution_receipt::tests

      - name: Compile the Muse Studio binary
        run: cargo check --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features studio --bin muse_studio

      - name: Run Clippy for the Muse Studio binary
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features studio --bin muse_studio -- -D warnings

      - name: Require generated resolution and formatting to be committed
        run: git diff --exit-code -- Cargo.lock crates/domains/symthaea-muse/src/fluid_render.rs crates/domains/symthaea-muse/src/renderer_execution_receipt.rs crates/domains/symthaea-muse/src/bin/muse_studio.rs
