name: Matter Reference Capsule Environment Bootstrap Qualification

on:
  pull_request:
    paths:
      - 'research/matter-reference-capsule/verify_environment.py'
      - '.github/workflows/matter-reference-capsule-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: matter-reference-capsule-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QUALIFICATION_PARENT_SHA: ad9cd5c2408fd9e976f777155b0a7631ce096283
  QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  INSTALL_NIX_ACTION_SHA: 13d8dd58da0234aa297dedd986986ccb8e7f3e24
  EXPECTED_NIX_VERSION: 'nix (Nix) 2.35.2'
  EXPECTED_NIXPKGS_REV: 9ae611a455b90cf061d8f332b977e387bda8e1ca
  EXPECTED_UV_LOCK_SHA256: 1ecb6c8a0752476c9731d0d44a4113c4ed1fabfee6e339724ee4534926bda646
  EXPECTED_UV_CONSUMER_SEMVER: '0.11.19'

jobs:
  qualify-prepared-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision and parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Enforce exact parent and environment-only scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "$QUALIFICATION_PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$QUALIFICATION_PARENT_SHA"
          mapfile -t files < <(git diff --name-only HEAD^..HEAD | sort)
          expected=(
            '.github/workflows/matter-reference-capsule-bootstrap.yml'
            'research/matter-reference-capsule/verify_environment.py'
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${files[$i]}" = "${expected[$i]}"
          done
          git diff --check HEAD^..HEAD

      - name: Static authority and lineage audit
        shell: bash
        run: |
          set -euo pipefail
          verifier='research/matter-reference-capsule/verify_environment.py'
          workflow='.github/workflows/matter-reference-capsule-bootstrap.yml'
          python3 -m py_compile "$verifier"
          grep -Fq 'EXPECTED_PARENT_HEAD = "ad9cd5c2408fd9e976f777155b0a7631ce096283"' "$verifier"
          grep -Fq 'LockedPythonNativeRuntimeQualifiedV1' "$verifier"
          grep -Fq 'ExecutionEnvironmentPreparedQualifiedV1' "$verifier"
          grep -Fq 'runtime_identity_rebound_here' "$verifier"
          grep -Fq 'process_node_count' "$verifier"
          grep -Fq 'calcjob_node_count' "$verifier"
          grep -Fq 'pseudopotential_selected' "$verifier"
          grep -Fq 'qe_calculation_executed' "$verifier"
          grep -Fq 'SYMTHAEA_CPP_RUNTIME_STORE' "$verifier"
          grep -Fq 'libstdc++.so.6' "$verifier"
          grep -Fq 'readlink -f /proc/$$/exe' "$workflow"
          python3 - <<'PY'
          from pathlib import Path
          verifier = Path('research/matter-reference-capsule/verify_environment.py').read_text()
          workflow = Path('.github/workflows/matter-reference-capsule-bootstrap.yml').read_text()
          forbidden_verifier = [
              'from aiida.' + 'engine',
              'import aiida.' + 'engine',
              'Calculation' + 'Factory',
              'Process' + 'Builder',
              'run_get_' + 'node',
              'submit' + '(',
              'freeze_si_' + 'pseudo',
              'Upf' + 'Data',
              'PseudoPotential' + 'Family',
          ]
          forbidden_workflow = [
              'contents:' + ' write',
              'freeze_si_' + 'pseudo.py ',
              'validate_si_001_' + 'protocol.py',
              'pw' + '.x <',
              'ph' + '.x <',
          ]
          for token in forbidden_verifier:
              assert token not in verifier, f'forbidden scientific/process authority in verifier: {token}'
          for token in forbidden_workflow:
              assert token not in workflow, f'forbidden scientific/process authority in workflow: {token}'
          PY

      - name: Verify frozen source identities before Nix installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum research/matter-reference-capsule/uv.lock | awk '{print $1}')" = "$EXPECTED_UV_LOCK_SHA256"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lock = json.loads(Path('flake.lock').read_text())
          root = lock['nodes'][lock['root']]
          node = root['inputs']['nixpkgs']
          locked = lock['nodes'][node]['locked']
          assert locked['rev'] == os.environ['EXPECTED_NIXPKGS_REV']
          assert locked['type'] == 'github'
          assert locked['owner'] == 'NixOS'
          assert locked['repo'] == 'nixpkgs'
          print(f"nixpkgs node={node} rev={locked['rev']} narHash={locked['narHash']}")
          PY

      - name: Install pinned Nix 2.35.2
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # signed v31 target
        with:
          enable_kvm: false
          github_access_token: ${{ github.token }}

      - name: Prepare and independently qualify environment
        shell: bash
        env:
          SYMTHAEA_MATTER_CAPSULE_STATE: ${{ runner.temp }}/symthaea-matter-si-001
        run: |
          set -euo pipefail
          test "$(nix --version)" = "$EXPECTED_NIX_VERSION"
          capsule="$PWD/research/matter-reference-capsule"
          test ! -e "$SYMTHAEA_MATTER_CAPSULE_STATE"

          nix-shell "$capsule/shell.nix" --run '
            set -euo pipefail
            test "$SYMTHAEA_MATTER_CAPSULE_SHELL" = 1
            test "$(nix --version)" = "$EXPECTED_NIX_VERSION"
            uv_actual="$(uv --version)"
            uv_semver="$(printf "%s\n" "$uv_actual" | awk '\''{print $2}'\'' | cut -d+ -f1)"
            lock_actual="$(sha256sum research/matter-reference-capsule/uv.lock | awk '\''{print $1}'\'')"
            shell_driver="$(readlink -f /proc/$$/exe)"

            test "$uv_semver" = "$EXPECTED_UV_CONSUMER_SEMVER"
            test "$lock_actual" = "$EXPECTED_UV_LOCK_SHA256"
            case "$SYMTHAEA_CPP_RUNTIME_STORE" in /nix/store/*) ;; *) echo "C++ runtime escaped Nix store" >&2; exit 2 ;; esac
            test -e "$SYMTHAEA_CPP_RUNTIME_STORE/lib/libstdc++.so.6"
            test "$LD_LIBRARY_PATH" = "$SYMTHAEA_CPP_RUNTIME_STORE/lib"
            test -f "$shell_driver"

            printf "uv runtime: %s\n" "$uv_actual"
            printf "uv.lock SHA-256: %s\n" "$lock_actual"
            printf "C++ runtime: %s\n" "$SYMTHAEA_CPP_RUNTIME_STORE"
            printf "loader path: %s\n" "$LD_LIBRARY_PATH"
            printf "shell driver: %s\n" "$shell_driver"

            export SYMTHAEA_SHELL_DRIVER_PATH="$shell_driver"
            export SYMTHAEA_SHELL_DRIVER_VERSION="$BASH_VERSION"
            bash research/matter-reference-capsule/bootstrap.sh symthaea-matter-si-001 matter-capsule@localhost.invalid

            export AIIDA_PATH="$SYMTHAEA_MATTER_CAPSULE_STATE/aiida"
            export UV_OFFLINE=1
            research/matter-reference-capsule/.venv/bin/python \
              research/matter-reference-capsule/verify_environment.py \
              --repo-root "$PWD" \
              --profile symthaea-matter-si-001 \
              --state-root "$SYMTHAEA_MATTER_CAPSULE_STATE" \
              --subject-head "$QUALIFICATION_HEAD_SHA" \
              --output "$SYMTHAEA_MATTER_CAPSULE_STATE/environment-qualification.json"
          '

          test -f "$SYMTHAEA_MATTER_CAPSULE_STATE/environment-manifest.json"
          test -f "$SYMTHAEA_MATTER_CAPSULE_STATE/environment-qualification.json"
          (
            cd "$SYMTHAEA_MATTER_CAPSULE_STATE"
            sha256sum environment-manifest.json environment-qualification.json > environment-receipts.sha256
          )

      - name: Verify retained authority boundary
        shell: bash
        env:
          SYMTHAEA_MATTER_CAPSULE_STATE: ${{ runner.temp }}/symthaea-matter-si-001
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['SYMTHAEA_MATTER_CAPSULE_STATE'])
          prepared = json.loads((root / 'environment-manifest.json').read_text())
          q = json.loads((root / 'environment-qualification.json').read_text())
          assert prepared['authority'] == 'ExecutionEnvironmentPreparedOnly'
          assert q['authority'] == 'ExecutionEnvironmentPreparedQualifiedV1'
          assert q['subject_head'] == os.environ['QUALIFICATION_HEAD_SHA']
          assert q['parent_head'] == os.environ['QUALIFICATION_PARENT_SHA']
          assert q['prerequisite'] == {
              'native_runtime_parent_head': os.environ['QUALIFICATION_PARENT_SHA'],
              'separate_authority': 'LockedPythonNativeRuntimeQualifiedV1',
              'authority_rederived_here': False,
              'runtime_identity_rebound_here': True,
          }
          assert q['source']['uv_lock_sha256'] == os.environ['EXPECTED_UV_LOCK_SHA256']
          assert q['source']['nixpkgs_rev'] == os.environ['EXPECTED_NIXPKGS_REV']
          assert q['runtime']['nix_version'] == os.environ['EXPECTED_NIX_VERSION']
          assert q['runtime']['lock_consumer']['uv']['semantic_version'] == os.environ['EXPECTED_UV_CONSUMER_SEMVER']
          assert q['runtime']['cpp_runtime']['store_output'].startswith('/nix/store/')
          assert q['runtime']['cpp_runtime']['libstdcxx'].startswith(q['runtime']['cpp_runtime']['store_output'] + '/')
          assert q['aiida']['process_node_count'] == 0
          assert q['aiida']['calcjob_node_count'] == 0
          assert q['scientific_execution'] == {
              'process_node_created': False,
              'pseudopotential_installed': False,
              'pseudopotential_selected': False,
              'qe_calculation_executed': False,
              'scientific_result_observed': False,
              'sssp_download_executed': False,
          }
          assert q['next_required_transition'] == 'environment-bound-prospective-si-pseudopotential-freeze'
          PY
          (cd "$SYMTHAEA_MATTER_CAPSULE_STATE" && sha256sum -c environment-receipts.sha256)

      - name: Upload prepared-environment qualification receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matter-reference-environment-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/symthaea-matter-si-001/environment-manifest.json
            ${{ runner.temp }}/symthaea-matter-si-001/environment-qualification.json
            ${{ runner.temp }}/symthaea-matter-si-001/environment-receipts.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Preserve scientific authority boundary
        shell: bash
        run: |
          {
            echo '### Matter Reference Capsule environment status'
            echo ''
            echo 'This exact head inherits the separately-qualified locked Python native runtime, prepares a fresh isolated AiiDA profile, and independently verifies that prepared state.'
            echo '**Authority: ExecutionEnvironmentPreparedQualifiedV1.**'
            echo ''
            echo 'Zero ProcessNodes and zero CalcJobNodes are required. No pseudopotential is selected or installed and no Quantum ESPRESSO scientific calculation is executed.'
            echo 'Next transition: environment-bound prospective Si pseudopotential freeze.'
          } >> "$GITHUB_STEP_SUMMARY"
