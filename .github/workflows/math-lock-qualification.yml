name: MATH-BUILD-001 Lock Qualification

on:
  push:
    branches:
      - qualify/math-build-001-lock-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-build-001-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-compare-lock:
    name: Reconcile lock and qualify math-research crate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Record frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p math-lock-evidence
          git rev-parse HEAD | tee math-lock-evidence/head-sha.txt
          git rev-parse HEAD^ | tee math-lock-evidence/parent-sha.txt
          sha256sum Cargo.lock rust-toolchain.toml flake.nix flake.lock | tee math-lock-evidence/input-sha256.txt
          find crates/core/symthaea-math-research -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee math-lock-evidence/math-research-source-sha256.txt
          rustc --version --verbose | tee math-lock-evidence/rustc-version.txt
          cargo --version --verbose | tee math-lock-evidence/cargo-version.txt
          nix --version | tee math-lock-evidence/nix-version.txt
          nix flake metadata --no-write-lock-file --json > math-lock-evidence/flake-metadata.json
          cp Cargo.lock math-lock-evidence/Cargo.lock.before

      - name: Minimally reconcile with pinned Rust 1.96.0
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the existing resolution. Ordinary metadata resolution may add
          # only what the new workspace member requires; unlike generate-lockfile
          # it does not intentionally discard the existing lock resolution.
          cargo metadata --format-version 1 > math-lock-evidence/metadata.rustup.unlocked.json
          cargo metadata --format-version 1 --locked > math-lock-evidence/metadata.rustup.locked.json
          cmp math-lock-evidence/metadata.rustup.unlocked.json math-lock-evidence/metadata.rustup.locked.json
          cp Cargo.lock math-lock-evidence/Cargo.lock.rustup
          git diff -- Cargo.lock > math-lock-evidence/Cargo.lock.rustup.patch
          sha256sum Cargo.lock | tee math-lock-evidence/Cargo.lock.rustup.sha256

      - name: Reconcile independently inside Nix dev shell
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- Cargo.lock
          nix develop --command bash -lc '
            set -euo pipefail
            rustc --version --verbose > math-lock-evidence/rustc-version.nix.txt
            cargo --version --verbose > math-lock-evidence/cargo-version.nix.txt
            cargo metadata --format-version 1 > math-lock-evidence/metadata.nix.unlocked.json
            cargo metadata --format-version 1 --locked > math-lock-evidence/metadata.nix.locked.json
            cmp math-lock-evidence/metadata.nix.unlocked.json math-lock-evidence/metadata.nix.locked.json
          '
          cp Cargo.lock math-lock-evidence/Cargo.lock.nix
          git diff -- Cargo.lock > math-lock-evidence/Cargo.lock.nix.patch
          sha256sum Cargo.lock | tee math-lock-evidence/Cargo.lock.nix.sha256

      - name: Require deterministic minimal lock delta
        shell: bash
        run: |
          set -euo pipefail
          cmp math-lock-evidence/Cargo.lock.rustup math-lock-evidence/Cargo.lock.nix
          cmp math-lock-evidence/metadata.rustup.locked.json math-lock-evidence/metadata.nix.locked.json
          grep -Fx 'release: 1.96.0' math-lock-evidence/rustc-version.txt
          grep -Fx 'release: 1.96.0' math-lock-evidence/rustc-version.nix.txt
          grep -E '^cargo 1\.96\.0 ' math-lock-evidence/cargo-version.txt
          grep -E '^cargo 1\.96\.0 ' math-lock-evidence/cargo-version.nix.txt

          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          before = tomllib.loads(Path('math-lock-evidence/Cargo.lock.before').read_text())
          after = tomllib.loads(Path('math-lock-evidence/Cargo.lock.nix').read_text())

          def keyed(lock):
              out = {}
              for pkg in lock.get('package', []):
                  key = (pkg['name'], pkg['version'], pkg.get('source', ''))
                  if key in out:
                      raise SystemExit(f'duplicate lock package identity: {key}')
                  out[key] = pkg
              return out

          old = keyed(before)
          new = keyed(after)
          removed = sorted(set(old) - set(new))
          added = sorted(set(new) - set(old))
          changed = sorted(key for key in set(old) & set(new) if old[key] != new[key])

          expected_key = ('symthaea-math-research', '0.1.0', '')
          if removed:
              raise SystemExit(f'unexpected removed packages: {removed}')
          if changed:
              raise SystemExit(f'unexpected mutations to existing lock packages: {changed}')
          if added != [expected_key]:
              raise SystemExit(f'expected only {expected_key} to be added, got: {added}')

          added_pkg = new[expected_key]
          dep_names = {dep.split()[0] for dep in added_pkg.get('dependencies', [])}
          expected_deps = {'serde', 'serde_json', 'sha2'}
          if dep_names != expected_deps:
              raise SystemExit(
                  f'unexpected {expected_key[0]} lock dependencies: '
                  f'expected={sorted(expected_deps)} found={sorted(dep_names)}'
              )

          metadata = json.loads(Path('math-lock-evidence/metadata.nix.locked.json').read_text())
          packages = {pkg['name']: pkg for pkg in metadata['packages']}
          required = expected_key[0]
          if required not in packages:
              raise SystemExit(f'missing workspace package in metadata: {required}')
          metadata_deps = {dep['name'] for dep in packages[required]['dependencies']}
          if not expected_deps.issubset(metadata_deps):
              raise SystemExit(
                  f'{required} metadata missing dependencies: '
                  f'{sorted(expected_deps - metadata_deps)}'
              )

          Path('math-lock-evidence/lock-delta-summary.txt').write_text(
              'removed=[]\nchanged=[]\nadded=' + repr(added) + '\n'
              + 'added_dependencies=' + repr(sorted(dep_names)) + '\n'
          )
          print('minimal lock delta: PASS')
          print(f'added package: {expected_key}')
          print('dependencies:', ','.join(sorted(dep_names)))
          PY

          git diff --name-only | tee math-lock-evidence/generated-diff-files.txt
          test "$(cat math-lock-evidence/generated-diff-files.txt)" = "Cargo.lock"

      - name: Qualify exact crate bytes with pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check -p symthaea-math-research 2>&1 \
            | tee math-lock-evidence/rustup-fmt.log
          cargo test -p symthaea-math-research --locked 2>&1 \
            | tee math-lock-evidence/rustup-test.log
          cargo clippy -p symthaea-math-research --all-targets --locked -- -D warnings 2>&1 \
            | tee math-lock-evidence/rustup-clippy.log

      - name: Independently qualify exact crate bytes inside Nix
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -lc '
            set -euo pipefail
            set -o pipefail
            cargo fmt --check -p symthaea-math-research 2>&1 \
              | tee math-lock-evidence/nix-fmt.log
            cargo test -p symthaea-math-research --locked 2>&1 \
              | tee math-lock-evidence/nix-test.log
            cargo clippy -p symthaea-math-research --all-targets --locked -- -D warnings 2>&1 \
              | tee math-lock-evidence/nix-clippy.log
          '

      - name: Upload lock and crate qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-build-001-lock-${{ github.sha }}
          path: math-lock-evidence/
          if-no-files-found: error
          retention-days: 30
