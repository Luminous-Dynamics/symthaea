name: Agency Xenia Guarded Witness Frontier

on:
  pull_request:
    paths:
      - 'crates/bridges/symthaea-xenia-guarded-witness-frontier/**'
      - 'crates/bridges/symthaea-xenia-witness-frontier-adapter/**'
      - 'crates/bridges/symthaea-xenia-authority/**'
      - 'crates/bridges/symthaea-authority-time/**'
      - 'crates/bridges/symthaea-qualification-witness-frontier-sqlite/**'
      - 'crates/bridges/symthaea-qualification-witness-frontier/**'
      - 'crates/bridges/symthaea-qualification-witness-sequence/**'
      - 'crates/core/symthaea-authority/**'
      - 'docs/architecture/XENIA_GUARDED_WITNESS_FRONTIER_V01.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/agency-xenia-guarded-witness-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agency-xenia-guarded-witness-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  source:
    name: Guarded Xenia chronology qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt

      - name: Preserve checked-in Cargo.lock
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"

      - name: Let Cargo produce the exact candidate lock
        run: cargo metadata --format-version 1 >/dev/null

      - name: Permit inherited local nodes and only reviewed existing-node mutation
        run: |
          python3 - <<'PY'
          import os, pathlib, sys, tomllib
          before = tomllib.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'Cargo.lock.before').read_text())
          after = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          key = lambda p: (p['name'], p['version'], p.get('source'))
          dep_name = lambda d: d.split()[0]
          dep_version = lambda d: (d.split()[1] if len(d.split()) > 1 and d.split()[1][0].isdigit() else None)
          b = {key(p): p for p in before.get('package', [])}
          a = {key(p): p for p in after.get('package', [])}

          removed = set(b) - set(a)
          added = set(a) - set(b)
          sourced_added = {k for k in added if k[2] is not None}
          if removed or sourced_added:
              print('forbidden Cargo.lock package-set change')
              print('removed:', sorted(removed, key=repr))
              print('new sourced:', sorted(sourced_added, key=repr))
              sys.exit(1)

          xenia_keys = [k for k in b if k[0] == 'symthaea-xenia-authority']
          if len(xenia_keys) != 1:
              print('expected exactly one existing symthaea-xenia-authority node:', xenia_keys)
              sys.exit(1)
          xenia_key = xenia_keys[0]

          changed = {k for k in b.keys() & a if b[k] != a[k]}
          unexpected = changed - {xenia_key}
          if unexpected:
              print('unrelated existing package changed:', sorted(unexpected, key=repr))
              sys.exit(1)

          if xenia_key in changed:
              old = dict(b[xenia_key])
              new = dict(a[xenia_key])
              old_deps = set(old.pop('dependencies', []))
              new_deps = set(new.pop('dependencies', []))
              if old != new or old_deps - new_deps:
                  print('xenia-authority metadata changed or dependency removed')
                  sys.exit(1)
              new_refs = new_deps - old_deps
              if len(new_refs) != 1:
                  print('expected one reviewed xenia-authority dependency addition:', sorted(new_refs))
                  sys.exit(1)
              dep = next(iter(new_refs))
              version = dep_version(dep)
              if dep_name(dep) != 'getrandom' or (version is not None and not version.startswith('0.2.')):
                  print('only getrandom 0.2.x may be added to xenia-authority; got:', dep)
                  sys.exit(1)

          def exact_workspace_node(name, expected_names):
              keys = [k for k in a if k[0] == name]
              if len(keys) != 1:
                  print(f'expected exactly one {name} workspace node:', keys)
                  sys.exit(1)
              node = a[keys[0]]
              if node.get('source') is not None or node.get('checksum') is not None:
                  print(f'{name} unexpectedly has source/checksum')
                  sys.exit(1)
              actual = {dep_name(d) for d in node.get('dependencies', [])}
              if actual != expected_names:
                  print(f'unexpected {name} dependency set:', sorted(actual))
                  sys.exit(1)

          exact_workspace_node(
              'symthaea-xenia-witness-frontier-adapter',
              {
                  'symthaea-authority',
                  'symthaea-qualification-witness-frontier',
                  'symthaea-xenia-authority',
                  'thiserror',
              },
          )
          exact_workspace_node(
              'symthaea-xenia-guarded-witness-frontier',
              {
                  'ed25519-dalek',
                  'symthaea-authority',
                  'symthaea-authority-time',
                  'symthaea-qualification-witness-frontier',
                  'symthaea-qualification-witness-frontier-sqlite',
                  'symthaea-qualification-witness-sequence',
                  'symthaea-xenia-authority',
                  'symthaea-xenia-witness-frontier-adapter',
              },
          )

          local_added = sorted((k for k in added if k[2] is None), key=repr)
          print('accepted inherited source-less workspace/path nodes:', len(local_added))
          for item in local_added:
              print(' +', item)
          PY

      - name: Record lock freshness
        run: |
          if cmp -s "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock; then
            echo clean > "$RUNNER_TEMP/agency-lock-status"
          else
            echo stale > "$RUNNER_TEMP/agency-lock-status"
            git --no-pager diff -- Cargo.lock
          fi

      - name: Rustfmt guarded composition
        run: cargo fmt --check --package symthaea-xenia-guarded-witness-frontier

      - name: Test end-to-end evidence composition
        run: cargo test --locked -p symthaea-xenia-guarded-witness-frontier

      - name: Clippy guarded composition
        run: cargo clippy --locked -p symthaea-xenia-guarded-witness-frontier --all-targets -- -D warnings

      - name: Record exact-head evidence
        if: always()
        run: |
          E="$RUNNER_TEMP/agency-xenia-guarded-frontier-evidence"
          mkdir -p "$E"
          git rev-parse HEAD > "$E/HEAD"
          git rev-parse HEAD^{tree} > "$E/TREE"
          rustc -Vv > "$E/RUSTC.txt"
          cargo -V > "$E/CARGO.txt"
          sha256sum Cargo.lock > "$E/CARGO_LOCK_CANDIDATE_SHA256.txt"
          git --no-pager diff -- Cargo.lock > "$E/CARGO_LOCK_DIFF.patch"
          cat "$RUNNER_TEMP/agency-lock-status" > "$E/CARGO_LOCK_STATUS.txt"
          sha256sum crates/bridges/symthaea-xenia-guarded-witness-frontier/src/lib.rs > "$E/GUARDED_COMPOSITION_SHA256.txt"
          sha256sum crates/bridges/symthaea-xenia-guarded-witness-frontier/tests/guarded_composition.rs > "$E/GUARDED_TEST_SHA256.txt"
          sha256sum crates/bridges/symthaea-xenia-witness-frontier-adapter/src/lib.rs > "$E/XENIA_ADAPTER_SHA256.txt"
          sha256sum crates/bridges/symthaea-xenia-authority/src/witness_frontier.rs > "$E/XENIA_VERIFIER_SHA256.txt"
          sha256sum crates/bridges/symthaea-xenia-authority/src/currentness_challenge.rs > "$E/AFFINE_CHALLENGE_SHA256.txt"
          sha256sum crates/bridges/symthaea-qualification-witness-frontier/src/lib.rs > "$E/RECOVERY_SEMANTICS_SHA256.txt"
          sha256sum crates/bridges/symthaea-qualification-witness-frontier-sqlite/src/lib.rs > "$E/SQLITE_GUARD_SHA256.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agency-xenia-guarded-witness-frontier-${{ github.sha }}
          path: ${{ runner.temp }}/agency-xenia-guarded-frontier-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Require checked-in Cargo.lock to be fresh
        run: test "$(cat "$RUNNER_TEMP/agency-lock-status")" = clean
