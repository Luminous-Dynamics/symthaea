name: ROB Safe Mission Productivity

on:
  pull_request:
    paths:
      - "research/rob-safe-mission-productivity-001/**"
      - ".github/workflows/rob-safe-mission-productivity.yml"

permissions:
  contents: read

jobs:
  deterministic-reference:
    name: Safe mission productivity reference (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/rob-safe-mission-productivity-001/Cargo.toml -- --check
      - name: Run deterministic tests
        run: cargo test --locked --manifest-path research/rob-safe-mission-productivity-001/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/rob-safe-mission-productivity-001/Cargo.toml --all-targets -- -D warnings
