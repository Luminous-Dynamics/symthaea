# Mycelix Ecosystem E2E Tests (Tryorama)
# Browser-level integration tests using @holochain/tryorama
# Tests cross-domain workflows within cluster hApps

name: Tryorama E2E

on:
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/tests/ecosystem/**'
      - 'mycelix-commons/**'
      - 'mycelix-civic/**'
      - 'mycelix-finance/**'
      - '.github/workflows/tryorama-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-workspace/tests/ecosystem/**'
      - 'mycelix-commons/**'
      - 'mycelix-civic/**'
      - 'mycelix-finance/**'
      - '.github/workflows/tryorama-e2e.yml'
  workflow_dispatch:

concurrency:
  group: tryorama-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # Build hApp Bundles
  # ============================================================================
  build-happs:
    name: Build hApp Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-tryorama-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tryorama-

      - name: Build Commons WASM & Package hApp
        run: |
          nix develop ./mycelix-commons --command bash -c '
            cd mycelix-commons
            cargo build --release --workspace --target wasm32-unknown-unknown
            hc dna pack dna/ -o mycelix-commons.dna
            hc app pack . -o mycelix-commons.happ
          '

      - name: Build Civic WASM & Package hApp
        run: |
          nix develop ./mycelix-civic --command bash -c '
            cd mycelix-civic
            cargo build --release --workspace --target wasm32-unknown-unknown
            hc dna pack dna/ -o mycelix-civic.dna
            hc app pack . -o mycelix-civic.happ
          '

      - name: Build Finance WASM & Package hApp
        run: |
          nix develop ./mycelix-finance --command bash -c '
            cd mycelix-finance
            cargo build --release --workspace --target wasm32-unknown-unknown
            hc dna pack dna/ -o mycelix-finance.dna
            hc app pack . -o mycelix-finance.happ
          '

      - name: Upload hApp Bundles
        uses: actions/upload-artifact@v4
        with:
          name: happ-bundles
          path: |
            mycelix-commons/mycelix-commons.happ
            mycelix-civic/mycelix-civic.happ
            mycelix-finance/mycelix-finance.happ

  # ============================================================================
  # Run Tryorama E2E Tests
  # ============================================================================
  tryorama:
    name: Tryorama E2E Tests
    runs-on: ubuntu-latest
    needs: build-happs
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Download hApp Bundles
        uses: actions/download-artifact@v4
        with:
          name: happ-bundles

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Test Dependencies
        run: |
          cd mycelix-workspace/tests/ecosystem
          npm install

      - name: Run Tryorama E2E Tests
        run: |
          nix develop --command bash -c '
            cd mycelix-workspace/tests/ecosystem
            npm test
          '

  # ============================================================================
  # Summary
  # ============================================================================
  tryorama-summary:
    name: Tryorama Summary
    if: always()
    needs: [build-happs, tryorama]
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        run: |
          echo "## Tryorama E2E Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          format_status() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "**FAILED**" ;;
              cancelled) echo "cancelled" ;;
              skipped) echo "skipped" ;;
              *) echo "$1" ;;
            esac
          }

          echo "| Build hApp Bundles | $(format_status '${{ needs.build-happs.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Tryorama E2E | $(format_status '${{ needs.tryorama.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "- **Commons**: Property, Housing, Water, Care, Food, Transport, Bridge" >> $GITHUB_STEP_SUMMARY
          echo "- **Civic**: Justice, Emergency, Media, Restorative, Bridge" >> $GITHUB_STEP_SUMMARY
          echo "- **Finance**: SAP Payments, TEND, Treasury, Staking, Recognition, Bridge" >> $GITHUB_STEP_SUMMARY
