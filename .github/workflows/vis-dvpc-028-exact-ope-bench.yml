name: VIS-DVPC-028 exact OPE estimator benchmark

on:
  pull_request:
    paths:
      - "tools/vision-dvpc-ope-exact.rs"
      - "tests/fixtures/vision-dvpc-028-scenarios.tsv"
      - "docs/research/VIS_DVPC_028_EXACT_OPE_BENCHMARK_V1.md"
      - ".github/workflows/vis-dvpc-028-exact-ope-bench.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-ope-exact.rs"
      - "tests/fixtures/vision-dvpc-028-scenarios.tsv"
      - "docs/research/VIS_DVPC_028_EXACT_OPE_BENCHMARK_V1.md"
      - ".github/workflows/vis-dvpc-028-exact-ope-bench.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source and frozen scenario fixture
        uses: actions/checkout@v4
      - name: Install Rust and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format exact enumerator
        run: rustfmt --edition 2024 tools/vision-dvpc-ope-exact.rs
      - name: Run exact OPE tests
        run: |
          rustc --edition=2024 --test tools/vision-dvpc-ope-exact.rs -o /tmp/vis-dvpc-028-tests
          /tmp/vis-dvpc-028-tests
      - name: Build and score frozen estimator grid
        run: |
          rustc --edition=2024 -O tools/vision-dvpc-ope-exact.rs -o /tmp/vis-dvpc-028
          /tmp/vis-dvpc-028 --sweep | tee /tmp/vis-dvpc-028-results.tsv
          test "$(grep -c '^METRIC[[:space:]]' /tmp/vis-dvpc-028-results.tsv)" = "150"
          grep -Fq $'SCENARIO\tzero_support\t-\tNOT_IDENTIFIED\testimator_metrics\tSUPPRESSED' /tmp/vis-dvpc-028-results.tsv
          grep -Fq $'METRIC\thealthy_correct\tIPS\tSUPPORT_OK_SYNTHETIC_ONLY\texpected\t0.500000000000' /tmp/vis-dvpc-028-results.tsv
      - name: Create exact-source reproducibility receipt
        run: |
          {
            printf 'VIS_DVPC_028_RECEIPT\tformat\tv1\n'
            printf 'commit_sha\t%s\n' "$GITHUB_SHA"
            printf 'rustc\t%s\n' "$(rustc --version)"
            sha256sum tools/vision-dvpc-ope-exact.rs tests/fixtures/vision-dvpc-028-scenarios.tsv /tmp/vis-dvpc-028-results.tsv
          } > /tmp/vis-dvpc-028-receipt.tsv
          cat /tmp/vis-dvpc-028-receipt.tsv
      - name: Publish exact OPE output and receipt
        uses: actions/upload-artifact@v4
        with:
          name: vis-dvpc-028-exact-ope-${{ github.sha }}
          path: |
            /tmp/vis-dvpc-028-results.tsv
            /tmp/vis-dvpc-028-receipt.tsv
          retention-days: 90
