name: Math Retrieval Production Composition

on:
  pull_request:
    paths:
      - ".github/workflows/math-retrieval-production-runtime.yml"
      - "docs/research/MATH_RET_RUNTIME_002C.md"
      - "tools/math-retrieval-production-runtime/**"
      - "tools/math-retrieval-candidate-loader/**"
      - "tools/math-retrieval-runtime-guard/**"
      - "tools/math-retrieval-materializer-identity/**"
      - "tools/math-retrieval-runtime-seam/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-production-composition:
    name: Qualify composed production retrieval boundary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR subject
        uses: actions/checkout@v4

      - name: Install frozen Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Verify frozen predecessor objects
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git rev-parse "HEAD:${path}")"
            printf '%s  %s\n' "$actual" "$path"
            test "$actual" = "$expected"
          }

          check_blob tools/math-retrieval-runtime-seam/src/lib.rs \
            29c949a9331fbe8e912cd0d03a048595bc354d7b
          check_blob tools/math-retrieval-runtime-guard/src/lib.rs \
            8cb65af8bb6af6170b8c627239d0dcb686d0cb4c
          check_blob tools/math-retrieval-candidate-loader/src/lib.rs \
            00716bee4333d32ff3ebfabdb0908acb95ff8bba
          check_blob tools/math-retrieval-materializer-identity/src/lib.rs \
            ccd7c5faa4d3ee4a3fceb7f65a0fa5a8dd68fb5f
          check_blob tools/math-retrieval-production-runtime/tests/production_candidate_fixture.json \
            b958bb22d3f9730089cba0ba18b6eb0f8959be62

      - name: Verify fixture exact-byte SHA-256
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            e92003a3eeb556515927dae44e2c95847fa64a65d9ac7c43535f1f410576b77a \
            tools/math-retrieval-production-runtime/tests/production_candidate_fixture.json \
            | sha256sum --check --strict

      - name: Check standalone lock
        shell: bash
        run: cargo metadata --manifest-path tools/math-retrieval-production-runtime/Cargo.toml --locked --format-version 1 >/dev/null

      - name: Format production runtime
        shell: bash
        run: cargo fmt --manifest-path tools/math-retrieval-production-runtime/Cargo.toml -- --check

      - name: Check production runtime
        shell: bash
        run: cargo check --manifest-path tools/math-retrieval-production-runtime/Cargo.toml --locked

      - name: Test production runtime
        shell: bash
        run: cargo test --manifest-path tools/math-retrieval-production-runtime/Cargo.toml --locked
