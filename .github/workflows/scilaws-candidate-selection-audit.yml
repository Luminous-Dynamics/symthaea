name: SciLaws Candidate Selection Audit

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-architecture-engineering/src/scilaws_candidate_selection.rs"
      - "crates/domains/symthaea-architecture-engineering/src/pareto_objectives.rs"
      - "crates/domains/symthaea-architecture-engineering/src/lib.rs"
      - "crates/domains/symthaea-architecture-engineering/Cargo.toml"
      - ".github/workflows/scilaws-candidate-selection-audit.yml"

permissions:
  contents: read

concurrency:
  group: scilaws-candidate-selection-audit-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, focused tests and strict Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: rustfmt --edition 2024 --check crates/domains/symthaea-architecture-engineering/src/scilaws_candidate_selection.rs

      # Temporary lockfile-drift diagnostic: the inherited branch lock is
      # unchanged from the base and Cargo 1.96 requests a resolution update.
      # This diagnostic run captures the resolver-produced lock for review.
      - name: Regenerate inherited workspace lockfile for diagnosis
        run: cargo test --manifest-path crates/domains/symthaea-architecture-engineering/Cargo.toml --lib scilaws_candidate_selection

      - name: Upload resolver-produced workspace lockfile
        uses: actions/upload-artifact@v4
        with:
          name: scilaws-workspace-lockfile-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
