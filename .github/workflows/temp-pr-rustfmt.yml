name: Temporary PR Rustfmt

on:
  push:

permissions:
  contents: write

concurrency:
  group: temp-pr-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format PR-owned Rust packages
        run: cargo fmt -p symthaea-core -p symthaea-observation-attestation

      - name: Verify formatter scope
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            crates/core/symthaea-core/src/observation_fabric.rs
            crates/core/symthaea-observation-attestation/src/lib.rs
          )
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ ! " ${allowed[*]} " == *" $file "* ]]; then
              echo "Unexpected formatter change: $file"
              exit 1
            fi
          done < <(git diff --name-only)

      - name: Commit formatted source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatter produced no changes."
            exit 0
          fi
          git config user.name "symthaea-rustfmt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/symthaea-core/src/observation_fabric.rs crates/core/symthaea-observation-attestation/src/lib.rs
          git commit -m "style(attestation): normalize PR rustfmt [skip-format-bot]"
          git push origin "HEAD:${{ github.ref_name }}"
