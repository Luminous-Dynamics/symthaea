name: QUAL MEL-EPI-001F independent run receipt

on:
  workflow_run:
    workflows:
      - QUAL MEL-EPI-001F exact subject dispatcher
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  receipt:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Build independent qualification receipt
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          EXPECTED_SUBJECT: 9308736b927d85c19d882ba0db7ada1aaf5dc1d2
          EXPECTED_PARENT: a4f5351882b08f044319d5e61a01c792341f3726
          EXPECTED_WORKFLOW_NAME: QUAL MEL-EPI-001F exact subject dispatcher
          EXPECTED_WORKFLOW_BLOB_SHA: db2f1a9fcd612a1a462763bf763614c3f8612bdf
          WORKFLOW_PATH: .github/workflows/qual-mel-epi-001f-dispatch.yml
          OBSERVER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          OBSERVER_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const subject = process.env.EXPECTED_SUBJECT;
            const expectedParent = process.env.EXPECTED_PARENT;
            const expectedWorkflowName = process.env.EXPECTED_WORKFLOW_NAME;
            const expectedWorkflowBlobSha = process.env.EXPECTED_WORKFLOW_BLOB_SHA;
            const workflowPath = process.env.WORKFLOW_PATH;
            const observerWorkflowSha = process.env.OBSERVER_WORKFLOW_SHA;
            const observerWorkflowRef = process.env.OBSERVER_WORKFLOW_REF;
            const triggerAction = context.payload.action;

            const actor = run.actor
              ? { id: run.actor.id ?? null, login: run.actor.login ?? null }
              : null;
            const triggeringActor = run.triggering_actor
              ? {
                  id: run.triggering_actor.id ?? null,
                  login: run.triggering_actor.login ?? null,
                }
              : null;

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: run.id, per_page: 100 }
            );

            const workflowFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: workflowPath,
              ref: run.head_sha,
            });

            if (Array.isArray(workflowFile.data)) {
              throw new Error('dispatcher workflow path resolved to a directory');
            }

            const workflowBytes = Buffer.from(
              workflowFile.data.content,
              workflowFile.data.encoding
            );
            const workflowText = workflowBytes.toString('utf8');
            const workflowSha256 = crypto.createHash('sha256').update(workflowBytes).digest('hex');

            const dispatcherWorkflow = await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id: workflowPath,
            });

            const workflowIdentityVerified =
              triggerAction === 'completed' &&
              String(run.workflow_id) === String(dispatcherWorkflow.data.id) &&
              run.name === expectedWorkflowName &&
              dispatcherWorkflow.data.name === expectedWorkflowName &&
              dispatcherWorkflow.data.path === workflowPath &&
              run.path === workflowPath + '@main' &&
              run.event === 'workflow_dispatch' &&
              run.head_branch === 'main' &&
              run.repository?.full_name === owner + '/' + repo &&
              run.head_repository?.full_name === owner + '/' + repo;

            const workflowBlobVerified = workflowFile.data.sha === expectedWorkflowBlobSha;

            const requiredWorkflowFragments = [
              subject,
              expectedParent,
              'refs/heads/main',
              'crates/domains/symthaea-epistemic-types/src/claim_derivation.rs',
              'crates/domains/symthaea-epistemic-types/src/lib.rs',
              'docs/research/MEL_EPI_001F_CLAIM_DERIVATION_V1.md',
              'cargo metadata --locked --no-deps --format-version 1',
              'cargo fmt -p symthaea-epistemic-types -- --check',
              'cargo test --locked -p symthaea-epistemic-types',
              'cargo check --locked -p symthaea-epistemic-types --all-targets',
              'cargo clippy --locked -p symthaea-epistemic-types --all-targets --no-deps -- -D warnings',
              'on:\n  workflow_dispatch',
              'permissions:\n  contents: read',
            ];

            const missingWorkflowFragments = requiredWorkflowFragments.filter(
              (fragment) => !workflowText.includes(fragment)
            );

            const expectedAncestry = [
              subject,
              'a4f5351882b08f044319d5e61a01c792341f3726',
              '62d021bfc055fafcdd067c697df7d39a05c50bd5',
              '3f3a6b3bf4728879688eb53961236b0756180c47',
              '2507b588c679bc4a4f3f790f97c0475bf42d8126',
              '647f0aefa5801b57c5b10f17937998918918028d',
              '377d26d3207e715665713f37b52c7b097ad01313',
              '035422d7a8b701fe75f4f79e6ba777df47472394',
              '5fd5259af776c0a7f1b9608f040bfae9009871a1',
            ];

            const observedAncestry = [];
            let cursor = subject;
            for (let index = 0; index < expectedAncestry.length; index += 1) {
              const commit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: cursor,
              });
              const actualSha = commit.data.sha;
              const actualParent = commit.data.parents[0]?.sha ?? null;
              observedAncestry.push({
                depth: index,
                commit_sha: actualSha,
                expected_sha: expectedAncestry[index],
                first_parent: actualParent,
              });
              if (actualSha !== expectedAncestry[index]) {
                break;
              }
              cursor = actualParent;
              if (!cursor) {
                break;
              }
            }

            const ancestryVerified =
              observedAncestry.length === expectedAncestry.length &&
              observedAncestry.every((entry) => entry.commit_sha === entry.expected_sha);

            const compare = await github.rest.repos.compareCommits({
              owner,
              repo,
              basehead: expectedParent + '...' + subject,
            });

            const changedFiles = (compare.data.files ?? [])
              .map((file) => file.filename)
              .sort();

            const expectedFiles = [
              'crates/domains/symthaea-epistemic-types/src/claim_derivation.rs',
              'crates/domains/symthaea-epistemic-types/src/lib.rs',
              'docs/research/MEL_EPI_001F_CLAIM_DERIVATION_V1.md',
            ].sort();

            const sourceSurfaceVerified =
              JSON.stringify(changedFiles) === JSON.stringify(expectedFiles);

            const sourceHashes = {};
            for (const path of expectedFiles) {
              const file = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: subject,
              });
              if (Array.isArray(file.data)) {
                throw new Error('expected source path resolved to a directory: ' + path);
              }
              const bytes = Buffer.from(file.data.content, file.data.encoding);
              sourceHashes[path] = {
                blob_sha: file.data.sha,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              };
            }

            const expectedSteps = [
              'Verify workflow host is main',
              'Checkout exact 001F product subject',
              'Install pinned Rust toolchain',
              'Locked metadata',
              'Rustfmt',
              'Tests',
              'Check all targets',
              'Strict Clippy',
              'Exact-source postflight',
            ];

            const stepOutcomes = {};
            for (const name of expectedSteps) {
              const matches = jobs
                .flatMap((job) => job.steps ?? [])
                .filter((step) => step.name === name);
              stepOutcomes[name] = matches.map((step) => step.conclusion);
            }

            const requiredStepsSucceeded = expectedSteps.every(
              (name) =>
                stepOutcomes[name].length === 1 &&
                stepOutcomes[name][0] === 'success'
            );

            const workflowContractVerified =
              workflowIdentityVerified &&
              workflowBlobVerified &&
              missingWorkflowFragments.length === 0;

            const qualificationResult =
              run.conclusion === 'success' &&
              workflowContractVerified &&
              ancestryVerified &&
              sourceSurfaceVerified &&
              requiredStepsSucceeded
                ? 'PASS'
                : 'NOT_PASS';

            const receipt = {
              schema_version: 'mel-epi-001f-independent-run-receipt-v1',
              qualification_result: qualificationResult,
              product_subject: subject,
              workflow_run: {
                id: run.id,
                trigger_action: triggerAction,
                attempt: run.run_attempt,
                conclusion: run.conclusion,
                event: run.event,
                name: run.name,
                path: run.path,
                workflow_id: run.workflow_id,
                head_branch: run.head_branch,
                head_sha: run.head_sha,
                repository_full_name: run.repository?.full_name ?? null,
                head_repository_full_name: run.head_repository?.full_name ?? null,
                workflow_file_path: workflowPath,
                workflow_file_blob_sha: workflowFile.data.sha,
                workflow_file_sha256: workflowSha256,
                html_url: run.html_url,
                created_at: run.created_at ?? null,
                run_started_at: run.run_started_at ?? null,
                updated_at: run.updated_at ?? null,
                actor,
                triggering_actor: triggeringActor,
              },
              workflow_contract: {
                expected_workflow_name: expectedWorkflowName,
                expected_workflow_path: workflowPath,
                expected_workflow_blob_sha: expectedWorkflowBlobSha,
                observed_workflow_id: run.workflow_id,
                resolved_workflow_id: dispatcherWorkflow.data.id,
                missing_fragments: missingWorkflowFragments,
                identity_verified: workflowIdentityVerified,
                blob_verified: workflowBlobVerified,
                verified: workflowContractVerified,
              },
              observer_context: {
                workflow_sha: observerWorkflowSha,
                workflow_ref: observerWorkflowRef,
              },
              ancestry: {
                expected: expectedAncestry,
                observed: observedAncestry,
                verified: ancestryVerified,
              },
              source_surface: {
                expected_files: expectedFiles,
                observed_files: changedFiles,
                verified: sourceSurfaceVerified,
                files: sourceHashes,
              },
              gate_outcomes: stepOutcomes,
              gates_verified: requiredStepsSucceeded,
            };

            fs.writeFileSync(
              'MEL_EPI_001F_INDEPENDENT_RUN_RECEIPT_V1.json',
              JSON.stringify(receipt, null, 2) + '\n'
            );

            core.info('Qualification result: ' + qualificationResult);

      - name: Upload independent qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-epi-001f-independent-run-receipt-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: MEL_EPI_001F_INDEPENDENT_RUN_RECEIPT_V1.json
          if-no-files-found: error
          retention-days: 90
