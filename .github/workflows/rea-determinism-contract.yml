name: REA Determinism Contract
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "benchmarks/rea-determinism/v1/**"
      - ".github/workflows/rea-determinism-contract.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/rea-determinism/v1/**"
      - ".github/workflows/rea-determinism-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-determinism-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Canonical semantic projection and mutation controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          command -v jq
          jq --version
          command -v sha256sum
          command -v sed

      - name: Verify semantic equivalence and fail-closed controls
        shell: bash
        run: sh benchmarks/rea-determinism/v1/verify.sh

      - name: Verify weakened normalizers are detected
        shell: bash
        run: sh benchmarks/rea-determinism/v1/mutation-controls.sh

      - name: Verify 512 equivalent metamorphic report transformations
        shell: bash
        run: sh benchmarks/rea-determinism/v1/metamorphic-sweep.sh