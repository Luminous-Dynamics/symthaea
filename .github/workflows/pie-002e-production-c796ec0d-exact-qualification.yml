name: PIE-002E Repaired Production Exact Qualification

on:
  push:
    branches:
      - qualify/pie-002e-production-c796ec0d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify repaired PIE-002E subject-bound composition
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUBJECT_SHA: c796ec0df10f8f5d240b54bebcea1a4fc0272aa0
      PARENT_SHA: e9b4bff9d186bf1150e21d097d912d5b46747262
      SUBJECT_TREE: 7777c959d18473d4b24749af422440b40e38b7e2
      PACKAGE: symthaea-planetary-industry
      SOURCE: crates/domains/symthaea-planetary-industry/src/utility_composition.rs
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout frozen subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 2

      - name: Verify exact subject, lineage, tree, and file scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          mapfile -t files < <(git diff --name-only "$PARENT_SHA" "$SUBJECT_SHA" | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "crates/domains/symthaea-planetary-industry/src/lib.rs"
          test "${files[1]}" = "$SOURCE"

      - name: Record subject file digests
        run: |
          sha256sum \
            crates/domains/symthaea-planetary-industry/src/lib.rs \
            "$SOURCE" \
            | tee pie-002e-production-files.sha256

      - name: Enforce preferred-path source boundary
        id: source_boundary
        continue-on-error: true
        run: |
          set -euo pipefail
          executable_source="$(sed -E '/^[[:space:]]*\/\//d' "$SOURCE")"
          if printf '%s\n' "$executable_source" | grep -Eq '(^|[^[:alnum:]_])ProcessUtilityProjection([^[:alnum:]_]|$)'; then
            echo "detached projection type appears in executable source" >&2
            exit 1
          fi
          if printf '%s\n' "$executable_source" | grep -Eq '(^|[^[:alnum:]_])evaluate_electrical_utility([^[:alnum:]_]|$)'; then
            echo "feasibility evaluator appears in executable source" >&2
            exit 1
          fi
          grep -Fq 'process: &ProcessDefinition' "$SOURCE"
          grep -Fq 'context: &ElectricalSupplyRecoveryContext' "$SOURCE"
          grep -Fq 'let projection = project_process_utilities(process)?;' "$SOURCE"
          grep -Fq 'bind_electrical_accounting_case(&projection, context)' "$SOURCE"

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy

      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Package rustfmt
        id: fmt
        continue-on-error: true
        run: cargo fmt -p "$PACKAGE" -- --check

      - name: Package check
        id: check
        continue-on-error: true
        run: cargo check -p "$PACKAGE" --all-targets --locked

      - name: Package tests
        id: test
        continue-on-error: true
        run: cargo test -p "$PACKAGE" --all-targets --locked --no-fail-fast

      - name: Package clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy -p "$PACKAGE" --all-targets --locked -- -D warnings

      - name: Diff hygiene
        id: diff
        continue-on-error: true
        run: git diff --check "$PARENT_SHA" "$SUBJECT_SHA"

      - name: Emit machine-readable qualification receipt
        if: always()
        run: |
          cat > pie-002e-production-qualification.json <<EOF
          {
            "schema": "symthaea.pie.exact-subject-qualification.v1",
            "subject_sha": "$SUBJECT_SHA",
            "parent_sha": "$PARENT_SHA",
            "tree_sha": "$SUBJECT_TREE",
            "package": "$PACKAGE",
            "rust_toolchain": "1.96.0",
            "gates": {
              "preferred_path_source_boundary": "${{ steps.source_boundary.outcome }}",
              "rustfmt": "${{ steps.fmt.outcome }}",
              "check_all_targets_locked": "${{ steps.check.outcome }}",
              "test_all_targets_locked": "${{ steps.test.outcome }}",
              "clippy_all_targets_deny_warnings_locked": "${{ steps.clippy.outcome }}",
              "git_diff_check": "${{ steps.diff.outcome }}"
            },
            "scope": "Invocation-supplied ProcessDefinition validation, in-call utility projection, and explicit binding only; preferred executable path accepts no detached ProcessUtilityProjection and invokes no feasibility evaluator; not persistence currentness, applicability, feasibility, dispatch, thermodynamic closure, economics, or execution authority."
          }
          EOF
          cat pie-002e-production-qualification.json

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-002e-repaired-production-exact-subject-qualification
          path: |
            pie-002e-production-qualification.json
            pie-002e-production-files.sha256
          if-no-files-found: error

      - name: Enforce all qualification gates
        if: always()
        run: |
          test "${{ steps.source_boundary.outcome }}" = success
          test "${{ steps.fmt.outcome }}" = success
          test "${{ steps.check.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.clippy.outcome }}" = success
          test "${{ steps.diff.outcome }}" = success
