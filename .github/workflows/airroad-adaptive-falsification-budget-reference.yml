name: AIRROAD Adaptive Falsification Budget Reference

on:
  pull_request:
    paths:
      - "docs/research/AIRROAD_ADAPTIVE_FALSIFICATION_BUDGET_001_V0_1.md"
      - "docs/research/fixtures/airroad-adaptive-falsification-budget-v0.1.json"
      - "tools/airroad-adaptive-falsification-budget/verify_falsification_budget.py"
      - ".github/workflows/airroad-adaptive-falsification-budget-reference.yml"
  push:
    branches:
      - research/airroad-adaptive-falsification-budget-v0.1
    paths:
      - "docs/research/AIRROAD_ADAPTIVE_FALSIFICATION_BUDGET_001_V0_1.md"
      - "docs/research/fixtures/airroad-adaptive-falsification-budget-v0.1.json"
      - "tools/airroad-adaptive-falsification-budget/verify_falsification_budget.py"
      - ".github/workflows/airroad-adaptive-falsification-budget-reference.yml"

permissions:
  contents: read

concurrency:
  group: airroad-adaptive-falsification-budget-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-power-and-set-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and execute power-ceiling and sequence oracle
        run: |
          python3 -m py_compile \
            tools/airroad-adaptive-falsification-budget/verify_falsification_budget.py
          python3 \
            tools/airroad-adaptive-falsification-budget/verify_falsification_budget.py
      - name: Validate exact fixture JSON
        run: |
          python3 -m json.tool \
            docs/research/fixtures/airroad-adaptive-falsification-budget-v0.1.json \
            > /dev/null
