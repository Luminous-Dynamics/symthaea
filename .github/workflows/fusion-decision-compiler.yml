name: Fusion decision compiler contract

on:
  pull_request:
    paths:
      - "research/fusion-decision-compiler-v0-1/**"
      - ".github/workflows/fusion-decision-compiler.yml"
  push:
    branches:
      - main
      - research/fusion-decision-compiler-v0-1
    paths:
      - "research/fusion-decision-compiler-v0-1/**"
      - ".github/workflows/fusion-decision-compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Install stable Rust and quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path research/fusion-decision-compiler-v0-1/Cargo.toml -- --check

      - name: Unit and documentation tests
        run: cargo test --manifest-path research/fusion-decision-compiler-v0-1/Cargo.toml

      - name: Strict Clippy
        run: cargo clippy --manifest-path research/fusion-decision-compiler-v0-1/Cargo.toml --all-targets -- -D warnings

      - name: Independent FECOMP-0 corpus audit
        run: cargo run --manifest-path research/fusion-decision-compiler-v0-1/Cargo.toml --bin verify_fecomp_corpus

      - name: Independent validation-domain corpus inventory
        run: cargo run --manifest-path research/fusion-decision-compiler-v0-1/Cargo.toml --bin verify_validation_domain_corpus

      - name: Run synthetic matched-case cross-solver comparison
        run: cargo run --manifest-path research/fusion-decision-compiler-v0-1/Cargo.toml --bin compare_solver_outputs
