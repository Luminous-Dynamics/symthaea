name: DMC Complete Restore Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: ["research/dmc-individual-effect-pilot-v0-1-20261124"]
    paths:
      - "research/temporal-evaluator/**"
      - "docs/research/DMC_COMPLETE_RESTORE_AND_PREFIX_V0_1.md"
      - "docs/research/fixtures/dmc_restore_prefix_v0.1.json"
      - "tools/dmc-restore-smoke/**"
      - ".github/workflows/dmc-restore-contract.yml"
  push:
    branches: ["research/dmc-restore-contract-v0-1-20261124"]
    paths:
      - "research/temporal-evaluator/**"
      - "docs/research/DMC_COMPLETE_RESTORE_AND_PREFIX_V0_1.md"
      - "docs/research/fixtures/dmc_restore_prefix_v0.1.json"
      - "tools/dmc-restore-smoke/**"
      - ".github/workflows/dmc-restore-contract.yml"

concurrency:
  group: dmc-restore-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluator:
    name: Rust 1.96 DMC restore contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check changed-module formatting
        run: rustfmt --edition 2024 --check research/temporal-evaluator/src/dmc_restore_contract.rs
      - name: Test exact evaluator package
        run: cargo test --locked --manifest-path research/temporal-evaluator/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/temporal-evaluator/Cargo.toml --all-targets -- -D warnings


  pinned-python-smoke:
    name: Pinned dm_control fresh-process restore smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact dm_control source and MuJoCo versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mujoco==4.0.1"
          python -m pip install "git+https://github.com/google-deepmind/dm_control.git@d7e52e3602a555df6cc20cc928ea5b41e9920158"
      - name: Compile the smoke harness
        run: python -m py_compile tools/dmc-restore-smoke/restore_smoke.py
      - name: Export branch-point snapshot in process A
        run: python tools/dmc-restore-smoke/restore_smoke.py export "$RUNNER_TEMP/dmc_restore_smoke.npz"
      - name: Restore and replay in fresh process B
        run: python tools/dmc-restore-smoke/restore_smoke.py replay "$RUNNER_TEMP/dmc_restore_smoke.npz"
