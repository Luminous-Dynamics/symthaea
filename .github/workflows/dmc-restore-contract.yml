name: DMC Four-Task Restore Extension

on:
  push:
    branches: ["research/dmc-four-task-restore-smoke-v0-1-20261125"]
    paths:
      - "research/temporal-evaluator/**"
      - "docs/research/DMC_COMPLETE_RESTORE_AND_PREFIX_V0_1.md"
      - "docs/research/fixtures/dmc_restore_prefix_v0.1.json"
      - "tools/dmc-restore-smoke/**"
      - ".github/workflows/dmc-restore-contract.yml"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - research/dmc-restore-contract-v0-1-20261124
    paths:
      - "research/temporal-evaluator/**"
      - "docs/research/DMC_COMPLETE_RESTORE_AND_PREFIX_V0_1.md"
      - "docs/research/fixtures/dmc_restore_prefix_v0.1.json"
      - "tools/dmc-restore-smoke/**"
      - ".github/workflows/dmc-restore-contract.yml"

permissions:
  contents: read

jobs:
  pinned-python-smoke:
    name: Pinned dm_control restore / replay (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - cartpole.swingup
          - cartpole.two_poles
          - cartpole.three_poles
          - walker.walk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact dm_control source and MuJoCo versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mujoco==4.0.1"
          python -m pip install "git+https://github.com/google-deepmind/dm_control.git@d7e52e3602a555df6cc20cc928ea5b41e9920158"
      - name: Compile the smoke harness
        run: python -m py_compile tools/dmc-restore-smoke/restore_smoke.py
      - name: Export branch-point snapshot in process A
        run: python tools/dmc-restore-smoke/restore_smoke.py export "$RUNNER_TEMP/dmc_restore_smoke.npz" --task "${{ matrix.task }}"
      - name: Restore and replay in fresh process B
        run: python tools/dmc-restore-smoke/restore_smoke.py replay "$RUNNER_TEMP/dmc_restore_smoke.npz" --task "${{ matrix.task }}"
