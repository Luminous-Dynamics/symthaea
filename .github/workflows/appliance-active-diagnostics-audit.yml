name: Appliance Active Diagnostics Contract Audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - "docs/engineering/APPLIANCE_ACTIVE_DIAGNOSTICS_PROTOCOL_V0_1.md"
      - "schemas/diagnostics/appliance_active_diagnostic_corpus_v0_1.schema.json"
      - "fixtures/diagnostics/appliance_active_diagnostic_corpus_v0_1.json"
      - "tools/appliance-active-diagnostics-audit/**"
      - ".github/workflows/appliance-active-diagnostics-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/engineering/APPLIANCE_ACTIVE_DIAGNOSTICS_PROTOCOL_V0_1.md"
      - "schemas/diagnostics/appliance_active_diagnostic_corpus_v0_1.schema.json"
      - "fixtures/diagnostics/appliance_active_diagnostic_corpus_v0_1.json"
      - "tools/appliance-active-diagnostics-audit/**"
      - ".github/workflows/appliance-active-diagnostics-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appliance-active-diagnostics-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check verifier formatting
        run: cargo fmt --manifest-path tools/appliance-active-diagnostics-audit/Cargo.toml -- --check
      - name: Run schema, entropy-policy and mutation tests
        run: cargo test --manifest-path tools/appliance-active-diagnostics-audit/Cargo.toml --all-targets
      - name: Audit frozen corpus and emit digest-bound report
        run: cargo run --manifest-path tools/appliance-active-diagnostics-audit/Cargo.toml -- --schema schemas/diagnostics/appliance_active_diagnostic_corpus_v0_1.schema.json --corpus fixtures/diagnostics/appliance_active_diagnostic_corpus_v0_1.json
