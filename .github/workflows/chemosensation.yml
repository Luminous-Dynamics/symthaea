name: Chemosensation

on:
  push:
    branches: [main]
    paths:
      - "crates/domains/symthaea-chemosensation/**"
      - "crates/bridges/symthaea-chemosensation-bridge/**"
      - "crates/core/symthaea-core/**"
      - "crates/core/symthaea-evidence-plane/**"
      - "src/consciousness/integration/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/chemosensation.yml"
  pull_request:
    paths:
      - "crates/domains/symthaea-chemosensation/**"
      - "crates/bridges/symthaea-chemosensation-bridge/**"
      - "crates/core/symthaea-core/**"
      - "crates/core/symthaea-evidence-plane/**"
      - "src/consciousness/integration/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/chemosensation.yml"
  workflow_dispatch:

concurrency:
  group: chemosensation-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Chemosensation unit and lint gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-chemosensation-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-chemosensation-

      - name: Run chemosensation unit tests
        run: cargo test -p symthaea-chemosensation

      - name: Run chemosensation clippy
        run: cargo clippy -p symthaea-chemosensation --all-targets -- -D warnings

      - name: Run chemosensation documentation tests
        run: cargo test -p symthaea-chemosensation --doc

      - name: Run root handoff bridge unit tests
        run: cargo test -p symthaea-chemosensation-bridge

      - name: Run root handoff bridge clippy
        run: cargo clippy -p symthaea-chemosensation-bridge --all-targets -- -D warnings

      - name: Run root handoff bridge documentation tests
        run: cargo test -p symthaea-chemosensation-bridge --doc
