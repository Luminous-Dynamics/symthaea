# Mycelix Hearth CI
# Dedicated CI for the hearth cluster hApp (decisions, kinship, digest, bridge zomes + TS SDK)

name: Hearth CI

on:
  push:
    branches: [main]
    paths:
      - 'mycelix-hearth/**'
      - '.github/workflows/hearth-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-hearth/**'
      - '.github/workflows/hearth-ci.yml'

concurrency:
  group: hearth-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 'stable'
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # Rust Formatting Check
  # ============================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-hearth

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - run: cargo fmt --all --check

  # ============================================================================
  # Rust Linting
  # ============================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-hearth

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-hearth

      - run: cargo clippy --all -- -D warnings

  # ============================================================================
  # Rust Unit Tests
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-hearth

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-hearth

      - run: cargo test --all

  # ============================================================================
  # TypeScript SDK Type Check
  # ============================================================================
  typecheck:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-hearth/sdk-ts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install

      - run: npx tsc --noEmit

  # ============================================================================
  # Integration Tests (expected-fail, conductor-dependent)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # No conductor in CI
    defaults:
      run:
        working-directory: mycelix-hearth/tests

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-hearth/tests

      - name: Run integration tests (expected to fail without conductor)
        continue-on-error: true
        run: cargo test --release -- --ignored --test-threads=2
