          # Root lock projection: no external dependency changes are permitted.
          lock = Path('Cargo.lock')
          text = lock.read_text()
          semantic_lock = Path('/tmp/semantics-parent.Cargo.lock').read_text()

          def stanza(source: str, package: str) -> str:
              pattern = re.compile(
                  r'\[\[package\]\]\nname = "' + re.escape(package) + r'"\n.*?(?=\n\[\[package\]\]|\Z)',
                  re.S,
              )
              match = pattern.search(source)
              if not match:
                  raise SystemExit(f'missing lock stanza for {package}')
              return match.group(0)

          campaign_stanza = stanza(text, 'symthaea-assurance-campaign')
          if ' "symthaea-assurance-semantics",' in campaign_stanza:
              raise SystemExit('campaign lock already contains semantics dependency')
          new_campaign_stanza = campaign_stanza.replace(
              ' "symthaea-assurance-core",\n',
              ' "symthaea-assurance-core",\n "symthaea-assurance-semantics",\n',
              1,
          )
          text = text.replace(campaign_stanza, new_campaign_stanza, 1)

          if 'name = "symthaea-assurance-semantics"' in text:
              raise SystemExit('semantics lock stanza unexpectedly already present')
          core_stanza = stanza(text, 'symthaea-assurance-core')
          semantics_stanza = stanza(semantic_lock, 'symthaea-assurance-semantics')
          text = text.replace(core_stanza, core_stanza + '\n' + semantics_stanza, 1)
          lock.write_text(text)
          PY

      - name: Add permanent read-only convergence qualifier
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/assure-002b.yml <<'YAML'
          name: ASSURE-002B Convergence Qualification

          on:
            pull_request:
              paths:
                - 'crates/core/symthaea-assurance-core/**'
                - 'crates/core/symthaea-assurance-subject/**'
                - 'crates/core/symthaea-assurance-semantics/**'
                - 'crates/core/symthaea-assurance-campaign/**'
                - 'Cargo.lock'
                - '.github/workflows/assure-002a.yml'
                - '.github/workflows/assure-002b.yml'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: assure-002b-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          env:
            CAMPAIGN_PARENT: 8f619541528362a30e7caf432eaf256a64e302e8
            SEMANTICS_PARENT: a95bbb2d0eac395b1d734e1031f9209240f3b8d6

          jobs:
            qualify:
              permissions:
                contents: read
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: false

                - name: Install pinned Rust toolchain
                  shell: bash
                  run: |
                    set -euo pipefail
                    rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --no-self-update
                    rustup override set 1.96.0
                    rustc --version --verbose
                    cargo --version
                    python3 --version

                - name: Prove exact two-parent convergence subject
                  shell: bash
                  env:
                    EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
                  run: |
                    set -euo pipefail
                    test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
                    PARENTS="$(git show -s --format=%P HEAD)"
                    test "$PARENTS" = "$CAMPAIGN_PARENT $SEMANTICS_PARENT"
                    git diff --exit-code

                - name: Format
                  shell: bash
                  run: |
                    set -euo pipefail
                    cargo fmt --manifest-path crates/core/symthaea-assurance-core/Cargo.toml -- --check
                    cargo fmt --manifest-path crates/core/symthaea-assurance-semantics/Cargo.toml -- --check
                    cargo fmt --manifest-path crates/core/symthaea-assurance-campaign/Cargo.toml -- --check

                - name: Independent shared semantic vectors
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 crates/core/symthaea-assurance-semantics/tools/verify_vectors.py

                - name: Source-contract audit
                  shell: bash
