                    cargo clippy --manifest-path crates/core/symthaea-assurance-semantics/Cargo.toml --all-targets -- -D warnings
                    cargo clippy --manifest-path crates/core/symthaea-assurance-campaign/Cargo.toml --all-targets -- -D warnings

                - name: Require committed lock parity
                  shell: bash
                  run: |
                    set -euo pipefail
                    git diff -- Cargo.lock
                    git diff --exit-code -- Cargo.lock

                - name: Prove tracked checkout immutability
                  shell: bash
                  run: |
                    set -euo pipefail
                    git diff --exit-code
                    test -z "$(git status --porcelain --untracked-files=no)"
          YAML

      - name: Rust 1.96 syntax and formatting guard only
        shell: bash
