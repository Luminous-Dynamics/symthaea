                      rustc --version
                      cargo --version
                      python3 --version
                    } > target/assure-002b-lock/MANIFEST.txt
                    cat target/assure-002b-lock/MANIFEST.txt

                - name: Upload integrated lock evidence
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                  with:
                    name: assure-002b-lock-${{ github.event.pull_request.head.sha || github.sha }}
                    path: target/assure-002b-lock/
                    if-no-files-found: error
                    retention-days: 7

                - name: Test generic core
                  run: cargo test --manifest-path crates/core/symthaea-assurance-core/Cargo.toml

                - name: Test shared semantics
                  run: cargo test --manifest-path crates/core/symthaea-assurance-semantics/Cargo.toml

                - name: Test integrated campaign
                  run: cargo test --manifest-path crates/core/symthaea-assurance-campaign/Cargo.toml

                - name: Strict Clippy
                  shell: bash
