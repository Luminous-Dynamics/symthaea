name: Superconductivity OOD discovery benchmark contract

# Pinned exact-head qualification covers both the OOD split auditor and tri-state feasibility gate.

on:
  pull_request:
    paths:
      - "tools/sc-discovery-ood-benchmark-auditor/**"
      - "data/schemas/sc_discovery_benchmark_v0_1.schema.json"
      - "data/research/sc_discovery_benchmark_fixture_v0_1.json"
      - "data/schemas/sc_feasibility_gate_v0_1.schema.json"
      - "data/research/sc_feasibility_gate_fixture_v0_1.json"
      - "research/superconductivity/discovery_ood_benchmark/**"
      - ".github/workflows/sc-discovery-ood-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc-discovery-ood-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    name: Leakage controls, selective prediction and reproducible receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Apply pinned Rust formatting
        run: cargo fmt --manifest-path tools/sc-discovery-ood-benchmark-auditor/Cargo.toml --all

      - name: Verify canonical Rust formatting
        run: cargo fmt --manifest-path tools/sc-discovery-ood-benchmark-auditor/Cargo.toml --all -- --check

      - name: Capture rustfmt-only patch
        if: always()
        run: |
          git diff --binary -- tools/sc-discovery-ood-benchmark-auditor > "$RUNNER_TEMP/sc-ood-rustfmt.patch"
          git diff --stat -- tools/sc-discovery-ood-benchmark-auditor
          sha256sum "$RUNNER_TEMP/sc-ood-rustfmt.patch"

      - name: Generate isolated dependency lockfile
        run: cargo generate-lockfile --manifest-path tools/sc-discovery-ood-benchmark-auditor/Cargo.toml

      - name: Run OOD and feasibility-gate negative controls
        run: cargo test --locked --manifest-path tools/sc-discovery-ood-benchmark-auditor/Cargo.toml --bins

      - name: Audit synthetic fixture
        run: |
          cargo run --locked --manifest-path tools/sc-discovery-ood-benchmark-auditor/Cargo.toml --bin sc_discovery_ood_audit -- \
            --schema data/schemas/sc_discovery_benchmark_v0_1.schema.json \
            --fixture data/research/sc_discovery_benchmark_fixture_v0_1.json \
            --out "$RUNNER_TEMP/sc-discovery-ood-receipt.json"
          cat "$RUNNER_TEMP/sc-discovery-ood-receipt.json"

      - name: Audit synthetic tri-state feasibility gate
        run: |
          cargo run --locked --manifest-path tools/sc-discovery-ood-benchmark-auditor/Cargo.toml --bin sc_feasibility_gate_audit -- \
            --schema data/schemas/sc_feasibility_gate_v0_1.schema.json \
            --fixture data/research/sc_feasibility_gate_fixture_v0_1.json \
            --out "$RUNNER_TEMP/sc-feasibility-gate-receipt.json"
          cat "$RUNNER_TEMP/sc-feasibility-gate-receipt.json"

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/sc-discovery-ood-benchmark-auditor/Cargo.toml --bins -- -D warnings

      - name: Record exact-run identity
        if: always()
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            sha256sum data/schemas/sc_discovery_benchmark_v0_1.schema.json
            sha256sum data/research/sc_discovery_benchmark_fixture_v0_1.json
            sha256sum tools/sc-discovery-ood-benchmark-auditor/Cargo.toml
            sha256sum tools/sc-discovery-ood-benchmark-auditor/src/main.rs
            sha256sum tools/sc-discovery-ood-benchmark-auditor/src/bin/sc_feasibility_gate_audit.rs
            sha256sum data/schemas/sc_feasibility_gate_v0_1.schema.json
            sha256sum data/research/sc_feasibility_gate_fixture_v0_1.json
            if [ -f "$RUNNER_TEMP/sc-ood-rustfmt.patch" ]; then sha256sum "$RUNNER_TEMP/sc-ood-rustfmt.patch"; fi
            if [ -f tools/sc-discovery-ood-benchmark-auditor/Cargo.lock ]; then
              sha256sum tools/sc-discovery-ood-benchmark-auditor/Cargo.lock
            else
              echo "cargo_lock=not-generated"
            fi
          } > "$RUNNER_TEMP/sc-discovery-ood-environment.txt"

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-discovery-ood-exact-run-evidence
          if-no-files-found: warn
          path: |
            tools/sc-discovery-ood-benchmark-auditor/Cargo.lock
            ${{ runner.temp }}/sc-discovery-ood-environment.txt
            ${{ runner.temp }}/sc-discovery-ood-receipt.json
            ${{ runner.temp }}/sc-feasibility-gate-receipt.json
            ${{ runner.temp }}/sc-ood-rustfmt.patch
