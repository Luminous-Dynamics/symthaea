name: Open-World Ansatz Microcosm

on:
  pull_request:
    paths:
      - "research/open-world-ansatz-microcosm/**"
      - ".github/workflows/open-world-ansatz-microcosm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-world-ansatz-microcosm-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, Clippy and Tests (standalone research crate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/open-world-ansatz-microcosm/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path research/open-world-ansatz-microcosm/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path research/open-world-ansatz-microcosm/Cargo.toml

      - name: Run paired A0/A2 through a separate child-agent process
        run: |
          set -euo pipefail
          manifest="research/open-world-ansatz-microcosm/Cargo.toml"
          target_dir="$(cargo metadata --format-version 1 --no-deps --manifest-path "$manifest" | jq -r '.target_directory')"
          cargo build --manifest-path "$manifest" --bin open_world_agent --bin process_episode_smoke
          report="$RUNNER_TEMP/open-world-process-pair-smoke.json"
          "$target_dir/debug/process_episode_smoke" \
            --agent "$target_dir/debug/open_world_agent" \
            --strategy maximum_structure_information_gain > "$report"
          jq -e '
            .report_version == "symthaea-blind-process-pair-smoke-v0" and
            .campaign_kind == "paired_process_baseline_smoke" and
            .same_agent_artifact == true and
            .comparison_design == "adaptive_budget" and
            .a0.agent.executable_sha256 == .a2.agent.executable_sha256 and
            .a0.agent.executable_sha256 == .out_of_catalogue.agent.executable_sha256 and
            .a0.agent.executable_sha256 == .equivalent_out_of_catalogue.agent.executable_sha256 and
            .a0.agent.arguments == .a2.agent.arguments and
            .a0.agent.arguments == .out_of_catalogue.agent.arguments and
            .a0.agent.arguments == .equivalent_out_of_catalogue.agent.arguments and
            .a0.agent.environment_inherited == false and
            .a2.agent.environment_inherited == false and
            .a0.agent.max_input_frame_bytes <= 16777216 and
            .a0.agent.max_output_frame_bytes <= 16777216 and
            .a2.agent.max_input_frame_bytes <= 16777216 and
            .a2.agent.max_output_frame_bytes <= 16777216 and
            .a0.process_exit_code == 0 and
            .a2.process_exit_code == 0 and
            .a0.evaluator_score.generating_model_in_version_space and
            .a2.evaluator_score.generating_model_in_version_space and
            .a0.evaluator_score.set_score.exact_version_space_match and
            .a2.evaluator_score.set_score.exact_version_space_match and
            .a0.evaluator_score.evidence_references_valid and
            .a2.evaluator_score.evidence_references_valid and
            .a0.evaluator_score.probe_count <= 6 and
            .a2.evaluator_score.probe_count <= 6 and
            .out_of_catalogue.evaluator_score.generating_model_in_version_space == false and
            .out_of_catalogue.evaluator_score.generating_truth_behaviorally_represented == false and
            .out_of_catalogue.evaluator_score.set_score.oracle_model_count == 0 and
            .out_of_catalogue.evaluator_score.set_score.claimed_model_count == 0 and
            .out_of_catalogue.evaluator_score.set_score.exact_version_space_match == true and
            .out_of_catalogue.evaluator_score.decision_correct == true and
            .out_of_catalogue.evaluator_score.evidence_references_valid == true and
            .out_of_catalogue.evaluator_score.probe_count <= 6 and
            .out_of_catalogue.agent.environment_inherited == false and
            .out_of_catalogue.process_exit_code == 0 and
            .equivalent_out_of_catalogue.evaluator_score.generating_model_in_version_space == false and
            .equivalent_out_of_catalogue.evaluator_score.generating_truth_behaviorally_represented == true and
            .equivalent_out_of_catalogue.evaluator_score.set_score.oracle_model_count == 1 and
            .equivalent_out_of_catalogue.evaluator_score.set_score.claimed_model_count == 1 and
            .equivalent_out_of_catalogue.evaluator_score.set_score.exact_version_space_match == true and
            .equivalent_out_of_catalogue.evaluator_score.decision_correct == true and
            .equivalent_out_of_catalogue.evaluator_score.evidence_references_valid == true and
            .equivalent_out_of_catalogue.evaluator_score.probe_count <= 6 and
            .equivalent_out_of_catalogue.agent.environment_inherited == false and
            .equivalent_out_of_catalogue.agent.max_input_frame_bytes <= 16777216 and
            .equivalent_out_of_catalogue.agent.max_output_frame_bytes <= 16777216 and
            .equivalent_out_of_catalogue.process_exit_code == 0 and
            (.equivalent_out_of_catalogue.action_records | length) == (.equivalent_out_of_catalogue.observation_count + 1) and
            .equivalent_out_of_catalogue.action_records[-1].resulting_status == "submitted" and
            (.equivalent_out_of_catalogue.action_records[-1].action.action == "submit") and
            (.out_of_catalogue.action_records | length) == (.out_of_catalogue.observation_count + 1) and
            .out_of_catalogue.action_records[-1].resulting_status == "submitted" and
            (.out_of_catalogue.action_records[-1].action.action == "submit") and
            (.a0.action_records | length) == (.a0.observation_count + 1) and
            (.a2.action_records | length) == (.a2.observation_count + 1) and
            .a0.initial_evidence_prefix == .a0.action_records[0].evidence_prefix_before and
            .a2.initial_evidence_prefix == .a2.action_records[0].evidence_prefix_before and
            .a0.final_evidence_prefix == .a0.action_records[-1].evidence_prefix_after and
            .a2.final_evidence_prefix == .a2.action_records[-1].evidence_prefix_after and
            .out_of_catalogue.initial_evidence_prefix == .out_of_catalogue.action_records[0].evidence_prefix_before and
            .out_of_catalogue.final_evidence_prefix == .out_of_catalogue.action_records[-1].evidence_prefix_after and
            .equivalent_out_of_catalogue.initial_evidence_prefix == .equivalent_out_of_catalogue.action_records[0].evidence_prefix_before and
            .equivalent_out_of_catalogue.final_evidence_prefix == .equivalent_out_of_catalogue.action_records[-1].evidence_prefix_after and
            .a0.action_records[-1].resulting_status == "submitted" and
            .a2.action_records[-1].resulting_status == "submitted" and
            all(.a0.action_records[]; (.evidence_prefix_before | test("^sha256:[0-9a-f]{64}$")) and (.evidence_prefix_after | test("^sha256:[0-9a-f]{64}$")) and (.agent_view_frame_sha256 | test("^sha256:[0-9a-f]{64}$")) and (.agent_action_frame_sha256 | test("^sha256:[0-9a-f]{64}$"))) and
            all(.a2.action_records[]; (.evidence_prefix_before | test("^sha256:[0-9a-f]{64}$")) and (.evidence_prefix_after | test("^sha256:[0-9a-f]{64}$")) and (.agent_view_frame_sha256 | test("^sha256:[0-9a-f]{64}$")) and (.agent_action_frame_sha256 | test("^sha256:[0-9a-f]{64}$"))) and
            all(.out_of_catalogue.action_records[]; (.evidence_prefix_before | test("^sha256:[0-9a-f]{64}$")) and (.evidence_prefix_after | test("^sha256:[0-9a-f]{64}$")) and (.agent_view_frame_sha256 | test("^sha256:[0-9a-f]{64}$")) and (.agent_action_frame_sha256 | test("^sha256:[0-9a-f]{64}$"))) and
            all(.equivalent_out_of_catalogue.action_records[]; (.evidence_prefix_before | test("^sha256:[0-9a-f]{64}$")) and (.evidence_prefix_after | test("^sha256:[0-9a-f]{64}$")) and (.agent_view_frame_sha256 | test("^sha256:[0-9a-f]{64}$")) and (.agent_action_frame_sha256 | test("^sha256:[0-9a-f]{64}$")))
          ' "$report"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$RUNNER_TEMP/open-world-process-pair-smoke.source-sha"
          sha256sum "$report" | tee "$report.sha256"

      - name: Run exhaustive finite A0/A2 policy census
        run: |
          report="$RUNNER_TEMP/open-world-finite-policy-census.json"
          cargo run --quiet --manifest-path research/open-world-ansatz-microcosm/Cargo.toml --bin finite_policy_campaign -- --budget 4 > "$report"
          jq -e '
            .campaign_kind == "exhaustive_generating_model_census" and
            .candidate_truth_count == 393 and
            .policy_count == 7 and
            .pair_count == 2751 and
            .episode_count == 5502 and
            .report_version == "symthaea-open-world-finite-policy-campaign-v1" and
            (.results | length) == 21 and
            (.pair_records | length) == 2751 and
            (.paired_contrasts | length) == 21 and
            ([.pair_records[].pair_id] | unique | length) == 2751 and
            all(.paired_contrasts[];
              .pair_count > 0 and
              (.exact_model_set_match.a0_only + .exact_model_set_match.a2_only + .exact_model_set_match.both_true + .exact_model_set_match.neither) == .pair_count and
              (.exact_structure_set_match.a0_only + .exact_structure_set_match.a2_only + .exact_structure_set_match.both_true + .exact_structure_set_match.neither) == .pair_count and
              (.generating_truth_retained.a0_only + .generating_truth_retained.a2_only + .generating_truth_retained.both_true + .generating_truth_retained.neither) == .pair_count and
              (.generating_truth_behaviorally_represented.a0_only + .generating_truth_behaviorally_represented.a2_only + .generating_truth_behaviorally_represented.both_true + .generating_truth_behaviorally_represented.neither) == .pair_count and
              (.decision_correct.a0_only + .decision_correct.a2_only + .decision_correct.both_true + .decision_correct.neither) == .pair_count and
              (.evidence_references_valid.a0_only + .evidence_references_valid.a2_only + .evidence_references_valid.both_true + .evidence_references_valid.neither) == .pair_count and
              (.false_unique_structure_claim.a0_only + .false_unique_structure_claim.a2_only + .false_unique_structure_claim.both_true + .false_unique_structure_claim.neither) == .pair_count and
              (.false_unique_model_claim.a0_only + .false_unique_model_claim.a2_only + .false_unique_model_claim.both_true + .false_unique_model_claim.neither) == .pair_count and
              (.correct_identified_structure.a0_only + .correct_identified_structure.a2_only + .correct_identified_structure.both_true + .correct_identified_structure.neither) == .pair_count and
              (.missed_identifiable_structure.a0_only + .missed_identifiable_structure.a2_only + .missed_identifiable_structure.both_true + .missed_identifiable_structure.neither) == .pair_count and
              (.safe_abstention.a0_only + .safe_abstention.a2_only + .safe_abstention.both_true + .safe_abstention.neither) == .pair_count and
              (.unnecessary_abstention.a0_only + .unnecessary_abstention.a2_only + .unnecessary_abstention.both_true + .unnecessary_abstention.neither) == .pair_count and
              .a2_minus_a0_probe_actions == (.a2_probe_actions - .a0_probe_actions)
            ) and
            all(.pair_records[];
              .a0.generating_model_in_version_space and
              .a2.generating_model_in_version_space and
              .a0.set_score.exact_version_space_match and
              .a2.set_score.exact_version_space_match and
              .a0.evidence_references_valid and
              .a2.evidence_references_valid
            ) and
            all(.results[];
              .a0.episodes == .generating_model_count and
              .a2.episodes == .generating_model_count and
              .a0.exact_version_space_matches == .a0.episodes and
              .a2.exact_version_space_matches == .a2.episodes and
              .a0.generating_model_retained == .a0.episodes and
              .a2.generating_model_retained == .a2.episodes and
              .a0.evidence_references_valid == .a0.episodes and
              .a2.evidence_references_valid == .a2.episodes and
              .a0.false_unique_structure_claims == 0 and
              .a2.false_unique_structure_claims == 0 and
              .a0.correct_identified_structure_cases == .a0.oracle_identified_structure_cases and
              .a2.correct_identified_structure_cases == .a2.oracle_identified_structure_cases and
              .a0.missed_identifiable_structure_cases == 0 and
              .a2.missed_identifiable_structure_cases == 0
            )
          ' "$report"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$RUNNER_TEMP/open-world-finite-policy-census.source-sha"
          sha256sum "$report" | tee "$report.sha256"
          cat "$report"

      - name: Upload finite campaign and child-process receipts
        uses: actions/upload-artifact@v4
        with:
          name: open-world-finite-campaign-receipts-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/open-world-finite-policy-census.json
            ${{ runner.temp }}/open-world-finite-policy-census.json.sha256
            ${{ runner.temp }}/open-world-finite-policy-census.source-sha
            ${{ runner.temp }}/open-world-process-pair-smoke.json
            ${{ runner.temp }}/open-world-process-pair-smoke.json.sha256
            ${{ runner.temp }}/open-world-process-pair-smoke.source-sha
          if-no-files-found: error
          retention-days: 90
