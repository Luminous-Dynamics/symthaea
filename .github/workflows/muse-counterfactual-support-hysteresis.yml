name: Muse Counterfactual Support Hysteresis Qualification

on:
  push:
    branches:
      - "research/mel-mr-eval-035-*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "crates/domains/symthaea-muse/src/counterfactual_influence.rs"
      - "crates/domains/symthaea-muse/src/counterfactual_support_adapter.rs"
      - ".github/workflows/muse-counterfactual-support-hysteresis.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "crates/domains/symthaea-muse/src/counterfactual_influence.rs"
      - "crates/domains/symthaea-muse/src/counterfactual_support_adapter.rs"
      - ".github/workflows/muse-counterfactual-support-hysteresis.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-counterfactual-support-hysteresis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: exact-head-counterfactual-support-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'exact_head=%s\n' "$actual"

      - name: Verify Cargo workspace metadata resolves
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/muse-workspace-metadata.json

      - name: Check changed Rust source formatting
        run: |
          rustfmt --check --edition 2024 crates/domains/symthaea-muse/src/counterfactual_influence.rs
          rustfmt --check --edition 2024 crates/domains/symthaea-muse/src/counterfactual_support_adapter.rs

      - name: Run EVAL-017 counterfactual influence and hysteresis tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib counterfactual_influence::tests

      - name: Run EVAL-025 support adapter tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib counterfactual_support_adapter::tests

      - name: Run Clippy for Muse library and tests
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib --tests -- -D warnings
