name: Water Leak Satellite Offline Tests

on:
  push:
    branches:
      - "research/water-leak-001-johannesburg-transfer"
    paths:
      - "tools/water_leak_satellite/**"
      - "tests/test_water_leak_satellite_*.py"
      - "docs/research/water_leak_ground_truth.schema.json"
      - "docs/research/WATER_LEAK_001_JOHANNESBURG_TRANSFER.md"
      - "docs/research/WATER_LEAK_001_DATA_ACQUISITION_PLAYBOOK.md"
      - ".github/workflows/water-leak-catalog-tests.yml"
      - ".github/workflows/water-leak-satellite-inventory.trigger"
  pull_request:
    paths:
      - "tools/water_leak_satellite/**"
      - "tests/test_water_leak_satellite_*.py"
      - "docs/research/water_leak_ground_truth.schema.json"
      - "docs/research/WATER_LEAK_001_JOHANNESBURG_TRANSFER.md"
      - "docs/research/WATER_LEAK_001_DATA_ACQUISITION_PLAYBOOK.md"
      - ".github/workflows/water-leak-catalog-tests.yml"
      - ".github/workflows/water-leak-satellite-inventory.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-leak-catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline catalog inventory tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify Python runtime
        run: python3 --version

      - name: Compile inventory utility and tests
        run: python3 -m py_compile tools/water_leak_satellite/strict_json.py tools/water_leak_satellite/catalog_inventory.py tools/water_leak_satellite/verify_inventory.py tools/water_leak_satellite/odata_inventory.py tools/water_leak_satellite/ground_truth.py tests/test_water_leak_satellite_*.py

      - name: Run deterministic offline tests
        run: python3 -m unittest discover -s tests -p 'test_water_leak_satellite_*.py' -v

