name: REL-005A Qualification Evidence Durability V1

on:
  workflow_call:
    inputs:
      source_run_id:
        description: Exact REL-005A Qualification Pipeline V3 run containing a successful QualificationOnly job
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rel-005a-qualification-durability-${{ inputs.source_run_id }}
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 3187974e21f4f5b9f09fd2dfe3ac286b96b552bf
  SOURCE_WORKFLOW_NAME: REL-005A Qualification Pipeline V3
  SOURCE_PIPELINE_HEAD: 460b4c8a8f457f4bbf22820716ed6057d260d4fd
  SOURCE_QUALIFICATION_JOB: Qualify from sanitized authority receipts only
  SANITIZED_ARTIFACT_NAME: rel-005a-sanitized-qualification-460b4c8a8f457f4bbf22820716ed6057d260d4fd
  QUALIFICATION_ARTIFACT_NAME: rel-005a-qualification-evidence-460b4c8a8f457f4bbf22820716ed6057d260d4fd
  DURABLE_ARTIFACT_NAME: rel-005a-qualification-evidence-durable-460b4c8a8f457f4bbf22820716ed6057d260d4fd-source-${{ inputs.source_run_id }}
  DURABILITY_CONTRACT_BLOB: 5701594565da8531c71de8869043351d5cc81022
  PERSISTENCE_TOOL_BLOB: 054a67c37f30aaf207c5039846276f3963095c35
  VERIFICATION_TOOL_BLOB: 6b3b7216204bf1066f343740c00faaa8b2addbbb
  FIREWALL_CONTRACT_BLOB: 3ad7ce19c80d51dea3711edde345649061d8cbb1
  FIREWALL_EVALUATOR_BLOB: 14c8473d1744f77acca19cff14d643ef6f3e7b67

jobs:
  persist:
    name: Persist validated QualificationOnly evidence before packaging
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      durable_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      durable_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      payload_set_commitment_sha256: ${{ steps.persist.outputs.payload_set_commitment_sha256 }}
      qualification_output_sha256: ${{ steps.validate.outputs.qualification_output_sha256 }}
    steps:
      - name: Checkout exact durability workflow subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0

      - name: Bind exact durability subject and frozen tools
        shell: bash
        env:
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CALLED_WORKFLOW_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-durability-contract.json)" = "${DURABILITY_CONTRACT_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-evidence-persist.py)" = "${PERSISTENCE_TOOL_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-evidence-verify.py)" = "${VERIFICATION_TOOL_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-input-firewall-contract.json)" = "${FIREWALL_CONTRACT_BLOB}"
          test "$(git rev-parse HEAD:.github/rel/rel-005a-qualification-input-firewall.py)" = "${FIREWALL_EVALUATOR_BLOB}"
          mapfile -t changed < <(git diff --name-only "${EXPECTED_PARENT}" HEAD | sort)
          expected=(".github/workflows/rel-005a-qualification-evidence-durability.yml")
          test "${changed[*]}" = "${expected[*]}"

      - name: Resolve exact source run, QualificationOnly job, and source artifacts
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${auth[@]}" "${api}/actions/runs/${SOURCE_RUN_ID}" > "${RUNNER_TEMP}/source-run.json"
          curl -fsSL "${auth[@]}" "${api}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > "${RUNNER_TEMP}/source-jobs.json"
          curl -fsSL "${auth[@]}" "${api}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "${RUNNER_TEMP}/source-artifacts.json"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'source-run.json').read_text())
          assert str(run['id'])==os.environ['SOURCE_RUN_ID']
          assert run['name']==os.environ['SOURCE_WORKFLOW_NAME']
          assert run['head_sha']==os.environ['SOURCE_PIPELINE_HEAD']
          jobs=json.loads((root/'source-jobs.json').read_text())['jobs']
          qjobs=[j for j in jobs if j['name']==os.environ['SOURCE_QUALIFICATION_JOB']]
          assert len(qjobs)==1 and qjobs[0]['status']=='completed' and qjobs[0]['conclusion']=='success'
          arts=json.loads((root/'source-artifacts.json').read_text())
          assert arts['total_count'] <= 100
          def one(name):
              found=[a for a in arts['artifacts'] if a['name']==name and a['expired'] is False]
              assert len(found)==1,(name,len(found))
              a=found[0]
              assert str(a['workflow_run']['id'])==os.environ['SOURCE_RUN_ID']
              assert a['workflow_run']['head_sha']==os.environ['SOURCE_PIPELINE_HEAD']
              assert isinstance(a['digest'],str) and a['digest'].startswith('sha256:') and len(a['digest'])==71
              return a
          s=one(os.environ['SANITIZED_ARTIFACT_NAME']); q=one(os.environ['QUALIFICATION_ARTIFACT_NAME'])
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as f:
              f.write(f"qualification_job_id={qjobs[0]['id']}\n")
              f.write(f"sanitized_artifact_id={s['id']}\n")
              f.write(f"sanitized_artifact_digest={s['digest']}\n")
              f.write(f"qualification_artifact_id={q['id']}\n")
              f.write(f"qualification_artifact_digest={q['digest']}\n")
          PY

      - name: Download and verify source transport ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SANITIZED_ARTIFACT_ID: ${{ steps.source.outputs.sanitized_artifact_id }}
          SANITIZED_ARTIFACT_DIGEST: ${{ steps.source.outputs.sanitized_artifact_digest }}
          QUALIFICATION_ARTIFACT_ID: ${{ steps.source.outputs.qualification_artifact_id }}
          QUALIFICATION_ARTIFACT_DIGEST: ${{ steps.source.outputs.qualification_artifact_digest }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL -L "${auth[@]}" "${api}/actions/artifacts/${SANITIZED_ARTIFACT_ID}/zip" -o "${RUNNER_TEMP}/sanitized.zip"
          curl -fsSL -L "${auth[@]}" "${api}/actions/artifacts/${QUALIFICATION_ARTIFACT_ID}/zip" -o "${RUNNER_TEMP}/qualification.zip"
          test "$(sha256sum "${RUNNER_TEMP}/sanitized.zip" | cut -d' ' -f1)" = "${SANITIZED_ARTIFACT_DIGEST#sha256:}"
          test "$(sha256sum "${RUNNER_TEMP}/qualification.zip" | cut -d' ' -f1)" = "${QUALIFICATION_ARTIFACT_DIGEST#sha256:}"
          mkdir -p "${RUNNER_TEMP}/sanitized-source" "${RUNNER_TEMP}/qualification-source"
          unzip -q "${RUNNER_TEMP}/sanitized.zip" -d "${RUNNER_TEMP}/sanitized-source"
          unzip -q "${RUNNER_TEMP}/qualification.zip" -d "${RUNNER_TEMP}/qualification-source"

      - name: Revalidate exact QualificationOnly artifact and derive post-firewall receipt
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          s=root/'sanitized-source'; q=root/'qualification-source'
          six={
            'predicate-contract-receipt.json','execution-v3-receipt.json','observation-seal-v3.json',
            'comparison-only-qualification-receipt.json','qualification-input-manifest.json','qualification-assembly-receipt.json'
          }
          def relfiles(base): return {p.relative_to(base).as_posix():p for p in base.rglob('*') if p.is_file()}
          sf=relfiles(s); qf=relfiles(q)
          assert set(sf)==six, sorted(sf)
          assert set(qf)==six|{'qualification-only.json'}, sorted(qf)
          assert all(len(pathlib.PurePosixPath(n).parts)==1 for n in sf|qf)
          for n in sorted(six):
              assert sf[n].read_bytes()==qf[n].read_bytes(), f'sanitized byte mismatch: {n}'
          h=hashlib.sha256(qf['qualification-only.json'].read_bytes()).hexdigest()
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as f: f.write(f'qualification_output_sha256={h}\n')
          PY
          python3 .github/rel/rel-005a-qualification-input-firewall.py \
            --contract .github/rel/rel-005a-qualification-input-firewall-contract.json \
            --bundle "${RUNNER_TEMP}/sanitized-source" >/dev/null
          python3 .github/rel/rel-005a-qualification-input-firewall.py \
            --contract .github/rel/rel-005a-qualification-input-firewall-contract.json \
            --bundle "${RUNNER_TEMP}/sanitized-source" \
            --qualification-output "${RUNNER_TEMP}/qualification-source/qualification-only.json" \
            > "${RUNNER_TEMP}/post-qualification-firewall-receipt.json"

      - name: Build content-addressed durable evidence set
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/durable"
          cp "${RUNNER_TEMP}/sanitized-source/"*.json "${RUNNER_TEMP}/durable/"
          cp "${RUNNER_TEMP}/qualification-source/qualification-only.json" "${RUNNER_TEMP}/durable/qualification-only.json"
          cp "${RUNNER_TEMP}/post-qualification-firewall-receipt.json" "${RUNNER_TEMP}/durable/post-qualification-firewall-receipt.json"
          python3 .github/rel/rel-005a-qualification-evidence-persist.py \
            --contract .github/rel/rel-005a-qualification-durability-contract.json \
            --input-dir "${RUNNER_TEMP}/durable" \
            --output "${RUNNER_TEMP}/durable/qualification-evidence-persistence-receipt.json" \
            | tee "${RUNNER_TEMP}/persistence-build.json"
          test "$(find "${RUNNER_TEMP}/durable" -maxdepth 1 -type f | wc -l)" -eq 9
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'durable/qualification-evidence-persistence-receipt.json'
          r=json.loads(p.read_text())
          assert r['authority']=='QualificationEvidencePersistenceOnly'
          assert r['payload_file_count']==8
          assert r['scientific_payload_parsed'] is False and r['scientific_result_interpreted'] is False
          assert not any(r['claims'].values())
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as f:
              f.write(f"payload_set_commitment_sha256={r['payload_set_commitment_sha256']}\n")
          PY

      - name: Upload durable qualification evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.DURABLE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/durable/*
          retention-days: 90
          if-no-files-found: error

      - name: Build durability orchestration receipt
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_QUALIFICATION_JOB_ID: ${{ steps.source.outputs.qualification_job_id }}
          SANITIZED_ARTIFACT_ID: ${{ steps.source.outputs.sanitized_artifact_id }}
          SANITIZED_ARTIFACT_DIGEST: ${{ steps.source.outputs.sanitized_artifact_digest }}
          QUALIFICATION_ARTIFACT_ID: ${{ steps.source.outputs.qualification_artifact_id }}
          QUALIFICATION_ARTIFACT_DIGEST: ${{ steps.source.outputs.qualification_artifact_digest }}
          DURABLE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DURABLE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PAYLOAD_COMMITMENT: ${{ steps.persist.outputs.payload_set_commitment_sha256 }}
          QUALIFICATION_SHA256: ${{ steps.validate.outputs.qualification_output_sha256 }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          r={
            'schema':'symthaea.rel.qualification-evidence-durability-orchestration-receipt.v1',
            'authority':'QualificationEvidenceDurabilityInfrastructureOnly',
            'durability_workflow_sha':os.environ['CALLED_WORKFLOW_SHA'],
            'source_pipeline_head':os.environ['SOURCE_PIPELINE_HEAD'],
            'source_run_id':int(os.environ['SOURCE_RUN_ID']),
            'source_qualification_job_id':int(os.environ['SOURCE_QUALIFICATION_JOB_ID']),
            'source_sanitized_artifact':{'id':int(os.environ['SANITIZED_ARTIFACT_ID']),'digest':os.environ['SANITIZED_ARTIFACT_DIGEST']},
            'source_qualification_artifact':{'id':int(os.environ['QUALIFICATION_ARTIFACT_ID']),'digest':os.environ['QUALIFICATION_ARTIFACT_DIGEST']},
            'qualification_output_sha256':os.environ['QUALIFICATION_SHA256'],
            'durable_artifact':{'id':int(os.environ['DURABLE_ARTIFACT_ID']),'digest':os.environ['DURABLE_ARTIFACT_DIGEST']},
            'payload_set_commitment_sha256':os.environ['PAYLOAD_COMMITMENT'],
            'transport_identity_scientific_authority':False,
            'may_change_qualification_result':False,
            'claims':{'qualification_completed':False,'rel_005a_qualified':False,'scientific_pass':False,'scientific_fail':False},
          }
          pathlib.Path(os.environ['RUNNER_TEMP'],'durability-orchestration-receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload durability orchestration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-qualification-durability-orchestration-${{ job.workflow_sha }}-source-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/durability-orchestration-receipt.json
          retention-days: 90
          if-no-files-found: error

  verify:
    name: Independently verify durable qualification evidence
    needs: persist
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout exact durability workflow subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.DURABLE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/durable
      - name: Recompute durable evidence commitments without parsing scientific payloads
        shell: bash
        env:
          EXPECTED_COMMITMENT: ${{ needs.persist.outputs.payload_set_commitment_sha256 }}
        run: |
          set -euo pipefail
          python3 .github/rel/rel-005a-qualification-evidence-verify.py \
            --contract .github/rel/rel-005a-qualification-durability-contract.json \
            --durable-dir "${RUNNER_TEMP}/durable" \
            | tee "${RUNNER_TEMP}/durability-verification-receipt.json"
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'durability-verification-receipt.json'; r=json.loads(p.read_text())
          assert r['authority']=='QualificationEvidencePersistenceVerificationOnly'
          assert r['payload_set_commitment_sha256']==os.environ['EXPECTED_COMMITMENT']
          assert r['exact_file_census_verified'] is True and r['byte_lengths_verified'] is True and r['sha256_commitments_verified'] is True
          assert r['scientific_payload_parsed'] is False and r['scientific_result_interpreted'] is False
          assert not any(r['claims'].values())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-qualification-durability-verification-${{ job.workflow_sha }}-source-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/durability-verification-receipt.json
          retention-days: 90
          if-no-files-found: error
