name: Evidence Action Benchmark Contract

on:
  push:
    branches:
      - feat/knowledge-evidence-benchmark-verifier-2026-10-16
    paths:
      - "src/knowledge/evidence_action_policy.rs"
      - "src/knowledge/evidence_benchmark.rs"
      - "src/knowledge/mod.rs"
      - "src/bin/evidence_action_benchmark.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/research/data/evidence_action_benchmark.synthetic.jsonl"
      - "docs/research/schemas/**"
      - ".github/workflows/evidence-action-benchmark.yml"
  pull_request:
    paths:
      - "src/knowledge/evidence_action_policy.rs"
      - "src/knowledge/evidence_benchmark.rs"
      - "src/knowledge/mod.rs"
      - "src/bin/evidence_action_benchmark.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/research/data/evidence_action_benchmark.synthetic.jsonl"
      - "docs/research/schemas/**"
      - ".github/workflows/evidence-action-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: evidence-action-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-contract:
    name: Evidence Dataset, Receipt, and Safety Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Format changed Rust modules
        run: >-
          rustfmt --check --edition 2024 --config skip_children=true
          src/knowledge/mod.rs
          src/knowledge/evidence_action_policy.rs
          src/knowledge/evidence_benchmark.rs
          src/bin/evidence_action_benchmark.rs
      - name: Test evidence benchmark contract
        run: cargo test --locked --features evidence-benchmark --lib knowledge::evidence_benchmark::tests
      - name: Test benchmark CLI
        run: cargo test --locked --features evidence-benchmark --bin evidence_action_benchmark
      - name: Audit synthetic case fixture
        run: cargo run --locked --quiet --features evidence-benchmark --bin evidence_action_benchmark -- audit docs/research/data/evidence_action_benchmark.synthetic.jsonl
      - name: Evaluate and score synthetic control suite
        shell: bash
        run: |
          set -euo pipefail
          fixture="docs/research/data/evidence_action_benchmark.synthetic.jsonl"
          receipts="$(mktemp)"
          unsafe_receipts="$(mktemp)"
          trap 'rm -f "$receipts" "$unsafe_receipts"' EXIT
          cargo run --locked --quiet --features evidence-benchmark --bin evidence_action_benchmark -- evaluate "$fixture" "$receipts" ci-baseline-v1 1 false
          cargo run --locked --quiet --features evidence-benchmark --bin evidence_action_benchmark -- score "$fixture" "$receipts" ci-baseline-v1
          python3 - "$receipts" "$unsafe_receipts" <<'PY'
          import json, sys
          src, dst = sys.argv[1:3]
          rows = [json.loads(line) for line in open(src, encoding="utf-8") if line.strip()]
          target = next(row for row in rows if row["case_id"] == "syn-conflict-001")
          target["selected_action"] = "answer"
          target["reason"] = "complete_support"
          with open(dst, "w", encoding="utf-8") as stream:
              for row in rows:
                  stream.write(json.dumps(row, separators=(",", ":")) + "\n")
          PY
          set +e
          cargo run --locked --quiet --features evidence-benchmark --bin evidence_action_benchmark -- score "$fixture" "$unsafe_receipts" ci-baseline-v1
          status=$?
          set -e
          if [[ "$status" -ne 3 ]]; then
            echo "Expected an unsafe benchmark receipt to exit 3; got $status" >&2
            exit 1
          fi
