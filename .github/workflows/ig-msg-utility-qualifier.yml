name: IG-MSG-UTILITY-001 Qualifier

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ig-msg-utility-001/**"
      - ".github/workflows/ig-msg-utility-qualifier.yml"
  push:
    branches: [main]
    paths:
      - "research/ig-msg-utility-001/**"
      - ".github/workflows/ig-msg-utility-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ig-msg-utility-qualifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --manifest-path research/ig-msg-utility-001/Cargo.toml --check
      - name: Unit and negative-control tests
        run: cargo test --manifest-path research/ig-msg-utility-001/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path research/ig-msg-utility-001/Cargo.toml --all-targets -- -D warnings
      - name: Qualify message utility fixtures
        run: |
          cargo run --manifest-path research/ig-msg-utility-001/Cargo.toml -- \
            research/ig-msg-utility-001/MESSAGE_UTILITY_FIXTURES_V0_1.json
