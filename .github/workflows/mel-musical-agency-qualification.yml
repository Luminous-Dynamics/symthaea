name: MEL musical agency qualification

on:
  pull_request:
    branches:
      - research/mel-predictive-transparency-audit-v1-20261123
    paths:
      - "tools/mel-judge-grounding-audit/**"
      - "docs/research/MEL_MUSICAL_AGENCY_AUDITOR_V1_2026-11-23.md"
      - ".github/workflows/mel-musical-agency-qualification.yml"
  push:
    branches:
      - research/mel-musical-agency-audit-v1-20261123
    paths:
      - "tools/mel-judge-grounding-audit/**"
      - "docs/research/MEL_MUSICAL_AGENCY_AUDITOR_V1_2026-11-23.md"
      - ".github/workflows/mel-musical-agency-qualification.yml"

permissions:
  contents: read

jobs:
  musical-agency:
    name: Scoped authority and non-assimilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.96.0 fmt --check --manifest-path tools/mel-judge-grounding-audit/Cargo.toml
      - name: Verify committed dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch tools/mel-judge-grounding-audit/Cargo.lock > /dev/null
          test -f tools/mel-judge-grounding-audit/Cargo.lock
      - name: Run deterministic Rust tests
        run: cargo +1.96.0 test --locked --manifest-path tools/mel-judge-grounding-audit/Cargo.toml
      - name: Warnings-denied Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path tools/mel-judge-grounding-audit/Cargo.toml --all-targets -- -D warnings
      - name: Parse schema and replay synthetic agency panel
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool tools/mel-judge-grounding-audit/schema/mel-musical-agency-panel-v1.schema.json > /dev/null
          cargo +1.96.0 run --locked --quiet --manifest-path tools/mel-judge-grounding-audit/Cargo.toml --bin mel-musical-agency-audit -- audit tools/mel-judge-grounding-audit/fixtures/valid-musical-agency-v1.json "$RUNNER_TEMP/mel-musical-agency-report.json"
          jq -e '.decision_action == "branch" and .proposal_count == 3 and .selected_proposal_ids == ["agent-proposal","collaborator-proposal"] and .hard_constraint_compliance == 1 and .cross_collaborator_preference_count == 0 and .unauthorized_persistent_update_count == 0 and .structurally_valid_agency_trace == true' "$RUNNER_TEMP/mel-musical-agency-report.json" > /dev/null
      - name: Assemble exact-head reproducibility evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/mel-musical-agency-evidence"
          mkdir -p "$evidence"
          printf 'tested_head=%s\n' "$(git rev-parse HEAD)" > "$evidence/source-revision.txt"
          git rev-parse HEAD:tools/mel-judge-grounding-audit/src/agency.rs > "$evidence/agency-lib-blob.txt"
          git rev-parse HEAD:tools/mel-judge-grounding-audit/src/bin/mel-musical-agency-audit.rs > "$evidence/agency-cli-blob.txt"
          rustc +1.96.0 --version > "$evidence/rustc-version.txt" 2>&1 || true
          cargo +1.96.0 --version > "$evidence/cargo-version.txt" 2>&1 || true
          cp tools/mel-judge-grounding-audit/Cargo.toml "$evidence/"
          cp tools/mel-judge-grounding-audit/Cargo.lock "$evidence/"
          cp tools/mel-judge-grounding-audit/src/agency.rs "$evidence/"
          cp tools/mel-judge-grounding-audit/src/bin/mel-musical-agency-audit.rs "$evidence/"
          cp tools/mel-judge-grounding-audit/schema/mel-musical-agency-panel-v1.schema.json "$evidence/"
          cp tools/mel-judge-grounding-audit/fixtures/valid-musical-agency-v1.json "$evidence/"
          cp docs/research/MEL_MUSICAL_AGENCY_AUDITOR_V1_2026-11-23.md "$evidence/"
          if [[ -f "$RUNNER_TEMP/mel-musical-agency-report.json" ]]; then
            cp "$RUNNER_TEMP/mel-musical-agency-report.json" "$evidence/"
          fi
          (cd "$evidence" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mel-musical-agency-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-musical-agency-evidence/
          if-no-files-found: error
          retention-days: 90
