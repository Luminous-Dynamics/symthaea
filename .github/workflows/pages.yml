name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      # Was 'docs/architecture/d2/rendered/**', which has never existed in this
      # repo's history (0 commits, 0 tracked files) -- so this workflow could
      # never be triggered by a diagram change. The step that consumes it copies
      # rendered/*.svg with `|| true`, so the absence was silent. Point at the
      # .d2 SOURCES instead, which do exist and are what an author actually edits.
      - 'docs/architecture/d2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar xz -C $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build mdBook
        run: mdbook build book

      - name: Add architecture diagrams
        run: |
          mkdir -p book/build/diagrams
          cp docs/architecture/d2/rendered/*.svg book/build/diagrams/ 2>/dev/null || true

      - name: Add CNAME for custom domain
        run: echo "docs.symthaea.luminousdynamics.io" > book/build/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/build
      - id: deployment
        uses: actions/deploy-pages@v4
