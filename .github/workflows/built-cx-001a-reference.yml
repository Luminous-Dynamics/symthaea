name: BUILT-CX-001A Reference Qualification

on:
  pull_request:
    paths:
      - "docs/engineering/BUILT_CX_001A_COMMISSIONING_EVIDENCE.md"
      - "docs/release/evidence/built-cx-001a-commissioning-reference-v1.json"
      - "scripts/validate_built_cx_001a.py"
      - ".github/workflows/built-cx-001a-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact source and scope preflight
        shell: bash
        env:
          SOURCE_HEAD: 575f86ac90e843fb0d30225f54687ee97bd8db6f
          SOURCE_DOC_BLOB: 9bb78bd68eea758ea81c2b9e1218358902aa3994
          SOURCE_CORPUS_BLOB: be4efba84154854b2db33b303c8c39a4722c5132
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          test "$(git rev-list --count "$SOURCE_HEAD"..HEAD)" = "1"

          git diff --name-only "$SOURCE_HEAD"..HEAD | sort > /tmp/actual-files
          printf '%s\n' \
            '.github/workflows/built-cx-001a-reference.yml' \
            'scripts/validate_built_cx_001a.py' \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

          test "$(git rev-parse HEAD:docs/engineering/BUILT_CX_001A_COMMISSIONING_EVIDENCE.md)" = "$SOURCE_DOC_BLOB"
          test "$(git rev-parse HEAD:docs/release/evidence/built-cx-001a-commissioning-reference-v1.json)" = "$SOURCE_CORPUS_BLOB"

      - name: Execute independent stdlib oracle
        run: python3 scripts/validate_built_cx_001a.py

      - name: Clean postflight
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
