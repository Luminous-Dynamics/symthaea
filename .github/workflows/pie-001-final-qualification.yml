name: PIE-001 Final Exact Subject Qualification

on:
  push:
    branches:
      - qualify/pie-001-final-4ee82125
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify final PIE-001 subject
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUBJECT_SHA: 4ee82125892d332e7b56b595bc264a75c5ebcb87
      PACKAGE: symthaea-planetary-industry
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout frozen subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1

      - name: Verify exact subject identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$SUBJECT_SHA" "$actual"
          test "$actual" = "$SUBJECT_SHA"

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy

      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Package rustfmt
        id: fmt
        continue-on-error: true
        run: cargo fmt -p "$PACKAGE" -- --check

      - name: Package check
        id: check
        continue-on-error: true
        run: cargo check -p "$PACKAGE" --all-targets --locked

      - name: Package tests
        id: test
        continue-on-error: true
        run: cargo test -p "$PACKAGE" --all-targets --locked --no-fail-fast

      - name: Package clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy -p "$PACKAGE" --all-targets --locked -- -D warnings

      - name: Emit machine-readable qualification receipt
        if: always()
        run: |
          cat > pie-001-final-qualification.json <<EOF
          {
            "schema": "symthaea.pie.exact-subject-qualification.v1",
            "subject_sha": "$SUBJECT_SHA",
            "package": "$PACKAGE",
            "rust_toolchain": "1.96.0",
            "gates": {
              "rustfmt": "${{ steps.fmt.outcome }}",
              "check_all_targets_locked": "${{ steps.check.outcome }}",
              "test_all_targets_locked": "${{ steps.test.outcome }}",
              "clippy_all_targets_deny_warnings_locked": "${{ steps.clippy.outcome }}"
            },
            "scope": "Package-scoped executable qualification only; does not imply repository-wide CI health or scientific validation beyond tested crate semantics."
          }
          EOF
          cat pie-001-final-qualification.json

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-001-final-exact-subject-qualification
          path: pie-001-final-qualification.json
          if-no-files-found: error

      - name: Enforce all package gates
        if: always()
        run: |
          test "${{ steps.fmt.outcome }}" = success
          test "${{ steps.check.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.clippy.outcome }}" = success
