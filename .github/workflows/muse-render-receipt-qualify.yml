name: Muse Renderer Receipt Qualification

on:
  pull_request:
    branches:
      - research/mel-mr-eval-014-performed-event-map-20261029
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/**"
      - ".github/workflows/muse-render-receipt-qualify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-render-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: exact-head-rust-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'exact_head=%s\n' "$actual"

      - name: Format check
        run: cargo fmt --manifest-path crates/domains/symthaea-muse/Cargo.toml --all -- --check

      - name: Muse library tests
        run: cargo test --package symthaea-muse --features theory --lib --locked

      - name: Muse Clippy
        run: cargo clippy --package symthaea-muse --features theory --all-targets --locked -- -D warnings
