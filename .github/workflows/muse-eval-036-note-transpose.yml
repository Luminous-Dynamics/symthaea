name: Muse EVAL-036 Note Transposition

on:
  push:
    branches:
      - "research/mel-mr-eval-036-*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "crates/domains/symthaea-muse/src/counterfactual_influence.rs"
      - ".github/workflows/muse-eval-036-note-transpose.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "crates/domains/symthaea-muse/src/counterfactual_influence.rs"
      - ".github/workflows/muse-eval-036-note-transpose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-eval-036-note-transpose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: exact-head-operation-specific-counterfactual
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'exact_head=%s\n' "$actual"

      - name: Verify workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/muse-workspace-metadata.json

      - name: Check operation verifier formatting
        run: rustfmt --edition 2024 --check crates/domains/symthaea-muse/src/counterfactual_influence.rs

      - name: Run operation-specific counterfactual tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib counterfactual_influence::tests

      - name: Run Muse library/test Clippy
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-muse/Cargo.toml --features theory --lib --tests -- -D warnings
