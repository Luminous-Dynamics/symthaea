name: CIV Governance Smoke Controls

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'crates/domains/symthaea-lab/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/civ-governance-smokes.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Cargo.toml'
      - 'crates/domains/symthaea-lab/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/civ-governance-smokes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civ-governance-smokes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  civ-smokes:
    name: Format and execute CIV-CORE-003 through CIV-CORE-013
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      # symthaea-lab is explicitly excluded from the workspace, so root-level
      # cargo fmt/test does not qualify these binaries. Format the exact smoke
      # targets, then build and run each one using the standalone manifest.
      - name: Format CIV smoke targets
        run: |
          rustfmt --edition 2021 --check \
            crates/domains/symthaea-lab/src/bin/civ_independent_evaluator_smoke.rs \
            crates/domains/symthaea-lab/src/bin/civ_contestable_revocable_lifecycle_smoke.rs \
            crates/domains/symthaea-lab/src/bin/civ_consequence_tiered_credibility_smoke.rs \
            crates/domains/symthaea-lab/src/bin/civ_plural_authority_quorum_smoke.rs \
            crates/domains/symthaea-lab/src/bin/civ_governance_audit_chain_smoke.rs \
            crates/domains/symthaea-lab/src/bin/civ_merkle_governance_checkpoint_smoke.rs \
            crates/domains/symthaea-lab/src/bin/civ_signed_tree_head_witness_smoke.rs \
            crates/domains/symthaea-lab/src/bin/civ_monotonic_checkpoint_acceptance_smoke.rs \
            crates/domains/symthaea-lab/src/bin/civ_independent_receipt_tail_anchor_smoke.rs \
            crates/domains/symthaea-lab/src/bin/civ_durable_witness_recovery_smoke.rs

      - name: Execute standalone CIV smoke binaries
        shell: bash
        run: |
          set -euo pipefail
          manifest="crates/domains/symthaea-lab/Cargo.toml"
          cargo run --manifest-path "$manifest" --bin civ_independent_evaluator_smoke
          cargo run --manifest-path "$manifest" --bin civ_contestable_revocable_lifecycle_smoke
          cargo run --manifest-path "$manifest" --bin civ_consequence_tiered_credibility_smoke
          cargo run --manifest-path "$manifest" --bin civ_plural_authority_quorum_smoke
          cargo run --manifest-path "$manifest" --bin civ_governance_audit_chain_smoke
          cargo run --manifest-path "$manifest" --bin civ_merkle_governance_checkpoint_smoke
          cargo run --manifest-path "$manifest" --bin civ_signed_tree_head_witness_smoke
          cargo run --manifest-path "$manifest" --bin civ_monotonic_checkpoint_acceptance_smoke
          cargo run --manifest-path "$manifest" --bin civ_independent_receipt_tail_anchor_smoke
          cargo run --manifest-path "$manifest" --bin civ_durable_witness_recovery_smoke
