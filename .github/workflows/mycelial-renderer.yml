name: Mycelial Renderer Contract

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-canvas/**"
      - "crates/bridges/symthaea-mycelial-renderer/**"
      - ".github/workflows/mycelial-renderer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mycelial-renderer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canvas-and-native-renderer:
    name: Canvas contract + Bevy 0.20 native adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux renderer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/bridges/symthaea-mycelial-renderer -> target

      - name: Check canvas formatting
        run: cargo fmt --manifest-path Cargo.toml --package symthaea-canvas -- --check

      - name: Test renderer-neutral canvas contract
        run: cargo test --locked --manifest-path Cargo.toml -p symthaea-canvas --all-targets

      - name: Check native adapter formatting
        run: cargo fmt --manifest-path crates/bridges/symthaea-mycelial-renderer/Cargo.toml --all -- --check

      - name: Test isolated Bevy 0.20.1 adapter
        run: cargo test --manifest-path crates/bridges/symthaea-mycelial-renderer/Cargo.toml --all-targets

      - name: Clippy isolated Bevy 0.20.1 adapter
        run: cargo clippy --manifest-path crates/bridges/symthaea-mycelial-renderer/Cargo.toml --all-targets -- -D warnings
