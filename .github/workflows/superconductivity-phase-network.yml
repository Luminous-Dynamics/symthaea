name: Superconductivity Phase Network Contract

on:
  pull_request:
    paths:
      - "tools/superconductivity-phase-network-harness/**"
      - "data/schemas/superconductivity_phase_network_instance_v0_1.schema.json"
      - "data/research/superconductivity_phase_network_fixture_v0_1.json"
      - "research/superconductivity/phase_network/**"
      - ".github/workflows/superconductivity-phase-network.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superconductivity-phase-network-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  phase-network-contract:
    name: Phase-network input contract and negative controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/superconductivity-phase-network-harness/Cargo.toml --all -- --check

      - name: Generate isolated dependency lockfile
        run: cargo generate-lockfile --manifest-path tools/superconductivity-phase-network-harness/Cargo.toml

      - name: Test phase-network contract and negative controls
        run: cargo test --locked --manifest-path tools/superconductivity-phase-network-harness/Cargo.toml --bin sc_phase_network_audit

      - name: Run synthetic phase-network instance audit
        run: |
          cargo run --locked --manifest-path tools/superconductivity-phase-network-harness/Cargo.toml --bin sc_phase_network_audit -- \
            --schema data/schemas/superconductivity_phase_network_instance_v0_1.schema.json \
            --fixture data/research/superconductivity_phase_network_fixture_v0_1.json \
            --out "$RUNNER_TEMP/sc-phase-network-receipt.json"
          cat "$RUNNER_TEMP/sc-phase-network-receipt.json"

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/superconductivity-phase-network-harness/Cargo.toml --bin sc_phase_network_audit -- -D warnings

      - name: Record exact-run identity
        if: always()
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            sha256sum data/schemas/superconductivity_phase_network_instance_v0_1.schema.json
            sha256sum data/research/superconductivity_phase_network_fixture_v0_1.json
            sha256sum tools/superconductivity-phase-network-harness/Cargo.toml
            sha256sum tools/superconductivity-phase-network-harness/src/main.rs
            if [ -f tools/superconductivity-phase-network-harness/Cargo.lock ]; then
              sha256sum tools/superconductivity-phase-network-harness/Cargo.lock
            else
              echo "cargo_lock=not-generated"
            fi
          } > "$RUNNER_TEMP/sc-phase-network-environment.txt"

      - name: Upload exact-run receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-phase-network-exact-run-evidence
          if-no-files-found: warn
          path: |
            tools/superconductivity-phase-network-harness/Cargo.lock
            ${{ runner.temp }}/sc-phase-network-environment.txt
            ${{ runner.temp }}/sc-phase-network-receipt.json
