name: Broca Feature Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-broca/**"
      - ".github/workflows/broca-feature-matrix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  broca-check:
    name: symthaea-broca (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            command: cargo check -p symthaea-broca --no-default-features
          - name: default
            command: cargo check -p symthaea-broca
          - name: mamba-cpu
            command: cargo check -p symthaea-broca --features mamba-cpu
          - name: test-helpers
            command: cargo test -p symthaea-broca --features "mamba-cpu,test-helpers" --tests --no-run
          - name: canonical-eval
            command: cargo test -p symthaea-broca --lib evaluation::tests::test_canonical_eval_dataset_loads
          - name: canonical-quality-gate
            command: cargo test -p symthaea-broca --lib evaluation::tests::test_quality_gate_thresholds_fail

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact PR-head checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-broca-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-broca-${{ matrix.name }}-
            ${{ runner.os }}-broca-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev cmake

      - name: Run feature check
        run: ${{ matrix.command }}