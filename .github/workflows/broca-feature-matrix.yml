name: Broca Feature Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-broca/**"
      - "crates/domains/symthaea-vocal-tract/**"
      - "crates/core/symthaea-core/**"
      - "crates/core/symthaea-fep/**"
      - "src/voice/**"
      - ".github/workflows/broca-feature-matrix.yml"
      - "docs/broca/**"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".cargo/config"
    # Changes to qualification inputs, build context, or workflow logic must re-run the exact-head matrix.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"
  BROCA_QUALIFICATION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  broca-check:
    name: symthaea-broca (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            command: cargo check -p symthaea-broca --no-default-features
          - name: default
            command: cargo check -p symthaea-broca
          - name: mamba-cpu
            command: cargo check -p symthaea-broca --features mamba-cpu
          - name: test-helpers
            command: cargo test -p symthaea-broca --features "mamba-cpu,test-helpers" --tests --no-run
          - name: canonical-eval
            command: cargo test -p symthaea-broca --lib evaluation::tests::test_canonical_eval_dataset_loads
          - name: canonical-quality-gate
            command: cargo test -p symthaea-broca --lib evaluation::tests::test_quality_gate_thresholds_fail
          - name: root-live-voice-ssm-language
            # Root defaults enable `broca_lite`, which is mutually exclusive with `ssm_language`.
            # Disable defaults so this leg actually exercises the native Broca voice path.
            command: cargo test -p symthaea --no-default-features --features "live-voice,ssm_language" --lib voice::live_voice::tests

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runner-provided Rust bootstrap
        run: |
          set -euo pipefail
          command -v rustup
          BROCA_RUSTUP_VERSION=$(rustup --version)
          echo "$BROCA_RUSTUP_VERSION"
          echo "BROCA_RUSTUP_VERSION=$BROCA_RUSTUP_VERSION" >> "$GITHUB_ENV"

          ref: ${{ env.BROCA_QUALIFICATION_HEAD_SHA }}

      - name: Verify qualification action pins
        run: |
          set -euo pipefail
          workflow=.github/workflows/broca-feature-matrix.yml
          refs=$(sed -n -E 's/^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]+([^[:space:]]+).*/\2/p' "$workflow")
          expected='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
          dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
          actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
          actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
          dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
          actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
          actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
          actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
          test "$refs" = "$expected"
          bad_refs=$(printf '%s\n' "$refs" | awk -F@ 'NF != 2 || length($2) != 40 || $2 !~ /^[0-9a-f]+$/ { print }')
          test -z "$bad_refs"
          test "$(grep -Ec '^permissions:$' "$workflow")" -eq 1
          test "$(grep -Ec '^  contents: read$' "$workflow")" -eq 1
          test "$(grep -Ec '^[[:space:]]*persist-credentials: false$' "$workflow")" -eq 2
          test "$(grep -Ec '^[[:space:]]*toolchain: 1\.96\.0$' "$workflow")" -eq 2
          test "$(grep -Ec '^  BROCA_QUALIFICATION_HEAD_SHA:' "$workflow")" -eq 1
          test "$(grep -Ec '^[[:space:]]*ref: \$\{\{ env\.BROCA_QUALIFICATION_HEAD_SHA \}\}$' "$workflow")" -eq 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.96.0

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-broca-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/domains/symthaea-broca/Cargo.toml', '.cargo/config.toml', '.cargo/config') }}

      - name: Verify locked dependency graph
        run: cargo fetch --locked

      - name: Capture native toolchain context
        run: |
          {
            echo "BROCA_NATIVE_TOOLCHAIN_CONTEXT<<EOF"
            cc --version | head -n 1
            clang --version | head -n 1
            ld --version | head -n 1
            ldd --version | head -n 1
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev cmake libasound2-dev

      - name: Capture native package context
        run: |
          {
            echo "BROCA_NATIVE_PACKAGE_CONTEXT<<EOF"
            dpkg-query -W -f='${Package}=${Version}\n' pkg-config libssl-dev libclang-dev cmake | sort
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run feature check
        run: ${{ matrix.command }}

  broca-unimorph-freeze-audit:
    name: UniMorph frozen snapshot audit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runner-provided Rust bootstrap
        run: |
          set -euo pipefail
          command -v rustup
          BROCA_RUSTUP_VERSION=$(rustup --version)
          echo "$BROCA_RUSTUP_VERSION"
          echo "BROCA_RUSTUP_VERSION=$BROCA_RUSTUP_VERSION" >> "$GITHUB_ENV"

          ref: ${{ env.BROCA_QUALIFICATION_HEAD_SHA }}

      - name: Verify qualification action pins
        run: |
          set -euo pipefail
          workflow=.github/workflows/broca-feature-matrix.yml
          refs=$(sed -n -E 's/^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]+([^[:space:]]+).*/\2/p' "$workflow")
          expected='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
          dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
          actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
          actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
          dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
          actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
          actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
          actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
          test "$refs" = "$expected"
          bad_refs=$(printf '%s\n' "$refs" | awk -F@ 'NF != 2 || length($2) != 40 || $2 !~ /^[0-9a-f]+$/ { print }')
          test -z "$bad_refs"
          test "$(grep -Ec '^permissions:$' "$workflow")" -eq 1
          test "$(grep -Ec '^  contents: read$' "$workflow")" -eq 1
          test "$(grep -Ec '^[[:space:]]*persist-credentials: false$' "$workflow")" -eq 2
          test "$(grep -Ec '^[[:space:]]*toolchain: 1\.96\.0$' "$workflow")" -eq 2
          test "$(grep -Ec '^  BROCA_QUALIFICATION_HEAD_SHA:' "$workflow")" -eq 1
          test "$(grep -Ec '^[[:space:]]*ref: \$\{\{ env\.BROCA_QUALIFICATION_HEAD_SHA \}\}$' "$workflow")" -eq 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.96.0

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-broca-freeze-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/domains/symthaea-broca/Cargo.toml', '.cargo/config.toml', '.cargo/config') }}

      - name: Verify locked dependency graph
        run: cargo fetch --locked

      - name: Capture native toolchain context
        run: |
          {
            echo "BROCA_NATIVE_TOOLCHAIN_CONTEXT<<EOF"
            cc --version | head -n 1
            clang --version | head -n 1
            ld --version | head -n 1
            ldd --version | head -n 1
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev cmake

      - name: Capture native package context
        run: |
          {
            echo "BROCA_NATIVE_PACKAGE_CONTEXT<<EOF"
            dpkg-query -W -f='${Package}=${Version}\n' pkg-config libssl-dev libclang-dev cmake | sort
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Audit frozen UniMorph snapshot
        env:
          BROCA_FREEZE_AUDIT_OUTPUT: target/broca-unimorph-freeze/receipt.json
        run: |
          set -o pipefail
          mkdir -p target/broca-unimorph-freeze
          cargo run --locked -p symthaea-broca --bin broca-unimorph-freeze-audit |
            tee target/broca-unimorph-freeze/audit.txt

      - name: Attest structured freeze receipt
        id: attest-receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/broca-unimorph-freeze/receipt.json

      - name: Preserve attestation bundle
        run: |
          cp "${{ steps.attest-receipt.outputs.bundle-path }}" target/broca-unimorph-freeze/receipt.attestation.bundle.json

      - name: Upload frozen UniMorph audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: broca-unimorph-freeze-${{ github.sha }}
          path: target/broca-unimorph-freeze/
          retention-days: 30
