name: PR Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance Check (Class A/B Changes)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge context
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR merge execution identity
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          expected_ref="refs/pull/${PR_NUMBER}/merge"

          test "${checkout_sha}" = "${GITHUB_SHA}" || {
            echo "checkout SHA does not match event SHA" >&2
            exit 1
          }
          test "${GITHUB_REF}" = "${expected_ref}" || {
            echo "unexpected PR execution ref: ${GITHUB_REF}" >&2
            exit 1
          }
          test "${checkout_sha}" != "${PR_HEAD_SHA}" || {
            echo "expected PR merge context, got raw PR head" >&2
            exit 1
          }
          git merge-base --is-ancestor "${PR_BASE_SHA}" "${checkout_sha}" || {
            echo "PR base SHA is not an ancestor of checkout subject" >&2
            exit 1
          }
          git merge-base --is-ancestor "${PR_HEAD_SHA}" "${checkout_sha}" || {
            echo "PR head SHA is not an ancestor of checkout subject" >&2
            exit 1
          }

          echo "execution_subject=PR_MERGE_CONTEXT"
          echo "event_sha=${GITHUB_SHA}"
          echo "checkout_sha=${checkout_sha}"
          echo "checkout_ref=${GITHUB_REF}"
          echo "base_is_ancestor_of_checkout=true"
          echo "head_is_ancestor_of_checkout=true"

      - name: Check for safety-critical changes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-class-a-changes.sh --ci

      - name: Preserve Showroom hygiene
        shell: bash
        run: bash .github/scripts/check-showroom-hygiene.sh

      - name: Ratchet draft-safe full-CI topology
        shell: bash
        run: python3 .github/scripts/check-draft-ci-gates.py

      - name: Record governance evidence
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          {
            echo "execution_subject=PR_MERGE_CONTEXT"
            echo "pr_number=${PR_NUMBER}"
            echo "associated_head_sha=${PR_HEAD_SHA}"
            echo "associated_base_sha=${PR_BASE_SHA}"
            echo "event_sha=${GITHUB_SHA}"
            echo "checkout_sha=${checkout_sha}"
            echo "checkout_ref=${GITHUB_REF}"
            echo "base_is_ancestor_of_checkout=true"
            echo "head_is_ancestor_of_checkout=true"
            echo "pr_draft=${PR_DRAFT}"
            echo "execution_identity_check=pass"
            echo "governance_check=pass"
            echo "showroom_hygiene_check=pass"
            echo "draft_ci_gate_check=pass"
          } | tee pr-governance-receipt.txt
