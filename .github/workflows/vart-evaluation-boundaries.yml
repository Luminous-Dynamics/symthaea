name: VART Evaluation Boundaries

on:
  pull_request:
    paths:
      - 'docs/research/VART_001_ARCHIVE_CAPSULE_V1.md'
      - 'docs/research/VART_001_ARCHIVE_CAPSULE.template.json'
      - 'docs/research/VART_BENCHMARK_FIREWALL_V1.md'
      - 'docs/research/VART_BENCHMARK_FIREWALL.template.json'
      - 'docs/research/VART_002_*'
      - 'scripts/verify_vart_001_archive_capsule.py'
      - 'scripts/test_verify_vart_001_archive_capsule.py'
      - 'scripts/verify_vart_benchmark_firewall.py'
      - 'scripts/test_verify_vart_benchmark_firewall.py'
      - 'scripts/verify_vart_002_mechanism_matrix.py'
      - 'scripts/test_verify_vart_002_mechanism_matrix.py'
      - 'crates/domains/symthaea-epistemic-types/**'
      - 'crates/domains/symthaea-memory/Cargo.toml'
      - 'crates/domains/symthaea-memory/src/episodic_provenance.rs'
      - 'crates/domains/symthaea-memory/src/episodic_shadow.rs'
      - 'crates/domains/symthaea-memory/src/lib.rs'
      - 'src/cognitive_loop/episodic_persistence_manager.rs'
      - '.github/workflows/vart-evaluation-boundaries.yml'
  push:
    paths:
      - 'docs/research/VART_001_ARCHIVE_CAPSULE_V1.md'
      - 'docs/research/VART_001_ARCHIVE_CAPSULE.template.json'
      - 'docs/research/VART_BENCHMARK_FIREWALL_V1.md'
      - 'docs/research/VART_BENCHMARK_FIREWALL.template.json'
      - 'docs/research/VART_002_*'
      - 'scripts/verify_vart_001_archive_capsule.py'
      - 'scripts/test_verify_vart_001_archive_capsule.py'
      - 'scripts/verify_vart_benchmark_firewall.py'
      - 'scripts/test_verify_vart_benchmark_firewall.py'
      - 'scripts/verify_vart_002_mechanism_matrix.py'
      - 'scripts/test_verify_vart_002_mechanism_matrix.py'
      - 'crates/domains/symthaea-epistemic-types/**'
      - 'crates/domains/symthaea-memory/Cargo.toml'
      - 'crates/domains/symthaea-memory/src/episodic_provenance.rs'
      - 'crates/domains/symthaea-memory/src/episodic_shadow.rs'
      - 'crates/domains/symthaea-memory/src/lib.rs'
      - 'src/cognitive_loop/episodic_persistence_manager.rs'
      - '.github/workflows/vart-evaluation-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax check
        run: |
          python -m py_compile \
            scripts/verify_vart_001_archive_capsule.py \
            scripts/test_verify_vart_001_archive_capsule.py \
            scripts/verify_vart_benchmark_firewall.py \
            scripts/test_verify_vart_benchmark_firewall.py \
            scripts/verify_vart_002_mechanism_matrix.py \
            scripts/test_verify_vart_002_mechanism_matrix.py
      - name: Archive capsule adversarial suite
        run: python scripts/test_verify_vart_001_archive_capsule.py
      - name: DEVART/VART firewall adversarial suite
        run: python scripts/test_verify_vart_benchmark_firewall.py
      - name: VART-002 mechanism matrix adversarial suite
        run: python scripts/test_verify_vart_002_mechanism_matrix.py
      - name: Epistemic type, derivation, policy, and readiness tests
        run: cargo test -p symthaea-epistemic-types --lib
      - name: Episodic provenance compatibility and retrieval tests
        run: cargo test -p symthaea-memory --lib episodic_provenance
      - name: Behavior-neutral provenance shadow recall tests
        run: cargo test -p symthaea-memory --lib episodic_shadow
      - name: Cognitive-loop episodic provenance ownership tests
        run: cargo test --lib episodic_persistence_manager::tests
