name: HARDSEC-021 episode-level restarted conformal monitor with PMU qualification

on:
  pull_request:
    paths:
      - "examples/hardsec_episode_restarted_monitor.rs"
      - "examples/hardsec_pmu_metrology_audit.rs"
      - "examples/hardsec_context_assignment_audit.rs"
      - "docs/research/HARDSEC_021_EPISODE_RESTARTED_CONFORMAL.md"
      - "schemas/hardsec-episode-*.schema.json"
      - "schemas/hardsec-pmu-metrology-plan-v1.schema.json"
      - "schemas/hardsec-context-assignment-*.schema.json"
      - "tests/fixtures/hardsec/context-assignment-v1/**"
      - "tests/fixtures/hardsec/episode-restarted-v1/**"
      - "tests/fixtures/hardsec/pmu-metrology-v1/**"
      - "tools/hardsec-adaptive-evasion-audit-harness/**"
      - ".github/workflows/hardsec-episode-restarted-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardsec-episode-restarted-monitor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  episode-restarted-monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check formatting
        run: rustfmt --edition 2024 --check examples/hardsec_context_assignment_audit.rs examples/hardsec_pmu_metrology_audit.rs examples/hardsec_episode_restarted_monitor.rs
      - name: Run HARDSEC-020 context assignment unit suite
        run: cargo test --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-context-assignment-audit --example hardsec_context_assignment_audit
      - name: Run HARDSEC-018 PMU metrology unit suite
        run: cargo test --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-pmu-metrology-audit --example hardsec_pmu_metrology_audit
      - name: Run HARDSEC-021 episode packer and restarted conformal unit suite
        run: cargo test --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-episode-restarted-monitor --example hardsec_episode_restarted_monitor
      - name: Generate HARDSEC-020 truth-free episode context receipt
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$(mktemp -d)"
          cargo run --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-context-assignment-audit --example hardsec_context_assignment_audit -- \
            --policy tests/fixtures/hardsec/episode-restarted-v1/context-policy.json \
            --assignments tests/fixtures/hardsec/episode-restarted-v1/context-assignments.json \
            --truth tests/fixtures/hardsec/episode-restarted-v1/context-truth-oracle.json \
            --receipt "$out_dir/context-assignment-receipt.json"
          python3 - "$out_dir/context-assignment-receipt.json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              receipt = json.load(handle)
          metrics = receipt["assignment_integrity"]
          assert receipt["result"] == "audited"
          assert metrics["assignment_record_count"] == 528
          assert metrics["accepted_count"] == 528
          assert metrics["abstained_count"] == 0
          assert metrics["accepted_accuracy_denominator"] == 528
          assert abs(metrics["accepted_accuracy"] - 1.0) < 1e-12
          assert abs(metrics["accepted_coverage"] - 1.0) < 1e-12
          assert receipt["runtime_mapping"]["contains_truth_labels"] is False
          assert len(receipt["runtime_mapping"]["assignments"]) == 528
          PY
          echo "$out_dir" > "$RUNNER_TEMP/hardsec-021-output-dir"
      - name: Qualify PMU acquisition with HARDSEC-018
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$(cat "$RUNNER_TEMP/hardsec-021-output-dir")"
          cargo run --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-pmu-metrology-audit --example hardsec_pmu_metrology_audit -- \
            --plan tests/fixtures/hardsec/pmu-metrology-v1/plan.json \
            --observations tests/fixtures/hardsec/pmu-metrology-v1/observations.json \
            --receipt "$out_dir/pmu-metrology-receipt.json"
          python3 - "$out_dir/pmu-metrology-receipt.json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              receipt = json.load(handle)
          assert receipt["schema_version"] == "hardsec-pmu-metrology-receipt-v1"
          assert receipt["result"] == "qualified_for_named_acquisition_conditions"
          assert receipt["claim_scope"] == "measurement_configuration_and_declared_trial_record_qualification_only"
          assert receipt["protocol_id"] == "hs018-pmu-counterfactual-acquisition-v1"
          assert receipt["platform_id"] == "riscv-sim-pmu-v1"
          assert receipt["workload_id"] == "fixed-workload-v1"
          assert receipt["observer_effect"]["overall_status"] == "within_declared_thresholds"
          assert receipt["measurement_semantics"]["multiplex_scaled_values_confirmatory"] is False
          qualified = {item["event_id"]: item for item in receipt["event_qualification"]}
          for event_id in ("instret", "cycles", "l1_miss"):
              assert qualified[event_id]["co_scheduled"]["status"] == "confirmatory_eligible_under_declared_thresholds"
              assert qualified[event_id]["overcommitted"]["confirmatory_eligible"] is False
          assert receipt["support"]["independence_status"] == "not_established"
          assert receipt["support"]["trial_count"] == len(json.load(open("tests/fixtures/hardsec/pmu-metrology-v1/observations.json", encoding="utf-8"))["trials"])
          assert receipt["support"]["matched_block_count"] == 2
          PY
      - name: Run episode packer and restarted detector using qualified PMU receipt
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$(cat "$RUNNER_TEMP/hardsec-021-output-dir")"
          cargo run --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-episode-restarted-monitor --example hardsec_episode_restarted_monitor -- \
            --plan tests/fixtures/hardsec/episode-restarted-v1/plan.json \
            --episodes tests/fixtures/hardsec/episode-restarted-v1/episodes.json \
            --context-receipt "$out_dir/context-assignment-receipt.json" \
            --pmu-plan tests/fixtures/hardsec/pmu-metrology-v1/plan.json \
            --pmu-observations tests/fixtures/hardsec/pmu-metrology-v1/observations.json \
            --pmu-receipt "$out_dir/pmu-metrology-receipt.json" \
            --receipt "$out_dir/episode-restarted-receipt.json"
          python3 - "$out_dir/episode-restarted-receipt.json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              receipt = json.load(handle)
          assert receipt["result"] == "restarted_alarm_threshold_crossed"
          pmu = receipt["pmu_qualification"]
          assert pmu["result"] == "qualified_for_named_acquisition_conditions"
          assert pmu["protocol_id"] == "hs018-pmu-counterfactual-acquisition-v1"
          assert pmu["platform_id"] == "riscv-sim-pmu-v1"
          assert pmu["workload_id"] == "fixed-workload-v1"
          assert pmu["acquisition_condition_id"] == "grouped_co_scheduled"
          assert set(pmu["confirmatory_event_ids"]) == {"instret", "cycles", "l1_miss"}
          assert len(pmu["receipt_sha256"]) == 64
          integrity = receipt["episode_integrity"]
          assert integrity["episode_count"] == 132
          assert integrity["accepted_episode_count"] == 132
          assert integrity["abstained_episode_count"] == 0
          assert integrity["source_window_count"] == 528
          assert integrity["windows_per_accepted_episode"] == 4
          assert integrity["one_episode_per_unique_execution_group"] is True
          monitor = receipt["sequential_monitor"]
          assert monitor["overall_first_alarm_sequence_index"] == 65
          assert monitor["overall_first_alarm_context_id"] == "compute"
          assert len(monitor["episode_decisions"]) == 132
          assert monitor["episode_decisions"][64]["action"] == "restarted_alarm_crossing"
          contexts = {item["context_id"]: item for item in monitor["context_results"]}
          assert contexts["compute"]["valid_episode_count"] == 72
          assert contexts["memory"]["valid_episode_count"] == 60
          assert abs(contexts["compute"]["alpha_allocation"] - 0.025) < 1e-12
          assert abs(contexts["memory"]["alpha_allocation"] - 0.025) < 1e-12
          guarantees = receipt["statistical_guarantees"]
          assert abs(guarantees["pfa_bound_if_all_theorem_assumptions_hold"] - 0.05) < 1e-12
          assert guarantees["episode_score_exchangeability_status"] == "assumption_not_verified"
          assert guarantees["cross_execution_independence_status"] == "not_established"
          assert guarantees["randomizer_independence_status"] == "assumption_not_verified"
          assert guarantees["theorem_guarantee_status"] == "not_established_from_input_receipts"
          assert guarantees["effective_sample_size_estimate"] is None
          assert receipt["context_assignment"]["truth_labels_in_runtime_mapping"] is False
          assert receipt["context_assignment"]["accepted_count"] == 528
          assert receipt["context_assignment"]["abstained_count"] == 0
          PY
      - name: Check preregistered late-change benchmark contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open("tests/fixtures/hardsec/episode-restarted-v1/benchmark-plan.json", "r", encoding="utf-8") as handle:
              plan = json.load(handle)
          assert plan["status"] == "planned"
          assert len(plan["baselines"]) == 13
          assert "fixed_start_power_mixture_cmm" in plan["baselines"]
          assert "t-smade-2024-two-stage-hpc-detector" in plan["baselines"]
          assert "intel-vtune-topdown-pmu-profile" in plan["baselines"]
          assert "weighted_restarted_sum_near_harmonic" in plan["baselines"]
          assert "dependent_ar1_episode_null" in plan["scenarios"]
          assert "shared_latent_episode_null" in plan["scenarios"]
          assert "iid_episode_shift_at_1000" in plan["scenarios"]
          assert plan["claim_rules"]["episode_independence_is_assumption_not_proven"] is True
          assert plan["claim_rules"]["randomizer_independence_is_assumption_not_proven"] is True
          assert plan["claim_rules"]["delay_units_are_episodes"] is True
          assert plan["claim_rules"]["delay_theorem_local_kl_support_unverified"] is True
          assert plan["claim_rules"]["delay_theorem_score_transform_separation_unverified"] is True
          assert plan["claim_rules"]["pfa_claim_requires_exchangeable_episode_scores_and_independent_randomizers"] is True
          PY
