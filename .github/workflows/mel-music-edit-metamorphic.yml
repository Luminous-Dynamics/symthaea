name: Melothaea metamorphic music-edit contracts

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/music_edit_metamorphic_benchmark.rs"
      - "crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "tools/mel-music-edit-metamorphic-harness/**"
      - "benchmarks/mel/schemas/music-edit-metamorphic-pair-v1.schema.json"
      - "benchmarks/mel/registry/synthetic-music-edit-metamorphic-pairs-v1.json"
      - "docs/research/MEL_MR_EVAL_038_METAMORPHIC_EDIT_V1_2026-11-14.md"
      - ".github/workflows/mel-music-edit-metamorphic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metamorphic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MEL_METAMORPHIC_REVISION=$actual" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Stage standalone metamorphic harness
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-music-edit-metamorphic-harness"
          mkdir -p "$staged/src" "$staged/examples" "$staged/fixtures"
          cp tools/mel-music-edit-metamorphic-harness/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-music-edit-metamorphic-harness/src/lib.rs "$staged/src/lib.rs"
          cp crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs "$staged/src/music_edit_benchmark_adapter.rs"
          cp crates/domains/symthaea-muse/src/music_edit_metamorphic_benchmark.rs "$staged/src/music_edit_metamorphic_benchmark.rs"
          cp tools/mel-music-edit-metamorphic-harness/examples/validate_fixtures.rs "$staged/examples/validate_fixtures.rs"
          cp benchmarks/mel/registry/synthetic-music-edit-metamorphic-pairs-v1.json "$staged/fixtures/"
          echo "MEL_METAMORPHIC_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format and verify exact harness
        run: |
          cargo +1.96.0 fmt --manifest-path "$MEL_METAMORPHIC_MANIFEST"
          cargo +1.96.0 fmt --check --manifest-path "$MEL_METAMORPHIC_MANIFEST"
      - name: Resolve standalone dependencies
        run: cargo +1.96.0 generate-lockfile --manifest-path "$MEL_METAMORPHIC_MANIFEST"
      - name: Run metamorphic contract tests
        run: cargo +1.96.0 test --locked --manifest-path "$MEL_METAMORPHIC_MANIFEST"
      - name: Validate synthetic relation fixtures
        run: cargo +1.96.0 run --locked --manifest-path "$MEL_METAMORPHIC_MANIFEST" --example validate_fixtures
      - name: Run metamorphic harness Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path "$MEL_METAMORPHIC_MANIFEST" --all-targets -- -D warnings
      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mel-metamorphic-evidence"
          mkdir -p "$evidence"
          sha256sum crates/domains/symthaea-muse/src/music_edit_metamorphic_benchmark.rs > "$evidence/production-module.sha256"
          sha256sum crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs > "$evidence/adapter-module.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-metamorphic-pair-v1.schema.json > "$evidence/pair-schema.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-metamorphic-pairs-v1.json > "$evidence/fixture.sha256"
          printf 'exact_head=%s\n' "$MEL_METAMORPHIC_REVISION" > "$evidence/source-identities.txt"
          cp "$(dirname "$MEL_METAMORPHIC_MANIFEST")/Cargo.lock" "$evidence/Cargo.lock"
          sha256sum "$evidence/Cargo.lock" > "$evidence/Cargo.lock.sha256"
      - name: Upload metamorphic evidence
        uses: actions/upload-artifact@v4
        with:
          name: mel-metamorphic-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-metamorphic-evidence/
          if-no-files-found: error
          retention-days: 90
