name: VIS-DVPC-049 pCRP-star OPE selection comparator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/vision-dvpc-049-pcrp-star-lcb.rs"
      - "docs/research/VIS_DVPC_049_PCRP_STAR_LCB_V1.md"
      - ".github/workflows/vis-dvpc-049-pcrp-star-lcb.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-049-pcrp-star-lcb.rs"
      - "docs/research/VIS_DVPC_049_PCRP_STAR_LCB_V1.md"
      - ".github/workflows/vis-dvpc-049-pcrp-star-lcb.yml"

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact comparator
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Compile and run proof controls
        run: |
          rustc --edition=2024 -O --test tools/vision-dvpc-049-pcrp-star-lcb.rs -o /tmp/vis-dvpc-049-tests
          /tmp/vis-dvpc-049-tests
      - name: Verify deterministic smoke replay and zero-support suppression
        run: |
          rustc --edition=2024 -O tools/vision-dvpc-049-pcrp-star-lcb.rs -o /tmp/vis-dvpc-049
          /tmp/vis-dvpc-049 --smoke > /tmp/vis-dvpc-049-smoke-a.tsv
          /tmp/vis-dvpc-049 --smoke > /tmp/vis-dvpc-049-smoke-b.tsv
          grep -v '^SYSTEM' /tmp/vis-dvpc-049-smoke-a.tsv > /tmp/vis-dvpc-049-smoke-a-stable.tsv
          grep -v '^SYSTEM' /tmp/vis-dvpc-049-smoke-b.tsv > /tmp/vis-dvpc-049-smoke-b-stable.tsv
          cmp /tmp/vis-dvpc-049-smoke-a-stable.tsv /tmp/vis-dvpc-049-smoke-b-stable.tsv
          grep -Fq $'FIXTURE\tzero_support_logger\tstatus\tNOT_IDENTIFIED_ZERO_SUPPORT' /tmp/vis-dvpc-049-smoke-a.tsv
          grep -Fq $'SUPPRESSED\tzero_support_logger\tall_horizons\tall_methods\tunsupported_target_action' /tmp/vis-dvpc-049-smoke-a.tsv
          test "$(grep -c '^RESULT_METRIC' /tmp/vis-dvpc-049-smoke-a-stable.tsv)" = "88"
          ! grep '^RESULT_METRIC.*zero_support_logger' /tmp/vis-dvpc-049-smoke-a-stable.tsv
      - name: Run the paired selection pilot
        run: |
          /tmp/vis-dvpc-049 --benchmark > /tmp/vis-dvpc-049-results.tsv
          test "$(grep -c '^FIXTURE' /tmp/vis-dvpc-049-results.tsv)" = "3"
          test "$(grep -c '^RESULT_METRIC' /tmp/vis-dvpc-049-results.tsv)" = "132"
          grep -Fq $'FIXTURE\thealthy_logger\tstatus\tIDENTIFIED' /tmp/vis-dvpc-049-results.tsv
          grep -Fq $'FIXTURE\tweak_overlap_logger\tstatus\tIDENTIFIED' /tmp/vis-dvpc-049-results.tsv
          grep -Fq $'FIXTURE\tzero_support_logger\tstatus\tNOT_IDENTIFIED_ZERO_SUPPORT' /tmp/vis-dvpc-049-results.tsv
          ! grep '^RESULT_METRIC.*zero_support_logger' /tmp/vis-dvpc-049-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && ($6 < -0.000001 || $6 > 1.000001) && ($5=="familywise_interval_coverage" || $5=="top1_policy_selection_accuracy" || $5=="winner_certificate_rate" || $5=="false_certificate_probability" || $5=="false_certificate_given_certificate" || $5=="reversed_interval_candidate_rate") { bad=1 } END { if (bad) exit 1 }' /tmp/vis-dvpc-049-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $5=="mean_simple_regret" && $6 < -0.000001 { bad=1 } END { if (bad) exit 1 }' /tmp/vis-dvpc-049-results.tsv
          grep '^CONFIG' /tmp/vis-dvpc-049-results.tsv > /tmp/vis-dvpc-049-config.tsv
          grep '^FIXTURE\|^RESULT_METRIC' /tmp/vis-dvpc-049-results.tsv > /tmp/vis-dvpc-049-summary.tsv
      - name: Create exact source/output SHA-256 receipt
        run: |
          {
            printf 'VIS_DVPC_049_RECEIPT\tformat\tv1\n'
            printf 'commit_sha\t%s\n' "$GITHUB_SHA"
            printf 'rustc\t%s\n' "$(rustc --version)"
            sha256sum tools/vision-dvpc-049-pcrp-star-lcb.rs /tmp/vis-dvpc-049-results.tsv /tmp/vis-dvpc-049-summary.tsv /tmp/vis-dvpc-049-config.tsv
          } > /tmp/vis-dvpc-049-receipt.tsv
          cat /tmp/vis-dvpc-049-receipt.tsv
      - name: Publish benchmark and receipt
        uses: actions/upload-artifact@v4
        with:
          name: vis-dvpc-049-pcrp-star-lcb
          path: |
            /tmp/vis-dvpc-049-results.tsv
            /tmp/vis-dvpc-049-summary.tsv
            /tmp/vis-dvpc-049-config.tsv
            /tmp/vis-dvpc-049-smoke-a-stable.tsv
            /tmp/vis-dvpc-049-receipt.tsv
          retention-days: 90
