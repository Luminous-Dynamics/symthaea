name: HARDSEC-025 exact rational restarted Markov portfolio

on:
  pull_request:
    paths:
      - "examples/hardsec_restarted_markov_portfolio.rs"
      - "docs/research/HARDSEC_025_RESTARTED_MARKOV_PORTFOLIO.md"
      - "tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml"
      - ".github/workflows/hardsec-restarted-markov-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardsec-025-restarted-markov-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-rational-restart-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Check isolated example formatting
        run: rustfmt --edition 2024 --check examples/hardsec_restarted_markov_portfolio.rs
      - name: Run exact rational portfolio and path tests
        run: cargo test --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-restarted-markov-portfolio --example hardsec_restarted_markov_portfolio
      - name: Emit and verify exact known-answer receipt
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-restarted-markov-portfolio --example hardsec_restarted_markov_portfolio > /tmp/hardsec-025-restart.json
          python3 - <<'PY'
          import json
          with open("/tmp/hardsec-025-restart.json", "r", encoding="utf-8") as handle:
              receipt = json.load(handle)
          assert receipt["result"] == "exact_rational_restart_mixture_enumeration_passed"
          assert receipt["portfolio"]["portfolio_count"] == 6
          assert receipt["portfolio"]["capital_conservation"].endswith("exactly")
          assert receipt["enumeration"]["horizon"] == 6
          assert receipt["enumeration"]["paths_per_initial_state"] == 64
          episodes = receipt["enumeration"]["episodes"]
          assert [row["initial_state"] for row in episodes] == [0, 1]
          assert [row["path_mass_numerator"] for row in episodes] == ["4096", "4096"]
          assert [row["anytime_crossing_mass_numerator"] for row in episodes] == ["64", "128"]
          assert all(row["path_mass_is_one"] for row in episodes)
          assert all(row["anytime_crossing_probability_at_or_below_alpha"] for row in episodes)
          assert receipt["guarantee"]["conditional_factor_le_one_for_every_fixture_portfolio"]
          assert receipt["guarantee"]["restart_capital_created"] is False
          assert receipt["guarantee"]["calibration_coverage_established"] is False
          assert receipt["guarantee"]["arbitrary_serial_pmu_pfa_claim"] is False
          assert receipt["guarantee"]["physical_hardware_evidence"] is False
          assert receipt["guarantee"]["effective_sample_size_estimate"] is None
          print("HARDSEC-025 exact rational restarted Markov portfolio oracle qualified.")
          PY
