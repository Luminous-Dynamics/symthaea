name: Interaction Policy Evidence V1 Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/interaction-policy-evidence-v1-qualification.yml'
      - 'crates/core/symthaea-interaction-policy/**'
      - 'crates/core/symthaea-interaction-egress/**'
      - 'crates/core/symthaea-interaction-lineage/**'
      - 'crates/core/symthaea-interaction-core/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interaction-policy-evidence-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  interaction-policy-evidence-v1:
    name: Exact-head interaction policy evidence v1
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact PR head and required egress parent
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUIRED_PARENT: f8f6c20a437351ad64124c1ef44106c19fbc6fc7
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          fi
          git cat-file -e "${REQUIRED_PARENT}^{commit}"
          test "$(git merge-base HEAD "${REQUIRED_PARENT}")" = "${REQUIRED_PARENT}"
          git merge-base --is-ancestor "${REQUIRED_PARENT}" HEAD

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Record clean source baseline
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

      - name: Enforce pure policy-evidence boundary
        run: |
          set -euo pipefail
          MANIFEST=crates/core/symthaea-interaction-policy/Cargo.toml
          SOURCE=crates/core/symthaea-interaction-policy/src/lib.rs

          grep -Fq 'symthaea-interaction-core = { path = "../symthaea-interaction-core" }' "${MANIFEST}"
          grep -Fq 'symthaea-interaction-egress = { path = "../symthaea-interaction-egress" }' "${MANIFEST}"
          grep -Fq 'sha2 = { workspace = true }' "${MANIFEST}"
          if grep -Eiq 'symthaea-authority|symthaea-action|reqwest|hyper|tokio|holochain|hdk|hdi|web3|ethers|alloy|kube|rmcp|a2a|keyring|secret-service|spiffe|rego|cedar|wasmtime' "${MANIFEST}"; then
            echo 'authority/runtime/protocol/policy-engine dependency leaked into pure policy evidence' >&2
            exit 1
          fi

          grep -Fq 'symthaea.interaction.policy.subject.v1\0' "${SOURCE}"
          grep -Fq 'symthaea.interaction.policy.bundle.v1\0' "${SOURCE}"
          grep -Fq 'symthaea.interaction.policy.engine.v1\0' "${SOURCE}"
          grep -Fq 'symthaea.interaction.policy.receipt.v1\0' "${SOURCE}"
          grep -Fq 'PolicyDecisionSubjectV1' "${SOURCE}"
          grep -Fq 'PolicyBundleIdentityV1' "${SOURCE}"
          grep -Fq 'PolicyEngineIdentityV1' "${SOURCE}"
          grep -Fq 'AllowCandidate' "${SOURCE}"
          grep -Fq 'authenticated PDP provenance' "${SOURCE}"
          grep -Fq 'subject_kind_is_committed_even_for_same_raw_digest' "${SOURCE}"
          grep -Fq 'canonical_vectors_are_stable' "${SOURCE}"

          if grep -Eq 'use .*DispatchPermit|use .*CapabilityGrant|use .*VerifiedAuthority|std::net::|std::fs::|std::process::|Command::new' "${SOURCE}"; then
            echo 'authority/runtime I/O leaked into policy evidence implementation' >&2
            exit 1
          fi
          if grep -Eq 'pub[[:space:]]+fn[[:space:]]+(from_digest|from_commitment|from_raw)' "${SOURCE}"; then
            echo 'raw digest constructor would erase typed policy-subject provenance' >&2
            exit 1
          fi
          if grep -Eiq 'phi|confidence|utility|reputation' "${SOURCE}"; then
            python3 - <<'PY'
          from pathlib import Path
          source = Path('crates/core/symthaea-interaction-policy/src/lib.rs').read_text()
          # Documentation may state the prohibition, but no field/parameter or enum
          # variant may make cognition-derived scores part of policy evidence identity.
          forbidden = (
              'pub phi:', 'phi:', 'current_phi', 'confidence:', 'utility:',
              'reputation:', 'collective_phi', 'effective_phi'
          )
          if any(item in source for item in forbidden):
              raise SystemExit('cognition-derived score leaked into policy receipt identity')
          PY
          fi

      - name: Independent policy evidence oracle
        run: |
          set -euo pipefail
          python3 crates/core/symthaea-interaction-policy/scripts/policy_evidence_oracle.py

      - name: Format
        run: |
          set -euo pipefail
          cargo fmt -p symthaea-interaction-policy -- --check

      - name: Resolve candidate and execute focused gates
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check -p symthaea-interaction-policy --all-targets
          cargo test -p symthaea-interaction-policy
          cargo clippy -p symthaea-interaction-policy --all-targets -- -D warnings
          if ! cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock requires committed reconciliation:' >&2
            diff -u /tmp/Cargo.lock.before Cargo.lock || true
            exit 1
          fi

      - name: Locked replay
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-interaction-policy --all-targets
          cargo test --locked -p symthaea-interaction-policy
          cargo clippy --locked -p symthaea-interaction-policy --all-targets -- -D warnings

      - name: Prove qualification did not mutate source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
