name: Plasma physics reference oracles

on:
  push:
    paths:
      - "crates/tools/plasma-physics-oracles/**"
      - ".github/workflows/plasma-physics-oracles.yml"
  pull_request:
    paths:
      - "crates/tools/plasma-physics-oracles/**"
      - ".github/workflows/plasma-physics-oracles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Strict format check
        run: cargo fmt --manifest-path crates/tools/plasma-physics-oracles/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/plasma-physics-oracles/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/plasma-physics-oracles/Cargo.toml --all-targets -- -D warnings
