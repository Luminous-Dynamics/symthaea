name: Melothaea RMI synthetic harness

on:
  pull_request:
    paths:
      - "tools/mel-rmi-synthetic/**"
      - ".github/workflows/mel-rmi-synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-rmi-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: Verify the exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MEL_RMI_CODE_REVISION=$actual" >> "$GITHUB_ENV"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Stage isolated crate outside repository workspace
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-rmi-synthetic"
          mkdir -p "$staged/src" "$staged/examples"
          cp tools/mel-rmi-synthetic/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-rmi-synthetic/Cargo.lock "$staged/Cargo.lock"
          cp tools/mel-rmi-synthetic/src/lib.rs "$staged/src/lib.rs"
          cp tools/mel-rmi-synthetic/examples/canonical_suite.rs "$staged/examples/canonical_suite.rs"
          echo "MEL_RMI_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format isolated crate
        run: cargo fmt --check --manifest-path "$MEL_RMI_MANIFEST"
      - name: Test deterministic RMI oracle
        run: cargo test --locked --manifest-path "$MEL_RMI_MANIFEST"
      - name: Run 160-case five-dimension seed sweep and verify control separation
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mel-rmi-canonical-suite.csv"
          cargo run --locked --manifest-path "$MEL_RMI_MANIFEST" --example canonical_suite > "$report"
          cat "$report"
          rule_count="$(awk -F, '$1 == "trial" && $3 == "rule-positive" && $11 == "true" { count++ } END { print count + 0 }' "$report")"
          fixed_passes="$(awk -F, '$1 == "trial" && $3 == "fixed" && $11 == "true" { count++ } END { print count + 0 }' "$report")"
          imitation_passes="$(awk -F, '$1 == "trial" && $3 == "imitation" && $11 == "true" { count++ } END { print count + 0 }' "$report")"
          one_way_passes="$(awk -F, '$1 == "trial" && $3 == "one-way" && $11 == "true" { count++ } END { print count + 0 }' "$report")"
          yoked_passes="$(awk -F, '$1 == "trial" && $3 == "yoked" && $11 == "true" { count++ } END { print count + 0 }' "$report")"
          distractor_passes="$(awk -F, '$1 == "trial" && $3 == "distractor-shortcut" && $11 == "true" { count++ } END { print count + 0 }' "$report")"
          reciprocal_count="$(awk -F, '$1 == "reciprocal" && $18 == "true" { count++ } END { print count + 0 }' "$report")"
          reciprocal_oracle_count="$(awk -F, '$1 == "reciprocal" && $17 == "true" { count++ } END { print count + 0 }' "$report")"
          artifact_count="$(awk -F, '$1 == "artifact_verified" { count=$2 } END { print count + 0 }' "$report")"
          test "$rule_count" -eq 160
          test "$fixed_passes" -eq 0
          test "$imitation_passes" -eq 0
          test "$one_way_passes" -eq 0
          test "$yoked_passes" -eq 0
          test "$distractor_passes" -eq 0
          test "$reciprocal_oracle_count" -eq 160
          test "$reciprocal_count" -eq 160
          test "$artifact_count" -eq 1120
