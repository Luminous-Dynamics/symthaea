name: Melothaea RMI synthetic harness

on:
  pull_request:
    paths:
      - "tools/mel-rmi-synthetic/**"
      - ".github/workflows/mel-rmi-synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-rmi-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Stage isolated crate outside repository workspace
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-rmi-synthetic"
          mkdir -p "$staged/src"
          cp tools/mel-rmi-synthetic/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-rmi-synthetic/Cargo.lock "$staged/Cargo.lock"
          cp tools/mel-rmi-synthetic/src/lib.rs "$staged/src/lib.rs"
          echo "MEL_RMI_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format isolated crate
        run: cargo fmt --check --manifest-path "$MEL_RMI_MANIFEST"
      - name: Test deterministic RMI oracle
        run: cargo test --locked --manifest-path "$MEL_RMI_MANIFEST"
