name: MEL HEAR-016 scene grouping evaluator

on:
  pull_request:
    paths:
      - "research/melothaea-scene-grouping-v0-1/**"
      - "benchmarks/mel/schemas/mel-hear-016-*.schema.json"
      - ".github/workflows/mel-hear-016-scene-grouping.yml"
  push:
    branches: [main]
    paths:
      - "research/melothaea-scene-grouping-v0-1/**"
      - "benchmarks/mel/schemas/mel-hear-016-*.schema.json"
      - ".github/workflows/mel-hear-016-scene-grouping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/melothaea-scene-grouping-v0-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run evaluator tests
        run: cargo test --locked --all-targets
      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
