name: Cargo Workspace Glob Integrity

on:
  push:
    paths:
      - "Cargo.toml"
      - "scripts/check_workspace_glob_members.py"
      - ".github/workflows/workspace-glob-integrity.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "scripts/check_workspace_glob_members.py"
      - ".github/workflows/workspace-glob-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-glob-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check workspace glob members
        run: python3 scripts/check_workspace_glob_members.py
      - name: Resolve Cargo workspace metadata
        run: cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
      - name: Verify STT formatting resolves from the root workspace
        run: cargo fmt --manifest-path Cargo.toml -p symthaea-stt -- --check
