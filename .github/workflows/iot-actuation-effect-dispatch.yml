name: IoT Actuation Effect Dispatch

on:
  pull_request:
    paths:
      - 'crates/bridges/symthaea-iot-actuation-effect-dispatch/**'
      - 'crates/bridges/symthaea-iot-actuation-linearization/**'
      - '.github/workflows/iot-actuation-effect-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iot-actuation-effect-dispatch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Rollback-protected effect-dispatch source contract
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          dispatch = Path('crates/bridges/symthaea-iot-actuation-effect-dispatch')
          src = (dispatch / 'src/lib.rs').read_text()
          code = '\n'.join(
              line for line in src.splitlines()
              if not line.lstrip().startswith('//')
          )
          compact = ''.join(code.split())

          required = [
              'pubtraitDurablePreparedPhysicalEffectAttempt',
              'pubtraitDurablePhysicalEffectAttemptJournal',
              'pubtraitRollbackProtectedPhysicalEffectAttemptJournal',
              'fnpersist_prepared_anchored(',
              'fnpersist_abandoned_before_port_anchored(',
              'fnpersist_adapter_acknowledged_anchored(',
              'fnpersist_adapter_indeterminate_anchored(',
              'pubstructAuthorizedPhysicalEffectRequest',
              'pubtraitPrivilegedPhysicalEffectPort',
              'pubfndispatch_current_attempt_durable',
              "attempt:CurrentActuationAttempt<'_>",
              'J:RollbackProtectedPhysicalEffectAttemptJournal',
              'letcommand=attempt.command();',
              'ifport.device()!=&command.device',
              'ifport.operation()!=&command.operation',
              'ifport.executor()!=&command.executor',
              '.persist_prepared_anchored(&correlation)',
              'attempt.validate_dispatch_window_now()',
              'port.attempt_effect(request)',
              'ProtectedPreparation',
              'AdapterAcknowledgedButProtectionIndeterminate',
              'AdapterAndProtectionIndeterminate',
              'LinearizationAfterProtectedPreparation',
              'PrePortProtectionIndeterminate',
          ]
          missing = [needle for needle in required if needle not in compact]
          if missing:
              raise SystemExit(f'missing rollback-protected effect-dispatch invariant: {missing}')

          ordered = [
              'letcommand=attempt.command();',
              '.persist_prepared_anchored(&correlation)',
              'attempt.validate_dispatch_window_now()',
              'port.attempt_effect(request)',
          ]
          positions = []
          for needle in ordered:
              pos = compact.find(needle)
              if pos < 0:
                  raise SystemExit(f'missing dispatch-order step: {needle}')
              positions.append(pos)
          if positions != sorted(positions) or len(set(positions)) != len(positions):
              raise SystemExit(f'rollback-protected dispatch order changed: {positions}')
          if compact.count('port.attempt_effect(request)') != 1:
              raise SystemExit('privileged port must be invoked exactly once in production dispatch path')
          signature = compact[compact.find('pubfndispatch_current_attempt_durable'):]
          signature = signature[:signature.find('{')]
          if 'DurablePhysicalEffectAttemptJournal' in signature.replace(
              'RollbackProtectedPhysicalEffectAttemptJournal', ''
          ):
              raise SystemExit('production dispatch accepted local-only journal authority')

          forbidden = [
              '#[derive(Clone', 'implCloneforAuthorizedPhysicalEffectRequest',
              'Serialize', 'Deserialize', 'bincode',
              'FinalActuatorPermit', 'TrustBoundFinalActuatorPermit', 'JustInTimeHalLease',
              'CompleteJitHalLease', 'GuardOwnedCurrentState', 'TransportTrustRegistry',
              'InterlockTrustRegistry', 'DeviceRealityTrustRegistry', 'raw_transport_receipt',
              'verify_xenia_transport_receipt(', 'verify_xenia_physical_effect_receipt(',
              'verify_interlock_key_binding(', 'verify_strict(', 'TcpListener', 'TcpStream',
              'UdpSocket', 'tokio::spawn', 'std::process::Command', 'Command::new',
              'std::fs::', 'OpenOptions', 'unsafe {',
          ]
          found = [needle for needle in forbidden if needle in code]
          if found:
              raise SystemExit(f'dispatch reacquired portable authority/verifier/I-O surface: {found}')

          manifest = tomllib.loads((dispatch / 'Cargo.toml').read_text())
          expected = {
              'symthaea-authority',
              'symthaea-iot-actuation-linearization',
              'symthaea-iot-authority',
              'thiserror',
          }
          actual = set(manifest.get('dependencies', {}))
          if actual != expected:
              raise SystemExit(f'production dependency drift: {sorted(actual)}')
          if manifest.get('dev-dependencies'):
              raise SystemExit('effect dispatch unexpectedly acquired dev dependencies')
          features = manifest.get('features', {})
          if features.get('default') != []:
              raise SystemExit('default dispatch features must remain empty')
          if set(features) != {'default', 'qualification-legacy-unjournaled'}:
              raise SystemExit(f'unreviewed dispatch feature surface: {sorted(features)}')

          linearization = tomllib.loads(
              Path('crates/bridges/symthaea-iot-actuation-linearization/Cargo.toml').read_text()
          )
          legacy = linearization['dev-dependencies']['symthaea-iot-actuation-effect-dispatch']
          if legacy.get('features') != ['qualification-legacy-unjournaled']:
              raise SystemExit('legacy unjournaled surface must remain qualification-only')

          journal = tomllib.loads(
              Path('crates/bridges/symthaea-iot-actuation-effect-attempt-journal/Cargo.toml').read_text()
          )
          fixture = journal['dev-dependencies']['symthaea-iot-actuation-effect-dispatch']
          if fixture.get('features') != ['qualification-legacy-unjournaled']:
              raise SystemExit('journal correlation fixture must remain qualification-only')

      - name: Install Rust 1.96 formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Rustfmt successor surface
        run: >-
          cargo +1.96.0 fmt --check
          -p symthaea-iot-actuation-linearization
          -p symthaea-iot-actuation-effect-dispatch
          -p symthaea-iot-actuation-effect-attempt-journal

      - name: Install Rust 1.94 qualification toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Verify exact qualification toolchain
        run: |
          rustc +1.94.0 --version | grep -F 'rustc 1.94.0'
          cargo +1.94.0 --version | grep -F 'cargo 1.94.0'

      - name: Preserve checked-in lock
        run: cp Cargo.lock /tmp/Cargo.lock.before

      - name: Check default protected dispatch without qualification feature
        run: >-
          cargo +1.94.0 check
          -p symthaea-iot-actuation-effect-dispatch
          --lib --no-default-features

      - name: Check inherited exact-command qualification surface
        run: >-
          cargo +1.94.0 check
          -p symthaea-iot-actuation-linearization
          --all-targets

      - name: Check rollback-protected journal package
        run: >-
          cargo +1.94.0 check
          -p symthaea-iot-actuation-effect-attempt-journal
          --all-targets --no-default-features

      - name: Reject unreviewed external dependency drift
        shell: python
        run: |
          import tomllib
          def sourced(path):
              with open(path, 'rb') as f:
                  doc = tomllib.load(f)
              return {
                  (p['name'], p['version'], p.get('source')): p
                  for p in doc.get('package', [])
                  if p.get('source') is not None
              }
          before = sourced('/tmp/Cargo.lock.before')
          after = sourced('Cargo.lock')
          b = set(before); a = set(after)
          added = a - b; removed = b - a
          changed = sorted(k for k in a & b if after[k] != before[k])
          allowed = {
              ('fips204', '0.4.6', 'registry+https://github.com/rust-lang/crates.io-index')
          }
          if not added.issubset(allowed) or removed or changed:
              raise SystemExit(
                  f'external dependency drift: added={sorted(added)}, '
                  f'removed={sorted(removed)}, changed={changed}'
              )

      - name: Re-run inherited matching-port theorem
        run: >-
          cargo +1.94.0 test -p symthaea-iot-actuation-linearization
          --test full_chain
          fixture::real_two_branch_chain_reaches_matching_privileged_port_exactly_once
          -- --exact

      - name: Re-run inherited wrong-port zero-call theorem
        run: >-
          cargo +1.94.0 test -p symthaea-iot-actuation-linearization
          --test full_chain
          fixture::wrong_privileged_port_binding_never_invokes_effect_method
          -- --exact

      - name: Re-run inherited post-call indeterminate theorem
        run: >-
          cargo +1.94.0 test -p symthaea-iot-actuation-linearization
          --test full_chain
          fixture::adapter_error_after_invocation_is_indeterminate_with_exact_correlation
          -- --exact

      - name: Rollback-protected journal regressions
        run: >-
          cargo +1.94.0 test
          -p symthaea-iot-actuation-effect-attempt-journal
          --test protected_store --no-default-features

      - name: Default effect-dispatch package tests
        run: >-
          cargo +1.94.0 test -p symthaea-iot-actuation-effect-dispatch
          --all-targets --no-default-features

      - name: Strict default package-local Clippy
        run: >-
          cargo +1.94.0 clippy
          -p symthaea-iot-actuation-effect-dispatch
          -p symthaea-iot-actuation-effect-attempt-journal
          --all-targets --no-default-features --no-deps -- -D warnings

      - name: Show local-only Cargo.lock bookkeeping
        if: always()
        run: git diff -- Cargo.lock || true
