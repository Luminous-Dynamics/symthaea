name: World Model Seeded Initialization

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - fix/workspace-orphan-core-symthaea-2026-10-29
    paths:
      - "src/dynamics/crate_world_model.rs"
      - "src/bin/cmaq-008-world-model-smoke.rs"
      - "src/bin/cmaq-008-residual-ablation.rs"
      - "src/bin/cmaq-008-action-ranking.rs"
      - ".github/workflows/world-model-seeded-initialization.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - research/world-model-seeded-construction-2026-10-29
    paths:
      - "src/dynamics/crate_world_model.rs"
      - "src/bin/cmaq-008-residual-ablation.rs"
      - "src/bin/cmaq-008-action-ranking.rs"
      - ".github/workflows/world-model-seeded-initialization.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: world-model-seeded-init-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seeded-initialization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Run exact seeded-initialization regression test
        run: >-
          cargo test --lib
          dynamics::crate_world_model::tests::seeded_initialization_replays_weights_and_predictions

      - name: Test CfC gradient update ordering
        run: >-
          cargo test --lib
          dynamics::crate_world_model::tests::target_head_gradient_uses_pre_update_output_projection

      - name: Test the real-world-model transfer smoke binary
        run: cargo test --bin cmaq-008-world-model-smoke

      - name: Run the real-world-model transfer smoke binary
        run: cargo run --bin cmaq-008-world-model-smoke > /tmp/cmaq-008-report.json

      - name: Validate actual-model smoke report and baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          report = json.loads(Path("/tmp/cmaq-008-report.json").read_text())
          assert report["schema_version"] == "cmaq-008-world-model-adapter-v0.1"
          assert report["model"] == "HierarchicalCfCWorldModel"
          assert report["dimensions"] == {"hdc": 16, "hidden": 24}
          assert report["training"] == {"samples": 128, "epochs": 12, "seeds": 5}
          assert report["evaluation_samples_per_regime_per_seed"] == 64
          assert len(report["per_seed"]) == 5
          assert report["heldout_shift"] == "action_effect_reversal"

          regimes = report["regimes"]
          assert set(regimes) == {"source_holdout", "action_effect_reversal"}
          for regime, metrics in regimes.items():
              for key in (
                  "mse", "mae", "persistence_mse", "persistence_mae",
                  "zero_mse", "model_to_persistence_mse_ratio",
              ):
                  assert math.isfinite(metrics[key]) and metrics[key] >= 0.0, (regime, key, metrics)
              assert metrics["persistence_mse"] > 0.0
              assert metrics["zero_mse"] > 0.0
              assert metrics["model_to_persistence_mse_ratio"] >= 0.0

          for row in report["per_seed"]:
              assert len(row["seed"]) == 16
              assert row["training_steps"] == 128 * 12
              for key in (
                  "final_epoch_train_mse", "source_mse", "source_persistence_mse",
                  "reversal_mse", "reversal_persistence_mse",
              ):
                  assert math.isfinite(row[key]) and row[key] >= 0.0, (key, row)

          print("CMAQ-008 actual CfC model, deterministic seeds, held-out action reversal, persistence/zero baselines, and JSON schema validated")
          print(json.dumps({
              regime: {
                  "model_mse": metrics["mse"],
                  "persistence_mse": metrics["persistence_mse"],
                  "mse_ratio_to_persistence": metrics["model_to_persistence_mse_ratio"],
                  "mae": metrics["mae"],
              } for regime, metrics in regimes.items()
          }, sort_keys=True))
          PY
      - name: Test identity-residual world-model methods
        run: cargo test --lib residual_

      - name: Test the absolute-vs-residual CfC ablation
        run: cargo test --bin cmaq-008-residual-ablation

      - name: Run the absolute-vs-residual CfC ablation
        run: cargo run --bin cmaq-008-residual-ablation > /tmp/cmaq-008-residual-report.json

      - name: Validate residual ablation and paired baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          report = json.loads(Path("/tmp/cmaq-008-residual-report.json").read_text())
          assert report["schema_version"] == "cmaq-008-residual-ablation-v0.2"
          assert report["model"] == "HierarchicalCfCWorldModel"
          assert report["dimensions"] == {"hdc": 16, "hidden": 24}
          assert report["training"] == {
              "samples": 128, "epochs": 12, "seeds": 5, "learning_rate": 0.001
          }
          assert report["evaluation_samples_per_regime_per_seed"] == 64
          assert report["regimes"] == ["source_holdout", "action_effect_reversal"]
          linear = report["linear_arx_baseline"]
          assert linear["features"] == 33
          assert linear["ridge"] == 0.001
          for regime in ("source", "action_effect_reversal"):
              for key in ("mse", "mae", "persistence_mse", "zero_mse"):
                  assert math.isfinite(linear[regime][key]) and linear[regime][key] >= 0.0
          # The low-cost linear model must beat persistence on the source law;
          # this is a baseline sanity check, not a requirement that CfC beat ARX.
          assert linear["source"]["mse"] < linear["source"]["persistence_mse"]

          objectives = report["objectives"]
          assert [item["objective"] for item in objectives] == [
              "absolute_next_state", "identity_residual_delta"
          ]
          assert len(objectives) == 2
          for item in objectives:
              assert item["training_steps_per_seed"] == 128 * 12
              assert len(item["per_seed"]) == 5
              for row in item["per_seed"]:
                  assert len(row["seed"]) == 16
                  for key in ("final_epoch_train_mse", "source_mse", "reversal_mse"):
                      assert math.isfinite(row[key]) and row[key] >= 0.0
              for regime in ("source", "action_effect_reversal"):
                  metrics = item[regime]
                  for key in (
                      "mse", "mae", "persistence_mse", "zero_mse",
                      "mse_to_persistence_ratio", "mse_delta_vs_persistence",
                      "mse_delta_vs_persistence_ci95_low",
                      "mse_delta_vs_persistence_ci95_high",
                      "paired_mse_delta_vs_absolute", "paired_mse_delta_ci95_low",
                      "paired_mse_delta_ci95_high", "paired_mse_delta_vs_linear_arx",
                      "paired_linear_ci95_low", "paired_linear_ci95_high",
                  ):
                      assert math.isfinite(metrics[key]), (item["objective"], regime, key)
                  assert metrics["mse"] >= 0.0
                  assert metrics["persistence_mse"] > 0.0
                  assert metrics["mse_delta_vs_persistence_ci95_low"] <= metrics["mse_delta_vs_persistence_ci95_high"]
                  assert metrics["paired_mse_delta_ci95_low"] <= metrics["paired_mse_delta_ci95_high"]
                  assert metrics["paired_linear_ci95_low"] <= metrics["paired_linear_ci95_high"]

          for regime in ("source", "action_effect_reversal"):
              absolute = objectives[0][regime]
              residual = objectives[1][regime]
              assert abs(absolute["paired_mse_delta_vs_absolute"]) <= 1e-10
              assert abs(absolute["paired_mse_delta_ci95_low"]) <= 1e-10
              assert abs(absolute["paired_mse_delta_ci95_high"]) <= 1e-10
              assert residual["paired_mse_delta_ci95_low"] <= residual["paired_mse_delta_ci95_high"]

          print("CMAQ-008 absolute-vs-residual CfC report, paired seeds, persistence and ridge-ARX baselines, and confidence intervals validated")
          print(json.dumps({
              "linear_arx_baseline": linear,
              regime: {
                  objective["objective"]: {
                      "mse": objective[regime]["mse"],
                      "persistence_mse": objective[regime]["persistence_mse"],
                      "mse_ratio_to_persistence": objective[regime]["mse_to_persistence_ratio"],
                      "paired_mse_delta_vs_absolute": objective[regime]["paired_mse_delta_vs_absolute"],
                      "paired_mse_delta_vs_linear_arx": objective[regime]["paired_mse_delta_vs_linear_arx"],
                      "paired_ci95": [
                          objective[regime]["paired_mse_delta_ci95_low"],
                          objective[regime]["paired_mse_delta_ci95_high"],
                      ],
                  } for objective in objectives
              } for regime in ("source", "action_effect_reversal")
          }, sort_keys=True))
          PY
      - name: Test real CfC counterfactual action ranking
        run: cargo test --bin cmaq-008-action-ranking

      - name: Run real CfC counterfactual action ranking
        run: cargo run --bin cmaq-008-action-ranking > /tmp/cmaq-008-action-ranking.json

      - name: Validate action ranking, regret and held-out shift
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          report = json.loads(Path("/tmp/cmaq-008-action-ranking.json").read_text())
          assert report["schema_version"] == "cmaq-008-action-ranking-v0.2"
          assert report["model"] == "HierarchicalCfCWorldModel"
          assert report["dimensions"] == {"hdc": 16, "hidden": 24}
          assert report["training"] == {
              "samples": 192, "epochs": 12, "seeds": 10, "learning_rate": 0.001
          }
          assert report["evaluation_states_per_regime_per_seed"] == 96
          assert report["candidate_actions"] == ["zero", "cancel_source", "reverse_source"]
          assert report["model_forward_calls_per_decision"] == 3
          assert report["direct_policy"].startswith("best constant action transform selected from logged training outcomes")
          assert set(report["regimes"]) == {"source_holdout", "action_effect_reversal", "interaction_sign_reversal"}
          assert len(report["per_seed"]) == 10

          for regime, row in report["regimes"].items():
              for key in (
                  "model_reward", "direct_reward", "oracle_reward", "model_lift_vs_direct",
                  "model_regret", "direct_regret", "model_beats_direct_rate", "model_harm_rate",
                  "oracle_action_agreement", "pairwise_ranking_accuracy",
                  "reward_prediction_mae", "next_state_prediction_mse", "model_action_override_rate",
              ):
                  assert math.isfinite(row[key]), (regime, key, row)
              assert len(row["lift_ci95"]) == 2
              assert row["lift_ci95"][0] <= row["lift_ci95"][1]
              for key in (
                  "model_beats_direct_rate", "model_harm_rate", "oracle_action_agreement",
                  "pairwise_ranking_accuracy", "model_action_override_rate",
              ):
                  assert 0.0 <= row[key] <= 1.0
              assert row["model_regret"] >= -1e-9
              assert row["direct_regret"] >= -1e-9
              assert row["oracle_reward"] >= row["model_reward"] - 1e-8
              assert row["oracle_reward"] >= row["direct_reward"] - 1e-8
              assert abs(row["model_lift_vs_direct"] - (row["model_reward"] - row["direct_reward"])) < 1e-8
              assert abs(row["model_regret"] - (row["oracle_reward"] - row["model_reward"])) < 1e-8
              assert abs(row["direct_regret"] - (row["oracle_reward"] - row["direct_reward"])) < 1e-8
              assert row["model_beats_direct_rate"] + row["model_harm_rate"] <= 1.0 + 1e-8

          for seed in report["per_seed"]:
              assert len(seed["seed"]) == 16
              assert seed["direct_mode"] in {"zero", "cancel_source", "reverse_source"}
              assert seed["training_steps"] == 192 * 12
              for key in (
                  "training_mse", "source_lift", "source_regret", "source_pairwise_accuracy",
                  "reversal_lift", "reversal_regret", "reversal_pairwise_accuracy",
                  "interaction_lift", "interaction_regret", "interaction_pairwise_accuracy",
              ):
                  assert math.isfinite(seed[key]), (key, seed)

          print("CMAQ-008 actual CfC counterfactual action ranking, logged direct baseline, oracle regret, paired seed interval and held-out action-effect and interaction shifts validated")
          print(json.dumps({
              regime: {
                  "model_lift_vs_direct": row["model_lift_vs_direct"],
                  "lift_ci95": row["lift_ci95"],
                  "model_regret": row["model_regret"],
                  "direct_regret": row["direct_regret"],
                  "model_harm_rate": row["model_harm_rate"],
                  "pairwise_ranking_accuracy": row["pairwise_ranking_accuracy"],
                  "oracle_action_agreement": row["oracle_action_agreement"],
                  "reward_prediction_mae": row["reward_prediction_mae"],
              }
              for regime, row in report["regimes"].items()
          }, sort_keys=True))
          PY
