name: Morphology Continuity Oracle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/morphology-continuity-oracle/**"
      - ".github/workflows/morphology-continuity-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Standalone Rust oracle
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Capture source tree identity
        id: source
        shell: bash
        run: echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify frozen request digest
        run: echo "9348ff465116c23bacf9dfa5f1ed6ce98bb14bfa042b228800d6406ef542681f  tools/morphology-continuity-oracle/canonical_request_v0_1.txt" | sha256sum --check -

      - name: Verify frozen active-evidence request digest
        run: echo "bdbc62fb67b3461d91f51789a17eb940dddc750c50306190e599e9eec6dd6b18  tools/morphology-continuity-oracle/active_evidence_request_v0_1.txt" | sha256sum --check -

      - name: Verify frozen metamorphic evidence request digest
        run: echo "4aadbcbcaccb4bf1bc96cf1e650b8c967b3ef798520cd4934885f4063c58a182  tools/morphology-continuity-oracle/active_evidence_request_v0_2.txt" | sha256sum --check -

      - name: Verify frozen decision-sensitive request digest
        run: echo "39960eca4c0b5e86729a83cb4f560515b77ce00ed9d2cdd996367fdfc663aa4e  tools/morphology-continuity-oracle/decision_sensitive_request_v0_3.txt" | sha256sum --check -
      - name: Verify frozen noisy-evidence request digest
        run: echo "6ca5d6f5a24c75c9b45add6257e1bdd72c8328bd97bcab891f9096bde3d75bdf  tools/morphology-continuity-oracle/decision_sensitive_request_v0_4.txt" | sha256sum --check -
      - name: Verify frozen decision-sensitivity request digest
        run: echo "0c3c496acb70af6290d94e9033f244483d733b382868f094cdf0400e317c82c1  tools/morphology-continuity-oracle/decision_sensitivity_request_v0_5.txt" | sha256sum --check -
      - name: Verify frozen robust evidence request digest
        run: echo "ad9cc12fcf128e2435ad608a04642bb8895ef94372c93eb247aa9fa86882d146  tools/morphology-continuity-oracle/robust_evidence_request_v0_6.txt" | sha256sum --check -
      - name: Verify frozen model-misspecification request digest
        run: echo "555c5afdcde22986f0999ca489ff5d97b7c8b21a5035fa6f464f9ed7e456358f  tools/morphology-continuity-oracle/model_misspecification_request_v0_7.txt" | sha256sum --check -
      - name: Verify frozen asymmetric-error request digest
        run: echo "649d8dfb0ff79d729efb20033a14f185d17f6628fba5b724c27c4548cccc8118  tools/morphology-continuity-oracle/asymmetric_error_request_v0_8.txt" | sha256sum --check -

      - name: Verify frozen calibration-interval request digest
        run: echo "4f68fc455cebdff3c6e11d1a0e6292f6f119a89715345b983bc26704e8924312  tools/morphology-continuity-oracle/calibration_interval_request_v0_9.txt" | sha256sum --check -

      - name: Verify frozen class-conditional robustness request digest
        run: echo "ea56ce4d22ef2baf5e2eaad4469541a058e48d70a5829b4d85f58705537f1580  tools/morphology-continuity-oracle/class_conditional_robustness_request_v1_0.txt" | sha256sum --check -

      - name: Verify frozen exact class-conditional coverage request digest
        run: echo "902a08227de0eb386fc1d31080d1946dc2b24cede8dcb1be0682eecdfc633316  tools/morphology-continuity-oracle/class_conditional_robustness_request_v1_1.txt" | sha256sum --check -

      - name: Verify frozen class-conditional coverage grid request digest
        run: echo "5ff97b8927368172994281f3cc61f934067d3da7a781bf53328631d45d3c831a  tools/morphology-continuity-oracle/class_conditional_coverage_grid_v1_2.txt" | sha256sum --check -

      - name: Verify frozen coverage-width tradeoff request digest
        run: echo "fb25a771fe8754e8b5185d5b93f2297b116e15896d0be3bbb23783f0908cf659  tools/morphology-continuity-oracle/coverage_width_tradeoff_v1_3.txt" | sha256sum --check -

      - name: Verify frozen joint prior-shift robustness request digest
        run: echo "b975e6a90c437868d49c25f2e78c7c448a07130ae6fdc4c2b89e8917a930aaeb  tools/morphology-continuity-oracle/joint_prior_confusion_robustness_v1_4.txt" | sha256sum --check -

      - name: Formatting
        run: cargo fmt --manifest-path tools/morphology-continuity-oracle/Cargo.toml -- --check

      - name: Reference tests
        run: cargo test --locked --manifest-path tools/morphology-continuity-oracle/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/morphology-continuity-oracle/Cargo.toml --all-targets -- -D warnings

      - name: Verify deterministic receipt and semantic gates
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_TREE_SHA: ${{ steps.source.outputs.tree_sha }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cargo run --locked --quiet --manifest-path tools/morphology-continuity-oracle/Cargo.toml > "$temp_dir/first.json"
          cargo run --quiet --manifest-path tools/morphology-continuity-oracle/Cargo.toml > "$temp_dir/second.json"
          cmp "$temp_dir/first.json" "$temp_dir/second.json"
          jq -e --arg commit "$SOURCE_COMMIT" --arg tree "$SOURCE_TREE_SHA" '
            .schema == "morphology-continuity-oracle/v0.1"
            and .source_commit == $commit
            and .source_tree_sha == $tree
            and .request_sha256 == "9348ff465116c23bacf9dfa5f1ed6ce98bb14bfa042b228800d6406ef542681f"
            and .fixture == "chair-backrest-removed"
            and .current_exact_matches == ["table"]
            and .compatible_histories == ["chair", "table"]
            and .ground_truth_target == "chair"
            and .target_evidence == "missing"
            and .disposition == "AbstainAmbiguousHistory"
            and .restoration_oracle == false
          ' "$temp_dir/first.json" > /dev/null
