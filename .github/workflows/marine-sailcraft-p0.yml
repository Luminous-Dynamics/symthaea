name: Marine sailcraft P0 contract

on:
  push:
    branches: ["research/marine-sail-autonomy-v0-1"]
    paths:
      - "crates/domains/symthaea-sailcraft/**"
      - ".github/workflows/marine-sailcraft-p0.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-sailcraft/**"
      - ".github/workflows/marine-sailcraft-p0.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marine-sailcraft-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Confirm exact head
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Create isolated validation manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sailcraft-p0"
          cat > "$RUNNER_TEMP/sailcraft-p0/Cargo.toml" <<EOF
          [package]
          name = "symthaea-sailcraft-p0-validation"
          version = "0.1.0"
          edition = "2024"

          [lib]
          path = "$GITHUB_WORKSPACE/crates/domains/symthaea-sailcraft/src/lib.rs"
          EOF
      - name: Format sailcraft kernel without loading unrelated workspace members
        run: rustfmt --edition 2024 --check crates/domains/symthaea-sailcraft/src/lib.rs
      - name: Unit tests in isolated manifest
        run: cargo test --manifest-path "$RUNNER_TEMP/sailcraft-p0/Cargo.toml" --all-targets
      - name: Strict Clippy in isolated manifest
        run: cargo clippy --manifest-path "$RUNNER_TEMP/sailcraft-p0/Cargo.toml" --all-targets -- -D warnings
