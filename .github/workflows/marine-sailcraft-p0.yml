name: Marine sailcraft P0 contract

on:
  push:
    branches: ["research/marine-sail-autonomy-v0-1"]
    paths:
      - "crates/domains/symthaea-sailcraft/**"
      - ".github/workflows/marine-sailcraft-p0.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-sailcraft/**"
      - ".github/workflows/marine-sailcraft-p0.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marine-sailcraft-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Confirm exact head
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Format package Rust sources
        run: cargo fmt --manifest-path crates/domains/symthaea-sailcraft/Cargo.toml --package symthaea-sailcraft

      - name: Check normalized format
        run: cargo fmt --manifest-path crates/domains/symthaea-sailcraft/Cargo.toml --package symthaea-sailcraft -- --check
      - name: Unit tests
        run: cargo test --locked -p symthaea-sailcraft
      - name: Strict Clippy
        run: cargo clippy --locked -p symthaea-sailcraft --all-targets -- -D warnings
      - name: Commit only the tested formatter tree
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/domains/symthaea-sailcraft/src
          tested_tree="$(git write-tree)"
          if ! git diff --cached --quiet; then
            git commit -m "chore(marine): format sailcraft route evaluators"
            commit_sha="$(git rev-parse HEAD)"
            committed_tree="$(git rev-parse HEAD^{tree})"
            test "$tested_tree" = "$committed_tree"
            git push origin "HEAD:$TARGET_BRANCH"
            {
              echo "### Verified sailcraft source normalization"
              echo "- Tested tree: `$tested_tree`"
              echo "- Commit pushed: `$commit_sha`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sailcraft Rust sources were already normalized." >> "$GITHUB_STEP_SUMMARY"
          fi
