name: Marine sailcraft robust route P1 contract

on:
  push:
    branches: ["research/marine-sail-robust-route-v0-1"]
    paths:
      - "crates/domains/symthaea-sailcraft/**"
      - ".github/workflows/marine-sailcraft-p0.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-sailcraft/**"
      - ".github/workflows/marine-sailcraft-p0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marine-sailcraft-robust-p1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Confirm exact head
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Create isolated validation manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sailcraft-robust-p1"
          cat > "$RUNNER_TEMP/sailcraft-robust-p1/Cargo.toml" <<EOF
          [package]
          name = "symthaea-sailcraft-robust-p1-validation"
          version = "0.1.0"
          edition = "2024"

          [lib]
          path = "$GITHUB_WORKSPACE/crates/domains/symthaea-sailcraft/src/lib.rs"
          EOF
      - name: Apply canonical Rust formatting in isolated checkout
        run: rustfmt --edition 2024 crates/domains/symthaea-sailcraft/src/lib.rs crates/domains/symthaea-sailcraft/src/robust.rs crates/domains/symthaea-sailcraft/src/transition.rs
      - name: Verify normalized Rust formatting
        run: rustfmt --edition 2024 --check crates/domains/symthaea-sailcraft/src/lib.rs crates/domains/symthaea-sailcraft/src/robust.rs crates/domains/symthaea-sailcraft/src/transition.rs
      - name: Run isolated P0 and robust-route Rust tests
        run: cargo test --manifest-path "$RUNNER_TEMP/sailcraft-robust-p1/Cargo.toml" --all-targets
      - name: Run strict Clippy for isolated P0 and robust-route kernel
        run: cargo clippy --manifest-path "$RUNNER_TEMP/sailcraft-robust-p1/Cargo.toml" --all-targets -- -D warnings
      - name: Commit only the source tree that passed formatting, tests and Clippy
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/domains/symthaea-sailcraft/src/lib.rs crates/domains/symthaea-sailcraft/src/robust.rs crates/domains/symthaea-sailcraft/src/transition.rs
          tested_tree="$(git write-tree)"
          if ! git diff --cached --quiet; then
            git commit -m "chore(marine): normalize robust sailcraft evaluator sources"
            commit_sha="$(git rev-parse HEAD)"
            committed_tree="$(git rev-parse HEAD^{tree})"
            test "$tested_tree" = "$committed_tree"
            git push origin "HEAD:$TARGET_BRANCH"
            {
              echo "### Verified sailcraft P1 source normalization"
              echo "- Tested source tree: `$tested_tree`"
              echo "- Commit pushed: `$commit_sha`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sailcraft P1 Rust sources were already normalized." >> "$GITHUB_STEP_SUMMARY"
          fi
