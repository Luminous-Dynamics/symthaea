name: Causal physics lockfile reconciliation

on:
  push:
    branches:
      - research/causal-temporal-physics-v0.1
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/domains/symthaea-*/Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: causal-physics-lockfile-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Record source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_tree_clean=$(test -z "$(git status --porcelain)" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          rustc --version
          cargo --version

      - name: Regenerate full workspace lockfile
        run: cargo generate-lockfile

      - name: Commit regenerated lockfile to the research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(physics): commit pinned full-workspace lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "validated_source_head=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify lockfile is self-consistent
        run: cargo metadata --locked --format-version 1 > cargo-metadata.json

      - name: Validate focused physics libraries with locked graph
        run: |
          set -euo pipefail
          for package in \
            symthaea-chain-theory-audit \
            symthaea-fractal-time-lab \
            symthaea-causal-set-lab \
            symthaea-metric-geometry-lab \
            symthaea-science-evidence \
            symthaea-uap-observatory
          do
            cargo test --locked -p "$package" --lib
          done

      - name: Upload reconciled lockfile and validation metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-physics-lockfile-${{ github.sha }}
          path: |
            Cargo.lock
            cargo-metadata.json
          if-no-files-found: error
          retention-days: 7
