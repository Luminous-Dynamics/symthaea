name: QUAL promotion reservation v1 deterministic lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reservation-lab:
    if: github.repository == 'Luminous-Dynamics/symthaea' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Prove trusted checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq "claim_ceiling=deterministic local transaction/reconciliation model only" scripts/validate_promotion_reservation_v1.py
          grep -Fq "promotion_authority=false" scripts/validate_promotion_reservation_v1.py

      - name: Self-audit independent oracle structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path("scripts/validate_promotion_reservation_v1.py")
          tree = ast.parse(path.read_text(), filename=str(path))

          ledger = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "Ledger"
          )
          methods = {
              node.name: len(node.args.args)
              for node in ledger.body
              if isinstance(node, ast.FunctionDef)
          }
          expected_signatures = {
              "prepare_dispatch": 5,  # self + four fence/attempt inputs
              "record_unknown": 2,    # self + operation identity
              "reconcile_complete": 3,  # self + operation + receipt
          }
          assert {k: methods.get(k) for k in expected_signatures} == expected_signatures, (
              f"Ledger method signature drift: {methods}"
          )

          top_level_classes = {
              node.name
              for node in tree.body
              if isinstance(node, ast.ClassDef)
          }
          required_classes = {
              "ProviderMergeResultV1",
              "PromotionCausalResolutionV1",
              "ProviderResultRetentionV1",
              "ProviderCaptureIntegrityV1",
              "ProviderSourceAuthenticationV1",
              "ProviderAttestationV1",
              "ProviderEvidenceEnvelopeV1",
              "ProviderWebhookReceiptV1",
              "ProviderPullRequestMergeObservationV1",
              "PromotionStackEffectSetV1",
              "PromotionStackEffectEvidenceV1",
              "PromotionStackEffectEvidenceSetV1",
              "ProviderDeliveryRegistryV1",
              "ProviderTopologyBindingV1",
          }
          assert required_classes <= top_level_classes, (
              f"Required causal classes missing: {sorted(required_classes - top_level_classes)}"
          )

          causal_outcomes = {
              "requested-effect-causal",
              "stack-effect-causal",
              "effect-observed-only",
              "causality-unestablished",
          }
          source = path.read_text()
          for outcome in causal_outcomes:
              assert f'"{outcome}"' in source, f"Missing causal outcome: {outcome}"

          retention_states = {
              "provider-result-captured-locally",
              "provider-result-provider-recoverable",
              "provider-result-expired",
              "provider-result-unavailable",
              "invalid-retention-state",
          }
          for state in retention_states:
              assert f'"{state}"' in source, f"Missing retention state: {state}"

          authenticity_markers = {
              "HMAC-SHA256",
              "authenticated-api-channel",
              "webhook-hmac-verified",
              "local-untrusted",
              "delivery-id-conflict",
              "duplicate-identical",
          }
          for marker in authenticity_markers:
              assert f'"{marker}"' in source, f"Missing authenticity marker: {marker}"

          webhook_context_fields = {
              "hook_id",
              "event_type",
              "repository",
              "delivery_id",
              "payload_bytes_digest",
          }
          semantic_webhook_fields = {
              "pull_request",
              "merged",
              "merge_commit_sha",
              "head",
              "action",
          }
          for field in semantic_webhook_fields:
              assert field in source, f"Missing webhook semantic field: {field}"

          stack_effect_derivation_markers = {
              "from_webhook_observations",
              "to_effect_for_stack_entry",
              "stack_webhook_observation",
              "PromotionStackEffectEvidenceSetV1",
              "to_provenance_effect",
              "to_compact_effect_set",
          }
          for marker in stack_effect_derivation_markers:
              assert marker in source, f"Missing stack-effect derivation marker: {marker}"

          effect_provenance_fields = {
              "source_delivery_id",
              "source_payload_digest",
              "source_hook_id",
              "source_event_type",
              "source_repository",
              "source_authentication",
          }
          for field in effect_provenance_fields:
              assert field in source, f"Missing effect provenance field: {field}"
          for field in webhook_context_fields:
              assert field in source, f"Missing webhook context field: {field}"

          expected_call_args = {
              "prepare_dispatch": 4,    # self omitted; four explicit inputs
              "record_unknown": 1,       # self omitted; operation identity
              "reconcile_complete": 2,   # self omitted; operation + receipt
          }
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Attribute):
                  continue
              expected = expected_call_args.get(node.func.attr)
              if expected is None:
                  continue
              assert len(node.args) == expected and not node.keywords, (
                  f"{node.func.attr} call-shape drift: args={len(node.args)} "
                  f"keywords={len(node.keywords)}"
              )

          defined = {
              node.name
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name.startswith("test_")
          }
          assignment = next(
              node for node in tree.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "TESTS"
                  for target in node.targets
              )
          )
          registered = {
              elt.id
              for elt in assignment.value.elts
              if isinstance(elt, ast.Name)
          }
          assert defined == registered, (
              f"Oracle test registry mismatch: missing={sorted(defined - registered)} "
              f"extra={sorted(registered - defined)}"
          )
          print(f"oracle_static_audit=PASS tests={len(defined)}")
          PY

      - name: Compile and run Rust reference transaction
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test validation/promotion_reservation_v1.rs -o /tmp/promotion-reservation-v1-tests
          /tmp/promotion-reservation-v1-tests --nocapture | tee /tmp/promotion-reservation-v1-rust.out

      - name: Run independent Python oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_promotion_reservation_v1.py | tee /tmp/promotion-reservation-v1-python.out

      - name: Record model evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Promotion Reservation v1 deterministic lab"
            echo
            echo "trusted_head=$GITHUB_SHA"
            echo "rust_reference=validation/promotion_reservation_v1.rs"
            echo "python_oracle=scripts/validate_promotion_reservation_v1.py"
            echo "promotion_authority=false"
            echo "provider_dispatch=not invoked"
            echo
            echo "### Rust reference"
            cat /tmp/promotion-reservation-v1-rust.out
            echo
            echo "### Python oracle"
            cat /tmp/promotion-reservation-v1-python.out
          } >> "$GITHUB_STEP_SUMMARY"
