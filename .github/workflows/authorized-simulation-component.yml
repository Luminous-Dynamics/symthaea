name: Authorized Simulation Component

on:
  pull_request:
    paths:
      - "crates/core/symthaea-extension-admission/**"
      - "crates/core/symthaea-extension-core/**"
      - "crates/core/symthaea-extension-registry/**"
      - "crates/core/symthaea-extension-router/**"
      - "crates/bridges/symthaea-extension-host/**"
      - "crates/bridges/symthaea-extension-simulation-host/**"
      - "crates/bridges/symthaea-extension-simulation-backend/**"
      - "crates/bridges/symthaea-ngspice-bridge/**"
      - "crates/bridges/symthaea-sim-bridge/**"
      - "crates/bridges/symthaea-sim-digest/**"
      - "crates/bridges/symthaea-sim-extension-routing/**"
      - "crates/bridges/symthaea-sim-release/**"
      - "examples/extensions/hello-simulation/**"
      - ".github/workflows/authorized-simulation-component.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  authorized-simulation-component:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Cargo and Component builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            examples/extensions/hello-simulation/target
          key: ${{ runner.os }}-authorized-simulation-${{ hashFiles('Cargo.lock', 'crates/bridges/symthaea-extension-simulation-backend/**', 'crates/bridges/symthaea-sim-extension-routing/**', 'crates/bridges/symthaea-sim-release/**', 'crates/bridges/symthaea-ngspice-bridge/**', 'examples/extensions/hello-simulation/**') }}
          restore-keys: |
            ${{ runner.os }}-authorized-simulation-

      - name: Reconcile candidate root lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          git diff -- Cargo.lock > authorized-simulation-cargo-lock.patch
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the joined workspace graph."
          else
            echo "Cargo.lock requires the following generated update:"
            cat authorized-simulation-cargo-lock.patch
          fi

      - name: Upload candidate Cargo.lock patch
        uses: actions/upload-artifact@v4
        with:
          name: authorized-simulation-cargo-lock-patch
          path: authorized-simulation-cargo-lock.patch
          if-no-files-found: error

      - name: Require standalone guest WIT parity
        run: |
          cmp crates/core/symthaea-extension-core/wit/extension-control.wit \
              examples/extensions/hello-simulation/wit/extension-control.wit
          cmp crates/core/symthaea-extension-core/wit/simulation-provider.wit \
              examples/extensions/hello-simulation/wit/simulation-provider.wit

      - name: Build exact standalone simulation Component
        run: |
          cargo build \
            --manifest-path examples/extensions/hello-simulation/Cargo.toml \
            --target wasm32-wasip2 \
            --release
          component="examples/extensions/hello-simulation/target/wasm32-wasip2/release/symthaea_hello_simulation_extension.wasm"
          test -s "$component"
          sha256sum "$component" examples/extensions/hello-simulation/manifest.json

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check joined authority/runtime/evidence/release crates
        run: |
          cargo check --locked \
            -p symthaea-extension-simulation-backend \
            -p symthaea-sim-extension-routing \
            -p symthaea-sim-release
          cargo check --locked -p symthaea-ngspice-bridge --features extension-routing

      - name: Test joined authority/runtime/evidence/release crates
        run: |
          cargo test --locked \
            -p symthaea-extension-simulation-backend \
            -p symthaea-sim-extension-routing \
            -p symthaea-sim-release
          cargo test --locked -p symthaea-ngspice-bridge --features extension-routing

      - name: Strict Clippy joined crates
        run: |
          cargo clippy --locked \
            -p symthaea-extension-simulation-backend \
            -p symthaea-sim-extension-routing \
            -p symthaea-sim-release \
            --all-targets -- -D warnings
          cargo clippy --locked -p symthaea-ngspice-bridge \
            --features extension-routing --all-targets -- -D warnings

      - name: Execute exact admitted Component integration corpus
        run: |
          cargo test --locked \
            -p symthaea-extension-simulation-backend \
            --test hello_component \
            -- --ignored --test-threads=1
          cargo test --locked \
            -p symthaea-sim-release \
            --test hello_release \
            -- --ignored --test-threads=1

      - name: Record exact qualification subject
        run: |
          component="examples/extensions/hello-simulation/target/wasm32-wasip2/release/symthaea_hello_simulation_extension.wasm"
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "manifest_sha256=$(sha256sum examples/extensions/hello-simulation/manifest.json | cut -d' ' -f1)"
            echo "component_sha256=$(sha256sum "$component" | cut -d' ' -f1)"
            echo "release_profile=symthaea.simulation.release.v1"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } | tee authorized-simulation-receipt.txt

      - name: Upload qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: authorized-simulation-receipt
          path: authorized-simulation-receipt.txt
          if-no-files-found: error

      - name: Require committed root lockfile
        run: git diff --exit-code -- Cargo.lock
