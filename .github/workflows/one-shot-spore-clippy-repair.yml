name: One-shot Spore Clippy repair

on:
  push:
    branches:
      - feat/spore-clean-host-rehydration-v1
    paths:
      - ".github/workflows/one-shot-spore-clippy-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-qualify-commit:
    name: Repair, qualify, and remove helper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert self-pinned clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Apply exactly the observed collapsible-if repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/domains/symthaea-spore/src/host_rehydration.rs")
          text = path.read_text()
          old = '''                    if let Some(restore) = &self.protected_restore {\n                        if check.expectation_digest.as_deref()\n                            != Some(restore.manifest_digest.as_str())\n                        {\n                            errors.push(\n                                HostRehydrationManifestError::ProtectedDataIntegrityExpectationMismatch {\n                                    check_id: check.check_id.clone(),\n                                },\n                            );\n                        }\n                    }\n'''
          new = '''                    if let Some(restore) = &self.protected_restore\n                        && check.expectation_digest.as_deref()\n                            != Some(restore.manifest_digest.as_str())\n                    {\n                        errors.push(\n                            HostRehydrationManifestError::ProtectedDataIntegrityExpectationMismatch {\n                                check_id: check.check_id.clone(),\n                            },\n                        );\n                    }\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one observed nested-if pattern, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Guard repair scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "crates/domains/symthaea-spore/src/host_rehydration.rs" ]]; then
            printf 'Unexpected repair scope:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --check -p symthaea-spore

      - name: Rehydration contract tests
        run: cargo test -p symthaea-spore --lib host_rehydration::tests

      - name: Clippy
        run: cargo clippy -p symthaea-spore --lib -- -D warnings

      - name: Commit qualified mechanical repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-spore-clippy-repair.yml
          git add crates/domains/symthaea-spore/src/host_rehydration.rs
          git diff --cached --name-only
          git commit -m "chore(spore): apply qualified rehydration clippy repair"
          git push origin HEAD:feat/spore-clean-host-rehydration-v1
