name: PIE-002C Rustfmt Maintenance

on:
  push:
    branches:
      - maint/pie-002c-rustfmt-35887554
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Format and verify PIE-002C candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: 35887554861c9cd3127b15973d03a769b479a961
      TARGET_BRANCH: feat/pie-002c-production-thermal-approach
      PACKAGE: symthaea-planetary-industry
      TARGET_FILE: crates/domains/symthaea-planetary-industry/src/thermal_approach.rs
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable starting point
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "1965f58fcea91ae83a73714fa93f0f22ad1abc20"

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy

      - name: Apply pinned rustfmt to PIE-002C source
        run: rustfmt --edition 2024 "$TARGET_FILE"

      - name: Enforce formatting-only scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET_FILE"
          git diff --check

      - name: Verify formatted package
        run: |
          set -euo pipefail
          cargo fmt -p "$PACKAGE" -- --check
          cargo check -p "$PACKAGE" --all-targets --locked
          cargo test -p "$PACKAGE" --all-targets --locked --no-fail-fast
          cargo clippy -p "$PACKAGE" --all-targets --locked -- -D warnings

      - name: Commit formatting-only successor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_FILE"
          git diff --cached --quiet && { echo "rustfmt produced no change"; exit 1; }
          git commit -m "style(pie): rustfmt PIE-002C thermal approach"
          git push origin "HEAD:$TARGET_BRANCH"
