name: EQC Reference Seed Validation

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "xtask/src/eqc.rs"
      - "xtask/src/main.rs"
      - "docs/research/eqc-task-v0.1.schema.json"
      - "docs/research/eqc-run-receipt-v0.1.schema.json"
      - "docs/research/eqc-seed-corpus-v0.1.json"
      - "docs/research/eqc-fixtures/**"
      - ".github/workflows/eqc-reference-validation.yml"
  push:
    branches: [main, feat/eqc-rust-reference-evaluator-2026-11-26]
    paths:
      - "xtask/src/eqc.rs"
      - "xtask/src/main.rs"
      - "docs/research/eqc-task-v0.1.schema.json"
      - "docs/research/eqc-run-receipt-v0.1.schema.json"
      - "docs/research/eqc-seed-corpus-v0.1.json"
      - "docs/research/eqc-fixtures/**"
      - ".github/workflows/eqc-reference-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eqc-reference-validation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  reference-seed:
    name: Rust reference/no-op/always-allow controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR merge tree
        uses: actions/checkout@v4
        with:
          # PR merge SHA includes the workspace-hardening base branch.
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format xtask
        run: cargo fmt --manifest-path xtask/Cargo.toml -p xtask -- --check

      - name: Reconcile workspace lockfile on the owned feature branch
        env:
          SOURCE_HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # The base workspace PR changes the member/exclusion graph. Resolve
          # that graph once, commit any lockfile delta, then require all later
          # checks to pass with --locked.
          cargo metadata --format-version 1 > "$RUNNER_TEMP/eqc-metadata-unlocked.json"
          jq -e '.packages | length > 0' "$RUNNER_TEMP/eqc-metadata-unlocked.json" >/dev/null

          if ! git diff --quiet -- Cargo.lock; then
            if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "feat/eqc-rust-reference-evaluator-2026-11-26" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Cargo.lock
              git commit -m "chore(deps): reconcile EQC workspace Cargo.lock"
              git push origin HEAD:feat/eqc-rust-reference-evaluator-2026-11-26
            else
              echo "Cargo.lock requires reconciliation; only the owned feature-branch push may persist it." >&2
              git diff -- Cargo.lock >&2
              exit 1
            fi
          else
            echo "Cargo.lock already matches the workspace graph."
          fi

      - name: Run xtask unit and negative-control tests (locked)
        run: cargo test --locked -p xtask

      - name: Evaluate public EQC seed with reference policy
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- eqc-validate \
            --corpus docs/research/eqc-seed-corpus-v0.1.json \
            --out "$RUNNER_TEMP/eqc-reference-report.json"
          jq -e '
            .evaluation_mode == "reference_contract_only_not_system_under_test" and
            .task_count == 4 and
            .reference_pass_count == 4 and
            .no_op_fails_positive_controls == true and
            .allow_all_fails_negative_controls == true
          ' "$RUNNER_TEMP/eqc-reference-report.json" >/dev/null
          cat "$RUNNER_TEMP/eqc-reference-report.json"

      - name: Record exact source and merge revisions
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          {
            echo "workflow_sha=$GITHUB_SHA"
            echo "checked_out_final_head=$(git rev-parse HEAD)"
            echo "source_head_sha=$PR_HEAD_SHA"
            echo "base_sha=$PR_BASE_SHA"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } > "$RUNNER_TEMP/eqc-run-metadata.txt"

      - name: Preserve seed validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: eqc-reference-seed-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/eqc-reference-report.json
            ${{ runner.temp }}/eqc-run-metadata.txt
          if-no-files-found: error
          retention-days: 90
