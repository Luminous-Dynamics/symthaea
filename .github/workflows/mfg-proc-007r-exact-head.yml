name: MFG-PROC-007R Current-Main Contract Replay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "crates/domains/symthaea-manufacturing-process/**"
      - "crates/domains/symthaea-manufacturing-contracts/**"
      - ".github/workflows/mfg-proc-007r-exact-head.yml"
  push:
    branches:
      - "replay/mfg-proc-007-contract-substrate-v1"
    paths:
      - "crates/domains/symthaea-manufacturing-process/**"
      - "crates/domains/symthaea-manufacturing-contracts/**"
      - ".github/workflows/mfg-proc-007r-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfg-proc-007r-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  public-contract-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Check formatting
        run: |
          cargo fmt --package symthaea-manufacturing-process \
            --package symthaea-manufacturing-contracts -- --check
      - name: Test exact replayed public crates
        run: |
          cargo test -p symthaea-manufacturing-process \
            -p symthaea-manufacturing-contracts
      - name: Strict Clippy on exact replayed public crates
        run: |
          cargo clippy -p symthaea-manufacturing-process \
            -p symthaea-manufacturing-contracts --all-targets -- -D warnings
      - name: Capture lockfile delta for deterministic review
        if: always()
        run: |
          git diff --binary -- Cargo.lock > mfg-proc-007r-cargo-lock.patch
          git diff --name-only -- Cargo.lock > mfg-proc-007r-cargo-lock-files.txt
      - name: Upload generated lockfile delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfg-proc-007r-cargo-lock-delta
          path: |
            mfg-proc-007r-cargo-lock.patch
            mfg-proc-007r-cargo-lock-files.txt
          if-no-files-found: warn
