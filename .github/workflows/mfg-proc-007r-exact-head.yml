name: MFG-PROC-007R Current-Main Contract Replay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "crates/domains/symthaea-manufacturing-process/**"
      - "crates/domains/symthaea-manufacturing-contracts/**"
      - ".github/workflows/mfg-proc-007r-exact-head.yml"
  push:
    branches:
      - "replay/mfg-proc-007-contract-substrate-v1"
    paths:
      - "crates/domains/symthaea-manufacturing-process/**"
      - "crates/domains/symthaea-manufacturing-contracts/**"
      - ".github/workflows/mfg-proc-007r-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfg-proc-007r-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  public-contract-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt to replayed source files
        run: |
          rustfmt --edition 2024 \
            crates/domains/symthaea-manufacturing-process/src/lib.rs \
            crates/domains/symthaea-manufacturing-contracts/src/lib.rs \
            crates/domains/symthaea-manufacturing-contracts/src/capability.rs \
            crates/domains/symthaea-manufacturing-contracts/src/recipe.rs \
            crates/domains/symthaea-manufacturing-contracts/src/state.rs \
            crates/domains/symthaea-manufacturing-contracts/src/plan.rs \
            crates/domains/symthaea-manufacturing-contracts/tests/public_composition.rs
      - name: Check formatted replayed source files
        run: |
          rustfmt --edition 2024 --check \
            crates/domains/symthaea-manufacturing-process/src/lib.rs \
            crates/domains/symthaea-manufacturing-contracts/src/lib.rs \
            crates/domains/symthaea-manufacturing-contracts/src/capability.rs \
            crates/domains/symthaea-manufacturing-contracts/src/recipe.rs \
            crates/domains/symthaea-manufacturing-contracts/src/state.rs \
            crates/domains/symthaea-manufacturing-contracts/src/plan.rs \
            crates/domains/symthaea-manufacturing-contracts/tests/public_composition.rs
      - name: Capture rustfmt patch for exact source review
        if: always()
        run: |
          git diff --binary > mfg-proc-007r-rustfmt.patch
      - name: Upload rustfmt patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfg-proc-007r-rustfmt-patch
          path: mfg-proc-007r-rustfmt.patch
          if-no-files-found: warn
      - name: Prepare isolated validation workspace
        run: |
          set -euo pipefail
          validation_root="$RUNNER_TEMP/mfg-proc-007r-workspace"
          mkdir -p "$validation_root"
          cp -R crates/domains/symthaea-manufacturing-process "$validation_root/"
          cp -R crates/domains/symthaea-manufacturing-contracts "$validation_root/"
          cp Cargo.lock "$validation_root/Cargo.lock"
          cat > "$validation_root/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = [
              "symthaea-manufacturing-process",
              "symthaea-manufacturing-contracts",
          ]

          [workspace.package]
          edition = "2024"

          [workspace.dependencies]
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          thiserror = "1.0"
          blake3 = "1.5"
          EOF
          echo "MFG_PROC_007R_VALIDATION_ROOT=$validation_root" >> "$GITHUB_ENV"
      - name: Test exact replayed public crates in isolated workspace
        run: |
          cargo test --manifest-path "$MFG_PROC_007R_VALIDATION_ROOT/Cargo.toml" \
            -p symthaea-manufacturing-process \
            -p symthaea-manufacturing-contracts
      - name: Strict Clippy on exact replayed public crates
        run: |
          cargo clippy --manifest-path "$MFG_PROC_007R_VALIDATION_ROOT/Cargo.toml" \
            -p symthaea-manufacturing-process \
            -p symthaea-manufacturing-contracts --all-targets -- -D warnings
      - name: Capture generated lockfile for deterministic review
        if: always()
        run: |
          if [ -f "$MFG_PROC_007R_VALIDATION_ROOT/Cargo.lock" ]; then
            cp "$MFG_PROC_007R_VALIDATION_ROOT/Cargo.lock" mfg-proc-007r-Cargo.lock
          fi
      - name: Upload generated lockfile delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfg-proc-007r-cargo-lock-delta
          path: mfg-proc-007r-Cargo.lock
          if-no-files-found: warn
