name: HARDSEC-021 randomized PIT CCTM

on:
  pull_request:
    paths:
      - "examples/hardsec_context_cctm_randomized_pit.rs"
      - "docs/research/HARDSEC_021_RANDOMIZED_PIT_CCTM.md"
      - "schemas/hardsec-context-cctm-rpit-*.schema.json"
      - "schemas/hardsec-context-assignment-*.schema.json"
      - "tests/fixtures/hardsec/context-cctm-rpit-v1/**"
      - "schemas/hardsec-randomized-pit-benchmark-v1.schema.json"
      - "tests/fixtures/hardsec/context-assignment-v1/**"
      - "tests/fixtures/hardsec/context-cctm-rpit-v1/benchmark-plan.json"
      - "tools/hardsec-adaptive-evasion-audit-harness/**"
      - ".github/workflows/hardsec-context-assignment-audit.yml"
      - ".github/workflows/hardsec-randomized-pit-cctm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardsec-randomized-pit-cctm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  randomized-pit-cctm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check formatting
        run: rustfmt --edition 2024 --check examples/hardsec_context_assignment_audit.rs examples/hardsec_context_cctm_randomized_pit.rs
      - name: Run context assignment unit suite
        run: cargo test --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-context-assignment-audit --example hardsec_context_assignment_audit
      - name: Run randomized PIT CCTM unit suite
        run: cargo test --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-context-cctm-rpit-monitor --example hardsec_context_cctm_randomized_pit

      - name: Check randomized PIT benchmark matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          path = "tests/fixtures/hardsec/context-cctm-rpit-v1/benchmark-plan.json"
          with open(path, "r", encoding="utf-8") as handle:
              plan = json.load(handle)
          assert plan["status"] == "planned"
          assert len(plan["reference_implementations"]) == 9
          assert len(plan["score_distributions"]) == 8
          assert len(plan["randomizer_scenarios"]) == 9
          assert "fixed_reused_uniform" in [x["id"] for x in plan["randomizer_scenarios"]]
          assert "score_dependent_uniform" in [x["id"] for x in plan["randomizer_scenarios"]]
          assert "perfectly_repeated_latent_null" in plan["null_dependence_scenarios"]
          frontier = plan["calibration_frontier"]
          assert frontier["total_alpha"] == 0.04
          assert frontier["total_delta"] == 0.01
          assert frontier["independent_reference_units_per_context"] == [1199, 4794, 29958, 119830]
          assert plan["claim_rules"]["randomizer_independence_must_be_justified"] is True
          PY
      - name: Generate truth-free context receipt and run randomized PIT CCTM
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$(mktemp -d)"
          cargo run --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-context-assignment-audit --example hardsec_context_assignment_audit -- \
            --policy tests/fixtures/hardsec/context-assignment-v1/policy.json \
            --assignments tests/fixtures/hardsec/context-assignment-v1/assignments.json \
            --truth tests/fixtures/hardsec/context-assignment-v1/truth-oracle.json \
            --receipt "$out_dir/context-assignment-receipt.json"
          python3 - "$out_dir/context-assignment-receipt.json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              assignment = json.load(handle)
          assert assignment["result"] == "audited"
          assert assignment["assignment_integrity"]["assignment_record_count"] == 19
          assert assignment["assignment_integrity"]["accepted_count"] == 16
          assert assignment["assignment_integrity"]["abstained_count"] == 3
          assert assignment["runtime_mapping"]["contains_truth_labels"] is False
          PY
          cargo run --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-context-cctm-rpit-monitor --example hardsec_context_cctm_randomized_pit -- \
            --plan tests/fixtures/hardsec/context-cctm-rpit-v1/plan.json \
            --stream tests/fixtures/hardsec/context-cctm-rpit-v1/stream.json \
            --context-receipt "$out_dir/context-assignment-receipt.json" \
            --receipt "$out_dir/rpit-cctm-receipt.json"
          python3 - "$out_dir/rpit-cctm-receipt.json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              receipt = json.load(handle)
          assert receipt["result"] == "alarm_threshold_crossed", receipt
          monitor = receipt["sequential_monitor"]
          assert monitor["overall_first_alarm_sequence_index"] == 16
          assert monitor["overall_first_alarm_context_id"] == "compute"
          assert monitor["valid_observation_count"] == 16
          assert monitor["abstention_count"] == 3
          assert monitor["post_alarm_reset_count"] == 0
          assert receipt["context_assignment"]["accepted_count"] == 16
          assert receipt["context_assignment"]["abstained_count"] == 3
          assert receipt["statistical_guarantees"]["randomized_pit_atom_safe"] is True
          assert receipt["statistical_guarantees"]["randomizer_independence_status"] == "assumption_not_verified"
          assert receipt["statistical_guarantees"]["continuous_score_distribution_required"] is False
          assert receipt["statistical_guarantees"]["null_stream_iid_assumption_status"] == "assumption_not_verified"
          assert receipt["statistical_guarantees"]["reference_sample_iid_assumption_status"] == "assumption_not_verified"
          assert receipt["statistical_guarantees"]["theorem_guarantee_status"] == "not_established_from_input_receipts"
          assert abs(receipt["statistical_guarantees"]["unconditional_type_i_upper_bound_if_all_paper_assumptions_hold"] - 0.05) < 1e-12
          assert receipt["statistical_guarantees"]["effective_sample_size_estimate"] is None
          tie = receipt["statistical_guarantees"]["reference_and_test_score_tie_diagnostics"]
          assert len(tie["reference"]) == 2 and len(tie["test_stream"]) == 3
          for row in monitor["window_decisions"]:
              if row["action"] not in ("abstain", "alert_latched_observation_abstained"):
                  assert 0.0 <= row["randomized_pit_value"] <= 1.0
                  assert row["randomizer_id"]
          PY
