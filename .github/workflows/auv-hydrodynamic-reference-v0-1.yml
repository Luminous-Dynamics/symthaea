name: auv-hydrodynamic-reference-v0-1

on:
  push:
    branches:
      - research/auv-hydrodynamic-reference-v0-1
    paths:
      - "research/auv-hydrodynamic-reference-v0-1/**"
      - ".github/workflows/auv-hydrodynamic-reference-v0-1.yml"
  pull_request:
    paths:
      - "research/auv-hydrodynamic-reference-v0-1/**"
      - ".github/workflows/auv-hydrodynamic-reference-v0-1.yml"

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, Clippy and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/auv-hydrodynamic-reference-v0-1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
