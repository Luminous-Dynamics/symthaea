name: SAM Follow Privilege Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/autonomy/SAM_FOLLOW_PRIVILEGE_*.json"
      - "docs/autonomy/SAM_FOLLOW_PRIVILEGE_*.md"
      - "docs/autonomy/fixtures/SAM_FOLLOW_PRIVILEGE_*.json"
      - "tools/sam-follow-privilege-check/**"
      - ".github/workflows/sam-follow-privilege-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/autonomy/SAM_FOLLOW_PRIVILEGE_*.json"
      - "docs/autonomy/SAM_FOLLOW_PRIVILEGE_*.md"
      - "docs/autonomy/fixtures/SAM_FOLLOW_PRIVILEGE_*.json"
      - "tools/sam-follow-privilege-check/**"
      - ".github/workflows/sam-follow-privilege-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Draft 2020-12 + SAM privilege semantics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path tools/sam-follow-privilege-check/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path tools/sam-follow-privilege-check/Cargo.toml
      - name: Validate canonical specification fixture
        run: cargo run --manifest-path tools/sam-follow-privilege-check/Cargo.toml -- docs/autonomy/SAM_FOLLOW_PRIVILEGE_BENCHMARK_SCHEMA_V0_1.json docs/autonomy/fixtures/SAM_FOLLOW_PRIVILEGE_BENCHMARK_V0_1.json
      - name: Clippy
        run: cargo clippy --manifest-path tools/sam-follow-privilege-check/Cargo.toml --all-targets -- -D warnings
