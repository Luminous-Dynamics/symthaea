name: VIS-DVPC-007 vector-budget allocator

on:
  pull_request:
    paths:
      - "tools/vision-decision-value-vector-budget.rs"
      - "docs/research/VIS_DVPC_007_VECTOR_BUDGET_ALLOCATOR_V1.md"
      - ".github/workflows/vis-dvpc-007-vector-budget.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-decision-value-vector-budget.rs"
      - "docs/research/VIS_DVPC_007_VECTOR_BUDGET_ALLOCATOR_V1.md"
      - ".github/workflows/vis-dvpc-007-vector-budget.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: rustfmt --edition 2024 --check tools/vision-decision-value-vector-budget.rs

      - name: Compile and run adversarial unit tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 --test tools/vision-decision-value-vector-budget.rs -o /tmp/vis-dvpc-007-tests
          /tmp/vis-dvpc-007-tests --test-threads=1 2>&1 | tee /tmp/vis-dvpc-007-test.log
          grep -E 'test result: ok\. 16 passed; 0 failed;' /tmp/vis-dvpc-007-test.log

      - name: Record exact-head evidence
        run: |
          git rev-parse HEAD
          sha256sum tools/vision-decision-value-vector-budget.rs docs/research/VIS_DVPC_007_VECTOR_BUDGET_ALLOCATOR_V1.md
