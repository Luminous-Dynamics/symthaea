name: IG-008C0 Mycelix Config Authority Conformance

on:
  pull_request:
    paths:
      - "scripts/ig008c0_mycelix_config_oracle.py"
      - "docs/research/IG_008C0_MYCELIX_CONFIG_CONFORMANCE.md"
      - ".github/workflows/ig-008c0-mycelix-config-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-config-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SYMTHAEA_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      MYCELIX_EVIDENCE_HEAD: 88922e7950ddf030026b5d4d2b06e0ed63727692
      PROFILE_SHA256: de4435a69356557b1812f8beb46d654c66b9c957be9d18c64bd0431f92546d5a
      CORPUS_SHA256: 3009e97529934fa8f470769de5615dcfda17bde0e942683e939d2b733430a216

    steps:
      - name: Checkout exact Symthaea subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SYMTHAEA_SUBJECT }}
          fetch-depth: 1

      - name: Checkout exact Mycelix config evidence subject
        uses: actions/checkout@v4
        with:
          repository: Luminous-Dynamics/mycelix
          ref: ${{ env.MYCELIX_EVIDENCE_HEAD }}
          path: _mycelix_config_evidence
          fetch-depth: 1

      - name: Isolate nested evidence checkout from parent status
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '_mycelix_config_evidence/' >> .git/info/exclude

      - name: Install Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Verify exact subjects and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SYMTHAEA_SUBJECT"
          test "$(git -C _mycelix_config_evidence rev-parse HEAD)" = "$MYCELIX_EVIDENCE_HEAD"
          test -z "$(git status --porcelain)"
          test -z "$(git -C _mycelix_config_evidence status --porcelain)"
          test "$(git -C _mycelix_config_evidence hash-object mycelix-governance/zomes/bridge/coordinator/src/consciousness_config.rs)" = "26da234e588bf26d0e25c10dbec34502e00c191a"
          test "$(git -C _mycelix_config_evidence hash-object mycelix-governance/zomes/bridge/integrity/src/lib.rs)" = "61b20610216e2fd69c701ecaea5322c448eda119"
          test "$(git -C _mycelix_config_evidence hash-object mycelix-governance/zomes/proposals/coordinator/src/lib.rs)" = "eb8358353ee259ef9c3b46617a61d3439f1c714c"
          test "$(git -C _mycelix_config_evidence hash-object mycelix-governance/zomes/proposals/integrity/src/lib.rs)" = "986bc0526aec8d37436efbe5ba798bc41705e3cf"

      - name: Syntax compile independent implementations
        run: |
          python -m py_compile scripts/ig008c0_mycelix_config_oracle.py
          python -m py_compile _mycelix_config_evidence/mycelix-governance/scripts/validate_ig007c0_governance_config_profile.py
          python -m py_compile _mycelix_config_evidence/mycelix-governance/scripts/ig007c1_governance_config_counterexamples.py

      - name: Qualify Mycelix C0 profile prerequisite
        shell: bash
        run: |
          set -euo pipefail
          python _mycelix_config_evidence/mycelix-governance/scripts/validate_ig007c0_governance_config_profile.py \
            --profile _mycelix_config_evidence/mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json \
            --self-test > /tmp/ig008c0-profile.json

      - name: Run Mycelix C1 oracle twice
        shell: bash
        run: |
          set -euo pipefail
          python _mycelix_config_evidence/mycelix-governance/scripts/ig007c1_governance_config_counterexamples.py \
            --profile _mycelix_config_evidence/mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json \
            --self-test > /tmp/ig008c0-mycelix-self-1.json
          python _mycelix_config_evidence/mycelix-governance/scripts/ig007c1_governance_config_counterexamples.py \
            --profile _mycelix_config_evidence/mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json \
            --self-test > /tmp/ig008c0-mycelix-self-2.json
          cmp /tmp/ig008c0-mycelix-self-1.json /tmp/ig008c0-mycelix-self-2.json
          python _mycelix_config_evidence/mycelix-governance/scripts/ig007c1_governance_config_counterexamples.py \
            --profile _mycelix_config_evidence/mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json \
            --corpus > /tmp/ig008c0-mycelix-corpus.json

      - name: Run independent Symthaea oracle twice
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ig008c0_mycelix_config_oracle.py \
            --profile _mycelix_config_evidence/mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json \
            --self-test > /tmp/ig008c0-symthaea-self-1.json
          python scripts/ig008c0_mycelix_config_oracle.py \
            --profile _mycelix_config_evidence/mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json \
            --self-test > /tmp/ig008c0-symthaea-self-2.json
          cmp /tmp/ig008c0-symthaea-self-1.json /tmp/ig008c0-symthaea-self-2.json
          python scripts/ig008c0_mycelix_config_oracle.py \
            --profile _mycelix_config_evidence/mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json \
            --corpus > /tmp/ig008c0-symthaea-corpus.json

      - name: Require byte-identical cross-implementation corpus
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/ig008c0-mycelix-corpus.json /tmp/ig008c0-symthaea-corpus.json

      - name: Assert frozen commitments and authority ceilings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('/tmp/ig008c0-profile.json', encoding='utf-8') as f:
              profile = json.load(f)
          with open('/tmp/ig008c0-mycelix-self-1.json', encoding='utf-8') as f:
              mycelix = json.load(f)
          with open('/tmp/ig008c0-symthaea-self-1.json', encoding='utf-8') as f:
              symthaea = json.load(f)
          with open('/tmp/ig008c0-symthaea-corpus.json', encoding='utf-8') as f:
              corpus = json.load(f)
          assert profile['authority_class'] == 'ObservedSourceBound'
          assert profile['profile_content_sha256'] == 'de4435a69356557b1812f8beb46d654c66b9c957be9d18c64bd0431f92546d5a'
          assert mycelix['authority'] == 'MeasurementOnly'
          assert mycelix['corpus_sha256'] == '3009e97529934fa8f470769de5615dcfda17bde0e942683e939d2b733430a216'
          assert symthaea['authority'] == 'MeasurementOnly'
          assert symthaea['conformance_class'] == 'CrossImplementationConformance'
          assert symthaea['profile_sha256'] == profile['profile_content_sha256']
          assert symthaea['corpus_sha256'] == mycelix['corpus_sha256']
          assert symthaea['counterexample_count'] == 3
          assert corpus['corpus_sha256'] == symthaea['corpus_sha256']
          PY

      - name: Verify both checkouts immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SYMTHAEA_SUBJECT"
          test "$(git -C _mycelix_config_evidence rev-parse HEAD)" = "$MYCELIX_EVIDENCE_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          git -C _mycelix_config_evidence diff --exit-code
          git -C _mycelix_config_evidence diff --cached --exit-code
          test -z "$(git status --porcelain)"
          test -z "$(git -C _mycelix_config_evidence status --porcelain)"
