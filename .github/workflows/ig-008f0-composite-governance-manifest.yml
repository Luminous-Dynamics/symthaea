name: IG-008F0 Composite Governance Manifest

on:
  pull_request:
    paths:
      - "docs/research/manifests/mycelix-observed-composite-fca2c107-v1.json"
      - "scripts/ig008f0_validate_composite_manifest.py"
      - "docs/research/IG_008F0_COMPOSITE_GOVERNANCE_MANIFEST.md"
      - ".github/workflows/ig-008f0-composite-governance-manifest.yml"
      - "scripts/ig008a0_mycelix_adapter_oracle.py"
      - "scripts/ig008e0_mycelix_execution_oracle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-composite-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SYMTHAEA_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      MYCELIX_VOTING_EVIDENCE_HEAD: 4b4e27910a98ad393e5a508e54e0f73c48c19107
      MYCELIX_EXECUTION_EVIDENCE_HEAD: 197714209c60503f0fba4143409da383bc9cbf83
      PRODUCTION_SUBJECT: fca2c107a1ea5108823ce617ba4111b6f7f77230
      VOTING_PROFILE_SHA256: 680af4668889c299b7e0d74531f44894a64a384be71778bca54d3f21ca80ac01
      VOTING_CORPUS_SHA256: ee5e7649a773f564b443320689f465080d4641a0f4f09f13c0c49a7087d6dc10
      EXECUTION_PROFILE_SHA256: c977bdcef9e5faac83351050999451432b618d5cc523bece804eba5dd1ae81f6
      EXECUTION_CORPUS_SHA256: 0c6669e44d6d18396ede43324f5cf3abbb25ddd3a2a9f59abb2c8a3699ba5fd4
      COMPOSITE_SHA256: 366b87944e74fe01369b78a8a7ea1c34f6dee05237583a47d86e5999b93b150c

    steps:
      - name: Checkout exact Symthaea subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SYMTHAEA_SUBJECT }}
          fetch-depth: 1

      - name: Checkout exact Mycelix voting evidence
        uses: actions/checkout@v4
        with:
          repository: Luminous-Dynamics/mycelix
          ref: ${{ env.MYCELIX_VOTING_EVIDENCE_HEAD }}
          path: _mycelix_voting
          fetch-depth: 1

      - name: Checkout exact Mycelix execution evidence
        uses: actions/checkout@v4
        with:
          repository: Luminous-Dynamics/mycelix
          ref: ${{ env.MYCELIX_EXECUTION_EVIDENCE_HEAD }}
          path: _mycelix_execution
          fetch-depth: 1

      - name: Isolate nested evidence checkouts
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '_mycelix_voting/' '_mycelix_execution/' >> .git/info/exclude

      - name: Install Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Verify exact subjects and clean preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SYMTHAEA_SUBJECT"
          test "$(git -C _mycelix_voting rev-parse HEAD)" = "$MYCELIX_VOTING_EVIDENCE_HEAD"
          test "$(git -C _mycelix_execution rev-parse HEAD)" = "$MYCELIX_EXECUTION_EVIDENCE_HEAD"
          test -z "$(git status --porcelain)"
          test -z "$(git -C _mycelix_voting status --porcelain)"
          test -z "$(git -C _mycelix_execution status --porcelain)"

      - name: Bind frozen Mycelix production source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _mycelix_voting hash-object mycelix-governance/zomes/voting/coordinator/src/lib.rs)" = "969b845e6186cbcad507c742a718060844f82eb2"
          test "$(git -C _mycelix_voting hash-object mycelix-governance/zomes/voting/integrity/src/lib.rs)" = "658562c8dfaf6a2f1b97a7bfd5cf0fc8a5ab6e66"
          test "$(git -C _mycelix_execution hash-object mycelix-governance/zomes/execution/coordinator/src/lib.rs)" = "3dbb8a8f69b377e494ccf24164c94bd80f54e0ef"
          test "$(git -C _mycelix_execution hash-object mycelix-governance/zomes/execution/integrity/src/lib.rs)" = "657edaee9a314f100a0c4b1609a4596cf243e61d"

      - name: Syntax compile all independent authorities
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ig008a0_mycelix_adapter_oracle.py
          python -m py_compile scripts/ig008e0_mycelix_execution_oracle.py
          python -m py_compile scripts/ig008f0_validate_composite_manifest.py
          python -m py_compile _mycelix_voting/mycelix-governance/scripts/validate_ig007a3_observed_profile_v2.py
          python -m py_compile _mycelix_voting/mycelix-governance/scripts/ig007a4_delegation_counterexamples.py
          python -m py_compile _mycelix_execution/mycelix-governance/scripts/validate_ig007e0_execution_profile.py
          python -m py_compile _mycelix_execution/mycelix-governance/scripts/ig007e1_execution_counterexamples.py

      - name: Independently qualify voting component
        shell: bash
        run: |
          set -euo pipefail
          PROFILE=_mycelix_voting/mycelix-governance/profiles/observed/voting-fca2c107-v2.json
          python _mycelix_voting/mycelix-governance/scripts/validate_ig007a3_observed_profile_v2.py --profile "$PROFILE" --self-test > /tmp/voting-profile.json
          python _mycelix_voting/mycelix-governance/scripts/ig007a4_delegation_counterexamples.py --profile "$PROFILE" --self-test > /tmp/voting-mycelix-self.json
          python _mycelix_voting/mycelix-governance/scripts/ig007a4_delegation_counterexamples.py --profile "$PROFILE" --corpus > /tmp/voting-mycelix-corpus.json
          python scripts/ig008a0_mycelix_adapter_oracle.py --profile "$PROFILE" --self-test > /tmp/voting-symthaea-self.json
          python scripts/ig008a0_mycelix_adapter_oracle.py --profile "$PROFILE" --corpus > /tmp/voting-symthaea-corpus.json
          cmp /tmp/voting-mycelix-corpus.json /tmp/voting-symthaea-corpus.json

      - name: Independently qualify execution component
        shell: bash
        run: |
          set -euo pipefail
          PROFILE=_mycelix_execution/mycelix-governance/profiles/observed/execution-fca2c107-v1.json
          python _mycelix_execution/mycelix-governance/scripts/validate_ig007e0_execution_profile.py --profile "$PROFILE" --self-test > /tmp/execution-profile.json
          python _mycelix_execution/mycelix-governance/scripts/ig007e1_execution_counterexamples.py --profile "$PROFILE" --self-test > /tmp/execution-mycelix-self.json
          python _mycelix_execution/mycelix-governance/scripts/ig007e1_execution_counterexamples.py --profile "$PROFILE" --corpus > /tmp/execution-mycelix-corpus.json
          python scripts/ig008e0_mycelix_execution_oracle.py --profile "$PROFILE" --self-test > /tmp/execution-symthaea-self.json
          python scripts/ig008e0_mycelix_execution_oracle.py --profile "$PROFILE" --corpus > /tmp/execution-symthaea-corpus.json
          cmp /tmp/execution-mycelix-corpus.json /tmp/execution-symthaea-corpus.json

      - name: Validate composite manifest twice byte-identically
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=docs/research/manifests/mycelix-observed-composite-fca2c107-v1.json
          python scripts/ig008f0_validate_composite_manifest.py --manifest "$MANIFEST" --self-test > /tmp/composite-1.json
          python scripts/ig008f0_validate_composite_manifest.py --manifest "$MANIFEST" --self-test > /tmp/composite-2.json
          cmp /tmp/composite-1.json /tmp/composite-2.json

      - name: Assert component and composite commitments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          def read(path):
              with open(path, encoding='utf-8') as f:
                  return json.load(f)

          vp = read('/tmp/voting-profile.json')
          vm = read('/tmp/voting-mycelix-self.json')
          vs = read('/tmp/voting-symthaea-self.json')
          ep = read('/tmp/execution-profile.json')
          em = read('/tmp/execution-mycelix-self.json')
          es = read('/tmp/execution-symthaea-self.json')
          cm = read('/tmp/composite-1.json')
          manifest = read('docs/research/manifests/mycelix-observed-composite-fca2c107-v1.json')

          production = 'fca2c107a1ea5108823ce617ba4111b6f7f77230'
          assert vp['authority_class'] == 'ObservedSourceBound'
          assert vp['profile_content_sha256'] == '680af4668889c299b7e0d74531f44894a64a384be71778bca54d3f21ca80ac01'
          assert vm['corpus_sha256'] == 'ee5e7649a773f564b443320689f465080d4641a0f4f09f13c0c49a7087d6dc10'
          assert vs['authority'] == 'MeasurementOnly'
          assert vs['conformance_class'] == 'CrossImplementationConformance'
          assert vs['profile_sha256'] == vp['profile_content_sha256']
          assert vs['corpus_sha256'] == vm['corpus_sha256']

          assert ep['authority_class'] == 'ObservedSourceBound'
          assert ep['profile_content_sha256'] == 'c977bdcef9e5faac83351050999451432b618d5cc523bece804eba5dd1ae81f6'
          assert em['corpus_sha256'] == '0c6669e44d6d18396ede43324f5cf3abbb25ddd3a2a9f59abb2c8a3699ba5fd4'
          assert es['authority'] == 'MeasurementOnly'
          assert es['conformance_class'] == 'CrossImplementationConformance'
          assert es['profile_sha256'] == ep['profile_content_sha256']
          assert es['corpus_sha256'] == em['corpus_sha256']

          assert cm['authority_class'] == 'ObservedCompositeSlice'
          assert cm['claim_ceiling'] == 'ObservedCompositeSliceOnly'
          assert cm['manifest_content_sha256'] == '366b87944e74fe01369b78a8a7ea1c34f6dee05237583a47d86e5999b93b150c'
          assert cm['production_subject'] == production
          assert cm['component_count'] == 2
          assert cm['uncovered_stage_count'] == 5

          assert manifest['production_subject'] == production
          assert {c['production_subject'] for c in manifest['components']} == {production}
          assert {c['role'] for c in manifest['components']} == {'Voting', 'Execution'}
          assert manifest['authority_class'] != 'ObservedEndToEnd'
          assert manifest['claim_ceiling'] != 'ObservedEndToEnd'
          assert manifest['uncovered_stages']
          PY

      - name: Verify all checkouts immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SYMTHAEA_SUBJECT"
          test "$(git -C _mycelix_voting rev-parse HEAD)" = "$MYCELIX_VOTING_EVIDENCE_HEAD"
          test "$(git -C _mycelix_execution rev-parse HEAD)" = "$MYCELIX_EXECUTION_EVIDENCE_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          git -C _mycelix_voting diff --exit-code
          git -C _mycelix_voting diff --cached --exit-code
          git -C _mycelix_execution diff --exit-code
          git -C _mycelix_execution diff --cached --exit-code
          test -z "$(git status --porcelain)"
          test -z "$(git -C _mycelix_voting status --porcelain)"
          test -z "$(git -C _mycelix_execution status --porcelain)"
