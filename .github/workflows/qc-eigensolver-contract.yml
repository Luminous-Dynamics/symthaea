name: QC Eigensolver Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-quantum-chemistry/src/scf/generalized_eigen.rs"
      - "crates/domains/symthaea-quantum-chemistry/examples/qc_eigen_reference_fixtures.rs"
      - "scripts/qc_eigen_reference_compare.py"
      - "scripts/test_qc_eigen_reference_compare.py"
      - ".github/workflows/qc-eigensolver-contract.yml"
  push:
    branches: [main]
    paths:
      - "crates/domains/symthaea-quantum-chemistry/src/scf/generalized_eigen.rs"
      - "crates/domains/symthaea-quantum-chemistry/examples/qc_eigen_reference_fixtures.rs"
      - "scripts/qc_eigen_reference_compare.py"
      - ".github/workflows/qc-eigensolver-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qc-eigensolver-contract-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  eigensolver-contract:
    name: Checked Jacobi and canonical-orthogonalization tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # upstream action commit at 2026-10-09
        with:
          toolchain: 1.96.0

      - name: Compile source-bound eigen fixture producer
        run: cargo check --locked -p symthaea-quantum-chemistry --example qc_eigen_reference_fixtures

      - name: Test checked eigensolver contracts
        run: cargo test --locked -p symthaea-quantum-chemistry --lib scf::generalized_eigen::tests

      - name: Check NumPy comparator syntax
        run: python3 -m py_compile scripts/qc_eigen_reference_compare.py scripts/test_qc_eigen_reference_compare.py
