name: EQC Standalone Reference Validation

on:
  push:
    branches: [research/eqc-standalone-v0-1-2026-11-27]
    paths:
      - "tools/eqc-reference/**"
      - "docs/research/eqc-*.json"
      - "docs/research/eqc-fixtures/**"
      - "docs/research/EVIDENCE_QUALIFIED_CAPABILITY_BENCHMARK_V0_1.md"
      - ".github/workflows/eqc-standalone.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/eqc-reference/**"
      - "docs/research/eqc-*.json"
      - "docs/research/eqc-fixtures/**"
      - "docs/research/EVIDENCE_QUALIFIED_CAPABILITY_BENCHMARK_V0_1.md"
      - ".github/workflows/eqc-standalone.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eqc-standalone-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  reference-seed:
    name: Standalone Rust reference and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Generate isolated lockfile if absent
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest="tools/eqc-reference/Cargo.toml"
          lock="tools/eqc-reference/Cargo.lock"
          # Re-resolve only this nested workspace graph. This intentionally
          # does not touch the repository root Cargo.lock.
          cargo metadata --manifest-path "$manifest" --format-version 1 \
            > "$RUNNER_TEMP/eqc-cargo-metadata.json"
          test -s "$lock"
          git add "$lock"
          if ! git diff --cached --quiet -- "$lock"; then
            if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "research/eqc-standalone-v0-1-2026-11-27" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore(eqc): add isolated reference evaluator lockfile"
              git push origin HEAD:research/eqc-standalone-v0-1-2026-11-27
            else
              echo "The standalone EQC lockfile is not committed; refusing an unlocked PR evaluation." >&2
              exit 1
            fi
          fi

      - name: Validate JSON source artifacts
        run: |
          set -euo pipefail
          jq empty docs/research/eqc-task-v0.1.schema.json
          jq empty docs/research/eqc-run-receipt-v0.1.schema.json
          jq empty docs/research/eqc-seed-corpus-v0.1.json
          jq empty docs/research/eqc-system-observation-v0.1.schema.json
          for file in docs/research/eqc-fixtures/*.json; do jq empty "$file"; done

      - name: Check formatting
        run: cargo fmt --manifest-path tools/eqc-reference/Cargo.toml -- --check

      - name: Test reference policy and adversarial controls
        run: cargo test --locked --manifest-path tools/eqc-reference/Cargo.toml

      - name: Execute standalone seed validator
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path tools/eqc-reference/Cargo.toml -- \
            --corpus docs/research/eqc-seed-corpus-v0.1.json \
            --out "$RUNNER_TEMP/eqc-reference-report.json"
          jq -e '
            .evaluation_mode == "reference_contract_only_not_system_under_test" and
            .task_count == 4 and
            .reference_pass_count == 4 and
            .no_op_fails_positive_controls == true and
            .allow_all_fails_negative_controls == true and
            .task_schema_validated == true and
            .receipt_schema_meta_validated == true
          ' "$RUNNER_TEMP/eqc-reference-report.json" >/dev/null
          cat "$RUNNER_TEMP/eqc-reference-report.json"

      - name: Preserve exact source and environment evidence
        run: |
          mkdir -p "$RUNNER_TEMP/eqc-evidence"
          cp "$RUNNER_TEMP/eqc-reference-report.json" "$RUNNER_TEMP/eqc-evidence/"
          {
            echo "workflow_sha=$GITHUB_SHA"
            echo "evaluated_commit=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "task_corpus_sha256=$(sha256sum docs/research/eqc-seed-corpus-v0.1.json | cut -d' ' -f1)"
            echo "standalone_lock_sha256=$(sha256sum tools/eqc-reference/Cargo.lock | cut -d' ' -f1)"
            echo "schema_validator=jsonschema-0.63.2-offline-draft-2020-12"
          } > "$RUNNER_TEMP/eqc-evidence/run-metadata.txt"

      - name: Upload reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: eqc-standalone-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/eqc-evidence/
          if-no-files-found: error
          retention-days: 90
