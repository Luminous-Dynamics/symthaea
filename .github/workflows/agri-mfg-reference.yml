name: AGRI-MFG Reference Qualification

on:
  pull_request:
    paths:
      - 'docs/release/evidence/agri-mfg-001a-benign-infrastructure-reference-v1.json'
      - 'scripts/validate_agri_mfg_001a.py'
      - '.github/workflows/agri-mfg-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate AGRI-MFG-001A exact reference corpus
        run: python3 scripts/validate_agri_mfg_001a.py
