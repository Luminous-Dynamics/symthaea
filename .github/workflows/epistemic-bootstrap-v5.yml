name: Epistemic hardening bootstrap v5

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: epistemic-bootstrap-v5-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  lock-aware-canonical-gate:
    if: github.event.pull_request.head.ref == 'agent/epistemic-hardening-r6'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REVIEWED_BASE: f9c68947fa77fd6e29c4d2e87293715122f53cbf
      TARGET_BRANCH: agent/epistemic-hardening-r6
      STATUS_BRANCH: agent/epistemic-hardening-r6-v5-status
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PAYLOAD_SHA256: 3585a35e445af93a1f826cb58de0c3aaeb6bdc737398dc6ac7f85d614f98a486
      WORKFLOW_OVERRIDE_SHA256: 85b1de02d08cfd13c750cdd1093774099f624b9b1a25b7213b886d953636cc1f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Derive the lock-aware gate from reviewed v3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/epistemic-bootstrap-v3.yml').read_text()
          marker = '      - name: Run guarded canonical gate\n'
          start = source.index(marker)
          run_marker = '        run: |\n'
          body_start = source.index(run_marker, start) + len(run_marker)
          body_end = source.index('\n      - name: Upload retained gate evidence', body_start)
          lines = source[body_start:body_end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          scope_needle = '''phase=formatting_scope\ngit -C "$worktree" diff --name-only --diff-filter=ACMRTUXB | sort > "$RUNNER_TEMP/post-format-paths.txt"'''
          scope_replacement = '''phase=formatting_scope\ngit -C "$worktree" add -N .\ngit -C "$worktree" diff --name-only --diff-filter=ACMRTUXB | sort > "$RUNNER_TEMP/post-format-paths.txt"'''
          if script.count(scope_needle) != 1:
              raise SystemExit('reviewed v3 formatting-scope anchor was not found exactly once')
          script = script.replace(scope_needle, scope_replacement)

          tests_anchor = 'run_logged tests cargo test --locked --all-targets --all-features \\\n'
          lock_block = r'''phase=lockfile_refresh
          cp "$worktree/Cargo.lock" "$RUNNER_TEMP/Cargo.lock.before"
          run_logged lockfile cargo metadata --format-version 1

          python3 - "$RUNNER_TEMP/Cargo.lock.before" "$worktree/Cargo.lock" <<'PYLOCK'
          import sys
          import tomllib
          from pathlib import Path

          before_path, after_path = map(Path, sys.argv[1:])
          before = tomllib.loads(before_path.read_text())
          after = tomllib.loads(after_path.read_text())

          def indexed(doc):
              return {
                  (pkg['name'], pkg['version'], pkg.get('source')): pkg
                  for pkg in doc.get('package', [])
              }

          old = indexed(before)
          new = indexed(after)
          if old.keys() != new.keys():
              raise SystemExit('lock refresh changed the package identity set')

          changed = [key for key in old if old[key] != new[key]]
          expected_key = next(
              (key for key in old if key[0] == 'symthaea-engineering' and key[1] == '0.1.0'),
              None,
          )
          if changed != [expected_key]:
              raise SystemExit(f'lock refresh changed unexpected packages: {changed!r}')

          old_pkg = dict(old[expected_key])
          new_pkg = dict(new[expected_key])
          old_deps = set(old_pkg.pop('dependencies', []))
          new_deps = set(new_pkg.pop('dependencies', []))
          if old_pkg != new_pkg:
              raise SystemExit('lock refresh changed engineering package metadata beyond dependencies')
          additions = new_deps - old_deps
          removals = old_deps - new_deps
          if removals or len(additions) != 1 or not next(iter(additions)).startswith('sha2'):
              raise SystemExit(
                  f'expected only a sha2 dependency addition; additions={additions!r}, removals={removals!r}'
              )
          PYLOCK

          phase=lockfile_scope
          { cat "$RUNNER_TEMP/expected-paths.txt"; echo Cargo.lock; } | sort -u > "$RUNNER_TEMP/expected-paths-with-lock.txt"
          git -C "$worktree" add -N .
          git -C "$worktree" diff --name-only --diff-filter=ACMRTUXB | sort > "$RUNNER_TEMP/post-lock-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths-with-lock.txt" "$RUNNER_TEMP/post-lock-paths.txt"
          git -C "$worktree" diff --check
          git -C "$worktree" diff > "$evidence/canonical-with-lock.diff"

          run_logged locked_resolution cargo metadata --locked --format-version 1

          '''
          if script.count(tests_anchor) != 1:
              raise SystemExit('reviewed v3 tests anchor was not found exactly once')
          script = script.replace(tests_anchor, lock_block + tests_anchor)

          Path('/tmp/epistemic-bootstrap-v5.sh').write_text(script)
          PY
          chmod 0755 /tmp/epistemic-bootstrap-v5.sh
          bash -n /tmp/epistemic-bootstrap-v5.sh

      - name: Run lock-aware guarded canonical gate
        shell: bash
        run: /tmp/epistemic-bootstrap-v5.sh

      - name: Upload retained gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-hardening-bootstrap-v5-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 90
