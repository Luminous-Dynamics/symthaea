name: VIS-DVPC-058 pairwise Bellman validation OPE model selection

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/vision-dvpc-058-pairwise-bellman-validation.rs"
      - "docs/research/VIS_DVPC_058_PAIRWISE_BELLMAN_VALIDATION_V0.md"
      - ".github/workflows/vis-dvpc-058-pairwise-bellman-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-058-pairwise-bellman-validation.rs"
      - "docs/research/VIS_DVPC_058_PAIRWISE_BELLMAN_VALIDATION_V0.md"
      - ".github/workflows/vis-dvpc-058-pairwise-bellman-validation.yml"

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact VIS-DVPC-058 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting for standalone Rust source
        run: rustfmt --edition=2024 --check tools/vision-dvpc-058-pairwise-bellman-validation.rs
      - name: Compile and run pairwise Bellman validation falsification tests
        run: |
          rustc --edition=2024 -O --test tools/vision-dvpc-058-pairwise-bellman-validation.rs -o /tmp/vis-dvpc-058-tests
          /tmp/vis-dvpc-058-tests
      - name: Verify deterministic smoke output and row schema
        run: |
          rustc --edition=2024 -O tools/vision-dvpc-058-pairwise-bellman-validation.rs -o /tmp/vis-dvpc-058
          /tmp/vis-dvpc-058 --smoke > /tmp/vis-dvpc-058-smoke-a.tsv
          /tmp/vis-dvpc-058 --smoke > /tmp/vis-dvpc-058-smoke-b.tsv
          cmp /tmp/vis-dvpc-058-smoke-a.tsv /tmp/vis-dvpc-058-smoke-b.tsv
          awk -F '\t' '$1 == "RESULT" { if (NF != 13 || $2 == "" || $3 == "" || $4 < 1 || $5 != 6 || $6 < 0 || $6 > 1 || $7 < 0 || $8 < 0 || $9 < 0 || $10 < 0 || $11 != $11 || $12 == $13) bad=1; n++ } END { if (n != 12 || bad) exit 1 }' /tmp/vis-dvpc-058-smoke-a.tsv
          test "$(grep -c '^BENCHMARK_CONFIG' /tmp/vis-dvpc-058-smoke-a.tsv)" = "8"
          test "$(grep -c '^NEGATIVE_CONTROL' /tmp/vis-dvpc-058-smoke-a.tsv)" = "1"
      - name: Run full PBV model-selection frontier
        run: |
          /tmp/vis-dvpc-058 > /tmp/vis-dvpc-058-full.tsv
          awk -F '\t' '$1 == "RESULT" { if (NF != 13 || $2 == "" || $3 == "" || $4 < 1 || $5 != 6 || $6 < 0 || $6 > 1 || $7 < 0 || $8 < 0 || $9 < 0 || $10 < 0 || $11 != $11 || $12 == $13) bad=1; n++ } END { if (n != 12 || bad) exit 1 }' /tmp/vis-dvpc-058-full.tsv
          test "$(grep -c '^BENCHMARK_CONFIG' /tmp/vis-dvpc-058-full.tsv)" = "8"
          test "$(grep -c '^NEGATIVE_CONTROL' /tmp/vis-dvpc-058-full.tsv)" = "1"
          grep -F $'BENCHMARK_CONFIG\tVIS-DVPC-058' /tmp/vis-dvpc-058-full.tsv
      - name: Create exact-source and output SHA-256 receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          {
            printf 'VIS_DVPC_058_RECEIPT\tformat\tv1\n'
            printf 'commit_sha\t%s\n' "$EXPECTED_HEAD"
            printf 'rustc\t%s\n' "$(rustc --version)"
            sha256sum tools/vision-dvpc-058-pairwise-bellman-validation.rs docs/research/VIS_DVPC_058_PAIRWISE_BELLMAN_VALIDATION_V0.md /tmp/vis-dvpc-058-smoke-a.tsv /tmp/vis-dvpc-058-full.tsv
          } > /tmp/vis-dvpc-058-receipt.tsv
          cat /tmp/vis-dvpc-058-receipt.tsv
      - name: Publish results and receipt
        uses: actions/upload-artifact@v4
        with:
          name: vis-dvpc-058-pairwise-bellman-validation
          path: |
            /tmp/vis-dvpc-058-smoke-a.tsv
            /tmp/vis-dvpc-058-full.tsv
            /tmp/vis-dvpc-058-receipt.tsv
          retention-days: 90