name: VIS-DVPC-009 safety and tail constrained oracle

on:
  pull_request:
    paths:
      - "tools/vision-dvpc-safety-tail-oracle.rs"
      - "docs/research/VIS_DVPC_009_SAFETY_TAIL_ORACLE_V1.md"
      - ".github/workflows/vis-dvpc-009-safety-tail-oracle.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-safety-tail-oracle.rs"
      - "docs/research/VIS_DVPC_009_SAFETY_TAIL_ORACLE_V1.md"
      - ".github/workflows/vis-dvpc-009-safety-tail-oracle.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: rustfmt --edition 2024 --check tools/vision-dvpc-safety-tail-oracle.rs

      - name: Compile and run evaluator-only tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 --test tools/vision-dvpc-safety-tail-oracle.rs -o /tmp/vis-dvpc-009-tests
          /tmp/vis-dvpc-009-tests --test-threads=1 2>&1 | tee /tmp/vis-dvpc-009-test.log
          grep -E 'test result: ok\. 12 passed; 0 failed;' /tmp/vis-dvpc-009-test.log

      - name: Record exact-head evidence
        run: |
          git rev-parse HEAD
          sha256sum tools/vision-dvpc-safety-tail-oracle.rs docs/research/VIS_DVPC_009_SAFETY_TAIL_ORACLE_V1.md
