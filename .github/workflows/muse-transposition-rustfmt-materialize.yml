name: Muse Transposition Rustfmt Materialization

on:
  push:
    branches:
      - "research/mel-mr-eval-036-*"
    paths:
      - "crates/domains/symthaea-muse/src/counterfactual_influence.rs"
      - ".github/workflows/muse-transposition-rustfmt-materialize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Format the changed source and emit exact bytes
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/domains/symthaea-muse/src/counterfactual_influence.rs
          echo "MUSE_SOURCE_BEGIN"
          base64 -w0 crates/domains/symthaea-muse/src/counterfactual_influence.rs
          echo
          echo "MUSE_SOURCE_END"
