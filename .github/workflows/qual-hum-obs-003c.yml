name: QUAL HUM-OBS-003C exact subject

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qual-hum-obs-003c-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head HumanoidBench execution-provenance qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate subject
        uses: actions/checkout@v4
        with:
          ref: 3dfb6afa5a872cabc0cbb947574e9c74d21a207e
          fetch-depth: 1
      - name: Verify exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected=3dfb6afa5a872cabc0cbb947574e9c74d21a207e
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "qualified_subject=$actual"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/domains/symthaea-humanoid
      - name: Rustfmt exact humanoid crate
        run: cargo fmt --manifest-path crates/domains/symthaea-humanoid/Cargo.toml -- --check
      - name: Run execution-receipt source tests
        run: cargo test -p symthaea-humanoid humanoidbench_execution_receipt --lib
      - name: Clippy humanoid library
        run: cargo clippy -p symthaea-humanoid --lib -- -D warnings
