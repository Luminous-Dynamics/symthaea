name: CMAQ-044 paired effective-block benchmark inference

on:
  pull_request:
    paths:
      - "research/cmaq-044/**"
      - ".github/workflows/cmaq-044.yml"
  push:
    branches:
      - "research/cmaq-044-*"
    paths:
      - "research/cmaq-044/**"
      - ".github/workflows/cmaq-044.yml"

permissions:
  contents: read

concurrency:
  group: cmaq-044-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-block-inference:
    name: paired-block-inference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --manifest-path research/cmaq-044/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo +1.100.0 test --manifest-path research/cmaq-044/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo +1.100.0 clippy --manifest-path research/cmaq-044/Cargo.toml --locked --all-targets -- -D warnings
