name: Matter Nuclear Acquisition Heuristics

on:
  pull_request:
    paths:
      - 'crates/domains/symthaea-nuclear/src/active_learning.rs'
      - 'crates/domains/symthaea-nuclear/src/ml_mass.rs'
      - 'crates/domains/symthaea-nuclear/src/lib.rs'
      - '.github/workflows/matter-nuclear-acquisition.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  acquisition-boundary:
    name: Transparent measurement-priority heuristic boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Lockfile must remain unchanged from PR base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          test -z "$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- Cargo.lock)"

      - name: Focused formatting
        run: cargo fmt --check -p symthaea-nuclear

      - name: Focused nuclear package check
        run: cargo check --locked -p symthaea-nuclear

      - name: Acquisition heuristic regressions
        run: cargo test --locked -p symthaea-nuclear active_learning::tests -- --nocapture --test-threads=1

      - name: Acquisition semantics ratchet
        shell: python
        run: |
          from pathlib import Path

          src = Path('crates/domains/symthaea-nuclear/src/active_learning.rs').read_text()

          forbidden = (
              'MlMassPredictor::new()',
              'ame2020_reference_nuclei',
              'information_gain',
              'FRIB-accessible',
              'FRIB MEASUREMENT',
              'pub uncertainty:',
              'pub expected_information_gain:',
              'pub experimentally_accessible:',
              'pub discovery_probability:',
          )
          for token in forbidden:
              if token in src:
                  raise SystemExit(f'forbidden acquisition overclaim/corpus shortcut: {token}')

          required = (
              'MlMassPredictor::fit_measured_with_config(training, rf_config)',
              'AcquisitionTrainingReceipt',
              'binding_energy_mev_bits',
              'tree_dispersion_proxy_mev',
              'unmeasured_neighbor_count_proxy',
              'shell_proximity_proxy',
              'acquisition_score_proxy',
              'HeuristicPriorityOnly',
              'MeasurementFeasibilityScope',
              'NotEvaluated',
              'ExternallyDeclared',
          )
          for token in required:
              if token not in src:
                  raise SystemExit(f'missing acquisition honesty token: {token}')

          if 'does not establish predictive calibration, expected scientific value, experimental feasibility, or causal information value' not in src:
              raise SystemExit('acquisition non-claim must remain explicit')

          print('acquisition heuristic semantics ratchet passed')
