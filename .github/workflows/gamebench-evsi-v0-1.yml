name: GameBench EVSI v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - research/gamebench-evsi-v0-1
    paths:
      - .github/workflows/gamebench-evsi-v0-1.yml
      - research/symthaea-gamebench-evsi-v0-1/**
  pull_request:
    paths:
      - .github/workflows/gamebench-evsi-v0-1.yml
      - research/symthaea-gamebench-evsi-v0-1/**

permissions:
  contents: read

jobs:
  qualify:
    name: Rust format, tests, and strict Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/symthaea-gamebench-evsi-v0-1/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/symthaea-gamebench-evsi-v0-1/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/symthaea-gamebench-evsi-v0-1/Cargo.toml --all-targets -- -D warnings
