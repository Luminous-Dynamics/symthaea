name: Wood Material Profile Benchmark

on:
  push:
    branches: ["feat/wood-material-profile-bench-v0-1"]
    paths:
      - "docs/tech/WOOD_MATERIAL_PROFILE_BENCHMARK_V0_1.md"
      - "docs/tech/wood-material-profile-corpus-v0.1.json"
      - "tools/wood-material-profile-bench/**"
      - ".github/workflows/wood-material-profile-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/tech/WOOD_MATERIAL_PROFILE_BENCHMARK_V0_1.md"
      - "docs/tech/wood-material-profile-corpus-v0.1.json"
      - "tools/wood-material-profile-bench/**"
      - ".github/workflows/wood-material-profile-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wood-material-profile-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/wood-material-profile-bench/Cargo.toml -- --check
      - name: Run contract and adversarial tests
        run: cargo test --manifest-path tools/wood-material-profile-bench/Cargo.toml
      - name: Validate corpus at the exact source commit
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/wood-material-profile-bench/Cargo.toml -- \
            docs/tech/wood-material-profile-corpus-v0.1.json \
            --source-commit "$source_commit" > wood-material-profile-receipt.json
          jq -e '
            .result == "validated"
            and .scenario_count == 8
            and .expected_controls_matched == 8
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and ([.scenarios[].scenario_id] == [
              "SYNTHETIC_SPECIES_DENSITY_FOR_CANDIDATE_RANKING",
              "SYNTHETIC_COMMON_NAME_NOT_STRUCTURAL_QUALIFICATION",
              "SYNTHETIC_SPECIES_MEAN_NOT_LOT_PROPERTY",
              "SYNTHETIC_GRAIN_DIRECTION_MISMATCH",
              "SYNTHETIC_MOISTURE_BASIS_MISMATCH",
              "SYNTHETIC_EXTERNAL_SOURCE_LICENSE_UNRESOLVED",
              "SYNTHETIC_MEASURED_PROPERTY_REFERENCE_MISSING",
              "SYNTHETIC_PROPERTY_UNIT_MISMATCH"
            ])
            and ([.scenarios[].actual_disposition] == [
              "pass", "reject", "reject", "reject", "reject", "reject", "reject", "reject"
            ])
          ' wood-material-profile-receipt.json
