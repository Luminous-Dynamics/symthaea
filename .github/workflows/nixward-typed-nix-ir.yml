name: NixWard typed Nix expression qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/core/nixward/src/typed_nix.rs"
      - "crates/core/nixward/src/lib.rs"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/nixward-typed-nix-ir.yml"
  push:
    branches: [main]
    paths:
      - "crates/core/nixward/src/typed_nix.rs"
      - "crates/core/nixward/src/lib.rs"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/nixward-typed-nix-ir.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixward-typed-nix-ir-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typed-nix-ir:
    name: typed-nix-ir
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check typed Nix builder formatting
        run: rustfmt +1.96.0 --check --edition 2024 crates/core/nixward/src/typed_nix.rs crates/core/nixward/src/lib.rs
      - name: Run typed Nix builder unit tests
        run: cargo +1.96.0 test --locked -p nixward --lib typed_nix::tests
