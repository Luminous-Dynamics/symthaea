name: CMAQ-026 decision-value contract

on:
  push:
    branches:
      - research/cmaq-026-decision-sufficient-probing-v0-1-20261127
    paths:
      - "research/cmaq-026/**"
      - ".github/workflows/cmaq-026.yml"
  pull_request:
    paths:
      - "research/cmaq-026/**"
      - ".github/workflows/cmaq-026.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-value:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: research/cmaq-026
        run: cargo +1.100.0 fmt --all -- --check
      - name: Run deterministic contract tests
        working-directory: research/cmaq-026
        run: cargo +1.100.0 test --locked
      - name: Strict Clippy
        working-directory: research/cmaq-026
        run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings
