name: SPINE-000B Integration Lowering Domain v1

on:
  push:
    branches:
      - research/spine-000b-integration-lowering-domain-v1
  pull_request:
    branches:
      - research/spine-000b-observer-noninterference-v1
    paths:
      - '.github/workflows/spine-000b-integration-lowering-domain-v1.yml'
      - 'docs/research/SPINE_000B_INTEGRATION_LOWERING_DOMAIN_V1.md'
      - 'scripts/spine_000b_integration_lowering_domain_v1.py'
      - 'docs/research/SPINE_000B_PHASE_C_APPLICATION_REGISTRY_V1.json'
      - 'scripts/verify_spine_000b_observer_noninterference_v1.py'

permissions:
  contents: read

jobs:
  n2:
    name: Qualify integrated and Phase-C lowering domain
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > /tmp/spine_n2_head
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1 > /tmp/spine_n2_pre_status
          test ! -s /tmp/spine_n2_pre_status

      - name: Constrain N2 subject surface
        shell: bash
        run: |
          set -euo pipefail
          base=860eb8f0c7bf568614007c4a2dbda934a02d062d
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base"..HEAD | sort > /tmp/spine_n2_changed
          : > /tmp/spine_n2_unexpected
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/spine-000b-integration-lowering-domain-v1.yml|\
              docs/research/SPINE_000B_INTEGRATION_LOWERING_DOMAIN_V1.md|\
              scripts/spine_000b_integration_lowering_domain_v1.py)
                ;;
              *) echo "$path" >> /tmp/spine_n2_unexpected ;;
            esac
          done < /tmp/spine_n2_changed
          if test -s /tmp/spine_n2_unexpected; then
            echo 'Unexpected N2 subject files:' >&2
            cat /tmp/spine_n2_unexpected >&2
            exit 1
          fi

      - name: Syntax-check N2 instrument
        run: python3 -m py_compile scripts/spine_000b_integration_lowering_domain_v1.py

      - name: Revalidate bound upstream static contracts
        run: |
          python3 scripts/verify_spine_000b_application_registry_v1.py
          python3 scripts/verify_spine_000b_observer_noninterference_v1.py

      - name: Execute N2 controls
        run: python3 scripts/spine_000b_integration_lowering_domain_v1.py --self-test

      - name: Seal exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/spine-000b-n2
          {
            echo 'schema=symthaea.spine.000b.integration-lowering-domain.v1'
            echo "git_head=$(git rev-parse HEAD)"
            echo "git_index_tree=$(git write-tree)"
            echo 'base_subject=860eb8f0c7bf568614007c4a2dbda934a02d062d'
            echo 'authority=measurement-only'
            echo 'runtime_application_execution_claimed=false'
            echo 'counterfactual_execution_claimed=false'
            echo 'causal_load_claimed=false'
          } > artifacts/spine-000b-n2/subject.txt
          cp /tmp/spine_n2_changed artifacts/spine-000b-n2/changed-files.txt
          sha256sum \
            docs/research/SPINE_000B_INTEGRATION_LOWERING_DOMAIN_V1.md \
            scripts/spine_000b_integration_lowering_domain_v1.py \
            docs/research/SPINE_000B_PHASE_C_APPLICATION_REGISTRY_V1.json \
            scripts/verify_spine_000b_observer_noninterference_v1.py \
            Cargo.toml Cargo.lock \
            artifacts/spine-000b-n2/subject.txt \
            > artifacts/spine-000b-n2/SHA256SUMS

      - name: Postflight checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat /tmp/spine_n2_head)"
          git status --porcelain=v1 > /tmp/spine_n2_post_status
          test ! -s /tmp/spine_n2_post_status

      - name: Upload N2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: spine-000b-n2-${{ github.sha }}
          path: artifacts/spine-000b-n2/
          retention-days: 90
