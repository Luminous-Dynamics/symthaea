name: EV intervention causal audit

on:
  pull_request:
    paths:
      - "docs/transport/EV_INTERVENTION_CAUSAL_AUDIT_V0_1.md"
      - "schemas/transport/ev_intervention_causal_scenario_v0_1.schema.json"
      - "fixtures/ev_battery/intervention_causal_scenarios_v0_1.json"
      - "tools/ev-intervention-causal-audit/**"
      - ".github/workflows/ev-intervention-causal-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Check formatting
        run: cargo fmt --manifest-path tools/ev-intervention-causal-audit/Cargo.toml -- --check

      - name: Run causal-audit and mutation tests
        run: cargo test --manifest-path tools/ev-intervention-causal-audit/Cargo.toml

      - name: Audit frozen synthetic scenarios
        run: |
          cargo run --manifest-path tools/ev-intervention-causal-audit/Cargo.toml -- \
            --schema schemas/transport/ev_intervention_causal_scenario_v0_1.schema.json \
            --corpus fixtures/ev_battery/intervention_causal_scenarios_v0_1.json \
            > "$RUNNER_TEMP/ev-intervention-causal-report.json"
          jq -e '
            .scenario_count == 7 and
            .estimated_count == 3 and
            .abstain_count == 2 and
            .rejected_count == 2 and
            (.report_sha256 | test("^[a-f0-9]{64}$"))
          ' "$RUNNER_TEMP/ev-intervention-causal-report.json"
