name: PIE-002E Subject-Bound Composition Oracle Qualification

on:
  push:
    branches:
      - qualify/pie-002e-oracle-89a86bdb
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify PIE-002E subject-bound composition oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUBJECT_SHA: 89a86bdb3d80cfbc83ce5399317686079484c903
      PARENT_SHA: 731ff61d1199d6e62fa63751de74f145c081c037
      SUBJECT_TREE: cb001059d71cd5b89e616b67043bfb7680889176
      ORACLE: scripts/pie-subject-bound-utility-composition-oracle.py
      EVIDENCE: docs/release/evidence/PIE_002E_SUBJECT_BOUND_UTILITY_COMPOSITION_ORACLE.md
    steps:
      - name: Checkout frozen subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 2

      - name: Verify exact subject, lineage, tree, and file scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          mapfile -t files < <(git diff --name-only "$PARENT_SHA" "$SUBJECT_SHA" | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "$EVIDENCE"
          test "${files[1]}" = "$ORACLE"

      - name: Record subject file digests
        run: sha256sum "$ORACLE" "$EVIDENCE" | tee pie-002e-oracle-files.sha256

      - name: Install Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Record Python identity
        run: python --version

      - name: Compile oracle syntax
        id: compile
        continue-on-error: true
        run: python -m py_compile "$ORACLE"

      - name: Execute oracle self-test
        id: selftest
        continue-on-error: true
        run: python "$ORACLE" --self-test

      - name: Emit machine-readable qualification receipt
        if: always()
        run: |
          cat > pie-002e-oracle-qualification.json <<EOF
          {
            "schema": "symthaea.pie.exact-subject-qualification.v1",
            "subject_sha": "$SUBJECT_SHA",
            "parent_sha": "$PARENT_SHA",
            "tree_sha": "$SUBJECT_TREE",
            "python": "3.13.5",
            "gates": {
              "syntax_compile": "${{ steps.compile.outcome }}",
              "self_test": "${{ steps.selftest.outcome }}"
            },
            "scope": "Current ProcessDefinition validation, in-call utility reprojection, and explicit binding composition only; not feasibility, dispatch, thermodynamics, provenance freshness, or execution authority."
          }
          EOF
          cat pie-002e-oracle-qualification.json

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-002e-subject-bound-composition-oracle-qualification
          path: |
            pie-002e-oracle-qualification.json
            pie-002e-oracle-files.sha256
          if-no-files-found: error

      - name: Enforce oracle gates
        if: always()
        run: |
          test "${{ steps.compile.outcome }}" = success
          test "${{ steps.selftest.outcome }}" = success
