name: REL-005A Qualification Assembly Contract

on:
  pull_request:
    paths:
      - ".github/rel/rel-005a-qualification-assembly-contract.json"
      - ".github/rel/verify-rel-005a-qualification-assembly-contract.py"
      - ".github/workflows/rel-005a-qualification-assembly-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rel-005a-qualification-assembly-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 07af7c4bdfdda377aa8175efe7a3233ce90e889e
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPARISON_HEAD: 9ed033eb5ad63baa90d9c25166ce9c14e68013cb
  COMPARISON_RUN_ID: "35324217302"
  PROJECTION_HEAD: 07af7c4bdfdda377aa8175efe7a3233ce90e889e
  PROJECTION_RUN_ID: "35324485955"

jobs:
  assembly-contract:
    name: Verify QualificationAssemblyOnly preregistration
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Checkout exact assembly-contract subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Bind exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          mapfile -t changed < <(git diff --name-only "${EXPECTED_PARENT}" HEAD | sort)
          expected=(
            ".github/rel/rel-005a-qualification-assembly-contract.json"
            ".github/rel/verify-rel-005a-qualification-assembly-contract.py"
            ".github/workflows/rel-005a-qualification-assembly-contract.yml"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"

      - name: Verify preregistered upstream run identities exist without reading outcomes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${auth[@]}" "${api}/actions/runs/${COMPARISON_RUN_ID}" > "${RUNNER_TEMP}/comparison-run.json"
          curl -fsSL "${auth[@]}" "${api}/actions/runs/${PROJECTION_RUN_ID}" > "${RUNNER_TEMP}/projection-run.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          comparison = json.loads((root / 'comparison-run.json').read_text())
          projection = json.loads((root / 'projection-run.json').read_text())
          assert str(comparison['id']) == os.environ['COMPARISON_RUN_ID']
          assert comparison['head_sha'] == os.environ['COMPARISON_HEAD']
          assert comparison['name'] == 'REL-005A ComparisonOnly V3'
          assert str(projection['id']) == os.environ['PROJECTION_RUN_ID']
          assert projection['head_sha'] == os.environ['PROJECTION_HEAD']
          assert projection['name'] == 'REL-005A Qualification Projection Contract'
          # Deliberately do not inspect status, conclusion, artifacts, predicate
          # counts, or any scientific result here. This contract binds identity
          # before those outcome-dependent values are available.
          PY

      - name: Verify QualificationAssemblyContractOnly boundary
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/qualification-assembly-contract-receipt.json
        run: |
          set -euo pipefail
          python3 .github/rel/verify-rel-005a-qualification-assembly-contract.py | tee "${RECEIPT}"
          python3 -m json.tool "${RECEIPT}" >/dev/null
          python3 - <<'PY'
          import json, os, pathlib
          receipt = json.loads(pathlib.Path(os.environ['RECEIPT']).read_text())
          assert receipt['authority'] == 'QualificationAssemblyContractOnly'
          assert receipt['comparison_run_preregistered'] is True
          assert receipt['projection_run_preregistered'] is True
          assert receipt['outcome_preselected'] is False
          assert receipt['fresh_qualification_job_required'] is True
          assert receipt['metric_free_boundary_required'] is True
          assert not any(receipt['claims'].values())
          PY

      - name: Upload static assembly-contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-qualification-assembly-contract-${{ env.EXPECTED_HEAD }}
          path: |
            .github/rel/rel-005a-qualification-assembly-contract.json
            ${{ runner.temp }}/qualification-assembly-contract-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Postflight exact subject and checkout immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
