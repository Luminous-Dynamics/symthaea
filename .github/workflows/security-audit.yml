name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Preserve scan history for each exact subject instead of canceling old evidence.
concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    name: Shared security audit
    uses: Luminous-Dynamics/luminous-platform/.github/workflows/security-audit.yml@0d1e2bec5981ddd273333fa36b87ddc67b7d5944
    with:
      subject_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      audit_engine_sha: 0d1e2bec5981ddd273333fa36b87ddc67b7d5944
      audit_rust: true
