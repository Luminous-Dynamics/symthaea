name: Butlin GWT-1 Trusted Final Resolution

on:
  workflow_call:
    inputs:
      evidence_subject_sha:
        description: Exact specialist evidence-subject commit shared by direct and causal lineages
        required: true
        type: string
      direct_run_id:
        description: Workflow run ID that produced the trusted direct package
        required: true
        type: string
      direct_run_attempt:
        description: Workflow run attempt that produced the trusted direct package
        required: true
        type: string
      causal_run_id:
        description: Causal trusted-builder run ID named by the promotion package
        required: true
        type: string
      causal_run_attempt:
        description: Causal trusted-builder run attempt named by the promotion package
        required: true
        type: string
      promotion_run_id:
        description: Workflow run ID that produced the trusted promotion package
        required: true
        type: string
      promotion_run_attempt:
        description: Workflow run attempt that produced the trusted promotion package
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: Verify both roots and attest final resolved view
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout exact final-resolution authority revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact input and workflow identities
        shell: bash
        env:
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          DIRECT_RUN_ID: ${{ inputs.direct_run_id }}
          DIRECT_RUN_ATTEMPT: ${{ inputs.direct_run_attempt }}
          CAUSAL_RUN_ID: ${{ inputs.causal_run_id }}
          CAUSAL_RUN_ATTEMPT: ${{ inputs.causal_run_attempt }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
          RESOLUTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
          RESOLUTION_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RESOLUTION_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          test "$RESOLUTION_WORKFLOW_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$RESOLUTION_WORKFLOW_PATH" = ".github/workflows/butlin-gwt1-trusted-final-resolution.yml"
          [[ "$RESOLUTION_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          for value in "$DIRECT_RUN_ID" "$DIRECT_RUN_ATTEMPT" "$CAUSAL_RUN_ID" "$CAUSAL_RUN_ATTEMPT" "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT"; do
            [[ "$value" =~ ^[0-9]+$ ]]
          done
          test "$(git rev-parse HEAD)" = "$RESOLUTION_WORKFLOW_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install exact GitHub CLI attestation verifier
        id: trusted_gh
        shell: bash
        env:
          TRUSTED_GH_VERSION: "2.100.0"
          TRUSTED_GH_ARCHIVE_URL: "https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz"
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_ROOT: ${{ runner.temp }}/gwt1-final-trusted-gh
          TRUSTED_GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-final-trusted-gh-config
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -x /usr/bin/curl
          test -x /usr/bin/sha256sum
          test -x /usr/bin/tar
          test -x /usr/bin/awk
          rm -rf "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          mkdir -p "$TRUSTED_GH_ROOT" "$TRUSTED_GH_CONFIG_DIR"
          chmod 0700 "$TRUSTED_GH_CONFIG_DIR"
          archive="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$TRUSTED_GH_ARCHIVE_URL"
          printf '%s  %s\n' "$TRUSTED_GH_ARCHIVE_SHA256" "$archive" | /usr/bin/sha256sum -c -
          /usr/bin/tar --no-same-owner -xzf "$archive" -C "$TRUSTED_GH_ROOT"
          gh_path="$TRUSTED_GH_ROOT/gh_${TRUSTED_GH_VERSION}_linux_amd64/bin/gh"
          test -x "$gh_path"
          version_output="$($gh_path --version)"
          test "$(printf '%s\n' "$version_output" | /usr/bin/awk 'NR==1{print $3}')" = "$TRUSTED_GH_VERSION"
          gh_binary_sha256="$(/usr/bin/sha256sum "$gh_path" | /usr/bin/awk '{print $1}')"
          version_output_sha256="$(printf '%s' "$version_output" | /usr/bin/sha256sum | /usr/bin/awk '{print $1}')"
          [[ "$gh_binary_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$version_output_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "gh_path=$gh_path" >> "$GITHUB_OUTPUT"
          echo "gh_binary_sha256=$gh_binary_sha256" >> "$GITHUB_OUTPUT"
          echo "version_output_sha256=$version_output_sha256" >> "$GITHUB_OUTPUT"

      # Bootstrap candidates only. Before activation these must be replaced by
      # reviewed/landed immutable revisions. A draft SHA is not an approval.
      - name: Download exact trusted direct package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gwt1-trusted-attested-${{ inputs.evidence_subject_sha }}-${{ inputs.direct_run_id }}-${{ inputs.direct_run_attempt }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.direct_run_id }}
          path: ${{ runner.temp }}/gwt1-final-direct

      - name: Download exact trusted promotion package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gwt1-causal-promotion-attested-${{ inputs.evidence_subject_sha }}-${{ inputs.causal_run_id }}-${{ inputs.promotion_run_id }}-${{ inputs.promotion_run_attempt }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.promotion_run_id }}
          path: ${{ runner.temp }}/gwt1-final-promotion

      - name: Verify direct package transport structure and checksums
        shell: bash
        env:
          DIRECT_DIR: ${{ runner.temp }}/gwt1-final-direct
        run: |
          set -euo pipefail
          required=(
            gwt1-evidence.tar.gz
            gwt1-evidence.tar.gz.sha256
            archive_admission.json
            archive_admission_profile.json
            archive_admission_engine.py
            direct_verifier_profile.json
            direct_verifier_profile.json.sha256
            attestation/attestation.json
            attestation/attestation.json.sha256
            attestation/verification.json
            attestation/verification.json.sha256
            attestation/verifier-profile-attestation.json
            attestation/verifier-profile-attestation.json.sha256
            attestation/verifier-profile-verification.json
            attestation/verifier-profile-verification.json.sha256
          )
          for path in "${required[@]}"; do test -f "$DIRECT_DIR/$path"; done
          (cd "$DIRECT_DIR" && /usr/bin/sha256sum -c gwt1-evidence.tar.gz.sha256 && /usr/bin/sha256sum -c direct_verifier_profile.json.sha256)
          (
            cd "$DIRECT_DIR/attestation"
            /usr/bin/sha256sum -c attestation.json.sha256
            /usr/bin/sha256sum -c verification.json.sha256
            /usr/bin/sha256sum -c verifier-profile-attestation.json.sha256
            /usr/bin/sha256sum -c verifier-profile-verification.json.sha256
          )

      - name: Freshly verify direct archive and direct verifier profile
        id: direct_verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-final-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          DIRECT_DIR: ${{ runner.temp }}/gwt1-final-direct
          APPROVED_DIRECT_BUILDER_SHA: 6eaf73a20047b99120e59eb96f48ae0e194e2c80
        run: |
          set -euo pipefail
          unset GH_HOST GH_ENTERPRISE_TOKEN
          mkdir -p "$DIRECT_DIR/final-input"
          "$TRUSTED_GH_PATH" attestation verify "$DIRECT_DIR/gwt1-evidence.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --bundle "$DIRECT_DIR/attestation/attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-trusted-builder.yml" \
            --signer-digest "$APPROVED_DIRECT_BUILDER_SHA" --deny-self-hosted-runners --format json > "$DIRECT_DIR/final-input/archive-verification.json"
          "$TRUSTED_GH_PATH" attestation verify "$DIRECT_DIR/direct_verifier_profile.json" --repo "$GITHUB_REPOSITORY" \
            --bundle "$DIRECT_DIR/attestation/verifier-profile-attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-trusted-builder.yml" \
            --signer-digest "$APPROVED_DIRECT_BUILDER_SHA" --deny-self-hosted-runners --format json > "$DIRECT_DIR/final-input/profile-verification.json"
          test -s "$DIRECT_DIR/final-input/archive-verification.json"
          test -s "$DIRECT_DIR/final-input/profile-verification.json"
          echo "archive_verification_sha256=$(/usr/bin/sha256sum "$DIRECT_DIR/final-input/archive-verification.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "profile_verification_sha256=$(/usr/bin/sha256sum "$DIRECT_DIR/final-input/profile-verification.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Validate direct verifier/admission profile and re-admit archive
        id: direct_admission
        shell: bash
        env:
          DIRECT_DIR: ${{ runner.temp }}/gwt1-final-direct
          TRUSTED_ENGINE: ${{ github.workspace }}/.github/scripts/evidence_archive_admission.py
          TRUSTED_PROFILE: ${{ github.workspace }}/.github/evidence-profiles/gwt1-direct-evidence-v1.json
          APPROVED_DIRECT_BUILDER_SHA: 6eaf73a20047b99120e59eb96f48ae0e194e2c80
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.gh_binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          DIRECT_RUN_ID: ${{ inputs.direct_run_id }}
          DIRECT_RUN_ATTEMPT: ${{ inputs.direct_run_attempt }}
        run: |
          set -euo pipefail
          archive_sha256="$(/usr/bin/sha256sum "$DIRECT_DIR/gwt1-evidence.tar.gz" | /usr/bin/awk '{print $1}')"
          engine_sha256="$(/usr/bin/sha256sum "$TRUSTED_ENGINE" | /usr/bin/awk '{print $1}')"
          profile_sha256="$(/usr/bin/sha256sum "$TRUSTED_PROFILE" | /usr/bin/awk '{print $1}')"
          preserved_engine_sha256="$(/usr/bin/sha256sum "$DIRECT_DIR/archive_admission_engine.py" | /usr/bin/awk '{print $1}')"
          preserved_profile_sha256="$(/usr/bin/sha256sum "$DIRECT_DIR/archive_admission_profile.json" | /usr/bin/awk '{print $1}')"
          preserved_result_sha256="$(/usr/bin/sha256sum "$DIRECT_DIR/archive_admission.json" | /usr/bin/awk '{print $1}')"
          test "$engine_sha256" = "$preserved_engine_sha256"
          test "$profile_sha256" = "$preserved_profile_sha256"
          /usr/bin/cmp -s "$TRUSTED_ENGINE" "$DIRECT_DIR/archive_admission_engine.py"
          /usr/bin/cmp -s "$TRUSTED_PROFILE" "$DIRECT_DIR/archive_admission_profile.json"
          /usr/bin/jq -e --arg repository "$GITHUB_REPOSITORY" --arg builder_sha "$APPROVED_DIRECT_BUILDER_SHA" \
            --arg dist_sha "$TRUSTED_GH_ARCHIVE_SHA256" --arg binary_sha "$TRUSTED_GH_BINARY_SHA256" --arg version_sha "$TRUSTED_GH_VERSION_OUTPUT_SHA256" \
            --arg archive_sha "$archive_sha256" --arg engine_sha "$engine_sha256" --arg profile_sha "$profile_sha256" --arg result_sha "$preserved_result_sha256" \
            '.schema=="butlin-gwt1-direct-attestation-verifier-profile-v2" and .repository==$repository and .trusted_builder_sha==$builder_sha and .verifier=="github-cli" and .verifier_version=="2.100.0" and .distribution_sha256==$dist_sha and .executable_sha256==$binary_sha and .version_output_sha256==$version_sha and .configuration_policy=="isolated-gh-config-v1" and .archive_admission_profile_id=="gwt1-direct-evidence-archive-v1" and .archive_admission_engine_sha256==$engine_sha and .archive_admission_profile_sha256==$profile_sha and .archive_admission_result_sha256==$result_sha and .deny_self_hosted_runners==true and .evidence_archive_sha256==$archive_sha' \
            "$DIRECT_DIR/direct_verifier_profile.json" >/dev/null
          /usr/bin/jq -e --arg archive_sha "$archive_sha256" \
            '.schema=="butlin-evidence-archive-admission-result-v1" and .profile_id=="gwt1-direct-evidence-archive-v1" and .archive_sha256==$archive_sha and .archive_bytes>0 and .tar_stream_bytes>0 and .member_count==7 and .total_unpacked_bytes>0' \
            "$DIRECT_DIR/archive_admission.json" >/dev/null
          rm -rf "$DIRECT_DIR/final-input/extracted"
          mkdir -p "$DIRECT_DIR/final-input/extracted"
          /usr/bin/python3 "$TRUSTED_ENGINE" --profile "$TRUSTED_PROFILE" --archive "$DIRECT_DIR/gwt1-evidence.tar.gz" \
            --output-dir "$DIRECT_DIR/final-input/extracted" > "$DIRECT_DIR/final-input/archive-admission.json"
          (cd "$DIRECT_DIR/final-input/extracted/gwt1-evidence" && /usr/bin/sha256sum -c SHA256SUMS)
          /usr/bin/jq -e --arg repository "$GITHUB_REPOSITORY" --arg subject "$EVIDENCE_SUBJECT_SHA" --arg builder_sha "$APPROVED_DIRECT_BUILDER_SHA" \
            --arg run_id "$DIRECT_RUN_ID" --arg run_attempt "$DIRECT_RUN_ATTEMPT" \
            '.schema=="butlin-gwt1-trusted-builder-provenance-v1" and .repository==$repository and .evidence_subject_sha==$subject and .trusted_builder_sha==$builder_sha and .run_id==$run_id and .run_attempt==$run_attempt' \
            "$DIRECT_DIR/final-input/extracted/gwt1-evidence/workflow_provenance.json" >/dev/null
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "engine_sha256=$engine_sha256" >> "$GITHUB_OUTPUT"
          echo "profile_sha256=$profile_sha256" >> "$GITHUB_OUTPUT"
          echo "admission_result_sha256=$(/usr/bin/sha256sum "$DIRECT_DIR/final-input/archive-admission.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "verifier_profile_sha256=$(/usr/bin/sha256sum "$DIRECT_DIR/direct_verifier_profile.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify promotion package checksums and exact source provenance
        shell: bash
        env:
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-final-promotion
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          CAUSAL_RUN_ID: ${{ inputs.causal_run_id }}
          CAUSAL_RUN_ATTEMPT: ${{ inputs.causal_run_attempt }}
          APPROVED_CAUSAL_BUILDER_SHA: 21f83eece23c8ee9c2f8fa3c1fc1ab3f555c40e7
          APPROVED_PROMOTION_WORKFLOW_SHA: b5b693f3162ac4c66d00e2391f77a6e86a84a788
        run: |
          set -euo pipefail
          required=(
            promotion_capsule.json
            promotion_verifier_profile.json
            promotion_provenance.json
            archive_admission.json
            archive_admission_profile.json
            archive_admission_engine.py
            upstream/causal_builder_verifier_profile.json
            upstream/causal_builder_verifier_profile_verification.json
            upstream/causal_archive_verification.json
            upstream/causal_builder_archive_admission.json
            upstream/causal_builder_archive_admission_profile.json
            upstream/causal_builder_archive_admission_engine.py
            SHA256SUMS
            attestation/attestation.json
            attestation/attestation.json.sha256
            attestation/verification.json
            attestation/verification.json.sha256
            attestation/verifier-profile-attestation.json
            attestation/verifier-profile-attestation.json.sha256
            attestation/verifier-profile-verification.json
            attestation/verifier-profile-verification.json.sha256
          )
          for path in "${required[@]}"; do test -f "$PROMOTION_DIR/$path"; done
          (cd "$PROMOTION_DIR" && /usr/bin/sha256sum -c SHA256SUMS)
          (
            cd "$PROMOTION_DIR/attestation"
            /usr/bin/sha256sum -c attestation.json.sha256
            /usr/bin/sha256sum -c verification.json.sha256
            /usr/bin/sha256sum -c verifier-profile-attestation.json.sha256
            /usr/bin/sha256sum -c verifier-profile-verification.json.sha256
          )
          /usr/bin/jq -e --arg repository "$GITHUB_REPOSITORY" --arg promotion_sha "$APPROVED_PROMOTION_WORKFLOW_SHA" \
            --arg builder_sha "$APPROVED_CAUSAL_BUILDER_SHA" --arg subject "$EVIDENCE_SUBJECT_SHA" --arg causal_run "$CAUSAL_RUN_ID" --arg causal_attempt "$CAUSAL_RUN_ATTEMPT" \
            '.schema=="butlin-gwt1-causal-promotion-provenance-v2" and .repository==$repository and .promotion_workflow_sha==$promotion_sha and .approved_causal_builder_sha==$builder_sha and .evidence_subject_sha==$subject and .source_run_id==$causal_run and .source_run_attempt==$causal_attempt' \
            "$PROMOTION_DIR/promotion_provenance.json" >/dev/null

      - name: Freshly verify promotion capsule and promotion verifier profile
        id: promotion_verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-final-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-final-promotion
          APPROVED_PROMOTION_WORKFLOW_SHA: b5b693f3162ac4c66d00e2391f77a6e86a84a788
        run: |
          set -euo pipefail
          unset GH_HOST GH_ENTERPRISE_TOKEN
          mkdir -p "$PROMOTION_DIR/final-input"
          "$TRUSTED_GH_PATH" attestation verify "$PROMOTION_DIR/promotion_capsule.json" --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROMOTION_DIR/attestation/attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-causal-trusted-promotion.yml" \
            --signer-digest "$APPROVED_PROMOTION_WORKFLOW_SHA" --deny-self-hosted-runners --format json > "$PROMOTION_DIR/final-input/capsule-verification.json"
          "$TRUSTED_GH_PATH" attestation verify "$PROMOTION_DIR/promotion_verifier_profile.json" --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROMOTION_DIR/attestation/verifier-profile-attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-causal-trusted-promotion.yml" \
            --signer-digest "$APPROVED_PROMOTION_WORKFLOW_SHA" --deny-self-hosted-runners --format json > "$PROMOTION_DIR/final-input/profile-verification.json"
          test -s "$PROMOTION_DIR/final-input/capsule-verification.json"
          test -s "$PROMOTION_DIR/final-input/profile-verification.json"
          echo "capsule_verification_sha256=$(/usr/bin/sha256sum "$PROMOTION_DIR/final-input/capsule-verification.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "profile_verification_sha256=$(/usr/bin/sha256sum "$PROMOTION_DIR/final-input/profile-verification.json" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Validate promotion verifier profile against exact capsule
        id: promotion_profile
        shell: bash
        env:
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-final-promotion
          APPROVED_PROMOTION_WORKFLOW_SHA: b5b693f3162ac4c66d00e2391f77a6e86a84a788
          TRUSTED_GH_ARCHIVE_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.gh_binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
        run: |
          set -euo pipefail
          capsule_sha256="$(/usr/bin/sha256sum "$PROMOTION_DIR/promotion_capsule.json" | /usr/bin/awk '{print $1}')"
          profile_sha256="$(/usr/bin/sha256sum "$PROMOTION_DIR/promotion_verifier_profile.json" | /usr/bin/awk '{print $1}')"
          /usr/bin/jq -e --arg repository "$GITHUB_REPOSITORY" --arg promotion_sha "$APPROVED_PROMOTION_WORKFLOW_SHA" \
            --arg dist_sha "$TRUSTED_GH_ARCHIVE_SHA256" --arg binary_sha "$TRUSTED_GH_BINARY_SHA256" --arg version_sha "$TRUSTED_GH_VERSION_OUTPUT_SHA256" --arg capsule_sha "$capsule_sha256" \
            '.schema=="butlin-gwt1-attestation-verifier-profile-v2" and .repository==$repository and .promotion_workflow_sha==$promotion_sha and .verifier=="github-cli" and .verifier_version=="2.100.0" and .distribution_sha256==$dist_sha and .executable_sha256==$binary_sha and .version_output_sha256==$version_sha and .configuration_policy=="isolated-gh-config-v1" and .deny_self_hosted_runners==true and .capsule_sha256==$capsule_sha' \
            "$PROMOTION_DIR/promotion_verifier_profile.json" >/dev/null
          /usr/bin/jq -e --arg subject "$EVIDENCE_SUBJECT_SHA" '.evidence_subject.source_commit_sha==$subject' "$PROMOTION_DIR/promotion_capsule.json" >/dev/null
          echo "capsule_sha256=$capsule_sha256" >> "$GITHUB_OUTPUT"
          echo "verifier_profile_sha256=$profile_sha256" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust 1.96.0 for final resolver
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      - name: Generate deterministic non-authoritative resolution candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_HOME: ${{ runner.temp }}/gwt1-final-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-final-target
          SYMTHAEA_GWT1_DIRECT_EVIDENCE_DIR: ${{ runner.temp }}/gwt1-final-direct/final-input/extracted/gwt1-evidence
          GWT1_CAUSAL_PROMOTION_CAPSULE: ${{ runner.temp }}/gwt1-final-promotion/promotion_capsule.json
          GWT1_CAUSAL_PROMOTION_ATTESTATION_BUNDLE: ${{ runner.temp }}/gwt1-final-promotion/attestation/attestation.json
          GWT1_TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          GWT1_TRUSTED_SHA256SUM_PATH: /usr/bin/sha256sum
          GWT1_TRUSTED_GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-final-trusted-gh-config
          GWT1_FINAL_RESOLUTION_OUTPUT_DIR: ${{ runner.temp }}/gwt1-final-candidate
        run: |
          set -euo pipefail
          unset GH_HOST GH_ENTERPRISE_TOKEN
          cargo run --locked -p symthaea-psych-bench --features symthaea-backend --bin gwt1_generate_trusted_resolution_candidate
          test -s "$GWT1_FINAL_RESOLUTION_OUTPUT_DIR/base_report.json"
          test -s "$GWT1_FINAL_RESOLUTION_OUTPUT_DIR/resolved_view_v2.json"
          test -s "$GWT1_FINAL_RESOLUTION_OUTPUT_DIR/gwt1_evidence_disposition.json"
          test -s "$GWT1_FINAL_RESOLUTION_OUTPUT_DIR/resolution_candidate.json"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Freeze final authority records and deterministic archive
        id: package
        shell: bash
        env:
          DIRECT_DIR: ${{ runner.temp }}/gwt1-final-direct
          PROMOTION_DIR: ${{ runner.temp }}/gwt1-final-promotion
          CANDIDATE_DIR: ${{ runner.temp }}/gwt1-final-candidate
          PACKAGE_ROOT: ${{ runner.temp }}/gwt1-final-package
          RESOLUTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
          RESOLUTION_WORKFLOW_REF: ${{ job.workflow_ref }}
          APPROVED_DIRECT_BUILDER_SHA: 6eaf73a20047b99120e59eb96f48ae0e194e2c80
          APPROVED_CAUSAL_BUILDER_SHA: 21f83eece23c8ee9c2f8fa3c1fc1ab3f555c40e7
          APPROVED_PROMOTION_WORKFLOW_SHA: b5b693f3162ac4c66d00e2391f77a6e86a84a788
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          DIRECT_RUN_ID: ${{ inputs.direct_run_id }}
          DIRECT_RUN_ATTEMPT: ${{ inputs.direct_run_attempt }}
          CAUSAL_RUN_ID: ${{ inputs.causal_run_id }}
          CAUSAL_RUN_ATTEMPT: ${{ inputs.causal_run_attempt }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
          DIRECT_ARCHIVE_SHA256: ${{ steps.direct_admission.outputs.archive_sha256 }}
          DIRECT_PROFILE_SHA256: ${{ steps.direct_admission.outputs.verifier_profile_sha256 }}
          DIRECT_ARCHIVE_VERIFICATION_SHA256: ${{ steps.direct_verify.outputs.archive_verification_sha256 }}
          DIRECT_PROFILE_VERIFICATION_SHA256: ${{ steps.direct_verify.outputs.profile_verification_sha256 }}
          DIRECT_ADMISSION_RESULT_SHA256: ${{ steps.direct_admission.outputs.admission_result_sha256 }}
          DIRECT_ADMISSION_ENGINE_SHA256: ${{ steps.direct_admission.outputs.engine_sha256 }}
          DIRECT_ADMISSION_PROFILE_SHA256: ${{ steps.direct_admission.outputs.profile_sha256 }}
          PROMOTION_CAPSULE_SHA256: ${{ steps.promotion_profile.outputs.capsule_sha256 }}
          PROMOTION_PROFILE_SHA256: ${{ steps.promotion_profile.outputs.verifier_profile_sha256 }}
          PROMOTION_CAPSULE_VERIFICATION_SHA256: ${{ steps.promotion_verify.outputs.capsule_verification_sha256 }}
          PROMOTION_PROFILE_VERIFICATION_SHA256: ${{ steps.promotion_verify.outputs.profile_verification_sha256 }}
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.gh_binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
        run: |
          set -euo pipefail
          stage="$PACKAGE_ROOT/gwt1-final-resolution"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$stage/authority/direct" "$stage/authority/promotion" "$stage/sources/direct" "$stage/sources/promotion/upstream" "$stage/environment"

          /usr/bin/install -m 0644 "$CANDIDATE_DIR/base_report.json" "$stage/base_report.json"
          /usr/bin/install -m 0644 "$CANDIDATE_DIR/resolved_view_v2.json" "$stage/resolved_view_v2.json"
          /usr/bin/install -m 0644 "$CANDIDATE_DIR/gwt1_evidence_disposition.json" "$stage/gwt1_evidence_disposition.json"
          /usr/bin/install -m 0644 "$CANDIDATE_DIR/resolution_candidate.json" "$stage/resolution_candidate.json"

          # Preserve exact direct source bytes for replay after Actions artifact expiry.
          /usr/bin/install -m 0644 "$DIRECT_DIR/gwt1-evidence.tar.gz" "$stage/sources/direct/gwt1-evidence.tar.gz"
          /usr/bin/install -m 0644 "$DIRECT_DIR/gwt1-evidence.tar.gz.sha256" "$stage/sources/direct/gwt1-evidence.tar.gz.sha256"
          /usr/bin/install -m 0644 "$DIRECT_DIR/archive_admission.json" "$stage/sources/direct/archive_admission.json"
          /usr/bin/install -m 0644 "$DIRECT_DIR/archive_admission_profile.json" "$stage/sources/direct/archive_admission_profile.json"
          /usr/bin/install -m 0644 "$DIRECT_DIR/archive_admission_engine.py" "$stage/sources/direct/archive_admission_engine.py"
          /usr/bin/install -m 0644 "$DIRECT_DIR/direct_verifier_profile.json" "$stage/sources/direct/direct_verifier_profile.json"
          /usr/bin/install -m 0644 "$DIRECT_DIR/direct_verifier_profile.json.sha256" "$stage/sources/direct/direct_verifier_profile.json.sha256"

          # Preserve the complete non-attestation promotion source package.
          /usr/bin/install -m 0644 "$PROMOTION_DIR/promotion_capsule.json" "$stage/sources/promotion/promotion_capsule.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/promotion_verifier_profile.json" "$stage/sources/promotion/promotion_verifier_profile.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/promotion_provenance.json" "$stage/sources/promotion/promotion_provenance.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/archive_admission.json" "$stage/sources/promotion/archive_admission.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/archive_admission_profile.json" "$stage/sources/promotion/archive_admission_profile.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/archive_admission_engine.py" "$stage/sources/promotion/archive_admission_engine.py"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/SHA256SUMS" "$stage/sources/promotion/SHA256SUMS"
          for name in \
            causal_builder_verifier_profile.json \
            causal_builder_verifier_profile_verification.json \
            causal_archive_verification.json \
            causal_builder_archive_admission.json \
            causal_builder_archive_admission_profile.json \
            causal_builder_archive_admission_engine.py; do
            /usr/bin/install -m 0644 "$PROMOTION_DIR/upstream/$name" "$stage/sources/promotion/upstream/$name"
          done

          /usr/bin/install -m 0644 "$DIRECT_DIR/direct_verifier_profile.json" "$stage/authority/direct/direct_verifier_profile.json"
          /usr/bin/install -m 0644 "$DIRECT_DIR/final-input/archive-verification.json" "$stage/authority/direct/fresh_archive_verification.json"
          /usr/bin/install -m 0644 "$DIRECT_DIR/final-input/profile-verification.json" "$stage/authority/direct/fresh_profile_verification.json"
          /usr/bin/install -m 0644 "$DIRECT_DIR/final-input/archive-admission.json" "$stage/authority/direct/fresh_archive_admission.json"
          /usr/bin/install -m 0644 "$DIRECT_DIR/attestation/attestation.json" "$stage/authority/direct/archive_attestation.json"
          /usr/bin/install -m 0644 "$DIRECT_DIR/attestation/verifier-profile-attestation.json" "$stage/authority/direct/profile_attestation.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/promotion_verifier_profile.json" "$stage/authority/promotion/promotion_verifier_profile.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/promotion_provenance.json" "$stage/authority/promotion/promotion_provenance.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/final-input/capsule-verification.json" "$stage/authority/promotion/fresh_capsule_verification.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/final-input/profile-verification.json" "$stage/authority/promotion/fresh_profile_verification.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/attestation/attestation.json" "$stage/authority/promotion/capsule_attestation.json"
          /usr/bin/install -m 0644 "$PROMOTION_DIR/attestation/verifier-profile-attestation.json" "$stage/authority/promotion/profile_attestation.json"

          /usr/bin/jq -n --arg schema butlin-gwt1-final-direct-authority-v1 --arg repository "$GITHUB_REPOSITORY" --arg builder_sha "$APPROVED_DIRECT_BUILDER_SHA" \
            --arg subject "$EVIDENCE_SUBJECT_SHA" --arg run_id "$DIRECT_RUN_ID" --arg run_attempt "$DIRECT_RUN_ATTEMPT" --arg archive_sha "$DIRECT_ARCHIVE_SHA256" \
            --arg verifier_profile_sha "$DIRECT_PROFILE_SHA256" --arg archive_verification_sha "$DIRECT_ARCHIVE_VERIFICATION_SHA256" --arg profile_verification_sha "$DIRECT_PROFILE_VERIFICATION_SHA256" \
            --arg admission_result_sha "$DIRECT_ADMISSION_RESULT_SHA256" --arg admission_engine_sha "$DIRECT_ADMISSION_ENGINE_SHA256" --arg admission_profile_sha "$DIRECT_ADMISSION_PROFILE_SHA256" \
            '{schema:$schema,repository:$repository,approved_direct_builder_sha:$builder_sha,evidence_subject_sha:$subject,source_run_id:$run_id,source_run_attempt:$run_attempt,evidence_archive_sha256:$archive_sha,direct_verifier_profile_sha256:$verifier_profile_sha,fresh_archive_verification_sha256:$archive_verification_sha,fresh_profile_verification_sha256:$profile_verification_sha,fresh_archive_admission_sha256:$admission_result_sha,archive_admission_engine_sha256:$admission_engine_sha,archive_admission_profile_sha256:$admission_profile_sha}' \
            > "$stage/authority/direct/authority.json"

          /usr/bin/jq -n --arg schema butlin-gwt1-final-promotion-authority-v1 --arg repository "$GITHUB_REPOSITORY" --arg builder_sha "$APPROVED_CAUSAL_BUILDER_SHA" \
            --arg promotion_sha "$APPROVED_PROMOTION_WORKFLOW_SHA" --arg subject "$EVIDENCE_SUBJECT_SHA" --arg causal_run "$CAUSAL_RUN_ID" --arg causal_attempt "$CAUSAL_RUN_ATTEMPT" \
            --arg promotion_run "$PROMOTION_RUN_ID" --arg promotion_attempt "$PROMOTION_RUN_ATTEMPT" --arg capsule_sha "$PROMOTION_CAPSULE_SHA256" --arg verifier_profile_sha "$PROMOTION_PROFILE_SHA256" \
            --arg capsule_verification_sha "$PROMOTION_CAPSULE_VERIFICATION_SHA256" --arg profile_verification_sha "$PROMOTION_PROFILE_VERIFICATION_SHA256" \
            '{schema:$schema,repository:$repository,approved_causal_builder_sha:$builder_sha,approved_promotion_workflow_sha:$promotion_sha,evidence_subject_sha:$subject,causal_run_id:$causal_run,causal_run_attempt:$causal_attempt,promotion_run_id:$promotion_run,promotion_run_attempt:$promotion_attempt,promotion_capsule_sha256:$capsule_sha,promotion_verifier_profile_sha256:$verifier_profile_sha,fresh_capsule_verification_sha256:$capsule_verification_sha,fresh_profile_verification_sha256:$profile_verification_sha}' \
            > "$stage/authority/promotion/authority.json"

          rustc --version --verbose > "$stage/rust-toolchain.txt"
          toolchain_sha="$(/usr/bin/sha256sum "$stage/rust-toolchain.txt" | /usr/bin/awk '{print $1}')"
          base_report_blake3="$(/usr/bin/jq -r '.base_report_blake3' "$stage/resolved_view_v2.json")"
          /usr/bin/jq -n --arg schema butlin-gwt1-trusted-final-resolution-provenance-v1 --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_sha "$RESOLUTION_WORKFLOW_SHA" --arg workflow_ref "$RESOLUTION_WORKFLOW_REF" --arg base_report_blake3 "$base_report_blake3" --arg toolchain_sha "$toolchain_sha" \
            --arg direct_builder_sha "$APPROVED_DIRECT_BUILDER_SHA" --arg causal_builder_sha "$APPROVED_CAUSAL_BUILDER_SHA" --arg promotion_sha "$APPROVED_PROMOTION_WORKFLOW_SHA" \
            '{schema:$schema,repository:$repository,resolution_workflow_sha:$workflow_sha,resolution_workflow_ref:$workflow_ref,base_report_blake3:$base_report_blake3,rust_toolchain_sha256:$toolchain_sha,approved_direct_builder_sha:$direct_builder_sha,approved_causal_builder_sha:$causal_builder_sha,approved_promotion_workflow_sha:$promotion_sha}' \
            > "$stage/resolution_provenance.json"

          /usr/bin/python3 --version > "$stage/environment/python-version.txt" 2>&1
          /usr/bin/tar --version > "$stage/environment/tar-version.txt"
          /usr/bin/gzip --version > "$stage/environment/gzip-version.txt"
          /usr/bin/sha256sum --version > "$stage/environment/sha256sum-version.txt"
          /usr/bin/jq --version > "$stage/environment/jq-version.txt"
          /usr/bin/jq -n \
            --arg schema butlin-gwt1-final-runner-environment-v1 \
            --arg image_os "${ImageOS:-unknown}" --arg image_version "${ImageVersion:-unknown}" --arg runner_arch "${RUNNER_ARCH:-unknown}" \
            --arg python_sha "$(/usr/bin/sha256sum /usr/bin/python3 | /usr/bin/awk '{print $1}')" \
            --arg tar_sha "$(/usr/bin/sha256sum /usr/bin/tar | /usr/bin/awk '{print $1}')" \
            --arg gzip_sha "$(/usr/bin/sha256sum /usr/bin/gzip | /usr/bin/awk '{print $1}')" \
            --arg sha256sum_sha "$(/usr/bin/sha256sum /usr/bin/sha256sum | /usr/bin/awk '{print $1}')" \
            --arg jq_sha "$(/usr/bin/sha256sum /usr/bin/jq | /usr/bin/awk '{print $1}')" \
            '{schema:$schema,image_os:$image_os,image_version:$image_version,runner_arch:$runner_arch,python3_sha256:$python_sha,tar_sha256:$tar_sha,gzip_sha256:$gzip_sha,sha256sum_sha256:$sha256sum_sha,jq_sha256:$jq_sha}' \
            > "$stage/environment/runner-environment.json"
          runner_environment_sha="$(/usr/bin/sha256sum "$stage/environment/runner-environment.json" | /usr/bin/awk '{print $1}')"

          /usr/bin/jq -n --arg schema butlin-gwt1-final-attestation-verifier-profile-v1 --arg repository "$GITHUB_REPOSITORY" --arg workflow_sha "$RESOLUTION_WORKFLOW_SHA" \
            --arg executable_sha "$TRUSTED_GH_BINARY_SHA256" --arg version_sha "$TRUSTED_GH_VERSION_OUTPUT_SHA256" --arg runner_environment_sha "$runner_environment_sha" \
            --arg direct_archive_verify "$DIRECT_ARCHIVE_VERIFICATION_SHA256" --arg direct_profile_verify "$DIRECT_PROFILE_VERIFICATION_SHA256" \
            --arg promotion_capsule_verify "$PROMOTION_CAPSULE_VERIFICATION_SHA256" --arg promotion_profile_verify "$PROMOTION_PROFILE_VERIFICATION_SHA256" \
            '{schema:$schema,repository:$repository,resolution_workflow_sha:$workflow_sha,verifier:"github-cli",verifier_version:"2.100.0",distribution_sha256:"e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be",executable_sha256:$executable_sha,version_output_sha256:$version_sha,configuration_policy:"isolated-gh-config-v1",deny_self_hosted_runners:true,runner_environment_sha256:$runner_environment_sha,direct_archive_verification_sha256:$direct_archive_verify,direct_profile_verification_sha256:$direct_profile_verify,promotion_capsule_verification_sha256:$promotion_capsule_verify,promotion_profile_verification_sha256:$promotion_profile_verify}' \
            > "$stage/final_verifier_profile.json"

          (
            cd "$stage"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 /usr/bin/sha256sum > SHA256SUMS
          )
          /usr/bin/tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$PACKAGE_ROOT" -cf - gwt1-final-resolution \
            | /usr/bin/gzip -n > "$RUNNER_TEMP/gwt1-final-resolution.tar.gz"
          (cd "$RUNNER_TEMP" && /usr/bin/sha256sum gwt1-final-resolution.tar.gz > gwt1-final-resolution.tar.gz.sha256)
          echo "archive_sha256=$(/usr/bin/sha256sum "$RUNNER_TEMP/gwt1-final-resolution.tar.gz" | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attest complete deterministic final resolved-view archive
        id: final_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-final-resolution.tar.gz

      - name: Verify and preserve final archive attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-final-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          FINAL_ATTESTATION_BUNDLE: ${{ steps.final_attest.outputs.bundle-path }}
          RESOLUTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          unset GH_HOST GH_ENTERPRISE_TOKEN
          out="$RUNNER_TEMP/gwt1-final-attestation"
          mkdir -p "$out"
          cp "$FINAL_ATTESTATION_BUNDLE" "$out/attestation.json"
          "$TRUSTED_GH_PATH" attestation verify "$RUNNER_TEMP/gwt1-final-resolution.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --bundle "$out/attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-trusted-final-resolution.yml" \
            --signer-digest "$RESOLUTION_WORKFLOW_SHA" --deny-self-hosted-runners --format json > "$out/verification.json"
          test -s "$out/verification.json"
          (cd "$out" && /usr/bin/sha256sum attestation.json > attestation.json.sha256 && /usr/bin/sha256sum verification.json > verification.json.sha256)

      - name: Upload trusted final GWT-1 resolved artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gwt1-final-resolved-${{ inputs.evidence_subject_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gwt1-final-resolution.tar.gz
            ${{ runner.temp }}/gwt1-final-resolution.tar.gz.sha256
            ${{ runner.temp }}/gwt1-final-attestation/
          if-no-files-found: error
          retention-days: 90
