name: Cyber Crucible Diagnostic Trace Contract

on:
  pull_request:
    paths:
      - "validation/cyber_crucible_diagnostic_trace_v1.json"
      - "validation/cyber_crucible_diagnostic_trace_v1.schema.json"
      - "validation/cyber_crucible_public_v1.json"
      - "scripts/validate_cyber_crucible_diagnostic_trace.py"
      - "tests/test_cyber_crucible_diagnostic_trace.py"
      - ".github/workflows/cyber-crucible-trace-contract.yml"
  push:
    branches: [main]
    paths:
      - "validation/cyber_crucible_diagnostic_trace_v1.json"
      - "validation/cyber_crucible_diagnostic_trace_v1.schema.json"
      - "validation/cyber_crucible_public_v1.json"
      - "scripts/validate_cyber_crucible_diagnostic_trace.py"
      - "tests/test_cyber_crucible_diagnostic_trace.py"
      - ".github/workflows/cyber-crucible-trace-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-trace-contract:
    name: Schema, lineage, authority, and recovery regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate schema and public example
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("validation/cyber_crucible_diagnostic_trace_v1.schema.json").read_text(encoding="utf-8"))
          trace = json.loads(Path("validation/cyber_crucible_diagnostic_trace_v1.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("validation/cyber_crucible_public_v1.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(trace)
          print(f"Schema PASS: {trace['trace_id']} ({len(trace['phases'])} phases)")
          PY

      - name: Validate scenario lineage and semantic safety gates
        run: python3 scripts/validate_cyber_crucible_diagnostic_trace.py

      - name: Run diagnostic trace regressions
        run: python -m unittest discover -s tests -p "test_cyber_crucible_diagnostic_trace.py" -v