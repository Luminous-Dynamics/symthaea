name: Rust repair benchmark audit suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/bin/rust_repair_score_audit.rs"
      - "src/bin/rust_repair_trial_compare.rs"
      - "src/bin/rust_repair_manifest.rs"
      - "Cargo.toml"
      - "docs/research/patches/swe-bench-live-validation-evidence.patch"
      - "docs/research/patches/repolaunch-network-isolation.patch"
      - ".github/workflows/rust-repair-score-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-repair-score-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify scored-run audit contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the pinned SWE-bench-Live evaluator
        uses: actions/checkout@v4
        with:
          repository: microsoft/SWE-bench-Live
          ref: 62d02936a0726fbf4597b05bd07b09fb99eddae6
          path: benchmark-source
      - name: Apply the pinned SWE-bench-Live evidence overlay
        run: |
          git -C benchmark-source apply --check "$GITHUB_WORKSPACE/docs/research/patches/swe-bench-live-validation-evidence.patch"
          git -C benchmark-source apply "$GITHUB_WORKSPACE/docs/research/patches/swe-bench-live-validation-evidence.patch"
      - name: Initialize and verify the pinned RepoLaunch submodule
        run: |
          git -C benchmark-source submodule update --init launch
          test "$(git -C benchmark-source/launch rev-parse HEAD)" = "c4b623d930f3728e5338664bb634021b98492cbf"
      - name: Enforce offline test containers
        run: |
          git -C benchmark-source/launch apply --check "$GITHUB_WORKSPACE/docs/research/patches/repolaunch-network-isolation.patch"
          git -C benchmark-source/launch apply "$GITHUB_WORKSPACE/docs/research/patches/repolaunch-network-isolation.patch"
          python3 -m py_compile benchmark-source/evaluation/validation.py benchmark-source/evaluation/evaluation.py benchmark-source/launch/launch/core/platforms/linux.py
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Format benchmark auditors and export canonical source (temporary review helper)
        run: |
          rustfmt --edition 2024 src/bin/rust_repair_manifest.rs src/bin/rust_repair_score_audit.rs src/bin/rust_repair_trial_compare.rs
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for path in [
              "src/bin/rust_repair_manifest.rs",
              "src/bin/rust_repair_score_audit.rs",
              "src/bin/rust_repair_trial_compare.rs",
          ]:
              name = Path(path).name
              source = Path(path).read_bytes()
              print(f"CANONICAL_SOURCE_{name}_BEGIN")
              print(base64.b64encode(source).decode("ascii"))
              print(f"CANONICAL_SOURCE_{name}_END")
          PY
      - name: Check Rust formatting
        run: rustfmt --edition 2024 --check src/bin/rust_repair_manifest.rs src/bin/rust_repair_score_audit.rs src/bin/rust_repair_trial_compare.rs
      - name: Test task-manifest auditor
        run: cargo test --locked --bin rust-repair-manifest --features rust-repair-manifest
      - name: Test scored-run auditor
        run: cargo test --locked --bin rust-repair-score-audit --features rust-repair-manifest
      - name: Test paired trial comparator
        run: cargo test --locked --bin rust-repair-trial-compare --features rust-repair-manifest
      - name: Run strict Clippy on scored-run auditor
        run: cargo clippy --locked --bin rust-repair-score-audit --features rust-repair-manifest -- -D warnings
      - name: Run strict Clippy on paired trial comparator
        run: cargo clippy --locked --bin rust-repair-trial-compare --features rust-repair-manifest -- -D warnings
