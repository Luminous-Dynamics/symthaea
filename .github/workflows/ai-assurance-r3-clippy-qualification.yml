name: AI Assurance R3 Clippy Focused Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/ai-assurance-r3-clippy-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: 04621361d1487326d168104e6d3768c191327612
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  qualify:
    name: Exact-head AI Assurance R3 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source evidence subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          echo "qualified_subject=$actual"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check assurance package formatting
        run: cargo fmt --package symthaea-ai-assurance -- --check

      - name: Verify committed workspace resolution is locked
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Test assurance kernel, integration attacks, and compile-fail docs
        run: cargo test --locked -p symthaea-ai-assurance

      - name: Clippy assurance kernel
        run: cargo clippy --locked -p symthaea-ai-assurance --all-targets -- -D warnings

      - name: Require qualification to leave tracked assurance artifacts unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock crates/core/symthaea-ai-assurance
