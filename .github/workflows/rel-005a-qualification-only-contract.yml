name: REL-005A QualificationOnly Contract

on:
  pull_request:
    paths:
      - ".github/rel/rel-005a-qualification-only-contract.json"
      - ".github/rel/rel-005a-qualification-only.py"
      - ".github/workflows/rel-005a-qualification-only-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rel-005a-qualification-only-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 1e445d072c269d189145c98118b60e8d174a5495
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  qualification-contract:
    name: Verify QualificationOnly authority contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact qualification-contract subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Bind exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          mapfile -t changed < <(git diff --name-only "${EXPECTED_PARENT}" HEAD | sort)
          expected=(
            ".github/rel/rel-005a-qualification-only-contract.json"
            ".github/rel/rel-005a-qualification-only.py"
            ".github/workflows/rel-005a-qualification-only-contract.yml"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"

      - name: Verify QualificationOnly isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/rel/rel-005a-qualification-only.py
          python3 - <<'PY'
          import json
          import pathlib

          contract = json.loads(
              pathlib.Path(".github/rel/rel-005a-qualification-only-contract.json").read_text()
          )
          source = pathlib.Path(".github/rel/rel-005a-qualification-only.py").read_text()

          assert contract["schema"] == "symthaea.rel.qualification-only-contract.v1"
          assert contract["authority"] == "QualificationOnlyContractOnly"
          assert contract["required_predicate_count"] == 41
          assert contract["allowed_comparison_results"] == [
              "ALL_PREDICATES_PASS",
              "PREDICATE_FAILURES",
          ]
          assert contract["qualification_mapping"]["ALL_PREDICATES_PASS"] == {
              "qualification_completed": True,
              "rel_005a_qualified": True,
              "scientific_pass": True,
              "scientific_fail": False,
          }
          assert contract["qualification_mapping"]["PREDICATE_FAILURES"] == {
              "qualification_completed": True,
              "rel_005a_qualified": False,
              "scientific_pass": False,
              "scientific_fail": True,
          }

          forbidden_source_tokens = [
              "--observation",
              "POSITIVE_TOL",
              "FIXED_HADAMARD_MIN_DEFECT",
              "RAW_COSINE_MIN_DRIFT",
              "NEGATIVE_HELD_OUT_MIN_ERROR",
              "NEGATIVE_DISPERSION_MIN",
              "mask_recovery_max",
              "corrupted_anchor_held_out_max",
              "compute_xenobot_graft_transform",
              "translate_foreign_hypervector",
              "import subprocess",
              "import socket",
              "import requests",
              "import urllib",
          ]
          for token in forbidden_source_tokens:
              assert token not in source, f"QualificationOnly contains forbidden direct input/capability: {token}"
          PY

      - name: Run synthetic QualificationOnly self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rel/rel-005a-qualification-only.py             --contract .github/rel/rel-005a-qualification-only-contract.json             --self-test | tee "${RUNNER_TEMP}/qualification-only-self-test.json"
          python3 -m json.tool "${RUNNER_TEMP}/qualification-only-self-test.json" >/dev/null

      - name: Build QualificationOnlyContractOnly receipt
        shell: bash
        env:
          RECEIPT_PATH: ${{ runner.temp }}/qualification-only-contract-receipt.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          def sha(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          receipt = {
              "schema": "symthaea.rel.qualification-only-contract-static-receipt.v1",
              "authority": "QualificationOnlyContractOnly",
              "subject_head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "parent_head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"], text=True
              ).strip(),
              "contract_sha256": sha(
                  ".github/rel/rel-005a-qualification-only-contract.json"
              ),
              "evaluator_sha256": sha(".github/rel/rel-005a-qualification-only.py"),
              "predicate_count": 41,
              "raw_observation_input_supported": False,
              "scientific_threshold_input_supported": False,
              "self_tests_passed": True,
              "claims": {
                  "qualification_completed": False,
                  "rel_005a_qualified": False,
                  "scientific_pass": False,
                  "scientific_fail": False,
              },
          }
          pathlib.Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload static qualification-contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-qualification-only-contract-${{ env.EXPECTED_HEAD }}
          path: |
            .github/rel/rel-005a-qualification-only-contract.json
            ${{ runner.temp }}/qualification-only-self-test.json
            ${{ runner.temp }}/qualification-only-contract-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Postflight exact subject and checkout immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          rm -rf .github/rel/__pycache__
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
