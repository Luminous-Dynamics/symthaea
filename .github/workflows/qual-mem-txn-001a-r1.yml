name: QUAL MEM-TXN-001A-R1 exact subject

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen subject
        uses: actions/checkout@v4
        with:
          ref: dbb3620b3e476ab5afec02d6665613c3bc168b11

      - name: Verify exact subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "dbb3620b3e476ab5afec02d6665613c3bc168b11"

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --manifest-path crates/core/symthaea-communication/Cargo.toml -- --check

      - name: Locked metadata
        run: cargo metadata --manifest-path crates/core/symthaea-communication/Cargo.toml --locked --format-version 1 --no-deps >/dev/null

      - name: Test exact transaction contract
        run: cargo test -p symthaea-communication --test memory_mutation_transaction

      - name: Clippy exact transaction contract
        run: cargo clippy -p symthaea-communication --test memory_mutation_transaction -- -D warnings

      - name: Assert tracked-artifact cleanliness
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1)"
