name: PITB Support Antichain Analyzer

on:
  pull_request:
    paths:
      - "scripts/research/pitb_support_antichain_v0.py"
      - ".github/workflows/pitb-support-antichain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-antichain-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact proposed commit
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
      - name: Syntax-check and execute synthetic negative controls
        run: |
          python3 -m py_compile scripts/research/pitb_support_antichain_v0.py
          python3 scripts/research/pitb_support_antichain_v0.py --self-test
