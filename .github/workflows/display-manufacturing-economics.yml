name: Display Manufacturing Economics Reference

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/display-manufacturing-economics/**"
      - "docs/engineering/DISPLAY_MANUFACTURING_ROUTE_PROTOCOL.md"
      - "docs/engineering/display-manufacturing-route-profiles-v0.1.json"
      - "docs/engineering/display-manufacturing-route-profiles.schema.json"
      - ".github/workflows/display-manufacturing-economics.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/display-manufacturing-economics/**"
      - "docs/engineering/DISPLAY_MANUFACTURING_ROUTE_PROTOCOL.md"
      - "docs/engineering/display-manufacturing-route-profiles-v0.1.json"
      - "docs/engineering/display-manufacturing-route-profiles.schema.json"
      - ".github/workflows/display-manufacturing-economics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: display-manufacturing-economics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Display manufacturing economics (pinned Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.96.0
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --manifest-path tools/display-manufacturing-economics/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/display-manufacturing-economics/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path tools/display-manufacturing-economics/Cargo.toml
