name: Connectome anytime-valid discrepancy monitor contract

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "docs/neuroscience/CONNECTOME_ANYTIME_VALID_DISCREPANCY_MONITOR_V1.md"
      - "docs/neuroscience/CONNECTOME_ANYTIME_VALID_DISCREPANCY_MONITOR.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_ANYTIME_VALID_DISCREPANCY_MONITOR.example.json"
      - "tools/connectomics-intake-audit/reference/verify_connectome_anytime_valid_discrepancy_monitor.py"
      - ".github/workflows/connectome-anytime-valid-discrepancy-monitor.yml"
  push:
    branches: [main, "research/**"]
    paths:
      - "docs/neuroscience/CONNECTOME_ANYTIME_VALID_DISCREPANCY_MONITOR_V1.md"
      - "docs/neuroscience/CONNECTOME_ANYTIME_VALID_DISCREPANCY_MONITOR.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_ANYTIME_VALID_DISCREPANCY_MONITOR.example.json"
      - "tools/connectomics-intake-audit/reference/verify_connectome_anytime_valid_discrepancy_monitor.py"
      - ".github/workflows/connectome-anytime-valid-discrepancy-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-anytime-discrepancy-monitor:
    name: Validate exact e-process and adaptive false-alarm envelope
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate Draft 2020-12 schema and fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/neuroscience/CONNECTOME_ANYTIME_VALID_DISCREPANCY_MONITOR.schema.json").read_text())
          fixture = json.loads(Path("docs/neuroscience/examples/CONNECTOME_ANYTIME_VALID_DISCREPANCY_MONITOR.example.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          assert fixture["claim_scope"] == "synthetic_known_truth"
          assert fixture["oracle_expectations"]["observed_e_value"] == "325/144"
          print("anytime-valid discrepancy monitor schema/fixture: PASS")
          PY
      - name: Run exact rational e-process oracle
        run: |
          python3 -m py_compile tools/connectomics-intake-audit/reference/verify_connectome_anytime_valid_discrepancy_monitor.py
          python3 tools/connectomics-intake-audit/reference/verify_connectome_anytime_valid_discrepancy_monitor.py --self-test
          python3 tools/connectomics-intake-audit/reference/verify_connectome_anytime_valid_discrepancy_monitor.py docs/neuroscience/examples/CONNECTOME_ANYTIME_VALID_DISCREPANCY_MONITOR.example.json
