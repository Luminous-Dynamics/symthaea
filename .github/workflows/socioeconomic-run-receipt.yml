name: Socioeconomic Run Receipt Contract

# Keep this evidence-format check independent of Symthaea's large CI matrix.
# It validates only the synthetic run-receipt contract on the exact PR head.
on:
  pull_request:
    paths:
      - ".github/workflows/socioeconomic-run-receipt.yml"
      - ".github/workflows/ci.yml"
      - "docs/research/finance/SYM-FIN-SYS-016_run_receipt_*"
      - "docs/research/finance/SYM-FIN-SYS-016_scenario_registry_v1.json"
      - "docs/research/finance/SYM-FIN-SYS-016_artifact_manifest_v1.json"
      - "scripts/validate_socioeconomic_run_receipt.py"
      - "scripts/test_validate_socioeconomic_run_receipt.py"
      - "scripts/socioeconomic_run_receipt_requirements.txt"
  push:
    # Also run on the working feature branch before a PR can merge this workflow.
    # Keep it bounded to changes in this receipt contract and its validator.
    paths:
      - ".github/workflows/socioeconomic-run-receipt.yml"
      - ".github/workflows/ci.yml"
      - "docs/research/finance/SYM-FIN-SYS-016_run_receipt_*"
      - "docs/research/finance/SYM-FIN-SYS-016_scenario_registry_v1.json"
      - "docs/research/finance/SYM-FIN-SYS-016_artifact_manifest_v1.json"
      - "scripts/validate_socioeconomic_run_receipt.py"
      - "scripts/test_validate_socioeconomic_run_receipt.py"
      - "scripts/socioeconomic_run_receipt_requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socioeconomic-run-receipt-${{ github.event.pull_request.head.ref || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  # New heads supersede stale automatic runs; deliberate manual runs are isolated.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-contract:
    name: JSON Schema and semantic negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 immutable commit
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Create isolated validation environment
        run: python3 -m venv "$RUNNER_TEMP/run-receipt-venv"

      - name: Install pinned validation-only dependencies
        run: |
          "$RUNNER_TEMP/run-receipt-venv/bin/python" -m pip install --disable-pip-version-check --requirement scripts/socioeconomic_run_receipt_requirements.txt

      - name: Test strict JSON parsing
        run: "$RUNNER_TEMP/run-receipt-venv/bin/python" -m unittest discover -s scripts -p 'test_validate_socioeconomic_run_receipt.py'

      - name: Validate positive fixture and reject negative controls
        run: "$RUNNER_TEMP/run-receipt-venv/bin/python" scripts/validate_socioeconomic_run_receipt.py
