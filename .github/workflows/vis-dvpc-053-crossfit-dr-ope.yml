name: VIS-DVPC-053 estimator-aware cross-fitted DR OPE

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/vision-dvpc-053-crossfit-dr-ope.rs"
      - "docs/research/VIS_DVPC_053_CROSSFIT_DR_OPE_V0.md"
      - ".github/workflows/vis-dvpc-053-crossfit-dr-ope.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-053-crossfit-dr-ope.rs"
      - "docs/research/VIS_DVPC_053_CROSSFIT_DR_OPE_V0.md"
      - ".github/workflows/vis-dvpc-053-crossfit-dr-ope.yml"

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact VIS-DVPC-053 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Compile and run known-answer and falsification tests
        run: |
          rustc --edition=2024 -O --test tools/vision-dvpc-053-crossfit-dr-ope.rs -o /tmp/vis-dvpc-053-tests
          /tmp/vis-dvpc-053-tests
      - name: Verify deterministic smoke output and row schema
        run: |
          rustc --edition=2024 -O tools/vision-dvpc-053-crossfit-dr-ope.rs -o /tmp/vis-dvpc-053
          /tmp/vis-dvpc-053 --smoke > /tmp/vis-dvpc-053-smoke-a.tsv
          /tmp/vis-dvpc-053 --smoke > /tmp/vis-dvpc-053-smoke-b.tsv
          cmp /tmp/vis-dvpc-053-smoke-a.tsv /tmp/vis-dvpc-053-smoke-b.tsv
          awk -F '\t' '$1 == "RESULT" { if (NF != 17 || $2 == "" || $3 < 1 || $7 < 0 || $7 > 1 || $8 < 0 || $8 > 1 || $9 <= 0 || $9 > 0.5 || $10 < 1 || $11 != $11 || $12 < 0 || $13 < 0 || $16 != "identified_full_support") bad=1; if ($6 == "dm_in_sample" || $6 == "dr_in_sample") { if ($14 != "NA" || $15 != "NA" || $17 != "same_sample_nuisance_ci_unavailable") bad=1 } else { if ($14 < 0 || $14 > 1 || $15 < 0 || $17 != "score_based_normal_interval_empirical_only") bad=1 } n++ } END { if (n != 1200 || bad) exit 1 }' /tmp/vis-dvpc-053-smoke-a.tsv
          awk -F '\t' '$1 == "REPLICATE" { if (NF != 19 || $3 < 1 || $7 < 0 || $8 < 0 || $9 < 0 || $10 < 0 || $11 != $11 || $12 != $12 || $13 != $13 || $14 < 0 || $15 < 0 || $18 != "identified_full_support") bad=1; if ($19 == "score_based_normal_interval_empirical_only") { if ($16 != $16 || $17 != $17) bad=1 } else if ($16 != "NA" || $17 != "NA" || $19 != "same_sample_nuisance_ci_unavailable") bad=1; n++ } END { if (n != 14400 || bad) exit 1 }' /tmp/vis-dvpc-053-smoke-a.tsv
          test "$(grep -c '^BENCHMARK_CONFIG' /tmp/vis-dvpc-053-smoke-a.tsv)" = "8"
      - name: Run full cross-fitted DR OPE frontier
        run: |
          /tmp/vis-dvpc-053 > /tmp/vis-dvpc-053-full.tsv
          awk -F '\t' '$1 == "RESULT" { if (NF != 16 || $7 < 0 || $7 > 1 || $8 < 0 || $8 > 1 || $9 <= 0 || $9 > 0.5 || $10 < 1 || $11 != $11 || $12 < 0 || $13 < 0 || $14 < 0 || $14 > 1 || $15 < 0 || $16 != "identified_full_support") bad=1; n++ } END { if (n != 1200 || bad) exit 1 }' /tmp/vis-dvpc-053-full.tsv
          awk -F '\t' '$1 == "REPLICATE" { if (NF != 19 || $3 < 1 || $7 < 0 || $8 < 0 || $9 < 0 || $10 < 0 || $11 != $11 || $12 != $12 || $13 != $13 || $14 < 0 || $15 < 0 || $18 != "identified_full_support") bad=1; if ($19 == "score_based_normal_interval_empirical_only") { if ($16 != $16 || $17 != $17) bad=1 } else if ($16 != "NA" || $17 != "NA" || $19 != "same_sample_nuisance_ci_unavailable") bad=1; n++ } END { if (n != 153600 || bad) exit 1 }' /tmp/vis-dvpc-053-full.tsv
          grep -F $'BENCHMARK_CONFIG\tVIS-DVPC-053' /tmp/vis-dvpc-053-full.tsv
      - name: Create exact-source and output SHA-256 receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          {
            printf 'VIS_DVPC_053_RECEIPT\tformat\tv1\n'
            printf 'commit_sha\t%s\n' "$EXPECTED_HEAD"
            printf 'rustc\t%s\n' "$(rustc --version)"
            sha256sum tools/vision-dvpc-053-crossfit-dr-ope.rs docs/research/VIS_DVPC_053_CROSSFIT_DR_OPE_V0.md /tmp/vis-dvpc-053-smoke-a.tsv /tmp/vis-dvpc-053-full.tsv
          } > /tmp/vis-dvpc-053-receipt.tsv
          cat /tmp/vis-dvpc-053-receipt.tsv
      - name: Publish results and receipt
        uses: actions/upload-artifact@v4
        with:
          name: vis-dvpc-053-crossfit-dr-ope
          path: |
            /tmp/vis-dvpc-053-smoke-a.tsv
            /tmp/vis-dvpc-053-full.tsv
            /tmp/vis-dvpc-053-receipt.tsv
          retention-days: 90