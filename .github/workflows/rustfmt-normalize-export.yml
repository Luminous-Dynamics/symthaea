name: Rustfmt normalized source export

on:
  pull_request:
    paths:
      - ".github/workflows/rustfmt-normalize-export.yml"

permissions:
  contents: read

jobs:
  format-export:
    name: Export Rustfmt 1.96 normalized auditors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Format and stage source snapshots
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rustfmt-normalized"
          mkdir -p "$output"
          files=(
            tools/superconductivity-discovery-harness/src/main.rs
            tools/superconductivity-discovery-harness/src/bin/discovery_metrics.rs
            tools/superconductivity-discovery-harness/src/bin/observation_event_audit.rs
            tools/superconductivity-discovery-harness/src/bin/synthesis_protocol_audit.rs
            tools/superconductivity-discovery-harness/src/bin/pair_coherence_audit.rs
            tools/superconductivity-discovery-harness/src/bin/reaction_selectivity_audit.rs
            tools/superconductivity-discovery-harness/src/bin/thermochemical_network_audit.rs
            tools/superconductivity-discovery-harness/src/bin/transport_kinetic_selectivity_audit.rs
            tools/superconductivity-discovery-harness/src/bin/spatial_reaction_diffusion_audit.rs
            tools/superconductivity-discovery-harness/src/bin/onset_prediction_audit.rs
            tools/superconductivity-discovery-harness/src/bin/precursor_genome_graph_audit.rs
          )
          for file in "${files[@]}"; do
            rustfmt --edition 2024 "$file"
            mkdir -p "$output/$(dirname "$file")"
            cp "$file" "$output/$file"
          done
          rustfmt --version > "$output/rustfmt-version.txt"
          sha256sum "${files[@]}" > "$output/source-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-normalized-sources
          path: ${{ runner.temp }}/rustfmt-normalized/
          if-no-files-found: error
