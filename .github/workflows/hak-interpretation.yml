name: HAK Interpretation

on:
  pull_request:
    branches:
      - architecture/hak-evidence-subject-receipts-v1
    paths:
      - 'scripts/hak_interpretation_lint.py'
      - 'tests/python/test_hak_interpretation_lint.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_PLAN_CONFORMANCE_AND_INTERPRETATION_V1.md'
      - 'docs/architecture/hak/plan-conformance-v1.schema.json'
      - 'docs/architecture/hak/evidence-interpretation-v1.schema.json'
      - 'docs/architecture/hak/plans/hak008-plan-conformance-interpretation-e5-v1.plan.json'
      - '.github/workflows/hak-interpretation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interpretation-linter:
    name: HAK Plan Conformance and Interpretation
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          echo "HAK interpretation exact subject: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile inherited evidence linter
        run: python -m py_compile scripts/hak_evidence_lint.py

      - name: Compile interpretation linter
        run: python -m py_compile scripts/hak_interpretation_lint.py

      - name: Validate JSON schemas
        run: |
          python -m json.tool docs/architecture/hak/plan-conformance-v1.schema.json >/dev/null
          python -m json.tool docs/architecture/hak/evidence-interpretation-v1.schema.json >/dev/null

      - name: Lint HAK-008 qualification plan
        run: |
          python scripts/hak_evidence_lint.py \
            docs/architecture/hak/plans/hak008-plan-conformance-interpretation-e5-v1.plan.json

      - name: Run HAK-008 regressions
        run: python -m pytest -q tests/python/test_hak_interpretation_lint.py
