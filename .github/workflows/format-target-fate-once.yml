name: One-time target-fate Rust formatting and lockfile regeneration

on:
  push:
    branches: [research/connectome-target-fate-v0-1-20261103]

permissions:
  contents: write

concurrency:
  group: target-fate-format-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/connectome-target-fate-v0-1-20261103
      - name: Install pinned Rust and Cargo 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Apply pinned rustfmt and regenerate pinned-toolchain lockfile
        run: |
          cargo fmt --manifest-path tools/connectome-target-fate-verifier/Cargo.toml
          cargo generate-lockfile --manifest-path tools/connectome-target-fate-verifier/Cargo.toml
          cargo metadata --manifest-path tools/connectome-target-fate-verifier/Cargo.toml --locked --format-version 1 > /tmp/target-fate-metadata.json
      - name: Commit only formatter and Cargo-generated outputs
        run: |
          git diff --check
          git diff -- tools/connectome-target-fate-verifier/src/main.rs tools/connectome-target-fate-verifier/Cargo.lock
          if ! git diff --quiet -- tools/connectome-target-fate-verifier/src/main.rs tools/connectome-target-fate-verifier/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/connectome-target-fate-verifier/src/main.rs tools/connectome-target-fate-verifier/Cargo.lock
            git commit -m "style(connectomics): format target-fate verifier with Rust 1.96"
            git push origin HEAD:research/connectome-target-fate-v0-1-20261103
          else
            echo "Source already formatted and Cargo lockfile already current."
          fi
