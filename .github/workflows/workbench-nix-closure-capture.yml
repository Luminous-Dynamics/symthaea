name: Workbench Nix Closure Capture

on:
  pull_request:
    paths:
      - 'flake.lock'
      - 'data/neuroscience/workbench_execution_capsule_profile_v1.json'
      - 'scripts/verify_workbench_execution_capsule_profile.py'
      - 'scripts/workbench_nix_closure_identity.py'
      - 'scripts/workbench_nix_closure_capture.py'
      - 'scripts/test_workbench_nix_closure_capture.py'
      - 'docs/neuroscience/WORKBENCH_NIX_CLOSURE_CAPTURE_V1.md'
      - '.github/workflows/workbench-nix-closure-capture.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static-contracts:
    name: Qualify capture producer contracts only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          persist-credentials: false

      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$QUALIFICATION_SHA"
          printf 'qualified_head=%s\n' "$actual"

      - name: Syntax
        run: |
          python3 -m py_compile \
            scripts/workbench_nix_closure_identity.py \
            scripts/workbench_nix_closure_capture.py \
            scripts/test_workbench_nix_closure_capture.py

      - name: Producer adversarial contracts
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_workbench_nix_closure_capture.py

      - name: Static authority ratchets
        shell: bash
        run: |
          set -euo pipefail
          DOC=docs/neuroscience/WORKBENCH_NIX_CLOSURE_CAPTURE_V1.md
          SCRIPT=scripts/workbench_nix_closure_capture.py
          grep -Fq 'RawObservationRoot != NormalizedClosureRoot' "$DOC"
          grep -Fq 'receipt is not called independently verified by this PR' "$DOC"
          grep -Fq '"closure_capture_qualified": False' "$SCRIPT"
          grep -Fq '"workbench_execution_qualified": False' "$SCRIPT"
          grep -Fq '"fmq010_established": False' "$SCRIPT"
          grep -Fq '"neural_alignment_established": False' "$SCRIPT"
          grep -Fq '"consciousness_evidence": False' "$SCRIPT"

      - name: No shell execution surface
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('scripts/workbench_nix_closure_capture.py').read_text())
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  if node.func.attr in {'run', 'Popen'}:
                      for kw in node.keywords:
                          assert not (kw.arg == 'shell' and isinstance(kw.value, ast.Constant) and kw.value.value is True)
          PY

  hosted-realization-observation:
    name: Observe exact Workbench Nix realization
    needs: static-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          persist-credentials: false

      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$QUALIFICATION_SHA"
          printf 'qualified_head=%s\n' "$actual"

      - name: Install pinned Nix 2.33.6
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.33.6/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Exact Nix version ratchet
        run: test "$(nix --version)" = 'nix (Nix) 2.33.6'

      - name: Revalidate #624 profile selection
        run: |
          python3 scripts/verify_workbench_execution_capsule_profile.py \
            --profile data/neuroscience/workbench_execution_capsule_profile_v1.json \
            --flake-lock flake.lock

      - name: Produce raw observation receipt
        id: capture
        continue-on-error: true
        run: |
          python3 scripts/workbench_nix_closure_capture.py \
            --profile data/neuroscience/workbench_execution_capsule_profile_v1.json \
            --flake-lock flake.lock \
            --out workbench-nix-closure-capture-v1

      - name: Producer self-check only
        if: steps.capture.outcome == 'success'
        run: |
          python3 scripts/workbench_nix_closure_identity.py verify \
            --identity workbench-nix-closure-capture-v1/normalized/closure_identity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('workbench-nix-closure-capture-v1/receipt.json').read_text())
          assert r['status'] == 'observed-normalized-unqualified'
          assert r['normalized']['platform'] == 'x86_64-linux'
          assert r['authority']['closure_capture_qualified'] is False
          assert r['authority']['workbench_execution_qualified'] is False
          assert r['authority']['fmq010_established'] is False
          PY

      - name: Publish raw receipt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workbench-nix-closure-capture-${{ env.QUALIFICATION_SHA }}
          path: workbench-nix-closure-capture-v1
          if-no-files-found: warn
          retention-days: 30

      - name: Require successful observation
        if: always()
        run: test '${{ steps.capture.outcome }}' = 'success'
