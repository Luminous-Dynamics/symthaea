name: Scientific Artifact Delimited Intake

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/scientific-artifact-delimited/**"
      - ".github/workflows/scientific-artifact-delimited.yml"

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Resolve standalone lock and compile tests
        run: |
          cargo generate-lockfile --manifest-path tools/scientific-artifact-delimited/Cargo.toml
          cargo test --manifest-path tools/scientific-artifact-delimited/Cargo.toml
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/scientific-artifact-delimited/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/scientific-artifact-delimited/Cargo.toml --all-targets -- -D warnings
      - name: Upload standalone dependency lock for exact pinning
        uses: actions/upload-artifact@v4
        with:
          name: scientific-artifact-delimited-lockfile
          path: tools/scientific-artifact-delimited/Cargo.lock
          if-no-files-found: error
          retention-days: 7
