name: Scientific Artifact Delimited Intake

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/scientific-artifact-delimited/**"
      - ".github/workflows/scientific-artifact-delimited.yml"

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Generate standalone dependency lock
        run: cargo generate-lockfile --manifest-path tools/scientific-artifact-delimited/Cargo.toml
      - name: Normalize source using pinned rustfmt
        run: cargo fmt --manifest-path tools/scientific-artifact-delimited/Cargo.toml
      - name: Upload parser source and dependency lock for exact review
        uses: actions/upload-artifact@v4
        with:
          name: scientific-artifact-delimited-qualified-inputs
          path: |
            tools/scientific-artifact-delimited/Cargo.lock
            tools/scientific-artifact-delimited/src/lib.rs
          if-no-files-found: error
          retention-days: 7
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/scientific-artifact-delimited/Cargo.toml -- --check
      - name: Compile and test
        run: cargo test --manifest-path tools/scientific-artifact-delimited/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path tools/scientific-artifact-delimited/Cargo.toml --all-targets -- -D warnings
