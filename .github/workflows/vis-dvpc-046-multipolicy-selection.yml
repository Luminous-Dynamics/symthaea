name: VIS-DVPC-046 multi-policy selection with fixed-horizon pCRP-star and LS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/vision-dvpc-046-multipolicy-selection.rs"
      - "docs/research/VIS_DVPC_046_MULTIPOLICY_SELECTION_V1.md"
      - ".github/workflows/vis-dvpc-046-multipolicy-selection.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-046-multipolicy-selection.rs"
      - "docs/research/VIS_DVPC_046_MULTIPOLICY_SELECTION_V1.md"
      - ".github/workflows/vis-dvpc-046-multipolicy-selection.yml"

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact policy-selection benchmark head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Compile and run all Rust tests
        run: |
          rustc --edition=2024 -O --test tools/vision-dvpc-046-multipolicy-selection.rs -o /tmp/vis-dvpc-046-tests
          /tmp/vis-dvpc-046-tests
      - name: Verify deterministic PRNG stream
        run: |
          rustc --edition=2024 -O tools/vision-dvpc-046-multipolicy-selection.rs -o /tmp/vis-dvpc-046
          /tmp/vis-dvpc-046 --seed-smoke > /tmp/vis-dvpc-046-seed-a.txt
          /tmp/vis-dvpc-046 --seed-smoke > /tmp/vis-dvpc-046-seed-b.txt
          cmp /tmp/vis-dvpc-046-seed-a.txt /tmp/vis-dvpc-046-seed-b.txt
      - name: Verify deterministic multi-policy replay
        run: |
          /tmp/vis-dvpc-046 --smoke > /tmp/vis-dvpc-046-smoke-a.tsv
          /tmp/vis-dvpc-046 --smoke > /tmp/vis-dvpc-046-smoke-b.tsv
          grep -v '^SYSTEM' /tmp/vis-dvpc-046-smoke-a.tsv > /tmp/vis-dvpc-046-smoke-a-stable.tsv
          grep -v '^SYSTEM' /tmp/vis-dvpc-046-smoke-b.tsv > /tmp/vis-dvpc-046-smoke-b-stable.tsv
          cmp /tmp/vis-dvpc-046-smoke-a-stable.tsv /tmp/vis-dvpc-046-smoke-b-stable.tsv
          test "$(grep -c '^RESULT_METRIC' /tmp/vis-dvpc-046-smoke-a-stable.tsv)" = "888"
          test "$(grep -c '^METHOD_STATUS' /tmp/vis-dvpc-046-smoke-a.tsv)" = "36"
          ! grep '^RESULT_METRIC.*pCRP_star_fixed_horizon_grid33.*familywise_sequence_coverage' /tmp/vis-dvpc-046-smoke-a.tsv
          ! grep '^RESULT_METRIC.*Logarithmic_Smoothing_fixed_horizon.*familywise_sequence_coverage' /tmp/vis-dvpc-046-smoke-a.tsv
          ! grep '^RESULT_METRIC.*Logarithmic_Smoothing_safe_lambda_grid_fixed_horizon.*familywise_sequence_coverage' /tmp/vis-dvpc-046-smoke-a.tsv
      - name: Run 1,024 paired portfolios through horizon 4,096
        run: |
          /tmp/vis-dvpc-046 --benchmark > /tmp/vis-dvpc-046-results.tsv
          test "$(grep -c '^DGP' /tmp/vis-dvpc-046-results.tsv)" = "6"
          test "$(grep -c '^POLICY' /tmp/vis-dvpc-046-results.tsv)" = "88"
          test "$(grep -c '^RESULT_METRIC' /tmp/vis-dvpc-046-results.tsv)" = "1332"
          test "$(grep -c '^METHOD_STATUS' /tmp/vis-dvpc-046-results.tsv)" = "54"
          ! grep '^RESULT_METRIC.*pCRP_star_fixed_horizon_grid33.*familywise_sequence_coverage' /tmp/vis-dvpc-046-results.tsv
          ! grep '^RESULT_METRIC.*Logarithmic_Smoothing_fixed_horizon.*familywise_sequence_coverage' /tmp/vis-dvpc-046-results.tsv
          ! grep '^RESULT_METRIC.*Logarithmic_Smoothing_safe_lambda_grid_fixed_horizon.*familywise_sequence_coverage' /tmp/vis-dvpc-046-results.tsv
          test "$(grep -c '^SYSTEM' /tmp/vis-dvpc-046-results.tsv)" = "6"
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Hoeffding_CS_familywise_alpha_over_M" && $5=="familywise_sequence_coverage" { n++; if ($8 < 0.90) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Empirical_Bernstein_CS_familywise_alpha_over_M" && $5=="familywise_sequence_coverage" { n++; if ($8 < 0.90) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Shared_cell_mean_Hoeffding_CS_alpha_over_4" && $5=="familywise_sequence_coverage" { n++; if ($8 < 0.90) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Hoeffding_CS_familywise_alpha_over_M" && $5=="any_false_certificate_probability" { n++; if ($9 > 0.10) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Empirical_Bernstein_CS_familywise_alpha_over_M" && $5=="any_false_certificate_probability" { n++; if ($9 > 0.10) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Shared_cell_mean_Hoeffding_CS_alpha_over_4" && $5=="any_false_certificate_probability" { n++; if ($9 > 0.10) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="pCRP_star_fixed_horizon_grid33" && $5=="familywise_point_coverage" { n++; if ($8 < 0.90) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Logarithmic_Smoothing_fixed_horizon" && $5=="familywise_point_coverage" { n++; if ($8 < 0.90) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="pCRP_star_fixed_horizon_grid33" && $5=="point_false_certificate_probability" { n++; if ($9 > 0.10) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Logarithmic_Smoothing_fixed_horizon" && $5=="point_false_certificate_probability" { n++; if ($9 > 0.10) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Logarithmic_Smoothing_safe_lambda_grid_fixed_horizon" && $5=="familywise_point_coverage" { n++; if ($8 < 0.90) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && $3=="Logarithmic_Smoothing_safe_lambda_grid_fixed_horizon" && $5=="point_false_certificate_probability" { n++; if ($9 > 0.10) bad=1 } END { if (n != 18 || bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && ($5=="familywise_point_coverage" || $5=="familywise_sequence_coverage" || $5=="any_false_certificate_probability" || $5=="ever_best_certificate_rate" || $5=="portfolio_empty_interval_probability" || $5=="IPS_argmax_top1_accuracy") { if ($6 < -0.000001 || $6 > 1.000001) bad=1 } END { if (bad) exit 1 }' /tmp/vis-dvpc-046-results.tsv
          grep '^SEED_SCHEDULE' /tmp/vis-dvpc-046-results.tsv > /tmp/vis-dvpc-046-seeds.tsv
          test "$(grep -c '^METHOD_STATUS' /tmp/vis-dvpc-046-results.tsv)" = "54"
      - name: Create exact source and output SHA-256 receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          {
            printf 'VIS_DVPC_046_RECEIPT\tformat\tv1\n'
            printf 'commit_sha\t%s\n' "$EXPECTED_HEAD"
            printf 'rustc\t%s\n' "$(rustc --version)"
            sha256sum tools/vision-dvpc-046-multipolicy-selection.rs docs/research/VIS_DVPC_046_MULTIPOLICY_SELECTION_V1.md .github/workflows/vis-dvpc-046-multipolicy-selection.yml /tmp/vis-dvpc-046-results.tsv /tmp/vis-dvpc-046-summary.tsv /tmp/vis-dvpc-046-seeds.tsv
          } > /tmp/vis-dvpc-046-receipt.tsv
          cat /tmp/vis-dvpc-046-receipt.tsv
      - name: Publish results and receipt
        uses: actions/upload-artifact@v4
        with:
          name: vis-dvpc-046-multipolicy-selection
          path: |
            /tmp/vis-dvpc-046-results.tsv
            /tmp/vis-dvpc-046-summary.tsv
            /tmp/vis-dvpc-046-seeds.tsv
            /tmp/vis-dvpc-046-smoke-a-stable.tsv
            /tmp/vis-dvpc-046-receipt.tsv
          retention-days: 90
