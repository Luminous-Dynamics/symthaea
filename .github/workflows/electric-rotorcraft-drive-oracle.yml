name: Electric Rotorcraft Drive-Chain Reference Oracle

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "tools/electric-rotorcraft-drive-oracle/**"
      - ".github/workflows/electric-rotorcraft-drive-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electric-rotorcraft-drive-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, test and lint independent drive-chain oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/electric-rotorcraft-drive-oracle/Cargo.toml -- --check

      - name: Run frozen oracle tests
        run: cargo test --locked --manifest-path tools/electric-rotorcraft-drive-oracle/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/electric-rotorcraft-drive-oracle/Cargo.toml --all-targets -- -D warnings
