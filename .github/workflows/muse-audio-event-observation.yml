name: Muse Audio Event Observation

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/audio_event_observation.rs"
      - "crates/domains/symthaea-muse/src/midi_performance.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/muse-audio-event-observation.yml"
  push:
    branches:
      - "research/melothaea-audio-event-observation-v1"
    paths:
      - "crates/domains/symthaea-muse/src/audio_event_observation.rs"
      - "crates/domains/symthaea-muse/src/midi_performance.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "crates/domains/symthaea-muse/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/muse-audio-event-observation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-audio-event-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audio-event-observation:
    name: Format and focused Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Record exact source head
        shell: bash
        run: |
          set -euo pipefail
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"

      - name: Check Muse formatting
        run: cargo fmt --check -p symthaea-muse

      - name: Run focused audio observation tests
        run: cargo test --locked -p symthaea-muse --features theory audio_event_observation::tests::
