name: Butlin GWT-1 Outcome-Neutral Unified Root Contract

on:
  pull_request:
    paths:
      - ".github/workflows/butlin-gwt1-outcome-neutral-root-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify exact outcome-neutral GWT-1 root
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact successor root R2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: edca5d5039b2cb48198dcb7034ab888f23c6448a
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact two-workflow successor and frozen objects
        shell: bash
        run: |
          set -euo pipefail
          old_root="726d2be515e52eeff6c3f32a137e42a2648e35c7"
          new_root="edca5d5039b2cb48198dcb7034ab888f23c6448a"
          test "$(git rev-parse HEAD)" = "$new_root"
          test "$(git rev-parse HEAD^{tree})" = "799d529d5c5674d0baba9c368fdd6a2a5bcee85a"
          test "$(git rev-parse HEAD~2)" = "$old_root"

          mapfile -t changed < <(git diff --name-only "$old_root" "$new_root")
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/butlin-gwt1-causal-trusted-builder.yml"
          test "${changed[1]}" = ".github/workflows/butlin-gwt1-trusted-builder.yml"

          test "$(git rev-parse HEAD:.github/workflows/butlin-gwt1-trusted-builder.yml)" = "e75a7348cefaa493e6de53fae660c65769e89bb2"
          test "$(git rev-parse HEAD:.github/workflows/butlin-gwt1-causal-trusted-builder.yml)" = "a1f4d481a06a9a4f72905e18b5a8000cb3e5ff9e"

          # Scientific/evidence code and archive policy remain byte-identical to old R.
          test "$(git rev-parse HEAD:.github/scripts/evidence_archive_admission.py)" = "4a7228ab25fcd512d3b038bab29d5f10e0f22eaa"
          test "$(git rev-parse HEAD:.github/evidence-profiles/gwt1-direct-evidence-v1.json)" = "24115fe59f40600eb6d2a445994aea80db72af82"
          test "$(git rev-parse HEAD:.github/evidence-profiles/gwt1-causal-evidence-v1.json)" = "d251f39460d9cb187e98381a9c786f1073e5d8c1"
          test "$(git rev-parse HEAD:crates/domains/symthaea-psych-bench/src/bin/gwt1_qualification.rs)" = "993f81adcac59c6f4b17c240030338257d39cd8a"
          test "$(git rev-parse HEAD:crates/domains/symthaea-psych-bench/src/bin/gwt1_verify_evidence.rs)" = "fc464223eca2428c19726f42c6ab1e7240a964b6"
          test "$(git rev-parse HEAD:crates/domains/symthaea-psych-bench/src/bin/gwt1_causal_qualification.rs)" = "7025663aa5d1fd4ce49486b3894966c39e93aa8d"
          test "$(git rev-parse HEAD:crates/domains/symthaea-psych-bench/src/bin/gwt1_verify_causal_evidence.rs)" = "f1c3fe24e6a33b5ca919c21d4074f0689463c691"
          test "$(git rev-parse HEAD:crates/domains/symthaea-psych-bench/src/benchmarks/butlin/gwt1_end_to_end.rs)" = "1e1a68a05235b043255a9e3ae690f7193708b9d7"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Audit outcome-neutral workflow semantics
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          direct = Path('.github/workflows/butlin-gwt1-trusted-builder.yml').read_text()
          causal = Path('.github/workflows/butlin-gwt1-causal-trusted-builder.yml').read_text()

          required_pairs = (
              ('0', 'Qualified'),
              ('20', 'NotDemonstrated'),
              ('21', 'Contradicted'),
              ('22', 'Inconclusive'),
          )

          for name, text in (('direct', direct), ('causal', causal)):
              for code, outcome in required_pairs:
                  needle = f'{code}) expected_outcome="{outcome}" ;;'
                  assert needle in text, (name, needle)
              assert 'status=$?' in text, name
              assert 'set +e' in text and 'set -e' in text, name
              assert 'outcome.txt' in text, name
              assert 'observed_outcome=' in text, name
              assert '!= "$expected_outcome"' in text, name
              assert 'unexpected exit status $status' in text, name
              assert 'if: always()' not in text, name
              assert "needs.qualify.result == 'success'" in text, name
              assert "steps.bundle.outputs.has_evidence == 'true'" in text, name
              assert 'cargo run --locked' in text, name
              assert '--deny-self-hosted-runners' in text, name

              # Existing four-file subject boundary must not move.
              for path in (
                  'src/cognitive_loop/managers/drive_manager.rs',
                  'src/cognitive_loop/managers/memory_manager.rs',
                  'src/cognitive_loop/managers/learning_manager.rs',
                  'src/cognitive_loop/managers/perception_manager.rs',
              ):
                  assert path in text, (name, path)
          PY

      - name: Exercise frozen exit-status/outcome theorem
        shell: bash
        run: |
          set -euo pipefail
          classify() {
            case "$1" in
              0) printf '%s' Qualified ;;
              20) printf '%s' NotDemonstrated ;;
              21) printf '%s' Contradicted ;;
              22) printf '%s' Inconclusive ;;
              *) return 64 ;;
            esac
          }
          accept_pair() {
            local status="$1" observed="$2" expected
            expected="$(classify "$status")" || return 1
            test "$observed" = "$expected"
          }

          accept_pair 0 Qualified
          accept_pair 20 NotDemonstrated
          accept_pair 21 Contradicted
          accept_pair 22 Inconclusive
          ! accept_pair 20 Qualified
          ! accept_pair 21 Inconclusive
          ! accept_pair 22 NotDemonstrated
          ! accept_pair 2 Inconclusive
          ! accept_pair 99 Qualified

      - name: Install pinned Rust 1.96.0
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      - name: Compile direct producer and verifier at exact R2
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/gwt1-outcome-neutral-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-outcome-neutral-target
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-psych-bench --features symthaea-backend --bin gwt1_qualification
          cargo check --locked -p symthaea-psych-bench --features symthaea-backend --bin gwt1_verify_evidence

      - name: Compile causal producer and verifier at exact R2
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/gwt1-outcome-neutral-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-outcome-neutral-target
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-psych-bench --features symthaea-backend --bin gwt1_causal_qualification
          cargo check --locked -p symthaea-psych-bench --features symthaea-backend --bin gwt1_verify_causal_evidence

      - name: Run unchanged repaired adapter tests at exact R2
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/gwt1-outcome-neutral-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/gwt1-outcome-neutral-target
        run: |
          set -euo pipefail
          cargo test --locked -p symthaea-psych-bench --features symthaea-backend gwt1_end_to_end::tests
