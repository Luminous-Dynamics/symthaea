name: Nixward Episodic Action Identity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "crates/core/nixward/src/mind/episodic_memory.rs"
      - "crates/core/nixward/src/mind/active_inference.rs"
      - "scripts/qualify_nixward_episodic_action_identity.sh"
      - ".github/workflows/nixward-episodic-action-identity.yml"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  episodic-action-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Run focused qualification
        run: bash scripts/qualify_nixward_episodic_action_identity.sh
