name: Symthaea CI

on:
  push:
    branches: [main, 'feature/**', 'bugfix/**']
    paths:
      - 'symthaea/**'
      - '.github/workflows/symthaea-ci.yml'
      - '.github/workflows/symthaea-nightly.yml'
  pull_request:
    branches: [main]
    paths:
      - 'symthaea/**'
      - '.github/workflows/symthaea-ci.yml'
      - '.github/workflows/symthaea-nightly.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: symthaea/Cargo.toml
          command: check advisories licenses

  clippy:
    name: Clippy (workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Clippy (all workspace crates)
        run: cargo clippy --workspace --no-deps --lib -- -D warnings

  check:
    name: Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Check compilation
        run: cargo check --workspace --lib
        env:
          RUSTFLAGS: -D warnings
      - name: Run lib tests
        run: cargo test --workspace --lib
        env:
          RUST_BACKTRACE: 1
      - name: Run doc tests
        run: cargo test --workspace --doc

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
      - name: Build documentation
        run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings --allow rustdoc::broken-intra-doc-links

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [check]
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-integ-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integ-
      - name: Run integration tests
        run: cargo test --test '*' -- --test-threads=2
        env:
          RUST_BACKTRACE: 1
        timeout-minutes: 30

  features:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          # cfg-gated modules in lib.rs
          - identity
          - code_generation
          - nix-mind
          - integration_module
          - observability_module
          - web_research_module
          # Major optional dependency features
          - voice-stt
          - embeddings
          - neural-bridge
          - mycelix
          - swarm
          # Consciousness stack features
          - full_consciousness
          - reasoning_engine
          # Feature groups (test combinations)
          - epistemic_conflict
          - temporal_planning
          - api_module
          # Multi-feature combinations (test interactions)
          - reasoning_engine,code_understanding
          - code_generation,neural-bridge
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-feat-${{ matrix.features }}-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-feat-${{ matrix.features }}-
      - name: Check feature (${{ matrix.features }})
        run: cargo check --lib --features ${{ matrix.features }}
      - name: Test feature (${{ matrix.features }})
        run: cargo test --lib --features ${{ matrix.features }}
        env:
          RUST_BACKTRACE: 1

  sub-crates:
    name: Sub-Crate Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-subcrates-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-subcrates-
      - name: Test sub-crates (fast path)
        run: |
          for crate in symthaea-dream symthaea-phi-search symthaea-narrative-self symthaea-fep symthaea-causal-reasoning symthaea-field-dynamics symthaea-hodge symthaea-factor-graph symthaea-enactive symthaea-sensorimotor symthaea-consciousness-topology symthaea-exploration symthaea-wisdom symthaea-types symthaea-seven-harmonies symthaea-consciousness-resonance symthaea-embeddings symthaea-observability symthaea-dynamics symthaea-sentinel symthaea-perception symthaea-stt; do
            echo "::group::$crate"
            cargo clippy -p $crate --lib -- -D warnings
            cargo test -p $crate --lib
            echo "::endgroup::"
          done
      - name: Test symthaea-core
        run: |
          cargo clippy -p symthaea-core --lib -- -D warnings
          cargo test -p symthaea-core --lib
      - name: Test symthaea-nix
        run: |
          cargo clippy -p symthaea-nix --lib -- -D warnings
          cargo test -p symthaea-nix --lib

  msrv:
    name: MSRV Check (1.75)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75.0'
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
      - name: Check MSRV compilation
        run: cargo check --workspace --lib

  no-default-features:
    name: Minimal Build (no default features)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-minimal-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-minimal-
      - name: Check with no default features
        run: cargo check --workspace --lib --no-default-features
      - name: Check symthaea-core features individually
        run: |
          cargo check -p symthaea-core --no-default-features --features simd
          cargo check -p symthaea-core --no-default-features --features duck
