name: Symthaea CI

on:
  push:
    branches: [main, 'feature/**', 'bugfix/**']
    paths:
      - 'symthaea/**'
      - '.github/workflows/symthaea-ci.yml'
      - '.github/workflows/symthaea-nightly.yml'
  pull_request:
    branches: [main]
    paths:
      - 'symthaea/**'
      - '.github/workflows/symthaea-ci.yml'
      - '.github/workflows/symthaea-nightly.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: symthaea/Cargo.toml
          command: check advisories licenses

  clippy:
    name: Clippy (workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Clippy (all workspace crates)
        run: cargo clippy --workspace --no-deps --lib -- -D warnings

  check:
    name: Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Check compilation
        run: cargo check --workspace --lib
        env:
          RUSTFLAGS: -D warnings
      - name: Run lib tests
        run: cargo test --workspace --lib
        env:
          RUST_BACKTRACE: 1
      - name: Run doc tests
        run: cargo test --workspace --doc

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
      - name: Build documentation
        run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings --allow rustdoc::broken-intra-doc-links

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [check]
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-integ-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integ-
      - name: Run integration tests
        run: cargo test --test '*' -- --test-threads=2
        env:
          RUST_BACKTRACE: 1
        timeout-minutes: 30

  mujoco-tests:
    name: MuJoCo Flight Tests
    runs-on: ubuntu-latest
    needs: [check]
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-mujoco-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mujoco-
      - name: Download MuJoCo 3.3.7
        run: |
          curl -sL https://github.com/google-deepmind/mujoco/releases/download/3.3.7/mujoco-3.3.7-linux-x86_64.tar.gz | tar xz
          echo "MUJOCO_DIR=$PWD/mujoco-3.3.7" >> $GITHUB_ENV
      - name: Check compilation (mujoco feature)
        run: cargo check -p symthaea-flight --features mujoco
        env:
          MUJOCO_DYNAMIC_LINK_DIR: ${{ env.MUJOCO_DIR }}/lib
      - name: Run MuJoCo integration tests
        run: cargo test -p symthaea-flight --features mujoco -- --ignored
        env:
          MUJOCO_DYNAMIC_LINK_DIR: ${{ env.MUJOCO_DIR }}/lib
          LD_LIBRARY_PATH: ${{ env.MUJOCO_DIR }}/lib
          RUST_BACKTRACE: 1
        timeout-minutes: 10

  features:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          # cfg-gated modules in lib.rs
          - identity
          - code_generation
          - nix-mind
          - integration_module
          - observability_module
          - web_research_module
          # Major optional dependency features
          - voice-stt
          - embeddings
          - neural-bridge
          - mycelix
          - swarm
          # Consciousness stack features
          - full_consciousness
          - reasoning_engine
          # Voice pipeline
          - vocal-tract
          # Feature groups (test combinations)
          - api_module
          # Multi-feature combinations (test interactions)
          - reasoning_engine,code_generation
          - code_generation,neural-bridge
          - full_consciousness,reasoning_engine
          - magi_loop
          - full_language
          - support
          # Database & specialized features
          - lz4_compression
          - mesh-encryption
          - lancedb-backend
          - school_learning
          - benchmarks
          - physics
          - full_perception
          # Flight control (default features, no MuJoCo)
          - flight
          # Cross-domain multi-feature combinations (test interactions)
          - identity,lancedb-backend
          - lancedb-backend,reasoning_engine
          - lancedb-backend,full_consciousness
          - lancedb-backend,full_consciousness,reasoning_engine
          - observability_module,reasoning_engine
          - support,observability_module
          # Genesis DNA-to-Human pipeline (5 bio crates)
          - genesis
          # Genesis Mission Challenges (DOE S&T)
          - genesis-missions
          # Multi-agent social/byzantine modules
          - multi_agent
          # CfC-HDC language center
          - ssm_language
          # Mamba SSM fusion
          - liquid-mamba
          # Physics bridge (HDC semantic search for physics analogies)
          - physics-bridge
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Sanitize feature name for cache key
        id: feat
        shell: bash
        run: echo "name=$(echo '${{ matrix.features }}' | tr ',' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-feat-${{ steps.feat.outputs.name }}-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-feat-${{ steps.feat.outputs.name }}-
      - name: Check feature (${{ matrix.features }})
        run: cargo check --lib --features ${{ matrix.features }}
      - name: Test feature (${{ matrix.features }})
        run: cargo test --lib --features ${{ matrix.features }}
        env:
          RUST_BACKTRACE: 1

  sub-crates:
    name: Sub-Crate Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-subcrates-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-subcrates-
      - name: Test sub-crates (fast path)
        run: |
          for crate in symthaea-causal-reasoning symthaea-cell-foundry symthaea-consciousness-equation symthaea-consciousness-resonance symthaea-consciousness-topology symthaea-dream symthaea-ectogenesis symthaea-embeddings symthaea-enactive symthaea-exploration symthaea-fabrication-kernel symthaea-factor-graph symthaea-fep symthaea-field-dynamics symthaea-flight symthaea-genomics symthaea-hal symthaea-hodge symthaea-humanoid symthaea-materials symthaea-memory symthaea-narrative-self symthaea-neuromodulators symthaea-nuclear-forensics symthaea-nurture symthaea-observability symthaea-perception symthaea-phi-search symthaea-physics symthaea-physics-bridge symthaea-population symthaea-psych-bench symthaea-sensorimotor symthaea-sentinel symthaea-seven-harmonies symthaea-ssm symthaea-stt symthaea-support symthaea-types symthaea-vehicle symthaea-vision-manifold symthaea-vocal-tract symthaea-wisdom symthaea-zkproof; do
            echo "::group::$crate"
            cargo clippy -p $crate --lib -- -D warnings
            cargo test -p $crate --lib
            echo "::endgroup::"
          done
      - name: Test symthaea-core
        run: |
          cargo clippy -p symthaea-core --lib -- -D warnings
          cargo test -p symthaea-core --lib
      - name: Test symthaea-nix
        run: |
          cargo clippy -p symthaea-nix --lib -- -D warnings
          cargo test -p symthaea-nix --lib
      - name: Test symthaea-broca (L-SSM)
        run: |
          cargo clippy -p symthaea-broca --features test-helpers --lib -- -D warnings
          cargo test -p symthaea-broca --features test-helpers

  msrv:
    name: MSRV Check (1.75)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75.0'
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
      - name: Check MSRV compilation
        run: cargo check --workspace --lib

  no-default-features:
    name: Minimal Build (no default features)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-minimal-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-minimal-
      - name: Check with no default features
        run: cargo check --workspace --lib --no-default-features
      - name: Check symthaea-core features individually
        run: |
          cargo check -p symthaea-core --no-default-features --features simd
          cargo check -p symthaea-core --no-default-features --features duck

  examples:
    name: Example Compilation
    runs-on: ubuntu-latest
    needs: [check]
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-examples-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-examples-
      - name: Check examples (default features)
        run: cargo check --examples
      - name: Check featured examples
        run: |
          cargo check --example hal_demo --features hal
          cargo check --example vocal_tract_demo --features vocal-tract
          cargo check --example vocal_tract_benchmark --features vocal-tract
          cargo check --example conscious_reasoning_demo --features reasoning_engine
          cargo check --example guided_design_sweep --features physics-bridge
