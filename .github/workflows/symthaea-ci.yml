name: Symthaea CI

on:
  push:
    branches: [main]
    paths:
      - 'symthaea/**'
      - '.github/workflows/symthaea-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'symthaea/**'
      - '.github/workflows/symthaea-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: symthaea/Cargo.toml
          command: check advisories licenses

  clippy:
    name: Clippy (workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Clippy (all workspace crates)
        run: cargo clippy --workspace --no-deps --lib -- -D warnings

  check:
    name: Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symthaea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            symthaea/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('symthaea/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Check compilation
        run: cargo check --workspace --lib
        env:
          RUSTFLAGS: -D warnings
      - name: Run lib tests
        run: cargo test --workspace --lib
        env:
          RUST_BACKTRACE: 1
