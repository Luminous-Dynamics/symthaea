name: ALife Lifecycle Recorder

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-alife/src/lifecycle.rs"
      - "crates/domains/symthaea-alife/src/lifecycle_recorder.rs"
      - "crates/domains/symthaea-alife/src/population.rs"
      - "crates/domains/symthaea-alife/src/lib.rs"
      - ".github/workflows/alife-lifecycle-recorder.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  recorder-contracts:
    name: Lifecycle recorder contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Record lock identity
        run: sha256sum Cargo.lock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: alife-lifecycle-recorder

      - name: Check ALife formatting
        run: cargo fmt -p symthaea-alife -- --check

      - name: Check ALife targets
        run: cargo check --locked -p symthaea-alife --all-targets

      - name: Test lifecycle recorder
        run: 'cargo test --locked -p symthaea-alife lifecycle_recorder::'

      - name: Test complete ALife package
        run: cargo test --locked -p symthaea-alife

      - name: Strict package-local Clippy
        run: cargo clippy --locked -p symthaea-alife --all-targets --no-deps -- -D warnings

      - name: Freeze recorder authority boundary
        shell: bash
        run: |
          set -euo pipefail
          population="crates/domains/symthaea-alife/src/population.rs"
          source="crates/domains/symthaea-alife/src"

          grep -q 'lifecycle_recorder: LifecycleRecorderV1' "$population" || {
            echo "Population must privately own LifecycleRecorderV1."
            exit 1
          }

          if grep -n -E 'pub[^\n]*lifecycle_recorder|pub fn [^(]*\([^)]*\)[^{]*(&mut |&)?LifecycleRecorderV1' "$population"; then
            echo "Population must not expose mutable/raw recorder authority to callers."
            exit 1
          fi

          test "$(grep -c 'record_birth_from_plan' "$population")" -eq 2 || {
            echo "Both step paths must bind births to the exact EvolutionBirthPlanV1."
            exit 1
          }
          test "$(grep -c 'LifecycleDeathCauseV1::PopulationEnergyThreshold' "$population")" -eq 2 || {
            echo "Both step paths must emit typed threshold deaths."
            exit 1
          }
          test "$(grep -c 'LifecycleDeathCauseV1::CullWeakest' "$population")" -eq 1 || {
            echo "cull_weakest must emit its typed authoritative death."
            exit 1
          }
          test "$(grep -c 'advance_epoch()' "$population")" -eq 2 || {
            echo "Both population step paths must advance recorder epoch exactly once."
            exit 1
          }

          unexpected="$(grep -R -n 'record_birth_from_plan' "$source" \
            --include='*.rs' \
            | grep -v '/population.rs:' \
            | grep -v '/lifecycle_recorder.rs:' || true)"
          if test -n "$unexpected"; then
            echo "Birth-plan lifecycle emission escaped its authoritative owner:"
            echo "$unexpected"
            exit 1
          fi
