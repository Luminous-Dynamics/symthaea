name: Epistemic overlay repair validation

on:
  pull_request:
    branches:
      - agent/epistemic-hardening-r6
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: epistemic-overlay-repair-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  REVIEWED_BASE: f9c68947fa77fd6e29c4d2e87293715122f53cbf
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PAYLOAD_SHA256: 3585a35e445af93a1f826cb58de0c3aaeb6bdc737398dc6ac7f85d614f98a486
  WORKFLOW_OVERRIDE_SHA256: 7247759da201c42ac366cc8e3b2c4df33d6ccaae2f44ec857347571a60c7d2a2
  V11_SHA256: 15e8ffb3ece63daa42acaffa6d3698aa6a3e043c7ddd2f0573bfb1e17358bd8d
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/epistemic-hardening-r6-fix1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Install repository-authoritative Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: epistemic-hardening-symthaea-engineering

      - name: Verify and derive overlay-aware v11
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/epistemic-bootstrap-v11.yml
          overrides=.epistemic-bootstrap/source-overrides
          output="$RUNNER_TEMP/epistemic-bootstrap-v11-overlay.yml"

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum "$workflow" | awk '{print $1}')" = "$V11_SHA256"
          (cd "$overrides" && sha256sum --check --strict SHA256SUMS)

          python3 - "$workflow" "$output" <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text()

          materialize = '''          cp -a "$payload/." "$candidate/"\n          install -m 0644 .epistemic-bootstrap/epistemic-hardening-v11.yml.override "$candidate/.github/workflows/epistemic-hardening.yml"\n'''
          materialize_replacement = '''          cp -a "$payload/." "$candidate/"\n          override_root=.epistemic-bootstrap/source-overrides\n          (cd "$override_root" && sha256sum --check --strict SHA256SUMS)\n          while IFS= read -r relative_path; do\n            install -D -m 0644 "$override_root/$relative_path" "$candidate/$relative_path"\n          done < <(awk '{print $2}' "$override_root/SHA256SUMS")\n          install -m 0644 .epistemic-bootstrap/epistemic-hardening-v11.yml.override "$candidate/.github/workflows/epistemic-hardening.yml"\n'''
          if source.count(materialize) != 1:
              raise SystemExit('v11 materialization anchor was not found exactly once')
          source = source.replace(materialize, materialize_replacement, 1)

          paths = '''          find "$payload" -type f -printf '%P\\n' | sort > "$RUNNER_TEMP/expected-paths.txt"\n'''
          paths_replacement = '''          {\n            find "$payload" -type f -printf '%P\\n'\n            awk '{print $2}' "$override_root/SHA256SUMS"\n          } | sort -u > "$RUNNER_TEMP/expected-paths.txt"\n'''
          if source.count(paths) != 1:
              raise SystemExit('v11 expected-path anchor was not found exactly once')
          source = source.replace(paths, paths_replacement, 1)
          Path(sys.argv[2]).write_text(source)
          PY

          test "$(grep -c 'override_root=.epistemic-bootstrap/source-overrides' "$output")" -eq 1
          test "$(grep -c 'source-overrides/SHA256SUMS' "$output")" -eq 0
          cp "$output" .epistemic-bootstrap/epistemic-bootstrap-v11-overlay.yml.corrected

      - name: Reconstruct exact repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/payload"
          candidate="$RUNNER_TEMP/candidate"
          baseline="$RUNNER_TEMP/baseline"
          override_root=.epistemic-bootstrap/source-overrides
          mkdir -p "$payload"

          cat .epistemic-bootstrap/chunk-* | base64 --decode > "$RUNNER_TEMP/payload.tar.gz"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/payload.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/payload.tar.gz" -C "$payload"
          (cd "$payload" && sha256sum --check --strict FILES.sha256)
          rm "$payload/FILES.sha256"
          echo "$WORKFLOW_OVERRIDE_SHA256  .epistemic-bootstrap/epistemic-hardening-v11.yml.override" | sha256sum --check --strict
          (cd "$override_root" && sha256sum --check --strict SHA256SUMS)

          git worktree add --detach "$candidate" "$REVIEWED_BASE"
          cp -a "$payload/." "$candidate/"
          while IFS= read -r relative_path; do
            install -D -m 0644 "$override_root/$relative_path" "$candidate/$relative_path"
          done < <(awk '{print $2}' "$override_root/SHA256SUMS")
          install -m 0644 .epistemic-bootstrap/epistemic-hardening-v11.yml.override "$candidate/.github/workflows/epistemic-hardening.yml"
          chmod 0755 "$candidate/scripts/check-epistemic-authority.py"

          (cd "$candidate" && python3 scripts/check-epistemic-authority.py)
          (cd "$candidate" && cargo metadata --locked --no-deps --format-version 1 >/dev/null)
          (cd "$candidate" && cargo fmt -p symthaea-engineering)
          (cd "$candidate" && cargo fmt -p symthaea-engineering -- --check)
          git -C "$candidate" diff --check

          git worktree add --detach "$baseline" "$REVIEWED_BASE"
          (cd "$baseline" && cargo metadata --format-version 1 >/dev/null)
          (cd "$candidate" && cargo metadata --format-version 1 >/dev/null)
          cp "$candidate/Cargo.lock" "$RUNNER_TEMP/Cargo.lock.candidate"

          python3 - "$baseline/Cargo.lock" "$RUNNER_TEMP/Cargo.lock.candidate" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          def indexed(document):
              return {
                  (package['name'], package['version'], package.get('source')): package
                  for package in document.get('package', [])
              }

          old = indexed(tomllib.loads(Path(sys.argv[1]).read_text()))
          new = indexed(tomllib.loads(Path(sys.argv[2]).read_text()))
          if old.keys() != new.keys():
              raise SystemExit('repair changed the resolved package identity set')
          expected = ('symthaea-engineering', '0.1.0', None)
          changed = [key for key in old if old[key] != new[key]]
          if changed != [expected]:
              raise SystemExit(f'unexpected resolved package changes: {changed!r}')
          old_package = dict(old[expected])
          new_package = dict(new[expected])
          old_dependencies = set(old_package.pop('dependencies', []))
          new_dependencies = set(new_package.pop('dependencies', []))
          if old_package != new_package:
              raise SystemExit('engineering lock metadata changed beyond dependencies')
          if new_dependencies - old_dependencies != {'sha2 0.10.9'} or old_dependencies - new_dependencies:
              raise SystemExit('engineering dependency delta is not exactly sha2 0.10.9')
          PY

          cp "$RUNNER_TEMP/Cargo.lock.candidate" "$candidate/Cargo.lock"
          (cd "$candidate" && cargo metadata --locked --format-version 1 >/dev/null)

      - name: Test repaired engineering package
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/candidate"
          cargo test --locked --all-targets --all-features -p symthaea-engineering 2>&1 | tee "$RUNNER_TEMP/test-symthaea-engineering-repair.log"

      - name: Upload validated repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-engineering-overlay-repair
          path: |
            .epistemic-bootstrap/epistemic-bootstrap-v11-overlay.yml.corrected
            .epistemic-bootstrap/source-overrides
            ${{ runner.temp }}/test-symthaea-engineering-repair.log
          if-no-files-found: warn
          retention-days: 90
