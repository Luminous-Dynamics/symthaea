name: AIRROAD DC RL Transient Reference

on:
  pull_request:
    paths:
      - "docs/research/AIRROAD_DC_RL_TRANSIENT_001_V0_1.md"
      - "docs/research/fixtures/airroad-dc-rl-fault-transient-v0.1.json"
      - "tools/airroad-dc-rl-transient-qualifier/verify_rl_fault_transient.py"
      - ".github/workflows/airroad-dc-rl-transient-reference.yml"
  push:
    branches:
      - research/airroad-dc-rl-transient-v0.1
    paths:
      - "docs/research/AIRROAD_DC_RL_TRANSIENT_001_V0_1.md"
      - "docs/research/fixtures/airroad-dc-rl-fault-transient-v0.1.json"
      - "tools/airroad-dc-rl-transient-qualifier/verify_rl_fault_transient.py"
      - ".github/workflows/airroad-dc-rl-transient-reference.yml"

permissions:
  contents: read

concurrency:
  group: airroad-dc-rl-transient-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-rational-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and execute exact-rational RL oracle
        run: |
          python3 -m py_compile tools/airroad-dc-rl-transient-qualifier/verify_rl_fault_transient.py
          python3 tools/airroad-dc-rl-transient-qualifier/verify_rl_fault_transient.py
      - name: Validate exact fixture JSON
        run: |
          python3 -m json.tool docs/research/fixtures/airroad-dc-rl-fault-transient-v0.1.json > /dev/null
