name: GCS ablation receipt auditor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/bin/coding_gcs_ablation_verify.rs"
      - "src/bin/rust_repair_manifest.rs"
      - "Cargo.toml"
      - "docs/research/RUST_REPOSITORY_REPAIR_BENCHMARK_PROTOCOL_2026-10-22.md"
      - "docs/research/SWE_BENCH_LIVE_RUST_TASK_AUDIT_2026-10-23.md"
      - "docs/research/patches/swe-bench-live-validation-evidence.patch"
      - "examples/coding_gcs_ablation_benchmark.rs"
      - "docs/research/GCS_ABLATION_RECEIPT_AUDITOR_2026-10-22.md"
      - "docs/research/GCS_RUNTIME_ABLATION_BENCHMARK_2026-10-22.md"
      - ".github/workflows/gcs-ablation-receipt-auditor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcs-ablation-receipt-auditor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify GCS receipt auditor and producer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the exact SWE-bench-Live validator revision
        uses: actions/checkout@v4
        with:
          repository: microsoft/SWE-bench-Live
          ref: 62d02936a0726fbf4597b05bd07b09fb99eddae6
          path: benchmark-source
      - name: Verify and syntax-check the runtime evidence overlay
        run: |
          git -C benchmark-source apply --check "$GITHUB_WORKSPACE/docs/research/patches/swe-bench-live-validation-evidence.patch"
          git -C benchmark-source apply "$GITHUB_WORKSPACE/docs/research/patches/swe-bench-live-validation-evidence.patch"
          python3 -m py_compile benchmark-source/evaluation/validation.py
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Format changed Rust targets
        run: |
          rustfmt --edition 2024 --check src/bin/coding_gcs_ablation_verify.rs
          rustfmt --edition 2024 --check src/bin/rust_repair_manifest.rs
          rustfmt --edition 2024 --check examples/coding_gcs_ablation_benchmark.rs
      - name: Test strict SWE-bench-Live task auditor
        run: cargo test --locked --bin rust-repair-manifest --features rust-repair-manifest
      - name: Run strict Clippy on task auditor
        run: cargo clippy --locked --bin rust-repair-manifest --features rust-repair-manifest -- -D warnings
      - name: Run independent receipt and mutation tests
        run: cargo test --locked --bin coding_gcs_ablation_verify
      - name: Run producer provenance and backend-identity tests
        run: cargo test --locked --example coding_gcs_ablation_benchmark --features "code_generation geodesic_synthesis"
      - name: Compile the paired benchmark producer
        run: cargo check --locked --example coding_gcs_ablation_benchmark --features "code_generation geodesic_synthesis"
      - name: Run strict Clippy on the auditor
        run: cargo clippy --locked --bin coding_gcs_ablation_verify -- -D warnings
