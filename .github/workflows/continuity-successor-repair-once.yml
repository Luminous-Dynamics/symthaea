# One-shot exact-parent-gated admission of the Cargo.lock repair independently
# witnessed by Continuity Contract Qualification v2 run 34397910870.
#
# This writer performs no source edits and establishes no qualification. It only
# creates the smallest committed successor needed for the normal read-only v2 lane
# to evaluate the exact checked-in lock state.
name: One-shot Continuity Lock Admission

on:
  push:
    branches:
      - ci/continuity-verifier-grant-exact-head-v1
    paths:
      - '.github/workflows/continuity-successor-repair-once.yml'

permissions:
  contents: write

env:
  EXPECTED_PARENT_SHA: 0f0cf3c2880954bacf0298c930df2ed52e4bbfa7
  TARGET_BRANCH: ci/continuity-verifier-grant-exact-head-v1
  WORKFLOW_PATH: .github/workflows/continuity-successor-repair-once.yml
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  WITNESSED_PATCH_SHA256: d9318bf4d128d828397c7a728abed0db6477b12266e04062df72ccdbd824311a

jobs:
  admit-lock:
    name: Admit witnessed minimal Cargo.lock delta
    if: github.actor == 'Tristan-Stoltz-ERC'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-shot trigger boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_PATH"
          test "$(grep -Fc "uses: actions/checkout@$CHECKOUT_ACTION_SHA" "$WORKFLOW_PATH")" -eq 1

      - name: Apply and prove witnessed minimal lock admission
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cat > "$RUNNER_TEMP/continuity-lock.patch" <<'PATCH'
          diff --git a/Cargo.lock b/Cargo.lock
          index 1d5b6c3..952e1d6 100644
          --- a/Cargo.lock
          +++ b/Cargo.lock
          @@ -18520,6 +18520,15 @@ dependencies = [
            "serde",
           ]
           
          +[[package]]
          +name = "symthaea-continuity"
          +version = "0.1.0"
          +dependencies = [
          + "blake3",
          + "serde",
          + "thiserror 1.0.69",
          +]
          +
           [[package]]
           name = "symthaea-continuum-physics"
           version = "0.1.0"
          PATCH
          test "$(sha256sum "$RUNNER_TEMP/continuity-lock.patch" | awk '{print $1}')" = "$WITNESSED_PATCH_SHA256"
          git apply --check "$RUNNER_TEMP/continuity-lock.patch"
          git apply "$RUNNER_TEMP/continuity-lock.patch"

          python3 - "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock <<'PY'
          import collections
          import json
          import sys
          import tomllib

          with open(sys.argv[1], 'rb') as fh:
              before = tomllib.load(fh)
          with open(sys.argv[2], 'rb') as fh:
              after = tomllib.load(fh)

          def canon(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'))

          before_non_packages = {k: v for k, v in before.items() if k != 'package'}
          after_non_packages = {k: v for k, v in after.items() if k != 'package'}
          if canon(before_non_packages) != canon(after_non_packages):
              raise SystemExit('non-package Cargo.lock metadata changed')

          bp = collections.Counter(canon(p) for p in before.get('package', []))
          ap = collections.Counter(canon(p) for p in after.get('package', []))
          added = list((ap - bp).elements())
          removed = list((bp - ap).elements())
          if removed or len(added) != 1:
              raise SystemExit(f'expected one additive package node, added={len(added)} removed={len(removed)}')
          expected = {
              'name': 'symthaea-continuity',
              'version': '0.1.0',
              'dependencies': ['blake3', 'serde', 'thiserror 1.0.69'],
          }
          if json.loads(added[0]) != expected:
              raise SystemExit('added package node is not the reviewed symthaea-continuity node')
          PY

          read -r additions deletions < <(git diff --numstat -- Cargo.lock)
          test "$additions" = 9
          test "$deletions" = 0
          test "$(git diff --name-only)" = Cargo.lock

      - name: Commit exact lock admission and remove writer
        shell: bash
        run: |
          set -euo pipefail
          git rm "$WORKFLOW_PATH"
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > "$RUNNER_TEMP/changed"
          printf '%s\n' "$WORKFLOW_PATH" Cargo.lock | sort > "$RUNNER_TEMP/expected"
          cmp "$RUNNER_TEMP/expected" "$RUNNER_TEMP/changed"

          git config user.name 'Luminous Continuity Qualification'
          git config user.email 'actions@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(continuity): admit witnessed minimal workspace lock node'
          git push origin "HEAD:$TARGET_BRANCH"
