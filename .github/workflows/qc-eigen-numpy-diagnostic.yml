name: QC Eigen NumPy Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-quantum-chemistry/src/scf/generalized_eigen.rs"
      - "crates/domains/symthaea-quantum-chemistry/examples/qc_eigen_reference_fixtures.rs"
      - "scripts/qc_eigen_reference_compare.py"
      - "scripts/test_qc_eigen_reference_compare.py"
      - "flake.nix"
      - ".github/workflows/qc-eigen-numpy-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qc-eigen-numpy-diagnostic-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  independent-eigen-reference:
    name: Compare native checked Jacobi against NumPy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head (or dispatched commit) with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # upstream action commit at 2026-10-09
        with:
          toolchain: 1.96.0

      - name: Assert exact source checkout
        env:
          EXPECTED_QC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse --verify 'HEAD^{commit}')" = "$EXPECTED_QC_SOURCE_SHA"

      - name: Install Nix with flakes
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Test NumPy comparator fail-closed policy
        run: nix develop .#qc-verify --command python scripts/test_qc_eigen_reference_compare.py

      - name: Generate source-bound native eigen fixtures
        run: cargo run --locked -p symthaea-quantum-chemistry --example qc_eigen_reference_fixtures > /tmp/qc-eigen-native.json

      - name: Compare to independent NumPy symmetric eigensolver
        run: |
          nix develop .#qc-verify --command python scripts/qc_eigen_reference_compare.py \
            --input /tmp/qc-eigen-native.json --output /tmp/qc-eigen-comparison.json

      - name: Summarize matrix-level numerical results
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          native_path = Path("/tmp/qc-eigen-native.json")
          compare_path = Path("/tmp/qc-eigen-comparison.json")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Checked Jacobi versus NumPy", ""]
          if not native_path.exists():
              lines.append("Native fixture generation failed; no numerical conclusion.")
          elif not compare_path.exists():
              lines.append("No NumPy comparison report was emitted; no numerical conclusion.")
          else:
              report = json.loads(compare_path.read_text(encoding="utf-8"))
              counts = report["summary"]
              lines += [
                  f"- Source revision: `{report.get('native_source_revision')}`",
                  f"- NumPy version: `{report.get('numpy_version')}`",
                  f"- Cases: {counts['cases']}; passed: {counts['passed']}; "
                  f"failed: {counts['failed']}; not comparable: {counts['not_comparable']}",
                  "",
                  "| Case | Native status | Comparison | Relative eigenvalue error | Reference residual |",
                  "|---|---|---|---:|---:|",
              ]
              for item in report["results"]:
                  eigen = item.get("max_relative_eigenvalue_error")
                  residual = item.get("max_relative_reference_eigenpair_residual")
                  eigen_s = "—" if eigen is None else f"{eigen:.3g}"
                  residual_s = "—" if residual is None else f"{residual:.3g}"
                  lines.append(
                      f"| {item.get('case_id')} | {item.get('native_status')} | "
                      f"{item.get('comparison_status')} | {eigen_s} | {residual_s} |"
                  )
              lines += [
                  "",
                  "This is matrix-level solver verification, not chemical-accuracy evidence.",
                  "A failed comparison leaves the workflow failed; this summary does not override the result.",
              ]
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload native and NumPy comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qc-eigen-numpy-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/qc-eigen-native.json
            /tmp/qc-eigen-comparison.json
          if-no-files-found: warn
          retention-days: 30
