name: SYM-FV-XENIA-002 V2 Sequence Allocator

on:
  pull_request:
    paths:
      - "formal/lean/security/XeniaV2SequenceAllocator.lean"
      - "docs/formal/sym-fv-xenia-002-v1.json"
      - "scripts/validate_sym_fv_xenia_002.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/sym-fv-xenia-002.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sym-fv-xenia-002-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  v2-sequence-allocator:
    name: Lean Xenia V2 sequence allocator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact Git subject and parent
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          PARENT="fbd7a754ea8389ca93f7680d93ed8b48553e6376"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain=v1 --untracked-files=all

      - name: Static contract and claim ceiling
        run: python3 scripts/validate_sym_fv_xenia_002.py

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Prove Lean wrapper propagates generic failure
        run: |
          set -euo pipefail
          cat > /tmp/sym-fv-xenia-002-known-bad.lean <<'LEAN'
          example : False := by
            trivial
          LEAN
          if nix develop .#formal --command sh -c 'lean /tmp/sym-fv-xenia-002-known-bad.lean > /tmp/sym-fv-xenia-002-known-bad-output.txt 2>&1'; then
            cat /tmp/sym-fv-xenia-002-known-bad-output.txt
            echo "known-bad Lean subject incorrectly returned success" >&2
            exit 1
          fi
          cat /tmp/sym-fv-xenia-002-known-bad-output.txt
          grep -q 'error:' /tmp/sym-fv-xenia-002-known-bad-output.txt

      - name: Hostile control — exhaustion wrap-to-zero must fail
        run: |
          set -euo pipefail
          cp formal/lean/security/XeniaV2SequenceAllocator.lean /tmp/xenia-v2-wrap-mutant.lean
          cat >> /tmp/xenia-v2-wrap-mutant.lean <<'LEAN'
          namespace Symthaea.Formal.XeniaV2AllocatorHostile
          open Symthaea.Formal.XeniaV2Allocator
          def wrapAtExhaustion (_s : AllocatorState) : Option (Nat × AllocatorState) :=
            some (0, { next := 1 })
          example : wrapAtExhaustion { next := SequenceLimit } = none := by
            rfl
          end Symthaea.Formal.XeniaV2AllocatorHostile
          LEAN
          if nix develop .#formal --command sh -c 'lean /tmp/xenia-v2-wrap-mutant.lean > /tmp/xenia-v2-wrap-mutant-output.txt 2>&1'; then
            cat /tmp/xenia-v2-wrap-mutant-output.txt
            echo "wrap-to-zero mutant unexpectedly satisfied exhaustion refusal" >&2
            exit 1
          fi
          cat /tmp/xenia-v2-wrap-mutant-output.txt
          grep -q 'error:' /tmp/xenia-v2-wrap-mutant-output.txt

      - name: Hostile control — success without state advance must fail
        run: |
          set -euo pipefail
          cp formal/lean/security/XeniaV2SequenceAllocator.lean /tmp/xenia-v2-no-advance-mutant.lean
          cat >> /tmp/xenia-v2-no-advance-mutant.lean <<'LEAN'
          namespace Symthaea.Formal.XeniaV2AllocatorHostile
          open Symthaea.Formal.XeniaV2Allocator
          def noAdvance (s : AllocatorState) : Option (Nat × AllocatorState) :=
            some (s.next, s)
          example (s : AllocatorState) :
              noAdvance s = some (s.next, { next := s.next + 1 }) := by
            rfl
          end Symthaea.Formal.XeniaV2AllocatorHostile
          LEAN
          if nix develop .#formal --command sh -c 'lean /tmp/xenia-v2-no-advance-mutant.lean > /tmp/xenia-v2-no-advance-mutant-output.txt 2>&1'; then
            cat /tmp/xenia-v2-no-advance-mutant-output.txt
            echo "non-advancing allocator mutant unexpectedly satisfied exact advance" >&2
            exit 1
          fi
          cat /tmp/xenia-v2-no-advance-mutant-output.txt
          grep -q 'error:' /tmp/xenia-v2-no-advance-mutant-output.txt

      - name: Typecheck exact theorem subject fail-closed
        run: |
          set -euo pipefail
          nix develop .#formal --command sh -c '
            set -eu
            lean --version > /tmp/sym-fv-xenia-002-lean-version.txt
            cat /tmp/sym-fv-xenia-002-lean-version.txt
            if ! lean formal/lean/security/XeniaV2SequenceAllocator.lean > /tmp/sym-fv-xenia-002-lean-output.txt 2>&1; then
              cat /tmp/sym-fv-xenia-002-lean-output.txt
              exit 1
            fi
            cat /tmp/sym-fv-xenia-002-lean-output.txt
            if grep -q "sorryAx" /tmp/sym-fv-xenia-002-lean-output.txt; then
              echo "forbidden sorryAx in Lean axiom census" >&2
              exit 1
            fi
            if grep -q "error:" /tmp/sym-fv-xenia-002-lean-output.txt; then
              echo "Lean output contains an error marker despite zero exit" >&2
              exit 1
            fi
          '

      - name: Postflight immutability and receipt
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          PARENT = "fbd7a754ea8389ca93f7680d93ed8b48553e6376"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          receipt = {
              "schema": "symthaea.formal.sym-fv-xenia-002-qualification-receipt.v1",
              "issue": 6144,
              "evidence_class": "AbstractFormalTheorem",
              "result": "LeanTypecheckedAxiomCleanAndHostileControlsRejected",
              "head": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "parent_commit": PARENT,
              "merge_base_with_parent": git("merge-base", PARENT, "HEAD"),
              "theorem_blob": git("rev-parse", "HEAD:formal/lean/security/XeniaV2SequenceAllocator.lean"),
              "lean_version": Path("/tmp/sym-fv-xenia-002-lean-version.txt").read_text().strip(),
              "theorem_sha256": sha256("formal/lean/security/XeniaV2SequenceAllocator.lean"),
              "lean_output_sha256": sha256("/tmp/sym-fv-xenia-002-lean-output.txt"),
              "known_bad_output_sha256": sha256("/tmp/sym-fv-xenia-002-known-bad-output.txt"),
              "wrap_mutant_output_sha256": sha256("/tmp/xenia-v2-wrap-mutant-output.txt"),
              "no_advance_mutant_output_sha256": sha256("/tmp/xenia-v2-no-advance-mutant-output.txt"),
              "manifest_sha256": sha256("docs/formal/sym-fv-xenia-002-v1.json"),
              "validator_sha256": sha256("scripts/validate_sym_fv_xenia_002.py"),
              "exact_head_checkout": True,
              "exact_parent_bound": True,
              "known_bad_lean_subject_rejected": True,
              "wrap_to_zero_mutant_rejected": True,
              "no_advance_mutant_rejected": True,
              "lean_exit_zero": True,
              "sorryAx_absent": True,
              "lean_error_markers_absent": True,
              "repository_postflight_clean": True,
              "design_target": "Luminous-Dynamics/xenia-wire#78",
              "sibling_injectivity_pr": 6142,
              "nonclaims": [
                  "not-rust-u64-refinement",
                  "not-compiled-overflow-or-panic-proof",
                  "not-key-iv-reset-lifecycle-proof",
                  "not-exclusive-sender-ownership-proof",
                  "not-fresh-context-generation-proof",
                  "not-aead-usage-limit-analysis",
                  "not-production-xenia-v2-qualification"
              ]
          }
          Path("/tmp/sym-fv-xenia-002-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Retain proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sym-fv-xenia-002-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/sym-fv-xenia-002-lean-version.txt
            /tmp/sym-fv-xenia-002-lean-output.txt
            /tmp/sym-fv-xenia-002-known-bad-output.txt
            /tmp/xenia-v2-wrap-mutant-output.txt
            /tmp/xenia-v2-no-advance-mutant-output.txt
            /tmp/sym-fv-xenia-002-receipt.json
          if-no-files-found: error
          retention-days: 30
