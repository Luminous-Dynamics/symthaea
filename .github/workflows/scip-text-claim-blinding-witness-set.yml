name: SCIP Text Claim Blinding Witness Set Contract

on:
  pull_request:
    paths:
      - 'scripts/scip_text_claim_blinding_witness_set.py'
      - 'scripts/test_scip_text_claim_blinding_witness_set.py'
      - 'scripts/qualification/scip_text_claim_blinding_witness_set_policy_v1.json'
      - 'docs/release/evidence/SCIP_TEXT_CLAIM_BLINDING_WITNESS_SET_V1.md'
      - '.github/workflows/scip-text-claim-blinding-witness-set.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  witness-set:
    name: Validate complete role-session witness composition
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Prove exact five-file review surface
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-HEAD^1}"
          git diff --name-only "$base" HEAD | LC_ALL=C sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/scip-text-claim-blinding-witness-set.yml
          docs/release/evidence/SCIP_TEXT_CLAIM_BLINDING_WITNESS_SET_V1.md
          scripts/qualification/scip_text_claim_blinding_witness_set_policy_v1.json
          scripts/scip_text_claim_blinding_witness_set.py
          scripts/test_scip_text_claim_blinding_witness_set.py
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Verify exact V23 and inherited V22 identities
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/scip-v23.sha256 <<'EOF'
          394c9170eaf90fda68c1f764b88497e89adb40f0d3581255d76564a991c65c27  scripts/scip_text_claim_blinding_witness_set.py
          16d941578598dd4eef2ed4ab389c00a8c8b1fb446dd8d8d831959be38f883ff4  scripts/test_scip_text_claim_blinding_witness_set.py
          1b9dc4f9100c46f763e6b0b71a07b22a80b0c48bac93aaa657ae24257e5fe527  scripts/qualification/scip_text_claim_blinding_witness_set_policy_v1.json
          EOF
          sha256sum -c /tmp/scip-v23.sha256
          test "$(git hash-object scripts/scip_text_claim_blinding_witness_set.py)" = 6076e570aaa0062fe12697543a3a14374094bedf
          test "$(git hash-object scripts/test_scip_text_claim_blinding_witness_set.py)" = 3ccd50e9f0566d4693efc57ee8b8607725324451
          test "$(git hash-object scripts/qualification/scip_text_claim_blinding_witness_set_policy_v1.json)" = c6ff51f282f032acd2d45e85687095cc6042146b
          test "$(git hash-object scripts/scip_text_claim_blinding_witness.py)" = e39812a8e00545c3d8f31f46f1b48a70e0b7da03
          test "$(git hash-object scripts/test_scip_text_claim_blinding_witness.py)" = 4c928f324c9e187698a61b34ef5dac126e42a352
          test "$(git hash-object scripts/qualification/scip_text_claim_blinding_witness_policy_v1.json)" = bf9f23a94a2096c90b05cc3c9d1be72796f9da58

      - name: Compile without mutating checkout
        env:
          PYTHONPYCACHEPREFIX: /tmp/scip-v23-pycache
        run: |
          python3 -m py_compile \
            scripts/scip_text_claim_blinding_witness_set.py \
            scripts/test_scip_text_claim_blinding_witness_set.py

      - name: Run complete-set and hostile composition suite
        env:
          PYTHONPATH: scripts
        run: python3 -B scripts/test_scip_text_claim_blinding_witness_set.py

      - name: Prove frozen policy identity and authority ceiling
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=json.loads(Path('scripts/qualification/scip_text_claim_blinding_witness_set_policy_v1.json').read_text())
          canonical=json.dumps(p,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(canonical).hexdigest() == 'f50117a1dbe55574f65608194943595b298e66fde6e7dea727e57a51267f1a8f'
          assert p['v22_blinding_witness_policy_sha256'] == 'edb837213b56f4423bc096d3bb11c90dd07de03cf5b672398b1a17de2a6b6cc0'
          assert p['v21_case_admission_policy_sha256'] == '452f4201c230ca3278d1ddc744fb70bca5944fa0d77b89e494096cfbf9c3dfb9'
          assert p['receipt']['domain'].endswith('\x00')
          assert all(p['composition'].values())
          assert all(p['claim_boundary'].values())
          PY

      - name: Prove checkout remained byte-identical
        run: test -z "$(git status --porcelain --untracked-files=all)"
