name: QUAL HDC bounded decoder independent run receipt

on:
  workflow_run:
    workflows:
      - QUAL HDC bounded decoder trusted runner
    types:
      - completed

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  receipt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Independently verify bounded decoder qualification
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned
        env:
          EXPECTED_PR: "6803"
          EXPECTED_SUBJECT: "433ca9c92b16bfac824225950e32692e8e151238"
          EXPECTED_PARENT: "164d6b94d12bb72a902bdc2164d25cd540d3ba7f"
          EXPECTED_BRANCH: "research/hdc-linear-code-bounded-decoder-v2"
          EXPECTED_BASE_BRANCH: "research/hdc-linear-code-recovery-design-v1"
          EXPECTED_REPOSITORY: "Luminous-Dynamics/symthaea"
          EXPECTED_REPOSITORY_ID: "1136141775"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/qual-hdc-bounded-decoder-trusted-runner.yml"
          EXPECTED_WORKFLOW_NAME: "QUAL HDC bounded decoder trusted runner"
          EXPECTED_WORKFLOW_BLOB_SHA: "0c98627095d87304c4a28d05ec3746e12ec27f77"
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            const expected = {
              pr: Number(process.env.EXPECTED_PR),
              subject: process.env.EXPECTED_SUBJECT,
              parent: process.env.EXPECTED_PARENT,
              branch: process.env.EXPECTED_BRANCH,
              baseBranch: process.env.EXPECTED_BASE_BRANCH,
              repository: process.env.EXPECTED_REPOSITORY,
              repositoryId: Number(process.env.EXPECTED_REPOSITORY_ID),
              workflowPath: process.env.EXPECTED_WORKFLOW_PATH,
              workflowName: process.env.EXPECTED_WORKFLOW_NAME,
              workflowBlobSha: process.env.EXPECTED_WORKFLOW_BLOB_SHA,
            };

            const TRUSTED_VERIFIER_WORKFLOW_PATH = '.github/workflows/qual-hdc-bounded-decoder-independent-receipt.yml';
            const STATUS_CONTEXT = 'HDC / Independent Qualification';

            function canonicalize(value) {
              if (Array.isArray(value)) return value.map(canonicalize);
              if (value && typeof value === 'object') {
                return Object.fromEntries(
                  Object.keys(value).sort().map((key) => [key, canonicalize(value[key])])
                );
              }
              return value;
            }

            function sha256Canonical(value, domain = 'promotion-eligibility-lease-v1\\u0000') {
              return crypto
                .createHash('sha256')
                .update(domain + JSON.stringify(canonicalize(value)))
                .digest('hex');
            }

            function admissionPolicyIdentity(expectedValue, files, steps) {
              return sha256Canonical({
                schema_version: 'hdc-bounded-decoder-admission-policy-v1',
                expected: expectedValue,
                expected_files: files,
                required_steps: steps,
              });
            }

            function buildPromotionEligibilityLease({
              evaluation,
              evidence,
              governanceObservation,
              verifierWorkflowBlobSha,
              policyIdentity,
              observedAt,
            }) {
              const reasons = [];
              if (evaluation.qualificationResult !== 'PASS') reasons.push('qualification_not_pass');
              if (evidence.contextSha !== evidence.currentMainSha ||
                  evidence.contextSha !== evidence.finalMainSha) reasons.push('verifier_root_drift');
              if (!evaluation.checks.run_attempt_matches_trigger) reasons.push('run_attempt_drift');
              if (!evaluation.checks.pr_snapshot_stable) reasons.push('pr_snapshot_drift');
              if (!evaluation.checks.base_branch_tip_stable) reasons.push('base_branch_tip_drift');
              if (!evaluation.checks.artifact_snapshot_stable) reasons.push('artifact_snapshot_drift');
              if (!governanceObservation.verified) reasons.push('governance_authority_unverified');

              const lease = {
                schema_version: 'PromotionEligibilityLeaseV1',
                lease_state: reasons.length === 0 ? 'ELIGIBLE' : 'NOT_ELIGIBLE',
                invalidation_reasons: reasons,
                observed_at: observedAt,
                repository: {
                  id: expected.repositoryId,
                  full_name: expected.repository,
                },
                subject: {
                  pr_number: expected.pr,
                  head_sha: evidence.pr.head.sha,
                  base_branch: evidence.pr.base.ref,
                  base_sha: evidence.pr.base.sha,
                  merge_commit_sha: evidence.pr.merge_commit_sha ?? null,
                },
                currentness: {
                  verifier_main_tip_initial: evidence.currentMainSha,
                  verifier_main_tip_final: evidence.finalMainSha,
                  stacked_base_tip_initial: evidence.initialBaseBranchTipSha,
                  stacked_base_tip_final: evidence.finalBaseBranchTipSha,
                },
                qualification: {
                  run_id: evidence.run.id,
                  run_attempt: evidence.run.run_attempt,
                  triggering_run_attempt: evidence.triggerRunAttempt,
                  head_sha: evidence.run.head_sha,
                  workflow_path: evidence.run.path,
                },
                evidence_lifecycle: {
                  artifact_id: evidence.finalArtifacts?.[0]?.id ?? null,
                  digest: evidence.finalArtifacts?.[0]?.digest ?? null,
                  created_at: evidence.finalArtifacts?.[0]?.created_at ?? null,
                  expires_at: evidence.finalArtifacts?.[0]?.expires_at ?? null,
                },
                trusted_verifier_root: {
                  workflow_path: TRUSTED_VERIFIER_WORKFLOW_PATH,
                  workflow_blob_sha: verifierWorkflowBlobSha,
                  commit_sha: evidence.contextSha,
                },
                independent_admission_policy: {
                  identity_sha256: policyIdentity,
                  schema_version: 'hdc-bounded-decoder-admission-policy-v1',
                },
                governance_authority: governanceObservation,
                reconciliation: {
                  observed_at: observedAt,
                  status_context: STATUS_CONTEXT,
                },
              };
              lease.lease_id_sha256 = sha256Canonical(lease);
              return lease;
            }
            const expectedFiles = [
              '.github/workflows/hdc-linear-code-syndrome-qualify.yml',
              'crates/core/symthaea-core/src/hdc/mod.rs',
              'crates/core/symthaea-core/src/hdc/syndrome_decoder.rs',
              'crates/core/symthaea-core/tests/linear_code_syndrome_decoder.rs',
              'docs/research/HDC_LINEAR_CODE_BOUNDED_DECODER.md',
            ].sort();

            const expectedSourceBlobShas = {
              '.github/workflows/hdc-linear-code-syndrome-qualify.yml':
                '748fd4220be7cbdc215761b97c408bf960684fe7',
              'crates/core/symthaea-core/src/hdc/mod.rs':
                '17b297a167b57f22070a50115f4967b820f911c1',
              'crates/core/symthaea-core/src/hdc/syndrome_decoder.rs':
                'cdb2010231e64632e04e5fe2e81a89fddd69d1cd',
              'crates/core/symthaea-core/tests/linear_code_syndrome_decoder.rs':
                'ca19e6d79b90501e9ce0d94d88924595264e77d6',
              'docs/research/HDC_LINEAR_CODE_BOUNDED_DECODER.md':
                '6ef9f1b7aa7447a7e883cbaa87e240061d6ec8b1',
            };

            const requiredSteps = [
              'Checkout exact research head',
              'Record exact research head and parent',
              'Enforce stacked research surface',
              'Install pinned Rust toolchain',
              'Verify pinned Rust toolchain',
              'Capture runner provenance',
              'Capture source provenance',
              'Focused formatting',
              'Build isolated stacked harness',
              'Existing linear-code unit suite',
              'Existing ambiguity qualification',
              'Independent syndrome decoder qualification',
              'Capture brute-force dual-space oracle',
              'Capture fixed syndrome specification oracle',
              'Capture syndrome quotient metric ledger',
              'Capture full syndrome quotient distance spectrum',
              'Capture executable spectrum-label blind-spot adversary',
              'Capture exact syndrome fiber difference closure',
              'Capture Walsh dual-fiber structure',
              'Capture syndrome/coset invariant ledger',
              'Capture exhaustive syndrome oracle and linearity ledger',
              'Capture exact minimum-syndrome multiplicity ledger',
              'Verify explicit minimum-syndrome list truncation',
              'Prove factorization ambiguity is separate',
              'Capture coordinate permutation equivariance',
              'Capture syndrome decoder ledger',
              'Capture generator-basis equivariance',
              'Capture composed metamorphic invariance',
              'Capture random-code list and independent-oracle sweep',
              'Capture deterministic random-code sweep',
              'Capture beyond-radius semantics',
              'Strict Clippy',
              'Emit qualification receipt',
              'Upload qualification receipt',
              'Revalidate uploaded artifact provenance',
              'Publish artifact provenance summary',
            ];

            function artifactLifecycleVerified(artifact, nowMs = Date.now()) {
              if (!artifact || !Number.isSafeInteger(artifact.id) || artifact.id <= 0) {
                return false;
              }
              if (
                typeof artifact.created_at !== 'string' ||
                typeof artifact.expires_at !== 'string' ||
                !Number.isSafeInteger(artifact.size_in_bytes) ||
                artifact.size_in_bytes <= 0
              ) {
                return false;
              }

              const createdAt = Date.parse(artifact.created_at);
              const expiresAt = Date.parse(artifact.expires_at);
              return (
                Number.isFinite(createdAt) &&
                Number.isFinite(expiresAt) &&
                createdAt <= nowMs &&
                nowMs < expiresAt
              );
            }

            function evaluate(evidence) {
              const jobs = evidence.jobs ?? [];
              const firstJobSteps =
                jobs.length === 1 && Array.isArray(jobs[0].steps)
                  ? jobs[0].steps
                  : [];

              const stepConclusions = {};
              for (const name of requiredSteps) {
                const matches = firstJobSteps.filter((step) => step.name === name);
                stepConclusions[name] = matches.map((step) => step.conclusion);
              }

              const exactStepSurface =
                jobs.length === 1 &&
                jobs[0].name === 'Trusted exact-head bounded syndrome qualification' &&
                firstJobSteps.length === requiredSteps.length &&
                JSON.stringify(firstJobSteps.map((step) => step.name)) ===
                  JSON.stringify(requiredSteps);

              const requiredStepsSucceeded = requiredSteps.every(
                (name) =>
                  stepConclusions[name].length === 1 &&
                  stepConclusions[name][0] === 'success'
              );

              const artifacts = evidence.artifacts ?? [];
              const expectedArtifactName =
                'hdc-linear-code-bounded-decoder-' +
                expected.subject +
                '-run-' +
                evidence.run.id +
                '-attempt-' +
                evidence.run.run_attempt;

              const artifactMatches = artifacts.filter(
                (artifact) => artifact.name === expectedArtifactName
              );

              const artifact = artifactMatches[0] ?? null;
              const finalArtifacts = evidence.finalArtifacts ?? evidence.artifacts ?? [];
              const finalArtifactMatches = finalArtifacts.filter(
                (candidate) => candidate.name === expectedArtifactName
              );
              const finalArtifact = finalArtifactMatches[0] ?? null;
              const finalArtifactVerified =
                finalArtifacts.length === 1 &&
                finalArtifactMatches.length === 1 &&
                artifactLifecycleVerified(finalArtifact) &&
                finalArtifact.expired === false &&
                finalArtifact.size_in_bytes > 0 &&
                finalArtifact.workflow_run?.id === evidence.run.id &&
                finalArtifact.workflow_run?.repository_id === expected.repositoryId &&
                finalArtifact.workflow_run?.head_repository_id === expected.repositoryId &&
                finalArtifact.workflow_run?.head_sha === expected.subject &&
                typeof finalArtifact.digest === 'string' &&
                /^sha256:[0-9a-f]{64}$/.test(finalArtifact.digest);
              const artifactSnapshotStable =
                artifact !== null &&
                finalArtifact !== null &&
                artifact.id === finalArtifact.id &&
                artifact.name === finalArtifact.name &&
                artifact.digest === finalArtifact.digest &&
                artifact.created_at === finalArtifact.created_at &&
                artifact.expires_at === finalArtifact.expires_at;
              const artifactVerified =
                artifacts.length === 1 &&
                artifactMatches.length === 1 &&
                artifactLifecycleVerified(artifact) &&
                artifact.expired === false &&
                artifact.size_in_bytes > 0 &&
                artifact.workflow_run?.id === evidence.run.id &&
                artifact.workflow_run?.repository_id === expected.repositoryId &&
                artifact.workflow_run?.head_repository_id === expected.repositoryId &&
                artifact.workflow_run?.head_sha === expected.subject &&
                typeof artifact.digest === 'string' &&
                /^sha256:[0-9a-f]{64}$/.test(artifact.digest);

              const sourceIdentityVerified =
                JSON.stringify(evidence.sourceBlobShas) ===
                  JSON.stringify(expectedSourceBlobShas) &&
                evidence.workflowFileSha === expected.workflowBlobSha;

              const mergeParentSet =
                evidence.mergeCommit?.parents?.map((parent) => parent.sha).sort() ?? [];
              const expectedMergeParentSet = [expected.parent, expected.subject].sort();

              const mergeIdentityVerified =
                typeof evidence.pr.merge_commit_sha === 'string' &&
                evidence.pr.merge_commit_sha !== expected.subject &&
                evidence.pr.merge_commit_sha !== expected.parent &&
                /^[0-9a-f]{40}$/.test(evidence.pr.merge_commit_sha) &&
                evidence.mergeCommit?.sha === evidence.pr.merge_commit_sha &&
                evidence.mergeCommit?.parents?.length === 2 &&
                JSON.stringify(mergeParentSet) === JSON.stringify(expectedMergeParentSet);

              const mergeSourceIdentityVerified =
                JSON.stringify(evidence.mergeSourceBlobShas) ===
                  JSON.stringify(expectedSourceBlobShas) &&
                true;

              const changedFiles = [...(evidence.compare.files ?? [])]
                .map((file) => file.filename)
                .sort();

              const runIdentityShapeVerified =
                Number.isSafeInteger(evidence.run.id) &&
                evidence.run.id > 0 &&
                Number.isSafeInteger(evidence.run.run_attempt) &&
                evidence.run.run_attempt > 0;

              const checks = {
                verifier_on_main: evidence.contextRef === 'refs/heads/main',
                run_identity_shape: runIdentityShapeVerified,
                run_attempt_matches_trigger:
                  evidence.run.run_attempt === evidence.triggerRunAttempt,
                verifier_root_current: evidence.contextSha === evidence.currentMainSha,
                verifier_root_stable:
                  evidence.contextSha === evidence.currentMainSha &&
                  evidence.contextSha === evidence.finalMainSha,
                repository_identity:
                  evidence.contextRepository === expected.repository &&
                  Number(evidence.run.repository?.id) === expected.repositoryId &&
                  Number(evidence.run.head_repository?.id) === expected.repositoryId &&
                  evidence.run.head_repository?.full_name === expected.repository,
                run_identity:
                  evidence.run.path === expected.workflowPath &&
                  evidence.run.name === expected.workflowName &&
                  evidence.run.event === 'pull_request' &&
                  evidence.run.conclusion === 'success' &&
                  evidence.run.head_branch === expected.branch &&
                  evidence.run.head_sha === expected.subject,
                pr_snapshot_stable:
                  evidence.finalPr?.number === evidence.pr.number &&
                  evidence.finalPr?.head?.sha === evidence.pr.head?.sha &&
                  evidence.finalPr?.head?.ref === evidence.pr.head?.ref &&
                  Number(evidence.finalPr?.head?.repo?.id) === Number(evidence.pr.head?.repo?.id) &&
                  evidence.finalPr?.base?.sha === evidence.pr.base?.sha &&
                  evidence.finalPr?.base?.ref === evidence.pr.base?.ref &&
                  Number(evidence.finalPr?.base?.repo?.id) === Number(evidence.pr.base?.repo?.id) &&
                  evidence.finalPr?.merge_commit_sha === evidence.pr.merge_commit_sha,
                base_branch_tip_stable:
                  evidence.initialBaseBranchTipSha === expected.parent &&
                  evidence.finalBaseBranchTipSha === expected.parent &&
                  evidence.initialBaseBranchTipSha === evidence.finalBaseBranchTipSha &&
                  evidence.pr.base.sha === evidence.initialBaseBranchTipSha &&
                  evidence.finalPr?.base?.sha === evidence.finalBaseBranchTipSha,
                pr_identity:
                  evidence.pr.number === expected.pr &&
                  evidence.pr.head.ref === expected.branch &&
                  evidence.pr.head.sha === expected.subject &&
                  Number(evidence.pr.head.repo?.id) === expected.repositoryId &&
                  evidence.pr.head.repo?.full_name === expected.repository &&
                  evidence.pr.base.ref === expected.baseBranch &&
                  evidence.pr.base.sha === expected.parent &&
                  Number(evidence.pr.base.repo?.id) === expected.repositoryId &&
                  evidence.pr.base.repo?.full_name === expected.repository,
                run_pr_association_view_shape:
                  Array.isArray(evidence.run.pull_requests) &&
                  evidence.run.pull_requests.length === 1 &&
                  evidence.run.pull_requests[0].number === expected.pr,
                ancestry:
                  evidence.parentCommit.sha === expected.subject &&
                  evidence.parentCommit.parents?.[0]?.sha === expected.parent,
                comparison:
                  evidence.compare.status === 'ahead' &&
                  evidence.compare.ahead_by > 0 &&
                  evidence.compare.behind_by === 0 &&
                  evidence.compare.merge_base_commit?.sha === expected.parent &&
                  JSON.stringify(changedFiles) === JSON.stringify(expectedFiles),
                workflow_definition: evidence.workflowFileSha === expected.workflowBlobSha,
                merge_snapshot_identity: mergeIdentityVerified,
                merge_snapshot_source_identity: mergeSourceIdentityVerified,
                exact_step_surface: exactStepSurface,
                required_steps_succeeded: requiredStepsSucceeded,
                artifact_verified: artifactVerified,
                artifact_snapshot_stable: artifactSnapshotStable && finalArtifactVerified,
                source_identity_verified: sourceIdentityVerified,
              };

              return {
                qualificationResult:
                  Object.values(checks).every(Boolean) ? 'PASS' : 'NOT_PASS',
                checks,
                artifact,
                finalArtifact,
                stepConclusions,
                changedFiles,
              };
            }

            function syntheticEvidence() {
              const runId = 1;
              return {
                contextRef: 'refs/heads/main',
                contextSha: 'synthetic-main',
                currentMainSha: 'synthetic-main',
                finalMainSha: 'synthetic-main',
                contextRepository: expected.repository,
                triggerRunAttempt: 1,
                run: {
                  id: runId,
                  run_attempt: 1,
                  repository: { id: expected.repositoryId },
                  head_repository: {
                    id: expected.repositoryId,
                    full_name: expected.repository,
                  },
                  path: expected.workflowPath,
                  name: expected.workflowName,
                  event: 'pull_request',
                  conclusion: 'success',
                  head_branch: expected.branch,
                   head_sha: expected.subject,
                  pull_requests: [
                    {
                      number: expected.pr,
                      head: {
                        sha: expected.subject,
                        ref: expected.branch,
                        repo: {
                          id: expected.repositoryId,
                          full_name: expected.repository,
                        },
                      },
                      base: {
                        sha: expected.parent,
                        ref: expected.baseBranch,
                        repo: {
                          id: expected.repositoryId,
                          full_name: expected.repository,
                        },
                      },
                    },
                  ],
                },
                pr: {
                  number: expected.pr,
                  head: {
                    sha: expected.subject,
                    ref: expected.branch,
                    repo: {
                      id: expected.repositoryId,
                      full_name: expected.repository,
                    },
                  },
                  base: {
                    sha: expected.parent,
                    ref: expected.baseBranch,
                    repo: {
                      id: expected.repositoryId,
                      full_name: expected.repository,
                    },
                  },
                   merge_commit_sha: 'c'.repeat(40),
                },
                initialBaseBranchTipSha: expected.parent,
                finalBaseBranchTipSha: expected.parent,
                finalPr: {
                  number: expected.pr,
                  head: {
                    sha: expected.subject,
                    ref: expected.branch,
                    repo: {
                      id: expected.repositoryId,
                      full_name: expected.repository,
                    },
                  },
                  base: {
                    sha: expected.parent,
                    ref: expected.baseBranch,
                    repo: {
                      id: expected.repositoryId,
                      full_name: expected.repository,
                    },
                  },
                  merge_commit_sha: 'c'.repeat(40),
                },
                parentCommit: {
                  sha: expected.subject,
                  parents: [{ sha: expected.parent }],
                },
                compare: {
                  status: 'ahead',
                  ahead_by: 1,
                  behind_by: 0,
                  merge_base_commit: { sha: expected.parent },
                  files: expectedFiles.map((filename) => ({ filename })),
                },
                mergeCommit: {
                   sha: 'c'.repeat(40),
                  parents: [
                    { sha: expected.parent },
                    { sha: expected.subject },
                  ],
                },
                mergeSourceBlobShas: { ...expectedSourceBlobShas },
                workflowFileSha: expected.workflowBlobSha,
                sourceBlobShas: { ...expectedSourceBlobShas },
                jobs: [
                  {
                    name: 'Trusted exact-head bounded syndrome qualification',
                    steps: requiredSteps.map((name) => ({ name, conclusion: 'success' })),
                  },
                ],
                artifacts: [
                  {
                    id: 1,
                    name:
                      'hdc-linear-code-bounded-decoder-' +
                      expected.subject +
                      '-run-' +
                      runId +
                      '-attempt-1',
                    expired: false,
                    created_at: '2026-01-01T00:00:00Z',
                    expires_at: '2027-01-01T00:00:00Z',
                    size_in_bytes: 1,
                    digest: 'sha256:' + 'a'.repeat(64),
                    workflow_run: {
                      id: runId,
                      repository_id: expected.repositoryId,
                      head_repository_id: expected.repositoryId,
                      head_sha: expected.subject,
                    },
                  },
                ],
                finalArtifacts: [
                  {
                    id: 1,
                    name:
                      'hdc-linear-code-bounded-decoder-' +
                      expected.subject +
                      '-run-' +
                      runId +
                      '-attempt-1',
                    expired: false,
                    created_at: '2026-01-01T00:00:00Z',
                    expires_at: '2027-01-01T00:00:00Z',
                    size_in_bytes: 1,
                    digest: 'sha256:' + 'a'.repeat(64),
                    workflow_run: {
                      id: runId,
                      repository_id: expected.repositoryId,
                      head_repository_id: expected.repositoryId,
                      head_sha: expected.subject,
                    },
                  },
                ],
              };
            }

            const attackCases = [
              ['verifier_ref', (e) => { e.contextRef = 'refs/heads/research/evil'; }],
              ['verifier_root_stale', (e) => { e.currentMainSha = '0'.repeat(40); }],
              ['verifier_root_drift_between_reads', (e) => { e.finalMainSha = '0'.repeat(40); }],
              ['repository_id', (e) => { e.run.repository.id += 1; }],
              ['run_workflow_path', (e) => { e.run.path = 'untrusted/workflow.yml'; }],
              ['run_workflow_name', (e) => { e.run.name = 'untrusted workflow'; }],
              ['run_head_branch', (e) => { e.run.head_branch = 'untrusted-branch'; }],
              ['run_head_repository', (e) => { e.run.head_repository.full_name = 'attacker/clone'; }],
              ['run_event', (e) => { e.run.event = 'push'; }],
              ['run_conclusion', (e) => { e.run.conclusion = 'failure'; }],
              ['run_head_sha', (e) => { e.run.head_sha = '0'.repeat(40); }],
              ['run_id_zero', (e) => { e.run.id = 0; }],
              ['run_id_string', (e) => { e.run.id = '1'; }],
              ['run_attempt_zero', (e) => { e.run.run_attempt = 0; }],
              ['run_attempt_string', (e) => { e.run.run_attempt = '1'; }],
              ['run_attempt_mismatch', (e) => { e.run.run_attempt = 2; }],
              ['run_pr_number', (e) => { e.run.pull_requests[0].number += 1; }],
              ['run_pr_association_missing', (e) => { e.run.pull_requests = []; }],
              ['run_pr_head_repo', (e) => { e.run.pull_requests[0].head.repo.full_name = 'attacker/clone'; }],
              ['run_pr_base_sha', (e) => { e.run.pull_requests[0].base.sha = '0'.repeat(40); }],
              ['run_pr_base_ref', (e) => { e.run.pull_requests[0].base.ref = 'untrusted-base'; }],
              ['run_pr_base_repo_id', (e) => { e.run.pull_requests[0].base.repo.id += 1; }],
              ['run_pr_base_repo_name', (e) => { e.run.pull_requests[0].base.repo.full_name = 'attacker/clone'; }],
              ['pr_head_ref', (e) => { e.pr.head.ref = 'untrusted-branch'; }],
              ['pr_head_sha', (e) => { e.pr.head.sha = '0'.repeat(40); }],
              ['pr_head_repo_id', (e) => { e.pr.head.repo.id += 1; }],
              ['pr_snapshot_drift_head', (e) => { e.finalPr.head.sha = '0'.repeat(40); }],
              ['pr_snapshot_drift_base', (e) => { e.finalPr.base.sha = '0'.repeat(40); }],
              ['pr_snapshot_drift_merge', (e) => { e.finalPr.merge_commit_sha = '0'.repeat(40); }],
              ['base_branch_tip_initial_drift', (e) => { e.initialBaseBranchTipSha = '0'.repeat(40); }],
              ['base_branch_tip_final_drift', (e) => { e.finalBaseBranchTipSha = '0'.repeat(40); }],
              ['pr_base_ref', (e) => { e.pr.base.ref = 'untrusted-base'; }],
              ['pr_base_sha', (e) => { e.pr.base.sha = '0'.repeat(40); }],
              ['pr_base_repo_id', (e) => { e.pr.base.repo.id += 1; }],
              ['pr_base_repo_name', (e) => { e.pr.base.repo.full_name = 'attacker/clone'; }],
              ['parent_sha', (e) => { e.parentCommit.parents[0].sha = '0'.repeat(40); }],
              ['merge_base_sha', (e) => { e.compare.merge_base_commit.sha = '0'.repeat(40); }],
              ['changed_file_surface', (e) => { e.compare.files.push({ filename: 'untrusted.txt' }); }],
              ['workflow_blob_sha', (e) => { e.workflowFileSha = '0'.repeat(40); }],
              ['source_blob_sha', (e) => {
                e.sourceBlobShas['crates/core/symthaea-core/src/hdc/syndrome_decoder.rs'] = '0'.repeat(40);
              }],
              ['merge_commit_sha', (e) => { e.pr.merge_commit_sha = '0'.repeat(40); }],
              ['merge_commit_equals_subject', (e) => { e.pr.merge_commit_sha = e.pr.head.sha; e.mergeCommit.sha = e.pr.head.sha; }],
              ['merge_parent_sha', (e) => { e.mergeCommit.parents[0].sha = '0'.repeat(40); }],
              ['merge_observed_commit_sha', (e) => { e.mergeCommit.sha = '0'.repeat(40); }],
              ['merge_source_blob_sha', (e) => {
                e.mergeSourceBlobShas['crates/core/symthaea-core/src/hdc/syndrome_decoder.rs'] = '0'.repeat(40);
              }],
              ['job_step_name', (e) => { e.jobs[0].steps[0].name = 'forged step'; }],
              ['job_step_conclusion', (e) => { e.jobs[0].steps[20].conclusion = 'failure'; }],
              ['extra_job_step', (e) => { e.jobs[0].steps.push({ name: 'unreviewed step', conclusion: 'success' }); }],
              ['artifact_name', (e) => { e.artifacts[0].name = 'decoy'; }],
              ['artifact_id_missing', (e) => { delete e.artifacts[0].id; }],
              ['artifact_lifetime_equal', (e) => { e.artifacts[0].expires_at = e.artifacts[0].created_at; }],
              ['artifact_lifetime_inverted', (e) => { e.artifacts[0].created_at = '2027-01-01T00:00:00Z'; }],
              ['artifact_created_in_future', (e) => { e.artifacts[0].created_at = '2027-01-01T00:00:00Z'; e.artifacts[0].expires_at = '2028-01-01T00:00:00Z'; }],
              ['artifact_expired_by_timestamp', (e) => { e.artifacts[0].expires_at = '2026-01-01T00:00:00Z'; }],
              ['artifact_created_at_malformed', (e) => { e.artifacts[0].created_at = 'not-a-timestamp'; }],
              ['artifact_expires_at_malformed', (e) => { e.artifacts[0].expires_at = 'not-a-timestamp'; }],
              ['artifact_digest_nonhex', (e) => { e.artifacts[0].digest = 'sha256:' + 'g'.repeat(64); }],
              ['artifact_expired', (e) => { e.artifacts[0].expired = true; }],
              ['artifact_head_sha', (e) => { e.artifacts[0].workflow_run.head_sha = '0'.repeat(40); }],
              ['artifact_digest', (e) => { e.artifacts[0].digest = ''; }],
              ['artifact_repository_id', (e) => { e.artifacts[0].workflow_run.repository_id += 1; }],
              ['final_artifact_deleted', (e) => { e.finalArtifacts = []; }],
              ['final_artifact_expired', (e) => { e.finalArtifacts[0].expired = true; }],
              ['final_artifact_digest', (e) => { e.finalArtifacts[0].digest = ''; }],
              ['artifact_extra_decoy', (e) => {
                e.artifacts.push({
                  id: 2,
                  name: 'decoy',
                  expired: false,
                  created_at: '2026-01-01T00:00:00Z',
                  expires_at: '2027-01-01T00:00:00Z',
                  size_in_bytes: 1,
                  digest: 'sha256:' + 'b'.repeat(64),
                  workflow_run: {
                    id: e.run.id,
                    repository_id: expected.repositoryId,
                    head_repository_id: expected.repositoryId,
                    head_sha: expected.subject,
                  },
                });
              }],
            ];

            const requiredStepSurfaceValid =
              requiredSteps.length === 36 &&
              new Set(requiredSteps).size === requiredSteps.length &&
              requiredSteps.every((name) => typeof name === 'string' && name.length > 0);
            const adversarialCorpusShapeValid =
              attackCases.length === 63 &&
              new Set(attackCases.map(([name]) => name)).size === attackCases.length &&
              attackCases.every(
                ([name, mutate]) =>
                  typeof name === 'string' &&
                  name.length > 0 &&
                  typeof mutate === 'function'
              );

            const syntheticBaseline = evaluate(syntheticEvidence());
            const syntheticBaselinePassed =
              syntheticBaseline.qualificationResult === 'PASS';

            const staleAssociationEvidence = syntheticEvidence();
            staleAssociationEvidence.run.pull_requests[0].head.sha = '0'.repeat(40);
            staleAssociationEvidence.run.pull_requests[0].head.repo.id = expected.repositoryId + 1;
            staleAssociationEvidence.run.pull_requests[0].head.repo.full_name = 'attacker/clone';
            staleAssociationEvidence.run.pull_requests[0].base.sha = '1'.repeat(40);
            staleAssociationEvidence.run.pull_requests[0].base.ref = 'stale-base';
            staleAssociationEvidence.run.pull_requests[0].base.repo.id = expected.repositoryId + 1;
            staleAssociationEvidence.run.pull_requests[0].base.repo.full_name = 'attacker/clone';
            const staleAssociationEvaluation = evaluate(staleAssociationEvidence);
            const staleAssociationViewPassed =
              staleAssociationEvaluation.qualificationResult === 'PASS';

            const syntheticGovernanceVerified = {
              observation_identity_sha256: 'g'.repeat(64),
              default_branch: 'main',
              verified: true,
              verification_basis: 'synthetic_test',
              ruleset_count: 1,
              branch_protection_accessible: true,
              required_status_context: STATUS_CONTEXT,
            };
            const syntheticLease = buildPromotionEligibilityLease({
              evaluation: syntheticBaseline,
