            const adversarialResults = [];
            for (const [name, mutate] of attackCases) {
              const mutated = JSON.parse(JSON.stringify(syntheticEvidence()));
              mutate(mutated);
              const observed = evaluate(mutated).qualificationResult;
              adversarialResults.push({
                mutation: name,
                expected: 'NOT_PASS',
                observed,
                passed: observed === 'NOT_PASS',
              });
            }

            const adversarialCorpusPassed =
              requiredStepSurfaceValid &&
              adversarialCorpusShapeValid &&
              syntheticBaselinePassed &&
              adversarialResults.length === attackCases.length &&
              adversarialResults.every((result) => result.passed) &&
              syntheticLeasePassed &&
              governanceLeaseInvalidationPassed;

            const runId = context.payload.workflow_run?.id;
            if (!Number.isInteger(runId) || runId <= 0) {
              throw new Error('workflow_run.id is missing or invalid');
            }
            const triggerRunAttempt = context.payload.workflow_run?.run_attempt;
            if (!Number.isInteger(triggerRunAttempt) || triggerRunAttempt <= 0) {
              throw new Error('workflow_run.run_attempt is missing or invalid');
            }

            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })).data;

            const verifierWorkflowFile = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: TRUSTED_VERIFIER_WORKFLOW_PATH,
              ref: context.sha,
            });
            if (Array.isArray(verifierWorkflowFile.data)) {
              throw new Error('trusted verifier workflow path resolved to a directory');
            }
            const verifierWorkflowBlobSha = String(verifierWorkflowFile.data.sha ?? '');
            if (!/^[0-9a-f]{40}$/.test(verifierWorkflowBlobSha)) {
              throw new Error('trusted verifier workflow blob SHA is not canonical');
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              }
            );

            const pr = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: expected.pr,
            })).data;

            const mergeCommit = pr.merge_commit_sha
              ? (await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.merge_commit_sha,
                })).data
              : null;

            const parentCommit = (await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: expected.subject,
            })).data;

            const compare = (await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: expected.parent + '...' + expected.subject,
            })).data;

            const changedFiles = (compare.files ?? [])
              .map((file) => file.filename)
              .sort();

            const workflowFile = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: expected.workflowPath,
              ref: context.sha,
            });
            if (Array.isArray(workflowFile.data)) {
              throw new Error('qualification workflow path resolved to a directory');
            }

            const sourceBlobShas = {};
            for (const file of expectedFiles) {
              const content = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: file,
                ref: expected.subject,
              });
              if (Array.isArray(content.data)) {
                throw new Error('expected source path resolved to a directory: ' + file);
              }
              sourceBlobShas[file] = content.data.sha;
            }

            const mergeSourceBlobShas = {};
            if (mergeCommit) {
              for (const file of expectedFiles) {
                const content = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: file,
                  ref: mergeCommit.sha,
                });
                if (Array.isArray(content.data)) {
                  throw new Error('expected merged source path resolved to a directory: ' + file);
                }
                mergeSourceBlobShas[file] = content.data.sha;
              }
            }

            const policyIdentity = admissionPolicyIdentity(expected, expectedFiles, requiredSteps);

            const repositoryMetadata = (await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })).data;
            if (repositoryMetadata.default_branch !== 'main') {
              throw new Error(
                'independent verifier requires the repository default branch to remain main'
              );
            }

            const liveMainRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data;
            const initialMainSha = String(liveMainRef.object?.sha ?? '');
            if (!/^[0-9a-f]{40}$/.test(initialMainSha)) {
