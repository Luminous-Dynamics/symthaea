                attempt: run.run_attempt,
                conclusion: run.conclusion,
                event: run.event,
                workflow_id: run.workflow_id,
                workflow_name: run.name,
                workflow_path: run.path,
                head_sha: run.head_sha,
                head_branch: run.head_branch,
              },
              comparison: {
                status: liveEvidence.compare.status,
                ahead_by: liveEvidence.compare.ahead_by,
                behind_by: liveEvidence.compare.behind_by,
                merge_base_sha: liveEvidence.compare.merge_base_commit?.sha ?? null,
                changed_files: liveEvaluation.changedFiles,
                expected_files: expectedFiles,
              },
              workflow_definition: {
                observed_blob_sha: liveEvidence.workflowFileSha,
                expected_blob_sha: expected.workflowBlobSha,
              },
              source_identity: {
                observed_blob_shas: liveEvidence.sourceBlobShas,
                expected_blob_shas: expectedSourceBlobShas,
              },
              merge_snapshot: {
                pr_merge_commit_sha: pr.merge_commit_sha ?? null,
                observed_merge_commit_sha: liveEvidence.mergeCommit?.sha ?? null,
                merge_commit_sha_is_current: true,
                observed_source_blob_shas: liveEvidence.mergeSourceBlobShas,
                expected_source_blob_shas: expectedSourceBlobShas,
              },
              jobs: {
                count: liveEvidence.jobs.length,
                name: liveEvidence.jobs[0]?.name ?? null,
                exact_step_surface: liveEvaluation.checks.exact_step_surface,
                required_steps_succeeded: liveEvaluation.checks.required_steps_succeeded,
                step_conclusions: liveEvaluation.stepConclusions,
              },
              artifact: liveEvaluation.artifact,
              artifact_reconciliation: {
                initial_artifact_id: liveEvaluation.artifact?.id ?? null,
                final_artifact_id: liveEvaluation.finalArtifact?.id ?? null,
                initial_digest: liveEvaluation.artifact?.digest ?? null,
                final_digest: liveEvaluation.finalArtifact?.digest ?? null,
                stable: liveEvaluation.checks.artifact_snapshot_stable,
              },
              artifact_lifecycle: {
                artifact_id: liveEvaluation.artifact?.id ?? null,
                created_at: liveEvaluation.artifact?.created_at ?? null,
                expires_at: liveEvaluation.artifact?.expires_at ?? null,
                lifetime_ordered:
                  liveEvaluation.artifact == null
                    ? false
                    : artifactLifecycleVerified(liveEvaluation.artifact),
                provider_expired:
                  liveEvaluation.artifact?.expired ?? null,
              },
              live_checks: liveEvaluation.checks,
              governance_observation: governanceObservation,
              independent_admission_policy: {
                schema_version: 'hdc-bounded-decoder-admission-policy-v1',
                identity_sha256: policyIdentity,
              },
              trusted_verifier_root: {
                workflow_path: TRUSTED_VERIFIER_WORKFLOW_PATH,
                workflow_blob_sha: verifierWorkflowBlobSha,
                commit_sha: context.sha,
              },
              promotion_eligibility_lease: promotionLease,
            };

            const outputPath = path.join(
              process.env.RUNNER_TEMP,
              'HDC_LINEAR_CODE_BOUNDED_DECODER_INDEPENDENT_RUN_RECEIPT_V10.json'
            );

            const publicationMainRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/' + repositoryMetadata.default_branch,
            })).data;
            const publicationMainSha = String(publicationMainRef.object?.sha ?? '');
            const publicationPr = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: expected.pr,
            })).data;
            const publicationBaseRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/' + expected.baseBranch,
            })).data;
            const publicationBaseSha = String(publicationBaseRef.object?.sha ?? '');
            const publicationGovernanceResponse = await github.request('GET /repos/{owner}/{repo}/rulesets', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const publicationRulesets = Array.isArray(publicationGovernanceResponse.data)
              ? publicationGovernanceResponse.data
              : [];
            const publicationBranchSummaryResponse = await github.request(
              'GET /repos/{owner}/{repo}/branches/{branch}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: repositoryMetadata.default_branch,
              }
            );
            const publicationBranchSummary = {
              protected: publicationBranchSummaryResponse.data?.protected === true,
              protection: publicationBranchSummaryResponse.data?.protection ?? null,
            };
            let publicationBranchProtection;
            try {
              const response = await github.request(
                'GET /repos/{owner}/{repo}/branches/{branch}/protection',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: repositoryMetadata.default_branch,
                }
              );
              publicationBranchProtection = {
                accessible: true,
                http_status: response.status,
                required_status_checks: response.data?.required_status_checks ?? null,
              };
            } catch (error) {
              publicationBranchProtection = {
                accessible: false,
                http_status: Number(error.status ?? 0) || null,
                required_status_checks: null,
              };
            }
            const publicationGovernanceObserved = {
              schema_version: 'governance-authority-observation-v1',
              default_branch: repositoryMetadata.default_branch,
              branch_summary: publicationBranchSummary,
              rulesets: publicationRulesets.map((rule) => ({
                id: rule.id ?? null,
                name: rule.name ?? null,
                target: rule.target ?? null,
                enforcement: rule.enforcement ?? null,
              })),
              branch_protection: publicationBranchProtection,
            };
            const publicationGovernanceIdentitySha256 = sha256Canonical(publicationGovernanceObserved);
            const publicationRun = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            })).data;
            const publicationArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              }
            );
            const publicationExpectedArtifactName =
              'hdc-linear-code-bounded-decoder-' +
              expected.subject +
              '-run-' +
              run.id +
              '-attempt-' +
              run.run_attempt;
            const publicationArtifactMatches = publicationArtifacts.filter(
              (candidate) => candidate.name === publicationExpectedArtifactName
            );
            const publicationArtifact = publicationArtifactMatches[0] ?? null;
            const publicationArtifactStable =
              publicationArtifacts.length === 1 &&
              publicationArtifactMatches.length === 1 &&
              artifactLifecycleVerified(publicationArtifact) &&
              publicationArtifact.expired === false &&
              publicationArtifact.size_in_bytes > 0 &&
              publicationArtifact.workflow_run?.id === run.id &&
              publicationArtifact.workflow_run?.repository_id === expected.repositoryId &&
              publicationArtifact.workflow_run?.head_repository_id === expected.repositoryId &&
              publicationArtifact.workflow_run?.head_sha === expected.subject &&
              typeof publicationArtifact.digest === 'string' &&
              /^sha256:[0-9a-f]{64}$/.test(publicationArtifact.digest) &&
              publicationArtifact.id === liveEvaluation.finalArtifact?.id &&
              publicationArtifact.digest === liveEvaluation.finalArtifact?.digest &&
              publicationArtifact.created_at === liveEvaluation.finalArtifact?.created_at &&
              publicationArtifact.expires_at === liveEvaluation.finalArtifact?.expires_at;

            const publicationRunStable =
              publicationRun.id === run.id &&
              publicationRun.run_attempt === run.run_attempt &&
              publicationRun.conclusion === run.conclusion &&
              publicationRun.head_sha === run.head_sha &&
              publicationRun.head_branch === run.head_branch;

            const publicationFencePassed =
              publicationMainSha === liveEvidence.finalMainSha &&
              publicationPr.head?.sha === liveEvidence.finalPr.head?.sha &&
              publicationPr.base?.sha === liveEvidence.finalPr.base?.sha &&
              publicationPr.merge_commit_sha === liveEvidence.finalPr.merge_commit_sha &&
              publicationBaseSha === liveEvidence.finalBaseBranchTipSha &&
              publicationGovernanceIdentitySha256 === governanceIdentitySha256 &&
              publicationRunStable &&
              publicationArtifactStable;

            const finalLeaseObservedAt = new Date().toISOString();
            promotionLease.observed_at = finalLeaseObservedAt;
            promotionLease.reconciliation.observed_at = finalLeaseObservedAt;
            promotionLease.reconciliation.publication_fence = {
              passed: publicationFencePassed,
              main_tip_sha: publicationMainSha,
              base_tip_sha: publicationBaseSha,
              governance_identity_sha256: publicationGovernanceIdentitySha256,
              run_id: publicationRun.id,
              run_attempt: publicationRun.run_attempt,
              run_stable: publicationRunStable,
              artifact_id: publicationArtifact?.id ?? null,
              artifact_digest: publicationArtifact?.digest ?? null,
              artifact_lifecycle_stable: publicationArtifactStable,
            };
            if (!publicationFencePassed) {
              if (!promotionLease.invalidation_reasons.includes('publication_fence_failed')) {
                promotionLease.invalidation_reasons.push('publication_fence_failed');
              }
              promotionLease.lease_state = 'NOT_ELIGIBLE';
            }
            promotionLease.lease_id_sha256 = sha256Canonical({
              ...promotionLease,
              lease_id_sha256: undefined,
            });
            delete promotionLease.lease_id_sha256;

            const leaseBodyForHash = JSON.parse(JSON.stringify(promotionLease));
            promotionLease.lease_id_sha256 = sha256Canonical(leaseBodyForHash);

            receipt.promotion_eligibility_lease = promotionLease;

            fs.writeFileSync(outputPath, JSON.stringify(receipt, null, 2) + '\n');
            core.info('Promotion lease: ' + promotionLease.lease_state + ' [' + promotionLease.lease_id_sha256 + ']');
            core.info('Independent verifier adversarial corpus: ' + (adversarialCorpusPassed ? 'PASS' : 'NOT_PASS'));
            core.info('Independent qualification result: ' + receipt.qualification_result);

            const promotable =
              receipt.qualification_result === 'PASS' &&
              promotionLease.lease_state === 'ELIGIBLE' &&
              publicationFencePassed;

            core.setOutput('qualification_result', receipt.qualification_result);
            core.setOutput('lease_state', promotionLease.lease_state);
            core.setOutput('lease_id', promotionLease.lease_id_sha256);
            core.setOutput('publication_fence_passed', String(publicationFencePassed));
            core.setOutput('promotable', String(promotable));
            core.setOutput('final_main_sha', publicationMainSha);
            core.setOutput('final_base_sha', publicationBaseSha);
            core.setOutput('final_pr_head_sha', publicationPr.head?.sha ?? '');
            core.setOutput('final_pr_base_sha', publicationPr.base?.sha ?? '');
            core.setOutput('final_pr_merge_sha', publicationPr.merge_commit_sha ?? '');
            core.setOutput('run_id', String(publicationRun.id));
            core.setOutput('run_attempt', String(publicationRun.run_attempt));
            core.setOutput('artifact_id', String(publicationArtifact?.id ?? ''));
            core.setOutput('artifact_digest', publicationArtifact?.digest ?? '');
            core.setOutput('artifact_created_at', publicationArtifact?.created_at ?? '');
            core.setOutput('artifact_expires_at', publicationArtifact?.expires_at ?? '');
            core.setOutput('governance_identity_sha256', publicationGovernanceIdentitySha256);

            if (receipt.qualification_result !== 'PASS') {
              core.setFailed('Independent verifier refused to qualify the triggering run');
            }
      - name: Upload independent qualification receipt
        id: upload_receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hdc-linear-code-bounded-decoder-independent-run-receipt
          path: ${{ runner.temp }}/HDC_LINEAR_CODE_BOUNDED_DECODER_INDEPENDENT_RUN_RECEIPT_V10.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish decision-time qualification status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned
        env:
          EXPECTED_SUBJECT: "433ca9c92b16bfac824225950e32692e8e151238"
          STATUS_CONTEXT: "HDC / Independent Qualification"
          VERIFIER_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_receipt.outcome }}
          PROMOTABLE: ${{ steps.verify.outputs.promotable }}
          LEASE_ID: ${{ steps.verify.outputs.lease_id }}
          EXPECTED_MAIN_SHA: ${{ steps.verify.outputs.final_main_sha }}
          EXPECTED_BASE_SHA: ${{ steps.verify.outputs.final_base_sha }}
          EXPECTED_PR_HEAD_SHA: ${{ steps.verify.outputs.final_pr_head_sha }}
          EXPECTED_PR_BASE_SHA: ${{ steps.verify.outputs.final_pr_base_sha }}
          EXPECTED_PR_MERGE_SHA: ${{ steps.verify.outputs.final_pr_merge_sha }}
          EXPECTED_RUN_ID: ${{ steps.verify.outputs.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.verify.outputs.run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ steps.verify.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.verify.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_CREATED_AT: ${{ steps.verify.outputs.artifact_created_at }}
          EXPECTED_ARTIFACT_EXPIRES_AT: ${{ steps.verify.outputs.artifact_expires_at }}
          EXPECTED_GOVERNANCE_IDENTITY_SHA256: ${{ steps.verify.outputs.governance_identity_sha256 }}
        with:
          script: |
            const crypto = require('crypto');
            const uploadSucceeded = process.env.UPLOAD_OUTCOME === 'success';
            const verifierSucceeded = process.env.VERIFIER_OUTCOME === 'success';

            function canonicalize(value) {
              if (Array.isArray(value)) return value.map(canonicalize);
              if (value && typeof value === 'object') {
                return Object.fromEntries(
                  Object.keys(value).sort().map((key) => [key, canonicalize(value[key])])
                );
              }
              return value;
            }

            function governanceIdentity(value) {
              return crypto
                .createHash('sha256')
                .update('promotion-eligibility-lease-v1\\u0000' + JSON.stringify(canonicalize(value)))
                .digest('hex');
            }

            const verifierSucceeded = process.env.VERIFIER_OUTCOME === 'success';
            let receiptArtifactAvailable = false;
            let receiptArtifact = null;

            if (uploadSucceeded) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId,
                  per_page: 100,
                }
              );
              const matches = artifacts.filter(
                (artifact) =>
                  artifact.name === 'hdc-linear-code-bounded-decoder-independent-run-receipt'
              );
              receiptArtifact = matches[0] ?? null;
              receiptArtifactAvailable =
                matches.length === 1 &&
                receiptArtifact !== null &&
                receiptArtifact.expired === false &&
                Number.isSafeInteger(receiptArtifact.id) &&
                receiptArtifact.id > 0 &&
                Number.isSafeInteger(receiptArtifact.size_in_bytes) &&
                receiptArtifact.size_in_bytes > 0;
            }

            const mainRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data;
            const currentMainSha = String(mainRef.object?.sha ?? '');

            const currentPr = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 6803,
            })).data;

            const currentBaseRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/research/hdc-linear-code-recovery-design-v1',
            })).data;
            const currentBaseSha = String(currentBaseRef.object?.sha ?? '');

            const currentRun = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.EXPECTED_RUN_ID),
            })).data;

            const currentArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(process.env.EXPECTED_RUN_ID),
                per_page: 100,
              }
            );
            const currentProducerArtifactMatches = currentArtifacts.filter(
              (artifact) => Number(artifact.id) === Number(process.env.EXPECTED_ARTIFACT_ID)
            );
            const currentProducerArtifact = currentProducerArtifactMatches[0] ?? null;

            const currentRulesetsResponse = await github.request('GET /repos/{owner}/{repo}/rulesets', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const currentBranchSummaryResponse = await github.request(
              'GET /repos/{owner}/{repo}/branches/{branch}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              }
            );
            let currentBranchProtection;
            try {
              const response = await github.request(
                'GET /repos/{owner}/{repo}/branches/{branch}/protection',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: 'main',
                }
              );
              currentBranchProtection = {
                accessible: true,
                http_status: response.status,
                required_status_checks: response.data?.required_status_checks ?? null,
              };
            } catch (error) {
              currentBranchProtection = {
                accessible: false,
                http_status: Number(error.status ?? 0) || null,
                required_status_checks: null,
              };
            }
            const currentGovernanceObserved = {
              schema_version: 'governance-authority-observation-v1',
              default_branch: 'main',
              branch_summary: {
                protected: currentBranchSummaryResponse.data?.protected === true,
                protection: currentBranchSummaryResponse.data?.protection ?? null,
              },
              rulesets: (Array.isArray(currentRulesetsResponse.data) ? currentRulesetsResponse.data : [])
                .map((rule) => ({
                  id: rule.id ?? null,
                  name: rule.name ?? null,
                  target: rule.target ?? null,
                  enforcement: rule.enforcement ?? null,
                })),
              branch_protection: currentBranchProtection,
            };
            const currentGovernanceIdentitySha256 = governanceIdentity(currentGovernanceObserved);

            const finalLeaseFenceStable =
              currentMainSha === process.env.EXPECTED_MAIN_SHA &&
              currentBaseSha === process.env.EXPECTED_BASE_SHA &&
              currentPr.head?.sha === process.env.EXPECTED_PR_HEAD_SHA &&
              currentPr.base?.sha === process.env.EXPECTED_PR_BASE_SHA &&
              currentPr.merge_commit_sha === process.env.EXPECTED_PR_MERGE_SHA &&
              currentRun.id === Number(process.env.EXPECTED_RUN_ID) &&
              currentRun.run_attempt === Number(process.env.EXPECTED_RUN_ATTEMPT) &&
              currentRun.head_sha === process.env.EXPECTED_PR_HEAD_SHA &&
              currentProducerArtifact?.id === Number(process.env.EXPECTED_ARTIFACT_ID) &&
              currentProducerArtifact?.digest === process.env.EXPECTED_ARTIFACT_DIGEST &&
              currentProducerArtifact?.created_at === process.env.EXPECTED_ARTIFACT_CREATED_AT &&
              currentProducerArtifact?.expires_at === process.env.EXPECTED_ARTIFACT_EXPIRES_AT &&
              artifactLifecycleVerified(currentProducerArtifact) &&
              currentProducerArtifact.expired === false &&
              currentGovernanceIdentitySha256 === process.env.EXPECTED_GOVERNANCE_IDENTITY_SHA256;

            const success =
              verifierSucceeded &&
              uploadSucceeded &&
              receiptArtifactAvailable &&
              process.env.PROMOTABLE === 'true' &&
              finalLeaseFenceStable;
            const state = success ? 'success' : 'pending';
            const description = success
              ? 'Qualification and decision-time promotion lease verified.'
              : 'Qualification evidence is not currently promotion-eligible; evidence publication or currentness fence is not satisfied.';
            const targetUrl =
              context.serverUrl +
              '/' +
              context.repo.owner +
              '/' +
              context.repo.repo +
              '/actions/runs/' +
              context.runId;

            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXPECTED_SUBJECT,
              state,
              target_url: targetUrl,
              description,
              context: process.env.STATUS_CONTEXT,
            });

            core.info(
              'Published decision-time status: ' +
                state +
                ' lease=' +
                (process.env.LEASE_ID || 'unavailable') +
                ' receipt_artifact=' +
                (receiptArtifact?.id ?? 'unavailable')
            );
