                baseline_result: syntheticBaseline.qualificationResult,
                baseline_passed: syntheticBaselinePassed,
                passed: adversarialCorpusPassed,
                lease_baseline_passed: syntheticLeasePassed,
                governance_invalidation_lease_passed: governanceLeaseInvalidationPassed,
                cases: adversarialResults,
              },
              subject: {
                pr_number: expected.pr,
                head_sha: expected.subject,
