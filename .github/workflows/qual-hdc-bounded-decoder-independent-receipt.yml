                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              }
            );

            const finalMainRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data;
            const finalMainSha = String(finalMainRef.object?.sha ?? '');
            if (!/^[0-9a-f]{40}$/.test(finalMainSha)) {
              throw new Error(
                'final live default-branch ref did not resolve to a canonical commit SHA'
              );
            }

            const baseBranchRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/' + expected.baseBranch,
            })).data;
            const initialBaseBranchTipSha = String(baseBranchRef.object?.sha ?? '');
            if (!/^[0-9a-f]{40}$/.test(initialBaseBranchTipSha)) {
              throw new Error('initial base-branch ref did not resolve to a canonical commit SHA');
            }

            const finalPr = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: expected.pr,
            })).data;

            const finalBaseBranchRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/' + expected.baseBranch,
            })).data;
            const finalBaseBranchTipSha = String(finalBaseBranchRef.object?.sha ?? '');
            if (!/^[0-9a-f]{40}$/.test(finalBaseBranchTipSha)) {
              throw new Error('final base-branch ref did not resolve to a canonical commit SHA');
            }

            const finalArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              }
            );

            const rulesetsResponse = await github.request('GET /repos/{owner}/{repo}/rulesets', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const rulesets = Array.isArray(rulesetsResponse.data) ? rulesetsResponse.data : [];

            const branchSummaryResponse = await github.request(
              'GET /repos/{owner}/{repo}/branches/{branch}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: repositoryMetadata.default_branch,
              }
            );
            const branchSummary = {
              protected: branchSummaryResponse.data?.protected === true,
              protection: branchSummaryResponse.data?.protection ?? null,
            };

            let branchProtection;
            try {
              const response = await github.request(
                'GET /repos/{owner}/{repo}/branches/{branch}/protection',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: repositoryMetadata.default_branch,
                }
              );
              branchProtection = {
                accessible: true,
                http_status: response.status,
                required_status_checks: response.data?.required_status_checks ?? null,
              };
            } catch (error) {
              branchProtection = {
                accessible: false,
                http_status: Number(error.status ?? 0) || null,
                required_status_checks: null,
