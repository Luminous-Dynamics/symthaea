              sourceBlobShas,
              artifacts,
              finalArtifacts,
              verifierWorkflowBlobSha,
              policyIdentity,
              governanceObservation,
            };

            const liveEvaluation = evaluate(liveEvidence);
            const leaseObservedAt = new Date().toISOString();
            const promotionLease = buildPromotionEligibilityLease({
              evaluation: liveEvaluation,
              evidence: liveEvidence,
