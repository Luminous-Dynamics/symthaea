              governanceObservation: syntheticGovernanceVerified,
              verifierWorkflowBlobSha: 'd'.repeat(40),
              policyIdentity: 'p'.repeat(64),
              observedAt: '2026-01-01T00:00:00Z',
            });
            const syntheticLeasePassed =
              syntheticLease.lease_state === 'ELIGIBLE' &&
              syntheticLease.invalidation_reasons.length === 0 &&
              /^[0-9a-f]{64}$/.test(syntheticLease.lease_id_sha256);

            const governanceUnverifiedLease = buildPromotionEligibilityLease({
              evaluation: syntheticBaseline,
              evidence: syntheticEvidence(),
              governanceObservation: {
                ...syntheticGovernanceVerified,
                verified: false,
