                target: rule.target ?? null,
                enforcement: rule.enforcement ?? null,
              })),
              branch_protection: branchProtection,
            };
            const governanceIdentitySha256 = sha256Canonical(governanceObserved);
            const requiredStatusCheckObserved =
              Array.isArray(branchSummary.protection?.required_status_checks?.contexts) &&
              branchSummary.protection.required_status_checks.contexts.includes(STATUS_CONTEXT);
            const governanceObservation = {
              observation_identity_sha256: governanceIdentitySha256,
              default_branch: repositoryMetadata.default_branch,
              verified: branchSummary.protected && requiredStatusCheckObserved,
              verification_basis:
                branchSummary.protected && requiredStatusCheckObserved
                  ? 'protected_branch_required_status_context'
                  : branchSummary.protected
                    ? 'required_status_context_not_observed'
                    : 'default_branch_unprotected',
              protected: branchSummary.protected,
              ruleset_count: rulesets.length,
              branch_protection_accessible: branchProtection.accessible,
              required_status_context: STATUS_CONTEXT,
            };

            const liveEvidence = {
              contextRef: context.ref,
              contextSha: context.sha,
              currentMainSha: initialMainSha,
              finalMainSha,
              contextRepository: context.repo.owner + '/' + context.repo.repo,
              triggerRunAttempt,
              initialBaseBranchTipSha,
              finalBaseBranchTipSha,
              run,
              jobs,
              pr,
              finalPr,
              parentCommit,
              mergeCommit,
              mergeSourceBlobShas,
              compare: {
                status: compare.status,
                ahead_by: compare.ahead_by,
