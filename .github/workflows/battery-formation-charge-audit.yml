name: Battery formation-charge factorial audit v0.1

on:
  pull_request:
    paths:
      - "docs/transport/BATTERY_FORMATION_CHARGE_CODESIGN_V0_1.md"
      - "schemas/transport/battery_formation_charge_codesign_v0_1.schema.json"
      - "fixtures/ev_battery/battery_formation_charge_codesign_v0_1.json"
      - "tools/battery-formation-charge-audit/**"
      - ".github/workflows/battery-formation-charge-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check JSON syntax
        run: |
          python3 -c 'import json; json.load(open("schemas/transport/battery_formation_charge_codesign_v0_1.schema.json", encoding="utf-8")); json.load(open("fixtures/ev_battery/battery_formation_charge_codesign_v0_1.json", encoding="utf-8"))'
      - name: Check locked package metadata
        run: cargo metadata --manifest-path tools/battery-formation-charge-audit/Cargo.toml --locked --no-deps
      - name: Check formatting
        run: cargo fmt --manifest-path tools/battery-formation-charge-audit/Cargo.toml -- --check
      - name: Run factorial and evidence tests
        run: cargo test --manifest-path tools/battery-formation-charge-audit/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/battery-formation-charge-audit/Cargo.toml --all-targets --locked -- -D warnings
