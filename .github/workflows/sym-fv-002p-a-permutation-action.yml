name: SYM-FV-002P-A Permutation Action

on:
  pull_request:
    paths:
      - "formal/lean/hdc/BinaryHVBind.lean"
      - "formal/lean/hdc/PermutationAction.lean"
      - "docs/formal/sym-fv-002p-a-permutation-action-v1.json"
      - "scripts/validate_sym_fv_002p_a.py"
      - "crates/core/symthaea-core/src/hdc/binary_hv.rs"
      - "crates/core/symthaea-hdc-crypto/src/binary_hv.rs"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/sym-fv-002p-a-permutation-action.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sym-fv-002p-a-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  permutation-action:
    name: Lean generic BinaryHV permutation action
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact immutable subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head and repaired parent ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git merge-base a4d4506c57902f96b6c260e7e9c56f9fc2e654c3 HEAD)" = "a4d4506c57902f96b6c260e7e9c56f9fc2e654c3"
          test "$(git rev-parse HEAD:formal/lean/hdc/BinaryHVBind.lean)" = "259ba64888d8492bafc123b72d67b70da9282c36"
          git status --porcelain=v1 --untracked-files=all

      - name: Static contract and hostile controls
        run: python3 scripts/validate_sym_fv_002p_a.py

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Prove wrapper propagates Lean failure
        run: |
          set -euo pipefail
          cat >/tmp/sym-fv-002p-a-known-bad.lean <<'LEAN'
          example : False := by
            trivial
          LEAN
          if nix develop .#formal --command sh -c 'lean /tmp/sym-fv-002p-a-known-bad.lean > /tmp/sym-fv-002p-a-known-bad-output.txt 2>&1'; then
            cat /tmp/sym-fv-002p-a-known-bad-output.txt
            echo "known-bad Lean subject incorrectly returned success" >&2
            exit 1
          fi
          cat /tmp/sym-fv-002p-a-known-bad-output.txt
          grep -q 'error:' /tmp/sym-fv-002p-a-known-bad-output.txt

      - name: Build exact combined theorem subject
        run: |
          set -euo pipefail
          cat formal/lean/hdc/BinaryHVBind.lean formal/lean/hdc/PermutationAction.lean \
            >/tmp/sym-fv-002p-a-combined.lean
          sha256sum /tmp/sym-fv-002p-a-combined.lean

      - name: Typecheck exact combined theorem fail closed
        run: |
          set -euo pipefail
          nix develop .#formal --command sh -c '
            set -eu
            lean --version > /tmp/sym-fv-002p-a-lean-version.txt
            cat /tmp/sym-fv-002p-a-lean-version.txt
            if ! lean /tmp/sym-fv-002p-a-combined.lean > /tmp/sym-fv-002p-a-lean-output.txt 2>&1; then
              cat /tmp/sym-fv-002p-a-lean-output.txt
              exit 1
            fi
            cat /tmp/sym-fv-002p-a-lean-output.txt
            if grep -q "sorryAx" /tmp/sym-fv-002p-a-lean-output.txt; then
              echo "forbidden sorryAx in Lean axiom census" >&2
              exit 1
            fi
            if grep -q "error:" /tmp/sym-fv-002p-a-lean-output.txt; then
              echo "Lean output contains residual error marker" >&2
              exit 1
            fi
          '

      - name: Postflight immutability and exact receipt
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          parent = "a4d4506c57902f96b6c260e7e9c56f9fc2e654c3"
          inherited = "formal/lean/hdc/BinaryHVBind.lean"
          core = "crates/core/symthaea-core/src/hdc/binary_hv.rs"
          crypto = "crates/core/symthaea-hdc-crypto/src/binary_hv.rs"

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          receipt = {
              "schema": "symthaea.formal.sym-fv-002p-a-qualification-receipt.v1",
              "issue": 5930,
              "cyclic_instantiation_issue": 5937,
              "evidence_class": "AbstractFormalTheorem",
              "result": "LeanTypecheckedAndAxiomClean",
              "head": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "stack_parent": parent,
              "stack_parent_merge_base": git("merge-base", parent, "HEAD"),
              "inherited_theorem_blob": git("rev-parse", f"HEAD:{inherited}"),
              "core_future_target_blob": git("rev-parse", f"HEAD:{core}"),
              "crypto_future_target_blob": git("rev-parse", f"HEAD:{crypto}"),
              "lean_version": Path("/tmp/sym-fv-002p-a-lean-version.txt").read_text().strip(),
              "combined_subject_sha256": sha256("/tmp/sym-fv-002p-a-combined.lean"),
              "child_theorem_sha256": sha256("formal/lean/hdc/PermutationAction.lean"),
              "manifest_sha256": sha256("docs/formal/sym-fv-002p-a-permutation-action-v1.json"),
              "validator_sha256": sha256("scripts/validate_sym_fv_002p_a.py"),
              "lean_output_sha256": sha256("/tmp/sym-fv-002p-a-lean-output.txt"),
              "known_bad_output_sha256": sha256("/tmp/sym-fv-002p-a-known-bad-output.txt"),
              "known_bad_lean_subject_rejected": True,
              "lean_exit_zero": True,
              "sorryAx_absent": True,
              "repository_postflight_clean": True,
              "semantic_layer": "generic-index-permutation-action",
              "nonclaims": [
                  "not-cyclic-offset-instantiation",
                  "not-production-rust-refinement",
                  "not-equivalence-of-production-implementations",
                  "not-hamming-theorem",
                  "not-cryptographic-security",
                  "not-native-binary-proof"
              ]
          }
          if receipt["stack_parent_merge_base"] != parent:
              raise SystemExit("repaired parent ancestry mismatch")
          if receipt["inherited_theorem_blob"] != "259ba64888d8492bafc123b72d67b70da9282c36":
              raise SystemExit("inherited theorem blob mismatch")
          if receipt["core_future_target_blob"] != "22a56cfaedf5b0cb7d8ff8b73c41ed4caf8d7056":
              raise SystemExit("core production target drift")
          if receipt["crypto_future_target_blob"] != "9fe5409c3edfcdc6112a61b125c1b278f9eb0d4a":
              raise SystemExit("crypto production target drift")
          Path("/tmp/sym-fv-002p-a-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Retain proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sym-fv-002p-a-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/sym-fv-002p-a-lean-version.txt
            /tmp/sym-fv-002p-a-lean-output.txt
            /tmp/sym-fv-002p-a-known-bad-output.txt
            /tmp/sym-fv-002p-a-combined.lean
            /tmp/sym-fv-002p-a-receipt.json
          if-no-files-found: error
          retention-days: 30
