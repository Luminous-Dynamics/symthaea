name: Melothaea grounded edit intent plan

on:
  pull_request:
    paths:
      - "tools/mel-music-edit-intent-grounding-harness/**"
      - "benchmarks/mel/schemas/music-edit-intent-plan-v1.schema.json"
      - "benchmarks/mel/schemas/music-source-observation-v1.schema.json"
      - "docs/research/MEL_MR_EVAL_044_INTENT_GROUNDING_V1_2026-11-15.md"
      - ".github/workflows/mel-music-edit-intent-grounding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intent-grounding-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MEL_INTENT_REVISION=$actual" >> "$GITHUB_ENV"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Validate source-observation and intent-plan schemas
        run: |
          python3 -m json.tool benchmarks/mel/schemas/music-source-observation-v1.schema.json >/dev/null
          python3 -m json.tool benchmarks/mel/schemas/music-edit-intent-plan-v1.schema.json >/dev/null

      - name: Stage standalone intent harness outside workspace
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-music-edit-intent-grounding-harness"
          mkdir -p "$staged/src" "$staged/examples"
          cp tools/mel-music-edit-intent-grounding-harness/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-music-edit-intent-grounding-harness/src/lib.rs "$staged/src/lib.rs"
          cp tools/mel-music-edit-intent-grounding-harness/examples/grounded_plan.rs "$staged/examples/grounded_plan.rs"
          echo "MEL_INTENT_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"

      - name: Normalize staged formatting and check
        run: |
          cargo +1.96.0 fmt --manifest-path "$MEL_INTENT_MANIFEST"
          cargo +1.96.0 fmt --check --manifest-path "$MEL_INTENT_MANIFEST"

      - name: Resolve standalone lockfile
        run: cargo +1.96.0 generate-lockfile --manifest-path "$MEL_INTENT_MANIFEST"

      - name: Run grounded intent contract tests
        run: cargo +1.96.0 test --locked --manifest-path "$MEL_INTENT_MANIFEST"

      - name: Run deterministic ready-versus-clarify example
        run: cargo +1.96.0 run --locked --manifest-path "$MEL_INTENT_MANIFEST" --example grounded_plan

      - name: Run strict Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path "$MEL_INTENT_MANIFEST" --all-targets -- -D warnings

      - name: Record exact source and dependency identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mel-intent-evidence"
          mkdir -p "$evidence"
          sha256sum tools/mel-music-edit-intent-grounding-harness/Cargo.toml > "$evidence/manifest.sha256"
          sha256sum tools/mel-music-edit-intent-grounding-harness/src/lib.rs > "$evidence/library.sha256"
          sha256sum tools/mel-music-edit-intent-grounding-harness/examples/grounded_plan.rs > "$evidence/example.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-intent-plan-v1.schema.json > "$evidence/intent-plan-schema.sha256"
          sha256sum benchmarks/mel/schemas/music-source-observation-v1.schema.json > "$evidence/source-observation-schema.sha256"
          cp "$(dirname "$MEL_INTENT_MANIFEST")/Cargo.lock" "$evidence/Cargo.lock"
          sha256sum "$evidence/Cargo.lock" > "$evidence/Cargo.lock.sha256"
          printf 'exact_head=%s\n' "$MEL_INTENT_REVISION" > "$evidence/source-identities.txt"

      - name: Upload EVAL-044 qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: mel-intent-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-intent-evidence/
          if-no-files-found: error
          retention-days: 90
