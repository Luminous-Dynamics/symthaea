name: Falsification Power Reference

on:
  pull_request:
    paths:
      - "research/falsification-power-reference/**"
      - "docs/research/FALSIFICATION_POWER_REFERENCE_V0_2026-11-15.md"
      - ".github/workflows/falsification-power-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falsification-power-reference-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, Clippy and Tests (standalone research crate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/falsification-power-reference/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --locked --manifest-path research/falsification-power-reference/Cargo.toml --all-targets

      - name: Run sequential null and alternative calibration
        run: |
          set -euo pipefail
          manifest="research/falsification-power-reference/Cargo.toml"
          report="$RUNNER_TEMP/sequential-null-calibration.json"
          cargo run --locked --manifest-path "$manifest" --bin sequential_null_calibration > "$report"
          jq -e '
            .schema == "symthaea_sequential_null_calibration_v0" and
            .nominal_alpha == 0.05 and
            .paths_per_scenario == 20000 and
            .maximum_looks == 100 and
            (.scenarios | length) == 3 and
            all(.scenarios[];
              .paths == 20000 and
              .horizon == 100 and
              .e_process_rate >= 0 and .e_process_rate <= 1 and
              .naive_repeated_fixed_time_rate >= 0 and .naive_repeated_fixed_time_rate <= 1 and
              .e_process_wilson95[0] <= .e_process_rate and
              .e_process_rate <= .e_process_wilson95[1] and
              .naive_repeated_fixed_time_wilson95[0] <= .naive_repeated_fixed_time_rate and
              .naive_repeated_fixed_time_rate <= .naive_repeated_fixed_time_wilson95[1]
            ) and
            (.scenarios | map(select(.scenario == "fixed_known_variance_null"))[0].e_process_rate) <= 0.06 and
            (.scenarios | map(select(.scenario == "predictable_adaptive_variance_null"))[0].e_process_rate) <= 0.06 and
            (.scenarios | map(select(.scenario == "predictable_adaptive_variance_null"))[0].naive_repeated_fixed_time_rate) > 0.10
          ' "$report"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$report.source-sha"
          sha256sum "$report" | tee "$report.sha256"
          cat "$report"

      - name: Upload sequential calibration receipt
        uses: actions/upload-artifact@v4
        with:
          name: sequential-falsification-calibration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/sequential-null-calibration.json
            ${{ runner.temp }}/sequential-null-calibration.json.sha256
            ${{ runner.temp }}/sequential-null-calibration.json.source-sha
          if-no-files-found: error
          retention-days: 90

      - name: Run AR(1) conditional-innovation calibration
        run: |
          set -euo pipefail
          manifest="research/falsification-power-reference/Cargo.toml"
          report="$RUNNER_TEMP/conditional-innovation-calibration.json"
          cargo run --locked --manifest-path "$manifest" --bin conditional_innovation_calibration > "$report"
          jq -e '
            (.scenarios | map(select(.scenario == "ar1_predictable_conditional_null"))[0]) as $null
            | (.scenarios | map(select(.scenario == "ar1_predictable_conditional_alternative"))[0]) as $alt
            | (
              .schema == "gaussian_conditional_innovation_calibration_v0" and
              .nominal_alpha == 0.05 and
              .paths_per_scenario == 20000 and
              .maximum_looks == 100 and
              .ar1_rho == 0.65 and
              .sigma == 0.8 and
              .discrepancy == 0.22 and
              (.scenarios | length) == 2 and
              all(.scenarios[];
                .paths == 20000 and
                .horizon == 100 and
                .conditional_innovation_rate >= 0 and
                .conditional_innovation_rate <= 1 and
                .conditional_innovation_wilson95[0] <= .conditional_innovation_rate and
                .conditional_innovation_rate <= .conditional_innovation_wilson95[1] and
                .zero_mean_misspecified_rate >= 0 and
                .zero_mean_misspecified_rate <= 1 and
                .zero_mean_misspecified_wilson95[0] <= .zero_mean_misspecified_rate and
                .zero_mean_misspecified_rate <= .zero_mean_misspecified_wilson95[1]
              ) and
              ($null.conditional_innovation_rate <= 0.06) and
              ($null.zero_mean_misspecified_rate > 0.10) and
              ($alt.conditional_innovation_rate > 0.50)
            )
          ' "$report"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$report.source-sha"
          sha256sum "$report" | tee "$report.sha256"
          cat "$report"

      - name: Upload conditional-innovation calibration receipt
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-conditional-innovation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/conditional-innovation-calibration.json
            ${{ runner.temp }}/conditional-innovation-calibration.json.sha256
            ${{ runner.temp }}/conditional-innovation-calibration.json.source-sha
          if-no-files-found: error
          retention-days: 90

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/falsification-power-reference/Cargo.toml --all-targets -- -D warnings
