name: Falsification Power Reference

on:
  pull_request:
    paths:
      - "research/falsification-power-reference/**"
      - "docs/research/FALSIFICATION_POWER_REFERENCE_V0_2026-11-15.md"
      - ".github/workflows/falsification-power-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falsification-power-reference-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, Clippy and Tests (standalone research crate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/falsification-power-reference/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --locked --manifest-path research/falsification-power-reference/Cargo.toml --all-targets

      - name: Run sequential null and alternative calibration
        run: |
          set -euo pipefail
          manifest="research/falsification-power-reference/Cargo.toml"
          report="$RUNNER_TEMP/sequential-null-calibration.json"
          cargo run --locked --manifest-path "$manifest" --bin sequential_null_calibration > "$report"
          jq -e '
            .schema == "symthaea_sequential_null_calibration_v0" and
            .nominal_alpha == 0.05 and
            .paths_per_scenario == 20000 and
            .maximum_looks == 100 and
            (.scenarios | length) == 3 and
            all(.scenarios[];
              .paths == 20000 and
              .horizon == 100 and
              .e_process_rate >= 0 and .e_process_rate <= 1 and
              .naive_repeated_fixed_time_rate >= 0 and .naive_repeated_fixed_time_rate <= 1 and
              .e_process_wilson95[0] <= .e_process_rate and
              .e_process_rate <= .e_process_wilson95[1] and
              .naive_repeated_fixed_time_wilson95[0] <= .naive_repeated_fixed_time_rate and
              .naive_repeated_fixed_time_rate <= .naive_repeated_fixed_time_wilson95[1]
            ) and
            (.scenarios | map(select(.scenario == "fixed_known_variance_null"))[0].e_process_rate) <= 0.06 and
            (.scenarios | map(select(.scenario == "predictable_adaptive_variance_null"))[0].e_process_rate) <= 0.06 and
            (.scenarios | map(select(.scenario == "predictable_adaptive_variance_null"))[0].naive_repeated_fixed_time_rate) > 0.10
          ' "$report"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$report.source-sha"
          sha256sum "$report" | tee "$report.sha256"
          cat "$report"

      - name: Upload sequential calibration receipt
        uses: actions/upload-artifact@v4
        with:
          name: sequential-falsification-calibration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/sequential-null-calibration.json
            ${{ runner.temp }}/sequential-null-calibration.json.sha256
            ${{ runner.temp }}/sequential-null-calibration.json.source-sha
          if-no-files-found: error
          retention-days: 90

      - name: Run paired Gaussian terminal-test induction calibration
        run: |
          set -euo pipefail
          manifest="research/falsification-power-reference/Cargo.toml"
          report="$RUNNER_TEMP/gaussian-terminal-test-induction-calibration.json"
          cargo run --locked --manifest-path "$manifest" --bin gaussian_terminal_induction_calibration > "$report"
          jq -e '
            (.scenarios | map(select(.scenario == "fixed_gaussian_simple_null"))[0]) as $null
            | (.scenarios | map(select(.scenario == "fixed_gaussian_declared_alternative"))[0]) as $alt
            | (
              .schema == "gaussian_terminal_test_induction_calibration_v1" and
              .nominal_alpha == 0.05 and
              .paths_per_scenario == 20000 and
              .maximum_looks == 80 and
              .induced_stop_thresholds == [0.75, 0.90, 0.99] and
              (.scenarios | length) == 2 and
              all(.scenarios[];
                .paths == 20000 and
                .horizon == 80 and
                .terminal_induced_mismatches == 0 and
                (.induced_stop_policies | length) == 3 and
                .terminal_np_rejection_rate >= 0 and .terminal_np_rejection_rate <= 1 and
                .e_process_crossing_rate >= 0 and .e_process_crossing_rate <= 1 and
                .naive_repeated_fixed_time_rate >= 0 and .naive_repeated_fixed_time_rate <= 1 and
                all(.induced_stop_policies[];
                  .randomized_rejection_rate >= 0 and .randomized_rejection_rate <= 1 and
                  .early_stop_rate >= 0 and .early_stop_rate <= 1
                )
              ) and
              ($null.terminal_np_rejection_rate >= 0.04) and
              ($null.terminal_np_rejection_rate <= 0.06) and
              ($null.e_process_crossing_rate <= 0.06) and
              ($null.naive_repeated_fixed_time_rate > 0.10) and
              all($null.induced_stop_policies[];
                .randomized_rejection_rate >= 0.04 and .randomized_rejection_rate <= 0.06
              ) and
              (($alt.terminal_np_rejection_rate - .analytic_terminal_np_power) | abs) < 0.015 and
              ($alt.induced_stop_policies[0].early_stop_rate >= $alt.induced_stop_policies[1].early_stop_rate) and
              ($alt.induced_stop_policies[1].early_stop_rate >= $alt.induced_stop_policies[2].early_stop_rate)
            )
          ' "$report"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$report.source-sha"
          sha256sum "$report" | tee "$report.sha256"
          cat "$report"

      - name: Upload Gaussian terminal-test induction receipt
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-terminal-test-induction-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/gaussian-terminal-test-induction-calibration.json
            ${{ runner.temp }}/gaussian-terminal-test-induction-calibration.json.sha256
            ${{ runner.temp }}/gaussian-terminal-test-induction-calibration.json.source-sha
          if-no-files-found: error
          retention-days: 90

      - name: Run multi-seed Gaussian terminal-test stability calibration
        run: |
          set -euo pipefail
          manifest="research/falsification-power-reference/Cargo.toml"
          report="$RUNNER_TEMP/gaussian-terminal-test-induction-multiseed.json"
          cargo run --locked --manifest-path "$manifest" --bin gaussian_terminal_multiseed_calibration > "$report"
          jq -e '
            (.scenarios | map(select(.scenario == "fixed_gaussian_simple_null"))[0]) as $null
            | (.scenarios | map(select(.scenario == "fixed_gaussian_declared_alternative"))[0]) as $alt
            | (
              .schema == "gaussian_terminal_test_induction_multiseed_v0" and
              .root_seed_count == 5 and
              (.root_seeds | length) == 5 and
              ((.root_seeds | unique | length) == 5) and
              .paths_per_root_seed == 20000 and
              .paths_per_scenario == 100000 and
              .maximum_looks == 80 and
              .nominal_alpha == 0.05 and
              .induced_stop_thresholds == [0.75, 0.90, 0.99] and
              (.scenarios | length) == 2 and
              all(.scenarios[];
                .paths_per_root_seed == 20000 and
                .paths == 100000 and
                .horizon == 80 and
                (.per_seed | length) == 5 and
                .terminal_induced_mismatches == 0 and
                .terminal_np_rejection_rate >= 0 and
                .terminal_np_rejection_rate <= 1 and
                .terminal_np_wilson95[0] <= .terminal_np_rejection_rate and
                .terminal_np_rejection_rate <= .terminal_np_wilson95[1] and
                (.induced_stop_policies | length) == 3 and
                all(.induced_stop_policies[];
                  .randomized_rejection_rate >= 0 and
                  .randomized_rejection_rate <= 1 and
                  .randomized_rejection_wilson95[0] <= .randomized_rejection_rate and
                  .randomized_rejection_rate <= .randomized_rejection_wilson95[1] and
                  .early_stop_rate >= 0 and .early_stop_rate <= 1 and
                  .mean_stop_look >= 1 and .mean_stop_look <= 80
                ) and
                all(.per_seed[];
                  .paths == 20000 and
                  .terminal_induced_mismatches == 0 and
                  .terminal_np_rejection_rate >= 0 and
                  .terminal_np_rejection_rate <= 1 and
                  .terminal_np_wilson95[0] <= .terminal_np_rejection_rate and
                  .terminal_np_rejection_rate <= .terminal_np_wilson95[1] and
                  (.induced_stop_policies | length) == 3 and
                  all(.induced_stop_policies[];
                    .randomized_rejection_rate >= 0 and
                    .randomized_rejection_rate <= 1 and
                    .randomized_rejection_wilson95[0] <= .randomized_rejection_rate and
                    .randomized_rejection_rate <= .randomized_rejection_wilson95[1] and
                    .early_stop_rate >= 0 and .early_stop_rate <= 1 and
                    .mean_stop_look >= 1 and .mean_stop_look <= 80
                  )
                )
              ) and
              ($null.terminal_np_rejection_rate >= 0.04) and
              ($null.terminal_np_rejection_rate <= 0.06) and
              all($null.induced_stop_policies[];
                .randomized_rejection_rate >= 0.04 and
                .randomized_rejection_rate <= 0.06
              ) and
              all($null.per_seed[];
                .terminal_np_rejection_rate >= 0.03 and
                .terminal_np_rejection_rate <= 0.07 and
                all(.induced_stop_policies[];
                  .randomized_rejection_rate >= 0.03 and
                  .randomized_rejection_rate <= 0.07
                )
              ) and
              (($alt.terminal_np_rejection_rate - .analytic_terminal_np_power) | abs) < 0.007 and
              ($alt.induced_stop_policies[0].early_stop_rate >= $alt.induced_stop_policies[1].early_stop_rate) and
              ($alt.induced_stop_policies[1].early_stop_rate >= $alt.induced_stop_policies[2].early_stop_rate)
            )
          ' "$report"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$report.source-sha"
          sha256sum "$report" | tee "$report.sha256"
          cat "$report"

      - name: Upload multi-seed Gaussian terminal-test stability receipt
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-terminal-test-induction-multiseed-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/gaussian-terminal-test-induction-multiseed.json
            ${{ runner.temp }}/gaussian-terminal-test-induction-multiseed.json.sha256
            ${{ runner.temp }}/gaussian-terminal-test-induction-multiseed.json.source-sha
          if-no-files-found: error
          retention-days: 90

      - name: Run Gaussian observation-model assumption stress campaign
        run: |
          set -euo pipefail
          manifest="research/falsification-power-reference/Cargo.toml"
          report="$RUNNER_TEMP/gaussian-assumption-stress.json"
          cargo run --locked --manifest-path "$manifest" --bin gaussian_assumption_stress > "$report"
          jq -e '
            (.regimes | map(select(.regime == "matched_iid_gaussian"))[0]) as $iid
            | (.regimes | map(select(.regime == "stationary_ar1_rho_0_65"))[0]) as $ar1
            | (
              .schema == "gaussian_assumption_stress_v1" and
              .prng == "SplitMix64_BoxMuller_v1" and
              .root_seed_count == 5 and
              (.root_seeds | length) == 5 and
              ((.root_seeds | unique | length) == 5) and
              .paths_per_seed == 10000 and
              .paths_per_regime_scenario == 50000 and
              .horizon == 80 and
              .nominal_alpha == 0.05 and
              .discrepancy == 0.22 and
              .design_sigma == 0.8 and
              (.regimes | length) == 6 and
              ($iid.assumption_status == "IN_CONTRACT") and
              ($iid.null.paths == 50000) and
              ($iid.alternative.paths == 50000) and
              ($iid.null.rate >= 0.04) and
              ($iid.null.rate <= 0.06) and
              ($iid.null.wilson95[0] <= $iid.null.rate) and
              ($iid.null.rate <= $iid.null.wilson95[1]) and
              (($iid.alternative.rate - .analytic_iid_terminal_power) | abs) < 0.007 and
              ($iid.alternative.wilson95[0] <= .analytic_iid_terminal_power) and
              ($iid.alternative.wilson95[1] >= .analytic_iid_terminal_power) and
              ($ar1.assumption_status == "OUT_OF_CONTRACT") and
              ($ar1.expected_lag_one_correlation == 0.65) and
              ($ar1.pooled_null_lag_one_correlation >= 0.62) and
              ($ar1.pooled_null_lag_one_correlation <= 0.68) and
              (.known_rho_ar1_analytic_conditional_power > 0) and
              ($ar1.conditional_known_rho_ar1.assumption_status == "IN_CONTRACT_KNOWN_RHO_AR1") and
              ($ar1.conditional_known_rho_ar1.rho == 0.65) and
              ($ar1.conditional_known_rho_ar1.null.paths == 50000) and
              ($ar1.conditional_known_rho_ar1.alternative.paths == 50000) and
              ($ar1.conditional_known_rho_ar1.null.rate >= 0.04) and
              ($ar1.conditional_known_rho_ar1.null.rate <= 0.06) and
              (($ar1.conditional_known_rho_ar1.alternative.rate - .known_rho_ar1_analytic_conditional_power) | abs) < 0.007 and
              ($ar1.conditional_known_rho_ar1.alternative.wilson95[0] <= .known_rho_ar1_analytic_conditional_power) and
              ($ar1.conditional_known_rho_ar1.alternative.wilson95[1] >= .known_rho_ar1_analytic_conditional_power) and
              all($ar1.per_seed[];
                .conditional_known_rho_ar1.null.paths == 10000 and
                .conditional_known_rho_ar1.alternative.paths == 10000 and
                .conditional_known_rho_ar1.null.rate >= 0.02 and
                .conditional_known_rho_ar1.null.rate <= 0.08 and
                .conditional_known_rho_ar1.alternative.rate >= 0 and
                .conditional_known_rho_ar1.alternative.rate <= 1
              ) and
              all(.regimes[] | select(.regime != "stationary_ar1_rho_0_65");
                .conditional_known_rho_ar1 == null
              ) and
              all(.regimes[];
                (.assumption_status == "IN_CONTRACT" or .assumption_status == "OUT_OF_CONTRACT") and
                (.pooled_null_mean | fabs) < 0.01 and
                .pooled_null_variance >= 0.50 and
                .pooled_null_variance <= 0.80 and
                .null.paths == 50000 and
                .alternative.paths == 50000 and
                .null.rejections >= 0 and
                .null.rate >= 0 and .null.rate <= 1 and
                .null.wilson95[0] <= .null.rate and
                .null.rate <= .null.wilson95[1] and
                .alternative.rate >= 0 and .alternative.rate <= 1 and
                .alternative.wilson95[0] <= .alternative.rate and
                .alternative.rate <= .alternative.wilson95[1] and
                (.per_seed | length) == 5 and
                all(.per_seed[];
                  .null.paths == 10000 and
                  .alternative.paths == 10000 and
                  .null.rate >= 0 and .null.rate <= 1 and
                  .null.wilson95[0] <= .null.rate and
                  .null.rate <= .null.wilson95[1] and
                  .alternative.rate >= 0 and .alternative.rate <= 1 and
                  .alternative.wilson95[0] <= .alternative.rate and
                  .alternative.rate <= .alternative.wilson95[1] and
                  (.null_variance > 0) and
                  (.null_mean == .null_mean) and
                  (.null_lag_one_correlation >= -1) and
                  (.null_lag_one_correlation <= 1)
                )
              )
            )
          ' "$report"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$report.source-sha"
          sha256sum "$report" | tee "$report.sha256"
          cat "$report"

      - name: Upload Gaussian assumption-stress receipt
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-assumption-stress-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/gaussian-assumption-stress.json
            ${{ runner.temp }}/gaussian-assumption-stress.json.sha256
            ${{ runner.temp }}/gaussian-assumption-stress.json.source-sha
          if-no-files-found: error
          retention-days: 90

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/falsification-power-reference/Cargo.toml --all-targets -- -D warnings
