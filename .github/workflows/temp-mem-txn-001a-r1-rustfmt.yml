name: TEMP MEM-TXN-001A-R1 Rustfmt materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'chore(format): materialize MEM-TXN-001A-R1 rustfmt bytes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatter input
        uses: actions/checkout@v4
        with:
          ref: dbb3620b3e476ab5afec02d6665613c3bc168b11
          fetch-depth: 1

      - name: Verify formatter input
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "dbb3620b3e476ab5afec02d6665613c3bc168b11"

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Expected pre-format Rustfmt RED
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path crates/core/symthaea-communication/Cargo.toml -- --check > /tmp/mem-txn-rustfmt-pre.log 2>&1
          status=$?
          cat /tmp/mem-txn-rustfmt-pre.log
          test "$status" -ne 0

      - name: Materialize Rustfmt output
        run: cargo fmt --manifest-path crates/core/symthaea-communication/Cargo.toml

      - name: Verify post-format Rustfmt PASS
        run: cargo fmt --manifest-path crates/core/symthaea-communication/Cargo.toml -- --check

      - name: Verify exactly two product paths changed
        shell: bash
        run: |
          test "$(git diff --name-only | sort)" = "$(printf '%s\n%s\n'             'crates/core/symthaea-communication/src/memory_mutation_transaction.rs'             'crates/core/symthaea-communication/tests/memory_mutation_transaction.rs' | sort)"

      - name: Record formatted artifact identities
        shell: bash
        run: |
          for path in             crates/core/symthaea-communication/src/memory_mutation_transaction.rs             crates/core/symthaea-communication/tests/memory_mutation_transaction.rs
          do
            echo "PATH=$path"
            echo "BYTES=$(wc -c < "$path")"
            echo "SHA256=$(sha256sum "$path" | cut -d' ' -f1)"
            echo "GIT_BLOB=$(git hash-object "$path")"
          done

      - name: Materialize exact formatted blobs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             crates/core/symthaea-communication/src/memory_mutation_transaction.rs             crates/core/symthaea-communication/tests/memory_mutation_transaction.rs
          git commit -m "chore(format): materialize MEM-TXN-001A-R1 rustfmt bytes"
          git push origin HEAD:temp/mem-txn-001a-r1-rustfmt
