name: QUAL MAT-016A exact subject

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qual-mat-016a-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head MAT-016A authority-firewall qualification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: 12005f8eea32210e58e8ffc79c51fcc16f6036d6
      SOURCE_PARENT: 6fa939a07aa0ea6e2f0dbeb44906363313146315
      PACKAGE: symthaea-materials
    steps:
      - name: Checkout exact semantic subject
        uses: actions/checkout@v4
        with:
          ref: 12005f8eea32210e58e8ffc79c51fcc16f6036d6
          fetch-depth: 2

      - name: Verify exact source identity and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          mapfile -t changed < <(git diff --name-only "$SOURCE_PARENT" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "crates/domains/symthaea-materials/src/authority_firewall.rs"
          test "${changed[1]}" = "crates/domains/symthaea-materials/src/lib.rs"
          echo "semantic_scope=PASS"

      - name: Prove advisory/scientific firewall contract
        shell: bash
        run: |
          set -euo pipefail
          firewall="crates/domains/symthaea-materials/src/authority_firewall.rs"
          grep -Fq 'pub struct AdvisoryMaterialPrediction' "$firewall"
          grep -Fq 'pub struct AcquisitionFeature' "$firewall"
          grep -Fq 'pub struct ScientificEvaluationRef' "$firewall"
          grep -Fq 'seal.validate_against(evaluation)?;' "$firewall"
          grep -Fq 'pub fn from_sealed_evaluation' "$firewall"
          grep -Fq 'scientific_reference_rejects_mutated_evaluation_even_when_old_record_id_survives' "$firewall"
          grep -Fq 'equal_advisory_and_dft_numbers_remain_different_authority_types' "$firewall"
          grep -Fq 'advisory_score_is_not_property_uncertainty' "$firewall"
          if grep -Eq 'impl[[:space:]]+From<AdvisoryMaterialPrediction>[[:space:]]+for[[:space:]]+ConditionedPropertyObservation' "$firewall"; then
            echo "forbidden_direct_advisory_to_property_evidence_conversion=true"
            exit 1
          fi
          echo "advisory_scientific_type_firewall=PASS"

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Prove exact parent locked metadata
        shell: bash
        run: |
          set -euo pipefail
          parent="$RUNNER_TEMP/mat-016a-parent"
          git worktree add --detach "$parent" "$SOURCE_PARENT"
          cargo metadata \
            --manifest-path "$parent/Cargo.toml" \
            --no-deps \
            --format-version 1 \
            --locked \
            > "$RUNNER_TEMP/parent-metadata.json"
          echo "parent_locked_metadata=PASS"

      - name: Diagnose source lock reconciliation without accepting it
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.frozen"
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/source-metadata.json"
          git diff -- Cargo.lock > "$RUNNER_TEMP/Cargo.lock.diff" || true
          if test -s "$RUNNER_TEMP/Cargo.lock.diff"; then
            echo "lock_delta=1" >> "$GITHUB_OUTPUT"
            echo "lock_reconciliation_required=true"
            cat "$RUNNER_TEMP/Cargo.lock.diff"
          else
            echo "lock_delta=0" >> "$GITHUB_OUTPUT"
            echo "lock_reconciliation_required=false"
          fi

      - name: Rustfmt exact materials crate
        run: cargo fmt --manifest-path crates/domains/symthaea-materials/Cargo.toml -- --check

      - name: Compile and run all materials targets
        run: cargo test -p "$PACKAGE" --all-targets

      - name: Strict Clippy on materials targets
        run: cargo clippy -p "$PACKAGE" --all-targets -- -D warnings

      - name: Restore frozen lock and verify source immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/Cargo.lock.frozen"; then
            cp "$RUNNER_TEMP/Cargo.lock.frozen" Cargo.lock
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code -- \
            Cargo.lock \
            crates/domains/symthaea-materials
          echo "postflight_source_identity=PASS"

      - name: Qualification verdict
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.lock.outputs.lock_delta }}" = "1"; then
            echo "qualification_claim=NOT_QUALIFIED_LOCK_RECONCILIATION_REQUIRED"
            exit 1
          fi
          echo "qualification_claim=SOURCE_ONLY_ADVISORY_SCIENTIFIC_TYPE_FIREWALL"
          echo "parent_mat011b_qualification=EXTERNAL_DEPENDENCY_NOT_ESTABLISHED_BY_THIS_RUN"
          echo "evidence_stage_admission=NOT_IMPLEMENTED"
          echo "scientific_property_truth=NOT_ESTABLISHED"
          echo "mat001_authority_advance=NONE"
