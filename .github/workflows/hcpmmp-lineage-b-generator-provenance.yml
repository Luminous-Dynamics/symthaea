name: HCPMMP Lineage B Generator Provenance

on:
  pull_request:
    paths:
      - 'scripts/derive_hcpmmp1_neuromaps_lineage_b.py'
      - 'scripts/hcpmmp_neuromaps_common.py'
      - 'scripts/hcpmmp_neuromaps_gifti.py'
      - 'scripts/test_derive_hcpmmp1_neuromaps_lineage_b.py'
      - 'scripts/test_hcpmmp_neuromaps_generator_provenance.py'
      - 'docs/neuroscience/HCPMMP1_NEUROMAPS_GENERATOR_PROVENANCE_V1.md'
      - '.github/workflows/hcpmmp-lineage-b-generator-provenance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify Lineage B generator provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout explicit theorem source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact PR-head checkout
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Syntax
        run: |
          python -m py_compile \
            scripts/hcpmmp_neuromaps_common.py \
            scripts/hcpmmp_neuromaps_gifti.py \
            scripts/derive_hcpmmp1_neuromaps_lineage_b.py \
            scripts/test_hcpmmp_neuromaps_generator_provenance.py

      - name: Generator provenance contracts
        run: PYTHONPATH=scripts python -m unittest scripts/test_hcpmmp_neuromaps_generator_provenance.py

      - name: Preserve full derivation contracts
        run: PYTHONPATH=scripts python -m unittest scripts/test_derive_hcpmmp1_neuromaps_lineage_b.py

      - name: Provenance ratchet
        shell: bash
        run: |
          set -euo pipefail
          f=scripts/derive_hcpmmp1_neuromaps_lineage_b.py
          python - <<'PY'
          import ast
          from pathlib import Path

          tree=ast.parse(Path('scripts/derive_hcpmmp1_neuromaps_lineage_b.py').read_text(encoding='utf-8'))
          value=None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'GENERATOR_FILE_KEYS' for t in node.targets):
                  value=ast.literal_eval(node.value)
                  break
          assert value == {'common','gifti','derive'}, value
          PY
          grep -Fq 'generator_implementation_digest' "$f"
          grep -Fq 'generator implementation changed during derivation' "$f"
          grep -Fq 'verify_inputs(run)' "$f"
          grep -Fq 'exact Symthaea code bytes' docs/neuroscience/HCPMMP1_NEUROMAPS_GENERATOR_PROVENANCE_V1.md

      - name: No generator self-authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'does not itself prove that the code is scientifically valid' docs/neuroscience/HCPMMP1_NEUROMAPS_GENERATOR_PROVENANCE_V1.md
