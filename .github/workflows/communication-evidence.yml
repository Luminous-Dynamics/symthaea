name: Communication Evidence Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/core/symthaea-communication/**"
      - "crates/core/symthaea-stt/src/communication_adapter.rs"
      - "communication/**"
      - ".github/workflows/communication-evidence.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Test communication contracts and CLI
        run: cargo test -p symthaea-communication
      - name: Check checked-in voice workers and evaluation scripts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in [
              Path("scripts/voice_transformers_worker.py"),
              Path("scripts/voice_pilot_outcomes_to_predictions.py"),
              Path("scripts/voice_asr_score.py"),
              Path("scripts/prepare_voice_asr_pilot.py"),
              Path("scripts/voice_dataset_intake.py"),
          ]:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Check acoustic capability adapter
        run: cargo check -p symthaea-stt --lib
      - name: Ensure unpinned templates cannot become release evidence
        run: |
          if cargo run -p symthaea-communication --bin symthaea-comm-eval -- validate-provider communication/pilot/provider-manifest.template.json; then
            echo "unpinned provider template unexpectedly passed"
            exit 1
          fi
          if cargo run -p symthaea-communication --bin symthaea-comm-eval -- validate-plan communication/pilot/evaluation-plan.template.json; then
            echo "unpinned evaluation template unexpectedly passed"
            exit 1
          fi
