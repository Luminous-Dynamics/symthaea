name: Communication Evidence Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/core/symthaea-communication/**"
      - "crates/core/symthaea-stt/src/communication_adapter.rs"
      - "communication/**"
      - ".github/workflows/communication-evidence.yml"
      - "docs/architecture/NEUROSEMANTIC_COMMUNICATION_PROTOCOL_V1.md"
      - "docs/architecture/NEUROSEMANTIC_N1_EVIDENCE_CONTRACT.md"
      - "docs/communication-capability-inventory.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Test communication contracts and execute N0 evidence labs
        run: |
          cargo test -p symthaea-communication --features hdc-codec
          mkdir -p target/communication-evidence
          cargo run -p symthaea-communication --features hdc-codec --example neurosemantic_n0 | tee target/communication-evidence/neurosemantic_n0.json
          cargo run -p symthaea-communication --features hdc-codec --example neurosemantic_interlingua_n0 | tee target/communication-evidence/neurosemantic_interlingua_n0.json
          cargo run -p symthaea-communication --features hdc-codec --example neurosemantic_hdc_codec_n0 | tee target/communication-evidence/neurosemantic_hdc_codec_n0.json
          cargo run -p symthaea-communication --features hdc-codec --example neurosemantic_hdc_interlingua_n0 | tee target/communication-evidence/neurosemantic_hdc_interlingua_n0.json
          python - <<'PY'
          import json
          from pathlib import Path

          codec_report = json.loads(Path("target/communication-evidence/neurosemantic_hdc_codec_n0.json").read_text())
          assert codec_report["binary_frame_roundtrip_exact"] is True
          assert codec_report["deterministic_repeat_exact"] is True
          assert codec_report["semantic_decoder_invoked"] is False
          assert codec_report["codec_descriptor"]["codec_id"] == "symthaea.hdc.continuous-sign-v1"
          assert codec_report["codec_descriptor"]["quantizer"] == "sign(value > 0)"
          assert codec_report["codec_descriptor"]["dimension"] == 16384
          assert len(codec_report["bit_corruption_observations"]) == 5
          assert codec_report["bit_corruption_observations"][0]["flip_probability"] == 0.0
          assert codec_report["metrics"]["schema_version"] == 1
          assert codec_report["metrics"]["dimension"] == 16384
          assert codec_report["metrics"]["binary_bytes"] == 2048
          assert codec_report["metrics"]["continuous_bytes"] == 65536
          assert codec_report["metrics"]["compression_ratio"] == 32.0
          assert 0.0 <= codec_report["metrics"]["sign_disagreement_rate"] <= 1.0
          assert -1.0 <= codec_report["metrics"]["cosine_similarity"] <= 1.0

          report = json.loads(Path("target/communication-evidence/neurosemantic_interlingua_n0.json").read_text())
          assert report["protocol_version"] == 1
          assert report["benchmark_schema_version"] == 1
          assert report["summary"]["cases"] == 8
          assert report["summary"]["structurally_equivalent_cases"] == 5
          assert report["execution_revision"] != ""
          for case in report["cases"]:
              metrics = case["metrics"]
              assert 0.0 <= metrics["node_precision"] <= 1.0
              assert 0.0 <= metrics["node_recall"] <= 1.0
              assert 0.0 <= metrics["edge_precision"] <= 1.0
              assert 0.0 <= metrics["edge_recall"] <= 1.0
              assert metrics["confidence_mae"] >= 0.0

          hdc_interlingua = json.loads(Path("target/communication-evidence/neurosemantic_hdc_interlingua_n0.json").read_text())
          assert hdc_interlingua["benchmark_schema_version"] == 1
          assert hdc_interlingua["execution_revision"] != ""
          assert hdc_interlingua["adapter_id"] == "symthaea.hdc.semantic-interlingua-v1"
          assert hdc_interlingua["claim_boundary"] == "held_out_synthetic_graph_retrieval_and_reconstruction_only"
          assert hdc_interlingua["codec_id"] == "symthaea.hdc.continuous-sign-v1"
          assert hdc_interlingua["summary"]["training_graphs"] == 4
          assert hdc_interlingua["summary"]["held_out_graphs"] == 2
          assert hdc_interlingua["summary"]["all_structurally_equivalent"] is True
          assert hdc_interlingua["summary"]["same_codebook_for_all_cases"] is True
          assert hdc_interlingua["summary"]["reordered_representation_exact"] is True
          assert hdc_interlingua["summary"]["lexical_invariance_exact"] is True
          assert hdc_interlingua["summary"]["identifier_invariance_exact"] is True
          assert hdc_interlingua["summary"]["wrong_codebook_rejected"] is True
          assert hdc_interlingua["summary"]["conservative_clean_decode"] is True
          assert hdc_interlingua["codebook"]["descriptor"]["role_revision"] == "source-relation-target-node-v2"

          # Machine-readable neurosemantic data/inference policy schema is
          # tested in Rust; these assertions ensure the N0 artifact explicitly
          # remains below human neural-decoding claims.
          assert hdc_interlingua["claim_boundary"] == "held_out_synthetic_graph_retrieval_and_reconstruction_only"

          assert hdc_interlingua["negative_controls"]["null_sample_count"] == 256
          assert hdc_interlingua["negative_controls"]["unrelated_node_max_similarity"] < 0.2
          assert hdc_interlingua["negative_controls"]["unrelated_edge_max_similarity"] < 0.2
          assert hdc_interlingua["negative_controls"]["true_edge_similarity"] > hdc_interlingua["negative_controls"]["unrelated_node_max_similarity"]
          assert hdc_interlingua["negative_controls"]["true_edge_similarity"] > hdc_interlingua["negative_controls"]["unrelated_edge_max_similarity"]
          assert hdc_interlingua["negative_controls"]["true_edge_similarity"] > hdc_interlingua["negative_controls"]["swapped_edge_similarity"]
          assert [obs["flip_probability"] for obs in hdc_interlingua["transport_corruption"]] == [0.0, 0.001, 0.01, 0.05, 0.10]
          assert hdc_interlingua["transport_corruption"][0]["metrics"]["structural_equivalence"] is True
          for case in hdc_interlingua["cases"]:
              metrics = case["metrics"]
              assert metrics["codebook_hash"] == hdc_interlingua["codebook"]["hash"]
              assert metrics["structural_equivalence"] is True
              assert metrics["node_precision"] == 1.0
              assert metrics["node_recall"] == 1.0
              assert metrics["edge_precision"] == 1.0
              assert metrics["edge_recall"] == 1.0
              assert metrics["node_selection_margin"] > 0.0
              assert metrics["edge_selection_margin"] > 0.0
          PY
      - name: Check locked offline worker and Python syntax
        run: |
          uv lock --check --project communication/worker
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in [
              Path("communication/worker/seamless_worker.py"),
              Path("communication/worker/whisper_worker.py"),
              Path("communication/worker/provision_whisper.py"),
              Path("communication/pilot/prepare_fleurs.py"),
              Path("communication/pilot/test_worker_e2e.py"),
          ]:
              ast.parse(path.read_text(), filename=str(path))
          PY
      - name: Upload deterministic communication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: communication-evidence-${{ github.sha }}
          path: target/communication-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Check acoustic capability adapter
        run: cargo check -p symthaea-stt --lib
      - name: Ensure unpinned templates cannot become release evidence
        run: |
          if cargo run -p symthaea-communication --bin symthaea-comm-eval -- validate-provider communication/pilot/provider-manifest.template.json; then
            echo "unpinned provider template unexpectedly passed"
            exit 1
          fi
          if cargo run -p symthaea-communication --bin symthaea-comm-eval -- validate-plan communication/pilot/evaluation-plan.template.json; then
            echo "unpinned evaluation template unexpectedly passed"
            exit 1
          fi
