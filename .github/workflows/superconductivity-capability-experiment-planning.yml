name: Superconductivity Capability-Gated Experiment Planner

on:
  pull_request:
    paths:
      - "tools/superconductivity-capability-plan-harness/**"
      - "data/schemas/superconductivity_capability_experiment_plan_v0_1.schema.json"
      - "data/research/superconductivity_capability_experiment_plan_fixture_v0_1.json"
      - "research/superconductivity/capability_experiment_planning/**"
      - ".github/workflows/superconductivity-capability-experiment-planning.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superconductivity-capability-plan-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  capability-plan:
    name: Exact plan oracle, capability closure and greedy comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Apply pinned Rust formatting
        run: cargo fmt --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --all

      - name: Verify canonical Rust formatting
        run: cargo fmt --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --all -- --check

      - name: Capture rustfmt-only patch
        if: always()
        run: |
          git diff --binary -- tools/superconductivity-capability-plan-harness > "$RUNNER_TEMP/sc-rustfmt.patch"
          git diff --stat -- tools/superconductivity-capability-plan-harness
          sha256sum "$RUNNER_TEMP/sc-rustfmt.patch"

      - name: Generate isolated dependency lockfile
        run: cargo generate-lockfile --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml

      - name: Run capability and model-discrimination tests
        run: cargo test --locked --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --bins

      - name: Audit synthetic capability-gated plan
        run: |
          cargo run --locked --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --bin sc_capability_plan_audit -- \
            --schema data/schemas/superconductivity_capability_experiment_plan_v0_1.schema.json \
            --fixture data/research/superconductivity_capability_experiment_plan_fixture_v0_1.json \
            --out "$RUNNER_TEMP/sc-capability-plan-receipt.json"
          cat "$RUNNER_TEMP/sc-capability-plan-receipt.json"

      - name: Audit synthetic model-discrimination plan
        run: |
          cargo run --locked --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --bin sc_model_discrimination_audit -- \
            --schema data/schemas/superconductivity_model_discrimination_v0_1.schema.json \
            --fixture data/research/superconductivity_model_discrimination_fixture_v0_1.json \
            --out "$RUNNER_TEMP/sc-model-discrimination-receipt.json"
          cat "$RUNNER_TEMP/sc-model-discrimination-receipt.json"

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/superconductivity-capability-plan-harness/Cargo.toml --bins -- -D warnings

      - name: Record exact-run identity
        if: always()
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "worktree_status=$(git status --short)"
            if [ -f "$RUNNER_TEMP/sc-rustfmt.patch" ]; then sha256sum "$RUNNER_TEMP/sc-rustfmt.patch"; fi
            sha256sum data/schemas/superconductivity_capability_experiment_plan_v0_1.schema.json
            sha256sum data/research/superconductivity_capability_experiment_plan_fixture_v0_1.json
            sha256sum tools/superconductivity-capability-plan-harness/Cargo.toml
            sha256sum tools/superconductivity-capability-plan-harness/src/main.rs
            sha256sum tools/superconductivity-capability-plan-harness/src/bin/sc_model_discrimination_audit.rs
            sha256sum data/schemas/superconductivity_model_discrimination_v0_1.schema.json
            sha256sum data/research/superconductivity_model_discrimination_fixture_v0_1.json
            if [ -f tools/superconductivity-capability-plan-harness/Cargo.lock ]; then
              sha256sum tools/superconductivity-capability-plan-harness/Cargo.lock
            else
              echo "cargo_lock=not-generated"
            fi
          } > "$RUNNER_TEMP/sc-capability-plan-environment.txt"

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-capability-plan-exact-run-evidence
          if-no-files-found: warn
          path: |
            tools/superconductivity-capability-plan-harness/Cargo.lock
            ${{ runner.temp }}/sc-capability-plan-environment.txt
            ${{ runner.temp }}/sc-capability-plan-receipt.json
            ${{ runner.temp }}/sc-model-discrimination-receipt.json
            ${{ runner.temp }}/sc-rustfmt.patch
