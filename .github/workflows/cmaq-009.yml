name: CMAQ-009 active diagnostic-probe benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/cmaq-009/**"
      - ".github/workflows/cmaq-009.yml"
  push:
    branches:
      - main
    paths:
      - "research/cmaq-009/**"
      - ".github/workflows/cmaq-009.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-probes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Unit tests
        working-directory: research/cmaq-009
        run: cargo test --locked
      - name: Generate report and validate paired risk/utility frontier
        working-directory: research/cmaq-009
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked > /tmp/cmaq-009-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/cmaq-009-report.json").read_text())
          assert report["schema_version"] == "cmaq-009-active-diagnostic-probes-v0.3"
          assert report["episode_count"] == 512
          assert report["horizon"] == 128
          assert report["change_detection_threshold"] == 5.0
          assert report["page_hinkley_delta"] == 0.08
          assert report["page_hinkley_threshold"] == 2.0
          assert report["page_hinkley_burn_in"] == 8
          assert report["probe_cost"] == 0.003
          assert report["feedback_delay_steps"] == 4
          assert report["feedback_drop_rate"] == 0.05
          assert report["feedback_sensitivity"] == 0.85
          assert report["feedback_specificity"] == 0.98
          assert report["probe_signal_null_rate"] == 0.01
          assert report["probe_signal_shift_rate"] == 0.60
          assert report["adaptive_probe_cap"] == 32
          assert report["scenarios"] == ["stationary", "abrupt_support_shift", "gradual_support_shift"]
          assert report["policies"] == [
              "direct_fallback", "fixed_gate", "passive_cusum", "page_hinkley_passive", "periodic_probe_8",
              "periodic_probe_16", "periodic_probe_32", "adaptive_probe_32",
              "zero_info_probe_32", "oracle_changepoint"
          ]

          rows = report["summary"]
          assert len(rows) == 30
          by_key = {(row["scenario"], row["policy"]): row for row in rows}
          assert len(by_key) == len(rows)
          for scenario in report["scenarios"]:
              for policy in report["policies"]:
                  row = by_key[(scenario, policy)]
                  assert row["episode_count"] == 512
                  assert row["max_probe_count"] <= row["probe_cap"]
                  for key in [
                      "mean_utility", "mean_utility_delta_vs_passive",
                      "utility_delta_ci95_low", "utility_delta_ci95_high",
                      "mean_model_action_coverage", "unsupported_rate_per_model_action",
                      "mean_probe_count", "mean_probe_cost", "revocation_episode_rate",
                      "false_revocation_episode_rate", "shift_detection_coverage",
                      "mean_regret_vs_oracle", "cvar95_regret_vs_oracle", "max_regret_vs_oracle",
                  ]:
                      assert isinstance(row[key], (int, float)) and abs(row[key]) < 1e6
                  assert 0.0 <= row["mean_model_action_coverage"] <= 1.0
                  assert 0.0 <= row["unsupported_rate_per_model_action"] <= 1.0
                  assert 0.0 <= row["revocation_episode_rate"] <= 1.0
                  assert 0.0 <= row["false_revocation_episode_rate"] <= 1.0
                  assert 0.0 <= row["shift_detection_coverage"] <= 1.0
                  assert row["cvar95_regret_vs_oracle"] + 1e-8 >= row["mean_regret_vs_oracle"]
                  assert row["max_regret_vs_oracle"] + 1e-8 >= row["cvar95_regret_vs_oracle"]

          for scenario in report["scenarios"]:
              assert by_key[(scenario, "direct_fallback")]["mean_model_action_coverage"] == 0.0
              assert by_key[(scenario, "direct_fallback")]["max_probe_count"] == 0
              assert by_key[(scenario, "fixed_gate")]["mean_model_action_coverage"] == 1.0
          abrupt = "abrupt_support_shift"
          page_hinkley = by_key[(abrupt, "page_hinkley_passive")]
          assert page_hinkley["max_probe_count"] == 0
          assert page_hinkley["probe_cap"] == 0
          passive = by_key[(abrupt, "passive_cusum")]
          adaptive = by_key[(abrupt, "adaptive_probe_32")]
          assert adaptive["max_probe_count"] <= 32
          assert adaptive["shift_detection_coverage"] >= 0.90
          assert adaptive["p90_detection_delay_steps"] < passive["p90_detection_delay_steps"]
          # The <=16-step target is not met on the current preregistered tape.
          # Keep the miss visible and require it to remain in the report.
          print("CMAQ-009 observed abrupt-shift adaptive p90 delay:", adaptive["p90_detection_delay_steps"])
          assert adaptive["p90_detection_delay_steps"] > 16.0
          assert adaptive["mean_utility_delta_vs_passive"] > 0.0
          assert adaptive["utility_delta_ci95_low"] > 0.0
          assert by_key[("stationary", "adaptive_probe_32")]["false_revocation_episode_rate"] <= 0.05

          # Zero-information probes cost resources but must not alter decisions.
          zero = by_key[(abrupt, "zero_info_probe_32")]
          assert abs(zero["mean_utility_delta_vs_passive"] + zero["mean_probe_cost"]) < 1e-6
          assert zero["p90_detection_delay_steps"] == passive["p90_detection_delay_steps"]
          assert zero["shift_detection_coverage"] == passive["shift_detection_coverage"]

          print("CMAQ-009 schema, Page-Hinkley comparator, hard probe caps, zero-information control, adaptive detection, and paired net-utility assertions validated")
          print(json.dumps({
              scenario: {
                  policy: {
                      "mean_utility": by_key[(scenario, policy)]["mean_utility"],
                      "delta_vs_passive": by_key[(scenario, policy)]["mean_utility_delta_vs_passive"],
                      "delta_ci95": [by_key[(scenario, policy)]["utility_delta_ci95_low"], by_key[(scenario, policy)]["utility_delta_ci95_high"]],
                      "coverage": by_key[(scenario, policy)]["mean_model_action_coverage"],
                      "probes_mean": by_key[(scenario, policy)]["mean_probe_count"],
                      "probes_max": by_key[(scenario, policy)]["max_probe_count"],
                      "probe_cost_mean": by_key[(scenario, policy)]["mean_probe_cost"],
                      "false_revocation": by_key[(scenario, policy)]["false_revocation_episode_rate"],
                      "detection": by_key[(scenario, policy)]["shift_detection_coverage"],
                      "p90_delay": by_key[(scenario, policy)]["p90_detection_delay_steps"],
                  }
                  for scenario in report["scenarios"]
                  for policy in report["policies"]
                  if policy in ["fixed_gate", "passive_cusum", "page_hinkley_passive", "periodic_probe_8", "periodic_probe_16", "periodic_probe_32", "adaptive_probe_32", "zero_info_probe_32", "oracle_changepoint"]
              }
          }, sort_keys=True))
          PY
