name: Symthaea Fractal Time Lab CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'crates/domains/symthaea-fractal-time-lab/**'
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/domains/symthaea-fractal-time-lab/**'

concurrency:
  # Only the newest automatic validation for a branch/PR is authoritative.
  # Supersede stale queued/running heads so focused lab checks cannot amplify
  # repository-wide runner pressure during rapid iteration.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --component clippy
          rustup default stable
      - name: Run unit tests
        run: cargo test -p symthaea-fractal-time-lab --lib
      - name: Run sanity tests
        run: cargo test -p symthaea-fractal-time-lab --test benchmark_sanity
      - name: Run benchmark example (dry run)
        run: cargo run -p symthaea-fractal-time-lab --example run_experiments -- --seed 42 --trials 4
      - name: Run clippy
        run: cargo clippy -p symthaea-fractal-time-lab -- -D warnings
