name: PITB Probabilistic Support Landscape

on:
  pull_request:
    paths:
      - "scripts/research/pitb_support_landscape_v1.py"
      - "data/benchmarks/proof-insight-transfer-v0/support-landscape-trial.schema.json"
      - "docs/research/pitb-probabilistic-support-landscape-2026-10-31.md"
      - "docs/research/pitb-support-landscape-context-closure-2026-10-31.md"
      - ".github/workflows/pitb-support-landscape.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-landscape-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact proposed commit
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check exact analyzer source and synthetic controls
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/pitb_support_landscape_v1.py
          python scripts/research/pitb_support_landscape_v1.py --self-test
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema[format]==4.26.0"
      - name: Validate Draft 2020-12 schema and status controls
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("data/benchmarks/proof-insight-transfer-v0/support-landscape-trial.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          budget = {
              "max_model_calls": 2, "max_tokens": 500, "max_wall_ms": 100,
              "max_checker_ms": 10, "max_cost_microusd": 10
          }
          budget_sha = hashlib.sha256(json.dumps(budget, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          valid = {
              "schema_version": "pitb.support-landscape-trial.v1",
              "study_id": "schema-control", "component_id": "component-1",
              "target_id": "target-1", "model_id": "synthetic-model",
              "model_version": "1", "checker_version": "lean-checker-1",
              "solver_policy_sha256": "a" * 64, "budget_sha256": budget_sha,
              "target_statement_sha256": "b" * 64, "environment_sha256": "c" * 64,
              "toolchain_sha256": "d" * 64, "fixed_context_sha256": "e" * 64,
              "replicate_count": 20, "replicate_index": 0, "budget": budget,
              "mutable_declarations": ["h"], "fixed_declarations": ["base"],
              "declaration_order": ["base", "h"], "declaration_dependencies": {"base": [], "h": []},
              "requested_declarations": ["h"], "context_well_formed": True,
              "local_context_sha256": "f" * 64, "context_receipt_sha256": "1" * 64,
              "seed_sha256": "2" * 64, "run_receipt_sha256": "3" * 64,
              "checker_receipt_sha256": "4" * 64, "semantic_gate_receipt_sha256": "5" * 64,
              "outcome": "verified_success", "solver_started": True,
              "kernel_passed": True, "semantic_gate_passed": True,
              "model_calls": 1, "tokens": 100, "wall_ms": 50,
              "checker_ms": 5, "cost_microusd": 2
          }
          def require_valid(row, label):
              errors = list(validator.iter_errors(row))
              if errors:
                  raise SystemExit(f"{label}: {errors[0].message}")
          def require_invalid(row, label):
              if not list(validator.iter_errors(row)):
                  raise SystemExit(f"schema accepted invalid control: {label}")

          require_valid(valid, "verified-success row")
          invalid = copy.deepcopy(valid)
          invalid.update({
              "requested_declarations": [],
              "outcome": "invalid_context",
              "context_well_formed": False,
              "solver_started": False,
              "kernel_passed": False,
              "semantic_gate_passed": False,
              "model_calls": 0, "tokens": 0, "wall_ms": 0,
              "checker_ms": 0, "cost_microusd": 0
          })
          require_valid(invalid, "invalid-context row")
          bad_success = copy.deepcopy(valid)
          bad_success["semantic_gate_passed"] = False
          require_invalid(bad_success, "verified success without semantic gate")
          bad_context = copy.deepcopy(valid)
          bad_context["context_well_formed"] = False
          require_invalid(bad_context, "success on invalid context")
          bad_invalid = copy.deepcopy(invalid)
          bad_invalid["solver_started"] = True
          require_invalid(bad_invalid, "invalid context that starts the solver")
          print("PITB_SUPPORT_LANDSCAPE_SCHEMA_PASS: Draft2020-12 meta-schema, success/invalid-context fixtures and status negative controls")
          PY
