name: MACE GroupMemBench Adapter
on:
  pull_request:
    paths:
      - "research/mace-groupmembench-adapter-v0-1/**"
      - "data/schemas/mace_groupmembench_protocol_v1.schema.json"
      - "data/schemas/mace_groupmembench_response_v1.schema.json"
      - "docs/research/MACE_GROUPMEMBENCH_ADAPTER_V0_1.md"
      - ".github/workflows/mace-groupmembench-adapter.yml"
  push:
    branches:
      - "research/mace-groupmembench-adapter-v0-1"
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Parse Rust source
        run: rustfmt --edition 2024 --emit stdout --config skip_children=true research/mace-groupmembench-adapter-v0-1/src/lib.rs >/dev/null
      - name: Adapter tests
        run: cargo test --manifest-path research/mace-groupmembench-adapter-v0-1/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/mace-groupmembench-adapter-v0-1/Cargo.toml --all-targets -- -D warnings
      - name: Parse protocol schema
        run: python3 -m json.tool data/schemas/mace_groupmembench_protocol_v1.schema.json >/dev/null
      - name: Parse response schema
        run: python3 -m json.tool data/schemas/mace_groupmembench_response_v1.schema.json >/dev/null
