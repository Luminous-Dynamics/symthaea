name: LL-009AH Pre-Evidence Checkpoint Qualification

on:
  pull_request:
    paths:
      - 'scripts/ll009ah_checkpoint.py'
      - 'scripts/ll009ag_common.py'
      - 'scripts/ll009ag_git_subject.py'
      - 'scripts/ll009ag_campaign.py'
      - 'scripts/capture_ll009ag_environment.py'
      - 'configs/lunar_transport/ll009ag_site01_campaign_v1.json'
      - 'docs/research/LUNAR_LAUNCHER_LL009AH_PRE_EVIDENCE_CHECKPOINTS.md'
      - '.github/workflows/ll009ah-pre-evidence-checkpoints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile AG and AH campaign tools
        run: >-
          python -m py_compile
          scripts/ll009ag_common.py
          scripts/ll009ag_git_subject.py
          scripts/ll009ag_campaign.py
          scripts/capture_ll009ag_environment.py
          scripts/ll009ah_checkpoint.py
      - name: Verify AH is inside the AG protected execution surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('configs/lunar_transport/ll009ag_site01_campaign_v1.json').read_text())
          assert 'scripts/ll009ah_checkpoint.py' in policy['protected_files']
          print('LL-009AH protected-surface binding: PASS')
          PY
      - name: Execute AH adversarial synthetic qualification
        run: python scripts/ll009ah_checkpoint.py self-test
