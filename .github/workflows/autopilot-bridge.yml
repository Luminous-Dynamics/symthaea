name: Autopilot Bridge Qualification

on:
  pull_request:
    paths:
      - 'crates/bridges/symthaea-autopilot-bridge/**'
      - 'crates/core/symthaea-core/src/embodiment_clock_alignment.rs'
      - '.github/workflows/autopilot-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  px4-heartbeat-and-timesync-evidence:
    name: PX4 Heartbeat and Timesync Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact tested commit
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Record qualification identity
        run: |
          set -euo pipefail
          echo "qualification_sha=$(git rev-parse HEAD)"
          echo "event_sha=$GITHUB_SHA"
          echo "rustc=$(rustc +1.96.0 --version)"
          echo "cargo=$(cargo +1.96.0 --version)"
          echo "target=x86_64-unknown-linux-gnu"
          if test -f Cargo.lock; then
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
          else
            echo "cargo_lock=ABSENT"
          fi
          echo "workflow_blob_sha=$(git hash-object .github/workflows/autopilot-bridge.yml)"

      - name: Formatting qualification
        run: cargo +1.96.0 fmt -p symthaea-autopilot-bridge -- --check

      - name: Unit qualification
        run: cargo +1.96.0 test -p symthaea-autopilot-bridge -- --test-threads=1

      - name: Clippy
        run: cargo +1.96.0 clippy -p symthaea-autopilot-bridge --all-targets -- -D warnings
