name: FIN-SYS Oracle V1 Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/domains/symthaea-economics/fixtures/fin_sys_v1/**'
      - 'crates/domains/symthaea-economics/scripts/verify_fin_sys_oracle_v1.py'
      - '.github/workflows/fin-sys-oracle-v1.yml'

permissions:
  contents: read

jobs:
  oracle-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualifier subject
        uses: actions/checkout@v4

      - name: Record Python runtime
        run: python3 --version

      - name: Verify exact corpus
        run: python3 crates/domains/symthaea-economics/scripts/verify_fin_sys_oracle_v1.py

      - name: Negative control - evaluator key leak must fail
        shell: bash
        run: |
          set -euo pipefail
          public='crates/domains/symthaea-economics/fixtures/fin_sys_v1/public.json'
          cp "$public" "$public.bak"
          trap 'mv -f "$public.bak" "$public"' EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('crates/domains/symthaea-economics/fixtures/fin_sys_v1/public.json')
          doc = json.loads(p.read_text())
          doc['fixtures'][0]['expected_financing_regime'] = 'HedgeFinanceCandidate'
          p.write_text(json.dumps(doc, indent=2) + '\n')
          PY
          if python3 crates/domains/symthaea-economics/scripts/verify_fin_sys_oracle_v1.py; then
            echo 'ERROR: verifier accepted evaluator-label leakage' >&2
            exit 1
          fi
          mv -f "$public.bak" "$public"
          trap - EXIT

      - name: Negative control - non-finite observation must fail
        shell: bash
        run: |
          set -euo pipefail
          public='crates/domains/symthaea-economics/fixtures/fin_sys_v1/public.json'
          cp "$public" "$public.bak"
          trap 'mv -f "$public.bak" "$public"' EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('crates/domains/symthaea-economics/fixtures/fin_sys_v1/public.json')
          doc = json.loads(p.read_text())
          doc['fixtures'][0]['observations']['debt_stock'] = 'NaN'
          p.write_text(json.dumps(doc, indent=2) + '\n')
          PY
          if python3 crates/domains/symthaea-economics/scripts/verify_fin_sys_oracle_v1.py; then
            echo 'ERROR: verifier accepted non-finite financial observation' >&2
            exit 1
          fi
          mv -f "$public.bak" "$public"
          trap - EXIT

      - name: Negative control - public/oracle ID divergence must fail
        shell: bash
        run: |
          set -euo pipefail
          oracle='crates/domains/symthaea-economics/fixtures/fin_sys_v1/oracle.json'
          cp "$oracle" "$oracle.bak"
          trap 'mv -f "$oracle.bak" "$oracle"' EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('crates/domains/symthaea-economics/fixtures/fin_sys_v1/oracle.json')
          doc = json.loads(p.read_text())
          doc['fixtures'][0]['fixture_id'] = 'oracle_only_mismatch_001'
          p.write_text(json.dumps(doc, indent=2) + '\n')
          PY
          if python3 crates/domains/symthaea-economics/scripts/verify_fin_sys_oracle_v1.py; then
            echo 'ERROR: verifier accepted public/oracle ID divergence' >&2
            exit 1
          fi
          mv -f "$oracle.bak" "$oracle"
          trap - EXIT

      - name: Re-run positive corpus after hostile controls
        run: python3 crates/domains/symthaea-economics/scripts/verify_fin_sys_oracle_v1.py

      - name: Postflight - qualifier did not mutate subject
        run: git diff --exit-code
