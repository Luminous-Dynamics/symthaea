name: SYM-FV-041A Authority Kernel

on:
  pull_request:
    paths:
      - "formal/lean/authority/AuthorityKernel.lean"
      - "docs/formal/sym-fv-041a-authority-kernel-v1.json"
      - "scripts/validate_sym_fv_041a.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/sym-fv-041a-authority-kernel.yml"
  push:
    branches: [main]
    paths:
      - "formal/lean/authority/AuthorityKernel.lean"
      - "docs/formal/sym-fv-041a-authority-kernel-v1.json"
      - "scripts/validate_sym_fv_041a.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/sym-fv-041a-authority-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sym-fv-041a-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  authority-kernel:
    name: Lean authority kernel theorem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record and verify exact Git subject
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "${ACTUAL_HEAD}" = "${SUBJECT_SHA}"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Static contract and negative controls
        run: python3 scripts/validate_sym_fv_041a.py

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Prove Lean failures propagate
        run: |
          set -euo pipefail
          cat > /tmp/sym-fv-041a-known-bad.lean <<'LEAN'
          theorem sym_fv_041a_known_bad : False := by
            trivial
          LEAN
          set +e
          nix develop .#formal --command lean /tmp/sym-fv-041a-known-bad.lean \
            > /tmp/sym-fv-041a-known-bad-output.txt 2>&1
          rc=$?
          set -e
          cat /tmp/sym-fv-041a-known-bad-output.txt
          if [ "${rc}" -eq 0 ]; then
            echo "known-bad Lean subject unexpectedly succeeded" >&2
            exit 1
          fi
          printf '%s\n' "${rc}" > /tmp/sym-fv-041a-known-bad-exit.txt

      - name: Typecheck exact Lean theorem subject
        run: |
          set -euo pipefail
          nix develop .#formal --command bash -c '
            set -euo pipefail
            lean --version > /tmp/sym-fv-041a-lean-version.txt
            lean formal/lean/authority/AuthorityKernel.lean \
              > /tmp/sym-fv-041a-lean-output.txt 2>&1
          '
          cat /tmp/sym-fv-041a-lean-version.txt
          cat /tmp/sym-fv-041a-lean-output.txt
          if grep -Eq 'sorryAx|declaration uses .sorry|error:' /tmp/sym-fv-041a-lean-output.txt; then
            echo "Lean output contains a forbidden proof hole or residual error" >&2
            exit 1
          fi

      - name: Postflight immutability and receipt
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          paths = {
              "proof": root / "formal/lean/authority/AuthorityKernel.lean",
              "manifest": root / "docs/formal/sym-fv-041a-authority-kernel-v1.json",
              "validator": root / "scripts/validate_sym_fv_041a.py",
              "flake_lock": root / "flake.lock",
          }

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          head = git("rev-parse", "HEAD")
          requested = os.environ["SUBJECT_SHA"]
          if head != requested:
              raise SystemExit(f"receipt subject mismatch: checked out {head}, requested {requested}")

          known_bad_exit = int(Path("/tmp/sym-fv-041a-known-bad-exit.txt").read_text().strip())
          if known_bad_exit == 0:
              raise SystemExit("known-bad prover control did not fail")

          receipt = {
              "schema": "symthaea.formal.sym-fv-041a-qualification-receipt.v2",
              "issue": 5802,
              "parent_issue": 5794,
              "evidence_class": "AbstractFormalTheorem",
              "result": "LeanTypecheckedFailClosed",
              "requested_subject_sha": requested,
              "head": head,
              "tree": git("rev-parse", "HEAD^{tree}"),
              "lean_version": Path("/tmp/sym-fv-041a-lean-version.txt").read_text().strip(),
              "proof_sha256": sha256(paths["proof"]),
              "manifest_sha256": sha256(paths["manifest"]),
              "validator_sha256": sha256(paths["validator"]),
              "flake_lock_blob": git("rev-parse", "HEAD:flake.lock"),
              "flake_lock_sha256": sha256(paths["flake_lock"]),
              "static_contract": "PASS",
              "negative_controls": "PASS",
              "known_bad_lean_rejected": True,
              "known_bad_lean_exit": known_bad_exit,
              "lean_exit_zero": True,
              "forbidden_lean_output_absent": True,
              "repository_postflight_clean": True,
              "nonclaims": [
                  "not-concrete-subsystem-refinement",
                  "not-distributed-currentness",
                  "not-revocation-linearizability",
                  "not-runtime-correctness",
              ],
          }
          Path("/tmp/sym-fv-041a-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Retain proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sym-fv-041a-${{ env.SUBJECT_SHA }}
          path: |
            /tmp/sym-fv-041a-known-bad-output.txt
            /tmp/sym-fv-041a-known-bad-exit.txt
            /tmp/sym-fv-041a-lean-version.txt
            /tmp/sym-fv-041a-lean-output.txt
            /tmp/sym-fv-041a-receipt.json
          if-no-files-found: error
          retention-days: 30
