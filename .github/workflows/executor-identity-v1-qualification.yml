name: Executor Identity ABI V1 Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/executor-identity-v1-qualification.yml'
      - 'crates/core/symthaea-executor-identity/**'
      - 'crates/core/symthaea-interaction-core/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executor-identity-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  executor-identity-v1:
    name: Exact-head neutral executor identity ABI v1
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact PR head, interaction-core parent and tranche scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUIRED_PARENT: 48de9f575a3bb6a70834c6d7b9a1080d37774d93
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          fi
          git cat-file -e "${REQUIRED_PARENT}^{commit}"
          test "$(git merge-base HEAD "${REQUIRED_PARENT}")" = "${REQUIRED_PARENT}"
          git merge-base --is-ancestor "${REQUIRED_PARENT}" HEAD
          test "$(git rev-list --count "${REQUIRED_PARENT}"..HEAD)" -eq 1

          mapfile -t changed < <(git diff --name-only "${REQUIRED_PARENT}"...HEAD | sort)
          expected=(
            '.github/workflows/executor-identity-v1-qualification.yml'
            'crates/core/symthaea-executor-identity/Cargo.toml'
            'crates/core/symthaea-executor-identity/scripts/executor_identity_oracle.py'
            'crates/core/symthaea-executor-identity/src/lib.rs'
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Record clean source baseline
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

      - name: Enforce neutral ABI and composer ownership boundary
        run: |
          set -euo pipefail
          MANIFEST=crates/core/symthaea-executor-identity/Cargo.toml
          SOURCE=crates/core/symthaea-executor-identity/src/lib.rs
          ORACLE=crates/core/symthaea-executor-identity/scripts/executor_identity_oracle.py

          grep -Fq 'symthaea-interaction-core = { path = "../symthaea-interaction-core" }' "${MANIFEST}"
          grep -Fq 'sha2 = { workspace = true }' "${MANIFEST}"
          if grep -Eiq 'symthaea-authority|symthaea-action|serde|reqwest|hyper|tokio|holochain|hdk|hdi|xenia|spiffe|spire|rats|eat|tpm|wasmtime|keyring|secret-service' "${MANIFEST}"; then
            echo 'authority/provider/runtime/serialization dependency leaked into neutral executor identity ABI' >&2
            exit 1
          fi

          grep -Fq 'symthaea.executor.identity.requirement.v1\0' "${SOURCE}"
          grep -Fq 'symthaea.executor.identity.challenge.v1\0' "${SOURCE}"
          grep -Fq 'pub struct ExecutorIdentityRequirement' "${SOURCE}"
          grep -Fq 'pub struct ExecutorIdentityChallenge' "${SOURCE}"
          grep -Fq 'pub enum ExecutorIdentityDimension' "${SOURCE}"
          grep -Fq 'pub enum ExecutorIdentityProfile' "${SOURCE}"
          grep -Fq 'ExecutorEvidenceSubjectId' "${SOURCE}"
          grep -Fq 'ExecutorVerifierProfileId' "${SOURCE}"
          grep -Fq 'fn profile_mandatory_dimensions_fail_closed' "${SOURCE}"
          grep -Fq 'fn runtime_incarnation_changes_challenge_identity' "${SOURCE}"
          grep -Fq 'future trusted composer crate' "${SOURCE}"

          if grep -Fq 'pub struct VerifiedExecutorBinding' "${SOURCE}"; then
            echo 'live VerifiedExecutorBinding must be owned by the concrete trusted composer, not neutral ABI' >&2
            exit 1
          fi
          if grep -Fq 'symthaea.executor.identity.binding.v1' "${SOURCE}"; then
            echo 'live binding identity domain leaked back into neutral ABI' >&2
            exit 1
          fi
          if grep -Eq 'pub[[:space:]]+trait[[:space:]].*(Verifier|Provider|Attestation)|pub[[:space:]]+fn[[:space:]]+(compose|verify|mint)_.*binding' "${SOURCE}"; then
            echo 'arbitrary public verifier/composer surface would weaken the trusted composition boundary' >&2
            exit 1
          fi
          if grep -Eq '\bSerialize\b|\bDeserialize\b|serde::|std::net::|std::fs::|std::process::|Command::new|SystemTime|Instant::now|use .*CapabilityGrant|use .*DispatchPermit|use .*VerifiedAuthority' "${SOURCE}"; then
            echo 'serialization/authority/runtime I/O leaked into neutral executor identity ABI' >&2
            exit 1
          fi
          if grep -Fq 'EXPECTED_BINDING' "${ORACLE}" || grep -Fq 'BINDING_DOMAIN' "${ORACLE}"; then
            echo 'oracle must stop at neutral requirement/challenge identities' >&2
            exit 1
          fi

      - name: Independent neutral executor identity oracle
        run: |
          set -euo pipefail
          python3 crates/core/symthaea-executor-identity/scripts/executor_identity_oracle.py

      - name: Format
        run: |
          set -euo pipefail
          cargo fmt -p symthaea-executor-identity -- --check

      - name: Resolve candidate and execute focused gates
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check -p symthaea-executor-identity --all-targets
          cargo test -p symthaea-executor-identity
          cargo clippy -p symthaea-executor-identity --all-targets -- -D warnings
          if ! cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock requires committed reconciliation:' >&2
            diff -u /tmp/Cargo.lock.before Cargo.lock || true
            exit 1
          fi

      - name: Locked replay
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-executor-identity --all-targets
          cargo test --locked -p symthaea-executor-identity
          cargo clippy --locked -p symthaea-executor-identity --all-targets -- -D warnings

      - name: Prove qualification did not mutate source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
