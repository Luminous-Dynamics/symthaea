name: CP-04 typed evidence DAG v1.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/engineering/contracts/cp-04-compute-evidence-typed-dag-v1-1.md"
      - "docs/engineering/data/cp-04-compute-evidence-dag-v1-1.json"
      - "docs/engineering/data/cp-04-compute-evidence-dag-mutation-manifest-v1-1.json"
      - "scripts/qualifiers/cp_04_compute_dag_qualifier.py"
      - ".github/workflows/cp-04-compute-dag-v1-1.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact checked-out head
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git status --short

      - name: Run independent stdlib qualifier
        run: python3 scripts/qualifiers/cp_04_compute_dag_qualifier.py

      - name: Verify qualified inputs stayed immutable
        shell: bash
        run: |
          git diff --exit-code --             docs/engineering/contracts/cp-04-compute-evidence-typed-dag-v1-1.md             docs/engineering/data/cp-04-compute-evidence-dag-v1-1.json             scripts/qualifiers/cp_04_compute_dag_qualifier.py             .github/workflows/cp-04-compute-dag-v1-1.yml
