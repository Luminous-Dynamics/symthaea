name: CMAQ-020 finite response-equivalence contract

on:
  pull_request:
    paths:
      - "research/cmaq-020/**"
      - "crates/core/nixward/src/mind/world_model.rs"
      - "crates/core/nixward/src/mind/mod.rs"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/cmaq-020.yml"
  push:
    branches:
      - main
    paths:
      - "research/cmaq-020/**"
      - ".github/workflows/cmaq-020.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Format
        working-directory: research/cmaq-020
        run: cargo +1.100.0 fmt -p cmaq-020-state-response -- --check
      - name: Tests
        working-directory: research/cmaq-020
        run: cargo +1.100.0 test --locked -p cmaq-020-state-response
      - name: Strict Clippy
        working-directory: research/cmaq-020
        run: cargo +1.100.0 clippy --locked -p cmaq-020-state-response --all-targets -- -D warnings
      - name: Validate WorldFailBench adapter schema and synthetic fixture
        run: |
          python3 -m pip install --disable-pip-version-check "jsonschema==4.25.1"
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, ValidationError

          schema = json.loads(Path("research/cmaq-020/worldfailbench-boundary-rate-pair-v0.1.schema.json").read_text())
          fixture = json.loads(Path("research/cmaq-020/fixtures/worldfailbench-boundary-rate-pair.example.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          validator.validate(fixture)

          invalid = copy.deepcopy(fixture)
          invalid["scene_sides"]["failure_side"]["reference_trials"] = 0
          errors = list(validator.iter_errors(invalid))
          assert errors, "schema admitted a zero-trial failure-side rollout record"

          invalid = copy.deepcopy(fixture)
          invalid["reference_policy_checkpoint_sha256"] = "unresolved"
          errors = list(validator.iter_errors(invalid))
          assert errors, "schema admitted an unresolved reference-policy checkpoint digest"

          invalid = copy.deepcopy(fixture)
          invalid["scene_sides"]["failure_side"]["scene_sha256"] = invalid["scene_sides"]["success_side"]["scene_sha256"]
          # Equality of side digests is a cross-field invariant enforced by the Rust API,
          # not by this JSON Schema; leave it for the runtime/adapter contract.
          print("WorldFailBench adapter JSON Schema and negative controls validated")
          PY

  nixward-cmaq-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check NixWard adapter formatting
        run: rustfmt +1.100.0 --check --edition 2024 crates/core/nixward/src/mind/world_model.rs crates/core/nixward/src/mind/mod.rs
      - name: Diagnose and materialize workspace lock resolution
        run: |
          cargo +1.100.0 metadata --format-version 1 > /dev/null
          echo "Cargo.lock diff produced by current workspace graph:"
          git diff --stat -- Cargo.lock
          git diff -- Cargo.lock | head -n 240
      - name: Run NixWard × CMAQ adapter tests
        run: cargo +1.100.0 test --locked -p nixward --lib "mind::world_model"
      - name: Run strict NixWard library Clippy
        run: cargo +1.100.0 clippy --locked -p nixward --lib -- -D warnings

