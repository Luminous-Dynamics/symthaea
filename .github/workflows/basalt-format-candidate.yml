name: BASALT Trace Verifier Formatting Candidate

on:
  pull_request:
    paths:
      - "tools/basalt-trace-verifier/**"
      - ".github/workflows/basalt-format-candidate.yml"

permissions:
  contents: write
  actions: write

jobs:
  format-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Format standalone verifier files in ephemeral workspace
        run: |
          cargo fmt --manifest-path tools/basalt-trace-verifier/Cargo.toml
          mkdir -p "basalt-formatted/tools/basalt-trace-verifier/src"
          cp tools/basalt-trace-verifier/src/lib.rs "basalt-formatted/tools/basalt-trace-verifier/src/lib.rs"
          cp tools/basalt-trace-verifier/src/main.rs "basalt-formatted/tools/basalt-trace-verifier/src/main.rs"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "basalt-formatted/source-head.txt"
      - name: Commit rustfmt normalization and dispatch exact-head verifier
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/basalt-trace-verifier/src/lib.rs tools/basalt-trace-verifier/src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m "style(basalt): apply pinned rustfmt to trace verifier"
            git push origin "HEAD:refs/heads/$PR_HEAD_REF"
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/basalt-trace-verifier.yml/dispatches" \
            -d "{\"ref\":\"$PR_HEAD_REF\"}"
      - name: Upload formatted source candidate
        uses: actions/upload-artifact@v4
        with:
          name: basalt-rustfmt-candidate-${{ github.sha }}
          path: "basalt-formatted/"
          if-no-files-found: error
          retention-days: 1
