name: WebResearch Independent Outcome Feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/web_research/mod.rs"
      - ".github/workflows/web-research-no-confidence-self-label.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.96 independent-outcome feedback regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Check touched Rust file
        run: rustfmt +1.96.0 --edition 2024 --check src/web_research/mod.rs
      - name: Run WebResearch module tests
        run: cargo test --manifest-path Cargo.toml --locked --no-default-features --features web_research_module --lib web_research::tests
