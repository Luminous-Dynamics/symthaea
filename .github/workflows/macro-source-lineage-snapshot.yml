name: Macro Source Lineage Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-source-lineage-snapshot.yml'
      - 'patches/science/macro-source-lineage-snapshot-v1.patch'
      - 'crates/core/symthaea-core/src/hdc/abstract_thought/dynamic_grammar.rs'
      - 'crates/core/symthaea-core/src/hdc/conjecture_engine.rs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PATCH: patches/science/macro-source-lineage-snapshot-v1.patch

jobs:
  qualify:
    name: Prove positional drift and qualify stable snapshot candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze qualification-only scope
        run: |
          test -f "$PATCH"
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD^"; fi
          git diff --exit-code "$BASE" -- Cargo.toml Cargo.lock crates/core/symthaea-core/src || {
            echo 'macro-lineage qualification branch must not materialize product source'
            exit 1
          }

      - name: Ratchet current positional-lineage design
        run: |
          grep -F 'pub source_conjectures: Vec<usize>' crates/core/symthaea-core/src/hdc/abstract_thought/dynamic_grammar.rs
          grep -F 'finalize_conjectures_after_eml(&mut self.conjectures);' crates/core/symthaea-core/src/hdc/conjecture_engine.rs
          ! grep -F 'source_snapshots_by_operator' crates/core/symthaea-core/src/hdc/abstract_thought/dynamic_grammar.rs

      - name: Prove conjecture-vector indices are not stable identities
        run: |
          mkdir -p crates/core/symthaea-core/tests
          cat > crates/core/symthaea-core/tests/macro_lineage_negative_control.rs <<'RS'
          use symthaea_core::hdc::conjecture_engine::{
              Conjecture, ConjectureEngine, ConjectureStatus, Expr, MacroPromotionTier, MathDomain,
          };

          fn conjecture(source: &str, fitness: f64) -> Conjecture {
              Conjecture {
                  formula: Expr::Var("n".into()),
                  formula_str: "n".into(),
                  source: source.into(),
                  domain: MathDomain::NumberTheory,
                  training_mse: fitness,
                  complexity: 1,
                  fitness,
                  status: ConjectureStatus::NumericallyTested { test_mse: fitness },
                  confidence: 0.8,
                  macro_promotion_tier: MacroPromotionTier::RecurrentNumerical,
                  eml_compiled: None,
                  eml_metrics: None,
                  eml_verified_real: None,
                  eml_real_domain: None,
                  eml_verified_complex: None,
                  eml_constructive_compiled: None,
                  eml_constructive_metrics: None,
                  eml_verified_constructive_real: None,
              }
          }

          #[test]
          fn macro_lineage_negative_control() {
              let mut engine = ConjectureEngine::new();
              engine.conjectures = vec![conjecture("source-a", 2.0), conjecture("source-b", 1.0)];
              let promotion_time_index = 0usize;
              assert_eq!(engine.conjectures[promotion_time_index].source, "source-a");
              engine.conjectures.sort_by(|a, b| a.fitness.partial_cmp(&b.fitness).unwrap());
              assert_eq!(engine.conjectures[promotion_time_index].source, "source-b");
          }
          RS
          cargo test --locked -p symthaea-core --features abstract_thought --test macro_lineage_negative_control
          rm crates/core/symthaea-core/tests/macro_lineage_negative_control.rs

      - name: Validate and apply exact candidate patch
        run: |
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check

      - name: Ratchet stable-lineage semantics
        run: |
          FILE=crates/core/symthaea-core/src/hdc/abstract_thought/dynamic_grammar.rs
          grep -F 'pub struct MacroSourceSnapshot' "$FILE"
          grep -F 'source_snapshots_by_operator' "$FILE"
          grep -F 'pub fn source_snapshots(&self, canonical: &str)' "$FILE"
          grep -F 'source_tag: conjecture.source.clone()' "$FILE"
          grep -F 'parent_formula: conjecture_parent_formula_identity(conjecture)' "$FILE"
          grep -F 'pub source_conjectures: Vec<usize>' "$FILE"
          ! grep -F 'independent sources' "$FILE"
          ! grep -F 'independently verified conjectures' "$FILE"

      - name: Exercise promotion-time snapshot across later reorder
        run: |
          cat > crates/core/symthaea-core/tests/macro_lineage_candidate.rs <<'RS'
          use symthaea_core::hdc::abstract_thought::dynamic_grammar::DynamicGrammar;
          use symthaea_core::hdc::conjecture_engine::{
              BinOp, Conjecture, ConjectureEngine, ConjectureStatus, Expr, MacroPromotionTier,
              MathDomain,
          };

          fn conjecture(source: &str, fitness: f64, formula: Expr) -> Conjecture {
              Conjecture {
                  formula_str: format!("{formula}"),
                  complexity: formula.complexity(),
                  formula,
                  source: source.into(),
                  domain: MathDomain::NumberTheory,
                  training_mse: fitness,
                  fitness,
                  status: ConjectureStatus::NumericallyTested { test_mse: fitness },
                  confidence: 0.8,
                  macro_promotion_tier: MacroPromotionTier::RecurrentNumerical,
                  eml_compiled: None,
                  eml_metrics: None,
                  eml_verified_real: None,
                  eml_real_domain: None,
                  eml_verified_complex: None,
                  eml_constructive_compiled: None,
                  eml_constructive_metrics: None,
                  eml_verified_constructive_real: None,
              }
          }

          #[test]
          fn macro_source_snapshot_survives_engine_reorder() {
              let pattern = Expr::BinOp(
                  BinOp::Add,
                  Box::new(Expr::Var("n".into())),
                  Box::new(Expr::Const(1.0)),
              );
              let mut engine = ConjectureEngine::new();
              engine.conjectures.push(conjecture("source-a", 2.0, pattern.clone()));

              let mut grammar = DynamicGrammar::new();
              grammar.min_occurrences = 1;
              grammar.min_sources = 1;
              grammar.min_verified = 1;
              grammar.observe_subtree(pattern, &[0], &engine);
              grammar.promote_eligible(&engine);
              assert_eq!(grammar.operators.len(), 1);

              let canonical = grammar.operators[0].canonical.clone();
              let before = grammar.source_snapshots(&canonical).to_vec();
              assert_eq!(before.len(), 1);
              assert_eq!(before[0].source_tag, "source-a");

              engine.conjectures.push(conjecture("source-b", 1.0, Expr::Var("n".into())));
              engine.conjectures.sort_by(|a, b| a.fitness.partial_cmp(&b.fitness).unwrap());
              assert_eq!(engine.conjectures[0].source, "source-b");
              assert_eq!(grammar.operators[0].source_conjectures, vec![0]);

              let after = grammar.source_snapshots(&canonical);
              assert_eq!(after, before.as_slice());
              assert_eq!(after[0].source_tag, "source-a");
          }
          RS
          cargo test --locked -p symthaea-core --features abstract_thought --test macro_lineage_candidate
          rm crates/core/symthaea-core/tests/macro_lineage_candidate.rs

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format and compile candidate
        run: |
          cargo fmt --check -p symthaea-core
          cargo check --locked -p symthaea-core --features abstract_thought
          cargo clippy --locked -p symthaea-core --lib --features abstract_thought -- -D warnings

      - name: Evidence boundary
        run: |
          echo 'PASS establishes only that promotion-time source/formula snapshots remain stable across later conjecture-vector reordering for the qualified path.'
          echo 'It does not establish dataset independence, evidence independence, macro-assisted conjecture lineage propagation, scientific replication, or claim truth.'
