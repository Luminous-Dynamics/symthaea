name: CMAQ-001 factor-composition generator

on:
  pull_request:
    paths:
      - "research/cmaq-001/generator/**"
      - ".github/workflows/cmaq-001-generator.yml"
  push:
    branches:
      - main
    paths:
      - "research/cmaq-001/generator/**"
      - ".github/workflows/cmaq-001-generator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Unit tests
        working-directory: research/cmaq-001/generator
        run: cargo test --locked
      - name: Deterministic generation smoke test
        working-directory: research/cmaq-001/generator
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cargo run --quiet --locked -- --seed 4242 --factors 8 --radius 2 --out "$tmp/first"
          cargo run --quiet --locked -- --seed 4242 --factors 8 --radius 2 --out "$tmp/second"
          diff -ru "$tmp/first" "$tmp/second"
          grep -F '"schema_version": "cmaq-causal-factor-generator-v1"' "$tmp/first/manifest.json"
          grep -F '"schema_version":"cmaq-causal-generator-report-v1"' <<< "$(cargo run --quiet --locked -- --seed 4242 --factors 8 --radius 2 --out "$tmp/third")"
