name: Scientific Reconstruction Authoring Temp

on:
  push:
    branches:
      - ci/scientific-reconstruction-authoring-temp

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout construction subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Apply authority fixes and format
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path('crates/core/symthaea-scientific-replay/src/qualified_reconstruction.rs')
          text = module.read_text()

          # Synthetic fixtures prove the reconstruction protocol shape. They do
          # not mint the production-reserved scientific replay capabilities.
          text = text.replace(
              'QualifiedScientificReconstructionV1',
              'QualifiedScientificReconstructionFixtureV1',
          )
          text = text.replace(
              'ReplayVerifiedScientificDispositionV1',
              'ReplayVerifiedScientificDispositionFixtureV1',
          )
          text = text.replace(
              'verify_replay_scientific_disposition_v1',
              'verify_replay_scientific_disposition_fixture_v1',
          )
          text = text.replace(
              'PredicateDerivationReceiptV1',
              'PredicateDerivationReceiptFixtureV1',
          )
          text = text.replace(
              'ScientificReconstructionMaterialV1',
              'ScientificReconstructionFixtureMaterialV1',
          )

          old = '    node_contributions: BTreeMap<String, Option<String>>,\n'
          assert old in text
          text = text.replace(old, '', 1)

          old = "    for candidate in view.candidates.values() {\n        if node_contributions.get(&candidate.reason_id)\n            != Some(&Some(candidate.contribution_id.clone()))\n        {\n            return Err(ReconstructionErrorV1::CandidateReasonMismatch {\n                contribution_id: candidate.contribution_id.clone(),\n                reason_id: candidate.reason_id.clone(),\n            });\n        }\n    }\n"
          new = "    for candidate in view.candidates.values() {\n        match node_contributions.get(&candidate.reason_id) {\n            Some(Some(contribution_id)) if contribution_id == &candidate.contribution_id => {}\n            _ => {\n                return Err(ReconstructionErrorV1::CandidateReasonMismatch {\n                    contribution_id: candidate.contribution_id.clone(),\n                    reason_id: candidate.reason_id.clone(),\n                });\n            }\n        }\n    }\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = '        node_contributions,\n        canonical_nodes,\n'
          new = '        canonical_nodes,\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = '                if dependencies.as_slice() != [source_predicate_id.as_str()] {\n'
          new = '                if dependencies.len() != 1 || dependencies.first() != Some(source_predicate_id) {\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = "fn build_policy(\n    fixture: &DispositionPolicyFixtureV1,\n) -> Result<DispositionPolicyV1, ReconstructionErrorV1> {\n"
          new = "fn build_policy(\n    fixture: &DispositionPolicyFixtureV1,\n    scientific_use_id: &str,\n) -> Result<DispositionPolicyV1, ReconstructionErrorV1> {\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = '    let mut parts = vec![canonical.profile_id.clone(), canonical.fallback_output.clone()];\n'
          new = '    let mut parts = vec![\n        scientific_use_id.to_string(),\n        canonical.profile_id.clone(),\n        canonical.fallback_output.clone(),\n    ];\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = '    let policy = build_policy(&fixture.policy)?;\n'
          new = '    let policy = build_policy(&fixture.policy, &scientific_use_id)?;\n'
          assert old in text
          text = text.replace(old, new, 1)

          # Make the authority ceiling explicit in source, not merely prose.
          marker = 'pub const PREDICATE_DERIVATION_FIXTURE_PROFILE_V1: &str =\n    "symthaea.science.predicate-derivation.fixture.v1";\n'
          assert marker in text
          ceiling = marker + '\n// Reserved production capability names are intentionally absent from this\n// synthetic tranche. Real qualified upstream capabilities must own them later.\n'
          text = text.replace(marker, ceiling, 1)

          module.write_text(text)

          lib = Path('crates/core/symthaea-scientific-replay/src/lib.rs')
          lib_text = lib.read_text()
          marker = '#![forbid(unsafe_code)]\n'
          assert marker in lib_text
          assert 'pub mod qualified_reconstruction;' not in lib_text
          lib_text = lib_text.replace(
              marker,
              marker + '\n/// SCI-014A synthetic reconstruction protocol qualification.\npub mod qualified_reconstruction;\n',
              1,
          )
          lib.write_text(lib_text)
          PY

          cargo fmt -p symthaea-scientific-replay

          changed="$(git diff --name-only)"
          test "$changed" = $'crates/core/symthaea-scientific-replay/src/lib.rs\ncrates/core/symthaea-scientific-replay/src/qualified_reconstruction.rs'

      - name: Commit normalized construction candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Symthaea CI Authoring Candidate'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/core/symthaea-scientific-replay/src/lib.rs crates/core/symthaea-scientific-replay/src/qualified_reconstruction.rs
          git commit -m 'style(science): normalize qualified reconstruction candidate'
          git push origin HEAD:ci/scientific-reconstruction-authoring-temp
