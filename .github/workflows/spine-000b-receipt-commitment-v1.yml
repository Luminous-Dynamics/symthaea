name: SPINE-000B Receipt Commitment v1

on:
  push:
    branches:
      - research/spine-000b-receipt-commitment-v1
  pull_request:
    branches:
      - research/spine-000b-runtime-contract-r2
    paths:
      - '.github/workflows/spine-000b-receipt-commitment-v1.yml'
      - 'docs/research/SPINE_000B_RECEIPT_COMMITMENT_V1.md'
      - 'scripts/spine_000b_receipt_commitment_oracle.py'
      - 'scripts/verify_spine_000b_receipt_commitment_v1.py'
      - 'tests/fixtures/spine_000b_receipt_commitment_v1_vectors.json'

permissions:
  contents: read

jobs:
  commitment:
    name: Freeze canonical receipt bytes and vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact checkout
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > /tmp/spine_c1_expected_head
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1 > /tmp/spine_c1_pre_status
          test ! -s /tmp/spine_c1_pre_status

      - name: Constrain commitment-only subject
        shell: bash
        run: |
          set -euo pipefail
          base=c4953c27ccd15eca868916567acbd9228924f4c4
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base"..HEAD | sort > /tmp/spine_c1_changed
          cat > /tmp/spine_c1_allowed <<'EOF'
          .github/workflows/spine-000b-receipt-commitment-v1.yml
          docs/research/SPINE_000B_RECEIPT_COMMITMENT_V1.md
          scripts/spine_000b_receipt_commitment_oracle.py
          scripts/verify_spine_000b_receipt_commitment_v1.py
          tests/fixtures/spine_000b_receipt_commitment_v1_vectors.json
          EOF
          sort -o /tmp/spine_c1_allowed /tmp/spine_c1_allowed
          comm -23 /tmp/spine_c1_changed /tmp/spine_c1_allowed > /tmp/spine_c1_unexpected
          if test -s /tmp/spine_c1_unexpected; then
            echo 'Unexpected SPINE-000B-C1 subject files:' >&2
            cat /tmp/spine_c1_unexpected >&2
            exit 1
          fi

      - name: Syntax-check independent instruments
        run: |
          python3 -m py_compile \
            scripts/spine_000b_receipt_commitment_oracle.py \
            scripts/verify_spine_000b_receipt_commitment_v1.py
          python3 -m json.tool tests/fixtures/spine_000b_receipt_commitment_v1_vectors.json > /dev/null

      - name: Verify contract and exact golden vectors
        run: python3 scripts/verify_spine_000b_receipt_commitment_v1.py

      - name: Seal exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/spine-000b-c1
          {
            echo "schema=symthaea.spine.000b.receipt-commitment-contract.v1"
            echo "git_head=$(git rev-parse HEAD)"
            echo "git_tree=$(git write-tree)"
            echo "base_runtime_contract=c4953c27ccd15eca868916567acbd9228924f4c4"
            echo "authority=measurement-only"
            echo "status=FORMAT_FROZEN"
            echo "rust_equivalence_pending=true"
            echo "runtime_evidence_claimed=false"
            echo "causal_load_claimed=false"
          } > artifacts/spine-000b-c1/subject.txt
          cp /tmp/spine_c1_changed artifacts/spine-000b-c1/changed-files.txt
          sha256sum \
            docs/research/SPINE_000B_RECEIPT_COMMITMENT_V1.md \
            scripts/spine_000b_receipt_commitment_oracle.py \
            scripts/verify_spine_000b_receipt_commitment_v1.py \
            tests/fixtures/spine_000b_receipt_commitment_v1_vectors.json \
            artifacts/spine-000b-c1/subject.txt \
            > artifacts/spine-000b-c1/SHA256SUMS

      - name: Postflight checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat /tmp/spine_c1_expected_head)"
          git status --porcelain=v1 > /tmp/spine_c1_post_status
          test ! -s /tmp/spine_c1_post_status

      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: spine-000b-c1-${{ github.sha }}
          path: artifacts/spine-000b-c1/
          retention-days: 90
