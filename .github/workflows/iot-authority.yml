name: IoT Authority

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-authority/**'
      - 'crates/core/symthaea-action-runtime/**'
      - 'crates/core/symthaea-action-checkpoint/**'
      - 'crates/bridges/symthaea-iot-authority/**'
      - 'crates/bridges/symthaea-iot-execution/**'
      - 'crates/bridges/symthaea-iot-runtime/**'
      - 'crates/bridges/symthaea-iot-durable-runtime/**'
      - 'src/swarm/mesh/sensor_iot.rs'
      - 'src/cognitive_loop/managers/survival_manager.rs'
      - '.github/workflows/iot-authority.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

# The small authority/runtime crates declare Rust 1.94 MSRV. Root Symthaea is
# intentionally a separate integration claim and follows the repository-pinned
# 1.96 toolchain because current root dependencies require Rust >= 1.95.
env:
  RUSTUP_TOOLCHAIN: 1.94.0

concurrency:
  group: iot-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-format:
    name: IoT security source format
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install workspace Rust formatter
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.96.0'
          cargo --version | grep -F 'cargo 1.96.0'

      - name: Check parser, trust-boundary, and durable-runtime formatting
        run: >-
          rustfmt --edition 2024 --check
          src/swarm/mesh/sensor_iot.rs
          src/cognitive_loop/managers/survival_manager.rs
          crates/bridges/symthaea-iot-durable-runtime/src/lib.rs

  runtime-implementation:
    name: IoT durable runtime implementation (MSRV 1.94)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Rust compiler
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.94.0'
          cargo --version | grep -F 'cargo 1.94.0'

      - name: Workspace metadata resolves
        run: cargo metadata --format-version 1 --no-deps >/dev/null

      - name: Check merged authority/runtime/IoT stack
        run: >-
          cargo check
          -p symthaea-authority
          -p symthaea-action-runtime
          -p symthaea-action-checkpoint
          -p symthaea-iot-authority
          -p symthaea-iot-execution
          -p symthaea-iot-runtime
          -p symthaea-iot-durable-runtime
          --all-targets

      - name: Test merged authority/runtime/IoT stack
        run: >-
          cargo test
          -p symthaea-authority
          -p symthaea-action-runtime
          -p symthaea-action-checkpoint
          -p symthaea-iot-authority
          -p symthaea-iot-execution
          -p symthaea-iot-runtime
          -p symthaea-iot-durable-runtime
          --all-targets

      - name: Clippy merged authority/runtime/IoT stack
        run: >-
          cargo clippy
          -p symthaea-authority
          -p symthaea-action-runtime
          -p symthaea-action-checkpoint
          -p symthaea-iot-authority
          -p symthaea-iot-execution
          -p symthaea-iot-runtime
          -p symthaea-iot-durable-runtime
          --all-targets -- -D warnings

  telemetry-boundary:
    name: IoT parser and survival trust boundary (workspace 1.96)
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install workspace Rust compiler
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.96.0'
          cargo --version | grep -F 'cargo 1.96.0'

      - name: Focused sensor parser/resource regressions
        run: cargo test -p symthaea --no-default-features --features survival --lib sensor_iot::tests

      - name: Focused survival-manager trust regressions
        run: cargo test -p symthaea --no-default-features --features survival --lib survival_manager::tests

  locked-metadata:
    name: IoT runtime locked metadata (MSRV 1.94)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.94.0'
          cargo --version | grep -F 'cargo 1.94.0'

      - name: Committed lock resolves without mutation
        run: |
          before=$(sha256sum Cargo.lock | awk '{print $1}')
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          after=$(sha256sum Cargo.lock | awk '{print $1}')
          test "$before" = "$after"
          git diff --exit-code -- Cargo.lock
