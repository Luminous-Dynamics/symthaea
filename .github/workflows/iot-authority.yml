name: IoT Authority

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-authority/**'
      - 'crates/bridges/symthaea-iot-authority/**'
      - '.github/workflows/iot-authority.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.94.0

concurrency:
  group: iot-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-format:
    name: IoT authority source format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Rust formatter
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.94.0'
          cargo --version | grep -F 'cargo 1.94.0'

      # #279 owns formatting of symthaea-authority. This PR's format claim is
      # deliberately scoped to the source introduced by this IoT tranche.
      - name: Check IoT source formatting
        run: rustfmt --edition 2024 --check crates/bridges/symthaea-iot-authority/src/lib.rs

  implementation:
    name: IoT authority implementation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Rust compiler
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.94.0'
          cargo --version | grep -F 'cargo 1.94.0'

      # Compiler/test/lint evidence is independent of source-format evidence so
      # formatting drift cannot hide semantic/compiler failures.
      - name: Workspace metadata resolves
        run: cargo metadata --format-version 1 --no-deps >/dev/null

      - name: Check
        run: cargo check -p symthaea-authority -p symthaea-iot-authority --all-targets

      - name: Test
        run: cargo test -p symthaea-authority -p symthaea-iot-authority --all-targets

      - name: Clippy
        run: cargo clippy -p symthaea-authority -p symthaea-iot-authority --all-targets -- -D warnings

  locked-metadata:
    name: IoT authority locked metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.94.0'
          cargo --version | grep -F 'cargo 1.94.0'

      - name: Committed lock resolves without mutation
        run: |
          before=$(sha256sum Cargo.lock | awk '{print $1}')
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          after=$(sha256sum Cargo.lock | awk '{print $1}')
          test "$before" = "$after"
          git diff --exit-code -- Cargo.lock
