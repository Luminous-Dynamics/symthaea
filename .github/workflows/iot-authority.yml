name: IoT Authority

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-authority/**'
      - 'crates/bridges/symthaea-iot-authority/**'
      - '.github/workflows/iot-authority.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iot-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  implementation:
    name: IoT authority implementation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
          rustup default 1.94.0
          rustc --version
          cargo --version

      - name: Verify exact checkout
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      # This lane establishes compiler/test/lint evidence even while the workspace
      # lockfile status is reported independently below. It must not be cited as a
      # locked-resolution/reproducibility claim.
      - name: Workspace metadata resolves
        run: cargo metadata --format-version 1 --no-deps >/dev/null

      - name: Rustfmt
        run: cargo fmt --check -p symthaea-authority -p symthaea-iot-authority

      - name: Check
        run: cargo check -p symthaea-authority -p symthaea-iot-authority --all-targets

      - name: Test
        run: cargo test -p symthaea-authority -p symthaea-iot-authority --all-targets

      - name: Clippy
        run: cargo clippy -p symthaea-authority -p symthaea-iot-authority --all-targets -- -D warnings

  locked-metadata:
    name: IoT authority locked metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Verify exact checkout
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      # Separate claim: the committed dependency graph must already resolve.
      # This job never repairs Cargo.lock on the runner.
      - name: Committed lock resolves without mutation
        run: |
          before=$(sha256sum Cargo.lock | awk '{print $1}')
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          after=$(sha256sum Cargo.lock | awk '{print $1}')
          test "$before" = "$after"
          git diff --exit-code -- Cargo.lock
