name: IoT Authority

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-authority/**'
      - 'crates/core/symthaea-action-runtime/**'
      - 'crates/core/symthaea-action-checkpoint/**'
      - 'crates/bridges/symthaea-iot-authority/**'
      - 'crates/bridges/symthaea-iot-execution/**'
      - 'crates/bridges/symthaea-iot-runtime/**'
      - 'src/swarm/mesh/sensor_iot.rs'
      - 'src/cognitive_loop/managers/survival_manager.rs'
      - '.github/workflows/iot-authority.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.94.0

concurrency:
  group: iot-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-format:
    name: IoT runtime source format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Rust formatter
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.94.0'
          cargo --version | grep -F 'cargo 1.94.0'

      # Parent PRs own formatting of authority/execution/runtime substrate source.
      - name: Check IoT runtime bridge formatting
        run: rustfmt --edition 2024 --check crates/bridges/symthaea-iot-runtime/src/lib.rs

  runtime-implementation:
    name: IoT crash-safe runtime implementation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Rust compiler
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.94.0'
          cargo --version | grep -F 'cargo 1.94.0'

      - name: Workspace metadata resolves
        run: cargo metadata --format-version 1 --no-deps >/dev/null

      - name: Check merged authority/runtime/IoT stack
        run: >-
          cargo check
          -p symthaea-authority
          -p symthaea-action-runtime
          -p symthaea-action-checkpoint
          -p symthaea-iot-authority
          -p symthaea-iot-execution
          -p symthaea-iot-runtime
          --all-targets

      - name: Test merged authority/runtime/IoT stack
        run: >-
          cargo test
          -p symthaea-authority
          -p symthaea-action-runtime
          -p symthaea-action-checkpoint
          -p symthaea-iot-authority
          -p symthaea-iot-execution
          -p symthaea-iot-runtime
          --all-targets

      - name: Clippy merged authority/runtime/IoT stack
        run: >-
          cargo clippy
          -p symthaea-authority
          -p symthaea-action-runtime
          -p symthaea-action-checkpoint
          -p symthaea-iot-authority
          -p symthaea-iot-execution
          -p symthaea-iot-runtime
          --all-targets -- -D warnings

  telemetry-boundary:
    name: Survival telemetry trust boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Rust compiler
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.94.0'
          cargo --version | grep -F 'cargo 1.94.0'

      - name: Focused survival-manager regressions
        run: cargo test -p symthaea --no-default-features --features survival --lib survival_manager::tests

  locked-metadata:
    name: IoT runtime locked metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Verify exact checkout and toolchain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          rustc --version | grep -F 'rustc 1.94.0'
          cargo --version | grep -F 'cargo 1.94.0'

      - name: Committed lock resolves without mutation
        run: |
          before=$(sha256sum Cargo.lock | awk '{print $1}')
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          after=$(sha256sum Cargo.lock | awk '{print $1}')
          test "$before" = "$after"
          git diff --exit-code -- Cargo.lock
