name: Beverage Benchmark Contract

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-culinary/**"
      - "tools/beverage-benchmark-harness/**"
      - "docs/research/BEVERAGE_ENGINEERING_BENCHMARK_V1.md"
      - "docs/research/beverage-engineering-scenarios-v1.json"
      - "docs/research/beverage-engineering-scenarios-v1.schema.json"
      - "docs/research/beverage-data-sources-v1.json"
      - "docs/research/beverage-split-manifest-v1.schema.json"
      - "docs/research/beverage-split-manifest-synthetic-v1.json"
      - "docs/research/beverage-decision-value-v1.schema.json"
      - "docs/research/beverage-decision-value-synthetic-v1.json"
      - ".github/workflows/beverage-benchmark.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symthaea-culinary/**"
      - "tools/beverage-benchmark-harness/**"
      - "docs/research/BEVERAGE_ENGINEERING_BENCHMARK_V1.md"
      - "docs/research/beverage-engineering-scenarios-v1.json"
      - "docs/research/beverage-engineering-scenarios-v1.schema.json"
      - "docs/research/beverage-data-sources-v1.json"
      - "docs/research/beverage-split-manifest-v1.schema.json"
      - "docs/research/beverage-split-manifest-synthetic-v1.json"
      - "docs/research/beverage-decision-value-v1.schema.json"
      - "docs/research/beverage-decision-value-synthetic-v1.json"
      - ".github/workflows/beverage-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beverage-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    name: Synthetic Corpus Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format focused runners
        run: |
          rustfmt --edition 2024 --check crates/domains/symthaea-culinary/src/bin/beverage_benchmark_receipt.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-culinary/src/bin/wine_quality_source_audit.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-culinary/src/bin/fermentation_time_series_audit.rs
          rustfmt --edition 2024 --check tools/beverage-benchmark-harness/src/bin/schema_contract_audit.rs
          rustfmt --edition 2024 --check tools/beverage-benchmark-harness/src/bin/split_leakage_audit.rs
          rustfmt --edition 2024 --check tools/beverage-benchmark-harness/src/bin/decision_value_audit.rs
          rustfmt --edition 2024 --check tools/beverage-benchmark-harness/src/bin/adaptive_sampling_policy_audit.rs

      - name: Test synthetic receipt contract
        run: cargo test --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin beverage_benchmark_receipt

      - name: Test wine source auditor
        run: cargo test --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin wine_quality_source_audit

      - name: Test fermentation time-series intake auditor
        run: cargo test --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin fermentation_time_series_audit

      - name: Test full Draft 2020-12 schema auditor
        run: cargo test --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin schema_contract_audit

      - name: Test split leakage auditor
        run: cargo test --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin split_leakage_audit

      - name: Test decision-value auditor
        run: cargo test --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin decision_value_audit

      - name: Test adaptive-sampling policy auditor
        run: cargo test --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin adaptive_sampling_policy_audit

      - name: Independently validate synthetic corpus schema
        run: |
          cargo run --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin schema_contract_audit -- \
            --schema docs/research/beverage-engineering-scenarios-v1.schema.json \
            --instance docs/research/beverage-engineering-scenarios-v1.json \
            --out "$RUNNER_TEMP/beverage-schema-receipt.json"
          cat "$RUNNER_TEMP/beverage-schema-receipt.json"

      - name: Independently validate split manifest schema
        run: |
          cargo run --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin schema_contract_audit -- \
            --schema docs/research/beverage-split-manifest-v1.schema.json \
            --instance docs/research/beverage-split-manifest-synthetic-v1.json \
            --out "$RUNNER_TEMP/beverage-split-schema-receipt.json"
          cat "$RUNNER_TEMP/beverage-split-schema-receipt.json"

      - name: Independently validate decision-value schema and fixture
        run: |
          cargo run --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin schema_contract_audit -- \
            --schema docs/research/beverage-decision-value-v1.schema.json \
            --instance docs/research/beverage-decision-value-synthetic-v1.json \
            --out "$RUNNER_TEMP/beverage-decision-schema-receipt.json"
          cat "$RUNNER_TEMP/beverage-decision-schema-receipt.json"

      - name: Independently validate adaptive-sampling decision schema and fixture
        run: |
          cargo run --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin schema_contract_audit -- \\
            --schema docs/research/beverage-adaptive-sampling-decision-v1.schema.json \\
            --instance docs/research/beverage-adaptive-sampling-decision-synthetic-v1.json \\
            --out "$RUNNER_TEMP/beverage-adaptive-sampling-schema-receipt.json"
          cat "$RUNNER_TEMP/beverage-adaptive-sampling-schema-receipt.json"

      - name: Audit synthetic adaptive-sampling decision
        run: |
          cargo run --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin adaptive_sampling_policy_audit -- \\
            --input docs/research/beverage-adaptive-sampling-decision-synthetic-v1.json \\
            --out "$RUNNER_TEMP/beverage-adaptive-sampling-decision-receipt.json"
          cat "$RUNNER_TEMP/beverage-adaptive-sampling-decision-receipt.json"

      - name: Audit synthetic decision-value contract
        run: |
          cargo run --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin decision_value_audit -- \
            --input docs/research/beverage-decision-value-synthetic-v1.json \
            --out "$RUNNER_TEMP/beverage-decision-receipt.json"
          cat "$RUNNER_TEMP/beverage-decision-receipt.json"

      - name: Audit synthetic split manifest
        run: |
          cargo run --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin split_leakage_audit -- \
            --input docs/research/beverage-split-manifest-synthetic-v1.json \
            --out "$RUNNER_TEMP/beverage-split-receipt.json"
          cat "$RUNNER_TEMP/beverage-split-receipt.json"

      - name: Clippy focused runners
        run: |
          cargo clippy --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin beverage_benchmark_receipt -- -D warnings
          cargo clippy --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin wine_quality_source_audit -- -D warnings
          cargo clippy --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin fermentation_time_series_audit -- -D warnings
          cargo clippy --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin schema_contract_audit -- -D warnings
          cargo clippy --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin split_leakage_audit -- -D warnings
          cargo clippy --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin decision_value_audit -- -D warnings
          cargo clippy --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin adaptive_sampling_policy_audit -- -D warnings

      - name: Emit exact-head receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo run --manifest-path tools/beverage-benchmark-harness/Cargo.toml --bin beverage_benchmark_receipt -- \
            --corpus docs/research/beverage-engineering-scenarios-v1.json \
            --schema docs/research/beverage-engineering-scenarios-v1.schema.json \
            --expected-head "$EXPECTED_HEAD" \
            --out "$RUNNER_TEMP/beverage-benchmark-receipt.json"
          cat "$RUNNER_TEMP/beverage-benchmark-receipt.json"
