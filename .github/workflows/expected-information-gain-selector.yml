name: Expected Information Gain Selector

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/core/symthaea-core/src/hdc/conjecture_engine.rs"
      - "crates/core/symthaea-core/src/hdc/conjecture_engine/experiment_selection.rs"
      - "crates/bridges/symthaea-physics-bridge/src/integrated_discovery.rs"
      - "crates/bridges/symthaea-physics-bridge/src/model_adequacy.rs"
      - "crates/bridges/symthaea-physics-bridge/src/adequacy_calibration.rs"
      - "crates/bridges/symthaea-physics-bridge/src/sequential_adequacy.rs"
      - "crates/bridges/symthaea-physics-bridge/src/predictive_rank_martingale.rs"
      - "crates/bridges/symthaea-physics-bridge/src/prequential_pit_martingale.rs"
      - "crates/bridges/symthaea-physics-bridge/tests/adaptive_monitoring_benchmark.rs"
      - "crates/bridges/symthaea-physics-bridge/tests/model_adequacy_contract.rs"
      - "crates/bridges/symthaea-physics-bridge/src/lib.rs"
      - "docs/research/EXPECTED_INFORMATION_GAIN_SELECTOR_V0_1.md"
      - "docs/research/ROBUST_INFORMATION_GAIN_MODEL_SCENARIOS_V0_1.md"
      - "docs/research/CALIBRATED_MODEL_ADEQUACY_AUDITS_V0_1.md"
      - "docs/research/SEQUENTIAL_MODEL_ADEQUACY_MONITOR_V0_1.md"
      - "docs/research/PREDICTIVE_RANK_MARTINGALE_V0_1.md"
      - "docs/research/PREQUENTIAL_PIT_MARTINGALE_V0_1.md"
      - "docs/research/ADAPTIVE_MONITORING_COMPARATIVE_BENCHMARK_V0_1.md"
      - "docs/research/INTEGRATED_PREQUENTIAL_DISCOVERY_V0_1.md"
      - ".github/workflows/expected-information-gain-selector.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expected-information-gain-selector-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused selector tests and strict Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format focused selector and integration benchmark
        run: |
          rustfmt --edition 2024 --check crates/core/symthaea-core/src/hdc/conjecture_engine/experiment_selection.rs
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/integrated_discovery.rs
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/model_adequacy.rs
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/adequacy_calibration.rs
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/sequential_adequacy.rs
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/predictive_rank_martingale.rs
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/prequential_pit_martingale.rs
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/tests/adaptive_monitoring_benchmark.rs
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/tests/model_adequacy_contract.rs
      - name: Test information-gain selector
        run: cargo test -p symthaea-core hdc::conjecture_engine::experiment_selection --lib
      - name: Run paired law-discovery selector pilot
        run: cargo test -p symthaea-physics-bridge expected_information_gain_vs_variance_on_paired_seeds --lib -- --nocapture
      - name: Test conformal adequacy calibration
        run: cargo test -p symthaea-physics-bridge adequacy_calibration --lib
      - name: Test finite-horizon sequential adequacy monitor
        run: cargo test -p symthaea-physics-bridge sequential_adequacy --lib
      - name: Test predictive-rank martingale detector
        run: cargo test -p symthaea-physics-bridge predictive_rank_martingale --lib
      - name: Test prequential PIT martingale
        run: cargo test -p symthaea-physics-bridge prequential_pit_martingale --lib
      - name: Run paired adaptive monitoring benchmark
        run: cargo test -p symthaea-physics-bridge --test adaptive_monitoring_benchmark -- --nocapture
      - name: Test model-adequacy decision semantics
        run: cargo test -p symthaea-physics-bridge model_adequacy --lib
      - name: Test exhaustive model-adequacy contract
        run: cargo test -p symthaea-physics-bridge --test model_adequacy_contract
      - name: Run conformal adequacy pilot
        run: cargo test -p symthaea-physics-bridge conformal_adequacy_calibration_reports_clean_and_perturbed_audit_rates --lib -- --nocapture
      - name: Run model-misspecification audit pilot
        run: cargo test -p symthaea-physics-bridge scheduled_audits_measure_false_confidence_under_model_misspecification --lib -- --nocapture
      - name: Test adaptive prequential PIT discovery integration
        run: cargo test -p symthaea-physics-bridge prequential_pit_audits_are_wired_into_adaptive_discovery --lib -- --nocapture
      - name: Reject invalid PIT smoothing protocol
        run: cargo test -p symthaea-physics-bridge prequential_pit_policy_rejects_smoothed_measurements --lib
      - name: Test bounded typed recovery after PIT alarms
        run: cargo test -p symthaea-physics-bridge post_alarm_recovery_reopens_archived_candidates_and_adds_typed_candidates --lib
      - name: Test structured recovery dimensional validity
        run: cargo test -p symthaea-physics-bridge structured_recovery_families_preserve_energy_dimensions --lib
      - name: Test residual-guided correction scoring
        run: cargo test -p symthaea-physics-bridge empirical_recovery_score_rewards_a_structured_correction_on_observed_residuals --lib
      - name: Test fitted correction coefficient recovery
        run: cargo test -p symthaea-physics-bridge fitted_correction_coefficient_recovers_known_scalar_on_synthetic_residuals --lib
      - name: Test evaluator-only held-out law equivalence
        run: cargo test -p symthaea-physics-bridge evaluator_equivalence_requires_independent_heldout_points --lib
      - name: Test oracle-equivalence audit across domains
        run: cargo test -p symthaea-physics-bridge oracle_equivalence_audit_requires_both_in_domain_and_ood_match --lib
      - name: Test evaluator-only extrapolation design
        run: cargo test -p symthaea-physics-bridge extrapolation_design_is_outside_every_training_variable_interval --lib
      - name: Test extrapolation law equivalence
        run: cargo test -p symthaea-physics-bridge extrapolation_equivalence_distinguishes_an_equivalent_law_from_a_shift --lib
      - name: Benchmark truth-absent recovery without oracle candidates
        run: cargo test -p symthaea-physics-bridge truth_absent_recovery_is_reported_separately_from_oracle_present_discrimination --lib -- --nocapture
      - name: Run robust noise-envelope pilot
        run: cargo test -p symthaea-physics-bridge scenario_robust_eig_vs_nominal_eig_pilot --lib -- --nocapture
      - name: Strict Clippy for the core library
        run: cargo clippy -p symthaea-core --lib -- -D warnings
