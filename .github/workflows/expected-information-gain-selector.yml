name: Expected Information Gain Selector

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/core/symthaea-core/src/hdc/conjecture_engine.rs"
      - "crates/core/symthaea-core/src/hdc/conjecture_engine/experiment_selection.rs"
      - "crates/bridges/symthaea-physics-bridge/src/integrated_discovery.rs"
      - "crates/bridges/symthaea-physics-bridge/src/model_adequacy.rs"
      - "crates/bridges/symthaea-physics-bridge/src/adequacy_calibration.rs"
      - "crates/bridges/symthaea-physics-bridge/src/feature_shift.rs"
      - "crates/bridges/symthaea-physics-bridge/src/random_projection_shift.rs"
      - "crates/bridges/symthaea-physics-bridge/src/detector_panel.rs"
      - "crates/bridges/symthaea-physics-bridge/src/delayed_outcome_validation.rs"
      - "crates/bridges/symthaea-physics-bridge/tests/delayed_outcome_benchmark.rs"
      - "docs/research/DELAYED_OUTCOME_BENCHMARK_V0_1.md"
      - "crates/bridges/symthaea-physics-bridge/tests/diagnostic_fusion_benchmark.rs"
      - "crates/bridges/symthaea-physics-bridge/src/sequential_adequacy.rs"
      - "crates/bridges/symthaea-physics-bridge/tests/model_adequacy_contract.rs"
      - "crates/bridges/symthaea-physics-bridge/src/lib.rs"
      - "docs/research/EXPECTED_INFORMATION_GAIN_SELECTOR_V0_1.md"
      - "docs/research/ROBUST_INFORMATION_GAIN_MODEL_SCENARIOS_V0_1.md"
      - "docs/research/CALIBRATED_MODEL_ADEQUACY_AUDITS_V0_1.md"
      - "docs/research/SEQUENTIAL_MODEL_ADEQUACY_MONITOR_V0_1.md"
      - "docs/research/RANDOM_PROJECTION_FEATURE_SHIFT_V0_1.md"
      - "docs/research/REFERENCE_FREE_DETECTOR_PANEL_V0_1.md"
      - "docs/research/STRATIFIED_PROBE_DETECTOR_PANEL_V0_1.md"
      - "docs/research/DELAYED_OUTCOME_VALIDATION_V0_1.md"
      - ".github/workflows/expected-information-gain-selector.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expected-information-gain-selector-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused selector tests and strict Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format focused selector and integration benchmark
        run: |
          format_status=0
          rustfmt --edition 2024 --check crates/core/symthaea-core/src/hdc/conjecture_engine/experiment_selection.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/integrated_discovery.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/model_adequacy.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/adequacy_calibration.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/feature_shift.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/random_projection_shift.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/detector_panel.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/delayed_outcome_validation.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/tests/delayed_outcome_benchmark.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/tests/diagnostic_fusion_benchmark.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/src/sequential_adequacy.rs || format_status=1
          rustfmt --edition 2024 --check crates/bridges/symthaea-physics-bridge/tests/model_adequacy_contract.rs || format_status=1
          exit "$format_status"
      - name: Test information-gain selector
        run: cargo test -p symthaea-core hdc::conjecture_engine::experiment_selection --lib
      - name: Run paired law-discovery selector pilot
        run: cargo test -p symthaea-physics-bridge expected_information_gain_vs_variance_on_paired_seeds --lib -- --nocapture
      - name: Test conformal adequacy calibration and matched null controls
        run: cargo test -p symthaea-physics-bridge adequacy_calibration --lib -- --nocapture
      - name: Test fixed-reference feature-shift scorer
        run: cargo test -p symthaea-physics-bridge feature_shift --lib
      - name: Test random-projection feature-shift scorer
        run: cargo test -p symthaea-physics-bridge random_projection_feature_shift --lib
      - name: Test clean-data detector panel selection
        run: cargo test -p symthaea-physics-bridge detector_panel --lib
      - name: Test delayed-label outcome validation
        run: cargo test -p symthaea-physics-bridge delayed_outcome_validation --lib
      - name: Run paired delayed-outcome benchmark
        run: cargo test -p symthaea-physics-bridge --test delayed_outcome_benchmark -- --nocapture
      - name: Run diagnostic-fusion and covariate-shift benchmarks
        run: cargo test -p symthaea-physics-bridge --test diagnostic_fusion_benchmark -- --nocapture
      - name: Test finite-horizon sequential adequacy monitor
        run: cargo test -p symthaea-physics-bridge sequential_adequacy --lib
      - name: Test model-adequacy decision semantics
        run: cargo test -p symthaea-physics-bridge model_adequacy --lib
      - name: Test exhaustive model-adequacy contract
        run: cargo test -p symthaea-physics-bridge --test model_adequacy_contract
      - name: Run conformal adequacy pilot
        run: cargo test -p symthaea-physics-bridge conformal_adequacy_calibration_reports_clean_and_perturbed_audit_rates --lib -- --nocapture
      - name: Run model-misspecification audit pilot
        run: cargo test -p symthaea-physics-bridge scheduled_audits_measure_false_confidence_under_model_misspecification --lib -- --nocapture
      - name: Run robust noise-envelope pilot
        run: cargo test -p symthaea-physics-bridge scenario_robust_eig_vs_nominal_eig_pilot --lib -- --nocapture
      - name: Strict Clippy for the core library
        run: cargo clippy -p symthaea-core --lib -- -D warnings
