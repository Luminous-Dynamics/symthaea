name: Melothaea music benchmark registry

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/benchmark_registry.rs"
      - "benchmarks/mel/registry/**"
      - "benchmarks/mel/schemas/**"
      - "tools/mel-benchmark-registry-harness/**"
      - "crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs"
      - "crates/domains/symthaea-muse/src/music_edit_validity_envelope.rs"
      - "crates/domains/symthaea-muse/src/music_reference_adjudication.rs"
      - "tools/mel-music-edit-adapter-harness/**"
      - "docs/research/MEL_MR_EVAL_030_SMEBENCH_MMAE_ADAPTER_V1_2026-11-13.md"
      - "docs/research/MEL_MR_EVAL_037_VALIDITY_ENVELOPE_V1_2026-11-14.md"
      - "docs/research/MEL_MR_EVAL_035_BYTE_MATERIALIZER_V1_2026-11-14.md"
      - "benchmarks/mel/registry/synthetic-music-edit-dataset-manifest-v1.json"
      - "benchmarks/mel/registry/synthetic-music-edit-capability-matrix-v1.json"
      - "benchmarks/mel/registry/synthetic-music-edit-comparison-scope-v1.json"
      - "benchmarks/mel/schemas/music-edit-dataset-manifest-v1.schema.json"
      - "benchmarks/mel/schemas/music-edit-capability-matrix-v1.schema.json"
      - "benchmarks/mel/schemas/music-edit-comparison-scope-v1.schema.json"
      - "benchmarks/mel/schemas/music-edit-validity-envelope-v1.schema.json"
      - "benchmarks/mel/registry/synthetic-music-edit-validity-envelope-v1.json"
      - "benchmarks/mel/schemas/music-edit-artifact-map-v1.schema.json"
      - "benchmarks/mel/schemas/music-edit-materialization-receipt-v1.schema.json"
      - "benchmarks/mel/registry/synthetic-music-edit-artifact-map-v1.json"
      - ".github/workflows/mel-benchmark-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      benchmark_registry: ${{ steps.changed.outputs.benchmark_registry }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify benchmark-registry changes
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "benchmark_registry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if grep -Eq '^(crates/domains/symthaea-muse/src/benchmark_registry\.rs|tools/mel-benchmark-registry-harness/|benchmarks/mel/registry/(music-benchmark-profile-v1|music-benchmark-run-v1)\.json|benchmarks/mel/schemas/music-benchmark-(profile|run)-v1\.schema\.json)' <<< "$changed"; then
            echo "benchmark_registry=true" >> "$GITHUB_OUTPUT"
          else
            echo "benchmark_registry=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark-registry-contract:
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.benchmark_registry == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MEL_BENCHMARK_REGISTRY_REVISION=$actual" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Stage standalone registry crate outside root workspace
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-benchmark-registry-harness"
          mkdir -p "$staged/src" "$staged/examples" "$staged/fixtures"
          cp tools/mel-benchmark-registry-harness/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-benchmark-registry-harness/src/lib.rs "$staged/src/lib.rs"
          cp tools/mel-benchmark-registry-harness/examples/profile_check.rs "$staged/examples/profile_check.rs"
          cp tools/mel-benchmark-registry-harness/fixtures/internal-synthetic-profile-v1.json "$staged/fixtures/internal-synthetic-profile-v1.json"
          echo "MEL_BENCHMARK_REGISTRY_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
          echo "MEL_BENCHMARK_REGISTRY_DIR=$staged" >> "$GITHUB_ENV"
      - name: Format isolated registry crate
        run: cargo +1.96.0 fmt --check --manifest-path "$MEL_BENCHMARK_REGISTRY_MANIFEST"
      - name: Resolve and lock standalone dependencies
        run: cargo +1.96.0 generate-lockfile --manifest-path "$MEL_BENCHMARK_REGISTRY_MANIFEST"
      - name: Test exact benchmark registry module
        run: cargo +1.96.0 test --locked --manifest-path "$MEL_BENCHMARK_REGISTRY_MANIFEST"
      - name: Validate the committed synthetic profile
        run: cargo +1.96.0 run --locked --manifest-path "$MEL_BENCHMARK_REGISTRY_MANIFEST" --example profile_check
      - name: Record exact source and lock identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mel-benchmark-registry-evidence"
          mkdir -p "$evidence"
          cp "$MEL_BENCHMARK_REGISTRY_DIR/Cargo.lock" "$evidence/Cargo.lock"
          sha256sum "$evidence/Cargo.lock" | tee "$evidence/Cargo.lock.sha256"
          printf 'registry_module_sha256=%s\n' "$(sha256sum crates/domains/symthaea-muse/src/benchmark_registry.rs | cut -d' ' -f1)" > "$evidence/source-identities.txt"
          printf 'profile_schema_sha256=%s\n' "$(sha256sum benchmarks/mel/schemas/music-benchmark-profile-v1.schema.json | cut -d' ' -f1)" >> "$evidence/source-identities.txt"
          printf 'run_schema_sha256=%s\n' "$(sha256sum benchmarks/mel/schemas/music-benchmark-run-v1.schema.json | cut -d' ' -f1)" >> "$evidence/source-identities.txt"
      - name: Upload registry evidence
        uses: actions/upload-artifact@v4
        with:
          name: mel-benchmark-registry-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-benchmark-registry-evidence/
          if-no-files-found: error
          retention-days: 90

  music-edit-dataset-adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MUSE_MUSIC_EDIT_ADAPTER_REVISION=$actual" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Stage isolated adapter harness with exact production source
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/mel-music-edit-adapter-harness"
          mkdir -p "$staged/src" "$staged/examples" "$staged/fixtures"
          cp tools/mel-music-edit-adapter-harness/Cargo.toml "$staged/Cargo.toml"
          cp tools/mel-music-edit-adapter-harness/src/lib.rs "$staged/src/lib.rs"
          cp crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs "$staged/src/music_edit_benchmark_adapter.rs"
          cp crates/domains/symthaea-muse/src/music_edit_validity_envelope.rs "$staged/src/music_edit_validity_envelope.rs"
          cp crates/domains/symthaea-muse/src/music_reference_adjudication.rs "$staged/src/music_reference_adjudication.rs"
          cp tools/mel-music-edit-adapter-harness/examples/validate_fixtures.rs "$staged/examples/validate_fixtures.rs"
          cp tools/mel-music-edit-adapter-harness/examples/materialize.rs "$staged/examples/materialize.rs"
          cp tools/mel-music-edit-adapter-harness/examples/validate_validity_envelope.rs "$staged/examples/validate_validity_envelope.rs"
          cp benchmarks/mel/registry/synthetic-music-edit-dataset-manifest-v1.json "$staged/fixtures/"
          cp benchmarks/mel/registry/synthetic-music-edit-capability-matrix-v1.json "$staged/fixtures/"
          cp benchmarks/mel/registry/synthetic-music-edit-comparison-scope-v1.json "$staged/fixtures/"
          cp benchmarks/mel/registry/synthetic-music-edit-artifact-map-v1.json "$staged/fixtures/"
          cp benchmarks/mel/registry/synthetic-music-edit-validity-envelope-v1.json "$staged/fixtures/"
          echo "MUSE_MUSIC_EDIT_ADAPTER_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
      - name: Format and verify isolated adapter harness
        run: |
          cargo +1.96.0 fmt --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST"
          cargo +1.96.0 fmt --check --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST"
      - name: Resolve standalone adapter dependencies
        run: cargo +1.96.0 generate-lockfile --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST"
      - name: Run music-edit adapter contract tests
        run: cargo +1.96.0 test --locked --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST"
      - name: Validate synthetic dataset and capability fixtures
        run: cargo +1.96.0 run --locked --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST" --example validate_fixtures
      - name: Compile adapter materializer command
        run: cargo +1.96.0 check --locked --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST" --example materialize
      - name: Validate musical edit validity envelope
        run: cargo +1.96.0 run --locked --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST" --example validate_validity_envelope
      - name: Run adapter Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST" --all-targets -- -D warnings

      - name: Preserve formatted harness source for exact-head review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mel-music-edit-adapter-evidence"
          harness_dir="$(dirname "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST")"
          mkdir -p "$evidence/formatted"
          cp "$harness_dir/src/music_edit_benchmark_adapter.rs" "$evidence/formatted/music_edit_benchmark_adapter.rs"
          cp "$harness_dir/examples/materialize.rs" "$evidence/formatted/materialize.rs"
          cp "$harness_dir/examples/validate_fixtures.rs" "$evidence/formatted/validate_fixtures.rs"

      - name: Record exact adapter source and fixture identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mel-music-edit-adapter-evidence"
          mkdir -p "$evidence"
          harness_dir="$(dirname "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST")"
          cp "$MUSE_MUSIC_EDIT_ADAPTER_MANIFEST" "$evidence/Cargo.toml"
          cp "$harness_dir/Cargo.lock" "$evidence/Cargo.lock"
          sha256sum "$evidence/Cargo.toml" "$evidence/Cargo.lock" > "$evidence/cargo-identities.sha256"
          sha256sum crates/domains/symthaea-muse/src/music_edit_benchmark_adapter.rs > "$evidence/adapter-source.sha256"
          sha256sum "$harness_dir/src/music_edit_benchmark_adapter.rs" > "$evidence/formatted-staged-source.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-dataset-manifest-v1.schema.json > "$evidence/dataset-schema.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-capability-matrix-v1.schema.json > "$evidence/capability-schema.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-comparison-scope-v1.schema.json > "$evidence/scope-schema.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-artifact-map-v1.schema.json > "$evidence/artifact-map-schema.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-materialization-receipt-v1.schema.json > "$evidence/receipt-schema.sha256"
          sha256sum benchmarks/mel/schemas/music-edit-validity-envelope-v1.schema.json > "$evidence/validity-envelope-schema.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-dataset-manifest-v1.json > "$evidence/dataset-fixture.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-capability-matrix-v1.json > "$evidence/capability-fixture.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-comparison-scope-v1.json > "$evidence/scope-fixture.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-artifact-map-v1.json > "$evidence/artifact-map-fixture.sha256"
          sha256sum benchmarks/mel/registry/synthetic-music-edit-validity-envelope-v1.json > "$evidence/validity-envelope-fixture.sha256"
          printf 'exact_head=%s\n' "$MUSE_MUSIC_EDIT_ADAPTER_REVISION" > "$evidence/source-identities.txt"

      - name: Upload adapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-music-edit-adapter-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mel-music-edit-adapter-evidence/
          if-no-files-found: error
          retention-days: 90
