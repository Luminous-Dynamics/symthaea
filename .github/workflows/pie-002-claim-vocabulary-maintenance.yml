name: PIE-002 Rust Claim Vocabulary Maintenance

on:
  push:
    branches:
      - ops/pie-002-claim-vocabulary

permissions:
  contents: write

jobs:
  harden-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin candidate/pie-002-production-v1

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy

      - name: Harden, format, test, and publish production utility vocabulary
        run: |
          set -euo pipefail
          git switch -C pie-002-rust-work origin/candidate/pie-002-production-v1
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/domains/symthaea-planetary-industry/src/utility_accounting.rs")
          text = path.read_text()
          replacements = {
              "gross_continuous_power": "gross_average_power_screen",
              "steady_cycle_continuous_power": "steady_cycle_average_power_screen",
              "/// Current/gross sustained-power screen with no temporal recovery credit.": (
                  "/// Current/gross cycle-average-power screen against declared sustained capacity."
              ),
              "/// Separately named steady-cycle average-power screen.": (
                  "/// Steady-cycle cycle-average-power screen against declared sustained capacity."
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected Rust token missing: {old}")
              text = text.replace(old, new)

          old = (
              "/// Gross/current-cycle screens never consume recovery credit. Lower net energy\n"
              "/// is reported only under a separately named steady-cycle assumption after\n"
              "/// charge-power, delivery-fraction and discharge-power limits are applied."
          )
          new = (
              "/// Gross/current-cycle screens never consume recovery credit. Lower net energy\n"
              "/// is reported only under a separately named steady-cycle assumption after\n"
              "/// charge-power, delivery-fraction and discharge-power limits are applied.\n"
              "/// Average-power screens are energy/duration checks against declared sustained\n"
              "/// capacity; they do not establish a time-resolved load profile, ramp-rate,\n"
              "/// dispatch, transient-stability, or continuous-delivery theorem."
          )
          if old not in text:
              raise SystemExit("exact Rust evaluator boundary text missing")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cargo fmt -p symthaea-planetary-industry
          cargo check -p symthaea-planetary-industry --all-targets --locked
          cargo test -p symthaea-planetary-industry --all-targets --locked --no-fail-fast
          cargo clippy -p symthaea-planetary-industry --all-targets --locked -- -D warnings
          git diff --check

          git add crates/domains/symthaea-planetary-industry/src
          git commit -m "refactor(pie): make utility power-screen basis explicit"
          git push origin HEAD:candidate/pie-002-production-v1
