name: Prediction Market Integrity Lab

on: [push]

permissions:
  contents: read

jobs:
  qualify:
    name: Exact-head structural qualification
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ runner.temp }}/prediction-market-integrity-target
    steps:
      - name: Checkout event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact checkout revision
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          components: rustfmt, clippy

      - name: Check standalone lab formatting
        run: cargo fmt --manifest-path crates/domains/symthaea-futures-market-integrity/Cargo.toml --check

      - name: Run deterministic integrity tests
        run: cargo test --manifest-path crates/domains/symthaea-futures-market-integrity/Cargo.toml

      - name: Enforce strict Clippy
        run: cargo clippy --manifest-path crates/domains/symthaea-futures-market-integrity/Cargo.toml --all-targets -- -D warnings
