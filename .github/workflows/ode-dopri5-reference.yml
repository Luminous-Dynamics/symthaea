name: ODE Dopri5 Reference Comparison

on:
  pull_request:
    paths:
      - "research/ode-dopri5-reference/**"
      - "research/ode-verify-001/**"
      - "crates/core/symthaea-core/src/hdc/dynamical_system.rs"
      - ".github/workflows/ode-dopri5-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ode-dopri5-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-reference:
    name: Matched analytical comparison with ode_solvers Dopri5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Bootstrap only: the generated lock is uploaded below, then committed.
      # The follow-up revision removes this step and enforces the committed lock.
      - name: Bootstrap candidate dependency lock
        run: cargo generate-lockfile --manifest-path research/ode-dopri5-reference/Cargo.toml

      - name: Format
        run: cargo fmt --manifest-path research/ode-dopri5-reference/Cargo.toml -- --check

      - name: Compile and run reference harness tests
        run: cargo test --locked --manifest-path research/ode-dopri5-reference/Cargo.toml

      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/ode-dopri5-reference/Cargo.toml --all-targets -- -D warnings

      - name: Generate matched solver comparison twice
        id: comparison
        shell: bash
        run: |
          set -uo pipefail
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          checkout_sha="$(git rev-parse HEAD)"
          lock_sha="$(sha256sum research/ode-dopri5-reference/Cargo.lock | cut -d ' ' -f 1)"
          set +e
          ODE_BENCH_SOURCE_SHA="$source_sha" ODE_BENCH_CHECKOUT_SHA="$checkout_sha" ODE_BENCH_LOCK_SHA="$lock_sha" cargo run --locked --release --manifest-path research/ode-dopri5-reference/Cargo.toml > /tmp/ode-dopri5-comparison-1.json
          first_status=$?
          ODE_BENCH_SOURCE_SHA="$source_sha" ODE_BENCH_CHECKOUT_SHA="$checkout_sha" ODE_BENCH_LOCK_SHA="$lock_sha" cargo run --locked --release --manifest-path research/ode-dopri5-reference/Cargo.toml > /tmp/ode-dopri5-comparison-2.json
          second_status=$?
          set -e
          echo "first_status=$first_status" >> "$GITHUB_OUTPUT"
          echo "second_status=$second_status" >> "$GITHUB_OUTPUT"
          cmp /tmp/ode-dopri5-comparison-1.json /tmp/ode-dopri5-comparison-2.json
          jq -e '
            .schema_version == "0.1.0"
            and .benchmark_id == "ODE-WP-DOPRI5-COMPARISON-001"
            and (.source_sha | test("^[0-9a-f]{40}$"))
            and (.checkout_sha | test("^[0-9a-f]{40}$"))
            and (.lock_sha | test("^[0-9a-f]{64}$"))
            and (.observations | length == 9)
          ' /tmp/ode-dopri5-comparison-1.json
          sha256sum research/ode-dopri5-reference/Cargo.lock /tmp/ode-dopri5-comparison-1.json

      - name: Upload comparison receipt and candidate lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ode-dopri5-reference-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            research/ode-dopri5-reference/Cargo.lock
            /tmp/ode-dopri5-comparison-1.json
          if-no-files-found: warn

      - name: Enforce source and numerical comparison gates
        if: always()
        env:
          GENERATION_OUTCOME: ${{ steps.comparison.outcome }}
          FIRST_STATUS: ${{ steps.comparison.outputs.first_status }}
          SECOND_STATUS: ${{ steps.comparison.outputs.second_status }}
        run: |
          set -euo pipefail
          test "$GENERATION_OUTCOME" = "success"
          test "$FIRST_STATUS" = "0"
          test "$SECOND_STATUS" = "0"
          jq -e 'all(.observations[]; .custom_pass == true and .dopri5_pass == true)' /tmp/ode-dopri5-comparison-1.json
