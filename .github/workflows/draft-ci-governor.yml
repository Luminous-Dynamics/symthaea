name: Draft CI Governor

# Transitional lifecycle bridge only.
#
# Full CI now carries draft guards at its runner roots, so draft opened/
# synchronize/reopened events do not need a write-capable governor. Keeping
# those events here created one queued pull_request_target run per ordinary
# draft update while hosted-runner capacity was saturated.
#
# Until ci.yml owns ready_for_review + converted_to_draft natively, this bridge
# retains only the two transitions that require an Actions API write:
#   * ready_for_review   -> dispatch full CI for the current same-repo head;
#   * converted_to_draft -> cancel live full CI for that exact current head.
#
# It deliberately has no schedule and no opened/synchronize/reopened trigger.

on:
  pull_request_target:
    types: [converted_to_draft, ready_for_review]

permissions: {}

concurrency:
  group: draft-ci-governor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel-current-draft-full-ci:
    name: Cancel current draft full CI
    if: github.event.action == 'converted_to_draft'
    permissions:
      actions: write
      pull-requests: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Cancel matching current-head draft full CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const eventPr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;

            if (eventPr.head.repo.full_name !== fullName) {
              core.notice(`PR #${eventPr.number} is from a fork; leaving pull-request CI untouched.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: eventPr.number,
            });
            if (
              pr.state !== 'open' ||
              !pr.draft ||
              pr.head.repo.full_name !== fullName ||
              pr.head.sha !== eventPr.head.sha
            ) {
              core.notice(`PR #${eventPr.number} is no longer the exact open same-repo draft from this transition; no cancellation.`);
              return;
            }

            const liveStatuses = new Set(['queued', 'requested', 'waiting', 'pending', 'in_progress']);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'ci.yml',
              event: 'pull_request',
              branch: pr.head.ref,
              per_page: 100,
            });

            const matching = runs
              .filter(run => run.head_sha === pr.head.sha)
              .filter(run => liveStatuses.has(run.status))
              .filter(run => {
                const number = run.pull_requests?.[0]?.number;
                return number === undefined || number === pr.number;
              })
              .sort((a, b) => a.id - b.id);

            core.notice(`Draft transition for PR #${pr.number} at ${pr.head.sha}: ${matching.length} matching live full-CI run(s).`);

            let cancelled = 0;
            let alreadyGone = 0;
            for (const run of matching.slice(0, 20)) {
              const { data: livePr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              if (
                livePr.state !== 'open' ||
                !livePr.draft ||
                livePr.head.repo.full_name !== fullName ||
                livePr.head.sha !== pr.head.sha
              ) {
                core.notice(`Stopping cancellation: PR #${pr.number} state/head changed.`);
                break;
              }

              try {
                core.notice(`Cancelling ${run.status} CI run ${run.id} for draft PR #${pr.number}.`);
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                cancelled += 1;
              } catch (error) {
                if (error.status === 409) {
                  alreadyGone += 1;
                } else {
                  throw error;
                }
              }
            }

            if (matching.length > 20) {
              core.warning(`${matching.length - 20} additional current-head runs were left unchanged by the transition cap.`);
            }
            core.notice(`Current-head draft cancellation accepted=${cancelled}; already_non_cancellable=${alreadyGone}.`);

  dispatch-ready-full-ci:
    name: Dispatch full matrix when draft becomes ready
    if: github.event.action == 'ready_for_review'
    permissions:
      actions: write
      pull-requests: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Dispatch full CI for current ready branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const eventPr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;

            if (eventPr.head.repo.full_name !== fullName) {
              core.notice(`PR #${eventPr.number} is from a fork; normal pull-request CI remains authoritative.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: eventPr.number,
            });
            if (
              pr.state !== 'open' ||
              pr.draft ||
              pr.head.repo.full_name !== fullName
            ) {
              core.notice(`PR #${eventPr.number} is no longer an open same-repo ready PR; no full CI dispatch.`);
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'ci.yml',
              branch: pr.head.ref,
              per_page: 100,
            });
            const liveCurrentHead = runs.find(run =>
              run.head_sha === pr.head.sha &&
              ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)
            );
            if (liveCurrentHead) {
              core.notice(`Current-head full CI run ${liveCurrentHead.id} already exists for ${pr.head.sha}; not duplicating it.`);
              return;
            }

            core.notice(`Dispatching full matrix for ready PR #${pr.number} using branch ref ${pr.head.ref}; pre-dispatch head=${pr.head.sha}.`);
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci.yml',
              ref: pr.head.ref,
            });
