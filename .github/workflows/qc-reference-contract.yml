name: QC Reference Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-quantum-chemistry/**"
      - "scripts/qc_reference_compare.py"
      - "scripts/test_qc_reference_compare.py"
      - ".github/workflows/qc-reference-contract.yml"
  push:
    branches: [main]
    paths:
      - "crates/domains/symthaea-quantum-chemistry/**"
      - "scripts/qc_reference_compare.py"
      - "scripts/test_qc_reference_compare.py"
      - ".github/workflows/qc-reference-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qc-reference-contract-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  reference-contract:
    name: Build native fixtures and test fail-closed report policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head or event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checkout matches the requested source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            printf 'source HEAD mismatch: expected=%s actual=%s\\n' "$EXPECTED_SOURCE_SHA" "$actual" >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master at 2026-10-09
        with:
          toolchain: 1.96.0

      - name: Compile native benchmark JSON producer
        run: cargo check --locked -p symthaea-quantum-chemistry --example qc_native_reference_fixtures

      - name: Run native quantum-chemistry unit tests
        run: cargo test --locked -p symthaea-quantum-chemistry

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Test comparator's fail-closed contract without pretending to test PySCF
        run: python scripts/test_qc_reference_compare.py
