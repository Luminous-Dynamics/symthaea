name: CMAQ-006 evidence-gated world-model use

on:
  pull_request:
    paths:
      - "research/cmaq-006/**"
      - ".github/workflows/cmaq-006.yml"
  push:
    branches:
      - main
    paths:
      - "research/cmaq-006/**"
      - ".github/workflows/cmaq-006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Formatting
        working-directory: research/cmaq-006
        run: cargo fmt --manifest-path Cargo.toml -- --check
      - name: Unit tests
        working-directory: research/cmaq-006
        run: cargo test --locked
      - name: Strict Clippy
        working-directory: research/cmaq-006
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Decision ledger known-answer fixture
        working-directory: research/cmaq-006
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -- --input fixtures/cases.tsv > /tmp/cmaq-006-ledger.tsv
          diff -u expected.tsv /tmp/cmaq-006-ledger.tsv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          with Path("/tmp/cmaq-006-ledger.tsv").open(newline="") as file:
              rows = list(csv.DictReader(file, delimiter="\t"))
          assert len(rows) == 19
          by_case = {row["case_id"]: row for row in rows}
          assert len(by_case) == len(rows)
          assert by_case["eligible_model"]["decision"] == "USE_MODEL"
          assert by_case["shift_alarm"]["reason"] == "shift_detected"
          assert by_case["stale_epoch"]["reason"] == "stale_model_epoch"
          expected_fallbacks = {
              "failed_physics_adherence": "physics_adherence_failed",
              "failed_action_fidelity": "action_fidelity_failed",
              "failed_constraint_compliance": "constraint_compliance_failed",
              "unknown_counterfactual_grounding": "counterfactual_grounding_unknown",
              "failed_failure_preservation": "failure_preservation_failed",
              "unknown_horizon_support": "horizon_support_unknown",
              "failed_latent_rollout_fidelity": "latent_rollout_fidelity_failed",
              "unknown_state_sufficiency": "state_sufficiency_unknown",
              "failed_selected_action_calibration": "selected_action_calibration_failed",
              "unknown_trajectory_provenance": "trajectory_provenance_unknown",
              "low_lift_bound": "insufficient_net_lift_lower_bound",
              "mismatched_adequacy_digest": "predictive_evidence_digest_mismatch",
              "mismatched_utility_digest": "utility_evidence_digest_mismatch",
              "model_action_unauthorized": "model_action_not_authorized",
              "invalid_model_digest": "invalid_model_digest",
          }
          for case_id, reason in expected_fallbacks.items():
              assert by_case[case_id]["decision"] == "DIRECT_FALLBACK"
              assert by_case[case_id]["reason"] == reason
          assert by_case["no_action_authorized"]["decision"] == "BLOCK"
          assert all(
              row["schema_version"] == "cmaq-006-decision-gate-v0.2"
              for row in rows
          )
          print("CMAQ-006 v0.2 adequacy profile and 19-case ledger validated")
          print({key: value["decision"] + ":" + value["reason"] for key, value in by_case.items()})
          PY
