name: Adaptive connectome query-directed observation policy

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "tools/connectomics-intake-audit/src/bin/connectome_adaptive_query_policy_audit.rs"
      - "tools/connectomics-intake-audit/src/bin/connectome_support_expansion_lattice_audit.rs"
      - "tools/connectomics-intake-audit/reference/verify_adaptive_query_policy_oracle.py"
      - "tools/connectomics-intake-audit/reference/verify_support_expansion_lattice_oracle.py"
      - "tools/connectomics-intake-audit/reference/verify_adaptive_query_challenge_binding.py"
      - "docs/neuroscience/CONNECTOME_ADAPTIVE_CHALLENGE_REPLAY_BINDING.schema.json"
      - "docs/neuroscience/CONNECTOME_ADAPTIVE_CHALLENGE_REPLAY_V1.md"
      - "docs/neuroscience/examples/CONNECTOME_ADAPTIVE_CHALLENGE_REPLAY_BINDING.example.json"
      - "docs/neuroscience/CONNECTOME_ADAPTIVE_QUERY_POLICY_V1.md"
      - "docs/neuroscience/CONNECTOME_SUPPORT_EXPANSION_BENCHMARK_V1.md"
      - "docs/neuroscience/CONNECTOME_SUPPORT_EXPANSION_LATTICE_V1.md"
      - "docs/neuroscience/CONNECTOME_ADAPTIVE_QUERY_POLICY.schema.json"
      - "docs/neuroscience/CONNECTOME_HYPOTHESIS_SPACE_EXPANSION_V1.md"
      - "docs/neuroscience/examples/CONNECTOME_ADAPTIVE_HYPOTHESIS_EXPANSION.example.json"
      - "docs/neuroscience/examples/CONNECTOME_ADAPTIVE_QUERY_POLICY_*.example.json"
      - "docs/neuroscience/examples/CONNECTOME_ADAPTIVE_SUPPORT_EXPANSION*.example.json"
      - ".github/workflows/connectome-adaptive-query-policy.yml"
  push:
    branches: [main, "research/**"]
    paths:
      - "tools/connectomics-intake-audit/src/bin/connectome_adaptive_query_policy_audit.rs"
      - "tools/connectomics-intake-audit/src/bin/connectome_support_expansion_lattice_audit.rs"
      - "tools/connectomics-intake-audit/reference/verify_adaptive_query_policy_oracle.py"
      - "tools/connectomics-intake-audit/reference/verify_support_expansion_lattice_oracle.py"
      - "docs/neuroscience/CONNECTOME_ADAPTIVE_QUERY_POLICY_V1.md"
      - "docs/neuroscience/CONNECTOME_SUPPORT_EXPANSION_BENCHMARK_V1.md"
      - "docs/neuroscience/CONNECTOME_SUPPORT_EXPANSION_LATTICE_V1.md"
      - "docs/neuroscience/CONNECTOME_ADAPTIVE_QUERY_POLICY.schema.json"
      - "docs/neuroscience/CONNECTOME_HYPOTHESIS_SPACE_EXPANSION_V1.md"
      - "docs/neuroscience/examples/CONNECTOME_ADAPTIVE_HYPOTHESIS_EXPANSION.example.json"
      - "docs/neuroscience/examples/CONNECTOME_ADAPTIVE_QUERY_POLICY_*.example.json"
      - "docs/neuroscience/examples/CONNECTOME_ADAPTIVE_SUPPORT_EXPANSION*.example.json"
      - ".github/workflows/connectome-adaptive-query-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-adaptive-query-policy:
    name: Exact worst-case adaptive policy and independent oracle
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check adaptive policy formatting
        run: rustfmt --edition 2024 --check tools/connectomics-intake-audit/src/bin/connectome_adaptive_query_policy_audit.rs
      - name: Run strict Clippy for adaptive policy
        run: cargo clippy --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_adaptive_query_policy_audit -- -D warnings
      - name: Run Rust adaptive policy tests
        run: cargo test --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_adaptive_query_policy_audit
      - name: Evaluate adaptive savings fixture
        run: |
          cargo run --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_adaptive_query_policy_audit -- --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_QUERY_POLICY_SAVINGS.example.json --output "$RUNNER_TEMP/adaptive-policy-savings.json"
          python3 tools/connectomics-intake-audit/reference/verify_adaptive_query_policy_oracle.py --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_QUERY_POLICY_SAVINGS.example.json --report "$RUNNER_TEMP/adaptive-policy-savings.json"
      - name: Evaluate no-policy negative control
        run: |
          cargo run --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_adaptive_query_policy_audit -- --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_QUERY_POLICY_NO_POLICY.example.json --output "$RUNNER_TEMP/adaptive-policy-no-policy.json"
          python3 tools/connectomics-intake-audit/reference/verify_adaptive_query_policy_oracle.py --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_QUERY_POLICY_NO_POLICY.example.json --report "$RUNNER_TEMP/adaptive-policy-no-policy.json"
      - name: Evaluate additive support expansion monotonicity
        run: |
          cargo run --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_adaptive_query_policy_audit -- --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_SUPPORT_EXPANSION.example.json --output "$RUNNER_TEMP/adaptive-support-expansion.json"
          python3 tools/connectomics-intake-audit/reference/verify_adaptive_query_policy_oracle.py --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_SUPPORT_EXPANSION.example.json --report "$RUNNER_TEMP/adaptive-support-expansion.json"
      - name: Evaluate no-policy support expansion control
        run: |
          cargo run --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_adaptive_query_policy_audit -- --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_SUPPORT_EXPANSION_NO_POLICY.example.json --output "$RUNNER_TEMP/adaptive-support-no-policy.json"
          python3 tools/connectomics-intake-audit/reference/verify_adaptive_query_policy_oracle.py --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_SUPPORT_EXPANSION_NO_POLICY.example.json --report "$RUNNER_TEMP/adaptive-support-no-policy.json"
      - name: Strict Clippy for exhaustive support lattice audit
        run: cargo clippy --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_support_expansion_lattice_audit -- -D warnings
      - name: Test exhaustive support inclusion lattice
        run: |
          cargo test --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_support_expansion_lattice_audit
          cargo run --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_support_expansion_lattice_audit -- --output "$RUNNER_TEMP/support-expansion-lattice.json"
          python3 tools/connectomics-intake-audit/reference/verify_support_expansion_lattice_oracle.py --report "$RUNNER_TEMP/support-expansion-lattice.json"
      - name: Evaluate adversarial hypothesis-space expansion
        run: |
          cargo run --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_adaptive_query_policy_audit -- --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_HYPOTHESIS_EXPANSION.example.json --output "$RUNNER_TEMP/adaptive-hypothesis-expansion.json"
          python3 tools/connectomics-intake-audit/reference/verify_adaptive_query_policy_oracle.py --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_HYPOTHESIS_EXPANSION.example.json --report "$RUNNER_TEMP/adaptive-hypothesis-expansion.json"
      - name: Validate byte-bound challenge replay manifest
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/neuroscience/CONNECTOME_ADAPTIVE_CHALLENGE_REPLAY_BINDING.schema.json").read_text())
          binding = json.loads(Path("docs/neuroscience/examples/CONNECTOME_ADAPTIVE_CHALLENGE_REPLAY_BINDING.example.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(binding)
          print("exact challenge replay binding schema: PASS")
          PY
      - name: Independently replay exact hypothesis-expansion challenge
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m py_compile tools/connectomics-intake-audit/reference/verify_adaptive_query_challenge_binding.py
          python3 tools/connectomics-intake-audit/reference/verify_adaptive_query_challenge_binding.py --self-test
          cargo run --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_adaptive_query_policy_audit -- \
            --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_HYPOTHESIS_EXPANSION.example.json \
            --output "$RUNNER_TEMP/adaptive-hypothesis-expansion-bound.json"
          python3 tools/connectomics-intake-audit/reference/verify_adaptive_query_challenge_binding.py \
            --input docs/neuroscience/examples/CONNECTOME_ADAPTIVE_HYPOTHESIS_EXPANSION.example.json \
            --report "$RUNNER_TEMP/adaptive-hypothesis-expansion-bound.json" \
            --binding docs/neuroscience/examples/CONNECTOME_ADAPTIVE_CHALLENGE_REPLAY_BINDING.example.json \
            --oracle tools/connectomics-intake-audit/reference/verify_adaptive_query_policy_oracle.py \
            --rust-source tools/connectomics-intake-audit/src/bin/connectome_adaptive_query_policy_audit.rs \
            --upstream-commit-sha "$EXPECTED_HEAD" \
            --receipt "$RUNNER_TEMP/adaptive-hypothesis-expansion-replay-receipt.json"
          cat "$RUNNER_TEMP/adaptive-hypothesis-expansion-replay-receipt.json"
      - name: Verify independent oracle syntax
        run: |
          python3 -m py_compile tools/connectomics-intake-audit/reference/verify_adaptive_query_policy_oracle.py
          python3 -m py_compile tools/connectomics-intake-audit/reference/verify_support_expansion_lattice_oracle.py
