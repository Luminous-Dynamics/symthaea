name: Muse Support Rustfmt Materialization

on:
  push:
    branches:
      - "research/mel-mr-eval-035-*"
    paths:
      - "crates/domains/symthaea-muse/src/counterfactual_influence.rs"
      - "crates/domains/symthaea-muse/src/counterfactual_support_adapter.rs"
      - ".github/workflows/muse-support-rustfmt-materialize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Format changed sources and emit exact bytes
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/domains/symthaea-muse/src/counterfactual_influence.rs
          rustfmt --edition 2024 crates/domains/symthaea-muse/src/counterfactual_support_adapter.rs
          echo "INFLUENCE_BEGIN"
          base64 -w0 crates/domains/symthaea-muse/src/counterfactual_influence.rs
          echo
          echo "INFLUENCE_END"
          echo "ADAPTER_BEGIN"
          base64 -w0 crates/domains/symthaea-muse/src/counterfactual_support_adapter.rs
          echo
          echo "ADAPTER_END"
