name: HUM-WRENCH-001D5B2 Independent Complete Contact Verifier

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-humanoid/src/mujoco_complete_contact_verifier.rs"
      - "crates/domains/symthaea-humanoid/src/lib.rs"
      - ".github/workflows/hum-wrench-001d5b2-independent-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hum-wrench-001d5b2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 47f6e0339a36ddfcef025e6277adbab1b91b6163
  D5B_SOURCE: 156ed01855b2c6fd89118b5ac4063282added0cb
  CARGO_INCREMENTAL: "0"

jobs:
  exact-head-independent-complete-contact-verifier:
    runs-on: ubuntu-slim
    timeout-minutes: 50
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 12
          persist-credentials: false

      - name: Bind exact qualifier parent and workflow-only scope
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual_head" = "$expected_head"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain=v1)"
          mapfile -t actual < <(git diff --name-only "$EXPECTED_PARENT" HEAD | LC_ALL=C sort)
          expected=(".github/workflows/hum-wrench-001d5b2-independent-verifier.yml")
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Bind frozen source, manifest, and lock bytes
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$EXPECTED_PARENT" HEAD -- crates/domains/symthaea-humanoid
          git diff --quiet "$EXPECTED_PARENT" HEAD -- Cargo.toml Cargo.lock
          git merge-base --is-ancestor "$D5B_SOURCE" "$EXPECTED_PARENT"

      - name: Verify independent verifier boundary
        shell: bash
        run: |
          set -euo pipefail
          src=crates/domains/symthaea-humanoid/src/mujoco_complete_contact_verifier.rs
          test -f "$src"
          grep -F 'pub fn verify_complete_contact_evidence_v1' "$src"
          grep -F 'pub struct CompleteContactEvidenceVerificationV1' "$src"
          grep -F 'independent_contact_kinematics_lineage_id' "$src"
          grep -F 'independent_complete_lineage_id' "$src"
          grep -F 'jacobian.validate(generalized_velocity_count)' "$src"
          grep -F 'bias.source != ContactBiasAccelerationSource::SimulatorSolver' "$src"
          grep -F 'producer_kinematics_lineage_matches' "$src"
          grep -F 'producer_complete_lineage_matches' "$src"
          python - <<'PY'
          from pathlib import Path
          text = Path('crates/domains/symthaea-humanoid/src/mujoco_complete_contact_verifier.rs').read_text()
          production = text.split('#[cfg(test)]', 1)[0]
          forbidden = (
              'bind_complete_mujoco_contact_evidence_v1',
              'EstablishedContactEvidenceV1',
              'ContactAuthorityStateMachineV1',
              'floating_base_inverse_dynamics',
              'csc_qp',
              'osqp',
          )
          for needle in forbidden:
              assert needle not in production, needle
          assert '.validate()' not in production.split('CompleteContactEstablishmentEvidenceV1', 1)[-1] or 'jacobian.validate' in production
          assert 'evidence.contact_kinematics_lineage_id()' in production
          assert 'evidence.complete_lineage_id()' in production
          assert 'independent_jacobian_bits(&jacobian.rows)' in production
          assert 'independent_f64_bits_list(&bias.spatial_bias_acceleration)' in production
          assert 'Deserialize' in production  # verification receipt may be replayed only as diagnostics
          PY

      - name: Verify pinned MuJoCo dependency
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'mujoco-rs = { version = "4.0.1"' crates/domains/symthaea-humanoid/Cargo.toml

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.96.0
          rustc --version | grep -F 'rustc 1.96.0'
          cargo --version | grep -F 'cargo 1.96.0'

      - name: Verify locked graph
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo tree -p symthaea-humanoid --features mujoco --locked | tee "$RUNNER_TEMP/cargo-tree.txt"
          grep -F 'mujoco-rs v4.0.1' "$RUNNER_TEMP/cargo-tree.txt"

      - name: Rustfmt
        run: cargo fmt --check -p symthaea-humanoid

      - name: Locked MuJoCo all-target compile
        run: cargo check -p symthaea-humanoid --all-targets --features mujoco --locked

      - name: Execute independent-verifier regressions
        run: cargo test -p symthaea-humanoid --features mujoco mujoco_complete_contact_verifier --locked -- --nocapture

      - name: Re-execute producer and key predecessor regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symthaea-humanoid --features mujoco mujoco_complete_contact_evidence --locked -- --nocapture
          cargo test -p symthaea-humanoid --features mujoco mujoco_verified_support --locked -- --nocapture
          cargo test -p symthaea-humanoid --features mujoco --lib mujoco_contact_kinematics --locked -- --nocapture

      - name: Strict feature-enabled Clippy
        run: cargo clippy -p symthaea-humanoid --all-targets --features mujoco --locked -- -D warnings

      - name: Source and lock postflight immutability
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --quiet "$EXPECTED_PARENT" HEAD -- crates/domains/symthaea-humanoid
          git diff --quiet "$EXPECTED_PARENT" HEAD -- Cargo.toml Cargo.lock

      - name: Write qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hum-wrench-001d5b2-evidence
          cp "$RUNNER_TEMP/cargo-tree.txt" hum-wrench-001d5b2-evidence/cargo-tree.txt
          {
            echo "program=HUM-WRENCH-001D5B2"
            echo "authority=independent-complete-contact-evidence-integrity-source-qualification-only"
            echo "predecessor_qualification_inherited=NONE"
            echo "producer_source=$D5B_SOURCE"
            echo "verifier_calls_producer_binder=FALSE"
            echo "verifier_calls_private_producer_validator=FALSE"
            echo "model_signature_rederived=TRUE"
            echo "model_identity_rechecked=TRUE"
            echo "sample_time_rechecked=TRUE"
            echo "support_site_rechecked=TRUE"
            echo "jacobian_dimensions_rechecked=TRUE"
            echo "jacobian_exact_float_bits_rederived=TRUE"
            echo "bias_source_rechecked=TRUE"
            echo "bias_exact_float_bits_rederived=TRUE"
            echo "kinematics_lineage_rederived=TRUE"
            echo "complete_lineage_rederived=TRUE"
            echo "verification_receipt_is_capability=FALSE"
            echo "lineage_cryptographic_claim=NONE"
            echo "d4_established_authority=NONE"
            echo "qp_authority=NONE"
            echo "hardware_contact_truth_claim=NONE"
            echo "physical_claim=NONE"
            echo "subject_sha=$EXPECTED_PARENT"
            echo "qualifier_sha=$(git rev-parse HEAD)"
            echo "tree_sha=$(git rev-parse HEAD^{tree})"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "format=PASS"
            echo "compile_mujoco=PASS"
            echo "focused_tests=PASS"
            echo "producer_regressions=PASS"
            echo "strict_clippy=PASS"
            echo "postflight_source_immutable=PASS"
          } > hum-wrench-001d5b2-evidence/receipt.txt

      - name: Upload qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hum-wrench-001d5b2-${{ github.event.pull_request.head.sha || github.sha }}
          path: hum-wrench-001d5b2-evidence/
          if-no-files-found: error
