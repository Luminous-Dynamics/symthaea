name: REL-005A Red Diagnostic

on:
  pull_request:
    paths:
      - "crates/core/symthaea-fep/tests/rel_graft_frame_red_diagnostic.rs"
      - ".github/rel/rel-005a-red-diagnostic.sh"
      - ".github/workflows/rel-005a-red-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rel-005a-red-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_BASE: ${{ github.event.pull_request.base.sha || '' }}
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"

jobs:
  execution:
    name: ExecutionOnly REL-005A diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Initialize execution capsule
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          capsule="${RUNNER_TEMP}/rel005a-execution"
          mkdir -p "${capsule}"
          python3 - <<'PY'
          import json, os, pathlib
          capsule = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rel005a-execution"
          context = {
              "schema": "symthaea.rel.execution-context.v1",
              "authority": "ExecutionOnly",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "expected_head": os.environ["EXPECTED_HEAD"],
              "expected_base": os.environ.get("EXPECTED_BASE", ""),
          }
          (capsule / "workflow-context.json").write_text(
              json.dumps(context, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Checkout exact subject
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Bind subject and diagnostic scope
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          if [ -n "${EXPECTED_BASE}" ]; then
            git cat-file -e "${EXPECTED_BASE}^{commit}"
            mapfile -t changed < <(git diff --name-only "${EXPECTED_BASE}" HEAD | sort)
            expected=(
              ".github/rel/rel-005a-red-diagnostic.sh"
              ".github/workflows/rel-005a-red-diagnostic.yml"
              "crates/core/symthaea-fep/tests/rel_graft_frame_red_diagnostic.rs"
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            test "${changed[*]}" = "${expected_sorted[*]}"
          fi
          printf 'head=%s\nbase=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" "${EXPECTED_BASE}" "$(git rev-parse HEAD^{tree})" \
            | tee "${RUNNER_TEMP}/rel005a-execution/subject.txt"

      - name: Install frozen Rust toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.96.0
          {
            rustc -Vv
            cargo -V
            rustfmt -V
            cargo clippy -V
          } | tee "${RUNNER_TEMP}/rel005a-execution/toolchain.txt"

      - name: Bind source identities
        id: identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            crates/core/symthaea-fep/tests/rel_graft_frame_red_diagnostic.rs \
            .github/rel/rel-005a-red-diagnostic.sh \
            .github/workflows/rel-005a-red-diagnostic.yml \
            | tee "${RUNNER_TEMP}/rel005a-execution/source-sha256.txt"
          git rev-parse \
            HEAD:crates/core/symthaea-fep/tests/rel_graft_frame_red_diagnostic.rs \
            HEAD:.github/rel/rel-005a-red-diagnostic.sh \
            HEAD:.github/workflows/rel-005a-red-diagnostic.yml \
            | tee "${RUNNER_TEMP}/rel005a-execution/source-git-blobs.txt"

      - name: Format contract
        id: format
        shell: bash
        run: bash .github/rel/rel-005a-red-diagnostic.sh fmt

      - name: Execute MeasurementOnly corrupted-anchor diagnostic
        id: measurement
        shell: bash
        env:
          REL005A_DIAGNOSTIC_PATH: ${{ runner.temp }}/rel005a-execution/observation.json
        run: |
          set -uo pipefail
          capsule="${RUNNER_TEMP}/rel005a-execution"
          set +e
          bash .github/rel/rel-005a-red-diagnostic.sh test \
            > >(tee "${capsule}/measurement.stdout.log") \
            2> >(tee "${capsule}/measurement.stderr.log" >&2)
          status=$?
          set -e
          printf '%s\n' "${status}" > "${capsule}/measurement-exit-code.txt"
          exit "${status}"

      - name: Warnings-denied Clippy
        id: clippy
        shell: bash
        run: bash .github/rel/rel-005a-red-diagnostic.sh clippy

      - name: Postflight subject and checkout immutability
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Build ExecutionOnly manifest and receipt
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          BIND_OUTCOME: ${{ steps.bind.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          IDENTITIES_OUTCOME: ${{ steps.identities.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          capsule = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rel005a-execution"
          capsule.mkdir(parents=True, exist_ok=True)
          sha256 = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          outcomes = {
              "checkout": os.environ["CHECKOUT_OUTCOME"],
              "subject_binding": os.environ["BIND_OUTCOME"],
              "toolchain": os.environ["TOOLCHAIN_OUTCOME"],
              "source_identities": os.environ["IDENTITIES_OUTCOME"],
              "rustfmt_check": os.environ["FORMAT_OUTCOME"],
              "measurement_command": os.environ["MEASUREMENT_OUTCOME"],
              "warnings_denied_clippy": os.environ["CLIPPY_OUTCOME"],
              "checkout_immutability": os.environ["POSTFLIGHT_OUTCOME"],
          }
          reason_by_phase = {
              "checkout": "CHECKOUT_ERROR",
              "subject_binding": "IDENTITY_MISMATCH",
              "toolchain": "TOOLCHAIN_ERROR",
              "source_identities": "IDENTITY_BIND_ERROR",
              "rustfmt_check": "FORMAT_ERROR",
              "measurement_command": "EXECUTION_ERROR",
              "warnings_denied_clippy": "CLIPPY_ERROR",
              "checkout_immutability": "CHECKOUT_MUTATED",
          }
          status, reason = "ok", "OK"
          for phase, outcome in outcomes.items():
              if outcome != "success":
                  status, reason = "error", reason_by_phase[phase]
                  break

          excluded = {"capsule-manifest.json", "execution-receipt.json"}
          evidence = {}
          for path in sorted(p for p in capsule.rglob("*") if p.is_file()):
              rel = path.relative_to(capsule).as_posix()
              if rel in excluded:
                  continue
              evidence[rel] = {
                  "sha256": sha256(path),
                  "size_bytes": path.stat().st_size,
              }

          manifest = {
              "schema": "symthaea.rel.execution-capsule-manifest.v1",
              "authority": "ExecutionOnly",
              "expected_head": os.environ["EXPECTED_HEAD"],
              "expected_base": os.environ.get("EXPECTED_BASE", ""),
              "files": evidence,
          }
          manifest_path = capsule / "capsule-manifest.json"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          exit_path = capsule / "measurement-exit-code.txt"
          observation = capsule / "observation.json"
          receipt = {
              "schema": "symthaea.rel.execution-receipt.v2",
              "authority": "ExecutionOnly",
              "execution_status": status,
              "reason_code": reason,
              "expected_head": os.environ["EXPECTED_HEAD"],
              "expected_base": os.environ.get("EXPECTED_BASE", ""),
              "phase_outcomes": outcomes,
              "measurement_exit_code": int(exit_path.read_text().strip()) if exit_path.exists() else None,
              "raw_observation_present": observation.is_file(),
              "raw_observation_sha256": sha256(observation) if observation.is_file() else None,
              "capsule_manifest_sha256": sha256(manifest_path),
              "claims": {
                  "observation_sealed": False,
                  "scientific_pass": False,
                  "scientific_fail": False,
                  "rel_005a_qualified": False,
              },
          }
          receipt_path = capsule / "execution-receipt.json"
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload raw execution capsule
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-execution-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/rel005a-execution/
          retention-days: 30
          if-no-files-found: error

      - name: Enforce execution boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rel005a-execution/execution-receipt.json"
          if not path.is_file():
              print("execution receipt missing", file=sys.stderr)
              raise SystemExit(1)
          receipt = json.loads(path.read_text())
          if receipt.get("schema") != "symthaea.rel.execution-receipt.v2":
              print("execution receipt schema mismatch", file=sys.stderr)
              raise SystemExit(1)
          if receipt.get("authority") != "ExecutionOnly":
              print("execution receipt authority mismatch", file=sys.stderr)
              raise SystemExit(1)
          if receipt.get("expected_head") != os.environ["EXPECTED_HEAD"]:
              print("execution receipt head mismatch", file=sys.stderr)
              raise SystemExit(1)
          if receipt.get("execution_status") != "ok":
              print(f"execution boundary RED: {receipt.get('reason_code')}", file=sys.stderr)
              raise SystemExit(1)
          PY

  seal-observation:
    name: Seal MeasurementOnly observation
    needs: execution
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download raw execution capsule
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rel-005a-execution-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/rel005a-downloaded

      - name: Build ObservationSeal receipt
        if: always()
        shell: bash
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rel005a-seal"
          python3 - <<'PY'
          import hashlib, json, math, os, pathlib

          downloaded = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rel005a-downloaded"
          outdir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rel005a-seal"
          execution_path = downloaded / "execution-receipt.json"
          manifest_path = downloaded / "capsule-manifest.json"
          context_path = downloaded / "workflow-context.json"
          observation_path = downloaded / "observation.json"
          sha256 = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          status, reason = "unavailable", "EVIDENCE_NOT_RETRIEVABLE"
          execution = manifest = context = observation = None

          if os.environ["DOWNLOAD_OUTCOME"] == "success":
              if not execution_path.is_file() or not manifest_path.is_file() or not context_path.is_file():
                  reason = "EXECUTION_CAPSULE_INCOMPLETE"
              else:
                  try:
                      execution = json.loads(execution_path.read_text())
                  except Exception:
                      reason = "EXECUTION_RECEIPT_INVALID"
                  else:
                      try:
                          manifest = json.loads(manifest_path.read_text())
                      except Exception:
                          reason = "CAPSULE_MANIFEST_INVALID"
                      else:
                          try:
                              context = json.loads(context_path.read_text())
                          except Exception:
                              reason = "EXECUTION_CONTEXT_INVALID"
                          else:
                              expected_head = os.environ["EXPECTED_HEAD"]
                              expected_base = os.environ.get("EXPECTED_BASE", "")
                              if execution.get("schema") != "symthaea.rel.execution-receipt.v2":
                                  reason = "EXECUTION_RECEIPT_SCHEMA_MISMATCH"
                              elif execution.get("authority") != "ExecutionOnly":
                                  reason = "EXECUTION_AUTHORITY_MISMATCH"
                              elif manifest.get("schema") != "symthaea.rel.execution-capsule-manifest.v1":
                                  reason = "CAPSULE_MANIFEST_SCHEMA_MISMATCH"
                              elif manifest.get("authority") != "ExecutionOnly":
                                  reason = "CAPSULE_MANIFEST_AUTHORITY_MISMATCH"
                              elif context.get("schema") != "symthaea.rel.execution-context.v1":
                                  reason = "EXECUTION_CONTEXT_SCHEMA_MISMATCH"
                              elif context.get("authority") != "ExecutionOnly":
                                  reason = "EXECUTION_CONTEXT_AUTHORITY_MISMATCH"
                              elif any(
                                  obj.get("expected_head") != expected_head
                                  or obj.get("expected_base", "") != expected_base
                                  for obj in (execution, manifest, context)
                              ):
                                  reason = "SUBJECT_BINDING_MISMATCH"
                              elif execution.get("capsule_manifest_sha256") != sha256(manifest_path):
                                  reason = "CAPSULE_MANIFEST_HASH_MISMATCH"
                              else:
                                  excluded = {"capsule-manifest.json", "execution-receipt.json"}
                                  actual_files = {
                                      p.relative_to(downloaded).as_posix()
                                      for p in downloaded.rglob("*")
                                      if p.is_file()
                                      and p.relative_to(downloaded).as_posix() not in excluded
                                  }
                                  declared_files = set(manifest.get("files", {}))
                                  if actual_files != declared_files:
                                      reason = "CAPSULE_FILE_SET_MISMATCH"
                                  else:
                                      bad_file = None
                                      for rel, meta in manifest["files"].items():
                                          path = downloaded / rel
                                          if (
                                              not path.is_file()
                                              or meta.get("sha256") != sha256(path)
                                              or meta.get("size_bytes") != path.stat().st_size
                                          ):
                                              bad_file = rel
                                              break
                                      if bad_file is not None:
                                          reason = "CAPSULE_FILE_HASH_MISMATCH"
                                      elif execution.get("execution_status") != "ok":
                                          reason = "EXECUTION_ERROR"
                                      elif execution.get("measurement_exit_code") != 0:
                                          reason = "EXECUTION_RECEIPT_INVALID"
                                      elif not all(
                                          outcome == "success"
                                          for outcome in execution.get("phase_outcomes", {}).values()
                                      ):
                                          reason = "EXECUTION_RECEIPT_INVALID"
                                      elif not observation_path.is_file():
                                          reason = "OBSERVATION_MISSING"
                                      elif not execution.get("raw_observation_present"):
                                          reason = "OBSERVATION_PRESENCE_MISMATCH"
                                      elif execution.get("raw_observation_sha256") != sha256(observation_path):
                                          reason = "OBSERVATION_HASH_MISMATCH"
                                      else:
                                          try:
                                              observation = json.loads(observation_path.read_text())
                                          except Exception:
                                              reason = "OBSERVATION_INVALID"
                                          else:
                                              required = {
                                                  "schema",
                                                  "authority",
                                                  "corrupted_anchor_held_out_max",
                                                  "scalar_prediction_held_out_max",
                                                  "corrupted_mask_dispersion_max",
                                              }
                                              if not required.issubset(observation):
                                                  reason = "OBSERVATION_SCHEMA_MISMATCH"
                                              elif observation["schema"] != "symthaea.rel.graft-frame-red-diagnostic.v1":
                                                  reason = "OBSERVATION_SCHEMA_MISMATCH"
                                              elif observation["authority"] != "MeasurementOnly":
                                                  reason = "AUTHORITY_MISMATCH"
                                              else:
                                                  numeric = (
                                                      observation["corrupted_anchor_held_out_max"],
                                                      observation["scalar_prediction_held_out_max"],
                                                      observation["corrupted_mask_dispersion_max"],
                                                  )
                                                  if not all(
                                                      isinstance(v, (int, float)) and math.isfinite(float(v))
                                                      for v in numeric
                                                  ):
                                                      reason = "OBSERVATION_NONFINITE"
                                                  else:
                                                      status, reason = "sealed", "OK"

          execution_sha = sha256(execution_path) if execution_path.is_file() else None
          manifest_sha = sha256(manifest_path) if manifest_path.is_file() else None
          observation_sha = sha256(observation_path) if observation_path.is_file() else None
          chain = json.dumps(
              {
                  "execution_receipt_sha256": execution_sha,
                  "capsule_manifest_sha256": manifest_sha,
                  "observation_sha256": observation_sha,
                  "expected_head": os.environ["EXPECTED_HEAD"],
                  "expected_base": os.environ.get("EXPECTED_BASE", ""),
                  "authority": "MeasurementOnly",
                  "observation_status": status,
                  "reason_code": reason,
              },
              sort_keys=True,
              separators=(",", ":"),
          ).encode()
          receipt = {
              "schema": "symthaea.rel.observation-seal.v2",
              "authority": "MeasurementOnly",
              "expected_head": os.environ["EXPECTED_HEAD"],
              "expected_base": os.environ.get("EXPECTED_BASE", ""),
              "download_outcome": os.environ["DOWNLOAD_OUTCOME"],
              "execution_receipt_sha256": execution_sha,
              "capsule_manifest_sha256": manifest_sha,
              "observation_sha256": observation_sha,
              "chain_sha256": hashlib.sha256(chain).hexdigest(),
              "observation_status": status,
              "reason_code": reason,
              "adjudication": {
                  "status": "not_run",
                  "reason": "MeasurementOnly contract",
              },
              "claims": {
                  "scientific_pass": False,
                  "scientific_fail": False,
                  "rel_005a_qualified": False,
                  "production_behavior_changed": False,
                  "qualification_threshold_changed": False,
              },
          }
          (outdir / "observation-seal.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload observation seal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-observation-seal-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/rel005a-seal/observation-seal.json
          retention-days: 30
          if-no-files-found: error

      - name: Enforce observation boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rel005a-seal/observation-seal.json"
          if not path.is_file():
              print("observation seal missing", file=sys.stderr)
              raise SystemExit(1)
          receipt = json.loads(path.read_text())
          if receipt.get("schema") != "symthaea.rel.observation-seal.v2":
              print("observation seal schema mismatch", file=sys.stderr)
              raise SystemExit(1)
          if receipt.get("authority") != "MeasurementOnly":
              print("observation seal authority mismatch", file=sys.stderr)
              raise SystemExit(1)
          if receipt.get("expected_head") != os.environ["EXPECTED_HEAD"]:
              print("observation seal head mismatch", file=sys.stderr)
              raise SystemExit(1)
          if receipt.get("observation_status") != "sealed":
              print(f"observation boundary RED: {receipt.get('reason_code')}", file=sys.stderr)
              raise SystemExit(1)
          PY
