name: SYM-ARCH-002A Experimental Core

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sym-arch-002a-core.yml'
      - 'crates/domains/symthaea-psych-bench/src/experiment/**'
      - 'crates/domains/symthaea-psych-bench/src/lib.rs'
      - 'crates/domains/symthaea-psych-bench/src/harness/analysis.rs'
      - 'crates/domains/symthaea-psych-bench/Cargo.toml'
      - 'docs/research/SYM_ARCH_002A_EXPERIMENTAL_CORE_V1.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  # Keep only the latest automatic run for a branch. Manual dispatch remains
  # non-cancellable because it is a deliberate request for a definitive run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  experimental-core-hosted:
    name: Validate experiment infrastructure (hosted)
    # Fork PRs must never execute untrusted code on the repository's self-hosted
    # NixOS runner. Manual dispatch also keeps the standard hosted path.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sym-arch-002a-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sym-arch-002a-

      - name: Check changed Rust formatting
        run: |
          rustfmt --edition 2024 --check \
            crates/domains/symthaea-psych-bench/src/experiment/mod.rs \
            crates/domains/symthaea-psych-bench/src/experiment/confirmatory.rs \
            crates/domains/symthaea-psych-bench/src/lib.rs

      - name: Run experimental-core tests
        run: |
          cargo test -p symthaea-psych-bench --lib experiment -- --nocapture

      - name: Check psych-bench library
        run: |
          cargo check -p symthaea-psych-bench --lib

  experimental-core-nixos:
    name: Validate experiment infrastructure
    # Security boundary: only branches inside this repository may execute on the
    # trusted self-hosted runner. Fork PRs are routed to the hosted job above.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gpu, nixos]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned Rust toolchain
        run: |
          set -euo pipefail
          nix develop --command rustc --version | grep -F 'rustc 1.96.0 '
          nix develop --command cargo --version
          nix develop --command rustfmt --version

      - name: Check changed Rust formatting
        run: |
          nix develop --command rustfmt --edition 2024 --check \
            crates/domains/symthaea-psych-bench/src/experiment/mod.rs \
            crates/domains/symthaea-psych-bench/src/experiment/confirmatory.rs \
            crates/domains/symthaea-psych-bench/src/lib.rs

      - name: Run experimental-core tests
        run: |
          nix develop --command cargo test -p symthaea-psych-bench --lib experiment -- --nocapture

      - name: Check psych-bench library
        run: |
          nix develop --command cargo check -p symthaea-psych-bench --lib
