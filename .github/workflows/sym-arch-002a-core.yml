name: SYM-ARCH-002A Experimental Core

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sym-arch-002a-core.yml'
      - 'crates/domains/symthaea-psych-bench/src/experiment/**'
      - 'crates/domains/symthaea-psych-bench/src/lib.rs'
      - 'crates/domains/symthaea-psych-bench/src/harness/analysis.rs'
      - 'crates/domains/symthaea-psych-bench/Cargo.toml'
      - 'docs/research/SYM_ARCH_002A_EXPERIMENTAL_CORE_V1.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  experimental-core:
    name: Validate experiment infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sym-arch-002a-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sym-arch-002a-

      - name: Check changed Rust formatting
        run: |
          rustfmt --edition 2024 --check \
            crates/domains/symthaea-psych-bench/src/experiment/mod.rs \
            crates/domains/symthaea-psych-bench/src/lib.rs

      - name: Run experimental-core tests
        run: |
          cargo test -p symthaea-psych-bench --lib experiment:: -- --nocapture

      - name: Check psych-bench library
        run: |
          cargo check -p symthaea-psych-bench --lib
