name: REA APK Signing Block Structural

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/rea-apk-signing-block-harness/**"
      - ".github/workflows/rea-apk-signing-block.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-apk-signing-block-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout exact PR head or dispatched revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Resolve isolated harness lock
        run: cargo generate-lockfile --manifest-path tools/rea-apk-signing-block-harness/Cargo.toml
      - name: Record source and dependency provenance
        run: |
          expected_source_commit="${{ github.event.pull_request.head.sha || github.sha }}"
          checked_out_commit="$(git rev-parse HEAD)"
          test "$checked_out_commit" = "$expected_source_commit"
          {
            echo "tested_source_commit=$checked_out_commit"
            echo "workflow_event_sha=$GITHUB_SHA"
            echo "pull_request_head_sha=$expected_source_commit"
            rustc --version --verbose
            cargo --version
            sha256sum tools/rea-apk-signing-block-harness/Cargo.lock
          } | tee tools/rea-apk-signing-block-harness/run-context.txt
      - name: Audit dependency graph and manifest
        run: |
          cargo tree --manifest-path tools/rea-apk-signing-block-harness/Cargo.toml --locked -e normal,dev
          cargo metadata --manifest-path tools/rea-apk-signing-block-harness/Cargo.toml --locked --no-deps --format-version 1 > "$RUNNER_TEMP/rea-apk-signing-block-metadata.json"
      - name: Format check
        run: cargo fmt --manifest-path tools/rea-apk-signing-block-harness/Cargo.toml -- --check
      - name: Structural adversarial tests
        run: cargo test --manifest-path tools/rea-apk-signing-block-harness/Cargo.toml --locked
      - name: Archive exact run context and lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rea-apk-signing-block-run
          path: |
            tools/rea-apk-signing-block-harness/Cargo.lock
            tools/rea-apk-signing-block-harness/run-context.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Clippy with warnings denied
        run: cargo clippy --manifest-path tools/rea-apk-signing-block-harness/Cargo.toml --locked --all-targets -- -D warnings
