name: AIRROAD PDCM Impedance Fixture

on:
  pull_request:
    paths:
      - "docs/research/AIRROAD_PDCM_IMPEDANCE_001_V0_1.md"
      - "docs/research/fixtures/airroad-pdcm-two-converter-shared-source-v0.1.json"
      - "tools/airroad-pdcm-impedance-qualifier/verify_two_converter_fixture.py"
      - "crates/domains/symthaea-circuits/src/dc_bus_interaction.rs"
      - "crates/domains/symthaea-circuits/src/lib.rs"
      - "crates/domains/symthaea-circuits/README.md"
      - "docs/research/AIRROAD_PDCM_MIMO_001_V0_1.md"
      - "docs/research/fixtures/airroad-pdcm-mimo-hidden-dynamics-v0.1.json"
      - "tools/airroad-pdcm-impedance-qualifier/verify_mimo_hidden_dynamics.py"
      - "crates/domains/symthaea-circuits/src/dc_bus_mimo_reference.rs"
      - "docs/research/AIRROAD_PDCM_MIMO_PASSPORT_001_V0_1.md"
      - "docs/research/fixtures/airroad-pdcm-mimo-impedance-passport-v0.1.json"
      - "tools/airroad-pdcm-impedance-qualifier/verify_mimo_impedance_passport.py"
      - "crates/domains/symthaea-circuits/src/mimo_impedance_passport.rs"
      - ".github/workflows/airroad-pdcm-impedance-fixture.yml"
  push:
    branches:
      - research/airroad-pdcm-impedance-v0.1
      - research/airroad-pdcm-mimo-v0.1
      - research/airroad-pdcm-mimo-passport-v0.1
    paths:
      - "docs/research/AIRROAD_PDCM_IMPEDANCE_001_V0_1.md"
      - "docs/research/fixtures/airroad-pdcm-two-converter-shared-source-v0.1.json"
      - "tools/airroad-pdcm-impedance-qualifier/verify_two_converter_fixture.py"
      - "crates/domains/symthaea-circuits/src/dc_bus_interaction.rs"
      - "crates/domains/symthaea-circuits/src/lib.rs"
      - "crates/domains/symthaea-circuits/README.md"
      - "docs/research/AIRROAD_PDCM_MIMO_001_V0_1.md"
      - "docs/research/fixtures/airroad-pdcm-mimo-hidden-dynamics-v0.1.json"
      - "tools/airroad-pdcm-impedance-qualifier/verify_mimo_hidden_dynamics.py"
      - "crates/domains/symthaea-circuits/src/dc_bus_mimo_reference.rs"
      - "docs/research/AIRROAD_PDCM_MIMO_PASSPORT_001_V0_1.md"
      - "docs/research/fixtures/airroad-pdcm-mimo-impedance-passport-v0.1.json"
      - "tools/airroad-pdcm-impedance-qualifier/verify_mimo_impedance_passport.py"
      - "crates/domains/symthaea-circuits/src/mimo_impedance_passport.rs"
      - ".github/workflows/airroad-pdcm-impedance-fixture.yml"

permissions:
  contents: read

concurrency:
  group: airroad-pdcm-impedance-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-rational-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile verifier
        run: python3 -m py_compile tools/airroad-pdcm-impedance-qualifier/verify_two_converter_fixture.py
      - name: Verify exact-rational shared-source interaction fixture
        run: python3 tools/airroad-pdcm-impedance-qualifier/verify_two_converter_fixture.py
      - name: Compile and verify 2x2 MIMO hidden-dynamics fixture
        run: |
          python3 -m py_compile tools/airroad-pdcm-impedance-qualifier/verify_mimo_hidden_dynamics.py
          python3 tools/airroad-pdcm-impedance-qualifier/verify_mimo_hidden_dynamics.py
      - name: Compile and verify MIMO impedance passport fixture
        run: |
          python3 -m py_compile tools/airroad-pdcm-impedance-qualifier/verify_mimo_impedance_passport.py
          python3 tools/airroad-pdcm-impedance-qualifier/verify_mimo_impedance_passport.py
      - name: Check circuits crate formatting without workspace resolution
        run: |
          rustfmt --edition 2024 --check crates/domains/symthaea-circuits/src/lib.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-circuits/src/dc_bus_mimo_reference.rs
          rustfmt --edition 2024 --check crates/domains/symthaea-circuits/src/mimo_impedance_passport.rs
      - name: Compile and run zero-dependency circuits tests
        run: |
          rustc --test --edition=2024 crates/domains/symthaea-circuits/src/lib.rs -o /tmp/symthaea-circuits-tests
          /tmp/symthaea-circuits-tests
      - name: Run Clippy directly without workspace resolution
        run: |
          clippy-driver --edition=2024 --crate-name symthaea_circuits --crate-type lib crates/domains/symthaea-circuits/src/lib.rs -D warnings --emit=metadata -o /tmp/symthaea-circuits.rmeta
          clippy-driver --edition=2024 --crate-name symthaea_circuits --test crates/domains/symthaea-circuits/src/lib.rs -D warnings --emit=metadata -o /tmp/symthaea-circuits-tests.rmeta
