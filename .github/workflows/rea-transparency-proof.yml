name: REA Transparency Proof Harness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/rea-transparency-harness/**"
      - ".github/workflows/rea-transparency-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-transparency-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transparency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Resolve isolated proof harness lock
        run: cargo generate-lockfile --manifest-path tools/rea-transparency-harness/Cargo.toml
      - name: Record exact source and dependency provenance
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            rustc --version --verbose
            cargo --version
            sha256sum tools/rea-transparency-harness/Cargo.lock
          } | tee tools/rea-transparency-harness/run-context.txt
      - name: Audit dependency graph and manifest
        run: |
          cargo tree --manifest-path tools/rea-transparency-harness/Cargo.toml --locked -e normal,dev
          cargo metadata --manifest-path tools/rea-transparency-harness/Cargo.toml --locked --no-deps --format-version 1 > "$RUNNER_TEMP/rea-transparency-metadata.json"
      - name: Format check
        run: cargo fmt --manifest-path tools/rea-transparency-harness/Cargo.toml -- --check
      - name: RFC 6962 proof and anti-equivocation tests
        run: cargo test --manifest-path tools/rea-transparency-harness/Cargo.toml --locked
      - name: Archive exact lock and run context
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rea-transparency-proof-run
          path: |
            tools/rea-transparency-harness/Cargo.lock
            tools/rea-transparency-harness/run-context.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Clippy with warnings denied
        run: cargo clippy --manifest-path tools/rea-transparency-harness/Cargo.toml --locked --all-targets -- -D warnings
