          )
          /usr/bin/tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$package_root" -cf - gwt1-consumer-authority-closure | /usr/bin/gzip -n > "$RUNNER_TEMP/gwt1-consumer-authority-closure.tar.gz"
          (cd "$RUNNER_TEMP" && /usr/bin/sha256sum gwt1-consumer-authority-closure.tar.gz > gwt1-consumer-authority-closure.tar.gz.sha256)

          archive_sha="$(/usr/bin/sha256sum "$RUNNER_TEMP/gwt1-consumer-authority-closure.tar.gz" | /usr/bin/awk '{print $1}')"
          admission="$RUNNER_TEMP/gwt1-consumer-authority-closure-admission.json"
          extract="$RUNNER_TEMP/gwt1-consumer-authority-closure-admitted"
          rm -rf "$extract"
          mkdir -p "$extract"
          /usr/bin/python3 "$GITHUB_WORKSPACE/.github/scripts/evidence_archive_admission.py" --profile "$GITHUB_WORKSPACE/.github/evidence-profiles/gwt1-consumer-authority-closure-v1.json" --archive "$RUNNER_TEMP/gwt1-consumer-authority-closure.tar.gz" --output-dir "$extract" > "$admission"
          /usr/bin/jq -e --arg archive_sha "$archive_sha" '.schema=="butlin-evidence-archive-admission-result-v1" and .profile_id=="gwt1-consumer-authority-closure-archive-v1" and .archive_sha256==$archive_sha and .member_count==26 and .archive_bytes>0 and .tar_stream_bytes>0 and .total_unpacked_bytes>0' "$admission" >/dev/null
          (cd "$extract/gwt1-consumer-authority-closure" && /usr/bin/sha256sum -c SHA256SUMS)
          rm -rf "$extract"
          (cd "$RUNNER_TEMP" && /usr/bin/sha256sum gwt1-consumer-authority-closure-admission.json > gwt1-consumer-authority-closure-admission.json.sha256)
          echo "archive_sha256=$archive_sha" >> "$GITHUB_OUTPUT"

      - name: Attest complete consumer authority closure archive
        id: closure_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwt1-consumer-authority-closure.tar.gz

      - name: Verify and preserve closure attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gwt1-closure-trusted-gh-config
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_PROMPT_DISABLED: "1"
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          CLOSURE_ATTESTATION_BUNDLE: ${{ steps.closure_attest.outputs.bundle-path }}
          CLOSURE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          unset GH_HOST GH_ENTERPRISE_TOKEN
          out="$RUNNER_TEMP/gwt1-consumer-authority-closure-attestation"
          rm -rf "$out"
          mkdir -p "$out"
          cp "$CLOSURE_ATTESTATION_BUNDLE" "$out/attestation.json"
          "$TRUSTED_GH_PATH" attestation verify "$RUNNER_TEMP/gwt1-consumer-authority-closure.tar.gz" --repo "$GITHUB_REPOSITORY" --bundle "$out/attestation.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/butlin-gwt1-consumer-authority-closure.yml" --signer-digest "$CLOSURE_WORKFLOW_SHA" --deny-self-hosted-runners --format json > "$out/verification.json"
          test -s "$out/verification.json"
          (cd "$out" && /usr/bin/sha256sum attestation.json > attestation.json.sha256 && /usr/bin/sha256sum verification.json > verification.json.sha256)

      - name: Upload independently closed GWT-1 authority artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gwt1-consumer-authority-closure-${{ inputs.evidence_subject_sha }}-${{ inputs.consumer_run_id }}-${{ inputs.consumer_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gwt1-consumer-authority-closure.tar.gz
            ${{ runner.temp }}/gwt1-consumer-authority-closure.tar.gz.sha256
            ${{ runner.temp }}/gwt1-consumer-authority-closure-admission.json
            ${{ runner.temp }}/gwt1-consumer-authority-closure-admission.json.sha256
            ${{ runner.temp }}/gwt1-consumer-authority-closure-attestation/
          if-no-files-found: error
          retention-days: 90
