          /usr/bin/curl --version > "$stage/environment/curl-version.txt"
          /usr/bin/jq -n --arg schema butlin-gwt1-consumer-authority-closure-runner-environment-v1 --arg image_os "${ImageOS:-unknown}" --arg image_version "${ImageVersion:-unknown}" --arg runner_arch "${RUNNER_ARCH:-unknown}" --arg python_sha "$(/usr/bin/sha256sum /usr/bin/python3 | /usr/bin/awk '{print $1}')" --arg tar_sha "$(/usr/bin/sha256sum /usr/bin/tar | /usr/bin/awk '{print $1}')" --arg gzip_sha "$(/usr/bin/sha256sum /usr/bin/gzip | /usr/bin/awk '{print $1}')" --arg sha256sum_sha "$(/usr/bin/sha256sum /usr/bin/sha256sum | /usr/bin/awk '{print $1}')" --arg jq_sha "$(/usr/bin/sha256sum /usr/bin/jq | /usr/bin/awk '{print $1}')" --arg curl_sha "$(/usr/bin/sha256sum /usr/bin/curl | /usr/bin/awk '{print $1}')" '{schema:$schema,image_os:$image_os,image_version:$image_version,runner_arch:$runner_arch,python3_sha256:$python_sha,tar_sha256:$tar_sha,gzip_sha256:$gzip_sha,sha256sum_sha256:$sha256sum_sha,jq_sha256:$jq_sha,curl_sha256:$curl_sha}' > "$stage/environment/runner_environment.json"

          runner_sha="$(/usr/bin/sha256sum "$stage/environment/runner_environment.json" | /usr/bin/awk '{print $1}')"
          closure_engine_blob="$(git rev-parse HEAD:.github/scripts/evidence_archive_admission.py)"
          report_profile_blob="$(git rev-parse HEAD:.github/evidence-profiles/gwt1-verified-report-v2.json)"
          final_profile_blob="$(git rev-parse HEAD:.github/evidence-profiles/gwt1-final-resolution-v1.json)"
          causal_profile_blob="$(git rev-parse HEAD:.github/evidence-profiles/gwt1-causal-evidence-v1.json)"
          closure_profile_blob="$(git rev-parse HEAD:.github/evidence-profiles/gwt1-consumer-authority-closure-v1.json)"

          /usr/bin/jq -n --arg schema butlin-gwt1-final-consumer-authority-closure-v1 --arg repository "$GITHUB_REPOSITORY" --arg closure_workflow_sha "$CLOSURE_WORKFLOW_SHA" --arg subject "$EVIDENCE_SUBJECT_SHA" --arg consumer_run_id "$CONSUMER_RUN_ID" --arg consumer_run_attempt "$CONSUMER_RUN_ATTEMPT" --arg consumer_workflow_sha "$BOOTSTRAP_CONSUMER_WORKFLOW_SHA" --arg final_workflow_sha "$BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA" --arg promotion_workflow_sha "$BOOTSTRAP_PROMOTION_WORKFLOW_SHA" --arg causal_builder_sha "$BOOTSTRAP_CAUSAL_BUILDER_SHA" --arg report_sha "$REPORT_ARCHIVE_SHA256" --arg report_verify_sha "$REPORT_VERIFICATION_SHA256" --arg report_admission_sha "$REPORT_ADMISSION_SHA256" --arg final_archive_sha "$FINAL_ARCHIVE_SHA256" --arg final_admission_sha "$FINAL_ADMISSION_SHA256" --arg projection_sha "$PROJECTION_SHA256" --arg consumer_provenance_sha "$CONSUMER_PROVENANCE_SHA256" --arg consumer_profile_sha "$CONSUMER_PROFILE_SHA256" --arg promotion_capsule_sha "$PROMOTION_CAPSULE_SHA256" --arg promotion_profile_sha "$PROMOTION_PROFILE_SHA256" --arg promotion_capsule_verify_sha "$PROMOTION_CAPSULE_VERIFICATION_SHA256" --arg promotion_profile_verify_sha "$PROMOTION_PROFILE_VERIFICATION_SHA256" --arg promotion_authority_sha "$PROMOTION_AUTHORITY_SHA256" '{schema:$schema,repository:$repository,closure_workflow_sha:$closure_workflow_sha,evidence_subject_sha:$subject,consumer_run_id:$consumer_run_id,consumer_run_attempt:$consumer_run_attempt,consumer_workflow_sha:$consumer_workflow_sha,final_resolution_workflow_sha:$final_workflow_sha,promotion_workflow_sha:$promotion_workflow_sha,causal_builder_sha:$causal_builder_sha,report_archive_sha256:$report_sha,fresh_report_archive_verification_sha256:$report_verify_sha,fresh_report_archive_admission_sha256:$report_admission_sha,embedded_final_archive_sha256:$final_archive_sha,fresh_embedded_final_archive_admission_sha256:$final_admission_sha,projection_sha256:$projection_sha,consumer_provenance_sha256:$consumer_provenance_sha,consumer_verifier_profile_sha256:$consumer_profile_sha,promotion_capsule_sha256:$promotion_capsule_sha,promotion_verifier_profile_sha256:$promotion_profile_sha,fresh_promotion_capsule_verification_sha256:$promotion_capsule_verify_sha,fresh_promotion_profile_verification_sha256:$promotion_profile_verify_sha,promotion_authority_sha256:$promotion_authority_sha}' > "$stage/closure.json"

          /usr/bin/jq -n --arg schema butlin-gwt1-consumer-authority-closure-verifier-profile-v1 --arg repository "$GITHUB_REPOSITORY" --arg closure_workflow_sha "$CLOSURE_WORKFLOW_SHA" --arg consumer_workflow_sha "$BOOTSTRAP_CONSUMER_WORKFLOW_SHA" --arg final_workflow_sha "$BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA" --arg direct_builder_sha "$BOOTSTRAP_DIRECT_BUILDER_WORKFLOW_SHA" --arg promotion_workflow_sha "$BOOTSTRAP_PROMOTION_WORKFLOW_SHA" --arg causal_builder_sha "$BOOTSTRAP_CAUSAL_BUILDER_SHA" --arg binary_sha "$TRUSTED_GH_BINARY_SHA256" --arg version_sha "$TRUSTED_GH_VERSION_OUTPUT_SHA256" --arg engine_blob "$closure_engine_blob" --arg report_profile_blob "$report_profile_blob" --arg final_profile_blob "$final_profile_blob" --arg causal_profile_blob "$causal_profile_blob" --arg closure_profile_blob "$closure_profile_blob" --arg runner_sha "$runner_sha" '{schema:$schema,repository:$repository,closure_workflow_sha:$closure_workflow_sha,consumer_workflow_sha:$consumer_workflow_sha,final_resolution_workflow_sha:$final_workflow_sha,direct_builder_workflow_sha:$direct_builder_sha,promotion_workflow_sha:$promotion_workflow_sha,causal_builder_sha:$causal_builder_sha,verifier:"github-cli",verifier_version:"2.100.0",distribution_sha256:"e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be",executable_sha256:$binary_sha,version_output_sha256:$version_sha,configuration_policy:"isolated-gh-config-v1",deny_self_hosted_runners:true,archive_admission_engine_git_blob:$engine_blob,report_archive_profile_id:"gwt1-verified-report-archive-v2",report_archive_profile_git_blob:$report_profile_blob,final_resolution_archive_profile_id:"gwt1-final-resolution-archive-v1",final_resolution_archive_profile_git_blob:$final_profile_blob,causal_archive_profile_id:"gwt1-causal-evidence-archive-v1",causal_archive_profile_git_blob:$causal_profile_blob,closure_archive_profile_id:"gwt1-consumer-authority-closure-archive-v1",closure_archive_profile_git_blob:$closure_profile_blob,runner_environment_sha256:$runner_sha}' > "$stage/closure_verifier_profile.json"

          (
            cd "$stage"
