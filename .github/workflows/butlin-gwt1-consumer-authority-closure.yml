            '.schema=="butlin-gwt1-final-promotion-authority-v1" and .repository==$repository and .approved_causal_builder_sha==$builder_sha and .approved_promotion_workflow_sha==$promotion_sha and .evidence_subject_sha==$subject and .promotion_capsule_sha256==$capsule_sha and .promotion_verifier_profile_sha256==$profile_sha and .fresh_capsule_verification_sha256==$capsule_verify_sha and .fresh_profile_verification_sha256==$profile_verify_sha and .internal_token_verification_sha256==$internal_sha' \
