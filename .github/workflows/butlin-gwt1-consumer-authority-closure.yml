          /usr/bin/install -m 0644 "$RUNNER_TEMP/gwt1-closure-promotion-authority/capsule-verification.json" "$stage/authority/fresh_promotion_capsule_verification.json"
          /usr/bin/install -m 0644 "$RUNNER_TEMP/gwt1-closure-promotion-authority/profile-verification.json" "$stage/authority/fresh_promotion_profile_verification.json"

          "$TRUSTED_GH_PATH" --version > "$stage/environment/gh-version.txt"
          /usr/bin/python3 --version > "$stage/environment/python-version.txt" 2>&1
