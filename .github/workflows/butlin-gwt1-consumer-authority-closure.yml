      - name: Package deterministic authority closure
        id: package
        shell: bash
        env:
          REPORT_SOURCE_DIR: ${{ runner.temp }}/gwt1-closure-report-source
          REPORT_ROOT: ${{ steps.report_admission.outputs.root }}
          FINAL_ROOT: ${{ steps.final_admission.outputs.root }}
          REPORT_ARCHIVE_SHA256: ${{ steps.report_verify.outputs.archive_sha256 }}
          REPORT_VERIFICATION_SHA256: ${{ steps.report_verify.outputs.verification_sha256 }}
          REPORT_ADMISSION_SHA256: ${{ steps.report_admission.outputs.admission_sha256 }}
          FINAL_ARCHIVE_SHA256: ${{ steps.report_admission.outputs.final_archive_sha256 }}
          FINAL_ADMISSION_SHA256: ${{ steps.final_admission.outputs.admission_sha256 }}
          PROJECTION_SHA256: ${{ steps.report_admission.outputs.projection_sha256 }}
          CONSUMER_PROVENANCE_SHA256: ${{ steps.report_admission.outputs.consumer_provenance_sha256 }}
          CONSUMER_PROFILE_SHA256: ${{ steps.report_admission.outputs.consumer_profile_sha256 }}
          PROMOTION_CAPSULE_SHA256: ${{ steps.promotion_verify.outputs.capsule_sha256 }}
          PROMOTION_PROFILE_SHA256: ${{ steps.promotion_verify.outputs.profile_sha256 }}
          PROMOTION_CAPSULE_VERIFICATION_SHA256: ${{ steps.promotion_verify.outputs.capsule_verification_sha256 }}
          PROMOTION_PROFILE_VERIFICATION_SHA256: ${{ steps.promotion_verify.outputs.profile_verification_sha256 }}
          PROMOTION_AUTHORITY_SHA256: ${{ steps.promotion_verify.outputs.authority_sha256 }}
          TRUSTED_GH_PATH: ${{ steps.trusted_gh.outputs.gh_path }}
          TRUSTED_GH_BINARY_SHA256: ${{ steps.trusted_gh.outputs.binary_sha256 }}
          TRUSTED_GH_VERSION_OUTPUT_SHA256: ${{ steps.trusted_gh.outputs.version_output_sha256 }}
          EVIDENCE_SUBJECT_SHA: ${{ inputs.evidence_subject_sha }}
          CONSUMER_RUN_ID: ${{ inputs.consumer_run_id }}
          CONSUMER_RUN_ATTEMPT: ${{ inputs.consumer_run_attempt }}
          CLOSURE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          BOOTSTRAP_CONSUMER_WORKFLOW_SHA: "2b4b54da4ee9028bb727267e4ae38fcc002e28dc"
          BOOTSTRAP_FINAL_RESOLUTION_WORKFLOW_SHA: "198aaf257de0b4f264f69eb64d813d772f0362d6"
          BOOTSTRAP_DIRECT_BUILDER_WORKFLOW_SHA: "6eaf73a20047b99120e59eb96f48ae0e194e2c80"
