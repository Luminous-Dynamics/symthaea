        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/gwt1-consumer-authority-closure-package"
          stage="$package_root/gwt1-consumer-authority-closure"
          rm -rf "$package_root"
          mkdir -p "$stage/authority" "$stage/environment" "$stage/source"

          /usr/bin/install -m 0644 "$GITHUB_WORKSPACE/.github/scripts/evidence_archive_admission.py" "$stage/archive_admission_engine.py"
          /usr/bin/install -m 0644 "$GITHUB_WORKSPACE/.github/evidence-profiles/gwt1-consumer-authority-closure-v1.json" "$stage/archive_admission_profile.json"
          /usr/bin/install -m 0644 "$REPORT_ROOT/consumer_provenance.json" "$stage/source/consumer_provenance.json"
          /usr/bin/install -m 0644 "$REPORT_ROOT/consumer_verifier_profile.json" "$stage/source/consumer_verifier_profile.json"
          /usr/bin/install -m 0644 "$FINAL_ROOT/sources/promotion/promotion_verifier_profile.json" "$stage/source/promotion_verifier_profile.json"
