name: SCIP Text Claim Annotation Bundle Contract

on:
  pull_request:
    paths:
      - 'scripts/scip_text_claim_annotation_bundle.py'
      - 'scripts/test_scip_text_claim_annotation_bundle.py'
      - 'scripts/qualification/scip_text_claim_annotation_policy_v1.json'
      - 'docs/release/evidence/SCIP_TEXT_CLAIM_ANNOTATION_BUNDLE_V1.md'
      - '.github/workflows/scip-text-claim-annotation-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  annotation-contract:
    name: Validate human annotation and adjudication evidence contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Prove exact five-file review surface
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-HEAD^1}"
          git diff --name-only "$base" HEAD | LC_ALL=C sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/scip-text-claim-annotation-bundle.yml
          docs/release/evidence/SCIP_TEXT_CLAIM_ANNOTATION_BUNDLE_V1.md
          scripts/qualification/scip_text_claim_annotation_policy_v1.json
          scripts/scip_text_claim_annotation_bundle.py
          scripts/test_scip_text_claim_annotation_bundle.py
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Verify exact implementation, harness, and policy identities
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/scip-v20.sha256 <<'EOF'
          27fe49a5b9794f0c64382f2d97a97aeaf42a806fe0e1891b92a354ccfa90dd24  scripts/scip_text_claim_annotation_bundle.py
          d162a6971cca754cac8efa131805b46b1564c1bc885620c5927c58b9629e3819  scripts/test_scip_text_claim_annotation_bundle.py
          57c80c1b5b72eee745464cda18a3e9dd40b1db11f12bbcf48eb22fb7d1338af1  scripts/qualification/scip_text_claim_annotation_policy_v1.json
          EOF
          sha256sum -c /tmp/scip-v20.sha256
          test "$(git hash-object scripts/scip_text_claim_annotation_bundle.py)" = aa20559da3cdf3c4b7aeb304460eff7c7b2f9e38
          test "$(git hash-object scripts/test_scip_text_claim_annotation_bundle.py)" = 5fa7b0e8ea5aa5b731895ecc5c71d34dead5d93f
          test "$(git hash-object scripts/qualification/scip_text_claim_annotation_policy_v1.json)" = e4088cde2b6a629e3a3de2bd39873002814ac7ab

      - name: Compile tools without mutating checkout
        env:
          PYTHONPYCACHEPREFIX: /tmp/scip-v20-pycache
        run: |
          python3 -m py_compile \
            scripts/scip_text_claim_annotation_bundle.py \
            scripts/test_scip_text_claim_annotation_bundle.py

      - name: Run positive and hostile annotation contract suite
        run: python3 -B scripts/test_scip_text_claim_annotation_bundle.py

      - name: Prove frozen policy identity and non-authority boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=json.loads(Path('scripts/qualification/scip_text_claim_annotation_policy_v1.json').read_text())
          canonical=json.dumps(p,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(canonical).hexdigest() == '12a8431fd8a93dd8ba158758bb4089ef951960240fcab11a5178159e67f19bb9'
          assert p['v18_preregistration_sha256'] == '96e2ec5e1fad213f4261405c22d1f80cb6f1d106fd5621481eb0e95a6cca4530'
          assert p['v19_manifest_policy_sha256'] == '9a30ba36b3e872aaec349647f71433579bc0932f24c96335bb32afe77498ffc0'
          assert p['receipt']['digest_domain'].endswith('\x00')
          assert p['alignment']['allowed_alignment_outcomes'] == ['exact-source-claim','no-source-support']
          assert p['claim_boundary']['bundle_validation_does_not_prove_human_correctness'] is True
          assert p['claim_boundary']['process_declarations_are_not_independently_attested'] is True
          assert p['claim_boundary']['bundle_validation_does_not_establish_extractor_quality'] is True
          assert p['claim_boundary']['bundle_validation_does_not_establish_surface_fidelity'] is True
          assert p['claim_boundary']['bundle_validation_does_not_authorize_confirmatory_execution'] is True
          PY

      - name: Prove checkout remained byte-identical
        run: test -z "$(git status --porcelain --untracked-files=all)"
