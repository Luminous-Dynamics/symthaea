name: NEUROARCH-001 Qualifier

on:
  pull_request:
    paths:
      - 'crates/core/symthaea-neuroarch-types/**'
      - 'crates/core/symthaea-neuroarch-adapters/**'
      - 'docs/research/neuroarch/NEUROARCH_001*.md'
      - '.github/workflows/neuroarch-001-qualify.yml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  QUALIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FROZEN_BASE_SHA: 4bad8af72ff775e7c869b6df83faba718a339a36

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  contract:
    name: Neutral Contract + Lock Materialization
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFY_SHA }}
          fetch-depth: 2

      - name: Bind exact head, base, and scope
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$QUALIFY_SHA"
          test "$(git rev-parse HEAD^)" = "$FROZEN_BASE_SHA"
          test "$(git rev-list --count "$FROZEN_BASE_SHA..$QUALIFY_SHA")" -eq 1

          git diff --check "$FROZEN_BASE_SHA" "$QUALIFY_SHA"
          git diff --name-only "$FROZEN_BASE_SHA" "$QUALIFY_SHA" | tee neuroarch-scope.txt
          unexpected="$(grep -Ev '^(Cargo\.lock|\.github/workflows/neuroarch-001-qualify\.yml|crates/core/symthaea-neuroarch-(types|adapters)/.*|docs/research/neuroarch/NEUROARCH_001[^/]*\.md)$' neuroarch-scope.txt || true)"
          test -z "$unexpected"

          printf 'qualification_sha=%s\n' "$actual_sha" > neuroarch-qualification-context.txt
          printf 'frozen_base_sha=%s\n' "$FROZEN_BASE_SHA" >> neuroarch-qualification-context.txt
          printf 'event_name=%s\n' "$GITHUB_EVENT_NAME" >> neuroarch-qualification-context.txt
          printf 'ref=%s\n' "$GITHUB_REF" >> neuroarch-qualification-context.txt

      - name: Install Rust 1.96 qualification toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Record toolchain and workspace membership
        run: |
          set -euo pipefail
          rustc -vV | tee -a neuroarch-qualification-context.txt
          cargo -V | tee -a neuroarch-qualification-context.txt
          rustc -vV | grep -q '^release: 1\.96\.0$'
          cargo -V | grep -q '^cargo 1\.96\.0 '

          cargo metadata --format-version 1 --no-deps > neuroarch-workspace-metadata.json
          grep -q '"name":"symthaea-neuroarch-types"' neuroarch-workspace-metadata.json
          grep -q '"name":"symthaea-neuroarch-adapters"' neuroarch-workspace-metadata.json

      - name: Resolve workspace and materialize minimal lock update
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          git diff -- Cargo.lock | tee neuroarch-cargo-lock.patch
          test -s neuroarch-cargo-lock.patch

          if grep -E '^-[^-]' neuroarch-cargo-lock.patch; then
            echo 'Cargo.lock materialization removed existing content; refusing broad lock churn.' >&2
            exit 1
          fi

          test "$(grep -c '^+\[\[package\]\]$' neuroarch-cargo-lock.patch)" -eq 2
          mapfile -t added_packages < <(
            awk '
              /^\+\[\[package\]\]$/ { want_name = 1; next }
              want_name && /^\+name = "/ {
                line = $0
                sub(/^\+name = "/, "", line)
                sub(/"$/, "", line)
                print line
                want_name = 0
              }
            ' neuroarch-cargo-lock.patch | sort
          )
          test "${#added_packages[@]}" -eq 2
          test "${added_packages[0]}" = 'symthaea-neuroarch-adapters'
          test "${added_packages[1]}" = 'symthaea-neuroarch-types'

          cargo check -p symthaea-neuroarch-types --locked
          cargo tree -p symthaea-neuroarch-types --depth 1 --locked > neuroarch-types-tree.txt
          cargo tree -p symthaea-neuroarch-adapters --depth 1 --locked > neuroarch-adapters-tree.txt
          grep -q 'blake3' neuroarch-types-tree.txt
          grep -q 'serde' neuroarch-types-tree.txt
          grep -q 'symthaea-core' neuroarch-adapters-tree.txt
          grep -q 'symthaea-neuroarch-types' neuroarch-adapters-tree.txt
          sha256sum Cargo.lock > neuroarch-cargo-lock.sha256

      - name: Check focused formatting
        run: |
          rustfmt --edition 2024 --check \
            crates/core/symthaea-neuroarch-types/src/lib.rs \
            crates/core/symthaea-neuroarch-types/tests/contract_v1.rs \
            crates/core/symthaea-neuroarch-adapters/src/lib.rs

      - name: Test neutral topology contract
        run: cargo test -p symthaea-neuroarch-types --locked

      - name: Clippy neutral topology contract
        run: cargo clippy -p symthaea-neuroarch-types --all-targets --locked -- -D warnings

      - name: Upload generated lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: neuroarch-001-generated-lock
          path: |
            Cargo.lock
            neuroarch-cargo-lock.patch
            neuroarch-cargo-lock.sha256
            neuroarch-qualification-context.txt
            neuroarch-scope.txt
            neuroarch-workspace-metadata.json
            neuroarch-types-tree.txt
            neuroarch-adapters-tree.txt
          if-no-files-found: error
          retention-days: 14

  active-adapter:
    name: Active-Core Adapter Parity + Purity
    needs: contract
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFY_SHA }}
          fetch-depth: 2

      - name: Bind exact head and base
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$QUALIFY_SHA"
          test "$(git rev-parse HEAD^)" = "$FROZEN_BASE_SHA"

      - name: Install Rust 1.96 qualification toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Restore exact generated lock artifact
        uses: actions/download-artifact@v4
        with:
          name: neuroarch-001-generated-lock
          path: neuroarch-lock-evidence

      - name: Bind restored lock to contract evidence
        run: |
          set -euo pipefail
          grep -q "^qualification_sha=$QUALIFY_SHA$" neuroarch-lock-evidence/neuroarch-qualification-context.txt
          grep -q "^frozen_base_sha=$FROZEN_BASE_SHA$" neuroarch-lock-evidence/neuroarch-qualification-context.txt
          (cd neuroarch-lock-evidence && sha256sum -c neuroarch-cargo-lock.sha256)
          cp neuroarch-lock-evidence/Cargo.lock Cargo.lock
          cargo metadata --format-version 1 --no-deps --locked >/dev/null

      - name: Test active-core adapter
        run: cargo test -p symthaea-neuroarch-adapters --lib --locked

      - name: Clippy active-core adapter
        run: cargo clippy -p symthaea-neuroarch-adapters --all-targets --locked -- -D warnings
