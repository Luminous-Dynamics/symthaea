name: Battery design decision-value audit v0.1

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/transport/BATTERY_DESIGN_DECISION_VALUE_V0_1.md"
      - "schemas/transport/battery_design_decision_value_v0_1.schema.json"
      - "fixtures/ev_battery/battery_design_decision_value_v0_1.json"
      - "tools/battery-design-decision-value/**"
      - ".github/workflows/battery-design-decision-value-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check JSON syntax
        run: |
          python3 -c 'import json; json.load(open("schemas/transport/battery_design_decision_value_v0_1.schema.json", encoding="utf-8")); json.load(open("fixtures/ev_battery/battery_design_decision_value_v0_1.json", encoding="utf-8"))'
      - name: Check locked package metadata
        run: cargo metadata --manifest-path tools/battery-design-decision-value/Cargo.toml --locked --no-deps
      - name: Check formatting
        run: cargo fmt --manifest-path tools/battery-design-decision-value/Cargo.toml -- --check
      - name: Run decision-value known-answer tests
        run: cargo test --manifest-path tools/battery-design-decision-value/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/battery-design-decision-value/Cargo.toml --all-targets --locked -- -D warnings
