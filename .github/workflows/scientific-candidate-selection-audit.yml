name: Scientific Candidate Selection Audit

on:
  pull_request:
    paths:
      - "research/scientific-candidate-selection-audit/**"
      - "docs/research/SCIENTIFIC_CANDIDATE_SELECTION_AUDIT_V0_2026-11-16.md"
      - ".github/workflows/scientific-candidate-selection-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-candidate-selection-audit-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, Tests, Fixture and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/scientific-candidate-selection-audit/Cargo.toml -- --check

      - name: Run locked tests
        run: cargo test --locked --manifest-path research/scientific-candidate-selection-audit/Cargo.toml --all-targets

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/scientific-candidate-selection-audit/Cargo.toml --all-targets -- -D warnings

      - name: Run frozen evaluator-audit fixture
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/scientific-candidate-selection-audit.json"
          cargo run --locked --manifest-path research/scientific-candidate-selection-audit/Cargo.toml --bin selection_audit_fixture > "$report"
          jq -e '
            .schema == "scientific_candidate_selection_audit_v0" and
            .task_id == "scilaws-real-candidate-selection-fixture" and
            .attempted_candidates == 4 and
            .scored_candidates == 3 and
            .qualified_candidates == 3 and
            .timed_out_candidates == 1 and
            .missing_evaluator_outcomes == 0 and
            .submitted_candidate_id == "candidate-a" and
            .submitted_is_strictly_dominated == true and
            .submitted_dominator_ids == ["candidate-b"] and
            .qualified_pareto_frontier_ids == ["candidate-b", "candidate-c"] and
            .best_valid_by_metric.numeric_fit == 80 and
            .best_valid_by_metric.scientific_validity == 90 and
            .regret_by_metric.numeric_fit == 10 and
            .regret_by_metric.scientific_validity == 5 and
            .regret_by_metric.structure_recovery == null
          ' "$report"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$report.source-sha"
          sha256sum "$report" | tee "$report.sha256"
          cat "$report"

      - name: Upload selection audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: scientific-candidate-selection-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/scientific-candidate-selection-audit.json
            ${{ runner.temp }}/scientific-candidate-selection-audit.json.sha256
            ${{ runner.temp }}/scientific-candidate-selection-audit.json.source-sha
          if-no-files-found: error
          retention-days: 90
