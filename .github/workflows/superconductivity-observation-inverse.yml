name: Superconductivity Observation Inverse Contract

on:
  pull_request:
    paths:
      - "tools/superconductivity-observation-inverse-harness/**"
      - "data/schemas/superconductivity_observation_inverse_instance_v0_1.schema.json"
      - "data/research/superconductivity_observation_inverse_fixture_v0_1.json"
      - "research/superconductivity/observation_inverse/**"
      - ".github/workflows/superconductivity-observation-inverse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superconductivity-observation-inverse-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  observation-inverse-contract:
    name: Specimen linkage and modality holdout audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/superconductivity-observation-inverse-harness/Cargo.toml --all -- --check

      - name: Generate isolated dependency lockfile
        run: cargo generate-lockfile --manifest-path tools/superconductivity-observation-inverse-harness/Cargo.toml

      - name: Run observation and leakage negative controls
        run: cargo test --locked --manifest-path tools/superconductivity-observation-inverse-harness/Cargo.toml --bin sc_observation_inverse_audit

      - name: Audit synthetic specimen-linked modality split
        run: |
          cargo run --locked --manifest-path tools/superconductivity-observation-inverse-harness/Cargo.toml --bin sc_observation_inverse_audit -- \
            --schema data/schemas/superconductivity_observation_inverse_instance_v0_1.schema.json \
            --fixture data/research/superconductivity_observation_inverse_fixture_v0_1.json \
            --out "$RUNNER_TEMP/sc-observation-inverse-receipt.json"
          cat "$RUNNER_TEMP/sc-observation-inverse-receipt.json"

      - name: Fit only calibration observations and score held-out modality
        run: |
          cargo test --locked --manifest-path tools/superconductivity-observation-inverse-harness/Cargo.toml --bin sc_observation_inverse_fit
          cargo run --locked --manifest-path tools/superconductivity-observation-inverse-harness/Cargo.toml --bin sc_observation_inverse_fit -- \
            --schema data/schemas/superconductivity_observation_inverse_instance_v0_1.schema.json \
            --fixture data/research/superconductivity_observation_inverse_fixture_v0_1.json \
            --out "$RUNNER_TEMP/sc-observation-inverse-fit-receipt.json"
          cat "$RUNNER_TEMP/sc-observation-inverse-fit-receipt.json"

      - name: Run Clippy
        run: |
          cargo clippy --locked --manifest-path tools/superconductivity-observation-inverse-harness/Cargo.toml --bin sc_observation_inverse_audit -- -D warnings
          cargo clippy --locked --manifest-path tools/superconductivity-observation-inverse-harness/Cargo.toml --bin sc_observation_inverse_fit -- -D warnings

      - name: Record exact-run identity
        if: always()
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            sha256sum data/schemas/superconductivity_observation_inverse_instance_v0_1.schema.json
            sha256sum data/research/superconductivity_observation_inverse_fixture_v0_1.json
            sha256sum tools/superconductivity-observation-inverse-harness/Cargo.toml
            sha256sum tools/superconductivity-observation-inverse-harness/src/main.rs
            sha256sum tools/superconductivity-observation-inverse-harness/src/bin/fit.rs
            if [ -f tools/superconductivity-observation-inverse-harness/Cargo.lock ]; then
              sha256sum tools/superconductivity-observation-inverse-harness/Cargo.lock
            else
              echo "cargo_lock=not-generated"
            fi
          } > "$RUNNER_TEMP/sc-observation-inverse-environment.txt"

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-observation-inverse-exact-run-evidence
          if-no-files-found: warn
          path: |
            tools/superconductivity-observation-inverse-harness/Cargo.lock
            ${{ runner.temp }}/sc-observation-inverse-environment.txt
            ${{ runner.temp }}/sc-observation-inverse-receipt.json
            ${{ runner.temp }}/sc-observation-inverse-fit-receipt.json
