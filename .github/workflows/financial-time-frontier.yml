name: Financial Time Frontier

on:
  pull_request:
    paths:
      - "benchmarks/financial-time-frontier/**"
      - ".github/workflows/financial-time-frontier.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/financial-time-frontier/**"
      - ".github/workflows/financial-time-frontier.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/financial-time-frontier/Cargo.toml -- --check
      - name: Run unit and adversarial tests
        run: cargo test --manifest-path benchmarks/financial-time-frontier/Cargo.toml
