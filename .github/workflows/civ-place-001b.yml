name: CIV-PLACE-001B reference oracle

on:
  pull_request:
    paths:
      - "docs/engineering/CIV_PLACE_001B.md"
      - "docs/engineering/fixtures/civ-place-001b.json"
      - "docs/engineering/fixtures/civ-place-001b.sha256"
      - "scripts/validate_civ_place_001b.py"
      - ".github/workflows/civ-place-001b.yml"
  push:
    branches:
      - "agency/civ-place-001b-reference-v0.1"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate reference oracle
        run: python3 scripts/validate_civ_place_001b.py
