name: Plasma artifact admission

on:
  push:
    branches: [research/plasma-artifact-admission-v0-1-2026-11-19]
    paths:
      - "tools/plasma-artifact-admission-v0.1/**"
      - ".github/workflows/plasma-artifact-admission-v0-1.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/plasma-artifact-admission-v0.1/**"
      - ".github/workflows/plasma-artifact-admission-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasma-artifact-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Manifest schema and Rust admission tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate metadata fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path("tools/plasma-artifact-admission-v0.1")
          schema = json.loads((root / "schema/artifact-manifest-v0.1.schema.json").read_text())
          fixture = json.loads((root / "fixtures/zenodo-14915239.metadata-only.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(fixture),
              key=lambda error: list(error.path),
          )
          if errors:
              raise SystemExit("\n".join(error.message for error in errors))
          files = fixture["files"]
          if len(files) != 2:
              raise SystemExit("expected exactly two metadata-only file declarations")
          if files[0]["checksums"][0]["value"] != files[1]["checksums"][0]["value"]:
              raise SystemExit("fixture must preserve the duplicate repository checksum observation")
          if any(item["acquisition"] != "metadata_only" for item in files):
              raise SystemExit("fixture must not claim artifact acquisition")
          if fixture["rights"]["status"] != "unverified":
              raise SystemExit("fixture must preserve unresolved dataset rights")
          PY
      - name: Formatting
        run: cargo fmt --manifest-path tools/plasma-artifact-admission-v0.1/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path tools/plasma-artifact-admission-v0.1/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo clippy --manifest-path tools/plasma-artifact-admission-v0.1/Cargo.toml --locked --all-targets -- -D warnings
