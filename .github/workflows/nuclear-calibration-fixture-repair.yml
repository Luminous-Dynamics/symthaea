name: Nuclear calibration fixture repair

on:
  push:
    branches:
      - agent/nuclear-calibration-fixture
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: nuclear-calibration-fixture-repair
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/agent/nuclear-calibration-fixture') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/nuclear-calibration-fixture')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: agent/nuclear-calibration-fixture
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Apply anchored measured-region correction
        shell: bash
        run: |
          set -euo pipefail
          trigger=.epistemic-bootstrap/NUCLEAR_FIXTURE_REPAIR_READY
          if [[ ! -f "$trigger" ]]; then
            echo "repair trigger already consumed"
            exit 0
          fi

          source_path=.epistemic-bootstrap/source-overrides/crates/domains/symthaea-nuclear/src/discovery.rs
          manifest=.epistemic-bootstrap/source-overrides/SHA256SUMS

          python3 - "$source_path" "$manifest" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          source_path = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])
          source = source_path.read_text()
          old = '''        // Run discovery on a small region
                  let report = engine.discover(110, 116, 175, 185);'''
          new = '''        // Run discovery in a compact measured region around Pb-208.
                  let report = engine.discover(80, 84, 124, 128);'''
          if source.count(old) != 1:
              raise SystemExit('expected discovery fixture anchor exactly once')
          source = source.replace(old, new)
          source_path.write_text(source)

          relative = 'crates/domains/symthaea-nuclear/src/discovery.rs'
          digest = hashlib.sha256(source_path.read_bytes()).hexdigest()
          lines = manifest_path.read_text().splitlines()
          matches = [index for index, line in enumerate(lines) if line.endswith(f'  {relative}')]
          if len(matches) != 1:
              raise SystemExit('expected nuclear override manifest entry exactly once')
          lines[matches[0]] = f'{digest}  {relative}'
          manifest_path.write_text('\n'.join(lines) + '\n')
          print(f'overlay_sha256={digest}')
          PY

          rm "$trigger"
          (cd .epistemic-bootstrap/source-overrides && sha256sum --check --strict SHA256SUMS)
          git diff --check
          git diff --exit-code -- .github/workflows/nuclear-calibration-fixture-repair.yml
          test "$(git diff --name-only | sort)" = $'.epistemic-bootstrap/NUCLEAR_FIXTURE_REPAIR_READY\n.epistemic-bootstrap/source-overrides/SHA256SUMS\n.epistemic-bootstrap/source-overrides/crates/domains/symthaea-nuclear/src/discovery.rs'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$trigger" "$manifest" "$source_path"
          git commit -m "test(nuclear): calibrate against a measured region"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$SOURCE_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
