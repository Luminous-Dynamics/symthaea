name: Butlin Exact-Root Attested Reusable Workflow Contract

on:
  pull_request:
    paths:
      - ".github/workflows/butlin-exact-root-attested-reusable-workflow-contract.yml"
      - ".github/workflows/butlin-reusable-run-context-producer-probe.yml"
      - ".github/workflows/butlin-reusable-run-context-consumer-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  producer:
    name: Call historical attesting producer probe
    uses: Luminous-Dynamics/symthaea/.github/workflows/butlin-reusable-run-context-producer-probe.yml@09de7d04b68b1a9599d27059ae3bfe56225fa1bb
    with:
      expected_run_id: ${{ github.run_id }}
      expected_run_attempt: ${{ github.run_attempt }}

  consumer:
    name: Call historical verifying consumer probe
    needs: producer
    uses: Luminous-Dynamics/symthaea/.github/workflows/butlin-reusable-run-context-consumer-probe.yml@09de7d04b68b1a9599d27059ae3bfe56225fa1bb
    with:
      expected_run_id: ${{ github.run_id }}
      expected_run_attempt: ${{ github.run_attempt }}
      artifact_name: ${{ needs.producer.outputs.artifact_name }}

  prove:
    name: Prove historical SHA, shared run, and signer identity
    needs: [producer, consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact cross-workflow theorem
        shell: bash
        env:
          EXPECTED_PROBE_SHA: 09de7d04b68b1a9599d27059ae3bfe56225fa1bb
          PRODUCER_RUN_ID: ${{ needs.producer.outputs.observed_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.producer.outputs.observed_run_attempt }}
          PRODUCER_WORKFLOW_SHA: ${{ needs.producer.outputs.observed_workflow_sha }}
          PRODUCER_WORKFLOW_PATH: ${{ needs.producer.outputs.observed_workflow_path }}
          CONSUMER_RUN_ID: ${{ needs.consumer.outputs.observed_run_id }}
          CONSUMER_RUN_ATTEMPT: ${{ needs.consumer.outputs.observed_run_attempt }}
          CONSUMER_WORKFLOW_SHA: ${{ needs.consumer.outputs.observed_workflow_sha }}
          PAYLOAD_PRODUCER_WORKFLOW_SHA: ${{ needs.consumer.outputs.producer_workflow_sha }}
          ATTESTATION_VERIFIED: ${{ needs.consumer.outputs.attestation_verified }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$PRODUCER_RUN_ID" = "$GITHUB_RUN_ID"
          test "$CONSUMER_RUN_ID" = "$GITHUB_RUN_ID"
          test "$PRODUCER_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          test "$CONSUMER_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          test "$PRODUCER_WORKFLOW_SHA" = "$EXPECTED_PROBE_SHA"
          test "$CONSUMER_WORKFLOW_SHA" = "$EXPECTED_PROBE_SHA"
          test "$PAYLOAD_PRODUCER_WORKFLOW_SHA" = "$EXPECTED_PROBE_SHA"
          test "$PRODUCER_WORKFLOW_PATH" = ".github/workflows/butlin-reusable-run-context-producer-probe.yml"
          test "$ATTESTATION_VERIFIED" = "true"
          if [[ -n "$PR_HEAD_SHA" ]]; then
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$PR_HEAD_SHA" != "$EXPECTED_PROBE_SHA"
          fi

      - name: State qualified platform boundary
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'historical reusable workflow SHA: qualified' \
            'shared caller run ID/attempt: qualified' \
            'same-run artifact handoff: qualified' \
            'reusable-workflow attestation signer path+digest: qualified'
