# Mycelix Finance - Three-Currency Economic System CI
# Zomes: Payments, Treasury, Bridge, Staking, TEND, Recognition, Currency Mint (~27 externs)
# Currencies: SAP (circulation), TEND (mutual credit), MYCEL (reputation), Community-minted (Currency Factory)

name: Finance

on:
  push:
    branches: [main]
    paths:
      - 'mycelix-finance/**'
      - '.github/workflows/finance-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-finance/**'
      - '.github/workflows/finance-ci.yml'
  workflow_dispatch:

concurrency:
  group: finance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info

jobs:
  # ============================================================================
  # Lint (parallel with build)
  # ============================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Check formatting
        run: |
          nix develop ./mycelix-finance#ci --command bash -c '
            cd mycelix-finance
            cargo fmt --check
          '

      - name: Run Clippy
        run: |
          nix develop ./mycelix-finance#ci --command bash -c '
            cd mycelix-finance
            cargo clippy --workspace --all-targets -- -D warnings
          '

  # ============================================================================
  # Build WASM Zomes
  # ============================================================================
  build-zomes:
    name: Build WASM Zomes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-finance/target/
          key: ${{ runner.os }}-cargo-finance-build-${{ hashFiles('mycelix-finance/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-finance-build-

      - name: Build all zomes (WASM)
        run: |
          nix develop ./mycelix-finance#ci --command bash -c '
            cd mycelix-finance

            echo "=== Building WASM Zomes ==="
            cargo build --release --workspace --target wasm32-unknown-unknown

            echo ""
            echo "=== Built WASM artifacts ==="
            ls -lh target/wasm32-unknown-unknown/release/*.wasm 2>/dev/null || echo "No .wasm files found"

            echo ""
            echo "=== Zome sizes ==="
            for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
              if [ -f "$wasm" ]; then
                name=$(basename "$wasm" .wasm)
                size=$(stat -c %s "$wasm" 2>/dev/null || stat -f %z "$wasm" 2>/dev/null || echo "?")
                printf "  %-35s %s bytes\n" "$name" "$size"
              fi
            done
          '

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finance-zome-wasm
          path: mycelix-finance/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: warn

  # ============================================================================
  # Unit Tests (per-crate)
  # ============================================================================
  test-zomes:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-zomes

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-finance/target/
          key: ${{ runner.os }}-cargo-finance-test-${{ hashFiles('mycelix-finance/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-finance-build-

      - name: Run zome unit tests
        run: |
          nix develop ./mycelix-finance#ci --command bash -c '
            cd mycelix-finance

            echo "=== Running workspace unit tests ==="
            cargo test --workspace --all-features

            echo ""
            echo "=== All unit tests passed ==="
          '

  # ============================================================================
  # Economics Stress Tests (pure Rust, no conductor)
  # ============================================================================
  stress-tests:
    name: Economics Stress Tests
    runs-on: ubuntu-latest
    needs: build-zomes

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-finance/target/
          key: ${{ runner.os }}-cargo-finance-stress-${{ hashFiles('mycelix-finance/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-finance-build-

      - name: Run economics stress tests (23 tests)
        run: |
          nix develop ./mycelix-finance#ci --command bash -c '
            cd mycelix-finance

            echo "=== Economics Stress Tests ==="
            echo "Testing: demurrage, fee tiers, TEND zero-sum, commons reserve, rate limits, Currency Factory, compost invariant, description validation"
            echo ""

            cargo test -p mycelix_finance_types --test economics_stress_test -- --nocapture

            echo ""
            echo "=== All stress tests passed ==="
          '

  # ============================================================================
  # Package DNA
  # ============================================================================
  package-dna:
    name: Package DNA
    runs-on: ubuntu-latest
    needs: [build-zomes, test-zomes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: finance-zome-wasm
          path: mycelix-finance/target/wasm32-unknown-unknown/release/

      - name: Package Finance DNA
        run: |
          nix develop ./mycelix-finance#ci --command bash -c '
            cd mycelix-finance

            echo "=== Packaging Finance DNA ==="
            hc dna pack dna/ -o dist/mycelix_finance.dna

            echo ""
            echo "=== DNA packaged ==="
            ls -lh dist/mycelix_finance.dna
          '

      - name: Upload DNA artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-dna
          path: mycelix-finance/dist/mycelix_finance.dna
          if-no-files-found: error

  # ============================================================================
  # Sweettest Integration Tests
  # IMPORTANT: --release is required. Debug mode exceeds Holochain's hardcoded
  # 5-minute nonce lifetime (FRESH_NONCE_EXPIRES_AFTER in holochain_nonce-0.6.0).
  # ============================================================================
  sweettest:
    name: Sweettest Integration
    runs-on: ubuntu-latest
    needs: [build-zomes, test-zomes]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Holochain Cachix
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          skipPush: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mycelix-finance/target/
            mycelix-finance/tests/target/
          key: ${{ runner.os }}-cargo-finance-sweettest-${{ hashFiles('mycelix-finance/tests/Cargo.lock', 'mycelix-finance/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-finance-build-

      - name: Build WASM zomes for sweettest
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance
            cargo build --release --workspace --target wasm32-unknown-unknown
          '

      - name: Package DNA for sweettest
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance
            hc dna pack dna/
          '

      - name: Run sweettest - Core integration
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance/tests
            cargo test --release sweettest_integration -- --include-ignored --test-threads=1 --nocapture
          '

      - name: Run sweettest - Payments
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance/tests
            cargo test --release payments_test -- --include-ignored --test-threads=1 --nocapture
          '

      - name: Run sweettest - Treasury
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance/tests
            cargo test --release treasury_test -- --include-ignored --test-threads=1 --nocapture
          '

      - name: Run sweettest - TEND
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance/tests
            cargo test --release tend_test -- --include-ignored --test-threads=1 --nocapture
          '

      - name: Run sweettest - Bridge
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance/tests
            cargo test --release bridge_test -- --include-ignored --test-threads=1 --nocapture
          '

      - name: Run sweettest - Staking
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance/tests
            cargo test --release staking_test -- --include-ignored --test-threads=1 --nocapture
          '

      - name: Run sweettest - Recognition
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance/tests
            cargo test --release recognition_test -- --include-ignored --test-threads=1 --nocapture
          '

      - name: Run sweettest - Currency Mint
        run: |
          nix develop ./mycelix-finance#test --command bash -c '
            cd mycelix-finance/tests
            cargo test --release currency_mint_test -- --include-ignored --test-threads=1 --nocapture
          '

  # ============================================================================
  # Summary
  # ============================================================================
  finance-summary:
    name: Finance Summary
    if: always()
    needs: [lint, build-zomes, test-zomes, stress-tests, sweettest, package-dna]
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        run: |
          format_status() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "**FAILED**" ;;
              cancelled) echo "cancelled" ;;
              skipped) echo "skipped" ;;
              *) echo "$1" ;;
            esac
          }

          echo "## Finance CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Three-Currency Model: SAP (circulation) | TEND (mutual credit) | MYCEL (reputation)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILURES=""
          [ "${{ needs.lint.result }}" = "failure" ] && FAILURES="$FAILURES lint"
          [ "${{ needs.build-zomes.result }}" = "failure" ] && FAILURES="$FAILURES build-zomes"
          [ "${{ needs.test-zomes.result }}" = "failure" ] && FAILURES="$FAILURES test-zomes"
          [ "${{ needs.stress-tests.result }}" = "failure" ] && FAILURES="$FAILURES stress-tests"
          [ "${{ needs.sweettest.result }}" = "failure" ] && FAILURES="$FAILURES sweettest"

          if [ -n "$FAILURES" ]; then
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **Pipeline failed:**$FAILURES" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | $(format_status '${{ needs.lint.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Build WASM Zomes | $(format_status '${{ needs.build-zomes.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | $(format_status '${{ needs.test-zomes.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Economics Stress Tests (23) | $(format_status '${{ needs.stress-tests.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Sweettest Integration (7 suites) | $(format_status '${{ needs.sweettest.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Package DNA | $(format_status '${{ needs.package-dna.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Zomes (7 pairs)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Zome | Currency | Role |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| payments | SAP/TEND | Transfers, demurrage, channels, exit protocol |" >> $GITHUB_STEP_SUMMARY
          echo "| treasury | SAP | Commons pools, inalienable reserves, compost |" >> $GITHUB_STEP_SUMMARY
          echo "| bridge | SAP | Collateral bridge (ETH/USDC), rate-limited |" >> $GITHUB_STEP_SUMMARY
          echo "| staking | SAP | Collateral staking, MYCEL-weighted, escrow |" >> $GITHUB_STEP_SUMMARY
          echo "| tend | TEND | Time exchange, counter-cyclical limits, disputes |" >> $GITHUB_STEP_SUMMARY
          echo "| recognition | MYCEL | Weighted recognition, apprentice lifecycle |" >> $GITHUB_STEP_SUMMARY
          echo "| currency-mint | Community | Currency Factory, confirmation, demurrage, compost, rate limits, discovery |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Infrastructure" >> $GITHUB_STEP_SUMMARY
          echo "- Holochain: 0.6.0 | HDK: 0.6.0 | HDI: 0.7.0" >> $GITHUB_STEP_SUMMARY
          echo "- WASM target: wasm32-unknown-unknown" >> $GITHUB_STEP_SUMMARY
          echo "- Nix flake: mycelix-finance (ci, test, default shells)" >> $GITHUB_STEP_SUMMARY
