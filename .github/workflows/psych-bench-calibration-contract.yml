name: Psych-Bench Calibration Contract

on:
  pull_request:
    branches:
      - main
      - psych-bench/calibration-manifest-contract
      - psych-bench/calibration-frozen-receipt
      - psych-bench/calibration-target-provenance
      - psych-bench/calibration-source-inventory
      - psych-bench/calibration-runtime-stroop
      - psych-bench/calibration-runtime-nback
    paths:
      - '.github/workflows/psych-bench-calibration-contract.yml'
      - 'scripts/ci/strict_clippy_paths.py'
      - 'crates/domains/symthaea-psych-bench/src/calibration_contract.rs'
      - 'crates/domains/symthaea-psych-bench/src/calibration_binding.rs'
      - 'crates/domains/symthaea-psych-bench/src/calibration_inventory.rs'
      - 'crates/domains/symthaea-psych-bench/src/calibration_runtime.rs'
      - 'crates/domains/symthaea-psych-bench/src/calculation_authority.rs'
      - 'crates/domains/symthaea-psych-bench/src/harness/config.rs'
      - 'crates/domains/symthaea-psych-bench/src/harness/difficulty.rs'
      - 'crates/domains/symthaea-psych-bench/src/benchmarks/executive/stroop.rs'
      - 'crates/domains/symthaea-psych-bench/src/benchmarks/worm/nback.rs'
      - 'crates/domains/symthaea-psych-bench/src/benchmarks/reasoning/arc_fluid.rs'
      - 'crates/domains/symthaea-psych-bench/src/lib.rs'
      - 'crates/domains/symthaea-psych-bench/Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-contract:
    name: Exact-subject calibration contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Bind exact subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          printf 'qualified_subject=%s\n' "$actual"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version --verbose
          cargo --version

      - name: Contract format diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            crates/domains/symthaea-psych-bench/src/calibration_contract.rs \
            crates/domains/symthaea-psych-bench/src/calibration_binding.rs \
            crates/domains/symthaea-psych-bench/src/calibration_inventory.rs \
            crates/domains/symthaea-psych-bench/src/calibration_runtime.rs \
            crates/domains/symthaea-psych-bench/src/calculation_authority.rs \
            crates/domains/symthaea-psych-bench/src/benchmarks/executive/stroop.rs \
            crates/domains/symthaea-psych-bench/src/benchmarks/worm/nback.rs

      - name: Compile psych-bench library
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p symthaea-psych-bench --lib

      - name: Execute calibration-contract regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symthaea-psych-bench --lib calibration_contract::tests -- --nocapture

      - name: Execute frozen-binding regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symthaea-psych-bench --lib calibration_binding::tests -- --nocapture

      - name: Execute source-inventory regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symthaea-psych-bench --lib calibration_inventory::tests -- --nocapture

      - name: Execute runtime-calibration regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symthaea-psych-bench --lib calibration_runtime::tests -- --nocapture
          cargo test --locked -p symthaea-psych-bench --lib benchmarks::executive::stroop::tests::effective_calibration_values_match_default_scoring_inputs -- --nocapture
          cargo test --locked -p symthaea-psych-bench --lib benchmarks::worm::nback::tests::effective_calibration_values_match_default_scoring_inputs -- --nocapture

      - name: Execute calculation-authority regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symthaea-psych-bench --lib calculation_authority::tests -- --nocapture

      # Keep dependency compilation authoritative, but make lint authority match
      # the calibration evidence/scoring surface this focused job qualifies.
      - name: Strict focused Clippy
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/calibration-clippy.jsonl"
          set +e
          cargo clippy --locked -p symthaea-psych-bench --lib --no-deps \
            --message-format=json > "$report"
          cargo_status=$?
          set -e
          python3 scripts/ci/strict_clippy_paths.py \
            "$report" \
            crates/domains/symthaea-psych-bench/src/calibration_contract.rs \
            crates/domains/symthaea-psych-bench/src/calibration_binding.rs \
            crates/domains/symthaea-psych-bench/src/calibration_inventory.rs \
            crates/domains/symthaea-psych-bench/src/calibration_runtime.rs \
            crates/domains/symthaea-psych-bench/src/calculation_authority.rs \
            crates/domains/symthaea-psych-bench/src/benchmarks/executive/stroop.rs \
            crates/domains/symthaea-psych-bench/src/benchmarks/worm/nback.rs
          test "$cargo_status" -eq 0

      - name: Postflight exact-subject immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.subject.outputs.sha }}'
          git diff --exit-code
          test -z "$(git status --porcelain)"
