name: Plasma active candidate audit

on:
  push:
    branches:
      - research/plasma-active-kinetic-design-v0-1-2026-11-20
    paths:
      - "crates/tools/plasma-active-candidate-audit/**"
      - "benchmarks/plasma/active-kinetic-candidate-*.json"
      - ".github/workflows/plasma-active-candidate-audit.yml"
  pull_request:
    paths:
      - "crates/tools/plasma-active-candidate-audit/**"
      - "benchmarks/plasma/active-kinetic-candidate-*.json"
      - ".github/workflows/plasma-active-candidate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Strict format check
        run: cargo fmt --manifest-path crates/tools/plasma-active-candidate-audit/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/plasma-active-candidate-audit/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/plasma-active-candidate-audit/Cargo.toml --all-targets -- -D warnings
      - name: Admit valid proposed candidate
        run: cargo run --locked --manifest-path crates/tools/plasma-active-candidate-audit/Cargo.toml -- benchmarks/plasma/active-kinetic-candidate-valid-v0.json
      - name: Reject selected candidate with unverified rights
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path crates/tools/plasma-active-candidate-audit/Cargo.toml -- benchmarks/plasma/active-kinetic-candidate-rights-negative-v0.json
          status=$?
          set -e
          test "$status" -eq 1
