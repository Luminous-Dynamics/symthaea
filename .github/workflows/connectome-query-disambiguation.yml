name: Connectome query-disambiguation observation planner

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "tools/connectomics-intake-audit/src/bin/connectome_query_disambiguation_audit.rs"
      - "tools/connectomics-intake-audit/reference/verify_query_disambiguation_oracle.py"
      - "docs/neuroscience/CONNECTOME_QUERY_DISAMBIGUATION.schema.json"
      - "docs/neuroscience/CONNECTOME_QUERY_DISAMBIGUATION_V1.md"
      - "docs/neuroscience/examples/CONNECTOME_QUERY_DISAMBIGUATION.example.json"
      - "docs/neuroscience/examples/CONNECTOME_QUERY_DISAMBIGUATION_NO_PLAN.example.json"
      - ".github/workflows/connectome-query-disambiguation.yml"
  push:
    branches: [main, "research/**"]
    paths:
      - "tools/connectomics-intake-audit/src/bin/connectome_query_disambiguation_audit.rs"
      - "tools/connectomics-intake-audit/reference/verify_query_disambiguation_oracle.py"
      - "docs/neuroscience/CONNECTOME_QUERY_DISAMBIGUATION.schema.json"
      - "docs/neuroscience/CONNECTOME_QUERY_DISAMBIGUATION_V1.md"
      - "docs/neuroscience/examples/CONNECTOME_QUERY_DISAMBIGUATION.example.json"
      - "docs/neuroscience/examples/CONNECTOME_QUERY_DISAMBIGUATION_NO_PLAN.example.json"
      - ".github/workflows/connectome-query-disambiguation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-observation-plan:
    name: Exact query-disambiguation set cover and independent oracle
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check disambiguation tool formatting
        run: rustfmt --edition 2024 --check tools/connectomics-intake-audit/src/bin/connectome_query_disambiguation_audit.rs

      - name: Run strict Clippy for disambiguation tool
        run: cargo clippy --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_query_disambiguation_audit -- -D warnings

      - name: Run Rust disambiguation unit tests
        run: cargo test --manifest-path tools/connectomics-intake-audit/Cargo.toml --bin connectome_query_disambiguation_audit

      - name: Evaluate the minimum-cost observation fixture
        run: |
          cargo run --manifest-path tools/connectomics-intake-audit/Cargo.toml \
            --bin connectome_query_disambiguation_audit -- \
            --input docs/neuroscience/examples/CONNECTOME_QUERY_DISAMBIGUATION.example.json \
            --output "$RUNNER_TEMP/query-disambiguation-report.json"

      - name: Independently verify the minimum-cost observation plan
        run: |
          python3 tools/connectomics-intake-audit/reference/verify_query_disambiguation_oracle.py \
            --input docs/neuroscience/examples/CONNECTOME_QUERY_DISAMBIGUATION.example.json \
            --report "$RUNNER_TEMP/query-disambiguation-report.json"

      - name: Evaluate the undiscriminable-pair negative control
        run: |
          cargo run --manifest-path tools/connectomics-intake-audit/Cargo.toml \
            --bin connectome_query_disambiguation_audit -- \
            --input docs/neuroscience/examples/CONNECTOME_QUERY_DISAMBIGUATION_NO_PLAN.example.json \
            --output "$RUNNER_TEMP/query-disambiguation-no-plan-report.json"

      - name: Independently verify the no-complete-plan disposition
        run: |
          python3 tools/connectomics-intake-audit/reference/verify_query_disambiguation_oracle.py \
            --input docs/neuroscience/examples/CONNECTOME_QUERY_DISAMBIGUATION_NO_PLAN.example.json \
            --report "$RUNNER_TEMP/query-disambiguation-no-plan-report.json"

      - name: Verify oracle source syntax
        run: python3 -m py_compile tools/connectomics-intake-audit/reference/verify_query_disambiguation_oracle.py
