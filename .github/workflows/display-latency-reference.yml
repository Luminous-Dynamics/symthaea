name: Display Latency Reference

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/display-latency-reference/**"
      - ".github/workflows/display-latency-reference.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/display-latency-reference/**"
      - ".github/workflows/display-latency-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: display-latency-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate synthetic latency fixtures and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2 pinned to an immutable commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.96.0
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --manifest-path tools/display-latency-reference/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/display-latency-reference/Cargo.toml --all-targets -- -D warnings

      - name: Run unit and mutation tests
        run: cargo test --manifest-path tools/display-latency-reference/Cargo.toml
