name: MACE LongMemEval-V2 Adapter
on:
  pull_request:
    paths:
      - "research/mace-longmemeval-v2-adapter-v1/**"
      - "data/schemas/mace_longmemeval_v2_adapter_receipt_v1.schema.json"
      - "docs/research/MACE_LONGMEMEVAL_V2_ADAPTER_V1.md"
      - ".github/workflows/mace-longmemeval-v2-adapter.yml"
  push:
    branches:
      - "research/mace-longmemeval-v2-adapter-v1"
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Parse adapter source
        run: rustfmt --edition 2024 --emit stdout --config skip_children=true research/mace-longmemeval-v2-adapter-v1/src/lib.rs >/dev/null
      - name: Test adapter contract
        run: cargo test --manifest-path research/mace-longmemeval-v2-adapter-v1/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/mace-longmemeval-v2-adapter-v1/Cargo.toml --all-targets -- -D warnings
      - name: Parse adapter schema
        run: python3 -m json.tool data/schemas/mace_longmemeval_v2_adapter_receipt_v1.schema.json >/dev/null
