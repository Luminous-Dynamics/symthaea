name: REL-005A Full Predicate Contract

on:
  pull_request:
    paths:
      - ".github/rel/rel-005a-full-predicate-contract.json"
      - ".github/rel/verify-rel-005a-full-predicate-contract.py"
      - ".github/workflows/rel-005a-full-predicate-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rel-005a-full-predicate-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: db4a76843b7a1538259a91443c07fbebfa9f3e3e
  FROZEN_TEST_BLOB: 787ea051ae0bf8e5667b6925481afd46c15d0bc4
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  predicate-contract:
    name: Verify frozen REL-005A predicate census
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact predicate-contract subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Bind exact lineage and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:crates/core/symthaea-fep/tests/rel_graft_frame.rs)" = "${FROZEN_TEST_BLOB}"
          mapfile -t changed < <(git diff --name-only "${EXPECTED_PARENT}" HEAD | sort)
          expected=(
            ".github/rel/rel-005a-full-predicate-contract.json"
            ".github/rel/verify-rel-005a-full-predicate-contract.py"
            ".github/workflows/rel-005a-full-predicate-contract.yml"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"

      - name: Bind committed source identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            crates/core/symthaea-fep/tests/rel_graft_frame.rs \
            .github/rel/rel-005a-full-predicate-contract.json \
            .github/rel/verify-rel-005a-full-predicate-contract.py \
            .github/workflows/rel-005a-full-predicate-contract.yml
          git rev-parse \
            HEAD:crates/core/symthaea-fep/tests/rel_graft_frame.rs \
            HEAD:.github/rel/rel-005a-full-predicate-contract.json \
            HEAD:.github/rel/verify-rel-005a-full-predicate-contract.py \
            HEAD:.github/workflows/rel-005a-full-predicate-contract.yml

      - name: Verify PredicateContractOnly census
        shell: bash
        env:
          REL005A_PREDICATE_RECEIPT_PATH: ${{ runner.temp }}/predicate-contract-receipt.json
        run: |
          set -euo pipefail
          python3 .github/rel/verify-rel-005a-full-predicate-contract.py
          python3 -m json.tool "${RUNNER_TEMP}/predicate-contract-receipt.json" >/dev/null

      - name: Upload static predicate-contract receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-005a-full-predicate-contract-${{ env.EXPECTED_HEAD }}
          path: |
            .github/rel/rel-005a-full-predicate-contract.json
            ${{ runner.temp }}/predicate-contract-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Postflight exact subject and checkout immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:crates/core/symthaea-fep/tests/rel_graft_frame.rs)" = "${FROZEN_TEST_BLOB}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Enforce PredicateContractOnly boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          receipt = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "predicate-contract-receipt.json").read_text())
          assert receipt["authority"] == "PredicateContractOnly"
          assert receipt["predicate_count"] == 41
          assert receipt["source_grounded"] is True
          assert receipt["raw_observation_gap_census_complete"] is True
          assert receipt["predicate_contract_static_valid"] is True
          assert not any(receipt["claims"].values())
          PY
