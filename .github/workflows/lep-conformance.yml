name: LEP conformance

on:
  pull_request:
    paths:
      - "tools/lep-conformance/**"
      - "docs/research/schemas/luminous-evidence-predicate-v0.1.schema.json"
      - "docs/research/fixtures/luminous-evidence-v0.1/**"
      - "docs/research/LEP_CONFORMANCE_BENCHMARK_PLAN.md"
      - ".github/workflows/lep-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lep-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Schema, semantic, parser, lint, and performance smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --manifest-path tools/lep-conformance/Cargo.toml -- --check

      - name: Regenerate standalone Cargo lockfile from pinned manifest
        run: |
          rm -f tools/lep-conformance/Cargo.lock
          cargo generate-lockfile --manifest-path tools/lep-conformance/Cargo.toml
          sha256sum tools/lep-conformance/Cargo.lock
          echo "LEP_GENERATED_LOCK_BASE64_BEGIN"
          base64 -w0 tools/lep-conformance/Cargo.lock
          echo
          echo "LEP_GENERATED_LOCK_BASE64_END"
      - name: Run locked conformance tests
        run: cargo test --locked --manifest-path tools/lep-conformance/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/lep-conformance/Cargo.toml --all-targets -- -D warnings

      - name: Accept valid illustrative statement
        run: cargo run --quiet --locked --manifest-path tools/lep-conformance/Cargo.toml -- docs/research/fixtures/luminous-evidence-v0.1/valid-passed.json

      - name: Reject queued-but-passed statement for the expected invariant
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          if cargo run --quiet --locked --manifest-path tools/lep-conformance/Cargo.toml -- docs/research/fixtures/luminous-evidence-v0.1/invalid-queued-but-passed.json >"$report"; then
            echo "queued-but-passed fixture unexpectedly conformed" >&2
            cat "$report" >&2
            exit 1
          fi
          grep -q '"EXECUTION_STATUS_RESULT_CONFLICT"' "$report"

      - name: Reject missing target for the expected invariant
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          if cargo run --quiet --locked --manifest-path tools/lep-conformance/Cargo.toml -- docs/research/fixtures/luminous-evidence-v0.1/invalid-missing-target.json >"$report"; then
            echo "missing-target fixture unexpectedly conformed" >&2
            cat "$report" >&2
            exit 1
          fi
          grep -q '"MISSING_TARGET"' "$report"

      - name: Reject stale checked target for the expected invariant
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          if cargo run --quiet --locked --manifest-path tools/lep-conformance/Cargo.toml -- docs/research/fixtures/luminous-evidence-v0.1/semantic-stale-target.json >"$report"; then
            echo "stale-target fixture unexpectedly conformed" >&2
            cat "$report" >&2
            exit 1
          fi
          grep -q '"LEP_TARGET_MISMATCH"' "$report"

      - name: Reject duplicate-key JSON before schema validation
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          if cargo run --quiet --locked --manifest-path tools/lep-conformance/Cargo.toml -- docs/research/fixtures/luminous-evidence-v0.1/invalid-duplicate-key.json >"$report"; then
            echo "duplicate-key fixture unexpectedly conformed" >&2
            cat "$report" >&2
            exit 1
          fi
          grep -q '"DUPLICATE_JSON_KEY"' "$report"

      - name: Collect advisory synthetic performance measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/lep-benchmark-results
          for size in 1024 10240 102400 1048576; do
            cargo run --release --quiet --locked --manifest-path tools/lep-conformance/Cargo.toml --bin lep-benchmark -- "$size" 100 >"target/lep-benchmark-results/$size.json"
            cat "target/lep-benchmark-results/$size.json"
          done
          {
            printf 'commit_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'cargo_lock_sha256=%s\n' "$(sha256sum tools/lep-conformance/Cargo.lock | cut -d' ' -f1)"
            printf 'rustc=%s\n' "$(rustc --version)"
          } > target/lep-benchmark-results/reproducibility.txt

      - name: Upload advisory benchmark results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lep-perf-${{ github.sha }}
          path: target/lep-benchmark-results/
          if-no-files-found: error
          retention-days: 14
