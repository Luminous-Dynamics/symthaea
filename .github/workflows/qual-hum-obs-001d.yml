name: QUAL HUM-OBS-001D exact subject

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qual-hum-obs-001d-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head typed Observatory evidence qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate subject
        uses: actions/checkout@v4
        with:
          ref: c633f4c214e2265786c95a028c7a56dd7ade715b
          fetch-depth: 1
      - name: Verify exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected=c633f4c214e2265786c95a028c7a56dd7ade715b
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "qualified_subject=$actual"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/domains/symthaea-humanoid
      - name: Rustfmt exact humanoid crate
        run: cargo fmt --manifest-path crates/domains/symthaea-humanoid/Cargo.toml -- --check
      - name: Run typed Observatory source tests
        run: cargo test -p symthaea-humanoid capability_observatory_v2 --lib
      - name: Run HumanoidBench V2 lowering tests
        run: cargo test -p symthaea-humanoid humanoidbench_observatory_v2 --lib
      - name: Clippy humanoid library
        run: cargo clippy -p symthaea-humanoid --lib -- -D warnings
