name: MUSE renderer control-effect qualification

on:
  push:
    branches:
      - research/mel-observed-control-effect-v1-20261123
    paths:
      - "crates/domains/symthaea-muse/src/realization_effect.rs"
      - "crates/domains/symthaea-muse/src/realization_contract.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/research/MEL_RENDERER_CONTROL_EFFECT_V1_2026-11-23.md"
      - ".github/workflows/muse-realization-effect-qualification.yml"
  pull_request:
    branches:
      - research/mel-realization-contract-current-main-20261103b
    paths:
      - "crates/domains/symthaea-muse/src/realization_effect.rs"
      - "crates/domains/symthaea-muse/src/realization_contract.rs"
      - "crates/domains/symthaea-muse/src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/research/MEL_RENDERER_CONTROL_EFFECT_V1_2026-11-23.md"
      - ".github/workflows/muse-realization-effect-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: Exact-head renderer control-effect qualification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact tested PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check new evaluator formatting
        run: rustfmt +1.96.0 --edition 2024 --check crates/domains/symthaea-muse/src/realization_effect.rs

      - name: Verify committed lock and workspace resolution
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch Cargo.lock > /dev/null
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/muse-metadata.json"

      - name: Run existing capability contract tests
        run: cargo +1.96.0 test --locked -p symthaea-muse --lib realization_contract::tests

      - name: Run renderer control-effect counterfactual tests
        run: cargo +1.96.0 test --locked -p symthaea-muse --lib realization_effect::tests

      - name: Warnings-denied Muse library Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 clippy --locked --no-deps -p symthaea-muse --lib --message-format=json > "$RUNNER_TEMP/muse-clippy.jsonl"
          jq -s -e '
            [
              .[]
              | select(.reason == "compiler-message")
              | .message
              | select(.level == "warning" or .level == "error")
              | select(any(.spans[]?; (.file_name | endswith("realization_effect.rs"))))
            ]
            | length == 0
          ' "$RUNNER_TEMP/muse-clippy.jsonl" > /dev/null

      - name: Assemble exact-head evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/muse-renderer-control-effect-evidence"
          mkdir -p "$evidence"
          printf 'tested_head=%s\n' "$(git rev-parse HEAD)" > "$evidence/source-revision.txt"
          rustc +1.96.0 --version > "$evidence/rustc-version.txt" 2>&1 || true
          cargo +1.96.0 --version > "$evidence/cargo-version.txt" 2>&1 || true
          sha256sum Cargo.lock > "$evidence/cargo-lock.sha256" 2>&1 || true
          cp crates/domains/symthaea-muse/src/realization_effect.rs "$evidence/"
          cp crates/domains/symthaea-muse/src/realization_contract.rs "$evidence/"
          cp docs/research/MEL_RENDERER_CONTROL_EFFECT_V1_2026-11-23.md "$evidence/"
          (cd "$evidence" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-renderer-control-effect-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/muse-renderer-control-effect-evidence/
          if-no-files-found: error
          retention-days: 90
