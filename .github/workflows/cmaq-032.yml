name: CMAQ-032 recoverability-monitor bridge

on:
  pull_request:
    paths:
      - "research/cmaq-030/**"
      - "research/cmaq-031/**"
      - "research/cmaq-032/**"
      - ".github/workflows/cmaq-032.yml"
  push:
    branches:
      - "research/cmaq-032-*"
    paths:
      - "research/cmaq-030/**"
      - "research/cmaq-031/**"
      - "research/cmaq-032/**"
      - ".github/workflows/cmaq-032.yml"

permissions:
  contents: read

concurrency:
  group: cmaq-032-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: recoverability-monitor-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --manifest-path research/cmaq-032/Cargo.toml --all -- --check
      - name: Run integration and negative-control tests
        run: cargo +1.100.0 test --manifest-path research/cmaq-032/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo +1.100.0 clippy --manifest-path research/cmaq-032/Cargo.toml --locked --all-targets -- -D warnings
