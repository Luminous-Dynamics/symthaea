name: VIS-DVPC-042 MOPE long-horizon power frontier

on:
  pull_request:
    paths:
      - "tools/vision-dvpc-042-mope-long-horizon-frontier.rs"
      - "docs/research/VIS_DVPC_042_MOPE_LONG_HORIZON_FRONTIER_V1.md"
  push:
    branches: ["main"]
    paths:
      - "tools/vision-dvpc-042-mope-long-horizon-frontier.rs"
      - "docs/research/VIS_DVPC_042_MOPE_LONG_HORIZON_FRONTIER_V1.md"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact benchmark and parent kernels
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Compile and run Rust unit tests
        run: |
          rustc --edition=2024 -O --test tools/vision-dvpc-042-mope-long-horizon-frontier.rs -o /tmp/vis-dvpc-042-tests
          /tmp/vis-dvpc-042-tests
      - name: Verify deterministic seed schedule
        run: |
          rustc --edition=2024 -O tools/vision-dvpc-042-mope-long-horizon-frontier.rs -o /tmp/vis-dvpc-042
          /tmp/vis-dvpc-042 --seed-smoke > /tmp/vis-dvpc-042-seed-a.txt
          /tmp/vis-dvpc-042 --seed-smoke > /tmp/vis-dvpc-042-seed-b.txt
          cmp /tmp/vis-dvpc-042-seed-a.txt /tmp/vis-dvpc-042-seed-b.txt
      - name: Verify deterministic statistical result stream
        run: |
          /tmp/vis-dvpc-042 --smoke > /tmp/vis-dvpc-042-smoke-a.tsv
          /tmp/vis-dvpc-042 --smoke > /tmp/vis-dvpc-042-smoke-b.tsv
          grep -v -E 'mean_method_elapsed_seconds|method_observations_per_second|^SYSTEM' /tmp/vis-dvpc-042-smoke-a.tsv > /tmp/vis-dvpc-042-smoke-a-stable.tsv
          grep -v -E 'mean_method_elapsed_seconds|method_observations_per_second|^SYSTEM' /tmp/vis-dvpc-042-smoke-b.tsv > /tmp/vis-dvpc-042-smoke-b-stable.tsv
          cmp /tmp/vis-dvpc-042-smoke-a-stable.tsv /tmp/vis-dvpc-042-smoke-b-stable.tsv
      - name: Run 2,000 seeded sequences through horizon 512
        run: |
          /tmp/vis-dvpc-042 --benchmark > /tmp/vis-dvpc-042-results.tsv
          test "$(grep -c '^DGP' /tmp/vis-dvpc-042-results.tsv)" = "4"
          test "$(grep -c '^RESULT_METRIC' /tmp/vis-dvpc-042-results.tsv)" = "720"
          test "$(grep -c '^ROOT_METRIC' /tmp/vis-dvpc-042-results.tsv)" = "12"
          test "$(grep -c '^GRID_METRIC' /tmp/vis-dvpc-042-results.tsv)" = "12"
          test "$(grep -c '^SYSTEM' /tmp/vis-dvpc-042-results.tsv)" = "4"
          awk -F '\t' '$1=="ROOT_METRIC" && $6=="failures" && $7 != 0 { exit 1 }' /tmp/vis-dvpc-042-results.tsv
          awk -F '\t' '$1=="RESULT_METRIC" && ($6 < -0.000001 || $6 > 1.000001) && ($5=="pointwise_coverage" || $5=="sequence_coverage" || $5=="sequence_false_exclusion_probability" || $5=="false_promotion_probability" || $5=="promotion_power" || $5=="empty_or_reversed_probability") { exit 1 }' /tmp/vis-dvpc-042-results.tsv
          grep '^SEED_SCHEDULE' /tmp/vis-dvpc-042-results.tsv > /tmp/vis-dvpc-042-seeds.tsv
          grep '^DGP\|^RESULT_METRIC\|^ROOT_METRIC\|^GRID_METRIC\|^SYSTEM\|^BENCHMARK_CONFIG' /tmp/vis-dvpc-042-results.tsv > /tmp/vis-dvpc-042-summary.tsv
      - name: Create exact source and result receipt
        run: |
          {
            printf 'VIS_DVPC_042_RECEIPT\tformat\tv1\n'
            printf 'commit_sha\t%s\n' "$GITHUB_SHA"
            printf 'rustc\t%s\n' "$(rustc --version)"
            sha256sum tools/vision-dvpc-042-mope-long-horizon-frontier.rs tools/vision-dvpc-041-mope-endpoint-audit.rs tools/vision-dvpc-040-mope-sufficient-stats.rs tools/vision-dvpc-039-mope-bet-optimizer.rs /tmp/vis-dvpc-042-results.tsv /tmp/vis-dvpc-042-summary.tsv /tmp/vis-dvpc-042-seeds.tsv /tmp/vis-dvpc-042-smoke-a-stable.tsv
          } > /tmp/vis-dvpc-042-receipt.tsv
          cat /tmp/vis-dvpc-042-receipt.tsv
      - name: Publish benchmark results and receipt
        uses: actions/upload-artifact@v4
        with:
          name: vis-dvpc-042-mope-long-horizon-frontier
          path: |
            /tmp/vis-dvpc-042-results.tsv
            /tmp/vis-dvpc-042-summary.tsv
            /tmp/vis-dvpc-042-seeds.tsv
            /tmp/vis-dvpc-042-smoke-a-stable.tsv
            /tmp/vis-dvpc-042-receipt.tsv
          retention-days: 90
