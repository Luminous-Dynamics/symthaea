name: PITB Matched Benchmark Comparison (Rust)

on:
  pull_request:
    paths:
      - "tools/pitb-matched-benchmark-comparison/**"
      - ".github/workflows/pitb-matched-benchmark-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-benchmark-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/pitb-matched-venv"
          "$RUNNER_TEMP/pitb-matched-venv/bin/pip" install "jsonschema==4.25.1"

      - name: Stage isolated comparison engine
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/pitb-matched-benchmark-comparison"
          mkdir -p "$staged/src" "$staged/schema"
          cp tools/pitb-matched-benchmark-comparison/Cargo.toml "$staged/Cargo.toml"
          cp tools/pitb-matched-benchmark-comparison/Cargo.lock "$staged/Cargo.lock"
          cp tools/pitb-matched-benchmark-comparison/src/main.rs "$staged/src/main.rs"
          cp tools/pitb-matched-benchmark-comparison/schema/*.json "$staged/schema/"
          echo "PITB_MATCHED_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
          echo "PITB_MATCHED_DIR=$staged" >> "$GITHUB_ENV"

      - name: Format, compile and test exact Rust source
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 "$PITB_MATCHED_DIR/src/main.rs"
          cargo fmt --check --manifest-path "$PITB_MATCHED_MANIFEST"
          cargo test --locked --manifest-path "$PITB_MATCHED_MANIFEST"
          cargo run --locked --manifest-path "$PITB_MATCHED_MANIFEST" -- --self-test

      - name: Emit a paired synthetic cohort and report
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$PITB_MATCHED_MANIFEST" --             --self-test-fixtures             "$RUNNER_TEMP/pitb-cohort.synthetic.json"             "$RUNNER_TEMP/pitb-runs.synthetic.jsonl"
          cargo run --locked --manifest-path "$PITB_MATCHED_MANIFEST" --             --compare             "$RUNNER_TEMP/pitb-cohort.synthetic.json"             "$RUNNER_TEMP/pitb-runs.synthetic.jsonl"             "$RUNNER_TEMP/pitb-report.synthetic.json"

      - name: Validate cohort, run and report schemas
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-matched-venv/bin/python" -             "$RUNNER_TEMP/pitb-cohort.synthetic.json"             "$RUNNER_TEMP/pitb-runs.synthetic.jsonl"             "$RUNNER_TEMP/pitb-report.synthetic.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("tools/pitb-matched-benchmark-comparison/schema")
          names = (
              "matched-benchmark-cohort-v0.schema.json",
              "matched-benchmark-run-v0.schema.json",
              "matched-benchmark-report-v0.schema.json",
          )
          schemas = []
          for name in names:
              schema = json.loads((root / name).read_text())
              Draft202012Validator.check_schema(schema)
              schemas.append(schema)

          cohort = json.loads(Path(sys.argv[1]).read_text())
          errors = list(Draft202012Validator(schemas[0]).iter_errors(cohort))
          if errors:
              raise SystemExit("cohort schema errors: " + "; ".join(e.message for e in errors))

          lines = [line for line in Path(sys.argv[2]).read_text().splitlines() if line.strip()]
          records = [json.loads(line) for line in lines]
          for record in records:
              errors = list(Draft202012Validator(schemas[1]).iter_errors(record))
              if errors:
                  raise SystemExit("run schema errors: " + "; ".join(e.message for e in errors))

          report = json.loads(Path(sys.argv[3]).read_text())
          errors = list(Draft202012Validator(schemas[2]).iter_errors(report))
          if errors:
              raise SystemExit("report schema errors: " + "; ".join(e.message for e in errors))
          if len(records) != 8 or report["observed_task_count"] != 4 or report["observed_cluster_count"] != 2:
              raise SystemExit("synthetic paired cohort denominators changed")
          metrics = {item["arm_id"]: item for item in report["arm_metrics"]}
          if metrics["baseline"]["raw_kernel_verified_successes"] != 1:
              raise SystemExit("baseline raw success control changed")
          if metrics["challenger"]["raw_kernel_verified_successes"] != 4:
              raise SystemExit("challenger raw success control changed")
          if metrics["challenger"]["assurance_qualified_successes"] != 3:
              raise SystemExit("unreviewed proof was incorrectly assurance-qualified")
          pair = next(
              p for p in report["pairwise_comparisons"]
              if p["reference_arm_id"] == "baseline" and p["challenger_arm_id"] == "challenger"
          )
          if pair["paired_task_count"] != 4 or pair["repository_cluster_count"] != 2:
              raise SystemExit("paired task/cluster statistics changed")
          if pair["challenger_wins"] != 2 or pair["ties"] != 2 or pair["reference_wins"] != 0:
              raise SystemExit("paired success comparison changed")
          if pair["cluster_sign_flip_method"] != "exact_cluster_sign_flip":
              raise SystemExit("two-cluster synthetic test must use exact sign-flip enumeration")
          if pair["cluster_sign_flip_permutations"] != 4:
              raise SystemExit("exact sign-flip permutation denominator changed")
          if abs(pair["cluster_sign_flip_p_value"] - 0.5) > 1e-12:
              raise SystemExit("exact paired cluster sign-flip p-value changed")
          if abs(pair["holm_adjusted_p_value"] - 0.5) > 1e-12:
              raise SystemExit("Holm-adjusted synthetic pair p-value changed")
          if report["scheduler_admission"] is not False or report["cluster_unit"] != "repository":
              raise SystemExit("comparison trust boundary or cluster unit changed")
          print("PITB_MATCHED_BENCHMARK_SCHEMAS_AND_REPORT_PASS")
          PY

      - name: Retain synthetic paired comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitb-matched-benchmark-comparison
          path: |
            ${{ runner.temp }}/pitb-cohort.synthetic.json
            ${{ runner.temp }}/pitb-runs.synthetic.jsonl
            ${{ runner.temp }}/pitb-report.synthetic.json
            ${{ runner.temp }}/pitb-matched-benchmark-comparison/src/main.rs
            ${{ runner.temp }}/pitb-matched-benchmark-comparison/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
