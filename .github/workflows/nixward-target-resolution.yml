name: NixWard target-resolution conformance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/core/nixward/src/typed_nix.rs"
      - "crates/core/nixward/src/lib.rs"
      - "crates/core/nixward/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/nixward-target-resolution.yml"
  push:
    branches:
      - "research/nixward-target-resolution-v0-1-20261128"
    paths:
      - "crates/core/nixward/src/typed_nix.rs"
      - "crates/core/nixward/src/lib.rs"
      - ".github/workflows/nixward-target-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixward-target-resolution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  target-resolution:
    name: target-resolution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check typed Nix IR formatting
        run: rustfmt +1.96.0 --check --edition 2024 crates/core/nixward/src/typed_nix.rs crates/core/nixward/src/lib.rs
      - name: Run typed Nix and target-resolution tests
        run: cargo +1.96.0 test --locked -p nixward --lib typed_nix::tests
