name: Marine Robust Pareto Audit

on:
  pull_request:
    paths:
      - "tools/marine-robust-pareto-audit/**"
      - "docs/research/marine/marine-robust-pareto-v0.1.0.schema.json"
      - "docs/research/marine/fixtures/synthetic-marine-robust-pareto-v0.1.0.json"
      - ".github/workflows/marine-robust-pareto.yml"
  push:
    branches: [main]
    paths:
      - "tools/marine-robust-pareto-audit/**"
      - "docs/research/marine/marine-robust-pareto-v0.1.0.schema.json"
      - "docs/research/marine/fixtures/synthetic-marine-robust-pareto-v0.1.0.json"
      - ".github/workflows/marine-robust-pareto.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Format, lint and known-answer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format Rust source
        run: rustfmt --edition 2024 tools/marine-robust-pareto-audit/src/main.rs
      - name: Preserve formatted source
        uses: actions/upload-artifact@v4
        with:
          name: marine-robust-pareto-rustfmt
          path: tools/marine-robust-pareto-audit/src/main.rs
          if-no-files-found: error
      - name: Verify formatting
        run: rustfmt --edition 2024 --check tools/marine-robust-pareto-audit/src/main.rs
      - name: Generate isolated Cargo lockfile
        run: cargo generate-lockfile --manifest-path tools/marine-robust-pareto-audit/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/marine-robust-pareto-audit/Cargo.toml --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --manifest-path tools/marine-robust-pareto-audit/Cargo.toml
      - name: Validate schema and fixture JSON
        run: |
          python3 -c "import json; json.load(open('docs/research/marine/marine-robust-pareto-v0.1.0.schema.json')); json.load(open('docs/research/marine/fixtures/synthetic-marine-robust-pareto-v0.1.0.json'))"
      - name: Assert synthetic fixture disposition
        shell: bash
        run: |
          set +e
          cargo run --quiet --locked --manifest-path tools/marine-robust-pareto-audit/Cargo.toml -- docs/research/marine/fixtures/synthetic-marine-robust-pareto-v0.1.0.json > /tmp/marine-robust-pareto-report.json
          code=$?
          set -e
          test "$code" -eq 3
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/marine-robust-pareto-report.json'))
          assert report["disposition"] == "INCOMPLETE"
          assert len(report["candidate_reports"]) == 2
          assert len(report["robust_frontier"]) == 0
          required = {
              "biosecurity-release",
              "cleaning-waste-authorization",
              "acoustic-scale-transfer-evidence",
              "acoustic-source-identifiability",
              "cavitation-intermittency-characterization",
              "vibration-coherence-characterization",
              "rotation-synchronous-modulation",
          }
          metric_gates = {
              "acoustic-maximum-1khz",
              "acoustic-30-80khz-maximum",
              "availability-minimum",
          }
          for candidate in report["candidate_reports"]:
              gates = {gate["gate_id"]: gate["status"] for gate in candidate["gate_results"]}
              assert required <= gates.keys()
              assert all(gates[gate_id] == "unresolved" for gate_id in required)
              assert metric_gates <= gates.keys()
              assert all(gates[gate_id] == "pass" for gate_id in metric_gates)
          PY
