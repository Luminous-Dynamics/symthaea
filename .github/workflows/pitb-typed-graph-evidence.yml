name: PITB Typed Graph Evidence

on:
  pull_request:
    paths:
      - "tools/pitb-graph-evidence/**"
      - "tools/pitb-support-antichain/**"
      - ".github/workflows/pitb-typed-graph-evidence.yml"
      - ".github/workflows/pitb-support-antichain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/jsonschema-venv"
          "$RUNNER_TEMP/jsonschema-venv/bin/pip" install "jsonschema==4.25.1"

      - name: Stage verifier outside the production workspace
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/pitb-graph-evidence"
          mkdir -p "$staged/src"
          cp tools/pitb-graph-evidence/Cargo.toml "$staged/Cargo.toml"
          cp tools/pitb-graph-evidence/Cargo.lock "$staged/Cargo.lock"
          cp tools/pitb-graph-evidence/src/main.rs "$staged/src/main.rs"
          echo "PITB_GRAPH_EVIDENCE_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
          echo "PITB_GRAPH_EVIDENCE_DIR=$staged" >> "$GITHUB_ENV"

      - name: Format staged Rust source and verify formatter output
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 "$PITB_GRAPH_EVIDENCE_DIR/src/main.rs"
          cargo fmt --check --manifest-path "$PITB_GRAPH_EVIDENCE_MANIFEST"

      - name: Compile and test isolated Rust verifier
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path "$PITB_GRAPH_EVIDENCE_MANIFEST"

      - name: Validate schema and synthetic fixture
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsonschema-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("tools/pitb-graph-evidence/schema/proof-graph-evidence-v0.schema.json").read_text())
          fixture = json.loads(Path("tools/pitb-graph-evidence/fixtures/graph-evidence.synthetic.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema).iter_errors(fixture), key=lambda e: list(e.path))
          if errors:
              raise SystemExit("\n".join(f"{list(e.path)}: {e.message}" for e in errors))
          import copy
          def must_reject(label, mutate):
              candidate = copy.deepcopy(fixture)
              mutate(candidate)
              if not list(Draft202012Validator(schema).iter_errors(candidate)):
                  raise SystemExit(f"schema accepted invalid control: {label}")
              print(f"SCHEMA_NEGATIVE_CONTROL_PASS {label}")

          must_reject(
              "formal declaration requires formal name",
              lambda x: x["nodes"][0].update(formal_name=None),
          )
          must_reject(
              "relation requires matching evidence class",
              lambda x: x["edges"][0].update(evidence_class="llm_alignment"),
          )
          must_reject(
              "observed status cannot label informal candidate edge",
              lambda x: x["edges"][5].update(status="observed", confidence=None),
          )
          must_reject(
              "candidate status cannot label formal type edge",
              lambda x: x["edges"][0].update(status="candidate", confidence=0.8),
          )
          must_reject(
              "human-reviewed edge requires review artifact and key",
              lambda x: x["edges"][4].update(review_artifact_id=None, reviewer_key_id=None),
          )
          must_reject(
              "candidate confidence must stay in [0,1]",
              lambda x: x["edges"][5].update(confidence=1.01),
          )
          print("PITB_GRAPH_EVIDENCE_SCHEMA_PASS")
          PY

      - name: Run evidence-byte and adversarial self-tests
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$PITB_GRAPH_EVIDENCE_MANIFEST" -- \
            --self-test \
            tools/pitb-graph-evidence/fixtures/graph-evidence.synthetic.json \
            tools/pitb-graph-evidence/fixtures/evidence

      - name: Emit canonical synthetic summary
        run: |
          set -euo pipefail
          cargo run --manifest-path "$PITB_GRAPH_EVIDENCE_MANIFEST" -- \
            --verify \
            tools/pitb-graph-evidence/fixtures/graph-evidence.synthetic.json \
            tools/pitb-graph-evidence/fixtures/evidence \
            > "$RUNNER_TEMP/pitb-graph-evidence-summary.json"
          cat "$RUNNER_TEMP/pitb-graph-evidence-summary.json"

      - name: Retain rustfmt-normalized source for exact patch review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitb-typed-graph-evidence-build-inputs
          path: |
            ${{ runner.temp }}/pitb-graph-evidence/src/main.rs
            ${{ runner.temp }}/pitb-graph-evidence/Cargo.lock
          if-no-files-found: warn
          retention-days: 7

      - name: Retain synthetic graph summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitb-typed-graph-evidence-summary
          path: ${{ runner.temp }}/pitb-graph-evidence-summary.json
          if-no-files-found: warn
          retention-days: 30


  support-antichain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/pitb-antichain-venv"
          "$RUNNER_TEMP/pitb-antichain-venv/bin/pip" install "jsonschema==4.25.1"

      - name: Stage isolated support analyzer
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/pitb-support-antichain"
          mkdir -p "$staged/src" "$staged/schema"
          cp tools/pitb-support-antichain/Cargo.toml "$staged/Cargo.toml"
          cp tools/pitb-support-antichain/Cargo.lock "$staged/Cargo.lock"
          cp tools/pitb-support-antichain/src/main.rs "$staged/src/main.rs"
          cp tools/pitb-support-antichain/schema/*.json "$staged/schema/"
          echo "PITB_SUPPORT_ANTICHAIN_MANIFEST=$staged/Cargo.toml" >> "$GITHUB_ENV"
          echo "PITB_SUPPORT_ANTICHAIN_DIR=$staged" >> "$GITHUB_ENV"

      - name: Format and test support analyzer
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 "$PITB_SUPPORT_ANTICHAIN_DIR/src/main.rs"
          cargo fmt --check --manifest-path "$PITB_SUPPORT_ANTICHAIN_MANIFEST"
          cargo test --locked --manifest-path "$PITB_SUPPORT_ANTICHAIN_MANIFEST"

      - name: Run exhaustive support controls and emit report/outcomes
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$PITB_SUPPORT_ANTICHAIN_MANIFEST" -- \
            --self-test-report "$RUNNER_TEMP/pitb-support-antichain-report.json"
          cargo run --locked --manifest-path "$PITB_SUPPORT_ANTICHAIN_MANIFEST" -- \
            --self-test-outcomes "$RUNNER_TEMP/pitb-support-antichain-outcomes.jsonl"

      - name: Validate support schemas and synthetic report/outcomes
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-antichain-venv/bin/python" - \
            "$RUNNER_TEMP/pitb-support-antichain-report.json" \
            "$RUNNER_TEMP/pitb-support-antichain-outcomes.jsonl" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("tools/pitb-support-antichain/schema")
          outcome_schema = json.loads((root / "support-ablation-outcome-v0.schema.json").read_text())
          prediction_schema = json.loads((root / "support-antichain-prediction-v0.schema.json").read_text())
          report_schema = json.loads((root / "support-antichain-report-v0.schema.json").read_text())
          for schema in (outcome_schema, prediction_schema, report_schema):
              Draft202012Validator.check_schema(schema)
          outcome_validator = Draft202012Validator(outcome_schema)
          outcome_rows = [
              json.loads(line)
              for line in Path(sys.argv[2]).read_text().splitlines()
              if line.strip()
          ]
          if len(outcome_rows) != 16:
              raise SystemExit(f"synthetic outcome count changed: {len(outcome_rows)}")
          for row in outcome_rows:
              errors = list(outcome_validator.iter_errors(row))
              if errors:
                  raise SystemExit("synthetic outcome schema errors: " + "; ".join(e.message for e in errors))
          budget_non_solve = next(row for row in outcome_rows if row["outcome"] == "non_solve")
          interrupted = copy.deepcopy(budget_non_solve)
          interrupted["terminal_reason"] = "interrupted"
          if not list(outcome_validator.iter_errors(interrupted)):
              raise SystemExit("interrupted attempt was schema-accepted as a support non-solve")
          unfinished = copy.deepcopy(budget_non_solve)
          unfinished["attempt_finished"] = False
          if not list(outcome_validator.iter_errors(unfinished)):
              raise SystemExit("unfinished attempt was schema-accepted as a support non-solve")
          print("PITB_SUPPORT_OUTCOME_TERMINAL_SCHEMA_PASS")
          schema = report_schema
          report = json.loads(Path(sys.argv[1]).read_text())
          errors = list(Draft202012Validator(schema).iter_errors(report))
          if errors:
              raise SystemExit("report schema errors: " + "; ".join(e.message for e in errors))
          antichains = {g["target_id"]: g["minimal_sufficient_support_antichain"] for g in report["groups"]}
          if report["group_count"] != 2 or report["total_ablation_rows"] != 16:
              raise SystemExit("support-antichain synthetic denominators changed")
          if antichains.get("alternative") != [["h"], ["hEq"]]:
              raise SystemExit(f"alternative routes changed: {antichains}")
          if antichains.get("conjunctive") != [["h1", "h2"]]:
              raise SystemExit(f"conjunctive route changed: {antichains}")
          if report["prediction_analysis"]["route_sufficiency_rate"] != 1.0:
              raise SystemExit("prediction scoring changed")
          print("PITB_SUPPORT_ANTICHAIN_SCHEMA_AND_REPORT_PASS")
          PY

      - name: Retain support antichain report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitb-support-antichain-report
          path: |
            ${{ runner.temp }}/pitb-support-antichain-report.json
            ${{ runner.temp }}/pitb-support-antichain-outcomes.jsonl
            ${{ runner.temp }}/pitb-support-antichain/src/main.rs
            ${{ runner.temp }}/pitb-support-antichain/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
