name: CIV PLACE 001A oracle

on:
  push:
    paths:
      - "docs/engineering/CIV_PLACE_001A.md"
      - "docs/engineering/fixtures/civ-place-001a.json"
      - "docs/engineering/fixtures/civ-place-001a.sha256"
      - "scripts/validate_civ_place_001a.py"
      - ".github/workflows/civ-place-001a.yml"
  pull_request:
    paths:
      - "docs/engineering/CIV_PLACE_001A.md"
      - "docs/engineering/fixtures/civ-place-001a.json"
      - "docs/engineering/fixtures/civ-place-001a.sha256"
      - "scripts/validate_civ_place_001a.py"
      - ".github/workflows/civ-place-001a.yml"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run independent stdlib oracle
        run: python3 scripts/validate_civ_place_001a.py
