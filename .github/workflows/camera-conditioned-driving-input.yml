name: camera-conditioned-driving-input

on:
  pull_request:
    paths:
      - "crates/bridges/symthaea-camera-driving-bridge/**"
      - ".github/workflows/camera-conditioned-driving-input.yml"
  push:
    paths:
      - "crates/bridges/symthaea-camera-driving-bridge/**"
      - ".github/workflows/camera-conditioned-driving-input.yml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Generate canonical rustfmt output (format-bootstrap only)
        run: |
          files=(
            crates/bridges/symthaea-camera-driving-bridge/src/lib.rs
            crates/bridges/symthaea-camera-driving-bridge/src/bin/camera_driving_bridge.rs
            crates/bridges/symthaea-camera-driving-bridge/examples/write_fixture_configs.rs
          )
          rustfmt --edition 2024 "${files[@]}"
          export_formatted() {
            name="$1"
            file="$2"
            echo "__FORMAT_EXPORT_BEGIN_${name}__"
            base64 -w0 "$file" | fold -w 4000
            echo "__FORMAT_EXPORT_END_${name}__"
          }
          export_formatted BRIDGE_LIB "${files[0]}"
          export_formatted BRIDGE_BIN "${files[1]}"
          export_formatted FIXTURE_CONFIG "${files[2]}"

      - name: Run known-answer and adversarial tests
        run: cargo test --locked --manifest-path crates/bridges/symthaea-camera-driving-bridge/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path crates/bridges/symthaea-camera-driving-bridge/Cargo.toml --all-targets --all-features -- -D warnings
