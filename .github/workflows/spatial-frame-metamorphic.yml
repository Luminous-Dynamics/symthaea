name: Spatial frame metamorphic matrix integrity

on:
  push:
    branches:
      - research/spatial-frame-metamorphic-v0
    paths:
      - "docs/research/spatial-frame-metamorphic-v0.1.json"
      - "docs/research/spatial-frame-metamorphic-v0.1.schema.json"
      - "crates/core/symthaea-core/tests/spatial_frame_metamorphic.rs"
      - "Cargo.toml"
      - ".github/workflows/spatial-frame-metamorphic.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/research/spatial-frame-metamorphic-v0.1.json"
      - "docs/research/spatial-frame-metamorphic-v0.1.schema.json"
      - ".github/workflows/spatial-frame-metamorphic.yml"

permissions:
  contents: read

concurrency:
  group: spatial-frame-metamorphic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Exact-head schema and paired-matrix audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting of analytic frame oracle
        run: rustfmt --edition 2024 --check crates/core/symthaea-core/tests/spatial_frame_metamorphic.rs

      - name: Run analytic frame metamorphic tests
        run: cargo test --locked -p symthaea-core --no-default-features --test spatial_frame_metamorphic

      - name: Run strict Clippy on analytic frame oracle
        run: cargo clippy --locked -p symthaea-core --no-default-features --test spatial_frame_metamorphic -- -D warnings

      - name: Validate schema and exact paired matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(".")
          schema = json.loads((root / "docs/research/spatial-frame-metamorphic-v0.1.schema.json").read_text())
          matrix = json.loads((root / "docs/research/spatial-frame-metamorphic-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(matrix),
              key=lambda error: (list(error.path), error.message),
          )
          if errors:
              for error in errors:
                  print(f"SCHEMA ERROR at {list(error.path)}: {error.message}")
              raise SystemExit(1)

          cases = {item["case_id"]: item for item in matrix["cases"]}
          pairs = matrix["pairs"]
          if len(cases) != 24 or len(pairs) != 12:
              raise SystemExit("expected exactly 24 unique cases and 12 pairs")
          for pair in pairs:
              control = cases.get(pair["control_case_id"])
              mutation = cases.get(pair["mutation_case_id"])
              if control is None or mutation is None:
                  raise SystemExit(f"missing case reference in {pair['pair_id']}")
              if control["pair_id"] != pair["pair_id"] or mutation["pair_id"] != pair["pair_id"]:
                  raise SystemExit(f"case/pair identity mismatch in {pair['pair_id']}")
              if control["pair_role"] != "control" or mutation["pair_role"] != "mutation":
                  raise SystemExit(f"invalid control/mutation roles in {pair['pair_id']}")
              if control["task_family"] != mutation["task_family"]:
                  raise SystemExit(f"task-family mismatch in {pair['pair_id']}")
          if len({case["pair_id"] for case in matrix["cases"]}) != 12:
              raise SystemExit("not all 12 pairs are represented")
          if not any(case["negative_control"] for case in matrix["cases"]):
              raise SystemExit("negative controls are required")
          print("OK: 24 exact-head cases, 12 complete pairs, schema and negative-control coverage.")
          PY
