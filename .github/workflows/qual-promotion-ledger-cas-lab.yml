name: QUAL promotion ledger Git-ref CAS lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cas-lab:
    if: github.repository == 'Luminous-Dynamics/symthaea' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Exercise provider-level promotion ledger serialization
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_REF: refs/heads/_qual-promotion-cas-lab-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          api_root="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          ref_path="${LAB_REF#refs/}"

          cleanup() {
            curl -sS -o /dev/null -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "${api_root}/git/refs/${ref_path}" || true
          }
          trap cleanup EXIT

          BASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          TREE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${BASE_SHA}" --jq '.tree.sha')"

          echo "base_sha=${BASE_SHA}"
          echo "tree_sha=${TREE_SHA}"
          echo "lab_ref=${LAB_REF}"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="${LAB_REF}" \
            -f sha="${BASE_SHA}" >/dev/null

          LAB_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref_path}" --jq '.object.sha')"
          test "${LAB_HEAD}" = "${BASE_SHA}"

          create_commit() {
            local message="$1"
            local parent="$2"
            jq -n \
              --arg message "${message}" \
              --arg tree "${TREE_SHA}" \
              --arg parent "${parent}" \
              '{message:$message, tree:$tree, parents:[$parent]}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq '.sha'
          }

          update_ref_status() {
            local target="$1"
            local response_file="$2"
            curl -sS -o "${response_file}" -w '%{http_code}' \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "${api_root}/git/refs/${ref_path}" \
              -d "$(jq -n --arg sha "${target}" '{sha:$sha, force:false}')"
          }

          # Two valid successor candidates share the same observed predecessor.
          WINNER_SHA="$(create_commit 'qual-cas-lab: winner successor' "${BASE_SHA}")"
          STALE_SHA="$(create_commit 'qual-cas-lab: stale successor' "${BASE_SHA}")"

          winner_response="$(mktemp)"
          winner_status="$(update_ref_status "${WINNER_SHA}" "${winner_response}")"
          test "${winner_status}" = "200"

          CURRENT_AFTER_WINNER="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref_path}" --jq '.object.sha')"
          test "${CURRENT_AFTER_WINNER}" = "${WINNER_SHA}"

          stale_response="$(mktemp)"
          stale_status="$(update_ref_status "${STALE_SHA}" "${stale_response}")"
          case "${stale_status}" in
            409|422) ;;
            *)
              echo "unexpected stale update HTTP status: ${stale_status}" >&2
              cat "${stale_response}" >&2
              exit 1
              ;;
          esac

          CURRENT_AFTER_STALE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref_path}" --jq '.object.sha')"
          test "${CURRENT_AFTER_STALE}" = "${WINNER_SHA}"

          # A newer invalidation is itself a successor of the current ledger head.
          INVALIDATION_SHA="$(create_commit 'qual-cas-lab: trust-root invalidation successor' "${WINNER_SHA}")"
          invalidation_response="$(mktemp)"
          invalidation_status="$(update_ref_status "${INVALIDATION_SHA}" "${invalidation_response}")"
          test "${invalidation_status}" = "200"

          CURRENT_AFTER_INVALIDATION="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref_path}" --jq '.object.sha')"
          test "${CURRENT_AFTER_INVALIDATION}" = "${INVALIDATION_SHA}"

          # The original stale candidate is still a valid Git object, but cannot become current.
          stale_after_invalidation_response="$(mktemp)"
          stale_after_invalidation_status="$(update_ref_status "${STALE_SHA}" "${stale_after_invalidation_response}")"
          case "${stale_after_invalidation_status}" in
            409|422) ;;
            *)
              echo "unexpected late-stale HTTP status: ${stale_after_invalidation_status}" >&2
              cat "${stale_after_invalidation_response}" >&2
              exit 1
              ;;
          esac

          CURRENT_AFTER_LATE_STALE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref_path}" --jq '.object.sha')"
          test "${CURRENT_AFTER_LATE_STALE}" = "${INVALIDATION_SHA}"

          # Rollback to the historical predecessor is also non-fast-forward and must fail.
          rollback_response="$(mktemp)"
          rollback_status="$(update_ref_status "${BASE_SHA}" "${rollback_response}")"
          case "${rollback_status}" in
            409|422) ;;
            *)
              echo "unexpected rollback HTTP status: ${rollback_status}" >&2
              cat "${rollback_response}" >&2
              exit 1
              ;;
          esac

          CURRENT_AFTER_ROLLBACK="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref_path}" --jq '.object.sha')"
          test "${CURRENT_AFTER_ROLLBACK}" = "${INVALIDATION_SHA}"

          STALE_OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${STALE_SHA}" --jq '.sha')"
          test "${STALE_OBJECT_SHA}" = "${STALE_SHA}"

          {
            echo "## Promotion ledger Git-ref CAS lab"
            echo
            echo "- repository: \`${GITHUB_REPOSITORY}\`"
            echo "- main_head: \`${BASE_SHA}\`"
            echo "- lab_ref: \`${LAB_REF}\`"
            echo "- winner_success_http: \`${winner_status}\`"
            echo "- stale_from_same_parent_http: \`${stale_status}\`"
            echo "- invalidation_success_http: \`${invalidation_status}\`"
            echo "- late_stale_http: \`${stale_after_invalidation_status}\`"
            echo "- rollback_http: \`${rollback_status}\`"
            echo "- winner_sha: \`${WINNER_SHA}\`"
            echo "- stale_candidate_sha: \`${STALE_SHA}\`"
            echo "- invalidation_sha: \`${INVALIDATION_SHA}\`"
            echo "- final_current_ref_sha: \`${CURRENT_AFTER_ROLLBACK}\`"
            echo "- stale_candidate_remained_reachable_as_object: true"
            echo "- stale_candidate_became_active: false"
            echo "- claim: same-parent successors serialize at the Git-ref publication point when non-fast-forward updates are rejected"
          } >> "$GITHUB_STEP_SUMMARY"