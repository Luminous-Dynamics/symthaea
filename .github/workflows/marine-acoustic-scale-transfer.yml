name: Marine acoustic scale-transfer audit

on:
  push:
    paths:
      - "tools/marine-acoustic-scale-transfer-audit/**"
      - "docs/research/marine/fixtures/synthetic-acoustic-scale-transfer-v0.1.0.json"
      - ".github/workflows/marine-acoustic-scale-transfer.yml"
  pull_request:
    paths:
      - "tools/marine-acoustic-scale-transfer-audit/**"
      - "docs/research/marine/fixtures/synthetic-acoustic-scale-transfer-v0.1.0.json"
      - ".github/workflows/marine-acoustic-scale-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Generate standalone lockfile
        run: cargo generate-lockfile --manifest-path tools/marine-acoustic-scale-transfer-audit/Cargo.toml
      - name: Format
        run: cargo fmt --manifest-path tools/marine-acoustic-scale-transfer-audit/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/marine-acoustic-scale-transfer-audit/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/marine-acoustic-scale-transfer-audit/Cargo.toml
      - name: Synthetic fixture audit remains incomplete
        run: |
          set +e
          cargo run --locked --manifest-path tools/marine-acoustic-scale-transfer-audit/Cargo.toml -- docs/research/marine/fixtures/synthetic-acoustic-scale-transfer-v0.1.0.json > audit.json
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"overall_disposition": "INCOMPLETE"' audit.json
          grep -q '"physical_validation_disposition": "NOT_EVALUATED_SYNTHETIC"' audit.json
      - name: Preserve exact-run lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marine-acoustic-scale-transfer-lock-${{ github.sha }}
          path: tools/marine-acoustic-scale-transfer-audit/Cargo.lock
          if-no-files-found: warn
