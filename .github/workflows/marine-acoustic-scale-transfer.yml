name: Marine Acoustic Scale Transfer Audit

on:
  pull_request:
    paths:
      - "tools/marine-acoustic-scale-transfer-audit/**"
      - "docs/research/marine/marine-acoustic-scale-transfer-v0.1.0.schema.json"
      - "docs/research/marine/fixtures/synthetic-marine-acoustic-scale-transfer-v0.1.0.json"
      - ".github/workflows/marine-acoustic-scale-transfer.yml"
  push:
    branches: [main]
    paths:
      - "tools/marine-acoustic-scale-transfer-audit/**"
      - "docs/research/marine/marine-acoustic-scale-transfer-v0.1.0.schema.json"
      - "docs/research/marine/fixtures/synthetic-marine-acoustic-scale-transfer-v0.1.0.json"
      - ".github/workflows/marine-acoustic-scale-transfer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Format, lint and known-answer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format Rust source
        run: cargo fmt --manifest-path tools/marine-acoustic-scale-transfer-audit/Cargo.toml
      - name: Preserve rustfmt output for exact-head commit
        uses: actions/upload-artifact@v4
        with:
          name: marine-acoustic-scale-transfer-rustfmt
          path: tools/marine-acoustic-scale-transfer-audit/src/main.rs
          if-no-files-found: error
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/marine-acoustic-scale-transfer-audit/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/marine-acoustic-scale-transfer-audit/Cargo.toml --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --manifest-path tools/marine-acoustic-scale-transfer-audit/Cargo.toml
      - name: Validate fixture JSON and schema JSON syntax
        run: |
          python3 -c "import json; json.load(open('docs/research/marine/marine-acoustic-scale-transfer-v0.1.0.schema.json')); json.load(open('docs/research/marine/fixtures/synthetic-marine-acoustic-scale-transfer-v0.1.0.json'))"
      - name: Commit canonical rustfmt output
        if: success() && github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/marine-acoustic-scale-transfer-audit/src/main.rs
          if git diff --cached --quiet; then
            echo "Rust source already matches rustfmt."
          else
            git commit -m "style(marine): apply canonical rustfmt output"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            echo "Committed formatted source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi
