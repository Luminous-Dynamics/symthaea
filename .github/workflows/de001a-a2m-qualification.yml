      - name: Upload A2M qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: de001a-a2m-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/de001a-a2m-evidence
          if-no-files-found: error
          retention-days: 90

