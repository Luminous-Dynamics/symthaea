name: Plasma benchmark cohort contract

on:
  push:
    paths:
      - "crates/tools/plasma-benchmark-contract/**"
      - "benchmarks/plasma/physics-cohort-profiles-v0.1.json"
      - ".github/workflows/plasma-benchmark-contract.yml"
  pull_request:
    paths:
      - "crates/tools/plasma-benchmark-contract/**"
      - "benchmarks/plasma/physics-cohort-profiles-v0.1.json"
      - ".github/workflows/plasma-benchmark-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Strict format check
        run: cargo fmt --manifest-path crates/tools/plasma-benchmark-contract/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/plasma-benchmark-contract/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/plasma-benchmark-contract/Cargo.toml --all-targets -- -D warnings
      - name: Validate cohort profile JSON
        run: python3 -m json.tool benchmarks/plasma/physics-cohort-profiles-v0.1.json > /dev/null
