name: Mesh Protocol Formal Models

on:
  pull_request:
    paths:
      - "docs/security/models/*.tla"
      - "docs/security/models/*.cfg"
      - "docs/security/*ASSURANCE*.md"
      - ".github/workflows/mesh-handshake-model.yml"
  push:
    branches: [main]
    paths:
      - "docs/security/models/*.tla"
      - "docs/security/models/*.cfg"
      - "docs/security/*ASSURANCE*.md"
      - ".github/workflows/mesh-handshake-model.yml"

permissions:
  contents: read

concurrency:
  group: mesh-formal-models-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOOL_JAR: ${{ runner.temp }}/tla2tools.jar
      EVIDENCE_DIR: target/mesh-formal-models
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify pinned TLA+ tools
        env:
          TLA_VERSION: v1.8.0
          TLA_SHA256: dae639a1f51a9e13ce60c369b15f32124cf1a78017aca366b6de0ae2b5169439
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar" \
            --output "$TOOL_JAR"
          printf '%s  %s\n' "$TLA_SHA256" "$TOOL_JAR" | sha256sum --check --strict
          printf 'TLA_VERSION=%s\nTLA_SHA256=%s\n' "$TLA_VERSION" "$TLA_SHA256" \
            | tee "$EVIDENCE_DIR/tool-identity.txt"
          java -version 2>> "$EVIDENCE_DIR/tool-identity.txt"

      - name: Parse every model
        run: |
          set -euo pipefail
          find docs/security/models -maxdepth 1 -type f \( -name '*.tla' -o -name '*.cfg' \) \
            -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/input-sha256.txt"
          shopt -s nullglob
          models=(docs/security/models/*.tla)
          if [[ ${#models[@]} -eq 0 ]]; then
            echo "::error::No TLA+ models found"
            exit 1
          fi
          for model in "${models[@]}"; do
            log="$EVIDENCE_DIR/$(basename "$model").parser.log"
            echo "Parsing $model"
            java -cp "$TOOL_JAR" tla2sany.SANY "$model" 2>&1 | tee "$log"
          done

      - name: Check strict configurations
        run: |
          set -euo pipefail
          run_strict() {
            local model="$1"
            local cfg="$2"
            local log="$EVIDENCE_DIR/$(basename "$cfg").log"
            echo "Running strict model: $cfg"
            java -cp "$TOOL_JAR" tlc2.TLC -workers 1 -config "$cfg" "$model" \
              2>&1 | tee "$log"
          }

          if [[ -f docs/security/models/MESH_HANDSHAKE_LIFECYCLE.tla ]]; then
            run_strict docs/security/models/MESH_HANDSHAKE_LIFECYCLE.tla \
              docs/security/models/mesh_handshake_strict.cfg
            run_strict docs/security/models/MESH_HANDSHAKE_LIFECYCLE.tla \
              docs/security/models/mesh_handshake_strict_missing_backend.cfg
          fi

          if [[ -f docs/security/models/MESH_NONCE_LIFECYCLE.tla ]]; then
            run_strict docs/security/models/MESH_NONCE_LIFECYCLE.tla \
              docs/security/models/packet_shared_key_collision_strict.cfg
            run_strict docs/security/models/MESH_NONCE_LIFECYCLE.tla \
              docs/security/models/packet_restart_strict.cfg
            run_strict docs/security/models/MESH_NONCE_LIFECYCLE.tla \
              docs/security/models/fragment_wrap_strict.cfg
          fi

      - name: Require legacy mutants to violate the intended invariant
        shell: bash
        run: |
          set -euo pipefail
          check_mutant() {
            local model="$1"
            local cfg="$2"
            local expected_invariant="$3"
            local log="$EVIDENCE_DIR/$(basename "$cfg").log"
            local rc=0
            echo "Running expected-counterexample model: $cfg"
            set +e
            java -cp "$TOOL_JAR" tlc2.TLC -workers 1 -config "$cfg" "$model" \
              > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [[ "$rc" -eq 0 ]]; then
              echo "::error::Mutant unexpectedly passed: $cfg"
              exit 1
            fi
            if ! grep -Fq "Invariant ${expected_invariant} is violated" "$log"; then
              echo "::error::TLC did not report expected invariant ${expected_invariant} for $cfg (exit=$rc)"
              exit 1
            fi
            printf 'EXPECTED_COUNTEREXAMPLE config=%s invariant=%s exit=%s\n' \
              "$cfg" "$expected_invariant" "$rc" \
              | tee -a "$EVIDENCE_DIR/expected-counterexamples.txt"
          }

          if [[ -f docs/security/models/MESH_HANDSHAKE_LIFECYCLE.tla ]]; then
            check_mutant docs/security/models/MESH_HANDSHAKE_LIFECYCLE.tla \
              docs/security/models/mesh_handshake_one_sided_legacy.cfg EstablishedSound
            check_mutant docs/security/models/MESH_HANDSHAKE_LIFECYCLE.tla \
              docs/security/models/mesh_handshake_stub_backend_legacy.cfg EstablishedSound
            check_mutant docs/security/models/MESH_HANDSHAKE_LIFECYCLE.tla \
              docs/security/models/mesh_handshake_downgrade_legacy.cfg EstablishedSound
          fi

          if [[ -f docs/security/models/MESH_NONCE_LIFECYCLE.tla ]]; then
            check_mutant docs/security/models/MESH_NONCE_LIFECYCLE.tla \
              docs/security/models/packet_shared_key_collision_legacy.cfg NoNonceReuse
            check_mutant docs/security/models/MESH_NONCE_LIFECYCLE.tla \
              docs/security/models/packet_restart_legacy.cfg NoNonceReuse
            check_mutant docs/security/models/MESH_NONCE_LIFECYCLE.tla \
              docs/security/models/fragment_wrap_legacy.cfg NoNonceReuse
          fi

      - name: Finalize evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'git_head=%s\n' "$(git rev-parse HEAD)"
            printf 'working_tree_status_sha256=%s\n' "$(git status --porcelain | sha256sum | cut -d' ' -f1)"
            find docs/security/models -maxdepth 1 -type f \( -name '*.tla' -o -name '*.cfg' \) \
              -print0 | sort -z | xargs -0 sha256sum
          } > "$EVIDENCE_DIR/run-manifest.txt"

      - name: Upload model-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-formal-model-evidence
          path: target/mesh-formal-models/
          if-no-files-found: error
          retention-days: 30
