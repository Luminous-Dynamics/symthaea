name: Audio edit session ledger assurance

on:
  pull_request:
    paths:
      - "tools/audio-edit-session-assurance/**"
      - "docs/research/MMAE_SESSION_LEDGER_ASSURANCE_V1.md"
      - ".github/workflows/audio-edit-session-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-edit-session-ledger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "AUDIO_EDIT_SESSION_LEDGER_REVISION=$actual" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format-check session ledger evaluator
        run: cargo +1.96.0 fmt --check --manifest-path tools/audio-edit-session-assurance/Cargo.toml

      - name: Generate isolated lockfile
        run: cargo +1.96.0 generate-lockfile --manifest-path tools/audio-edit-session-assurance/Cargo.toml

      - name: Run ledger replay and anti-regression controls
        run: cargo +1.96.0 test --locked --manifest-path tools/audio-edit-session-assurance/Cargo.toml
