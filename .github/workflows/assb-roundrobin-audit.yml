name: ASSB round-robin reproducibility audit v0.1

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/transport/ASSB_ROUNDROBIN_REPRODUCIBILITY_V0_1.md"
      - "schemas/transport/assb_roundrobin_v0_1.schema.json"
      - "fixtures/assb/assb_roundrobin_v0_1.json"
      - "tools/assb-roundrobin-audit/**"
      - ".github/workflows/assb-roundrobin-audit.yml"
  push:
    branches: [research/assb-roundrobin-v0.1]
    paths:
      - "docs/transport/ASSB_ROUNDROBIN_REPRODUCIBILITY_V0_1.md"
      - "schemas/transport/assb_roundrobin_v0_1.schema.json"
      - "fixtures/assb/assb_roundrobin_v0_1.json"
      - "tools/assb-roundrobin-audit/**"
      - ".github/workflows/assb-roundrobin-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Validate Draft 2020-12 schema and fixture
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/transport/assb_roundrobin_v0_1.schema.json").read_text(encoding="utf-8"))
          fixture = json.loads(Path("fixtures/assb/assb_roundrobin_v0_1.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          assert len(fixture["laboratories"]) == 3
          assert len(fixture["cells"]) == 9
          assert len(fixture["observations"]) == 9
          print("schema=VALID fixture=VALID labs=3 cells=9 observations=9")
          PY
      - name: Check locked package metadata
        run: cargo metadata --manifest-path tools/assb-roundrobin-audit/Cargo.toml --locked --no-deps
      - name: Check formatting
        run: cargo fmt --manifest-path tools/assb-roundrobin-audit/Cargo.toml -- --check
      - name: Run reproducibility known-answer tests
        run: cargo test --manifest-path tools/assb-roundrobin-audit/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/assb-roundrobin-audit/Cargo.toml --all-targets --locked -- -D warnings
