name: LL-004F Real SPICE Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "configs/lunar_transport/ll004f_*.json"
      - "scripts/generate_ll004f_spice_snapshots.py"
      - "scripts/verify_ll004f_kernel_locks.py"
      - "scripts/compare_ll004f_lunar_frames.py"
      - "scripts/run_ll004f_real_evidence.py"
      - ".github/workflows/ll004f-real-evidence.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-real-spice-evidence:
    name: Generate pinned DE421/DE440 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify unified evidence runner
        run: python3 scripts/run_ll004f_real_evidence.py --self-test

      - name: Generate exact LL-004F evidence
        run: |
          python3 scripts/run_ll004f_real_evidence.py \
            --repo-root . \
            --work-root target/ll004f-real-run \
            --git-sha "${{ github.sha }}"

      - name: Upload LL-004F real evidence
        uses: actions/upload-artifact@v4
        with:
          name: ll004f-real-spice-evidence-${{ github.sha }}
          path: target/ll004f-real-run/evidence/
          if-no-files-found: error
          retention-days: 30
