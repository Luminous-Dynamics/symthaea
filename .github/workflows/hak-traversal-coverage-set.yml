name: HAK Traversal Coverage Set

on:
  pull_request:
    branches:
      - architecture/hak-verified-traversal-v1
    paths:
      - 'scripts/hak_traversal_coverage_set.py'
      - 'tests/python/test_hak_traversal_coverage_set.py'
      - 'tests/python/test_hak_traversal_coverage_set_schema.py'
      - 'tests/python/test_hak_traversal_coverage_set_adversarial.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_TRAVERSAL_COVERAGE_SET_V1.md'
      - 'docs/architecture/hak/traversal-coverage-set-v1.schema.json'
      - 'docs/architecture/hak/plans/hak018b-traversal-coverage-set-e5-v1.plan.json'
      - 'docs/architecture/hak/policies/hak018b-traversal-coverage-set-binding-policy-v1.json'
      - '.github/workflows/hak-traversal-coverage-set.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  traversal-coverage-set:
    name: HAK Traversal Coverage Set
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          echo "HAK-018b exact subject: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HAK-018b test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile HAK-018b tooling
        run: python -m py_compile scripts/hak_traversal_coverage_set.py

      - name: Validate HAK-018b schema syntax
        run: python -m json.tool docs/architecture/hak/traversal-coverage-set-v1.schema.json >/dev/null

      - name: Lint HAK-018b qualification plan
        run: python scripts/hak_evidence_lint.py docs/architecture/hak/plans/hak018b-traversal-coverage-set-e5-v1.plan.json

      - name: Lint HAK-018b check-binding policy
        run: |
          python scripts/hak_check_binding_lint.py \
            --plan docs/architecture/hak/plans/hak018b-traversal-coverage-set-e5-v1.plan.json \
            --policy docs/architecture/hak/policies/hak018b-traversal-coverage-set-binding-policy-v1.json

      - name: Run HAK-018b regressions
        run: |
          python -m pytest -q \
            tests/python/test_hak_traversal_coverage_set.py \
            tests/python/test_hak_traversal_coverage_set_schema.py \
            tests/python/test_hak_traversal_coverage_set_adversarial.py
