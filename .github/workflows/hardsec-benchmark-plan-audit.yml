name: HARDSEC-017 benchmark plan audit

on:
  pull_request:
    paths:
      - "examples/hardsec_benchmark_plan_audit.rs"
      - "docs/research/HARDSEC_017_HARDWARE_ATTACK_BENCHMARK.md"
      - "schemas/hardsec-hardware-benchmark-plan-v1.schema.json"
      - "tests/fixtures/hardsec/hardware-benchmark-plan-v1.json"
      - "tools/hardsec-adaptive-evasion-audit-harness/**"
      - ".github/workflows/hardsec-benchmark-plan-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardsec-benchmark-plan-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-plan-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check formatting
        run: rustfmt --edition 2024 --check examples/hardsec_benchmark_plan_audit.rs
      - name: Run focused plan-audit unit suite
        run: cargo test --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-benchmark-plan-audit --example hardsec_benchmark_plan_audit
      - name: Audit machine-readable benchmark plan
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$(mktemp -d)"
          cargo run --locked --manifest-path tools/hardsec-adaptive-evasion-audit-harness/Cargo.toml --features hardsec-benchmark-plan-audit --example hardsec_benchmark_plan_audit -- \
            --plan tests/fixtures/hardsec/hardware-benchmark-plan-v1.json \
            --receipt "$out_dir/plan-receipt.json"
          python3 - "$out_dir/plan-receipt.json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              receipt = json.load(handle)
          assert receipt["result"] == "plan_validated"
          assert receipt["coverage"]["dataset_source_count"] == 3
          assert receipt["coverage"]["baseline_arm_count"] == 10
          assert receipt["coverage"]["candidate_arm_count"] == 3
          assert receipt["coverage"]["split_count"] == 8
          assert receipt["coverage"]["attack_family_count"] == 9
          assert receipt["coverage"]["negative_control_count"] == 13
          support = receipt["statistical_support"]
          assert support["single_endpoint_zero_failure_groups_for_5_percent_risk"] == 59
          assert support["single_endpoint_zero_failure_groups_for_1_percent_risk"] == 299
          assert support["six_endpoint_zero_failure_groups_for_5_percent_risk"] == 94
          assert support["six_endpoint_zero_failure_groups_for_1_percent_risk"] == 477
          assert support["effective_sample_size_estimate"] is None
          PY
