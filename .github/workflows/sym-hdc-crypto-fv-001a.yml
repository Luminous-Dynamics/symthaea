name: SYM-HDC-CRYPTO-FV-001A Attack Algebra

on:
  pull_request:
    paths:
      - "formal/lean/hdc/BinaryHVBind.lean"
      - "formal/lean/hdc/HdcCryptoAttacks.lean"
      - "docs/formal/sym-hdc-crypto-fv-001a-v1.json"
      - "scripts/validate_sym_hdc_crypto_fv_001a.py"
      - "crates/core/symthaea-hdc-crypto/src/crypto.rs"
      - "crates/core/symthaea-core/src/hdc/hdc_crypto.rs"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/sym-hdc-crypto-fv-001a.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sym-hdc-crypto-fv-001a-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  attack-algebra:
    name: Lean HDC attack algebra
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact Git subject
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain=v1 --untracked-files=all

      - name: Static contract and hostile controls
        run: python3 scripts/validate_sym_hdc_crypto_fv_001a.py

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Typecheck exact parent algebra plus child attack theorems
        run: |
          set -euo pipefail
          cat formal/lean/hdc/BinaryHVBind.lean formal/lean/hdc/HdcCryptoAttacks.lean \
            > /tmp/HdcCryptoCombined.lean
          nix develop .#formal --command sh -c '
            set -eu
            lean --version | tee /tmp/sym-hdc-crypto-fv-001a-lean-version.txt
            lean /tmp/HdcCryptoCombined.lean | tee /tmp/sym-hdc-crypto-fv-001a-lean-output.txt
          '

      - name: Postflight immutability and receipt
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          receipt = {
              "schema": "symthaea.formal.sym-hdc-crypto-fv-001a-qualification-receipt.v1",
              "issue": 5857,
              "parent_issue": 5844,
              "evidence_class": "AbstractFormalTheorem",
              "result": "LeanTypechecked",
              "head": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "lean_version": Path("/tmp/sym-hdc-crypto-fv-001a-lean-version.txt").read_text().strip(),
              "parent_theorem_blob": git("rev-parse", "HEAD:formal/lean/hdc/BinaryHVBind.lean"),
              "parent_theorem_sha256": sha256("formal/lean/hdc/BinaryHVBind.lean"),
              "child_theorem_sha256": sha256("formal/lean/hdc/HdcCryptoAttacks.lean"),
              "combined_theorem_sha256": sha256("/tmp/HdcCryptoCombined.lean"),
              "manifest_sha256": sha256("docs/formal/sym-hdc-crypto-fv-001a-v1.json"),
              "validator_sha256": sha256("scripts/validate_sym_hdc_crypto_fv_001a.py"),
              "standalone_crypto_blob": git("rev-parse", "HEAD:crates/core/symthaea-hdc-crypto/src/crypto.rs"),
              "core_compat_crypto_blob": git("rev-parse", "HEAD:crates/core/symthaea-core/src/hdc/hdc_crypto.rs"),
              "static_contract": "PASS",
              "negative_controls": "PASS",
              "lean_exit_zero": True,
              "repository_postflight_clean": True,
              "nonclaims": [
                  "not-production-rust-refinement",
                  "not-proof-all-hdc-cryptography-insecure",
                  "not-secure-replacement"
              ]
          }
          Path("/tmp/sym-hdc-crypto-fv-001a-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Retain proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sym-hdc-crypto-fv-001a-${{ github.sha }}
          path: |
            /tmp/HdcCryptoCombined.lean
            /tmp/sym-hdc-crypto-fv-001a-lean-version.txt
            /tmp/sym-hdc-crypto-fv-001a-lean-output.txt
            /tmp/sym-hdc-crypto-fv-001a-receipt.json
          if-no-files-found: error
          retention-days: 30
