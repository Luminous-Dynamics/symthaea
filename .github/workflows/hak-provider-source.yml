name: HAK Provider Source Observation

on:
  pull_request:
    branches:
      - architecture/hak-real-provider-evidence-integration-v1
    paths:
      - 'scripts/hak_provider_source_lint.py'
      - 'tests/python/test_hak_provider_source_lint.py'
      - 'tests/python/test_hak_provider_source_schema.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_PROVIDER_SOURCE_OBSERVATIONS_V1.md'
      - 'docs/architecture/hak/provider-source-observation-v1.schema.json'
      - 'docs/architecture/hak/provider-projection-map-v1.schema.json'
      - 'docs/architecture/hak/plans/hak012-provider-source-observations-e5-v1.plan.json'
      - 'docs/architecture/hak/policies/hak012-provider-source-observation-binding-policy-v1.json'
      - 'docs/architecture/hak/evidence/source/**'
      - '.github/workflows/hak-provider-source.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-source:
    name: HAK Provider Source Observation
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          echo "HAK-012 exact subject: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile HAK source-observation tooling
        run: |
          python -m py_compile scripts/hak_evidence_lint.py
          python -m py_compile scripts/hak_check_binding_lint.py
          python -m py_compile scripts/hak_real_evidence_lint.py
          python -m py_compile scripts/hak_provider_source_lint.py

      - name: Validate HAK-012 schema syntax
        run: |
          python -m json.tool docs/architecture/hak/provider-source-observation-v1.schema.json >/dev/null
          python -m json.tool docs/architecture/hak/provider-projection-map-v1.schema.json >/dev/null

      - name: Lint HAK-012 qualification plan
        run: |
          python scripts/hak_evidence_lint.py \
            docs/architecture/hak/plans/hak012-provider-source-observations-e5-v1.plan.json

      - name: Lint HAK-012 check-binding policy
        run: |
          python scripts/hak_check_binding_lint.py \
            --plan docs/architecture/hak/plans/hak012-provider-source-observations-e5-v1.plan.json \
            --policy docs/architecture/hak/policies/hak012-provider-source-observation-binding-policy-v1.json

      - name: Validate real provider source observations
        run: |
          python scripts/hak_provider_source_lint.py \
            --capsule docs/architecture/hak/evidence/real/hak007-run-34225891059.capsule.json \
            --projection docs/architecture/hak/evidence/source/hak007-run-34225891059.provider-projection.json \
            --observation docs/architecture/hak/evidence/source/hak007-run-34225891059.workflow-run.observation.json \
            --observation docs/architecture/hak/evidence/source/hak007-run-34225891059.jobs.observation.json \
            --observation docs/architecture/hak/evidence/source/hak007-run-34225891059.job-102059802264.steps.observation.json

      - name: Validate provider projection provenance
        run: |
          python -m pytest -q tests/python/test_hak_provider_source_lint.py::test_real_source_projection_valid

      - name: Run HAK-012 regressions
        run: |
          python -m pytest -q \
            tests/python/test_hak_provider_source_lint.py \
            tests/python/test_hak_provider_source_schema.py
