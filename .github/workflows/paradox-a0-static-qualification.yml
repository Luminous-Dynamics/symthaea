name: PARADOX A0 Static Contract Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/paradox-a0-static-qualification.yml'

permissions:
  contents: read

concurrency:
  group: paradox-a0-static-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUNNER_SHA: ${{ github.event.pull_request.head.sha }}
  RUNNER_BASE_SHA: 4bad8af72ff775e7c869b6df83faba718a339a36
  SUBJECT_SHA: 3a82ed5495c2c55460634373e428fcb0374a5491
  G2B_SHA: 09d83a1d1fddbbbd30e4eba7cc95946c8eab871f
  PRODUCTION_SHA: eb73527d05a913e79d1f05135ad6b06c1da8e2ee

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact runner plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RUNNER_SHA }}
          fetch-depth: 2

      - name: Bind runner plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RUNNER_SHA}"
          test "$(git rev-parse HEAD^)" = "${RUNNER_BASE_SHA}"
          test "$(git rev-list --count "${RUNNER_BASE_SHA}..${RUNNER_SHA}")" = 1
          test -z "$(git status --porcelain --untracked-files=all)"
          changed="$(git diff --name-only "${RUNNER_BASE_SHA}" "${RUNNER_SHA}")"
          test "${changed}" = '.github/workflows/paradox-a0-static-qualification.yml'
          printf 'runner-plane subject=%s base=%s\n' "${RUNNER_SHA}" "${RUNNER_BASE_SHA}"

      - name: Checkout exact A0 development subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 2

      - name: Bind exact A0 subject and research-only surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git rev-parse HEAD^)" = "${G2B_SHA}"
          test "$(git rev-list --count "${G2B_SHA}..${SUBJECT_SHA}")" = 1
          test -z "$(git status --porcelain --untracked-files=all)"

          actual="$(git diff --name-only "${G2B_SHA}" "${SUBJECT_SHA}" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            tools/paradox_a0_native_readout/LATENT_READOUT.md \
            tools/paradox_a0_native_readout/README.md \
            tools/paradox_a0_native_readout/a0r_contract_audit.py \
            tools/paradox_a0_native_readout/a0r_latent_contract.json \
            tools/paradox_a0_native_readout/a0r_receipt_audit.py \
            tools/paradox_a0_native_readout/a0r_receipt_contract.json \
            tools/paradox_a0_native_readout/a0r_statistics.json \
            tools/paradox_a0_native_readout/a0r_statistics_audit.py \
            tools/paradox_a0_native_readout/audit.py \
            tools/paradox_a0_native_readout/gap_report.py \
            tools/paradox_a0_native_readout/reachability.json \
            tools/paradox_a0_native_readout/registry.json | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

          unexpected_status="$(git diff --name-status "${G2B_SHA}" "${SUBJECT_SHA}" | awk '$1 != "A" { print }')"
          test -z "${unexpected_status}"
          test "$(git diff --name-only "${G2B_SHA}" "${SUBJECT_SHA}" | wc -l | tr -d '[:space:]')" = 12
          printf 'a0-subject=%s g2b-parent=%s production=%s files=12\n' "${SUBJECT_SHA}" "${G2B_SHA}" "${PRODUCTION_SHA}"

      - name: Execute frozen static and receipt-contract audits twice
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          a="${RUNNER_TEMP}/a0-static-a.log"
          b="${RUNNER_TEMP}/a0-static-b.log"

          run_audits() {
            local out="$1"
            {
              printf 'python=%s\n' "$(python3 --version 2>&1)"
              python3 -B tools/paradox_a0_native_readout/audit.py
              python3 -B tools/paradox_a0_native_readout/gap_report.py
              printf '\n'
              python3 -B tools/paradox_a0_native_readout/a0r_contract_audit.py
              python3 -B tools/paradox_a0_native_readout/a0r_statistics_audit.py
              python3 -B tools/paradox_a0_native_readout/a0r_receipt_audit.py
            } > "${out}"
          }

          run_audits "${a}"
          run_audits "${b}"
          cmp -s "${a}" "${b}"
          cat "${a}"
          printf 'a0-static-audit-log-sha256=%s\n' "$(sha256sum "${a}" | awk '{print $1}')"

      - name: Postflight A0 subject immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git rev-parse HEAD^)" = "${G2B_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
