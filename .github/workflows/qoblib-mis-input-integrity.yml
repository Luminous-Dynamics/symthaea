name: QOBLIB MIS Input Integrity

on:
  pull_request:
    paths:
      - ".github/workflows/qoblib-mis-input-integrity.yml"
      - "crates/domains/symthaea-quantum-comp/src/mis_evidence.rs"
      - "crates/domains/symthaea-quantum-comp/examples/qoblib_mis_manifest.rs"
      - "docs/research/quantum/benchmarks/QOBLIB-MIS-PINNED-FILES-2026-10-28.tsv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pinned-qoblib:
    name: Verify 50 pinned MIS graphs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QOBLIB_COMMIT: 1e0e7c523cd9707dd541cc9e5a3086125d4da3c7
      QOBLIB_ROOT: ${{ runner.temp }}/QOBLIB
      MANIFEST_PATH: docs/research/quantum/benchmarks/QOBLIB-MIS-PINNED-FILES-2026-10-28.tsv
      OUTPUT_PATH: ${{ runner.temp }}/qoblib-mis-content-manifest.tsv
    steps:
      - name: Checkout Symthaea source
        uses: actions/checkout@v4

      - name: Checkout immutable QOBLIB dataset revision
        uses: actions/checkout@v4
        with:
          repository: ZIB-AOPT/QOBLIB
          ref: 1e0e7c523cd9707dd541cc9e5a3086125d4da3c7
          path: ${{ runner.temp }}/QOBLIB
          fetch-depth: 1

      - name: Verify source revision and toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C "$QOBLIB_ROOT" rev-parse HEAD)"
          test "$actual" = "$QOBLIB_COMMIT"
          rustc --version
          git --version
          echo "QOBLIB revision verified: $actual"

      - name: Compile standalone integrity verifier
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 -Awarnings \
            "$GITHUB_WORKSPACE/crates/domains/symthaea-quantum-comp/examples/qoblib_mis_manifest.rs" \
            -o "$RUNNER_TEMP/qoblib-mis-manifest"

      - name: Verify blobs, dimensions, and SHA-256 identities
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/qoblib-mis-manifest" \
            "$QOBLIB_ROOT" "$MANIFEST_PATH" "$OUTPUT_PATH"
          awk -F '\t' '
            /^#/ { next }
            NF != 8 || length($4) != 64 || length($5) != 64 {
              print "invalid integrity-manifest row " NR > "/dev/stderr"
              exit 1
            }
            $4 !~ /^[0-9a-f]+$/ || $5 !~ /^[0-9a-f]+$/ {
              print "noncanonical SHA-256 in row " NR > "/dev/stderr"
              exit 1
            }
            { rows++ }
            END {
              if (rows != 50) {
                print "expected 50 verified graphs, got " rows > "/dev/stderr"
                exit 1
              }
            }
          ' "$OUTPUT_PATH"
          sha256sum "$MANIFEST_PATH" "$OUTPUT_PATH"

      - name: Publish verified digest manifest
        uses: actions/upload-artifact@v4
        with:
          name: qoblib-mis-content-digests
          path: ${{ runner.temp }}/qoblib-mis-content-manifest.tsv
          if-no-files-found: error
          retention-days: 90
