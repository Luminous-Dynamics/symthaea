name: QEC Hellinger and Petz bounds audit

on:
  push:
    branches:
      - research/qec-hellinger-petz-bounds-20261113
    paths:
      - crates/domains/symthaea-frontier-physics/src/error_set_qec.rs
      - crates/domains/symthaea-frontier-physics/src/lib.rs
      - crates/domains/symthaea-frontier-physics/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/qec-hellinger-petz-bounds.yml
  pull_request:
    branches:
      - research/general-error-set-qec-matrix-20261113
    paths:
      - crates/domains/symthaea-frontier-physics/src/error_set_qec.rs
      - crates/domains/symthaea-frontier-physics/src/lib.rs
      - crates/domains/symthaea-frontier-physics/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/qec-hellinger-petz-bounds.yml

permissions:
  contents: read

concurrency:
  group: qec-hellinger-petz-bounds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: QEC Hellinger and Petz theorem bounds (Linux, Rust 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml --all-targets -- -D warnings
      - name: Run crate tests
        run: cargo test --locked --manifest-path crates/domains/symthaea-frontier-physics/Cargo.toml --lib
