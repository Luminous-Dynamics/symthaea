name: SYM-HDC-CRYPTO-FV-001C Threshold Leakage

on:
  pull_request:
    paths:
      - "formal/lean/hdc/BinaryHVBind.lean"
      - "formal/lean/hdc/HdcCryptoAttacks.lean"
      - "formal/lean/hdc/HdcThresholdShareLeakage.lean"
      - "docs/formal/sym-hdc-crypto-fv-001c-v1.json"
      - "scripts/validate_sym_hdc_crypto_fv_001c.py"
      - "crates/core/symthaea-hdc-crypto/src/crypto.rs"
      - "crates/core/symthaea-core/src/hdc/hdc_crypto.rs"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/sym-hdc-crypto-fv-001c.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sym-hdc-crypto-fv-001c-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  threshold-leakage:
    name: Lean one-share threshold leakage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact Git subject and stack parent
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          PARENT="b485a5713e5e8d971342a93f1a6e514512052b9e"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain=v1 --untracked-files=all

      - name: Static contract and hostile source controls
        run: python3 scripts/validate_sym_hdc_crypto_fv_001c.py

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Prove Lean wrapper propagates generic failure
        run: |
          set -euo pipefail
          cat > /tmp/sym-hdc-crypto-fv-001c-known-bad.lean <<'LEAN'
          example : False := by
            trivial
          LEAN
          if nix develop .#formal --command sh -c 'lean /tmp/sym-hdc-crypto-fv-001c-known-bad.lean > /tmp/sym-hdc-crypto-fv-001c-known-bad-output.txt 2>&1'; then
            cat /tmp/sym-hdc-crypto-fv-001c-known-bad-output.txt
            echo "known-bad Lean subject incorrectly returned success" >&2
            exit 1
          fi
          cat /tmp/sym-hdc-crypto-fv-001c-known-bad-output.txt
          grep -q 'error:' /tmp/sym-hdc-crypto-fv-001c-known-bad-output.txt

      - name: Hostile control — unrelated stored mask must break recovery theorem
        run: |
          set -euo pipefail
          cat formal/lean/hdc/BinaryHVBind.lean formal/lean/hdc/HdcCryptoAttacks.lean > /tmp/001c-wrong-mask.lean
          cat >> /tmp/001c-wrong-mask.lean <<'LEAN'
          namespace Symthaea.Formal.HDC.CryptoThresholdLeakageHostile
          open Symthaea.Formal.HDC
          open Symthaea.Formal.HDC.CryptoAttacks
          def wrongMaskShare (secret sourceMask storedMask : BinaryHV) : AbstractShare :=
            { share := bind secret sourceMask, mask := storedMask }
          example (secret sourceMask storedMask : BinaryHV) :
              recoverOne (wrongMaskShare secret sourceMask storedMask) = secret := by
            rfl
          end Symthaea.Formal.HDC.CryptoThresholdLeakageHostile
          LEAN
          if nix develop .#formal --command sh -c 'lean /tmp/001c-wrong-mask.lean > /tmp/001c-wrong-mask-output.txt 2>&1'; then
            cat /tmp/001c-wrong-mask-output.txt
            echo "wrong-mask mutant unexpectedly satisfied universal one-share recovery" >&2
            exit 1
          fi
          cat /tmp/001c-wrong-mask-output.txt
          grep -q 'error:' /tmp/001c-wrong-mask-output.txt

      - name: Hostile control — maskless public record must not inherit theorem
        run: |
          set -euo pipefail
          cat formal/lean/hdc/BinaryHVBind.lean formal/lean/hdc/HdcCryptoAttacks.lean > /tmp/001c-maskless.lean
          cat >> /tmp/001c-maskless.lean <<'LEAN'
          namespace Symthaea.Formal.HDC.CryptoThresholdLeakageHostile
          open Symthaea.Formal.HDC
          structure MasklessShare where
            share : BinaryHV
          def recoverMaskless (s : MasklessShare) : BinaryHV := s.share
          example (secret mask : BinaryHV) :
              recoverMaskless { share := bind secret mask } = secret := by
            rfl
          end Symthaea.Formal.HDC.CryptoThresholdLeakageHostile
          LEAN
          if nix develop .#formal --command sh -c 'lean /tmp/001c-maskless.lean > /tmp/001c-maskless-output.txt 2>&1'; then
            cat /tmp/001c-maskless-output.txt
            echo "maskless mutant unexpectedly inherited universal one-share recovery" >&2
            exit 1
          fi
          cat /tmp/001c-maskless-output.txt
          grep -q 'error:' /tmp/001c-maskless-output.txt

      - name: Hostile control — non-XOR share constructor must not inherit theorem
        run: |
          set -euo pipefail
          cat formal/lean/hdc/BinaryHVBind.lean formal/lean/hdc/HdcCryptoAttacks.lean > /tmp/001c-nonxor.lean
          cat >> /tmp/001c-nonxor.lean <<'LEAN'
          namespace Symthaea.Formal.HDC.CryptoThresholdLeakageHostile
          open Symthaea.Formal.HDC
          open Symthaea.Formal.HDC.CryptoAttacks
          def andMask (a b : BinaryHV) : BinaryHV := fun i => Bool.and (a i) (b i)
          def nonXorShare (secret mask : BinaryHV) : AbstractShare :=
            { share := andMask secret mask, mask := mask }
          example (secret mask : BinaryHV) :
              recoverOne (nonXorShare secret mask) = secret := by
            rfl
          end Symthaea.Formal.HDC.CryptoThresholdLeakageHostile
          LEAN
          if nix develop .#formal --command sh -c 'lean /tmp/001c-nonxor.lean > /tmp/001c-nonxor-output.txt 2>&1'; then
            cat /tmp/001c-nonxor-output.txt
            echo "non-XOR mutant unexpectedly inherited universal one-share recovery" >&2
            exit 1
          fi
          cat /tmp/001c-nonxor-output.txt
          grep -q 'error:' /tmp/001c-nonxor-output.txt

      - name: Typecheck exact inherited lineage plus threshold theorem fail-closed
        run: |
          set -euo pipefail
          cat \
            formal/lean/hdc/BinaryHVBind.lean \
            formal/lean/hdc/HdcCryptoAttacks.lean \
            formal/lean/hdc/HdcThresholdShareLeakage.lean \
            > /tmp/HdcThresholdShareLeakageCombined.lean
          nix develop .#formal --command sh -c '
            set -eu
            lean --version > /tmp/sym-hdc-crypto-fv-001c-lean-version.txt
            cat /tmp/sym-hdc-crypto-fv-001c-lean-version.txt
            if ! lean /tmp/HdcThresholdShareLeakageCombined.lean > /tmp/sym-hdc-crypto-fv-001c-lean-output.txt 2>&1; then
              cat /tmp/sym-hdc-crypto-fv-001c-lean-output.txt
              exit 1
            fi
            cat /tmp/sym-hdc-crypto-fv-001c-lean-output.txt
            if grep -q "sorryAx" /tmp/sym-hdc-crypto-fv-001c-lean-output.txt; then
              echo "forbidden sorryAx in Lean axiom census" >&2
              exit 1
            fi
            if grep -q "error:" /tmp/sym-hdc-crypto-fv-001c-lean-output.txt; then
              echo "Lean output contains an error marker despite zero exit" >&2
              exit 1
            fi
          '

      - name: Postflight immutability and receipt
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          PARENT = "b485a5713e5e8d971342a93f1a6e514512052b9e"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          receipt = {
              "schema": "symthaea.formal.sym-hdc-crypto-fv-001c-qualification-receipt.v1",
              "issue": 6126,
              "parent_issue": 5844,
              "stack_parent_pr": 5905,
              "evidence_class": "AbstractFormalTheorem",
              "result": "LeanTypecheckedAxiomCleanAndHostileControlsRejected",
              "head": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "parent_commit": PARENT,
              "merge_base_with_parent": git("merge-base", PARENT, "HEAD"),
              "bind_theorem_blob": git("rev-parse", "HEAD:formal/lean/hdc/BinaryHVBind.lean"),
              "attack_theorem_blob": git("rev-parse", "HEAD:formal/lean/hdc/HdcCryptoAttacks.lean"),
              "threshold_theorem_blob": git("rev-parse", "HEAD:formal/lean/hdc/HdcThresholdShareLeakage.lean"),
              "standalone_crypto_blob": git("rev-parse", "HEAD:crates/core/symthaea-hdc-crypto/src/crypto.rs"),
              "compatibility_crypto_blob": git("rev-parse", "HEAD:crates/core/symthaea-core/src/hdc/hdc_crypto.rs"),
              "lean_version": Path("/tmp/sym-hdc-crypto-fv-001c-lean-version.txt").read_text().strip(),
              "combined_theorem_sha256": sha256("/tmp/HdcThresholdShareLeakageCombined.lean"),
              "lean_output_sha256": sha256("/tmp/sym-hdc-crypto-fv-001c-lean-output.txt"),
              "known_bad_output_sha256": sha256("/tmp/sym-hdc-crypto-fv-001c-known-bad-output.txt"),
              "wrong_mask_output_sha256": sha256("/tmp/001c-wrong-mask-output.txt"),
              "maskless_output_sha256": sha256("/tmp/001c-maskless-output.txt"),
              "nonxor_output_sha256": sha256("/tmp/001c-nonxor-output.txt"),
              "manifest_sha256": sha256("docs/formal/sym-hdc-crypto-fv-001c-v1.json"),
              "validator_sha256": sha256("scripts/validate_sym_hdc_crypto_fv_001c.py"),
              "exact_head_checkout": True,
              "exact_stack_parent_head_bound": True,
              "known_bad_lean_subject_rejected": True,
              "wrong_mask_mutant_rejected": True,
              "maskless_mutant_rejected": True,
              "nonxor_mutant_rejected": True,
              "lean_exit_zero": True,
              "sorryAx_absent": True,
              "lean_error_markers_absent": True,
              "repository_postflight_clean": True,
              "nonclaims": [
                  "not-production-rust-refinement",
                  "not-proof-all-threshold-cryptography-is-insecure",
                  "not-compatibility-copy-refinement",
                  "not-secure-replacement",
                  "not-production-cryptographic-authority"
              ]
          }
          Path("/tmp/sym-hdc-crypto-fv-001c-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Retain proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sym-hdc-crypto-fv-001c-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/HdcThresholdShareLeakageCombined.lean
            /tmp/sym-hdc-crypto-fv-001c-lean-version.txt
            /tmp/sym-hdc-crypto-fv-001c-lean-output.txt
            /tmp/sym-hdc-crypto-fv-001c-known-bad-output.txt
            /tmp/001c-wrong-mask-output.txt
            /tmp/001c-maskless-output.txt
            /tmp/001c-nonxor-output.txt
            /tmp/sym-hdc-crypto-fv-001c-receipt.json
          if-no-files-found: error
          retention-days: 30
