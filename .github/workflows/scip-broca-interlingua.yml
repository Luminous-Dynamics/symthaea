name: SCIP Broca Interlingua

on:
  pull_request:
    paths:
      - 'crates/bridges/symthaea-broca-interlingua/**'
      - '.github/workflows/scip-broca-interlingua.yml'
  push:
    branches: [main]
    paths:
      - 'crates/bridges/symthaea-broca-interlingua/**'
      - '.github/workflows/scip-broca-interlingua.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Format, test and lint Broca SCIP bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scip-broca-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-scip-broca-

      - name: Format Broca SCIP bridge
        run: cargo fmt --check -p symthaea-broca-interlingua

      - name: Test Broca SCIP bridge
        run: cargo test -p symthaea-broca-interlingua --all-targets

      - name: Emit deterministic translation A/B evidence
        run: cargo test -p symthaea-broca-interlingua --test translation_ab_evidence -- --nocapture

      - name: Emit deterministic transport-regime evidence
        run: cargo test -p symthaea-broca-interlingua --test transport_regime_evidence -- --nocapture

      - name: Emit deterministic semantic change-curve evidence
        run: cargo test -p symthaea-broca-interlingua --test semantic_change_curve_evidence -- --nocapture

      - name: Clippy Broca SCIP bridge
        run: cargo clippy -p symthaea-broca-interlingua --all-targets --no-deps -- -D warnings
