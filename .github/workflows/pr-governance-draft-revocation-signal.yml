name: PR Governance Draft Revocation Signal

on:
  pull_request:
    types: [converted_to_draft, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.event.action == 'converted_to_draft' && format('pr-governance-{0}', github.event.pull_request.number) || format('pr-governance-draft-revocation-signal-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  runnerless-signal:
    name: Runnerless PR Governance draft revocation signal
    if: github.event.pull_request.draft == false && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - run: echo 'unreachable by contract'
