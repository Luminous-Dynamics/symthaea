name: Matter Nuclear Blind Models

on:
  pull_request:
    paths:
      - 'crates/domains/symthaea-nuclear/src/blind_models.rs'
      - 'crates/domains/symthaea-nuclear/src/blind_validation.rs'
      - 'crates/domains/symthaea-nuclear/src/lib.rs'
      - '.github/workflows/matter-nuclear-blind-models.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  blind-model-lineage:
    name: Blind model lineage and parliament
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Lockfile must remain unchanged from PR base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          test -z "$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- Cargo.lock)"

      - name: Focused formatting
        run: cargo fmt --check -p symthaea-nuclear

      - name: Focused nuclear package check
        run: cargo check --locked -p symthaea-nuclear

      - name: Blind-model regressions
        run: cargo test --locked -p symthaea-nuclear blind_models::tests -- --nocapture

      - name: Authority and leakage ratchets
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/domains/symthaea-nuclear/src/blind_models.rs')
          text = p.read_text()

          forbidden_fields = (
              'pub winner:',
              'pub consensus:',
              'pub independent:',
              'pub qualified:',
              'pub confidence:',
          )
          for token in forbidden_fields:
              if token in text:
                  raise SystemExit(f'forbidden authority shortcut: {token}')

          forbidden_rf_execution = (
              'use crate::ml_mass::MlMassPredictor',
              'use crate::ml_mass::{MlMassPredictor',
              'MlMassPredictor::new(',
              'MlMassPredictor::default(',
          )
          for token in forbidden_rf_execution:
              if token in text:
                  raise SystemExit(
                      f'full-corpus RF must not enter blind execution: {token}'
                  )

          required = (
              'BlindTrainingReceipt',
              'DeclaredDisjointWithinVocabulary',
              'SharedDeclaredDependencies',
              'Ame2020MeasuredTrainingPartition',
              'residual_dispersion_proxy_mev',
              'nearest_training_distance',
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing blind-model contract token: {token}')

          print('blind-model authority/leakage ratchets passed')
