name: Butlin GWT-1 Final Artifact Consumer Contract

on:
  pull_request:
    paths:
      - ".github/evidence-profiles/gwt1-verified-report-v1.json"
      - ".github/evidence-profiles/gwt1-verified-report-v2.json"
      - ".github/workflows/butlin-gwt1-final-consumer-contract.yml"
      - ".github/workflows/butlin-gwt1-trusted-final-consumer.yml"
      - "crates/domains/symthaea-psych-bench/src/benchmarks/butlin/gwt1_final_consumer_candidate.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify final-consumer trust metadata v2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable V1/V2 archive profiles and audit authority split
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/evidence-profiles/gwt1-verified-report-v1.json)" = "45863366cfc1218781608a9293415ce7c0dec678"
          test "$(git rev-parse HEAD:.github/evidence-profiles/gwt1-verified-report-v2.json)" = "aacc7146467d1c14bedb96055b7b821ac29ea5f7"
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          workflow = (root / ".github/workflows/butlin-gwt1-trusted-final-consumer.yml").read_text()
          candidate = (root / "crates/domains/symthaea-psych-bench/src/benchmarks/butlin/gwt1_final_consumer_candidate.rs").read_text()
          projection = (root / "crates/domains/symthaea-psych-bench/src/benchmarks/butlin/gwt1_verified_report_projection.rs").read_text()
          v1 = json.loads((root / ".github/evidence-profiles/gwt1-verified-report-v1.json").read_text())
          v2 = json.loads((root / ".github/evidence-profiles/gwt1-verified-report-v2.json").read_text())

          assert v1["schema"] == "butlin-evidence-archive-admission-profile-v1"
          assert v1["profile_id"] == "gwt1-verified-report-archive-v1"
          assert v2["schema"] == "butlin-evidence-archive-admission-profile-v1"
          assert v2["profile_id"] == "gwt1-verified-report-archive-v2"
          assert v1["root"] == v2["root"] == "gwt1-verified-report"
          assert len(v1["members"]) == len(v2["members"]) == 26

          v1_paths = {item["path"] for item in v1["members"]}
          v2_paths = {item["path"] for item in v2["members"]}
          assert len(v1_paths) == len(v2_paths) == 26
          assert "gwt1-verified-report/source/resolution_provenance.json" in v1_paths
          assert "gwt1-verified-report/source/final_verifier_profile.json" in v1_paths
          assert "gwt1-verified-report/authority/fresh_direct_archive_verification.json" not in v1_paths
          assert "gwt1-verified-report/authority/fresh_direct_profile_verification.json" not in v1_paths
          assert "gwt1-verified-report/source/resolution_provenance.json" not in v2_paths
          assert "gwt1-verified-report/source/final_verifier_profile.json" not in v2_paths
          assert "gwt1-verified-report/authority/fresh_direct_archive_verification.json" in v2_paths
          assert "gwt1-verified-report/authority/fresh_direct_profile_verification.json" in v2_paths

          assert "butlin-gwt1-trusted-final-consumer-provenance-v2" in workflow
          assert "butlin-gwt1-trusted-final-consumer-provenance-v1" not in workflow
          assert "butlin-gwt1-final-consumer-verifier-profile-v2" in workflow
          assert "butlin-gwt1-final-consumer-verifier-profile-v1" not in workflow
          assert ".github/evidence-profiles/gwt1-verified-report-v2.json" in workflow
          assert 'profile_id=="gwt1-verified-report-archive-v2"' in workflow
          assert 'profile_id=="gwt1-verified-report-archive-v1"' not in workflow

          assert "BOOTSTRAP_DIRECT_BUILDER_WORKFLOW_SHA" in workflow
          assert "6eaf73a20047b99120e59eb96f48ae0e194e2c80" in workflow
          assert "Freshly verify direct authority at consumer fault domain" in workflow
          assert "authority/direct/archive_attestation.json" in workflow
          assert "authority/direct/profile_attestation.json" in workflow
          assert '--signer-digest "$BOOTSTRAP_DIRECT_BUILDER_WORKFLOW_SHA"' in workflow
          assert "butlin-gwt1-direct-attestation-verifier-profile-v2" in workflow
          assert "butlin-gwt1-final-direct-authority-v1" in workflow
          assert "fresh_direct_archive_verification_sha256" in workflow
          assert "fresh_direct_profile_verification_sha256" in workflow
          assert "direct_builder_workflow_sha" in workflow

          provenance_line = next(line for line in workflow.splitlines() if "butlin-gwt1-trusted-final-consumer-provenance-v2" in line)
          verifier_line = next(line for line in workflow.splitlines() if "butlin-gwt1-final-consumer-verifier-profile-v2" in line)
          assert "direct_builder_workflow_sha" not in provenance_line
          assert "direct_builder_workflow_sha" in verifier_line
          assert '--arg direct_builder_sha "$DIRECT_BUILDER_WORKFLOW_SHA"' in verifier_line

          assert '[[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]' in workflow
          assert '[[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]' in workflow
          assert '--arg consumer_run_id "$GITHUB_RUN_ID"' in provenance_line
          assert '--arg consumer_run_attempt "$GITHUB_RUN_ATTEMPT"' in provenance_line
          assert "inputs.consumer_run" not in workflow
          assert "latest" not in workflow.lower()
          assert workflow.count("--deny-self-hosted-runners") >= 4
          assert ".member_count==60" in workflow
          assert ".member_count==7" in workflow
          assert ".member_count==26" in workflow
          assert "actions/cache" not in workflow
          assert "ubuntu-latest" not in workflow

          assert "pub const GWT1_PUBLIC_REPORTING_AUTHORITY_ENABLED_V1: bool = false;" in candidate
          assert "FunctionallySupported" not in projection
          PY
