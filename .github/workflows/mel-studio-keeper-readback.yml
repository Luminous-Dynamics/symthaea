name: Muse Studio keeper read-back integrity

on:
  pull_request:
    paths:
      - "crates/domains/symthaea-muse/src/bin/muse_studio.rs"
      - ".github/workflows/mel-studio-keeper-readback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keeper-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Format Muse Studio binary source
        run: rustfmt +1.96.0 --edition 2024 --check crates/domains/symthaea-muse/src/bin/muse_studio.rs
      - name: Parse workspace and test keeper read-back with a temporary orphan-member exclusion
        shell: bash
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          cp Cargo.toml "$backup"
          cleanup() {
            cp "$backup" Cargo.toml
            rm -f "$backup"
          }
          trap cleanup EXIT
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("Cargo.toml")
          content = manifest.read_text()
          # The root workspace uses exactly these direct-child globs.
          # Temporarily exclude only directories that are not Cargo packages;
          # a future crate is automatically included when its Cargo.toml lands.
          glob_roots = (
              Path("crates/core"),
              Path("crates/domains"),
              Path("crates/bridges"),
          )
          missing = []
          for root in glob_roots:
              if not root.is_dir():
                  continue
              for path in sorted(root.iterdir()):
                  if path.is_dir() and not (path / "Cargo.toml").is_file():
                      missing.append(path.as_posix())
          if missing:
              marker = "exclude = [\n"
              if content.count(marker) != 1:
                  raise SystemExit("expected exactly one workspace exclude array")
              additions = "".join(
                  f'    # Temporary CI exclusion: known orphan workspace path tracked in #8674.\n    "{item}",\n'
                  for item in missing
                  if f'"{item}"' not in content
              )
              content = content.replace(marker, marker + additions, 1)
              manifest.write_text(content)
          print("Temporary workspace-only exclusions:", ", ".join(missing) or "none")
          PY
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 >/dev/null
          cargo +1.96.0 test --locked -p symthaea-muse --features studio --bin muse_studio keeper_readback_tests
