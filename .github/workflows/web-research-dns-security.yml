name: WebResearch DNS and SSRF Security Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/web_research/ssrf.rs"
      - "src/web_research/researcher.rs"
      - "src/web_research/types.rs"
      - "src/web_research/mod.rs"
      - ".github/workflows/web-research-dns-security.yml"

permissions:
  contents: read

jobs:
  security-contract:
    name: Rust 1.96 DNS and SSRF integration contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check security source formatting
        run: rustfmt +1.96.0 --edition 2024 --check src/web_research/ssrf.rs src/web_research/researcher.rs src/web_research/types.rs src/web_research/mod.rs
      - name: Exercise DNS policy and reqwest transport integration
        run: cargo test --manifest-path Cargo.toml --locked --no-default-features --features web_research_module --lib web_research::ssrf::tests
      - name: Exercise URL policy at the acquisition boundary
        run: cargo test --manifest-path Cargo.toml --locked --no-default-features --features web_research_module --lib web_research::researcher::tests
      - name: Clippy security-enabled library
        run: cargo clippy --manifest-path Cargo.toml --locked --no-default-features --features web_research_module --lib -- -D warnings
