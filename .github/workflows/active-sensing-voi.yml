name: Active Sensing VoI Planner

on:
  push:
    branches:
      - research/edge-active-sensing-voi-v0.1
    paths:
      - "research/temporal-bench/active-sensing-qualifier/**"
      - "research/temporal-bench/src/active_sensing.rs"
      - "research/temporal-bench/src/digest.rs"
      - ".github/workflows/active-sensing-voi.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/temporal-bench/active-sensing-qualifier/**"
      - "research/temporal-bench/src/active_sensing.rs"
      - "research/temporal-bench/src/digest.rs"
      - ".github/workflows/active-sensing-voi.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: Planner contract and known-answer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - name: Check formatting
        run: rustfmt --check --edition 2024 --config skip_children=true research/temporal-bench/src/lib.rs
      - name: Check active sensing planner formatting
        run: rustfmt --check --edition 2024 research/temporal-bench/src/active_sensing.rs
      - name: Generate isolated workspace lockfile
        run: cargo generate-lockfile --manifest-path research/temporal-bench/active-sensing-qualifier/Cargo.toml
      - name: Run active sensing planner tests
        run: cargo test --manifest-path research/temporal-bench/active-sensing-qualifier/Cargo.toml --locked --all-targets
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/temporal-bench/active-sensing-qualifier/Cargo.toml --locked --all-targets -- -D warnings
      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-sensing-voi-cargo-lock
          path: research/temporal-bench/active-sensing-qualifier/Cargo.lock
          if-no-files-found: error
