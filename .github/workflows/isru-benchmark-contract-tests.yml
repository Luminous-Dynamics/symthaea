name: ISRU Sealed Benchmark Contract Tests

on:
  pull_request:
    paths:
      - 'research/asteroid-optical-isru-v0.2/benchmark_contract.rs'
      - 'research/asteroid-optical-isru-v0.2/replay_oracle.rs'
      - 'research/asteroid-optical-isru-v0.2/digital_twin.rs'
      - 'research/asteroid-optical-isru-v0.2/optical_health.rs'
      - 'research/asteroid-optical-isru-v0.2/material_regime.rs'
      - 'research/asteroid-optical-isru-v0.2/coupled_campaign.rs'
      - 'research/asteroid-optical-isru-v0.2/decision_policy.rs'
      - 'docs/research/OPTICAL_ISRU_SEALED_AUTONOMOUS_SCIENCE_BENCHMARK_V0_1.md'
      - 'docs/research/OPTICAL_ISRU_B1_DIGITAL_TWIN_AND_DYNAMIC_FOULING_V0_1.md'
      - 'docs/research/OPTICAL_ISRU_DECISION_DIRECTED_POLICY_V0_1.md'
      - '.github/workflows/isru-benchmark-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Format, Clippy and standalone Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: |
          rustfmt --edition 2021 --check research/asteroid-optical-isru-v0.2/benchmark_contract.rs
          rustfmt --edition 2021 --check research/asteroid-optical-isru-v0.2/replay_oracle.rs
          rustfmt --edition 2021 --check research/asteroid-optical-isru-v0.2/digital_twin.rs
          rustfmt --edition 2021 --check research/asteroid-optical-isru-v0.2/optical_health.rs
          rustfmt --edition 2021 --check research/asteroid-optical-isru-v0.2/material_regime.rs
          rustfmt --edition 2021 --check research/asteroid-optical-isru-v0.2/coupled_campaign.rs
          rustfmt --edition 2021 --check research/asteroid-optical-isru-v0.2/decision_policy.rs

      - name: Run standalone Clippy
        run: |
          clippy-driver --edition=2021 --test research/asteroid-optical-isru-v0.2/benchmark_contract.rs -o /tmp/isru-benchmark-contract-clippy -D warnings
          clippy-driver --edition=2021 --test research/asteroid-optical-isru-v0.2/replay_oracle.rs -o /tmp/isru-replay-oracle-clippy -D warnings
          clippy-driver --edition=2021 --test research/asteroid-optical-isru-v0.2/digital_twin.rs -o /tmp/isru-digital-twin-clippy -D warnings
          clippy-driver --edition=2021 --test research/asteroid-optical-isru-v0.2/optical_health.rs -o /tmp/isru-optical-health-clippy -D warnings
          clippy-driver --edition=2021 --test research/asteroid-optical-isru-v0.2/material_regime.rs -o /tmp/isru-material-regime-clippy -D warnings
          clippy-driver --edition=2021 --test research/asteroid-optical-isru-v0.2/coupled_campaign.rs -o /tmp/isru-coupled-campaign-clippy -D warnings
          clippy-driver --edition=2021 --test research/asteroid-optical-isru-v0.2/decision_policy.rs -o /tmp/isru-decision-policy-clippy -D warnings

      - name: Compile and run exact standalone tests
        run: |
          rustc --edition=2021 --test research/asteroid-optical-isru-v0.2/benchmark_contract.rs -o /tmp/isru-benchmark-contract-tests
          /tmp/isru-benchmark-contract-tests
          rustc --edition=2021 --test research/asteroid-optical-isru-v0.2/replay_oracle.rs -o /tmp/isru-replay-oracle-tests
          /tmp/isru-replay-oracle-tests
          rustc --edition=2021 --test research/asteroid-optical-isru-v0.2/digital_twin.rs -o /tmp/isru-digital-twin-tests
          /tmp/isru-digital-twin-tests
          rustc --edition=2021 --test research/asteroid-optical-isru-v0.2/optical_health.rs -o /tmp/isru-optical-health-tests
          /tmp/isru-optical-health-tests
          rustc --edition=2021 --test research/asteroid-optical-isru-v0.2/material_regime.rs -o /tmp/isru-material-regime-tests
          /tmp/isru-material-regime-tests
          rustc --edition=2021 --test research/asteroid-optical-isru-v0.2/coupled_campaign.rs -o /tmp/isru-coupled-campaign-tests
          /tmp/isru-coupled-campaign-tests
          rustc --edition=2021 --test research/asteroid-optical-isru-v0.2/decision_policy.rs -o /tmp/isru-decision-policy-tests
          /tmp/isru-decision-policy-tests
