name: ACTION-CONTEXT-ALIGNMENT-001 Qualifier

on:
  pull_request:
    branches: [main]
    paths:
      - "research/action-context-alignment-001/**"
      - ".github/workflows/action-context-alignment-qualifier.yml"
  push:
    branches: [main]
    paths:
      - "research/action-context-alignment-001/**"
      - ".github/workflows/action-context-alignment-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-context-alignment-qualifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Format
        run: cargo fmt --manifest-path research/action-context-alignment-001/qualifier/Cargo.toml --check
      - name: Unit and negative-control tests
        run: cargo test --manifest-path research/action-context-alignment-001/qualifier/Cargo.toml
      - name: Validate action-context pair corpus
        run: |
          cargo run --manifest-path research/action-context-alignment-001/qualifier/Cargo.toml -- \
            research/action-context-alignment-001/ACTION_CONTEXT_ALIGNMENT_FIXTURES_V0_1.json \
            research/action-context-alignment-001/ACTION_CONTEXT_ALIGNMENT_FIXTURES_V0_1.schema.json
      - name: Validate synthetic model-trial receipt golden control
        run: |
          cargo run --manifest-path research/action-context-alignment-001/qualifier/Cargo.toml \
            --bin model_trial_result_qualifier -- \
            research/action-context-alignment-001/MODEL_TRIAL_GOLDEN_CONTROL_V0_1.json \
            research/action-context-alignment-001/ACTION_CONTEXT_ALIGNMENT_FIXTURES_V0_1.json \
            research/action-context-alignment-001/MODEL_TRIAL_RESULTS_V0_1.schema.json
