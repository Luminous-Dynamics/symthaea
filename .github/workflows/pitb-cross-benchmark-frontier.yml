name: PITB Cross-Benchmark Frontier Registry

on:
  pull_request:
    paths:
      - "benchmarks/registry/pitb-cross-benchmark-frontier-v0.json"
      - "benchmarks/registry/pitb-cross-benchmark-frontier-v0.schema.json"
      - "benchmarks/registry/README.md"
      - ".github/workflows/pitb-cross-benchmark-frontier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier-registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/pitb-frontier-venv"
          "$RUNNER_TEMP/pitb-frontier-venv/bin/pip" install "jsonschema==4.25.1"

      - name: Validate benchmark frontier registry
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pitb-frontier-venv/bin/python" - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path("benchmarks/registry")
          schema = json.loads((root / "pitb-cross-benchmark-frontier-v0.schema.json").read_text())
          registry_path = root / "pitb-cross-benchmark-frontier-v0.json"
          registry = json.loads(registry_path.read_text())
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(registry))
          if errors:
              raise SystemExit("frontier schema errors: " + "; ".join(e.message for e in errors))

          if registry["as_of_date"] != "2026-11-06":
              raise SystemExit("frontier as-of date changed without a new registry version")
          ids = [item["benchmark_id"] for item in registry["benchmarks"]]
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate benchmark IDs")
          for item in registry["benchmarks"]:
              for reference in item["reference_results"]:
                  if date.fromisoformat(reference["source_date"]) > date.fromisoformat(registry["as_of_date"]):
                      raise SystemExit(f"future-dated reference in {item['benchmark_id']}")
                  if "solved" in reference:
                      observed = reference["solved"] / reference["denominator"]
                      if abs(observed - reference["value"]) > 1e-12:
                          raise SystemExit(f"baseline numerator/denominator mismatch in {item['benchmark_id']}")
          by_id = {item["benchmark_id"]: item for item in registry["benchmarks"]}
          sorrydb = by_id["sorrydb-2601"]
          if sorrydb["frozen_cohort"]["tasks"] != 1000 or sorrydb["frozen_cohort"]["repositories"] != 78:
              raise SystemExit("SorryDB frozen cohort denominators changed")
          if sorrydb["targets"][0]["minimum_solved"] != 603 or sorrydb["targets"][1]["minimum_solved"] != 680:
              raise SystemExit("SorryDB qualification targets changed")
          autoform = by_id["autoformbench-341"]
          if autoform["frozen_cohort"]["tasks"] != 341 or autoform["targets"][0]["minimum_solved"] != 299:
              raise SystemExit("AutoformBench denominator or +5pp threshold changed")
          fv = by_id["fvspec-9415"]
          if fv["frozen_cohort"]["lean_challenge_count"] != 9415:
              raise SystemExit("FVSpec task count changed")
          aegis = by_id["aegis-2000"]
          if aegis["reference_results"][0]["solved"] != 1054 or aegis["targets"][0]["minimum_solved"] != 1200:
              raise SystemExit("Aegis baseline or target changed")
          if registry["governing_policy"]["no_pooled_score"] is not True:
              raise SystemExit("cross-benchmark pooled score must remain prohibited")
          if len(registry["benchmarks"]) != 7:
              raise SystemExit("benchmark portfolio size changed; create a new registry revision")
          print("PITB_CROSS_BENCHMARK_FRONTIER_SCHEMA_PASS")
          print("benchmarks=7; no_pooled_score=true; all pinned numerator/denominator checks passed")
          PY

      - name: Retain validated frontier inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitb-cross-benchmark-frontier
          path: |
            benchmarks/registry/pitb-cross-benchmark-frontier-v0.json
            benchmarks/registry/pitb-cross-benchmark-frontier-v0.schema.json
            benchmarks/registry/README.md
          if-no-files-found: error
          retention-days: 30
