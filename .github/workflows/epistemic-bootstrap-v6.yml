name: Epistemic hardening bootstrap v6 lock diagnostic

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: epistemic-bootstrap-v6-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  retain-lock-delta:
    if: github.event.pull_request.head.ref == 'agent/epistemic-hardening-r6'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REVIEWED_BASE: f9c68947fa77fd6e29c4d2e87293715122f53cbf
      TARGET_BRANCH: agent/epistemic-hardening-r6
      STATUS_BRANCH: agent/epistemic-hardening-r6-v6-status
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PAYLOAD_SHA256: 3585a35e445af93a1f826cb58de0c3aaeb6bdc737398dc6ac7f85d614f98a486
      WORKFLOW_OVERRIDE_SHA256: 85b1de02d08cfd13c750cdd1093774099f624b9b1a25b7213b886d953636cc1f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Derive v5 and retain its lock delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/epistemic-bootstrap-v5.yml').read_text()
          marker = '      - name: Derive the lock-aware gate from reviewed v3\n'
          start = workflow.index(marker)
          run_marker = '        run: |\n'
          body_start = workflow.index(run_marker, start) + len(run_marker)
          body_end = workflow.index('\n      - name: Run lock-aware guarded canonical gate', body_start)
          lines = workflow[body_start:body_end].splitlines()
          derive = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/derive-v5.sh').write_text(derive)
          PY
          chmod 0755 /tmp/derive-v5.sh
          /tmp/derive-v5.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/epistemic-bootstrap-v5.sh')
          script = path.read_text()
          needle = '''python3 - "$RUNNER_TEMP/Cargo.lock.before" "$worktree/Cargo.lock" <<'PYLOCK'\n'''
          replacement = '''cp "$RUNNER_TEMP/Cargo.lock.before" "$evidence/Cargo.lock.before"\ncp "$worktree/Cargo.lock" "$evidence/Cargo.lock.after"\ngit -C "$worktree" diff -- Cargo.lock > "$evidence/Cargo.lock.diff"\npython3 - "$RUNNER_TEMP/Cargo.lock.before" "$worktree/Cargo.lock" <<'PYLOCK'\n'''
          if script.count(needle) != 1:
              raise SystemExit('v5 lock validation anchor was not found exactly once')
          path.write_text(script.replace(needle, replacement))
          PY
          bash -n /tmp/epistemic-bootstrap-v5.sh

      - name: Run retained lock diagnostic
        shell: bash
        run: /tmp/epistemic-bootstrap-v5.sh

      - name: Upload retained lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-hardening-bootstrap-v6-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 90
