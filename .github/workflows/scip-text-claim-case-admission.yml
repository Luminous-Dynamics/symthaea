name: SCIP Text Claim Case Admission Contract

on:
  pull_request:
    paths:
      - 'scripts/scip_text_claim_case_admission.py'
      - 'scripts/test_scip_text_claim_case_admission.py'
      - 'scripts/qualification/scip_text_claim_case_admission_policy_v1.json'
      - 'docs/release/evidence/SCIP_TEXT_CLAIM_CASE_ADMISSION_V1.md'
      - '.github/workflows/scip-text-claim-case-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  case-admission:
    name: Validate V20-to-V19 single-case admission bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Prove exact five-file review surface
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-HEAD^1}"
          git diff --name-only "$base" HEAD | LC_ALL=C sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/scip-text-claim-case-admission.yml
          docs/release/evidence/SCIP_TEXT_CLAIM_CASE_ADMISSION_V1.md
          scripts/qualification/scip_text_claim_case_admission_policy_v1.json
          scripts/scip_text_claim_case_admission.py
          scripts/test_scip_text_claim_case_admission.py
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Verify exact new and inherited contract identities
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/scip-v21.sha256 <<'EOF'
          52fe894f3822cd0f892a1b31fab4ff1dbe08346f2be887bfbf65585d8121f678  scripts/scip_text_claim_case_admission.py
          fc79282229748fa911888e44eeb938942410295ab4cc793995ac89d49dda3892  scripts/test_scip_text_claim_case_admission.py
          fd7250f061b6ba97eab8979993b5d622dc6ad572d1dd22b070e0440866186439  scripts/qualification/scip_text_claim_case_admission_policy_v1.json
          EOF
          sha256sum -c /tmp/scip-v21.sha256
          test "$(git hash-object scripts/scip_text_claim_case_admission.py)" = 537bdda1403ef426b6ea653e2f1759b8893970a8
          test "$(git hash-object scripts/test_scip_text_claim_case_admission.py)" = 13d0def16bc596529ff62e4e5ef5fc0b60d53961
          test "$(git hash-object scripts/qualification/scip_text_claim_case_admission_policy_v1.json)" = 26cde8cef449abdf2dea56ba3b9d905330aee7da
          test "$(git hash-object scripts/scip_text_claim_annotation_bundle.py)" = aa20559da3cdf3c4b7aeb304460eff7c7b2f9e38
          test "$(git hash-object scripts/qualification/scip_text_claim_annotation_policy_v1.json)" = e4088cde2b6a629e3a3de2bd39873002814ac7ab
          test "$(git hash-object scripts/qualification/scip_text_claim_corpus_manifest_policy_v1.json)" = 02ce7f81549392209f9312dadf19802f8e12329f

      - name: Compile tools without mutating checkout
        env:
          PYTHONPYCACHEPREFIX: /tmp/scip-v21-pycache
        run: |
          python3 -m py_compile \
            scripts/scip_text_claim_case_admission.py \
            scripts/test_scip_text_claim_case_admission.py

      - name: Run positive and hostile case-admission suite
        run: python3 -B scripts/test_scip_text_claim_case_admission.py

      - name: Prove admission policy identities and authority ceiling
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=json.loads(Path('scripts/qualification/scip_text_claim_case_admission_policy_v1.json').read_text())
          canonical=json.dumps(p,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(canonical).hexdigest() == '452f4201c230ca3278d1ddc744fb70bca5944fa0d77b89e494096cfbf9c3dfb9'
          assert p['v19_manifest_policy_sha256'] == '9a30ba36b3e872aaec349647f71433579bc0932f24c96335bb32afe77498ffc0'
          assert p['v20_annotation_policy_sha256'] == '12a8431fd8a93dd8ba158758bb4089ef951960240fcab11a5178159e67f19bb9'
          assert p['binding']['expected_inventory_sha256_is_v20_frozen_surface_inventory'] is True
          assert p['binding']['hidden_alignment_inventory_not_substituted_for_expected_inventory'] is True
          assert p['receipt']['domain'].endswith('\x00')
          assert all(p['claim_boundary'].values())
          PY

      - name: Prove checkout remained byte-identical
        run: test -z "$(git status --porcelain --untracked-files=all)"
