name: SPINE-000B Observer Non-Interference v1

on:
  push:
    branches:
      - research/spine-000b-observer-noninterference-v1
  pull_request:
    branches:
      - research/spine-000b-proposal-domain-v1
    paths:
      - '.github/workflows/spine-000b-observer-noninterference-v1.yml'
      - 'docs/research/SPINE_000B_OBSERVER_NONINTERFERENCE_V1.md'
      - 'scripts/verify_spine_000b_observer_noninterference_v1.py'

permissions:
  contents: read

jobs:
  architecture:
    name: Freeze observer architecture and source-order assumptions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact checkout
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > /tmp/spine_i1_expected_head
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1 > /tmp/spine_i1_pre_status
          test ! -s /tmp/spine_i1_pre_status

      - name: Constrain I1 preregistration subject
        shell: bash
        run: |
          set -euo pipefail
          base=a7d9b00278cdafc67c0d98cb99edbbfbcaf838c7
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base"..HEAD | sort > /tmp/spine_i1_changed
          cat > /tmp/spine_i1_allowed <<'EOF'
          .github/workflows/spine-000b-observer-noninterference-v1.yml
          docs/research/SPINE_000B_OBSERVER_NONINTERFERENCE_V1.md
          scripts/verify_spine_000b_observer_noninterference_v1.py
          EOF
          sort -o /tmp/spine_i1_allowed /tmp/spine_i1_allowed
          comm -23 /tmp/spine_i1_changed /tmp/spine_i1_allowed > /tmp/spine_i1_unexpected
          if test -s /tmp/spine_i1_unexpected; then
            echo 'Unexpected SPINE-000B-I1 subject files:' >&2
            cat /tmp/spine_i1_unexpected >&2
            exit 1
          fi

      - name: Syntax-check observer preflight and census
        run: |
          python3 -m py_compile \
            scripts/verify_spine_000b_observer_noninterference_v1.py \
            scripts/spine_census.py

      - name: Verify current source-order and capacity assumptions
        run: python3 scripts/verify_spine_000b_observer_noninterference_v1.py

      - name: Seal exact-head preregistration evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/spine-000b-i1
          python3 scripts/spine_census.py --output artifacts/spine-000b-i1/static-census.json
          {
            echo 'schema=symthaea.spine.000b.observer-noninterference.v1'
            echo "git_head=$(git rev-parse HEAD)"
            echo "git_index_tree=$(git write-tree)"
            echo 'base_proposal_domain=a7d9b00278cdafc67c0d98cb99edbbfbcaf838c7'
            echo 'stage_a_capacity=64'
            echo 'authority=measurement-only'
            echo 'status=OBSERVER_ARCHITECTURE_FROZEN_IMPLEMENTATION_PENDING'
            echo 'runtime_observer_implemented=false'
            echo 'noninterference_claimed=false'
            echo 'causal_load_claimed=false'
          } > artifacts/spine-000b-i1/subject.txt
          cp /tmp/spine_i1_changed artifacts/spine-000b-i1/changed-files.txt
          sha256sum \
            docs/research/SPINE_000B_OBSERVER_NONINTERFERENCE_V1.md \
            scripts/verify_spine_000b_observer_noninterference_v1.py \
            scripts/spine_census.py \
            src/cognitive_loop/cycle_phase_dynamics/mod.rs \
            tests/genesis_determinism.rs \
            artifacts/spine-000b-i1/static-census.json \
            artifacts/spine-000b-i1/subject.txt \
            > artifacts/spine-000b-i1/SHA256SUMS

      - name: Postflight checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat /tmp/spine_i1_expected_head)"
          git status --porcelain=v1 > /tmp/spine_i1_post_status
          test ! -s /tmp/spine_i1_post_status

      - name: Upload I1 preregistration evidence
        uses: actions/upload-artifact@v4
        with:
          name: spine-000b-i1-architecture-${{ github.sha }}
          path: artifacts/spine-000b-i1/
          retention-days: 90
