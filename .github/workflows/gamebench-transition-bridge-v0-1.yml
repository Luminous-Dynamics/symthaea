name: GameBench Transition Evidence Bridge v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - research/gamebench-transition-evidence-v0-1
    paths:
      - .github/workflows/gamebench-transition-bridge-v0-1.yml
      - research/symthaea-gamebench-transition-bridge-v0-1/**
  pull_request:
    paths:
      - .github/workflows/gamebench-transition-bridge-v0-1.yml
      - research/symthaea-gamebench-transition-bridge-v0-1/**

permissions:
  contents: read

jobs:
  qualify:
    name: Rust 1.96 format, tests, and strict Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/symthaea-gamebench-transition-bridge-v0-1/Cargo.toml -- --check
      - name: Run transition bridge tests
        run: cargo test --manifest-path research/symthaea-gamebench-transition-bridge-v0-1/Cargo.toml --all-targets
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/symthaea-gamebench-transition-bridge-v0-1/Cargo.toml --all-targets -- -D warnings
