name: Connectome response-model adequacy challenge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "docs/neuroscience/CONNECTOME_RESPONSE_MODEL_ADEQUACY_BENCHMARK_V1.md"
      - "docs/neuroscience/CONNECTOME_RESPONSE_MODEL_ADEQUACY.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_RESPONSE_MODEL_ADEQUACY.example.json"
      - "tools/connectomics-intake-audit/reference/verify_response_model_adequacy_oracle.py"
      - ".github/workflows/connectome-response-model-adequacy.yml"
  push:
    branches: [main, "research/**"]
    paths:
      - "docs/neuroscience/CONNECTOME_RESPONSE_MODEL_ADEQUACY_BENCHMARK_V1.md"
      - "docs/neuroscience/CONNECTOME_RESPONSE_MODEL_ADEQUACY.schema.json"
      - "docs/neuroscience/examples/CONNECTOME_RESPONSE_MODEL_ADEQUACY.example.json"
      - "tools/connectomics-intake-audit/reference/verify_response_model_adequacy_oracle.py"
      - ".github/workflows/connectome-response-model-adequacy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-response-model-adequacy:
    name: Validate model-challenge envelope
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate Draft 2020-12 schema and fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/neuroscience/CONNECTOME_RESPONSE_MODEL_ADEQUACY.schema.json").read_text())
          fixture = json.loads(Path("docs/neuroscience/examples/CONNECTOME_RESPONSE_MODEL_ADEQUACY.example.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          assert fixture["claim_scope"] == "synthetic_known_truth"
          assert fixture["dataset_binding"]["evidence_tier"] == "SYNTHETIC"
          print("Draft 2020-12 response-model adequacy contract: PASS")
          PY
      - name: Run independent model-expansion oracle
        run: |
          python3 -m py_compile tools/connectomics-intake-audit/reference/verify_response_model_adequacy_oracle.py
          python3 tools/connectomics-intake-audit/reference/verify_response_model_adequacy_oracle.py --self-test
          python3 tools/connectomics-intake-audit/reference/verify_response_model_adequacy_oracle.py \
            docs/neuroscience/examples/CONNECTOME_RESPONSE_MODEL_ADEQUACY.example.json
