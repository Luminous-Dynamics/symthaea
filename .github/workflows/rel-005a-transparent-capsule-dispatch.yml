name: REL-005A Transparent Capsule Dispatch

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful REL-005A Qualification Pipeline V3 run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: rel-005a-transparent-capsule-dispatch-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Invoke exact frozen REL-005A transparent finalizer
    uses: Luminous-Dynamics/symthaea/.github/workflows/rel-005a-transparent-capsule-finalizer.yml@2e1f376311cc3577aee4e4edab69d3ea4acf58b4
    with:
      source_run_id: ${{ inputs.source_run_id }}
