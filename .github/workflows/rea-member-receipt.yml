name: REA Member Receipt

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/research/rea-zip-content-verification-receipt-v0.schema.json"
      - "tools/rea-receipt-harness/**"
      - ".github/workflows/rea-member-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-member-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - name: Resolve isolated receipt harness lock
        run: cargo generate-lockfile --manifest-path tools/rea-receipt-harness/Cargo.toml
      - name: Validate JSON Schema and dependency metadata
        run: |
          cargo tree --manifest-path tools/rea-receipt-harness/Cargo.toml --locked -e normal,dev
          cargo metadata --manifest-path tools/rea-receipt-harness/Cargo.toml --locked --no-deps --format-version 1 > "$RUNNER_TEMP/rea-receipt-metadata.json"
      - name: Format check
        run: cargo fmt --manifest-path tools/rea-receipt-harness/Cargo.toml -- --check
      - name: Schema, semantic and JCS tests
        run: cargo test --manifest-path tools/rea-receipt-harness/Cargo.toml --locked
      - name: Archive resolved receipt harness lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rea-member-receipt-cargo-lock
          path: tools/rea-receipt-harness/Cargo.lock
          if-no-files-found: error
          retention-days: 14
      - name: Clippy with warnings denied
        run: cargo clippy --manifest-path tools/rea-receipt-harness/Cargo.toml --locked --all-targets -- -D warnings
