name: REA Member Receipt

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/research/rea-zip-content-verification-receipt-v0.schema.json"
      - "tools/rea-receipt-harness/**"
      - ".github/workflows/rea-member-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-member-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Resolve and pin isolated receipt harness lock
        run: |
          cargo generate-lockfile --manifest-path tools/rea-receipt-harness/Cargo.toml
          echo "3ee6650c71cec05aed87e36fab66734412b5043f8660b89afb17c16bbab14a75  tools/rea-receipt-harness/Cargo.lock" | sha256sum --check -
      - name: Record schema and dependency provenance
        run: |
          checked_out_commit="$(git rev-parse HEAD)"
          test "$checked_out_commit" = "$GITHUB_SHA"
          pr_head_commit="${{ github.event.pull_request.head.sha || github.sha }}"
          {
            echo "tested_tree_commit=$checked_out_commit"
            echo "workflow_event_sha=$GITHUB_SHA"
            echo "pull_request_head_sha=$pr_head_commit"
            rustc --version --verbose
            cargo --version
            sha256sum docs/research/rea-zip-content-verification-receipt-v0.schema.json
            sha256sum tools/rea-receipt-harness/Cargo.lock
          } | tee tools/rea-receipt-harness/run-context.txt
      - name: Validate JSON Schema and dependency metadata
        run: |
          cargo tree --manifest-path tools/rea-receipt-harness/Cargo.toml --locked -e normal,dev
          cargo metadata --manifest-path tools/rea-receipt-harness/Cargo.toml --locked --no-deps --format-version 1 > "$RUNNER_TEMP/rea-receipt-metadata.json"
      - name: Format check
        run: cargo fmt --manifest-path tools/rea-receipt-harness/Cargo.toml -- --check
      - name: Schema, semantic and JCS tests
        run: cargo test --manifest-path tools/rea-receipt-harness/Cargo.toml --locked
      - name: Archive resolved receipt harness lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rea-member-receipt-cargo-lock
          path: |
            tools/rea-receipt-harness/Cargo.lock
            tools/rea-receipt-harness/run-context.txt
          if-no-files-found: error
          retention-days: 14
      - name: Clippy with warnings denied
        run: cargo clippy --manifest-path tools/rea-receipt-harness/Cargo.toml --locked --all-targets -- -D warnings
