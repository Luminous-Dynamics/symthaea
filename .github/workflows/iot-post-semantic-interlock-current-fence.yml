name: IoT Post-Semantic Interlock Current Fence

on:
  pull_request:
    paths:
      - 'crates/bridges/symthaea-iot-actuation-guard-interlock/**'
      - '.github/workflows/iot-post-semantic-interlock-current-fence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iot-post-semantic-interlock-current-fence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Current post-semantic interlock source contract
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          root = Path('crates/bridges/symthaea-iot-actuation-guard-interlock')
          src = (root / 'src/current_post_semantic.rs').read_text()
          code = '\n'.join(
              line for line in src.splitlines()
              if not line.lstrip().startswith('//')
          )
          required = [
              'pub struct CurrentPostSemanticInterlockGuard',
              'policy: PhysicalInterlockPolicyV1',
              'trust_registry: InterlockTrustRegistry',
              'anchored_policy_digest: Digest32',
              'anchored_trust_head: InterlockTrustHead',
              'pub fn fence_current',
              'SystemTime::now()',
              'proof.policy_digest()',
              'proof.interlock_trust_head()',
              'proof.verified_at_unix_ms()',
              'challenge.device_attestation_object_digest()',
              'challenge.semantic_head()',
              'challenge.transport_trust_head()',
              'statement.asserted_interlocks != self.policy.required_interlocks',
              'verify_interlock_key_binding(',
              '&Ed25519Rfc8032InterlockVerifier',
              'binding.key_id() != proof.controller_key_id()',
              'binding.key_digest() != proof.controller_key_digest()',
              'current_key.digest()? != binding.key_digest()',
              'current_key.not_after_unix_ms',
              'self.trust_registry.snapshot().expires_at_unix_ms',
              '.min(controller_key_not_after_unix_ms)',
              '.min(trust_snapshot_expires_at_unix_ms)',
              'pub struct CurrentPostSemanticInterlockFence',
              "_guard: &'a CurrentPostSemanticInterlockGuard",
              "proof: &'a VerifiedPostSemanticPhysicalInterlock",
          ]
          missing = [needle for needle in required if needle not in code]
          if missing:
              raise SystemExit(f'missing current post-semantic interlock invariant: {missing}')

          public_fence = code.split('pub fn fence_current', 1)[1].split('fn fence_current_at', 1)[0]
          forbidden_public = [
              'now_unix_ms', 'verifier:', 'public_key', 'InterlockTrustRegistry',
              'PhysicalInterlockPolicyV1', 'InterlockTrustHead',
          ]
          found_public = [needle for needle in forbidden_public if needle in public_fence]
          if found_public:
              raise SystemExit(f'caller-controlled current interlock input: {found_public}')

          forbidden = [
              'verify_physical_interlock(', 'FinalActuatorPermit', 'TrustBoundFinalActuatorPermit',
              'CompleteJitHalLease', 'JustInTimeHalLease', 'TcpListener', 'TcpStream',
              'tokio::spawn', 'std::process::Command', 'Command::new', 'unsafe {',
          ]
          found = [needle for needle in forbidden if needle in code]
          if found:
              raise SystemExit(f'forbidden final/JIT/HAL surface in current interlock fence: {found}')

          if 'pub fn fence_current_at' in code:
              raise SystemExit('test-time clock injection must remain private')

          manifest = tomllib.loads((root / 'Cargo.toml').read_text())
          expected = {
              'symthaea-authority', 'symthaea-iot-actuation-guard',
              'symthaea-iot-actuation-guard-post-semantic-controller',
              'symthaea-iot-actuation-guard-protocol', 'symthaea-iot-final-gate',
              'symthaea-iot-interlock-ed25519', 'symthaea-iot-interlock-trust',
              'symthaea-iot-transport-receipt', 'thiserror',
          }
          actual = set(manifest.get('dependencies', {}))
          if actual != expected:
              raise SystemExit(f'production dependency drift: {sorted(actual)}')

      - name: Install Rust 1.96 formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Rustfmt
        run: cargo +1.96.0 fmt --check -p symthaea-iot-actuation-guard-interlock

      - name: Install Rust 1.94 qualification toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Verify exact qualification toolchain
        run: |
          rustc +1.94.0 --version | grep -F 'rustc 1.94.0'
          cargo +1.94.0 --version | grep -F 'cargo 1.94.0'

      - name: Preserve checked-in lock
        run: cp Cargo.lock /tmp/Cargo.lock.before

      - name: Reconcile candidate and check package
        run: cargo +1.94.0 check -p symthaea-iot-actuation-guard-interlock --all-targets

      - name: Reject sourced dependency drift
        shell: python
        run: |
          import tomllib
          def sourced(path):
              with open(path, 'rb') as f:
                  doc = tomllib.load(f)
              return {
                  (p['name'], p['version'], p.get('source'))
                  for p in doc.get('package', [])
                  if p.get('source') is not None
              }
          before = sourced('/tmp/Cargo.lock.before')
          after = sourced('Cargo.lock')
          extra = after - before
          removed = before - after
          if extra or removed:
              raise SystemExit(
                  f'sourced dependency drift: added={sorted(extra)}, removed={sorted(removed)}'
              )

      - name: Run current real-controller/generation regression first
        run: >-
          cargo +1.94.0 test --locked -p symthaea-iot-actuation-guard-interlock
          --test current_post_semantic current_post_semantic_interlock_reverifies_fixed_key_and_rejects_generation_advance -- --exact

      - name: Package tests
        run: cargo +1.94.0 test --locked -p symthaea-iot-actuation-guard-interlock --all-targets

      - name: Strict Clippy
        run: cargo +1.94.0 clippy --locked -p symthaea-iot-actuation-guard-interlock --all-targets -- -D warnings

      - name: Show candidate lock delta
        if: always()
        run: git diff -- Cargo.lock || true

      - name: Checked-in lock must already be fresh
        run: git diff --exit-code -- Cargo.lock
