# Symthaea HLB CI Workflow
#
# Runs on push to main, pull requests, and weekly schedule (psych-bench regression)
# Jobs: format check, clippy, tests (default and all-features), psych-bench regression, security audit

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly psych-bench regression run: Sundays at 04:00 UTC
    - cron: '0 4 * * 0'

concurrency:
  # Group by workflow + branch so that only the latest push per branch runs.
  # Older pushes to the same branch are cancelled, avoiding runner queue backlog.
  #
  # EXCEPT workflow_dispatch, which gets a unique group per run via run_id and is
  # therefore never cancelled. A manual dispatch is a deliberate request for a
  # definitive full-matrix result; killing it because someone dispatched again, or
  # pushed, is always wrong -- and it is what made this suite unusable on the
  # long-lived export branch. Iterating on `export/6a2fdb112e-20260727-180925`
  # produced six head SHAs in two days; every pull_request run was `cancelled`
  # before a 62-job matrix could finish, so whoever was working it fell back to
  # manual dispatch -- and those then cancelled each other too. Net effect: 33 of
  # 157 jobs cancelled in the surviving run, including the ENTIRE
  # `Test Feature Combinations` (25 legs) and `Test CI-safe` (7 legs) matrices, so
  # the real failure count was unknowable rather than merely bad.
  # See symthaea/docs/CI_FAILURE_CATALOGUE_2026-07-30.md.
  #
  # push and pull_request keep the supersede-on-new-commit behaviour, which is
  # correct: only the newest commit's result matters and cancelling saves runner
  # minutes. Only the deliberate path is made non-cancellable.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  governance:
    name: Governance Check (Class A/B Changes)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for safety-critical changes
        run: bash scripts/check-class-a-changes.sh --ci

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  cls-field-count:
    name: CLS Field-Count Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CognitiveLoopService field count
        run: bash scripts/check-cls-field-count.sh

  workspace-targets:
    name: Workspace Target Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every workspace member has a build target
        run: bash scripts/check-workspace-targets.sh

      # This job was bash-only until 2026-07-30. The two cargo steps below need the SAME pinned
      # toolchain every other cargo-running job uses; without this they would run against
      # whatever Rust the runner image happens to ship.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      # Added 2026-07-30. These make three guards ENFORCED rather than merely available —
      # they were documentation until CI ran them.
      #
      # duplicate-scan closes the blind spot that let five crates be created in 48 hours, each
      # falsely claiming the workspace lacked a capability it had held for months:
      # DOMAIN_CRATES_INDEX.md indexes only crates/domains/, so in-core modules were invisible
      # to the check meant to prevent exactly that. Fails only on an UNADJUDICATED collision,
      # because the name heuristic ran at ~22% precision and a permanently-red check gets ignored.
      - name: No unadjudicated duplicate-capability collisions
        run: cargo run -q -p xtask -- duplicate-scan

      # crate-status enforces "a crate's existence does not imply endorsement": stale registry
      # entries, evidence levels with no stated basis, and production_allowed claimed below E2
      # are hard errors. Evidence-gap findings print but do not fail (no --strict), so the gate
      # does not go red on honest entries it cannot fix.
      - name: Crate registry integrity
        run: cargo run -q -p xtask -- crate-status

  embodiment-safety-composition:
    name: Embodiment Safety Composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails if a platform gates motor authority on Phi without also admitting a
      # SafetyAgent override and a moral verdict -- i.e. if an ethics verdict has
      # no route to its actuators. Encodes the 2026-07-29 platform audit
      # (SYMTHAEA_COGNITIVE_CORE_RECONCILIATION_PLAN_2026-07-28.md), which found
      # exactly one such platform. Source lint, not a proof -- the script's header
      # explains why it cannot be a Rust test (per-platform Cargo features mean no
      # configuration compiles all 16 together).
      - name: Phi-gating platforms compose override + moral gate
        run: bash scripts/check-embodiment-safety-composition.sh

  orphan-modules:
    name: Orphan Module Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustc never warns about a .rs file no `mod` declares — it just is not
      # part of the crate, so it never compiles and its tests never run. Three
      # shipped-code instances were found on 2026-07-28 (see the script's header
      # comment); one had already rotted against an API that moved under it.
      #
      # Enforces on all ~200 workspace members minus a QUARANTINE list of 28
      # crates with a pre-existing backlog. This started opt-in (3 muse crates)
      # on the assumption most of the workspace was dirty; measuring it on
      # 2026-07-29 found 172 of 200 crates already clean, so opt-in had it
      # backwards — it left 172 unprotected to accommodate 28. Deleting a line
      # from QUARANTINE is how a crate gets cleaned; adding one to go green is
      # the reflex this gate exists to catch.
      - name: No orphan modules outside quarantine
        run: bash scripts/check-orphan-modules.sh

      - name: Report the workspace-wide backlog (informational)
        run: bash scripts/check-orphan-modules.sh --all --summary | tail -2

      # The tests/ and examples/ counterparts of the same failure class:
      # `autotests = false` / `autoexamples = false` mean an undeclared file in
      # those directories is never built, never run, and never warned about.
      # Measured 2026-07-31: 177 of 204 tests/ files and 215 of 454 examples/
      # files are dead this way.
      #
      # Both scripts existed before this wiring and neither had a trigger —
      # check-orphan-tests.sh was written 2026-07-30 and was in NO workflow at
      # all. A guard nobody runs is an instance of the very pattern it detects,
      # which is why these are here rather than in a new script.
      #
      # The examples/ gate matters beyond dead code: CLAUDE.md cited
      # benchmark_sleepstage.rs (Sleep-EDF) and benchmark_arc_reasoning.rs
      # (ARC-AGI) as EXTERNAL VALIDATION while both were unbuildable. Ratcheted
      # against a quarantine of the known backlog, so only NEW orphans fail.
      - name: No orphan tests outside quarantine
        run: bash scripts/check-orphan-tests.sh

      - name: No orphan examples outside quarantine
        run: bash scripts/check-orphan-examples.sh

  doc-tests:
    name: Documentation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doctests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doctests-

      - name: Run doc tests
        run: cargo test --doc

  muse:
    name: Muse (tests, studio, wasm UI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Nothing tested symthaea-muse before 2026-07-28: no job ran `-p
    # symthaea-muse` or `--workspace` (`cargo test` at the spark-engine job is
    # scoped by working-directory; nextest is `-p symthaea --lib`). So its 816
    # tests had never run in CI, `studio` had never even been compiled here, and
    # 26 warnings had accumulated — three of which turned out to be marking
    # tests that computed a value and never asserted on it.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-muse-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-muse-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Test (default features)
        run: cargo test -p symthaea-muse --lib

      # `theory` is the canonical product path (symbolic score -> performance ->
      # audio). It roughly doubles the compiled surface: 40.5K of the crate's
      # 76.3K src lines sit behind this flag.
      - name: Test (theory)
        run: cargo test -p symthaea-muse --lib --features theory

      # `studio` reaches no root-crate feature, so it was never built by any
      # other job — despite owning the HTTP server, its CORS/path-validation
      # logic, and the genealogy ledger.
      #
      # `--bins` covers every studio binary. It was briefly narrowed to
      # --bin muse_studio because muse_motif_foundry_pilot did not compile;
      # that binary has since been removed (it was written against 8 types
      # that have never existed in any commit), so the wider check is back.
      - name: Test the studio server (handlers + wire-compat)
        run: |
          cargo test -p symthaea-muse --features studio --bin muse_studio
          cargo check -p symthaea-muse --features studio --bins

      # Integration tests (tests/*.rs) were the THIRD blind spot in the same
      # family as examples/ and the src/ orphan check: every step above targets
      # --lib or a specific --bin, so nothing here had ever run tests/. That is
      # why tests/creative_regression.rs was failing unobserved (found
      # 2026-07-29, see its own module doc and the split-out
      # rhythmic_regularity_gate_is_directionally_suspect).
      #
      # `--tests` runs EVERY test target, including any tests/*.rs added later.
      #
      # This originally named the two files explicitly, on the reasoning that a
      # new integration test should be a "deliberate" addition to CI. That was
      # backwards, and an external review caught it: the incident being repaired
      # here is precisely that invisible targets rot because verification does
      # not DISCOVER them. An explicit list reintroduces the same hole one file
      # later.
      #
      # The cost of `--tests` is that it re-runs the lib unit tests the two
      # steps above already cover -- about 50 seconds against a 45-minute
      # budget. Trading a discovery blind spot for that is not a trade worth
      # making, which is what the original comment got wrong.
      - name: Integration tests (all test targets)
        run: cargo test -p symthaea-muse --tests

      # Examples are a blind spot no other gate covers. Cargo auto-discovers
      # `examples/*.rs` as binary targets, so no `mod` declares them and
      # check-orphan-modules.sh is structurally blind to them; and plain
      # `cargo check -p <crate>` builds the lib only, so it never touches them
      # either.
      #
      # That is how 35 of symthaea-music-theory's 45 examples sat broken: on
      # 2026-07-29, 0d2a2d2090 correctly deleted the evidence_calibration
      # subtree and verified with `cargo check -p symthaea-music-theory` —
      # clean — while 28 examples importing the deleted Calibration* API and 7
      # `// placeholder` stubs stayed broken and invisible. Found hours later
      # by running `cargo build --examples` by hand.
      #
      # The script now catches the two static shapes (no `fn main`, placeholder
      # stubs), but it CANNOT catch "imports a type that no longer exists" —
      # that needs a real compile, which is this step. music-theory is
      # serde-only and builds its examples in ~8s, so this is nearly free.
      #
      # LIMIT, stated rather than implied: this covers symthaea-music-theory
      # only. symthaea-muse's own examples are not built here — the crate is
      # heavy and several examples are feature-gated behind clap-fad/muse-live,
      # so a full `--examples` pass risks the 45-minute budget. Extending this
      # to muse is real follow-up work, not an oversight.
      - name: Build symthaea-music-theory examples (the examples blind spot)
        run: cargo build -p symthaea-music-theory --examples

      # The check that would have caught the orphaned Research views: this crate
      # only ever builds for wasm32, so a native-only job cannot cover it.
      - name: Compile-check the wasm UI
        run: cargo check -p symthaea-muse-ui --target wasm32-unknown-unknown

      # Lint under `theory` rather than default features on purpose: several
      # midi_export items (the ControlChange variant, cc_volume, cc_pan) are
      # constructed only by theory-gated code, so they read as dead under
      # default features. Linting where the code is actually live avoids
      # contorting the source to satisfy a lint for a feature set that
      # legitimately does not use it.
      - name: Clippy (theory)
        run: cargo clippy -p symthaea-muse --lib --features theory -- -D warnings

      - name: Clippy (protocol + wasm UI)
        run: |
          cargo clippy -p symthaea-muse-protocol -- -D warnings
          cargo clippy -p symthaea-muse-ui --target wasm32-unknown-unknown -- -D warnings

      # The cognition-study apparatus is a third of this crate (51 modules,
      # ~25.8K lines, 120 subcommands) and had never been executed before
      # 2026-07-29 — its own check-cognition-*.sh / verify_cognition_study_*.py
      # scripts assert on file existence and on a Python reimplementation, and
      # never invoke the binary. This runs the real chain on synthetic
      # responses and fails closed unless it separates an injected preference
      # ordering from random preference. Mechanism check only; says nothing
      # about music. See docs/research/evidence/muse-cognition-study-dryrun-2026-07-29/.
      - name: Cognition-study pipeline dry run (manipulation check)
        run: |
          cargo build -p symthaea-muse --features theory --bin cognitive_study
          crates/domains/symthaea-muse/scripts/dryrun-cognition-study.sh \
            "$PWD/target/debug/cognitive_study"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev \
            protobuf-compiler \
            libclang-dev \
            libespeak-ng-dev \
            cmake

      - name: Run clippy (CI-safe features)
        run: |
          # All features EXCEPT those requiring GPU (CUDA/WGPU), MuJoCo, V4L2,
          # audio hardware (cpal), or I2C hardware.
          # Excluded: embeddings-gpu, neural-bridge-cuda, neural-vocoder-gpu,
          #   vision-manifold-camera, foveation-perception, humanoid-mujoco,
          #   humanoid-viewer, flight-mujoco, flight-mujoco-renderer,
          #   flight-swarm, live-voice, ssm-power-hal, gui, full
          # Also excluded: ssm_language -- mutually exclusive with default-mind's
          #   broca_lite (src/lib.rs's compile_error! guard), and default
          #   features are always on here. Tested in isolation instead by the
          #   "ssm_language" entry in Test Feature Combinations (--no-default-features).
          CI_FEATURES="parallel,service,shell,demo,api_module,\
          voice-tts,voice-stt,audio,vocal-tract,neural-vocoder,\
          embeddings,vision-manifold,foveation,\
          integrity,semantic-encoder,neural-bridge,webcam,\
          mesh,mesh-encryption,mesh-key-exchange,swarm,notifications,\
          nixward,identity,physics,physics-bridge,\
          flight,humanoid,hal,ssm-power,\
          lancedb-backend,multi_agent,full_consciousness,\
          full_language,magi_loop,reasoning_engine,code_generation,\
          wasm-sandbox,school_learning,benchmarks,all_benchmarks,\
          integration_module,observability_module,support,web_research_module,\
          genomics,cell-foundry,ectogenesis,nurture,population,genesis,\
          fusion-twin,safety-agents,\
          materials,nuclear-forensics,water-prediction,\
          grid-scaling,fission-reactor,accelerator,threat-assessment,\
          datacenter,experiment-planner,strategic-materials,critical-minerals,\
          advanced-manufacturing,\
          mycelix,unstable-examples"
          cargo clippy -p symthaea --lib --bins --features "$CI_FEATURES" -- -D warnings

  test:
    name: Test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Run tests
        run: cargo test -p symthaea --lib -- --test-threads=1

  test-spark-engine:
    name: Test spark-engine (workspace-excluded crate)
    runs-on: ubuntu-latest
    # crates/domains/spark-engine is in workspace.exclude, so no other job
    # compiles or tests it. It builds standalone from its own directory.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/domains/spark-engine/target
          key: ${{ runner.os }}-cargo-spark-engine-${{ hashFiles('crates/domains/spark-engine/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-spark-engine-

      - name: Run spark-engine tests
        working-directory: crates/domains/spark-engine
        run: cargo test

  test-nextest:
    name: Test (nextest, observational)
    runs-on: ubuntu-latest
    # Non-blocking: this job never fails the workflow (continue-on-error
    # below). It exists so we can watch cargo-nextest's process-per-test
    # isolation behave on this suite for a while before ever depending on
    # it -- not a replacement for the `test` job above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Run tests with nextest
        run: cargo nextest run -p symthaea --lib

  test-hardened-lib:
    name: Hardened Lib Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-hardened-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-hardened-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Run focused lib regressions
        run: |
          CARGO_TARGET_DIR=target/hardened-lib cargo test -p symthaea test_remote_command_capability --lib
          CARGO_TARGET_DIR=target/hardened-lib cargo test -p symthaea test_shell_metacharacters_blocked --lib
          CARGO_TARGET_DIR=target/hardened-lib cargo test -p symthaea test_execute_timeout --lib
          CARGO_TARGET_DIR=target/hardened-lib cargo test -p symthaea test_real_execution_handles_large_stdout --lib

  test-cognitive-hardening:
    name: Cognitive Core Hardening (Phases 2.7–2.9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Regression-protect the full cognitive hardening arc:
    #   Phase 2.7 — LTC timing + epistemic modulation
    #   Phase 2.8 — causal graph topology + drift detection
    #   Phase 2.9 — world model transitions + episodic memory + E2E integration
    # Evidence: docs/evidence/SYMTHAEA_LTC_RUNTIME_HARDENING_V0_1.md
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cognitive-hardening
          key: ${{ runner.os }}-cargo-cognitive-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cognitive-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Phase 2.7 — Active Inference / Epistemic Modulation
        env:
          CARGO_TARGET_DIR: target/cognitive-hardening
        run: cargo test -p nixward --lib "mind::active_inference"

      - name: Phase 2.8 — Causal Graph Topology Hardening
        env:
          CARGO_TARGET_DIR: target/cognitive-hardening
        run: cargo test -p nixward --lib "mind::causal_graph"

      - name: Phase 2.8 — Drift Detection Hardening
        env:
          CARGO_TARGET_DIR: target/cognitive-hardening
        run: cargo test -p nixward --lib "mind::hdc_world_model"

      - name: Phase 2.9-A — World Model Transition Hardening
        env:
          CARGO_TARGET_DIR: target/cognitive-hardening
        run: cargo test -p nixward --lib "mind::world_model"

      - name: Phase 2.9-B — Episodic Memory Boundary Tests
        env:
          CARGO_TARGET_DIR: target/cognitive-hardening
        run: cargo test -p nixward --lib "mind::episodic_memory"

      - name: Phase 2.9-C — End-to-End Cross-Layer Integration
        env:
          CARGO_TARGET_DIR: target/cognitive-hardening
        run: cargo test -p nixward --test sensor_drift_causal_action_integration

  test-hardened-daemon:
    name: Hardened Daemon Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-hardened-daemon-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-hardened-daemon-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Run daemon protocol regressions
        run: |
          CARGO_TARGET_DIR=target/hardened-daemon cargo test -p symthaea --bin symthaea --features service protocol_tests -- --nocapture

      - name: Run daemon binary regressions
        run: |
          CARGO_TARGET_DIR=target/hardened-daemon cargo test -p symthaea --test binary_service --features service -- --nocapture

  test-hardened-api:
    name: Hardened API Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-hardened-api-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-hardened-api-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Run API route-policy regressions
        run: |
          CARGO_TARGET_DIR=target/hardened-api cargo test -p symthaea --lib route_policy_marks_public_get_routes --features api_module -- --nocapture
          CARGO_TARGET_DIR=target/hardened-api cargo test -p symthaea --lib protected_routes_require_auth_when_configured --features api_module -- --nocapture
          CARGO_TARGET_DIR=target/hardened-api cargo test -p symthaea --lib authenticated_submit_is_not_rejected_by_middleware --features api_module -- --nocapture

      - name: Run API integration regressions
        run: |
          CARGO_TARGET_DIR=target/hardened-api cargo test -p symthaea --test api_integration --features api_module -- --nocapture

