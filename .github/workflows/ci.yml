          - symthaea-clime
          - symthaea-hal
          - symthaea-humanoid
          - symthaea-vehicle
          - symthaea-fabrication-kernel
          # symthaea-perception is deliberately in the workspace `exclude` list
          # (ARCHIVED 2026-07-16, vision review P2.2 — real ONNX stack, zero
          # consumers). `cargo test -p symthaea-perception` therefore cannot
          # resolve it, and this entry failed with "did not match any packages"
          # on every run. Re-add only if the crate is un-archived.
          - symthaea-phi-search
          - symthaea-sentinel
          - symthaea-support
          - symthaea-hodge
          - symthaea-field-dynamics
          - symthaea-enactive
          - symthaea-factor-graph
          - symthaea-exploration
          - symthaea-spore
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-subcrate-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-subcrate-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Test ${{ matrix.crate }}
        # A crate can be real in the monorepo yet outside the public export's scope,
        # so this checkout may legitimately not contain it -- symthaea-evidence-plane
        # and nixward are both genuine crates here and absent from the export. Hard
        # failing on that reports a PACKAGING gap as a TEST failure, which is what the
        # 2026-07-30 CI catalogue found (two "bogus" matrix entries that are not bogus
        # in the monorepo at all).
        #
        # Deleting the entries would lose the coverage where the crates do exist, so
        # instead: skip when absent, and say so with ::notice:: -- visible in the run
        # summary rather than silent, because a gate that quietly tests nothing is the
        # failure mode this repo keeps hitting. When the crate IS present, its tests
        # fail normally.
        run: |
          if ! cargo metadata --no-deps --format-version 1 \
               | jq -e --arg c "${{ matrix.crate }}" '.packages[] | select(.name==$c)' >/dev/null; then
            echo "::notice title=Crate not in this checkout::${{ matrix.crate }} is absent (export scope); skipping."
            exit 0
          fi
          cargo test -p ${{ matrix.crate }}

  genesis-benchmarks:
    name: Genesis Mission Benchmarks
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fusion
            features: fusion-twin
          - name: safety
            features: safety-agents
          - name: lab
            features: cell-foundry
          - name: materials
            features: materials
          - name: nuclear
            features: nuclear-forensics
          - name: water
            features: water-prediction
          - name: multiscale
            features: physics
          # Spans every Genesis domain. MUST stay in sync with the
          # `required-features` of [[example]] benchmark_genesis_temporal_unified
          # in Cargo.toml — if this string is narrower, cargo refuses to build
          # the target ("requires the features: ...") instead of running it.
          - name: temporal_unified
            features: physics,nuclear-forensics,safety-agents
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-genesis-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-genesis-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Run genesis ${{ matrix.name }} benchmark
        run: |
          set -o pipefail
          log="genesis-${{ matrix.name }}.log"
          # Stream to the console AND to a file.
          #
          # Do NOT go back to `output=$(cargo run ...)`. Steps run under
          # `bash -e`, so a non-zero cargo exit aborts the step *at the
          # assignment* — the compiler error is captured into $output and then
          # discarded, and the failure shows up as a completely empty step.
          # That is what hid a plain "unresolved crate `symthaea_physics`"
          # error in the temporal_unified leg for months.
          if ! cargo run --example "benchmark_genesis_${{ matrix.name }}" \
              --features "${{ matrix.features }},unstable-examples" \
              --release 2>&1 | tee "$log"; then
            echo "::error::genesis ${{ matrix.name }} benchmark failed to build or run — see the log above"
            exit 1
          fi
          grep -q "PASS" "$log" || { echo "::error::Benchmark did not print PASS"; exit 1; }

      - name: Upload genesis ${{ matrix.name }} log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-${{ matrix.name }}-log
          path: genesis-${{ matrix.name }}.log
          if-no-files-found: ignore

  stress-tests:
    name: Stress Tests (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Run on: weekly schedule (same as psych-bench), or manual dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stress-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stress-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Run proptest stress battery
        env:
          PROPTEST_CASES: 500
        run: |
          cargo test --test proptest_cognitive_loop --release -- --nocapture 2>&1 | tee proptest-cognitive.txt
          cargo test --test proptest_feedback_stability --release -- --nocapture 2>&1 | tee proptest-feedback.txt

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results-${{ github.sha }}
          path: proptest-*.txt
          retention-days: 30

  compliance-safety-ethics:
