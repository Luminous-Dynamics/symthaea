  test-feature-matrix:
    name: Test Feature Combinations
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        features:
          - "default-mind"
          - "shell"
          - "service"
          - "full_consciousness"
          - "reasoning_engine"
          - "voice-tts"
          - "humanoid"
          - "school_learning"
          - "lancedb-backend"
          - "physics"
          - "code_generation"
          - "flight"
          # Canonical spelling of the multirotor feature (flight is the
          # backward-compat alias) — guards against gates that only know the
          # alias, e.g. the embodiment-telemetry cfg that silently dropped
          # metadata under --features multirotor.
          - "multirotor"
          - "mesh"
          - "swarm"
          # Art stack legs (VISUAL_ART_IMPROVEMENT_PLAN_2026-07-10.md Phase
          # 0.4 — the creative stack previously had zero CI soak). "creative"
          # alone is the combo that has already broken once undetected
          # (creative pulls the symthaea-canvas crate without the canvas
          # feature; caught 2026-07-09). The second leg is the full art
          # surface: profile-culture (creative + canvas + social-fabric,
          # incl. the live-loop creative_mesh_sharing regression test) plus
          # the artist's-eye rasterize-critique path and the persistent
          # gallery/style-identity path (both landed 2026-07-10).
          - "creative"
          - "profile-culture,art-eye,gallery"
          # Observer-ΔΨ (art-observer = art-eye + vision-manifold: she LOOKS
          # at her own artwork through the live vision path) — the crown
          # jewel of the projection stack, previously compiled by no CI leg
          # at all (VISION_PROJECTION_REVIEW_2026-07-15.md P1.4). foveation
          # rides along so the Phase 1.4 real-luma dispatch is covered too.
          - "art-observer,foveation"
          # Phone-screen capture pump (Pixel → loop VisionBridge, landed
          # 2026-07-15) — previously the phone feature had no CI coverage.
          - "phone"
          - "ssm_language"
          - "multi_agent"
          - "identity"
          - "all_benchmarks"
          - "genesis"
          - "wasm-sandbox"
          - "integrity"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Compute cache-safe feature key
        # actions/cache@v4 rejects keys containing commas -- matrix.features
        # is comma-separated for multi-feature entries (e.g.
        # "profile-culture,art-eye,gallery"). The previous fix for this
        # (2026-07-26, "Key Validation Error: ... cannot contain commas")
        # used a GitHub Actions expression `replace(matrix.features, ',',
        # '_')` -- but the Actions expression language has no `replace`
        # function (confirmed via actionlint; available functions are
        # always/cancelled/case/contains/endswith/failure/format/fromjson/
        # hashfiles/join/startswith/success/tojson). An invalid function
        # reference fails validation for the ENTIRE workflow file, not just
        # this job -- this silently broke every job in ci.yml, not just this
        # one, since introduction (found 2026-07-27 verifying
        # export-to-standalone.sh: the file had apparently never actually
        # been evaluated by GitHub Actions since that commit). Fixed by
        # computing the substitution in a shell step instead, matching the
        # pattern this same file already uses elsewhere for comma-separated
        # features (see the "Test with feature" step below).
        id: cache-key
        run: echo "key=${FEATURES//,/_}" >> "$GITHUB_OUTPUT"
        env:
          FEATURES: ${{ matrix.features }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-feature-${{ steps.cache-key.outputs.key }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-feature-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev \
            protobuf-compiler \
            libclang-dev \
            libespeak-ng-dev \
            cmake

      - name: Test with feature ${{ matrix.features }}
        # ssm_language: same treatment as school_learning -- its --no-default-features
        # test surface runs long enough to hit the 30min*2-attempt retry budget (confirmed
        # 2026-07-05: compiled clean after the -p symthaea scoping fix, then timed out
        # mid-test-run, never a real failure). Don't let a known-slow combo block CI.
        # 2026-07-06: nearly the entire matrix (20/22 combos) started hitting this
        # 30min*2-attempt budget as pure timeouts (confirmed via job logs -- no
        # assertion failures, just "Timeout of 1800000ms hit"), not per-combo
        # slowness like school_learning/ssm_language. Bumped the per-attempt
        # timeout to 45min (matches the existing 90min job-level ceiling with
        # max_attempts: 2) rather than blanket continue-on-error, which would
        # silently swallow real future regressions across the whole matrix
        # instead of just accommodating overall test-suite growth.
        continue-on-error: ${{ matrix.features == 'school_learning' || matrix.features == 'ssm_language' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          command: |
            FEATURES="${{ matrix.features }}"
            if [ "$FEATURES" = "school_learning" ]; then
              # school_learning is very slow on free-tier runners — limit parallelism
              # to reduce memory pressure and avoid 6h timeout
              cargo test --lib --features "$FEATURES" -- --test-threads=1
            elif [ "$FEATURES" = "ssm_language" ]; then
              # ssm_language is mutually exclusive with default-mind's broca_lite
              # (src/lib.rs's compile_error! guard) -- default features must be off.
              # Scoped to -p symthaea: workspace default-members include
              # crates/core/*, and a bare --no-default-features (no -p) disables
              # every default-member's own defaults too -- e.g. nixward's
              # `default = ["native"]`, breaking its native-gated tests.
              cargo test -p symthaea --lib --no-default-features --features "$FEATURES"
            else
              # Serial threads: `cargo test --lib` (no -p) pulls in every
              # default-member, including symthaea-core's own ~5k-test --lib
              # suite, which segfaults under parallel execution (confirmed
              # 2026-07-29 via a targeted experiment on the `mesh` leg: the
              # identical command with `-- --test-threads=1` ran the full
              # suite to completion, 6137 passed, where the parallel default
              # SIGSEGV'd deterministically on every attempt). The exact
              # racing test(s) haven't been isolated yet -- this trades some
              # CI wall-clock time for a suite that actually runs and reports
              # real pass/fail instead of a crash with zero signal. The only
              # other job that exercises symthaea-core's tests without this
              # flag ("Test (default features)") avoids the crash by scoping
              # to `-p symthaea`, which never builds/runs symthaea-core's own
              # tests at all -- not evidence the race is otherwise absent.
              cargo test --lib --features "$FEATURES" -- --test-threads=1
            fi

  psych-bench:
    name: Psych-Bench Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    # Run on: weekly schedule, OR pushes to main touching cognitive_loop/psych-bench, OR manual
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      ) ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check if psych-bench relevant files changed
        id: changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            psych_relevant:
              - 'src/cognitive_loop/**'
              - 'crates/symthaea-psych-bench/**'
              - 'symthaea-core/src/hdc/**'

      - name: Decide whether to run
        id: should_run
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.changes.outputs.psych_relevant }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping psych-bench: no relevant files changed"
          fi

      - name: Install Rust toolchain
        if: steps.should_run.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry and target
        if: steps.should_run.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-psych-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-psych-

      - name: Install system dependencies
        if: steps.should_run.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Run psych-bench full battery (release)
        if: steps.should_run.outputs.run == 'true'
        run: |
          cargo test --test full_battery --release -p symthaea-psych-bench -- --nocapture 2>&1 | tee psych-bench-output.txt

      - name: Upload psych-bench results
        if: steps.should_run.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: psych-bench-results-${{ github.sha }}
          path: psych-bench-output.txt
          retention-days: 90

  feature-interactions:
    name: Feature Interactions
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        features:
          - "school_learning,reasoning_engine"
          - "code_generation,reasoning_engine"
          - "identity,reasoning_engine"
          - "lancedb-backend,reasoning_engine"
          - "physics,reasoning_engine"
          - "full_consciousness,reasoning_engine"
          - "flight,humanoid"
          - "mesh,full_consciousness"
          - "swarm,full_consciousness"
          - "ssm_language,reasoning_engine"
          - "multi_agent,reasoning_engine"
          - "all_benchmarks,reasoning_engine"
          - "genesis,reasoning_engine"
          - "vision-manifold,reasoning_engine"
          - "vocal-tract,voice-tts"
          # voice-stt-live was previously the only voice feature never even
          # compile-checked (cpal builds fine without an audio device).
          - "voice-stt-live"
          # Lyrics+melody singing bridge (muse -> vocal tract -> vocoder).
          - "singing,voice-tts"
          - "embeddings,reasoning_engine"
          - "mesh-encryption,swarm"
          - "api_module,full_consciousness"
          - "neural-bridge,reasoning_engine"
          - "web_research_module,reasoning_engine"
          - "nixward,reasoning_engine"
          - "wasm-sandbox,reasoning_engine"
          - "integrity,full_consciousness"
          # Safety-critical interaction pairs (added 2026-03-23)
          - "safety-agents,reasoning_engine"
          - "safety-agents,ssm_language"
          - "mycelix,reasoning_engine"
          - "therapeutic,reasoning_engine"
          - "mesh,safety-agents"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-combo-${{ hashFiles('**/Cargo.lock') }}-${{ strategy.job-index }}
          restore-keys: |
            ${{ runner.os }}-cargo-combo-${{ hashFiles('**/Cargo.lock') }}-${{ strategy.job-index }}
            ${{ runner.os }}-cargo-combo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev \
            protobuf-compiler \
            libclang-dev \
            libespeak-ng-dev \
            cmake \
            libv4l-dev

      - name: Check feature combination ${{ matrix.features }}
        run: |
          FEATURES="${{ matrix.features }}"
          case ",$FEATURES," in
            *,ssm_language,*)
              # ssm_language is mutually exclusive with default-mind's broca_lite
              # (src/lib.rs's compile_error! guard) -- default features must be off.
              # Scoped to -p symthaea (see Test Feature Combinations job for why).
              cargo check -p symthaea --no-default-features --features "$FEATURES"
              ;;
            *,voice-tts,*)
              cargo check --features "$FEATURES"
              # Also compile the voice test surface: the gated integration
              # tests once bit-rotted invisibly (imports of deleted types)
              # because feature legs were check-only and never built tests.
              cargo check -p symthaea --features "$FEATURES" \
                --test voice_integration --test voice_pipeline_integration
              ;;
            *)
              cargo check --features "$FEATURES"
              ;;
          esac

  wasm-compat:
    name: WASM Compatibility (Spore)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.108

      - name: Install wasm-opt (binaryen)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build Spore WASM (release)
        run: cargo build --release --target wasm32-unknown-unknown --features wasm -p symthaea-spore

      - name: Optimize with wasm-opt
        run: |
          wasm-opt \
            --enable-bulk-memory \
            --enable-nontrapping-float-to-int \
            --enable-sign-ext \
            -O2 \
            target/wasm32-unknown-unknown/release/symthaea_spore.wasm \
            -o /tmp/symthaea_spore.wasm

      - name: Generate JS bindings
        run: |
          mkdir -p crates/domains/symthaea-spore/www/pkg
          wasm-bindgen --target web --out-dir crates/domains/symthaea-spore/www/pkg /tmp/symthaea_spore.wasm

      - name: Size budget check
        run: |
          WASM_SIZE=$(stat -c%s crates/domains/symthaea-spore/www/pkg/symthaea_spore_bg.wasm)
          echo "WASM size: $((WASM_SIZE / 1024))KB ($WASM_SIZE bytes)"
          GZIP_SIZE=$(gzip -c crates/domains/symthaea-spore/www/pkg/symthaea_spore_bg.wasm | wc -c)
          echo "WASM gzip: $((GZIP_SIZE / 1024))KB ($GZIP_SIZE bytes)"
          if [ "$WASM_SIZE" -gt 512000 ]; then
            echo "ERROR: WASM binary exceeds 500KB budget"
            exit 1
          fi

      - name: Smoke test (export verification)
        run: node crates/domains/symthaea-spore/www/smoke-test.mjs

      - name: E2E test (consciousness cycles + experiments)
        run: node crates/domains/symthaea-spore/www/e2e-test.mjs

  deny:
    name: Dependency Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
          arguments: --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked 2>/dev/null || true

      - name: Run security audit
        run: |
          # Run cargo audit, failing only on CRITICAL and HIGH severity
          # --ignore-source allows unmaintained crate warnings
          # --deny only for high severity issues
          cargo audit --deny warnings --ignore unmaintained || {
            # If it fails, re-run to show output and check severity
            echo "Checking for CRITICAL/HIGH vulnerabilities..."
            cargo audit 2>&1 | tee audit-output.txt

            # Fail only if CRITICAL or HIGH found
            if grep -qE "^(CRITICAL|HIGH):" audit-output.txt 2>/dev/null || \
               grep -qE "Severity: (critical|high)" audit-output.txt 2>/dev/null; then
              echo "::error::CRITICAL or HIGH severity vulnerabilities found!"
              exit 1
            else
              echo "::warning::Only low/medium severity or unmaintained warnings found. Allowing."
              exit 0
            fi
          }

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json
          # cargo-cyclonedx writes bom.json or bom.cdx.json next to Cargo.toml
          ls -la bom*.json 2>/dev/null || true
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: bom*.json
          if-no-files-found: warn
          retention-days: 90

  test-subcrates:
    name: Test Sub-Crates
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        crate:
          - symthaea-core
          - symthaea-psych-bench
          - symthaea-fep
