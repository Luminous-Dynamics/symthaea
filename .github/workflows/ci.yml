          - nixward
          - symthaea-stt
          # Robotics platform crates — every EmbodimentBridge platform gets a
          # CI leg. (symthaea-flight was the stale pre-rename name for
          # symthaea-multirotor; 8 of 11 classic platforms previously had no
          # CI compilation at all — see robotics plan 2026-07-06 Tier 1.1.)
          - symthaea-multirotor
          - symthaea-helicopter
          - symthaea-auv
          - symthaea-manipulator
