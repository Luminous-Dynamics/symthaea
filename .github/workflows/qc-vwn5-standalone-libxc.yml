name: QC VWN5 Standalone Rust + Libxc

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symthaea-quantum-chemistry/src/dft/lda.rs"
      - "scripts/qc/check_vwn5_pyscf_reference.py"
      - ".github/workflows/qc-vwn5-standalone-libxc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qc-vwn5-standalone-libxc-${{ github.event.pull_request.number || github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  vwn5:
    name: VWN5 Rust module tests + PySCF/Libxc reference
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head or dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert and record exact source identity
        id: source_identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            printf 'source HEAD mismatch: expected=%s actual=%s\n' "$EXPECTED_SOURCE_SHA" "$actual" >&2
            exit 1
          fi
          {
            echo "## VWN5 qualification evidence"
            echo
            printf -- '- Exact source commit: `%s`\n' "$actual"
            printf -- '- Source tree: `%s`\n' "$(git rev-parse --verify 'HEAD^{tree}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Compile the actual LDA module tests without workspace metadata
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose | tee /tmp/vwn5-rustc-version.txt
          rustc --edition=2024 --test \
            crates/domains/symthaea-quantum-chemistry/src/dft/lda.rs \
            -o /tmp/vwn5-lda-tests

      - name: Run the actual LDA module tests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/vwn5-lda-tests --nocapture 2>&1 | tee /tmp/vwn5-lda-tests.log

      - name: Install pinned Python
        if: ${{ always() && steps.source_identity.outcome == 'success' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned PySCF and numerical dependencies
        if: ${{ always() && steps.source_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" \
            "scipy==1.15.3" \
            "h5py==3.14.0" \
            "pyscf==2.14.0"

      - name: Compare frozen VWN5 fixtures directly with PySCF Libxc
        if: ${{ always() && steps.source_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qc/check_vwn5_pyscf_reference.py \
            --output /tmp/vwn5-pyscf-reference.json

      - name: Fetch and verify exact PR merge context
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "refs/pull/${PR_NUMBER}/merge"
          merge_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          merge_head="$(git rev-parse --verify "${merge_sha}^2")"
          merge_base="$(git rev-parse --verify "${merge_sha}^1")"
          if [[ "$merge_head" != "$EXPECTED_HEAD_SHA" ]]; then
            printf 'merge head mismatch: expected=%s actual=%s\n' "$EXPECTED_HEAD_SHA" "$merge_head" >&2
            exit 1
          fi
          if [[ "$merge_base" != "$EXPECTED_BASE_SHA" ]]; then
            printf 'merge base mismatch: expected=%s actual=%s\n' "$EXPECTED_BASE_SHA" "$merge_base" >&2
            exit 1
          fi
          git worktree add --detach /tmp/qc-merge-context "$merge_sha"
          test -f /tmp/qc-merge-context/crates/core/symthaea-observation-attestation/Cargo.toml
          {
            printf 'merge_sha=%s\n' "$merge_sha"
            printf 'merge_parent1_base_sha=%s\n' "$merge_base"
            printf 'merge_parent2_head_sha=%s\n' "$merge_head"
            printf 'lockfile_blob_sha=%s\n' "$(git rev-parse --verify "${merge_sha}:Cargo.lock")"
            printf 'observation_manifest_blob_sha=%s\n' "$(git rev-parse --verify "${merge_sha}:crates/core/symthaea-observation-attestation/Cargo.toml")"
            printf 'scientific_source_path=%s\n' "crates/domains/symthaea-quantum-chemistry/src/dft/lda.rs"
            printf 'scientific_source_blob_sha=%s\n' "$(git rev-parse --verify "${merge_sha}:crates/domains/symthaea-quantum-chemistry/src/dft/lda.rs")"
            printf 'workspace_manifest_present=true\n'
          } | tee /tmp/vwn5-merge-context-receipt.txt

      - name: Run quantum-chemistry crate LDA tests on the exact merge context
        if: github.event_name == 'pull_request'
        shell: bash
        working-directory: /tmp/qc-merge-context
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > /tmp/vwn5-cargo-metadata.json
          cargo test --locked -p symthaea-quantum-chemistry dft:: -- --nocapture 2>&1 | tee /tmp/vwn5-cargo-tests.log

      - name: Record qualification summary
        if: always()
        shell: bash
        run: |
          set -u
          {
            echo
            echo "### Standalone Rust evidence"
            echo
            if [[ -f /tmp/vwn5-rustc-version.txt ]]; then
              printf -- '- Compiler: `%s`\n' "$(head -1 /tmp/vwn5-rustc-version.txt)"
            else
              echo "- Compiler evidence was not produced."
            fi
            if [[ -f /tmp/vwn5-lda-tests.log ]]; then
              echo
              echo '```text'
              tail -n 25 /tmp/vwn5-lda-tests.log
              echo '```'
            else
              echo "- Rust test log was not produced."
            fi
            echo
            echo "### Independent PySCF/Libxc evidence"
            echo
            if [[ -f /tmp/vwn5-pyscf-reference.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/vwn5-pyscf-reference.json").read_text(encoding="utf-8"))
          ids = report.get("functional_ids", {})
          print(f"- PySCF: `{report.get('pyscf_version')}`")
          print(f"- NumPy / SciPy: `{report.get('numpy_version')}` / `{report.get('scipy_version')}`")
          print(f"- Resolved Libxc IDs: `{ids}`")
          print(f"- Result: **{'PASS' if report.get('pass') else 'FAIL'}**")
          print()
          print("| Density (a.u.) | εc error | vc error | Full LDA ε error | Full LDA v error |")
          print("|---:|---:|---:|---:|---:|")
          for item in report.get("records", []):
              print(f"| {item['rho']:.3g} | {item['epsilon_abs_error']:.3e} | {item['potential_abs_error']:.3e} | {item['full_lda_epsilon_abs_error']:.3e} | {item['full_lda_potential_abs_error']:.3e} |")
          PY
            else
              echo "- No comparison JSON was produced; the reference step did not complete."
            fi
            echo
            if [[ -f /tmp/vwn5-merge-context-receipt.txt ]]; then
              echo
              echo "### Exact PR merge-context receipt"
              echo
              cat /tmp/vwn5-merge-context-receipt.txt
            fi
            if [[ -f /tmp/vwn5-cargo-tests.log ]]; then
              echo
              echo "### Quantum-chemistry crate LDA tests"
              echo
              echo '```text'
              tail -n 40 /tmp/vwn5-cargo-tests.log
              echo '```'
            fi
            echo
            echo "Scope: the standalone run executes the exact LDA module tests and direct PySCF/Libxc reference. The PR merge-context run additionally tests the actual quantum-chemistry crate and verifies exact base/head merge parents. Neither proves molecular-energy convergence, chemical accuracy, spin-polarized VWN, or materials-discovery qualification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload numerical evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qc-vwn5-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/vwn5-rustc-version.txt
            /tmp/vwn5-lda-tests.log
            /tmp/vwn5-pyscf-reference.json
            /tmp/vwn5-merge-context-receipt.txt
            /tmp/vwn5-cargo-metadata.json
            /tmp/vwn5-cargo-tests.log
          if-no-files-found: warn
          retention-days: 30
