name: MAG-005C independent reference

on:
  pull_request:
    paths:
      - 'scripts/mag-005c-001a-reference.py'
      - 'docs/release/evidence/mag-005c-001a-synthetic-scorecard-corpus-v1.json'
      - '.github/workflows/mag-005c-scorecard-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate MAG-005C synthetic scorecard semantics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Execute independent known-answer scorer
        run: python3 scripts/mag-005c-001a-reference.py
