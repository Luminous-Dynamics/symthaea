name: Domain trust boundary

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  legacy-domain-guard:
    name: Reject legacy domains in security-sensitive paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check domain trust boundary
        run: bash scripts/check-domain-trust.sh
