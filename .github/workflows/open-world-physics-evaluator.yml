name: Open-World Physics Evaluator

on:
  # Push validation also covers stacked research branches whose base is not main.
  push:
    branches:
      - "bench/**"
    paths:
      - "research/open-world-physics-001-evaluator/**"
      - ".github/workflows/open-world-physics-evaluator.yml"
  pull_request:
    paths:
      - "research/open-world-physics-001-evaluator/**"
      - ".github/workflows/open-world-physics-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-world-physics-evaluator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-reference-suite:
    name: Focused Rust reference suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Install stable Rust with quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --manifest-path research/open-world-physics-001-evaluator/Cargo.toml -- --check

      - name: Unit tests
        run: cargo test --locked --manifest-path research/open-world-physics-001-evaluator/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path research/open-world-physics-001-evaluator/Cargo.toml --all-targets -- -D warnings

      - name: Generate report twice and compare byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path research/open-world-physics-001-evaluator/Cargo.toml --release > /tmp/open-world-report-1.json
          cargo run --locked --quiet --manifest-path research/open-world-physics-001-evaluator/Cargo.toml --release > /tmp/open-world-report-2.json
          cmp /tmp/open-world-report-1.json /tmp/open-world-report-2.json
