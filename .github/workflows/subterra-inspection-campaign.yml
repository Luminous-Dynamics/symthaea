name: Subterra inspection campaign portfolio
on:
  pull_request:
    paths:
      - ".github/workflows/subterra-inspection-campaign.yml"
      - "crates/domains/symthaea-subterranean/research/subterra-inspection-campaign/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path crates/domains/symthaea-subterranean/research/subterra-inspection-campaign/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path crates/domains/symthaea-subterranean/research/subterra-inspection-campaign/Cargo.toml --all-targets --offline
      - name: Run synthetic campaign comparison
        run: cargo run --manifest-path crates/domains/symthaea-subterranean/research/subterra-inspection-campaign/Cargo.toml --example synthetic_campaign --offline
      - name: Run strict Clippy
        run: cargo clippy --manifest-path crates/domains/symthaea-subterranean/research/subterra-inspection-campaign/Cargo.toml --all-targets --offline -- -D warnings
