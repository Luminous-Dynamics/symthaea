name: ROB-DESIGN-001C0A JointLinkCoupon Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/rob-design-001c0a-joint-link-coupon.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rob-design-001c0a-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE: symthaea-robot-design
  QUALIFIED_001B0: 24b4da459b6fefd3b2d78649cb8fe483092f5887
  CARGO_INCREMENTAL: "0"

jobs:
  exact-head-c0a-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Bind exact qualifier and source topology
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_parent="${{ github.event.pull_request.base.sha }}"
          else
            expected_parent="$(git rev-parse HEAD^)"
          fi
          echo "EXPECTED_PARENT=$expected_parent" >> "$GITHUB_ENV"
          test "$actual_head" = "$expected_head"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git rev-parse "$expected_parent^")" = "$QUALIFIED_001B0"
          test -z "$(git status --porcelain=v1)"

          mapfile -t qualifier_actual < <(git diff --name-only "$expected_parent" HEAD | LC_ALL=C sort)
          qualifier_expected=(".github/workflows/rob-design-001c0a-joint-link-coupon.yml")
          mapfile -t qualifier_expected < <(printf '%s\n' "${qualifier_expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${qualifier_expected[@]}") <(printf '%s\n' "${qualifier_actual[@]}")

          mapfile -t source_actual < <(git diff --name-only "$QUALIFIED_001B0" "$expected_parent" | LC_ALL=C sort)
          source_expected=(
            "crates/domains/symthaea-robot-design/src/c0_joint_link_coupon.rs"
            "crates/domains/symthaea-robot-design/src/lib.rs"
          )
          mapfile -t source_expected < <(printf '%s\n' "${source_expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${source_expected[@]}") <(printf '%s\n' "${source_actual[@]}")
          git diff --quiet "$QUALIFIED_001B0" "$expected_parent" -- Cargo.toml Cargo.lock crates/domains/symthaea-robot-design/Cargo.toml
          git diff --quiet "$QUALIFIED_001B0" "$expected_parent" -- crates/domains/symthaea-robot-design/src/canonical.rs crates/domains/symthaea-robot-design/src/exact_parameters.rs

      - name: Bind frozen source and workspace bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Cargo.toml Cargo.lock crates/domains/symthaea-robot-design/Cargo.toml \
            > "$RUNNER_TEMP/workspace-inputs.sha256"
          find crates/domains/symthaea-robot-design -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/robot-design-c0a-source.sha256"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.96.0
          rustc --version | grep -F 'rustc 1.96.0'
          cargo --version | grep -F 'cargo 1.96.0'

      - name: Diagnose metadata and lock immutability
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rob-design-c0a-evidence"
          mkdir -p "$evidence_dir"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          set +e
          cargo metadata --format-version 1 > "$evidence_dir/cargo-metadata.json" 2> "$evidence_dir/cargo-metadata.stderr"
          metadata_exit=$?
          set -e
          if ! cmp -s "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock; then
            cp Cargo.lock "$evidence_dir/Cargo.lock.generated"
            diff -u "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock > "$evidence_dir/Cargo.lock.diff" || true
            echo "LOCK_RECONCILIATION_REQUIRED=true" >> "$GITHUB_ENV"
          else
            echo "LOCK_RECONCILIATION_REQUIRED=false" >> "$GITHUB_ENV"
          fi
          if [ "$metadata_exit" -ne 0 ]; then
            echo "METADATA_DIAGNOSTIC_FAILED=true" >> "$GITHUB_ENV"
          else
            echo "METADATA_DIAGNOSTIC_FAILED=false" >> "$GITHUB_ENV"
          fi
          cp "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock
          test -z "$(git status --porcelain=v1)"

      - name: Independent C0 golden identity harness
        if: env.LOCK_RECONCILIATION_REQUIRED == 'false' && env.METADATA_DIAGNOSTIC_FAILED == 'false'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rob-design-c0a-evidence"
          python3 - <<'PY' | tee "$evidence_dir/independent-golden-reference.txt"
          import hashlib

          def put_str(out, value):
              raw = value.encode("utf-8")
              out += len(raw).to_bytes(8, "big")
              out += raw

          g = bytearray()
          put_str(g, "symthaea.robot-design.c0-rectangular-geometry-intent.v1")
          g += (1).to_bytes(4, "big")
          g += bytes([0, 0])
          for value in [300_000, 20_000, 6_000]:
              g += value.to_bytes(8, "big")
          geometry_sha = hashlib.sha256(g).hexdigest()
          assert geometry_sha == "e11301b930ac9acf28ac340aaa23eec3c112d59bac5c97ba1ce2ad1ed876fdf6"

          design = bytearray()
          put_str(design, "symthaea.robot-design.v1")
          design += (1).to_bytes(4, "big")
          design += bytes([0])
          design += bytes([1]) * 32
          put_str(design, "c0-joint-link-coupon-v1")
          design += (1).to_bytes(8, "big")
          put_str(design, "joint-link-coupon")
          put_str(design, "structural-link-coupon")
          design += (0).to_bytes(8, "big")
          design += (1).to_bytes(8, "big")
          put_str(design, "coupon-body")
          put_str(design, "joint-link-coupon")
          design += bytes([1])
          design += bytes.fromhex(geometry_sha)
          design += (1).to_bytes(8, "big")
          put_str(design, "joint-link-coupon")
          design += bytes([2]) * 32
          design += (0).to_bytes(8, "big")
          design += (0).to_bytes(8, "big")
          design += (0).to_bytes(8, "big")
          design += bytes([3]) * 32
          design += bytes.fromhex("7f8721c10bdd0cd351619750e94f2e41677be266cc5ba6701e95c4444f16ba9c")
          design_sha = hashlib.sha256(design).hexdigest()
          assert design_sha == "47d25b5aa1851deecbc5c0f7b637d2a80ef39f603a6c898f5ec50a8c5c2a5f58"
          print("geometry_intent_sha256=" + geometry_sha)
          print("robot_design_sha256=" + design_sha)
          print("independent_reference=PASS")
          PY

      - name: Rustfmt
        if: env.LOCK_RECONCILIATION_REQUIRED == 'false' && env.METADATA_DIAGNOSTIC_FAILED == 'false'
        run: cargo fmt --check -p "$PACKAGE"

      - name: Locked compile
        if: env.LOCK_RECONCILIATION_REQUIRED == 'false' && env.METADATA_DIAGNOSTIC_FAILED == 'false'
        run: cargo check -p "$PACKAGE" --all-targets --locked

      - name: Focused tests
        if: env.LOCK_RECONCILIATION_REQUIRED == 'false' && env.METADATA_DIAGNOSTIC_FAILED == 'false'
        run: cargo test -p "$PACKAGE" --locked -- --nocapture

      - name: Strict Clippy
        if: env.LOCK_RECONCILIATION_REQUIRED == 'false' && env.METADATA_DIAGNOSTIC_FAILED == 'false'
        run: cargo clippy -p "$PACKAGE" --all-targets --locked -- -D warnings

      - name: Refuse qualification while lock reconciliation is required
        if: env.LOCK_RECONCILIATION_REQUIRED == 'true'
        run: exit 1

      - name: Refuse qualification on metadata failure
        if: env.METADATA_DIAGNOSTIC_FAILED == 'true'
        run: exit 1

      - name: Source postflight immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/Cargo.lock.before" ]; then cp "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock; fi
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          sha256sum -c "$RUNNER_TEMP/workspace-inputs.sha256"
          sha256sum -c "$RUNNER_TEMP/robot-design-c0a-source.sha256"

      - name: Write evidence receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rob-design-c0a-evidence"
          mkdir -p "$evidence_dir"
          {
            echo "program=ROB-DESIGN-001C0A"
            echo "authority=c0-coupon-design-source-qualification-only"
            echo "qualified_001b0_sha=$QUALIFIED_001B0"
            echo "source_subject_sha=$EXPECTED_PARENT"
            echo "qualifier_sha=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version 2>/dev/null || echo unavailable)"
            echo "cargo=$(cargo --version 2>/dev/null || echo unavailable)"
            echo "lock_reconciliation_required=${LOCK_RECONCILIATION_REQUIRED:-UNKNOWN}"
            echo "metadata_diagnostic_failed=${METADATA_DIAGNOSTIC_FAILED:-UNKNOWN}"
            echo "job_status=${{ job.status }}"
            echo "qualification_claim=SOURCE_ONLY"
            echo "geometry_translation_claim=NONE"
            echo "structural_claim=NONE"
            echo "fabrication_authority=NONE"
            echo "physical_claim=NONE"
            echo "actuation_authority=NONE"
          } > "$evidence_dir/receipt.txt"
          cp "$RUNNER_TEMP/workspace-inputs.sha256" "$evidence_dir/" 2>/dev/null || true
          cp "$RUNNER_TEMP/robot-design-c0a-source.sha256" "$evidence_dir/" 2>/dev/null || true
          find "$evidence_dir" -type f ! -name sha256sums.txt -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$evidence_dir/sha256sums.txt"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rob-design-c0a-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rob-design-c0a-evidence/
          if-no-files-found: error
          retention-days: 90
