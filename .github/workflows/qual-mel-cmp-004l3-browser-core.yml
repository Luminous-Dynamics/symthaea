name: QUAL-MEL-CMP-004L3A browser core

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  browser-core:
    name: Qualify frozen IndexedDB browser core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify qualifier wrapper and frozen source
        shell: bash
        env:
          SOURCE_SHA: 89d7d9d5a9635f949b179ec8b05635e62d7f3b4f
          SOURCE_PARENT_SHA: b89fa2f1f660d4fe10212d77a270f8712f5d0c98
        run: |
          set -euo pipefail
          QUALIFIER_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^")" = "$SOURCE_PARENT_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" "$QUALIFIER_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/qual-mel-cmp-004l3-browser-core.yml"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install pinned Rust and WASM target
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Confirm Chrome availability
        shell: bash
        run: google-chrome --version

      - name: Overlay browser-only qualification harness
        shell: bash
        run: |
          set -euo pipefail
          crate="crates/domains/symthaea-muse-ui"
          cp "$crate/src/main.rs" "$crate/src/lib.rs"

          cat >> "$crate/Cargo.toml" <<'EOF'

          [target.'cfg(target_arch = "wasm32")'.dev-dependencies]
          wasm-bindgen-test = "0.3"
          EOF

          mkdir -p "$crate/tests"
          cat > "$crate/tests/indexeddb_browser.rs" <<'EOF'
          #![cfg(target_arch = "wasm32")]

          use futures::join;
          use wasm_bindgen_test::*;

          use symthaea_muse_protocol::{
              ArtifactIdentity, CompositionArtifactId, RenditionArtifactId,
              ScoreContentArtifactId,
          };
          use symthaea_muse_ui::comparison_evidence_envelope::{
              ARTIFACT_BOUND_COMPARISON_ENVELOPE_SCHEMA_VERSION,
              ArtifactBoundBlindComparisonEnvelopeV1,
          };
          use symthaea_muse_ui::comparison_evidence_indexed_db::{
              IndexedDbComparisonEvidenceCreateOutcome,
              IndexedDbComparisonEvidenceError,
              IndexedDbComparisonEvidenceStore,
          };
          use symthaea_muse_ui::comparison_evidence_record::{
              ARTIFACT_BOUND_COMPARISON_EVIDENCE_SCHEMA_VERSION,
              ArtifactBoundBlindComparisonEvidenceV1,
              BlindAssignmentProvenanceV1,
              BlindHumanComparisonChoiceV1,
              ComparisonEvidenceAuthorityV1,
              ComparisonIdentityRelationV1,
              DurationEvidenceV1,
              EvidenceSideV1,
              ExposurePolicyEvidenceV1,
              HumanComparisonJudgmentV1,
              ListeningExposureEvidenceV1,
              MusicalAnchorEvidenceV1,
              ResolvedHumanComparisonChoiceV1,
              RevealedAssignmentEvidenceV1,
          };
          use symthaea_muse_ui::comparison_evidence_store::ComparisonEvidenceStoreContractError;

          wasm_bindgen_test_configure!(run_in_browser);

          const TRIAL_A: &str = "10000000000000000000000000000001";
          const TRIAL_B: &str = "10000000000000000000000000000002";
          const TRIAL_C: &str = "10000000000000000000000000000003";

          fn identity(score: char, composition: char, rendition: char) -> ArtifactIdentity {
              ArtifactIdentity {
                  score_content: ScoreContentArtifactId(score.to_string().repeat(64)),
                  composition: CompositionArtifactId(composition.to_string().repeat(64)),
                  rendition: RenditionArtifactId(rendition.to_string().repeat(64)),
              }
          }

          fn envelope(id: &str, note: &str) -> ArtifactBoundBlindComparisonEnvelopeV1 {
              ArtifactBoundBlindComparisonEnvelopeV1 {
                  schema_version: ARTIFACT_BOUND_COMPARISON_ENVELOPE_SCHEMA_VERSION,
                  trial_instance_id: id.into(),
                  evidence: ArtifactBoundBlindComparisonEvidenceV1 {
                      schema_version: ARTIFACT_BOUND_COMPARISON_EVIDENCE_SCHEMA_VERSION,
                      trial_id: 202,
                      recorded_at_unix_ms: 1_800_000_000_000,
                      side_a_identity: identity('a', 'b', 'c'),
                      side_b_identity: identity('d', 'e', 'f'),
                      revealed_assignment: RevealedAssignmentEvidenceV1 {
                          visible_a_side: EvidenceSideV1::B,
                          visible_b_side: EvidenceSideV1::A,
                      },
                      anchor: MusicalAnchorEvidenceV1 {
                          bar_index: 2,
                          beat_offset: 0.5,
                      },
                      exposure_policy: ExposurePolicyEvidenceV1 {
                          minimum_seconds_per_side: 0.5,
                          max_contiguous_step_seconds: 0.6,
                      },
                      duration_evidence_at_judgment: DurationEvidenceV1 {
                          visible_a_seconds: 0.5,
                          visible_b_seconds: 0.5,
                      },
                      judgment: HumanComparisonJudgmentV1 {
                          blind_choice: BlindHumanComparisonChoiceV1::PreferVisibleA,
                          resolved_choice: ResolvedHumanComparisonChoiceV1::PreferSideB,
                          listening_exposure: ListeningExposureEvidenceV1 {
                              visible_a_auditions: 1,
                              visible_b_auditions: 1,
                          },
                          self_reported_confidence: Some(0.75),
                          note: note.into(),
                      },
                      identity_relation: ComparisonIdentityRelationV1::DifferentComposition,
                      assignment_provenance: BlindAssignmentProvenanceV1::Unspecified,
                      authority: ComparisonEvidenceAuthorityV1::HumanSelfReport,
                  },
              }
          }

          async fn cleanup(store: &IndexedDbComparisonEvidenceStore, trial_instance_id: &str) {
              if let Some(record) = store.read(trial_instance_id).await.unwrap() {
                  store.delete(&record).await.unwrap();
              }
          }

          #[wasm_bindgen_test]
          async fn create_read_replay_list_delete_round_trip() {
              let store = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              cleanup(&store, TRIAL_A).await;
              let subject = envelope(TRIAL_A, "round trip");

              assert_eq!(
                  store.create_once(subject.clone()).await.unwrap(),
                  IndexedDbComparisonEvidenceCreateOutcome::Created
              );

              let read = store.read(TRIAL_A).await.unwrap().unwrap();
              assert_eq!(read.trial_instance_id(), TRIAL_A);
              assert_eq!(
                  store.create_once(subject).await.unwrap(),
                  IndexedDbComparisonEvidenceCreateOutcome::ExactReplay
              );

              let listed = store.list().await.unwrap();
              assert!(listed.iter().any(|item| item.trial_instance_id() == TRIAL_A));

              store.delete(&read).await.unwrap();
              assert!(store.read(TRIAL_A).await.unwrap().is_none());
          }

          #[wasm_bindgen_test]
          async fn conflicting_reuse_fails_closed_without_overwrite() {
              let store = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              cleanup(&store, TRIAL_B).await;

              assert_eq!(
                  store.create_once(envelope(TRIAL_B, "original")).await.unwrap(),
                  IndexedDbComparisonEvidenceCreateOutcome::Created
              );

              let error = store
                  .create_once(envelope(TRIAL_B, "changed"))
                  .await
                  .expect_err("same durable trial ID must not be overwritten");
              assert!(matches!(
                  error,
                  IndexedDbComparisonEvidenceError::Contract(
                      ComparisonEvidenceStoreContractError::ConflictingTrialReuse { .. }
                  )
              ));

              let retained = store.read(TRIAL_B).await.unwrap().unwrap();
              assert_eq!(retained.evidence().record().judgment.note, "original");
              store.delete(&retained).await.unwrap();
          }

          #[wasm_bindgen_test]
          async fn concurrent_same_key_writers_converge_to_created_plus_exact_replay() {
              let first = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              let second = IndexedDbComparisonEvidenceStore::open().await.unwrap();
              cleanup(&first, TRIAL_C).await;

              let subject = envelope(TRIAL_C, "concurrent");
              let (left, right) = join!(
                  first.create_once(subject.clone()),
                  second.create_once(subject)
              );
              let left = left.unwrap();
              let right = right.unwrap();
              assert!(matches!(
                  (left, right),
                  (
                      IndexedDbComparisonEvidenceCreateOutcome::Created,
                      IndexedDbComparisonEvidenceCreateOutcome::ExactReplay
                  ) | (
                      IndexedDbComparisonEvidenceCreateOutcome::ExactReplay,
                      IndexedDbComparisonEvidenceCreateOutcome::Created
                  )
              ));

              let retained = first.read(TRIAL_C).await.unwrap().unwrap();
              first.delete(&retained).await.unwrap();
          }
          EOF

      - name: Execute real IndexedDB adapter in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          wasm-pack test crates/domains/symthaea-muse-ui \
            --chrome --headless --test indexeddb_browser

      - name: Restore and verify frozen product source
        if: always()
        shell: bash
        env:
          SOURCE_SHA: 89d7d9d5a9635f949b179ec8b05635e62d7f3b4f
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
