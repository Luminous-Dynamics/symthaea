name: HAK Provider Response Envelope

on:
  pull_request:
    branches:
      - architecture/hak-traversal-coverage-set-v1
    paths:
      - 'scripts/hak_provider_response_envelope.py'
      - 'tests/python/test_hak_provider_response_envelope.py'
      - 'tests/python/test_hak_provider_response_envelope_schema.py'
      - 'docs/architecture/HUMAN_AGENCY_KERNEL_PROVIDER_RESPONSE_ENVELOPE_V1.md'
      - 'docs/architecture/hak/provider-response-envelope-v1.schema.json'
      - 'docs/architecture/hak/link-pagination-projection-receipt-v1.schema.json'
      - 'docs/architecture/hak/policies/hak019a-github-rest-link-pagination-v1.json'
      - 'docs/architecture/hak/plans/hak019a-provider-response-envelope-e5-v1.plan.json'
      - 'docs/architecture/hak/policies/hak019a-provider-response-envelope-binding-policy-v1.json'
      - '.github/workflows/hak-provider-response-envelope.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-response-envelope:
    name: HAK Provider Response Envelope
    runs-on: ubuntu-latest
    if: github.repository == 'Luminous-Dynamics/symthaea'
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          echo "HAK-019a exact subject: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HAK-019a test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile HAK-019a tooling
        run: python -m py_compile scripts/hak_provider_response_envelope.py

      - name: Validate HAK-019a schema syntax
        run: |
          python -m json.tool docs/architecture/hak/provider-response-envelope-v1.schema.json >/dev/null
          python -m json.tool docs/architecture/hak/link-pagination-projection-receipt-v1.schema.json >/dev/null
          python -m json.tool docs/architecture/hak/policies/hak019a-github-rest-link-pagination-v1.json >/dev/null

      - name: Lint HAK-019a qualification plan
        run: python scripts/hak_evidence_lint.py docs/architecture/hak/plans/hak019a-provider-response-envelope-e5-v1.plan.json

      - name: Lint HAK-019a check-binding policy
        run: |
          python scripts/hak_check_binding_lint.py \
            --plan docs/architecture/hak/plans/hak019a-provider-response-envelope-e5-v1.plan.json \
            --policy docs/architecture/hak/policies/hak019a-provider-response-envelope-binding-policy-v1.json

      - name: Run HAK-019a regressions
        run: |
          python -m pytest -q \
            tests/python/test_hak_provider_response_envelope.py \
            tests/python/test_hak_provider_response_envelope_schema.py
