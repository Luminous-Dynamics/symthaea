[package]
name = "mycelix-governance-tests"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <dev@luminous-dynamics.com>"]
license = "AGPL-3.0-or-later"
description = "Integration tests for Mycelix Governance Holochain zomes"
autotests = false

[dependencies]
# Holochain testing dependencies (NO zome crate imports to avoid duplicate symbols)
hdk = "0.6.0"
hdi = "0.7.0"

# Async runtime for tests

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = "0.4"

# Crypto for DKG ceremony E2E tests
feldman-dkg = { path = "../../mycelix-core/libs/feldman-dkg", features = ["ml-kem-768", "ml-dsa-65"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
rand = "0.8"
blake3 = "1.5"

[[test]]
name = "sweettest_integration"
path = "sweettest_integration.rs"

[[test]]
name = "sweettest_adversarial"
path = "sweettest_adversarial.rs"

[[test]]
name = "sweettest_constellation_sim"
path = "sweettest_constellation_sim.rs"

[workspace]

[dev-dependencies]
holochain = { version = "0.6.0", features = ["test_utils", "sweettest"] }
holochain_types = "0.6.0"
tokio = { version = "1.52.2", features = ["full", "test-util"] }
