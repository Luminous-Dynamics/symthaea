[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/core/*",
    "crates/domains/*",
    "crates/bridges/*",
]
# NOTE: the root package ("symthaea") is automatically a workspace member
# because this manifest has both [package] and [workspace] — it does NOT
# need (and must NOT have) an explicit "." entry here. Verified 2026-07-03:
# with cargo 1.95.0, an explicit "." in members silently disables
# exclude for every glob-matched member (spark-engine, symthaea-lab, and
# the old symthaea-muse-wasm path were all being compiled as full workspace
# members despite being listed below, because of this). default-members
# below may still reference "." — only the members array triggers the bug.
exclude = [
    # nixward-web's own crate-type (cdylib+rlib for wasm-bindgen) doesn't fit
    # cleanly into workspace-wide manifest resolution alongside its native
    # nixward path dependency. Keep it out of the workspace and build it
    # standalone (cargo build -p nixward-web from its own directory).
    "crates/core/nixward-web",
    "crates/core/symthaea-zkproof/methods",
    "crates/core/symthaea-zkproof/host",
    "crates/core/symthaea-observation-attestation",
    "crates/domains/symthaea-spore/fuzz",
    "crates/domains/spark-engine",
    "crates/domains/symthaea-lab",
    # ARCHIVED 2026-07-16 (vision review P2.2): real SigLIP/Moondream/ocrs ONNX
    # stack, but zero consumers — its only reference is foveation's non-default
    # perception feature nothing enables, and it duplicates src/perception/'s
    # live modules. Excluded so the workspace stops compiling a dead island;
    # the adopt path (foveation RealVentralPipeline) still works via path dep.
    "crates/domains/symthaea-perception",
]
default-members = [
    "xtask",
    ".",
    "crates/core/*",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.metadata.symthaea.tiers]
core = ["symthaea", "symthaea-core", "nixward"]
gpu = ["symthaea-broca", "symthaea-stt"]
wasm = ["symthaea-spore", "symthaea-web"]
robotics = ["symthaea-multirotor", "symthaea-helicopter", "symthaea-humanoid", "symthaea-auv"]
engineering = [
    "symthaea-sim-bridge",
    "symthaea-control",
    "symthaea-digital-twin",
    "symthaea-formal-safety",
    "symthaea-engineering",
    "symthaea-mujoco-bridge",
    "symthaea-opensees-bridge",
    "symthaea-ngspice-bridge",
    "symthaea-openfoam-bridge",
    "symthaea-ros-bridge",
]

[workspace.dependencies]
log = "0.4"
url = "2.5"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
getrandom = "0.2"
mycelix-zkp-core = { path = "stubs/mycelix-zkp-core", features = ["dilithium"] }

# Mycelix Shared Deps (Bundled Standalone)
sha2 = { version = "0.10", features = ["oid"] }
pqcrypto-traits = "0.3"
pqcrypto-dilithium = "0.5"
subtle = "2.5"
no-panic = "0.1"
parry3d = "0.17"
uom = { version = "0.36", features = ["f64", "si"] }
fixed = "1.27"
statig = "0.3"
tracing-chrome = "0.7"
yrs = "0.17"
chumsky = "0.9"
argmin = { version = "0.10", features = ["serde"] }
wgpu = "27.0"
faer = "0.21"
iceoryx2 = "0.9"
z3 = { version = "0.12", features = ["static-link-z3"] }
candle-core = { version = "0.8", default-features = false }
candle-nn = "0.8"
arrow-array = "58"
arrow-schema = "58"
ndarray = { version = "0.16", features = ["rayon", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.3"
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.5"
uuid = { version = "1.6", features = ["serde", "v4"] }
itertools = "0.13"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.19"
nalgebra = "0.34"
rustfft = "6.2"
clap = { version = "4.4", features = ["derive"] }
hound = "3.5"
flacenc = "0.4"
rubato = "0.14"
petgraph = { version = "0.6", features = ["serde-1"] }
regex = "1.10"
strsim = "0.11"
tree-sitter = "0.24"
tree-sitter-nix = "0.3"
