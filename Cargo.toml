[profile.test]
inherits = "dev"
opt-level = 1  # HV16 array ops are 10-100x slower at opt-level=0
codegen-units = 16  # 16 CUs: good parallelism + sccache hits (was 256 → 2% cache hit rate)

[profile.release]
opt-level = 3
lto = "thin"         # 5x faster release builds vs "fat", <5% perf difference
codegen-units = 1
strip = true

[patch.crates-io]
std_msgs = { path = "crates/bridges/symthaea-ros-bridge/ros_msgs/std_msgs" }
sensor_msgs = { path = "crates/bridges/symthaea-ros-bridge/ros_msgs/sensor_msgs" }
trajectory_msgs = { path = "crates/bridges/symthaea-ros-bridge/ros_msgs/trajectory_msgs" }
builtin_interfaces = { path = "crates/bridges/symthaea-ros-bridge/ros_msgs/builtin_interfaces" }
geometry_msgs = { path = "crates/bridges/symthaea-ros-bridge/ros_msgs/geometry_msgs" }
curve25519-dalek-derive = { path = "patches/ed25519-dalek/curve25519-dalek-derive" }
curve25519-dalek = { path = "patches/ed25519-dalek/curve25519-dalek" }
ed25519-dalek = { path = "patches/ed25519-dalek/ed25519-dalek" }
iroh = { path = "patches/iroh/iroh" }
iroh-base = { path = "patches/iroh/iroh-base" }
iroh-relay = { path = "patches/iroh/iroh-relay" }
# cudarc 0.13.9 does not ship CUDA 12.9 bindings. The vendored copy
# aliases CUDA 12.9 to its CUDA 12.8 bindings for local Broca GPU builds.
cudarc = { path = "vendor/cudarc-0.13.9-cuda129" }

[profile.release.package.symthaea-physics-catalog]
opt-level = "z"
codegen-units = 1

[profile.bench]
inherits = "release"

