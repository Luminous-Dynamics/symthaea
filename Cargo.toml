[workspace]
resolver = "2"
members = [
    "xtask",
    ".",
    "crates/core/*",
    "crates/domains/*",
    "crates/bridges/*",
]
exclude = [
    "crates/domains/spark-engine",
    "crates/domains/symthaea-lab",
]
default-members = [
    "xtask",
    ".",
    "crates/core/*",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.metadata.symthaea.tiers]
core = ["symthaea", "symthaea-core", "symthaea-nix"]
gpu = ["symthaea-broca", "symthaea-stt"]
wasm = ["symthaea-spore", "symthaea-web"]
robotics = ["symthaea-multirotor", "symthaea-helicopter", "symthaea-humanoid", "symthaea-auv"]
engineering = [
    "symthaea-sim-bridge",
    "symthaea-control",
    "symthaea-digital-twin",
    "symthaea-formal-safety",
    "symthaea-engineering",
    "symthaea-mujoco-bridge",
    "symthaea-opensees-bridge",
    "symthaea-ngspice-bridge",
    "symthaea-openfoam-bridge",
    "symthaea-ros-bridge",
]

[workspace.dependencies]
log = "0.4"
url = "2.5"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
getrandom = "0.2"
no-panic = "0.1"
parry3d = "0.17"
uom = { version = "0.36", features = ["f64", "si"] }
fixed = "1.27"
statig = "0.3"
tracing-chrome = "0.7"
yrs = "0.17"
chumsky = "0.9"
argmin = { version = "0.10", features = ["serde"] }
wgpu = "27.0"
faer = "0.21"
iceoryx2 = "0.9"
z3 = { version = "0.12", features = ["static-link-z3"] }
candle-core = { version = "0.8", default-features = false }
candle-nn = "0.8"
arrow-array = "58"
arrow-schema = "58"
ndarray = { version = "0.16", features = ["rayon", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.3"
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.5"
uuid = { version = "1.6", features = ["serde", "v4"] }
itertools = "0.13"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.19"
nalgebra = "0.34"
rustfft = "6.2"
clap = { version = "4.4", features = ["derive"] }
hound = "3.5"
flacenc = "0.4"
rubato = "0.14"
petgraph = { version = "0.6", features = ["serde-1"] }
regex = "1.10"
strsim = "0.11"
tree-sitter = "0.24"
tree-sitter-nix = "0.3"
hex = "0.4"
ed25519-dalek = "=2.1.0"
syn = { version = "2.0", features = ["full", "visit", "visit-mut"] }
rusqlite = { version = "0.37", features = ["bundled"] }
dashmap = "5.5"
lru = "0.16"
serial_test = "3.2"
rayon = "1.10"
proptest = "1.4"
num-complex = "0.4"
libc = "0.2"
csv = "1.3"
axum = { version = "0.8", features = ["ws"] }

