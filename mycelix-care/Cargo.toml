[workspace]
resolver = "2"
members = [
    "zomes/timebank/integrity",
    "zomes/timebank/coordinator",
    "zomes/circles/integrity",
    "zomes/circles/coordinator",
    "zomes/matching/integrity",
    "zomes/matching/coordinator",
    "zomes/care-plans/integrity",
    "zomes/care-plans/coordinator",
    "zomes/credentials/integrity",
    "zomes/credentials/coordinator",
    "zomes/bridge/integrity",
    "zomes/bridge/coordinator",
]

[workspace.dependencies]
# Holochain 0.6 compatible (per official compatibility table)
hdk = "0.6.0"
hdi = "0.7.0"
holochain_integrity_types = "0.6.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
thiserror = "1.0"
derive_more = "0.99"

# Holochain serialized bytes for entry serialization
holochain_serialized_bytes = "0.0.56"

# WASM compatibility - getrandom 0.3 with custom backend (HDK provides __getrandom_v03_custom)
# NOTE: Do NOT use features = ["js"] or ["wasm_js"] - they pull in wasm-bindgen
# which is incompatible with Holochain's WASM runtime.
getrandom_03 = { package = "getrandom", version = "=0.3.2" }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
