[build]
target = "index.html"
dist = "dist"

# Copy curriculum content into dist/ after each build
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "mkdir -p dist/caps && cp -r ../../examples/curriculum/caps/generated dist/caps/ 2>/dev/null; cp -r static/* dist/ 2>/dev/null; true"]

[watch]
watch = ["src", "style", "index.html"]

[serve]
port = 3001
open = false
