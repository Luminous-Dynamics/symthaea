[package]
name = "mycelix-core"
version = "0.1.0"
edition = "2021"
authors = ["Mycelix Team"]
description = "High-performance Rust components for Mycelix Federated Learning"

[lib]
name = "mycelix_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
ring = "0.17"
x25519-dalek = "2.0"

# Math/ML
ndarray = "0.15"
num-traits = "0.2"

# FFI
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
