[package]
name = "bridge_integrity"
version = "0.1.0"
edition = "2021"
description = "Bridge integrity zome - inter-hApp communication and reputation aggregation"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
name = "bridge_integrity"

[dependencies]
# Holochain Integrity (HDI) for entry definitions
hdi = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
holochain_serialized_bytes = "0.0.56"

# Enable wasm support for getrandom (transitive dependencies)
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

# Pin rmp and rmp-serde to compatible versions
rmp = "=0.8.14"
rmp-serde = "=1.3.0"

# Pin indexmap to version compatible with Rust 1.81
indexmap = "=2.2.6"

# Mycelix SDK for Bridge types
mycelix-sdk = { path = "../../../../mycelix-workspace/sdk" }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
