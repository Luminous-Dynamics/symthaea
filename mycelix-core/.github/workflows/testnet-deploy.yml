# Mycelix Testnet CI/CD Pipeline
#
# This workflow handles building, testing, and deploying to the testnet.
#
# Triggers:
#   - Push to main (deploy to testnet)
#   - Pull requests (build and test only)
#   - Manual dispatch (with options)
#
# Secrets required:
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#   - GRAFANA_ADMIN_PASSWORD
#   - SLACK_WEBHOOK_URL
#   - GHCR_TOKEN (GitHub Container Registry)

name: Testnet CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'libs/**'
      - 'zomes/**'
      - 'contracts/**'
      - 'deployment/**'
      - '.github/workflows/testnet-deploy.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
          - restart
          - status
      component:
        description: 'Component to deploy (all, validators, fl)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - validators
          - fl
      skip_tests:
        description: 'Skip tests (emergency deployments only)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: mycelix-testnet
  REGISTRY: ghcr.io
  RUST_VERSION: '1.75'

jobs:
  # ====================
  # Build and Test
  # ====================
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      validator_changed: ${{ steps.changes.outputs.validator }}
      fl_changed: ${{ steps.changes.outputs.fl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            validator:
              - 'libs/rb-bft-consensus/**'
              - 'libs/feldman-dkg/**'
              - 'deployment/kubernetes/validator-deployment.yaml'
            fl:
              - 'libs/fl-aggregator/**'
              - 'libs/kvector-zkp/**'
              - 'libs/matl-bridge/**'
              - 'deployment/kubernetes/fl-node-deployment.yaml'

      - name: Generate version
        id: version
        run: |
          VERSION="v1.0.0-testnet.$(date +%Y%m%d).${GITHUB_SHA::8}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            libs -> target
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: libs

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: libs

      - name: Run tests
        run: cargo test --workspace --all-features
        working-directory: libs
        env:
          RUST_BACKTRACE: 1

      - name: Run security audit
        run: cargo audit
        working-directory: libs

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: libs/
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ====================
  # Build Container Images
  # ====================
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - name: validator
            context: .
            dockerfile: deployment/docker/Dockerfile.validator
          - name: fl-aggregator
            context: .
            dockerfile: deployment/docker/Dockerfile.fl-aggregator
          - name: fl-coordinator
            context: .
            dockerfile: deployment/docker/Dockerfile.fl-coordinator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/mycelix/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.build-test.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.build-test.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Sign image with Sigstore
        uses: sigstore/cosign-installer@v3

      - name: Sign the container image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/mycelix/${{ matrix.name }}:${{ needs.build-test.outputs.version }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # ====================
  # Deploy to Testnet
  # ====================
  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [build-test, build-images]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    environment:
      name: testnet
      url: https://api.testnet.mycelix.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Update image tags in Kustomization
        run: |
          cd deployment/kubernetes
          kustomize edit set image \
            ghcr.io/mycelix/validator=ghcr.io/mycelix/validator:${{ needs.build-test.outputs.version }} \
            ghcr.io/mycelix/fl-aggregator=ghcr.io/mycelix/fl-aggregator:${{ needs.build-test.outputs.version }} \
            ghcr.io/mycelix/fl-coordinator=ghcr.io/mycelix/fl-coordinator:${{ needs.build-test.outputs.version }}

      - name: Deploy to Kubernetes
        run: |
          cd deployment/kubernetes
          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          echo "Waiting for validator rollout..."
          kubectl rollout status statefulset/validator -n mycelix-validators --timeout=300s

          echo "Waiting for FL aggregator rollout..."
          kubectl rollout status deployment/fl-aggregator -n mycelix-fl --timeout=300s

          echo "Waiting for FL coordinator rollout..."
          kubectl rollout status deployment/fl-coordinator -n mycelix-fl --timeout=300s

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30

          # Test validator health
          VALIDATOR_POD=$(kubectl get pod -n mycelix-validators -l app.kubernetes.io/name=validator -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n mycelix-validators $VALIDATOR_POD -- curl -sf http://localhost:8080/health/ready

          # Test FL aggregator health
          FL_POD=$(kubectl get pod -n mycelix-fl -l app.kubernetes.io/name=fl-aggregator -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n mycelix-fl $FL_POD -- curl -sf http://localhost:8082/health/ready

          echo "Smoke tests passed!"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Testnet deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Testnet Deployment Successful* :white_check_mark:\n\nVersion: `${{ needs.build-test.outputs.version }}`\nCommit: `${{ github.sha }}`\nTriggered by: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Testnet deployment FAILED",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Testnet Deployment FAILED* :x:\n\nVersion: `${{ needs.build-test.outputs.version }}`\nCommit: `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ====================
  # Rollback (Manual)
  # ====================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment: testnet

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Rollback deployments
        run: |
          COMPONENT="${{ github.event.inputs.component }}"

          if [[ "$COMPONENT" == "all" || "$COMPONENT" == "validators" ]]; then
            echo "Rolling back validators..."
            kubectl rollout undo statefulset/validator -n mycelix-validators
          fi

          if [[ "$COMPONENT" == "all" || "$COMPONENT" == "fl" ]]; then
            echo "Rolling back FL components..."
            kubectl rollout undo deployment/fl-aggregator -n mycelix-fl
            kubectl rollout undo deployment/fl-coordinator -n mycelix-fl
          fi

      - name: Wait for rollback
        run: |
          COMPONENT="${{ github.event.inputs.component }}"

          if [[ "$COMPONENT" == "all" || "$COMPONENT" == "validators" ]]; then
            kubectl rollout status statefulset/validator -n mycelix-validators --timeout=300s
          fi

          if [[ "$COMPONENT" == "all" || "$COMPONENT" == "fl" ]]; then
            kubectl rollout status deployment/fl-aggregator -n mycelix-fl --timeout=300s
            kubectl rollout status deployment/fl-coordinator -n mycelix-fl --timeout=300s
          fi

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Testnet rollback completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Testnet Rollback Completed* :rewind:\n\nComponent: `${{ github.event.inputs.component }}`\nTriggered by: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ====================
  # Status Check (Manual)
  # ====================
  status:
    name: Check Deployment Status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'status'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Show deployment status
        run: |
          echo "=== Validators ==="
          kubectl get pods -n mycelix-validators -o wide

          echo ""
          echo "=== FL Components ==="
          kubectl get pods -n mycelix-fl -o wide

          echo ""
          echo "=== Services ==="
          kubectl get svc -n mycelix-validators
          kubectl get svc -n mycelix-fl

          echo ""
          echo "=== HPA Status ==="
          kubectl get hpa -n mycelix-fl

          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n mycelix-validators --sort-by='.lastTimestamp' | tail -20
          kubectl get events -n mycelix-fl --sort-by='.lastTimestamp' | tail -20
