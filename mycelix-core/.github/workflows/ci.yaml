name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cachix (optional)
        uses: cachix/cachix-action@v13
        if: secrets.CACHIX_AUTH_TOKEN != ''
        with:
          name: zerotrustml
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run tests inside flake shell
        run: |
          nix develop --command bash -lc '
            poetry install --with dev &&
            anvil --version &&
            poetry run python -m pytest \
              0TML/tests/test_committee_votes.py \
              0TML/tests/test_edge_validation_flow.py \
              0TML/tests/test_holochain_backend_edge_proof.py \
              0TML/tests/test_ethereum_backend_local.py \
              0TML/tests/test_polygon_attestation.py
          '

      - name: Run edge integration script
        run: |
          nix develop --command bash -lc '
            poetry install --with dev &&
            poetry run python scripts/run_edge_proof_integration.py
          '
