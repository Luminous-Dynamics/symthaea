name: FL Aggregator Proofs

on:
  push:
    branches: ["main", "develop"]
    paths:
      - 'libs/fl-aggregator/**'
      - '.github/workflows/fl-aggregator-proofs.yml'
  pull_request:
    paths:
      - 'libs/fl-aggregator/**'
      - '.github/workflows/fl-aggregator-proofs.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/fl-aggregator

      - name: Run tests (proofs feature)
        working-directory: libs/fl-aggregator
        run: cargo test --features proofs

      - name: Run tests (all features)
        working-directory: libs/fl-aggregator
        run: cargo test --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/fl-aggregator

      - name: Clippy (proofs feature)
        working-directory: libs/fl-aggregator
        run: cargo clippy --features proofs -- -D warnings

      - name: Clippy (all features)
        working-directory: libs/fl-aggregator
        run: cargo clippy --all-features -- -D warnings

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: libs/fl-aggregator
        run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/fl-aggregator

      - name: Build documentation
        working-directory: libs/fl-aggregator
        run: cargo doc --features proofs --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/fl-aggregator

      - name: Run proof benchmarks
        working-directory: libs/fl-aggregator
        run: cargo bench --features proofs --bench proof_bench -- --noplot --warm-up-time 1 --measurement-time 3

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: proof-benchmarks
          path: libs/fl-aggregator/target/criterion

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          working-directory: libs/fl-aggregator
