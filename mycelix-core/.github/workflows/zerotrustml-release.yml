name: ZeroTrustML Release

on:
  push:
    tags:
      - 'zerotrustml-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PACKAGE_NAME: zerotrustml-core

jobs:
  # Build wheels for Linux x86_64
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            zerotrustml-core
          sparse-checkout-cone-mode: false

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          sccache: 'true'
          manylinux: auto
          working-directory: zerotrustml-core

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: zerotrustml-core/dist

  # Build wheels for Linux aarch64 (cross-compiled)
  # Note: This is optional - users on aarch64 can install from sdist
  linux-aarch64:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            zerotrustml-core
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_CROSS_PYTHON_VERSION: '3.12'
        with:
          target: aarch64-unknown-linux-gnu
          args: --release --out dist
          sccache: 'true'
          manylinux: auto
          working-directory: zerotrustml-core

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: zerotrustml-core/dist

  # Build wheels for macOS
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            zerotrustml-core
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}-apple-darwin
          args: --release --out dist
          sccache: 'true'
          working-directory: zerotrustml-core

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: zerotrustml-core/dist

  # Build wheels for Windows
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            zerotrustml-core
          sparse-checkout-cone-mode: false

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist
          sccache: 'true'
          working-directory: zerotrustml-core

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: zerotrustml-core/dist

  # Build source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Note: sdist requires full checkout for cargo to list files

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: zerotrustml-core

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: zerotrustml-core/dist

  # Publish to PyPI
  release:
    name: Release
    runs-on: ubuntu-latest
    # Note: linux-aarch64 is optional - users can install from source (sdist)
    needs: [linux-x86_64, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/zerotrustml-v') || github.event.inputs.dry_run == 'false'
    environment:
      name: pypi
      url: https://pypi.org/p/zerotrustml-core
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -la dist/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/zerotrustml-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish to TestPyPI (dry run)
        if: github.event.inputs.dry_run == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
