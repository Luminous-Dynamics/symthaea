[package]
name = "symtropy-mycelix-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Bevy plugin: NPCs and game systems call Mycelix Holochain zomes by spawning mycelix-conductor-bridge as a subprocess and piping JSON. Zero Holochain deps in-crate — no serde conflicts with Bevy."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "holochain", "mycelix", "governance", "simulation"]
categories = ["game-engines", "simulation"]

# Architectural note: Holochain's dep graph locks serde=1.0.203 exactly;
# Bevy 0.18 needs serde_core >=1.0.221. These cannot co-exist in one
# Rust compilation unit. Solution: run the Holochain client in a
# separate process (mycelix-conductor-bridge) and talk to it via JSON
# over stdin/stdout. This crate has zero Holochain deps.
#
# This crate CAN be part of the symtropy workspace (no serde conflict)
# but lives at top-level for cohesion with mycelix-conductor-bridge.

[dependencies]
# Bevy — minimal feature set for a headless backend plugin. No wayland/x11
# because we don't open windows; the user's app will pull those in if needed.
bevy = { version = "0.18", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_log",
    "bevy_state",
    "multi_threaded",
] }

# Async/ECS bridge.
bevy-tokio-tasks = "0.18"

# Channels between Bevy main thread and tokio background task.
flume = "0.11"

# Async runtime — process, io-util for BufRead on ChildStdout.
tokio = { version = "1", features = [
    "process",
    "io-util",
    "sync",
    "time",
    "rt-multi-thread",
    "macros",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
