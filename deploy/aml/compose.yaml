services:
  broca:
    build:
      context: ../..
      dockerfile: deploy/aml/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AML_BIND: "0.0.0.0:8080"
      AML_DB_PATH: "/var/lib/symthaea-aml/aml.sqlite"
      AML_PAYLOAD_ROOT: "/var/lib/symthaea-aml/payloads"
      AML_MAX_BODY_BYTES: "8388608"
      AML_MAX_CONCURRENCY: "16"
    expose:
      - "8080"
    volumes:
      - aml-data:/var/lib/symthaea-aml
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      AML_DOMAIN: "\${AML_DOMAIN:?Set AML_DOMAIN in deploy/aml/.env}"
    depends_on:
      broca:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    init: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

volumes:
  aml-data:
  caddy-data:
  caddy-config:
