[package]
name = "sol-atlas-bevy"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bevy 0.19 plugin for Sol Atlas globe rendering"

[dependencies]
sol-atlas-core = { path = "../sol-atlas-core" }
mycelix-earth = { path = "../mycelix-earth" }
mycelix-desci-core = { path = "../mycelix-workspace/mycelix-desci/src/core" }
uuid = { version = "1", features = ["v4", "serde"] }
h3o = "0.10"

bevy_camera = "0.19"

bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_pbr", "bevy_light", "bevy_mesh", "bevy_camera",
    "bevy_shader", "bevy_post_process", "bevy_color",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_state", "bevy_winit", "bevy_log",
    "bevy_gizmos", "bevy_gizmos_render",
    "multi_threaded", "x11",
    "png", "jpeg",
] }
