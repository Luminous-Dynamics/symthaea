[package]
name = "broca-aml-adapter"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Provider-neutral Add/Search contract core for future Agent Memory Leaderboard evaluation"

[dependencies]
serde_json = { version = "1.0", features = ["raw_value"] }
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.10"
ed25519-dalek = "=2.1.0"
redb = "=5.0.0"
