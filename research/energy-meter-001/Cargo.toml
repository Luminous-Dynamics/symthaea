[package]
name = "symthaea-energy-meter-verification"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
nvml-wrapper = { version = "=0.10.0", optional = true }

[features]
nvml = ["dep:nvml-wrapper"]
