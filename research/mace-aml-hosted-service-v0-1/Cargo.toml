[package]
name = "mace-aml-hosted-service"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "First durable Rust Add/Search runtime slice for MACE's future AML adapter"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "net", "signal"] }
uuid = { version = "1.6", features = ["v4"] }
