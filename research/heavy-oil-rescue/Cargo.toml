[package]
name = "heavy-oil-rescue-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Synthetic-first, offline Rust benchmark for evidence-bounded feedstock economics"

# Isolate this research crate from the repository-wide workspace on purpose.
[workspace]
resolver = "2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "heavy-oil-rescue-bench"
path = "src/main.rs"

[dependencies]
