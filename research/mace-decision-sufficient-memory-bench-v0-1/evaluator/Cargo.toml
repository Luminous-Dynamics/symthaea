[package]
name = "mace-dsm-evaluator"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Paired counterfactual scoring core and fail-closed JSONL runner for MACE Decision-Sufficient Memory"

[lib]
path = "src/lib.rs"

[features]
default = []
cli = ["dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }

[[bin]]
name = "mace_dsm_reference"
path = "src/bin/mace_dsm_reference.rs"
required-features = ["cli"]
