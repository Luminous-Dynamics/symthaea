[package]
name = "melothaea-scene-grouping"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Permutation-invariant auditory scene grouping evaluator"

[workspace]
members = ["."]
resolver = "2"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
