# Experiment 1, Arm B: Education Boost
# Higher education level (+0.2), but no coordination understanding.
# Tests whether "smarter agents" is sufficient vs coordination-specific knowledge.

[simulation]
years = 150
seed = 42

[policy]
birth_policy = "Natural"
project_strategy = "Balanced"
resource_priority = "Balanced"
trade_openness = 0.8
defense_spending = 0.05
exploration_investment = 0.05
trust_weighted_governance = true
disasters_enabled = true

# Experiment controls
coordination_understanding_initial = 0.0
education_boost = 0.2
