# =============================================================================
# A/B TEST: Consciousness-Gated Governance vs Equal Voting
# =============================================================================
#
# This scenario tests the core hypothesis: does consciousness-weighted voting
# produce better civilizational outcomes than equal-weight voting?
#
# Run both arms with the same seed to compare:
#   cargo run --bin luminous_sim -- --config scenarios/consciousness_ab_test.toml
#
# Published result: +6.9% CVS improvement with consciousness gating.
# This config lets you verify that claim yourself.
# =============================================================================

[meta]
name = "Consciousness Gating A/B Test"
description = "Compare trust-weighted governance (consciousness-gated) vs equal voting"
citation = "Internal validation: 5 seeds × 150 years, mean ΔCVS = +6.9%"

[simulation]
years = 150
seed = 42

[policy]
# ARM A (default): Consciousness-gated governance
trust_weighted_governance = true
# All other defaults apply
disasters_enabled = true
hybrid_earth = false

[feedback_loops]
# All feedback loops enabled for fair comparison
disaster_trauma = true
harmony_policy = true
affect_behavior = true
consciousness_governance = true
cultural_memory = true

# =============================================================================
# To run ARM B (control): Copy this file and change:
#   trust_weighted_governance = false
#
# Compare the CVS, survival rate, faction count, and harmony scores
# between the two arms.
#
# HONEST WARNING: This A/B test is simulated, not real-world.
# The +6.9% result should be interpreted as "within this model's assumptions,
# consciousness-gated governance outperforms equal voting." Whether this
# would hold in real human communities is UNKNOWN.
# =============================================================================
