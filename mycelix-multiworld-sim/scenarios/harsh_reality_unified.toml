# =============================================================================
# HARSH REALITY SCENARIO
# =============================================================================
#
# Pessimistic assumptions: higher spoilage, lower EROI, more disasters.
# Tests civilizational resilience under worst-case conditions.
#
# Use with: cargo run --bin luminous_sim -- --config scenarios/harsh_reality_unified.toml
# =============================================================================

[meta]
name = "Harsh Reality"
description = "Pessimistic assumptions — tests civilizational resilience"

[simulation]
years = 300
seed = 42

[policy]
trust_weighted_governance = true
turchin_cycles_enabled = true
fep_immiseration_enabled = true
sacred_stillness_enabled = true
disasters_enabled = true
hybrid_earth = true
trade_openness = 0.5        # Restricted trade
defense_spending = 0.10     # Higher defense burden
birth_policy = "Natural"
project_strategy = "SurvivalFirst"

[params]
# Harsher psychology
stress_baseline = 0.006     # 50% higher baseline stress
stress_isolation = 0.012    # 50% higher isolation stress
burnout_threshold = 0.7     # Lower burnout threshold

# Harsher radiation
radiation_mars_sv_month = 0.025   # 25% higher than default

# Harsher spoilage
spoilage_food = 0.05        # 67% higher food spoilage
spoilage_energy = 0.20      # 33% higher energy loss
spoilage_water = 0.01       # Double water spoilage

[feedback_loops]
disaster_trauma = true
collective_memory = true    # Even harsh reality benefits from learning
gcr_effects = true
harmony_policy = true
affect_behavior = true
consciousness_governance = true
cultural_memory = true
