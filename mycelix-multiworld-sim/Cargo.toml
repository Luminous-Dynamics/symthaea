[package]
name = "mycelix-multiworld-sim"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "150-year multi-world civilization simulator for autonomous planetary infrastructure"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
petgraph = { version = "0.7", features = ["serde-1"] }
mycelix-bridge-common = { path = "../crates/mycelix-bridge-common", default-features = false, features = ["model-governance", "interplanetary"] }
luminous-sim-core = { path = "../crates/luminous-sim-core" }
anyhow = "1.0"
mycelix-desci-core = { path = "../mycelix-desci/src/core" }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = "1"
