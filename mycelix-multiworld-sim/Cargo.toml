[package]
name = "mycelix-multiworld-sim"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "150-year multi-world civilization simulator for autonomous planetary infrastructure"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
petgraph = { version = "0.7", features = ["serde-1"] }
mycelix-bridge-common = { path = "../crates/mycelix-bridge-common", default-features = false, features = ["model-governance", "interplanetary", "federated"] }
luminous-sim-core = { path = "../crates/luminous-sim-core" }

[dev-dependencies]
proptest = "1"
