[package]
name = "multiworld-sim-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "WASM build of the civilization simulator for browser-based interactive exploration"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mycelix-multiworld-sim = { path = ".." }
luminous-sim-core = { path = "../../crates/luminous-sim-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false    # Disable wasm-opt (version mismatch on NixOS)

[profile.release]
opt-level = "s"     # Optimize for size
lto = true
codegen-units = 1
