# Technology Tree for Mycelix Multiworld Simulator
#
# Each milestone has:
#   earliest_tick / latest_tick — window when it can first/last occur
#   base_probability — monthly probability of achievement (when prerequisites met)
#   prerequisite_sectors — [[sector_id, min_level], ...] required tech levels
#   prerequisite_milestones — other milestones that must be achieved first
#   effects — what unlocks when this milestone is achieved
#
# Sector IDs: 0=engineering, 1=agriculture, 2=medicine, 3=governance,
#             4=science, 5=education, 6=art, 7=logistics

[milestones.ntp_demonstration]
name = "NTP Demonstration"
earliest_tick = 24      # Year 2
latest_tick = 60        # Year 5
base_probability = 0.02 # 2%/month
prerequisite_sectors = [[0, 1.5]]  # Engineering >= 1.5
effects = { propulsion_unlock = true }

[milestones.fission_surface_power]
name = "Fission Surface Power"
earliest_tick = 36      # Year 3
latest_tick = 120       # Year 10
base_probability = 0.025
prerequisite_sectors = [[0, 1.5]]
effects = { power_multiplier = 2.0 }

[milestones.fusion_demo]
name = "Fusion Demo"
earliest_tick = 120     # Year 10
latest_tick = 240       # Year 20
base_probability = 0.004
prerequisite_sectors = [[0, 2.5], [4, 2.0]]
prerequisite_milestones = ["fission_surface_power"]
effects = { power_multiplier = 3.0 }

[milestones.fusion_grid]
name = "Fusion Grid Scale"
earliest_tick = 300     # Year 25
latest_tick = 600       # Year 50
base_probability = 0.0015
prerequisite_milestones = ["fusion_demo"]
effects = { power_multiplier = 5.0 }

[milestones.lcf_breakthrough]
name = "LCF Breakthrough"
earliest_tick = 480     # Year 40
latest_tick = 1200      # Year 100
base_probability = 0.005
prerequisite_sectors = [[0, 3.0], [4, 3.0]]
prerequisite_milestones = ["fusion_demo"]
effects = { power_multiplier = 10.0, propulsion_unlock = true }
# Note: When fusion_bridge is active, this probability is overridden
# by the Gamow rate calculation from spark-engine physics.

