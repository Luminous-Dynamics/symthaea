[package]
name = "mycelix-attribution-scan"
version = "0.1.0"
edition = "2021"
description = "Scans lockfiles and generates attribution data for the Mycelix DHT"

[[bin]]
name = "mycelix-attribution-scan"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
