[package]
name = "trust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "trust"

[dependencies]
hdk = "0.6"
serde = { version = "1.0", features = ["derive"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
trust_integrity = { path = "../integrity" }

[profile.release]
opt-level = 'z'
lto = true
