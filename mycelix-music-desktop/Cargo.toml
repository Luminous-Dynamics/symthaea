[package]
name = "mycelix-music-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Mycelix Music Desktop — consciousness instrument with native audio and GPU visualization"

[dependencies]
# Game engine — GPU rendering, ECS, window management
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_shader",
    "multi_threaded", "wayland",
    "default_font", "png",
] }

# Consciousness-driven synthesis engine (full features for desktop)
symthaea-muse = { path = "../symthaea/crates/symthaea-muse", features = ["muse-live"] }

# Native audio I/O
cpal = "0.17"
ringbuf = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
