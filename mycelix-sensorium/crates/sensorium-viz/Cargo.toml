[package]
name = "sensorium-viz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reactive SVG visualization components for Mycelix Sensorium — replaces D3.js/Recharts"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance"] }
