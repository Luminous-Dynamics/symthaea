<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#040A0C">
    <title>Mycelix Sensorium</title>
    <link data-trunk rel="css" href="style/main.css">
    <link data-trunk rel="rust" data-wasm-opt="z">
    <style>
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('https://fonts.gstatic.com/s/inter/v18/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa2JL7W0Q5n-wU.woff2') format('woff2');
        }
    </style>
</head>
<body>
    <noscript>Mycelix Sensorium requires JavaScript.</noscript>
    <script>
        // Holochain conductor probe
        window.__HC_STATUS = "connecting";
        (function() {
            const ws = new WebSocket("ws://localhost:8888");
            const timeout = setTimeout(() => { ws.close(); window.__HC_STATUS = "mock"; }, 3000);
            ws.onopen = () => { clearTimeout(timeout); ws.close(); window.__HC_STATUS = "connected"; };
            ws.onerror = () => { clearTimeout(timeout); window.__HC_STATUS = "mock"; };
        })();
    </script>
</body>
</html>
