[workspace]
members = [
    "crates/sensorium-domain-trait",
    "crates/sensorium-viz",
    "crates/domain-personal",
    "crates/domain-health",
    "crates/domain-governance",
    "crates/domain-commons",
    "crates/domain-finance",
    "crates/domain-praxis",
    "crates/domain-hearth",
    "crates/domain-knowledge",
    "crates/domain-lucid",
    "crates/domain-mail",
    "crates/domain-admin",
    "crates/sensorium-inference",
    "crates/sensorium-games",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[package]
name = "mycelix-sensorium"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Mycelix Sensorium — unified interface for all clusters"

# The binary is the Sensorium shell
[[bin]]
name = "mycelix-sensorium"
path = "crates/sensorium-shell/src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# No router — the orb doesn't navigate, it zooms
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "HtmlCanvasElement", "HtmlInputElement",
    "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
    "WebGlUniformLocation", "EventTarget", "Navigator", "Storage", "Location",
    "Performance", "Crypto",
    "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "HtmlTextAreaElement", "HtmlSelectElement",
    "CanvasRenderingContext2d", "WebSocket", "MessageEvent", "BinaryType",
] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
sha2 = "0.10"
hmac = "0.12"
sensorium-domain-trait = { path = "crates/sensorium-domain-trait" }
sensorium-viz = { path = "crates/sensorium-viz" }
sensorium-games = { path = "crates/sensorium-games" }
personal-leptos-types = { path = "../mycelix-personal/crates/personal-leptos-types" }
governance-leptos-types = { path = "../mycelix-governance/crates/governance-leptos-types" }
domain-personal = { path = "crates/domain-personal", optional = true }
domain-health = { path = "crates/domain-health", optional = true }
domain-governance = { path = "crates/domain-governance", optional = true }
domain-commons = { path = "crates/domain-commons", optional = true }
domain-finance = { path = "crates/domain-finance", optional = true }
domain-praxis = { path = "crates/domain-praxis", optional = true }
domain-hearth = { path = "crates/domain-hearth", optional = true }
domain-knowledge = { path = "crates/domain-knowledge", optional = true }
domain-lucid = { path = "crates/domain-lucid", optional = true }
domain-mail = { path = "crates/domain-mail", optional = true }
domain-admin = { path = "crates/domain-admin", optional = true }
mycelix-leptos-client = { path = "../crates/mycelix-leptos-client", features = ["browser"] }
mycelix-leptos-core = { path = "../crates/mycelix-leptos-core" }
send_wrapper = "0.6"

[dev-dependencies]
rmp-serde = "1"

[features]
default = ["personal", "health", "governance", "commons", "finance", "praxis", "hearth", "knowledge", "lucid", "mail", "admin"]
personal = ["dep:domain-personal"]
health = ["dep:domain-health"]
governance = ["dep:domain-governance"]
commons = ["dep:domain-commons"]
finance = ["dep:domain-finance"]
praxis = ["dep:domain-praxis"]
hearth = ["dep:domain-hearth"]
knowledge = ["dep:domain-knowledge"]
lucid = ["dep:domain-lucid"]
mail = ["dep:domain-mail"]
admin = ["dep:domain-admin"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
