[workspace]
resolver = "2"
members = [
    "lib/positioning",
    "zomes/shared",
    "dna/zomes/anchor_registry/integrity",
    "dna/zomes/anchor_registry/coordinator",
    "dna/zomes/ranging/integrity",
    "dna/zomes/ranging/coordinator",
    "dna/zomes/position_estimates/integrity",
    "dna/zomes/position_estimates/coordinator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
hdk = "0.6.0"
hdi = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
holochain_serialized_bytes = "0.0.56"
getrandom_03 = { package = "getrandom", version = "0.3" }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
