# Crate truth registry
#
# ============================================================================
#  A CRATE'S EXISTENCE DOES NOT IMPLY ENDORSEMENT.
# ============================================================================
#
# This workspace has ~200 packages. Their presence says nothing about whether any given one is
# current, validated, safe to compose, or safe to put on a production path. This file records the
# judgements that cannot be derived from the code; the inventory itself is derived from
# `cargo metadata` and is never hand-maintained here.
#
#   cargo xtask crate-status --check     # integrity + coverage
#   cargo xtask crate-status --report    # generated markdown inventory
#
# ---------------------------------------------------------------------------
# Evidence ladder — what has been DEMONSTRATED, not how carefully it was built
# ---------------------------------------------------------------------------
#   E0  compiles / structurally exists
#   E1  internal unit invariants
#   E2  independent known-answer or reference comparison
#   E3  controlled ablation with positive and negative controls
#   E4  external dataset or simulator validation
#   E5  prospective real-world validation
#
# State the level ACHIEVED, never the level aspired to. `evidence_note` is mandatory: an
# evidence level with no stated basis is an assertion, not a record.
#
# ---------------------------------------------------------------------------
# On the emptiness of this file
# ---------------------------------------------------------------------------
# Only crates somebody has actually assessed appear below. Everything else is reported as
# `unclassified`, which is an honest statement that nobody has checked — materially different
# from, and better than, a fabricated `E1` across 200 entries. The unclassified count is printed
# on every run precisely so it stays visible and can be driven down deliberately.
#
# Seeded 2026-07-29 from the correctness-gate work unit (commits 3714f7a80b, 45608834f9,
# 75ef598452). Six crates classified; the rest await assessment.

[meta]
schema_version = 1

