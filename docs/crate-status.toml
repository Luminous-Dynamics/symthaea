[crates.symthaea-futures-core]
lifecycle = "active-research"
evidence = "E1"
evidence_note = """
18 tests covering the validation contract, with genuine negative controls: every malformed
forecast shape (negative / >1 / NaN / infinite probability, inverted or nonfinite interval,
negative unsupported mass, empty distribution, unnormalized mass, duplicate and overlapping
regions) is asserted to produce a typed error, and the serde path is asserted not to bypass the
constructor. Positive controls confirm valid forecasts still construct and round-trip with an
unchanged wire format. Deliberately NOT E2: the pre-fix score table these tests were derived
from was measured by this project against its own scorers, not against an independent reference
implementation.
"""
last_verified_commit = "3714f7a80b"
api_stability = "unstable"
