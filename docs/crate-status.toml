# ---------------------------------------------------------------------------
# Core substrate
# ---------------------------------------------------------------------------

[crates.symthaea-core]
# `foundation` records how this crate is USED (~125 manifests depend on it), not the maturity of
# its contents. Setting it to `active-research` would describe the code more flatteringly and
# silence a finding that is true: the workspace leans on this crate as substrate without
# foundation-grade evidence for it. The registry should surface that tension, not resolve it by
# relabelling.
lifecycle = "foundation"
evidence = "E1"
evidence_note = """
NOT HONESTLY CLASSIFIABLE AS A UNIT — that is itself the finding. ~371K lines across 471 source
files (295K in `hdc/` alone) spanning stable primitives, consciousness metrics, physics,
symbolic regression, SIMD kernels and unrelated investigations, with ~125 manifests referencing
it. A single evidence level cannot be true of all of it.

`E1` is the floor that is defensible workspace-wide (5,165 lib tests). Individual subsystems
sit both above and below it: `consciousness_metrics::SpectralMIPFinder` has a validated
correlation against exhaustive search over the same Gaussian-MI proxy (E2 for that claim, and
NOT against canonical TPM-based IIT), while `hdc_treasury`'s privacy claims are unbacked by real
crypto per its own dependencies' deprecation notices.

Directly verified at this commit: `hdc::eml_regressor` (3/3, unsafe generic dispatch removed —
zero `unsafe`, zero `TypeId` remain) and `rt` (9/9, memory-lock failure now detectable). The
other ~5,150 tests were not run start to finish in that work unit.

Both findings this entry trips are real and correctly reported: it gates motor safety at E1,
and it is depended on as foundation without E2. Extraction of stable seams is the intended
resolution — not a higher number in this file.
"""
last_verified_commit = "75ef598452"
api_stability = "unstable"
safety_criticality = "high"
production_allowed = false
ci_lane = "default"
external_validation = ""
consolidation_target = ""

