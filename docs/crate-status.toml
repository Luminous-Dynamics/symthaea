# ---------------------------------------------------------------------------
# Adjudicated name collisions  (`cargo xtask duplicate-scan`)
# ---------------------------------------------------------------------------
# A collision between a symthaea-core module and a same-named crate is a QUESTION.
# The 2026-07-29 audit measured this heuristic at ~22% precision: of nine suspected
# pairs, SEVEN were never migrations. Recorded here so each is decided once, and so
# a genuinely NEW collision fails CI instead of blending into the noise.

[known_name_collisions.statistics]
disposition = "independent-same-domain"
note = """
Two substantial parallel implementations, ~2,066 vs ~2,143 lines, only 6 shared public symbols.
NOT interchangeable: core's `variance`/`std_dev` are POPULATION estimators, the crate's are
SAMPLE estimators — a mechanical swap silently flips /n to /(n-1) with no compile error. The
crate also holds exact Student's-t and chi-squared CDFs plus the PPV/base-rate layer the live
StatisticsDomainPlugin depends on.
"""

[known_name_collisions.graph_theory]
disposition = "independent-same-domain"
note = """
Core wins on capability and adoption: 3 live consumers, weighted edges, Dijkstra, the
Laplacian/spectral suite, and `Graph::encode() -> BinaryHV` (HDC integration the crate cannot
host under the pure-std domain-crate charter). 25 tests vs 8; the crate has zero consumers.
Named as the low-risk migration candidate. HAZARD if merged: `Graph::bfs(&self, usize)` exists on
both sides with an IDENTICAL signature and different meaning — core returns per-node distances
(length n, usize::MAX sentinel), the crate returns traversal order. A mechanical import rewrite
compiles clean and is silently wrong.
"""

[known_name_collisions.combinatorics]
disposition = "independent-same-domain"
note = """
Least settled of the set. Core and crate share a VERBATIM comment line
(`let k = k.min(n - k); // symmetry: C(n,k) = C(n,n-k)`) and a structurally identical
multiplicative loop, so a reviewer could reasonably call `combinations` specifically a fork.
The crate does hold real capability core lacks: exact u128 arithmetic where core silently
saturates in u64.
"""

[known_name_collisions.complex]
disposition = "independent-same-domain"
note = """
Zero dependents, one lifetime commit, and the delta over core is roughly one ~5-line function —
so it is close to retirable. Held back deliberately: its `roots_of_unity`/FFT would be the only
FFT available to the pure-std domain-crate charter, since core's superset `hdc/fft.rs` requires
linking symthaea-core. That is a forward-looking design question, not a closable one.
"""

[known_name_collisions.game_theory]
disposition = "independent-same-domain"
note = """
The inverse error to `projection`, and worth keeping as the counterexample: the two share exactly
ONE identifier (`new`) yet implement the same abstraction. Judge duplicates by abstraction, not by
identifier overlap — the mistake runs in both directions. Neither side has consumers. The crate
holds a general-sum `mixed_nash_2x2` core lacks.
"""

[known_name_collisions.projection]
disposition = "homonym"
note = """
NOT a duplicate in any sense — a pure homonym. Core implements trainable linear maps between HDC
dimensionalities (`LearnedProjection` with Adam, `RandomProjection` with Johnson-Lindenstrauss).
The crate is a serde/chrono DTO for rendering telemetry as 2.5D visualisations. Zero shared
symbols in either direction, zero shared dependencies, and the crate does not depend on
symthaea-core at all.
"""

[known_name_collisions.consciousness_topology]
disposition = "false-pair"
note = """
The crate IS a successful extraction — of a DIFFERENT file (`src/consciousness/
consciousness_topology.rs`, 97% rename in f53ccac34e, facade left behind). The same-named core
module is a SIBLING that has coexisted since 2026-02-05 and survived that extraction untouched;
the two never shared a blob. Production binds neither: `topological_measure` uses
symthaea-hodge's own implementation. See CONSCIOUSNESS_TOPOLOGY notes in the 2026-07-29 audit.
"""

[known_name_collisions.hdc_crypto]
disposition = "retired"
note = """
Genuine duplicate, resolved. The standalone crate was an extraction that COPIED rather than moved
(commit 9baa58af21: 4,647 insertions, 0 deletions) and sat at zero dependents while the in-core
original kept every consumer. Retired on the `retire/hdc-crypto-2026-07-30` branch, with its
`insecure-experimental-crypto` feature gate ported to symthaea-core — the gate had been on the
copy nobody used. Remove this entry once that branch merges and the collision disappears.
"""

[known_name_collisions.physics]
disposition = "undecided"
note = """
FOUND BY THIS CHECK 2026-07-30, not by the earlier audit — the manual census scanned only
`src/*.rs` and `src/hdc/*.rs` and missed directory modules, so this pair was never examined.
Recorded as UNDECIDED rather than assigned a disposition I have not earned: nobody has compared
`symthaea-core`'s `physics` module against the `symthaea-physics` crate. Adjudicate before
treating either as canonical.
"""

[known_name_collisions.observability]
disposition = "undecided"
note = """
FOUND BY THIS CHECK 2026-07-30, same blind spot as `physics` above — a directory module the
manual census did not reach. Never audited. UNDECIDED is the honest value; do not read it as
"benign".
"""
