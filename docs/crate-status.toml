[crates.symthaea-hdc-ltc]
lifecycle = "archived"
evidence = "E1"
evidence_note = """
ORPHANED EXTRACTION — recorded so it is not rediscovered a third time. Created by commit
`9baa58af21` ("extract symthaea-hdc-crypto + symthaea-hdc-ltc as independent crates"). The crate
itself is clean: 2,660 lines, standalone, depends only on serde + rand, its own `ContinuousHV`
and `HDC_DIMENSION`, its own tests.

What did not happen was the migration. The in-core original (`symthaea-core/src/hdc/
hdc_ltc_unified.rs`, 103,710 bytes) was left in place, kept being developed through 2026-07-18,
and is what 86 crates actually use. This crate has ONE dependent (`symthaea-probe-stream`).

The two have since diverged: of 58 public functions in-core and 45 here, only 16 names are
shared. NOT a drop-in replacement — adopting it is a porting job.

`archived` is a statement about its role, not its quality. Its fate is an open decision: adopt it
as the migration target and delete the in-core copy, or retire it. Leaving both is the status quo
that produced this entry.
"""
last_verified_commit = "4ef3a4e19d"
api_stability = "unstable"
safety_criticality = "none"
production_allowed = false
ci_lane = "default"
external_validation = ""
