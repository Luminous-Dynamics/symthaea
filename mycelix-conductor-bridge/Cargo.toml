[package]
name = "mycelix-conductor-bridge"
version = "0.1.0"
edition = "2021"
description = "Standalone CLI bridge: reads governance commands from stdin (JSON) and dispatches them to a live Holochain conductor"

# NOT part of the symthaea workspace — avoids serde version conflict with holochain_client.
# Build with: cargo build   (from this directory)

[dependencies]
holochain_client = "=0.6.0"
holochain_types = "=0.4.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
