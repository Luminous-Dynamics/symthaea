[package]
name = "symtropy-exoskeleton-demo"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Consciousness-gated full-frame exoskeleton demo — Φ selects AssistanceMode (Predictive → GravityCompensation)"

[workspace]

[[bin]]
name = "exoskeleton-demo"
path = "src/main.rs"

[dependencies]
symthaea-exoskeleton = { path = "../../../symthaea/crates/domains/symthaea-exoskeleton" }
symthaea-core = { path = "../../../symthaea-core" }

symtropy-robotics-bridge = { path = "../symtropy-robotics-bridge" }
symtropy-consciousness-physics = { path = "../symtropy-consciousness-physics" }
symtropy-physics = { path = "../symtropy-physics" }
symtropy-demo-capture = { path = "../symtropy-demo-capture" }

bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_pbr",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_mesh",
    "multi_threaded", "x11",
    "default_font",
] }

[lints.clippy]
all = "warn"
