[package]
name = "symtropy-web-gallery"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_asset", "bevy_core_pipeline", "bevy_render", "bevy_sprite", "bevy_sprite_render", "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_winit", "bevy_color", "bevy_state", "bevy_log", "webgl2"] }
wasm-bindgen = "0.2"
symtropy-bevy = { path = "../symtropy-bevy" }
symtropy-physics = { path = "../core/symtropy-physics" }
symtropy-math = { path = "../core/symtropy-math" }
