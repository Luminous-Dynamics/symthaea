[package]
name = "symtropy-net"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Decentralized P2P state sync via Holochain DHT for Symtropy"

[features]
default = []
webrtc = []
logging = []

[dependencies]
symtropy-net-core = { path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-net-core" }
symtropy-math = { path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-math" }
symtropy-physics = { path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-physics" }
symtropy-holochain-relay = { path = "/srv/luminous-dynamics/symtropy/crates/bridges/symtropy-holochain-relay" }
nalgebra = "0.34"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }
