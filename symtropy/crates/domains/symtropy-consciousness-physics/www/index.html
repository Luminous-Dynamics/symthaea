<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symtropy — Consciousness-Physics Research Demo</title>
<style>
  :root { --bg: #1a1a2e; --panel: #16213e; --accent: #0f3460; --text: #e0e0e0; --phi: #00d4ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 320px; background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; border-right: 1px solid var(--accent); }
  #sidebar h1 { font-size: 18px; color: var(--phi); letter-spacing: 1px; }
  #sidebar h2 { font-size: 13px; color: #888; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .control { display: flex; flex-direction: column; gap: 4px; }
  .control label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
  .control label span { color: var(--phi); font-weight: bold; font-family: monospace; }
  input[type=range] { width: 100%; accent-color: var(--phi); }
  .toggle { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--phi); }
  .toggle label { font-size: 13px; cursor: pointer; }
  #stats { background: var(--accent); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; line-height: 1.8; }
  #stats .val { color: var(--phi); }
  #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  canvas { background: #0d1117; border-radius: 8px; }
  #legend { position: absolute; bottom: 16px; right: 16px; background: rgba(22,33,62,0.9); padding: 10px 14px; border-radius: 8px; font-size: 11px; line-height: 1.8; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--phi); }
  button { background: var(--accent); color: var(--text); border: 1px solid #335; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:hover { background: #1a4a80; }
  button.active { background: #e53935; border-color: #e53935; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>SYMTROPY</h1>
  <p style="font-size:11px; color:#666;">Consciousness-Physics Research Demo</p>

  <h2>Bifurcation Control</h2>
  <div class="control">
    <label>Phi-gravity (k): <span id="k-val">0.30</span></label>
    <input type="range" id="k-slider" min="0" max="1.5" step="0.01" value="0.30">
  </div>

  <h2>Consciousness</h2>
  <div class="toggle">
    <input type="checkbox" id="consciousness-toggle" checked>
    <label for="consciousness-toggle">Consciousness enabled (Phi > 0)</label>
  </div>

  <h2>Emotional Stimulus</h2>
  <div class="control">
    <label>Inject to agent 0: <span id="emo-val">0.00</span></label>
    <input type="range" id="emo-slider" min="0" max="1" step="0.01" value="0">
  </div>

  <h2>Simulation</h2>
  <div class="control">
    <label>Agents: <span id="n-val">12</span></label>
    <input type="range" id="n-slider" min="2" max="32" step="1" value="12">
  </div>
  <button id="reset-btn">Reset Simulation</button>

  <h2>Telemetry</h2>
  <div id="stats">
    Tick: <span class="val" id="s-tick">0</span><br>
    Collective Phi: <span class="val" id="s-phi">0.000</span><br>
    Mean speed: <span class="val" id="s-speed">0.00</span><br>
    Clustering: <span class="val" id="s-cluster">—</span><br>
    FPS: <span class="val" id="s-fps">0</span>
  </div>
</div>

<div id="canvas-wrap">
  <div id="loading">Loading WASM...</div>
  <canvas id="canvas" width="700" height="700"></canvas>
  <div id="legend">
    <span class="dot" style="background:#00d4ff"></span>High Phi (integrated)<br>
    <span class="dot" style="background:#ff6b6b"></span>Low Phi (fragmented)<br>
    <span class="dot" style="background:#555"></span>Unconscious (Phi=0)<br>
    <span class="dot" style="background:#ffd93d; opacity:0.5"></span>Emotional contagion halo
  </div>
</div>

<script type="module">
import init, { WasmPhysicsDemo } from './pkg/symtropy_consciousness_physics.js';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const loading = document.getElementById('loading');

// Controls
const kSlider = document.getElementById('k-slider');
const kVal = document.getElementById('k-val');
const consciousnessToggle = document.getElementById('consciousness-toggle');
const emoSlider = document.getElementById('emo-slider');
const emoVal = document.getElementById('emo-val');
const nSlider = document.getElementById('n-slider');
const nVal = document.getElementById('n-val');
const resetBtn = document.getElementById('reset-btn');

// Stats
const sTick = document.getElementById('s-tick');
const sPhi = document.getElementById('s-phi');
const sSpeed = document.getElementById('s-speed');
const sCluster = document.getElementById('s-cluster');
const sFps = document.getElementById('s-fps');

let demo = null;
let running = true;
let frameCount = 0;
let lastFpsTime = performance.now();

async function start() {
  await init();
  loading.style.display = 'none';
  createDemo(parseInt(nSlider.value));
  requestAnimationFrame(loop);
}

function createDemo(n) {
  demo = new WasmPhysicsDemo(n);
  demo.set_phi_gravity(parseFloat(kSlider.value));
}

// Control handlers
kSlider.addEventListener('input', () => {
  kVal.textContent = parseFloat(kSlider.value).toFixed(2);
  if (demo) demo.set_phi_gravity(parseFloat(kSlider.value));
});

consciousnessToggle.addEventListener('change', () => {
  if (demo) demo.set_consciousness_enabled(consciousnessToggle.checked);
});

emoSlider.addEventListener('input', () => {
  emoVal.textContent = parseFloat(emoSlider.value).toFixed(2);
  if (demo) demo.set_emotion(0, parseFloat(emoSlider.value));
});

nSlider.addEventListener('input', () => {
  nVal.textContent = nSlider.value;
});

resetBtn.addEventListener('click', () => {
  createDemo(parseInt(nSlider.value));
});

function loop(now) {
  if (!demo) { requestAnimationFrame(loop); return; }

  // Apply continuous controls
  const emo = parseFloat(emoSlider.value);
  if (emo > 0.01) demo.set_emotion(0, emo);

  // Step simulation
  const json = demo.tick(1/60);
  const state = JSON.parse(json);

  // Render
  render(state);

  // FPS counter
  frameCount++;
  if (now - lastFpsTime > 1000) {
    sFps.textContent = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }

  // Stats
  sTick.textContent = state.tick;
  sPhi.textContent = state.collective_phi.toFixed(4);

  let totalSpeed = 0;
  let positions = [];
  for (const a of state.agents) {
    totalSpeed += Math.sqrt(a.vx*a.vx + a.vy*a.vy);
    positions.push([a.x, a.y]);
  }
  sSpeed.textContent = (totalSpeed / state.agents.length).toFixed(2);

  // Mean pairwise distance (clustering)
  if (positions.length > 1) {
    let totalDist = 0, pairs = 0;
    for (let i = 0; i < positions.length; i++) {
      for (let j = i+1; j < positions.length; j++) {
        const dx = positions[i][0] - positions[j][0];
        const dy = positions[i][1] - positions[j][1];
        totalDist += Math.sqrt(dx*dx + dy*dy);
        pairs++;
      }
    }
    sCluster.textContent = (totalDist / pairs).toFixed(1);
  }

  requestAnimationFrame(loop);
}

function render(state) {
  const w = canvas.width, h = canvas.height;
  const ws = demo.world_size();
  const scale = w / (2 * ws);
  const cx = w/2, cy = h/2;

  // Clear
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, w, h);

  // Grid
  ctx.strokeStyle = '#1a2233';
  ctx.lineWidth = 0.5;
  for (let i = -ws; i <= ws; i += 10) {
    const sx = cx + i * scale;
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, h); ctx.stroke();
    const sy = cy + i * scale;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(w, sy); ctx.stroke();
  }

  // Agents
  for (const a of state.agents) {
    const sx = cx + a.x * scale;
    const sy = cy - a.y * scale; // flip Y

    // Emotion halo
    if (a.emotion > 0.05) {
      const haloR = 20 + a.emotion * 30;
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, haloR);
      grad.addColorStop(0, `rgba(255, 217, 61, ${a.emotion * 0.3})`);
      grad.addColorStop(1, 'rgba(255, 217, 61, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(sx, sy, haloR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Agent body
    const r = 6 + a.phi * 8; // bigger = higher Phi
    const phiColor = a.phi > 0.01
      ? `hsl(${190 - a.phi * 160}, 80%, ${40 + a.phi * 30}%)`
      : '#555';

    ctx.fillStyle = phiColor;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fill();

    // Energy ring
    ctx.strokeStyle = `rgba(0, 212, 255, ${a.energy})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, sy, r + 3, 0, Math.PI * 2 * a.energy);
    ctx.stroke();

    // Safety tier indicator
    const tierColors = { green: '#4caf50', yellow: '#ffeb3b', orange: '#ff9800', red: '#f44336' };
    ctx.fillStyle = tierColors[a.safety] || '#888';
    ctx.beginPath();
    ctx.arc(sx + r, sy - r, 3, 0, Math.PI * 2);
    ctx.fill();

    // Agent ID
    ctx.fillStyle = '#888';
    ctx.font = '9px monospace';
    ctx.fillText(a.id, sx - 3, sy + r + 12);
  }

  // Collective Phi bar
  ctx.fillStyle = '#1a2233';
  ctx.fillRect(10, h - 30, w - 20, 16);
  const phiWidth = (w - 20) * Math.min(state.collective_phi, 1.0);
  const barGrad = ctx.createLinearGradient(10, 0, 10 + phiWidth, 0);
  barGrad.addColorStop(0, '#e53935');
  barGrad.addColorStop(0.3, '#ff9800');
  barGrad.addColorStop(0.6, '#00d4ff');
  barGrad.addColorStop(1, '#7b1fa2');
  ctx.fillStyle = barGrad;
  ctx.fillRect(10, h - 30, phiWidth, 16);
  ctx.fillStyle = '#fff';
  ctx.font = '10px monospace';
  ctx.fillText(`Collective Phi: ${state.collective_phi.toFixed(4)}`, 14, h - 18);
}

start().catch(e => { loading.textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
