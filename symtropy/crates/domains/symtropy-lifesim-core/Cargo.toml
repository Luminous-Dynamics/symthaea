[package]
name = "symtropy-lifesim-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Shared CPU field primitives and telemetry exports for Symtropy living-system simulations."

[dependencies]
arrow-array = "59.0.0"
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
pollster = { version = "0.4.0", optional = true }
wgpu = { version = "27.0.1", optional = true }

[features]
default = []
wgpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]
