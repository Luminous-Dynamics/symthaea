[package]
name = "symthaea-bevy-brain"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Bevy plugin for NPC cognitive architecture: HDC perception, CfC neural dynamics, Active Inference behavior, and Phi-gated motor authority. Drop-in replacement for behavior trees."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "ai", "npc", "consciousness", "neural"]
categories = ["game-engines", "simulation", "science"]
readme = "README.md"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_log", "bevy_state",
    "multi_threaded", "x11",
] }
symthaea = { path = "../../../symthaea", default-features = false }

[features]
default = []
