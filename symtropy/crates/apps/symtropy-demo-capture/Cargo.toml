[package]
name = "symtropy-demo-capture"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Headless screenshot scheduler for symtropy Bevy demos (env-gated on SYMTROPY_DEMO_CAPTURE_DIR)"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_log",
    "png",
] }

[lints.clippy]
all = "warn"
