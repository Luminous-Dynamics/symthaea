[package]
name = "symtropy-multiplayer-demo"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_post_process", "bevy_shader",
    "bevy_gizmos", "bevy_gizmos_render",
    "multi_threaded", "x11",
    "default_font", "png",
] }
serde = { version = "1.0", features = ["derive"] }
symtropy-lightyear = { path = "../../domains/symtropy-lightyear" }
