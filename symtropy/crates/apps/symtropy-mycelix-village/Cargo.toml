[package]
name = "symtropy-mycelix-village"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_post_process", "bevy_shader",
    "bevy_gizmos", "bevy_gizmos_render",
    "multi_threaded", "x11",
    "default_font", "png",
] }
rand = "0.8"
symtropy-bevy = { path = "../../bridges/symtropy-bevy" }
symthaea-bevy-brain = { path = "../../bridges/symthaea-bevy-brain" }
symtropy-math = { path = "../../core/symtropy-math" }
symtropy-mycelix-bridge = { path = "../../bridges/symtropy-mycelix-bridge" }
