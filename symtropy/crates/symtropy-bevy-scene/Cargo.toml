[package]
name = "symtropy-bevy-scene"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Opinionated scene/camera/light scaffolding for Bevy applications. Eliminates the camera-light-clearcolor boilerplate every Symtropy demo and game otherwise repeats. Permissive sibling to symtropy-bevy."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "scene", "camera", "lighting", "symtropy"]
categories = ["game-engines", "rendering"]
readme = "README.md"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_pbr",
    "bevy_color",
    "bevy_log",
] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

[dev-dependencies]
# Tests construct an `App` to verify plugin registration; needs a window
# backend even though we don't open windows in tests. x11 keeps tests
# CI-friendly on Linux without dragging in wayland deps.
bevy = { version = "0.18", default-features = false, features = ["x11"] }
