[package]
name = "symtropy-xr-showcase"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_core_pipeline", "bevy_render", "bevy_pbr", "bevy_asset", "multi_threaded", "bevy_log", "bevy_color"] }
# bevy_openxr compatibility check usually required; assuming 0.13 for 0.18
bevy_openxr = "0.13" 
symtropy-bevy = { path = "../symtropy-bevy" }
symtropy-render-bridge = { path = "../symtropy-render-bridge" }
symtropy-physics = { path = "../symtropy-physics" }
symtropy-math = { path = "../symtropy-math" }

[workspace]
