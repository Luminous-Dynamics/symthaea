[package]
name = "symtropy-fluid"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "SPH-based fluid dynamics for Symtropy."

[dependencies]
symtropy-math = { path = "../symtropy-math" }
symtropy-physics = { path = "../symtropy-physics" }
nalgebra = { version = "0.34", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
