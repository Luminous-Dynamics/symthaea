[package]
name = "symtropy-terrain"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Terrain and heightmap-to-mesh conversion for Symtropy."

[dependencies]
symtropy-math = { path = "../symtropy-math" }
symtropy-physics = { path = "../symtropy-physics" }
symtropy-mesh = { path = "../symtropy-mesh" }
bevy = { version = "0.18", default-features = false, features = ["bevy_render", "bevy_asset", "bevy_image"] }
nalgebra = "0.34"
image = "0.25" # for heightmap parsing
