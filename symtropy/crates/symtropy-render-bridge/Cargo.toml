[package]
name = "symtropy-render-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "ND physics → Bevy rendering bridge with 4D cross-section slicing"

[dependencies]
symtropy-math = { path = "../symtropy-math" }
symtropy-physics = { path = "../symtropy-physics" }
nalgebra = "0.34"
bevy = { version = "0.18", default-features = false, features = [
    "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render",
    "bevy_color", "bevy_state",
] }
