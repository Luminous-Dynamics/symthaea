[package]
name = "symtropy-flight-demo"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Consciousness-gated quadrotor waypoint flight demo — Φ modulates motor authority under wind-gust disturbance"

# Standalone — excluded from /srv/luminous-dynamics/symtropy workspace
# (which has Bevy runtime deps this demo pulls in separately).
[workspace]

[[bin]]
name = "flight-demo"
path = "src/main.rs"

[dependencies]
# Symthaea robotics
symthaea-multirotor = { path = "../../../symthaea/crates/domains/symthaea-multirotor" }
symthaea-core = { path = "../../../symthaea-core" }

# Symtropy engine (consciousness side-channel)
symtropy-robotics-bridge = { path = "../symtropy-robotics-bridge" }
symtropy-consciousness-physics = { path = "../symtropy-consciousness-physics" }
symtropy-physics = { path = "../symtropy-physics" }
symtropy-demo-capture = { path = "../symtropy-demo-capture" }

# Bevy — 3D PBR + UI + windowing (x11 for NixOS)
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_pbr",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_mesh",
    "multi_threaded", "x11",
    "default_font",
] }

[lints.clippy]
all = "warn"
