[package]
name = "symtropy-humanoid-demo"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Consciousness-gated bipedal humanoid demo — Φ attenuates balance-control torque authority under periodic push perturbations"

[workspace]

[[bin]]
name = "humanoid-demo"
path = "src/main.rs"

[dependencies]
symthaea-humanoid = { path = "../../../symthaea/crates/symthaea-humanoid" }
symthaea-core = { path = "../../../symthaea/symthaea-core" }

symtropy-robotics-bridge = { path = "../symtropy-robotics-bridge" }
symtropy-consciousness-physics = { path = "../symtropy-consciousness-physics" }
symtropy-physics = { path = "../symtropy-physics" }
symtropy-demo-capture = { path = "../symtropy-demo-capture" }

bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_pbr",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_mesh",
    "multi_threaded", "x11",
    "default_font",
] }

[lints.clippy]
all = "warn"
