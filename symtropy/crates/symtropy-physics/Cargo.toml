[package]
name = "symtropy-physics"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "N-dimensional rigid body physics engine for the Symtropy consciousness-physics runtime"

[dependencies]
symtropy-math = { path = "../symtropy-math" }
nalgebra = "0.34"
arrayvec = "0.7"

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "replay-cli"
path = "src/bin/replay_cli.rs"

[[bench]]
name = "physics_bench"
harness = false
