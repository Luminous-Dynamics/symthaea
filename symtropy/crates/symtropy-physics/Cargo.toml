[package]
name = "symtropy-physics"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "N-dimensional rigid body physics with GJK+EPA collision, CCD, joints, raycasting, and warm-starting. Pluggable PhysicsCallback trait for coupling custom metrics to forces and friction."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["physics", "n-dimensional", "gjk", "collision-detection", "rigid-body"]
categories = ["game-engines", "simulation", "science"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## Snap all body forces and velocities to Q16.16 fixed-point before and after
## each integration step, ensuring bit-identical simulation across machines for
## peer-to-peer multiplayer and deterministic replay files.
deterministic-net = []

[dependencies]
symtropy-math = { version = "0.2.0", path = "../symtropy-math" }
nalgebra = { version = "0.34", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
arrayvec = "0.7"

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "replay-cli"
path = "src/bin/replay_cli.rs"

[[bench]]
name = "physics_bench"
harness = false
