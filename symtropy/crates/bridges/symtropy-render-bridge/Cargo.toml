[package]
name = "symtropy-render-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Project N-dimensional physics worlds into Bevy 3D rendering, with first-class 4D cross-section slicing (Miegakure-style). Bridge crate between symtropy-physics and Bevy."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "physics", "4d", "rendering", "n-dimensional"]
categories = ["game-engines", "simulation", "rendering"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
symtropy-math = { version = "0.2.0", path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-math" }
symtropy-physics = { version = "0.2.0", path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-physics" }
nalgebra = "0.34"
bevy = { version = "0.19", default-features = false, features = [
    "bevy_render", "bevy_core_pipeline", "bevy_sprite",
    "bevy_pbr",
    "bevy_color", "bevy_state",
    "bevy_shader",
] }
bevy_egui = "0.40"
bevy-inspector-egui = "0.37"
bytemuck = { version = "1.18", features = ["derive"] }
