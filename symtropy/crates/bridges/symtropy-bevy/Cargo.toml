[package]
name = "symtropy-bevy"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Drop-in Bevy plugin for Phi-coupled N-dimensional physics. Builds on the permissive symtropy-bevy-core plugin."

[dependencies]
symtropy-bevy-core = { path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-bevy-core" }
symthaea-bevy-brain = { path = "/srv/luminous-dynamics/symtropy/crates/bridges/symthaea-bevy-brain" }
symtropy-physics = { path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-physics" }
symtropy-rapier3d-bridge = { path = "/srv/luminous-dynamics/symtropy/crates/bridges/symtropy-rapier3d-bridge", optional = true }
symtropy-math = { path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-math" }
symtropy-robotics-bridge-core = { path = "/srv/luminous-dynamics/symtropy/crates/bridges/symtropy-robotics-bridge-core" }
symtropy-consciousness-physics = { path = "/srv/luminous-dynamics/symtropy/crates/domains/symtropy-consciousness-physics" }
symthaea-muse = { path = "../../../../symthaea/crates/domains/symthaea-muse" }
symtropy-devconsole = { version = "0.1.0", path = "/srv/luminous-dynamics/symtropy/crates/domains/symtropy-devconsole", features = ["phi-panel"] }
bevy = { version = "0.19", default-features = false, features = [
    "png",
    "bevy_ui", "bevy_ui_render", "bevy_text", "default_font",
] }
nalgebra = "0.34"
rhai = { version = "1.19", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }

[features]
default = []
debug-gizmos = []
rapier3d = ["dep:symtropy-rapier3d-bridge"]
# NOT wired to an actual dependency yet — bevy_inspector_egui isn't in
# [dependencies] below, so `--features inspector` will not currently build.
# README.md calls this the intended in-engine tooling story; declared here
# purely so `cargo check`'s default build doesn't warn about the unknown
# cfg name in plugin.rs.
inspector = []

[dev-dependencies]
symthaea-consciousness-equation = { path = "../../../../symthaea/crates/domains/symthaea-consciousness-equation" }
symtropy-bevy-scene = { path = "../../core/symtropy-bevy-scene" }
symtropy-render-bridge = { path = "../symtropy-render-bridge" }

