[package]
name = "symtropy-robotics-bridge-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Permissively-licensed core types and traits for symtropy-robotics-bridge."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["physics", "robotics", "simulation", "bevy"]
categories = ["science", "simulation", "game-engines"]

[dependencies]
symtropy-math = { path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-math" }
symtropy-physics = { path = "/srv/luminous-dynamics/symtropy/crates/core/symtropy-physics" }
symtropy-consciousness-physics = { path = "../../domains/symtropy-consciousness-physics" }
nalgebra = "0.34"
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
bevy = { version = "0.19", default-features = false, optional = true }


[features]
default = []
bevy = ["dep:bevy"]
