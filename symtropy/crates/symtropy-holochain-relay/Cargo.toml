[package]
name = "symtropy-holochain-relay"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "WebSocket relay between Symtropy game and Holochain conductor"

[features]
default = []
mycelix = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
