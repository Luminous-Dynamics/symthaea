[package]
name = "symtropy-mycelix-village"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_log",
    "bevy_state",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "multi_threaded"
] }
symtropy-bevy-core = { path = "../symtropy-bevy-core" }
symthaea-bevy-brain = { path = "../symthaea-bevy-brain" }
symtropy-physics = { path = "../core/symtropy-physics" }
symtropy-physics-gpu = { path = "/srv/luminous-dynamics/symtropy/crates/domains/symtropy-physics-gpu" }
symtropy-rapier3d-bridge = { path = "/srv/luminous-dynamics/symtropy/crates/bridges/symtropy-rapier3d-bridge" }
symtropy-terrain = { path = "../symtropy-terrain" }
rapier3d = "0.18"
nalgebra = "0.34"
rand = "0.8"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1.0"
base64 = "0.22"
image = { version = "0.25", features = ["jpeg"] }

[[bin]]
name = "mycelix-village-visual"
path = "src/main.rs"

[[bin]]
name = "mycelix-scenario-harness"
path = "src/headless.rs"

[[bin]]
name = "city-scale"
path = "src/headless.rs"
