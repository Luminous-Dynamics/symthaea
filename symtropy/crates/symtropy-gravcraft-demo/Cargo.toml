[package]
name = "symtropy-gravcraft-demo"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bevy 3D visualization of metric perturbation propulsion — spacetime warps around the craft"

[[bin]]
name = "gravcraft-demo"
path = "src/main.rs"

[dependencies]
# Symthaea gravcraft
symthaea-gravcraft = { path = "../../../symthaea/crates/symthaea-gravcraft" }
symthaea-core = { path = "../../../symthaea/symthaea-core" }

# Bevy engine
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_pbr",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_mesh",
    "multi_threaded",
    "x11",
] }
