[package]
name = "symtropy-bevy-core"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Permissively-licensed Bevy plugin for symtropy-physics N-dimensional physics. Generic over PhysicsCallback."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "game-engine", "symtropy", "physics", "distribution"]
categories = ["game-engines"]
readme = "README.md"

[dependencies]
symtropy-physics = { version = "0.2.1", path = "../symtropy-physics" }
symtropy-math = { version = "0.2.1", path = "../symtropy-math" }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_winit",
    "bevy_color",
    "bevy_state",
    "bevy_log",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_pbr",
    "multi_threaded",
    "x11",
] }
nalgebra = "0.34"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"
symtropy-basin = { path = "../../domains/symtropy-basin" }
symtropy-bevy-scene = { path = "../symtropy-bevy-scene" }

[features]
default = []
