[package]
name = "symtropy-sim-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bridge between mycelix-multiworld-sim governance/economy models and Bevy ECS"

[features]
default = []
# Exists to satisfy Cargo feature unification when parent uses --features mycelix
mycelix = []

[dependencies]
# Mycelix pure-Rust crates (no Holochain dependency)
mycelix-multiworld-sim = { path = "../../../mycelix-multiworld-sim" }
mycelix-bridge-common = { path = "../../../crates/mycelix-bridge-common", default-features = false }
mycelix-core-types = { path = "../../../mycelix-core/libs/mycelix-core-types", default-features = false }
mycelix-fl = { path = "../../../mycelix-core/libs/mycelix-fl", default-features = false }
rb-bft-consensus = { path = "../../../mycelix-core/libs/rb-bft-consensus", default-features = false, features = ["std"] }
feldman-dkg = { path = "../../../mycelix-core/libs/feldman-dkg" }
kvector-zkp = { path = "../../../mycelix-core/libs/kvector-zkp", default-features = false }
# TODO: mycelix-differential-privacy needs rand API fix (random() → gen())
# mycelix-differential-privacy = { path = "../../../mycelix-core/libs/differential-privacy" }

# Game engine
bevy = { version = "0.18", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
