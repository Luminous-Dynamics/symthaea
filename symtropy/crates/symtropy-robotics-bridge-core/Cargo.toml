[package]
name = "symtropy-robotics-bridge-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Permissively-licensed core types and traits for symtropy-robotics-bridge."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["physics", "robotics", "simulation", "bevy"]
categories = ["science", "simulation", "game-engines"]

[dependencies]
symtropy-math = { path = "../symtropy-math" }
symtropy-physics = { path = "../symtropy-physics" }
nalgebra = "0.34"
bevy = { version = "0.18", default-features = false, optional = true }

[features]
default = []
bevy = ["dep:bevy"]
