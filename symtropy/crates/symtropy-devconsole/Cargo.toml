[package]
name = "symtropy-devconsole"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Drop-in Bevy dev console: bevy-inspector-egui's world inspector + a Symtropy-specific Phi/scene-control panel. Toggle with F1."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "inspector", "editor", "dev-tools", "symtropy"]
categories = ["game-engines", "development-tools"]
readme = "README.md"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_color",
    "bevy_log",
] }
bevy_egui = { version = "0.39", default-features = false, features = [
    "render",
    "default_fonts", 
] }
symtropy-bevy-core = { version = "0.1.1", path = "../symtropy-bevy-core" }

[features]
default = []
phi-panel = []

[dev-dependencies]
bevy = { version = "0.18", default-features = false, features = ["x11"] }
