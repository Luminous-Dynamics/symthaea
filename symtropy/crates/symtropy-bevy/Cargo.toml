[package]
name = "symtropy-bevy"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Drop-in Bevy plugin for Phi-coupled N-dimensional physics. One line to add integrated information as a first-class physics parameter to any Bevy app."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "physics", "n-dimensional", "phi", "game-engine"]
categories = ["game-engines", "simulation"]
readme = "README.md"

[dependencies]
symtropy-math = { version = "0.1.0", path = "../symtropy-math" }
symtropy-physics = { version = "0.1.0", path = "../symtropy-physics" }
symtropy-consciousness-physics = { version = "0.1.0", path = "../symtropy-consciousness-physics" }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_core_pipeline", "bevy_render", "bevy_sprite", "bevy_sprite_render",
    "bevy_winit", "bevy_color", "bevy_state", "bevy_log",
    "bevy_gizmos", "bevy_gizmos_render",
    "multi_threaded", "x11",
] }
nalgebra = "0.34"

[features]
default = ["debug-gizmos"]
debug-gizmos = []
