[package]
name = "symtropy-bevy"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Drop-in Bevy plugin for Phi-coupled N-dimensional physics. Builds on the permissive symtropy-bevy-core plugin, adding ConsciousnessField, biometric coupling, and macro-world modifiers. One line to add integrated information as a first-class physics parameter to any Bevy app."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "physics", "n-dimensional", "phi", "game-engine"]
categories = ["game-engines", "simulation"]
readme = "README.md"

[dependencies]
symtropy-math = { version = "0.2.0", path = "../symtropy-math" }
symtropy-physics = { version = "0.2.0", path = "../symtropy-physics" }
# Re-exports PhysicsBody + optionally the BevyPhysicsPlugin for users who
# want no-coupling physics. No duplication.
symtropy-bevy-core = { version = "0.1.0", path = "../symtropy-bevy-core" }
symtropy-consciousness-physics = { version = "0.2.0", path = "../symtropy-consciousness-physics" }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_core_pipeline", "bevy_render", "bevy_sprite", "bevy_sprite_render",
    "bevy_winit", "bevy_color", "bevy_state", "bevy_log",
    "bevy_gizmos", "bevy_gizmos_render",
    "multi_threaded", "x11",
] }
nalgebra = "0.34"

[features]
default = ["debug-gizmos"]
debug-gizmos = []

[dev-dependencies]
# Tests construct ConsciousnessInputs directly. This type lives upstream of
# symtropy-consciousness-physics; declare it here as a dev-dep so tests can
# import it without adding a runtime dep.
symthaea-consciousness-equation = { version = "0.1.0", path = "../../../symthaea/crates/symthaea-consciousness-equation" }
# Examples (e.g., pendulum_swarm in PENDULUM_CAPTURE_DIR mode) use
# `Screenshot::primary_window()` + `save_to_disk` which needs PNG support.
# The base symtropy-bevy build omits image-format features to stay slim;
# Cargo merges dev-dep features so examples and tests get PNG without
# affecting the published crate.
bevy = { version = "0.18", default-features = false, features = ["png"] }
