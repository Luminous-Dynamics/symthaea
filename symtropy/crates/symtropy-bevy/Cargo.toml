[package]
name = "symtropy-bevy"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Drop-in Bevy plugin for Phi-coupled N-dimensional physics. Builds on the permissive symtropy-bevy-core plugin."

[dependencies]
symtropy-bevy-core = { path = "../symtropy-bevy-core" }
symthaea-bevy-brain = { path = "../symthaea-bevy-brain" }
symtropy-physics = { path = "../symtropy-physics" }
symtropy-rapier3d-bridge = { path = "../symtropy-rapier3d-bridge", optional = true }
symtropy-math = { path = "../symtropy-math" }
symtropy-robotics-bridge-core = { path = "../symtropy-robotics-bridge-core" }
symtropy-consciousness-physics = { path = "../symtropy-consciousness-physics" }
symthaea-muse = { path = "../../../symthaea/crates/domains/symthaea-muse" }
symtropy-devconsole = { version = "0.1.0", path = "../symtropy-devconsole", features = ["phi-panel"] }
bevy = { version = "0.18", default-features = false, features = [
    "png",
    "bevy_ui", "bevy_ui_render", "bevy_text", "default_font",
] }
nalgebra = "0.34"
rhai = { version = "1.19", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }

[features]
default = []
debug-gizmos = []
rapier3d = ["dep:symtropy-rapier3d-bridge"]
