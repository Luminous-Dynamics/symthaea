[package]
name = "symtropy-multiplayer-demo"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_winit", "bevy_core_pipeline", "bevy_render", "bevy_pbr", "bevy_asset", "multi_threaded", "x11", "bevy_log", "bevy_state", "bevy_color"] }
lightyear = "0.26"
symtropy-lightyear = { path = "../symtropy-lightyear" }
symtropy-physics = { path = "../symtropy-physics" }
symtropy-math = { path = "../symtropy-math" }
nalgebra = "0.34"
serde = { version = "1", features = ["derive"] }
rand = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace]
