[package]
name = "symtropy-symthaea-adapter"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Adapter that lets a Symtropy RoboticAgent drive a real Symthaea EmbodimentBridge. Implements MotorPlanner by encoding observation → thought HV, stepping the bridge, and translating the result into per-joint motor commands."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "robotics", "symthaea", "embodiment", "simulation"]
categories = ["simulation", "science"]

# Both deps are AGPL; this adapter is AGPL as a consequence.
# Lives at top-level (outside the symtropy workspace) because symthaea-core
# is not a workspace member here and we don't want to pull its entire feature
# matrix into that workspace's build.

[dependencies]
symtropy-robotics-bridge = { version = "0.1.0", path = "../symtropy/crates/symtropy-robotics-bridge" }
symthaea-core = { version = "0.5.0", path = "../symthaea/symthaea-core" }

[dev-dependencies]
# Integration tests exercise the adapter against a real EmbodimentBridge.
# Orbital is the minimal choice: default features pull only symthaea-core +
# symthaea-fep, no MuJoCo, no optional runtime deps.
symthaea-orbital = { version = "0.1.0", path = "../symthaea/crates/domains/symthaea-orbital" }
