[package]
name = "symtropy"
version = "0.1.0"
edition = "2021"
description = "Symtropy: consciousness-driven survival game — The First Room"
license = "AGPL-3.0-or-later"

[dependencies]
# Game engine — disable wayland for now (X11 only on NixOS dev)
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_post_process", "bevy_shader",
    "multi_threaded", "x11",
    "default_font", "png",
] }

# Consciousness engine
symthaea-fep = { path = "../symthaea/crates/symthaea-fep" }
symthaea-biometrics = { path = "../symthaea/crates/symthaea-biometrics", features = ["muse-bridge"] }
symthaea-muse = { path = "../symthaea/crates/symthaea-muse" }

# Mycelix integration — the game IS the integration test
# Enable with: cargo build --features mycelix
symtropy-sim-bridge = { path = "crates/symtropy-sim-bridge", optional = true }
mycelix-bridge-common = { path = "../crates/mycelix-bridge-common", default-features = false, optional = true }
mycelix-core-types = { path = "../mycelix-core/libs/mycelix-core-types", default-features = false, optional = true }

# Symthaea consciousness — the Master Equation (7-theory synthesis)
symthaea-consciousness-equation = { path = "../symthaea/crates/symthaea-consciousness-equation" }

# Symtropy engine crates — consciousness-physics runtime
symtropy-math = { path = "crates/symtropy-math" }
symtropy-physics = { path = "crates/symtropy-physics" }
symtropy-consciousness-physics = { path = "crates/symtropy-consciousness-physics" }
symtropy-render-bridge = { path = "crates/symtropy-render-bridge" }
symtropy-robotics-bridge = { path = "crates/symtropy-robotics-bridge" }

# Optional advanced features
symtropy-world = { path = "crates/symtropy-world", optional = true }
symtropy-net = { path = "crates/symtropy-net", optional = true }

# Utilities
rand = "0.8"
nalgebra = "0.34"

[features]
default = []
# Mycelix governance/economy/crypto integration — physicalized cryptography
# Enable to turn the game into a direct Mycelix integration test.
# All Mycelix modules (governance, economy, factions, FL, DKG, epistemics) activate.
# Run headless tests: cargo run -p symtropy-sim-bridge --bin headless_test -- --ticks 300
mycelix = ["dep:symtropy-sim-bridge", "dep:mycelix-bridge-common", "dep:mycelix-core-types"]
world = ["dep:symtropy-world"]
net = ["world", "dep:symtropy-net"]

[lints.clippy]
all = "warn"
