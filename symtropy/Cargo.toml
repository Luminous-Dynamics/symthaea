[package]
# Renamed 2026-04-18 from `symtropy` → `symtropy-launcher` to free up the
# `symtropy` name for the new meta-crate at `crates/symtropy/`. The launcher
# is genuinely a launcher (multi-experience: The Room + Sol Atlas), so
# this makes semantic sense.
name = "symtropy-launcher"
version = "0.1.0"
edition = "2024"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
license = "AGPL-3.0-or-later"
publish = false

[features]
default = []
# Physicalized cryptography / governance systems (see systems/mod.rs).
# Enabled via `cargo build --features mycelix`. NOT verified by this
# workspace's default `cargo check` — symtropy-sim-bridge (used in
# plugin.rs's mycelix block) isn't wired as a dependency here yet.
mycelix = []
atlas = ["dep:sol-atlas-bevy", "dep:sol-atlas-core"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_post_process", "bevy_shader",
    "bevy_gizmos", "bevy_gizmos_render",
    "multi_threaded", "x11", # Explicitly include X11, exclude Wayland
    "default_font", "png",
] }
symthaea = { path = "../symthaea", default-features = false, features = ["vision-manifold", "muse", "reasoning_engine", "humanoid", "vehicle"] }
symthaea-muse = { path = "../symthaea/crates/domains/symthaea-muse", features = ["muse-live"] }
symtropy-bevy = { path = "crates/bridges/symtropy-bevy" }
symtropy-bevy-core = { path = "crates/core/symtropy-bevy-core" }
symtropy-bevy-scene = { path = "crates/core/symtropy-bevy-scene" }
symtropy-physics = { path = "crates/core/symtropy-physics" }
symtropy-rapier3d-bridge = { path = "crates/bridges/symtropy-rapier3d-bridge" }
symtropy-physics-gpu = { path = "crates/domains/symtropy-physics-gpu" }
symtropy-core = { path = "crates/core/symtropy-core" }
symtropy-math = { path = "crates/core/symtropy-math" }
symtropy-mycelix-village = { path = "crates/apps/symtropy-mycelix-village" }
symtropy-terrain = { path = "crates/domains/symtropy-terrain" }
symtropy-demo-capture = { path = "crates/apps/symtropy-demo-capture" }
symtropy-consciousness-physics = { path = "crates/domains/symtropy-consciousness-physics" }
symtropy-render-bridge = { path = "crates/bridges/symtropy-render-bridge" }
symthaea-bevy-brain = { path = "crates/bridges/symthaea-bevy-brain", optional = true }
symtropy-symthaea-adapter = { path = "crates/bridges/symtropy-symthaea-adapter", optional = true }
symtropy-mycelix-bridge = { path = "crates/bridges/symtropy-mycelix-bridge", optional = true }
sol-atlas-bevy = { path = "../sol-atlas-bevy", optional = true }
sol-atlas-core = { path = "../sol-atlas-core", optional = true }

symthaea-fep = { path = "../symthaea/crates/core/symthaea-fep" }

symthaea-biometrics = { path = "../symthaea/crates/domains/symthaea-biometrics" }
symthaea-consciousness-equation = { path = "../symthaea/crates/domains/symthaea-consciousness-equation" }
nalgebra = "0.34"
rand = "0.8"
hound = "3.5"
image = { version = "0.24", features = ["png"] }
cpal = "0.17"
bevy_egui = "0.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symthaea-core = { path = "../symthaea/crates/core/symthaea-core" }
bytemuck = { version = "1.18", features = ["derive"] }

[workspace]
resolver = "2"
exclude = [
    "crates/bridges/symtropy-robotics-bridge",
]
members = [
    ".",
    "crates/apps/symtropy-cli",
    "crates/bridges/symtropy-bevy",
    "crates/core/symtropy-bevy-core",
    "crates/core/symtropy-bevy-scene",
    "crates/bridges/symthaea-bevy-brain",
    "crates/bridges/symtropy-symthaea-adapter",
    "crates/apps/symtropy-mycelix-village",
    "crates/domains/symtropy-net",
    "crates/domains/symtropy-lifesim-core",
    "crates/domains/symtropy-colony",
    "crates/domains/symtropy-mycelium",
    "crates/domains/symtropy-basin",

    "crates/bridges/symtropy-robotics-bridge-core",
    "crates/bridges/symtropy-rapier3d-bridge",
    "crates/domains/symtropy-physics-gpu",
    "crates/core/symtropy-core",
    "crates/domains/symtropy-devconsole",
    "crates/core/symtropy-math",
    "crates/core/symtropy-physics",
    "crates/bridges/symtropy-render-bridge",
    "crates/bridges/symtropy-mycelix-bridge",
    "crates/bridges/symtropy-foundry",
    "crates/bridges/symtropy-sim-bridge",
    "crates/domains/symtropy-terrain",
    "crates/domains/symtropy-world",
    "crates/domains/symtropy-lightyear",
    "crates/apps/symtropy-multiplayer-demo",
    "crates/symtropy-mesh",

    # Restored 2026-07-03 (demo-crate rot triage): Cargo.toml deps had gone
    # empty despite `src/` importing real crates, orphaning these from the
    # workspace. See `symtropy/archive/orphaned-demos-2026-07/README.md` for
    # the ones that were archived instead.
    "crates/apps/symtropy-auv-demo",
    "crates/apps/symtropy-exoskeleton-demo",
    "crates/apps/symtropy-flight-demo",
    "crates/apps/symtropy-helicopter-demo",
    "crates/apps/symtropy-humanoid-demo",
    "crates/apps/symtropy-manipulator-demo",
    "crates/apps/symtropy-orbital-demo",
    "crates/apps/symtropy-quadruped-demo",
    "crates/apps/symtropy-surgical-demo",
    "crates/apps/symtropy-vehicle-demo",
    "crates/apps/symtropy-gravcraft-demo",
    "crates/apps/symtropy-scavenger-demo",
    "crates/apps/symtropy-web-gallery",
]

[lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
