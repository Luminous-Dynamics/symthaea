[package]
name = "symtropy"
version = "0.1.0"
edition = "2021"
description = "Symtropy: consciousness-driven survival game — The First Room"
license = "AGPL-3.0-or-later"

[dependencies]
# Game engine — disable wayland for now (X11 only on NixOS dev)
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_post_process", "bevy_shader",
    "multi_threaded", "x11",
    "default_font", "png",
] }

# Consciousness engine
symthaea-fep = { path = "../symthaea/crates/symthaea-fep" }
symthaea-biometrics = { path = "../symthaea/crates/symthaea-biometrics", features = ["muse-bridge"] }
symthaea-muse = { path = "../symthaea/crates/symthaea-muse" }

# Governance/economy simulation bridge — disabled until cross-session API stabilizes
# symtropy-sim-bridge = { path = "crates/symtropy-sim-bridge" }
# mycelix-bridge-common = { path = "../crates/mycelix-bridge-common", default-features = false }
# mycelix-core-types = { path = "../mycelix-core/libs/mycelix-core-types", default-features = false }

# Symthaea consciousness — the Master Equation (7-theory synthesis)
symthaea-consciousness-equation = { path = "../symthaea/crates/symthaea-consciousness-equation" }

# Utilities
rand = "0.8"

[lints.clippy]
all = "warn"
