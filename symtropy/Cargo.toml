[package]
# Renamed 2026-04-18 from `symtropy` → `symtropy-launcher` to free up the
# `symtropy` name for the new meta-crate at `crates/symtropy/`. The launcher
# is genuinely a launcher (multi-experience: The Room + Sol Atlas), so
# this makes semantic sense.
name = "symtropy-launcher"
version = "0.1.0"
edition = "2024"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_post_process", "bevy_shader",
    "bevy_gizmos", "bevy_gizmos_render",
    "multi_threaded", "x11", # Explicitly include X11, exclude Wayland
    "default_font", "png",
] }
symthaea = { path = "../symthaea", default-features = false, features = ["vision-manifold", "muse", "reasoning_engine"] }
symthaea-muse = { path = "../symthaea/crates/symthaea-muse", features = ["muse-live"] }
symtropy-bevy = { path = "crates/symtropy-bevy" }
symtropy-bevy-core = { path = "crates/symtropy-bevy-core" }
symtropy-bevy-scene = { path = "crates/symtropy-bevy-scene" }
symtropy-physics = { path = "crates/symtropy-physics" }
symtropy-rapier3d-bridge = { path = "crates/symtropy-rapier3d-bridge" }
symtropy-physics-gpu = { path = "crates/symtropy-physics-gpu" }
symtropy-core = { path = "crates/symtropy-core" }
symtropy-math = { path = "crates/symtropy-math" }
symtropy-mycelix-village = { path = "crates/symtropy-mycelix-village" }
symtropy-terrain = { path = "crates/symtropy-terrain" }
symtropy-consciousness-physics = { path = "crates/symtropy-consciousness-physics" }
symtropy-render-bridge = { path = "crates/symtropy-render-bridge" }
symthaea-fep = { path = "../symthaea/crates/symthaea-fep" }
symthaea-biometrics = { path = "../symthaea/crates/symthaea-biometrics" }
symthaea-consciousness-equation = { path = "../symthaea/crates/symthaea-consciousness-equation" }
nalgebra = "0.34"
rand = "0.8"
hound = "3.5"
image = { version = "0.24", features = ["png"] }
cpal = "0.17"
symthaea-core = { path = "../symthaea/symthaea-core" }

[workspace]
resolver = "2"
members = [
    ".",
    "crates/symtropy-bevy",
    "crates/symtropy-bevy-core",
    "crates/symtropy-bevy-scene",
    "crates/symthaea-bevy-brain",
    "crates/symtropy-mycelix-village",
    "crates/symtropy-oceanic",
    "crates/symtropy-net",

    "crates/symtropy-robotics-bridge-core",
    "crates/symtropy-rapier3d-bridge",
    "crates/symtropy-physics-gpu",
    "crates/symtropy-core",
    "crates/symtropy-devconsole",
    "crates/symtropy-math",
    "crates/symtropy-physics",
    "crates/symtropy-render-bridge",
    "crates/symtropy-terrain",
    "crates/symtropy-lightyear",
    "crates/symtropy-multiplayer-demo",
]

[lints.clippy]
all = "warn"
