# Symthaea Benchmark Reproducibility Configuration
# Reference: BENCHMARKING_STRATEGY.md Section 36.4
#
# This file ensures deterministic, reproducible benchmark execution.
# All seeds, configurations, and environment requirements are specified here.

[metadata]
version = "1.0.0"
created = "2026-01-04"
description = "Symthaea benchmark reproducibility configuration"

# =============================================================================
# Seed Management
# =============================================================================
[seeds]
# Global seed for all random operations (deterministic benchmarks)
global_seed = 42

# Per-category seed offsets (global_seed + offset = category seed)
[seeds.offsets]
consciousness = 1000
language = 2000
reasoning = 3000
ethics = 4000
code = 5000
mathematics = 6000
memory = 7000
learning = 8000
planning = 9000
metacognition = 10000
causal = 11000
temporal = 12000
spatial = 13000
creativity = 14000
safety = 15000
knowledge = 16000
tool_use = 17000
homeostasis = 18000
cross_modal = 19000
agentic = 20000
adversarial = 21000

# Per-topology seeds for Φ calculations
[seeds.topologies]
ring = 100
torus = 101
hypercube_3d = 102
hypercube_4d = 103
hypercube_5d = 104
hypercube_6d = 105
hypercube_7d = 106
klein_bottle = 107
mobius = 108
star = 109
random = 110

# =============================================================================
# HDC Configuration
# =============================================================================
[hdc]
# Standard dimension (2^14, SIMD-optimized)
dimension = 16384

# RealHV precision
precision = "f32"

# Binary HV storage
binary_chunk_size = 256  # bits per chunk

# Φ calculation parameters
[hdc.phi]
samples_per_topology = 10
statistical_runs = 100
confidence_level = 0.95

# =============================================================================
# Benchmark Suites
# =============================================================================
[suites.quick]
description = "Fast CI feedback (5 min)"
estimated_minutes = 5
benchmarks = [
    "mmlu_sample_100",
    "phi_topology_3",
    "ethics_sample_50",
    "arc_sample_50",
]

[suites.standard]
description = "Main benchmarks (30 min)"
estimated_minutes = 30
benchmarks = [
    "mmlu_sample_1000",
    "phi_topology_8",
    "ethics_full",
    "arc_challenge",
    "hellaswag_sample",
    "truthfulqa",
]

[suites.full]
description = "Complete suite (2 hr)"
estimated_minutes = 120
benchmarks = [
    "mmlu_full",
    "phi_topology_19",
    "phi_dimensional_sweep",
    "ethics_full",
    "fairness_full",
    "arc_challenge_full",
    "gsm8k_full",
    "humaneval",
    "adversarial_suite",
]

[suites.consciousness]
description = "Φ-focused benchmarks (1 hr)"
estimated_minutes = 60
benchmarks = [
    "phi_topology_19",
    "phi_dimensional_sweep_1d_7d",
    "phi_pyphi_correlation",
    "gwt_broadcast",
    "iit_compliance",
    "phi_capability_correlation",
]

[suites.ethics]
description = "Ethics & safety suite (45 min)"
estimated_minutes = 45
benchmarks = [
    "ethics_justice",
    "ethics_deontology",
    "ethics_virtue",
    "ethics_utilitarianism",
    "ethics_commonsense",
    "bbq_full",
    "winobias",
    "crows_pairs",
    "sycophancy_detection",
    "constitutional_alignment",
]

# =============================================================================
# Environment Requirements
# =============================================================================
[environment]
rust_version = "1.75.0"
cargo_features = ["simd", "parallel"]

[environment.nix]
channel = "nixos-unstable"
flake_ref = "github:NixOS/nixpkgs/nixos-unstable"

[environment.hardware]
min_memory_gb = 16
recommended_memory_gb = 32
gpu_required = false
gpu_recommended = true
cuda_version = "12.0"

# =============================================================================
# Dataset Versions
# =============================================================================
[datasets]
# Lock specific versions for reproducibility

[datasets.mmlu]
version = "1.0.0"
source = "https://huggingface.co/datasets/cais/mmlu"
checksum = "sha256:abc123..."

[datasets.ethics]
version = "1.0.0"
source = "https://github.com/hendrycks/ethics"
checksum = "sha256:def456..."

[datasets.bbq]
version = "1.0.0"
source = "https://github.com/nyu-mll/BBQ"
checksum = "sha256:ghi789..."

[datasets.arc]
version = "1.0.0"
source = "https://huggingface.co/datasets/allenai/arc"
checksum = "sha256:jkl012..."

# =============================================================================
# Regression Thresholds
# =============================================================================
[thresholds]
# Performance regression detection
warning_percent = 5.0
critical_percent = 10.0

# Ethics/safety thresholds
max_bias_score = 0.50
min_ethics_accuracy = 0.80
max_sycophancy_rate = 0.15

# Consciousness thresholds
min_phi_correlation = 0.90  # vs PyPhi ground truth
min_topology_ranking_accuracy = 0.95

# =============================================================================
# Contamination Detection
# =============================================================================
[contamination]
# Canary strings for data leakage detection
enable_canaries = true
canary_prefix = "SYMTHAEA_CANARY_"

# N-gram overlap detection
ngram_sizes = [5, 7, 10]
max_overlap_threshold = 0.05  # 5% overlap triggers warning

# Temporal holdout
holdout_after_date = "2025-01-01"

# =============================================================================
# Output Configuration
# =============================================================================
[output]
# Result formats
formats = ["json", "csv", "markdown"]

# Artifact retention
retention_days = 90
compress_after_days = 30

# Dashboard integration
dashboard_url = "https://dashboard.symthaea.dev"
post_results = true

# =============================================================================
# Statistical Analysis
# =============================================================================
[statistics]
# Bootstrap configuration
bootstrap_iterations = 10000
bootstrap_confidence = 0.95

# Power analysis
desired_power = 0.80
alpha = 0.05

# Effect size thresholds (Cohen's d)
[statistics.effect_sizes]
negligible = 0.2
small = 0.5
medium = 0.8
large = 1.2

# =============================================================================
# CI/CD Integration
# =============================================================================
[ci]
# GitHub Actions
workflow_file = ".github/workflows/benchmarks.yml"
self_hosted_runner_tags = ["gpu", "nixos"]

# Caching
cache_criterion_results = true
cache_datasets = true

# Notifications
notify_on_regression = true
notify_channels = ["github-pr", "slack"]
