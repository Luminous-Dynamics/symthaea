# Docker Compose configuration for Mycelix-DeSci
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mycelix-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=mycelix_api=info,tower_http=debug
      - CORS_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - mycelix-network

networks:
  mycelix-network:
    driver: bridge

volumes:
  mycelix-data:
    driver: local
