name: Python CI

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd src/ml
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          cd src/ml
          flake8 mycelix_desci_ml --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 mycelix_desci_ml --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format check with black
        run: |
          cd src/ml
          black --check mycelix_desci_ml

      - name: Type check with mypy
        run: |
          cd src/ml
          mypy mycelix_desci_ml --ignore-missing-imports

      - name: Test with pytest
        run: |
          cd src/ml
          pytest -v
