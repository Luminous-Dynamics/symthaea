name: Test Suite

on:
  push:
    branches: [main, develop, claude/*]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test - ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: src/core

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src/core

      - name: Run unit tests
        run: cargo test --lib --verbose
        working-directory: src/core

      - name: Run integration tests
        run: cargo test --test '*' --verbose
        working-directory: src/core

      - name: Test examples compile
        run: |
          cargo build --example create_claim
          cargo build --example hash_dataset
          cargo build --example complete_workflow
          cargo build --example query_demo
          cargo build --example trust_demo
        working-directory: src/core

      - name: Build release
        run: cargo build --release --verbose
        working-directory: src/core

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --out Xml --all-features --workspace
        working-directory: src/core

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v3
        with:
          files: ./src/core/cobertura.xml
          fail_ci_if_error: false
          verbose: true
