[package]
name = "mycelix-desci-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "REST API server for Mycelix-DeSci"

[lib]
name = "mycelix_desci_api"
path = "src/lib.rs"

[[bin]]
name = "mycelix-api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "timeout", "limit"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# OpenAPI documentation
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }

# Metrics
prometheus = "0.13"
lazy_static = "1.4"

# Rate limiting (per-IP GCRA token bucket via the `governor` crate).
# Pinned to 0.4 because its axum integration targets axum 0.7 (this crate's
# axum version); tower_governor >=0.5 pulls in axum 0.8 and does not compile
# against a 0.7 Router (Response<Body> type mismatch).
tower_governor = "0.4"
governor = "0.6"

# JWT bearer-token auth middleware for mutating routes
jsonwebtoken = "9"

# Project dependencies
mycelix-desci-core = { path = "../core" }
mycelix-zkp-core = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.11", features = ["json"] }
uuid = { workspace = true }
rand = "0.8"
tower = { version = "0.4", features = ["util"] }
