[workspace]
members = [
    "src/core",
    "src/api",
    "src/cli",
    "zomes/desci_claim/integrity",
    "zomes/desci_claim/coordinator",
]
exclude = ["apps/leptos"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Mycelix Contributors"]
repository = "https://github.com/luminousdynamics/mycelix-desci"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
sha2 = "0.10"
blake3 = "1.5"
ed25519-dalek = "2.1"
rand = "0.8"
hex = "0.4"

# Holochain DHT (for P2P data sharing)
# Note: These versions are placeholders - adjust based on actual Mycelix core deps
# holochain = { version = "0.2" }
# holo_hash = { version = "0.2" }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# UUID and time
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Testing
proptest = "1.4"

# ZKP verification — native Winterfell verifier (no WASM constraints)
mycelix-zkp-core = { path = "../crates/mycelix-zkp-core", features = ["backend-winterfell"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
