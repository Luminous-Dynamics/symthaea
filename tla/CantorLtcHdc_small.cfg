\* TLC Model Checker Configuration - SMALL MODEL
\* Quick validation with minimal state space
\*
\* Run: tlc CantorLtcHdc_MC.tla -config CantorLtcHdc_small.cfg -workers auto

SPECIFICATION Spec

\* Minimal constants for quick validation
CONSTANT HdcDim = 2
CONSTANT MaxFixedDepth = 2
CONSTANT MaxElasticDepth = 3
CONSTANT CantorRatio = 1
