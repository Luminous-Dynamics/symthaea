[package]
name = "sfeb-contract-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Standalone Rust validator for Symthaea Frontend Engineering Benchmark contracts"

# This is a deliberately isolated tool. It is not a member of the main
# Symthaea workspace and does not add dependencies to production crates.
[workspace]

[dependencies]
jsonschema = { version = "=0.62.0", default-features = false }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
