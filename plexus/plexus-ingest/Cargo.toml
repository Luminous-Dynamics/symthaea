[package]
name = "plexus-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Rust data ingestion pipeline for Symthaea Prism search"

[dependencies]
plexus-common = { path = "../plexus-common" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]

[[bin]]
name = "fetch_wikidata"
required-features = ["fetch"]

[features]
fetch = ["dep:reqwest"]

[dependencies.reqwest]
version = "0.12"
features = ["blocking", "json", "gzip"]
optional = true
