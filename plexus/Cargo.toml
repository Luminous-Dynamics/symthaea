[workspace]
resolver = "2"
members = [
    "plexus-common",
    "plexus-dom",
    "plexus-layout",
    "plexus-ingest",
    "plexus-net",
    "plexus-reflex",
    "plexus-bridge",
    "plexus-privacy",
    "plexus-search",
    "plexus-node",
    "plexus-ui",
    "plexus-shell",
    "plexus-proxy",
    "plexus-tauri",
    "plexus-serve",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
repository = "https://github.com/luminous-dynamics/plexus"
description = "Symthaea Prism — consciousness-aware pure Rust browser with epistemic search"

[workspace.dependencies]
# --- Pure Rust rendering stack ---
# HTML parsing
html5ever = "0.39"
markup5ever = "0.16"

# CSS engine (Firefox/Servo's Stylo, standalone extraction)
stylo = "0.15"
stylo_dom = "0.15"
stylo_traits = "0.15"
stylo_atoms = "0.15"
stylo_taffy = "0.2"

# Layout (flexbox, grid, block)
taffy = { version = "0.7", features = ["flexbox", "grid", "block_layout"] }

# 2D GPU rendering
vello = "0.8"
wgpu = "29"

# Window management
winit = "0.30"

# Text shaping
cosmic-text = "0.18"
skrifa = "0.40"

# --- Networking ---
reqwest = { version = "0.12", features = ["gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }

# --- Security / reflex arc ---
aho-corasick = "1"

# --- IPC ---
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Utilities ---
url = "2"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
blake3 = "1"
getrandom = { version = "0.2", features = ["js"] }  # WASM support for rand

# --- Leptos UI ---
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
ammonia = "4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
gloo-net = "0.7"
gloo-timers = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"

# --- Optional JS engine (pure Rust) ---
boa_engine = "0.21"
