[package]
name = "mycelix-edunet-ui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Leptos CSR frontend for Mycelix EduNet — pilot for ecosystem-wide Leptos migration"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
leptos_meta = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "HtmlSelectElement", "HtmlInputElement", "HtmlTextAreaElement", "EventTarget", "Window", "Navigator", "Clipboard", "Location"] }
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }

# Shared types from the edunet backend
edunet-core = { path = "../../crates/edunet-core", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
