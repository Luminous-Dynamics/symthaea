<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mycelix EduNet</title>
    <link data-trunk rel="css" href="style/main.css" />
</head>
<body>
    <!-- Spore WASM integration (loaded when available) -->
    <script id="spore-loader">
        window.__SPORE_AVAILABLE = false;
        // When Spore WASM is deployed to /spore/, this will detect and load it
        fetch('/spore/symthaea_spore_bg.wasm', { method: 'HEAD' })
            .then(r => { if (r.ok) window.__SPORE_AVAILABLE = true; })
            .catch(() => {});
    </script>

    <!-- Holochain conductor bridge — probes local conductor via WebSocket -->
    <script id="holochain-bridge">
    // Attempts a WebSocket connection to the local Holochain conductor.
    // Sets window.__HC_STATUS so the Leptos WASM app can read it via js-sys.
    // If no conductor is running, the app seamlessly falls back to mock data.
    (function() {
        window.__HC_STATUS = 'connecting';

        var WS_URL = 'ws://localhost:8888';
        var TIMEOUT_MS = 3000;

        try {
            var ws = new WebSocket(WS_URL);
            var timer = setTimeout(function() {
                ws.close();
                window.__HC_STATUS = 'mock';
                console.log('[EduNet] Conductor probe timed out — running in mock mode');
            }, TIMEOUT_MS);

            ws.onopen = function() {
                clearTimeout(timer);
                window.__HC_STATUS = 'connected';
                console.log('[EduNet] Connected to Holochain conductor at ' + WS_URL);
                // Close the probe — real zome calls will open their own connections
                ws.close();
            };

            ws.onerror = function() {
                clearTimeout(timer);
                window.__HC_STATUS = 'mock';
                console.log('[EduNet] No conductor found — running in mock mode');
            };
        } catch (e) {
            window.__HC_STATUS = 'mock';
            console.log('[EduNet] WebSocket unavailable — running in mock mode');
        }
    })();
    </script>
</body>
</html>
