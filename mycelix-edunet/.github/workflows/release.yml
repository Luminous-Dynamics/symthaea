name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: true
          prerelease: false

  build-rust:
    name: Build Rust Artifacts
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --workspace --release

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy Rust artifacts
        run: |
          cp target/release/libedunet_core.* artifacts/ || true
          cp target/release/libedunet_agg.* artifacts/ || true

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v3
        with:
          name: rust-artifacts
          path: artifacts/

  build-web:
    name: Build Web Artifacts
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build production
        working-directory: apps/web
        run: npm run build

      - name: Create tarball
        working-directory: apps/web
        run: tar -czf ../../edunet-web-${{ needs.create-release.outputs.version }}.tar.gz dist/

      - name: Upload web artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-artifacts
          path: edunet-web-*.tar.gz

  publish-crates:
    name: Publish Crates (Optional)
    needs: [create-release, build-rust]
    runs-on: ubuntu-latest
    # Only run if secrets.CARGO_REGISTRY_TOKEN is set
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish edunet-core
        working-directory: crates/edunet-core
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "Already published or publish disabled"

      - name: Publish edunet-agg
        working-directory: crates/edunet-agg
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "Already published or publish disabled"

  finalize-release:
    name: Finalize Release
    needs: [create-release, build-rust, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Display artifacts
        run: ls -R

      - name: Update release notes
        run: |
          echo "✅ Release ${{ needs.create-release.outputs.version }} built successfully"
          echo ""
          echo "## Artifacts"
          echo "- Rust crates: edunet-core, edunet-agg"
          echo "- Web client: edunet-web-${{ needs.create-release.outputs.version }}.tar.gz"
          echo ""
          echo "## Installation"
          echo "See CONTRIBUTING.md for installation instructions."
