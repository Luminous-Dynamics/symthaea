[package]
name = "mycelix-space-screener"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Automated conjunction screening daemon for mycelix-space"

[[bin]]
name = "mycelix-space-screener"
path = "src/main.rs"

[dependencies]
# Orbital mechanics (reuse existing library)
orbital-mechanics = { path = "../../lib/orbital-mechanics" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client for CelesTrak fetching (rustls for NixOS compatibility)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Time
chrono = "0.4"
