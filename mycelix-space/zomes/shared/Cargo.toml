[package]
name = "mycelix-space-shared"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Shared types and utilities for Mycelix Space zomes"

[lib]
crate-type = ["rlib"]

[dependencies]
# Holochain
hdi = { workspace = true }
hdk = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
holochain_serialized_bytes = { workspace = true }

# Orbital mechanics (no Holochain deps)
orbital-mechanics = { path = "../../lib/orbital-mechanics" }

# Time handling
chrono = { workspace = true }

# Consciousness gating (Universal Trust Fabric)
mycelix-bridge-common = { path = "../../../crates/mycelix-bridge-common", default-features = false }

# Cryptography (for ZK proofs in future)
sha3 = { workspace = true }
