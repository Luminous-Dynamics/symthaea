[workspace]
exclude = ["apps/leptos", "cli"]
members = [
    "tests",
    "zomes/legal-did/integrity",
    "zomes/legal-did/coordinator",
    "zomes/issuer-trust-tier/integrity",
    "zomes/issuer-trust-tier/coordinator",
    "zomes/cross-did-zkp/integrity",
    "zomes/cross-did-zkp/coordinator",
]

resolver = "2"

[workspace.dependencies]
hdk = "=0.6.1"
hdi = "=0.7.1"
holochain_integrity_types = "=0.6.1"
holochain_zome_types = "=0.6.1"
holo_hash = "=0.6.1"
hdk_derive = "=0.6.1"
holochain_serialized_bytes = "=0.0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom_03 = { package = "getrandom", version = "=0.3.2" }
thiserror = "2"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
mio = { git = "https://github.com/tokio-rs/mio", tag = "v1.0.3" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
eq_op = "deny"
cast_ptr_alignment = "deny"
