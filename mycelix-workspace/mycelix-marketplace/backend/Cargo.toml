[workspace]
resolver = "2"

members = [
  "crates/mycelix_common",
  # Phase 1: Core marketplace zomes (refactored and tested)
  "zomes/listings/integrity",
  "zomes/listings/coordinator",
  "zomes/reputation/integrity",
  "zomes/reputation/coordinator",
  "zomes/transactions/integrity",
  "zomes/transactions/coordinator",
  "zomes/arbitration/integrity",
  "zomes/arbitration/coordinator",
  "zomes/messaging/integrity",
  "zomes/messaging/coordinator",
  # Phase 2: Additional zomes (migrated to HDK 0.6.0/HDI 0.7.0)
  "zomes/notifications/integrity",
  "zomes/notifications/coordinator",
  "zomes/security/integrity",
  "zomes/security/coordinator",
  "zomes/search/integrity",
  "zomes/search/coordinator",
  # Utility libraries (used by coordinators as path deps)
  "zomes/security",
  "zomes/monitoring",
]

[workspace.dependencies]
# Holochain 0.6.0 dependencies
hdk = "=0.6.1"
hdi = "=0.7.1"
holochain_zome_types = "=0.6.1"
holochain_integrity_types = "=0.6.1"
holo_hash = "=0.6.1"
hdk_derive = "=0.6.1"
holochain_serialized_bytes = "=0.0.57"
serde = "=1.0.228"  # Match holochain_serialized_bytes requirement

# Additional utilities
thiserror = "2"

[profile.release]
opt-level = "z"        # Optimize for size (WASM)
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
strip = true           # Remove debug symbols
