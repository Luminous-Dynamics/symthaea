[package]
name = "threshold_signing_coordinator"
version = "0.1.0"
edition = "2024"
description = "Threshold signing coordinator zome for DKG-based collective signatures"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hdk = { workspace = true }
threshold_signing_integrity = { path = "../integrity" }
holochain_serialized_bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# WASM compatibility - force getrandom feature unification
getrandom = { workspace = true }

[features]
default = []
