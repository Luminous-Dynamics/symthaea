[workspace]
resolver = "2"
members = [
    "zomes/proposals/integrity",
    "zomes/proposals/coordinator",
    "zomes/voting/integrity",
    "zomes/voting/coordinator",
    "zomes/execution/integrity",
    "zomes/execution/coordinator",
    "zomes/constitution/integrity",
    "zomes/constitution/coordinator",
    "zomes/bridge/integrity",
    "zomes/bridge/coordinator",
    "zomes/threshold-signing/integrity",
    "zomes/threshold-signing/coordinator",
    "zomes/councils/integrity",
    "zomes/councils/coordinator",
]
exclude = ["tests"]

[workspace.dependencies]
# Holochain 0.6 compatible (per official compatibility table)
hdk = "0.6.0"
hdi = "0.7.0"
holochain_integrity_types = "0.6.0"

# Mycelix Core Types for collective sensing integration
mycelix-core-types = { path = "../Mycelix-Core/libs/mycelix-core-types", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
thiserror = "1.0"
derive_more = "0.99"

# Holochain serialized bytes for entry serialization
holochain_serialized_bytes = "0.0.56"

# WASM compatibility
# getrandom 0.2 with "js" feature for our direct usage
getrandom = { version = "0.2", features = ["js"] }
# getrandom 0.3 with "wasm_js" feature for holochain_nonce transitive dep
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
