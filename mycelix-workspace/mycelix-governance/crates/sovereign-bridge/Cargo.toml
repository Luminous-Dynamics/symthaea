[package]
name = "sovereign-bridge"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics"]
description = "Cross-component bridge for Mycelix Sovereign: links Athena triage to Governance/Ledger."
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
mycelix-crypto = { path = "../../../mycelix-identity/crates/mycelix-crypto", features = ["native"] }
