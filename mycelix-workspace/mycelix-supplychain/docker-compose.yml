version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mycelix-postgres
    environment:
      POSTGRES_DB: mycelix
      POSTGRES_USER: mycelix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycelix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mycelix-network

  # Mycelix ERP Service
  service:
    build:
      context: ./rust
      dockerfile: ../docker/Dockerfile.service
    container_name: mycelix-erp
    environment:
      DATABASE_URL: postgresql://mycelix:${POSTGRES_PASSWORD}@postgres:5432/mycelix
      FIN_DATABASE_URL: postgresql://mycelix:${POSTGRES_PASSWORD}@postgres:5432/mycelix
      RUST_LOG: info,mycelix_erp_service=debug
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mycelix-network
    volumes:
      - ./rust:/app:ro
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: mycelix-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - mycelix-network
    depends_on:
      - service

  # ERP Dashboard (Next.js)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: mycelix-dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      service:
        condition: service_healthy
    networks:
      - mycelix-network

  # Grafana (moved to port 3001 to avoid conflict with dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: mycelix-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - mycelix-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  cargo_cache:
    driver: local
  target_cache:
    driver: local

networks:
  mycelix-network:
    driver: bridge
