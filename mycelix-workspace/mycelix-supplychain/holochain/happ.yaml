---
manifest_version: "0"
name: supplychain
description: |
  A decentralized supply chain provenance tracking system with verifiable claims
  and cross-hApp bridge capabilities.
roles:
  - name: supplychain
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: ./dna/supplychain.dna
      modifiers:
        network_seed: ~
        properties: ~
      clone_limit: 0
