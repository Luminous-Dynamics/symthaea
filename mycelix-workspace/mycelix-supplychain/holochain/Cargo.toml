[workspace]
resolver = "2"

members = [
    "zomes/procurement/integrity",
    "zomes/procurement/coordinator",
    "zomes/inventory/integrity",
    "zomes/inventory/coordinator",
    "zomes/logistics/integrity",
    "zomes/logistics/coordinator",
    "zomes/payments/integrity",
    "zomes/payments/coordinator",
    "zomes/trust/integrity",
    "zomes/trust/coordinator",
    "zomes/claims/integrity",
    "zomes/claims/coordinator",
    "zomes/verification/integrity",
    "zomes/verification/coordinator",
    "zomes/bridge/integrity",
    "zomes/bridge/coordinator",
    "crates/dpp-zkp",
]

[workspace.dependencies]
# Holochain 0.6.0 dependencies
hdk = "0.6.0"
hdi = "0.7.0"
holochain_serialized_bytes = "=0.0.57"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0"
mycelix-bridge-common = { path = "../../crates/mycelix-bridge-common" }
thiserror = "1"

# WASM Compatibility
getrandom = { version = "0.2", features = ["custom"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# Shared helpers
mycelix-zome-helpers = { path = "../../mycelix-workspace/crates/mycelix-zome-helpers" }

# ZKP verification for provenance chain proofs
mycelix-zkp-core = { path = "../../crates/mycelix-zkp-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
