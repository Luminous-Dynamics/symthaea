# mycelix-supplychain has TWO nested workspaces:
#   holochain/Cargo.toml — WASM zomes (holochain 0.6, getrandom_backend="custom")
#   rust/Cargo.toml      — native ERP backend (axum, sqlx, tokio)
# Each has its own [workspace.dependencies] with incompatible constraints.
#
# This outer manifest exists ONLY to stop Cargo from auto-discovering the
# two nested workspaces as one (which fails because the dep graphs conflict).
# Build from the appropriate nested workspace root:
#   cd holochain && cargo build --workspace --target wasm32-unknown-unknown --release
#   cd rust     && cargo check --workspace

[workspace]
resolver = "2"
members = []
exclude = ["holochain", "rust"]

