[workspace]
resolver = "2"
members = [
    "zomes/incidents/integrity",
    "zomes/incidents/coordinator",
    "zomes/triage/integrity",
    "zomes/triage/coordinator",
    "zomes/resources/integrity",
    "zomes/resources/coordinator",
    "zomes/coordination/integrity",
    "zomes/coordination/coordinator",
    "zomes/shelters/integrity",
    "zomes/shelters/coordinator",
    "zomes/comms/integrity",
    "zomes/comms/coordinator",
    "zomes/bridge/integrity",
    "zomes/bridge/coordinator",
]

[workspace.dependencies]
hdk = "0.6.0"
hdi = "0.7.0"
holochain_integrity_types = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
derive_more = "0.99"
holochain_serialized_bytes = "0.0.56"
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
