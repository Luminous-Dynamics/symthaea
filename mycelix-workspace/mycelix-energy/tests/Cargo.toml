[package]
name = "mycelix-energy-tests"
version = "0.1.0"
edition = "2024"
description = "Comprehensive test suite for mycelix-energy hApp"
publish = false
autotests = false

[dependencies]
# Holochain testing dependencies (NO zome crate imports to avoid duplicate symbols)
hdk = "0.6"
hdi = "0.7"

# Async runtime for tests

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Serialization (msgpack for Holochain entry deserialization)
rmp-serde = "1.1"

# Sweettest Integration Tests (conductor-based)
[[test]]
name = "sweettest_integration"
path = "sweettest_integration.rs"

[dev-dependencies]
holochain = { version = "0.6", features = ["test_utils", "sweettest"] }
holochain_types = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
