---
# Mycelix Unified hApp (Testable Subset)
# Includes all clusters with packed DNAs. Excludes manufacturing, music,
# energy, knowledge, climate, praxis (add when DNAs are packed).
manifest_version: "0"
name: mycelix-unified-testable
description: |
  Testable Mycelix platform — 10 cluster DNAs for cross-cluster integration testing.

roles:
  - name: personal
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: ./personal/dna/mycelix_personal.dna
      modifiers:
        network_seed: ~
        properties: ~
      clone_limit: 0

  - name: identity
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: ./identity/dna/mycelix_identity_dna.dna
      modifiers:
