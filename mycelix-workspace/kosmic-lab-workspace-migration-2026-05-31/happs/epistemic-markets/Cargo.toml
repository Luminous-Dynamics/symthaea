[workspace]
members = [
    "zomes/markets",
    "zomes/predictions",
    "zomes/resolution",
    "zomes/scoring",
    "zomes/question_markets",
    "zomes/markets_bridge",
    "research",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/mycelix-epistemic-markets"

[workspace.dependencies]
# Holochain 0.6 - Updated 2026-01-09 per official compatibility table
hdk = "0.6.0"
hdi = "0.7.0"
holochain_integrity_types = "0.6.0"
holochain_serialized_bytes = "0.0.56"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WASM Compatibility - getrandom 0.2 with "js" feature for Holochain WASM runtime
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# Mycelix SDK (workspace-local)
mycelix-sdk = { path = "../../sdk" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
