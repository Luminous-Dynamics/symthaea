[package]
name = "mycelix-sdk"
version = "0.1.0"
edition = "2024"
description = "Mycelix SDK - Shared library for the Mycelix Conscious Ecosystem"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luminous-dynamics/mycelix"

[features]
default = ["simulation"]
holochain = []
standalone = []
ts-export = ["ts-rs"]
wasm = ["wasm-bindgen", "js-sys"]
parallel = ["rayon"]
simulation = []
risc0 = []

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["sync", "time"], optional = true }

# Cryptography
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
rand = "0.8"
rand_distr = "0.4"
subtle = "2.5"
base64 = "0.21"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
zeroize = { version = "1.7", features = ["derive"] }
hex = "0.4"
bincode = "1.3"

# Matrix operations (for Phi measurement, HyperFeel)
ndarray = "0.15"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Regex for sanitization
regex = "1.10"
once_cell = "1.19"

# TypeScript bindings (optional)
ts-rs = { version = "7.0", optional = true }

# WASM bindings (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

# Parallel processing (optional)
rayon = { version = "1.8", optional = true }

# Thiserror for error handling
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"
proptest = "1.4"

[lib]
name = "mycelix_sdk"
path = "src/lib.rs"
