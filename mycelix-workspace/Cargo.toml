log = "0.4"
url = "2.5"
# Cryptography
# crypto-common — do NOT pin here; aead 0.6.0-rc.2 requires the rc.4 line (has os_rng); stable 0.2.x does not.
aead = { version = "0.6.0-rc.2", default-features = false }
aes-gcm = { version = "0.10.3", default-features = false }
# ml-dsa = { version = "0.1.1", default-features = false }  # DISABLED: ml-dsa 0.1.1 uses crypto-common ^0.2 stable
# which conflicts with aead 0.6.0-rc.2 (iroh-holochain) needing crypto-common 0.2.0-rc.4 (os_rng feature).
# ml-kem = "0.3.0-rc.0"  # DISABLED: ml-kem → kem → crypto-common ^0.2 stable conflicts with aead 0.6.0-rc.2
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
