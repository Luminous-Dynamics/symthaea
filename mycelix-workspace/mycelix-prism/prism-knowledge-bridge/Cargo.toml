[package]
name = "prism-knowledge-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bidirectional bridge between Prism HDC search and Knowledge DHT"

[dependencies]
prism-common = { path = "../prism-common" }
mycelix-claim-types = { path = "../../crates/mycelix-claim-types" }
mycelix-leptos-client = { path = "../../crates/mycelix-leptos-client", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[features]
default = []
dht = ["dep:mycelix-leptos-client"]
