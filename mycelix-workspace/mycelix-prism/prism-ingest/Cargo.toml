[package]
name = "prism-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Rust data ingestion pipeline for Prism search"

[dependencies]
prism-common = { path = "../prism-common" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]

[[bin]]
name = "fetch_wikidata"
required-features = ["fetch"]

[[bin]]
name = "build_corpus"
required-features = ["fetch"]

[features]
fetch = ["dep:reqwest"]

[dependencies.reqwest]
version = "0.12"
features = ["blocking", "json", "gzip"]
optional = true
