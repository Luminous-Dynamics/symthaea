[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelix-py"
version = "0.1.0"
description = "Python SDK for Mycelix-DeSci decentralized science platform"
authors = [{name = "Luminous Dynamics"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["desci", "decentralized-science", "blockchain", "research", "science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.0.270",
]
async = ["httpx[http2]>=0.24.0"]

[project.urls]
Homepage = "https://github.com/Luminous-Dynamics/mycelix-desci"
Documentation = "https://github.com/Luminous-Dynamics/mycelix-desci/tree/main/docs"
Repository = "https://github.com/Luminous-Dynamics/mycelix-desci"
"Bug Tracker" = "https://github.com/Luminous-Dynamics/mycelix-desci/issues"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
