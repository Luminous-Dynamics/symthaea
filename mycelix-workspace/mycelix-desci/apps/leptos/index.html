<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mycelix DeSci — Epistemic Verification Engine</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
    <meta name="description" content="Search 208 physics equations, verify scientific claims, and track reproducibility — powered by hyperdimensional computing.">
    <meta property="og:title" content="Mycelix DeSci — Epistemic Verification Engine">
    <meta property="og:description" content="The world's first epistemic verification engine for science. 208 equations, 20 domains, LEM Cube classification.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://desci.mycelix.net">
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!-- KaTeX for equation rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-glass: rgba(17, 24, 39, 0.8);
            --border-glass: rgba(99, 102, 241, 0.2);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
            --tier-e0: #ef4444;
            --tier-e1: #f59e0b;
            --tier-e2: #3b82f6;
            --tier-e3: #06b6d4;
            --tier-e4: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-indigo);
            text-decoration: none;
            margin-right: 2rem;
        }

        .navbar .nav-links {
            display: flex;
            gap: 1rem;
        }

        .navbar .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: color 0.2s, background 0.2s;
        }

        .navbar .nav-links a:hover,
        .navbar .nav-links a.active {
            color: var(--text-primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 0.75rem;
            padding: 1.5rem;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-indigo);
        }

        .stat-card .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .claim-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .claim-card {
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .claim-card:hover {
            border-color: var(--accent-indigo);
        }

        .claim-card .claim-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin: 0.75rem 0;
            line-height: 1.5;
        }

        .claim-card .claim-meta {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .lem-badge {
            display: inline-flex;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .lem-badge.e0 { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .lem-badge.e1 { background: rgba(245,158,11,0.2); color: #fcd34d; }
        .lem-badge.e2 { background: rgba(59,130,246,0.2); color: #93c5fd; }
        .lem-badge.e3 { background: rgba(6,182,212,0.2); color: #67e8f9; }
        .lem-badge.e4 { background: rgba(16,185,129,0.2); color: #6ee7b7; }

        .search-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .search-bar input, .search-bar select {
            padding: 0.5rem 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: 0.375rem;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .search-bar input { flex: 1; }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-primary { background: var(--accent-indigo); color: white; }
        .btn-emerald { background: var(--accent-emerald); color: white; }

        .discovery-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-glass);
        }

        .discovery-result .score {
            font-family: monospace;
            color: var(--accent-emerald);
            font-weight: 600;
        }

        .discovery-result .domain {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Smooth transitions */
        a, button, .glass-panel { transition: all 0.2s ease; }

        /* Better focus states for accessibility */
        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--accent-indigo);
            outline-offset: 2px;
        }

        /* Navbar active link */
        .navbar .nav-links a {
            transition: color 0.2s, background 0.2s;
        }

        @media (max-width: 768px) {
            .navbar .nav-links { display: none; }
            .claim-grid { grid-template-columns: 1fr; }
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            .page-container { padding: 1rem; }
            .page-title { font-size: 1.25rem; }
        }

        @media (max-width: 480px) {
            .stat-grid { grid-template-columns: 1fr; }
            .navbar .logo { font-size: 1rem; }
        }
    </style>
</head>
<body></body>
</html>
