<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mycelix Civic</title>
    <link data-trunk rel="css" href="style/main.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖</text></svg>" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Static assets copied into dist/ by Trunk -->
    <link data-trunk rel="copy-file" href="static/manifest.json" />
    <link data-trunk rel="copy-file" href="static/sw.js" />
    <link data-trunk rel="copy-file" href="static/icon.svg" />
</head>
<body>
    <!-- Service Worker registration (PWA offline support) -->
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function() {
            console.log('[Civic] Service Worker registered');
        }).catch(function(err) {
            console.log('[Civic] SW registration failed:', err);
        });
    }
    </script>
</body>
</html>
