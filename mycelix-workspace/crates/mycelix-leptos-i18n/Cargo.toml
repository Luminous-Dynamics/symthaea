[package]
name = "mycelix-leptos-i18n"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Shared i18n for Mycelix Leptos frontends — 18 languages (11 SA + 7 global)"

[dependencies]
leptos = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Storage", "Document", "Element", "HtmlElement"] }
