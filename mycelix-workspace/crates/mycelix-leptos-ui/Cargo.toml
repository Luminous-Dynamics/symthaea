[package]
name = "mycelix-leptos-ui"
version = "0.1.0"
edition = "2024"
authors = ["Tristan Stoltz / Luminous Dynamics"]
description = "Shared UI components for Mycelix Leptos frontends."

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
lucide-leptos = "0.1"
serde = { version = "1.0", features = ["derive"] }
mycelix-leptos-client = { path = "../mycelix-leptos-client" }
sovereign-profile = { path = "../../../crates/sovereign-profile" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }
gloo-timers = { version = "0.3", features = ["futures"] }
