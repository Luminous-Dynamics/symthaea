[package]
name = "mycelix_property_shared"
version = "0.1.0"
edition = "2024"
description = "Shared utilities for Mycelix Property zomes - batch queries and common types"

[lib]
crate-type = ["cdylib", "rlib"]
name = "mycelix_property_shared"

[dependencies]
hdk = { workspace = true }
holo_hash = { version = "0.6", features = ["hashing"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
