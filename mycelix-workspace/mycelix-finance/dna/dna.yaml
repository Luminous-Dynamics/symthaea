---
# Mycelix Finance DNA
# P2P lending, credit scoring, and value transfer

manifest_version: "0"
name: mycelix_finance
integrity:
  network_seed: ~
  properties:
    # Credit scoring configuration
    min_credit_score: 0.0
    max_credit_score: 1000.0
    decay_rate: 0.01

    # Lending configuration
    max_loan_duration_days: 365
    collateralization_ratio: 1.5

    # MATL integration
    quality_weight: 0.4
    consistency_weight: 0.3
    reputation_weight: 0.3

  zomes:
    - name: credit_scoring_integrity
      path: ../target/wasm32-unknown-unknown/release/credit_scoring_integrity.wasm
    - name: lending_integrity
      path: ../target/wasm32-unknown-unknown/release/lending_integrity.wasm
    - name: payments_integrity
      path: ../target/wasm32-unknown-unknown/release/payments_integrity.wasm
    - name: treasury_integrity
      path: ../target/wasm32-unknown-unknown/release/treasury_integrity.wasm
    - name: finance_bridge_integrity
      path: ../zomes/bridge/integrity/target/wasm32-unknown-unknown/release/finance_bridge_integrity.wasm

coordinator:
  zomes:
    - name: credit_scoring
      path: ../target/wasm32-unknown-unknown/release/credit_scoring.wasm
      dependencies:
        - name: credit_scoring_integrity
    - name: lending
      path: ../target/wasm32-unknown-unknown/release/lending.wasm
      dependencies:
        - name: lending_integrity
        - name: credit_scoring_integrity
    - name: payments
      path: ../target/wasm32-unknown-unknown/release/payments.wasm
      dependencies:
        - name: payments_integrity
    - name: treasury
      path: ../target/wasm32-unknown-unknown/release/treasury.wasm
      dependencies:
        - name: treasury_integrity
        - name: payments_integrity
    - name: finance_bridge
      path: ../zomes/bridge/coordinator/target/wasm32-unknown-unknown/release/finance_bridge.wasm
      dependencies:
        - name: finance_bridge_integrity
