[package]
name = "mycelix-finance-tests"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <dev@luminous-dynamics.com>"]
license = "AGPL-3.0-or-later"
description = "Integration tests for Mycelix Finance Holochain zomes"
autotests = false

# Keep this crate out of the parent workspace
[workspace]

[dependencies]
# Payments zome dependencies
payments_integrity = { path = "../zomes/payments/integrity" }
payments = { path = "../zomes/payments/coordinator" }

# Lending zome dependencies
lending_integrity = { path = "../zomes/lending/integrity" }
lending = { path = "../zomes/lending/coordinator" }

# Credit scoring zome dependencies
credit_scoring_integrity = { path = "../zomes/credit_scoring/integrity" }
credit_scoring = { path = "../zomes/credit_scoring/coordinator" }

# Treasury zome dependencies
treasury_integrity = { path = "../zomes/treasury/integrity" }
treasury = { path = "../zomes/treasury/coordinator" }

# CGC (Civic Gifting Credits) zome dependencies
cgc_integrity = { path = "../zomes/cgc/integrity" }
cgc = { path = "../zomes/cgc/coordinator" }

# TEND (Time Exchange) zome dependencies
tend_integrity = { path = "../zomes/tend/integrity" }
tend = { path = "../zomes/tend/coordinator" }

# HEARTH (Commons Pool) zome dependencies
hearth_integrity = { path = "../zomes/hearth/integrity" }
hearth = { path = "../zomes/hearth/coordinator" }

# Holochain dependencies (0.6 compatible)
hdk = "0.6"
hdi = "0.7"

# Holochain testing dependencies
holochain = { version = "0.6", features = ["test_utils", "sweettest"] }
holochain_types = "0.6"

# Async runtime for tests
tokio = { version = "1.35", features = ["full", "test-util"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Serialization (msgpack for Holochain entry deserialization)
rmp-serde = "1.1"

# Utilities
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }

[lib]
name = "test_fixtures"
path = "fixtures/mod.rs"

# Payments Integration Tests
[[test]]
name = "payments_test"
path = "payments_test.rs"

# Lending Integration Tests
[[test]]
name = "lending_test"
path = "lending_test.rs"

# Credit Scoring Integration Tests
[[test]]
name = "credit_scoring_test"
path = "credit_scoring_test.rs"

# Treasury Integration Tests
[[test]]
name = "treasury_test"
path = "treasury_test.rs"

# Full Flow Integration Tests
[[test]]
name = "full_flow_test"
path = "full_flow_test.rs"

# CGC (Civic Gifting Credits) Tests
[[test]]
name = "cgc_test"
path = "cgc_test.rs"

# TEND (Time Exchange) Tests
[[test]]
name = "tend_test"
path = "tend_test.rs"

# HEARTH (Commons Pool) Tests
[[test]]
name = "hearth_test"
path = "hearth_test.rs"

# Sweettest Integration Tests (conductor-based)
[[test]]
name = "sweettest_integration"
path = "sweettest_integration.rs"
