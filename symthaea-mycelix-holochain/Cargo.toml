[package]
name = "symthaea-mycelix-holochain"
version = "0.1.0"
edition = "2024"
description = "Holochain conductor bridge for Symthaea — isolated crate to avoid serde conflicts"

[dependencies]
holochain_client = "=0.6.0"
holochain_types = "=0.4.0"
tokio = { version = "1", features = ["sync", "time", "rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
symthaea-iso20022 = { path = "../symthaea-iso20022" }
