[package]
name = "pitb-daps-graph-import"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
description = "Conservative importer for DAPS Lean dependency graph exports"

[[bin]]
name = "pitb-daps-graph-import"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
