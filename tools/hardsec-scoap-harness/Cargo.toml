[package]
name = "hardsec-audit-harness"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false

[workspace]

[features]
default = []
hardsec-scoap-audit = ["dep:sha2"]

[dependencies]
serde_json = "=1.0.150"
sha2 = { version = "=0.10.9", optional = true }

[[example]]
name = "hardsec_scoap_rarity_audit"
path = "../../examples/hardsec_scoap_rarity_audit.rs"
required-features = ["hardsec-scoap-audit"]
