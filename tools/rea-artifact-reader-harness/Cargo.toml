[workspace]
members = ["."]
resolver = "2"

[package]
name = "symthaea-rea-artifact-reader"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
path = "../../crates/domains/symthaea-rea-artifact-reader/src/lib.rs"

[dependencies]
sha2 = "=0.10.9"
zipcore = { version = "=0.10.2", default-features = false }

[dev-dependencies]
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
