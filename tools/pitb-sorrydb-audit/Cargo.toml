[package]
name = "pitb-sorrydb-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
description = "Pinned source and split integrity auditor for SorryDB Lean benchmark snapshots"

[[bin]]
name = "pitb-sorrydb-audit"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
