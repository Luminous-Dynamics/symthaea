[workspace]
members = ["."]
resolver = "2"

[package]
name = "rea-claim-replay-verifier"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
symthaea-rea-compat = { path = "../../crates/domains/symthaea-rea-compat" }
