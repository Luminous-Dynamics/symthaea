[package]
name = "superconductivity-observation-inverse-harness"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Specimen-linked multimodal observation and inverse-split auditor"

[workspace]
resolver = "2"

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"
jsonschema = { version = "=0.59.0", default-features = false }

[[bin]]
name = "sc_observation_inverse_audit"
path = "src/main.rs"

[[bin]]
name = "sc_observation_inverse_fit"
path = "src/bin/fit.rs"
