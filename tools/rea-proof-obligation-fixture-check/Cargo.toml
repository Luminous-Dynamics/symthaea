[workspace]
members = ["."]
resolver = "2"

[package]
name = "rea-proof-obligation-fixture-check"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rea-proof-obligation-score"
path = "src/main.rs"

[dependencies]
serde = "=1.0.228"
serde_json = "=1.0.150"
jsonschema = { version = "=0.60.2", default-features = false }
