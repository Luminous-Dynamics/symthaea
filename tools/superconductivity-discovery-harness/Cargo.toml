[package]
name = "superconductivity-discovery-harness"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline schema and evidence-semantics audit for superconductivity discovery registries"

# Standalone by design: keep this focused data-contract validator outside the
# root workspace so its checks do not inherit unrelated workspace gates.
[workspace]
resolver = "2"

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
jsonschema = { version = "=0.59.0", default-features = false }

[[bin]]
name = "sc_discovery_registry_audit"
path = "src/main.rs"

[[bin]]
name = "sc_discovery_metrics"
path = "src/bin/discovery_metrics.rs"

[[bin]]
name = "sc_observation_event_audit"
path = "src/bin/observation_event_audit.rs"

[[bin]]
name = "sc_synthesis_protocol_audit"
path = "src/bin/synthesis_protocol_audit.rs"

[[bin]]
name = "sc_pair_coherence_audit"
path = "src/bin/pair_coherence_audit.rs"

[[bin]]
name = "sc_reaction_selectivity_audit"
path = "src/bin/reaction_selectivity_audit.rs"

[[bin]]
name = "sc_thermochemical_network_audit"
path = "src/bin/thermochemical_network_audit.rs"

[[bin]]
name = "sc_transport_kinetic_selectivity_audit"
path = "src/bin/transport_kinetic_selectivity_audit.rs"

[[bin]]
name = "sc_spatial_reaction_diffusion_audit"
path = "src/bin/spatial_reaction_diffusion_audit.rs"

[[bin]]
name = "sc_onset_prediction_audit"
path = "src/bin/onset_prediction_audit.rs"

[[bin]]
name = "sc_precursor_genome_graph_audit"
path = "src/bin/precursor_genome_graph_audit.rs"
