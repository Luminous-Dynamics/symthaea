[package]
name = "hardsec-family-audit-harness"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false

# Nested workspace isolates the example from the root workspace's incomplete
# globbed member set while compiling the exact checked-in source file.
[workspace]

[features]
default = []
hardsec-family-audit = ["dep:sha2"]

[dependencies]
serde_json = "=1.0.150"
sha2 = { version = "=0.10.9", optional = true }

[[example]]
name = "hardsec_family_split_audit"
path = "../../examples/hardsec_family_split_audit.rs"
required-features = ["hardsec-family-audit"]
