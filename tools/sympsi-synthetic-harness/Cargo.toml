[package]
name = "sympsi-synthetic-harness"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline synthetic qualification harness for Symthaea AIA research"

# This package is intentionally its own workspace. It does not alter the root
# workspace, exclude members, or weaken repository-wide validation.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
