[package]
name = "room-stress-qualifier"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Independent fail-closed JSON Schema and semantic validator for synthetic room-imagination stress fixtures"

[[bin]]
name = "room-stress-qualifier"
path = "src/main.rs"

[dependencies]
jsonschema = { version = "=0.59.0", default-features = false }
serde_json = "1.0"
sha2 = "0.10"

# Keep the checker outside Symthaea's main workspace: it is a small independent
# qualification tool, not a production runtime dependency of the cognition stack.
[workspace]
