[package]
name = "superconductivity-discovery-benchmark-auditor"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Leakage and evidence-authority auditor for superconductivity discovery benchmark contracts"

[workspace]
resolver = "2"

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"
jsonschema = { version = "=0.59.0", default-features = false }

[[bin]]
name = "sc_discovery_benchmark_audit"
path = "src/main.rs"
