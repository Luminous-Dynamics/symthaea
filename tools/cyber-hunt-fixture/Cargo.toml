[package]
name = "cyber-hunt-fixture"
version = "0.1.0"
edition = "2024"
publish = false
description = "Deterministic synthetic event-store generator for defensive threat-hunting evaluation"

# Keep this native-only research tool isolated from Symthaea's large workspace.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
# Validate the schema documents themselves against their draft meta-schemas.
# All remote/file resolution features stay disabled; tests are offline by design.
jsonschema = { version = "=0.59.0", default-features = false }
