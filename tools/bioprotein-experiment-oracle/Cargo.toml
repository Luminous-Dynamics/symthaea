[package]
name = "bioprotein-experiment-oracle"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Synthetic-first exact EVSI benchmark for bioprotein research prioritization"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[workspace]

[[bin]]
name = "bioprotein-robust-evsi"
path = "src/robust_main.rs"

[[bin]]
name = "bioprotein-evsi-regret"
path = "src/regret_main.rs"
