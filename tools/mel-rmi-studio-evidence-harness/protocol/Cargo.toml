[package]
name = "symthaea-muse-protocol"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Shared wire types for the muse_studio HTTP API — serde-only, no audio/ONNX/native deps, compiles for wasm32 and native alike"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
