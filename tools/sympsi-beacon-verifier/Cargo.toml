[package]
name = "sympsi-beacon-verifier"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline Quicknet beacon signature verifier for SYMPsi custody research"

[workspace]
resolver = "2"

[dependencies]
drandite-core = "=0.1.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
