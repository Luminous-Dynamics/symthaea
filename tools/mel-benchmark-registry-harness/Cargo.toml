[package]
name = "mel-benchmark-registry-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
