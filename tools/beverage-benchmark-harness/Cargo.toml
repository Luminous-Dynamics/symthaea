[package]
name = "beverage-benchmark-harness"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline schema and synthetic-fixture contract auditor for beverage research"

# This is a deliberately standalone workspace. The monorepo workspace currently
# contains unrelated incomplete research paths; this focused harness does not
# modify or weaken the root workspace-integrity gate.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
jsonschema = { version = "=0.59.0", default-features = false }

[[bin]]
name = "schema_contract_audit"
path = "src/bin/schema_contract_audit.rs"
