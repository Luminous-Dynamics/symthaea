[package]
name = "hardsec-trace-lineage-audit-harness"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false

# Isolated nested workspace compiles the exact tracked example.
[workspace]

[features]
default = []
hardsec-trace-lineage-audit = []

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[[example]]
name = "hardsec_trace_lineage_audit"
path = "../../examples/hardsec_trace_lineage_audit.rs"
required-features = ["hardsec-trace-lineage-audit"]
