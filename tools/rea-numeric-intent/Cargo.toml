[workspace]
members = ["."]
resolver = "2"

[package]
name = "rea-numeric-intent"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
rea-numeric-lexeme-audit = { path = "../rea-numeric-lexeme-audit" }
symthaea-rea-compat = { path = "../../crates/domains/symthaea-rea-compat" }

[[bin]]
name = "rea-numeric-intent"
path = "src/main.rs"
