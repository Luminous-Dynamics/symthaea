[package]
name = "rust-repair-benchmark-harness"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Isolated compile/test harness for the Rust repair benchmark audit binaries"

# Deliberately standalone: the root monorepo workspace glob currently includes
# a source-only directory with no Cargo.toml. This harness compiles the exact
# tracked audit source files without excluding or bypassing the workspace gate.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[[bin]]
name = "rust-repair-manifest"
path = "../../src/bin/rust_repair_manifest.rs"

[[bin]]
name = "rust-repair-score-audit"
path = "../../src/bin/rust_repair_score_audit.rs"

[[bin]]
name = "rust-repair-trial-compare"
path = "../../src/bin/rust_repair_trial_compare.rs"
