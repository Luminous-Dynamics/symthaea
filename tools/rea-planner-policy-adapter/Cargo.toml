[workspace]
members = ["."]
resolver = "2"

[package]
name = "rea-planner-policy-adapter"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Thin matched-policy adapter for existing REA investigation planners"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rea-planner-policy-adapter"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"
symthaea-rea-investigator = { path = "../../crates/domains/symthaea-rea-investigator" }
