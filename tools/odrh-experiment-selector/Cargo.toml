[package]
name = "odrh-experiment-selector"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
description = "Deterministic, fail-closed reference selector for synthetic display-metrology experiment plans"
repository = "https://github.com/Luminous-Dynamics/symthaea"
publish = false

[dependencies]
jsonschema = { version = "=0.59.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[workspace]
resolver = "3"
