[package]
name = "scdft-sctk-replay-auditor"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline Git blob verifier and evidence auditor for upstream SCTK Pb replay examples"

[workspace]
resolver = "2"

[dependencies]
serde_json = "=1.0.150"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
jsonschema = { version = "=0.59.0", default-features = false }

[[bin]]
name = "scdft_sctk_replay_audit"
path = "src/main.rs"
