[package]
name = "sym-rsi-causal-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false
description = "Offline reference validator and 2x2 causal contrast checker for Symthaea RSI research"

# Keep this research tool outside the production workspace. It has no runtime
# authority and must not become an implicit dependency of Symthaea.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
