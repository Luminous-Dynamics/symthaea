[package]
name = "hardsec-adaptive-evasion-audit-harness"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false

# Isolated nested workspace compiles the exact tracked example.
[workspace]

[features]
default = []
hardsec-adaptive-evasion-audit = []
hardsec-benchmark-plan-audit = []
hardsec-pmu-metrology-audit = []
hardsec-context-sequential-monitor = []
hardsec-context-cctm-monitor = []
hardsec-context-assignment-audit = []
hardsec-context-restarted-cctm-monitor = []
hardsec-temporal-dependence-audit = []
hardsec-markov-conditional-rank-oracle = []
hardsec-markov-transition-cs-audit = []
hardsec-mobile-device-profile-audit = []

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[[example]]
name = "hardsec_adaptive_evasion_audit"
path = "../../examples/hardsec_adaptive_evasion_audit.rs"
required-features = ["hardsec-adaptive-evasion-audit"]

[[example]]
name = "hardsec_benchmark_plan_audit"
path = "../../examples/hardsec_benchmark_plan_audit.rs"
required-features = ["hardsec-benchmark-plan-audit"]

[[example]]
name = "hardsec_pmu_metrology_audit"
path = "../../examples/hardsec_pmu_metrology_audit.rs"
required-features = ["hardsec-pmu-metrology-audit"]

[[example]]
name = "hardsec_context_sequential_monitor"
path = "../../examples/hardsec_context_sequential_monitor.rs"
required-features = ["hardsec-context-sequential-monitor"]

[[example]]
name = "hardsec_context_cctm_monitor"
path = "../../examples/hardsec_context_cctm_monitor.rs"
required-features = ["hardsec-context-cctm-monitor"]

[[example]]
name = "hardsec_context_assignment_audit"
path = "../../examples/hardsec_context_assignment_audit.rs"
required-features = ["hardsec-context-assignment-audit"]

[[example]]
name = "hardsec_context_restarted_cctm_monitor"
path = "../../examples/hardsec_context_restarted_cctm_monitor.rs"
required-features = ["hardsec-context-restarted-cctm-monitor"]

[[example]]
name = "hardsec_temporal_dependence_audit"
path = "../../examples/hardsec_temporal_dependence_audit.rs"
required-features = ["hardsec-temporal-dependence-audit"]

[[example]]
name = "hardsec_markov_conditional_rank_oracle"
path = "../../examples/hardsec_markov_conditional_rank_oracle.rs"
required-features = ["hardsec-markov-conditional-rank-oracle"]

[[example]]
name = "hardsec_markov_transition_cs_audit"
path = "../../examples/hardsec_markov_transition_cs_audit.rs"
required-features = ["hardsec-markov-transition-cs-audit"]

[[example]]
name = "hardsec_mobile_device_profile_audit"
path = "../../examples/hardsec_mobile_device_profile_audit.rs"
required-features = ["hardsec-mobile-device-profile-audit"]
