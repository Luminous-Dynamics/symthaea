[workspace]
members = ["."]
resolver = "2"

[package]
name = "rea-member-receipt-harness"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rea-receipt-replay"
path = "src/bin/rea-receipt-replay.rs"

[dependencies]
base64 = "=0.22.1"
serde = "=1.0.229"
serde_json = "=1.0.151"
jsonschema = { version = "=0.60.2", default-features = false }
serde_json_canonicalizer = "=0.4.1"
libc = "=0.2.191"
sha2 = "=0.10.9"
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
