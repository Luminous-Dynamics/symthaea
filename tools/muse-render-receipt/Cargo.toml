[workspace]
resolver = "3"

[package]
name = "muse-render-receipt"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Independent integrity verifier for MUSE score-to-render execution receipts"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
midly = "0.5"
hound = "3.5"
