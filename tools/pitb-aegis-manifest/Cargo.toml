[package]
name = "pitb-aegis-manifest"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed integrity verifier for frozen PITB Aegis task manifests"

[[bin]]
name = "pitb-aegis-manifest"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
