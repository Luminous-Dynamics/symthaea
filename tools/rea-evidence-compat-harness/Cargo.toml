[workspace]
members = ["."]
resolver = "2"

[package]
name = "symthaea-rea-compat"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
path = "../../crates/domains/symthaea-rea-compat/src/lib.rs"

[[test]]
name = "upstream_generated"
path = "../../crates/domains/symthaea-rea-compat/tests/upstream_generated.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
serde_json_canonicalizer = "=0.3.2"
sha2 = { version = "=0.10.9", features = ["oid"] }

[[test]]
name = "root_mobile_policy_adapter"
path = "tests/root_mobile_policy_adapter.rs"
