[package]
name = "ev-battery-observation-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
publish = false
description = "Strict, evidence-class-preserving audit for EV battery telemetry observation batches"

[workspace]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
jsonschema = "0.58.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
