[package]
name = "development-map-validator"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Read-only EGDDM validator and Cargo manifest projection library"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[workspace]
