[package]
name = "hardsec-activation-audit-harness"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false

# Nested workspace keeps this targeted example independent of the incomplete
# root workspace member glob while compiling the exact tracked source file.
[workspace]

[features]
default = []
hardsec-activation-audit = ["dep:sha2"]

[dependencies]
serde_json = "=1.0.150"
sha2 = { version = "=0.10.9", optional = true }

[[example]]
name = "hardsec_activation_campaign_audit"
path = "../../examples/hardsec_activation_campaign_audit.rs"
required-features = ["hardsec-activation-audit"]
