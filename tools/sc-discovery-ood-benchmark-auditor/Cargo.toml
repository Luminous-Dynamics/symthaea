[package]
name = "sc-discovery-ood-benchmark-auditor"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Leakage-resistant superconductivity discovery benchmark auditor"

[workspace]
resolver = "2"

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"
jsonschema = { version = "=0.59.0", default-features = false }

[[bin]]
name = "sc_discovery_ood_audit"
path = "src/main.rs"

[[bin]]
name = "sc_feasibility_gate_audit"
path = "src/bin/sc_feasibility_gate_audit.rs"
