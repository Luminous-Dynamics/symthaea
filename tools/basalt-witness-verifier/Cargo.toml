[package]
name = "basalt-witness-verifier"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Pinned-trust-store DSSE/JCS threshold verifier for BASALT authority witnesses"

[workspace]
resolver = "2"

[dependencies]
base64 = "=0.22.1"
dsse = "=0.1.6"
ed25519-dalek = "=3.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_json_canonicalizer = "=0.4.1"
sha2 = "=0.11.0"
