[package]
name = "ceb-receipt-verifier"
version = "0.1.0"
edition = "2024"
publish = false
description = "Offline verifier for signed Computational Engineering Bench receipts"

# Keep this verifier independently buildable outside the root workspace.
[workspace]

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
clap = { version = "=4.6.1", features = ["derive"] }
ed25519-dalek = "=2.1.0"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
jsonschema = { version = "=0.33.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
