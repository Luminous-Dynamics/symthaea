[package]
name = "luminous-eqc-reference"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Standalone reference validator for Evidence-Qualified Capability benchmark v0.1"

[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
ed25519-dalek = { version = "=3.0.0", default-features = true }
jsonschema = { version = "=0.63.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.4.1"
sha2 = "0.10"
