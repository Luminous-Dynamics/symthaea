[package]
name = "eqc-reference"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Standalone Evidence-Qualified Capability seed reference evaluator"

[dependencies]
anyhow = "=1.0.102"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

# Keep this nested workspace independent of Symthaea's root workspace graph.
[workspace]
resolver = "2"
