[workspace]
members = ["."]
resolver = "2"

[package]
name = "rea-formal-envelope-fuzz-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
serde_json_canonicalizer = "=0.3.2"
sha2 = { version = "=0.10.9", features = ["oid"] }
symthaea-rea-compat = { path = "../../crates/domains/symthaea-rea-compat" }
