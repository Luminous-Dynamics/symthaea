[workspace]
members = ["."]
resolver = "2"

[package]
name = "rea-numeric-lexeme-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
rea-numeric-lexeme-fuzz-support = { path = ".." }
rea-numeric-lexeme-audit = { path = "../../rea-numeric-lexeme-audit" }

[[bin]]
name = "raw_numeric_lexemes"
path = "fuzz_targets/raw_numeric_lexemes.rs"
test = false
doc = false
bench = false
