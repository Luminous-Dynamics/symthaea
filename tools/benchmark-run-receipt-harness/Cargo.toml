[workspace]
members = ["."]
resolver = "2"

[package]
name = "benchmark-run-receipt-validator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Fail-closed semantic validator for benchmark run receipts"

[lib]
name = "benchmark_run_receipt_validator"
path = "src/lib.rs"

[[bin]]
name = "benchmark-run-receipt-validate"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
