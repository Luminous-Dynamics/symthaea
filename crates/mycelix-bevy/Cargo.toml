[package]
name = "mycelix-bevy"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bevy SDK for building 3D/spatial Mycelix extensions"

[dependencies]
bevy_app = "0.15"
bevy_ecs = "0.15"
bevy_color = "0.15"
bevy_log = "0.15"
serde = { version = "1", features = ["derive"] }
mycelix-cluster-manifest = { path = "../mycelix-cluster-manifest" }
