[package]
name = "symthaea-iot-actuation-effect-outcome-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Guard-owned verification of challenge-bound physical-effect outcome evidence"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["iot", "safety", "attestation", "reconciliation"]
categories = ["embedded"]

[dependencies]
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
symthaea-authority = { path = "../../core/symthaea-authority" }
symthaea-iot-actuation-effect-reconciliation-challenge = { path = "../symthaea-iot-actuation-effect-reconciliation-challenge" }
thiserror = { workspace = true }

[dev-dependencies]
symthaea-iot-actuation-effect-attempt-journal = { path = "../symthaea-iot-actuation-effect-attempt-journal" }
symthaea-iot-actuation-effect-dispatch = { path = "../symthaea-iot-actuation-effect-dispatch", features = ["qualification-legacy-unjournaled"] }
