[package]
name = "symthaea-iot-transport-receipt"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Validation of signed transport evidence for fail-closed IoT safety"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["iot", "safety", "validation"]
categories = ["embedded"]

[dependencies]
bincode = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde-big-array = "0.5.1"
symthaea-authority = { path = "../../core/symthaea-authority" }
symthaea-iot-device-protocol = { path = "../symthaea-iot-device-protocol" }
thiserror = { workspace = true }

[dev-dependencies]
symthaea-action-checkpoint = { path = "../../core/symthaea-action-checkpoint" }
symthaea-iot-durable-runtime = { path = "../symthaea-iot-durable-runtime" }
symthaea-iot-policy = { path = "../symthaea-iot-policy" }
symthaea-iot-posture = { path = "../symthaea-iot-posture" }
