[package]
name = "symthaea-iot-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Crash-conservative reservation/checkpoint bridge for bounded cyber-physical execution"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["iot", "cyber-physical", "safety", "runtime"]
categories = ["embedded", "authentication"]

[dependencies]
symthaea-authority = { path = "../../core/symthaea-authority" }
symthaea-action-runtime = { path = "../../core/symthaea-action-runtime" }
symthaea-action-checkpoint = { path = "../../core/symthaea-action-checkpoint" }
symthaea-iot-execution = { path = "../symthaea-iot-execution" }
thiserror = { workspace = true }

[dev-dependencies]
symthaea-iot-authority = { path = "../symthaea-iot-authority" }
