[package]
name = "symthaea-assurance-continuity-qualified-bootstrap-release"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Consume confined-bootstrap and executable-continuity capabilities before ptrace release"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["assurance", "ptrace", "bootstrap", "release", "linux"]
categories = ["development-tools", "os"]

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
symthaea-assurance-bootstrap-executable-mapping-continuity = { path = "../symthaea-assurance-bootstrap-executable-mapping-continuity" }
symthaea-assurance-bootstrap-syscall-confinement = { path = "../symthaea-assurance-bootstrap-syscall-confinement" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", any(target_env = "gnu", target_env = "musl")))'.dependencies]
nix = { version = "0.26.4", features = ["process", "ptrace", "signal"] }
