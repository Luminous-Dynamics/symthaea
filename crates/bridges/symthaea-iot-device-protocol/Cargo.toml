[package]
name = "symthaea-iot-device-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Canonical cyber-physical effect envelope and crash-conservative device semantic acceptance"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["iot", "cyber-physical", "protocol", "safety"]
categories = ["embedded", "authentication"]

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
symthaea-action-runtime = { path = "../../core/symthaea-action-runtime" }
symthaea-authority = { path = "../../core/symthaea-authority" }
symthaea-iot-actuation = { path = "../symthaea-iot-actuation" }
symthaea-iot-authority = { path = "../symthaea-iot-authority" }
symthaea-iot-durable-runtime = { path = "../symthaea-iot-durable-runtime" }
symthaea-iot-egress-guard = { path = "../symthaea-iot-egress-guard" }
symthaea-iot-policy = { path = "../symthaea-iot-policy" }
symthaea-iot-posture = { path = "../symthaea-iot-posture" }
thiserror = { workspace = true }

[dev-dependencies]
symthaea-action-checkpoint = { path = "../../core/symthaea-action-checkpoint" }
