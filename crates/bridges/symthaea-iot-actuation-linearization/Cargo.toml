[package]
name = "symthaea-iot-actuation-linearization"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Closure-scoped linearization of current IoT actuation evidence without HAL I/O"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["iot", "security", "actuation", "linearization"]
categories = ["embedded"]

[dependencies]
symthaea-authority = { path = "../../core/symthaea-authority" }
symthaea-iot-actuation-guard-admission-reservation = { path = "../symthaea-iot-actuation-guard-admission-reservation" }
symthaea-iot-actuation-guard-device-reality = { path = "../symthaea-iot-actuation-guard-device-reality" }
symthaea-iot-actuation-guard-interlock = { path = "../symthaea-iot-actuation-guard-interlock" }
symthaea-iot-actuation-guard-semantic-persistence = { path = "../symthaea-iot-actuation-guard-semantic-persistence" }
symthaea-iot-actuation-trust-publication = { path = "../symthaea-iot-actuation-trust-publication" }
symthaea-iot-authority = { path = "../symthaea-iot-authority" }
symthaea-iot-composed-actuation-evidence = { path = "../symthaea-iot-composed-actuation-evidence" }
symthaea-iot-transport-current-fence = { path = "../symthaea-iot-transport-current-fence" }
thiserror = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
symthaea-action-checkpoint = { path = "../../core/symthaea-action-checkpoint" }
symthaea-iot-actuation-guard-admission-challenge = { path = "../symthaea-iot-actuation-guard-admission-challenge" }
symthaea-iot-actuation-guard-post-semantic-controller = { path = "../symthaea-iot-actuation-guard-post-semantic-controller" }
symthaea-iot-actuation-guard-two-phase-protocol = { path = "../symthaea-iot-actuation-guard-two-phase-protocol" }
symthaea-iot-device-protocol = { path = "../symthaea-iot-device-protocol" }
symthaea-iot-durable-runtime = { path = "../symthaea-iot-durable-runtime" }
symthaea-iot-final-gate = { path = "../symthaea-iot-final-gate" }
symthaea-iot-interlock-ed25519 = { path = "../symthaea-iot-interlock-ed25519" }
symthaea-iot-interlock-trust = { path = "../symthaea-iot-interlock-trust" }
symthaea-iot-policy = { path = "../symthaea-iot-policy" }
symthaea-iot-posture = { path = "../symthaea-iot-posture" }
symthaea-iot-transport-current-revalidation = { path = "../symthaea-iot-transport-current-revalidation" }
symthaea-iot-transport-exact-evidence = { path = "../symthaea-iot-transport-exact-evidence" }
symthaea-iot-transport-receipt = { path = "../symthaea-iot-transport-receipt" }
symthaea-iot-xenia-hybrid-verifier = { path = "../symthaea-iot-xenia-hybrid-verifier" }
