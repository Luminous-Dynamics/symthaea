[package]
name = "symthaea-assurance-post-release-runtime-handoff"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Release-bound retained supervisor-to-runtime re-entry challenge handoff"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["assurance", "linux", "runtime", "continuity"]
categories = ["development-tools", "cryptography"]

[target.'cfg(target_os = "linux")'.dependencies]
blake3 = { workspace = true }
