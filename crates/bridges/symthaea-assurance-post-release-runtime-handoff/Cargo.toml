getrandom = { workspace = true }
nix = { version = "=0.26.4", default-features = false, features = ["fs"] }
symthaea-assurance-continuity-qualified-bootstrap-release = { path = "../symthaea-assurance-continuity-qualified-bootstrap-release" }
symthaea-assurance-bootstrap-syscall-confinement = { path = "../symthaea-assurance-bootstrap-syscall-confinement" }
symthaea-assurance-bootstrap-executable-mapping-continuity = { path = "../symthaea-assurance-bootstrap-executable-mapping-continuity" }
symthaea-assurance-bootstrap-ready-checkpoint = { path = "../symthaea-assurance-bootstrap-ready-checkpoint" }
symthaea-assurance-launch-runtime-handoff-channel = { path = "../symthaea-assurance-launch-runtime-handoff-channel" }
symthaea-evidence-verifier-runtime-continuity = { path = "../../domains/symthaea-evidence-verifier-runtime-continuity" }
