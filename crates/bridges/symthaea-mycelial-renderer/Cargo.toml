[package]
name = "symthaea-mycelial-renderer"
version = "0.1.0"
edition = "2024"
description = "Isolated Bevy 0.20 native 3D renderer for Symthaea Mycelial Presence"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["3d_bevy_render", "default_app", "default_platform"] }
symthaea-canvas = { path = "../../domains/symthaea-canvas" }
