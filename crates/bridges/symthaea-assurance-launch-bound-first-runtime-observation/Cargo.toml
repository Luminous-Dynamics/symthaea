[package]
name = "symthaea-assurance-launch-bound-first-runtime-observation"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Tracee-side consumption of a launch handoff ticket before checkpoint-one mapped observation"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["assurance", "linux", "runtime", "attestation"]
categories = ["development-tools", "cryptography"]

[target.'cfg(target_os = "linux")'.dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
nix = { version = "=0.26.4", default-features = false, features = ["fs"] }
symthaea-assurance-launch-runtime-handoff-channel = { path = "../symthaea-assurance-launch-runtime-handoff-channel" }
symthaea-assurance-fresh-mapped-runtime-continuity = { path = "../symthaea-assurance-fresh-mapped-runtime-continuity" }
symthaea-assurance-closure-backed-in-process-continuous = { path = "../symthaea-assurance-closure-backed-in-process-continuous" }
symthaea-assurance-nix-bound-in-process-runtime = { path = "../symthaea-assurance-nix-bound-in-process-runtime" }
symthaea-assurance-nix-runtime-closure = { path = "../symthaea-assurance-nix-runtime-closure" }
symthaea-assurance-observed-mapped-nix-executable-runtime = { path = "../symthaea-assurance-observed-mapped-nix-executable-runtime" }
