[package]
name = "symthaea-ros-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "ROS2 bridge for Symthaea: publishes consciousness telemetry and consumes sensor/proprioception data"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://github.com/Luminous-Dynamics/symthaea"
keywords = ["ros2", "robotics", "consciousness", "telemetry"]
categories = ["science", "simulation"]

[dependencies]
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-humanoid = { path = "../../domains/symthaea-humanoid" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
symthaea-sim-bridge = { path = "../symthaea-sim-bridge" }
symthaea-telemetry-grpc = { path = "../symthaea-telemetry-grpc" }
symthaea-consciousness-equation = { path = "../../domains/symthaea-consciousness-equation" }
tokio = { workspace = true }

# Note: rclrs and other ROS2 crates require a ROS2 environment (Humble/Iron/Jazzy)
# and are typically added via nix-ros-overlay or system-level colcon builds.
rclrs = { version = "0.4", optional = true }
sensor_msgs = { path = "ros_msgs/sensor_msgs", optional = true }
trajectory_msgs = { path = "ros_msgs/trajectory_msgs", optional = true }
std_msgs = { path = "ros_msgs/std_msgs", optional = true }
builtin_interfaces = { path = "ros_msgs/builtin_interfaces", optional = true }
symthaea-control = { path = "../symthaea-control", optional = true }

[features]
default = []
ros2 = ["dep:rclrs", "dep:sensor_msgs", "dep:trajectory_msgs", "dep:std_msgs", "dep:builtin_interfaces", "dep:symthaea-control"]
