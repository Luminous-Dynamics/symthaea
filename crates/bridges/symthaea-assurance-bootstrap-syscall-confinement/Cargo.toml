[package]
name = "symthaea-assurance-bootstrap-syscall-confinement"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Ptrace syscall-entry confinement from confirmed exec to signed bootstrap-ready checkpoint"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["assurance", "ptrace", "bootstrap", "runtime", "linux"]
categories = ["development-tools", "os"]

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
symthaea-assurance-bootstrap-ready-checkpoint = { path = "../symthaea-assurance-bootstrap-ready-checkpoint" }
symthaea-assurance-critical-exec-preserved-authority = { path = "../symthaea-assurance-critical-exec-preserved-authority" }
symthaea-assurance-launch-runtime-handoff-channel = { path = "../symthaea-assurance-launch-runtime-handoff-channel" }
symthaea-assurance-ptrace-static-exec-confirmation = { path = "../symthaea-assurance-ptrace-static-exec-confirmation" }
symthaea-evidence-verifier-runtime-continuity = { path = "../../domains/symthaea-evidence-verifier-runtime-continuity" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", any(target_env = "gnu", target_env = "musl")))'.dependencies]
nix = { version = "0.26.4", features = ["fs", "process", "ptrace", "signal"] }
