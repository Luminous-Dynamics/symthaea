[package]
name = "symthaea-assurance-post-release-checkpoint-two-observation"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Tracee-side post-release ticket consumption before checkpoint-two live mapped observation"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["assurance", "linux", "runtime", "attestation"]
categories = ["development-tools", "cryptography"]

