symthaea-assurance-post-release-runtime-handoff = { path = "../symthaea-assurance-post-release-runtime-handoff" }
symthaea-assurance-fresh-mapped-runtime-continuity = { path = "../symthaea-assurance-fresh-mapped-runtime-continuity" }
symthaea-assurance-nix-bound-in-process-runtime = { path = "../symthaea-assurance-nix-bound-in-process-runtime" }
symthaea-assurance-nix-runtime-closure = { path = "../symthaea-assurance-nix-runtime-closure" }
symthaea-assurance-observed-mapped-nix-executable-runtime = { path = "../symthaea-assurance-observed-mapped-nix-executable-runtime" }
symthaea-evidence-verifier-runtime-continuity = { path = "../../domains/symthaea-evidence-verifier-runtime-continuity" }
