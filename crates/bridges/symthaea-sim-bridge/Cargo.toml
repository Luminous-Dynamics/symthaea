[package]
name = "symthaea-sim-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Simulator-agnostic engineering bridge traits for FEA, CFD, multibody, process, and circuit solvers"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://github.com/Luminous-Dynamics/symthaea"
keywords = ["engineering", "simulation", "fea", "cfd", "digital-twin"]
categories = ["science", "simulation"]

[dependencies]
iceoryx2.workspace = true

symthaea-core = { path = "../../core/symthaea-core" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }


