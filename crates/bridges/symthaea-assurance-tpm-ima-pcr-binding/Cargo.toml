[package]
name = "symthaea-assurance-tpm-ima-pcr-binding"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Pure capability theorem binding a verified TPM2 PCR to canonical Linux IMA replay"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["tpm", "ima", "attestation", "assurance"]
categories = ["cryptography", "development-tools"]

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
symthaea-assurance-tpm2-checkquote-adapter = { path = "../symthaea-assurance-tpm2-checkquote-adapter" }
symthaea-linux-ima-replay = { path = "../../domains/symthaea-linux-ima-replay" }

[dev-dependencies]
sha2 = "0.10"
symthaea-assurance-tpm2-attestation-possession = { path = "../../domains/symthaea-assurance-tpm2-attestation-possession" }
