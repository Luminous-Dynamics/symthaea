[package]
name = "symthaea-engineering"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Engineering reasoning facade: requirements, concepts, simulations, digital twins, and safety cases"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["engineering", "reasoning", "simulation", "safety", "digital-twin"]
categories = ["science", "simulation"]

[dependencies]
symthaea-materials = { path = "../symthaea-materials" }
uuid = { version = "1.0", features = ["v4"] }
serde_json = "1.0"


uom.workspace = true
symthaea-core = { path = "../symthaea-core" }
symthaea-broca = { path = "../symthaea-broca" }
symthaea-runtime = { path = "../symthaea-runtime" }
symthaea-sim-bridge = { path = "../symthaea-sim-bridge" }
symthaea-digital-twin = { path = "../symthaea-digital-twin" }
symthaea-formal-safety = { path = "../symthaea-formal-safety" }
symthaea-lean-bridge = { path = "../symthaea-lean-bridge" }
symthaea-memory = { path = "../symthaea-memory" }
symthaea-causal-reasoning = { path = "../symthaea-causal-reasoning" }
symthaea-fabrication-kernel = { path = "../symthaea-fabrication-kernel" }
symthaea-harmonies = { path = "../symthaea-harmonies" }
symthaea-swarm = { path = "../symthaea-swarm" }
symthaea-workspace = { path = "../symthaea-workspace" }
symthaea-types = { path = "../symthaea-types" }
symtropy-robotics-bridge-core = { path = "../symtropy-robotics-bridge-core" }
serde = { workspace = true }
tracing = { workspace = true }
