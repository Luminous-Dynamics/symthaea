[package]
name = "symthaea-population"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Population genetics with HDC encoding, breeding strategy, and Mycelix-compatible governance"
license = "MIT"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["population-genetics", "hdc", "breeding", "governance", "conservation"]
categories = ["science", "algorithms"]

[dependencies]
symthaea-core = { path = "../../symthaea-core" }
symthaea-types = { path = "../symthaea-types" }
serde = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = "1.4"
