[package]
name = "symthaea-fabrication-kernel"
version = "0.5.0"
edition = "2021"
description = "HDC-to-Mesh bridge: geometric primitives as hypervectors, CSG operations, STL/3MF export, physics simulation"
license = "MIT"

[features]
default = ["analytical"]
analytical = []

[dependencies]
symthaea-core = { path = "../../symthaea-core" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "slicer_bench"
harness = false
