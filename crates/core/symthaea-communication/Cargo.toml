[package]
name = "symthaea-communication"
version = "0.1.0"
edition = "2024"
description = "Modality-neutral, evidence-calibrated communication contracts for Symthaea"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
hound = { workspace = true }
sha2 = { workspace = true }

[[bin]]
name = "symthaea-comm-eval"
path = "src/bin/eval.rs"

[[bin]]
name = "bioacoustic-corpus-preflight"
path = "src/bin/bioacoustic_corpus_preflight.rs"

[[bin]]
name = "bioacoustic-asset-audit"
path = "src/bin/bioacoustic_asset_audit.rs"

[[bin]]
name = "bioacoustic-event-eval"
path = "src/bin/bioacoustic_event_eval.rs"
