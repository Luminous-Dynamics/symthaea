[package]
name = "symthaea-hdc-ltc"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
description = "Hyperdimensional Liquid Time-Constant neural network with O(D) closed-form temporal evolution per state, independent of jump magnitude"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
keywords = ["neural-network", "hyperdimensional-computing", "liquid-time-constant", "temporal", "cfc"]
categories = ["science", "algorithms"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
serde_json = "1"
proptest = "1.0"

[features]
default = []

[[example]]
name = "time_series"
path = "examples/time_series.rs"

[[example]]
name = "controller"
path = "examples/controller.rs"

[[example]]
name = "language"
path = "examples/language.rs"

[[example]]
name = "irregular_timestep_replay"
path = "examples/irregular_timestep_replay.rs"

[[example]]
name = "validity_capacity_evidence"
path = "examples/validity_capacity_evidence.rs"

[[example]]
name = "validity_capacity_evidence_v2"
path = "examples/validity_capacity_evidence_v2.rs"

[[example]]
name = "validity_capacity_evidence_v3"
path = "examples/validity_capacity_evidence_v3.rs"

[[example]]
name = "validity_capacity_evidence_chain_verify"
path = "examples/validity_capacity_evidence_chain_verify.rs"

[[example]]
name = "validity_capacity_evidence_v3_verify"
path = "examples/validity_capacity_evidence_v3_verify.rs"

[[example]]
name = "validity_capacity_protocol_identity"
path = "examples/validity_capacity_protocol_identity.rs"
