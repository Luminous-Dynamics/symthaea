[package]
name = "symthaea-runtime"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Unified high-performance runtime for Symthaea: HDC math, simulation bridges, and causal grounding."
license = "AGPL-3.0-or-later"

[dependencies]
symthaea-core = { path = "../symthaea-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ndarray = { workspace = true }
blake3 = "1.5"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"

[features]
default = ["simd"]
simd = ["symthaea-core/simd"]
