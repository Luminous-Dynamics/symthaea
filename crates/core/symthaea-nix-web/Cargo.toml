[package]
name = "symthaea-nix-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.5"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }
uuid = { version = "1.0", features = ["v4", "js"] }

# Link back to symthaea-nix without native features
symthaea-nix = { path = "../symthaea-nix", default-features = false }
