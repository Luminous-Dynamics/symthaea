[package]
name = "symthaea-zkproof-request-bound-core"
version = "0.1.0"
edition = "2024"
description = "Request-bound public context and digest for Symthaea RISC Zero proofs"

[features]
default = ["std"]
std = ["serde/std"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
