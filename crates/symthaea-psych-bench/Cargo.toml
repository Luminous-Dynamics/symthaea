[package]
name = "symthaea-psych-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Psychological benchmark suite for Symthaea — WorM, CogBench, Butlin indicators, ToMBench, MemoryAgentBench"
license = "MIT"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["psychology", "benchmarks", "consciousness", "neuroscience", "cognitive-science"]
categories = ["science", "algorithms"]

[features]
default = []
symthaea-backend = ["dep:symthaea"]

[dependencies]
symthaea-core = { path = "../../symthaea-core" }
symthaea-fep = { path = "../symthaea-fep" }
symthaea = { path = "../..", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
csv = "1.3"
chrono = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "psych_bench_overhead"
harness = false
