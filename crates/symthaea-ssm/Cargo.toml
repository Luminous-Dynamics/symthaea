[package]
name = "symthaea-ssm"
version = "0.1.0"
edition = "2021"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "State Space Model core for Symthaea (diagonal SSM for edge CPU)"
license = "MIT"
repository = "https://github.com/Luminous-Dynamics/symthaea"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }

symthaea-hal = { path = "../symthaea-hal", optional = true, default-features = false }
linux-embedded-hal = { version = "0.4", optional = true, default-features = false, features = ["i2c"] }

[features]
default = []
ina219-linux = ["dep:symthaea-hal", "symthaea-hal/linux", "dep:linux-embedded-hal"]

[[bin]]
name = "ssm_sensor_demo"
path = "src/bin/ssm_sensor_demo.rs"
