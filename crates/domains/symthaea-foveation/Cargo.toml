[package]
name = "symthaea-foveation"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Dual-stream foveation bridge: dorsal surprise → ventral recognition via background dispatch"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://github.com/Luminous-Dynamics/symthaea"
keywords = ["vision", "foveation", "hdc", "attention", "ventral-stream"]
categories = ["science", "algorithms", "multimedia::video"]

[dependencies]
image = "0.24"

symthaea-core = { path = "../../core/symthaea-core" }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
# REMOVED 2026-07-16 (vision review P2.2): the `perception` feature and its
# optional symthaea-perception dep. Nothing in the workspace ever enabled it,
# and symthaea-perception is now archived (workspace-excluded; its manifest
# inherits workspace deps so it cannot be loaded as a path dep of a member).
# The RealVentralPipeline cfg blocks in ventral.rs remain as the documented
# adopt path — re-add `perception = ["dep:symthaea-perception"]` plus the
# path dep (and de-inherit that crate's manifest) to revive it.