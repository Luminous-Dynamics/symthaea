[package]
name = "symthaea-quicken-fb"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Mycelial colonization boot animation for NixOS installer — bare-metal DRM/KMS framebuffer"
license = "AGPL-3.0-or-later"

[[bin]]
name = "quicken-fb"
path = "src/main.rs"

[[bin]]
name = "spore-boot-bench"
path = "src/bin/spore_boot_bench.rs"

[dependencies]
drm = "0.12"
drm-ffi = "0.8"
nix = { version = "0.29", features = ["mman", "fs", "ioctl"] }
blake3 = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
symthaea-boot-ecology = { path = "../../core/symthaea-boot-ecology" }
symthaea-boot-ecology-live = { path = "../symthaea-boot-ecology-live" }
symthaea-boot-presentation = { path = "../symthaea-boot-presentation" }
symthaea-boot-protocol = { path = "../symthaea-boot-protocol" }
symthaea-boot-render-projection = { path = "../symthaea-boot-render-projection" }
symthaea-boot-visual-clock = { path = "../symthaea-boot-visual-clock" }

[dev-dependencies]
proptest = { workspace = true }
