[package]
name = "symthaea-quicken-fb"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "State-aware procedural Spore boot animation — bare-metal DRM/KMS framebuffer"
license = "AGPL-3.0-or-later"

[[bin]]
name = "quicken-fb"
path = "src/main.rs"

[dependencies]
symthaea-boot-ecology = { path = "../../core/symthaea-boot-ecology" }
drm = "0.12"
drm-ffi = "0.8"
nix = { version = "0.29", features = ["mman", "fs", "ioctl"] }
blake3 = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
