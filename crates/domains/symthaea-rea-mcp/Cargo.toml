[package]
name = "symthaea-rea-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Read-only stdio MCP adapter for native REA Evidence verification"

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
symthaea-rea-compat = { path = "../symthaea-rea-compat" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[[bin]]
name = "rea-evidence-mcp"
path = "src/main.rs"
