[package]
name = "symthaea-auv"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "HDC-LTC + FEP Active Inference autonomous underwater vehicle for commons water stewardship"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"

[dependencies]
# The standalone workspace supplies `stubs/positioning`; integrated deployments may
# substitute the real Mycelix positioning implementation at the workspace boundary.
positioning = { workspace = true }
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-fep = { path = "../../core/symthaea-fep" }
symthaea-hal = { path = "../symthaea-hal", default-features = false }
symthaea-maritime-core = { path = "../symthaea-maritime-core" }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []