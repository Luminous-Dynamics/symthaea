[package]
name = "symthaea-muse"
version = "0.1.0"
edition = "2024"
description = "Symbolic composition, cognitive planning, and audio realization for Symthaea"
license = "AGPL-3.0-or-later"

[dependencies]


symthaea-core = { path = "../../core/symthaea-core" }
symthaea-aesthetic = { path = "../symthaea-aesthetic" }
symthaea-fep = { path = "../../core/symthaea-fep" }
serde = { workspace = true }
rand = { workspace = true }
hound = { workspace = true }
flacenc = "0.5.1"
rustfft = { workspace = true }
midly = "0.5"
serde_json = { workspace = true }
sha2 = "0.10"
bevy = { version = "0.18", default-features = false, optional = true }
symthaea-vocal-tract = { path = "../symthaea-vocal-tract", optional = true }
symthaea-broca = { path = "../symthaea-broca", optional = true }
# Symbolic music theory: the "what to play" composer whose Score muse realizes.
symthaea-music-theory = { path = "../symthaea-music-theory", optional = true }
symthaea-muse-protocol = { path = "../symthaea-muse-protocol", optional = true }

# Real-time audio output (optional)
cpal = { version = "0.17", optional = true }
ringbuf = { version = "0.4", optional = true }

# Real Fréchet Audio Distance via a pretrained CLAP audio-tower ONNX model
# (see src/clap_mel.rs / src/clap_embed.rs). Versions match the root crate's
# own ort/hf-hub pins (see root Cargo.toml) to avoid duplicate-version bloat.
ort = { version = "=2.0.0-rc.10", features = ["half", "load-dynamic", "ndarray"], optional = true }
hf-hub = { version = "0.4", optional = true }
anyhow = { workspace = true, optional = true }
# CLAP text tower needs the RoBERTa tokenizer (tokenizer.json from the same
# HF repo). Version matches the workspace's existing tokenizers pin.
tokenizers = { version = "0.21", optional = true }

# Muse Studio local web app (feature `studio`).
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }
# Genealogy ledger (src/genealogy.rs): structured/relational metadata only —
# audio/MIDI bytes stay in the existing data/taste/audio/<key>/ content-
# addressed layout, matching the workspace's established embedded-DB choice
# (symthaea-memory, symthaea-nix also use rusqlite).
rusqlite = { workspace = true, optional = true }
# Shared DTOs for Muse Studio's evidence-bundle endpoints (listen/performance/
# provenance bundles) and title provenance. Also proves at compile time that
# muse_studio.rs's real CandidateMeta/ComposeResponse JSON output matches
# symthaea-muse-ui's shared client types (see wire_compat_tests).

[dev-dependencies]
# MP3 decoding for the DEAM emotion-regressor example (real audio features)
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

[features]
default = []
bevy = ["dep:bevy"]
muse-live = ["cpal", "ringbuf"]
# Speech synthesis now comes from symthaea-vocal-tract's `speech` module
# (the orphaned symthaea-voice crate was retired 2026-07-15; its Kokoro
# engine never ran — the root crate's voice::kokoro_engine is the survivor).
voice = ["symthaea-vocal-tract"]
# Deprecated alias: muse no longer carries its own Kokoro path.
voice-kokoro = ["voice"]
broca = ["symthaea-broca"]
voice-broca = ["voice-kokoro", "broca"]
# Render a symbolic Score (from symthaea-music-theory) to audio.
# symthaea-muse-protocol is required here too, not just by `studio`:
# analyst.rs (deterministic score/grammar analysis, gated on `theory` since
# it has nothing to do with the studio web server) unconditionally imports
# it, so `theory` alone (without `studio`) failed to compile -- found
# 2026-07-23 building an unrelated Kokoro singing eval that transitively
# needs `theory` via `singing`.
theory = ["dep:symthaea-music-theory", "dep:symthaea-muse-protocol"]
# Real Fréchet Audio Distance via a pretrained CLAP audio-tower ONNX model.
clap-fad = ["dep:ort", "dep:hf-hub", "dep:anyhow", "dep:tokenizers"]
# Muse Studio: the local sketch-partner web app (src/bin/muse_studio.rs).
# Add clap-fad on top for prompt ranking.
studio = ["theory", "dep:axum", "dep:tokio", "dep:anyhow", "dep:tower-http", "dep:symthaea-muse-protocol", "dep:rusqlite"]

[[example]]
name = "live_demo"
required-features = ["muse-live"]

[[example]]
name = "theory_vs_engine"
required-features = ["theory"]

[[example]]
name = "clap_fad_compare"
required-features = ["clap-fad"]

[[example]]
name = "prompt_steering"
required-features = ["clap-fad", "theory"]

[[bin]]
name = "muse_studio"
required-features = ["studio"]

[[bin]]
name = "listening_test"
required-features = ["studio"]

[[bin]]
name = "cognitive_study"
required-features = ["theory"]

[[bin]]
name = "muse_analyst_pack"
required-features = ["theory"]

[[bin]]
name = "muse152_listening_pack"
required-features = ["theory"]

[[bin]]
name = "muse_motif_foundry_pilot"
required-features = ["theory"]

[[bin]]
name = "cognitive_study_runner"
required-features = ["studio"]

[[example]]
name = "luminous_library_hymn"
required-features = ["theory"]

[[example]]
name = "render_ablation"
required-features = ["theory"]

