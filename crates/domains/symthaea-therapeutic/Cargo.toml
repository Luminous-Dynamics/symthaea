[package]
name = "symthaea-therapeutic"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Therapeutic Psychology — client model, alliance, safety, affect regulation, narrative"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://github.com/Luminous-Dynamics/symthaea"
keywords = ["consciousness", "therapeutic", "psychology", "safety", "alliance"]
categories = ["science", "algorithms"]

[features]
default = []
# Research-only APIs are excluded from normal builds. They must never drive
# diagnosis, prescribing, crisis decisions, or autonomous interventions.
experimental-computational-psychiatry = []
experimental-consciousness-protocols = []
# Named diagnostic hypotheses and mappings onto clinical-instrument scales are
# compatibility-only research surfaces and are excluded from default builds.
experimental-diagnostic-hypotheses = []
legacy-clinical-scale-analogues = []

[dependencies]
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-clinical = { path = "../symthaea-clinical" }
symthaea-dream = { path = "../symthaea-dream" }
serde = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = "1.4"

