[package]
name = "symthaea-exoskeleton"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "HDC-LTC + FEP Active Inference exoskeleton — consciousness-coupled human augmentation"
license = "AGPL-3.0-or-later"

[dependencies]
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-fep = { path = "../../core/symthaea-fep" }
serde = { workspace = true }
rand = { workspace = true }
proptest = "1"

[dependencies.symtropy-physics]
version = "0.1.0"
optional = true

[dependencies.symtropy-math]
version = "0.1.0"
optional = true

[dependencies.nalgebra]
version = "0.34"
optional = true

[dependencies.symthaea-hal]
path = "../symthaea-hal"
default-features = false
optional = true

[dependencies.symthaea-humanoid]
path = "../symthaea-humanoid"
optional = true

[dependencies.symthaea-sensors]
path = "../symthaea-sensors"
optional = true

[features]
default = []
symtropy = ["dep:symtropy-physics", "dep:symtropy-math", "dep:nalgebra"]
hal = ["dep:symthaea-hal", "dep:symthaea-humanoid", "symtropy"]
sensors = ["dep:symthaea-sensors", "symtropy"]

[[example]]
name = "full_frame_demo"
required-features = ["hal"]