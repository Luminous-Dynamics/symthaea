[package]
name = "symthaea-projection"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Holographic 2.5D Projection System — data model for Time-Waterfall, Stratified Stack, and Cross-Section projections"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["visualization", "projection", "telemetry", "consciousness", "holographic"]
categories = ["science", "data-structures", "visualization"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing.workspace = true
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proptest = "1"
