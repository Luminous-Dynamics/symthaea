[package]
name = "symthaea-welfare-assurance"
version = "0.1.0"
edition = "2024"
description = "Typed assurance boundary for verified subject consent, scoped authority, and bilateral intervention policy"
license = "AGPL-3.0-or-later"

[lib]
path = "src/root.rs"

[dependencies]
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-fabrication-kernel = { path = "../symthaea-fabrication-kernel", default-features = false }
symthaea-memory = { path = "../symthaea-memory" }
symthaea-psych-bench = { path = "../symthaea-psych-bench" }
symthaea-welfare-authority = { path = "../symthaea-welfare-authority" }
symthaea-welfare-consent = { path = "../symthaea-welfare-consent" }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
