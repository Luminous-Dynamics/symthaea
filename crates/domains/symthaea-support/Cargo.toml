[package]
name = "symthaea-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "IT support intelligence for Symthaea: triage, diagnostics, knowledge, privacy, actions, prediction"
license = "AGPL-3.0-or-later"

[features]
default = []
# Keep the Phase-1 log clustering stack out of ordinary support builds. Enable
# only where parsed LogEvent -> SystemObservationV1 ingestion is required.
logparse-adapter = ["dep:symthaea-logparse", "dep:blake3"]
# Provider-neutral external metric/trace/event normalization. No OpenTelemetry
# SDK dependency is required; collectors adapt their data into the V1 record type.
telemetry-adapter = ["dep:blake3"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
libc = "0.2"
blake3 = { workspace = true, optional = true }
symthaea-logparse = { path = "../../core/symthaea-logparse", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
chrono = { workspace = true }
