[package]
name = "symthaea-gravcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Experimental ADM metric-ansatz and geodesic reference sandbox for three-amplifier shift fields"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luminous-dynamics/symthaea"
keywords = ["gravcraft", "metric-engineering", "embodiment", "alcubierre", "hdc"]
categories = ["science", "simulation"]

[dependencies]
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-metric-geometry-lab = { path = "../symthaea-metric-geometry-lab" }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[example]]
name = "adm_derivative_step_sweep"
path = "examples/adm_derivative_step_sweep.rs"

[[example]]
name = "adm_constraint_sweep"
path = "examples/adm_constraint_sweep.rs"
