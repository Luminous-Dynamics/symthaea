[package]
name = "symthaea-physics-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Lightweight physics equation catalog with HDC structural search — compiles to WASM for browser-side discovery"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luminous-dynamics/symthaea"
keywords = ["physics", "hdc", "wasm", "equations", "discovery"]
categories = ["science", "wasm"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]