[package]
name = "symthaea-nuclear"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Computational nuclear structure: mass formula, shell model, island of stability — teaching Symthaea nuclear physics"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luminous-dynamics/symthaea"
keywords = ["nuclear", "physics", "shell-model", "island-of-stability", "hdc"]
