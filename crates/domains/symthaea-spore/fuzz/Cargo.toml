[package]
name = "symthaea-spore-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
symthaea-spore = { path = "..", default-features = false }

[[bin]]
name = "fuzz_heredoc"
path = "fuzz_targets/fuzz_heredoc.rs"
doc = false

[[bin]]
name = "fuzz_disk_path"
path = "fuzz_targets/fuzz_disk_path.rs"
doc = false

[[bin]]
name = "fuzz_sanitize_input"
path = "fuzz_targets/fuzz_sanitize_input.rs"
doc = false