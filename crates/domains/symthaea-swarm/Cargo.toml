[package]
name = "symthaea-swarm"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "P2P swarm protocol for collective consciousness and distributed Phi (Φ) measurement"
license = "AGPL-3.0-or-later"

[dependencies]
yrs.workspace = true
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-runtime = { path = "../../core/symthaea-runtime" }
# [standalone-stripped] # symtropy-robotics-bridge-core = { path = "../../../../symtropy/crates/symtropy-robotics-bridge-core" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
futures = { version = "0.3", optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
bincode = { workspace = true, optional = true }
blake3 = { version = "1", optional = true }

# Distributed networking via Iroh
iroh = { version = "0.97", optional = true }
iroh-gossip = { version = "0.97", optional = true }

[features]
default = ["networking"]
networking = [
    "dep:bincode",
    "dep:blake3",
    "dep:futures",
    "dep:iroh",
    "dep:iroh-gossip",
    "dep:tokio",
]

[[example]]
name = "direct_transport_witness"
required-features = ["networking"]
