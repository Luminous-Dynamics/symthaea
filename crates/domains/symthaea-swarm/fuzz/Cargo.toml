[package]
name = "symthaea-swarm-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
symthaea-swarm = { path = "..", default-features = false, features = ["semantic-receipts"] }

[[bin]]
name = "fuzz_cose_key_es256"
path = "fuzz_targets/fuzz_cose_key_es256.rs"
doc = false

[[bin]]
name = "fuzz_rfc9942_receipt"
path = "fuzz_targets/fuzz_rfc9942_receipt.rs"
doc = false

[[bin]]
name = "fuzz_rfc9942_signature_with_receipts"
path = "fuzz_targets/fuzz_rfc9942_signature_with_receipts.rs"
doc = false

[[bin]]
name = "fuzz_rfc9942_proofs"
path = "fuzz_targets/fuzz_rfc9942_proofs.rs"
doc = false
