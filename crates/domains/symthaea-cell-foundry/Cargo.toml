[package]
name = "symthaea-cell-foundry"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Cell culture control, iPSC reprogramming, IVG, and SCNT with HDC + LTC multi-scale prediction"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["cell-culture", "ipsc", "hdc", "ivg", "stem-cells"]
categories = ["science", "algorithms"]

[features]
default = []
morphogenetic-sorting = []

[dependencies]
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-fep = { path = "../../core/symthaea-fep" }
serde = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
# Real rigid-body physics (Bevy-free, GJK/EPA + LBVH broadphase) for the
# opt-in cell-packing correction pass — see src/packing.rs. symtropy-math
# is needed directly because symtropy-physics doesn't re-export its Point<D>.
symtropy-physics = "0.2.1"
symtropy-math = "0.2.1"
nalgebra = { workspace = true }
# Real, tested black-box optimizer (Particle Swarm) for the opt-in
# anatomical-compiler intervention search -- see src/anatomical_compiler.rs.
# Already resolved in the workspace lockfile via symthaea-fep's dependency;
# this just wires it up directly for this crate to use. argmin itself builds
# argmin-math with default-features=false (only "primitives"), so Vec<f64>
# parameter support ("vec" feature) must be requested directly here too.
argmin = { workspace = true }
argmin-math = { version = "0.4", features = ["vec"] }

[dev-dependencies]
proptest = "1.4"