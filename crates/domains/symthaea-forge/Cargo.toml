[package]
name = "symthaea-forge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bounded AST mutation search that emits human-review candidates for Symthaea's evidence-first algorithm pipeline"

[[bin]]
name = "forge-run"
path = "src/bin/forge_run.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "visit", "visit-mut", "extra-traits"] }
quote = "1.0"
prettyplease = "0.2"
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
symthaea-algorithms = { path = "../../core/symthaea-algorithms" }

[dev-dependencies]
