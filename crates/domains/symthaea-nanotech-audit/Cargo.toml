[package]
name = "symthaea-nanotech-audit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Read-only integrity auditor for exported closed-loop materials-discovery benchmark runs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
sha2 = { workspace = true }

[[bin]]
name = "symthaea-nanotech-audit"
path = "src/main.rs"

[[bin]]
name = "nano-rescue-score"
path = "src/bin/nano-rescue-score.rs"

[[bin]]
name = "nano-qoi-acquisition"
path = "src/bin/nano-qoi-acquisition.rs"
