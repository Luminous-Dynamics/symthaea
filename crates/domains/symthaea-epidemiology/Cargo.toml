[package]
name = "symthaea-epidemiology"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Epidemiology layer for Symthaea: infectious-disease dynamics and conservative aggregate surveillance screening."

# Keep the epidemiology domain lightweight and deterministic. The only domain
# dependency is Symthaea's pure-std statistics crate; no symthaea-core link.
[dependencies]
symthaea-statistics = { path = "../symthaea-statistics" }
