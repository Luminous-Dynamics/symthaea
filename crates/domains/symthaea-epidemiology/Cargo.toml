[package]
name = "symthaea-epidemiology"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Epidemiology layer for Symthaea: infectious-disease dynamics and conservative aggregate surveillance screening."

# Keep the epidemiology domain lightweight and deterministic. The only Symthaea
# domain dependency is the pure-std statistics crate; SHA-256 is used only for
# stable evidence-content identities. There is still no symthaea-core link.
[dependencies]
sha2 = "0.10.9"
symthaea-statistics = { path = "../symthaea-statistics" }
