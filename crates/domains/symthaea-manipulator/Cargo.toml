[package]
name = "symthaea-manipulator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
symthaea-core = { version = "0.5.0", path = "../../core/symthaea-core" }
symthaea-fep = { version = "0.1.0", path = "../../core/symthaea-fep" }
symthaea-swarm = { version = "0.1.0", path = "../symthaea-swarm" }
symthaea-thermofluids = { version = "0.1.0", path = "../symthaea-thermofluids" }
symtropy-physics = { version = "0.2.1", optional = true }
symtropy-math = { version = "0.2.1", optional = true }
nalgebra = { version = "0.33", optional = true }
uuid = { workspace = true, features = ["v4"] }

[features]
default = []
symtropy = ["dep:symtropy-physics", "dep:symtropy-math", "dep:nalgebra"]

[dev-dependencies]
proptest = "1.0"

