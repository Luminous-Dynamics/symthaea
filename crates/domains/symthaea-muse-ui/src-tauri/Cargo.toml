[workspace]

[package]
name = "muse-desktop"
version = "0.1.0"
description = "Muse by Symthaea — Tauri v2 native wrapper (taskbar/tray-icon launcher over the existing muse_studio backend + symthaea-muse-ui frontend)"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.94"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
