[package]
name = "subterra-evidence-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "AGPL-3.0-or-later"
description = "Typed, evidence-preserving adapters for Subterra site and cave-network records"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Standalone research crate; deliberately outside the production workspace.
[workspace]
