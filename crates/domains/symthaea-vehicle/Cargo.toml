[package]
name = "symthaea-vehicle"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "HDC-LTC + FEP Active Inference autonomous vehicle control via bicycle-model dynamics"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["autonomous-vehicle", "active-inference", "hdc", "bicycle-model", "swarm"]
categories = ["science", "algorithms", "simulation"]

[dependencies]
# [standalone-stripped] positioning = { path = "../../../../mycelix-workspace/mycelix-position/lib/positioning" }
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-fep = { path = "../../core/symthaea-fep" }
symthaea-hal = { path = "../symthaea-hal", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
approx = "0.5"
proptest = "1"

[features]
default = []