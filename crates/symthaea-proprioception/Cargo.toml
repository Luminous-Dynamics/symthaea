[package]
name = "symthaea-proprioception"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Substrate Proprioception: Sense and protect physical hardware (CPU/GPU) as a metabolic organ."
license = "AGPL-3.0-or-later"

[dependencies]
symthaea-core = { path = "../symthaea-core" }
serde = { workspace = true }
tracing = { workspace = true }
systemstat = "0.2"
nvml-wrapper = { version = "0.10", optional = true }

[features]
default = []
gpu = ["nvml-wrapper"]
