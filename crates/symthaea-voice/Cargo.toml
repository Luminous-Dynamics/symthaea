[package]
name = "symthaea-voice"
version = "0.1.0"
edition = "2024"
description = "Consciousness-driven voice synthesis for Symthaea — dual engine (Formant + Kokoro)"
license = "AGPL-3.0-or-later"

[dependencies]
symthaea-core = { path = "../symthaea-core" }
symthaea-vocal-tract = { path = "../symthaea-vocal-tract" }
serde = { workspace = true }

# Kokoro TTS (optional — requires ONNX Runtime + HuggingFace model download)
ort = { version = "2.0.0-rc.10", features = ["half"], optional = true }
hf-hub = { version = "0.4", optional = true }

[dev-dependencies]

[features]
default = []
kokoro = ["ort", "hf-hub"]

[lints]
workspace = true
