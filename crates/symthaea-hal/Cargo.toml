[package]
name = "symthaea-hal"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Hardware abstraction layer for Symthaea: PCA9685 servo control, I2C sensors, safety interlocks"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["robotics", "hal", "i2c", "servo", "embedded"]
categories = ["embedded", "hardware-support"]

[dependencies]
no-panic.workspace = true
fixed.workspace = true
statig.workspace = true
symthaea-core = { path = "../symthaea-core" }
symthaea-humanoid = { path = "../symthaea-humanoid" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3", features = ["std"] }
clap = { version = "4.4", features = ["derive"], optional = true }
ctrlc = { version = "3.4", optional = true }

[dependencies.linux-embedded-hal]
version = "0.4"
optional = true
default-features = false
features = ["i2c"]

[dev-dependencies]
proptest = "1.4"

[features]
default = []
linux = ["dep:linux-embedded-hal"]
calibrate = ["dep:clap"]
signal = ["dep:ctrlc"]

[[bin]]
name = "hal-calibrate"
path = "src/bin/hal_calibrate.rs"
required-features = ["calibrate"]
