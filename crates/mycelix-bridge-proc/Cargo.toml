[package]
name = "mycelix-bridge-proc"
version = "0.1.0"
edition = "2021"
authors = ["Tristan Stoltz / Luminous Dynamics"]
description = "Procedural macros for Mycelix Type-Safe Bridge generation."

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
