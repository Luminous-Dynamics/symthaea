[package]
name = "symthaea-perception"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
parry3d.workspace = true
wgpu.workspace = true


symthaea-core = { path = "../symthaea-core" }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }  # For JL projection random matrices
parking_lot = { workspace = true }
syn = { version = "2.0", features = ["full", "visit"] }  # For Rust code parsing
ignore = "0.4"  # For gitignore-aware file walking
# Optional heavy dependencies
ort = { version = "2.0.0-rc.10", features = ["half", "load-dynamic", "ndarray"], optional = true }
tokenizers = { version = "0.21", optional = true }
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["rustls-tls", "ureq"] }  # HuggingFace model downloading (rustls to avoid OpenSSL)
image = "0.24"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"

[features]
default = []
embeddings = ["tokenizers", "ort", "hf-hub"]
vision = ["ort", "hf-hub"]
