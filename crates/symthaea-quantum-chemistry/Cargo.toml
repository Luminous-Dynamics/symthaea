[package]
name = "symthaea-quantum-chemistry"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Ab initio quantum chemistry: Hartree-Fock, DFT, molecular integrals — computing reality from first principles"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luminous-dynamics/symthaea"
keywords = ["quantum-chemistry", "hartree-fock", "dft", "molecular-integrals", "hdc"]
categories = ["science", "simulation"]

[dependencies]
symthaea-core = { path = "../../symthaea-core", optional = true }
serde = { workspace = true }

[features]
default = []
hdc = ["dep:symthaea-core"]

[dev-dependencies]
serde_json = { workspace = true }
