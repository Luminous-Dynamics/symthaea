[package]
name = "binius-zome-verifier"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Proof of concept: Binius STARK verifier inside a Holochain integrity zome"

[lib]
crate-type = ["rlib"]

[dependencies]
# Binius verifier (694KB WASM — fits in zome budget)
binius-verifier = { path = "../../.deps/binius64/crates/verifier" }
binius-core = { path = "../../.deps/binius64/crates/core" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
