[package]
name = "mycelix-leptos-client"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Browser-compatible Holochain client for Leptos frontends"

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket", "MessageEvent", "BinaryType", "Blob",
    "ErrorEvent", "CloseEvent", "console"
] }
futures = { version = "0.3", default-features = false }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[features]
default = ["browser"]
browser = []
tauri = []  # For Tauri IPC transport

[lib]
crate-type = ["cdylib", "rlib"]
