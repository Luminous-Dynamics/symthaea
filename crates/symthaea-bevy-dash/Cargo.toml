[package]
name = "symthaea-bevy-dash"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Bevy-based 3D visualization dashboard for Symthaea's consciousness topology and digital twin state"
license = "AGPL-3.0-or-later"

[dependencies]
bevy = { version = "0.15", default-features = false, features = ["bevy_winit", "bevy_render", "bevy_pbr", "bevy_gltf", "x11", "bevy_ui", "bevy_sprite"] }
symthaea-core = { path = "../symthaea-core" }
symthaea-phi-oracle = { path = "../symthaea-phi-oracle" }
symthaea-digital-twin = { path = "../symthaea-digital-twin" }
bevy_egui = "0.31"
serde = { workspace = true }
tracing = { workspace = true }

[features]
default = []
inspector = [] # TODO: Add bevy-inspector-egui integration
