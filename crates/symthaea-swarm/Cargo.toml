[package]
name = "symthaea-swarm"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "P2P swarm protocol for collective consciousness and distributed Phi (Φ) measurement"
license = "AGPL-3.0-or-later"

[dependencies]
yrs.workspace = true
symthaea-core = { path = "../symthaea-core" }
symthaea-runtime = { path = "../symthaea-runtime" }
symtropy-robotics-bridge-core = { path = "../symtropy-robotics-bridge-core" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
futures = "0.3"
tokio = { workspace = true, features = ["full"] }
bincode = { workspace = true }
anyhow = { workspace = true }

# Distributed networking via Iroh
iroh = "0.97"
iroh-gossip = "0.97"

[features]
default = ["networking"]
networking = []
