[package]
name = "sovereign-profile"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "8-dimensional Sovereign Profile — anti-tyranny civic identity for Mycelix governance"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"
