<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mycelix Prism</title>
    <meta name="description" content="Prism — epistemic search browser. Pure Rust. Zero C++. Every result is epistemically classified." />
    <meta name="theme-color" content="#0d1a24" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph -->
    <meta property="og:title" content="Mycelix Prism" />
    <meta property="og:description" content="Epistemic search powered by 16,384-bit hyperdimensional computing. Every result carries an evidence level." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/static/prism-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- App icons -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/static/prism-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prism" />
    <link rel="manifest" href="/static/manifest.json" />

    <link data-trunk rel="css" href="style/prism.css" />
    <link data-trunk rel="copy-dir" href="static" />

    <!-- Keyboard shortcut: Ctrl+L / Cmd+L focuses search bar -->
    <script>
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
            e.preventDefault();
            var input = document.querySelector('.search-input');
            if (input) { input.focus(); input.select(); }
        }
    });
    // Register service worker for offline-first
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js')
            .then(function() { console.log('[Prism] Service worker registered'); })
            .catch(function(e) { console.log('[Prism] SW registration failed:', e); });
    }
    </script>
</head>
<body>
</body>
</html>
