[package]
name = "sol-atlas-operator"
version = "0.1.0"
edition = "2024"
description = "Sol Atlas Operator Console — decentralized energy project management via Holochain"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
license = "AGPL-3.0-or-later"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "macros"] }
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
