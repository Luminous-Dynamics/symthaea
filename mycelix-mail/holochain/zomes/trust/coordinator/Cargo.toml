[package]
name = "mail_trust"
version = "0.1.0"
edition = "2021"
description = "Coordinator zome for Mycelix Mail Trust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hdk = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
mail_trust_integrity = { path = "../integrity" }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
