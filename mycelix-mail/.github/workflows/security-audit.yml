name: Security Audit Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full security scan (slower but more thorough)'
        required: false
        default: 'false'

env:
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # SAST - Static Application Security Testing
  # ============================================================================

  rust-security:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit cargo-deny cargo-outdated

      - name: Run cargo-audit
        working-directory: backend
        run: cargo audit --json > audit-results.json || true

      - name: Run cargo-deny
        working-directory: backend
        run: cargo deny check advisories sources licenses

      - name: Check outdated dependencies
        working-directory: backend
        run: cargo outdated --root-deps-only --exit-code 1 || true

      - name: Upload Rust audit results
        uses: actions/upload-artifact@v4
        with:
          name: rust-audit-results
          path: backend/audit-results.json

  typescript-security:
    name: TypeScript/Node Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ui/frontend
        run: npm ci

      - name: Run npm audit
        working-directory: ui/frontend
        run: npm audit --json > npm-audit.json || true

      - name: Run Snyk (if token available)
        if: env.SNYK_TOKEN != ''
        working-directory: ui/frontend
        run: npx snyk test --json > snyk-results.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Node audit results
        uses: actions/upload-artifact@v4
        with:
          name: node-audit-results
          path: |
            ui/frontend/npm-audit.json
            ui/frontend/snyk-results.json

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep ci \
            --config=auto \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --config=p/rust \
            --config=p/typescript \
            --config=p/react \
            --sarif > semgrep-results.sarif || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        if: always()

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # ============================================================================
  # Secret Scanning
  # ============================================================================

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TruffleHog
        run: |
          docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest \
            filesystem /pwd \
            --json > trufflehog-results.json || true

      - name: Upload secret scan results
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: trufflehog-results.json

  # ============================================================================
  # DAST - Dynamic Application Security Testing
  # ============================================================================

  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.full_scan == 'true'
    services:
      mycelix-api:
        image: ghcr.io/mycelix/mycelix-api:latest
        ports:
          - 8080:8080
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/mycelix_test
          REDIS_URL: redis://redis:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mycelix_test
      redis:
        image: redis:7
    steps:
      - uses: actions/checkout@v4

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:8080/health; do sleep 2; done'

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'

      - name: Run ZAP Full Scan
        if: github.event.inputs.full_scan == 'true'
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'

      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: report_html.html
        if: always()

  nuclei-scan:
    name: Nuclei Vulnerability Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.full_scan == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run Nuclei
        uses: projectdiscovery/nuclei-action@main
        with:
          target: http://localhost:8080
          flags: '-severity critical,high,medium -json -o nuclei-results.json'
          templates: 'cves,vulnerabilities,exposures,misconfiguration'

      - name: Upload Nuclei results
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-results
          path: nuclei-results.json
        if: always()

  # ============================================================================
  # Container Security
  # ============================================================================

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mycelix-api:scan -f docker/Dockerfile.api .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mycelix-api:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Grype scan
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype mycelix-api:scan -o json > grype-results.json

      - name: Upload container scan results
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-results
          path: |
            trivy-results.sarif
            grype-results.json

  # ============================================================================
  # Infrastructure as Code Security
  # ============================================================================

  iac-security:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: deploy/
          framework: kubernetes,dockerfile,helm
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Run kube-linter
        run: |
          curl -L https://github.com/stackrox/kube-linter/releases/latest/download/kube-linter-linux -o kube-linter
          chmod +x kube-linter
          ./kube-linter lint deploy/kubernetes/ --format sarif > kube-linter-results.sarif || true

      - name: Upload IaC results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
        if: always()

  # ============================================================================
  # Dependency Analysis
  # ============================================================================

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft . -o spdx-json > sbom-spdx.json
          syft . -o cyclonedx-json > sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json

  # ============================================================================
  # API Security Testing
  # ============================================================================

  api-security:
    name: API Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install -g @stoplight/spectral-cli

      - name: Validate OpenAPI spec
        run: spectral lint docs/api/openapi.yaml --ruleset .spectral.yaml

      - name: Run API fuzzer
        run: |
          cd tests/fuzzing
          npm ci
          npm run fuzz -- --target http://localhost:8080 --output fuzz-results.json
        if: github.event_name == 'schedule'

  # ============================================================================
  # Security Report Generation
  # ============================================================================

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs:
      - rust-security
      - typescript-security
      - semgrep
      - secret-scan
      - container-scan
      - iac-security
      - sbom-generation
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-artifacts

      - name: Generate consolidated report
        run: |
          python3 scripts/security/generate-report.py \
            --artifacts security-artifacts \
            --output security-report.html \
            --format html

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.html

      - name: Create issue for critical findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-report.html', 'utf8');

            // Parse for critical findings
            const criticalCount = (report.match(/severity.*critical/gi) || []).length;

            if (criticalCount > 0) {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Security] ${criticalCount} critical vulnerabilities found`,
                body: `Security audit found ${criticalCount} critical vulnerabilities.\n\nSee workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['security', 'critical', 'automated']
              });
            }

      - name: Send Slack notification
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"⚠️ Security audit found vulnerabilities in Mycelix Mail. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            $SLACK_WEBHOOK
