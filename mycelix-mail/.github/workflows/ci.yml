name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  # ============================================================
  # TypeScript SDK Tests
  # ============================================================
  sdk-test:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: sdk/typescript/node_modules
          key: ${{ runner.os }}-sdk-${{ hashFiles('sdk/typescript/package.json') }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint || true

      - name: Run tests
        run: npm test || true

      - name: Build
        run: npm run build

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/typescript/dist
          retention-days: 7

  # ============================================================
  # Rust Backend Tests
  # ============================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: happ/backend-rs
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: happ/backend-rs -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --all-features
        env:
          JWT_SECRET: test_jwt_secret_for_ci_testing_only_32chars!
          HOLOCHAIN_URL: ws://localhost:4444
          HOLOCHAIN_APP_ID: mycelix-mail

  # ============================================================
  # Holochain Client Tests
  # ============================================================
  holochain-client-test:
    name: Holochain Client Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: holochain/client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: holochain/client/node_modules
          key: ${{ runner.os }}-hc-client-${{ hashFiles('holochain/client/package.json') }}
          restore-keys: |
            ${{ runner.os }}-hc-client-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test:run

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run storybook:build

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: holochain-client-dist
          path: holochain/client/dist
          retention-days: 7

      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: holochain/client/storybook-static
          retention-days: 7

  # ============================================================
  # Holochain Zomes Test
  # ============================================================
  holochain-zomes-test:
    name: Holochain Zomes Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: holochain
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: holochain -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build WASM zomes
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --all

      - name: Upload zome artifacts
        uses: actions/upload-artifact@v4
        with:
          name: holochain-zomes-wasm
          path: holochain/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  # ============================================================
  # WASM Optimization (Production Build)
  # ============================================================
  wasm-optimize:
    name: WASM Optimization
    runs-on: ubuntu-latest
    needs: [holochain-zomes-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: holochain-zomes-wasm
          path: wasm-input/

      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Optimize WASM files
        run: |
          mkdir -p wasm-optimized
          for wasm in wasm-input/*.wasm; do
            filename=$(basename "$wasm")
            echo "Optimizing $filename..."
            wasm-opt -Oz --strip-debug -o "wasm-optimized/$filename" "$wasm"
            echo "Original: $(stat -f%z "$wasm" 2>/dev/null || stat -c%s "$wasm") bytes"
            echo "Optimized: $(stat -f%z "wasm-optimized/$filename" 2>/dev/null || stat -c%s "wasm-optimized/$filename") bytes"
          done

      - name: Upload optimized WASM
        uses: actions/upload-artifact@v4
        with:
          name: holochain-zomes-wasm-optimized
          path: wasm-optimized/*.wasm
          retention-days: 30

  # ============================================================
  # Documentation Generation
  # ============================================================
  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: [holochain-zomes-test, sdk-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Rust documentation
        run: cargo doc --workspace --no-deps
        working-directory: holochain

      - name: Install TypeDoc
        run: npm install -g typedoc

      - name: Install SDK dependencies
        run: npm ci || npm install
        working-directory: sdk/typescript

      - name: Generate TypeScript documentation
        run: npx typedoc src/index.ts src/holochain/index.ts --out docs-output || true
        working-directory: sdk/typescript

      - name: Prepare documentation
        run: |
          mkdir -p docs-site/api/rust docs-site/api/typescript
          cp -r holochain/target/doc/* docs-site/api/rust/ || true
          cp -r sdk/typescript/docs-output/* docs-site/api/typescript/ || true

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs-site/
          retention-days: 30

  # ============================================================
  # Frontend Tests
  # ============================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ui/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('ui/frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --run --coverage || npm test -- --run

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run storybook:build || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ui/frontend/coverage/lcov.info
          flags: frontend
        continue-on-error: true

      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: storybook-frontend
          path: ui/frontend/storybook-static/
          retention-days: 7

  # ============================================================
  # Security Audit
  # ============================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit Holochain zome dependencies
        run: cargo audit
        working-directory: holochain
        continue-on-error: true

      - name: Audit Backend dependencies
        run: cargo audit
        working-directory: happ/backend-rs
        continue-on-error: true

      - name: Audit SDK dependencies
        run: npm audit --audit-level=moderate || true
        working-directory: sdk/typescript
        continue-on-error: true

  # ============================================================
  # Docker Build
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [holochain-zomes-test, backend-test, frontend-test, sdk-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./happ/backend-rs
          push: false
          tags: mycelix-mail-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./ui/frontend
          push: false
          tags: mycelix-mail-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # E2E Tests (Playwright)
  # ============================================================
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm install
        working-directory: ui/frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: ui/frontend

      - name: Start services
        run: docker-compose up -d backend redis postgres
        env:
          JWT_SECRET: test_jwt_secret_for_ci_testing_only_32chars!
          POSTGRES_PASSWORD: test_password

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ui/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          API_URL: http://localhost:3001

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/frontend/playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker-compose down -v

  # ============================================================
  # ML Service Tests
  # ============================================================
  ml-test:
    name: ML Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ml
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run linting
        run: |
          pip install ruff
          ruff check .

      - name: Run type checking
        run: |
          pip install mypy
          mypy . --ignore-missing-imports

      - name: Run tests
        run: pytest --cov=. --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: backend/ml/coverage.xml
          flags: ml-service

  # ============================================================
  # Release (on tag)
  # ============================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [holochain-zomes-test, backend-test, frontend-test, sdk-test, wasm-optimize]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./happ/backend-rs
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ui/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/frontend:latest

      - name: Download optimized WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: holochain-zomes-wasm-optimized
          path: release-wasm/

      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: release-sdk/

      - name: Package release artifacts
        run: |
          cd release-wasm && tar -czvf ../mycelix-mail-zomes-${{ steps.version.outputs.VERSION }}.tar.gz *.wasm
          cd ../release-sdk && tar -czvf ../mycelix-mail-sdk-${{ steps.version.outputs.VERSION }}.tar.gz *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          files: |
            mycelix-mail-zomes-${{ steps.version.outputs.VERSION }}.tar.gz
            mycelix-mail-sdk-${{ steps.version.outputs.VERSION }}.tar.gz
