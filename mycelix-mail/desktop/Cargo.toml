[package]
name = "mycelix-mail-desktop"
version = "0.1.0"
description = "Mycelix Mail Desktop Application"
authors = ["Mycelix Team"]
license = "MIT"
repository = "https://github.com/mycelix/mycelix-mail"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
    "api-all",
    "system-tray",
    "global-shortcut-all",
    "notification-all",
    "shell-open",
    "window-all",
    "dialog-all",
    "path-all",
    "fs-all",
    "clipboard-all",
    "process-all",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
