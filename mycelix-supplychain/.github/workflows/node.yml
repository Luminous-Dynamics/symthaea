name: Node.js CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ts/**'
      - '.github/workflows/node.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ts/**'
      - '.github/workflows/node.yml'

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'ts/**/package-lock.json'

    - name: Install SDK dependencies
      working-directory: ./ts/sdk
      run: npm ci

    - name: Lint SDK
      working-directory: ./ts/sdk
      run: npm run lint

    - name: Build SDK
      working-directory: ./ts/sdk
      run: npm run build

    - name: Test SDK
      working-directory: ./ts/sdk
      run: npm test

    - name: Install Dashboard dependencies
      working-directory: ./ts/dashboard
      run: npm ci

    - name: Lint Dashboard
      working-directory: ./ts/dashboard
      run: npm run lint

    - name: Build Dashboard
      working-directory: ./ts/dashboard
      run: npm run build

    - name: Install CSV Adapter dependencies
      working-directory: ./ts/adapters/csv
      run: npm ci

    - name: Build CSV Adapter
      working-directory: ./ts/adapters/csv
      run: npm run build

    - name: Install MQTT Adapter dependencies
      working-directory: ./ts/adapters/mqtt
      run: npm ci

    - name: Build MQTT Adapter
      working-directory: ./ts/adapters/mqtt
      run: npm run build
