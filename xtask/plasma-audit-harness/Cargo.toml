[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Isolated runner for the plasma source and thermal accounting audit module"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
csv = "1.3"
sha2 = "0.10"
toml = "0.8"
