[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "basalt_observer_fixture_worker"
path = "src/bin/basalt_observer_fixture_worker.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
csv = "1.3"
sha2 = "0.10"
libc = "0.2"
toml = "0.8"
