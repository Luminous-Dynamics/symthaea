[package]
name = "mycelix-zkp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Shared dual-backend ZKP verification library for Mycelix — RISC0 + Winterfell + Dilithium5"
keywords = ["zkp", "stark", "dilithium", "holochain", "dastark"]
categories = ["cryptography", "wasm"]
repository = "https://github.com/luminous-dynamics/mycelix"

[features]
default = []

# Backend selection — each zome enables only what it needs
# This keeps WASM size within Holochain's ~5MB practical limit
backend-risc0 = []          # RISC0 zkVM verifier (~300-500KB WASM)
backend-winterfell = [       # Winterfell STARK verifier (~200-400KB WASM)
    "dep:winterfell",
    "dep:winter-math",
    "dep:winter-crypto",
]
backend-dual = ["backend-risc0", "backend-winterfell"]

# PQ authentication (adds ~2.6KB to WASM)
dilithium = ["dep:pqcrypto-dilithium", "dep:pqcrypto-traits"]

# Full stack for native testing (never enable in zomes)
full = ["backend-dual", "dilithium"]

[dependencies]
# Serialization (always needed)
serde = { version = "1.0", features = ["derive"] }

# Hashing (always needed — domain tags, commitments)
sha2 = "0.10"

# JSON serialization for public inputs
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Shared proof config + commitment schemes
proofs-config = { path = "../../../mycelix-core/libs/proofs-config" }
proofs-commitment = { path = "../../../mycelix-core/libs/proofs-commitment" }

# --- Backend: Winterfell STARK ---
winterfell = { version = "0.13.1", optional = true }
winter-math = { version = "0.13.1", optional = true }
winter-crypto = { version = "0.13.1", optional = true }

# --- Backend: Dilithium5 PQ Signatures ---
pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

# Random number generation (needed for benchmarks and STARK witness generation)
rand = "0.8"

[dev-dependencies]
serde_json = "1.0"

[[bench]]
name = "zkp_core_bench"
harness = false

[lib]
crate-type = ["rlib"]
