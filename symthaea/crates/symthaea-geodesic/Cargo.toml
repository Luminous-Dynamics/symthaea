[package]
name = "symthaea-geodesic"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Geodesic Code Synthesis — topology-aware code generation via manifold navigation, execution prediction, and sheaf coherence"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["topology", "code-synthesis", "geodesic", "sheaf", "manifold"]
categories = ["science", "algorithms", "development-tools"]

[dependencies]
symthaea-core = { path = "../../symthaea-core" }
symthaea-hodge = { path = "../symthaea-hodge" }
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }

[dev-dependencies]
