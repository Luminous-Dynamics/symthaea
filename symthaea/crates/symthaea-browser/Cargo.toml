[package]
name = "symthaea-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Consciousness-driven browser agent: CDP observation + HDC encoding + Phi-gated actions"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["browser-agent", "consciousness", "hdc", "cdp", "active-inference"]
categories = ["science", "algorithms", "web-programming"]

[dependencies]
symthaea-core = { path = "../../symthaea-core" }
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }
tokio = { version = "1", features = ["sync", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures = "0.3"

[dev-dependencies]
approx = "0.5"

[features]
default = []
