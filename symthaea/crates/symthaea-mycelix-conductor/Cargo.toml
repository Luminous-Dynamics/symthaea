[package]
name = "symthaea-mycelix-conductor"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Adapter bridging Symthaea's governance dispatch to a real Holochain conductor"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
async-trait = "0.1"

# Logging
tracing = "0.1"

# NOTE: holochain_client is NOT a dependency here because it pins serde to
# 1.0.203, conflicting with the workspace. Instead, this crate provides a
# trait-based `ConductorTransport` that the user implements with their own
# holochain_client binary/crate outside this workspace.
