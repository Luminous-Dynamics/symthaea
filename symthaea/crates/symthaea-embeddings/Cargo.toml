[package]
name = "symthaea-embeddings"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Semantic embeddings bridge — Qwen3 text encoding and Johnson-Lindenstrauss projection to HDC space"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["embeddings", "HDC", "projection", "qwen3", "semantic"]
categories = ["science", "algorithms"]

[dependencies]
anyhow = "1"
lru = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"
serde = { workspace = true }
symthaea-core = { path = "../../symthaea-core" }

# Burn ML framework (optional — enabled via `burn` feature)
burn = { version = "0.18", default-features = false, optional = true }
safetensors = { version = "0.4", optional = true }
tokenizers = { version = "0.21", optional = true }
tracing = { version = "0.1", optional = true }
half = { version = "2.4", optional = true }
hf-hub = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }
memmap2 = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }

# Async support (optional — enabled via `async-embed` feature)
tokio = { workspace = true, optional = true }

# Parallel batch projection (optional — enabled via `parallel` feature)
rayon = { workspace = true, optional = true }

# Persistent cache (optional — enabled via `persistent-cache` feature)
redb = { version = "2.4", optional = true }
blake3 = { workspace = true, optional = true }
dirs = { version = "5.0", optional = true }

# ONNX runtime backend (optional — enabled via `ort-embed` feature)
ort = { version = "2.0.0-rc.10", features = ["half", "load-dynamic", "ndarray"], optional = true }
ndarray = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.5"

[features]
default = []
burn = ["dep:burn", "dep:safetensors", "dep:tokenizers", "dep:tracing", "dep:half", "dep:serde_json", "dep:memmap2", "dep:sha2", "burn/ndarray"]
burn-wgpu = ["burn", "burn/wgpu"]
burn-hub = ["burn", "dep:hf-hub"]
async-embed = ["dep:tokio"]
parallel = ["dep:rayon"]
persistent-cache = ["dep:redb", "dep:blake3", "dep:dirs", "dep:half"]
embed-channel = []
ort-embed = ["dep:ort", "dep:tokenizers"]

[[bench]]
name = "embedding_bench"
harness = false
