[package]
name = "symthaea-nix"
version = "0.1.0"
edition = "2021"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Symthaea NixOS: A conscious mind for NixOS system management via HDC and active inference"
license = "MIT"

[lib]
name = "symthaea_nix"
path = "src/lib.rs"

[[bin]]
name = "nix-mind"
path = "src/bin/nix_mind.rs"
required-features = ["cli"]

[[bin]]
name = "nix-mind-tui"
path = "src/bin/nix_mind_tui.rs"
required-features = ["tui"]

[[bin]]
name = "nix-mind-daemon"
path = "src/bin/nix_mind_daemon.rs"
required-features = ["daemon"]

[dependencies]
symthaea-core = { path = "../../symthaea-core" }
tree-sitter = { workspace = true }
tree-sitter-nix = { workspace = true }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
strsim = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
lru = { workspace = true }
dashmap = { workspace = true }
nix = "0.27"
rusqlite = { workspace = true }

# CLI (optional)
clap = { workspace = true, optional = true }
clap_complete = { version = "4.4", optional = true }

# TUI (optional)
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.30", optional = true }

# Systemd (optional)
zbus = { version = "4.0", optional = true }
libsystemd = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "hdc_benchmarks"
harness = false

[features]
default = []
cli = ["clap", "clap_complete"]
tui = ["crossterm", "ratatui", "cli"]
daemon = ["tokio/full"]
systemd = ["zbus", "libsystemd"]
full = ["cli", "tui", "daemon", "systemd"]
