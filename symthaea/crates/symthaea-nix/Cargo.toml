[package]
name = "symthaea-nix"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Symthaea NixOS: A conscious mind for NixOS system management via HDC and active inference"
license = "AGPL-3.0-or-later"

[lib]
name = "symthaea_nix"
path = "src/lib.rs"

[[bin]]
name = "nix-mind"
path = "src/bin/nix_mind.rs"
required-features = ["cli"]

[[bin]]
name = "nix-mind-tui"
path = "src/bin/nix_mind_tui.rs"
required-features = ["tui"]

[[bin]]
name = "nix-mind-daemon"
path = "src/bin/nix_mind_daemon.rs"
required-features = ["daemon"]

[dependencies]
symthaea-core = { path = "../../symthaea-core" }
# Native-only (C FFI, async)
tree-sitter = { workspace = true, optional = true }
tree-sitter-nix = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# WASM-safe
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
strsim = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
lru = { workspace = true }
dashmap = { workspace = true }
nix = { version = "0.27", optional = true }
rusqlite = { workspace = true, optional = true }
rnix = "0.11"

# CLI (optional)
clap = { workspace = true, optional = true }
clap_complete = { version = "4.4", optional = true }

# TUI (optional)
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.30", optional = true }

# Systemd (optional)
zbus = { version = "4.0", optional = true }
libsystemd = { version = "0.7", optional = true }

# Observability (optional)
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true, default-features = false }
hyper = { version = "1.0", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "hdc_benchmarks"
harness = false

[features]
default = ["native"]
# Native: includes parser (tree-sitter), filesystem ops, async (tokio), SQLite
native = ["nix", "rusqlite", "tree-sitter", "tree-sitter-nix", "tokio"]
# WASM-safe subset: sovereign_config, sovereign_conversation, app_database, encoding, mind
# Use: symthaea-nix = { default-features = false }
cli = ["clap", "clap_complete", "native"]
tui = ["crossterm", "ratatui", "cli"]
daemon = ["tokio/full", "native"]
systemd = ["zbus", "libsystemd", "native"]
observability = ["tracing-subscriber", "metrics", "metrics-exporter-prometheus", "hyper", "hyper-util", "http-body-util", "daemon"]
full = ["cli", "tui", "daemon", "systemd"]
