[package]
name = "symthaea-perception"
version = "0.1.0"
edition = "2021"

[dependencies]
symthaea-math = { path = "../symthaea-math" }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
rand = "0.8"  # For JL projection random matrices
syn = { version = "2.0", features = ["full", "visit"] }  # For Rust code parsing
ignore = "0.4"  # For gitignore-aware file walking
# Optional heavy dependencies
ort = { version = "2.0.0-rc.10", features = ["half", "load-dynamic", "ndarray"], optional = true }
tokenizers = { version = "0.21", optional = true }
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["rustls-tls", "ureq"] }  # HuggingFace model downloading (rustls to avoid OpenSSL)
image = "0.24"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"

[features]
default = []
embeddings = ["tokenizers", "ort", "hf-hub"]
vision = ["ort", "hf-hub"]
