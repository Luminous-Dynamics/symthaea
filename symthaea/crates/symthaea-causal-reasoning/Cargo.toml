[package]
name = "symthaea-causal-reasoning"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Causal reasoning — Pearl's do-calculus, counterfactual reasoning, and causal emergence detection"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["causality", "do-calculus", "counterfactual", "causal-emergence", "neuroscience"]
categories = ["science", "algorithms"]

[dependencies]
serde = { workspace = true }
symthaea-core = { path = "../../symthaea-core" }

[dev-dependencies]
proptest = "1.4"

[features]
default = ["counterfactual"]
counterfactual = []
