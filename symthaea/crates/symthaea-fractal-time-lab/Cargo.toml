[package]
name = "symthaea-fractal-time-lab"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Experimental benchmark lab for scale-recursive spectra, temporal symmetry breaking, and multi-scale integration."

[dependencies]
symthaea-core = { path = "../core/symthaea-core" }
clap = { version = "4", features = ["derive"] }
nalgebra = "0.33"
petgraph = "0.6"
rand = "0.8"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
