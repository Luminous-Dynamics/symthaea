[package]
name = "symthaea-manipulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "HDC-LTC + FEP Active Inference industrial manipulator arm with moral algebra gating"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"

[dependencies]
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-swarm = { path = "../symthaea-swarm" }
symthaea-fep = { path = "../../core/symthaea-fep" }
symthaea-hal = { path = "../symthaea-hal", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
symtropy-physics = { path = "../../../../symtropy/crates/symtropy-physics" }
symtropy-robotics-bridge-core = { path = "../../../../symtropy/crates/symtropy-robotics-bridge-core" }

[dev-dependencies]
serde_json = { workspace = true }
proptest = "1"


[dependencies.symtropy-math]
path = "../../../../symtropy/crates/symtropy-math"
optional = true

[dependencies.nalgebra]
version = "0.34"
optional = true

[features]
default = []
symtropy = ["dep:symtropy-math", "dep:nalgebra"]
