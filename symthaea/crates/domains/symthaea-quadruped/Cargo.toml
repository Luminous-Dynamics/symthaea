[package]
name = "symthaea-quadruped"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
symthaea-core = { path = "../../core/symthaea-core" }
symthaea-fep = { path = "../../core/symthaea-fep" }
serde = { workspace = true }
rand = { workspace = true }
proptest = "1"

[dependencies.symtropy-physics]
path = "../../../../symtropy/crates/core/symtropy-physics"
optional = true

[dependencies.symtropy-math]
path = "../../../../symtropy/crates/core/symtropy-math"
optional = true

[dependencies.nalgebra]
version = "0.34"
optional = true

[features]
default = []
symtropy = ["dep:symtropy-physics", "dep:symtropy-math", "dep:nalgebra"]