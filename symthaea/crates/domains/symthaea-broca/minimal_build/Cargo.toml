[workspace]

[package]
name = "symthaea-broca-distill"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
# Assuming we can reference the local src as a library
[lib]
path = "../src/lib.rs"

[[bin]]
name = "distill_nix_train"
path = "distill_nix_train.rs"
