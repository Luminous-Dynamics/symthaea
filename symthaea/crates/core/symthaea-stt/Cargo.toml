[package]
name = "symthaea-stt"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Symthaea Speech-to-Text: HDC + LTC + CfC based acoustic modeling and bioacoustics"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea-hlb"
keywords = ["speech", "hdc", "ltc", "neuromorphic", "bioacoustics", "eeg"]
categories = ["multimedia::audio", "science", "algorithms"]

[lib]
name = "symthaea_stt"
path = "src/lib.rs"

# Binaries
[[bin]]
name = "stt-train"
path = "src/bin/symthaea_train.rs"

[[bin]]
name = "stt-discover"
path = "src/bin/symthaea_discover.rs"

[[bin]]
name = "stt-transcribe"
path = "src/bin/symthaea_transcribe.rs"

[[bin]]
name = "stt-librispeech"
path = "src/bin/symthaea_librispeech.rs"

[[bin]]
name = "stt-bioacoustics"
path = "src/bin/symthaea_bioacoustics.rs"

[[bin]]
name = "stt-viz"
path = "src/bin/symthaea_viz.rs"

[[bin]]
name = "stt-eval"
path = "src/bin/symthaea_eval.rs"

[[bin]]
name = "stt-mirror"
path = "src/bin/symthaea_mirror.rs"

[[bin]]
name = "stt-grammar"
path = "src/bin/grammar_cli.rs"

[[bin]]
name = "refine-prototypes"
path = "src/bin/refine_prototypes.rs"

[[bin]]
name = "train-dtw"
path = "src/bin/train_dtw.rs"

[[bin]]
name = "train-aligned"
path = "src/bin/train_aligned.rs"

[[bin]]
name = "train-reservoir"
path = "src/bin/train_reservoir.rs"

[[bin]]
name = "eval-reservoir"
path = "src/bin/eval_reservoir.rs"

[[bin]]
name = "train-direct"
path = "src/bin/train_direct.rs"

[[bin]]
name = "eval-direct"
path = "src/bin/eval_direct.rs"

[[bin]]
name = "train-crystal"
path = "src/bin/train_crystal.rs"

[[bin]]
name = "eval-crystal"
path = "src/bin/eval_crystal.rs"

[[bin]]
name = "train-rls"
path = "src/bin/train_rls.rs"

[[bin]]
name = "train-ltc-supervised"
path = "src/bin/train_ltc_supervised.rs"

[dependencies]
# Symthaea core — HdcLtcUnifiedNeuron, ContinuousHV, GenesisSeed
symthaea-core = { path = "../symthaea-core", default-features = false }

# Core hashing
blake3 = { workspace = true }

# CLI
clap = { workspace = true }

# Progress bars
indicatif = "0.17"
console = "0.15"

# Audio processing
hound = { workspace = true }
rustfft = { workspace = true }
claxon = "0.4"          # FLAC reading

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
bincode = { workspace = true }

# Parquet for loading alignment data
parquet = "54.0"
arrow = { version = "54.0", features = ["prettyprint"] }

# Random number generation (for HDC)
rand = { workspace = true }

# Cache-tiled matrix multiply (AVX2 dgemm for batch accumulator)
matrixmultiply = "0.3"

# GPU-accelerated training via candle (CUDA auto-detection)
candle-core = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"

[features]
default = []
# GPU-accelerated LTC training via candle CUDA tensors
gpu = ["candle-core/cuda"]

[[bench]]
name = "core_benchmarks"
harness = false
