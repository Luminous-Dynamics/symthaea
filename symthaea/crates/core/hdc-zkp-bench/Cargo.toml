[package]
name = "hdc-zkp-bench"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Benchmark: HDC XOR binding proof across Binius, Winterfell, and RISC0 backends"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]

[[bin]]
name = "hdc-zkp-bench"
path = "src/main.rs"

[dependencies]
# Binius64 (binary field STARKs — XOR is native field addition)
binius-core = { path = "../../../../.deps/binius64/crates/core" }
binius-frontend = { path = "../../../../.deps/binius64/crates/frontend" }
binius-prover = { path = "../../../../.deps/binius64/crates/prover" }
binius-verifier = { path = "../../../../.deps/binius64/crates/verifier" }
binius-transcript = { path = "../../../../.deps/binius64/crates/transcript" }
binius-hash = { path = "../../../../.deps/binius64/crates/hash" }

# Winterfell (prime field STARKs — XOR requires bit decomposition)
winterfell = "0.13.1"
winter-math = "0.13.1"
winter-crypto = "0.13.1"

# Common
rand = "0.9"
sha2 = "0.10"
serde_json = "1.0"
