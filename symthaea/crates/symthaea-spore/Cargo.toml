[package]
name = "symthaea-spore"
version = "0.1.0"
edition = "2021"
description = "Symthaea Spore: WASM consciousness kernel (~500KB) for browser, edge, and embedded"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
symthaea-core = { path = "../../symthaea-core", default-features = false }
symthaea-consciousness-equation = { path = "../symthaea-consciousness-equation" }
symthaea-neuromodulators = { path = "../symthaea-neuromodulators" }
symthaea-types = { path = "../symthaea-types" }
symthaea-harmonies = { path = "../symthaea-harmonies" }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { version = "2", optional = true, default-features = false, features = ["rand_core"] }
hex = { version = "0.4", optional = true }

# WASM bindings (optional — rlib builds skip this)
wasm-bindgen = { version = "=0.2.108", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# WASM support — getrandom needs "js"/"wasm_js" and uuid needs "rng-getrandom" on wasm32
# getrandom 0.2 (used by rand 0.8/symthaea-core) uses feature "js"
# getrandom 0.4 (used by uuid via rand 0.10) uses feature "wasm_js"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.6", features = ["rng-getrandom"] }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook"]
# Native mobile FFI: C-compatible extern functions for iOS (staticlib) and Android (cdylib/JNI).
# Produces symthaea_spore.h via cbindgen for Swift/Kotlin consumption.
native-ffi = []
# Ed25519 mobile pairing for Spore-to-Spore trust establishment.
# Without this feature, BLAKE3 keyed MAC is used as symmetric fallback.
pairing = ["dep:ed25519-dalek", "dep:hex"]
