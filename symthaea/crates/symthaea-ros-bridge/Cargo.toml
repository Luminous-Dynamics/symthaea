[package]
name = "symthaea-ros-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "ROS2 bridge for Symthaea: publishes consciousness telemetry and consumes sensor/proprioception data"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
keywords = ["ros2", "robotics", "consciousness", "telemetry"]
categories = ["science", "simulation"]

[dependencies]
symthaea-core = { path = "../../symthaea-core" }
symthaea-humanoid = { path = "../symthaea-humanoid" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# Note: rclrs and other ROS2 crates require a ROS2 environment (Humble/Iron/Jazzy)
# and are typically added via nix-ros-overlay or system-level colcon builds.
rclrs = { version = "0.4", optional = true }

[features]
default = []
ros2 = []
