[workspace]
members = ["symthaea-core"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Tristan Stoltz / Luminous Dynamics"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
rand = "0.8"
sha3 = "0.10"
blake3 = "1"
rayon = "1"
ordered-float = "4"
num-complex = "0.4"
parking_lot = "0.12"
bumpalo = "3"
chrono = { version = "0.4", features = ["serde"] }
rand_distr = "0.4"
bincode = "1.3"
libc = "0.2"
faer = "0.19"
wgpu = "0.20"
ndarray = "0.15"
once_cell = "1"
nalgebra = "0.32"
uuid = { version = "1", features = ["v4", "serde"] }

[package]
name = "symthaea"
version = "0.5.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
symthaea-core = { path = "symthaea-core" }
