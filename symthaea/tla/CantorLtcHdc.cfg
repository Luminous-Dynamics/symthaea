\* TLC Model Checker Configuration for CantorLtcHdc
\* Phase 1: Bounded Model Validation (Depth 4, Finite State Space)
\*
\* Run with: tlc CantorLtcHdc_MC.tla -config CantorLtcHdc.cfg -workers auto
\*
\* Expected: All 7 safety invariants hold, no deadlocks
\* Target: Complete state exploration in < 10 minutes

\* ============================================================================
\* SPECIFICATION
\* ============================================================================

SPECIFICATION Spec

\* ============================================================================
\* CONSTANTS (Model Values for Finite Checking)
\* ============================================================================

\* HDC Dimension - reduced for tractable checking
\* Production: 16,384 | Model: 4 (symbolic, not actual vector ops)
CONSTANT HdcDim = 4

\* Hierarchy Depths
\* Fixed core: levels 0-3 (15 nodes total)
CONSTANT MaxFixedDepth = 3

\* Elastic periphery: levels 4-5 (up to 48 additional nodes)
CONSTANT MaxElasticDepth = 5

\* Cantor scaling ratio (1/3)
CONSTANT CantorRatio = 1

\* Base time constant (normalized to 1.0 for model checking)
CONSTANT BaseTau = 1

\* Integration timestep (normalized)
CONSTANT DeltaT = 1

\* State magnitude bound
CONSTANT MaxBound = 100

\* Lateral binding similarity threshold
CONSTANT LateralThreshold = 1

\* Budding threshold (high Φ triggers growth)
CONSTANT BuddingThreshold = 1

\* Pruning threshold (low Φ triggers removal)
CONSTANT PruningPhiThreshold = 1

\* ============================================================================
\* INVARIANTS (7 Safety Properties)
\* ============================================================================

\* S1: All states remain bounded
INVARIANT StateBoundedness

\* S2: τ decreases with depth (Cantor scaling preserved)
INVARIANT HierarchicalOrdering

\* S3: Fixed core nodes (levels 0-3) are never removed
INVARIANT FixedCoreIntegrity

\* S4: Lateral links are symmetric (bidirectional)
INVARIANT LateralSymmetry

\* S5: Children exist only if nodes are active
INVARIANT ParentChildConsistency

\* S6: Elastic nodes only in periphery (level > MaxFixedDepth)
INVARIANT ElasticContainment

\* S7: Φ values remain in [0, 1]
INVARIANT PhiBoundedness

\* Combined safety invariant
INVARIANT Safety

\* ============================================================================
\* PROPERTIES (Liveness - use with -liveness flag)
\* ============================================================================

\* L1: System eventually stabilizes
PROPERTY EventualStability

\* L2: Similar nodes eventually form lateral bindings
PROPERTY EventualLateralBinding

\* L3: High-activity nodes eventually bud
PROPERTY EventualBudding

\* L4: Low-activity leaves eventually pruned
PROPERTY EventualPruning

\* ============================================================================
\* SYMMETRY & STATE CONSTRAINTS (Performance Optimization)
\* ============================================================================

\* Limit state space exploration depth
\* ACTION_CONSTRAINT time < 20

\* Type correctness constraint
\* TYPE_CONSTRAINT TypeOK

\* ============================================================================
\* CHECKING OPTIONS
\* ============================================================================

\* Check for deadlocks (no enabled actions)
CHECK_DEADLOCK TRUE

\* ============================================================================
\* NOTES
\* ============================================================================
\*
\* Phase 1 Goals:
\* - Verify no action can violate FixedCoreIntegrity
\* - Verify StateBoundedness holds under all transitions
\* - Verify lateral binding symmetry is maintained
\* - Detect any deadlock conditions
\*
\* Expected State Space (Depth 4):
\* - Fixed nodes: 2^4 - 1 = 15
\* - Elastic nodes: up to 2^5 + 2^6 = 48
\* - Total: ~63 nodes max
\* - States: O(2^63) theoretical, but constrained by type invariants
\*
\* Performance Tuning:
\* - Use -workers auto for parallel checking
\* - Add ACTION_CONSTRAINT if state space explodes
\* - Consider symmetry reduction for HyperVector
\*
