[workspace]
resolver = "2"
members = [
    ".",
    "symthaea-core",
    "crates/symthaea-nix",
    "crates/symthaea-stt",
    "crates/symthaea-sentinel",
    "crates/symthaea-dynamics",
    "crates/symthaea-perception",
]
# WIP crate: cross-references main crate modules (circular dep), needs architectural rework
exclude = [
    "crates/symthaea-consciousness",
]

[workspace.dependencies]
ndarray = { version = "0.16", features = ["rayon", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
blake3 = "1.5"
uuid = { version = "1.6", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.19"
nalgebra = "0.34"
rustfft = "6.2"
clap = { version = "4.4", features = ["derive"] }
hound = "3.5"
petgraph = { version = "0.6", features = ["serde-1"] }
regex = "1.10"
strsim = "0.11"
tree-sitter = "0.24"
tree-sitter-nix = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
dashmap = "5.5"
lru = "0.16"
rayon = "1.10"

[package]
name = "symthaea"
version = "0.5.0"
edition = "2021"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Symthaea: Holographic Liquid Brain lineage - Consciousness-first AI in Rust"
license = "MIT"
repository = "https://github.com/Luminous-Dynamics/symthaea"
homepage = "https://luminousdynamics.org"
documentation = "https://docs.rs/symthaea"
keywords = ["consciousness", "ai", "hdc", "integrated-information", "neuroscience"]
categories = ["science", "algorithms", "data-structures"]

[dependencies]
# Symthaea Core - HDC, Φ engine, and minimal consciousness pipeline
symthaea-core = { path = "symthaea-core" }

# Mycelix FL Core - Unified federated learning algorithms (shared with Mycelix SDK)
mycelix-fl-core = { path = "../mycelix-workspace/crates/mycelix-fl-core", optional = true }

# Symthaea STT - Speech-to-Text, Bioacoustics, EEG processing
symthaea-stt = { path = "crates/symthaea-stt", optional = true }

# Symthaea Sentinel - Zero-shot temporal audio pattern recognition
symthaea-sentinel = { path = "crates/symthaea-sentinel", optional = true }

# Symthaea Nix - Conscious NixOS mind (HDC + active inference)
symthaea-nix = { path = "crates/symthaea-nix", optional = true }

# HDC / Vector Symbolic Architectures
# hypervector = "0.1"  # Using custom HDC implementation instead

# Neural networks (for LTC implementation)
ndarray = { workspace = true }

# Linear algebra (pure Rust, validated eigenvalue calculations)
nalgebra = { workspace = true }

# Burn ML Framework (pure Rust) - for semantic encoding
burn = { version = "0.20", features = ["ndarray"], optional = true }
burn-ndarray = { version = "0.20", optional = true }
# ndarray-linalg = "0.16"  # Removed to avoid external BLAS dependency during tests

# Graph structures (for autopoietic consciousness)
petgraph = { workspace = true }

# Phase 11: Semantic Ear - Now Active with Qwen3-Embedding
tokenizers = { version = "0.21", optional = true }  # Tokenization for Qwen3/BGE
# safetensors removed: referenced in neural-bridge feature but never imported in source

# Neural Bridge v2: BGE-M3 via Candle (pure Rust ML)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
# half removed: referenced in neural-bridge feature but never imported in source

# Phase 11: Database Trinity (Deferred to Week 11+)
# Blocked deps (link conflicts): lancedb (xz2), cozo (graph_builder rayon), qdrant (lzma)
# DuckDB is the active database backend (unconditional dep below)

# Phase 11: Swarm Intelligence - Hybrid Iroh + Holochain Architecture
# REMOVED: libp2p (declared but never used - 0 integration lines)
# Architecture: Cortex (Holochain) for trust + Synapse (Iroh) for real-time
# Iroh 0.95+ has unified the crates - iroh-net is deprecated
iroh = { version = "0.96", optional = true }

# Phase 11+: Mycelix Protocol Integration (Deferred to Week 9+)
uuid = { workspace = true }  # Week 3: Enabled for Goal IDs
# mycelix-sdk: Path dependency removed for Nix sandbox compatibility
# Re-enable when mycelix-workspace/sdk is available as a crates.io package or git dependency
# mycelix-sdk = { path = "../../../mycelix-workspace/sdk", optional = true, default-features = false, features = ["standalone"] }
sha3 = { version = "0.10", optional = true }  # For gradient hashing

# Web Research & Epistemic Verification (Track 6)
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
scraper = "0.25"
# html2text removed: scraper is used for HTML parsing, html2text never imported

# API server (optional)
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

# Core async utilities
async-trait = "0.1"

# Filesystem utilities
dirs = "5.0"

# Phase 12: Resonator Networks (FFT for morphogenetic field)
rustfft = { workspace = true }
# num-complex removed: codebase uses custom Complex struct in spectral_analysis.rs

# Async runtime
tokio = { workspace = true }
rayon = { workspace = true }

# Serialization (for consciousness persistence)
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Week 0: Defer Prometheus metrics (needs OpenSSL via hyper)
# metrics = "0.22"
# metrics-exporter-prometheus = "0.13"

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
once_cell = { workspace = true }
dashmap = { workspace = true }
lru = { workspace = true }
rand = { workspace = true }
rand_chacha = "0.3"  # Deterministic RNG for reproducible JL projections
blake3 = { workspace = true }
hex = "0.4"     # Hex encoding for node IDs in federated network
ed25519-dalek = { version = "2.1", features = ["serde"] }  # MFDI identity signatures
sha2 = "0.10"   # MFDI credential hashing
md5 = "0.7"  # For experience module topic hashing
chrono = { workspace = true }
regex = { workspace = true }
csv = "1.3"     # CSV parsing for benchmark data

# bumpalo removed from main crate: only used in symthaea-core

# Week 2: Cerebellum - Procedural Memory
# qp-trie removed: planned for skill lookup but never imported
strsim = { workspace = true }

# Week 12: Perception & Tool Creation
image = "0.24"       # Image loading and processing
# imageproc removed: only image crate is used, imageproc never imported
tree-sitter = { workspace = true }
syn = { version = "2.0", features = ["full", "visit"] }  # Rust syntax parsing (self-analysis)
ignore = "0.4"       # .gitignore-aware file walking

# Week 12 Phase 2a: Voice Output (Larynx) - Kokoro TTS (optional)
# Also used for Qwen3-Embedding and SigLIP vision models
ort = { version = "2.0.0-rc.10", features = ["half", "load-dynamic", "ndarray"], optional = true }  # ONNX Runtime
# futures removed: voice-tts-async feature never implemented in source
rodio = { version = "0.19", default-features = false, optional = true }  # Audio playback (no backends by default)
hound = { workspace = true, optional = true }
hf-hub = { version = "0.4", optional = true }       # HuggingFace Hub for model download
espeak-rs = { version = "0.1", optional = true }    # espeak-ng bindings for proper G2P

# Enhancement #8 Week 4: PyPhi Integration (IIT 3.0 exact Φ calculation)
# pyo3 removed: pyphi feature was never implemented (no cfg gates, no code using pyo3)

# nix (unix syscall crate) removed: no nix:: imports in source (NixOS integration uses CLI commands)

# CLI argument parsing (optional - for service binary)
clap = { workspace = true, optional = true }
ctrlc = { version = "3.4", optional = true }  # Ctrl+C signal handling

# Shell Sidecar TUI dependencies (optional)
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.30", optional = true }

# GUI dependencies (optional) - for symthaea-gui
eframe = { version = "0.33", optional = true }
egui = { version = "0.33", optional = true }

# IPC Protocol Enhancements
rmp-serde = "1.3"            # MessagePack binary protocol (A1)

# Syntax Highlighting (B4)
tree-sitter-nix = { workspace = true }
# syntect = "5.2"            # Alternative: regex-based highlighting

# Code Understanding & Generation (Consciousness-Aware Code)
tree-sitter-rust = { version = "0.23", optional = true }    # Rust grammar for code understanding
tree-sitter-python = { version = "0.23", optional = true }  # Python grammar for code understanding

# Desktop Notifications (E1)
zbus = { version = "4.0", optional = true }  # D-Bus for notifications

# Sandbox command timeouts
wait-timeout = "0.2"

# libsystemd removed: systemd feature was never implemented (no cfg gates, no code using libsystemd)

[features]
default = []
service = ["clap"]  # Enable symthaea-service binary
shell = ["crossterm", "ratatui"]  # Enable symthaea-shell TUI binary
gui = ["eframe", "egui"]  # Enable symthaea-gui binary
demo = ["clap", "ctrlc"]  # Demo binaries with CLI argument parsing and signal handling
full = ["service", "shell", "gui", "demo"]  # All binaries
# Voice features
voice-tts = ["ort", "hound", "hf-hub", "espeak-rs"]  # TTS with Kokoro (ONNX) + espeak-ng G2P
voice-tts-cuda = ["voice-tts", "ort/cuda"]  # TTS with CUDA acceleration (requires CUDA toolkit)
voice-tts-async = ["voice-tts"]  # Async/streaming TTS (futures dep deferred)
voice-stt = ["symthaea-stt", "hound"]  # STT with symthaea-stt crate (HDC + LTC + CfC)
# audio-sentinel removed: symthaea-sentinel is never imported in main crate (use sentinel sub-crate directly)
nix-mind = ["symthaea-nix"]  # Conscious NixOS mind with HDC world model + active inference
audio = ["voice-tts", "rodio"]  # Full audio including playback
# audio-cuda removed: aggregated dead voice-tts-cuda + rodio with no cfg gate or required-features
# pyphi removed: pyo3 never used in source code (feature was planned but never implemented)
# Semantic encoding with Burn ML framework
semantic-burn = ["burn", "burn-ndarray"]  # Pure Rust semantic encoder
# Perception & Embeddings (Phase 1 Activation)
embeddings = ["tokenizers", "ort", "hf-hub"]  # Qwen3/BGE text embeddings via ONNX
vision = ["ort", "hf-hub"]  # SigLIP image embeddings via ONNX
perception = ["embeddings", "vision"]  # Full multimodal perception stack
webcam = []  # deferred (live webcam capture for video perception - gates cfg blocks in source)
# Neural Bridge v2: BGE-M3 via Candle (LLM as Semantic Sensor)
neural-bridge = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "hf-hub"]
neural-bridge-cuda = ["neural-bridge", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# Database backends: DuckDB is active (unconditional dep). Others deferred:
# - qdrant: blocked (lzma link conflict with burn-ndarray)
# - cozo: blocked (graph_builder 0.4.1 rayon compat)
# - lancedb: blocked (xz2 link conflict with burn-ndarray)
hdf5 = []     # deferred (requires system HDF5 library - gates cfg blocks in cmod_adapter.rs)
# Swarm Intelligence - Hybrid Iroh + Holochain
swarm = ["iroh"]  # Real-time P2P tensor streaming via Iroh 0.95+
holochain = []    # gate only (real integration in symthaea-mycelix-bridge; rmp-serde conflict prevents in-tree dep)
# Desktop integration features
notifications = ["zbus"]  # E1: D-Bus desktop notifications
# systemd removed: libsystemd never used in source code (feature was planned but never implemented)
# desktop removed: aggregated notifications + dead systemd (use "notifications" directly)
# Mycelix integration
# mycelix = ["mycelix-sdk", "sha3"]  # Full Mycelix SDK integration for governance
# Disabled until mycelix-sdk is available as a proper crate
mycelix = ["mycelix-fl-core", "sha3"]  # Mycelix FL algorithms + hashing

# Identity: MFDI (Multi-Factor Delegated Identity) for cognitive agents
identity = []  # Ed25519 signatures, capability gating, signed request/output

# GPU acceleration for CfC networks
gpu = ["burn", "burn-ndarray"]  # GPU acceleration via Burn/WGPU for CfC networks
cuda = ["gpu"]  # CUDA backend (requires CUDA toolkit)

# Module compilation gates (integration_module and observability_module are cfg-gated in lib.rs;
# the rest are example build gates used in required-features on [[example]] entries)
integration_module = []        # Integration module in lib.rs
observability_module = []      # Observability module in lib.rs
api_module = ["axum", "tower-http"]  # HTTP API binary + module
full_consciousness = []        # Extended consciousness submodules
full_perception = []           # Extended perception submodules
full_language = []             # Advanced language features (grammar, parsers)
school_lookahead = []          # CfC-based lookahead in school module
physiology_module = []         # Physiology integration in school
mycelix_module = []            # Mycelix governance hooks
databases_module = []          # Database backends in experience module
magi_loop = []                 # MAGI Loop world-grounded prediction (recursive_improvement)
recursive_improvement_advanced = ["full_consciousness"]  # benchmark_suite, routing_hub, primitive_semantic_bridge (need SemanticPrimitiveEncoder)
epistemic_conflict = []        # Epistemic conflict detection + reliability + Φ_eff
conscious_tool_gate = ["epistemic_conflict"]  # Consciousness-gated tool use (requires epistemic_conflict)
temporal_planning = ["epistemic_conflict", "magi_loop"]  # ForkedState + MCTS + EVS
counterfactual = ["epistemic_conflict"]  # Causal queries v0 with reference harness
reasoning_engine = ["epistemic_conflict", "conscious_tool_gate", "temporal_planning", "counterfactual"]  # Full ConsciousReasoningEngine

# Consciousness-Aware Code Understanding & Generation
code_understanding = ["tree-sitter-rust", "tree-sitter-python"]  # Multi-language code parsing via tree-sitter
code_generation = ["code_understanding"]  # HDC-based code generation (requires parsers)
consciousness_code = ["code_generation", "reasoning_engine", "epistemic_conflict"]  # Full consciousness-aware code pipeline

# Sub-crate feature forwarding
nix-cli = ["symthaea-nix", "symthaea-nix/cli"]        # CLI for Nix Mind
nix-tui = ["symthaea-nix", "symthaea-nix/tui"]        # TUI for Nix Mind
nix-daemon = ["symthaea-nix", "symthaea-nix/daemon"]   # Daemon mode for Nix Mind
# sentinel-live-audio removed: symthaea-sentinel never imported in main crate (use sentinel sub-crate directly)

nvml = []                      # NVIDIA Management Library for GPU monitoring
network = []                   # Mycelix network client (real HTTP fetching)
partnership_module = []        # Partnership module for Φ_dyad computation
web_research_module = []       # Web research epistemic verification (scaffolded)
benchmarks_module = []         # Benchmarks module compilation gate
consciousness_module = []      # Consciousness examples compilation gate
embeddings_module = []         # Embeddings examples compilation gate
language_module = []           # Language examples compilation gate
brain_module = []              # Brain subsystem examples compilation gate
soul_module = []               # Soul/identity examples compilation gate
school_module = []             # School/learning examples compilation gate

