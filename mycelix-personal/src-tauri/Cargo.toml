[package]
name = "mycelix-desktop"
version = "0.1.0"
description = "Mycelix Desktop - P2P Consciousness Network"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/mycelix-desktop"
edition = "2021"
rust-version = "1.70"

[workspace]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0.203", features = ["derive"] }
tauri = { version = "2.0", features = ["event"] }
tauri-plugin-shell = "2.0"
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
blake3 = "1.5"
hex = "0.4"
log = "0.4"
mdns-sd = "0.11"
yubikey = { version = "0.7", optional = true }
p256 = { version = "0.13", features = ["ecdsa"] }
feldman-dkg = { path = "../../mycelix-core/libs/feldman-dkg" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
