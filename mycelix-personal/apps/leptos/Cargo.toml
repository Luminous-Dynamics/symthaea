[package]
name = "mycelix-personal-leptos"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Personal — Leptos CSR frontend for the Mycelix sovereign vault"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Window", "HtmlInputElement", "HtmlTextAreaElement"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

mycelix-leptos-core = { path = "../../../crates/mycelix-leptos-core" }
mycelix-leptos-client = { path = "../../../crates/mycelix-leptos-client", features = ["browser"] }
personal-leptos-types = { path = "../../crates/personal-leptos-types" }

[workspace]
