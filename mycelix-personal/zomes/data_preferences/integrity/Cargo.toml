[package]
name = "data_preferences_integrity"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Integrity zome for per-user data sharing preferences"

[dependencies]
hdi = "=0.7.0"
serde = { version = "1", features = ["derive"] }
holochain_serialized_bytes = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
