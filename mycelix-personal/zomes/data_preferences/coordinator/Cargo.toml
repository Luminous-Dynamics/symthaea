[package]
name = "data_preferences"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Coordinator zome for per-user data sharing preferences"

[dependencies]
hdk = "=0.6.0"
serde = { version = "1", features = ["derive"] }
data_preferences_integrity = { path = "../integrity" }
personal-leptos-types = { workspace = true }
getrandom = { workspace = true, features = ["custom"] }

[lib]
crate-type = ["cdylib", "rlib"]
name = "data_preferences"
